<script>
const STATE = {"digest":{"date":"Thursday, October 29, 2026","generatedAt":"Thu, Oct 29, 9:07 AM PDT","breaking":{"headline":"US Tells Gulf Allies to Prepare for Possible Short War With Iran After Midterms","body":"The Wall Street Journal reports that Washington has quietly warned several Gulf Arab governments to be ready for a short but intense military campaign against Iran that could follow the November 3 U.S. midterm elections. U.S. forces are reportedly repositioning troops away from bases exposed to Iranian retaliation and rushing an additional Patriot battery from Texas to the region to reinforce air defenses. The moves reportedly combine offensive strike assets such as bombers, fighters and naval forces with defensive reinforcements, though President Trump has not yet authorized any attack. The reporting coincides with intensified Gulf anxiety over Iran's nuclear and missile programs and growing tension between Saudi Arabia and Iran-backed Houthi forces.","source":"Wall Street Journal via Times of Israel / Just Security","url":"https://timesofisrael.com/liveblog-october-28-2026"},"tabs":{"defense":{"defense":[{"headline":"Pentagon's FORTRESS Plan Would Force US Bases to Run 90 Days Off-Grid","body":"Internal planning documents reported by Fox News Digital show the Pentagon developing a requirement for every major U.S. installation in the continental United States to sustain essential operations for at least 90 days if cut off from civilian power and supply chains. The initiative, unveiled by Defense Secretary Pete Hegseth in a September 30 'State of the Force' address and formalized through an October 6 memo naming Richard 'Matt' O'Malley as interim program director, envisions portable nuclear reactors, battery microgrids and stockpiled water and fuel. The plan goes beyond the original electricity-independence goal to cover communications and supply resilience amid growing homeland-defense concerns tied to Golden Dome and hemispheric threats.","source":"Fortune","url":"https://fortune.com/2026/10/26/pentagon-fortress-bases-90-days-off-grid-uk-be-ready-stockpile/"},{"headline":"Space Force Accuses Russia of Shadowing US-Linked Satellite","body":"U.S. officials told the United Nations this week that Moscow deliberately maneuvered a Russian military satellite dangerously close to a U.S.-registered satellite believed to support Ukraine, escalating tensions in orbit. Washington vowed to defend American space assets, underscoring how satellite-tailing incidents are becoming a flashpoint in the broader confrontation with Russia. The episode adds to a string of recent U.S. disclosures about offensive and defensive space-control capabilities as both powers compete for dominance in orbital surveillance.","source":"Aerotech News & Review","url":"https://www.aerotechnews.com/blog/2026/10/28/headlines-october-28-2/"},{"headline":"UK Accelerates Defense Spending Timeline, Adds Billions for Ukraine","body":"Chancellor Rachel Reeves's successor John Healey used Britain's Autumn Budget to move up the UK's defense-spending target to 3% of GDP by 2030, while reaffirming the NATO-wide commitment of 3.5% by 2035. London also pledged an additional £10 billion in economic and military support for Ukraine, including urgent winter funding, plus up to £5 billion for defense and dual-use industrial investment and a £2.5 billion turbine-technology partnership with Rolls-Royce. The announcement positions Britain as one of NATO's most forward-leaning members on both alliance burden-sharing and sustained Ukraine support.","source":"CNBC","url":"https://www.cnbc.com/2026/10/28/uk-defense-spending-ukraine-aid.html"}],"acquisitions":[{"headline":"Air Force Revives ARRW Hypersonic Missile With $694 Million Production Deal","body":"The U.S. Air Force disclosed it awarded Lockheed Martin a $694 million contract, executed September 29 and announced October 26, to move the AGM-183A Air-Launched Rapid Response Weapon from testing into full production. The decision reverses a March 2023 move to halt the program and will field the Mach 5-plus boost-glide missile on B-52H bombers, with carriage testing planned on the B-1B Lancer. The FY2027 budget request includes $452 million for ARRW production and $296 million for a follow-on Increment 2 variant, though the broader defense budget remains stalled in Congress under a continuing resolution.","source":"Air & Space Forces Magazine / Army Recognition","url":"https://www.airandspaceforces.com/air-force-launches-arrw-its-first-hypersonic-weapon-into-production/"},{"headline":"Pentagon Picks Poland to Host New Patriot Missile Maintenance Hub","body":"The Pentagon announced it has selected Poland as the site for a new European maintenance, repair and overhaul center supporting Lockheed Martin's PAC-3 Patriot interceptor missiles. Officials said the facility is intended to boost operational readiness across allied air and missile defense forces at a moment when Patriot batteries are in high demand for both Ukraine-related NATO reinforcement and potential Middle East contingencies. The move deepens Poland's role as a logistics and sustainment hub for U.S.-made air defense systems along NATO's eastern flank.","source":"The Hill","url":"https://www.justsecurity.org/162228/early-edition-october-28-2026/"}]},"us":[{"headline":"Q3 GDP Jumps 3.4%, Beating Forecasts Days Before Midterms","body":"The Commerce Department's advance estimate showed the US economy grew at a 3.4% annualized rate in the third quarter, well above the 3.1% consensus forecast and a sharp acceleration from 2.2% in Q2. The surge was driven largely by an AI-fueled investment boom, with business spending up 12.7%, while consumer spending rose 3.8%, its strongest pace since late 2024. The report lands as the final major economic data point before the November 3 midterms and comes a day after the Fed held rates at 3.75%-4% despite September inflation running at 3.6% headline and 3.1% core.","source":"CNBC","url":"https://www.cnbc.com/2026/10/29/pce-inflation-report-september-2026-.html"},{"headline":"Judge Rejects DOJ Bid to Toss 20,000 California Ballots on Eve of Election","body":"US District Judge David Carter denied a Trump administration request for a temporary restraining order that would have forced California to segregate roughly 20,000 mail ballots the Justice Department claims were cast by likely noncitizens, with hundreds of thousands of ballots already processed statewide. Carter ruled DOJ likely lacks standing, found the request would probably violate federal voting laws, and said the eleventh-hour filing stemmed from the department's 'own neglect.' DOJ immediately appealed to the Ninth Circuit, which had already voiced skepticism about the case's merits in an earlier emergency hearing, and officials say they expect the fight to reach the Supreme Court.","source":"Democracy Docket","url":"https://www.democracydocket.com/news-alerts/judge-rejects-doj-demand-that-california-set-aside-20000-ballots/"},{"headline":"Alaska Governor Orders Criminal Probe Into Peltola Over 'Spoiler' Candidate Scheme","body":"Gov. Mike Dunleavy ordered a state investigation into Democratic Senate candidate Mary Peltola's campaign after a New York Times report, citing a dozen sources and internal documents, alleged her team and Democratic Senatorial Campaign Committee aides helped recruit a little-known Republican, Daniel J. Sullivan, to run as a near-namesake spoiler against GOP incumbent Dan Sullivan. Peltola's campaign denies any coordination, calling the report a distraction from the race's substance, while President Trump has demanded she and the spoiler candidate be removed from the ballot and called her actions 'election fraud.' Senate Majority Leader John Thune labeled the alleged scheme 'dirty pool' but stopped short of calling it illegal, leaving the controversy to play out just days before Alaskans vote.","source":"Fox News","url":"https://www.foxnews.com/politics/alaskas-governor-orders-investigation-nyt-report-alleged-dem-linked-senate-election-scheme"},{"headline":"Supreme Court Lets Stand Rollback of Immigration-Judge Deportation Pauses","body":"In a brief, unsigned order issued October 27 with no public dissent, the Supreme Court declined to revive a Biden-era rule that had let immigration judges pause certain deportation proceedings, letting a lower-court rollback of that authority remain in effect while litigation continues. The move came after a federal appeals court refused to stay the underlying ruling, prompting challengers to seek emergency Supreme Court intervention. Immigration advocates and several city governments warn the decision could accelerate removals in pending cases even as the broader legal fight over the regulation continues.","source":"WPXI/AP","url":"https://www.wpxi.com/news/politics/supreme-court-wont/ENKOM4ELFM5YRNB5K5UOWAMVDA/"}],"pacific":{"pacificCommand":[{"headline":"Japan and US to Co-Produce Air-to-Air Missiles","body":"On the sidelines of the ASEAN defense ministers' summit in Cebu, Japanese Defense Minister Shinjiro Koizumi and US Defense Secretary Pete Hegseth agreed on Oct. 28 to set up a Japanese facility for final assembly of advanced medium-range air-to-air missiles. Koizumi also briefed Hegseth on Tokyo's plan to build 'denial defense capabilities' meant to repel any invasion and the two sides pledged more realistic live-fire drills and tighter cyber cooperation following a wave of data breaches inside Japan. The arrangement reflects a broader US push for allies to localize munitions production amid worries about magazine depth in a future Indo-Pacific contingency.","source":"KSAT/Associated Press","url":"https://www.ksat.com/news/world/2026/10/29/us-and-japan-to-establish-a-japanese-facility-for-joint-missile-production/"},{"headline":"North Korea Fires Dozen Short-Range Missiles Amid Regional Diplomacy Blitz","body":"North Korea launched roughly a dozen short-range ballistic missiles toward the East Sea on Oct. 29, timed to a week of heavy regional diplomatic traffic, including the ADMM-Plus summit in Cebu and South Korean Foreign Minister Cho Hyun's departure for Washington. Cho is expected to brief Secretary of State Marco Rubio on Kim Jong Un's recent visit to China, adding a layer of signaling to Pyongyang's test. The salvo continues a pattern of North Korean launches designed to keep Seoul and Washington's attention divided while allied defense chiefs huddle on China-related planning in the Philippines.","source":"Rio Times Online","url":"https://www.riotimesonline.com/asia-intelligence-brief-thursday-october-29-2026/"},{"headline":"Australia Eyes Iron Dome-Style Shield as Marles Warns of China Pressure","body":"Australia is weighing the US Marine Corps' Medium Range Intercept Capability, an Iron Dome derivative branded SkyHunter, alongside Patriot and Aegis options for its roughly A$10 billion LAND 6504 air-defense program, with a decision targeted for 2027 and trials planned around Talisman Sabre 2029. Defense Minister Richard Marles said on Oct. 29 that China's military buildup is generating sustained pressure across Southeast Asia and confirmed Australia has begun coordinating defense policy with the US, Japan and the Philippines through an informal grouping known as the Squad. The twin moves mark Canberra's shift toward layered missile defense and tighter minilateral coordination against Chinese coercion.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/australia-considers-us-variant-of-israels-iron-dome-to-protect-military-bases-from-missile-attacks"}],"pacingThreat":[{"headline":"Beijing Pulls Teachers From Manila in Gray-Zone Pressure Campaign","body":"Radio Free Asia reported on Oct. 28 that China has recalled educators from Philippine classrooms, with Chinese Ambassador Jing Quan putting the number near 180, blending maritime coercion with political warfare. Analysts describe the recall as connective tissue between Beijing's sea-based harassment near Scarborough Shoal and Second Thomas Shoal and a softer-power squeeze meant to punish Manila's continued patrols. The move follows an Oct. 19 Philippine summons of the Chinese ambassador over his remark that Beijing could 'easily win' a war with the Philippines.","source":"Radio Free Asia","url":"https://www.rfa.org/english/southchinasea/2026/10/28/china-teachers-philippines-return-south-china-sea/"},{"headline":"Liaoning's Transit Near the Philippines Signals PLA Chokepoint Ambitions","body":"A joint ISW-AEI China and Taiwan Update dated Oct. 27 found that the carrier Liaoning sailed near the Basilan Strait inside the Philippine archipelago on Oct. 22, part of what analysts assess is an effort to normalize PLA Navy transits through waterways that could help isolate Taiwan in a future conflict. The same report flagged an Oct. 14 amphibious exercise likely rehearsing seizure of a Philippine-held maritime feature, alongside new PLA Eastern Theater Command propaganda urging Taiwan to unify with the mainland. Separately, Chinese state broadcaster CCTV aired footage on Oct. 26 of a no-notice rocket-brigade launch, days after publicizing a DF-26 test capable of reaching Guam, part of a continuing messaging campaign about rapid-response and long-range strike readiness.","source":"Institute for the Study of War / American Enterprise Institute","url":"https://www.aei.org/commentary/china-taiwan-update-october-27-2026/"},{"headline":"US Army Pacific Chief Says 2027 Invasion Timeline Still Guides Planning","body":"Gen. Ronald Clark, commander of US Army Pacific, said on Oct. 28 that the so-called Davidson window, built around assessments that Xi Jinping wants the PLA ready to invade Taiwan by 2027, still shapes his command's planning even though the latest US intelligence assessment states Beijing has no fixed unification timeline. The remarks came as Taiwan pressed ahead with enforcement of 'red-free' supply-chain rules, including an Oct. 12 prosecution of drone maker Jiin Meng Industry for allegedly using banned PRC-made chips and camera lenses in military drones. Together, the comments and the prosecutions underscore parallel US and Taiwanese efforts to harden deterrence and reduce dependence on Chinese components ahead of any contingency.","source":"Stars and Stripes","url":"https://www.stripes.com/branches/army/2026-10-28/ronald-clark-us-army-pacific-taiwan-china-23284410.html"}]},"europe":{"ukraineRussia":[{"headline":"UK Unveils $13.3 Billion Winter Support Package for Ukraine","body":"President Zelensky said Wednesday that Britain will provide more than £10 billion ($13.3 billion) in new financial and military aid, including emergency funding for air defenses ahead of winter. The package splits into roughly £7 billion in economic support spread over three years and about £3 billion in export-finance capacity earmarked mainly for military equipment deliveries. The announcement comes as Kyiv faces an intensifying Russian bombardment of its power grid heading into the cold season.","source":"Kyiv Post","url":"https://www.kyivpost.com/thread/88486"},{"headline":"Russia Pounds Moscow Skies and Dnipro Rail Hub in Escalating Strike War","body":"Ukraine launched one of its largest drone raids of the war on Moscow overnight, with more than 600 drones reportedly approaching the capital and over 100 shot down en route, grounding flights at major airports. Hours earlier, a Russian jet-powered drone hit a train at a Dnipro station, killing at least 13 people, part of a broader pattern that saw Moscow fire 16 ballistic missiles and roughly 280 drones at Kyiv's South Bridge just two days earlier. On the ground, trackers disagree sharply on momentum: DeepState shows a small net Russian territorial gain over the past month while The Economist estimates Ukraine actually recaptured around 38 square miles, underscoring a grinding stalemate even as both sides' long-range strike campaigns intensify.","source":"Kyiv Independent","url":"https://kyivindependent.com/"}],"europe":[{"headline":"Europe's Big Five Defense Ministers Pledge Greater Military Role, Stand by Kyiv","body":"Defense chiefs from the E5 group of major European powers met this week and reaffirmed their alliance with Washington while pledging to take on a larger share of continental defense responsibility. Britain's Wes Streeting warned of a Russian threat not seen since the Cold War's end but stressed Europe seeks no war with Moscow, even as the group announced no new funding or operational commitments for Ukraine. The ministers set their next gathering for Rome in March 2027, signaling the burden-shifting debate with the US will continue well into next year.","source":"France 24","url":"https://www.france24.com/en/europe/20261026-europe-nato-defence-responsibility-us-alliance"},{"headline":"Spain-EU Standoff Over Ceuta Migrants Threatens Schengen Rift","body":"A standoff over the 2026 Ceuta migrant crisis has become the EU's most volatile internal fight, after Brussels ruled that irregular arrivals in Ceuta and Melilla cannot proceed into mainland Europe via Schengen while Madrid's government moved to transfer 500 unaccompanied migrant girls to the mainland in defiance of that policy. Italy's Giorgia Meloni and Denmark's Mette Frederiksen have pushed for Spain's suspension from Schengen cooperation, exposing deep rifts among member states. The clash lands amid a broader demographic reckoning, as the EU's population is projected to peak around 2029 before a long decline, making immigration policy an increasingly fraught balancing act between labor needs and public backlash.","source":"Wikipedia / EU affairs reporting","url":"https://en.wikipedia.org/wiki/2026_Ceuta_migrant_crisis"}]},"middleEast":[{"headline":"Israeli Election Ends in Deadlock as Arab-Led Parties Surge to Record Tally","body":"With nearly all votes counted, Prime Minister Benjamin Netanyahu's bloc has secured about 53 Knesset seats against 48 for the rival bloc led by former military chief Gadi Eisenkot, leaving both camps short of the 61-seat majority threshold. Arab-led parties surged to roughly 19 seats, their strongest showing in Knesset history, positioning them as potential kingmakers in a chamber where Jewish parties have historically refused to rely on their support. Weeks of coalition bargaining are now expected, with Eisenkot facing a difficult choice between crossing that political taboo or accepting continued stalemate.","source":"NPR","url":"https://www.npr.org/2026/10/28/nx-s1-6019423/israel-election-results"},{"headline":"Jordan, Syria Form Joint Security Panel After Deadly Cross-Border Strikes","body":"Jordanian airstrikes against Islamic State positions in southern Syria killed at least seven people, including three children, prompting Damascus to call the strikes a violation of its sovereignty. Amman insists it hit an imminent threat and claims more than 20 militants were killed. The two governments' foreign ministries announced early this week that they will form a joint security committee to review the strikes and their fallout, an effort to prevent the incident from derailing the fragile post-Assad relationship between Jordan and Syria's new government.","source":"Al Jazeera","url":"https://www.aljazeera.com/middle-east/"},{"headline":"Iraqi Premier Makes Landmark Visit to Post-Assad Damascus","body":"Iraqi Prime Minister Ali Faleh al-Zaidi traveled to Damascus this week for a historic meeting with Syrian President Ahmed al-Sharaa, one of the highest-level Baghdad visits since Assad's fall. The two leaders discussed expanding security and trade cooperation, with Sharaa highlighting Syria's potential as a trade corridor linking Iraq's Faw Port to the Mediterranean via Syria's Tartous port. The visit signals a cautious normalization between Baghdad and Damascus's new leadership as both governments look to rebuild regional economic ties."}],"techAI":{"aiCompetition":[{"headline":"OpenAI Reportedly Moves to Buy Google TPUs, Denting Nvidia's Grip","body":"The Information reported on the night of October 27 that OpenAI plans to purchase Google's tensor processing units outright rather than simply renting cloud capacity, a shift from its earlier TPU testing in 2025. No pricing, volume, or delivery timeline has been confirmed, and both companies declined to comment, but the move comes as Amazon, Microsoft and Alphabet collectively eye roughly $600 billion in AI infrastructure spending this year. Nvidia shares barely budged on the news, trading near $218, already about 9% below their early-October peak, as analysts frame the deal as diversification rather than an outright defection from Nvidia's roughly $279 billion supplier commitment pipeline.","source":"24/7 Wall St. / Reuters","url":"https://247wallst.com/investing/2026/10/28/openai-is-buying-googles-ai-chips-a-hit-to-nvidias-biggest-customer-bond/"},{"headline":"Anthropic's IPO Filing Exposes a Looming $100 Billion-Plus Compute Bill","body":"Anthropic's S-1, filed Monday, October 26, shows the company turning cash-flow positive even as it locks in compute contracts that executives warn will push annual infrastructure costs past $100 billion in coming years. The filing lands as investors grow more skeptical of the broader AI buildout, with Anthropic briefly valued above $965 billion in its last private round before the offering, putting it ahead of OpenAI by that metric. The numbers underscore how frontier labs are racing to secure gigawatt-scale compute (Anthropic has deals for roughly 15 gigawatts) well ahead of matching revenue.","source":"9fin","url":"https://9fin.com/insights/anthropic-s-1-revenue-gains-looming-infrastructure-bill"}],"cyberEmerging":[{"headline":"Pro-Iran Hackers Claim Breach of US Servicemember Data, FBI Director's Email","body":"A group calling itself Handala claimed it seized personal information on US servicemembers stationed in the Middle East, including details tied to the F-35 fighter jet program, and separately breached the email account of the FBI director, according to reporting published October 28. The claims surfaced alongside new research warning that Pentagon AI agents coordinating battlefield tasks can leak sensitive data across permission boundaries even while completing their assigned missions successfully. The disclosures add pressure on the Army and NATO as they expand AI-enabled coordination between military and civilian networks.","source":"RealClearDefense","url":"https://www.realcleardefense.com/cyber-warfare/links/the-pentagons-ai-agents-could-complete-the-mission-and-still-leak-secrets-2026-10-28"},{"headline":"Anthropic Escalates Legal Fight Over Pentagon 'Supply Chain Risk' Label","body":"Anthropic is pressing a new court challenge, reported October 28, arguing a federal ruling has stretched a law meant for hostile foreign actors into a weapon that could be used against any government contractor. The company says it was given no chance to contest its designation as a Pentagon supply-chain risk before the label took effect, a fight that began after Anthropic resisted guarantees sought by the Pentagon for unrestricted lethal-autonomous-weapons and surveillance use of its models. The case now intersects with the Trump administration's 'Super Intelligence' push to fast-track AI adoption across the military.","source":"Military.com","url":"https://www.military.com/trumps-super-intelligence-push-hits-a-new-pentagon-ai-fight"}]},"cities":{"lasVegas":[{"headline":"Horowitz Family Pledges $150 Million Toward $1 Billion Southwest Las Vegas Children's Hospital","body":"The Horowitz family announced a record-setting $150 million gift to anchor a planned $1 billion children's hospital in southwest Las Vegas, reported Thursday by Nevada Globe. The donation is described as one of the largest philanthropic gifts in state history and is intended to jumpstart construction of a dedicated pediatric facility for a region that currently sends many complex child cases out of state. Local officials see the project as a major step toward closing a long-standing gap in specialized pediatric care in Southern Nevada.","source":"Nevada Globe","url":"https://thenevadaglobe.com/"},{"headline":"Brightline West High-Speed Rail Hits Funding Delays but Keeps Bipartisan Backing","body":"The Las Vegas-to-Southern-California Brightline West high-speed rail project is facing new funding delays, the Las Vegas Review-Journal reported this week, even as the project retains support from both parties in Congress and Nevada's delegation. The holdup threatens to push back a line that has been promoted as a flagship alternative to driving Interstate 15 on weekends. Officials have not given a new target date for breaking ground on remaining segments.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/local-nevada/"},{"headline":"Judge Rules Teen Competent in South Point Horse-Stabbing Case, Clearing Path for Trial","body":"A Clark County Family Court judge ruled Wednesday that the teenage girl accused of stabbing horses during a barrel-racing competition at the South Point is mentally competent to proceed, ending months of delay tied to psychiatric evaluation. The ruling allows prosecutors to move forward with the case, which drew wide attention after multiple horses were injured at the equestrian event. Defense attorney James Robinson represented the teen at Wednesday's hearing.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Air Force Unveils $1 Billion F-47 Test Campus Planned for Nellis AFB","body":"The Air Force has released a draft solicitation for a roughly $1.057 billion F-47 Future Campus at Nellis Air Force Base, laying out the first detailed infrastructure plan for basing operational testing of Boeing's new sixth-generation fighter in Southern Nevada. The project, issued October 22, calls for hangars, a reprogramming lab, a simulator facility and a sprawling 1.15-million-square-foot sunshaded apron on the base's east side, with initial facilities targeted for completion by March 2031. The Air Force aims to award design-build contracts to up to four teams by February 2027, though it remains unclear whether F-47s will be permanently stationed at Nellis long-term. The announcement comes weeks after Nellis marked the retirement of its last A-10 Warthog, closing a nearly 50-year chapter of close air support training at the base.","source":"Air Data News / Las Vegas Review-Journal","url":"https://www.airdatanews.com/us-air-force-plans-us-1-billion-nellis-complex-for-f-47-operational-testing/"}]},"feelGood":[{"headline":"Grocery Store Cashier Quietly Covers $150 Bill for Homeless Mother and Toddler","body":"A grocery store cashier stepped in this week to pay roughly $150 out of pocket so a homeless mother and her young daughter would not have to leave the store empty-handed. The mother, overwhelmed by the gesture, called it a small miracle during an otherwise desperate stretch. The story has circulated widely as a reminder of how far a single act of kindness from a stranger can go.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Strangers Raise $146,000 for Tennessee Movie Theater Worker After Chance Encounter","body":"A 21-year-old named Brooklyn Green started a modest fundraiser to help Mary, a Tennessee cinema employee who had worked in theaters for more than 45 years, cover a single month's rent. The campaign unexpectedly went viral, and donors ultimately contributed more than $146,000, transforming Mary's financial situation after decades of quiet, underpaid service to her community.","source":"Global Positive News Network","url":"https://www.globalpositivenewsnetwork.com/good-news-this-week-october-25th/"},{"headline":"Strangers Fund 86-Year-Old Texan's Decades-Long Dream of Sailing to Alaska","body":"Dale, an 86-year-old man from Mineral Wells, Texas, has been building a 62-foot steel boat in his yard since 1987 with hopes of one day sailing it to Alaska. After content creator Laurence Benson and friends heard his story, they launched a GoFundMe that drew more than 1,500 donors and raised over $41,000 within days, pushing Dale's long-deferred dream within reach.","source":"AOL","url":"https://www.aol.com/articles/7-feel-good-stories-start-105619000.html"}],"onThisDay":[{"year":"1929","event":"The Wall Street stock market crashed on Black Tuesday, triggering the start of the Great Depression."},{"year":"1969","event":"The first message was sent over ARPANET between UCLA and Stanford, laying groundwork for the modern internet."},{"year":"1956","event":"Israel invaded the Sinai Peninsula, beginning the Suez Crisis."},{"year":"1998","event":"John Glenn returned to space aboard the Space Shuttle Discovery, becoming the oldest person to fly in space at age 77."}]},"topPicks":[{"headline":"US Tells Gulf Allies to Prepare for Possible Short War With Iran After Midterms","teaser":"Washington is reportedly signaling Gulf partners to brace for a potential military confrontation with Tehran once midterms conclude."},{"headline":"Q3 GDP Jumps 3.4%, Beating Forecasts Days Before Midterms","teaser":"A surprisingly strong economic growth report lands just before voters head to the polls, reshaping the political narrative."},{"headline":"Israeli Election Ends in Deadlock as Arab-Led Parties Surge to Record Tally","teaser":"A hung parliament and unprecedented Arab-led party gains could upend Israel's governing coalition and regional policy."}]},"navDates":[{"key":"2026-10-29","label":"Oct 29","href":"/","isNewest":true},{"key":"2026-10-28","label":"Oct 28","href":"/archive/2026-10-28.html","isNewest":false},{"key":"2026-10-27","label":"Oct 27","href":"/archive/2026-10-27.html","isNewest":false},{"key":"2026-10-26","label":"Oct 26","href":"/archive/2026-10-26.html","isNewest":false},{"key":"2026-10-25","label":"Oct 25","href":"/archive/2026-10-25.html","isNewest":false},{"key":"2026-10-24","label":"Oct 24","href":"/archive/2026-10-24.html","isNewest":false},{"key":"2026-10-23","label":"Oct 23","href":"/archive/2026-10-23.html","isNewest":false}],"currentKey":"2026-10-29","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
