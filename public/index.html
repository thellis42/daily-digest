<script>
const STATE = {"digest":{"date":"Tuesday, November 3, 2026","generatedAt":"Tue, Nov 3, 9:02 AM PST","breaking":{"headline":"US Forces Strike Iran's Qeshm Island Hours Before Midterm Elections","body":"American forces carried out limited strikes on Iran's Qeshm Island in the Strait of Hormuz late Monday after Iran's Revolutionary Guard fired on a US aircraft, three officials told CNN. Officials described the action, part of the long-running Operation Epic Fury campaign, as defensive and not a resumption of large-scale combat, saying similar low-visibility strikes have occurred periodically in recent weeks. Iranian state media reported several explosions on the island, and Tehran's deputy foreign minister said Iran reserves the right to self-defense while calling the exchange part of an 'ongoing war.' The strikes landed on the eve of the 2026 US midterms, underscoring how the unresolved Iran conflict continues to intrude on domestic politics even without a formal declaration of renewed war.","source":"CNN","url":"https://www.cnn.com/2026/11/02/politics/us-strikes-iran-qeshm-island"},"tabs":{"defense":{"defense":[{"headline":"Army's HADES Spy Plane Prototype Completes First Flight","body":"The US Army's new High Accuracy Detection and Exploitation System aircraft, intended to replace aging manned intelligence-collection platforms, flew for the first time this week. The milestone pushes the program closer to a production decision as the service seeks persistent airborne signals- and imagery-intelligence coverage for contested theaters such as the Indo-Pacific and Eastern Europe.","source":"Defence Blog","url":"https://defence-blog.com/"},{"headline":"Army Opens Dugway Range Time to Harden Drones Against Jamming","body":"The Army is running a series of 'electromagnetic unreliability' test events that give vendors dedicated range time to harden drones, counter-drone systems, long-range fires and low-cost interceptors against jamming. Three more sessions are scheduled for 2027, beginning February 1-5 at Dugway Proving Ground, Utah, reflecting a push to validate electronic-warfare resilience under realistic contested-spectrum conditions rather than bench tests alone.","source":"Defense Tech Intelligence Brief","url":"https://edsnews.substack.com/p/defense-tech-intelligence-brief-november-e4f"},{"headline":"NATO's SeaSparrow Consortium Passes 1,000 ESSM Block 2 Deliveries","body":"The US Navy announced that cumulative deliveries of the Evolved SeaSparrow Missile Block 2 have reached 1,000 rounds under the 12-nation NATO SeaSparrow Consortium, doubling total deliveries since June 2025. Production is expanding to meet rising demand from the United States and allied navies, highlighting how shared munitions programs are scaling up as NATO members address heightened missile-defense needs across Europe and the Middle East.","source":"Defence Industry Europe","url":"https://defence-industry.eu/safran-says-its-navigation-technology-will-support-three-french-nuclear-deterrence-programmes/"}],"acquisitions":[{"headline":"Navy Awards Fairbanks Morse $100 Million to Overhaul Six Nuclear Submarines","body":"The Navy has awarded Fairbanks Morse Defense a $100 million contract to overhaul critical systems aboard six nuclear-powered submarines, the company announced Monday. The award adds to a string of recent submarine-sustainment contracts as the service tries to keep its attack-boat fleet mission-ready amid an industrial-base crunch that has slowed new-construction timelines.","source":"Inside Defense","url":"https://insidedefense.com/defense-business-briefing/defense-business-briefing-november-3-2026"},{"headline":"Hanwha Moves to Take Majority Stake in Philly Shipyard, Eyes Landing Ship Contract","body":"Hanwha Defense USA is acquiring a 60% controlling stake in Philly Shipyard from its Korean parent company, while the yard has separately submitted a proposal to build the Navy and Marine Corps' McClung-class Landing Ships Medium, Hanwha Defense USA's CEO said at the Ironclad Maritime Defense summit in Norfolk. The moves follow a $269 million Navy shipbuilding contract Hanwha secured last week and extend the company's push into US military shipbuilding since acquiring the yard in 2024.","source":"Inside Defense / Indo-Pacific Insight","url":"https://insidedefense.com/defense-business-briefing/defense-business-briefing-november-3-2026"}]},"us":[{"headline":"Midterm Elections Could Flip Congress as Polls Show Tight Races","body":"Voters are casting ballots today in midterms that will decide control of the House and Senate, with Republicans defending slim majorities in both chambers. A Reuters/Ipsos survey released Monday put Democrats eight points ahead on the generic ballot, while Trump's approval rating registered 32% in that poll versus 41% in a separate Rasmussen survey. Sabato's Crystal Ball's final ratings favor Democrats in Senate toss-up states including Alaska, Kansas, Maine, Michigan and Texas, while House Speaker Mike Johnson has insisted the polling is wrong and the GOP will defy expectations.","source":"Washington Post / Substack (Everything Briefing)","url":"https://www.washingtonpost.com/politics/"},{"headline":"Courts Deal Trump Administration Mixed Rulings on Election-Day Tactics","body":"On the eve of the midterms, the Supreme Court issued a one-line, unsigned order with no noted dissents rejecting a Justice Department bid to force California to set aside roughly 20,000 mail ballots over unproven noncitizen-voter claims, leaving a lower-court block in place. Hours later, U.S. District Judge Tanya Chutkan in Washington barred DOJ and DHS from sending states lists of supposedly ineligible voters or threatening local election officials with prosecution, calling the administration's underlying data potentially unreliable. The rulings came even as a Ninth Circuit panel separately allowed the administration to keep pressuring officials in a related case, underscoring a fractured legal landscape just as polls opened nationwide.","source":"SCOTUSblog / Reuters (via KFGO)","url":"https://www.scotusblog.com/2026/11/trump-administration-asks-supreme-court-to-intervene-in-california-ballots-dispute/"},{"headline":"Hot September Inflation Print Complicates Fed's Path as Jobs Data Loom","body":"Fresh Bureau of Labor Statistics figures released this week showed September consumer prices rose 0.6% on the month, the sharpest gain in five months, driven largely by a 9.1% jump in gasoline prices, while annual core inflation climbed to 2.6% from 2.4%. The data arrive as the Fed holds its benchmark rate steady and economists brace for Friday's delayed October jobs report, which is expected to show only modest payroll growth of roughly 55,000 to 60,000 positions. Analysts at Wells Fargo and Apollo Global say the central bank still has a long way to go to tame inflation even as hiring continues to cool.","source":"TradingEconomics / U.S. News & World Report","url":"https://www.usnews.com/news/national-news/articles/2026-11-02/taking-the-pulse-of-the-labor-market"},{"headline":"Wall Street Mixed as Oil Slides on Iran Diplomacy Hopes, Tech Selloff Resumes","body":"U.S. stocks closed mixed Monday, with the Dow gaining while the S&P 500 and Nasdaq extended a semiconductor-led selloff as investors weighed a crowded week of earnings, the midterm vote and Friday's jobs report. Oil prices fell sharply, with Brent crude trading near 104 dollars a barrel, after reports that Washington and Tehran were pursuing renewed diplomatic talks despite overnight U.S. strikes near the Strait of Hormuz. October manufacturing survey data showed new orders ticking up to 55.5 while a measure of prices paid by factories eased slightly to 75.2 from 77.9, signaling persistent but moderating cost pressure from tariffs and energy.","source":"Yahoo Finance","url":"https://finance.yahoo.com/markets/live/stock-market-today-monday-november-2-dow-sp-500-nasdaq-091835095.html"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Weighs Near-Doubling of Defense Budget to $508 Billion","body":"Japanese officials are debating a five-year defense buildup plan worth up to ¥80 trillion ($508 billion) for fiscal 2027-2031, nearly 1.8 times the current ¥43 trillion package that began in 2023. The proposal, still subject to year-end budget negotiations, would fund long-range strike missiles, drone fleets and AI-driven command systems as Prime Minister Sanae Takaichi's government revises Japan's three core security documents by the end of 2026. Separately, Japan's Ground Self-Defense Force is moving to unify missile and artillery fire-control systems at the division level to speed targeting decisions and conserve scarce munitions on remote southwestern islands.","source":"The Japan Times / Nikkei Asia","url":"https://www.japantimes.co.jp/news/2026/11/03/japan/japan-defense-spending-hike-focus/"},{"headline":"Washington Reaffirms Defense Commitment to Manila Amid Beijing Pressure Campaign","body":"Secretary of State Marco Rubio said this week that the Trump administration remains committed to defending the Philippines as friction with Beijing over the South China Sea continues to simmer. The reassurance comes as Philippine officials face a fresh diplomatic broadside from China's Wang Yi, who accused unnamed Filipino politicians of crossing Beijing's 'red lines' and demanded Manila rein them in. Manila has responded by deepening outside partnerships, including a new coast guard pact with Vietnam, rather than conceding ground in the dispute.","source":"China-Global South Project / Manila Times","url":"https://chinaglobalsouth.com/2026/11/03/china-wang-yi-warns-philippines-south-china-sea-tensions/"},{"headline":"India Signs $6 Billion Corvette Deal, Deepens Indo-Pacific Defense Ties","body":"India's Ministry of Defence signed contracts worth roughly ₹53,866 crore (about $6.4 billion) for eight next-generation navy corvettes, to be built by Garden Reach Shipbuilders and Goa Shipyard, marking a major step in domestic naval modernization. The deal follows a flurry of Indo-Pacific defense diplomacy, including the just-concluded two-week AUSTRAHIND-2026 exercise between India's Garhwal Rifles and Australia's 13th Infantry Brigade in Kerala, and an October 28 meeting between Defence Minister Rajnath Singh and his South Korean counterpart in Cebu on joint military technology development. Analysts note the moves reflect New Delhi's push to accelerate modernization amid continued friction with China along the Himalayan border.","source":"NationPath / UNI","url":"https://www.nationpathindia.com/defence/india-south-korea-joint-military-technology-defence-cooperation"}],"pacingThreat":[{"headline":"China's Drone Carrier Completes First Stealth UCAV Launch and Recovery","body":"China's Type 076 amphibious assault ship Sichuan has reportedly completed its first at-sea launch and recovery of the low-observable GJ-21 unmanned combat aircraft, a milestone that moves the platform beyond basic hull trials toward full aviation-system integration. Open-source defense trackers say the test demonstrates Beijing's progress in merging stealthy drone aviation with naval power projection, a capability with direct relevance to contingencies in the Taiwan Strait and South China Sea. The development follows China's unveiling of its first shipborne stealth attack drone takeoff and landing on an amphibious assault ship earlier this year.","source":"Ghost Fleet Journal / China Military","url":"https://ghostfleet.substack.com/p/fleet-watch-2026-11-03"},{"headline":"Analysts Say PLA Leadership Purge Has Crippled Invasion Timeline","body":"Taiwanese defense scholars say the sweeping purge of People's Liberation Army generals, including the arrest of former Central Military Commission vice chairman Zhang Youxia roughly nine months ago, has left only two members on the seven-seat commission and set back Xi Jinping's reported timetable to ready an invasion force by 2027. National Taiwan University's Chen Shih-min and National Defense University's Ma Chen-kun argue the command disruption will likely hamper the PLA's ability to project force or respond to a Taiwan contingency for the next three to four years. The assessment adds to a broader pattern this year of falling PLA fighter sorties near Taiwan, which analysts partly attribute to the same internal turmoil.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866956"},{"headline":"Taiwan Logs 49 PLA Aircraft and a Dozen Vessels in 24-Hour Window","body":"Taiwan's Ministry of National Defense reported detecting 49 PLA aircraft, six PLAN warships and six China Coast Guard or government vessels operating around the island in the 24 hours ending the morning of November 3, continuing a high daily tempo of pressure activity. The tally comes as Taiwan heads toward its November 28 local elections, a period analysts warn is sensitive given overlapping U.S. midterm dynamics and historically elevated Chinese military signaling around Taiwanese political milestones. Taiwan's military publishes these detection figures daily as part of its transparency effort to document PLA gray-zone activity.","source":"Ghost Fleet Journal (citing Taiwan MND)","url":"https://ghostfleet.substack.com/p/fleet-watch-2026-11-03"}]},"europe":{"ukraineRussia":[{"headline":"Russia Launches Massive Overnight Barrage, Hits Kharkiv Hospital and Aid Center","body":"Russia fired a combined wave of Iskander-M/KN-23 ballistic missiles, Zircon missiles, 59 cruise missiles and 289 Shahed-type and decoy drones at Ukraine overnight into November 3, striking 23 locations including a Kharkiv hospital that left at least 73 people injured and an apartment block in Dnipro. Separately, officials said at least 29 people were killed and 48 remain missing after Russian bombs hit a humanitarian aid distribution site in the village of Komyshuvakha, a strike Zelensky called 'utterly horrific.' The barrage came as US envoy Steve Witkoff announced Washington will mediate Ukraine-Russia talks in Abu Dhabi on November 10-11 covering postwar security arrangements and de-escalation.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/11/3/at-least-73-injured-as-russia-bombs-ukrainian-hospital-and-power-plants"},{"headline":"Zelensky Confirms Ukraine Hacked Russia's Emergency Alert App in Retaliation","body":"President Zelensky told PBS NewsHour that Ukraine retaliated against a Russian cyberattack that had spread false nuclear and chemical attack warnings across Ukraine by hacking Moscow's own emergency alert application. The tit-for-tat hacking shows cyber operations becoming a parallel front to the missile war as a short digital truce collapsed. The exchange came alongside a new Russia-Azerbaijan military cooperation deal covering armored-vehicle repairs and possible Pantsir-S1 air defense sales, even as Moscow's ties with Turkey remain strained.","source":"Kyiv Post","url":"https://www.kyivpost.com/thread/88951"}],"europe":[{"headline":"Patriot Delivery Delays Expose Cracks in NATO's Eastern Flank Air Defense","body":"A senior Polish military commander warned this week that scheduled Patriot missile deliveries to Poland face delays, prompting Defense Minister Wladyslaw Kosiniak-Kamysz to tell international arms manufacturers that future contracts will require building production and maintenance facilities inside Europe. The standoff highlights Warsaw's growing frustration with dependence on the US Foreign Military Sales pipeline for high-end air defense. Separately, Bloomberg reported Washington plans to ask NATO allies for fresh funding for the alliance's PURL program, which channels allied money into American-made weapons for Kyiv, despite ongoing friction between Trump and Zelensky.","source":"RealClearDefense","url":"https://www.realcleardefense.com/nato/links/patriot-delays-force-a-new-air-defense-doctrine-on-natos-eastern-flank-2026-11-02"},{"headline":"Coordinated Cyberattacks Disrupt Supermarket Refrigeration Across Five European Countries","body":"Overnight cyberattacks hit freezer and refrigeration systems at supermarkets in Sweden, Belgium, Luxembourg, Ireland and Estonia, spotlighting the vulnerability of retail and cold-chain logistics networks to digital sabotage. The incident lands days after UK cyber chief Richard Horne warned Britain will likely face AI-enabled attacks on critical infrastructure by 2028, cautioning that such tools will let attackers exploit long-tolerated weaknesses at unprecedented scale. Together the episodes are intensifying debate across European capitals over hardening civilian infrastructure against hybrid and cyber threats linked to the Ukraine war.","source":"1News","url":"https://www.1news.co.nz/2026/11/03/news-in-90-seconds-november-3/"}]},"middleEast":[{"headline":"Trump Announces End to $4 Billion in Annual US Military Aid to Israel","body":"Speaking on Fox News on the morning of the US midterms, President Trump said Washington will halt its roughly $4 billion in annual security assistance to Israel by the end of 2026, arguing Israel no longer needs the funding. The announcement reportedly caught senior Israeli financial and security officials off guard, even though the current bilateral memorandum of understanding is not due to expire until late 2028. The timing, amid Israeli political turmoil and maneuvering among Netanyahu-allied parties, adds fresh uncertainty to the US-Israel relationship.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-november-03-2026/"},{"headline":"Houthi Forces Push Within 50 Miles of Aden as Yemen's Hunger Crisis Deepens","body":"Houthi fighters have advanced to within roughly 50 miles of Aden, the internationally recognized Yemeni government's stronghold, prompting Saudi-led coalition airstrikes on Houthi-held areas that reportedly killed 10 people and struck Hodeidah University's medical school. The coalition also said it intercepted ballistic missiles and a drone fired toward southern Saudi Arabia. The renewed fighting is worsening Yemen's humanitarian catastrophe, with roughly three-quarters of households unable to meet basic food needs and the governor of Taiz declaring famine in the besieged city last week.","source":"Havana Times","url":"https://havanatimes.org/news/international-news-briefs-for-tuesday-november-3-2026/"},{"headline":"Iran Dangles Hormuz Reopening as Qatari Mediators Shuttle to Tehran","body":"Iran's Foreign Ministry said it could reopen the Strait of Hormuz within 48 hours if Washington meets a set of conditions, even as a senior Iranian official cautioned Reuters that the two sides remain far from a deal to end their conflict. A Qatari delegation led by senior official Ali Al Thawadi traveled to Tehran to meet Foreign Minister Abbas Araghchi in search of common ground. Separately, Israeli officials say Prime Minister Netanyahu is pressing for a new wave of strikes against Iran once US midterm results are finalized, raising the odds of fresh escalation despite the diplomatic track.","source":"Jerusalem Post","url":"http://www.jpost.com/middle-east"}],"techAI":{"aiCompetition":[{"headline":"OpenAI Slashes Funding Target Amid Capital Crunch","body":"OpenAI cut the target for its latest funding round from 30 billion dollars to 20 billion dollars after securing only about 11 billion dollars in commitments, with the deal now valuing the company at 1.25 trillion dollars, down from 1.4 trillion. The retreat comes as the Nasdaq 100 sold off and as OpenAI competes for investor attention with Anthropic, which is preparing an IPO. The episode underscores a broader capital squeeze across the sector: Oracle is raising 20 billion dollars via stock and bonds, SpaceX closed 40 billion dollars in debt financing, Meta plans a 95 billion dollar equity raise, and Microsoft issued 25 billion dollars in debt, all to feed AI infrastructure spending that hyperscalers are pushing toward 1 trillion dollars next year.","source":"Fortune / PYMNTS","url":"https://fortune.com/2026/11/02/ai-boom-supply-crunch-capital-debt-bonds-capex-spending"},{"headline":"Google's Gemini 4 Carbon Edges Out Rivals in Benchmark Race","body":"Google released Gemini 4 Carbon last week, and it has now topped Artificial Analysis's Intelligence Index V5 benchmark, narrowly beating Anthropic's Claude Opus 5.5 by one point and OpenAI's GPT-6 Astra by two. Despite the overall lead, Gemini 4 Carbon still trails Claude Opus 5.5 on coding tasks and falls behind Grok 4.7, Muse Wonder, and Kimi K3.1 Pro on knowledge-work benchmarks. The result illustrates how fast frontier rankings are shifting among US labs even as Chinese models draw separate scrutiny for advanced capabilities.","source":"Tom's Hardware","url":"https://www.tomshardware.com/tech-industry/artificial-intelligence/google-reveals-new-gemini-4-carbon-ai-model-narrowly-beating-claude-opus-5-5-frontier-ai-model-is-also-the-least-likely-to-hallucinate-benchmarks-claim"}],"cyberEmerging":[{"headline":"China-Linked Hackers Deploy AI Agents Against 200-Plus Organizations","body":"CrowdStrike reports that a China-nexus actor it tracks as Vapor Panda used an open-source multi-agent AI penetration-testing framework called ARTEX to hit more than 200 organizations across 14 countries in an 11-day campaign. Confirmed victims span telecom providers in the US and Belgium, government bodies in Greece, the Middle East, and Latin America, and US pharmaceutical firms; in one Greek government intrusion the AI agents forged an administrator token using authentication keys from a 2022 mail-server export. Researchers describe the campaign as a shift from single AI-driven intrusions to multiple simultaneous operations run by one human operator, signaling a new scale of automated state-linked hacking.","source":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/chinese-hackers-use-artex-ai-in-automated-attacks-against-200-orgs/"},{"headline":"Beijing Moves to Tighten Export Controls on Its Own AI Models and Chip Designs","body":"China's commerce and science ministries have drafted new export controls covering 23 AI-related technologies, including large language models above 2 trillion parameters, AI agents, advanced chip designs, and computing clusters, with public comment open until November 15. The rules would also restrict know-how for chips fabricated at 14 nanometers or below and for 2.5D or 3D stacked designs, and would classify running a covered model on foreign servers as an export requiring registration. Framed by Beijing as a safeguard to 'prevent misuse and abuse' and keep AI 'under human control,' the move mirrors — and could complicate — Washington's parallel tightening of chip export rules targeting China.","source":"The Next Web","url":"https://thenextweb.com/news/china-ai-export-controls-draft"}]},"cities":{"lasVegas":[{"headline":"Nevada Voters Head to Polls in Pivotal Midterm","body":"More than 752,000 Nevadans had already returned mail ballots or voted early by Monday afternoon, pushing statewide participation to roughly 36 percent ahead of Tuesday's in-person voting from 7 a.m. to 7 p.m. Governor Joe Lombardo and Attorney General Aaron Ford are locked in a closely watched race, while control of the Nevada Legislature will shape how much authority the winner actually holds. Four U.S. House seats and down-ballot measures, including voter ID and abortion-rights questions, are also on the ballot.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/politics-and-government/nevada/election-day-is-here-nevada-what-you-need-to-know-3908866/"},{"headline":"North Las Vegas Teen Admits Trying to Support ISIS","body":"A North Las Vegas teenager has admitted to attempting to assist the Islamic State, with investigators saying he had discussed so-called lone wolf attack concepts. The case lands amid heightened scrutiny of homegrown extremism in the valley following a separate recent arrest of a man accused of stockpiling bomb-making components and threatening Gov. Lombardo. Authorities have not detailed what, if any, attack was planned locally.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Rabid Fox Bite Triggers Alert Near Silverado Ranch","body":"Clark County issued a public health warning after a fox that tested positive for rabies bit a person in a neighborhood near Interstate 15 in the Silverado Ranch area. The victim is undergoing treatment, and officials are urging residents to steer clear of wild animals and immediately report any bites or aggressive wildlife encounters.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/"}],"nellis":[{"headline":"Air Force Plans $1 Billion F-47 Test Campus at Nellis","body":"A draft Air Force solicitation released in late October lays out a $1.057 billion 'Future Campus' on the eastern side of Nellis Air Force Base to support operational testing of Boeing's F-47, the sixth-generation stealth fighter set to replace the F-22 Raptor. Initial facilities are targeted for completion by spring 2031, with the Air Force planning to award design-and-construction contracts to as many as four firms by February 2027. The project cements Nellis's role as the service's premier advanced-fighter testing hub as the base continues its rebrand into the U.S. Air Force Warfare Center.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/military/air-force-seeks-1b-campus-at-nellis-to-make-fighter-jets-3905477/"}]},"feelGood":[{"headline":"Miami Veteran Surprised With Car and College Scholarship","body":"Army veteran Roy Mora, who deployed to Afghanistan in 2012 and now homeschools his five children, was surprised during a Miami Heat game with a new car and a two-year scholarship to Miami Dade College. The gifts came through a partnership between Lithia Motors, Chase Bank and the Military Warrior Support Foundation, recognizing Mora's service and his volunteer work helping families facing hardship. Mora said the vehicle removes a major financial burden his family had been carrying.","source":"Local10 (WPLG)","url":"https://local10.com/news/local/2026/10/31/local-army-veteran-surprised-with-new-car-college-scholarship"},{"headline":"Operation Homefront Launches $500,000 Push for Military Families","body":"Operation Homefront kicked off its annual '11 Days of Impact' campaign on November 1, aiming to raise half a million dollars by November 12 to support military and veteran families dealing with financial hardship. The nationwide drive funds emergency assistance, housing help and other services meant to give service members and their families more stable footing. Dozens of partner businesses, including Mountain Mike's Pizza and Winn-Dixie, are tying in their own giving campaigns this month.","source":"Military.com","url":"https://www.military.com/veterans-day/giving-back.html"},{"headline":"Colorado National Guard Pulls Couple From Flooded RV","body":"Colorado National Guard members rescued a couple trapped inside their RV after sudden regional flooding swept through the area over the weekend. The swift-water style rescue was carried out as part of the Guard's ongoing emergency response posture, underscoring how citizen-soldiers continue to step into harm's way for stranded residents during extreme weather. No injuries were reported in the rescue.","source":"The Gazette (Colorado Springs)","url":"https://gazette.com/2026/11/01/colorado-springs-area-military-events-starting-nov-1/"}],"onThisDay":[{"year":"1903","event":"Panama declared independence from Colombia with US support, paving the way for the Panama Canal treaty."},{"year":"1957","event":"The Soviet Union launched Sputnik 2, carrying the dog Laika into orbit as the first animal to circle the Earth."},{"year":"1964","event":"Lyndon B. Johnson won a full term as US President in a landslide victory over Barry Goldwater."},{"year":"1992","event":"Bill Clinton was elected the 42nd President of the United States, defeating incumbent George H.W. Bush."}]},"topPicks":[{"headline":"US Forces Strike Iran's Qeshm Island Hours Before Midterm Elections","teaser":"A pre-election US military strike on Iranian territory raises fears of regional escalation and domestic political fallout."},{"headline":"Midterm Elections Could Flip Congress as Polls Show Tight Races","teaser":"Razor-thin polling suggests control of Congress hangs in the balance as voters head to the polls nationwide."},{"headline":"Trump Announces End to $4 Billion in Annual US Military Aid to Israel","teaser":"A dramatic policy shift ends decades of US military funding to Israel, reshaping Middle East alliances.","nope":""}]},"navDates":[{"key":"2026-11-03","label":"Nov 3","href":"/","isNewest":true},{"key":"2026-11-02","label":"Nov 2","href":"/archive/2026-11-02.html","isNewest":false},{"key":"2026-11-01","label":"Nov 1","href":"/archive/2026-11-01.html","isNewest":false},{"key":"2026-10-31","label":"Oct 31","href":"/archive/2026-10-31.html","isNewest":false},{"key":"2026-10-30","label":"Oct 30","href":"/archive/2026-10-30.html","isNewest":false},{"key":"2026-10-29","label":"Oct 29","href":"/archive/2026-10-29.html","isNewest":false},{"key":"2026-10-28","label":"Oct 28","href":"/archive/2026-10-28.html","isNewest":false}],"currentKey":"2026-11-03","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
