<script>
const STATE = {"digest":{"breaking":{"headline":"US Prepares Fresh Iran Strikes as War Nears Six-Month Mark","body":"US officials tell reporters that new strikes on Iran could come as soon as this weekend, though the scope remains undecided and could still be called off. The State Department has renewed warnings for Americans to consider leaving the Middle East, Kuwait says it intercepted Iranian drones early Saturday, and Tehran has threatened Gulf states hosting US forces. The conflict, which began in late February, has now stretched past five months with no clear endgame despite repeated White House claims that victory is near.","source":"CNN, Al Jazeera"},"tabs":{"defense":[{"headline":"Pentagon Weighs Next Wave of Iran Strikes","body":"CENTCOM's most recent 'heavy wave' of strikes hit sites across Iran's Gulf-facing provinces, including Bushehr, Fars and Qeshm Island, after a brief pause was broken by Iranian missile fire on US forces. Officials now say another round could launch this weekend, with Trump promising to hit Tehran 'very hard.' A former defense secretary has warned the US is now locked into what he calls an unwinnable war.","source":"CNN, Al Jazeera"},{"headline":"Marine F-35B Crashes in California, Pilot Ejects Safely","body":"A Marine Corps F-35B stealth fighter went down in California, with the pilot ejecting and surviving. The Corps classified it a 'Class A mishap,' the most severe category, reserved for incidents causing more than $2 million in damage, destroying an aircraft, or killing a service member.","source":"Las Vegas Review-Journal"},{"headline":"Space Force Hands SpaceX $1.6 Billion Launch Deal","body":"The Space Force awarded SpaceX a $1.6 billion contract covering nine National Security Space Launch missions to be completed by the end of 2027, deepening the Pentagon's reliance on SpaceX for military satellite launches amid a broader Golden Dome and space-security buildup.","source":"Inside Defense"},{"headline":"Pentagon Bets $100 Million on Counter-Drone Sensing Startup","body":"The Defense Department is directing $100 million to Hidden Level, a passive radar and distributed sensing company, to scale technology aimed at detecting and defeating drones, part of a wider push including a $158 million reprogramming for the Joint Interagency Task Force's Domestic Shield counter-drone initiative protecting US infrastructure.","source":"Inside Defense"},{"headline":"Senate Confirms Slate of Pentagon and Space Officials","body":"The Senate approved an en bloc package confirming nominees for Pentagon comptroller, Space Force acquisition chief, and the director of the National Reconnaissance Office, filling key leadership posts as the department pushes ahead on space launch and acquisition reform priorities.","source":"Inside Defense"}],"us":[{"headline":"New Trump Tariffs on 60 Countries Take Effect","body":"A fresh round of tariffs ranging from 10% to 12.5% on 60 trading partners, including the EU, UK, China and Canada, replaced a stopgap 10% baseline tariff that lapsed after the Supreme Court ruled Trump's earlier emergency-powers tariff authority unlawful. Goods from the affected partners account for roughly 99% of US imports, and the EU's foreign policy chief has publicly disputed the administration's forced-labor justification for the move.","source":"CNN, CNBC"},{"headline":"GOP Senators Stall Blanche's Attorney General Nomination","body":"Senators Thom Tillis and John Cornyn are withholding support for Todd Blanche's nomination as attorney general, pressing for assurances that a controversial 'anti-weaponization' fund tied to Trump's IRS settlement is truly dead. Trump has publicly insisted the fund is finished even as he continues to defend its creation.","source":"NBC News"},{"headline":"New York Times Sues Pentagon Over Press Restrictions","body":"The New York Times has filed suit against the Pentagon, alleging violations of journalists' First Amendment rights after Defense Secretary Pete Hegseth imposed tighter rules that drove nearly all mainstream outlets, including the AP and NPR, out of the Pentagon press pool in favor of a smaller, more sympathetic press corps.","source":"NPR"},{"headline":"Vermont Governor Pushes Back on Federal Election Overhaul","body":"Republican Governor Phil Scott of Vermont broke with Trump's push to reshape how US election systems are run, arguing that election administration belongs to the states rather than Washington, a rare intra-party rebuke amid the administration's broader push for federal control over voting infrastructure.","source":"NBC News"}],"pacific":[{"headline":"Kim Jong Un Unveils Five-Year Military Modernization Drive","body":"North Korea's Ninth Party Congress outlined a new five-year plan calling for submarine-launched ICBMs, AI-enabled unmanned attack systems and anti-satellite weapons. Kim was re-elected general secretary and formally designated South Korea the North's 'principal enemy,' abandoning the long-standing goal of reunification.","source":"NewsNow/NK News"},{"headline":"Chinese Fighter Patrols Near Taiwan Mysteriously Pause","body":"For nearly two weeks, Chinese fighter jets have stopped their regular incursions near Taiwan, and analysts say no one has a clear explanation for the lull, a notable break from the near-daily gray-zone pressure Beijing has applied around the island in recent years.","source":"CNN"},{"headline":"Taipei Protests Beijing's Shifted Flight Path Near Median Line","body":"Taiwan has lodged a protest after China unilaterally moved a civil aviation flight path closer to the sensitive median line dividing the Taiwan Strait, a move Taipei calls a further erosion of the informal boundary that has long helped prevent direct military contact.","source":"CNN"},{"headline":"North Korean Troops Deepen Russia's Kursk Fight","body":"Thousands of North Korean soldiers remain deployed to Russia's Kursk region under a 2024 mutual-defense pact, sustaining heavy casualties as Pyongyang deepens military ties with Moscow, including a new memorial museum in Pyongyang honoring troops killed fighting for Russia against Ukraine.","source":"Al Jazeera"},{"headline":"South Korea Accelerates Drone and Counter-Drone Buildup","body":"Seoul unveiled a sweeping plan to rapidly expand its military drone and counter-drone capabilities, citing lessons from modern conflicts abroad and the growing threat from North Korean weapons development, including Pyongyang's push toward AI-enabled attack drones.","source":"Yahoo News"}],"europe":[{"headline":"Senate Set to Vote on Toughened Russia Sanctions Package","body":"The US Senate is scheduled to vote on a revised sanctions bill targeting Russian President Vladimir Putin, senior military and political leaders, and key financial and energy institutions, days after Ukraine struck an Iranian vessel in the Caspian Sea that Kyiv says was tied to Russian naval operations.","source":"Al Jazeera, NBC News"},{"headline":"Russian Barrage Kills Civilians as Arsenal Signs of Strain Emerge","body":"Poland says a missile recovered from a recent strike was recently manufactured, evidence that Russia's relentless nightly bombardment of Ukraine is depleting its stockpiles even as it continues to kill civilians, including a child struck at a supermarket in a recent attack.","source":"Al Jazeera"},{"headline":"Ukrainian Drones Force Evacuations Deep Inside Russia","body":"Kyiv's drone campaign has expanded to hit Russia's online retail giant Wildberries, prompting the company to evacuate warehouses in Ryazan, while separate strikes lit up the sky over Belgorod near the border, part of Ukraine's broader push to raise the economic cost of the war inside Russia.","source":"Al Jazeera"},{"headline":"Dozens of World Leaders Rally Behind Ukraine Without Trump","body":"Roughly 30 world leaders gathered in France this week to reaffirm support for Ukraine's defense, a show of solidarity notable for the absence of an invitation to President Trump, underscoring friction between Washington and European allies over the war's trajectory.","source":"NBC News"}],"middleEast":[{"headline":"Hamas Agrees to Phased Disarmament Tied to Israeli Withdrawal","body":"Hamas has for the first time endorsed a specific roadmap to surrender weapons, brokered through Trump's Board of Peace, but insists it will only proceed if Israel halts strikes, increases aid flow and withdraws forces under last October's ceasefire framework. Israel currently holds roughly 60% of Gaza and has not formally accepted the plan, and heavy-weapons decommissioning could stretch 200 to 350 days even if implementation begins.","source":"AP, CNBC, Al Jazeera"},{"headline":"Overnight Strike Craters Gaza Hospital Despite Ceasefire Talk","body":"An Israeli strike overnight left a large crater at a hospital in Deir al-Balah, days after Trump touted the disarmament agreement as a breakthrough, illustrating the gap between diplomatic announcements and continued violence on the ground that has killed more than 1,100 Palestinians since the October truce.","source":"CNN, Al Jazeera"},{"headline":"Iraq Pursues Legal Action Over US-Saudi Strikes on Militias","body":"Iraq's prime minister has directed the Foreign Ministry to pursue legal action against the US and Saudi Arabia after coordinated strikes on Iran-backed militias killed or wounded dozens, drawing criticism from Iraqi political factions who called the operation a dangerous breach of regional norms.","source":"CNN"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Overtakes OpenAI as Most Valuable AI Startup","body":"Anthropic closed a $65 billion round at a $965 billion valuation, led by Altimeter, Dragoneer, Greenoaks and Sequoia, pushing past OpenAI's $852 billion mark from its own $122 billion raise earlier this year. Anthropic says its revenue run rate has hit $47 billion, up from $10 billion a year ago, fueled largely by its Claude Code coding assistant.","source":"The Hill, CNBC"},{"headline":"Musk's SpaceX-xAI Combination Eyes $1.75 Trillion IPO","body":"Elon Musk's merged SpaceX-xAI entity has filed for an initial public offering reportedly targeting a valuation as high as $1.75 trillion, joining OpenAI and Anthropic in a race among frontier labs toward public markets as compute costs balloon.","source":"The Hill"},{"headline":"Abu Dhabi's MGX Closes $49 Billion AI Mega-Fund","body":"Abu Dhabi-backed investment vehicle MGX closed one of the largest AI-focused funds ever at $49 billion, extending its role as a major backer of OpenAI, Anthropic and xAI. AI companies have raised a record $416.6 billion so far this year, nearly double all of 2025, though OpenAI and Anthropic alone captured 43% of first-half global venture funding.","source":"CNBC"}],"cyberEmerging":[{"headline":"Trump Downplays Iran Link to Minnesota Infrastructure Hack","body":"President Trump dismissed reports tying a recent cyberattack on Minnesota critical infrastructure to Iran, instead directing blame at the state's Democratic leadership, even as the administration separately moved to freeze childcare payments to Minnesota over citing fraud concerns.","source":"CNN"},{"headline":"AI Executives Ramp Up Security Amid Surging Threats","body":"Digital threats against AI executives and data centers have grown roughly sevenfold since late February, according to threat-intelligence firm Liferaft, following an April Molotov cocktail attack on OpenAI CEO Sam Altman's San Francisco home. Local governments have now enacted 127 bans on new data centers amid mounting community backlash.","source":"AI Weekly"}]},"cities":[{"headline":"Nevada Braces for Deepest-Ever Colorado River Cuts","body":"A new federal plan mandates roughly 20% cuts to Colorado River water allocations for Nevada, Arizona and California as Lake Mead continues sliding toward record lows, with Nevada officials vowing to fight the plan in court to protect the state's water rights.","source":"Las Vegas Sun, News3LV"},{"headline":"Good Samaritan Killed Stopping Robbery Near Jones Boulevard","body":"A man was shot and killed while trying to stop the robbery of a roadside flower vendor near the I-95 exit at Jones Boulevard in Las Vegas; the suspect accused in the killing has since appeared in court.","source":"News3LV, Las Vegas Sun"},{"headline":"Wildfire Near Area 51 Reaches 13,000 Acres","body":"The Quail Springs wildfire burning on withdrawn lands of the Nevada Test and Training Range near Area 51 has grown to nearly 13,000 acres and is only about 12% contained, as crews battle triple-digit desert heat.","source":"Las Vegas Review-Journal"}],"feelGood":[{"headline":"Stranger's Video Nets Struggling Veteran $184,000","body":"A quiet moment spotted through an airport window turned into a life-changing windfall for a Navy veteran after LaCinda Thackeray shared footage of him on TikTok. Within days, viewers moved by his story donated a combined $184,000 to help him get back on his feet.","source":"SunnySkyz"},{"headline":"Bystander's Quick CPR Saves Drowning Toddler","body":"When a 2-year-old girl was pulled from the water unconscious and not breathing, Mariza Mojica immediately began CPR, drawing on her training to revive the child and save her life before paramedics arrived.","source":"SunnySkyz"},{"headline":"Rescued Shelter Dog Donates Blood to Save Ailing Pug","body":"Rowlan, a pit bull terrier once rescued as an injured stray, became a lifesaving blood donor for Tilly, a severely underweight and dehydrated pug at the Arizona Humane Society's Phoenix campus, and Tilly's condition improved almost immediately after the transfusion.","source":"AZFamily"}],"onThisDay":[{"year":1834,"event":"The Slavery Abolition Act 1833 took effect across the British Empire, formally ending slavery in most British colonies."},{"year":1914,"event":"Germany declared war on Russia, days after Austria-Hungary's declaration on Serbia, accelerating Europe's slide into World War I."},{"year":1936,"event":"The Summer Olympics opened in Berlin under a ceremony presided over by Adolf Hitler, with Jesse Owens among the Black American athletes who would go on to star in the games."},{"year":1981,"event":"MTV launched at 12:01 a.m., airing the first-ever music video, 'Video Killed the Radio Star' by The Buggles, and reshaping pop culture."}]},"topPicks":[{"headline":"US Weighs New Iran Strikes This Weekend","teaser":"State Department urges Americans to leave the Middle East as a nearly six-month-old war edges toward escalation."},{"headline":"Hamas Agrees to Disarm — With a Big Catch","teaser":"A historic Gaza deal hinges on Israel halting strikes and withdrawing first, leaving the ceasefire's fate uncertain."},{"headline":"Anthropic Leapfrogs OpenAI in $965B Valuation Race","teaser":"A $65 billion raise puts Claude's maker ahead of its rival as both labs sprint toward blockbuster IPOs."}],"date":"Saturday, August 1, 2026","generatedAt":"Sat, Aug 1, 10:49 AM PDT"},"navDates":[{"key":"2026-08-01","label":"Aug 1","href":"/","isNewest":true}],"currentKey":"2026-08-01","pageUrl":"https://https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}]};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl, TAB_CONFIG = STATE.TAB_CONFIG;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn");
  const toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!";
  toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-src">'+esc(story.source)+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  if(activeTab==="techAI"){
    html += '<div class="section-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">AI &amp; Competition</div>';
    html += (data.techAI.aiCompetition||[]).map(s=>cardHTML(s,accent)).join("");
    const cy = "#0ea5e9";
    html += '<div class="section-head" style="color:'+cy+';border-bottom:1px solid '+cy+'33">Cyber &amp; Emerging Tech</div>';
    html += (data.techAI.cyberEmerging||[]).map(s=>cardHTML(s,cy)).join("");
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
