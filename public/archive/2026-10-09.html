<script>
const STATE = {"digest":{"date":"Friday, October 9, 2026","generatedAt":"Fri, Oct 9, 9:12 AM PDT","breaking":{"headline":"Congressional report: 81 US aircraft lost or damaged in Iran war, costing up to $3.3 billion","body":"An October 5 Congressional Research Service update found that at least 81 U.S. military aircraft, helicopters and drones have been destroyed or damaged since combat with Iran began February 28, 2026, nearly double the 42 counted in a May tally. The list includes 45 MQ-9 Reaper drones, 12 F-15E Strike Eagles (three lost to friendly fire over Kuwait), an F-35A, two A-10s, an E-3 Sentry and seven KC-135 tankers. The Congressional Budget Office estimates replacement and repair costs at $1.9 billion to $3.3 billion, and CRS warns the toll could still rise as classified incidents are reviewed. The report lands the same day the carrier USS Abraham Lincoln limped into San Diego after 265 consecutive days at sea, a deployment marked by at least eight suicide attempts and reports of food and water shortages.","source":"The Hill","url":"https://thehill.com/policy/defense/6134346-us-aircraft-losses-iran-war/"},"tabs":{"defense":{"defense":[{"headline":"USS Abraham Lincoln returns to San Diego after grueling 265-day deployment","body":"The carrier USS Abraham Lincoln finally made it home after an unprecedented 265 consecutive days at sea supporting the Iran war, one of the longest carrier deployments in recent memory. Reports during the cruise cited at least eight suicide attempts among crew along with complaints of deteriorating morale, food shortages and contaminated water. The Navy's No. 2 officer has since warned that a 'readiness bill' is coming due fleet-wide after the marathon deployment, and the service says it has tightened training and surveillance checks in response.","source":"Democracy Now / TVG Daily Brief","url":"https://www.democracynow.org/2026/10/9/headlines"},{"headline":"Senator says Pentagon blocked Al Udeid visit to hide Iran war damage","body":"Sen. Chris Murphy (D-Conn.) says he was denied access to Al Udeid Air Base in Qatar, the largest U.S. installation in the Middle East, during a congressional delegation trip this week and is calling the refusal a cover-up of damage from the Iran war. A senior Defense Department official said Murphy's office was told in advance that it would not receive department support for the visit, citing a March 3, 2026 directive from the Secretary restricting regional travel. The dispute comes as lawmakers press for more transparency on war costs following the new CRS aircraft-loss report.","source":"The Verardo Group","url":"https://theverardogroup.substack.com/p/tvg-daily-brief-9-oct-2026"},{"headline":"NATO ally Portugal weighs ditching F-35 for European fighter in $5B deal","body":"Portugal is reconsidering its planned purchase of U.S.-made F-35 fighters in favor of European alternatives as it moves forward with a fighter program valued at roughly $5 billion, according to reporting out October 9. The reassessment reflects a broader trend among NATO members weighing sovereignty and supply-chain concerns against the F-35's capability edge. A final decision could influence procurement choices by other European allies facing similar modernization timelines.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/u-s-marine-corps-amphibious-combat-vehicles-face-congressional-scrutiny-over-drone-and-anti-armor-threats"}],"acquisitions":[{"headline":"Pentagon locks in $6.3B multi-year deal with Raytheon for SM-3 interceptors","body":"The Missile Defense Agency awarded Raytheon a multi-year contract worth up to $6.3 billion on October 8 for Standard Missile-3 Block IB production, with a $4.4 billion base value over five years plus nearly $2 billion in two option years. Under Secretary of Defense for Acquisition and Sustunment Michael Duffey said the deal breaks sub-tier manufacturing bottlenecks and gives combatant commands the interceptors needed to 'dominate the battle space.' The SM-3 IB, fired from ships or land to intercept short- to intermediate-range ballistic missiles, has been used heavily by Navy destroyers against Iranian missile attacks during the ongoing conflict.","source":"Breaking Defense","url":"https://breakingdefense.com/2026/10/pentagon-raytheon-ink-up-to-6-3-billion-multi-year-contract-for-sm-3-ib-missiles/"},{"headline":"Boeing wins $14.7B deal to triple PAC-3 seeker production","body":"Boeing has received a seven-year, $14.7 billion undefinitized contract from Lockheed Martin to triple production of PAC-3 Missile Segment Enhancement seekers, part of the Pentagon's broader push to sharply increase interceptor output. The deal puts a firm price on a supplier expansion first outlined in April and reflects continued strain on U.S. air-defense munition stockpiles after sustained use in recent Middle East operations. It comes alongside a separate $230 million BAE Systems contract modification for 32 Amphibious Combat Vehicle Recovery variants awarded in the final hours of fiscal year 2026.","source":"Inside Defense","url":"https://insidedefense.com/defense-business-briefing/defense-business-briefing-october-6-2026"}]},"us":[{"headline":"Federal Unions Score Settlement Blocking Trump's Shutdown-Era Mass Firings","body":"A coalition of federal employee unions reached a settlement this week forcing the Trump administration to formally abandon its bid to fire large numbers of federal workers through reductions-in-force ordered during last year's government shutdown. The deal, finalized around October 7, resolves a lawsuit filed last September and is being called a major labor victory, with Rep. Ro Khanna's office touting what it called the first long-term union contract in the history of the U.S. Congress as part of the broader push. The settlement effectively nullifies the administration's shutdown-era RIF notices rather than leaving them in legal limbo.","source":"The American Prospect","url":"https://prospect.org/2026/10/07/federal-workers-notch-win-against-illegal-rifs-trump-shutdown-labor-unions/"},{"headline":"Chief Justice Roberts Freezes 4th Circuit Order in Campaign-Finance Fight","body":"Chief Justice John Roberts issued an administrative stay on Thursday, October 8, blocking a 4th Circuit Court of Appeals ruling that would have forced the FCC to immediately decide a dispute over broadcast rates for political advertising ahead of a Friday noon deadline. Solicitor General John Sauer had urged the justices to act quickly, calling the appellate panel's mandamus order a 'flagrant abuse' that improperly circumvented an earlier Supreme Court stay in the case. Roberts gave the Democratic candidates challenging the FCC until 5 p.m. Saturday to respond, keeping the underlying dispute over political ad pricing in legal limbo as the Court's new term gets underway.","source":"RedState / Election Law Blog","url":"https://redstate.com/smoosieq/2026/10/08/make-the-supreme-court-say-it-twice-roberts-blocks-4th-circuit-extraordinary-election-order-n2207901"},{"headline":"Weak September Jobs Data Continues to Reshape Fed Rate Bets","body":"Markets are still digesting last week's Labor Department report showing the U.S. economy added only 29,000 jobs in September as the unemployment rate ticked up to 4.2 percent, with prior months' job gains revised sharply downward. Traders have since pushed the probability of an October Fed rate hike down to roughly 17 to 22 percent, a sharp reversal from expectations just weeks earlier that the central bank would keep tightening after its September rate increase. Analysts now say the Fed faces a more conflicted picture heading into its next meeting, balancing a cooling labor market against inflation that remains above target.","source":"Traders Union / CNBC","url":"https://tradersunion.com/news/central-banks/show/3650020-fed-rate-hike-expectations"},{"headline":"Courts Strike Down New York's Climate Superfund Law","body":"Two separate federal courts this week ruled against New York's climate change Superfund law, which sought to force major fossil-fuel companies to pay into a state fund for climate-adaptation costs. The rulings, flagged in a Capitol Hill legislative roundup covering the week of October 6, add New York to the list of states whose climate liability statutes have run into judicial roadblocks. The decisions are likely to fuel further legal battles over similar 'climate superfund' measures pending in other Democratic-led states.","source":"NEFI (This Week in Congress)","url":"https://nefi.com/news-publications/recent-news/this-week-in-congress---october-6-2026"}],"pacific":{"pacificCommand":[{"headline":"US and Japan to Stage Largest-Ever Keen Sword Drill Near Taiwan","body":"Japan's Self-Defense Forces and U.S. troops will hold the expanded Keen Sword 27 exercise from October 19-29, mobilizing roughly 45,000 Japanese personnel, 6,100 vehicles, 40 ships and 260 aircraft alongside about 12,000 U.S. troops, a sharp jump from 2024's drill. New participants this year include France, Germany, the Netherlands, New Zealand, Australia, Canada and the Philippines, while U.S. Marines plan to test NMESIS anti-ship missile batteries on Yonaguni Island, just east of Taiwan. Analysts say the buildup reflects a deliberate allied 'wall' strategy meant to complicate Chinese military planning in the East China Sea.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3370210/how-expanded-japan-us-military-exercises-could-complicate-pla-planning-over-taiwan"},{"headline":"Japan Launches Study on Rapid-Response Military Space Transport","body":"Defense Minister Shinjiro Koizumi announced Friday that Japan's Ministry of Defense will open a research study into rapid-response space transportation to guarantee the Self-Defense Forces' continuous access to satellites. Koizumi said the challenge cannot be solved by the ministry alone and that it is soliciting ideas from across government and industry. The move comes as Japan links the effort to a record defense budget request and its accelerated push to hit 2 percent of GDP in defense spending, citing growing Chinese, Russian and American military activity in space.","source":"The Japan Times","url":"https://japantimes.co.jp/news/2026/10/09/japan/politics/koizumi-space-defense"},{"headline":"Seoul and New Delhi Advance Sale of South Korean Air-Defense System to India","body":"Officials from South Korea's Defense Acquisition Program Administration and India's Ministry of Defence used this month's joint industry and logistics committee meeting in New Delhi to discuss exporting Hanwha's Biho Hybrid short-range air-defense system to the Indian Army, which had already shortlisted the platform in earlier trials. The talks were part of the 10th India-Republic of Korea Joint Committee on Defense Industries and Logistics Cooperation, which also covered joint manufacturing and broader technology-sharing plans. The push comes alongside separate Hanwha programs delivering AS9 howitzers and AS21 Redback vehicles to Australia, underscoring Seoul's growing role as a defense-export hub across the Indo-Pacific.","source":"Global Defense Corp","url":"https://www.globaldefensecorp.com/2026/10/07/indian-army-set-to-buy-south-korean-biho-air-defense-system/"}],"pacingThreat":[{"headline":"Philippines Says Chinese Military and Coast Guard Presence Near Its Outposts Nearly Doubled","body":"Manila's military tallied 101 Chinese military and coast guard vessels in September around Thitu Island, Second Thomas Shoal and other contested features, compared with 56 the previous month. Philippine South China Sea spokesman Rear Admiral Roy Vincent Trinidad described the buildup as a deliberate 'mission kill' effort designed to exhaust Manila's capacity to sustain patrols rather than a direct confrontation. The report follows an incident last weekend in which a Chinese J-16 fighter repeatedly approached a Philippine Cessna 208 patrol aircraft near Scarborough Shoal, prompting a formal protest from Manila.","source":"Manila Times","url":"https://www.manilatimes.net/2026/10/09/news/national/ph-flags-near-doubling-of-chinese-presence-in-disputed-waters/2442037"},{"headline":"Chinese Researchers Claim New Lidar Design Can Spot Stealth Jets at Night","body":"A team of Chinese scientists published computer modeling this week arguing that a theoretical laser-based lidar sensor could detect stealth aircraft, including the US F-35, from as far as 61.5 kilometers away in darkness. The paper is the latest in a string of open-source Chinese military-research claims this year aimed at eroding the US stealth advantage, following earlier disclosures on anti-drone lasers and AI-assisted targeting chains. Independent verification of real-world performance remains unavailable, but the publication adds to a growing body of PLA-linked counter-stealth sensing research Western analysts are tracking closely.","source":"South China Morning Post","url":"https://www.scmp.com/topics/south-china-sea"},{"headline":"US Officials Judge Chinese Invasion of Taiwan Unlikely Before 2028","body":"Current US intelligence assessments reportedly hold that a Chinese move to seize Taiwan is unlikely before 2028, even though Xi Jinping has directed the PLA to be ready by 2027, with officials pointing to disruption from ongoing anti-corruption purges and Beijing's interest in the outcome of Taiwan's 2028 election. China's foreign ministry dismissed the assessment on October 6, insisting the Taiwan question is an internal matter that 'brooks no external interference.' The same briefing saw Beijing renew objections to Taiwan's delivery of new F-16V fighters from the United States, with 64 more jets due within the year.","source":"Council on Foreign Relations","url":"https://www.cfr.org/global-conflict-tracker/conflict/confrontation-over-taiwan"}]},"europe":{"ukraineRussia":[{"headline":"Russian Glide Bomb Kills at Least 33 in Kramatorsk Bus Strike","body":"Russia struck two buses in Kramatorsk with a guided glide bomb, killing at least 33 people in one of the deadliest single strikes on Ukrainian civilians this fall. The attack came amid a broader bombardment that knocked out power, water and metro service across parts of Kyiv and killed additional civilians in Poltava and Kirovohrad oblasts. Ukraine's General Staff separately reported that Russian losses have now topped 1.5 million troops killed or wounded since the February 2022 invasion began.","source":"Kyiv Independent","url":"https://kyivindependent.com/"},{"headline":"Ukraine Hits Russian Cruise-Missile Fuel Plant as Moscow's Oil Revenue Craters","body":"Ukrainian forces struck a factory in Russia's Tver Oblast overnight that produces fuel components for Kh-55 and Kh-101 cruise missiles, part of a deep-strike campaign Kyiv's defense ministry says has disabled more than half of Russia's oil-refining capacity. The pressure compounds a fiscal squeeze: Russia's finance ministry says oil and gas revenue missed its September target by roughly $118 million, pushing the Kremlin to accelerate foreign-currency and gold purchases into early November. The strikes continue even as Washington pushes for a trilateral US-Ukraine-Russia meeting by month's end, with Kyiv noting Trump has separately urged it to ease refinery attacks that are propping up global diesel prices.","source":"Kyiv Independent / CNBC","url":"https://kyivindependent.com/"}],"europe":[{"headline":"NATO Launches Nuclear Drill as Report Warns Alliance Losing Ground in Russia's 'Shadow War'","body":"NATO's annual nuclear-deterrence exercise, Steadfast Noon, begins Tuesday from five Italian air bases involving roughly 60 aircraft, a long-planned test Secretary General Mark Rutte calls a signal of 'unity and resolve.' The drill follows an Atlantic Council report published this week urging the alliance to adopt a more confrontational posture toward Russian sabotage, cyberattacks and drone incursions that have multiplied across member states. Visiting Portugal, Secretary of State Marco Rubio also pressed allies to keep raising defense budgets, framing the pressure as reinforcing rather than undermining deterrence.","source":"NATO / Stars and Stripes","url":"https://www.nato.int/en/news-and-events/articles/news/2026/10/08/nato-holds-annual-nuclear-exercise-steadfast-noon"},{"headline":"EU Braces for Winter Gas Shortfall of Up to 15 Percent","body":"European officials are warning of a 12-15 percent natural gas supply shortfall heading into winter, reviving fears of price spikes as the continent's energy crisis grinds into a fifth year. The alert lands alongside mounting political strain elsewhere: Italy's parliament approved an electoral overhaul, Spain's prime minister called a snap election for November 29, and Paris saw fresh student unrest over under-resourced schools. Together the developments show energy security, not only the war next door, dominating European governments' bandwidth this winter.","source":"Rio Times - Europe Intelligence Brief","url":"https://www.riotimesonline.com/europe-intelligence-brief-friday-october-9-2026/"}]},"middleEast":[{"headline":"Houthi Strikes on Riyadh Airport Kill Saudia Pilot, Two Others in Third Straight Day of Attacks","body":"Yemen's Houthi movement struck Riyadh's King Khalid International Airport for a third consecutive day, killing Saudia pilot Hamoud Ali Al-Kalthami and two others after one strike hit airport facilities and a second hit a parked Saudia aircraft. Coalition forces responded by destroying Houthi rocket launchers, while Pakistan's prime minister publicly voiced solidarity with Riyadh. The Houthis say the campaign will continue as their broader offensive toward Sanaa intensifies, raising the stakes for Gulf aviation and oil infrastructure.","source":"Arab News","url":"https://www.arabnews.com/"},{"headline":"Trump Rules Out Iran Strikes Before Midterms as Pentagon Preps Contingency Plans","body":"President Trump said this week the US will not resume strikes on Iran before November's midterm elections, citing unspecified 'productive conversations' with Tehran, a pledge that eased crude price pressure. Despite the assurance, the Pentagon has reportedly drawn up plans for a potential three-day campaign against Iran, and three US aircraft carriers are expected to converge on the region soon. Israeli military chief Eyal Zamir warned that renewed conflict with Iran could force Israel to delay its upcoming elections.","source":"CBS News / Jerusalem Post","url":"https://www.cbsnews.com/live-updates/iran-war-nuclear-donald-trump-vance-rubio-strait-of-hormuz/"},{"headline":"Hamas Views Survival as 'Victory,' Readies for Possible Gaza City Offensive","body":"A security official tells the Jerusalem Post that Hamas considers its continued existence against the IDF a win and still believes Israel's destruction is achievable, even though Israeli forces now control roughly 70 percent of the Gaza Strip. The group is reportedly preparing for a renewed Israeli push into Gaza City. Separately, the UN says nearly all of Gaza's population now needs emergency shelter as seasonal flooding tied to El Nino threatens displacement camps.","source":"Jerusalem Post","url":"https://www.jpost.com/middle-east"}],"techAI":{"aiCompetition":[{"headline":"SpaceX, Oracle and Broadcom Chase Tens of Billions in Debt to Fund AI Buildout, Spooking Lenders","body":"Reporting this week shows SpaceX, Oracle, and Broadcom are seeking enormous debt packages from private lenders to finance AI chip purchases, with potential creditors growing hesitant. A roughly $60 billion Broadcom package would partly benefit Anthropic, while Oracle is pitching investors on funding a separate chip-leasing vehicle; Apollo is expected to lead SpaceX's financing with Pimco also circling, and Oracle is in talks with Apollo and Goldman Sachs. No public repayment terms have surfaced for any of the proposed deals, fueling fresh worries about an AI infrastructure debt bubble even as Anthropic and OpenAI valuations sit near $965 billion and $852 billion respectively ahead of expected IPOs.","source":"Bloomberg via AI to ROI","url":"https://ai2roi.substack.com/p/ai-to-roi-news-and-analysis-october-146"},{"headline":"Ex-ByteDance Intern's Stealth World-Models Startup Raises $30M at $200M Valuation","body":"Tian Keyu, a former ByteDance intern, has raised close to $30 million from investors including Moonshot-backer 5Y Capital and IDG Capital for a nameless, product-less stealth research lab now valued at $200 million. The venture is positioning itself to compete in the emerging 'world models' field against established figures like Fei-Fei Li, underscoring how China-linked AI talent and capital continue flowing into frontier research even amid US export controls and distillation disputes. The deal, reported October 7-8, signals growing investor appetite for pre-product world-model bets as a potential next frontier beyond large language models.","source":"Bloomberg","url":"https://bloomberg.com/news/articles/2026-10-07/ex-bytedance-intern-s-200-million-ai-lab-takes-on-fei-fei-li"}],"cyberEmerging":[{"headline":"DOJ and FBI Seize Domains Behind China's Flax Typhoon Hacking Tools","body":"The Justice Department and FBI announced court-authorized seizures of seven internet domains supporting 'Microscan' and 'FishHub,' two hacking tools allegedly built and operated by Beijing-based Integrity Technology Group for the state-linked Flax Typhoon hacking group. Court documents unsealed in the Western District of Pennsylvania tie the tools, which ran on a Mirai-variant IoT botnet, to intrusions against a South Carolina power company, airports in Japan and Poland, Taiwanese gas and electric infrastructure, two Taiwanese universities, and an international NGO. Assistant Attorney General John Eisenberg said the National Security Division will keep disrupting Flax Typhoon's infrastructure to protect networks underpinning US security.","source":"Associated Press / DOJ","url":"https://www.justice.gov/opa/pr/justice-department-and-fbi-seize-platforms-operated-and-used-china-state-sponsored-hackers"},{"headline":"Anthropic Launches 'Cyber Mission' Pairing Free AI Bug-Hunting with Critical-Infrastructure Defense","body":"Anthropic unveiled its Cyber Mission on October 8, combining a free, opt-in OSS Scanner that emails open-source maintainers unreviewed, Claude-generated vulnerability reports—expected to exceed a 90% true-positive rate—with a Critical Infrastructure Defense Program enlisting 11 founding partners including Accenture, Booz Allen, Dragos, Nozomi Networks, CrowdStrike, Hitachi and Rockwell Automation. The program targets operational-technology environments like power grids and water systems where legacy equipment often can't be patched for years, aiming to give defenders an AI-driven edge as attackers increasingly weaponize agentic AI for reconnaissance and exploitation. Anthropic says its models have already flagged over 29,000 candidate vulnerabilities since November, with thousands reviewed by outside security firms.","source":"SecurityWeek / SiliconANGLE","url":"https://www.securityweek.com/anthropic-fast-tracks-ai-bug-reports-to-oss-maintainers-taps-11-firms-for-ot-security/"}]},"cities":{"lasVegas":[{"headline":"Wrong-way crash near Las Vegas Motor Speedway kills two","body":"Nevada Highway Patrol says two people died early Friday morning in a wrong-way collision close to the Las Vegas Motor Speedway, the latest in a string of fatal valley crashes this week. A separate rollover crash off Interstate 11 near Boulder City also killed a man on Thursday. The back-to-back fatalities add to a string of recent high-casualty wrecks on Southern Nevada highways.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"'Loaded Dice' operation nets 144 arrests tied to Mexican cartels","body":"A multi-agency law enforcement sweep dubbed 'Loaded Dice' resulted in 144 arrests across the Las Vegas area, with officials saying many suspects have ties to Mexican drug cartels. The operation underscores growing concern among Nevada officials about cartel-linked trafficking networks operating in and around the valley. Details on specific charges and agencies involved are still emerging.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Nevada's once-flagship Crescent Dunes solar plant sold for a fraction of its value","body":"The Crescent Dunes solar facility near Tonopah, once touted as a first-of-its-kind concentrated solar project, has been sold for cents on the dollar after years of leaks, operational failures and two bankruptcies. The plant's collapse marks a cautionary tale for large-scale renewable energy bets in the Nevada desert. It had been held up nationally as a clean-energy blueprint before its technical troubles mounted.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"$185M construction contract awarded for Nellis, Creech and NTTR infrastructure","body":"North Las Vegas-based Weldin Construction LLC has been awarded a ceiling $185 million indefinite-delivery/indefinite-quantity contract for base engineering work spanning Nellis Air Force Base, Creech Air Force Base and the Nevada Test and Training Range, with work expected to run through September 2031. The Air Force obligated an initial $2,089,542 in fiscal 2026 operations and maintenance funds, with the 99th Contracting Squadron at Nellis managing the award. The long-horizon deal signals sustained Pentagon investment in Southern Nevada's test and training infrastructure as Creech continues trials of Collaborative Combat Aircraft like the YFQ-42A and YFQ-44A alongside Nellis's broader Warfare Center mission.","source":"ClearanceJobs","url":"https://news.clearancejobs.com/2026/10/07/space-systems-command-adds-9-4m-to-aegis-aerospace-contract/"}]},"feelGood":[{"headline":"Airmen execute rapid rescue of downed Navy helicopter crew","body":"U.S. Air Force Airmen carried out a swift rescue operation to save a Navy helicopter crew, according to a recent release highlighted among Nellis Air Force Base news. The incident showcases the search-and-rescue readiness that remains a point of pride for Nevada-based Air Force units even as legacy rescue squadrons have been reorganized. Details on the specific unit and location of the rescue were included in official Air Force reporting.","source":"Nellis Air Force Base Public Affairs","url":"https://www.nellis.af.mil/Nellis-News/News-Releases/"},{"headline":"Strangers unite for week-long search that reunites dogs with owner after crash","body":"After a car crash separated two dogs, Tobey and Bailey, from their owner, a community of strangers banded together for a week-long search effort across the area. The chase ended in a joyful reunion, with local volunteers and the owner celebrating after fearing the worst for the frightened animals. The story became a local highlight of neighbors stepping up for someone they'd never met.","source":"12 On Your Side","url":"https://www.12onyourside.com/news/acts-of-kindness/"},{"headline":"Navy veteran known as 'Bike Guy' becomes the glue of his community","body":"Don Mitchim, a Navy veteran and former electrician, has become a fixture in his Prince George-area community through small, consistent acts of kindness that neighbors say have brought people closer together. Known affectionately as the 'Bike Guy,' Mitchim's quiet generosity has turned him into a trusted presence many residents say they can always count on. His story was recognized as a local acts-of-kindness feature celebrating everyday humanity.","source":"12 On Your Side","url":"https://www.12onyourside.com/news/acts-of-kindness/"}],"onThisDay":[{"year":"1446","event":"Korea's King Sejong proclaimed the Hangul alphabet, now celebrated as Hangul Day."},{"year":"1888","event":"The Washington Monument officially opened to the public in Washington, D.C."},{"year":"1967","event":"Revolutionary Che Guevara was executed in Bolivia after being captured by government forces."},{"year":"2006","event":"North Korea announced it had conducted its first nuclear weapons test."}]},"topPicks":[{"headline":"Russian Glide Bomb Kills at Least 33 in Kramatorsk Bus Strike","teaser":"A deadly glide bomb attack on a civilian bus in Kramatorsk underscores escalating Russian strikes on Ukrainian population centers."},{"headline":"US and Japan to Stage Largest-Ever Keen Sword Drill Near Taiwan","teaser":"Record-scale US-Japan military exercises near Taiwan signal deepening deterrence efforts amid rising tensions with China."},{"headline":"Congressional report: 81 US aircraft lost or damaged in Iran war, costing up to $3.3 billion","teaser":"A new congressional report reveals massive, previously unclear US aircraft losses from the Iran conflict, raising oversight questions."}]},"navDates":[{"key":"2026-10-09","label":"Oct 9","href":"/","isNewest":true},{"key":"2026-10-08","label":"Oct 8","href":"/archive/2026-10-08.html","isNewest":false},{"key":"2026-10-07","label":"Oct 7","href":"/archive/2026-10-07.html","isNewest":false},{"key":"2026-10-06","label":"Oct 6","href":"/archive/2026-10-06.html","isNewest":false},{"key":"2026-10-05","label":"Oct 5","href":"/archive/2026-10-05.html","isNewest":false},{"key":"2026-10-04","label":"Oct 4","href":"/archive/2026-10-04.html","isNewest":false},{"key":"2026-10-03","label":"Oct 3","href":"/archive/2026-10-03.html","isNewest":false}],"currentKey":"2026-10-09","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
