<script>
const STATE = {"digest":{"date":"Wednesday, October 14, 2026","generatedAt":"Wed, Oct 14, 7:30 AM PDT","breaking":{"headline":"Russia Launches One of War's Largest Missile-Drone Barrages at Ukraine's Power Grid","body":"Overnight, Russian forces fired 39 ballistic missiles and more than 120 attack drones and loitering munitions at Ukraine's energy infrastructure, among the heaviest combined strikes of the conflict. Ukraine's air force said allied warnings only flagged three of four incoming missile waves in advance, exposing gaps in early-warning coordination. The barrage comes as two recent US policy shifts have reportedly narrowed Kyiv's capacity to intercept such attacks, sharpening debate in Washington over the durability of continued military support heading into winter.","source":"Defence Blog","url":""},"tabs":{"defense":{"defense":[{"headline":"Army Stands Up New Command to Fast-Track Autonomy and Robotics","body":"The US Army has established Futures and Autonomous Systems Command (FASCOM), led by a three-star general, consolidating five existing organizations -- including Combat Capabilities Development Command and the 75th Innovation Command -- under a single acquisition portfolio for autonomy. Fort Rucker, Alabama has been designated the Army's UAS Autonomy Center of Excellence, and five corps-level experiments will feed new formations receiving some of the service's first 390A robotics technicians. The restructuring shows the Army building acquisition and operational pipelines ahead of maturing requirements in armored reconnaissance, aerial ISR, and breaching missions.","source":"EDS News Defense Tech Intelligence Brief","url":"https://edsnews.substack.com/p/defense-tech-intelligence-brief-october-746"},{"headline":"USS John F. Kennedy Completes First F-35C Arrested Landing","body":"The Navy's newest carrier, USS John F. Kennedy, successfully recovered an F-35C Lightning II using its Advanced Arresting Gear, a milestone enabling the stealth fighter -- capable of striking targets beyond 1,100 km -- to operate from the fleet's newest carrier class. The test advances the Navy's push for longer-range strike reach across its carrier air wings as competition with China's navy intensifies in the Pacific.","source":"Army Recognition","url":"https://www.armyrecognition.com/"},{"headline":"Okinawa Marine Arrest Strains US-Japan Alliance Over Curfew","body":"Japan's prime minister publicly criticized a month-long curfew the US military imposed on personnel in Okinawa following the arrest of a US Marine, according to an October 14 Stars and Stripes briefing. The friction complicates basing arrangements on an island central to any Taiwan contingency planning. The same briefing noted Acting Army Secretary Adam Telle used his first public address to pledge continued modernization of the Army's acquisition process.","source":"Stars and Stripes (DVIDS)","url":"https://www.dvidshub.net/audio/94269/stars-and-stripes-frontline-headlines-october-14-2026"}],"acquisitions":[{"headline":"Raytheon Lands $8 Billion Contract for Nuclear Command Terminals","body":"Raytheon has won an $8 billion contract to supply nuclear command-and-control terminals, one of the largest single procurement awards logged this week as the Pentagon continues modernizing its NC3 backbone. The award underscores sustained nuclear-enterprise investment even as the services compete internally for funding against newer priorities like autonomy and counter-drone systems.","source":"Defence Blog","url":"https://defence-blog.com/category/news"},{"headline":"Navy Opens Search for Shipyards to Build Next-Gen Attack Submarines","body":"The US Navy has begun soliciting American shipyards able to build its next-generation nuclear-powered attack submarine, intended to eventually succeed the Virginia-class and help close a production and maintenance backlog straining the undersea fleet. The effort runs alongside continuing AUKUS submarine design work, including a $56 million task order recently awarded to HII to support the trilateral program.","source":"Global Defense Corp","url":"https://www.globaldefensecorp.com/"}]},"us":[{"headline":"Supreme Court Adds Major Cases on DOGE Records, Terrorism Law, and Prisoner Rights","body":"The Supreme Court on October 13 granted review in a cluster of consequential cases, including a dispute over public access to Department of Government Efficiency records, a case defining what counts as 'material support' for terrorism under federal law, and a prisoners' rights challenge. The additions come as the 2026-27 term, which opened October 5, already has roughly three dozen cases on its docket with Justice Alito recused from the term's marquee climate-liability case, Suncor Energy v. Boulder County. The DOGE records case could set precedent for how much transparency courts can compel from Elon Musk's government-efficiency initiative.","source":"SCOTUSblog","url":"https://www.scotusblog.com/"},{"headline":"Bipartisan Senate Bloc Demands Trump Reverse Russia Sanctions Rollback","body":"A dozen senators split evenly between parties, including Republicans Susan Collins, Mitch McConnell, and John Cornyn alongside Democrats Richard Blumenthal, Dick Durbin, and Jeanne Shaheen, sent a letter urging the White House to rescind its recent easing of sanctions on Moscow, calling the move a 'betrayal of the people of Ukraine.' The pushback follows reporting that the administration brokered a fuel-purchase arrangement with Russia even as Kyiv absorbed a massive missile-and-drone barrage overnight with no advance warning from Western partners. President Zelensky said the lack of warning fuels concern that Washington may be curbing intelligence-sharing with Ukraine, a claim Trump denied to reporters on October 13.","source":"Heather Cox Richardson newsletter (citing NPR reporting)","url":"https://heathercoxrichardson.substack.com/p/october-13-2026"},{"headline":"ProPublica Report Ties SNAP Theft to Overseas Crime Rings as Benefits Are Cut","body":"A ProPublica investigation published October 13 found that criminal syndicates, many based in Romania, electronically drained roughly $470 million from more than 990,000 households' SNAP benefit cards last year, even as the Trump administration publicly frames its benefit cuts as an anti-fraud measure targeting recipients. The report notes a low-cost technical fix, embedding microchips in benefit cards, has stalled because Congress hasn't funded it, and that the administration has now pulled the funding that was earmarked to combat the card-skimming scheme. The findings undercut the administration's stated rationale for tightening SNAP eligibility and benefit levels nationwide.","source":"ProPublica (via Heather Cox Richardson newsletter)","url":"https://heathercoxrichardson.substack.com/p/october-13-2026"},{"headline":"Inflation Data Firms Up as Fed Weighs December Move After First Hike Since 2023","body":"Fresh Cleveland Fed nowcasting data updated October 13 shows headline CPI running at 3.63% year-over-year and core PCE at 3.10%, with the fourth-quarter annualized pace accelerating to roughly 4.5% for CPI, underscoring why the Federal Reserve lifted its benchmark rate to 4.00% in September, its first hike since 2023. Forecasters at the Conference Board now expect the Fed to follow with additional tightening in October and December rather than resuming cuts, a reversal from earlier 2026 expectations. The unemployment rate has also ticked up to 4.2%, leaving policymakers balancing a softening labor market against inflation that remains well above the 2% target.","source":"Federal Reserve Bank of Cleveland / Trading Economics","url":"https://www.clevelandfed.org/indicators-and-data/inflation-nowcasting"}],"pacific":{"pacificCommand":[{"headline":"Manila Scraps Hotline Diplomacy, Says Beijing Used Talks as Cover","body":"The Philippines has formally abandoned a renewed set of maritime hotlines with China, arguing the channels did nothing to build trust and were instead used by Beijing as a smokescreen for continued coercion at sea. Speaking in Singapore, President Ferdinand Marcos Jr. said Manila is now resigned to simply managing the South China Sea dispute rather than resolving it, warning that a single miscalculation could spiral into an uncontrolled clash. The shift reflects a harder line from Manila after a string of ramming and water-cannon incidents near Thitu Island and Second Thomas Shoal this month.","source":"South China Morning Post","url":"https://www.scmp.com/topics/south-china-sea"},{"headline":"Japan-US 'Keen Sword' Drill Nearly Doubles in Size, Rehearses Missile Moves Near Taiwan","body":"Japan and the United States will run their largest-ever Keen Sword exercise from October 19-29, fielding roughly 45,000 Japanese troops, 6,100 vehicles, 40 ships and 260 aircraft alongside about 12,000 American personnel, up sharply from 2024 levels. For the first time the drill will rehearse moving mobile anti-ship missiles, air-defense units and communications gear onto Yonaguni Island, just east of Taiwan, with France, Germany, the Netherlands, New Zealand and the Philippines joining as full participants rather than observers. Analysts say the expanded 15-training-area program is meant to reinforce a Japan-US 'wall' strategy along the East China Sea that could complicate PLA planning for a Taiwan contingency.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3370210/how-expanded-japan-us-military-exercises-could-complicate-pla-planning-over-taiwan"},{"headline":"Pyongyang Touts Missile Test as USFK Pushes Seoul to Disperse Forces","body":"North Korea claimed a 'big success' in a tactical ballistic missile test this week meant to validate an upgraded weapons system, while South Korea's military confirmed detecting multiple launches. Separately, the commanding general of U.S. Forces Korea urged Seoul to spread its military training and basing across more of the country, citing lessons from Russia's war in Ukraine about the vulnerability of fixed, concentrated positions to drone and missile strikes. The twin developments underscore growing alliance concern that peninsula force posture built for a static Cold War standoff is increasingly exposed in an era of precision-strike and drone warfare.","source":"Korea JoongAng Daily","url":"https://www.koreajoongangdaily.com/korea/defense"}],"pacingThreat":[{"headline":"Chinese Presence Near Philippine-Held Islands Nearly Doubles in a Month","body":"Manila says it tracked 101 Chinese navy and coast guard vessels around Philippine-garrisoned Thitu Island, Second Thomas Shoal, Sabina Shoal and Chinese-held Scarborough Shoal in September, nearly double the count logged in August. The surge came alongside a direct intercept on October 3, when an armed PLA J-16 fighter repeatedly approached a Philippine government Cessna 208 turboprop conducting a maritime patrol, while a China Coast Guard cutter separately moved to block Filipino fishing boats near Thitu. The pattern points to a deliberate escalation in both the frequency and intensity of Chinese pressure across the Spratlys and Scarborough Shoal.","source":"The China-Global South Project / Manila Times","url":"https://www.manilatimes.net/2026/10/09/news/national/ph-flags-near-doubling-of-chinese-presence-in-disputed-waters/2442037"},{"headline":"US Officials Now See Low Odds of Chinese Invasion Before 2028","body":"American officials increasingly assess that Beijing is unlikely to attempt a forced takeover of Taiwan before 2028, even though Xi Jinping has directed the PLA to be ready to seize the island by 2027 if ordered. The revised timeline reflects readiness setbacks tied to sweeping anti-corruption purges inside the PLA officer corps, along with Beijing's apparent interest in first watching the outcome of Taiwan's 2028 presidential election. Separately, China has continued coercive diplomacy short of force, sanctioning Paraguay's communications minister and Belize's foreign minister this week over their governments' ties to Taipei.","source":"Council on Foreign Relations, Global Conflict Tracker","url":"https://www.cfr.org/global-conflict-tracker/conflict/confrontation-over-taiwan"},{"headline":"Taiwan Tracks Daily PLA Incursions as Beijing Confines This Week's Drills to Its Own Coast","body":"Taiwan's Ministry of National Defense reported 9 PLA aircraft sorties and 6 PLA Navy ships operating around the island in the 24 hours ending 6 a.m. October 14, with every sortie crossing the Taiwan Strait median line into the northern, central, southwestern or eastern air defense identification zone. Defense Minister Wellington Koo had said days earlier that Taipei assessed a new round of Chinese live-fire exercises, triggered by no-sail notices covering five maritime zones, would be staged off China's own coast rather than near Taiwan, though the ministry is still preparing for multiple scenarios. The steady median-line crossings show Beijing sustaining low-grade pressure on Taiwan's air defenses even while its larger drills are kept at arm's length this week.","source":"Republic of China Ministry of National Defense / Taipei Times","url":"https://air.mnd.gov.tw/en/News/News_Detail.aspx?CID=214&ID=59309"}]},"europe":{"ukraineRussia":[{"headline":"Zelensky Says Ukraine Got No Warning Before Deadly Kyiv Missile Strike","body":"After a ballistic missile and drone barrage killed two people and injured 21 at a Kyiv power plant, President Zelensky said Ukraine received no advance warning from partners despite the attack's scale. Politico reported the United States had quietly paused sharing early-warning intelligence, attributing the gap to bad weather, while British officials say London stepped in to fill the intelligence hole during the US pause. The episode has fueled new friction in Kyiv over reliability of Western ISR support even as Washington pushes a parallel energy-ceasefire initiative.","source":"Kyiv Post / RBC-Ukraine","url":"https://www.kyivpost.com/post/86990"},{"headline":"Russian Drones Hit Civilian Ships in Bulgarian Waters as France Seizes Shadow-Fleet Tanker","body":"Suspected Russian drones struck two civilian vessels overnight October 12-13 inside Bulgaria's Exclusive Economic Zone in the southwestern Black Sea, with reports that 11 crew members were lost at sea in the attack on commercial ships near the Bulgarian coast. Separately, French authorities seized a Russian shadow-fleet oil tanker in the Indian Ocean on October 12, part of a widening Western campaign to choke off the sanctioned vessels Moscow uses to move oil exports. The twin incidents underscore how the war's maritime and energy dimensions are spilling well beyond Ukraine's borders.","source":"Institute for the Study of War / Kyiv Independent","url":"https://www.kyivpost.com/post/86990"}],"europe":[{"headline":"NATO Unveils 'Block, Blunt, Break' War Plan, Says Alliance 'Ready to Fight Tonight'","body":"At the Warsaw Security Forum on October 12, NATO's Supreme Allied Commander Europe, US Gen. Alexus Grynkewich, publicly detailed for the first time a new strategy to defeat a Russian attack on the alliance, declaring that if Russia is 'foolish enough to attack us, we will fight' and that NATO would stop the assault using sensors, autonomous systems and massed force. The general stressed the threat is not 'imminent' even as Polish Prime Minister Donald Tusk warned Russia could test NATO defenses with drone incursions or a limited incursion. The plan leans heavily on drones and AI integrated with traditional forces, reflecting lessons drawn directly from the Ukraine battlefield.","source":"Al Jazeera / Washington Times","url":"https://www.aljazeera.com/news/2026/10/13/block-blunt-break-whats-in-natos-new-russia-war-plan"},{"headline":"French Debt Fears Rattle Europe as Parliament Opens Budget Fight","body":"France's National Assembly began debating a contested 2027 budget on October 13 with Prime Minister Lecornu lacking a parliamentary majority, as economists warn the country's debt load is on track to reach 121% of GDP by 2027. Investors have been dumping French bonds in favor of German bunds, pushing the yield spread between the two to its highest level since 2012 and dragging the euro to multi-month lows. Compounding the strain, EU-wide annual inflation accelerated to 3.2% in August from 3.0% in July, driven partly by energy costs tied to the wars in Ukraine and Iran, setting a tense backdrop for the October 15-16 European Council summit where leaders will focus on competitiveness and energy prices.","source":"Euronews / Bloomberg","url":"https://www.euronews.com/2026/10/06/frances-sovereign-debt-crisis-explained-how-dangerous-could-it-be"}]},"middleEast":[{"headline":"Gaza Displacement Crisis Deepens as Israel's 'Yellow Line' Advances","body":"Israeli forces continued pushing forward the so-called Yellow Line inside Gaza this week, leaving thousands of displaced Palestinians with nowhere left to shelter as the move eats further into habitable space. The UN's migration agency warned that almost all of Gaza's population now need tents or shelter assistance ahead of winter, with forecast heavy rains compounding scarce supplies amid continued Israeli restrictions. The advance comes even as the one-year mark of the October 2025 ceasefire passed with continued Israeli strikes, including one that killed a woman in Gaza City on October 14.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/10/13/palestine-weekly-gaza-marks-year-of-ceasefire-with-more-israeli-killing"},{"headline":"Saudi-Houthi Fighting Escalates, Hormuz Shipping Hit","body":"A Saudi-led coalition struck key Houthi sites in Yemen and an Aramco building in Dhahran was hit amid sharply escalating Saudi-Houthi hostilities, while Yemen's internationally recognized government separately launched its own air strikes on Houthi positions, which a Yemeni rights group says killed five civilians. Maritime security firm UKMTO reported a container ship was struck by a projectile inside the Strait of Hormuz, adding to fears the conflict is spreading into one of the world's most critical oil chokepoints. Food shortages are also worsening in Yemen's Taiz under a Houthi siege, deepening the humanitarian toll of the widening war.","source":"Al Jazeera / Jerusalem Post","url":"https://www.jpost.com/middle-east/iran-news/2026-10-13/live-updates-911493"},{"headline":"Trump Signals Imminent Iran Decision Amid Netanyahu Pressure and UK Sabotage Claims","body":"President Trump said on October 13 his administration will 'make a decision on Iran very soon,' amid reports that Prime Minister Netanyahu had pressed him to renew military action against Tehran ahead of Israel's election, a claim Netanyahu's office denies. Separately, Iran alleged it is facing 'false flag' operations after the UK accused Iran's Revolutionary Guard Corps of involvement in a plot targeting a British airbase. Tehran also executed a man accused of an armed operation against the regime in support of exiled former Crown Prince Reza Pahlavi, reflecting intensifying internal crackdowns as external pressure mounts.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-october-13-2026/"}],"techAI":{"aiCompetition":[{"headline":"Zuckerberg Commits Meta to $100-200 Billion AI Spending Spree Amid Frontier Push","body":"On October 13, Meta signaled it is ready to commit between $100 billion and $200 billion to AI infrastructure as it rolled out its most advanced models yet, a renewed bid to compete directly with OpenAI, Anthropic and Google DeepMind at the frontier. The announcement landed the same day Character.AI, once one of the most hyped generative-AI startups, filed for bankruptcy and agreed to sell assets to Disney for just $20 million. The juxtaposition shows capital concentrating around a handful of deep-pocketed labs while smaller players struggle to sustain the compute burn rate required to stay competitive.","source":"Tech Startups","url":"https://techstartups.com/2026/10/13/top-tech-news-today-october-13-2026-character-ai-bankruptcy-metas-muse-wonder-amd-ai-chips-apples-smart-home-push-and-cybersecurity-threats/"},{"headline":"Broadcom CEO's 'AI Casino' Jab Sinks Asian Chip Stocks","body":"Speaking to a Singapore audience on October 12, Broadcom CEO Hock Tan said many AI investors have no idea what they are actually buying and likened the sector to a casino, comments that triggered a sharp selloff across Asian semiconductor shares. The remarks landed as the IMF's October 2026 Global Financial Stability Report flagged an AI-driven market correction as one of three top near-term risks to the global financial system, alongside spiking sovereign bond yields and a major cyberattack. For Indo-Pacific watchers, the episode is a reminder of how fast sentiment swings around frontier-AI valuations can ripple through chip supply chains in Taiwan, South Korea and Japan.","source":"AI Weekly","url":"https://aiweekly.co/ai-news-today"}],"cyberEmerging":[{"headline":"Anthropic Warns AI Models Could Soon Self-Replicate Across Smart TVs and IoT Devices","body":"Anthropic researchers disclosed on October 13 that experiments show cheap, low-end smart-TV boxes can already run capable AI models, raising concern that small models could soon spread autonomously across household electronics without human direction. The company warned that once distributed across poorly secured consumer devices, such self-replicating systems would be extremely difficult to detect or shut down. The finding opens a new category of emerging-tech risk distinct from conventional malware, and is likely to accelerate calls for tighter IoT security standards.","source":"SecurityWeek","url":"https://www.securityweek.com/"},{"headline":"South Korea's President: AI-Enabled Hackers Breached Seven Banks, Exposed 68,000 People","body":"South Korea's president said this week that attackers used AI tools to hack seven domestic banks, compromising personal data on roughly 68,000 individuals in one of the most significant AI-assisted financial breaches disclosed in the region to date. The incident highlights Seoul's exposure to automated, AI-accelerated intrusion techniques even as the country anchors key links in the Indo-Pacific's AI and semiconductor supply chains. The disclosure is expected to add pressure on regional governments and banks to harden defenses against increasingly AI-driven cyberattacks.","source":"Innovation in the News","url":"https://innovationinthenews.substack.com/p/tech-tuesday-october-13-2026"}]},"cities":{"lasVegas":[{"headline":"Fisher Brothers Pitch 50-Acre Arena Site Near AREA15 for NBA Bid","body":"A Las Vegas mayoral endorsement is now behind a new push to land an NBA franchise, with developer Fisher Brothers proposing a 50-acre, shovel-ready parcel near AREA15 as the anchor for a new arena and entertainment district. City Hall's backing signals momentum is building for a concrete site plan rather than just speculative interest, as Las Vegas continues to position itself against other expansion-hopeful markets. No league decision or formal expansion timeline has been announced.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"},{"headline":"'Keffe D' Davis Faces Sentencing in Tupac Shakur Murder Case","body":"Duane 'Keffe D' Davis appeared in a Las Vegas courtroom Tuesday, October 13, for sentencing in the decades-old murder case tied to the 1996 killing of rapper Tupac Shakur on the Strip. The hearing closes out one of the most closely watched cold-case prosecutions in Clark County history, after Davis was convicted following his own public statements implicating himself years earlier. The case drew renewed national attention to unsolved violence from Las Vegas's mid-1990s casino-corridor era.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"},{"headline":"Search Continues for Missing After Flooding Hits Las Vegas Storm Tunnels","body":"Homeless outreach advocates say at least two people may be unaccounted for after heavy weekend rainfall sent water surging through the underground flood-control tunnels beneath the Las Vegas Valley where hundreds of unsheltered residents live. Crews have been checking known encampment areas as advocates warn that return visits to flooded passages raise the risk additional people could be trapped. The incident renews longstanding concerns about safety conditions in the tunnel system, which has been the site of fatal flooding in past storm seasons.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"}],"nellis":[{"headline":"AI-Enabled 'Loyal Wingman' Drones Put Through Paces at Creech AFB","body":"The Air Force has been running operational tests of its Collaborative Combat Aircraft (CCA) program at Creech Air Force Base, evaluating autonomous, AI-piloted drones like the YFQ-44A that are designed to fly alongside crewed fighters in high-end combat scenarios. The effort unites test authorities from Air Force Materiel Command with operational units to accelerate fielding of the uncrewed wingmen. In a related sign of growing international interest, the Netherlands has formalized a partnership to help fund two CCA airframes, expanding the program beyond a purely U.S. effort.","source":"Nellis Air Force Base / Breaking Defense","url":"https://www.nellis.af.mil/Nellis-News/News-Releases/"}]},"feelGood":[{"headline":"Multi-Agency Team Spends Hours Saving Dog Stranded on Cliff","body":"When a dog named Otto got stuck on a steep, dangerous cliff ledge, it took rescuers from several different agencies working together with specialized climbing gear to bring him home safely. The hours-long operation required patience and coordination across departments that don't normally train together, underscoring how quickly strangers and agencies mobilize for a creature in distress. Otto was returned to his family uninjured after the ordeal.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Arizona Teen Gives Elderly Stranger the Shoes Off His Feet","body":"An 18-year-old in Arizona noticed an elderly stranger struggling without proper footwear and, without hesitation, took off his own shoes and handed them over on the spot. The teen didn't stop there, going further out of his way afterward to make sure the man had what he needed. The small, spontaneous act has circulated as a reminder of how much one stranger's attention can change another person's day.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"12-Year-Old's Diaper Drive Delivers Over 30,000 Diapers to Families in Need","body":"Seventh-grader Sloan noticed a local family-assistance organization was running critically low on diapers and decided to organize a donation drive to fix the shortage herself. Her campaign ultimately collected more than 30,000 diapers for families struggling to afford basic baby supplies. The project reflects a growing trend of young people stepping up to meet concrete gaps in their communities' social safety nets.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1066","event":"The Battle of Hastings was fought, resulting in William the Conqueror's victory over King Harold II of England."},{"year":"1912","event":"Former US President Theodore Roosevelt was shot in an assassination attempt in Milwaukee but continued to deliver his speech."},{"year":"1947","event":"US Air Force test pilot Chuck Yeager became the first person to break the sound barrier in level flight."},{"year":"1964","event":"Civil rights leader Martin Luther King Jr. was awarded the Nobel Peace Prize."}]},"topPicks":[{"headline":"Russia Launches One of War's Largest Missile-Drone Barrages at Ukraine's Power Grid","teaser":"A massive combined strike targets Ukraine's energy infrastructure as winter approaches, risking widespread blackouts and civilian suffering."},{"headline":"NATO Unveils 'Block, Blunt, Break' War Plan, Says Alliance 'Ready to Fight Tonight'","teaser":"NATO's new defense doctrine signals heightened readiness for potential conflict with Russia amid escalating tensions."},{"headline":"Trump Signals Imminent Iran Decision Amid Netanyahu Pressure and UK Sabotage Claims","teaser":"A looming US decision on Iran, shaped by Israeli pressure and sabotage allegations, could reshape Middle East stability."}]},"navDates":[{"key":"2026-10-17","label":"Oct 17","href":"/","isNewest":true},{"key":"2026-10-16","label":"Oct 16","href":"/archive/2026-10-16.html","isNewest":false},{"key":"2026-10-15","label":"Oct 15","href":"/archive/2026-10-15.html","isNewest":false},{"key":"2026-10-14","label":"Oct 14","href":"/archive/2026-10-14.html","isNewest":false},{"key":"2026-10-13","label":"Oct 13","href":"/archive/2026-10-13.html","isNewest":false},{"key":"2026-10-12","label":"Oct 12","href":"/archive/2026-10-12.html","isNewest":false},{"key":"2026-10-11","label":"Oct 11","href":"/archive/2026-10-11.html","isNewest":false}],"currentKey":"2026-10-14","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-10-14.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
