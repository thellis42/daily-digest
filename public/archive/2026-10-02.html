<script>
const STATE = {"digest":{"date":"Friday, October 2, 2026","generatedAt":"Fri, Oct 2, 8:48 AM PDT","breaking":{"headline":"Hegseth Unveils Sweeping Pentagon Overhaul: New Drone Command, Domestic Mega-Base, and Musk-Led War Study","body":"In a speech to troops at Marine Corps Base Quantico on October 1, Defense Secretary Pete Hegseth announced the Pentagon will stand up a new Autonomous Warfare Command led by a four-star general to oversee combat drone operations, formalizing an idea already included in this year's defense policy bill. He also opened a competition among U.S. states to host a newly built domestic military base, the first such installation since the 1980s, which could garrison up to 25,000 troops as a hub for homeland defense, cyber operations and command and control, with a siting plan due by the end of October. Hegseth additionally previewed Project Meridian, a 120-day review of future warfare co-led by Elon Musk, Anduril co-founder Palmer Luckey and former House Speaker Newt Gingrich, whose recommendations could shape the roughly $59.7 billion FY-27 space budget even though the study carries no formal policy authority.","source":"Federal News Network","url":"https://federalnewsnetwork.com/federal-newscast/2026/10/pentagon-wants-states-to-bid-on-the-next-great-american-base/"},"tabs":{"defense":{"defense":[{"headline":"Cotton Demands Review After F-35 Parts Transited Hong Kong","body":"Senate Armed Services Chairman Tom Cotton is pressing the Pentagon to review military shipping channels after it emerged that components bound for the F-35 fighter program passed through Hong Kong, a route that raises exposure to Chinese customs and intelligence services. The episode adds to lawmakers' broader worries about the security of the defense industrial base's logistics networks even as the Air Force tries to accelerate fighter deliveries.","source":"Inside Defense","url":"https://insidedefense.com/content/inside-air-force-october-2-2026"},{"headline":"Space Force Trims Golden Dome Interceptor Field, Stays Silent on Why","body":"Space Systems Command has narrowed the competition to build space-based interceptors for the Golden Dome missile-shield program, cutting the pool of contenders from 12 firms barely two months after officials signaled all participants looked likely to advance. The Space Force has declined to explain its selection criteria or confirm which companies remain, leaving industry to speculate about the future of a program central to the administration's homeland missile-defense push.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Poland Begins Receiving Italian-Built F-35s as NATO Modernization Push Continues","body":"Poland has started taking delivery of its second batch of F-35 Lightning II jets, this tranche assembled in Italy, after completing an initial batch of aircraft built in the United States. The milestone highlights how NATO's eastern-flank buildup increasingly relies on a multinational F-35 production network, as Warsaw continues a major air-force modernization drive amid persistent concern over Russian activity near its borders.","source":"Janes","url":"https://www.janes.com/defence-intelligence-insights/all-defence-news"}],"acquisitions":[{"headline":"Navy Awards Boeing More Than $20 Billion for F/A-XX Next-Gen Fighter","body":"After a long-delayed competition, the U.S. Navy has formally awarded Boeing a contract worth more than $20 billion to build the F/A-XX, its next-generation carrier-based strike fighter. Defense analysts caution that despite the award, the program still faces an uncertain path given tight budget dynamics and lingering skepticism in parts of the government toward sixth-generation fighter spending.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"RTX Secures Up to $24.4 Billion Multiyear Deal to Ramp SM-6 Missile Output","body":"The Navy has signed a multiyear procurement contract with RTX worth as much as $24.4 billion to accelerate production of the Standard Missile-6, a ship-launched interceptor used against aircraft, cruise missiles and ballistic-missile threats. The award follows a separate $20.7 billion AMRAAM production deal secured this week by RTX's Raytheon unit, as the U.S. and allied air forces race to rebuild munitions stockpiles drawn down by recent conflicts.","source":"Inside Defense","url":"https://insidedefense.com/"}]},"us":[{"headline":"Supreme Court Clears Alien Enemies Act Deportations as New Term Opens","body":"The Supreme Court allowed the Trump administration to resume removals of alleged gang members under the 18th-century Alien Enemies Act, a procedural win for the White House as the justices simultaneously fielded a separate emergency request from immigrants seeking to keep in place a lower-court block on deportations to third-party countries. The rulings came as the Court's new October 2026 term formally opened, with roughly 30 cases already granted, including disputes over judicial review of veterans' benefits claims, a religious zoning fight, and whether energy companies can be sued over climate-change damages. The docket signals another term heavily focused on executive power and immigration enforcement.","source":"Bloomberg Law / SCOTUSblog","url":"https://news.bloomberglaw.com/business-and-practice/supreme-court-today-oct-1-2026"},{"headline":"September Payrolls Badly Miss Forecasts, Unemployment Climbs to 4.2%","body":"The Bureau of Labor Statistics reported employers added just 29,000 jobs in September, far short of the roughly 90,000 Wall Street expected, while the unemployment rate rose to 4.2% from 4.1%. July and August figures were revised down by a combined 60,000 jobs, with August's previously strong 162,000 print cut to 133,000. Economists noted the weakness cuts across sectors, with financial services and government shedding workers even as healthcare added only 17,000 jobs, far below its usual pace.","source":"CNBC / NPR","url":"https://www.cnbc.com/2026/10/02/jobs-report-september-2026.html"},{"headline":"Weak Jobs Data Cements Expectations the Fed Holds Rates This Month","body":"Markets rallied after Friday's soft September jobs report, with traders now pricing in a high probability the Federal Reserve leaves rates unchanged when it meets later in October, just weeks after a quarter-point cut. Fed officials, including Vice Chair Philip Jefferson, had argued labor conditions were stabilizing even amid volatile monthly prints, but the 29,000-job gain and rising 4.2% jobless rate complicate that narrative. Economists say the central bank is now caught between a cooling labor market and persistent inflation pressure as it weighs its next move.","source":"Yahoo Finance / NPR","url":"https://finance.yahoo.com/economy/live/september-jobs-report-live-updates-labor-market-adds-29000-124648123.html"},{"headline":"Rent Affordability Crisis Deepens for Middle-Income Households","body":"A new report highlighted Friday finds that rising rents are increasingly squeezing middle-income American families, not just lower-income renters, as housing costs continue to outpace wage growth in many metro areas. The strain comes even as the broader inflation fight continues following the Fed's recent quarter-point rate cut, underscoring how shelter costs remain a stubborn drag on household budgets. Analysts say the trend adds political pressure heading into the midterm season as affordability becomes a dominant economic complaint nationwide.","source":"NPR","url":"https://www.npr.org/2026/10/02/nx-s1-5989140/jobs-labor-wages-federal-reserve"}],"pacific":{"pacificCommand":[],"pacingThreat":[]},"europe":{"ukraineRussia":[{"headline":"Ukraine Captures 250 Russian Troops in Donbas Robot-and-Trojan-APC Raid","body":"Kyiv says a combined-arms operation codenamed Vivaldi forced more than 250 Russian soldiers to surrender in the eastern Donbas sector this week. Ukrainian forces used ground robots dropped behind enemy lines alongside explosive-packed, remote-detonated Soviet-era armored personnel carriers that troops have nicknamed 'Trojan' tanks to breach Russian fortifications. Military officials say the raid has provided a rare morale boost after what has otherwise been a grinding, difficult stretch for Ukrainian forces along the front.","source":"CNN via KTVZ","url":"https://ktvz.com/news/national-world/cnn-world/2026/10/02/ukraine-says-it-forced-250-russian-soldiers-to-surrender-in-daring-operation/"},{"headline":"Russia Escalates Strikes on Kyiv Infrastructure, Reportedly Eyes Nuclear Sites","body":"Russian drones struck a support pillar of Kyiv's Southern Bridge on October 1 while a metro train was crossing, the first such attack on a capital bridge, and a separate drone hit the grounds of Kyiv's Institute for Nuclear Research on September 30, sparking a fire near a research reactor that has been shut down since 2022. The Financial Times reported Moscow is now weighing strikes on Ukraine's nuclear power facilities specifically to pressure Kyiv into concessions, as President Zelensky said Putin is trying to force residents to abandon the capital. Ukraine's General Staff separately put cumulative Russian losses since February 2022 at over 1.5 million troops.","source":"RBC-Ukraine / Kyiv Independent","url":"https://newsukraine.rbc.ua/war-in-ukraine"}],"europe":[{"headline":"NATO Chief Tours German-Dutch Corps as Poland Loosens Air-Defense Rules","body":"NATO Secretary General Mark Rutte visited the 1st German-Netherlands Corps in Munster on October 1 alongside German Chancellor Friedrich Merz and Dutch Prime Minister Rob Jetten, underscoring alliance cohesion on the eastern flank. The visit came as new Polish air-defense rules took effect October 1 allowing pilots to engage threats based on radar data or no-fly-zone breaches rather than requiring visual identification, a change Deputy Defense Minister Cezary Tomczyk had announced in late September. Warsaw separately extended border controls with Germany and Lithuania through March 2027, citing nearly 1,300 denied entries at the Lithuanian crossing alone.","source":"NATO / Rio Times","url":"https://www.nato.int/en"},{"headline":"Bond Market Strains Hit UK, France and Germany Simultaneously","body":"Europe's fiscal and inflation pressures converged this week: UK gilt yields touched 6%, prompting the prime minister to float the idea of rejoining EU economic structures, while France unveiled an austerity budget amid its highest borrowing costs since 2002. German inflation climbed to 3.3%, its highest reading since December 2023, compounding worries about growth across the continent's three largest economies. Analysts note the synchronized pressure is unfolding alongside the drag of continued war-related energy and security spending.","source":"Rio Times","url":"https://www.riotimesonline.com/europe-intelligence-brief-thursday-october-1-2026/"}]},"middleEast":[{"headline":"US Surges Third Carrier Group and 9,000 Troops Toward Middle East","body":"The Pentagon is dispatching roughly 9,000 additional troops aboard a naval formation that includes the USS Theodore Roosevelt carrier strike group and the USS Makin Island amphibious readiness group, a buildup that could place a third US carrier in the region. President Trump said he has rejected Iran's latest peace proposal and suggested further strikes remain on the table. The deployment comes amid persistent instability following this year's Iran war and strikes that killed Supreme Leader Ali Khamenei.","source":"NetNewsLedger / Jerusalem Post","url":"https://www.netnewsledger.com/2026/10/02/october-2-2026-news-scan-middle-east-escalation-energy-prices-pipeline-politics/"},{"headline":"Strait of Hormuz Tanker Hit as Houthi-Saudi Exchanges Intensify","body":"The UK Maritime Trade Operations agency reported an unknown projectile struck a tanker transiting the Strait of Hormuz, rattling energy markets already jarred by the broader Iran-linked conflict. Yemen's air force said it conducted 20 strikes on Houthi positions in Taiz province, while the Saudi-led coalition said it intercepted a missile after Houthi forces targeted a power station in Medina. Brent crude briefly dipped below $100 a barrel even as traders priced in continued risk to one of the world's most critical oil chokepoints.","source":"Jerusalem Post","url":"https://www.jpost.com/middle-east/iran-news/2026-10-02/live-updates-910393"},{"headline":"Iran Dangles Nuclear Inspector Access as US Shields Gulf Energy Sites","body":"Iranian Foreign Minister Abbas Araghchi reportedly offered international inspectors expanded access to nuclear facilities in exchange for sanctions relief, a signal diplomats told Bloomberg reflects Tehran's deepening economic strain. Simultaneously, Washington is sending Patriot missile batteries to Saudi Arabia and Qatar to reassure Gulf partners that their oil and gas infrastructure will be protected if large-scale combat resumes. The moves illustrate the dual-track dynamic of continued military pressure alongside tentative diplomatic signaling.","source":"Jerusalem Post","url":"https://www.jpost.com/middle-east"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Reportedly Targeting Mid-November IPO at Up to $2 Trillion Valuation","body":"Bloomberg reports Anthropic could begin marketing shares the week of November 9, with investor meetings starting October 14, as it pushes to beat rival OpenAI to the public markets. The company is reportedly targeting a valuation of up to 2 trillion dollars, which would make it the largest IPO ever, after its 2025 revenue grew twelvefold to roughly 4.6 billion dollars according to a leaked S-1 filing. The move underscores how capital-market pressure is now shaping the pace of frontier-model development as much as research breakthroughs.","source":"Yahoo Finance","url":"https://finance.yahoo.com/technology/article/anthropic-reportedly-looking-to-ipo-as-early-as-mid-november-180315768.html"},{"headline":"Ex-Genentech, Meta and AWS Researchers Launch $500M Healthcare Frontier-AI Lab","body":"A new startup called Ortet launched this week with a 500 million dollar founding commitment from investment firm Thoreau, aiming to build a full-stack foundation model spanning clinical, biological, operational and financial health data. The founding team is led by Kyunghyun Cho, a co-creator of the attention mechanism underlying modern transformers, alongside alumni of Genentech's frontier research team, Meta Superintelligence Labs and AWS. The launch adds to a wave of large healthcare-AI financings, including Aidoc's 150 million dollar raise and Verily's 300 million dollar round, signaling investors are betting compute-heavy foundation models will reshape drug discovery and clinical care.","source":"Fierce Healthcare","url":"https://www.fiercehealthcare.com/ai-and-machine-learning/ex-genentech-meta-aws-ai-leaders-launch-health-ai-lab-500m-backing"}],"cyberEmerging":[{"headline":"China-Linked Hackers Impersonate Senior Anthropic Staffer to Target US AI Policy Experts","body":"Researchers report that the China-aligned group tracked as TA419 has been posing as a senior Anthropic employee and other known policy figures to approach American artificial-intelligence researchers and officials. The campaign is part of a broader pattern of Chinese hacking operations found targeting AI firms and Asian governments in recent weeks. The incident highlights how frontier labs and the policymakers who advise them have become priority intelligence targets as AI capabilities become tied to national-security planning.","source":"Cyber Security News","url":"https://cybersecuritynews.com/"},{"headline":"OpenAI Says It Disrupted Model-Distillation Campaign Tied to Moonshot AI Associates","body":"OpenAI disclosed it identified and shut down a coordinated effort to illicitly extract the internal reasoning processes of its models, an operation the company linked to associates of China's Moonshot AI. The disruption follows Anthropic's own accusations earlier this year that Chinese competitors including DeepSeek and Alibaba Cloud have been distilling Claude's outputs to train rival systems. The episode reflects intensifying intellectual-property friction between US and Chinese labs as both sides race to close capability gaps cheaply.","source":"The Hacker News","url":"https://thehackernews.com/"}]},"cities":{"lasVegas":[{"headline":"Lombardo Escalates Fight Over Voter Citizenship Checks","body":"Governor Joe Lombardo is pressing Nevada Secretary of State Francisco Aguilar to tap expanded federal resources to verify the citizenship status of the state's registered voters, deepening a partisan rift over election administration ahead of November. The governor's push, made public this week, pits his office against the Democratic secretary of state just weeks before early voting begins. The dispute adds to a contentious 2026 election cycle already marked by down-ballot judicial and municipal races across Clark County.","source":"Las Vegas Review-Journal / Las Vegas Sun","url":"https://www.reviewjournal.com/local/"},{"headline":"Housing Market Cools as Mortgage Rates Near Three-Year High","body":"Las Vegas Realtors are telling buyers and sellers to brace for a tougher market as mortgage rates climb toward their highest level in three years, with agents describing reluctant buyers and sellers unwilling to cut asking prices. New data show the median price for an existing single-family home in the valley fell to $475,000 in August, down from a record $490,000 set in May and June. The pullback contrasts with Reno, where prices rose roughly 6% over the same period, highlighting a widening gap between Nevada's two largest housing markets.","source":"Las Vegas Review-Journal / Nevada Business Magazine","url":"https://www.reviewjournal.com/business/"},{"headline":"Las Vegas Prepares for January's College Football Playoff Championship","body":"City officials and organizers are finalizing plans for College Football Playoff national championship week in January, the first time the title game will be staged in Las Vegas, with multiple satellite events and expected road closures across the resort corridor. Planning details released this week outline a buildup similar to past Super Bowl logistics, with downtown and Strip-area disruptions anticipated. The event is expected to be one of the largest sports-tourism draws in the city's calendar for early 2027 planning cycles.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Nellis Marks End of A-10 Era as Last Warthog Departs","body":"Nellis Air Force Base's final operational A-10 Thunderbolt II made its last flight in late September, closing out nearly 50 years of close-air-support training, testing and maintenance at the installation. Roughly 70 airmen lined the flight line to salute the jet, and personnel from the 757th Aircraft Maintenance Squadron are now being reassigned to F-35 and F-16 units as the Air Force completes its Warthog retirement. Moody Air Force Base in Georgia is now the only installation with active-duty operational A-10s remaining, intensifying debate in Congress over whether a certified replacement exists for the close-air-support mission.","source":"Military Times","url":"https://www.militarytimes.com/news/your-military/2026/09/24/nellis-air-force-base-says-goodbye-to-last-a-10-thunderbolt-ii/"}]},"feelGood":[{"headline":"Nellis-Based Airmen Race to Save Stranded Navy Crew","body":"Airmen from the 355th Aircraft Maintenance Squadron and the 88th Test and Evaluation Squadron, operating out of Nellis Air Force Base, scrambled two HH-60W Jolly Green II helicopters to rescue five Navy personnel after their helicopter made a hard landing in rugged mountain terrain near Naval Air Weapons Station China Lake, California. Ground crews generated the aircraft in about 30 minutes despite a mechanical issue, and rescue teams made radio and visual contact with the survivors within two hours of notification. A pararescue team led by Capt. John Howe confirmed no injuries and repositioned the helicopters to spare the stranded sailors unnecessary exertion before flying them to safety.","source":"Military Times / Air & Space Forces Magazine","url":"https://www.militarytimes.com/news/your-military/2026/08/18/airmen-rescue-5-navy-sailors-in-california-with-hh-60ws/"},{"headline":"Texas Senior With Down Syndrome Gets Unforgettable Senior Night","body":"A Texas high school football team arranged for a senior player with Down syndrome to score a touchdown during his final home game, then carried him off the field on their shoulders in an emotional send-off. The moment, captured by teammates and coaches, turned into one of the season's most-shared feel-good clips as the community celebrated the player's four years with the program. The gesture reflected a growing trend of teams nationwide finding ways to spotlight players who rarely get on-field moments of their own.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Shelter Dog Adoptions Turn Into Life-Changing Bonds","body":"Petco Love's latest round of recognized adoption stories highlights how shelter pets are pulling people through isolation and hardship, including one from San Antonio Animal Care Services where an adopter named Sam credits his dog Scout with showing him he was never truly alone during his loneliest years. The grants tied to these stories help fund the shelters and rescues that facilitated the matches, reinforcing a cycle of community support. Similar accounts from Lost Dog & Cat Rescue Foundation and other groups featured this year underscore how ordinary adoptions are delivering outsized emotional rescues for struggling adopters.","source":"Petco Love","url":"https://petcolove.org/blog/2026-top-love-stories/"}],"onThisDay":[{"year":"1869","event":"Mahatma Gandhi, who would later lead India's independence movement through nonviolent resistance, was born in Porbandar."},{"year":"1950","event":"Charles Schulz's comic strip Peanuts was first published in American newspapers."},{"year":"1958","event":"Guinea declared independence from France, becoming one of Africa's first former French colonies to break away."},{"year":"1968","event":"Mexican security forces killed hundreds of student protesters in the Tlatelolco massacre in Mexico City."}]},"topPicks":[{"headline":"Hegseth Unveils Sweeping Pentagon Overhaul: New Drone Command, Domestic Mega-Base, and Musk-Led War Study","teaser":"A major restructuring signals shifting US military priorities toward drone warfare and private-sector involvement in defense planning."},{"headline":"September Payrolls Badly Miss Forecasts, Unemployment Climbs to 4.2%","teaser":"Weak jobs data raises recession worries and all but locks in the Federal Reserve holding rates steady this month."},{"headline":"US Surges Third Carrier Group and 9,000 Troops Toward Middle East","teaser":"A major US naval buildup signals rising concern over escalating tensions across the Middle East region."}]},"navDates":[{"key":"2026-10-02","label":"Oct 2","href":"/","isNewest":true},{"key":"2026-10-01","label":"Oct 1","href":"/archive/2026-10-01.html","isNewest":false},{"key":"2026-09-30","label":"Sep 30","href":"/archive/2026-09-30.html","isNewest":false},{"key":"2026-09-29","label":"Sep 29","href":"/archive/2026-09-29.html","isNewest":false},{"key":"2026-09-28","label":"Sep 28","href":"/archive/2026-09-28.html","isNewest":false},{"key":"2026-09-27","label":"Sep 27","href":"/archive/2026-09-27.html","isNewest":false},{"key":"2026-09-26","label":"Sep 26","href":"/archive/2026-09-26.html","isNewest":false}],"currentKey":"2026-10-02","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
