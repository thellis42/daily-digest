<script>
const STATE = {"digest":{"date":"Thursday, September 17, 2026","generatedAt":"Thu, Sep 17, 7:17 AM PDT","breaking":{"headline":"Frontier AI Labs and Washington Scramble to Set Rules for the 'Pacing' Race","body":"A weekend essay from Anthropic CEO Dario Amodei urging frontier labs to slow model development touched off a public rift, prompting responses within days from the chiefs of Microsoft, OpenAI and xAI, and even a Senate proposal to ban superintelligence outright. Amodei is pushing to embed third-party safety evaluators inside frontier labs with authority to publish findings, a move that follows a former Anthropic researcher's resignation warning that companies are racing toward systems they may not be able to control. OpenAI's policy chief confirmed the company has held weeks of quiet safety coordination talks with Anthropic and Google DeepMind, and said OpenAI now backs a FRONTIER Act provision that would give federal regulators power to mandate independent audits and pause risky deployments.","source":"CNBC","url":"https://www.cnbc.com/2026/09/16/anthropic-open-ai-model-safety-risks.html"},"tabs":{"defense":{"defense":[{"headline":"Pentagon Watchdog: Iran War Has Drained US Missile Defense Stockpiles","body":"A new Defense Department Inspector General report to Congress, the first in a quarterly series tracking Operation Epic Fury, found the seven-month US-Israeli air campaign against Iran launched February 28 has caused strategic munitions shortfalls and exposed industrial-base bottlenecks that could take significant time to fix. A separate Congressional Budget Office analysis estimates the US has expended between one-half and two-thirds of its stock of certain missile-defense interceptors since June 2025, with full replenishment likely taking at least five years.","source":"USNI News / Inside Defense","url":"https://news.usni.org/2026/09/16/pentagon-inspector-general-report-on-operation-epic-fury"},{"headline":"Air Force Approves B-52 Overhaul Milestones to Keep Bomber Flying Into the 2050s","body":"Air Force acquisition chief William Bailey announced this week that the service has approved milestones for two separate overhaul efforts on the decades-old B-52 Stratofortress, part of a long-term plan to keep the bomber operational into the 2050s. The announcement came as the service faces pressure to modernize legacy platforms while absorbing munitions and readiness strains from the ongoing Iran campaign.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Germany Sends Eurofighters to Latvia Ahead of Contested Election Amid Drone Incursions","body":"Germany's Defense Ministry said four Bundeswehr Eurofighters will deploy to Latvia for about a week spanning late September into early October, timed to cover Latvia's October 3 parliamentary election after a string of unexplained drone incursions raised airspace security concerns. Latvia had formally requested additional NATO allied support to secure its skies ahead of the vote, underscoring alliance jitters over gray-zone activity near the Baltic frontier.","source":"Just Security / POLITICO","url":"https://www.justsecurity.org/157611/early-edition-september-17-2026/"}],"acquisitions":[{"headline":"Lockheed, GM Accelerate Patriot Interceptor Output With First Parts Shipment","body":"Lockheed Martin said it has received its first shipment of critical components from General Motors for Patriot air-defense interceptors, arriving less than a month after the two companies signed a manufacturing agreement. The deal is part of a Pentagon-wide push to speed up production of munitions that have been depleted by sustained missile-defense operations tied to the Iran conflict.","source":"Times of Israel / Reuters","url":"https://www.timesofisrael.com/liveblog-september-17-2026/"},{"headline":"Space Force Pushes GPS Modernization After Scrapping Troubled OCX Contract","body":"The Space Force plans to hold an industry day next week to kick off planning for a next-generation GPS satellite constellation while expanding development under its Resilient-GPS initiative. Lockheed Martin is separately executing contracts worth $219 million so far to rapidly upgrade the GPS III ground control system after the service canceled its long-troubled OCX ground-system contract with RTX.","source":"Inside Defense","url":"https://insidedefense.com/"}]},"us":[{"headline":"Fed Delivers First Rate Hike Since 2023, Citing Oil-Driven Inflation","body":"The Federal Reserve's Open Market Committee voted unanimously on September 16 to raise the benchmark federal funds rate by a quarter point to a target range of 3.75-4%, the first increase in more than three years. Policymakers pointed to persistent inflation driven by elevated energy prices tied to the ongoing Iran war, and updated projections signal at least one more hike could follow before year-end. The move marks a sharp reversal after months of rate cuts and comes just seven weeks before the midterm elections, adding pressure on borrowing costs for consumers and businesses nationwide.","source":"CNBC","url":"https://www.cnbc.com/2026/09/16/fed-rate-decision-september-2026.html"},{"headline":"Supreme Court Blocks Trump's Mail-Ballot Restrictions for Midterms","body":"In a decision handed down September 14, the Supreme Court refused to let new U.S. Postal Service rules restricting mail-ballot delivery take effect for the 2026 midterms, preserving the status quo for absentee voting nationwide. Only Justices Samuel Alito and Clarence Thomas dissented, while Justice Brett Kavanaugh wrote separately that the Postal Service likely has authority to issue such a rule but that state and local election officials lack sufficient time to implement it before November. The ruling leaves open whether similar restrictions could be imposed in future elections, but for now removes a major point of uncertainty for voters and election administrators just weeks before ballots go out.","source":"NPR","url":"https://www.npr.org/2026/09/14/nx-s1-5962190/supreme-court-mail-in-voting-trump"},{"headline":"House Holds Billionaire Leon Black in Contempt Over Epstein Probe","body":"The House of Representatives voted on a bipartisan basis September 16 to hold private-equity billionaire Leon Black in contempt of Congress, the first such action against a witness in the chamber's Epstein investigation. Black had defied two subpoenas from the House Oversight Committee seeking further detail on his financial ties to Jeffrey Epstein, after walking out of a voluntary interview in June without answering questions about nondisclosure agreements. The contempt referral now goes to the Justice Department, which will decide whether to pursue criminal charges, while Black's attorneys have called the vote politically motivated.","source":"NPR","url":"https://www.npr.org/2026/09/16/nx-s1-5954258/leon-black-jeffrey-epstein-contempt-congress"},{"headline":"House Passes Russia-Iran Sanctions Bill Threatening 100% Tariffs on China, India","body":"The House approved the Lindsey O. Graham Sanctioning Russia and Iran Act on September 16, sending to President Trump legislation that would authorize tariffs of up to 100% on top buyers of Russian oil and gas, including China and India, along with new Iran sanctions. Democratic Senator Richard Blumenthal warned New Delhi and Beijing to find alternative energy sources, while India's Ministry of External Affairs said it is monitoring the bill and will act to protect its trade interests. The measure, named for the late South Carolina senator, adds a fresh economic lever against Moscow just as gas prices remain a central issue heading into the midterms.","source":"Outlook India","url":"https://www.outlookindia.com/international/after-congress-nod-russia-sanctions-bill-now-awaits-trumps-signature"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Weighs Defense Spending Surge to 3.5% of GDP","body":"Prime Minister Sanae Takaichi's government is considering a mid-term target that would push Japan's defense outlays to 3.5% of GDP, putting Tokyo in line with NATO benchmarks and responding to pressure from Washington. The plan, first reported September 15, is already stirring unease among investors wary of Takaichi's broader spending agenda and Japan's rising debt-servicing costs.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-09-15/japan-eyes-defense-spending-worth-3-5-of-gdp-amid-us-pressure"},{"headline":"Japan Keeps Nuclear-Powered Submarines on the Table","body":"Defense Minister Shinjiro Koizumi said on September 11 that Tokyo has not ruled out nuclear-powered submarines as it prepares to revise its three core national security documents by year's end. The comments followed reports that a U.S. Navy official had voiced support for the option, part of a broader push to extend the JMSDF's undersea reach across the Western Pacific as Chinese and Russian naval activity around Japan intensifies.","source":"Naval News","url":"https://www.navalnews.com/naval-news/2026/09/japan-defense-minister-nuclear-powered-submarines/"},{"headline":"Manila-Seoul Defense Ties Deepen After Viral Teodoro Moment","body":"Philippine Defense Secretary Gilberto Teodoro drew global attention on September 8 by reading aloud, live on stage, a note a Chinese official had slipped him rejecting the 2016 South China Sea arbitration ruling during the Seoul Defense Dialogue. The episode overshadowed a quieter but substantive development a day earlier, when Philippine and South Korean defense chiefs agreed to expand cooperation through personnel exchanges and joint exercises, part of Manila's push to widen its web of security partners beyond Washington and Tokyo.","source":"Radio Free Asia","url":"https://www.rfa.org/english/southchinasea/2026/09/17/philippines-china-teodoro-note-rebuke/"}],"pacingThreat":[{"headline":"Beijing Touts PLA Modernization at Xiangshan Forum","body":"Chinese Defense Minister Dong Jun told the opening of the 13th Beijing Xiangshan Forum on September 16 that the PLA is accelerating its modernization drive as it approaches the force's 100th anniversary, and offered to share China's military-building experience with other nations. The forum, Beijing's premier annual security gathering, is being watched closely for further signaling on Taiwan policy and China's vision for regional security architecture.","source":"China.org.cn","url":"http://www.china.org.cn/2026-09/17/content_118699784.shtml"},{"headline":"Report: China Battle-Testing Weapons via Russia-Iran Trade, Copying US AI Models","body":"A September 15 ISW-AEI China and Taiwan update assessed that Beijing continues arms sales and bartering arrangements with Moscow and Tehran that let PRC firms validate defense components in live combat conditions. The same report cited multiple US government agencies finding that China-based AI companies are aggressively distilling American models to accelerate domestic AI programs, even as Xi's government pushes deeper AI integration across industry despite calls from US firms to slow development.","source":"American Enterprise Institute / Institute for the Study of War","url":"https://www.aei.org/commentary/china-taiwan-update-september-15-2026/"},{"headline":"Taiwan's Vice President Makes Rare European Trip Over Beijing's Objections","body":"Taiwanese Vice President Hsiao Bi-khim made an unannounced visit to Italy on September 11-12 to attend the second Ventotene European Conference for Freedom and Democracy at the European Parliament's invitation, despite ongoing PRC efforts to constrict Taipei's international engagement. Foreign Minister Lin Chia-lung joined her on the trip, one of Taiwan's more visible diplomatic pushes into Europe this year as Beijing continues pressing governments to limit contact with Taiwanese officials.","source":"American Enterprise Institute / Institute for the Study of War","url":"https://www.aei.org/commentary/china-taiwan-update-september-15-2026/"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine Hits Russian Air Defenses and Drone Bases in New Wave of Deep Strikes","body":"Ukrainian forces conducted a fresh round of long-range strikes overnight into September 17, hitting Russian S-400 air-defense launchers, UAV launch sites and logistics facilities supporting occupation forces. The operation is part of Kyiv's ongoing campaign to degrade Russia's air-defense network and drone-strike infrastructure ahead of the winter energy-grid attack season. Ukrainian officials framed the strikes as targeting capabilities Moscow uses both to shield its own territory and to sustain mass drone and missile barrages against Ukrainian cities.","source":"Ukrinform","url":"https://www.ukrinform.net/rubric-ato"},{"headline":"Russian Strikes Continue to Kill Civilians as Zelensky Reshuffles Top Prosecutor","body":"Russian forces struck the Donetsk city of Sloviansk, wounding a 20-year-old woman, while an FPV drone killed a man in the Chuhuiv district of Kharkiv region, underscoring the steady civilian toll even amid ongoing diplomatic maneuvering. Separately, President Volodymyr Zelensky appointed Anton Kovalskyi as acting Prosecutor General after removing predecessor Ruslan Kravchenko, whose office is under scrutiny following allegations from Ukraine's anti-corruption bodies that a subordinate ran a scheme shielding fraudulent call centers. The shakeup comes as Kyiv tries to reassure Western partners about institutional integrity while the war grinds on.","source":"Just Security","url":"https://www.justsecurity.org/157611/early-edition-september-17-2026/"}],"europe":[{"headline":"NATO Reinforces Baltic Airspace After Drone Incursion Scare","body":"Germany's Defense Ministry announced it will send four Eurofighter jets to Latvia for about a week from late September into early October to bolster NATO's Baltic air-policing mission. The move follows Tuesday's shootdown over Lithuania of a drone by an Italian NATO fighter; Lithuanian President Gitanas Nauseda said the aircraft was a Russian-model drone likely bound for Ukraine that veered off course after being affected by Ukrainian electronic warfare. NATO Secretary General Mark Rutte also visited the United Kingdom this week for talks with Prime Minister Andy Burnham, part of the alliance's broader push to shore up eastern-flank deterrence amid a string of recent airspace violations.","source":"Just Security / NATO","url":"https://www.nato.int/en"},{"headline":"Migrant Sea Arrivals to Europe Drop 39% but Deaths Keep Climbing","body":"New data published today show irregular sea arrivals to European shores have fallen 39% so far in 2026 compared with the same period last year, even as fatalities and disappearances along Mediterranean and Atlantic routes continue to rise. The figures land as the EU is still absorbing the fallout from the Ceuta crisis, in which roughly 70,000 migrants crossed into the Spanish exclave in a single day on July 30, prompting 22 EU governments to warn Brussels that Spain's mass regularization program was acting as a magnet for new arrivals. The tension between falling overall numbers and rising death tolls, plus unresolved fights over relocation quotas, keeps migration policy as one of the bloc's most politically combustible issues heading into autumn.","source":"Demócrata","url":"https://www.democrata.es/en/international/the-arrivals-of-migrants-by-sea-to-europe-fall-by-39-compared-to-2025-but-deaths-continue-to-rise/"}]},"middleEast":[{"headline":"Gaza City Building Collapse Kills at Least 10, Dozens Feared Trapped","body":"A residential building collapsed in Gaza City, killing at least 10 Palestinians with as many as 70 more people believed still missing under the rubble. The incident adds to mounting humanitarian strain in Gaza even as a ceasefire nominally remains in place, with rescue crews reporting severe shortages of heavy equipment needed for search operations. The collapse is likely to intensify international pressure over reconstruction and structural safety in war-damaged neighborhoods.","source":"Al Jazeera","url":"https://www.aljazeera.com/middle-east/"},{"headline":"UN Fact-Finding Mission Says US Strikes in Iran Amounted to War Crimes","body":"The International Fact-Finding Mission on Iran concluded there are reasonable grounds to believe the United States was behind two military strikes on a school and a sports facility in Iran in February, and that the attacks constituted war crimes. The same report found Iranian authorities committed crimes against humanity during their violent crackdown on anti-government protesters. The findings are set to be presented to the UN Human Rights Council in Geneva, adding legal pressure on Washington even as it pursues a postwar strategy for Iran.","source":"Reuters via Just Security","url":"https://www.justsecurity.org/157611/early-edition-september-17-2026/"},{"headline":"Trump Set to Meet Gulf Leaders on Postwar Iran Strategy at UN Summit","body":"President Trump is expected to meet Gulf leaders on the sidelines of next week's UN General Assembly session in New York to discuss next steps following the Iran war, with the talks centered on Washington's ideas for a postwar regional strategy. Israeli Prime Minister Benjamin Netanyahu is separately seeking his own sit-down with Trump, though no meeting has yet been scheduled. The diplomatic push comes as Netanyahu publicly vowed to continue dismantling Hamas and confronting Iran and Hezbollah, signaling Israel has no plans to ease military operations despite the ceasefire.","source":"Axios via Just Security","url":"https://www.justsecurity.org/157611/early-edition-september-17-2026/"}],"techAI":{"aiCompetition":[{"headline":"Canada and Germany Bankroll Bengio's Safety-First AI Lab","body":"Canada and Germany each pledged up to $150 million in grants to LawZero, the Montreal nonprofit AI lab founded by Turing Award winner Yoshua Bengio in 2023 that had previously run on roughly $30 million in philanthropic support. The infusion marks a rare instance of state capital backing a frontier research effort explicitly organized around safety rather than commercial deployment. It comes as private venture funding keeps concentrating in OpenAI, Anthropic and Google DeepMind, highlighting a widening gap between government-backed safety research and profit-driven model development."},{"headline":"OpenAI Delays Big Model Launch as Anthropic Eyes IPO","body":"Sam Altman said Wednesday that the major model release he had teased for this week, part of a planned 'Astra' family with new agentic and coding capabilities, has slipped to next week alongside a broader DevDay showcase. The delay lands amid a rocky year for OpenAI, which has lost senior executives including former president Fidji Simo and ex-COO Brad Lightcap, while rival Anthropic has reportedly been preparing to go public as soon as this month, a step that would make it the first major frontier lab to test public markets. The reshuffling underscores how quickly the perceived competitive lead can shift on a single product launch."}],"cyberEmerging":[{"headline":"Congress Leaves Town Without Acting on AI Safeguards","body":"Despite a wave of alarming statements this week from OpenAI and Anthropic leaders about catastrophic AI risk, most lawmakers are departing Washington for recess until after the November election, leaving safeguard legislation untouched. Speaker Mike Johnson canceled Thursday floor votes for an early break, and Congress remains split over whether federal preemption of state AI laws, a moratorium, or narrower safety mandates is the right path forward. The stalemate effectively leaves states such as Texas, Florida and Utah as the near-term source of binding AI rules."},{"headline":"California Mandates AI Ad Disclosure as Federal Rules Stall","body":"Governor Gavin Newsom signed SB 1050 this week, requiring that political and commercial video or audio advertisements disclose when their content is AI-generated. The law adds to California's expanding stack of AI transparency statutes and arrives just as Washington remains gridlocked over whether a single federal standard should preempt such state rules. With Congress heading into recess without acting, California's move reinforces its role as the de facto regulator of AI-generated media ahead of the 2026 midterms."}]},"cities":{"lasVegas":[{"headline":"Shuttered Royal Resort Near the Strip Reduced to Rubble","body":"Crews tore down the long-closed Royal Resort on Convention Center Drive this week, leveling the property into a heap of debris as part of the ongoing turnover of aging motor-lodge-era sites near the Strip. The Review-Journal documented the teardown on Sept. 16, underscoring how quickly older Las Vegas hospitality real estate is being cleared for future redevelopment. No word yet on what will replace the site.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Murder-Suicide Near UNLV Rattles Central Las Vegas Neighborhood","body":"Metro police say a man shot and killed both of his parents before killing himself inside a family apartment near UNLV on Wednesday morning. Homicide detectives have not released a motive, and authorities say no other injuries were reported in the incident. The case adds to a string of violent domestic incidents the department has investigated this month.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Clark County Schools Cutting $51 Million as Enrollment Keeps Sliding","body":"Persistent enrollment declines are forcing the Clark County School District to slash $51 million from its budget this year, with $29.1 million coming out of individual school budgets and another $22.5 million trimmed from the central office. District officials say fewer students translate directly into less state funding, squeezing an already strained system. The cuts come as CCSD, one of the nation's largest districts, continues to grapple with population shifts across the valley.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"}],"nellis":[{"headline":"926th Wing Builds New On-Ramp for Future Airmen Before Basic Training","body":"The Air Force Reserve's 926th Wing at Nellis has stood up a Development and Training Flight that lets incoming recruits start learning the ropes of military life months before they ever report to basic training. Trainees are paired with current wing members for regular sessions meant to smooth the jump from civilian life to service in the composite wing, which flies F-16s, F-22s, F-35s and MQ-9 Reapers out of Nellis and Creech. The initiative, detailed in reporting published Sept. 14, is aimed at improving retention and readiness as the reserve component competes for recruits.","source":"MilitarySpot.com","url":"https://www.militaryspot.com/news/training-flight-shapes-future-airmen"}]},"feelGood":[{"headline":"Woman With Down Syndrome Breaks Barrier as Certified Fitness Instructor","body":"A 22-year-old woman has become the first person with Down syndrome to earn certification as an UpBeat Barre instructor, and she's now teaching classes to prove the fitness industry has space for everyone. Her achievement is being celebrated as a milestone for disability representation in group exercise studios nationwide.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Strangers Save Cat Accidentally Dumped at Landfill With Old Couch","body":"A cat that ended up at a landfill after being hauled away inside a discarded couch was rescued and reunited with his family thanks to a group of people who refused to let his story end in tragedy. The rescue effort, pieced together by neighbors and volunteers, turned what could have been a heartbreaking loss into a happy homecoming.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Devoted Fan's 79-Year Kentucky Derby Streak const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
