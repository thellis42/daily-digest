<script>
const STATE = {"digest":{"date":"Wednesday, November 4, 2026","generatedAt":"Wed, Nov 4, 9:14 AM PST","breaking":{"headline":"Democratic Midterm Sweep Threatens Pentagon's $1.5 Trillion Budget Plan and Hegseth's Standing","body":"Tuesday's midterm elections handed Democrats a sweeping takeover of Congress, a result that defense analysts say will likely stall the Trump administration's push to grow the defense budget to $1.5 trillion for the next fiscal year. The new majority also gives lawmakers fresh leverage to investigate Pentagon leadership, acquisition decisions and major weapons programs, putting Defense Secretary Pete Hegseth's tenure under heightened scrutiny heading into 2027 budget negotiations.","source":"Inside Defense","url":""},"tabs":{"defense":{"defense":[{"headline":"US Forces Strike Iranian Targets on Qeshm Island After SAM Fire on American Aircraft","body":"Under an operation described internally as 'Epic Fury,' US forces carried out a limited strike on Iranian targets on Qeshm Island in the Strait of Hormuz on Monday, November 2, after Iranian air-defense systems reportedly fired on a US aircraft. Officials characterized the response as defensive rather than a resumption of broader combat operations, noting American forces have periodically hit Iranian missile launchers when threatened by the Revolutionary Guard. No public CENTCOM statement had been issued as of November 3, leaving much of the episode dependent on private diplomatic signaling.","source":"Fox News / TVG Daily Brief","url":"https://theverardogroup.substack.com/p/tvg-daily-brief-03-nov-2026"},{"headline":"Pentagon Grants Military Labs New Flexible Funding Authority","body":"The Defense Department issued guidance this week letting directors of military laboratories and select test organizations redirect between 2 and 4 percent of their budgets toward research, workforce development, technology transition and infrastructure upgrades. The move, detailed in a Pentagon document released last week, is meant to speed innovation adoption without waiting on new appropriations cycles.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Washington Pushes NATO Allies for More Funding on Ukraine Weapons Pipeline","body":"The United States is preparing to ask NATO members to increase their financial contributions to a key program that funnels American-made weapons to Ukraine, according to people familiar with the discussions. The push signals continued US defense support for Kyiv even as friction persists between President Trump and Ukrainian President Volodymyr Zelenskyy over the war's trajectory.","source":"FDD Overnight Brief","url":"https://www.fdd.org/overnight-brief/november-3-2026/"}],"acquisitions":[{"headline":"State Department Clears $2.1 Billion Patriot Interceptor Sale for Ukraine","body":"The State Department has approved a possible foreign military sale of 500 PAC-3 Missile Segment Enhancement interceptors to Ukraine valued at roughly $2.1 billion. Unlike many past packages, the deal would be financed entirely by US allies and partners rather than direct US appropriations, reflecting Washington's effort to keep Kyiv's air defenses stocked while shifting more of the cost burden onto Europe.","source":"Inside Defense (INSIDER Daily Digest)","url":"https://insidedefense.com/insider/insider-daily-digest-november-2-2026"},{"headline":"Navy Taps Fairbanks Morse Defense for $100 Million Submarine Overhaul","body":"The Navy has awarded Fairbanks Morse Defense a $100 million contract to overhaul critical systems aboard six nuclear-powered submarines, the company announced this week. The deal underscores the service's ongoing push to sustain its attack-submarine fleet amid industrial-base constraints that have slowed new construction and maintenance timelines.","source":"Inside Defense (Defense Business Briefing)","url":"https://insidedefense.com/defense-business-briefing/defense-business-briefing-november-3-2026"}]},"us":[{"headline":"Appeals Court Fight Over Election-Day Ballot Challenges Ends in Administration's Favor","body":"In a chaotic 24 hours of litigation, the 9th U.S. Circuit Court of Appeals voted 6-5 on Tuesday to let the Justice Department resume pressuring state and local election officials to flag ballots it suspects were cast by noncitizens, reversing a San Francisco judge's injunction just as midterm voting concluded. The ruling capped a whiplash sequence of orders and counter-orders that began Monday night, including a brief en banc reversal, before the full court ultimately sided with DOJ. A day earlier, the Supreme Court had separately rejected an administration bid to force California to set aside more than 20,000 contested ballots, signaling the legal fight over federal election intervention is far from settled.","source":"Axios / Bloomberg","url":"https://www.axios.com/2026/11/03/appeals-court-election-intimidation-restrictions-trump"},{"headline":"Democrats Flip Governorships in Texas, Nevada, Ohio and Georgia in Historic Midterm Sweep","body":"Tuesday's midterms produced a wave of upset gubernatorial wins for Democrats, with Gina Hinojosa unseating Texas Governor Greg Abbott to become the state's first Latina governor and end three decades of GOP control of the governor's mansion. Aaron Ford ousted incumbent Joe Lombardo in Nevada, Amy Acton became Ohio's first female governor, and Keisha Lance Bottoms won in Georgia, while James Talarico simultaneously broke a 32-year Democratic losing streak in the Texas Senate race. Republican-aligned spending, including roughly $224 million Elon Musk directed toward Texas GOP candidates, failed to stop the realignment, and Vice President JD Vance publicly attributed the losses in part to backlash over the ongoing Iran war.","source":"CNBC","url":"https://www.cnbc.com/2026/11/04/2026-midterm-election-results-live-updates.html"},{"headline":"Fed Holds Rates at 3.75-4% Despite Internal Dissent as Inflation Stays Elevated","body":"The Federal Reserve kept its benchmark rate unchanged at its October 28 meeting, with Chair Kevin Warsh's committee holding steady six days before the midterms even as governors Lisa Cook and Beth Hammack of the Cleveland Fed dissented in favor of an immediate quarter-point hike. The FOMC statement again described inflation as 'elevated' while citing resilient spending and strong productivity growth, and futures markets now price a roughly 77% chance of a rate increase at the December 9 meeting. Warsh denied politics factored into the decision, but the non-unanimous vote underscores growing friction inside the central bank over how aggressively to respond to persistent price pressures.","source":"NPR","url":"https://www.npr.org/2026/10/28/nx-s1-6020425/federal-reserve-interest-rates-inflation"},{"headline":"Wall Street Futures Jump as Markets Price In Democratic Sweep","body":"Dow futures surged Wednesday morning as traders reacted to Tuesday's decisive Democratic takeover of both the House and Senate, with President Trump reportedly acknowledging the results rather than contesting them. Investors appear to be betting that unified Democratic control of Congress reduces the odds of further trade-policy shocks and sets up a more predictable fiscal fight heading into the December 11 government-funding deadline. The rally comes against a backdrop of a Fed still debating a possible December rate hike, leaving markets to balance political relief against persistent inflation risk.","source":"CNBC","url":"https://www.cnbc.com/2026/11/04/2026-midterm-election-results-live-updates.html"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Weighs Nearly Doubling Five-Year Defense Budget to $500 Billion","body":"Japan's ruling coalition is debating a defense buildup plan worth 70 trillion to 80 trillion yen ($457 billion-$508 billion) for the five years starting April 2027, about 1.8 times the 43 trillion yen allotted under the current plan that began in fiscal 2023. The push, backed by Prime Minister Sanae Takaichi, would fund large numbers of drones and long-range strike systems, with officials citing a weaker yen driving up procurement costs. A final figure is expected before a year-end deadline to revise Japan's three core security documents.","source":"The Japan Times","url":"https://www.japantimes.co.jp/news/2026/11/03/japan/japan-defense-spending-hike-focus/"},{"headline":"North Korea Fires Multiple Missiles Toward East Sea Amid DMZ Tensions","body":"Seoul's military detected several missiles launched Wednesday from North Korea's Sondok area toward the East Sea, with South Korean and U.S. officials still analyzing the weapons' exact specifications. Japan's Ministry of Defense notably did not issue its usual alert, suggesting the launches may not have involved threatening ballistic missiles. The test follows weeks of rising North-South friction stemming from a landmine explosion along the heavily fortified inter-Korean border.","source":"The Japan Times","url":"https://www.japantimes.co.jp/news/2026/11/04/asia-pacific/north-korea-missile-test-november-4/"},{"headline":"India Opens Tiger Triumph Drill With U.S., Wraps Naval Exercise With South Korea","body":"India's military kicked off the fifth edition of Exercise Tiger Triumph, a tri-service India-U.S. humanitarian assistance and disaster relief drill, at Visakhapatnam's Maritime Warfare Centre on November 2. Days earlier, the frigate INS Sahyadri wrapped up a bilateral naval exercise with South Korea's navy at Busan on October 29, part of New Delhi's push to deepen Indo-Pacific security partnerships. The activity coincides with the opening of the Indo-Pacific Regional Dialogue 2026 in New Delhi.","source":"SSBCrack","url":"https://ssbcrackexams.com/defence-current-affairs-04-november-2026/"}],"pacingThreat":[{"headline":"Beijing's Top Diplomat Warns Manila Over South China Sea Dispute","body":"Chinese Foreign Minister Wang Yi told his Philippine counterpart by phone that outside interference was straining bilateral relations and urged Manila to handle their South China Sea dispute with caution. The call, disclosed by Beijing on November 4, comes as Philippine officials have reported Chinese naval and coast guard activity intensifying around Scarborough Shoal and other contested features in recent months. The warning underscores Beijing's effort to isolate the Philippines from U.S., Japanese, and Australian security backing.","source":"The Washington Post","url":"https://www.washingtonpost.com/world/2026/11/04/wang-yi-lazaro-china-philippines-sea/1af83c1e-d812-11f1-930a-e08f8086f5ac_story.html"},{"headline":"PLA Doubles Down on Amphibious Fleet in Apparent Taiwan Signal","body":"Open-source tracking shows China building six additional Type 071 amphibious transport dock ships across two shipyards, a significant expansion of the sealift fleet most analysts associate with a potential Taiwan invasion scenario. The buildup challenges earlier U.S. assessments that Beijing lacked sufficient maritime lift and logistics capacity for a large-scale cross-strait assault. The ships, when combined with China's civilian ferry fleet, would markedly expand the PLA's capacity to move troops and armor in a contingency.","source":"South China Morning Post","url":"https://www.scmp.com/topics/south-china-sea"},{"headline":"Taiwan Detects Year's Largest Single-Day Surge in Chinese Military Activity","body":"Taiwan's defense ministry recorded 49 Chinese military aircraft, six warships, and six government vessels operating around the island in the 24 hours ending the morning of November 3, the highest daily count of 2026, with 31 sorties crossing into Taiwan's air defense identification zone. Analyst Su Tzu-yun of Taiwan's Institute for National Defense and Security Research described it as a 'quiet exercise' of gray-zone pressure conducted without a formal drill announcement, warning Beijing could escalate further before year's end. The spike comes as campaigning for Taiwan's local elections enters its final weeks and as Taipei's legislature opens hearings on the 2027 defense budget, including submarine program milestones and a new Chiang Kung missile system.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/11/04/2003867122"}]},"europe":{"ukraineRussia":[{"headline":"Russia Launches Largest Energy Strike of the War, Komyshuvakha Toll Hits 40","body":"Moscow fired roughly 135-289 drones and missiles overnight into November 4, hitting a substation critical to a Ukrainian nuclear plant in what Kyiv called the biggest mass attack on its energy grid this year. The death toll from a related strike on Komyshuvakha in Zaporizhzhia rose to 40, with more than 30 people still feared trapped under rubble as rescue operations entered a third day. Ukraine's General Staff also reported Russian losses since February 2022 have climbed past 1.59 million troops, while Kyiv races to field domestically-built jet-powered drone interceptors to blunt the intensifying winter bombardment campaign.","source":"Kyiv Independent","url":"https://kyivindependent.com/"},{"headline":"Washington Pushes NATO for More Ukraine Arms Funding as $2.1B Patriot Sale Advances","body":"The United States is preparing to ask NATO allies to pump additional money into the alliance's Prioritized Ukraine Requirements List (PURL) weapons-delivery mechanism, with the request possibly coming this month, according to people familiar with the deliberations. The move signals continued U.S. military backing for Kyiv despite friction between Presidents Trump and Zelensky. Separately, the State Department has approved a potential $2.1 billion Patriot missile sale to Ukraine, underscoring Washington's effort to shore up Ukrainian air defenses ahead of a harsh winter strike season.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-11-02/us-said-to-plan-fresh-nato-push-for-ukraine-arms-deliveries"}],"europe":[{"headline":"NATO Drafts Deep-Strike Doctrine Targeting Russian Territory","body":"A new NATO defense plan reported by the Wall Street Journal would authorize allied forces to strike deep into Russian territory, formalizing a posture shift first previewed at a June Deep Strike Symposium, the first of its kind in alliance history. Air Force General Alexus Grynkewich, NATO's Supreme Allied Commander Europe, outlined the rationale at the Warsaw Security Forum, arguing that Ukraine's experience shows long-range strikes on military and industrial targets are essential when air defenses are stretched thin. The doctrine reflects growing alliance anxiety about Russia's ability to regenerate forces and strike capacity even amid ceasefire talk.","source":"EADaily (via WSJ)","url":"https://www.eadaily.com/en/news/2026/11/03/natos-new-defense-plan-aims-to-strike-deep-into-russia-wsj"},{"headline":"Eurozone Inflation Jumps to 4%, Doubling ECB Target","body":"Eurostat's flash estimate showed annual eurozone inflation accelerating to 4% in October, up from 3.8% in September and the highest reading since September 2023, driven largely by surging energy costs. Italy posted the sharpest increase among member states, while newly-euro-adopting Bulgaria logged 6%; Germany was a relative outlier, with recent tax cuts holding its rate down. Economists now expect inflation to keep climbing toward 4.5% by January, intensifying pressure on the European Central Bank to resume rate hikes even as growth in France and Italy stays anemic.","source":"Euronews","url":"https://www.euronews.com/2026/11/04/eurozone-inflation-hits-4-which-countries-saw-prices-jump-the-most"}]},"middleEast":[{"headline":"Tanker Fires Near Strait of Hormuz Raise Fears of Wider Iran Clash","body":"Iran's IRGC said four oil tankers caught fire after striking naval mines near the Strait of Hormuz on November 3-4, with two additional vessels reportedly seized, while Saudi Arabia intercepted three drones and Lebanon reported an Israeli strike killing one person. President Trump said no decision has been made on a larger strike against Iran but warned of a heavy response if provoked further, even as the carrier USS Theodore Roosevelt moves into the CENTCOM area of responsibility. Qatar is mediating between Washington and Tehran, and Iranian President Masoud Pezeshkian said Iran wants dialogue, warning a renewed war would serve no one's interests.","source":"Jerusalem Post / Gulf News","url":"https://gulfnews.com/world/mena/middle-east-conflict-trump-warns-of-heavy-hit-as-iran-says-americans-voted-no-to-war-1.500735100"},{"headline":"Trump Moves to End $4 Billion in Annual U.S. Military Aid to Israel","body":"President Trump announced plans to terminate roughly $4 billion in longstanding annual U.S. military assistance to Israel, a package that dates to a 2016 agreement which took effect in 2019. Trump said the decision originated with Israeli Prime Minister Benjamin Netanyahu, while insisting Washington would still intervene to help Israel when necessary. The announcement lands just as Israel's Central Elections Committee formally certified results of the 26th Knesset election to President Isaac Herzog.","source":"Times of Israel","url":"https://www.timesofisrael.com/"},{"headline":"Syria Says It Foiled Hezbollah-Linked Plot to Bomb Homs Refinery","body":"Syria's Internal Security Forces announced November 3 that they disrupted a plot to bomb the Homs oil refinery, blaming a cell tied to Lebanon's Hezbollah militia. The alleged plot comes as Damascus under President Ahmad al-Sharaa pursues closer economic ties with Beijing, including a new Syrian-Chinese economic forum, and courts Iraqi investment through a high-profile visit by an Iraqi delegation. The episode highlights persistent sabotage risks to Syria's fragile energy infrastructure even as the post-Assad government tries to attract foreign investment and stabilize its economy.","source":"Syrian Observer","url":"https://syrianobserver.com/2026/11/04"}],"techAI":{"aiCompetition":[{"headline":"OpenAI Slashes Fundraising Target as AI Investor Appetite Cools","body":"OpenAI has secured roughly $11 billion in commitments for its latest funding round, less than half of its original $30 billion target, and has formally cut its goal to $20 billion as some large investors scaled back amid broader jitters over AI valuations. The financing now values the ChatGPT maker at $1.25 trillion, down from the $1.4 trillion it sought last month, with a UAE-backed consortium including MGX expected to anchor the round alongside Sequoia, Andreessen Horowitz and Coatue. The pullback is one of the clearest signs yet that investor enthusiasm for the biggest AI labs may be plateauing even as compute buildouts accelerate.","source":"Dataconomy / Financial Times","url":"https://dataconomy.com/2026/11/02/openai-secures-11-billion-after-cutting-funding-target/"},{"headline":"Anthropic Discloses Nearly $900 Billion in Compute Commitments Ahead of IPO","body":"Anthropic's updated Nasdaq prospectus shows the Claude developer booked $17 billion in third-quarter revenue, up 47% sequentially, but swung to a $567 million operating loss while disclosing roughly $895 billion in long-term purchase and lease commitments, mostly for computing capacity. That obligation dwarfs the $131.8 billion in cash and short-term investments Anthropic held at the end of September. Investors are reportedly pushing the IPO valuation down to $1.5-1.6 trillion from earlier $2 trillion talk, with roadshow meetings set to begin the week of November 9 and a debut targeted before Thanksgiving.","source":"Euronews","url":"https://www.euronews.com/2026/11/03/anthropic-swings-back-to-operating-loss-as-895-billion-compute-bill-looms-over-ipo"}],"cyberEmerging":[{"headline":"UK Cyber Chief: China Best Positioned for AI-Powered Infrastructure Attack by 2028","body":"Britain's National Cyber Security Centre warned in its annual State of the Cyber Nation report that an AI-enabled ransomware strike on UK critical infrastructure is highly likely within two years, singling out China as the state actor best positioned to carry one out. NCSC chief Richard Horne said AI will let attackers find and exploit long-tolerated software weaknesses at unprecedented scale, citing recent cyberattacks on French supermarket refrigeration systems as a preview of civilian-infrastructure risk. The UK government paired the report with a fresh 70 million pound investment in a new vulnerability-monitoring unit called the Nerv Centre.","source":"New Civil Engineer / NCSC","url":"https://www.newcivilengineer.com/latest/highly-likely-ai-will-be-used-in-ransomware-attack-on-uk-critical-infrastructure-03-11-2026/"},{"headline":"Beijing Moves to Lock Down Export of Its Own AI Models and Chip Designs","body":"China's commerce and science ministries are advancing a draft rule that would add roughly 23 to 40 AI-related technologies, including large model weights, autonomous agents, chip-design methods and computing-cluster know-how, to its restricted export catalog, with public comments closing November 15. The proposal marks the first time Beijing has sought to control outbound flows of trained AI systems and software rather than just hardware entering the country, and would even classify running a covered model on foreign servers as an export. Separately, Taiwan is moving to criminalize unauthorized shipments of Nvidia-class AI chips to China after smuggling routes through Japan, Indonesia and Hong Kong were exposed, underscoring how both Washington's allies and Beijing are tightening the technology perimeter from opposite directions.","source":"Modern Diplomacy / Asia Times","url":"https://moderndiplomacy.eu/2026/10/28/why-is-china-restricting-ai-exports-while-expanding-access-to-its-technology/"}]},"cities":{"lasVegas":[{"headline":"Aaron Ford Elected Nevada's First Black Governor","body":"Democrat Aaron Ford unseated incumbent Republican Gov. Joe Lombardo on Tuesday, becoming the first Black governor in Nevada history. The win came alongside a broader Democratic sweep of top state offices, including attorney general and secretary of state, as the party also made gains in the legislature. Ford, previously Nevada's attorney general, will take office amid a state budget and infrastructure agenda shaped by a newly Democratic-leaning Assembly.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Nevada Voters Add Abortion Rights and Voter ID to State Constitution","body":"Nevadans approved a pair of constitutional amendments on Tuesday, one enshrining abortion rights and another mandating voter identification at the polls. Both measures needed a second consecutive statewide vote under Nevada's unusual two-election amendment process before taking permanent effect. The dual results reflect a split electorate willing to back both a progressive abortion protection and a traditionally conservative-favored election integrity measure in the same cycle.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/politics-and-government/nevada/early-election-results-show-nevada-voters-willing-to-change-states-constitution-3909551/"},{"headline":"Henderson Mayor Michelle Romero Wins Reelection","body":"Henderson Mayor Michelle Romero defeated challenger Hollie Chadwick, a former police chief, to secure a second term leading Nevada's second-largest city. Romero had entered the general election with a commanding lead from the June primary, where she captured nearly 50 percent of the vote to Chadwick's 23 percent. Her victory keeps continuity in Henderson's city hall as the suburb continues rapid growth on the Las Vegas Valley's southeastern edge.","source":"Las Vegas Review-Journal / Wikipedia","url":"https://en.wikipedia.org/wiki/2026_Henderson,_Nevada_mayoral_election"}],"nellis":[{"headline":"Air Force Floats $1 Billion F-47 Test Campus at Nellis","body":"The Air Force has posted a pre-solicitation notice outlining plans for a new, roughly $1 billion test campus at Nellis Air Force Base dedicated to the next-generation F-47 fighter under the Next Generation Air Dominance program. The facility would be built primarily on the east side of the base in the northeast Las Vegas Valley. The move would extend Nellis's decades-long role hosting advanced combat aviation testing, following the recent retirement of the base's last A-10 Warthog.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/military/air-force-seeks-1b-campus-at-nellis-to-make-fighter-jets-3905477/"}]},"feelGood":[{"headline":"Idaho Guard Helicopter Crew Plucks Injured Hiker Off Remote Trail","body":"An Idaho Army National Guard HH-60 Black Hawk crew hoisted a 46-year-old woman with a broken ankle off a trail near New Meadows on October 29 after local fire crews determined the terrain was impassable even by dirt bike. It marked the unit's second remote rescue in as many months and its 17th successful search-and-rescue mission of the year. Local fire chief Doug Buys credited the Guard's aviation capability with reaching victims no ground vehicle could access.","source":"Idaho National Guard / Before It's News","url":"https://beforeitsnews.com/military/2026/11/idaho-army-national-guard-conducts-remote-rescue-mission-2494089.html"},{"headline":"WWE Stars Surprise Military Kids at Nellis Air Force Base","body":"The USO brought WWE performers to Nellis Air Force Base to celebrate Purple Up Day, a tradition honoring children of deployed and active-duty service members, surprising airmen's families with event tickets and a school assembly appearance. The gesture gave Nellis military kids a morale boost and public recognition of the sacrifices tied to a parent's service. Such USO partnerships remain a recurring bright spot for families stationed at the base.","source":"Military.com","url":"https://www.military.com/topics/nellis-air-force-base"},{"headline":"Food Bank Volunteers in Washington Town Restore a Writer's Faith in People","body":"A longtime volunteer at a food bank in Port Townsend, Washington, described six months of serving alongside fellow community members who, she said, changed her outlook as much as the people they help. Writing for a reader-submitted kindness column, she noted that amid a divided and often hostile national mood, the quiet generosity of her fellow volunteers offered real reason for optimism. The essay is one of dozens of first-person accounts of everyday kindness published this week highlighting ordinary people choosing compassion over cynicism.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/feel-good-stories"}],"onThisDay":[{"year":"1922","event":"Archaeologist Howard Carter discovered the entrance to King Tutankhamun's tomb in the Valley of the Kings."},{"year":"1979","event":"Iranian militants stormed the US Embassy in Tehran, beginning the 444-day hostage crisis."},{"year":"1995","event":"Israeli Prime Minister Yitzhak Rabin was assassinated by a right-wing extremist at a Tel Aviv peace rally."},{"year":"2008","event":"Barack Obama was elected as the first African American President of the United States."}]},"topPicks":[{"headline":"Democratic Midterm Sweep Threatens Pentagon's $1.5 Trillion Budget Plan and Hegseth's Standing","teaser":"A historic midterm sweep could force major cuts to defense spending and shake up Pentagon leadership."},{"headline":"US Forces Strike Iranian Targets on Qeshm Island After SAM Fire on American Aircraft","teaser":"Direct US-Iran military clash raises fears of wider escalation across the Persian Gulf region."},{"headline":"Russia Launches Largest Energy Strike of the War, Komyshuvakha Toll Hits 40","teaser":"A devastating barrage on Ukraine's power grid marks a dangerous new peak in the ongoing conflict."}]},"navDates":[{"key":"2026-11-08","label":"Nov 8","href":"/","isNewest":true},{"key":"2026-11-07","label":"Nov 7","href":"/archive/2026-11-07.html","isNewest":false},{"key":"2026-11-06","label":"Nov 6","href":"/archive/2026-11-06.html","isNewest":false},{"key":"2026-11-05","label":"Nov 5","href":"/archive/2026-11-05.html","isNewest":false},{"key":"2026-11-04","label":"Nov 4","href":"/archive/2026-11-04.html","isNewest":false},{"key":"2026-11-03","label":"Nov 3","href":"/archive/2026-11-03.html","isNewest":false},{"key":"2026-11-02","label":"Nov 2","href":"/archive/2026-11-02.html","isNewest":false}],"currentKey":"2026-11-04","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-04.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
