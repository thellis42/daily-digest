<script>
const STATE = {"digest":{"date":"Thursday, November 5, 2026","generatedAt":"Thu, Nov 5, 9:23 AM PST","breaking":{"headline":"Democratic Midterm Sweep Puts Hegseth's Job and Pentagon's $1.5T Budget in Jeopardy","body":"Following Tuesday's sweeping Democratic wins in the midterms, Defense Secretary Pete Hegseth is facing a near-certain impeachment vote, with Rep. Thomas Massie (R-Ky.) saying he will refile his eight articles of impeachment - which accuse Hegseth of human-rights abuses and waging an unauthorized war on Iran - when Congress reconvenes next week unless Hegseth resigns first. Multiple GOP sources now believe the measure could pass with bipartisan support, a dramatic shift from September when Speaker Mike Johnson blocked a vote before the election. The political earthquake also threatens the administration's defense agenda: with Republicans losing the simple-majority reconciliation tool, marquee projects like the Golden Dome missile shield and the full $1.5 trillion defense budget request now face long odds, even as Trump insists Hegseth is 'doing a very good job.'","source":"Stars and Stripes / Axios","url":"https://www.stripes.com/theaters/us/2026-11-05/hegseth-could-face-impeachment-massie-23371684.html"},"tabs":{"defense":{"defense":[{"headline":"Army Consolidates Sensor Offices Into Single Surveillance Command","body":"The U.S. Army has merged two of its sensor acquisition offices into one organization tasked with overseeing both aerial and ground surveillance programs. The reorganization is meant to speed up fielding of drone and sensor technology as the service scales production under its broader manufacturing push. It follows recent Pentagon pressure on acquisition chiefs to accelerate fielding timelines across the services.","source":"The Defence Blog","url":"https://defence-blog.com/"},{"headline":"State Department Clears $2.1 Billion Patriot Missile Sale to Ukraine","body":"The State Department has approved a potential $2.1 billion foreign military sale of Patriot air-defense missiles to Ukraine, one of the larger single approvals of the war. The move comes as Kyiv continues to press Washington and European allies for more air-defense interceptors heading into another winter of Russian strikes on infrastructure. The sale still requires congressional notification steps before contracts are finalized.","source":"Inside Defense","url":"https://insidedefense.com/content/inside-pentagon-november-5-2026"},{"headline":"NATO Selects French Alta Ares Counter-Drone System for Bases and Troops","body":"NATO has chosen France's Alta Ares counter-drone system to help protect alliance troops and installations, a decision that comes amid intensifying drone and electronic-warfare threats along the eastern flank. The selection follows a day in which GPS jamming disrupted signals across nearly the entire NATO eastern frontier, underscoring allied urgency to field layered counter-drone defenses. Germany has separately deployed its Vanta 24 drone ship to track Russian shadow-fleet tankers in the Baltic.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/aerospace-news/2026/russias-reported-missile-launcher-deal-highlights-potential-shift-in-irans-mi-28-helicopter-capabilities"}],"acquisitions":[{"headline":"General Atomics Joins Army-Navy Hypersonic Glide Body Production Line","body":"General Atomics Electromagnetic Systems has been brought onto the production line for the Common Hypersonic Glide Body, the shared warhead used by the Army's Dark Eagle Long-Range Hypersonic Weapon and the Navy's Conventional Prompt Strike missile. The addition widens the industrial base supporting the Pentagon's hypersonic weapons programs as both services work to field operational units. The move reflects ongoing efforts to reduce bottlenecks that have slowed hypersonic production schedules.","source":"The Defence Blog","url":"https://defence-blog.com/"},{"headline":"Air Force Pushes for 1,000 More ERAM Long-Range Missiles Within 15 Months","body":"The Air Force is seeking roughly 1,000 additional Extended Range Attack Munitions (ERAM) to be delivered within the next 15 months, building on an initial lot of 840 missiles slated for delivery by the end of October. The munitions can be fitted with infrared or anti-radiation seekers, letting them strike targets by heat signature or home in on enemy air-defense radar emissions. The push reflects urgency to replenish long-range strike stockpiles after sustained use in recent conflicts.","source":"The Defence Blog","url":"https://defence-blog.com/category/news/"}]},"us":[{"headline":"Ninth Circuit Clears DOJ to Resume Pressuring Election Officials on Midterm Ballots","body":"A divided 9th U.S. Circuit Court of Appeals voted 6-5 on November 3 to lift a San Francisco judge's order that had barred the Justice Department from pressuring state and local election officials to set aside ballots it claims may have been cast by noncitizens. The panel reversed U.S. District Judge Trina Thompson, who had found DOJ and DHS officials ran an intimidation campaign against election workers ahead of Tuesday's vote. The ruling came just a day after the Supreme Court separately rejected a related Trump administration bid to force California to segregate roughly 20,000 contested ballots, underscoring a chaotic, fast-moving legal fight over election administration playing out in real time on Election Day.","source":"Axios / Bloomberg","url":"https://www.axios.com/2026/11/03/appeals-court-election-intimidation-restrictions-trump"},{"headline":"Lame-Duck Congress Faces Dec. 11 Funding Cliff and Stalled Defense Bill","body":"Lawmakers return to Washington on November 9 for a lame-duck session with a stopgap law, Public Law 119-103, keeping agencies funded only through December 11 and a dozen full-year appropriations bills still unwritten. The annual National Defense Authorization Act, which sets Pentagon policy and spending levels, also remains unfinished heading into the session. With the balance of power shifting after Tuesday's midterms, analysts warn a partisan standoff over spending levels, policy riders and health-care provisions could trigger a funding lapse right around the holidays.","source":"govtschemes.org / ABC News","url":"https://govtschemes.org/government-shutdown-2026-update/"},{"headline":"Supreme Court Weighs Emergency Bid Over Texas Border Wall Construction","body":"Advocacy groups are urging the Supreme Court to leave in place a lower-court order that has halted new border wall construction in southwestern Texas, with the case now sitting on the Court's emergency 'shadow' docket. The dispute is one of several immigration-enforcement fights reaching the justices this week as the Court's November argument session, which opened November 2, also features cases on federal officer accountability and eminent domain compensation for interstate pipelines. The border wall fight adds to a term already packed with disputes testing the limits of executive power over immigration and property rights.","source":"SCOTUSblog","url":"https://www.scotusblog.com/"},{"headline":"Fed Holds Rates Near 4% as Two Governors Push for a Hike","body":"The Federal Reserve kept its benchmark rate in a 3.75%-4% range at its October 28 meeting, with Chair Kevin Warsh's committee again citing inflation that 'remains elevated' even as hiring holds steady. Governor Lisa Cook and Cleveland Fed President Beth Hammack dissented in favor of an immediate quarter-point increase, and futures markets tracked by trading desks were pricing the effective rate rising toward roughly 4.1% by February. The next FOMC meeting falls December 8-9, setting up a contentious year-end decision just as a new, more Democratic Congress prepares to take up spending and oversight fights with the administration.","source":"NPR","url":"https://www.npr.org/2026/10/28/nx-s1-6020425/federal-reserve-interest-rates-inflation"}],"pacific":{"pacificCommand":[{"headline":"Quad Navies Launch Malabar 2026 Off Japan","body":"The United States, Japan, India and Australia opened the latest iteration of Exercise Malabar at Funakoshi near Yokosuka on November 5, kicking off shore and at-sea drills involving U.S. Navy, Indian Navy, Japan Maritime Self-Defense Force and Australian Defence Force units. The drill, which has grown in scope since Australia and Japan joined what was once a bilateral U.S.-India exercise, comes as the four Quad navies deepen interoperability amid growing concern over Chinese naval activity. It follows a busy fortnight of Indo-Pacific drills, including India's AUSTRAHIND exercise with Australia in Kerala and a bilateral naval exercise with South Korea at Busan.","source":"EIN Presswire / U.S. Navy","url":"https://einpresswire.com/article/954726626/funakoshi-hosts-forces-from-australia-india-japan-and-u-s-for-start-of-exercise-malabar-2026"},{"headline":"India Signs $5.7B Corvette Deal in Naval Buildup Push","body":"India inked a $5.7 billion contract this week with domestic shipbuilders to construct eight next-generation corvettes for anti-submarine, anti-surface and coastal-defense missions, part of a broader naval modernization drive that also includes plans to acquire six advanced submarines with Germany and base 26 French Rafale Marine jets aboard its carriers. The push coincides with the frigate INS Sahyadri completing a bilateral exercise with South Korea's navy at Busan on October 29, and Defence Minister Rajnath Singh holding industrial-cooperation talks with his South Korean counterpart in Cebu. New Delhi is also expanding coast guard patrols alongside Quad partners, with an Indian offshore patrol vessel recently sailing from Chennai to Perth.","source":"Indo-Pacific 5x5 / WION","url":"https://indopacificinsights.substack.com/p/indo-pacific-5x5-november-4th-2026"},{"headline":"Four-Nation 'Squad' Deepens Philippines Defense Ties","body":"Defense ministers from Australia, Japan, the Philippines and the United States met on October 28 and agreed to expand joint exercises, policy consultations and infrastructure investment in the Philippines, building on Manila and Washington's plan to carry out more than 500 bilateral defense activities in 2026. Japan and the Philippines used October's ASEAN defense meetings in Cebu to formalize logistics-sharing arrangements, with Japan's Air Self-Defense Force receiving supplies from the Philippine Air Force under a new deal. The moves reflect an increasingly operational 'Squad' framework meant to counter Chinese pressure in the South China Sea, even as Tokyo's new defense white paper signals it is hedging against reduced reliance on Washington alone.","source":"Pacific Strategic Intelligence Weekly / IPDefenseForum","url":"https://ipdefenseforum.com/2026/11/more-than-500-defense-activities-bolster-longtime-philippines-u-s-alliance"}],"pacingThreat":[{"headline":"Beijing Warns Manila as Philippine Officials Call China a 'Troublemaker'","body":"Chinese Foreign Minister Wang Yi phoned his Philippine counterpart on November 4 accusing unnamed Filipino politicians of 'malicious interference' in bilateral ties and demanding Manila speak with a 'unified, reasonable voice' on the South China Sea dispute. The call came after the Philippine defense secretary branded China a regional 'troublemaker,' prompting China's ambassador to Manila to retort that Beijing could 'easily win' if force were used, a remark President Ferdinand Marcos Jr. said sounded like a threat. The exchange marks a sharp rhetorical escalation even as the two sides have avoided a repeat of earlier physical clashes near Second Thomas Shoal.","source":"Associated Press / Washington Times","url":"https://www.washingtontimes.com/news/2026/nov/4/china-warns-philippines-cautious-south-china-sea/"},{"headline":"PLA Sorties Surge, Satellite Imagery Shows New Amphibious Ship Buildup","body":"Taiwan's Ministry of National Defense recorded 21 PLA aircraft sorties and 8 PLAN warships in the 24 hours to the morning of November 5, with 19 of those sorties crossing the Taiwan Strait median line into the island's ADIZ. The intensity follows a week (October 26-November 1) in which 85 PLA sorties were logged, an 85-percent jump from the prior week. Separately, open-source satellite tracking cited by the South China Morning Post shows China building six new Type 071 amphibious transport docks across two shipyards, a buildup analysts say undercuts earlier U.S. assessments that Beijing lacks the sealift needed for a large-scale assault on Taiwan.","source":"Taiwan MND / South China Morning Post","url":"https://www.mnd.gov.tw/en/news/plaact/88146"},{"headline":"Taiwan's Defense Budget Fight Drags On Amid PLA Pressure","body":"Taiwan's Legislative Yuan this week began hearings on a record NT$691.9 billion (US$21.1 billion) 2027 defense budget covering submarine-program milestones and classified U.S. military cooperation spending, even as a separate NT$607.6 billion supplementary budget remains stalled over opposition efforts to freeze drone and counter-drone procurement funds. KMT and TPP lawmakers pushed proposals to cut or freeze over NT$1 billion in unmanned-systems and general armament spending before negotiators settled on a 5-percent reduction. The persistent partisan wrangling over funding asymmetric capabilities comes as Beijing's military pressure around the island intensifies.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/11/06/2003867259"}]},"europe":{"ukraineRussia":[{"headline":"Death Toll in Russian Strike on Zaporizhzhia Shelter Rises to 40","body":"Ukrainian officials say the toll from Monday's Russian strike on a humanitarian aid hub and underground shelter in Komyshuvakha, Zaporizhzhia region, has climbed to 40 civilians, making it one of the deadliest single attacks on civilians in the nearly five-year war. Rescue crews were still searching through rubble at the school-turned-shelter site days after the strike, while a follow-up attack reportedly hit the same shelter as people sought cover. The episode has intensified scrutiny of Russia's targeting patterns just as diplomats prepare for renewed peace talks.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/11/4/ukraine-raises-death-toll-from-russian-strike-on-zaporizhia-to-40-people"},{"headline":"US to Host New Trilateral Peace Talks in Abu Dhabi Nov. 10-11","body":"The Kremlin has confirmed that Russian, Ukrainian and American delegations will meet in Abu Dhabi on November 10-11 for the first US-mediated trilateral talks since February, when the process was shelved amid the Iran war. Putin aide Vladimir Medinsky will lead Moscow's delegation, while US envoys Steve Witkoff and Jared Kushner represent Washington; the agenda covers post-war security guarantees, de-escalation and humanitarian measures. Zelensky has insisted Kyiv will not accept any deal negotiated without it, even as Russia continues major strikes on Ukrainian energy infrastructure that this week left Kyiv with its worst water outage of the full-scale war.","source":"Reuters via U.S. News","url":"https://www.usnews.com/news/world/articles/2026-11-03/kremlin-confirms-trilateral-ukraine-peace-talks-in-abu-dhabi-next-week"}],"europe":[{"headline":"NATO Drafts Plan for Deep Strikes Into Russian Territory","body":"The Wall Street Journal reports that NATO is preparing a new defense plan that would authorize strikes on military and defense-industrial targets deep inside Russia rather than relying solely on eastern-flank barriers and checkpoints. The alliance's top commander in Europe, Gen. Alexus Grynkewich, outlined the thinking at the Warsaw Security Forum, building on a June 'Deep Strike Symposium' that examined long-range strike doctrine. The shift reflects lessons from Ukraine's war, where shortages of air defenses have underscored the value of hitting an adversary's rear-area industrial base before missiles and drones can be launched.","source":"Ukrainska Pravda / WSJ","url":"https://pravda.com.ua/eng/news/2026/11/04/8061236"},{"headline":"Von der Leyen: Hormuz Fallout Has Cost EU €127 Billion in Energy Costs","body":"European Commission President Ursula von der Leyen said the closure of the Strait of Hormuz amid the Iran war has added €127 billion to the EU's fossil-fuel import bill without any increase in actual fuel volumes received, with costs rising €21 billion since October alone. EU energy ministers meeting in Luxembourg this week failed to agree on new measures to cushion household bills as benchmark gas prices hover near €100 per megawatt-hour, levels unseen since the 2022 crisis. Officials now warn this winter's affordability crunch could be worse than 2022, with roughly 50 million Europeans already unable to adequately heat their homes.","source":"Izvestia / Euronews","url":"https://iz.ru/en/node/2196021"}]},"middleEast":[{"headline":"Israeli Election: Eisenkot Builds Coalition Lead Over Netanyahu","body":"Following the 2026 Knesset election, which saw record turnout of 77.7%, Benny Gantz-aligned figure Gadi Eisenkot has secured the backing of 67 MKs including Arab parties, compared to 46 for Benjamin Netanyahu, as President Isaac Herzog formally opened coalition talks. Netanyahu has sharpened attacks on Mahmoud Abbas and is leaning on ultra-Orthodox and Ra'am support to narrow the gap, while Shas insists it remains unified despite pressure. The outcome will determine Israel's negotiating posture on Gaza disarmament and ties with Washington just as the US Congress shifts toward Democratic control.","source":"The Jerusalem Post","url":"https://www.jpost.com/israel-election-2026/2026-11-05/live-updates-913880"},{"headline":"Tankers Catch Fire in Strait of Hormuz Amid Houthi Escalation","body":"Iran's Revolutionary Guard Corps said two oil tankers and a tugboat caught fire in separate incidents in the Strait of Hormuz, including one vessel that reportedly struck a mine while using an 'unauthorized route.' The incidents coincide with intensified Houthi attacks further south, including a claimed strike on King Fahd Airport in Dammam and an intercepted missile aimed at Medina, keeping Gulf shipping lanes on edge. A senior IRGC adviser also warned Tehran would target 'enemy leaders' if Iranian commanders are attacked in any renewed conflict with the US and Israel.","source":"Khaleej Times","url":"https://www.khaleejtimes.com/world/mena/us-israel-iran-saudi-arabia-yemen-war-live-updates-november-5-2026"},{"headline":"Syria and Saudi Arabia Sign Defense Pact as al-Sharaa Returns to Riyadh","body":"Syrian President Ahmed al-Sharaa made his second visit to Riyadh in under a month, where Damascus and Riyadh signed a defense cooperation agreement alongside $403 million in Saudi loans. The deal signals Gulf states' deepening bet on al-Sharaa's post-Assad government as a stabilizing partner amid regional de-escalation calls following the Iran war. It also comes as Syria faces separate friction with Jordan over cross-border strikes against ISIS remnants, underscoring the fragile security landscape Riyadh is trying to help manage.","source":"Al Jazeera","url":"https://www.aljazeera.com/middle-east/"}],"techAI":{"aiCompetition":[{"headline":"Google's Gemini 4 Carbon Leapfrogs Claude and GPT-6 Atop Benchmark Rankings","body":"Google's newly released Gemini 4 Carbon has edged out Anthropic's Claude Opus 5.5 and OpenAI's GPT-6 Astra to claim the top spot on Artificial Analysis's Intelligence Index v5, scoring 59 points versus 58 for Opus 5.5 and 57 for GPT-6 Astra. The model also reportedly posts the lowest hallucination rate among the three and wins four of nine individual evaluation categories while undercutting rivals on cost per task. The reshuffle, the latest in a string of leadership swaps this year, matters for government and defense buyers whose procurement increasingly tracks live benchmark standing rather than vendor loyalty.","source":"Tom's Hardware","url":"https://www.tomshardware.com/tech-industry/artificial-intelligence/google-reveals-new-gemini-4-carbon-ai-model-narrowly-beating-claude-opus-5-5-frontier-ai-model-is-also-the-least-likely-to-hallucinate-benchmarks-claim"},{"headline":"OpenAI Slashes Funding Target to $20B as Anthropic's IPO Nears","body":"OpenAI has cut the size of its pending private funding round by a third, from $30 billion to roughly $20 billion, at a valuation near $1.25 trillion, as a broader tech selloff collides with rival Anthropic's drive toward a mid-November public listing. Anthropic filed its S-1 on October 26 under the planned ticker ANT and is seeking a valuation as high as $2 trillion, with first-half 2026 revenue reported at $16.29 billion, giving markets their first audited look at a frontier lab's finances. The dueling capital pushes are splitting the same pool of sovereign wealth and institutional investors, and a soft Anthropic debut could reset how all private AI valuations are priced going forward.","source":"Tech Insider (via Financial Times/Reuters reporting)","url":"https://tech-insider.org/openai-cuts-funding-target-10-billion-1-25-trillion-valuation-2026/"}],"cyberEmerging":[{"headline":"Binance Blames $6 Billion Heist on Rigged Coding Test, Abused AI Tool","body":"Binance's first formal incident report, published November 4, traces its record-breaking crypto theft to a months-long operation that used a fake coding assignment and a manipulated AI coding tool to compromise three engineers' machines. The scheme bypassed traditional smart-contract defenses entirely by targeting developer workflows, making it one of the largest crypto breaches on record. It is likely to accelerate scrutiny from U.S. regulators and CISA over how exchanges and fintechs vet AI coding assistants wired into sensitive production systems.","source":"SecurityWeek","url":"https://www.securityweek.com/"},{"headline":"AI-Agent Infrastructure Emerges as New Breach Vector Across Dev Platforms","body":"Within the same 72-hour window, developer platforms WorkOS, Northflank, Trigger.dev and GitBook each disclosed separate intrusions tied to AI-agent systems, including stolen control-plane secrets, misused AI API keys, and credential theft via AI-agent attacks. Northflank told all customers to rotate integration and project secrets after attackers hit its control plane, while GitBook confirmed an AI-agent-driven breach reached infrastructure credentials on November 2. The cluster signals that AI coding agents and the credentials securing them have become a top target as firms race to embed them into production without mature access controls.","source":"SecurityWeek / BleepingComputer","url":"https://www.securityweek.com/"}]},"cities":{"lasVegas":[{"headline":"Aaron Ford Elected Nevada's First Black Governor","body":"Nevada Attorney General Aaron Ford won the governor's race in Tuesday's midterm election, becoming the state's first Black governor and one of only a handful in U.S. history. His win caps a Democratic sweep of statewide offices in Nevada this cycle. Final certification of down-ballot races continued into Wednesday as county clerks finished tallying ballots.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Nevada Voters Add Abortion Rights and Voter ID to Constitution","body":"Nevada voters approved companion constitutional amendments this week that enshrine abortion rights protections while also mandating voter identification at the polls, with both measures passing by comfortable margins. The dual results reflect a split electorate willing to back both a progressive priority and a conservative-backed election integrity measure in the same cycle. Implementation details, including how the voter ID requirement will be phased in for future elections, are expected to be worked out by the Legislature.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Razor-Thin Local Races Still Being Sorted in Clark County","body":"A Las Vegas City Council Ward 2 contest between Municipal Court Judge Shannon Nordstrom and firefighter Luke McCarthy remained extremely close as of Wednesday's unofficial count, illustrating how tight down-ballot races can be even in a high-turnout midterm. In North Las Vegas, voters were choosing a successor to term-limited Mayor Pamela Goynes-Brown, with Democratic Party chair Daniele Monroe-Moreno facing off against longtime city councilman Scott Black. Clark County's new election results portal saw heavy traffic as residents tracked both races into Wednesday.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/"}],"nellis":[{"headline":"Air Force Fast-Tracks $1 Billion-Plus F-47 Test Campus at Nellis","body":"The Air Force is moving ahead with plans for a sprawling new F-47 Future Campus at Nellis Air Force Base, a project expected to top $1 billion and include a roughly 117,000-square-foot flightline and maintenance facility plus dedicated space for handling the jet's low-observable and radar-absorbent materials. The service wants construction finished by 2031 as it races to field the sixth-generation Boeing fighter, which will eventually replace the F-22. While initial F-47 flight testing will happen at Edwards Air Force Base in California, Nellis is being positioned for a broader operational integration role, leveraging its proximity to Creech Air Force Base's experimental Collaborative Combat Aircraft drone unit and the vast Nevada Test and Training Range.","source":"Air & Space Forces Magazine / Zona Militar","url":"https://www.airandspaceforces.com/air-force-billion-dollar-campus-testing-f-47-nellis/"}]},"feelGood":[{"headline":"New Jersey Students Pack a Football Field With Donated Food","body":"Hundreds of students across New Jersey turned a football field into a sea of donation bags this week, collecting more than 250,000 pounds of food for families in need and setting a new record for the nonprofit that organized the drive. The sheer scale of youth-led participation shows how a single coordinated effort can translate into a massive, tangible boost for local food banks heading into the holiday season.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Stranger's Quiet Thank-You Touches Veteran at Costco Food Court","body":"At a Costco food court in Riverhead, New York, veteran John Christina and a fellow former service member were swapping stories when a woman seated nearby, who said she lived on Shelter Island, interrupted to thank them for their service and left a gift before Christina could even catch her name. He's now hoping to track her down just to say thank you in return, saying the unprompted gesture from a total stranger renewed his pride in the country. The moment, first reported this week, is a small but pointed reminder of how a few sincere words from a stranger can land hard.","source":"Yahoo Lifestyle","url":"https://www.yahoo.com/lifestyle/articles/veteran-seeks-stranger-handed-him-195913210.html"},{"headline":"Missing Airman's Dog Tags Finally Reach His Family After 56 Years","body":"In a recent ceremony tied to Nellis Air Force Base, the identification tags of an aviator long listed as missing in action were formally returned to his family more than five decades after he was lost, closing a painful chapter for relatives who had waited since the Vietnam War era for any tangible trace of him. Base personnel involved in the accounting effort described the handoff as a rare, deeply emotional milestone in the military's long-running mission to bring every missing service member home in some form. Stories like this underscore the quiet, patient work the Pentagon's recovery agencies still do decades after a conflict ends.","source":"Nellis Air Force Base / U.S. Air Force Warfare Center","url":"https://www.nellis.af.mil/Nellis-News/Videos/"}],"onThisDay":[{"year":"1605","event":"The Gunpowder Plot to assassinate King James I of England was foiled when Guy Fawkes was discovered guarding explosives beneath Parliament."},{"year":"1872","event":"Susan B. Anthony was arrested for illegally voting in the U.S. presidential election to test women's suffrage rights."},{"year":"1940","event":"Franklin D. Roosevelt was elected to an unprecedented third term as U.S. President."},{"year":"1968","event":"Richard Nixon was elected the 37th President of the United States, defeating Hubert Humphrey."}]},"topPicks":[{"headline":"Democratic Midterm Sweep Puts Hegseth's Job and Pentagon's $1.5T Budget in Jeopardy","teaser":"A major electoral shift threatens the Defense Secretary's tenure and could reshape the Pentagon's massive budget plans."},{"headline":"NATO Drafts Plan for Deep Strikes Into Russian Territory","teaser":"NATO's move toward authorizing strikes inside Russia marks a dramatic escalation with global security implications."},{"headline":"Death Toll in Russian Strike on Zaporizhzhia Shelter Rises to 40","teaser":"A deadly strike on a civilian shelter underscores the escalating human cost of the ongoing war in Ukraine."}]},"navDates":[{"key":"2026-11-07","label":"Nov 7","href":"/","isNewest":true},{"key":"2026-11-06","label":"Nov 6","href":"/archive/2026-11-06.html","isNewest":false},{"key":"2026-11-05","label":"Nov 5","href":"/archive/2026-11-05.html","isNewest":false},{"key":"2026-11-04","label":"Nov 4","href":"/archive/2026-11-04.html","isNewest":false},{"key":"2026-11-03","label":"Nov 3","href":"/archive/2026-11-03.html","isNewest":false},{"key":"2026-11-02","label":"Nov 2","href":"/archive/2026-11-02.html","isNewest":false},{"key":"2026-11-01","label":"Nov 1","href":"/archive/2026-11-01.html","isNewest":false}],"currentKey":"2026-11-05","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-05.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
