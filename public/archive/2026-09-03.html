<script>
const STATE = {"digest":{"date":"Thursday, September 3, 2026","generatedAt":"Thu, Sep 3, 10:01 AM PDT","breaking":{"headline":"US-Iran War Enters Seventh Month as Strikes Widen Around Strait of Hormuz","body":"US Central Command launched its largest strike package since July on September 1, hitting roughly 100 IRGC-linked targets around the Strait of Hormuz, including for the first time two Iranian government tankers under a new 'tanker-for-tanker' retaliation policy. Iran responded by firing missiles and drones at US-linked bases in Jordan, the UAE, Bahrain, Kuwait, and Iraq, with Jordan claiming it shot down 10 of 13 incoming missiles and no fatalities reported at those sites. Iranian officials say a US strike instead hit a wedding celebration in Kuhestak, killing several people including children and wounding dozens, a claim CENTCOM says it is reviewing. The war, now in its seventh month since a February 28 US-Israeli strike killed Iran's supreme leader, has reportedly cost Iran's economy an estimated $144 billion according to FDD analysts.","source":"Military Times / GlobalSecurity.org","url":"https://www.militarytimes.com/news/your-military/2026/09/01/us-launches-new-barrage-of-strikes-on-iran-around-strait-of-hormuz/"},"tabs":{"defense":{"defense":[{"headline":"Boeing's Grey Wolf Helicopter Cleared to Guard Nuclear Missile Silos","body":"Air Force Global Strike Command announced this week that Boeing's MH-139A Grey Wolf helicopter has reached initial operational capability, clearing it to begin patrolling the nuclear ICBM fields currently protected by the Vietnam-era UH-1N Huey. The milestone marks a long-delayed step in modernizing security for the nation's silo-based nuclear deterrent as the aging Huey fleet is phased out.","source":"InsideDefense","url":"https://insidedefense.com/"},{"headline":"Six Months of Iran War Exposes Navy Force-Structure Strain","body":"Defense reporting out this week finds that six months into the war with Iran and four months into a naval blockade of the Strait of Hormuz, commercial shipping through the waterway remains choked and combat operations have revealed capability and force-structure gaps in the Navy considered critical to modern naval warfare. The findings add pressure on Pentagon planners already juggling simultaneous demands in the Indo-Pacific and Europe.","source":"InsideDefense","url":"https://insidedefense.com/"},{"headline":"Germany Accuses Russia of Attempted Attack on German Soil","body":"Berlin this week accused Moscow of attempting an attack inside Germany, the latest in a string of suspected Russian hybrid operations against NATO members that has included weapons caches and drone incursions across the alliance's eastern and northern flanks in recent weeks. The accusation follows warnings from German officials that those behind recent drone incidents 'will pay a price,' underscoring rising alliance anxiety over gray-zone aggression even as NATO pushes European allies to shoulder more conventional defense responsibility.","source":"WORLD News Group","url":""}],"acquisitions":[{"headline":"AeroVironment Wins Pentagon's First Directed-Energy Production Deal","body":"AeroVironment announced a $465 million contract for the Army's Enduring High Energy Laser (E-HEL) program, marking the Pentagon's first production-scale contract for a directed-energy weapon. The award signals the Army's shift from prototyping laser weapons toward fielding them at scale for base and force air defense.","source":"The Defense Post","url":"https://thedefensepost.com/"},{"headline":"Palantir to Lead Army's TITAN Intelligence System Production","body":"The Army has moved its TITAN next-generation targeting and intelligence ground station into production, with Palantir named as lead integrator and Anduril handling hardware and shelter integration. The deal deepens the Pentagon's reliance on Silicon Valley defense-tech firms over traditional primes for AI-enabled battlefield intelligence systems.","source":"GovCon Wire","url":"https://www.govconwire.com/category/contract-awards"}]},"us":[{"headline":"Congress Sends Government Funding Bill to Trump, Averting Shutdown Until December","body":"The House voted 370-48 on September 1 to pass a stopgap spending bill that keeps federal agencies funded through December 11, punting a fight over the 12 annual appropriations bills until after the November midterms. Speaker Mike Johnson and Senate Majority Leader John Thune both framed the deal as removing shutdown risk for troops and federal workers after three partial shutdowns totaling roughly 161 days over the past year. The measure, already cleared by the Senate, also blocks a proposed OMB rule giving political appointees review power over federal grants and bars shifting funds from other programs to Border Patrol.","source":"NPR / Government Executive","url":"https://www.npr.org/2026/09/01/nx-s1-5951536/house-government-funding-vote-midterms"},{"headline":"Federal Judge Blocks Trump's Second Attempt to Narrow Birthright Citizenship","body":"Maryland U.S. District Judge Deborah Boardman issued a September 2 preliminary injunction halting an August 6 executive order that sought to deny citizenship to babies born to parents tied to designated terrorist groups, so-called 'birth tourism' cases, foreign diplomats, and children born in U.S. territories other than American Samoa. Boardman wrote that no presidential order can undo the Supreme Court's June 30 ruling in Trump v. Barbara, which struck down Trump's original 2025 birthright-citizenship order 6-3. A parallel challenge to the narrower order remains pending in New Hampshire.","source":"GV Wire / CNN","url":"https://gvwire.com/2026/09/03/judge-blocks-trumps-second-try-to-restrict-birthright-citizenship/"},{"headline":"Trump Taps Hung Cao for Navy Secretary as GOP Pressure Builds on Hegseth","body":"President Trump has nominated Hung Cao to serve as Navy Secretary, a move that lands amid growing calls from Republican lawmakers for Defense Secretary Pete Hegseth's removal. The nomination comes as the Pentagon faces scrutiny over its handling of the ongoing Iran conflict, including the USS Abraham Lincoln's unprecedented wartime deployment, which just concluded with a port call in Thailand. Cao, a Vietnamese-American Navy veteran, would take the helm of naval personnel and shipbuilding policy at a moment of heightened Indo-Pacific and Middle East operational tempo.","source":"Democracy Now!","url":"https://www.democracynow.org/2026/9/3/headlines"},{"headline":"Trump Pushes Vulnerable House Republicans to Campaign on His Record","body":"With roughly three dozen competitive House races expected to decide the midterms, Trump on September 2 urged endangered GOP incumbents to embrace his agenda rather than distance themselves from it, despite polling showing his approval underwater. He pledged to personally campaign in all of the key battleground districts this fall. The push comes as Republicans try to build on a redistricting edge from Florida's new congressional map and the Supreme Court's Louisiana v. Callais ruling, which reshaped Voting Rights Act districting requirements ahead of November.","source":"Daily Herald","url":"https://www.dailyherald.com/archive/20260903/"}],"pacific":{"pacificCommand":[{"headline":"Manila Faces Record Surge in Chinese Pressure as Code of Conduct Talks Stall","body":"New ACLED analysis shows Chinese naval, coast guard and maritime militia movements inside the Philippines' exclusive economic zone jumped roughly 490 percent in the first half of 2026 compared with the prior six months, concentrated around Scarborough Shoal, Sabina Shoal and Thitu Island. Manila is simultaneously chairing ASEAN's push for a South China Sea Code of Conduct while contending with a reported intelligence breach that let Chinese forces anticipate Philippine resupply movements. The dual-track approach of accommodation and confrontation is straining Manila's ability to manage the dispute even as it deepens security ties with Washington, Tokyo and Canberra.","source":"The Diplomat / ACLED","url":"https://thediplomat.com/2026/08/the-south-china-sea-and-the-philippines-defense-strategies"},{"headline":"Tokyo Locks In Record Defense Spending, Accelerates Strategy Overhaul","body":"Japan's fiscal 2026 defense budget has topped 9 trillion yen for the first time, part of Tokyo's push to hit 2 percent of GDP on defense ahead of schedule. The Defense Ministry is now revising its foundational National Security Strategy, National Defense Strategy and Defense Buildup Program within this year rather than waiting for the normal cycle, citing what officials call a new era of crisis in which a Ukraine-style aggression could occur in East Asia. The overhaul reflects growing alarm inside the ministry over China's deepening military coordination with Russia and North Korea.","source":"USNI News","url":"https://news.usni.org/2026/08/04/japans-2026-defense-white-paper-digest"},{"headline":"Xi's Expected New Delhi Trip Tests India's Balancing Act With Beijing","body":"Xi Jinping is expected to travel to New Delhi September 12-13 for the BRICS summit, which would mark his first visit to India in seven years, following Prime Minister Modi's own trip to Tianjin for the Shanghai Cooperation Organization gathering last August. The two governments have also scheduled a September follow-up meeting on managing trans-border river flows, with a further round of formal boundary talks penciled in for India in 2027. The diplomatic thaw comes even as New Delhi continues hedging through deeper defense and technology ties with Washington and Tokyo.","source":"AEI/ISW China & Taiwan Update","url":"https://www.aei.org/commentary/china-taiwan-update-august-28-2026/"}],"pacingThreat":[{"headline":"PLA Shifts Coercion Playbook as Coast Guard Incursions Persist Near Taiwan's Outer Islands","body":"Taiwan's latest tallies show China Coast Guard vessels made four incursions into Taiwan-administered waters near Kinmen and one near Pratas Island in recent weeks, even as monthly PLA aircraft incursions across the median line have fallen to roughly pre-2024 baseline levels. Analysts at the ISW-AEI Coalition Defense of Taiwan project assess the drop in ADIZ sorties is a deliberate recalibration rather than a de-escalation, freeing PLA assets for other priorities while preserving incursions as a tool for short-term political signaling. Taiwan's Ministry of National Defense noted eight days in July without any median-line crossings, a notable change from the surge that followed President Lai's 2024 inauguration.","source":"AEI/ISW","url":"https://www.aei.org/commentary/china-taiwan-update-september-1-2026/"},{"headline":"PLA Fighters Test Tactics Against Western Jets in Egypt Drills","body":"Chinese PLAAF Shenyang J-16 fighters have been flying mock engagements against Western-designed combat aircraft as part of the 'Eagles of Civilization 2026' exercise in Egypt, running from August 22 into early September. The drills give Beijing rare data on how its front-line fighters perform against NATO-standard airframes, feeding directly into PLA training and doctrine ahead of any future Taiwan or South China Sea contingency. The exercise underscores China's growing appetite for overseas power-projection exercises beyond its immediate periphery.","source":"AEI/ISW","url":"https://www.aei.org/commentary/china-taiwan-update-august-28-2026/"},{"headline":"Beijing Angles to Shape Narrative Ahead of Taiwan's November Local Elections","body":"With candidate registration for Taiwan's November 28 local elections open from August 31 through September 4, Chinese Communist Party messaging is increasingly geared toward portraying the opposition Kuomintang as a more stabilizing cross-strait partner than the ruling Democratic Progressive Party. Analysts tracking the campaign say Beijing calculates that boosting KMT prospects at the local level could constrain President Lai Ching-te's room to maneuver on defense and sovereignty issues. The information push runs alongside continued PLA and coast guard pressure around Taiwan's outlying islands.","source":"AEI/ISW","url":"https://www.aei.org/commentary/china-taiwan-update-august-28-2026/"}]},"europe":{"ukraineRussia":[{"headline":"Putin Again Rejects Ceasefire Talks as ISW Flags Gap With Battlefield Reality","body":"In its September 2 assessment, the Institute for the Study of War said Vladimir Putin once more dismissed any freeze of the front line or genuine negotiations, insisting Russian forces are making rapid gains and that Ukrainian defenses are collapsing. Analysts called those claims divorced from observable conditions on the ground, arguing Putin is trying to project command of a war that has actually settled into grinding attrition. The assessment suggests Moscow still sees no incentive for a near-term settlement despite periodic US-brokered diplomatic overtures.","source":"Kyiv Post / ISW","url":"https://www.kyivpost.com/post/83619"},{"headline":"Kyiv Keeps Up Deep-Strike Campaign on Russian Oil Infrastructure","body":"Ukrainian forces continued an intermediate- and long-range strike campaign against Russian military assets and oil facilities through September 2, part of a drone offensive that has hit Russian refineries roughly 300 times since the 2022 invasion began. The sustained pressure has driven fuel shortages into dozens of Russian regions this year, with several declaring rationing or states of emergency. The strikes remain central to Kyiv's strategy of squeezing Moscow's war financing even as the ground war remains largely stalemated.","source":"Kyiv Post / ISW","url":"https://www.kyivpost.com/post/83619"}],"europe":[{"headline":"UK Defense Spending Set to Hit 3% of GDP by 2030 as Allies Race to Rearm","body":"Britain's military now expects national defense spending to reach 3% of GDP by 2030, part of a broader European buildup toward NATO's 5%-by-2035 target agreed at last year's Hague summit. The push comes alongside Sweden finalizing a frigate contract with France and Polish authorities investigating whether a fire at a drone-production facility was an act of sabotage. NATO says European allies and Canada have already added more than 139 billion dollars in core defense investment since making that 2025 commitment.","source":"Bloomberg","url":"https://www.bloomberg.com/latest/nato"},{"headline":"Migration Tensions Flare Again in Spain, With Ceuta Under New Strain","body":"Spain is facing fresh unrest as residents protest over migrant arrivals while asylum seekers in the North African enclave of Ceuta scramble for shelter and basic services, according to September 3 reporting. The flare-up underscores that migration remains the most politically combustible issue across the continent, straining local budgets and hardening public backlash even as overall EU arrival numbers have fluctuated this year. Ceuta has long served as a key crossing point from Morocco, and renewed pressure there signals the issue is far from settled heading into autumn.","source":"Al Jazeera","url":"https://www.aljazeera.com/middle-east/"}]},"middleEast":[{"headline":"Xi Jinping Visits Cairo, Pitches Beijing as Middle East Power Broker","body":"Chinese President Xi Jinping made his first trip to Cairo in a decade on September 1, meeting Egyptian President Abdel Fattah al-Sisi and urging Middle Eastern states to reject 'external interference' while offering to help safeguard shipping lanes disrupted by the ongoing US-Iran war. The visit reflects Beijing's push to expand investment and diplomatic influence in the region while Washington remains consumed by the Hormuz conflict. Xi framed regional security as something Middle Eastern nations should manage themselves, an implicit contrast with the large US military footprint there.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-september-2-2026/"},{"headline":"Netanyahu Says Israel Is Actively Working to Overthrow Iran's Government","body":"In remarks reported September 3, Prime Minister Benjamin Netanyahu said Israel is working to topple Iran's government, an unusually explicit statement of regime-change intent even as the six-month US-Iran war grinds on. The comment came as Tehran accused Washington of a war crime over strikes that hit a wedding party, and as President Trump repeated that the US can hit Iran 'anytime we want'. The statement raises fresh questions about whether Israel's war aims extend beyond degrading Iran's military and nuclear capacity.","source":"Al Jazeera","url":"https://www.aljazeera.com/middle-east/"},{"headline":"Israeli Defense Minister Ties Gaza 'Solution' to Depopulation as West Bank Violence Kills Teens","body":"Israeli Defense Minister Israel Katz said on September 2 that he sees no viable resolution for Gaza without depopulating the territory, a comment likely to intensify international criticism of Israel's war aims there. The same day, teenagers were killed in an attack by settlers in al-Mughayyer in the West Bank, adding to a documented rise in settler violence in recent weeks. Together the two episodes suggest Israeli policy discourse on Gaza and the West Bank is shifting toward more openly discussed displacement and enforcement measures.","source":"Al Jazeera","url":"https://www.aljazeera.com/middle-east/"}],"techAI":{"aiCompetition":[{"headline":"Nvidia Emerges Biggest Winner as Seoul Bets $919B on Sovereign AI Compute","body":"A fresh SemiAnalysis assessment published this week digs into South Korea's plan to build 8.4 gigawatts of AI data-center capacity by 2029, growing to 18.4 GW by 2035, and concludes Nvidia is the chief beneficiary as SK Group commits to roughly 2 GW of Rubin-generation systems and Naver signs a 200-megawatt order. Domestic chipmaker SK Hynix appears to gain less upside than expected despite supplying the bulk of the world's high-bandwidth memory. The report also flags controversy in Seoul's parallel contest to crown a national foundation-model champion, after Motif Technologies, a startup that topped the benchmark round, was unexpectedly cut in the elimination stage. The episode shows how allied Indo-Pacific governments are racing to lock down compute even as US suppliers capture most of the financial windfall.","source":"SemiAnalysis","url":"https://newsletter.semianalysis.com/p/koreas-trillion-dollar-sovereign"},{"headline":"OpenAI Pushes ChatGPT Into Hospitals via Epic Integration Covering 325 Million Patients","body":"OpenAI has wired its ChatGPT Health product directly into Epic, the electronic health record system that underpins charts for more than 325 million patients, letting clinicians surface notes, labs and medication histories inside a chat interface. Access is strictly read-only, and a companion tool cross-references public medical databases so the assistant cannot silently alter a patient record. The move deepens OpenAI's push into a heavily regulated vertical where Microsoft- and Google-linked rivals are also competing for enterprise healthcare contracts, while renewing debate over how much sensitive clinical data should flow through a general-purpose chatbot.","source":"TechCrunch","url":"https://techcrunch.com"}],"cyberEmerging":[{"headline":"OpenAI Says Unreleased Astra Model Is First to Hit 'Critical' Cyber Capability","body":"OpenAI disclosed this week that its upcoming Astra model is the first system in company history to cross the 'Critical' cybersecurity threshold under its Preparedness Framework, meaning it can independently uncover unknown software flaws and chain them into working exploits against hardened targets without step-by-step human direction. In internal red-teaming, Astra built a full browser-escape chain and separately combined operating-system bugs into a privilege-escalation path reaching root access. OpenAI says it paused parts of the model's training for several weeks to add tighter monitoring and will limit advanced access to a vetted partner coalition it calls Daybreak, a response that comes just weeks after the company disclosed an unrelated incident in which other models breached AI platform Hugging Face. The disclosure adds urgency to a rewrite of OpenAI's three-year-old risk framework and feeds broader unease among national-security officials about offensive AI capability outrunning oversight.","source":"CNBC","url":"https://www.cnbc.com/2026/09/01/open-ai-astra-cyber-model.html"},{"headline":"AI-Written Police Report Surfaces in Texas Flock Camera Abortion-Tracking Case","body":"Newly obtained documents show the Johnson County, Texas sheriff's office used Axon's AI report-writing tool, Draft One, to help draft the paperwork justifying a search of more than 80,000 Flock license-plate cameras nationwide for a woman who had self-managed an abortion. The AI-generated report summarized deputies' discussion of the case's legal implications, adding a new layer of automation to an episode already scrutinized for stretching a stolen-car-recovery network into reproductive-health surveillance across state lines. Digital-rights groups say the pairing of AI-drafted reports with AI-powered camera networks shows how automation is compounding, not just recording, the reach of local police into states where abortion remains legal.","source":"404 Media","url":"https://www.404media.co/texas-police-used-ai-to-write-report-about-using-flock-to-search-for-woman-who-had-abortion/"}]},"cities":{"lasVegas":[{"headline":"Zoox Launches Driverless Robotaxi Service at Harry Reid Airport","body":"Amazon-owned Zoox began fully autonomous, driverless passenger rides at Harry Reid International Airport, becoming the first robotaxi company authorized to operate commercially at a Las Vegas airport. Riders can now hail a driverless vehicle from Terminals 1 and 3 for trips to the Strip, marking a milestone in the valley's push to become a testbed for autonomous transportation. The rollout comes as Las Vegas continues to court self-driving and AI-transportation firms ahead of major conventions.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"},{"headline":"Judge Blocks Boulder City Data Center on Federal Land","body":"An administrative judge halted construction of a contested data center that a Texas-based developer had planned to build on federal land near Boulder City, siding with city officials and environmental groups who argued the project threatened desert habitat and local water resources. The ruling pauses the project 'for now,' leaving its long-term fate unresolved as the developer weighs next steps. The fight reflects growing friction in Southern Nevada over the rapid expansion of data centers competing for power and water in the desert.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Developers Buy 900+ Acres for Major New Northwest Valley Community","body":"A development group has purchased more than 900 acres in the upper northwest Las Vegas Valley, in what is being described as the region's largest new master-planned community in years. Plans call for as many as 6,000 homes on the site, adding significant housing stock to a valley still grappling with an inventory shortage. The deal signals continued confidence from builders in Las Vegas's long-term growth despite higher interest rates nationally.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Nellis and NTTR Remain Central to Combat Readiness as Air Force Surges Training Amid Wider Iran Conflict","body":"As U.S. air operations expand around the Strait of Hormuz, Nellis Air Force Base's 57th Wing and the adjoining Nevada Test and Training Range continue to serve as the Air Force's primary proving ground for advanced tactics, spanning roughly 2.9 million acres of restricted land and 5,000 square miles of airspace. The base, home to the Weapons School, F-35s and the newly arriving 562nd Electronic Warfare Squadron, is central to generating combat-ready crews as Air Combat Command leans on Red Flag-style exercises to prepare pilots for contested environments. Nearby Creech Air Force Base's MQ-9 Reaper and Collaborative Combat Aircraft units also remain tied into NTTR training cycles supporting current operations.","source":"Nellis Air Force Base / Air Force official sites","url":"https://www.nellis.af.mil/"}]},"feelGood":[{"headline":"Nationwide 'Tour For Life' Adoption Drive Rolls Through Dozens of Cities","body":"North Shore Animal League America's Tour For Life, billed as the world's largest cooperative mobile pet-adoption event, is making its way through 66 cities across 38 states this year, pairing shelter animals with new families in a single coordinated push. The tour reflects a broader no-kill mission the organization has pursued for years, funneling donations directly into veterinary care and lifesaving treatment for at-risk pets. Organizers say the traveling model helps overcrowded shelters find placements faster than they could alone.","source":"North Shore Animal League America","url":"https://www.animalleague.org/rescue-illustrated-2026-may/"},{"headline":"Volunteer Pilots Keep Flying At-Risk Shelter Animals to Safety","body":"A small corps of volunteer aviators with RV2TheRescue, including pilots Dennis Hengeveld and Ryan Bowers, continues donating flight time to ferry dogs and cats out of overcrowded California shelters to rescues and adoptive homes up and down the coast. The all-volunteer group relies on donated fuel money and pilot hours rather than paid staff, turning ordinary weekend flying into lifesaving transport. Newer volunteers like flight instructor Daniel Feitelberg have joined in recent months, expanding the group's reach.","source":"RV2theRescue","url":"https://www.rv2therescue.com/"},{"headline":"Community Rallies Around Senior Shelter Dog's Final Chapter","body":"When Raven, an aging pit bull mix, arrived at Albert's Dog Lounge Rescue, caretakers initially hoped only to keep her comfortable, but donated supplies and food from groups like Rescue Pack helped extend and improve her care far beyond expectations. The effort illustrates how small nonprofits redistributing surplus pet food and supplies can ripple into meaningful extra time and comfort for vulnerable animals. Volunteers say Raven's story has become a rallying point for donors supporting other senior shelter pets.","source":"Rescue Pack","url":"https://rescuepack.org/news-events/"}],"onThisDay":[{"year":"1939","event":"The United Kingdom and France declared war on Germany following its invasion of Poland, marking the formal start of World War II for the Western Allies."},{"year":"1943","event":"Allied forces launched Operation Baytown, invading mainland Italy across the Strait of Messina."},{"year":"1967","event":"Sweden switched from driving on the left to the right side of the road in an event known as Dagen H."},{"year":"1976","event":"NASA's Viking 2 spacecraft landed on Mars to begin its surface science mission."}]},"topPicks":[{"headline":"US-Iran War Enters Seventh Month as Strikes Widen Around Strait of Hormuz","teaser":"Escalating strikes near the Strait of Hormuz threaten global oil flows as the conflict grinds into its seventh month."},{"headline":"Congress Sends Government Funding Bill to Trump, Averting Shutdown Until December","teaser":"Lawmakers avert an immediate shutdown, buying Washington a few more months before the next fiscal cliff."},{"headline":"Germany Accuses Russia of Attempted Attack on German Soil","teaser":"Berlin's accusation raises fears of direct Russian aggression against a NATO member amid the wider Ukraine war."}]},"navDates":[{"key":"2026-09-04","label":"Sep 4","href":"/","isNewest":true},{"key":"2026-09-03","label":"Sep 3","href":"/archive/2026-09-03.html","isNewest":false},{"key":"2026-09-02","label":"Sep 2","href":"/archive/2026-09-02.html","isNewest":false},{"key":"2026-09-01","label":"Sep 1","href":"/archive/2026-09-01.html","isNewest":false},{"key":"2026-08-31","label":"Aug 31","href":"/archive/2026-08-31.html","isNewest":false},{"key":"2026-08-30","label":"Aug 30","href":"/archive/2026-08-30.html","isNewest":false},{"key":"2026-08-29","label":"Aug 29","href":"/archive/2026-08-29.html","isNewest":false}],"currentKey":"2026-09-03","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-09-03.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
