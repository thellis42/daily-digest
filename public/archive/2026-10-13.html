<script>
const STATE = {"digest":{"date":"Tuesday, October 13, 2026","generatedAt":"Tue, Oct 13, 9:56 AM PDT","breaking":{"headline":"Drones Sink Ship, Hit Second Vessel in NATO Member Bulgaria's Black Sea Waters","body":"Before dawn on October 13, drones struck two merchant ships inside Bulgaria's Black Sea exclusive economic zone, sinking the Turkish-owned, St Vincent and Grenadines-flagged Azov Concorde roughly 17 nautical miles off Krapets and damaging the Ukrainian-owned, Malta-flagged Chelsea 3 near Byala. All 15 crew of the Chelsea 3 (seven Ukrainians, eight Azerbaijanis) were rescued, along with one survivor from the sunken vessel, while Prime Minister Rumen Radev convened an emergency Cabinet security meeting and said he would summon Russia's ambassador and brief NATO chief Mark Rutte. It is the second such strike in a week after an October 6 attack sank the cargo ship Alfa Watan with its crew feared lost, marking the first attacks on shipping inside a NATO member's Black Sea economic zone and drawing condemnation from European Commission President Ursula von der Leyen.","source":"Sofia Globe","url":"https://sofiaglobe.com/2026/10/13/new-drone-attacks-on-ships-in-bulgarias-black-sea-eez-one-sunk/"},"tabs":{"defense":{"defense":[{"headline":"Army Orders Stand-Up of New Autonomous Systems Command","body":"The U.S. Army has directed creation of a Futures and Autonomous Systems Command, or FASCOM, a day after Defense Secretary Pete Hegseth announced a separate Pentagon-wide Autonomous Warfare Command. An October 1 memo signed by acting Army Secretary Adam Telle tasks the Army's vice chief of staff with building the new command to oversee unmanned and robotic systems development. The push follows the Army's Operation Jailbreak initiative, under which more than 70 systems have already been integrated with the Integrated Battle Command System-Maneuver.","source":"Defense News","url":"https://www.defensenews.com/news/your-military/2026/10/13/us-army-to-stand-up-command-for-unmanned-and-autonomous-warfare/"},{"headline":"B-1B Bombers Pulled From UK Base Over Drone Threat","body":"U.S. Air Force B-1B Lancer bombers have departed RAF Fairford in the United Kingdom this week after repeated unidentified drone activity near the base raised security concerns, according to a special operations community briefing. The withdrawal adds to a string of drone incursions reported at Western European airbases in recent months and comes as the Pentagon separately weighs surging additional naval power, potentially up to three carrier strike groups, into the Middle East amid the ongoing standoff with Iran. Officials have not publicly attributed the drone activity to a specific actor.","source":"SOF News","url":"https://sof.news/update/20261013/"},{"headline":"NATO's Top General Lays Out Three-Stage Plan to Counter Russian Attack","body":"NATO's senior military commander has presented a three-stage framework for how the alliance would respond if Russia attacked allied territory, covering immediate forward defense, rapid reinforcement of threatened flanks, and a follow-on counteroffensive phase. The briefing comes as alliance members grow increasingly alarmed by suspected hybrid attacks, including the drone strikes on Black Sea shipping near NATO member Bulgaria and unexplained drone activity near bomber bases in the UK. The framework is intended to reassure eastern-flank allies such as Poland and the Baltic states as debates continue over burden-sharing and rapid-reaction readiness.","source":"The Defense Post","url":"https://thedefensepost.com/latest/"}],"acquisitions":[{"headline":"Pentagon Awards Raytheon Up to $6.3 Billion for SM-3 Interceptors","body":"The Pentagon has awarded RTX subsidiary Raytheon a contract worth up to $6.3 billion to manufacture Standard Missile-3 Block IB interceptors through 2034, reversing a 2024 plan to wind the program down. The award underscores the Trump administration's push to rebuild interceptor stockpiles as the Golden Dome homeland missile defense initiative moves from design into procurement. Defense officials say the deal reflects a broader reassessment of naval and missile-defense inventories amid sustained high-tempo operations in the Middle East.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Anduril to Invest $3.7 Billion to Expand Virginia-Class Submarine Capacity","body":"Defense technology firm Anduril Industries has announced a $3.7 billion investment in a new facility aimed at easing bottlenecks in Virginia-class attack submarine production. The move comes as the Navy continues to fall short of its two-boats-per-year target, a shortfall that complicates both U.S. fleet modernization and the AUKUS submarine-sharing commitment with Australia and the UK. The investment reflects a broader Pentagon effort to pull nontraditional defense-tech firms into legacy shipbuilding supply chains to accelerate capacity.","source":"Inside Defense","url":"https://insidedefense.com/"}]},"us":[{"headline":"DHS Raids Rep. Ilhan Omar's D.C. Home in Immigration Fraud Probe","body":"Federal agents from Homeland Security Investigations conducted a pre-dawn search of Minnesota Democratic Rep. Ilhan Omar's Washington home on October 12, executing a warrant tied to a years-long Justice Department probe into immigration paperwork reportedly filled out by her late father when she was a child. Omar's office called the action 'an outrageous abuse of power,' while House Democratic leaders labeled it a 'rogue abuse of power'; Trump denied personal involvement but said authorities are looking at her 'very carefully.' The raid follows months of public threats from Vice President JD Vance and border czar Tom Homan to pursue fraud charges against Omar, and lands less than a month before the midterm elections.","source":"Axios","url":"https://www.axios.com/2026/10/12/ilhan-omar-search-immigration"},{"headline":"Four GOP Senators Join Democrats Demanding Trump End Russian Diesel Imports","body":"A bipartisan bloc including Republicans Susan Collins, Lisa Murkowski, Thom Tillis and John Curtis is pressing the White House to reverse a Treasury Department waiver letting the U.S. buy Russian diesel through next April, arguing the move to lower pump prices before the midterms violates a 2022 law banning Russian energy imports. The senators warned the policy hands Moscow 'a financial lifeline' while Russian strikes on Ukraine continue. Trump defended the waiver on Truth Social Monday, insisting it was 'the right choice for the American People.'","source":"Democracy Now","url":"https://www.democracynow.org/2026/10/13/headlines"},{"headline":"Supreme Court Adds DOGE Data, Prisoners' Rights and Terrorism-Support Cases to Docket","body":"As its 2026-27 term opens, the Supreme Court granted review in new disputes covering access to DOGE-related government data, prisoners' constitutional rights, and the legal definition of 'material support' for terrorism, per SCOTUSblog's October 13 docket tracker. The term already includes high-profile arguments such as Suncor Energy v. Boulder County over climate-liability preemption, from which Justice Samuel Alito has recused himself, and a case testing whether veterans can bring constitutional claims in federal court outside the VJRA's review scheme. With 33 cases granted and oral arguments just beginning, the docket signals a consequential year for administrative power and civil-rights litigation heading into 2027.","source":"SCOTUSblog","url":"https://www.scotusblog.com/"},{"headline":"White House Presses Ambassador Kimberly Guilfoyle to Resign Amid Donor Payment Allegations","body":"The Trump administration's new press secretary confirmed the White House has asked Kimberly Guilfoyle, currently serving as ambassador to Greece, to step down after allegations surfaced that she solicited a political donor for $100,000 to cover a personal American Express bill. The episode adds to a string of ethics controversies rattling the administration just weeks before the midterms, including scrutiny of House Speaker Mike Johnson's wife's donor-undisclosed counseling ministry. Guilfoyle has not publicly responded to the resignation request as of October 13.","source":"The Washington Post","url":"https://www.washingtonpost.com/politics/"}],"pacific":{"pacificCommand":[{"headline":"Okinawa Assembly Demands Renegotiation of US Forces Pact After Marine's Killing","body":"Okinawa's prefectural assembly passed a resolution calling for a review of the agreement governing the roughly 54,000 U.S. troops stationed on the island after a U.S. Marine was arrested for allegedly robbing and killing a local woman. The vote, adopted on October 9, reflects long-simmering local anger over crimes by American personnel, including past assaults and drunk-driving incidents, and adds political pressure on Tokyo as it finalizes a new National Security Strategy in December. The episode threatens to complicate basing arrangements central to the U.S.-Japan alliance's Indo-Pacific posture.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/10/9/japans-okinawa-calls-for-review-of-us-forces-pact-after-killing"},{"headline":"North Korea Fires Multiple Ballistic Missiles, One Flies Over 900 Kilometers","body":"Pyongyang launched several ballistic missiles on the morning of October 12, with Japan tracking one that traveled more than 900 kilometers before splashing down. The launch came as South Korea's military and Japan's coast guard were separately monitoring Chinese live-fire drills in the region, underscoring the layered security pressures facing Seoul and Tokyo simultaneously. South Korean President Lee Jae Myung has so far avoided directly blaming Pyongyang for a separate recent incident, even as his government weighs a bigger regional security role, including possible naval deployment to the Strait of Hormuz.","source":"Asia Intelligence Brief","url":"https://www.riotimesonline.com/asia-intelligence-brief-monday-october-12-2026/"},{"headline":"Manila Rejects Beijing's Push for New South China Sea Hotline","body":"The Philippines is standing firm against China's proposal for a 'new model' of maritime communication, arguing the existing hotline channels failed to build trust and were exploited by Beijing as cover for aggressive actions at sea. The rebuff comes as Manila also disclosed that Chinese military and coast guard presence around Philippine-claimed waters, including Thitu Island and Second Thomas Shoal, nearly doubled in September to 101 tracked vessels. The diplomatic standoff signals Manila's hardening posture ahead of continued friction in the Spratlys and near Scarborough Shoal.","source":"South China Morning Post","url":"https://www.scmp.com/topics/south-china-sea"}],"pacingThreat":[{"headline":"Chinese Military and Coast Guard Clashes With Manila Spike Across Luzon Strait","body":"Confrontations between Chinese and Philippine forces have surged since the start of October, with at least six dangerous encounters recorded at Scarborough Shoal, Second Thomas Shoal and the Spratlys. A new flashpoint has opened near the Philippines' Batanes Islands in the Luzon Strait, a chokepoint closer to Taipei than Manila; on October 1-2 the Philippine Coast Guard pushed out a Chinese survey vessel there, prompting Beijing to send a coast guard cutter built on a Type 052D destroyer hull as escort. Three Taiwan Coast Guard vessels shadowed the Chinese ships once the standoff neared Taiwanese waters, and on October 3 a PLA Air Force J-16 intercepted a separate Philippine aircraft.","source":"USNI News","url":"https://news.usni.org/2026/10/09/philippine-and-chinese-incidents-spike-in-south-china-sea-luzon-strait"},{"headline":"China's Military Presence Near Disputed Philippine Waters Nearly Doubles","body":"The Philippines reported that Chinese navy and coast guard activity around waters it claims nearly doubled in September, with 101 vessels tracked near Thitu Island, Second Thomas Shoal, Sabina Shoal and Scarborough Shoal. A Chinese coast guard ship also shadowed and blocked Philippine boats attempting to approach a foreign fishing vessel accused of using dynamite, while Beijing separately warned Manila against what it called provocative overflights near Scarborough. The buildup illustrates Beijing's sustained gray-zone pressure campaign even as formal ASEAN code-of-conduct talks remain stalled.","source":"The Manila Times","url":"https://www.manilatimes.net/2026/10/09/news/national/ph-flags-near-doubling-of-chinese-presence-in-disputed-waters/2442037"},{"headline":"Taiwan Monitors Chinese Live-Fire Drills Scheduled Through the Week","body":"Taiwan's Defense Minister Wellington Koo confirmed the island is tracking a series of Chinese live-fire exercises that maritime notices scheduled to run through mid-October, with South Korea's military and Japan's coast guard also monitoring the activity as of October 12. The drills follow President Lai Ching-te's National Day address pledging to defend Taiwan's freedom without seeking confrontation. The exercises form part of a broader pattern of Chinese coastal military pressure that coincided this week with a North Korean ballistic missile test and renewed China-South Korea joint patrols in the Yellow Sea.","source":"Asia Intelligence Brief","url":"https://www.riotimesonline.com/asia-intelligence-brief-monday-october-12-2026/"}]},"europe":{"ukraineRussia":[{"headline":"Trump-Brokered Energy Truce Unravels Within Hours as Kyiv, Kharkiv Hit","body":"President Zelensky told the Warsaw Security Forum that Moscow had already broken the energy-infrastructure truce President Trump had just announced, hours after a Russian drone killed a woman and injured at least five people in a Kyiv apartment block. Overnight strikes also hit a Rivne university building, injuring roughly two dozen people, while Kharkiv absorbed a missile barrage that wounded eleven and forced rescue operations. Kyiv says it has halted strikes on Russian refineries as a goodwill gesture, but accuses Moscow of continuing to pound Ukraine's power grid regardless.","source":"Al Jazeera","url":"https://www.aljazeera.com/economy/2026/10/13/trump-insists-energy-ceasefire-holds-as-ukraine-reports-new-russian-strikes"},{"headline":"EU Rolls Out Biggest Sanctions Expansion of the War, Targeting Russia's Arms Industry","body":"EU foreign ministers meeting Tuesday approved roughly 1,600 new sanctions listings aimed chiefly at firms and individuals tied to Russia's ballistic-missile production, the bloc's largest single expansion of restrictive measures since the 2022 invasion. EU foreign policy chief Kaja Kallas framed the move as proof there is no appetite in Brussels to ease pressure on Moscow even as Washington pushes ceasefire diplomacy. The package lands the same day Trump publicly defended a separate US deal allowing continued purchases of Russian diesel, a arrangement several European officials argue undercuts the sanctions campaign.","source":"WORLD Radio / RTL","url":"https://wng.org/podcasts/tuesday-morning-news-october-13-2026-1791845505"}],"europe":[{"headline":"NATO's Top Commander Unveils 'Theory of Victory' Doctrine at Warsaw Forum","body":"US General Alexus Grynkewich, NATO's Supreme Allied Commander Europe, told the Warsaw Security Forum the alliance is 'ready to fight tonight' and detailed for the first time how it would defeat a Russian attack by fusing sensors, autonomous systems and traditional firepower to make any assault 'utterly futile.' The briefing came as Polish and Baltic officials warned Russia may be preparing to test NATO's eastern flank through drone incursions or a limited incursion, and as NATO kicked off its annual Steadfast Noon nuclear-deterrence exercise from five Italian air bases. Lithuania has already moved troops toward its border citing concerns about a Russian mobilization.","source":"PBS NewsHour / Washington Times","url":"https://pbs.org/newshour/world/nato-commander-says-alliance-does-not-want-war-but-is-ready-to-fight-tonight"},{"headline":"Spain's Migration Crisis Flares as King Felipe Visits Ceuta","body":"King Felipe VI and Queen Letizia traveled to the North African enclave of Ceuta on Tuesday following a summer migration surge that has become one of Spain's most volatile domestic issues, with banners reading 'Ceuta is not an exception, it is Spain' greeting the royals outside city hall. The visit followed demonstrations in Barcelona where protesters waved Spanish flags to criticize the government's handling of the crisis. The episode underscores how migration pressure at Europe's southern border continues to strain national politics even as attention is dominated by the war to the east.","source":"Euronews","url":"https://www.euronews.com/"}]},"middleEast":[{"headline":"Houthi Strikes on Saudi Arabia Escalate, Rattling Gulf Air Travel","body":"Saudi Arabia says its coalition intercepted and destroyed three drones north of Riyadh after Iran-backed Houthi rebels claimed fresh overnight strikes on the Red Sea island of Kamaran, the Hodeida region and Jawf province, trading attacks that followed sirens and explosions in the Saudi capital. The disruption has already forced eleven airlines to cancel or reschedule Saudi flights, with Etihad suspending Abu Dhabi routes to Riyadh, Jeddah and Dammam until October 19. Turkey's Erdogan condemned the Houthi attacks in a call to the Saudi crown prince, and Egypt has offered 'any kind of support' to help Riyadh counter the escalating threat.","source":"Arab News / Khaleej Times","url":"https://www.arabnews.com/"},{"headline":"Trump Says US 'May Have Gone Too Far' Killing Iranian Leadership","body":"President Trump told supporters at an Ohio rally that Washington may have overreached by killing senior Iranian officials during the campaign against Tehran, admitting the US is now struggling to identify counterparts it can actually negotiate with. The remark comes as Israeli analysts report Iran is fortifying nuclear sites and rebuilding its missile arsenal despite the damage already inflicted by US and Israeli strikes earlier this year. The comments suggest Washington is reassessing its leverage even as fighting and regional spillover, including attacks on Gulf shipping and Saudi Arabia, continue unabated.","source":"Jerusalem Post","url":"http://www.jpost.com/middle-east"},{"headline":"IMF Slashes Middle East Growth Forecast as Hormuz Closure Drags On","body":"The IMF cut its regional growth outlook, citing a longer-than-expected closure of the Strait of Hormuz compared with its earlier baseline, as the US-Iran war that began in late February continues to disrupt oil and gas flows. Qatar's Emir Sheikh Tamim bin Hamad Al Thani said damage to his country's energy facilities during Iranian strikes has already cut into Qatar's LNG export capacity. The Fund expects a sharp rebound in 2027 only if the waterway reopens, but warns that rising energy costs are already feeding into fertilizer and broader commodity prices across developing economies.","source":"Dawn","url":"https://www.dawn.com/live/iran-israel-war"}],"techAI":{"aiCompetition":[{"headline":"Meta Claims Frontier AI Status with Muse Wonder as Costs Mount","body":"Meta rolled out two new models, Muse Wonder and Muse Wonder Full, with Mark Zuckerberg declaring the company has finally reached the frontier tier alongside OpenAI and Anthropic, while also rejecting calls from rivals for an industry-wide pacing agreement on advanced AI development. The announcement comes as Meta's AI spending strains its balance sheet: second-quarter free cash flow collapsed to $784 million from $8.55 billion a year earlier amid capital expenditures of roughly $31 billion, with full-year capex guidance now set at $130-145 billion. Independent benchmarking of the new models has not been published, and Meta's own chief AI officer has previously described earlier versions as short of true frontier performance, underscoring skepticism about whether the claim will hold up against Google and Anthropic.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-10-12/meta-says-new-muse-model-reaches-ai-frontier-after-14-month-push"},{"headline":"Defense AI Startup Shield AI Raises $1.5 Billion at $12.7 Billion Valuation","body":"Shield AI closed a Series G round worth $1.5 billion, pushing its valuation to $12.7 billion as investors continue pouring capital into autonomy and military AI applications. The round reflects a broader surge in frontier-adjacent funding this month, with legal-AI firm Legora also raising $550 million at a $5.55 billion valuation. The scale of Shield AI's raise signals growing confidence that AI-enabled autonomous systems will play an outsized role in future defense procurement, a trend with direct implications for Indo-Pacific deterrence planning and Pentagon modernization budgets.","source":"AI Startup Funding News","url":"https://blog.mean.ceo/ai-startup-funding-news-october-2026/"}],"cyberEmerging":[{"headline":"Hackers Sabotage French Supermarket Refrigeration, Sparking Fires and Food Losses","body":"A large-scale cyberattack hit hundreds of French supermarkets operated by Intermarche and Cooperative U, remotely forcing refrigerators and freezers to heat up to roughly 122 degrees Fahrenheit, spoiling inventory and triggering fires in some locations. European officials reacted sharply, with the EU's agriculture commissioner warning that the weaponization of food has become a reality. The incident, alongside separate disruptions at Dutch and Belgian grocery chains the same week, highlights how operational-technology attacks on food supply infrastructure are emerging as a serious critical-infrastructure threat beyond traditional IT breaches.","source":"CNBC","url":"https://www.cnbc.com/2026/10/13/france-supermarket-hack-cyberattack-fridges-fires.html"},{"headline":"FBI Seizes Flax Typhoon Infrastructure as China-Linked Intrusions Widen","body":"US authorities this week seized command-and-control infrastructure tied to Flax Typhoon, a Chinese state-linked hacking group, while a joint CISA/NSA advisory separately attributed a wave of multi-sector intrusion campaigns to Integrity Technology Group. The actions come amid two sprawling software-supply-chain compromises, dubbed GhostAction and ChainDrop, that have hit hundreds of developer GitHub accounts and tens of thousands of repositories, exposing cloud credentials and AI provider API keys. Security researchers are urging organizations to audit CI/CD pipelines and rotate exposed secrets immediately, as nation-state and criminal activity increasingly blur in scale and sophistication.","source":"TechJack Solutions Weekly Security Intelligence Briefing","url":"https://techjacksolutions.com/security/briefing/weekly-security-intelligence-briefing-week-of-2026-10-12/"}]},"cities":{"lasVegas":[{"headline":"Tropical Storm Rachel floods Las Vegas Valley but barely helps Lake Mead","body":"Tropical Storm Rachel dumped heavy rain across Southern Nevada over the weekend, sending floodwaters rushing through valley streets, but the deluge did little to ease the long-term decline of Lake Mead's water levels. The storm underscores how isolated desert rain events, even dramatic ones, can't offset the structural water deficit facing the region's main reservoir. Local officials continue to monitor runoff and flood-control infrastructure after the storm's passage.","source":"News3LV / KSNV","url":"https://news3lv.com/"},{"headline":"Henderson luxury condo project tops $950 million in sales","body":"The developer behind the Four Seasons Private Residences in Henderson announced the luxury high-rise project has crossed $950 million in total sales as construction continues on the mountain-adjacent towers. The milestone reflects continued strength in Southern Nevada's high-end real estate market even as other builders face local pushback over new developments. A separate Las Vegas luxury housing proposal from Blue Heron, a 61-lot tract in an older part of the city, has drawn objections from neighboring residents.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Teen held without bail in deadly First Friday shooting","body":"A Clark County judge ordered 17-year-old Issac Manriquez held without bail Tuesday after his arrest on suspicion of open murder and attempted murder connected to a shooting at the First Friday arts event on Main Street. Judge William Jansen ruled the teen will remain in custody as the case proceeds, with prosecutors citing alleged street-gang connections to the shooting. The case has drawn heightened attention to gang violence tied to the popular downtown Las Vegas arts district event.","source":"News3LV / KSNV","url":"https://news3lv.com/news/instagram/17-year-old-arrested-deadly-first-friday-shooting-no-bail-issac-manriquez-lvmpd-metro-police-murder-homicide-crime-court"}],"nellis":[{"headline":"Nellis' Shadow Operations Center tests AI tools that speed battle decisions sevenfold","body":"The Air Force's Shadow Operations Center at Nellis (ShOC-N) just wrapped its inaugural DASH experiment, in which industry coders and in-house developers spent two weeks building 'agentic AI' decision-support tools that staff officers then stress-tested in simulated high-end conflict scenarios. The effort reportedly accelerated battle-staff decision-making roughly seven-fold, a notable data point as the Department of the Air Force pushes to fuse artificial intelligence with joint command-and-control and Space Force integration. The experiment is part of a broader push at Nellis to pair frontier AI with warfighting command systems ahead of future Red Flag and coalition exercises.","source":"Breaking Defense","url":"https://breakingdefense.com/tag/nellis-afb/"}]},"feelGood":[{"headline":"Bridal shop owner turns a cruel moment into a gift for a Las Vegas-bound bride","body":"After a stranger's angry outburst disrupted a man's marriage proposal, a bridal shop stepped in and surprised the bride-to-be with a free wedding dress, turning humiliation into celebration. The gesture, reported this week, quickly circulated online as an example of a small business choosing kindness over indifference toward a couple it had never met. The bride said the gift restored her excitement for the wedding after the public embarrassment.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"12-year-old's diaper drive tops 30,000 donated to families in need","body":"A seventh-grader named Sloan noticed a local charity running low on diapers and organized a donation drive that has now delivered more than 30,000 diapers to struggling families. The scale of the giveaway, driven entirely by a middle-schooler's initiative, has turned her into a local model for youth philanthropy. Organizers say the diapers are already being distributed to families who were facing shortages.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Former Marines lead volunteer rescue push after Hurricane Isaias","body":"In Bagdad, Florida, United Cajun Navy volunteers led by former Marines Keisha Boyd and Mason Adcock have been going door to door since Hurricane Isaias made landfall, clearing downed trees, checking on isolated residents like elderly homeowner John Robbins, and logging new aid requests as they come in. The all-volunteer group, which handles everything from medical evacuations to animal rescues, says requests are still pouring in and it urgently needs more hands on the ground. Their grassroots response has filled gaps left by overwhelmed official relief channels in the hurricane's aftermath.","source":"The Epoch Times","url":"https://theepochtimes.com/us/volunteers-begin-recovery-efforts-after-hurricane-isaias-6102254"}],"onThisDay":[{"year":"1792","event":"The cornerstone of the White House was laid in Washington, D.C."},{"year":"1812","event":"British and Canadian forces defeated American troops at the Battle of Queenston Heights during the War of 1812."},{"year":"1943","event":"Italy declared war on its former Axis partner Germany, joining the Allied side in World War II."},{"year":"2010","event":"The last of 33 trapped Chilean miners was rescued after 69 days underground at the Copiapo mine."}]},"topPicks":[{"headline":"Drones Sink Ship, Hit Second Vessel in NATO Member Bulgaria's Black Sea Waters","teaser":"A direct drone strike in a NATO member's waters risks dragging the alliance deeper into the Russia-Ukraine conflict."},{"headline":"North Korea Fires Multiple Ballistic Missiles, One Flies Over 900 Kilometers","teaser":"Pyongyang's long-range missile test raises fresh alarm over regional security and US-allied defense posture in Asia."},{"headline":"Trump-Brokered Energy Truce Unravels Within Hours as Kyiv, Kharkiv Hit","teaser":"A fragile US-brokered ceasefire collapsed almost immediately, with fresh strikes hitting major Ukrainian cities."}]},"navDates":[{"key":"2026-10-18","label":"Oct 18","href":"/","isNewest":true},{"key":"2026-10-17","label":"Oct 17","href":"/archive/2026-10-17.html","isNewest":false},{"key":"2026-10-16","label":"Oct 16","href":"/archive/2026-10-16.html","isNewest":false},{"key":"2026-10-15","label":"Oct 15","href":"/archive/2026-10-15.html","isNewest":false},{"key":"2026-10-14","label":"Oct 14","href":"/archive/2026-10-14.html","isNewest":false},{"key":"2026-10-13","label":"Oct 13","href":"/archive/2026-10-13.html","isNewest":false},{"key":"2026-10-12","label":"Oct 12","href":"/archive/2026-10-12.html","isNewest":false}],"currentKey":"2026-10-13","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-10-13.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
