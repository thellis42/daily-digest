<script>
const STATE = {"digest":{"date":"Sunday, November 1, 2026","generatedAt":"Sun, Nov 1, 8:01 AM PST","breaking":{"headline":"Trump Signals New Iran Strikes Could Come Right After Midterms","body":"President Trump said this weekend the US still needs to 'take care of' one or two remaining targets in Iran, including a suspected nuclear-material storage site known as Pickaxe Mountain that has not yet been hit. U.S. diplomats and defense officials have quietly told Gulf partners to brace for possible renewed strikes as soon as November 4, the day after the midterm elections, while Iran's Supreme Leader Mojtaba Khamenei warned retaliation would have no geographic limits if war resumes. The Pentagon's official toll from the eight-month conflict has now risen to 23 U.S. service members killed, and Trump spoke by phone with Netanyahu Saturday to coordinate next steps even as he insists talks with Tehran are 'going fine.'","source":"CBS News","url":"https://cbsnews.com/live-updates/iran-war-us-trump-diplomacy-threat-resume-attacks"},"tabs":{"defense":{"defense":[{"headline":"CENTCOM Briefs Trump on Strike Options Ahead of Possible Nov. 4 Iran Action","body":"CENTCOM commander Adm. Brad Cooper has briefed Trump on military options against Iran as U.S. forces reposition in the region to give the president flexibility if he orders a resumption of strikes. Officials have privately told several Middle Eastern governments to prepare both for renewed American action and for potential Iranian retaliation, including threats against shipping and regional infrastructure. The warnings point to a window opening as early as November 4, with a suspected nuclear storage site still untouched by prior strikes.","source":"Fox News","url":"https://www.foxnews.com/live-news/iran-war-news-trump-us-israel-november-1"},{"headline":"Army's 'Project Gatekeeper' Seeks to Cut Software Approval Times to Minutes","body":"The Army is piloting an initiative called Project Gatekeeper designed to compress software-approval timelines from months down to near-instant decisions, part of a broader modernization push under acquisition and technology leadership. The effort runs alongside parallel moves like Special Operations' robot-technician training programs and Secretary Hegseth's planned Autonomous Warfare Command, reflecting a Pentagon-wide drive to speed fielding of drones, robotics and AI tools to units. The changes are aimed at closing the gap between commercial software development speed and the military's traditionally slow certification process.","source":"Breaking Defense","url":"https://breakingdefense.com/"},{"headline":"NATO's Arctic Shield Exercise Draws 11 Allies to Counter Russian, Chinese Moves in High North","body":"Eleven NATO nations are running the multidomain Arctic Shield 2026 exercise, folding in active-duty troops, Home Guard units, reservists and civilians to rehearse missile defense, submarine operations and cold-weather ground maneuvers. The drill extends NATO's Arctic Sentry initiative launched in February 2026 to improve shared awareness across the High North amid rising Russian and Chinese activity. Secretary General Mark Rutte said the initiative lets allies synchronize presence under a single regional approach rather than scattering efforts nation by nation.","source":"Eurasia Review","url":"https://www.eurasiareview.com/31102026-natos-arctic-shield-exercise-enhances-high-north-security/"}],"acquisitions":[{"headline":"US Clears $2.1 Billion Sale of 500 Patriot Interceptors to Ukraine","body":"The State Department announced Friday it approved a $2.1 billion sale of 500 PAC-3 Patriot interceptors to Ukraine, a deal President Zelensky welcomed but warned could take years to fully deliver given production backlogs. The missiles will move through NATO's Prioritized Ukraine Requirements List mechanism, which lets allies pool funding for U.S.-made equipment; allies had already committed more than $6 billion through that channel as of June 2026. Zelensky is pressing for interceptors to reach Ukraine this winter rather than being banked for replenishment in later years.","source":"Euronews","url":"https://www.euronews.com/2026/10/31/zelenskyy-thanks-us-over-deal-for-500-patriot-missiles-but-warns-delivery-could-take-years"},{"headline":"General Dynamics Teams With Primordial to Build AI Assistant for Combat Vehicle Crews","body":"General Dynamics has partnered with AI startup Primordial to develop a generative AI assistant meant to help crews operating inside armored combat vehicles, part of a widening industry push to embed AI copilots directly into weapons platforms. The deal sits alongside other recent Army moves like Project Gatekeeper and investments in robotic vehicle technicians, signaling procurement dollars increasingly flowing toward autonomy and AI integration rather than traditional hardware alone. Details on contract value have not been disclosed.","source":"Breaking Defense","url":"https://breakingdefense.com/"}]},"us":[{"headline":"Courts Deal Trump Administration a String of Election-Law Defeats Days Before Midterms","body":"A California federal judge, Trina Thompson, issued an emergency order barring the Justice Department and DHS from threatening state and local election workers with criminal prosecution over ballots tied to voters the administration suspects are noncitizens. In a separate case the same day, a split Ninth Circuit panel rejected the administration's bid to force California to set aside roughly 20,000 such ballots while citizenship is verified. A third ruling in Washington, D.C. ordered the administration to hand over its list of alleged noncitizen voters to advocacy groups, and officials in Washington state said federal lists wrongly flagged US citizens. Trump called the rulings an obstruction of 'fixing Election Fraud' in a weekend social media post.","source":"Axios / Yahoo News","url":"https://www.axios.com/2026/10/31/doj-threats-election-workers-midterms"},{"headline":"October Payrolls Beat Expectations, Keeping Fed on Track for More Hikes","body":"The Bureau of Labor Statistics reported 182,000 jobs added in October, well above the roughly 160,000 consensus forecast, with unemployment holding at 4.1 percent. Average hourly earnings climbed 4.1 percent year-over-year, a pace still well above what the Fed considers consistent with its 2 percent inflation target. Economists say the stronger-than-expected print, following a weak September report, reinforces expectations the central bank will raise its benchmark rate again before year-end rather than pivot to cuts.","source":"Bloomberg / InflationTheGuide","url":"https://www.bloomberg.com/news/articles/2026-10-31/us-jobs-pickup-may-keep-fed-on-track-to-hike-rates-again"},{"headline":"Judge Tosses Trump's $10 Billion Defamation Suit Against WSJ and Murdoch","body":"A federal judge dismissed President Trump's $10 billion lawsuit against The Wall Street Journal and Rupert Murdoch over a story linking him to Jeffrey Epstein, saying the president was 'grasping at straws.' The ruling removes one of Trump's highest-profile legal fights against a major media outlet just days before the midterm elections. The decision is likely to be appealed but marks a significant setback for the administration's broader campaign of litigation against news organizations.","source":"NPR","url":"https://www.npr.org/sections/politics/"},{"headline":"Trump Closes Out Midterm Campaign Trail as Control of Congress Hangs in Balance","body":"President Trump wrapped up a near-daily rally schedule in red states ahead of Tuesday's November 3 midterms, with both parties treating the election as a referendum on his second term. Millions of Americans have already voted early, and most House and Senate races are rated solidly for one party, leaving a narrow band of competitive contests to decide majorities in the 120th Congress. Democratic factions are already jockeying over credit and direction for 2028 regardless of Tuesday's outcome, while down-ballot fights over redistricting, including a blocked Texas congressional map, remain unresolved heading into voting.","source":"NPR","url":"https://www.npr.org/sections/politics/"}],"pacific":{"pacificCommand":[{"headline":"Seoul Moves Ahead on Nuclear-Powered Submarines","body":"South Korea's Defense Acquisition Program Administration told lawmakers in October it will stand up new organizational structures and a formal blueprint to build nuclear-propulsion submarines, part of a broader push for self-reliant deterrence. The plan runs alongside a parallel drive to mass-produce uncrewed surface vessels, laser air-defense systems, and counter-drone networks, building on a June 2026 pledge to train 500,000 'drone warriors.' The capability would give South Korea a rare undersea asset among non-nuclear-armed states and strengthen allied deterrence posture across the Indo-Pacific.","source":"Indo-Pacific Defense Forum","url":"https://ipdefenseforum.com/2026/11/rok-pushes-development-of-nuclear-powered-submarines-to-boost-deterrence"},{"headline":"Quad Foreign Ministers Target Supply-Chain Coercion Ahead of Manila Summit","body":"Meeting in Atlanta on October 31, the foreign ministers of the US, Japan, Australia and India pledged more than $85 million for trusted AI initiatives across the Indo-Pacific and announced a new effort to flag semiconductor supply-chain vulnerabilities before disruptions occur. The joint statement voiced 'grave concerns' about export-restriction coercion and market-distorting overcapacity, though it avoided naming China directly. The session, the group's third this year, sets up a leaders' summit in Manila on November 15-18 that will mark Trump's first Quad leaders meeting.","source":"Nikkei Asia","url":"https://asia.nikkei.com/politics/international-relations/indo-pacific/quad-ministers-discuss-supply-chains-denounce-export-restrictions"},{"headline":"Tokyo Restructures Defense R&D Around AI and Cyber","body":"Japan's Defense Minister Koizumi announced a reorganization of the country's defense research apparatus to prioritize artificial intelligence and cyber capabilities, framing the overhaul as necessary to detect emerging threats faster and compress decision cycles. The move comes as Tokyo also deepens ties with Sweden and stages advanced missile launchers alongside US forces near Yonaguni Island, close to Taiwan. Together the steps reflect Japan's accelerating shift toward networked, software-driven deterrence rather than purely hardware-based defense investment.","source":"Nikkei Asia","url":"https://asia.nikkei.com/politics/international-relations/indo-pacific"}],"pacingThreat":[{"headline":"Beijing Expels 16 Generals and Four Defense-Industry Chiefs in Widening Purge","body":"China's Fifth Plenum, which closed October 29, saw only 279 of 376 Central Committee members and alternates attend after 33 officials were expelled, including 16 PLA generals and the heads of China's nuclear, aerospace and shipbuilding conglomerates — Yu Jianfeng, Yuan Jie, Zhang Zhongyang and Wen Gang. The purge has left just two members, Xi Jinping and newly elevated Politburo member Zhang Shengmin, on what was once a seven-person military leadership body overseeing equipment and corruption enforcement. Analysts tied the timing to the approaching 2027 Communist Party leadership transition and questions over loyalty and accountability inside the PLA's procurement system.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3372704/china-widens-pla-anti-graft-campaign-expelling-corporate-chiefs-16-generals-party"},{"headline":"PLA Showcases Amphibious Firepower and Anti-Drone Lasers While Tightening Its Belt","body":"State broadcaster CCTV this weekend aired unusually candid footage of a four-ship live-fire drill involving Type 071 amphibious dock landing ships and separately showcased PLA Army counter-drone units using lasers, microwave weapons and integrated missile-gun systems. The publicity push coincides with a reported austerity campaign in which PLA Daily described units reusing salvaged steel, old equipment components and even secondhand briefcases to cut costs under the 2026-2030 five-year plan. The contrast between high-profile capability displays and public thrift messaging suggests Beijing is managing budget pressure even as it signals growing amphibious and counter-drone readiness.","source":"Global Times / IANS","url":"https://www.globaltimes.cn/china/military/index.html"},{"headline":"Analysts: PLA Purge Likely Delays Xi's Taiwan Invasion Timeline","body":"Taiwanese scholars including National Taiwan University's Chen Shih-min said the dismissal of 28 senior PLA and defense-industry officials — among them former equipment chief Ma Xingrui and ex-defense minister Jin Zhuanglong — will force Beijing to redo major procurement plans, setting back preparations some analysts believed targeted 2027 for a potential move against Taiwan. The disruption comes as Taipei faces its own friction: the island's AH-64E Apache fleet was grounded on October 30 after a US gearbox-risk notice, and lawmakers are still finalizing a roughly NT$608 billion ($18.6 billion) supplementary budget that includes new defense spending ahead of November local elections.","source":"Taipei Times","url":"https://taipeitimes.com/News/taiwan/archives/2026/11/01/2003866956"}]},"europe":{"ukraineRussia":[{"headline":"Washington Clears $2.1B Patriot Sale as Russia's October Losses Hit Wartime High","body":"The State Department has approved a $2.1 billion sale of Patriot air-defense interceptors to Ukraine, even as Volodymyr Zelensky cautioned that actual deliveries could take years to arrive given production backlogs. Ukraine's General Staff says Russia suffered its worst monthly casualty toll of the entire war in October, pushing cumulative Russian losses since February 2022 past 1.59 million troops. The timing underscores how Moscow is absorbing staggering personnel losses on the ground even as both sides escalate long-range strikes rather than negotiate.","source":"Kyiv Independent","url":"https://kyivindependent.com/"},{"headline":"Russian Barrage Knocks Out Power Nationwide as Kyiv Hits Rostov Fuel Plant","body":"Overnight Russian strikes killed at least five people and left hundreds of thousands of Ukrainians without electricity as Kyiv described the national energy situation as 'difficult' heading into winter. Ukraine's air force said it downed 105 of 134 drones launched in the latest wave, including jet-powered models, with debris and impacts reported across roughly 20 locations. In retaliation, Ukrainian forces struck a plant in Russia's Rostov Oblast that manufactures fuel for Russian multiple-launch rocket systems, part of a broader campaign against Russian military-industrial targets.","source":"Kyiv Independent","url":"https://kyivindependent.com/"}],"europe":[{"headline":"Pentagon Warns Russia Is Building a Nuclear Anti-Satellite Weapon","body":"A new U.S. Defense Intelligence Agency assessment states that Russia is developing a satellite designed to carry a nuclear weapon into orbit, a direct violation of Moscow's obligations under the 1967 Outer Space Treaty. The report warns a detonation could degrade or destroy thousands of military, commercial and civilian satellites worldwide, including systems underpinning GPS, banking and weather forecasting, and would leave radiation belts capable of damaging spacecraft for years afterward. Analysts point to the Cosmos 2553 satellite, launched into an unusual orbit in February 2022, as a key research platform tied to the program, adding urgency to NATO discussions on allied space resilience.","source":"Defence Industry Europe / DIA","url":"https://defence-industry.eu/defense-intelligence-agency-says-russian-nuclear-satellite-program-could-threaten-thousands-of-spacecraft/"},{"headline":"Europe Heads Into Winter With Gas Storage at Multi-Year Lows","body":"Russian Deputy Prime Minister Alexander Novak said European underground gas storage levels are at historic lows just as the heating season begins, raising fresh questions about how the continent will manage winter demand. Novak also claimed Russian diesel continues reaching European markets under relabeled brands despite sanctions on Russian oil products, with Moscow projecting diesel exports could rise to 500,000 metric tons in November. While the comments come from a Russian official with an interest in highlighting sanctions' limits, they point to a real and recurring vulnerability for European governments entering a fourth winter shaped by the Ukraine war's energy fallout.","source":"TASS","url":"https://tass.com/economy/2211555"}]},"middleEast":[{"headline":"Saudi Arabia Intercepts Houthi Drone Over Riyadh Region","body":"Saudi-led coalition air defenses shot down a drone described as 'hostile' over the Riyadh region on October 31, with coalition spokesman Turki al-Malki saying debris fell without causing injuries. The intercept highlights that Yemen's Houthi movement retains the capability to threaten Saudi population centers despite a broader regional de-escalation push. It comes amid heightened Gulf alertness following U.S. warnings to regional allies about possible renewed strikes on Iran in the coming days.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-october-31-2026/"},{"headline":"Syria Weighs Joining Turkey-Saudi-Pakistan 'Mecca Pact'","body":"Syria's foreign minister said Damascus is actively considering whether to join the so-called Mecca alliance, a NATO-style mutual defense arrangement binding Turkey, Saudi Arabia and Pakistan. The move would mark a significant realignment for post-Assad Syria as it seeks security guarantees and closer integration with Sunni-led regional powers. A decision to join would further reshape Middle East security architecture at a moment when Gulf states are also bracing for possible renewed U.S.-Iran confrontation.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-october-31-2026/"},{"headline":"Gaza Death Toll Climbs Past 1,580 Despite Year-Old Ceasefire","body":"Israeli strikes and shelling killed at least four more Palestinians in Gaza on October 30-31, part of a pattern that has left over 1,580 Palestinians dead and 5,700 wounded in the year since the nominal ceasefire took effect in October 2025. Reconstruction has still not begun amid a standoff between Hamas, which refuses to fully disarm before an Israeli withdrawal, and Israel, which says it won't leave until Hamas gives up its weapons. Separately, Israel's expanded 'Yellow Line' now covers roughly 65% of Gaza, up from about 53% at the ceasefire's start, squeezing 2.1 million residents into an increasingly narrow western strip.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/10/31/at-least-four-palestinians-killed-in-gaza-as-israeli-attacks-continue"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Prepares Nasdaq Debut That Could Dwarf Rivals, Eyeing Up to $2 Trillion Valuation","body":"Anthropic is moving toward a mid-November IPO on Nasdaq under ticker ANT, with roadshow marketing reportedly starting the week of November 9 and a debut targeted before Thanksgiving. The offering could value the Claude maker as high as $2 trillion, more than double its $965 billion Series H price set in May, with Goldman Sachs and Morgan Stanley leading the deal. That would make it the largest IPO in history and vault Anthropic past OpenAI's $852 billion private valuation, intensifying the capital race between the two leading U.S. labs just as both pursue massive compute buildouts.","source":"Forge Global / SmartAsset","url":"https://forgeglobal.com/insights/anthropic-upcoming-ipo-news/"},{"headline":"Fei-Fei Li's World Labs Still Pending in AMD's $8.2B All-Stock Buyout","body":"AMD's roughly $8.2 billion all-stock acquisition of Fei-Fei Li's spatial-intelligence startup World Labs, announced September 28, remains pending and is expected to close by year-end, with Li set to become AMD's executive vice president and chief scientist reporting to CEO Lisa Su. In an October 27 Hoover Institution appearance, Li described World Labs as a roughly 40-person frontier spatial-intelligence company, underscoring how chipmakers are now racing to buy frontier research talent outright rather than just fund it. The deal reflects a broader consolidation wave as hardware giants seek in-house frontier AI capability to compete with OpenAI, Anthropic and Google DeepMind.","source":"AI Daily Digest / AMD newsroom","url":"https://github.com/diclogic/ai-daily-digest/issues/200"}],"cyberEmerging":[{"headline":"FBI Formally Blames North Korea's TraderTraitor for Record $6.43 Billion Binance Crypto Theft","body":"The FBI has officially attributed the theft of more than $6 billion in digital assets to TraderTraitor, a North Korea-aligned hacking group also tracked under aliases including Jade Sleet, Pressure Chollima and Slow Pisces. The $6.43 billion Binance-linked heist stands as one of the largest cryptocurrency thefts on record, reinforcing Pyongyang's reliance on large-scale crypto theft to fund its weapons programs amid tightening sanctions. The attribution adds to a string of 2026 incidents in which North Korean operators have used increasingly sophisticated, AI-assisted tradecraft against exchanges and custodians.","source":"The Hacker News","url":"https://thehackernews.com/"},{"headline":"Anthropic Discloses Unreleased AI Model Autonomously Built Five Working Exploit Chains","body":"Anthropic's Frontier Red Team revealed on October 27 that an internal, unreleased AI research model independently chained multiple vulnerabilities into five working proof-of-concept exploits spanning Chrome, Safari, Android, Windows and Linux, needing only minimal human prompting. One chain combined four separate Chrome flaws to escape the browser sandbox, leading Google to assign 62 CVEs and patch them by Chrome 156, while a Safari chain bypassed the same-origin policy to expose session data; all flaws were reported to vendors and fixed before publication. The disclosure follows a similar admission by OpenAI last month and signals that frontier models are crossing a capability threshold in offensive cyber research, pressuring defenders to match AI-accelerated vulnerability discovery with faster patching.","source":"The Hacker News / cybernews","url":"https://thehackernews.com/2026/10/anthropics-unreleased-ai-model-chains.html"}]},"cities":{"lasVegas":[{"headline":"ACLU Wins Restraining Order Over Voter Intimidation at Las Vegas Polling Site","body":"A judge granted the ACLU of Nevada a temporary restraining order barring voter intimidation at the Desert Breeze early-voting site in Las Vegas, days before Tuesday's general election. The order comes as the Justice Department confirmed it will send federal observers to Nevada polling locations on Election Day, underscoring heightened scrutiny of the state's voting process this cycle. Nevada's secretary of state office says it is coordinating with local law enforcement to keep sites secure through Nov. 3.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"},{"headline":"One Dead, Multiple Water Rescues as Storms Flood Las Vegas Valley","body":"Heavy rain swamped the Las Vegas valley late last week, flooding businesses in the Arts District and forcing Henderson fire crews to carry out three separate swift-water rescues. One person died in the flooding, and officials warned residents to avoid flooded roadways as another wet, cooler system moves through the region into Sunday with highs near 70 degrees. Mountain areas could see light snow as the storm clears out.","source":"8 News Now","url":"https://www.8newsnow.com/"},{"headline":"Argentine National Charged in Fifth Federal Illegal-Voting Case in Clark County","body":"Federal prosecutors in Nevada charged an Argentine national with illegally voting in Clark County during the 2024 general election, the fifth such federal case filed in the county. The charge lands just days before Nevada's 2026 midterm election and adds to an already tense pre-election atmosphere that includes a separate restraining order over alleged voter intimidation at a Las Vegas polling site. Prosecutors have not detailed the suspect's immigration status or how the alleged ballot was cast.","source":"News3LV / KOLO","url":"https://news3lv.com/"}],"nellis":[{"headline":"Air Force Moves Ahead on $1 Billion F-47 Test Campus at Nellis","body":"The Air Force is advancing plans for a $1.057 billion 'F-47 Future Campus' on the east side of Nellis Air Force Base to support operational testing of Boeing's sixth-generation F-47 fighter, with an initial contract award targeted for February 2027 and main facilities expected by early March 2031. The project follows a fiscal 2027 budget request that includes $730 million for F-47 hangars and infrastructure, cementing Nellis as the jet's operational testing hub even as initial flight trials proceed at Edwards Air Force Base. The Air Force wants the F-47 operational by 2029 and plans to buy at least 185 aircraft, a build-out that would keep Nellis and the adjacent 2.9-million-acre Nevada Test and Training Range central to next-generation air combat development for years to come.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/military/air-force-seeks-1b-campus-at-nellis-to-make-fighter-jets-3905477/"}]},"feelGood":[{"headline":"Army Veteran Surprised With New Car and College Scholarship","body":"Roy Mora, a retired U.S. Army specialist who deployed to Afghanistan in 2012, was surprised during a Miami Heat game with a new vehicle and a two-year scholarship to Miami Dade College. The gifts came through a partnership between Lithia Motors, the Military Warrior Support Foundation and Chase Bank, recognizing Mora's service and his volunteer work helping families in crisis. Married 15 years and homeschooling five children, Mora said he and his family were overwhelmed by the community's generosity.","source":"Local10 (WPLG)","url":"https://www.local10.com/news/local/2026/10/31/local-army-veteran-surprised-with-new-car-college-scholarship/"},{"headline":"Teen's Quick Thinking Saves Wandering Elderly Man in Extreme Heat","body":"A teenager who noticed an elderly man with dementia wandering alone in 103-degree heat intervened immediately, a small act of alertness credited with possibly saving the man's life. The episode is among several uplifting stories highlighted this week by Global Positive News, a reminder that everyday vigilance from strangers can prevent tragedy. Local authorities were able to reunite the man safely with family after the teen flagged the situation.","source":"Global Positive News Network","url":"https://www.globalpositivenewsnetwork.com/good-news-this-week-november-1st/"},{"headline":"Nationwide Charity Drive Sends Halloween Candy to Deployed Troops","body":"Soldiers' Angels, a veteran-support nonprofit, is kicking off its annual 'Treats for Troops' campaign, collecting leftover Halloween candy through November to ship in care packages to deployed service members and veterans. The drive runs alongside the group's ongoing 'Operation: Warm Winter' and holiday stocking campaigns, which gather coats, blankets and gifts for homeless veterans and troops overseas. Community collection sites across the country are volunteering to gather candy donations throughout November.","source":"Soldiers' Angels","url":"https://soldiersangels.org/volunteer/special-campaigns/"}],"onThisDay":[{"year":"1755","event":"A massive earthquake and tsunami devastated Lisbon, Portugal, killing tens of thousands of people."},{"year":"1950","event":"Puerto Rican nationalists attempted to assassinate U.S. President Harry Truman at Blair House in Washington.'"},{"year":"1952","event":"The United States detonated the first hydrogen bomb, code-named Ivy Mike, at Enewetak Atoll in the Pacific."},{"year":"1993","event":"The Maastricht Treaty took effect, formally establishing the European Union."}]},"topPicks":[{"headline":"Trump Signals New Iran Strikes Could Come Right After Midterms","teaser":"A post-election military action against Iran could reshape Middle East tensions and global oil markets almost overnight."},{"headline":"Beijing Expels 16 Generals and Four Defense-Industry Chiefs in Widening Purge","teaser":"A sweeping PLA leadership purge could delay China's military timelines and signal deep internal instability at the top."},{"headline":"Pentagon Warns Russia Is Building a Nuclear Anti-Satellite Weapon","teaser":"A space-based nuclear ASAT threat could endanger global satellite infrastructure and dramatically escalate great-power tensions."}]},"navDates":[{"key":"2026-11-03","label":"Nov 3","href":"/","isNewest":true},{"key":"2026-11-02","label":"Nov 2","href":"/archive/2026-11-02.html","isNewest":false},{"key":"2026-11-01","label":"Nov 1","href":"/archive/2026-11-01.html","isNewest":false},{"key":"2026-10-31","label":"Oct 31","href":"/archive/2026-10-31.html","isNewest":false},{"key":"2026-10-30","label":"Oct 30","href":"/archive/2026-10-30.html","isNewest":false},{"key":"2026-10-29","label":"Oct 29","href":"/archive/2026-10-29.html","isNewest":false},{"key":"2026-10-28","label":"Oct 28","href":"/archive/2026-10-28.html","isNewest":false}],"currentKey":"2026-11-01","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-01.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
