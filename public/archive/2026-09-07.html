<script>
const STATE = {"digest":{"date":"Monday, September 7, 2026","generatedAt":"Mon, Sep 7, 8:03 AM PDT","breaking":{"headline":"Iran War Casualty Toll Climbs to 18 Dead, Over 790 Wounded as Conflict Enters Seventh Month","body":"The renewed US-Iran conflict reached its 191st day on September 6, with Pentagon data now showing 18 American service members killed and more than 790 wounded, a jump from roughly 697 wounded reported in early August that officials still have not explained. CENTCOM said a US carrier and destroyer operating near Iran evaded multiple unprovoked Iranian attacks on September 5-6 with no Americans harmed, while Tehran's claim that both vessels were damaged went unsubstantiated. Saudi Arabia kept the Jazan and Najran airports closed under continuing Houthi threats, and Israeli Prime Minister Netanyahu declared on September 3 that toppling Iran's regime is now within reach.","source":"GlobalSecurity.org","url":"https://www.globalsecurity.org/military/ops/iran-war-oprep.htm"},"tabs":{"defense":{"defense":[{"headline":"US Carrier, Destroyer Evade Iranian Attacks in Gulf Waters","body":"CENTCOM confirmed a US aircraft carrier and an accompanying destroyer operating near Iran dodged multiple unprovoked Iranian attacks over September 5-6 without any American casualties. Iran's Revolutionary Guard claimed both ships sustained damage, but offered no evidence to support the assertion. The exchange is the latest flare-up since ceasefire talks broke down and President Trump notified Congress in July that hostilities with Tehran had resumed.","source":"GlobalSecurity.org","url":"https://www.globalsecurity.org/military/ops/iran-war-oprep.htm"},{"headline":"Pentagon Seeks Congressional Sign-Off to Shift $1.5 Billion Toward AI Push","body":"The Defense Department asked Congress on September 4 for authority to reprogram nearly $1.5 billion in funding, redirecting resources toward a major expansion of artificial-intelligence capabilities and adjusted Middle East requirements stemming from Operation Epic Fury. The move, detailed in a budget document obtained by Inside Defense, shows how the sustained Iran conflict is reshaping Pentagon spending even as the department races to keep pace with China on military AI.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Finland Assembles First F-35 Engine, Deepening NATO Industrial Ties","body":"Finnish manufacturer Patria announced this week it has completed assembly of the first F135 engine for the F-35 fighter, built in partnership with Pratt & Whitney, a subsidiary of RTX. The milestone marks a step in NATO allies' efforts to localize production of American-made platforms as European members expand their own defense-industrial base amid the ongoing Ukraine war.","source":"Militarnyi","url":"https://militarnyi.com/en/news/"}],"acquisitions":[{"headline":"Army Opens Stinger-Replacement Competition Beyond Raytheon and Lockheed","body":"The Army is recruiting additional suppliers for its Next Generation Short Range Interceptor program, creating an alternate path alongside the Raytheon and Lockheed Martin prototypes already competing to replace the aging Stinger missile. A spring 2027 demonstration is planned, which could lead to new missile procurement awards depending on performance.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"L3Harris Finishes First 35 Units of New Electronic Warfare System","body":"L3Harris Technologies said it has completed production of the initial 35 units of an electronic warfare system built to protect US forces, an early manufacturing milestone for the program. The delivery comes as the Pentagon accelerates fielding of EW and counter-drone equipment, drawing lessons from both the Iran conflict and the war in Ukraine.","source":"Defence Blog","url":"https://defence-blog.com/category/news/"}]},"us":[{"headline":"Judge Orders Trump Team to Name Architects of $1.8B 'Anti-Weaponization' Fund","body":"U.S. Magistrate Judge Ivan D. Davis in Alexandria, Virginia ruled Friday that the Trump administration must disclose the identities of officials who designed the proposed $1.8 billion fund meant to compensate people who say they were unfairly targeted by federal prosecutors, including potentially January 6 defendants. The fund emerged from a settlement of Trump's personal lawsuit against the IRS over leaked tax returns, and Attorney General Todd Blanche has called it 'dead,' but Trump has continued to signal support for it. The ruling, sought by a fired Jan. 6 prosecutor and a law professor represented by Democracy Forward, forces DOJ to turn over documents despite the administration's objections that the fund was never implemented.","source":"NBC News","url":"https://www.nbcnews.com/politics/trump-administration/judge-orders-trump-officials-disclose-names-anti-weaponization-fund-rcna596183"},{"headline":"DOJ Asks Supreme Court to Revive USPS Mail-Ballot Restrictions Before Midterms","body":"The Justice Department filed an emergency application with the Supreme Court on Sunday seeking to let new U.S. Postal Service rules restricting federal mail-in ballots take effect for the 2026 midterms. The move comes after a federal judge in Boston issued a September 4 preliminary injunction blocking key parts of the plan, and follows a separate push by DOJ to get the First Circuit to lift a related block on the policy. The dispute is shaping up as an early test of how much authority the administration has to reshape mail-voting procedures just weeks before primary and general election activity ramps up nationwide.","source":"NPR","url":"https://www.npr.org/2026/09/03/nx-s1-5955614/trump-mail-in-voting-ruling-court-usps"},{"headline":"August Payrolls Jump 162,000, Blowing Past Forecasts as Unemployment Holds at 4.1%","body":"The Bureau of Labor Statistics reported Friday that U.S. employers added 162,000 jobs in August, triple the 53,000 Wall Street had expected and the strongest monthly gain in five months, reversing a sluggish summer stretch that included a June-July net loss. Unemployment held steady at 4.1 percent even as labor-force participation ticked up to 61.6 percent, and average hourly earnings rose 0.3 percent to $37.75, up 3.1 percent year-over-year. Leisure and hospitality led the gains with 62,000 new jobs, while information-sector employment continued to shrink, a trend some economists tie to AI-driven automation.","source":"CNBC","url":"https://www.cnbc.com/2026/09/04/jobs-report-august-2026.html"},{"headline":"Redistricting Fights Split State Supreme Courts Ahead of Midterms","body":"Maryland's Supreme Court has upheld the state's Democratic-drawn congressional map for use through the 2028 cycle, rejecting Republican challenges just weeks before the midterm election machinery kicks into gear. The ruling stands in contrast to Missouri, where that state's Supreme Court blocked a GOP-drawn map from taking effect this November, ruling that a voter referendum on the boundaries must first appear on the ballot and forcing Missouri to use its old district lines for now. Together the rulings underscore how state courts, rather than Congress, are increasingly deciding which party gets the advantage in critical House battlegrounds this cycle.","source":"NBC News","url":"https://www.nbcnews.com/politics/2026-election/missouri-supreme-court-rules-gop-drawn-map-cant-used-november-election-rcna595688"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Requests Record $55.6B Defense Budget for FY2027","body":"Japan's Ministry of Defense submitted a record 8.9 trillion yen ($55.6 billion) budget request for fiscal year 2027, up from last year's $55 billion ask that was ultimately raised to $56.4 billion. The request prioritizes AI-enabled command and control, unmanned systems, and long-range standoff weapons, including Japan's first publicly disclosed bid for a dedicated anti-radar missile, Northrop Grumman's AGM-88G AARGM-ER. Other line items include additional F-35s, KC-46 tankers, and upgraded Mogami-class frigates as Tokyo says it faces its most severe security environment since World War II.","source":"USNI News / Global Defense Corp","url":"https://news.usni.org/2026/09/01/japan-budget-requests-record-55-6b-for-unmanned-long-range-strike-capabilities"},{"headline":"Seoul Recalibrates After Trump Forces Cuts to Joint Drills","body":"South Korean officials are weighing next steps after President Trump ordered the Ulchi Freedom Shield exercise cut short by a week, ending Aug. 21 instead of Aug. 27, citing Seoul's refusal to join the war against Iran and his rapport with Kim Jong Un. Retired Lt. Gen. Chun In-Bum warned the move creates a dangerous readiness gap as North Korean troops gain combat experience fighting alongside Russia in Ukraine, with Kyiv estimating up to 50,000 additional DPRK soldiers have been dispatched. Pyongyang has not reciprocated the outreach, with state media instead denouncing the drills as reckless provocations.","source":"Nikkei Asia / CNBC","url":"https://www.cnbc.com/2026/08/20/trump-south-korea-military-drills-cuts-.html"},{"headline":"India, China Widen Military Hotline to Arunachal Pradesh Ahead of BRICS","body":"Indian and Chinese army commanders held their first-ever Corps Commander-level meeting at the Wacha-Damai border point in Arunachal Pradesh on Sept. 6, extending a de-escalation mechanism previously limited to the Chushul-Moldo point in Ladakh. India's delegation was led by Lt. Gen. Girish Kalia of the 3 Corps, and the talks build on an eight-point consensus reached Aug. 25 between NSA Ajit Doval and Chinese FM Wang Yi in Beijing. The timing is notable: it comes days before Xi Jinping is expected in New Delhi for the Sept. 11-13 BRICS summit, and extends military-to-military contacts into the sensitive eastern sector China claims as 'Southern Tibet.'","source":"Indian Defence News","url":"https://www.indiandefensenews.in/2026/09/india-china-expand-corps-commander.html"}],"pacingThreat":[{"headline":"PLA Sorties Cross Taiwan Strait Median Line in Latest 24-Hour Tracking","body":"Taiwan's Ministry of National Defense detected two PLA aircraft sorties, 13 PLA Navy ships, and four Chinese official vessels operating around the island in the 24 hours ending 6 a.m. Sept. 7, with both aircraft crossing the Taiwan Strait median line. Taipei's armed forces responded with combat air patrols, naval vessels, and coastal missile units, part of the daily gray-zone pressure Beijing has sustained around Taiwan for years. The tempo remains far below the surge tactics used after the 2022 Pelosi visit, but the persistent median-line crossings continue to erode the informal buffer that once separated the two sides' forces.","source":"Taiwan Ministry of National Defense / GlobalSecurity.org","url":"https://www.globalsecurity.org/wmd/library/news/taiwan/2026/taiwan-260907-roc-mnd01.htm"},{"headline":"UK Experts Press Government to Purge Chinese-Linked Components From Defense Supply Chains","body":"British defense analysts are urging London to eliminate Chinese-origin components and potential espionage vectors embedded in military hardware and supply chains, warning that dependency on Chinese-made parts creates strategic vulnerabilities. The push reflects growing alarm across allied capitals about Beijing's ability to exploit commercial supply chains for intelligence collection or sabotage in a crisis. It echoes similar reviews already underway in Washington, Tokyo, and Canberra targeting Chinese components in sensitive defense and telecommunications systems.","source":"Nikkei Asia","url":"https://asia.nikkei.com/politics/defense"},{"headline":"Taiwan's Defense Ministry Flags PLA Focus on Amphibious Landing Buildup","body":"Taiwan's Ministry of National Defense submitted its 2026 annual report on Chinese military power to the Legislative Yuan on Sept. 1, placing unusually heavy emphasis on PLA efforts to strengthen joint island-landing capabilities. Analyst Chieh Chung of the INDSR think tank said the report indicates improving amphibious assault capacity has become a top PLA force-development priority in coming years, and that this buildup appears undisturbed by the command gaps created by Xi Jinping's ongoing purge of senior military officials. The report also cites PLA plans to acquire new space-ground networking and information-fusion equipment to bolster mobile cyberwarfare units.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/09/02/2003863545"}]},"europe":{"ukraineRussia":[{"headline":"Witkoff-Kushner Peace Mission Ends in Kyiv Without Breakthrough","body":"U.S. envoys Steve Witkoff and Jared Kushner capped a marathon shuttle diplomacy run by traveling overland from Moscow to Kyiv on September 6 after a three-hour Kremlin meeting with Vladimir Putin produced no announced deal. Zelensky met the envoys and afterward said Ukraine still expects the war to continue, while pressing Washington for energy and air-defense support ahead of winter. Kyiv and Moscow briefly agreed to spare each other's capitals from strikes during the visit, but fighting elsewhere along the front continued unabated.","source":"Al Jazeera / Kyiv Independent","url":"https://www.aljazeera.com/news/2026/9/5/russias-putin-meets-us-envoys-to-discuss-trump-proposal-to-end-ukraine-war"},{"headline":"Romania Scrambles Jets as Drone Threat Crosses Border, Russian Losses Mount","body":"Romania issued an overnight air-raid warning on September 6 and readied fighters after aerial targets approached its border with Ukraine, while a separate Russian strike on Odesa's Izmail district forced the suspension of the Orlivka ferry crossing into Romania. Ukraine's General Staff logged 245 combat clashes on September 5 alone, with nearly a fifth concentrated on the Pokrovsk front, as ISW assessed that Putin is hardening his refusal to compromise in talks based on a distorted view of battlefield gains. Kyiv put Russia's cumulative personnel losses since 2022 at roughly 1.49 million, including 1,390 more killed or wounded in the past day.","source":"Ukrinform / ISW via Kyiv Post","url":"https://www.kyivpost.com/post/83903"}],"europe":[{"headline":"Eastern Flank Drone Incursions Push NATO Toward New Autonomous Defenses","body":"Romania's latest border scare on September 6 is the newest entry in a fast-growing tally: Romanian officials count 33 recorded airspace violations since 2022, 18 of them this year alone, part of an alliance-wide total of roughly 144 drone incursions over European airports and bases since August 2024. In response, Poland, Romania and Denmark are fielding the U.S.-made Merops counter-drone system, while command authority to shoot down intruders has shifted from national capitals to NATO's own air-operations centers under SACEUR. No ally has invoked Article 4 consultations since Poland's mass drone incursion a year ago, underscoring how routinized — and unresolved — the threat has become.","source":"Großwald / ABC News","url":"https://www.grosswald.org/russian-drone-and-missile-incursions-nato-territory/"},{"headline":"Six Wealthy States Revolt Against Brussels' Nearly €2 Trillion Budget Plan","body":"Germany, Denmark, the Netherlands, Austria, Finland and Sweden issued a joint demand on August 27 to slash hundreds of billions of euros from the European Commission's proposed 2028-2034 budget and to reject any new common EU borrowing. The six net contributors instead want funds redirected toward defense, competitiveness, migration control and 'European sovereignty,' setting up a bruising unanimity fight among member states. The clash comes as EU inflation ticked up to 3.0% in July and the bloc posted a widening trade gap, adding economic pressure to an already fraught negotiation.","source":"FXStreet","url":"https://www.fxstreet.com/analysis/europe-in-focus-september-2026-202609070832"}]},"middleEast":[{"headline":"Oil Nears $100 as Iran-U.S. Strikes Choke Strait of Hormuz Shipping","body":"Brent crude climbed to roughly $97.47 a barrel and WTI to $92.26 on September 7 — six-week highs — as continued tit-for-tat strikes on vessels in and around the Strait of Hormuz kept regional crude flows constricted. Iranian officials described their attacks on shipping and U.S. positions as legitimate defensive measures even as Tehran's IRGC has separately struck Kurdish opposition targets in Iraq. The disruption has also factored into OPEC+'s decision to hold October production steady despite pressure from a tight global market.","source":"Dawn","url":"https://www.dawn.com/live/iran-israel-war"},{"headline":"Israel Kills Hamas Nukhba Commander in Gaza City Strike","body":"The IDF confirmed a September 6 airstrike in Gaza City killed Yusuf Aqila, identified as a company commander in Hamas's elite Nukhba Force, saying he had been directing attacks on troops and civilians. The strike came alongside a broader Israeli military buildup, with police and IDF units simultaneously running 'Advancing the Wall' and 'Southern Wind' readiness drills in Eilat to prepare for a possible repeat of an October 7-style assault. Kushner separately remarked that officials are only now grasping the scale of militarization inside Gaza.","source":"The Times of Israel / Jerusalem Post","url":"https://www.timesofisrael.com/liveblog-september-07-2026"},{"headline":"Yemen's Civil War Reignites as Houthi-Government Clashes Kill 60+ in Taiz","body":"Fighting between Yemeni government-aligned forces and Houthi militants sharply escalated around Taiz over the weekend, with more than 60 people, including civilians, reported killed as of September 6. The flare-up marks one of the deadliest rounds of internal Yemeni fighting in months and comes as the broader Red Sea and Strait of Hormuz corridor remains destabilized by the wider Iran-linked regional conflict. It signals that Yemen's fragmented civil war is intensifying in parallel with — and independent of — the Gulf-wide military crisis.","source":"Al Jazeera","url":"https://www.aljazeera.com/middle-east/"}],"techAI":{"aiCompetition":[{"headline":"OpenAI Advances Toward Wall Street Debut in Crowded AI IPO Race","body":"OpenAI has confirmed it submitted draft IPO paperwork to the SEC, working with Goldman Sachs and Morgan Stanley as it pushes toward a public listing that analysts expect could value the ChatGPT maker above $1 trillion. The move makes OpenAI the third major frontier-AI company to formally begin the Wall Street process within days, following similar steps by rivals also racing to tap public capital markets. A listing at that scale would rank among the largest tech debuts in history and force new financial transparency on an industry that has largely operated privately.","source":"AI Frontier Review","url":"https://aifrontierreview.com/"},{"headline":"OpenAI Pushes Agentic GPT-6 Astra Into Business and Enterprise Tiers","body":"OpenAI has begun a staged rollout of GPT-6 Astra, a model capable of operating software, browsing the web, and executing multi-step workflows, to ChatGPT Pro, Business, and Enterprise subscribers. The move effectively folds a full software-operating AI agent into subscription plans many small and mid-size firms already pay for, sharpening competition with Google and Anthropic's own agentic products. It follows a broader pattern this month of frontier labs racing to prove their models can perform sustained, economically valuable work rather than just chat.","source":"AI Frontier Review","url":"https://aifrontierreview.com/"}],"cyberEmerging":[{"headline":"Anthropic, Google and OpenAI Converge on Gated 'Cyber-Capable' Model Tiers","body":"Anthropic's Mythos 5.1, Google's Gemini 3.8 Flash Cyber, and OpenAI's Astra all ship this month as security-restricted variants of the labs' newest frontier models, unlocking advanced offensive and defensive cyber capabilities only for vetted government or enterprise defenders. Analysts tracking the releases say raw model intelligence is now converging across labs, shifting the real competition toward who controls access permissioning rather than who has the smartest model. The pattern raises unresolved policy questions about how vetting programs, such as Google's gated access system, will be audited to keep powerful cyber tools from leaking to adversarial states.","source":"Local AI Zone","url":"https://local-ai-zone.github.io/blog/September_2026_AI_Model_Updates.html"},{"headline":"Researchers Detail Near-Autonomous China-Linked AI Cyberattack on Taiwan","body":"Cybersecurity researchers at DREAM Lab say they recovered the full operational workspace of a China-linked multi-agent AI attack framework, built on open-source Hermes and OpenClaw agents, that breached Taiwanese government networks over a four-day span. The agent swarm ran up to eight parallel sub-agents, compromised at least 85 government accounts, mapped 21 connected systems and their single sign-on architecture, and exfiltrated more than 2,500 personnel records with minimal human direction. Officials describe it as the clearest evidence yet that AI-orchestrated intrusion campaigns have moved from proof-of-concept to operational use against state infrastructure, heightening pressure on Taipei's cyber defenses amid ongoing cross-strait tensions.","source":"Cyber Magazine","url":"https://cybermagazine.com/news/china-linked-autonomous-cyberattack-on-taiwan-explained"}]},"cities":{"lasVegas":[{"headline":"Deadly Labor Day Weekend on Valley Roads: Three Killed in String of Crashes","body":"A string of separate wrecks across the Las Vegas Valley over an eight-hour stretch spanning Saturday night into Sunday morning left three people dead and three more in critical condition. The cluster of crashes capped a violent Labor Day weekend on local roads, prompting renewed concern from traffic safety officials about holiday-weekend driving risks in the valley. Metro and Nevada Highway Patrol have not yet released full details on causes or charges in each incident.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Visitor Hits $144K Jackpot on Strip Table Game","body":"A traveler from North Carolina landed a $144,000 table-game jackpot at a Las Vegas Strip casino, one of the larger recent wins reported on the Strip this year. The payout adds to a string of big-money hits publicized by valley casinos in recent weeks as tourism traffic remains strong heading into the fall convention season.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Boulder City Church Wins Approval to Build After 20-Year Wait","body":"Boulder City United Methodist Church received unanimous approval to construct a 7,200-square-foot church building near the Boulder City Cemetery, ending a two-decade effort by the congregation to secure its own permanent home. The approval clears the way for construction to begin after years of zoning and land-use hurdles in the small Clark County city.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"}],"nellis":[{"headline":"Nellis Rebrand Reflects Expanding Warfighting Mission Amid High Ops Tempo","body":"Nellis Air Force Base's public identity has shifted to emphasize its role as the U.S. Air Force Warfare Center, with base officials saying the change reflects the broader scope of work carried out by the many wings headquartered there rather than any change to the installation's name or day-to-day mission. The rebrand comes as the 57th Wing, the USAF Weapons School, and the Nevada Test and Training Range continue a heavy training cadence, including ongoing Weapons School classes and Red Flag-style large-force exercises over the NTTR's thousands of square miles of restricted airspace. For Las Vegas, the realignment underscores Nellis's growing footprint as the Air Force's premier combat-training hub at a moment of elevated global tension.","source":"KTNV","url":"https://www.ktnv.com/news/nellis-air-force-base-now-publicly-identifying-as-us-air-force-warfare-center"}]},"feelGood":[{"headline":"Volunteer Rescue Team Saves Climber Stranded on Six-Inch Ledge","body":"An all-volunteer search-and-rescue team spent 15 hours reaching climber Rob Martin after he became stranded on a six-inch ledge roughly 10,000 feet up California's Laurel Mountain, ultimately bringing him down safely overnight. The rescue relied entirely on unpaid volunteers willing to risk a dangerous overnight mountain descent for a stranger in distress.","source":"Good News Daily","url":"https://the-goodnews-daily.com/category/humanity"},{"headline":"FedEx Volunteers Pack 10,000 Meal Kits for Filipino Schoolchildren","body":"Sixty FedEx employees teamed up with the nonprofit Rise Against Hunger Philippines to assemble 10,000 fortified meal kits, enough to feed 166 schoolchildren for four months, as the country grapples with its first rise in child malnutrition rates in a decade. The hands-on volunteer effort shows corporate employees stepping in directly to address a worsening hunger crisis rather than simply writing a check.","source":"Good News Daily","url":"https://the-goodnews-daily.com/category/humanity"},{"headline":"Hostages Freed After Deadly Gang Attack in Haiti","body":"Six children and seven women who were taken captive during a deadly gang assault on Kenscoff, Haiti, have been released, ending an ordeal for the families caught up in the country's ongoing gang violence. The safe return of all thirteen captives offers a rare positive outcome amid Haiti's broader security crisis, in which armed groups have displaced hundreds of thousands of people this year.","source":"Good News Daily","url":"https://the-goodnews-daily.com/category/humanity"}],"onThisDay":[{"year":"1533","event":"Elizabeth I was born at Greenwich Palace, later becoming Queen of England."},{"year":"1822","event":"Dom Pedro I declared Brazil's independence from Portugal."},{"year":"1940","event":"Nazi Germany began the Blitz, launching sustained bombing raids on London."},{"year":"1979","event":"ESPN launched as a cable sports network in the United States."}]},"topPicks":[{"headline":"Iran War Casualty Toll Climbs to 18 Dead, Over 790 Wounded as Conflict Enters Seventh Month","teaser":"The prolonged Iran conflict's rising death toll signals deepening instability with global security and economic ripple effects."},{"headline":"Oil Nears $100 as Iran-U.S. Strikes Choke Strait of Hormuz Shipping","teaser":"Surging oil prices from Strait of Hormuz disruptions threaten global energy markets and could fuel worldwide inflation."},{"headline":"August Payrolls Jump 162,000, Blowing Past Forecasts as Unemployment Holds at 4.1%","teaser":"Stronger-than-expected US jobs data signals economic resilience, shaping Federal Reserve policy and midterm election dynamics."}]},"navDates":[{"key":"2026-09-11","label":"Sep 11","href":"/","isNewest":true},{"key":"2026-09-10","label":"Sep 10","href":"/archive/2026-09-10.html","isNewest":false},{"key":"2026-09-09","label":"Sep 9","href":"/archive/2026-09-09.html","isNewest":false},{"key":"2026-09-08","label":"Sep 8","href":"/archive/2026-09-08.html","isNewest":false},{"key":"2026-09-07","label":"Sep 7","href":"/archive/2026-09-07.html","isNewest":false},{"key":"2026-09-06","label":"Sep 6","href":"/archive/2026-09-06.html","isNewest":false},{"key":"2026-09-04","label":"Sep 4","href":"/archive/2026-09-04.html","isNewest":false}],"currentKey":"2026-09-07","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-09-07.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
