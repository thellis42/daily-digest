<script>
const STATE = {"digest":{"date":"Tuesday, August 18, 2026","generatedAt":"Tue, Aug 18, 5:36 AM PDT","breaking":{"headline":"Trump Orders Cuts to US-South Korea War Games, But Drills Launch on Schedule","body":"On Sunday, August 16, President Trump directed Defense Secretary Pete Hegseth to substantially reduce the annual Ulchi Freedom Shield exercise with South Korea, citing its cost and his rapport with Kim Jong Un, and voicing frustration that Seoul had not joined a US push on Iran. Despite the order, South Korea's defense ministry proceeded on schedule the next morning, running the drills from August 17 to 27 with roughly 18,000 troops, though the exercise had already been trimmed to 14 major field events from 17 a year earlier. The episode exposes visible friction inside a key Indo-Pacific alliance even as Washington remains locked in a parallel military standoff with Iran, raising fresh questions in Seoul and Tokyo about the reliability of US extended deterrence in Northeast Asia.","source":"The American Legion","url":"https://www.legion.org/information-center/news/security/2026/august/five-things-to-know-aug-17-2026"},"tabs":{"defense":{"defense":[{"headline":"SPACECOM Deputy Commander Urges Fused Missile Warning and Defense Network","body":"Speaking Monday, August 17, the deputy commander of US Space Command said the Pentagon must merge its missile-warning and missile-defense architectures into a single system to keep pace with adversaries fielding faster, more numerous hypersonic and ballistic threats. The remarks add pressure on the Department of War to speed up sensor-to-shooter integration as China and Russia continue expanding their long-range missile arsenals.","source":"Aerotech News & Review","url":"https://www.aerotechnews.com/blog/2026/08/17/headlines-august-17-2/"},{"headline":"NORTHCOM General Renews Warning US Can't Reliably Stop Drones Over Homeland","body":"A senior US Northern Command general again warned this week that the American military still lacks dependable means to detect and neutralize small drones over domestic territory, a persistent gap officials have flagged amid unexplained sightings near US installations. Separately, US Central Command announced it will stand up its first task force dedicated to multi-domain, multinational attack-drone operations, signaling how uncrewed systems are reshaping both overseas combat planning and homeland-defense priorities.","source":"FDD Overnight Brief / DefenseScoop","url":"https://www.fdd.org/overnight-brief/august-17-2026/"},{"headline":"French Rafales Hand Baltic Air Policing Mission to Italian Eurofighters","body":"France's Air and Space Force wrapped up a four-month NATO Baltic Air Policing rotation from Šiauliai, Lithuania, logging over 540 flying hours and nearly 40 real-world Alpha scrambles, including a Rafale's use of a MICA missile to down a drone over Latvia. Italian Eurofighters are now taking over as NATO shifts the mission toward a broader integrated air-and-missile-defense posture, a change driven partly by a sharp rise in Russian military flights near allied airspace, including a French intercept of a Russian FSB command jet on August 16.","source":"NATO Allied Air Command","url":"https://ac.nato.int/archive/2026/french-air-and-space-force-conclude-nato-baltic-air-policing-mission-in-lithuania-"}],"acquisitions":[{"headline":"Raytheon Lands $22.9B Deal to Surge Tomahawk Missile Production","body":"Raytheon has been awarded a seven-year, $22.9 billion contract to accelerate manufacturing of Tomahawk cruise missiles for the US military, reported August 17. The deal comes as the Pentagon works to rebuild precision-strike stockpiles drawn down during the ongoing campaign against Iranian-linked targets, while also building capacity for potential contingencies in the Indo-Pacific.","source":"Defence Blog","url":"https://defence-blog.com/category/news/"},{"headline":"Pentagon Signs Boeing and RTX Deals to Expand SM-3 Interceptor Output","body":"The Department of War signed framework agreements with Boeing and RTX last Friday, August 14, to expand production of critical components for the Standard Missile-3, the Navy's primary ship-launched interceptor against ballistic missiles. The agreements aim to widen the industrial base for missile-defense hardware as US forces face simultaneous demand from Middle East operations and deterrence requirements against North Korea and China in the Pacific.","source":"FDD Overnight Brief","url":"https://www.fdd.org/overnight-brief/august-17-2026/"}]},"us":[{"headline":"Supreme Court Faces Tuesday Deadline in White House Ballroom Fight","body":"The Trump administration has asked the Supreme Court to lift a lower-court injunction blocking above-ground construction of the roughly 90,000-square-foot White House ballroom, arguing the project is now an integrated, hardened national-security complex rather than merely an event space. Chief Justice John Roberts set a noon deadline today, August 18, for the National Trust for Historic Preservation to respond, with the D.C. Circuit's 2-1 injunction otherwise taking effect August 21. Solicitor General John Sauer contends the roughly $400 million project is privately funded and 'on time' and 'under budget,' while critics note the administration has not addressed a separate $1 billion funding request to Congress for White House security upgrades.","source":"PBS NewsHour","url":"https://www.pbs.org/newshour/politics/trump-asks-supreme-court-to-let-white-house-resume-ballroom-construction-during-appeal"},{"headline":"Sixth Circuit Rebuffs DOJ Bid for Michigan's Full Voter Rolls","body":"The Sixth Circuit Court of Appeals on Friday declined to rehear en banc a case over the Justice Department's demand for Michigan's unredacted voter registration list, leaving intact a June ruling that the Civil Rights Act of 1960 does not entitle DOJ to the data. Judge Murphy, concurring in the denial, suggested the panel's reasoning rested on fixable procedural defects that a revised demand letter could cure, leaving the door open for the administration to try again. The ruling is one of several ongoing skirmishes between DOJ and blue states over voter-data access this cycle.","source":"Executive Functions Roundup","url":"https://www.execfunctions.org/p/executive-functions-roundup1"},{"headline":"Oil Spike and Iran Deadline Rattle Wall Street","body":"U.S. stocks fell Monday as a 60-day window for a U.S.-Iran deal expired without resolution, sending Brent crude up 2.65% to settle near $90.87 a barrel and WTI up 2.5% to $84.50 after President Trump said he would not accept the kind of deal Tehran was offering. Treasury yields climbed alongside oil prices, compounding investor unease already stoked by a weaker-than-expected July jobs and retail-sales report. Trump separately floated declaring the Strait of Hormuz U.S. territory, while Energy Secretary Chris Wright said Washington is 'playing the long game' with no imminent plans to de-escalate.","source":"NBC News","url":"https://www.nbcnews.com/business/economy/oil-jumps-trump-no-iran-ceasefire-rcna592978"},{"headline":"Soft Inflation Data Cuts Odds of a September Fed Hike","body":"Fresh figures showing core CPI rising 0.2% in July, with the year-over-year rate easing to 2.5%, and core PPI's annual rate dropping sharply to 4.2% from 4.7%, pushed traders to pare back bets on a September rate move. Combined with weaker July retail sales, the data lowered the implied probability of a Fed rate hike at the September meeting to roughly 30-33%, down from as high as 50-60% just weeks earlier. The shift reflects growing uncertainty on the FOMC, which split 9-3 in July to hold rates at 3.5%-3.75% amid inflationary pressure from the Iran conflict's effect on energy markets.","source":"Lido Advisors","url":"https://www.lidoadvisors.com/perspectives/economic-market-outlooks/market-update-08-17-2026/"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Finalizes Record Defense Budget Push After White Paper Warns of China Reach","body":"Japan's cabinet-approved 2026 Defense White Paper, released August 4, has set the stage for a record roughly $56 billion (JPY8.9 trillion) budget request due at the end of August, with spending already crossing 9 trillion yen this fiscal year including US realignment costs. The paper frames China as an unprecedented strategic challenge and highlights Tokyo's push into drones, AI-enabled targeting, and long-range strike missiles as it accelerates revisions to its three core security documents before year's end. Tokyo also test-fired a Tomahawk cruise missile in late July capable of reaching mainland China, underscoring the shift from a purely defensive posture toward standoff strike capability.","source":"Defense News / USNI News","url":"https://www.defensenews.com/global/asia-pacific/2026/08/10/japans-2026-defense-white-paper-highlights-new-era-of-crisis-in-indo-pacific/"},{"headline":"Manila Presses UN Seabed Claim, Keeps Up Patrols After String of Scarborough Clashes","body":"The Philippines formally deposited its official nautical chart on Scarborough Shoal (Bajo de Masinloc) with the UN Secretariat on July 31, a legal move to lock in its extended continental shelf claims after three separate confrontations with Chinese vessels in a single week in July. Manila has continued patrols and joint drills with US and Japanese forces near the shoal despite Beijing's protests, while diplomatic talks on an ASEAN Code of Conduct remain stalled even under the Philippines' own 2026 ASEAN chairmanship. The dispute has become the most consistent flashpoint testing US extended-deterrence commitments in the region this year.","source":"AEI / CFR Global Conflict Tracker","url":"https://www.aei.org/commentary/china-taiwan-update-august-7-2026/"},{"headline":"Quad Nations Deepen Maritime Surveillance Network Across Indo-Pacific","body":"Australia, India, Japan and the United States are expanding the Indo-Pacific Maritime Surveillance Collaboration, a framework launched at the Quad foreign ministers' meeting in New Delhi to build a shared maritime picture stretching across the Indo-Pacific. Indian officials have publicly insisted the effort is not militarization but a transparency-focused, technology-driven initiative to track illegal fishing, dark-fleet activity and gray-zone incursions. The push comes as all four Quad members separately increase bilateral naval patrols and information-sharing arrangements with Southeast Asian partners wary of Chinese coast guard and militia activity.","source":"Wikipedia / Quad Foreign Ministers factsheet","url":"https://en.wikipedia.org/wiki/Indo-Pacific_Maritime_Surveillance_Collaboration"}],"pacingThreat":[{"headline":"PLA Air Force Unveils AI System for Planning Mass Strike Operations","body":"A CCTV documentary marking the PLA's 99th anniversary revealed that the PLA Air Force is now using an artificial intelligence system to draft plans for large-scale strike operations, reportedly prioritizing targets from a pool of hundreds and coordinating dozens of formations across more than 100 tactical units. The system has already been used in multiple actual missions, according to the documentary, and its unveiling closely follows Xi Jinping's late-July directive ordering the military to accelerate the use of unmanned and intelligent technologies. The disclosure is one of the clearest open-source signals yet that Beijing is operationalizing AI-driven command-and-control rather than treating it as experimental.","source":"The Diplomat","url":"https://thediplomat.com/2026/08/chinas-military-is-now-using-ai-to-plan-strike-operations/"},{"headline":"PLA Southern Theater Command Runs Drills Around Scarborough Shoal After Philippine UN Filing","body":"China's Ministry of National Defense confirmed that the PLA Southern Theater Command conducted joint exercises in the waters and airspace around Scarborough Shoal (Huangyan Dao) directly in response to the Philippines' UN chart submission, with the China Coast Guard simultaneously running law-enforcement training in the same waters. Beijing's spokesperson also used the briefing to blast Japan's defense buildup as reckless remilitarization, signaling Beijing is running parallel pressure campaigns against Manila and Tokyo. The drills mark a continuation of the tit-for-tat pattern that has defined the South China Sea since the string of collisions and confrontations in July.","source":"China Ministry of National Defense / GlobalSecurity.org","url":"https://www.globalsecurity.org/wmd/library/news/china/2026/08/china-260807-prc-mndb01.htm"},{"headline":"Taiwan Runs Largest-Ever Han Kuang Drills Simulating Ten-Day Invasion Response","body":"Taiwan conducted its largest annual military exercises to date, simulating a ten-day defense against a Chinese invasion attempt and incorporating chemical-attack scenarios, expanded live-fire training, and new procedures modeled on US military doctrine. The drills come as Taiwan has also seen a notable rebound in military recruitment and retention after decades of decline, a trend Taipei attributes to pay raises and improved service conditions even as Beijing dismisses it as futile resistance to unification. Taiwan is separately awaiting delayed deliveries of US-made F-16 Block 70 jets, Abrams tanks and MQ-9B drones, exposing a persistent gap between its defense ambitions and procurement timelines.","source":"Al Jazeera","url":"https://www.aljazeera.com/video/newsfeed/2026/8/10/taiwan-holds-military-drills-to-prepare-for-invasion-by-china"}]},"europe":{"ukraineRussia":[{"headline":"Ukrainian Intelligence: Russia Lost Over 40,000 Troops in July Alone","body":"Ukraine's deputy military intelligence chief said Monday that Russia suffered more than 40,000 troops killed or wounded in July, part of a grinding attrition pattern that continued into the new week with another 1,210 personnel and 55 artillery systems lost on August 18 alone. The disclosure came alongside intelligence assessments of the Kremlin's next moves on the battlefield, as Ukrainian special forces reported retaking the settlement of Andriivka-Klevtsove with roughly 30 Russian troops surrendering. Kyiv is using the casualty figures to argue Moscow's offensive capacity is eroding even as fighting grinds on.","source":"RBC-Ukraine","url":"https://newsukraine.rbc.ua/war-in-ukraine"},{"headline":"Russia Pounds Ukraine With 147-Drone Barrage, Kills 10 in Kharkiv Village","body":"Russia launched roughly 147 drones at Ukraine overnight into August 18, triggering fires in Brovary near Kyiv and a separate strike that killed 10 people in a Kharkiv region village. The barrage came days after Ukrainian drone strikes hit a Russian 'strategic' industrial plant and severely disrupted Russian grain export infrastructure, underscoring how both sides are increasingly targeting economic and energy infrastructure deep behind the front lines. Ukrainian air defenses intercepted a significant share of the incoming drones, but the mounting strikes on both sides signal no near-term letup despite ongoing talk of a negotiated settlement.","source":"RBC-Ukraine","url":"https://newsukraine.rbc.ua/war-in-ukraine"}],"europe":[{"headline":"NATO Rattled by Wave of Airspace Violations and Drone Incidents Near Russia","body":"NATO's North Atlantic Council convened on August 12 to condemn a spate of airspace violations over Poland and Romania alongside a string of drone incidents across the alliance's eastern flank, expressing full solidarity with the affected allies. The alarm follows NATO jets shooting down a stray drone over Latvia on August 13, Poland's disclosure of a foiled Russian plot to kill a Ukrainian-American citizen, and officials warning that Moscow may be preparing sabotage operations elsewhere in Europe. The incidents add to a summer marked by explosive-drone scares at German airports and a suspected false-flag drone threat flagged by Lithuania, all feeding European anxiety about Russian hybrid warfare as US troop levels in Europe face cuts.","source":"Bloomberg","url":"https://www.bloomberg.com/latest/nato"},{"headline":"Spain's Migration Emergency Exposes Fractures in EU Border Strategy","body":"The aftermath of the Ceuta migrant surge is still reverberating in Brussels, with new Frontex data released August 14 showing irregular EU border crossings actually fell 37 percent in the first seven months of 2026 even as arrivals via the Western Mediterranean route into Spain rose by the same margin. Spanish officials, led by Ceuta's top official, have pressed for EU solidarity after an estimated 60,000 migrants crossed into the enclave of just 84,000 residents in a matter of days, with dozens of confirmed deaths. The mismatch between the bloc-wide decline and Spain's isolated crisis has fueled criticism that other member states are leaving Madrid to manage the fallout alone, reigniting long-running tensions over EU migration-sharing policy.","source":"EUNews / Al Jazeera","url":"https://www.eunews.it/en/2026/08/14/in-2026-irregular-arrivals-fall-and-there-is-no-migrant-crisis-frontex-exposes-the-eu-countries-false-claims/"}]},"middleEast":[{"headline":"US Holds Direct Talks With Hamas as Gaza Roadmap Remains Stalled","body":"US envoy Jared Kushner has been shuttling between Hamas leaders in Egypt and Israeli Prime Minister Benjamin Netanyahu to salvage President Trump's 15-point Gaza roadmap, which Israel has so far rejected. The Times of Israel reported August 18 that Washington is now engaging Hamas directly, a shift its bureau chief described as becoming 'the new normal' in the diplomacy, roughly two months after fighting with Iran wound down. Israeli hardliners, including minister Itamar Ben Gvir, are publicly pushing for renewed lethal operations in Gaza, complicating the already fragile push toward a disarmament and reconstruction framework.","source":"Times of Israel / Al Jazeera","url":"https://www.timesofisrael.com/"},{"headline":"Strait of Hormuz Traffic Stays Crippled as Iran-Oman Talks Stall","body":"Shipping through the Strait of Hormuz remains a fraction of pre-war levels, with maritime intelligence firm Windward counting only about 13 vessels transiting on a recent Thursday, as Iran and Oman have made no breakthrough on a framework to guarantee safe passage. Analysts say the real volume is likely obscured because more tankers are switching off trackers and using ship-to-ship transfers to disguise oil reaching global markets, while sporadic Iranian drone attacks continue to deter operators. The standoff has persisted since fighting resumed in July and undid a June ceasefire that had briefly reopened the waterway, through which roughly a fifth of the world's oil normally flows.","source":"CNN","url":"https://www.cnn.com/2026/08/16/world/live-news/iran-war-trump"},{"headline":"Houthis Escalate Toward Red Sea Coast Offensive, Widening Attacks on Saudi Arabia","body":"Iran-backed Houthi rebels appear to be massing forces for a fresh offensive aimed at seizing more of Yemen's Red Sea coastline, according to analysts cited by CNN, after the group struck Saudi Arabia's territory this month for the first time since a four-year de facto ceasefire. The militia's missile strikes shut down Yemen's Mokha port and killed six people aboard a cargo ship in the Bab el-Mandeb Strait in one of the deadliest single attacks on Red Sea shipping in over a year. The renewed fighting between the Houthis and Yemen's internationally recognized government is compounding instability already caused by the parallel Strait of Hormuz standoff, threatening to further disrupt global shipping lanes.","source":"CNN","url":"https://www.cnn.com/2026/08/15/world/live-news/iran-war-trump"}],"techAI":{"aiCompetition":[{"headline":"SpaceX Swallows Cursor in $60B Deal as AI Coding-Agent Race Consolidates","body":"SpaceX has completed a $60 billion acquisition of AI coding assistant startup Cursor, folding the tool into its SpaceXAI division alongside the company's 'Grok Bot' enterprise offering. The move comes as rival coding-agent startup Cognition is reportedly in talks to raise fresh funding at a $40 billion valuation, with its Devin agent nearing $1 billion in annualized revenue. The back-to-back deals signal that AI-assisted software development has become one of the most fiercely contested and capital-intensive fronts in the broader AI race, with implications for the defense-adjacent software-supply chain given SpaceX's national-security ties.","source":"AI Agents Directory","url":"https://aiagentsdirectory.com/news/ai-agents-news-brief-august-17-2026"},{"headline":"OpenAI Eyes $1 Trillion IPO as Nvidia's Financing Ties Draw Scrutiny","body":"OpenAI is reportedly preparing for a stock-market debut valuing the company above $1 trillion, possibly as early as September, even as it continues to lose roughly $14 billion annually — a divergence from rival Anthropic, which just posted its first-ever profit. Nvidia is separately said to be preparing to back roughly $100 billion of OpenAI's financing needs, deepening a web of circular relationships linking chipmakers, labs, cloud providers and lenders that investors are watching closely. Analysts note Nvidia is increasingly functioning less like a pure chip supplier and more like an ecosystem financier propping up the infrastructure buildout that ultimately drives its own hardware demand.","source":"Tech Startups","url":"https://techstartups.com/2026/08/17/top-tech-news-today-august-17-2026-ge-microsoft-nvidia-open-stripe-unitree-more/"}],"cyberEmerging":[{"headline":"France's Tax Authority Breached, Data on 678,000 Taxpayers Stolen","body":"France's Ministry of the Economy and Finance disclosed that an attacker breached the General Directorate of Public Finances (DGFiP) and exfiltrated income and tax records belonging to 678,000 individuals. The disclosure, reported August 17, adds to a wave of European government-sector intrusions this month, including a ransomware hit on Colombia's Ministry of Justice and a breach at Poland's largest healthcare platform affecting nearly 19 million citizens. The incident underscores mounting pressure on Western government IT systems even as agencies race to adopt AI-driven defenses.","source":"BleepingComputer","url":"https://www.bleepingcomputer.com/news/security/"},{"headline":"North Korea's Kimsuky Group Weaponizes AI to Accelerate Espionage Operations","body":"Security researchers reported this week that North Korea-linked hacking group Kimsuky has begun integrating AI tools directly into its attack operations, part of a broader trend of state and criminal actors using generative AI to speed up malware development and tradecraft. Separately, researchers flagged that China-linked group Mustang Panda (also known as HoneyMyte) upgraded its CoolClient backdoor with a signed kernel driver to evade detection during espionage against government targets. The developments highlight how frontier AI capabilities are increasingly being turned into offensive tools by nation-state actors, raising the stakes for the Trump administration's push to use AI defensively against similar threats.","source":"Security Affairs","url":"https://securityaffairs.com/"}]},"cities":{"lasVegas":[{"headline":"West valley shopping center red-tagged after partial collapse injures three","body":"A shopping center in the west Las Vegas Valley was declared structurally unsafe after part of the building collapsed, injuring three people. Clark County building officials red-tagged the property while engineers assess the extent of the damage. The center remains closed to tenants and customers pending further inspection.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Impaired driver near the Strip kills one in two-vehicle crash","body":"Metro police say a Las Vegas man who was over the legal blood-alcohol limit, driving a car that smelled of marijuana, slammed into two vehicles near the Strip, killing one of the other drivers. The suspect was taken into custody at the scene as detectives from the Collision Investigation Section continue building the case. It's the latest in a string of impaired-driving fatalities that have drawn renewed scrutiny of DUI enforcement along the resort corridor.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Tupac Shakur murder trial opens with testimony from retired Metro officer","body":"The long-awaited trial of the man accused of orchestrating the 1996 killing of rapper Tupac Shakur got underway this week, with a former Metro officer who spoke with Shakur after the shooting taking the stand as the first witness. The testimony offers jurors a firsthand account from the chaotic aftermath of the Strip-area drive-by shooting nearly three decades ago. The case has drawn national media attention back to Las Vegas as prosecutors lay out their account of the long-cold case.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Nellis rebrand to 'Air Force Warfare Center' still stirring questions locally","body":"Confusion has lingered in the Las Vegas area since Nellis Air Force Base's public-facing communications shifted to identify as the U.S. Air Force Warfare Center, the higher headquarters overseeing the base's many wings and squadrons. Base officials insist the installation's name isn't changing and describe it as a branding update meant to better reflect the command structure that includes units operating beyond Nellis itself, including ranges tied to the Nevada Test and Training Range. Locals and Airmen alike have kept asking base public affairs for clarity on what the rebrand means for the historic Nellis name.","source":"KTNV","url":"https://www.ktnv.com/news/nellis-air-force-base-now-publicly-identifying-as-us-air-force-warfare-center"}]},"feelGood":[{"headline":"9-year-old hands dad his life savings after lightning destroys family truck","body":"After a lightning strike obliterated Casey Pettus's truck on a Utah highway, leaving him shaken but unharmed, his 9-year-old son quietly offered up his entire savings to help the family recover. The small gesture turned a terrifying roadside moment into a story of a child's instinctive generosity toward his father. Pettus has since shared the moment publicly, saying it reminded him how quickly love shows up in a crisis.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Teen lifeguard's dramatic rescue saves 10-year-old boy off Santa Cruz coast","body":"A quick-thinking teenage lifeguard pulled a 10-year-old boy from dangerous surf off Santa Cruz, California, after the child was swept beyond his depth and, in his own words, believed he 'was going to die.' The boy's father has since spoken publicly about the rescue, crediting the lifeguard's fast reaction for saving his son's life. The family says they're forever grateful to a stranger whose training turned a beach outing from tragedy into a rescue story.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"A stranger's unexpected 'yes' turns into a lasting friendship","body":"What started as an ordinary request from a stranger turned into an unlikely bond between two women, Dara and Abigail, after one said yes to helping the other through a rough day. Their story, highlighted by Sunny Skyz, is being shared as an example of how a single small act of kindness can ripple into real connection. Neither woman expected the encounter to turn into an enduring friendship.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1587","event":"Virginia Dare became the first child born in the Americas to English parents, on Roanoke Island."},{"year":"1868","event":"French astronomer Pierre Janssen discovered helium while observing a solar eclipse in India."},{"year":"1920","event":"The 19th Amendment to the US Constitution, granting women the right to vote, was ratified."},{"year":"1963","event":"James Meredith became the first African American to graduate from the University of Mississippi."}]},"topPicks":[{"headline":"Oil Spike and Iran Deadline Rattle Wall Street","teaser":"Rising crude prices and a looming Iran deadline are jolting global markets and raising fears of broader instability."},{"headline":"NATO Rattled by Wave of Airspace Violations and Drone Incidents Near Russia","teaser":"A surge in airspace breaches and drone sightings near Russian borders is heightening alarm across NATO's eastern flank."},{"headline":"OpenAI Eyes $1 Trillion IPO as Nvidia's Financing Ties Draw Scrutiny","teaser":"A potential trillion-dollar OpenAI listing spotlights deepening financial links with Nvidia and growing regulatory attention."}]},"navDates":[{"key":"2026-08-20","label":"Aug 20","href":"/","isNewest":true},{"key":"2026-08-19","label":"Aug 19","href":"/archive/2026-08-19.html","isNewest":false},{"key":"2026-08-18","label":"Aug 18","href":"/archive/2026-08-18.html","isNewest":false},{"key":"2026-08-17","label":"Aug 17","href":"/archive/2026-08-17.html","isNewest":false},{"key":"2026-08-16","label":"Aug 16","href":"/archive/2026-08-16.html","isNewest":false},{"key":"2026-08-15","label":"Aug 15","href":"/archive/2026-08-15.html","isNewest":false},{"key":"2026-08-14","label":"Aug 14","href":"/archive/2026-08-14.html","isNewest":false}],"currentKey":"2026-08-18","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-18.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
