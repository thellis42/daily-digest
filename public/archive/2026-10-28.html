<script>
const STATE = {"digest":{"date":"Wednesday, October 28, 2026","generatedAt":"Wed, Oct 28, 9:01 AM PDT","breaking":{"headline":"US Forces Posture for Possible Iran Strikes as Trump Weighs Post-Election Decision","body":"US officials say forces already stationed in the Middle East could launch major new operations against Iran within 96 hours of receiving a presidential order, with sufficient troops and equipment already in place for a short, intense campaign. The Pentagon is moving a Patriot air and missile defense battery from Texas to Israel while repositioning bombers, fighters and naval assets, and an additional carrier strike group and a Marine expeditionary unit are expected to join roughly 20 US warships already in the region next month. Gulf Arab states have reportedly been warned to prepare for a potential post-midterm strike window. President Trump has not issued a final order but is said to be leaning toward hitting Iranian nuclear and infrastructure sites.","source":"CNN","url":"https://www.cnn.com/2026/10/26/politics/us-iran-strike-plans-trump"},"tabs":{"defense":{"defense":[{"headline":"Navy Awards Applied Intuition Contract for AI-Powered Destroyer Sensor Fusion","body":"The US Navy has awarded Applied Intuition a $25 million production contract to install its Intelligent Perception System, an AI vision and sensor-fusion tool, starting on five Arleigh Burke-class destroyers. The system fuses shipboard cameras, infrared sensors and navigation feeds to automatically detect, classify and track nearby vessels, alerting bridge crews when a contact is on a dangerous course. Built on an earlier data-collection prototype, the program is also designed to send operational data ashore to retrain the underlying AI models before pushing updates back to the fleet, with the Navy eyeing eventual expansion across both crewed and uncrewed ships.","source":"The Defense Post","url":"https://thedefensepost.com/2026/10/27/us-navy-ai-destroyers/amp/"},{"headline":"US Bars Chinese-Made BYD Vehicles From Okinawa Base","body":"The US military has banned BYD-manufactured vehicles from a base it shares with Japanese forces on Okinawa, citing security risks. The move fits a broader Pentagon pattern of restricting Chinese-manufactured connected technology, from vehicles to telecom gear, at sensitive overseas installations amid heightened friction with Beijing in the Indo-Pacific. Okinawa hosts some of the densest concentrations of US forces in the region, making base security policy there a closely watched signal of how Washington is hardening its posture near Taiwan and the East China Sea.","source":"The Defense Post","url":"https://thedefensepost.com/"},{"headline":"Fairbanks Morse Defense Expands Submarine Component Line With AUKUS Backing","body":"Fairbanks Morse Defense is building a new submarine component production facility supported by both US Navy and AUKUS investment, part of the broader push to grow the industrial base feeding Virginia-class and future AUKUS submarine programs. The expansion underscores how the trilateral US-UK-Australia pact is translating into concrete domestic manufacturing capacity rather than just policy commitments. It also reflects continued bipartisan urgency in Washington to clear submarine production bottlenecks that have worried allied planners watching China's naval buildup.","source":"Inside Defense","url":"https://insidedefense.com/insider/insider-daily-digest-october-27-2026"}],"acquisitions":[{"headline":"Pentagon, Lockheed Agree to 10-Year Framework for Up to 850 F-35s","body":"The Pentagon and Lockheed Martin have unveiled a new framework agreement meant to underpin F-35 Joint Strike Fighter production and sustainment over the next decade, tentatively guaranteeing 850 jets for the US military across that span. The deal gives Lockheed a long-range production horizon as it continues to pitch sixth-generation enhancements for both the F-35 and F-22, a plan CEO Jim Taiclet has reaffirmed is still active more than a year after it was first floated. The agreement is designed to stabilize the F-35 supply chain against the kind of near-term order swings that have periodically disrupted the program.","source":"Inside Defense","url":"https://insidedefense.com/defense-business-briefing/defense-business-briefing-october-27-2026"},{"headline":"Boeing's Defense Unit Banks on F-47 and F/A-XX Wins for Turnaround","body":"Boeing's Defense, Space and Security division is now tracking toward rapid growth in the coming years after landing two separate multibillion-dollar contracts tied to the Air Force's F-47 and the Navy's F/A-XX sixth-generation fighter programs. The wins mark a turnaround for a unit that had struggled with cost overruns and program delays for years. Securing both the Air Force and Navy's next-generation fighter work gives Boeing a central role in the US fighter industrial base just as Lockheed locks in its own long-term F-35 production framework.","source":"Inside Defense","url":"https://insidedefense.com/insider/insider-daily-digest-october-27-2026"}]},"us":[{"headline":"Federal Reserve holds rates steady as inflation climbs to 3.7%","body":"The Federal Reserve kept its benchmark rate unchanged at 3.75%-4.00% on October 28, holding off after a quarter-point hike in September that had been its first increase since 2023. September inflation accelerated to 3.7% year-over-year even as job growth slowed sharply, with nonfarm payrolls rising by just 29,000, leaving Chair Kevin Warsh facing conflicting signals on hiring versus prices. A Reuters survey found that nearly all polled economists expect the Fed to resume tightening with a hike in December.","source":"CNBC / Trading Economics","url":"https://www.cnbc.com/2026/10/26/fed-decision-expectations-october-meeting.html"},{"headline":"Supreme Court leaves deportation-pause restriction intact in Texas-engineered settlement","body":"The Supreme Court on October 27 declined to block a lower-court order that strips immigration judges of their ability to temporarily pause deportation cases under a Biden-era 'administrative closure' rule, issuing a one-line order with no noted dissents. The restriction stems from an unusual arrangement in which Texas sued the Justice Department, which immediately agreed with the state, and a federal judge approved the deal the same day it was filed. Democratic-led cities and immigrant-legal-aid groups argue the maneuver improperly bypassed normal federal rulemaking, but the justices' order leaves thousands of pending cases affected without resolving that underlying legality question.","source":"Texas Tribune","url":"https://www.texastribune.org/2026/10/27/immigration-court-texas-ice-deportation-supreme-court-ruling/"},{"headline":"Pentagon tally puts Iran conflict costs at $47 billion","body":"A Defense Department document reviewed by the Washington Post shows the military campaign against Iran has run up an estimated $47 billion bill, including roughly $29 billion in expended munitions and $6 billion in destroyed weapons systems. The figures, disclosed as lawmakers weigh further defense appropriations ahead of the midterms, underscore the fiscal strain of sustained Middle East operations even as the administration touts energy and trade wins elsewhere. The cost estimate is likely to fuel debate in Congress over emergency war funding requests in the coming weeks.","source":"The Washington Post","url":"https://www.washingtonpost.com/politics/"},{"headline":"DOJ's preemptive Alaska Senate lawsuit draws fire as election-interference test case","body":"Attorney General Todd Blanche is defending a Justice Department lawsuit, filed at President Trump's direction, that seeks to block Alaska from certifying its Senate race if Republican incumbent Dan Sullivan loses to Democrat Mary Peltola. The suit cites possible voter confusion from a second ballot candidate named Daniel J. Sullivan and asks a federal judge to delay certification pending an investigation, a request critics call an unprecedented attempt to nullify election results after the fact. Blanche denied on CNN that the move lays groundwork for Trump to contest a broader midterm loss, but the case has become a flashpoint six days before the November 3 vote that will decide Senate control.","source":"NPR","url":"https://www.npr.org/2026/10/25/nx-s1-6016212/blanche-defends-doj-lawsuit-blocking-alaska-senate-results-if-republican-loses"}],"pacific":{"pacificCommand":[{"headline":"Japan Pitches 'Denial Defense' Buildup to Hegseth in Cebu","body":"On the sidelines of the ASEAN defense ministers' summit in Cebu, Philippines, Japanese Defense Minister Shinjiro Koizumi met U.S. Defense Secretary Pete Hegseth on October 28 and laid out plans to build 'denial defense capabilities' meant to deter and, if necessary, repel an invasion of Japan. The two sides agreed to establish a final assembly and inspection facility in Japan for advanced medium-range air-to-air missiles and pledged more realistic joint live-fire training. They also agreed to deepen cooperation against a wave of near-daily cyberattacks that have breached personal data in and outside Japan, as Tokyo's new 2026 Defense White Paper, released October 26, frames the global security environment as the gravest since World War II.","source":"The Japan Times / Jiji Press","url":"https://www.japantimes.co.jp/news/2026/10/28/japan/us-japan-koizumi-hegseth-asean/"},{"headline":"Seoul Pushes Washington on OPCON Timeline Amid Trust Flap","body":"South Korean Defense Minister Kang Shin-chul held his first in-person talks with Hegseth on October 27 in Cebu, with Seoul pressing to set a firm target year, before 2030, for the long-delayed transfer of wartime operational control (OPCON) of South Korean forces from the U.S.-led Combined Forces Command. The meeting came just a day after Kang drew domestic controversy for seeming to question whether U.S. forces could be relied upon in a war with North Korea, remarks his ministry quickly clarified as an argument for mutual trust rather than doubt. The two sides agreed to hold a full defense ministerial in December and the annual Security Consultative Meeting early next year to hash out OPCON and alliance modernization details.","source":"Korea JoongAng Daily / SBS News","url":"https://www.koreajoongangdaily.com/korea/defense"},{"headline":"India Arms Philippines with BrahMos as Manila-Beijing Friction Grows","body":"New Delhi is deepening defense ties with Manila, having supplied BrahMos anti-ship missiles that Philippine officials call a genuine deterrent as tensions with China escalate in the South China Sea, with India now offering extended-range 400-km variants that could reach the Spratlys from Palawan. India also joined this year's expanded Balikatan exercise as an observer while Filipino marines rehearsed simulated BrahMos strikes, and has invited Manila into its Information Fusion Centre for the Indian Ocean Region for shared maritime domain awareness. India is additionally offering Akash air-defense systems, Tejas fighters, helicopters and naval vessels, reinforcing the same maritime-denial network Washington is building with regional partners.","source":"Asia Times","url":"https://asiatimes.com/2026/10/deeper-india-philippines-ties-boost-us-aims-in-south-china-sea/"}],"pacingThreat":[{"headline":"Liaoning Carrier Group Probes Deep Into Philippine Archipelago","body":"An ISW-AEI tracking report published October 27 found that the PLAN carrier Liaoning and its escorts, including a Type 055 cruiser, sailed near the Basilan Strait inside the Philippine archipelago on October 22, an unusually deep penetration meant to pressure Manila over its South China Sea posture. Analysts linked the move to an October 14 PLA amphibious-warfare drill assessed as a rehearsal for seizing a Philippine-held maritime feature, alongside Ambassador Jing Quan's October 15 remark that Beijing could 'easily win' a war with the Philippines. The report warns that securing uncontested control of the South China Sea would give the PLA a launch point to breach the first island chain in any future Taiwan contingency.","source":"Institute for the Study of War / American Enterprise Institute","url":"https://www.aei.org/commentary/china-taiwan-update-october-27-2026/"},{"headline":"PLA Keeps Up Near-Daily Median Line Incursions Over Taiwan Strait","body":"An open-source tracker published October 27 counted 47 PLA aircraft sorties near Taiwan for the week ending October 17, with 36 crossing the Taiwan Strait median line, including a 15-sortie surge on October 14 involving J-16, J-11, Su-30 and JH-7 fighters plus Y-8 electronic-warfare planes. The same tracking noted PLAN surface units shadowing the U.S.-Japan Keen Sword 2026 exercise that began October 19, with replenishment ships attached signaling an extended deployment. Taiwan's defense ministry has separately said it is on heightened alert for a seasonal surge in large-scale PLA drills.","source":"PLA Tracker (Substack)","url":"https://platracker.substack.com/p/tracking-the-pla-17-oct-2026"},{"headline":"Taipei Moves to Choke Off Beijing's Election Interference","body":"Taiwan's Interior Minister Liu Shyh-fang told the legislature on October 27 that police will intensify efforts to block Chinese-backed election interference, gangs and local collaborators ahead of the November 28 local elections, while pushing new legislation to act against covert threats to public safety. The push comes as a fresh poll found 73.5% of Taiwanese view the Chinese Communist Party unfavorably, a figure essentially unchanged from September but one that includes more than half of opposition KMT supporters. Separately, officials warned Beijing is working to sow doubt about U.S. commitment to Taiwan ahead of a possible Trump-Xi meeting, part of what Taipei calls an intensifying cognitive-warfare campaign timed to the election.","source":"Taipei Times / Taiwan News","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/10/28/2003866744"}]},"europe":{"ukraineRussia":[{"headline":"Russian Ballistic Missiles Tear Through Kyiv, Hitting Bridge, University and Medical Centers","body":"A Russian ballistic missile strike on October 27 tore a large hole in Kyiv's Southern Bridge, shutting it to both road and rail traffic, while separate strikes hit a university campus and medical facilities in the capital. The attack came after Russia had launched more than 100 ballistic missiles at Kyiv over the preceding two weeks, and left seven regions including Kharkiv, Zaporizhzhia and Chernihiv without power. The UN has separately labeled Russia's campaign against Ukraine's energy grid a war crime.","source":"Kyiv Independent / Forbes","url":"https://kyivindependent.com/"},{"headline":"Limited Ceasefire Holds Around Oleshky as Putin Tells Europe Donbas Goal Unchanged","body":"A localized ceasefire brokered by First Lady Melania Trump took effect around Russian-occupied Oleshky on October 27 to allow food aid deliveries, with Ukraine's human rights ombudsman reporting it was being observed and later saying coverage had expanded across the Kherson region. Separately, a broader limited truce began at 3 a.m. Kyiv time on October 27, running until November 1, which a Ukrainian lawmaker called the largest de-escalation since 2022. Despite the diplomatic opening, Putin told Finnish and Norwegian leaders by phone that Russia does not intend to abandon its goal of capturing all of Donbas, offering little indication of a path to a full ceasefire.","source":"CFR / Reuters","url":"https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"}],"europe":[{"headline":"Europe's 'Big Five' Defense Ministers Pledge to Build Independent Capability Within NATO","body":"Defense ministers from France, Germany, Italy, Poland and the UK met in Paris on October 26 as the 'European Group of Five,' with NATO Deputy Secretary General Radmila Shekerinska attending to discuss continued support for Ukraine, European security and the Middle East. The group committed to developing European defense capabilities inside the NATO framework while pledging ongoing backing for Kyiv, a move framed in European media as the continent beginning to take more ownership of its own security posture. The meeting coincided with NATO's Resolute Reforger 2026 exercise launching in Latvia on October 26, involving roughly 3,000 troops and 1,000 pieces of equipment through November 8.","source":"NATO / UNN","url":"https://www.nato.int/en"},{"headline":"Brussels Proposes 30,000-Strong Frontex Force With New Deportation Powers","body":"The European Commission on October 27 unveiled a plan to roughly double Frontex's staff and add a 17,000-officer reserve, creating a 30,000-strong border force with a central role in deportations and a new quick-reaction unit for border emergencies. The proposal would let Frontex organize returns between non-EU countries and would add a unit monitoring social media for border-related risks, though Parliament and the Council must still sign off. The push follows months of EU infighting after the Ceuta migrant crisis exposed gaps in border controls, even as official data show irregular crossings have fallen sharply across most of the bloc in 2026.","source":"EU Insider","url":"https://www.euinsider.eu/news/frontex-30000-officers-returns-commission-proposal-2026"}]},"middleEast":[{"headline":"Israeli Election Leaves Netanyahu and Rival Eisenkot Without a Governing Majority","body":"Israel's October 27 parliamentary election produced no outright winner, with Prime Minister Benjamin Netanyahu's religious-right bloc projected at 53 seats and challenger Gadi Eisenkot's opposition bloc at 48, both short of the 61-seat threshold after roughly 93% of ballots were counted. Arab parties nearly doubled their combined strength to a historic 19 seats, positioning them as potential kingmakers, while Netanyahu's bloc fell from 68 seats held previously, a sharp contraction in support. Netanyahu rejected cooperating with Arab parties and thanked President Trump for backing Israel in the war with Iran, as both sides now face a difficult coalition-building process.","source":"Bloomberg / CNN","url":"https://www.bloomberg.com/news/articles/2026-10-28/israeli-vote-too-close-to-call-between-netanyahu-and-eisenkot"},{"headline":"Saudi Arabia Intercepts Houthi Missiles Near Riyadh as Hormuz Tanker Incident Adds to Tensions","body":"Saudi Arabia said it shot down two ballistic missiles fired toward Riyadh by Yemen's Houthi militia on October 27, while a separate Saudi-led coalition intercepted additional Houthi drones and missiles aimed at the kingdom's Eastern Region. The same day, Iran reported an oil tanker caught fire after striking naval mines in the Strait of Hormuz, underscoring continued instability in the critical waterway. The incidents come as Crown Prince Mohammed bin Salman reviews talks between Iran and members of the Mecca Common Defence Agreement aimed at regional de-escalation.","source":"Gulf News","url":"https://gulfnews.com/uae/middle-east-conflict-what-uae-residents-need-to-know-tonight-october-27-2026-1.500725816"},{"headline":"Jordan Moves to Contain Fallout From Deadly Strikes in Southern Syria","body":"Jordan and Syria are working to de-escalate tensions through a joint security committee after a reported Jordanian airstrike killed civilians, including children, in the town of Al-Mismiyah in Syria's Daraa province on October 27. Damascus has opened an investigation and disputed Amman's characterization of the strikes as coordinated, while mourners held funerals for four members of one family killed in the attack. The episode follows a recent terror attack on a Jordanian church that Greek Orthodox Patriarch Theophilos III attributed to a small radical faction, adding to a tense period in Jordanian-Syrian relations.","source":"Jerusalem Post","url":"https://www.jpost.com/middle-east"}],"techAI":{"aiCompetition":[{"headline":"SpaceX Locks in $40 Billion GPU Financing Package with Apollo","body":"SpaceX has arranged a $40 billion GPU financing deal with asset manager Apollo to bankroll the AI infrastructure build-out tied to its Starlink and broader compute ambitions. The deal underscores how even non-traditional AI players are turning to specialized credit structures rather than pure equity to cover the enormous hardware costs of staying competitive in the frontier race. It follows a pattern seen across the sector this year, where firms increasingly treat GPU fleets as financeable assets akin to infrastructure projects.","source":"The Neuron","url":"https://theneuron.ai/digest/everything-that-happened-in-ai-today-tuesday-october-27-2026"},{"headline":"OpenAI Reportedly Moves to Buy Google TPUs, Easing Reliance on Nvidia","body":"The Information reported late October 27 that OpenAI plans to purchase Google's Tensor Processing Units, deepening a relationship that began with TPU rentals via Google Cloud and marking its most concrete step yet toward diversifying away from Nvidia. Neither company has confirmed pricing, chip generation, or delivery timelines, but the move comes as OpenAI also develops a custom Broadcom-designed chip, codenamed Jalapeno, targeted for late 2026. The timing coincides with Alphabet's Wednesday earnings report and broader industry plans by Amazon, Microsoft, and Google to spend as much as $600 billion combined on AI infrastructure this year.","source":"Reuters via Detroit News / Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-10-28/openai-plans-to-buy-google-s-chips-as-part-of-its-ai-build-out"}],"cyberEmerging":[{"headline":"Ex-DOGE Startup Cathedral Breaches Anthropic's Internal Systems in Under 12 Hours","body":"Cathedral, a cybersecurity startup founded by four former DOGE staffers and valued at $1.4 billion after raising $160 million from Andreessen Horowitz and Sequoia, says its AI agents found a path into Anthropic's sales, HR, and IT systems in under 12 hours during an authorized bug-bounty test, reaching meeting transcripts, salary data, and Slack discussions about Claude's advanced models. Anthropic confirmed a 'limited set' of systems was touched but said customer conversations, source code, and model weights were never exposed, and it accused Cathedral of exceeding the program's rules. A White House official who reviewed the draft report reportedly flagged national-security concerns, warning that if a months-old startup could pull this off in half a day, foreign adversaries may not be far behind.","source":"Washington Post via Dealroom/TFTC","url":"https://app.dealroom.co/news/note/ex-doge-startup-cathedral-breached-anthropic-in-under-12-hours-report-says"},{"headline":"Seoul Police Arrest Seven Over South Korea's First Major AI-Assisted Hacking Ring","body":"The Seoul Metropolitan Police Agency announced on October 26 the arrest of a 32-year-old self-taught hacker and six accomplices accused of using generative AI tools and an autonomous penetration-testing system to breach roughly 90 organizations, including hospitals, universities, and corporate affiliates, stealing 8.2 million personal records between September 2025 and October 2026. The ringleader, who had prior penetration-testing experience, allegedly used AI to compromise about 60 of the targets and then extorted 38 victims for a combined 360 million won (roughly $272,000), though only one firm paid a small sum. Authorities are calling it the country's first large-scale AI-enabled hacking case and are still probing whether stolen data surfaced on the dark web.","source":"Korea JoongAng Daily / Decrypt","url":"https://www.koreajoongangdaily.com/korea/seven-arrested-for-using-generative-ai-to-hack-90-organizations/12938493"}]},"cities":{"lasVegas":[{"headline":"Las Vegas Valley logs its deadliest October for pedestrian deaths","body":"Local officials say October has become the deadliest month on record for pedestrian fatalities in the Las Vegas Valley, with 10 deaths so far this month and eight of them occurring after dark. Clark County leaders and the Las Vegas Metropolitan Police Department are launching a 'Dusk2Dawn' safety campaign Wednesday morning at University Center Drive and Flamingo Road, a stretch data from PedSafe Vegas identifies as the valley's deadliest for walkers over the past five years. Overall, 64 pedestrians have died so far in 2026, actually down 8 percent year-over-year, but officials warn the shift to earlier darkness with Daylight Saving Time raises fresh risk.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/2026/10/28/october-becomes-deadliest-month-las-vegas-pedestrian-fatalities/"},{"headline":"Juvenile arrested after shooting injures three at downtown transit hub","body":"Las Vegas police have arrested a juvenile in connection with a shooting that injured three people near the Bonneville Transit Center in downtown Las Vegas. The transit center, a major hub for valley bus riders, had been shut down following the incident and has since reopened. Investigators have not released additional details on a motive or the ages of those wounded.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Horowitz family pledges record $150 million toward new Las Vegas children's hospital","body":"The Horowitz family has committed a record $150 million gift to anchor a planned $1 billion children's hospital in southwest Las Vegas, according to local reporting. The donation is described as the largest of its kind in the project's funding effort and is expected to accelerate construction of a facility aimed at expanding pediatric specialty care in a region that has long lacked a dedicated children's hospital. Details on groundbreaking timelines were not immediately available.","source":"Nevada Globe","url":"https://thenevadaglobe.com/"}],"nellis":[{"headline":"Air Force unveils $1 billion F-47 test campus planned for Nellis","body":"The U.S. Air Force has released a draft solicitation for a $1.057 billion 'F-47 Future Campus' at Nellis Air Force Base to support operational testing of Boeing's new sixth-generation fighter. The October 22 presolicitation seeks up to four design-build contractors, with an initial contract award targeted for February 2027 and roughly 40 months of construction to follow; the first major facilities are expected to be complete by March 2031. Plans call for a combined operations-and-maintenance hangar of nearly 117,000 square feet, a 39,200-square-foot reprogramming lab, a simulator facility, and a 1.15-million-square-foot aircraft apron with sunshades on the base's eastern side, cementing Nellis's role as the hub for testing the Air Force's next-generation fighter.","source":"Air Data News / The Defense News","url":"https://www.airdatanews.com/us-air-force-plans-us-1-billion-nellis-complex-for-f-47-operational-testing/"}]},"feelGood":[{"headline":"Bystander jumps aboard rolling bus to save 18 children after driver's medical emergency","body":"A man named Ebro Ahmed sprang into action after spotting a school bus rolling down a street with its doors open and the driver suffering a medical emergency. Ahmed managed to jump aboard the moving vehicle and bring it safely to a stop, preventing injury to all 18 children on board. The rescue has been celebrated online as a reminder of ordinary people stepping up in a crisis.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Strangers crowdfund $41,000 to help 86-year-old finish his dream boat","body":"An 86-year-old Texas man named Dale, who had been quietly building a 62-foot steel boat in his yard since 1987 with hopes of eventually sailing it to Alaska, got an unexpected boost this month. Three visitors who heard his story launched a GoFundMe on his behalf, and within days more than 1,500 donors contributed over $41,000 toward completing the long-held dream. Organizer Laurence Benson said the campaign was aimed at helping Dale finally see decades of work pay off.","source":"AOL","url":"https://www.aol.com/articles/7-feel-good-stories-start-105619000.html"},{"headline":"Wrong turn puts stranger in the right place to save a family of 14","body":"A chance wrong turn led a passing stranger to discover a Georgia family of 14 in the middle of a life-threatening emergency, and the unplanned detour turned into a dramatic rescue. The stranger's quick intervention is credited with saving the entire family, underscoring how a small accident of timing can change the course of a tragedy. The story has circulated widely this week as an example of unexpected heroism.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1636","event":"The Massachusetts Bay Colony legislature voted to found what would become Harvard University."},{"year":"1886","event":"The Statue of Liberty was dedicated in New York Harbor."},{"year":"1919","event":"Congress passed the Volstead Act over President Wilson's veto, enabling Prohibition enforcement."},{"year":"1965","event":"Construction of the Gateway Arch in St. Louis was completed."}]},"topPicks":[{"headline":"US Forces Posture for Possible Iran Strikes as Trump Weighs Post-Election Decision","teaser":"A potential US strike on Iran looms as military assets reposition ahead of a high-stakes presidential decision."},{"headline":"Russian Ballistic Missiles Tear Through Kyiv, Hitting Bridge, University and Medical Centers","teaser":"A fresh missile barrage on Kyiv's infrastructure underscores the war's continued escalation despite diplomatic efforts."},{"headline":"Federal Reserve holds rates steady as inflation climbs to 3.7%","teaser":"The Fed's decision to hold rates amid rising inflation signals growing tension between growth and price stability."}]},"navDates":[{"key":"2026-10-30","label":"Oct 30","href":"/","isNewest":true},{"key":"2026-10-29","label":"Oct 29","href":"/archive/2026-10-29.html","isNewest":false},{"key":"2026-10-28","label":"Oct 28","href":"/archive/2026-10-28.html","isNewest":false},{"key":"2026-10-27","label":"Oct 27","href":"/archive/2026-10-27.html","isNewest":false},{"key":"2026-10-26","label":"Oct 26","href":"/archive/2026-10-26.html","isNewest":false},{"key":"2026-10-25","label":"Oct 25","href":"/archive/2026-10-25.html","isNewest":false},{"key":"2026-10-24","label":"Oct 24","href":"/archive/2026-10-24.html","isNewest":false}],"currentKey":"2026-10-28","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-10-28.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
