<script>
const STATE = {"digest":{"date":"Wednesday, September 16, 2026","generatedAt":"Wed, Sep 16, 7:12 AM PDT","breaking":{"headline":"Iran War Escalates: House Presses Trump to End Conflict as U.S. Forces Clash With Iranian Boats","body":"The U.S. House voted for the third time on Tuesday, September 15, to press President Trump to end military operations against Iran or seek explicit congressional authorization, with seven Republicans crossing party lines to back the nonbinding resolution. Hours later, U.S. Central Command said American forces sank two small Iranian boats this week after they tried to steal a drone ship off Iran's coast. Underscoring the toll of the campaign, a new Congressional Budget Office analysis released September 15 pegs the war's cost to the Pentagon at roughly 38 billion dollars as of August 1, while separately warning that the U.S. has burned through as much as two-thirds of certain missile-defense interceptor stockpiles since mid-2025.","source":"Just Security / AP News","url":"https://www.justsecurity.org/157499/early-edition-september-16-2026/"},"tabs":{"defense":{"defense":[{"headline":"CBO Warns U.S. Has Depleted Up to Two-Thirds of Key Missile Defense Interceptors","body":"A Congressional Budget Office review of the Iran conflict estimates the U.S. has expended between one-half and two-thirds of its stock of certain missile-defense interceptors since June 2025, a shortfall officials say could take at least five years to rebuild. The Pentagon's own acquisition office has separately told the DoD Inspector General that munitions use during the campaign, dubbed Operation Epic Fury, exposed real bottlenecks in the defense industrial base. Together the findings point to a readiness gap that could constrain U.S. options in a simultaneous crisis elsewhere, including the Indo-Pacific.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Pentagon Opens Yearlong Laser and Microwave Trials to Counter Drone Swarms","body":"The Department of War confirmed on September 9 that Joint Interagency Task Force 401 has begun a yearlong directed-energy pilot at five military installations, testing high-energy lasers and high-power microwaves for base defense. The Army's 20-kilowatt Multipurpose High Energy Laser, mounted on an Infantry Squad Vehicle, was already used in late August along the southern border to down three drones threatening troops and Customs and Border Protection personnel. The effort reflects growing urgency inside the Pentagon to field cheaper, scalable counters to low-cost drone threats after repeated incursions at U.S. and allied installations.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/u-s"}],"acquisitions":[]},"us":[{"headline":"Supreme Court Blocks Trump-Ordered Mail Ballot Restrictions for 2026 Midterms","body":"In a ruling issued Monday, the Supreme Court refused to let new Postal Service rules restricting mail-ballot delivery take effect before the 2026 midterms, preserving the status quo for absentee voting nationwide. Justice Brett Kavanaugh concurred in the outcome but signaled the agency likely has authority to impose such rules in future elections, writing that state and local officials simply lacked time to implement them before this cycle. Only Justices Samuel Alito and Clarence Thomas dissented, arguing the challengers lacked standing. The decision caps a months-long legal fight after the administration finalized the rule in late August.","source":"Votebeat / Daily Caller","url":"https://www.votebeat.org/national/2026/09/15/trump-mail-voting-executive-order-supreme-court-decision-2026-election/"},{"headline":"Federal Judge Halts DHS Four-Year Cap on Student and Journalist Visas","body":"U.S. District Judge F. Dennis Saylor in Boston issued a nationwide preliminary injunction on September 14, blocking a DHS rule that would have replaced the decades-old 'duration of status' system with a hard four-year limit for F and J visas and a 240-day cap for journalist visas, hours before it was set to take effect. The Bush-appointed judge called the agency's justification 'exceptionally weak' and said it bordered on the absurd, noting it rested on a handful of anecdotes unrelated to the new restrictions. The ruling comes amid an already sharp decline in foreign enrollment, with NAFSA projecting roughly 111,000 fewer international students this fall at an estimated cost of $3.4 billion and 40,000 jobs.","source":"Poets&Quants / Reuters","url":"https://poetsandquants.com/2026/09/15/federal-judge-blocks-trumps-4-year-visa-cap-hours-before-it-was-set-to-take-effect/"},{"headline":"Fed Meets Today Amid Rare Split Over Whether to Hike Rates","body":"The Federal Open Market Committee wraps up its two-day meeting Wednesday with a 2 p.m. ET decision, after holding its benchmark rate at 3.50%-3.75% for five straight meetings even as Chair Kevin Warsh struck a hawkish tone at Jackson Hole, citing 12-month PCE inflation near 3.7%. Traders have been pricing in the possibility of a quarter-point hike this year despite July CPI cooling to 3.4%, an unusual dynamic reflecting internal Fed disagreement over whether inflation progress has stalled. The updated Summary of Economic Projections released alongside the decision will offer the clearest signal yet of the committee's rate path into 2027.","source":"Kiplinger / Trading Economics","url":"https://www.kiplinger.com/investing/live/fed-meeting-updates-and-commentary-september-2026"},{"headline":"Administration Advances $2.8 Billion Munitions Sale to Israel","body":"The Trump administration notified Congress of a planned $2.8 billion arms package for Israel that includes tens of thousands of 2,000-pound bombs, according to sources cited by Reuters on September 15. The sale would need to clear congressional review periods before finalization and comes as lawmakers separately press the administration over its handling of the wider Middle East conflict. The package underscores continued U.S. military support for Israel even as some in Congress push for greater oversight of arms transfers amid regional tensions.","source":"U.S. News & World Report / Reuters","url":"https://www.usnews.com/news/world/articles/2026-09-15/trump-administration-plans-2-8-billion-munitions-sale-to-israel-sources-say"}],"pacific":{"pacificCommand":[{"headline":"Japan Loses Contact With Global Hawk Drone Over Sea of Japan","body":"Japan's Air Self-Defense Force lost contact on September 15 with one of its three RQ-4B Global Hawk surveillance drones roughly 50 kilometers off Tottori Prefecture. All three of Japan's Global Hawks, completed as a fleet in 2023, fly from Misawa Air Base and can loiter near 60,000 feet for about 36 hours. Tokyo has not disclosed what mission the aircraft was flying, leaving open whether the loss was mechanical or linked to the increasingly contested airspace over the Sea of Japan.","source":"The Shugart Update","url":"https://thomasshugart.substack.com/p/the-daily-ish-update-d9a"},{"headline":"Tokyo Weighs 3.5% of GDP Defense Spending Target Under US Pressure","body":"Japan is considering setting a new mid-term defense budget goal of 3.5% of GDP to match NATO-aligned benchmarks Washington has pushed on allies, a move that could strain Prime Minister Sanae Takaichi's fiscal plans and rattle markets. Defense officials have reportedly told US counterparts they are open to a sharp spending increase. The debate follows Defense Minister Shinjiro Koizumi's September 11 comment that Tokyo is not ruling out nuclear-powered submarines as it revises Japan's core security strategy documents this year.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-09-15/japan-eyes-defense-spending-worth-3-5-of-gdp-amid-us-pressure"},{"headline":"US and India Kick Off Yudh Abhyas 2026 in the Himalayas","body":"American and Indian army units began the two-week Yudh Abhyas 2026 joint exercise on September 15 at Auli, high in India's Himalayan region. The drill proceeds even as the US House advances the Sanctioning Russia and Iran Act of 2026, legislation that could impose tariffs up to 100% on major buyers of Russian energy and names India among roughly ten countries potentially exposed. The timing highlights New Delhi's balancing act between expanding military cooperation with Washington and protecting its energy ties with Moscow.","source":"The Shugart Update","url":"https://thomasshugart.substack.com/p/the-daily-ish-update-7c4"}],"pacingThreat":[{"headline":"Beijing Rebukes Manila Over 'Theatrics' as Code of Conduct Talks Convene","body":"China lashed out at the Philippines after Defense Secretary Gilberto Teodoro delivered pointed criticism of Beijing at the Seoul Defense Dialogue on September 8, with Chinese officials telling Manila to stop its theatrics. The spat erupted just as China and ASEAN held their 58th working-group session in Manila on the long-delayed South China Sea Code of Conduct, complicating an already fragile negotiating track. Regional analysts expect Beijing to try to isolate Teodoro as an outlier rather than let the episode derail President Marcos's broader effort to stabilize ties with China, and do not anticipate the friction turning into armed confrontation.","source":"CNBC","url":"https://www.cnbc.com/2026/09/11/china-philippine-south-china-sea-disputes-tensions-.html"},{"headline":"PLA Runs Live-Missile Patrols Over Scarborough Shoal","body":"China's Southern Theater Command publicized readiness patrols around Scarborough Shoal, known to Beijing as Huangyan Dao, releasing footage of a JL-10 trainer jet carrying live missiles during the operation. The patrol came the same week China and Singapore staged their bilateral Maritime Cooperation-2026 naval exercise near Zhanjiang in Guangdong. The pairing of coercive signaling near contested reefs with cooperative drills elsewhere fits Beijing's established pattern of applying pressure on claimants while cultivating partnerships with non-claimant states.","source":"Global Times","url":"https://www.globaltimes.cn/china/military/index.html"},{"headline":"Record Number of PRC Ships Sustain Pressure on Taiwan's Waters","body":"Taiwan's Coast Guard Administration counted 244 PRC vessels operating in its waters in July, a record high and more than four times the 58 recorded in July 2025, with roughly 1,247 PRC ships logged near Taiwan and its outlying islands since Beijing began permanent patrols east of the island in May. Even as PLA aircraft sorties around Taiwan have eased back toward pre-2024 levels this year, analysts tracking the incursions assess the shift as a deliberate recalibration of coercion tactics that frees up military assets while maintaining steady gray-zone pressure through coast guard and other civilian hulls.","source":"American Enterprise Institute (ISW/AEI China-Taiwan Update)","url":"https://www.aei.org/commentary/china-taiwan-update-september-1-2026/"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine's 'Operation Vivaldi' Disrupts Russian Encirclement Bid as Counteroffensive Advances Near Lyman","body":"The Institute for the Study of War reported on September 15 that Ukraine's 3rd Army Corps has used long-range strikes on Russian fuel and logistics nodes to blunt Moscow's attempt to encircle Ukraine's 'Fortress Belt' defensive line, an effort Kyiv calls Operation Vivaldi. Ukrainian officials also gave their first explicit confirmation of counteroffensive operations against a Russian salient northwest of Lyman, even as Russia launched roughly 200 drones at Ukraine overnight and Kyiv struck back at Russian oil, defense-industrial, and military infrastructure. Separately, Washington sanctioned Russia's VTB Bank on September 14 over its role in Iran sanctions evasion, while Zelensky again offered a mutual energy-infrastructure ceasefire that Trump has been pushing, even as the Kremlin publicly reaffirmed its maximalist war aims.","source":"Kyiv Post / ISW","url":"https://www.kyivpost.com/post/84608"},{"headline":"Zelensky Says Russian Drones Twice Breached Moldovan Airspace During His Visit","body":"President Zelensky told CBS News that Russian drones entered Moldovan airspace twice while he was in the country, calling it a deliberate Kremlin tactic to intimidate him and other foreign leaders. The claim adds to a string of recent Russian drone and airspace violations affecting European states near the war zone, feeding allied concerns about Moscow's use of hybrid pressure tactics even as talk of a limited energy ceasefire continues.","source":"Just Security","url":"https://www.justsecurity.org/157499/early-edition-september-16-2026/"}],"europe":[{"headline":"NATO Doubles Down on 'NATO 3.0' Push for Europe to Lead Its Own Defense","body":"NATO Secretary General Mark Rutte has been pressing allies to accelerate what he calls 'NATO 3.0,' a restructuring in which European members and Canada assume primary responsibility for conventional deterrence against Russia while Washington scales back its footprint. Rutte has pointed to Germany's new armored brigade permanently based in Lithuania and a German-Netherlands corps taking command on NATO's eastern flank as models, framing the shift as driven by a mindset that security is something allies do 'with' rather than have done 'for' them by the U.S. The push comes as NATO's North Atlantic Council met again on September 15 in KFOR format and as allies continue to rally around Germany following a Russian hybrid attack on Leipzig airport, with Rutte pledging further support for Ukraine as part of the alliance's response.","source":"NATO / GlobalSecurity.org","url":"https://www.nato.int/en"},{"headline":"German Chancellor Merz's Grip on Power Wavers as AfD Eyes First Postwar Regional Win","body":"Chancellor Friedrich Merz faces two closely watched regional elections this weekend that could determine whether he can hold his coalition together and push through economic reforms in Germany, Europe's largest economy. His authority was already shaken by his party's defeat on September 6 in Saxony-Anhalt, where the anti-migration, Russia-friendly Alternative for Germany party fell just short of a majority and now has its best shot yet at forming Germany's first far-right regional government since World War II. Merz, 70, took office 16 months ago promising to revive a stagnant economy but has struggled to lift a sour national mood, becoming increasingly unpopular himself.","source":"Associated Press","url":"https://www.news4jax.com/news/world/2026/09/16/the-future-of-germanys-leader-is-uncertain-as-his-party-faces-2-difficult-regional-elections/"}]},"middleEast":[{"headline":"Deadly Gaza Building Collapse Kills at Least 12 as Ceasefire Violations Mount","body":"A multi-story building housing displaced families collapsed in Gaza City on September 16, killing at least 12 people, according to Shifa Hospital. The collapse comes as Gaza's Health Ministry reports that Israeli violations of the October 2025 ceasefire have killed 1,372 Palestinians and wounded 4,659 more since it took effect, with strikes and shelling reported this week near Deir al-Balah, Khan Younis, and the 'yellow line' buffer zones. The toll highlights how fragile the truce remains nearly a year after it was signed.","source":"Euronews / Middle East Monitor","url":"https://www.euronews.com/"},{"headline":"Houthis Escalate Cross-Border Strikes on Saudi Arabia as Yemen's War Reignites","body":"Yemen's Houthi movement claimed a wave of strikes on Saudi cities this week, including an attack on a Saudi air base it described as retaliation for Saudi-backed strikes on Yemen, with Saudi authorities reporting 13 people injured. The Saudi-led coalition said it intercepted a Houthi drone south of Mecca, while renewed clashes between Houthi forces and Saudi-backed Yemeni government troops have pushed refugees to flee by boat to Djibouti. The flare-up signals a fraying of the fragile calm that had held in Yemen for much of the year, adding another front to the region's overlapping conflicts.","source":"Jerusalem Post / Haaretz","url":"https://www.haaretz.com/israel-news/israel-security/2026-09-15/ty-article-live/saudi-led-coalition-says-13-injured-in-houthi-attacks-on-three-saudi-cities/000001a0-a2c3-dceb-abe2-aecbaeef0000"},{"headline":"October 7 Victims' Families File 'Case 7/10' Charges Against Netanyahu as IDF Kills Senior Hamas Commanders","body":"Relatives of victims from Hamas's October 7, 2023 attack held a press conference on September 15 to unveil what they're calling 'Case 7/10,' formally accusing Prime Minister Benjamin Netanyahu of failing to prevent the assault. The announcement came the same day the IDF and Shin Bet confirmed killing Nael Abu Obeid, commander of Hamas's Rafah Brigade and head of its military-wing operations array, in a strike in southern Gaza, part of a string of targeted killings of Hamas commanders that Israel says violate the ceasefire's terms. The dual developments underscore mounting domestic political pressure on Netanyahu even as military operations against Hamas remnants continue.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-september-15-2026/"}],"techAI":{"aiCompetition":[{"headline":"OpenAI, Anthropic and Google DeepMind Open Joint Channel on AI Safety","body":"OpenAI's global policy chief Chris Lehane confirmed on September 15 that the company has spent several weeks coordinating with rivals Anthropic and Google DeepMind on frontier-model safety measures, even as the three labs continue to compete commercially. The disclosure follows Anthropic CEO Dario Amodei's weekend essay urging the industry to slow capability gains, and comes as Lehane lobbies Capitol Hill on catastrophic-risk legislation. The move marks an unusual moment of inter-lab cooperation amid an otherwise fierce race for compute, talent and enterprise market share.","source":"TechCrunch","url":"https://techcrunch.com/2026/09/15/openai-anthropic-google-have-been-in-talks-on-ai-safety-for-weeks/"},{"headline":"Anthropic's Compute Bill Balloons to $517 Billion, Raising Financing Questions","body":"New disclosures show Anthropic has locked in roughly $517 billion in compute commitments covering 14.8 gigawatts of capacity over the 11 months through August 2026, nearly triple the figure it previously gave investors. Amazon and Alphabet alone account for about 11 gigawatts and over $300 billion of that spend, with Microsoft, SpaceX/Colossus and AMD also holding large multi-billion-dollar slices. Notably, Rumble/Truth Social parent Rum Group issued Anthropic warrants worth roughly $364 million while admitting it has not secured the financing needed to build its promised data-center capacity, underscoring how stretched the AI infrastructure financing chain has become just as Amodei publicly called for slowing the pace of frontier development.","source":"247 Wall St.","url":"https://247wallst.com/"}],"cyberEmerging":[{"headline":"US, UK and Dutch Agencies Expose Iranian Spyware Targeting Dissidents","body":"The FBI, Britain's National Cyber Security Centre and the Netherlands' AIVD published a joint advisory on September 15 detailing Windows malware -- dubbed HEAVYGRAM by the FBI and CHOSEN BRICK by NCSC -- that Iran's Ministry of Intelligence and Security uses to spy on journalists, activists and dissidents worldwide. The tool is remotely controlled via Telegram and can exfiltrate emails and chat logs, capture screenshots and secretly activate microphones to record audio. The advisory updates an earlier March 2026 alert with new technical indicators, timed against a backdrop of rising US-Iran tensions.","source":"The Hacker News","url":"https://thehackernews.com/"},{"headline":"Microsoft Rolls Out AI 'Code of Conduct' Barring Its Models From Cyberattacks","body":"Microsoft has published a draft Humanist AI Code of Conduct that would explicitly prohibit its in-house MAI models from launching cyberattacks or supplying operational attack capabilities to bad actors. CEO Satya Nadella framed the move as embracing deliberate pacing to get AI alignment right, making Microsoft the first major hyperscaler to formally join the safety-pacing camp alongside lab leaders like Sam Altman and Dario Amodei. The announcement lands the same week researchers flagged an underground 'uncensored' AI service, Luciferus, being marketed to hackers for malware-development requests mainstream chatbots refuse.","source":"Cyber Security News","url":"https://cybersecuritynews.com/"}]},"cities":{"lasVegas":[{"headline":"Henderson hit-and-run leaves pedestrian dead, driver held on DUI suspicion","body":"A pedestrian was struck and killed just after 1 a.m. Wednesday at Boulder Highway and Magic Way in Henderson, according to police. The driver was taken into custody on suspicion of driving under the influence, and northbound Boulder Highway remained closed at the scene while investigators worked the crash. It marks at least the second fatal roadway incident in the valley in recent days, adding to a string of traffic deaths across Clark County this year.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/crime/pedestrian-killed-driver-detained-after-crash-in-henderson-3886898/"},{"headline":"CCSD slashes over $50 million from budget as enrollment slides","body":"The Clark County School District has cut $51.6 million from its fall budget after losing roughly 10,400 students, forcing individual schools to absorb $29.1 million in reductions while the central office trims only 2.5 percent. The shortfall reflects a broader enrollment decline hitting Nevada's largest district even as the state released new school-performance ratings this week showing most Las Vegas-area schools holding steady or improving. Parents and staff are bracing for how the cuts ripple into classrooms this fall.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"},{"headline":"Clark County logs first West Nile virus case of the season","body":"The Southern Nevada Health District confirmed the first human case of West Nile virus in a Clark County resident this season. Health officials are urging valley residents to drain standing water and use repellent as warmer overnight temperatures linger into fall, conditions that keep mosquito activity elevated. The case underscores a recurring public-health concern for the Las Vegas Valley, where irrigation canals and backyard pools provide breeding grounds.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Oregon Guard F-15EX drops first live bomb during Nellis deployment","body":"An F-15EX Eagle II assigned to the Oregon Air National Guard's 142nd Wing released its first live BLU-111 500-pound-class bomb while operating out of Nellis Air Force Base, a milestone reached on August 27 during a three-week deployment spanning late August into September. The drop signals the jet's growing role in heavier strike missions, combining large weapons loads with precision targeting as the Air Force expands the F-15EX's multirole mission set. Nellis continues to serve as the proving ground for these expanded-capability workups alongside its regular Weapons School and Red Flag training cycles.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/aerospace-news/2026/u-s-air-force-f-15ex-eagle-ii-fighter-jet-drops-first-live-bomb-as-new-strike-role-expands"}]},"feelGood":[{"headline":"Old college connection sparks $20,000 rescue from homelessness","body":"A former Indiana Hoosiers running back who had fallen into months of homelessness was lifted out of it after a chance encounter with someone who recognized him from their shared university days. A GoFundMe campaign that followed raised $20,000, enough to secure him an apartment along with clothing, food and furniture to rebuild his life. Former teammates and total strangers rallied online within days, turning one small moment of recognition into a life-changing outcome.","source":"Impactful Ninja","url":"https://impactful.ninja/how-red-backpack-sparked-20000-rescue-from-homelessness/"},{"headline":"21 sphynx cats pulled from troubled Henderson breeding operation","body":"Henderson officials removed 21 sphynx cats from a local business after a welfare investigation found many of the animals suffering from illnesses and physical problems tied to poor breeding practices. The city stepped in to get the cats into care, and animal-welfare advocates are now working to find them permanent, loving homes. The rescue highlights how quickly local agencies and community members can mobilize when vulnerable animals are found in distress.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/henderson/"},{"headline":"Strangers team up to save a frightened dog too scared to move","body":"When a dog named 'The Dude' froze in fear on a walk and refused to budge, his owner Lara found herself stuck on the roadside until a passing stranger stopped to ask if he could help. When encouragement alone did not work, the man went to fetch his car while his friend stayed behind to keep the dog calm, ultimately getting the frightened animal safely home. Best Friends Animal Society highlighted the moment as a reminder that ordinary passersby stepping in can make all the difference for an animal in distress.","source":"Best Friends Animal Society","url":"https://bestfriends.org/stories/best-friends-magazine/spreading-kindness-animals-every-day"}],"onThisDay":[{"year":"1620","event":"The Mayflower departed Plymouth, England, carrying Pilgrim settlers toward the New World."},{"year":"1810","event":"Mexico's independence movement began with Miguel Hidalgo's Cry of Dolores."},{"year":"1975","event":"Papua New Guinea gained independence from Australia."},{"year":"1987","event":"The Montreal Protocol was signed by nations agreeing to phase out substances harming the ozone layer."}]},"topPicks":[{"headline":"Iran War Escalates: House Presses Trump to End Conflict as U.S. Forces Clash With Iranian Boats","teaser":"Congressional pressure mounts as direct U.S.-Iran naval clashes raise fears of a wider Middle East war."},{"headline":"Fed Meets Today Amid Rare Split Over Whether to Hike Rates","teaser":"A divided Federal Reserve's rate decision could ripple through global markets and household borrowing costs."},{"headline":"Supreme Court Blocks Trump-Ordered Mail Ballot Restrictions for 2026 Midterms","teaser":"The ruling preserves mail-in voting access nationwide just weeks before critical midterm elections."}]},"navDates":[{"key":"2026-09-20","label":"Sep 20","href":"/","isNewest":true},{"key":"2026-09-19","label":"Sep 19","href":"/archive/2026-09-19.html","isNewest":false},{"key":"2026-09-18","label":"Sep 18","href":"/archive/2026-09-18.html","isNewest":false},{"key":"2026-09-17","label":"Sep 17","href":"/archive/2026-09-17.html","isNewest":false},{"key":"2026-09-16","label":"Sep 16","href":"/archive/2026-09-16.html","isNewest":false},{"key":"2026-09-15","label":"Sep 15","href":"/archive/2026-09-15.html","isNewest":false},{"key":"2026-09-14","label":"Sep 14","href":"/archive/2026-09-14.html","isNewest":false}],"currentKey":"2026-09-16","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-09-16.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
