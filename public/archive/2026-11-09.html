<script>
const STATE = {"digest":{"date":"Monday, November 9, 2026","generatedAt":"Mon, Nov 9, 11:48 AM PST","breaking":{"headline":"House Set to Vote on Impeaching Defense Secretary Pete Hegseth Over Iran War","body":"Rep. Thomas Massie, a retiring Kentucky Republican, filed eight articles of impeachment against Defense Secretary Pete Hegseth on Monday, forcing a House floor vote expected within days under procedural rules giving leadership a two-legislative-day window to act. The charges center on alleged War Powers Act violations tied to the monthslong conflict with Iran, plus accusations connected to strikes on suspected drug-trafficking boats, the capture of former Venezuelan leader Nicolas Maduro, and operations in Yemen. Momentum built after Republicans suffered steep losses in the November 3 midterms, with Democratic leader Hakeem Jeffries declaring himself a firm yes and several outgoing or defeated House Republicans signaling they may cross party lines. A successful vote would make Hegseth only the third Cabinet secretary in U.S. history to be impeached.","source":"NBC News","url":"https://www.nbcnews.com/politics/trump-administration/thomas-massie-pete-hegseth-impeachment-house-defense-rcna597989"},"tabs":{"defense":{"defense":[{"headline":"CENTCOM Stands Up Task Force Iron Gate to Cut Iran's Weapons Pipeline","body":"U.S. Central Command announced the creation of a roughly 20-person unit, Task Force Iron Gate, headquartered at CENTCOM's Tampa base, aimed at disrupting arms shipments, sanctioned materials and illicit revenue moving across Iranian land borders and Caspian Sea shipping lanes. Commander Adm. Brad Cooper described the move as reinforcing a maritime blockade on Iran, which is working to rebuild military capacity degraded by earlier U.S. and Israeli strikes. The unit will coordinate with other federal agencies to close off alternate smuggling routes Tehran could use to rearm.","source":"The American Legion","url":"https://www.legion.org/information-center/news/security/2026/november/five-things-to-know-nov-9-2026"},{"headline":"Air Force Converts Cargo Jets Into Missile-Launching Platforms","body":"The Air Force has begun equipping transport aircraft with a palletized version of its Family of Affordable Mass Munitions, a low-cost, long-range cruise missile line built for modular deployment, effectively turning cargo planes into standoff strike platforms. The move, detailed in a Monday defense-industry briefing, reflects a broader push to widen magazine depth and spread strike capacity beyond dedicated bombers and fighters. The palletized-munitions concept lets existing airlift aircraft roll missiles out of cargo bays without major airframe modification.","source":"Inside Defense","url":"https://insidedefense.com/insider/insider-daily-digest-november-9-2026"},{"headline":"NATO Rolls Out Counter-Drone Supplier Catalog Under Drone Edge Push","body":"NATO's communications and procurement arm published a shortlist of 16 counter-drone systems from five companies, with 2024-founded startup Alta Ares claiming six of the slots after awards were finalized on November 5. The catalog carries no guaranteed funding until individual allies or NATO commands place orders, with the only committed pool so far a 3.1 million euro testing fund tied to the alliance's Drone Edge initiative launched at July's Ankara summit. Larger incumbents such as Anduril, Thales and Saab were notably absent from the published list, underscoring how smaller firms are breaking into NATO's layered air-defense pipeline.","source":"DroneXL","url":"https://dronexl.co/2026/11/09/nato-counter-drone-catalog-alta-ares-six-of-16-lots/"}],"acquisitions":[{"headline":"Space Force Awards Viasat Up to $450M for Golden Dome Data Backbone","body":"The Space Force, working with the Pentagon's Golden Dome missile-defense effort, awarded Viasat a contract worth as much as $450 million to design and operate a Mission Operations Center for the Space Data Network Backbone, the system meant to tie together multi-vendor connectivity across the architecture's domains. The deal marks continued build-out of Golden Dome's command-and-control backbone as the program shifts from concept toward fielded infrastructure. Viasat will be responsible for scaling the network as additional sensor and interceptor layers come online.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Navy Taps Hanwha to Build Landing Ship Medium in $269M Award","body":"TOTE Services has selected Hanwha to construct one Landing Ship Medium vessel under a contract valued at roughly $269 million, part of the Navy's push to rebuild medium amphibious lift capacity for distributed operations in contested littorals. The award, flagged in Inside Defense's November 9 roundup, continues a trend of the Navy turning to Korean shipbuilders as domestic yards remain capacity-constrained. The LSM program is central to Marine Corps plans for dispersed logistics support across Indo-Pacific island chains.","source":"Inside Defense","url":"https://insidedefense.com/content/inside-navy-november-9-2026"}]},"us":[{"headline":"Trump Installs Stephen Miller as Chief of Staff in Post-Midterm Shakeup","body":"President Trump replaced Susie Wiles with longtime aide Stephen Miller as White House chief of staff effective Monday, November 9, in the most significant personnel change since Republicans' midterm losses. Wiles, the first woman to hold the post and Trump's longest-serving chief of staff across both terms, is shifting to run Trump's political operation. Miller, previously deputy chief of staff for policy and homeland security advisor, has reportedly been working with OMB Director Russ Vought on executive-action plans to advance immigration, tariff, and spending priorities without relying on the incoming Democratic Congress.","source":"Axios / CBS News","url":"https://www.axios.com/2026/11/06/susie-wiles-trump-stephen-miller-chief-of-staff"},{"headline":"Lame-Duck Congress Returns Facing Dec. 11 Funding Cliff and Debt-Limit Showdown","body":"Lawmakers reconvened Monday for a lame-duck session running until Christmas, with the stopgap funding measure enacted in September set to expire December 11 and risk a fourth shutdown of Trump's second term if not replaced. Senate Majority Leader John Thune has signaled Republicans may try to push through a debt-limit increase - the statutory cap sits at $41.1 trillion and could be breached as early as February 2027 - before Democrats, who flipped both chambers in last week's midterms, take the gavels in January. The session must also resolve the annual defense authorization bill and a lapsed surveillance law, compressing an unusually heavy workload into roughly six legislative weeks.","source":"Fox News / No Labels","url":"https://www.foxnews.com/politics/congress-returns-brutal-lame-duck-stretch-shutdown-deadline-leadership-races-closet-full-s"},{"headline":"Supreme Court Vacates Ruling Barring Male Guards From Searching Transgender Inmate","body":"The Supreme Court on Monday vacated a 10th Circuit decision that had found a transgender woman inmate in Colorado could not be strip-searched by male prison guards, sending the case back for reconsideration. The dispute arose from an El Paso County Sheriff's Office intake search of inmate Darlene Griffith, who had undergone hormone treatment but retained male genitalia; guards split the search by body region along gender lines of the examining officer. The justices pointed to two recent high-court rulings - upholding Tennessee's ban on gender-transition treatment for minors and West Virginia's restriction on transgender athletes in girls' sports - as grounds for the lower court to revisit its reasoning.","source":"The Washington Times","url":"https://www.washingtontimes.com/news/2026/nov/9/supreme-court-erases-lower-court-ruling-strip-searches-transgender/"},{"headline":"Democrats Expand House Majority to 254 Seats as Senate Races in Alaska, Mississippi Remain Unsettled","body":"Nearly a week after Election Day, vote counting continues to favor Democrats, who have now secured 254 House seats to Republicans' 162, with 19 races still undecided. Two Senate contests remain too close to call: in Mississippi, Democratic challenger Scott Colom holds a narrow edge over incumbent Republican Cindy Hyde-Smith, while in Alaska, Democrat Mary Peltola leads incumbent Republican Dan Sullivan by a thin margin. The results are fueling intra-party debate, with some Democratic strategists in Florida and Louisiana arguing the party left additional Southern upsets on the table by treating the region as unwinnable.","source":"Democracy Now! / The Washington Post","url":"https://www.democracynow.org/2026/11/9/headlines"}],"pacific":{"pacificCommand":[{"headline":"Tokyo weighs doubling five-year defense budget to as much as $508 billion","body":"Japanese officials tell Reuters that Prime Minister Sanae Takaichi's government and ruling coalition are considering a five-year defense buildup of 70-80 trillion yen (about $457-508 billion) starting April 2027, nearly double the current plan's 43 trillion yen. The package would prioritize mass drone purchases, long-range counterstrike missiles, AI and space systems, with a weaker yen also driving up procurement costs. The move comes as Defense Minister Shinjiro Koizumi has reopened debate on Japan's Three Non-Nuclear Principles, floating the idea of nuclear-powered submarines after Washington's approval of a similar South Korean program.","source":"The Japan Times","url":"https://www.japantimes.co.jp/news/2026/11/02/japan/politics/defense-spending-double-takaichi/"},{"headline":"Quad leaders to hold first summit since 2024 in Manila amid new Japan-Philippines security pact","body":"Leaders of the US, Japan, Australia and India will convene in Manila November 15-18 on the sidelines of the ASEAN summit, Secretary of State Marco Rubio confirmed, marking the Quad's first leaders-level meeting in two years and Donald Trump's first Quad summit of his current term. The gathering follows Japan's announcement of a 4.3-billion-yen security aid package to the Philippines that for the first time includes hardware—a coastal radar system and surveillance drones—rather than just training or non-lethal gear. The timing underscores deepening Indo-Pacific coordination as Manila continues to face Chinese pressure in the South China Sea.","source":"The Philippine Star","url":"https://www.philstar.com/headlines/2026/11/03/2567466/philippines-host-quad-leaders-summit-during-asean-meet"},{"headline":"Pyongyang fires fourth missile salvo of the month as Seoul faces hacking fallout","body":"South Korea's Joint Chiefs of Staff reported North Korea launched multiple missiles toward its eastern waters on November 4, the fourth such test in a month, hours after Pyongyang said it saw no reason for face-to-face talks with Washington. The launch came as North Korea dismissed US accusations that its hackers stole $6.3 billion from the Binance exchange, framing the claim as evidence of American hostility. Separately, India's government publicly criticized Washington's $686 million approval to upgrade Pakistan's roughly 70 F-16s through 2040, with Indian analysts warning the avionics and navigation improvements could indirectly bolster Islamabad's nuclear delivery options.","source":"Rio Times / Asia Intelligence Brief","url":"https://www.riotimesonline.com/asia-intelligence-brief-thursday-november-5-2026"}],"pacingThreat":[{"headline":"PLA Rocket Force completes induction of nuclear-capable DF-61 ICBM","body":"Chinese state broadcaster CCTV has confirmed the DF-61 intercontinental ballistic missile, first unveiled at a military parade last year, is now fully operational within the PLA Rocket Force, with analysts noting the induction timeline ran faster than typical for a new ICBM class. The disclosure came alongside Chinese displays of DF-series missiles amid speculation of an imminent flight test, part of a broader pattern of accelerated strategic weapons fielding. Beijing is also expanding military-industrial exports, with Bangladesh becoming the newest buyer of China's J-10 fighter jet.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military"},{"headline":"ISW assesses PLA exercises may be rehearsing a Taiwan blockade and anti-access mission","body":"A November 6 assessment by the Institute for the Study of War concluded the PLA could be simulating isolation of Taiwan while positioning warships to deter US intervention, citing the Liaoning carrier group's transit around the southern Philippines in late October and PLA warships pushing through straits near Japan into the Pacific in late October and early November. Analysts say the use of naval forces drawn from multiple theater commands signals Beijing is testing integrated joint command-and-control across its military regions. The drills coincided with a sharp rise in PLA aircraft activity around Taiwan through early November.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3373741/pla-rehearsing-operations-keep-us-forces-out-taiwan-conflict"},{"headline":"Taiwan discloses over 100 PLA ships operating around the island amid sortie spike","body":"Taiwan's National Security Council secretary general Joseph Wu reported on November 3 that more than 100 PLA Navy and China Coast Guard vessels were operating across the region surrounding Taiwan, alongside a sharp rise in PLA air activity. Taiwan's defense ministry logged 49 PLA aircraft sorties in the 24 hours to 6 a.m. that day, with 36 of them pushing into the island's southern air defense identification zone. The disclosures are feeding into US and allied assessments that Beijing is rehearsing large-scale encirclement operations rather than a routine patrol pattern.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3373741/pla-rehearsing-operations-keep-us-forces-out-taiwan-conflict"}]},"europe":{"ukraineRussia":[{"headline":"Russia Pounds Ukraine's Power Grid for Second Straight Night","body":"Russian forces hit Ukrainian energy infrastructure for a second consecutive night on November 7-8, launching 164 attack drones and three Kh-59/69 cruise missiles that triggered widespread blackouts across multiple regions. The Zaporizhzhia nuclear plant suffered its 16th blackout of the year and is now running on backup generators, while strikes also hit Kremenchuk, Dnipropetrovsk and Odesa, killing and injuring civilians. The barrage underscores Moscow's winter strategy of grinding down Ukraine's civilian energy security as colder weather sets in.","source":"ISW / Kyiv Post, rbc.ua","url":"https://www.kyivpost.com/post/89501"},{"headline":"Ukraine Claims Major Gains Near Oleksandrivka as Abu Dhabi Talks Loom","body":"Ukrainian President Volodymyr Zelensky said on November 8 that airborne assault units and other forces have liberated more than 800 square kilometers in the Oleksandrivka direction during counterattacks this year, even as Russia keeps pressing hardest around Pokrovsk and Kostiantynivka, where 140 combat engagements were recorded in a single day. Separately, France's foreign minister said European governments will join an emerging Ukraine peace-talks track in Abu Dhabi, signaling Europe wants a direct seat at the table as any settlement framework takes shape. Kyiv also says Russia has lost over 1.6 million troops since February 2022, a figure Moscow disputes.","source":"ISW / RBC-Ukraine","url":"https://www.criticalthreats.org/analysis/russian-offensive-campaign-assessment-november-8-2026"}],"europe":[{"headline":"Germany's Patriot Stockpile Runs Dry, Exposing NATO Air-Defense Gap","body":"German Defense Minister Boris Pistorius said on November 7 that Berlin has exhausted its available Patriot interceptor stocks for transfer to Ukraine, spotlighting a global shortage of interceptors that is hampering Kyiv's ability to defend against Russian ballistic missiles. The shortfall compounds warnings from Polish officials that scheduled Patriot deliveries to Poland will also be delayed, prompting Warsaw to demand that defense manufacturers build production and maintenance facilities inside Europe rather than rely solely on U.S. supply chains. In response, Norway's Kongsberg announced a $51 million investment to build a counter-drone production plant in northern Poland, part of a broader push toward European-based defense manufacturing.","source":"ISW / RealClearDefense","url":"https://www.realcleardefense.com/nato/links/natos-new-defense-plan-would-mean-strikes-deep-inside-russia-2026-11-04"},{"headline":"Cost-of-Living Protests Keep Spreading Across Europe","body":"Demonstrations over housing costs and living expenses continue to roil the continent, with Spain bracing for a nationwide general strike on November 11 after weeks of unrest tied to a housing crisis that was ignited by the eviction and death of an elderly Madrid pensioner. Parallel strikes and blockades have hit the Czech Republic, Denmark and France, where the government is accelerating a minimum-wage increase in an attempt to defuse protests, while Italy's public debt is projected to reach 138.5 percent of GDP in 2026, squeezing governments' room to respond with new spending. The UN human rights chief has also raised concerns about heavy-handed policing of the demonstrations, including against children.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/11/4/why-are-europes-governments-struggling-to-respond-to-growing-protests"}]},"middleEast":[{"headline":"Houthi Missiles Strike Riyadh, Damaging Aramco Building","body":"Saudi Arabia intercepted Houthi missiles aimed at Riyadh and other regions on November 8, but falling debris struck a building in the capital's King Abdullah Financial District belonging to state oil giant Saudi Aramco. The Saudi Energy Ministry confirmed shrapnel damage but no casualties, though the building reportedly also contains residential units. Qatar, Bahrain and Syria condemned the attack, while the episode has disrupted UAE-Saudi air travel, with Etihad canceling flights to Dammam and Riyadh through November 19.","source":"Arab News / Gulf News","url":"https://www.arabnews.com/middle-east"},{"headline":"US Launches 'Task Force Iron Gate' to Choke Off Iran's Smuggling Routes","body":"CENTCOM commander Admiral Brad Cooper ordered creation of Task Force Iron Gate, a roughly 20-person Tampa-based cell tasked with interdicting weapons, dual-use technology and sanctioned revenue moving across Iran's land borders and the Caspian Sea. Iran's IRGC dismissed the effort as 'wordplay,' and analysts note Washington has no military presence on the Caspian to enforce it. The move comes as Iran's Revolutionary Guard navy reported two tankers catching fire after striking mines in the Strait of Hormuz, and Iranian media reported fresh missile strikes on Qeshm Island.","source":"Arab News / Morning Brief","url":"https://andmagazine.substack.com/p/morningafternoon-brief-8-november"},{"headline":"Winter Storm Floods Tens of Thousands of Gaza Tents","body":"Gaza's first winter storm has left roughly 70,000 tents flooded within 12 hours, according to aid groups who blame Israeli restrictions on construction materials for what they call a 'man-made catastrophe' facing displaced families. In Deir al-Balah, a collapsed sandstone slab buried tents and killed at least five people, including four children, highlighting the fragility of shelters ahead of the winter season. The flooding adds pressure on mediators as Washington reportedly pressed Israel's prime minister to advance a Gaza stabilization plan following the U.S. midterm elections.","source":"Arab News / Al Jazeera","url":"https://www.arabnews.com/"}],"techAI":{"aiCompetition":[{"headline":"Anthropic's IPO Valuation Collapses by Up to $900 Billion Amid Tech Selloff","body":"Anthropic is reportedly set to begin formally marketing its Nasdaq listing as soon as Tuesday, November 10, after a brutal market rout slashed investor appetite for AI mega-valuations. Talks that stood at $1.5 trillion to $2 trillion earlier this fall have fallen to a range of roughly $1.1 trillion to $1.3 trillion, with the pullback tied to a record one-session wipeout of $2.3 trillion in Nasdaq 100 value and growing political backlash over data-center buildouts. The reset underscores how quickly investor sentiment on frontier AI has shifted even as the company pushes ahead with plans for one of the largest IPOs ever attempted.","source":"Investing.com","url":"https://www.investing.com/news/stock-market-news/anthropic-ipo-targets-november-debut-as-valuation-expectations-fall-93CH-5012800"},{"headline":"NVIDIA, SK Telecom and Rebellions Unveil South Korea's Sovereign AI Compute Stack","body":"On November 8, NVIDIA, SK Telecom and Korean chipmaker Rebellions announced a joint architecture to build out South Korea's national AI infrastructure, using NVIDIA's NVLink Fusion interconnect and MGX rack designs to split inference workloads, with NVIDIA GPUs handling prefill computation and Rebellions' domestic NPUs handling decode. The deal signals an escalating push by U.S. allies in the Indo-Pacific to build 'sovereign' AI capacity independent of hyperscaler clouds, blending American chip leadership with homegrown silicon. It comes as capital-intensive AI infrastructure deals continue to proliferate globally even as public-market valuations wobble.","source":"Au79 Macro Research","url":"https://martyau79.substack.com/p/09nov2026-frontier-tech-convergence"}],"cyberEmerging":[{"headline":"Chainalysis Confirms AI Agent-Driven Breach Exposed Credentials for Every Customer","body":"Blockchain analytics firm Chainalysis, widely used by law enforcement and exchanges to trace stolen crypto, disclosed that an attacker using 'offensive agentic techniques' stole names, usernames, password hashes and live session tokens for its entire customer base, forcing a temporary shutdown of its Reactor, KYT and Address Screening tools before service was restored November 7. Microsoft separately detailed a related wave of AI-agent attacks since August that scan public GitHub repositories for exposed cloud credentials and have successfully compromised service-principal logins and Azure Key Vault secrets across multiple tenants. Chainalysis says no investigation or attribution data was accessed, but the incident is among the clearest signs yet that autonomous AI agents are now being weaponized for large-scale credential theft.","source":"The Hacker News","url":"https://thehackernews.com/2026/11/chainalysis-breach-exposes-all-users.html"},{"headline":"Bank of England Governor Warns Frontier AI Is Making Cyberattacks Cheaper and More Scalable","body":"Bank of England Governor Andrew Bailey issued a warning that frontier AI models are lowering the barriers to sophisticated cyberattacks, making them cheaper, faster and able to reach far more targets than before. Citing an April 2026 evaluation of OpenAI's GPT-5.5, Bailey pointed to research showing that by mid-May 2026 frontier models had already demonstrated attack capabilities exceeding those of skilled human hackers. He called for rigorous testing of AI systems both before and after release rather than treating launch as the end of safety evaluation, tying the risk to broader concerns about AI-driven financial instability.","source":"Cryptonomist","url":"https://en.cryptonomist.ch/2026/11/09/frontier-ai-cyber-risks"}]},"cities":{"lasVegas":[{"headline":"Hoover Dam Gets Breathing Room as Floods Boost Colorado River","body":"Recent flooding has pushed more water into the Colorado River system, giving federal officials a reprieve as Lake Mead's levels crept toward thresholds that could knock out hydropower generation. Engineers are now preparing to run low-level tests on Hoover Dam's turbines, including Turbine A8, which has been offline, as the reservoir edges closer to critical elevation. The reprieve is temporary, and officials say the broader supply crunch on the river remains unresolved heading into 2027 operating-year planning.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Driver Hospitalized After Crashing Into A's Stadium Construction Site","body":"A vehicle crashed into the construction zone for the Athletics' new Las Vegas ballpark near East Reno Avenue and South Las Vegas Boulevard early Sunday, sending one driver to the hospital. Metro Police confirmed responding to the single-vehicle crash just after 6 a.m., and video circulating online shows the aftermath near the active build site. The incident adds a safety wrinkle to a project already under close public scrutiny as it rises on the Strip's south end.","source":"Las Vegas Review-Journal / Fox5 Vegas","url":"https://www.reviewjournal.com/"},{"headline":"Impaired Driving Still Driving Fatal Crashes Despite New Nevada Law and Tech","body":"Nevada authorities report that impaired driving remains a leading cause of fatal collisions even after the state rolled out new detection technology, stepped-up enforcement, and a legal change aimed squarely at cutting the death toll on local roads. Officials say the persistence of the problem shows technology and law alone are not closing the gap without sustained behavioral change among drivers. The data comes as Clark County continues to see high-profile crashes, including a weekend motorcycle collision in the central valley.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"}],"nellis":[{"headline":"Air Force Advances $1 Billion F-47 Campus at Nellis as Creech Expands Drone Testing","body":"The Air Force is moving ahead with plans for a sixth-generation fighter hub at Nellis Air Force Base, soliciting up to four contractors for a Future Campus that will include new hangars, labs, and low-observable maintenance facilities to support Boeing's F-47, with construction targeted for completion by 2031. The project follows a roughly $730 million infrastructure request in the Air Force's 2027 budget and will concentrate new construction in Nellis's east area, while operational testing for the jet is centered there even as initial trials run at Edwards AFB in California. Just down the road, Creech Air Force Base continues to mature its Collaborative Combat Aircraft mission, flying YFQ-42A Dark Merlin and YFQ-44A Fury drones under the new Experimental Operations Unit and a planned Test and Training Unit One, reinforcing the Las Vegas region's growing role in next-generation airpower.","source":"Air & Space Forces Magazine / Zona Militar","url":"https://www.airandspaceforces.com/air-force-billion-dollar-campus-testing-f-47-nellis/"}]},"feelGood":[{"headline":"Fishermen Save Cruise Ship Crew Member After Nine Hours Treading Water","body":"Two fishermen turned a routine outing into a dramatic rescue when they spotted a cruise ship pianist alone in open water nearly 20 miles off the California coast, having survived roughly nine hours by treading water after apparently going overboard. The pair pulled the crew member aboard and got them to safety, averting what could easily have become a fatal open-ocean disappearance. The rescue is being celebrated as a reminder of how ordinary people can become lifesavers in an instant.","source":"SunnySkyz / Good News","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Teen Brothers Use Kayak and Paddleboard to Rescue Flooded Florida Family","body":"Two teenage brothers grabbed a kayak and a paddleboard and paddled into a flooded Florida neighborhood to pull a mother, her young son, and their three dogs from a home surrounded by rising water. Neighbors credited the boys' quick thinking for preventing a far more dangerous outcome as floodwaters continued to rise. The family and pets were brought to dry ground safely, and the brothers have been hailed locally as heroes for stepping in without hesitation.","source":"SunnySkyz / Good News","url":"https://www.sunnyskyz.com/good-news"},{"headline":"New Jersey Students Collect Record 250,000 Pounds of Food for Families in Need","body":"Hundreds of students across New Jersey turned a football field into a sprawling sea of donation bags, gathering more than 250,000 pounds of food in a single drive benefiting a hunger-relief nonprofit. Organizers say the haul set a new record for the charity, reflecting an unusually large mobilization of young volunteers ahead of the holiday season. The effort is expected to stock food pantries serving families across the state through the winter months.","source":"SunnySkyz / Good News","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1906","event":"Theodore Roosevelt became the first sitting U.S. president to travel outside the country, visiting the Panama Canal construction site."},{"year":"1938","event":"Nazi paramilitary forces and civilians carried out Kristallnacht, a violent pogrom against Jews across Germany and Austria."},{"year":"1965","event":"The Great Northeast Blackout left 30 million people across the U.S. and Canada without power."},{"year":"1989","event":"East German authorities opened the Berlin Wall, allowing free passage between East and West Berlin for the first time in decades."}]},"topPicks":[{"headline":"House Set to Vote on Impeaching Defense Secretary Pete Hegseth Over Iran War","teaser":"A rare impeachment vote against a sitting Defense Secretary could upend military leadership amid an active Iran conflict."},{"headline":"Trump Installs Stephen Miller as Chief of Staff in Post-Midterm Shakeup","teaser":"A major West Wing reshuffle signals a hardline policy shift heading into the next phase of Trump's term."},{"headline":"PLA Rocket Force completes induction of nuclear-capable DF-61 ICBM","teaser":"China's deployment of a new nuclear-capable ICBM marks a significant shift in the global strategic balance."}]},"navDates":[{"key":"2026-11-11","label":"Nov 11","href":"/","isNewest":true},{"key":"2026-11-10","label":"Nov 10","href":"/archive/2026-11-10.html","isNewest":false},{"key":"2026-11-09","label":"Nov 9","href":"/archive/2026-11-09.html","isNewest":false},{"key":"2026-11-08","label":"Nov 8","href":"/archive/2026-11-08.html","isNewest":false},{"key":"2026-11-07","label":"Nov 7","href":"/archive/2026-11-07.html","isNewest":false},{"key":"2026-11-06","label":"Nov 6","href":"/archive/2026-11-06.html","isNewest":false},{"key":"2026-11-05","label":"Nov 5","href":"/archive/2026-11-05.html","isNewest":false}],"currentKey":"2026-11-09","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-09.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
