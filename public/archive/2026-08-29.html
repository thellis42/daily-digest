<script>
const STATE = {"digest":{"date":"Saturday, August 29, 2026","generatedAt":"Sat, Aug 29, 7:19 AM PDT","breaking":{"headline":"FBI and DOJ Dismantle China-Linked Botnet That Hit NASA, the Fed, and the Senate","body":"On August 26, the FBI and Justice Department seized the domains anchoring two hacking platforms, QScan and QTRouter, run by a Chinese state-linked group known as QTFY and tied to a Nanjing-based contractor allegedly paid by China's Ministry of State Security. Victims included NASA, the Federal Reserve, the Department of Energy, Health and Human Services, the National Institutes of Health, and the US Senate, with intrusions dating back to 2018 and as recent as this year. FBI Director Kash Patel announced the takedown as the White House separately declared a national emergency over the US power grid, ordering agencies to purge foreign-made components from the grid. The episode underscores how deeply Chinese cyber operators have burrowed into US critical infrastructure ahead of any potential crisis.","source":"The Register","url":"https://www.theregister.com/security/2026/08/27/fbi-seizes-hacking-tools-it-says-china-used-to-attack-nasa-doe-us-senate-and-other-critical-networks/5292742"},"tabs":{"defense":{"defense":[{"headline":"Pentagon Says Patriot and ATACMS Stocks in Europe Are 'Beyond Critical'","body":"The Wall Street Journal reports that six months into the Iran conflict, US inventories of PAC-3 Patriot interceptors and ATACMS surface-to-surface missiles in Europe have fallen to levels military planners now call 'beyond critical.' Officials worry the drawdown, driven by surging munitions transfers to defend Israel and US bases from Iranian strikes, is eroding America's ability to deter China and Russia simultaneously. The shortage adds pressure on defense planners as the Iran campaign shows no sign of a near-term resolution.","source":"Wall Street Journal via Political Wire","url":"https://politicalwire.com/2026/08/28/pentagon-warns-missile-supplies-beyond-critical/"},{"headline":"Fired Stars and Stripes Journalists Sue Pentagon Over USS Lincoln Coverage","body":"Three Stars and Stripes staffers, including publisher Max Lederer and editor-in-chief Erik Slavin, filed a federal lawsuit accusing Defense Secretary Pete Hegseth of illegally firing them in retaliation for reporting on poor morale and mental-health strain aboard the USS Abraham Lincoln during its unusually long Middle East deployment. The suit alleges First Amendment retaliation and comes as a sailor who jumped overboard from the carrier now faces discplinary charges for allegedly faking an illness. The case highlights growing friction between the Pentagon press corps and Hegseth's leadership amid the extended Lincoln deployment.","source":"The Verardo Group","url":"https://theverardogroup.substack.com/p/tvg-daily-brief-28-aug-2026"},{"headline":"New Zealand and South Korean Navies Drill Near Busan","body":"A Royal New Zealand Navy task group built around frigate HMNZS Te Mana and oiler HMNZS Aotearoa carried out maneuvering, communications, and replenishment-at-sea drills with a Republic of Korea Navy landing ship south of Busan this week. The exercise followed a New Zealand port call in Busan that ended August 20 and is part of a broader Indo-Pacific deployment focused on monitoring North Korean sanctions evasion at sea. The drill reflects expanding coordination among US-aligned Pacific navies as North Korean missile tests continue.","source":"USNI News","url":"https://news.usni.org/2026/08/28/usni-news-western-pacific-pulse-aug-28-2026"}],"acquisitions":[{"headline":"KBR Wins Five-Year NATO Contract to Modernize Patriot Air Defense","body":"The NATO Support and Procurement Agency has awarded KBR a five-year, up-to-$60 million contract to integrate Patriot batteries with the Integrated Battle Command System across allied forces. The work covers engineering, logistics, and command-and-control support meant to link sensors and shooters faster and shorten fielding timelines for air and missile defense units. The award reflects NATO's push to modernize missile defense as interceptor demand has surged across the alliance.","source":"Defence Industry","url":"https://defence-industry.eu/kbr-wins-nato-contract-to-accelerate-patriot-integration-with-ibcs-and-strengthen-allied-air-and-missile-defense-readiness/"},{"headline":"Pentagon Moves to Sharply Increase Patriot and THAAD Interceptor Production","body":"With missile-defense inventories strained by months of combat use tied to the Iran conflict, the US Department of War is pushing to significantly ramp up manufacturing of Patriot PAC-3 and THAAD interceptors. The push comes alongside rising allied orders for the same systems, adding further pressure on an already-stretched production base. The move is meant to rebuild stockpiles officials have described as critically depleted after sustained operations defending Israel and US regional bases.","source":"Defence Industry","url":"https://defence-industry.eu/kbr-wins-nato-contract-to-accelerate-patriot-integration-with-ibcs-and-strengthen-allied-air-and-missile-defense-readiness/"}]},"us":[{"headline":"Boston Judge Halts Trump's Mail-Ballot Restrictions Days After Supreme Court Cleared Them","body":"U.S. District Judge Indira Talwani issued a two-week temporary restraining order late Thursday blocking the Postal Service's newly finalized rule that would require states to submit ballot envelopes for USPS pre-approval and upload voter data before mail ballots could be sent out for the November 3 midterms. The order came just days after the Supreme Court lifted her earlier nationwide injunction against Trump's mail-voting executive order, prompting a scramble by Democratic state attorneys general and groups like the League of Women Voters to refile suit once USPS issued its final rule. Talwani found the agency had offered no justification for provisions she said could disenfranchise voters who relied on the roughly 100 million mail ballots processed by USPS in 2024. The fight is expected to head back to the Supreme Court within days.","source":"NPR","url":"https://www.npr.org/2026/08/26/nx-s1-5945260/trump-mail-in-voting-ballots"},{"headline":"US-Canada Trade War Escalates as Trump Renames Lake Ontario and Threatens Auto Tariffs","body":"Trump this week threatened 50% tariffs on Canadian-made cars, trucks, auto parts and steel set to take effect New Year's Day, prompting Ottawa to retaliate with duties on more than 700 American goods and a doubling of levies on US steel and aluminum. On Truth Social, Trump claimed Canada has been 'ripping off' the US for decades and cited a roughly 62 billion dollar annual trade deficit, while also floating renaming Lake Ontario 'Lake America,' a move Vermont's Republican governor publicly called petty. Canadian economists are reportedly telling Finance Minister officials the damage is manageable, bolstering Prime Minister Mark Carney's inclination to walk away from talks rather than concede further.","source":"The Daily Signal / The Hill","url":"https://www.dailysignal.com/2026/08/27/trump-concerns-canada-trade-war/"},{"headline":"Republican Governor Breaks With Trump Over DOJ Election Monitors","body":"Wyoming Governor Mark Gordon, a Republican, publicly voiced concern this week over Justice Department plans to deploy election monitors in his state ahead of the midterms, an unusual break from a GOP governor with an administration escalating federal involvement in state-run elections. The friction adds to a broader pattern of legal and political disputes over federal reach into election administration just over two months before the November 3 vote, coming the same week as the Postal Service mail-ballot fight intensified in federal court.","source":"CNN","url":"https://kvia.com/category/politics/cnn-us-politics/"},{"headline":"Kennedy Center Board Tells Judge It Won't Reverse Course on Contested Changes","body":"Attorneys for the Kennedy Center's board informed a federal judge Thursday that the institution does not intend to reverse recent leadership and programming changes that have drawn legal challenges, signaling the center will keep fighting rather than settle. The dispute is part of a wider set of court battles this year over Trump administration influence on cultural and federal institutions, with the judge's response still pending as litigation continues.","source":"CNN","url":"https://kvia.com/category/politics/cnn-us-politics/"}],"pacific":{"pacificCommand":[{"headline":"Australia Locks In Henderson Shipyard Site for AUKUS Submarine Work","body":"Canberra and Western Australia finalized the site layout for the Henderson Defence Precinct near Perth on August 27, a facility meant to handle depot-level maintenance and contingency docking for nuclear-powered attack submarines operated by Australia, the US and UK. The announcement builds on Australia's already-committed AUD 8.5 billion investment in the Osborne shipyard in South Australia and comes as Washington's Virginia-class boats prepare for enduring rotational access to HMAS Stirling under Submarine Rotational Force-West starting in 2027. Together the moves show AUKUS industrial infrastructure maturing on two fronts even though Australia's own SSN-AUKUS boats remain years from delivery.","source":"Global Defense Corp","url":"https://www.globaldefensecorp.com/2026/08/27/australia-unveils-site-layout-for-shipyard-for-aukus-submarine/"},{"headline":"Manila-Beijing Standoff Shifts to Hybrid Tactics as Code of Conduct Talks Stall","body":"A Council on Foreign Relations tracker updated August 27 notes that Chinese and Philippine forces clashed three separate times in a single week in July near Scarborough and Second Thomas Shoals, with daily maritime friction now outpacing progress toward a long-sought Code of Conduct. Manila has responded by deepening security ties across the region, including expanded US basing access and arms transfers plus new equipment purchases from Japan, while Beijing has accused the Philippines of 'flagrantly infringing' on its sovereignty over Manila's UN submission for extended seabed rights. Analysts increasingly describe the dispute as a grinding contest of coast guard harassment and intelligence operations rather than open combat.","source":"Council on Foreign Relations","url":"https://www.cfr.org/global-conflict-tracker/conflict/territorial-disputes-south-china-sea"},{"headline":"Tokyo Set to File Record $56 Billion Defense Budget Request","body":"Japan's Ministry of Defense is finalizing a roughly JPY8.9 trillion (about $56.1 billion) budget request for fiscal year 2027, due for formal submission to the Finance Ministry by the end of August, which would mark another all-time high. The request follows Japan reaching its 2% of GDP defense-spending target and funds long-range counterstrike missiles, hypersonic weapons and deeper cooperation with domestic tech firms on AI and drone warfare. It follows this month's defense white paper, which flagged growing China-Russia military coordination and China's expanding reach beyond the First Island Chain as top planning concerns.","source":"Defense News","url":"https://www.defensenews.com/global/asia-pacific/2026/08/10/japans-2026-defense-white-paper-highlights-new-era-of-crisis-in-indo-pacific/"}],"pacingThreat":[{"headline":"PLA Drills Near Scarborough Shoal Signal Sharper Response to Philippine Claims","body":"China's PLA Southern Theater Command ran a joint naval-air exercise around Scarborough Shoal (Huangyan Dao), rehearsing reconnaissance, deterrence patrols, air-sea control and joint-strike missions shortly after Manila filed a UN submission asserting extended seabed rights around the reef. Beijing's statement branded the Philippine claim 'illegal and null' and pledged its forces would 'stay on high alert' to defend what it calls its territorial sovereignty. The episode illustrates how Beijing now pairs legal pushback with rapid, calibrated military signaling whenever Manila advances a territorial claim.","source":"GlobalSecurity.org / Xinhua","url":"https://www.globalsecurity.org/military/library/news/2026/08/mil-260802-pdo01.htm"},{"headline":"China-Russia 'Joint Sea-2026' Drills Underscore Deepening Military Alignment","body":"Recent imagery circulating through regional outlets shows Chinese and Russian warships, including the destroyer Anshan, operating together during the 'Joint Sea-2026' exercise, the latest in a series of combined naval drills that Japan's defense white paper singled out as an alarming trend in Sino-Russian military ties. The drills coincide with expanded Chinese naval outreach elsewhere in the region, including a port call by the frigate Qi Jiguang in Surabaya, Indonesia. Analysts view the combination of muscle-flexing with Moscow and goodwill visits across Southeast Asia as two prongs of the same power-projection push.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military"},{"headline":"Taiwan's Tech Sector Pivots to Ukraine-Style Drone Mass Production","body":"Taiwanese electronics and hardware manufacturers are standing up drone production lines modeled on Ukraine's wartime manufacturing surge, a shift reported August 27 as island defense planners race to close a numbers gap with China's far larger drone inventory. The push follows this month's Han Kuang 42 exercise, in which Taiwan for the first time tested its ability to counter a PLA maritime blockade and rehearsed relocating weapons production lines to safer sites under wartime conditions. Together the steps reflect Taipei's growing bet on cheap, attritable systems as a hedge against Beijing's steadily expanding gray-zone and blockade capabilities.","source":"Global Defense Corp","url":"https://www.globaldefensecorp.com/"}]},"europe":{"ukraineRussia":[{"headline":"Russia Pounds Kyiv With Record Air Raid Alerts After CIA Chief's Moscow Visit","body":"Kyiv endured a record 13 separate air raid alerts in a single day on August 27, following CIA Director John Ratcliffe's arrival in Moscow on August 25 for the first such trip by a sitting CIA chief in nearly five years. Russia followed the diplomatic overture with ballistic missile strikes on the capital, an escalation widely read in Kyiv as Moscow's answer to Washington's engagement attempt. Overnight strikes also hit civilian infrastructure, including a distillery warehouse that burned for three hours after being struck four times.","source":"United24 Media / Kyiv Independent","url":"https://united24media.com/war-in-ukraine"},{"headline":"Ukraine Hits Strategic Bomber at Engels Airbase, Keeps Refineries Offline","body":"Ukrainian forces struck a Russian strategic bomber deep inside Russia at the Engels-2 airbase in Saratov Oblast, demonstrating continued reach against heavily defended rear-area targets. Kyiv is also conducting repeat strikes on Russian oil refineries to keep them offline, part of a sustained campaign against Moscow's energy revenue. Russia responded with another mass drone barrage overnight, launching 164 Shahed-type drones at Ukraine, about half of them jet-powered variants.","source":"Kyiv Post (ISW)","url":"https://www.kyivpost.com/post/83304"}],"europe":[{"headline":"Pentagon Pushes NATO Allies to Fill Gap as US Weighs Deeper Troop Cuts","body":"US Under Secretary of Defense Elbridge Colby met NATO Secretary General Mark Rutte and the North Atlantic Council in Brussels on August 27, pressing European allies to prove they are ready to take the lead in continental defense. Roughly 80,000 US troops remain in Europe after initial drawdowns, and the Pentagon is conducting a review of how much deeper to cut as Washington reorients toward the Indo-Pacific and homeland priorities. Colby praised Germany, Poland and the Scandinavian states for their efforts but singled out the United Kingdom for lagging, framing the survey as an effort to make NATO 'more realistic, fit-for-purpose.'","source":"Washington Times","url":"https://www.washingtontimes.com/news/2026/aug/27/us-defense-review-presses-nato-allies-prove-taking-lead-europe/"},{"headline":"Ceuta Migration Fallout Splits EU as Protesters Clash With Police","body":"The political aftershocks of August's Ceuta crisis, in which roughly 70,000-72,000 people crossed from Morocco into the Spanish enclave over two days with more than 100 drowning, continued this week as protesters burned migrant camps on the beach on August 27. Twenty-two EU governments, led by Italy and Denmark, have written to Commission President Ursula von der Leyen blaming Spain's migrant regularization policy as a 'pull factor' behind the crisis. Spain's Supreme Court has meanwhile barred summary 'hot returns' for migrants intercepted at sea, deepening tension between Madrid and restrictionist EU capitals over Schengen-zone obligations.","source":"Al Jazeera / RTVE","url":"https://www.arabnews.com/"}]},"middleEast":[{"headline":"Iran Signals Diplomatic Opening as US Sanctions Squeeze Deepens","body":"Iranian Foreign Minister Abbas Araghchi said on August 28 that restoring diplomacy with Washington 'isn't impossible' but insisted 'pressure doesn't work,' a notable softening after Tehran's economy has buckled under Trump's 'Operation Economic Outcast' sanctions campaign and a naval blockade of the Strait of Hormuz. The remarks came after Araghchi held talks in Tehran with Qatar's prime minister and after separate visits by Pakistan's army chief and Oman's foreign minister seeking to reopen the strait. The Wall Street Journal separately reported Trump has told mediators he is no longer interested in reviving the softer June memorandum of understanding, complicating any near-term deal roughly six months into the Iran war.","source":"Jerusalem Post / Times of Israel","url":"http://www.jpost.com/middle-east/iran-news/2026-08-28/live-updates-906868"},{"headline":"IDF Kills Hamas Commander in Gaza and Jenin Cell Leader in West Bank","body":"Israeli forces killed Hamas commander Nabil Ibrahim Bass in Gaza's Al-Shati area on August 27 and, in a rare West Bank strike the next day, killed former Jenin terror-cell leader Qais Bitwani. The West Bank operation came even as the IDF faces US pressure to scale back strikes in Gaza amid the fragile ceasefire framework. The dual strikes underscore Israel's continued targeting of militant leadership on two fronts even as attention remains fixed on the broader regional fallout from the Iran war.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-august-28-2026/"},{"headline":"Syria's Sharaa Appoints Kurdish SDF Leader as Presidential Adviser","body":"Syrian President Ahmed al-Sharaa appointed Mazloum Abdi, the former commander of the Kurdish-led Syrian Democratic Forces, as an adviser to the presidency, according to a decree published by state news agency SANA. The move follows Abdi's announcement that the SDF would dissolve under an integration deal with Damascus, a major step in consolidating Sharaa's authority over Syria's northeast. Damascus's education ministry also authorized Kurdish-language instruction in public and private schools, signaling a broader accommodation with Kurdish communities after years of autonomy.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-august-28-2026/"}],"techAI":{"aiCompetition":[{"headline":"Federal Judge Strikes Down Pentagon's Blacklisting of Anthropic","body":"U.S. District Judge Rita Lin ruled Thursday that Defense Secretary Pete Hegseth's move to brand Anthropic a national-security supply-chain risk was unconstitutional retaliation for the company's criticism of the administration, vacating the designation in a 59-page opinion. Lin found the Pentagon acted arbitrarily and had already continued pursuing Claude for military systems even after the designation, undercutting claims the company was a genuine sabotage risk. The Pentagon is expected to appeal, and a separate Anthropic case over a related risk designation remains pending in the D.C. Circuit, but the win removes a major legal cloud as Anthropic pushes toward an IPO that investors reportedly expect to value the company above 2 trillion dollars.","source":"NOTUS / Axios / CNBC","url":"https://www.notus.org/courts/judge-says-pentagon-illegally-blacklisted-anthropic"},{"headline":"India-Based AM Intelligence Locks In $8B Vera Rubin Order, Signaling Asia's AI Buildout","body":"Greenko Group's Hyderabad-based AM Intelligence has placed a binding order for roughly 9,000 Nvidia Vera Rubin NVL72 rack-scale systems for delivery in Q1 2027, positioning itself as one of Asia's first frontier-scale Vera Rubin clusters. The company plans about 8 billion dollars in capital spending to bring 200 megawatts online near-term, scaling toward a full gigawatt of compute-as-a-service across India, the U.S., Finland and Malaysia, with a U.S. customer already reserving initial capacity. The move underscores how compute capacity, not just model design, is becoming the central front in the U.S.-China-adjacent race for AI dominance across the Indo-Pacific.","source":"AI Weekly","url":"https://aiweekly.co/ai-news-today"}],"cyberEmerging":[{"headline":"Qilin Ransomware Gang Claims Breach of ATF Investigation Systems","body":"The Bureau of Alcohol, Tobacco, Firearms and Explosives confirmed hackers breached a system containing investigation-related data, after the prolific Qilin ransomware group added the agency to its leak site without yet releasing samples. Qilin has been one of the most active ransomware operations of the past year, having previously hit Kuala Lumpur International Airport, Japanese beverage giant Asahi, and the government of Palau. The intrusion into a federal law-enforcement agency handling firearms investigations raises fresh concerns about ransomware crews probing U.S. government networks even as other cyber task forces claim wins elsewhere.","source":"The Record (Recorded Future News)","url":"https://therecord.media/doj-atf-cyberattack-qilin-ransomware"},{"headline":"Palo Alto Networks Warns AI Is Tipping Cyber Balance Toward Attackers","body":"Researchers from Palo Alto Networks told reporters this week that adversaries' growing use of AI has produced a generational shift in the balance between defenders and attackers, based on the firm's ongoing research into frontier-model misuse. The briefing comes as separate incidents this week, including a breach exposing data on 8.7 million customers of Manchester Airports Group, illustrate how quickly stolen personal data can be weaponized for AI-assisted phishing and scams. Policymakers are increasingly citing findings like these to justify tighter mandates on how frontier labs test and disclose offensive cyber capabilities before deployment.","source":"Cybersecurity Dive","url":"https://www.cybersecuritydive.com/news/frontier-ai-tipping-scales-cyber-adversaries/829088/"}]},"cities":{"lasVegas":[{"headline":"Governor Seeks Federal Aid as Hawk Fire Devastates Reno-Area Homes","body":"The Hawk Fire, which ignited Aug. 22 in the hills northwest of Reno, has scorched more than 15,000 acres and destroyed multiple homes, including that of resident Crystal Hallock. At its peak the blaze triggered evacuation orders or warnings for roughly 90,000 people in the Truckee Meadows area. Gov. Joe Lombardo is now pressing Washington for a presidential emergency declaration to unlock federal recovery funds for the fire-scarred region.","source":"Las Vegas Sun","url":"https://lasvegassun.com/news/breakingnews/"},{"headline":"911 Recordings Surface in Fatal Shooting of Metro Officer","body":"Newly released 911 call audio shows a documented history of prior police encounters with the man accused of fatally shooting Las Vegas Metro Officer Austin Abdelnabi. The recordings became public this week and are expected to shape both the ongoing homicide investigation and eventual court proceedings. Metro has largely deferred further comment while the case proceeds through the legal system.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"F1 Construction Set to Snarl Strip-Area Streets Starting Next Week","body":"Crews preparing for this year's Formula 1 Las Vegas Grand Prix begin track-related construction next week, bringing overnight lane reductions on Koval Lane and Harmon Avenue near the Strip. The work marks the start of months of infrastructure changes ahead of race weekend. Commuters, rideshare drivers and tourists should brace for rolling closures through the fall.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"}],"nellis":[{"headline":"Drone Wingmen Put Through Their Paces at Creech AFB","body":"Air Force Collaborative Combat Aircraft (CCA) drones landed at Creech Air Force Base in late July, flying multiple sorties, carrying inert air-to-air munitions and refueling alongside crewed fighters during a closely watched exercise. Officials say the autonomous jets successfully integrated with manned platforms to rehearse distributed combat scenarios, with representatives of the Royal Netherlands Air and Space Force observing given their own recent buy-in to the CCA program. Program leaders have said they now hope to fly the drones during a future Red Flag exercise at nearby Nellis Air Force Base.","source":"Air & Space Forces Magazine","url":"https://www.airandspaceforces.com/ccas-creech-air-forces-drone-base-exercise/"}]},"feelGood":[{"headline":"Crossing Guard's Split-Second Save Caught on Dashcam","body":"Dashcam video circulating this week shows a Las Vegas school crossing guard yanking children out of the path of a speeding car, an intervention that likely prevented a tragedy. Parents and school officials have praised the guard's quick reaction, and the clip has been widely shared across local news outlets. It's a small but powerful reminder of the vigilance crossing guards bring to Clark County streets every morning.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"},{"headline":"Air Force Rescue Crew Pulls Downed Navy Aviators to Safety","body":"Air Force pararescue Airmen carried out a rapid rescue of a downed Navy helicopter crew in mid-August, the latest in a steady stream of saves logged by military rescue units this year. Guard and active-duty pararescue teams have separately hoisted stranded rafters off an Alaska river, recovered a mariner some 700 nautical miles offshore, and revived a fishing-trip stroke victim in recent months. Each mission underscores the volunteer ethos that defines the pararescue community, whose creed is built around saving lives regardless of risk.","source":"That Others May Live","url":"https://www.thatothersmaylive.org/news-media"},{"headline":"A Knock on the Door Turns Into an Unexpected Family","body":"An 86-year-old woman living alone with no nearby family gained an unlikely companion after a neighbor named Heidi, initially annoyed by noise from the apartment upstairs, knocked to investigate. The awkward first meeting blossomed into a genuine friendship, with the older woman now calling Heidi the granddaughter she never had. The story, highlighted this week by Sunny Skyz, is a small, specific example of how one act of curiosity can ease an elderly person's isolation.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1842","event":"The Treaty of Nanking was signed, ending the First Opium War and ceding Hong Kong to Britain."},{"year":"1949","event":"The Soviet Union successfully tested its first atomic bomb, ending the US nuclear monopoly."},{"year":"1957","event":"US Senator Strom Thurmond began the longest one-person filibuster in Senate history, opposing the Civil Rights Act."},{"year":"2005","event":"Hurricane Katrina made landfall on the US Gulf Coast, causing catastrophic flooding in New Orleans."}]},"topPicks":[{"headline":"FBI and DOJ Dismantle China-Linked Botnet That Hit NASA, the Fed, and the Senate","teaser":"US authorities took down a major state-linked botnet that had compromised key government and financial institutions."},{"headline":"Pentagon Says Patriot and ATACMS Stocks in Europe Are 'Beyond Critical'","teaser":"A dire munitions shortage warning signals mounting strain on NATO's ability to sustain Ukraine and its own defenses."},{"headline":"Russia Pounds Kyiv With Record Air Raid Alerts After CIA Chief's Moscow Visit","teaser":"An intense escalation in strikes on Kyiv follows high-level US-Russia contact, raising fresh concerns over the war's trajectory."}]},"navDates":[{"key":"2026-08-31","label":"Aug 31","href":"/","isNewest":true},{"key":"2026-08-30","label":"Aug 30","href":"/archive/2026-08-30.html","isNewest":false},{"key":"2026-08-29","label":"Aug 29","href":"/archive/2026-08-29.html","isNewest":false},{"key":"2026-08-28","label":"Aug 28","href":"/archive/2026-08-28.html","isNewest":false},{"key":"2026-08-27","label":"Aug 27","href":"/archive/2026-08-27.html","isNewest":false},{"key":"2026-08-26","label":"Aug 26","href":"/archive/2026-08-26.html","isNewest":false},{"key":"2026-08-24","label":"Aug 24","href":"/archive/2026-08-24.html","isNewest":false}],"currentKey":"2026-08-29","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-29.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
