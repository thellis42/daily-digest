<script>
const STATE = {"digest":{"date":"Friday, September 4, 2026","generatedAt":"Fri, Sep 4, 8:04 AM PDT","breaking":{"headline":"Iran War Escalates as US Strikes IRGC Targets, Tehran Hits Back at American Bases","body":"US Central Command launched fresh airstrikes against Islamic Revolutionary Guard Corps targets inside Iran on September 1 after Tehran attacked commercial tankers in the Strait of Hormuz, pushing the six-month-old war into its 187th day. Under a new 'tanker-for-tanker' response policy, roughly 40 vessels transited the strait under US Navy escort while American forces intercepted several IRGC anti-ship missiles and drones without losses. Iran says it struck US bases in Bahrain, Jordan and Iraq in retaliation and that a US strike killed five people at a wedding in Sirik, part of a toll Tehran puts at 11 dead nationwide over 48 hours. The flare-up shows how unresolved the conflict remains despite a June ceasefire memorandum that had briefly reopened the strait to shipping.","source":"GlobalSecurity.org / Axios","url":"https://www.globalsecurity.org/military/ops/iran-war-oprep.htm"},"tabs":{"defense":{"defense":[{"headline":"Air Force's New Nuclear-Silo Helicopter Reaches Initial Operational Capability","body":"Boeing's MH-139 Grey Wolf helicopter has achieved initial operational capability, Air Force Global Strike Command announced, clearing it to begin patrolling the nuclear missile fields that have long relied on Vietnam-era UH-1N Hueys. The milestone allows a phased replacement of the aging silo-security helicopter fleet at bases such as Malmstrom, Minot and F.E. Warren. It is a notable step for a program that has faced years of cost and schedule scrutiny from Congress.","source":"InsideDefense","url":"https://insidedefense.com/"},{"headline":"Pentagon Stands Up Mobile Network of Secure Facilities for Classified Work","body":"The Defense Department has launched a new mobile secure-facility network intended to let classified defense work happen outside fixed, hardened buildings, according to a September 4 report. The initiative aims to give program offices and contractors faster, more flexible access to sensitive compartmented information facilities as the Pentagon speeds up AI-related and software development. The move reflects a broader push to modernize how classified work is conducted amid rising demand from AI and cyber programs.","source":"The Defense Post","url":"https://thedefensepost.com/"},{"headline":"UK Cuts Army Training as Budget Strain Deepens","body":"The British Army is scaling back training exercises as budget pressures mount, according to a September 4 report, raising concerns among allies about readiness in one of NATO's largest European force contributors. The cuts come as London balances rising personnel and equipment costs against a strained defense budget, even as the UK has pledged deeper support for NATO's eastern flank. Analysts warn a reduced training tempo could erode interoperability with US and other NATO forces at a time of heightened alliance activity.","source":"The Defense Post","url":"https://thedefensepost.com/"}],"acquisitions":[{"headline":"AeroVironment Wins Army's First Directed-Energy Production Contract","body":"AeroVironment has been awarded a $465 million contract for the Army's Enduring High Energy Laser (E-HEL) program, marking the Pentagon's first production-scale contract for a directed-energy weapon. The award signals the Army's shift from prototyping lasers to fielding them as counter-drone and short-range air defense tools. It follows years of testing under earlier high-energy laser demonstrators and reflects growing urgency to counter cheap drone swarms threatening forward-deployed units.","source":"InsideDefense","url":"https://insidedefense.com/"},{"headline":"Northrop Grumman Lands $862.8 Million Army Deal for Precision Guidance Kits","body":"Northrop Grumman was awarded an $862.8 million indefinite-delivery/indefinite-quantity contract on September 3 to manufacture and deliver M1156 precision guidance kits and variants that convert unguided artillery shells into precision munitions. The deal, managed by Army Contracting Command in Newark, New Jersey, runs through September 2031 and was competitively solicited, though only one bid was received. The kits are central to the Army's effort to stretch artillery stockpiles strained by sustained munitions demand tied to Ukraine and other theaters.","source":"GlobalSecurity.org (DoD Contracts)","url":"https://www.globalsecurity.org/military/library/news/2026/09/dod-contracts_4590748.htm"}]},"us":[{"headline":"Missouri Supreme Court Blocks Trump-Backed Congressional Map","body":"Late Thursday night, Missouri's highest court halted a Republican-drawn congressional map that President Trump had pushed to help the GOP pick up a House seat ahead of the midterms. The ruling is being read as a meaningful check on the broader Republican mid-decade redistricting push that has already reshaped maps in Texas and Florida. Democrats are calling it a rare win in the redistricting wars, though the state could still appeal or attempt a revised map before candidate filing deadlines close in.","source":"NBC News","url":"https://www.nbcnews.com/politics"},{"headline":"DOJ Asks Supreme Court to Fast-Track USPS Mail-Ballot Rules","body":"Solicitor General D. John Sauer filed an emergency appeal Thursday asking the justices to lift a Massachusetts federal judge's block on new Postal Service rules requiring states to hand over voter lists and conform to strict ballot-envelope specs before mail ballots go out. The timing is pointed: North Carolina was set to begin mailing its own ballots Friday, and the administration argues further delay risks chaos less than two months before the midterms. Democratic state attorneys general and Senate Democratic Leader Chuck Schumer countered that USPS's own compliance portal isn't even built yet, calling the rule an attempt to make voting harder heading into November.","source":"CNN","url":"https://www.cnn.com/2026/09/03/politics/trump-asks-supreme-court-to-ok-sweeping-changes-for-mail-ballots"},{"headline":"August Payrolls Blow Past Forecasts, Easing Recession Fears","body":"The Bureau of Labor Statistics reported Friday that employers added 162,000 jobs in August, triple the 53,000 Wall Street had penciled in, while unemployment held steady at 4.1 percent. It was the strongest monthly hiring gain since March and a sharp reversal from a sluggish early-summer stretch that had shown a combined loss of roughly 3,000 jobs in June and July. The upside surprise now shifts the Federal Reserve's attention to next week's inflation data as it finalizes its rate decision at the September 17 meeting.","source":"CNBC","url":"https://www.cnbc.com/2026/09/04/jobs-report-august-2026.html"},{"headline":"Layoffs Hit Four-Year Low, Complicating the AI-Jobs-Loss Narrative","body":"Outplacement firm Challenger, Gray & Christmas reported Thursday that planned layoffs through the first eight months of 2026 fell to their lowest level in four years, even as hiring announcements climbed to their highest point since 2023. Apollo Global's chief economist Torsten Sløk pointed to the data as evidence that fears of AI-driven mass layoffs have not materialized in the broader labor market so far this year. The numbers land just as economists debate whether automation, tariffs, and geopolitical uncertainty are quietly reshaping hiring patterns ahead of the midterms.","source":"Yahoo Finance","url":"https://finance.yahoo.com/economy/live/august-jobs-report-live-updates-labor-market-155619193.html"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Requests Record $55.6B Defense Budget Centered on AI and Long-Range Strike","body":"Japan's Ministry of Defense submitted a record 8.9 trillion yen ($55.6 billion) budget request for fiscal year 2027, up from last year's initial $55 billion ask that was ultimately raised to $56.4 billion. The request prioritizes unm"}],"pacingThreat":[]},"europe":{"ukraineRussia":[{"headline":"Front-line gains slow to a crawl even as diplomacy accelerates","body":"New OSINT tracking shows Russia's territorial advance has slowed sharply, with DeepState data showing a net gain of only about 5 square miles between August 4 and September 1, down from 13 square miles the prior month; ISW's independent count puts the figure higher, around 40 square miles, but both trend lines point to a grinding, low-mobility fight rather than a breakthrough. The slowdown comes as both sides funnel resources into long-range strike campaigns rather than ground offensives, with Kyiv signaling new retaliatory measures against Russian attacks on its infrastructure.","source":"Russia Matters","url":"https://www.russiamatters.org/news/russia-ukraine-war-report-card/russia-ukraine-war-report-card-sept-2-2026"},{"headline":"Trump envoys plan first Kyiv trip as Moscow contacts multiply","body":"President Zelensky said he was briefed by envoys Steve Witkoff and Jared Kushner after their latest Moscow trip, with both men now expected to travel to Kyiv for the first time in the coming weeks. The diplomatic churn also included a rare visit to Moscow by CIA Director John Ratcliffe and a surprise appearance by Russian Finance Minister Anton Siluanov at a G20 finance meeting in North Carolina, even as Putin was attending a summit in Bishkek. Zelensky cautioned that Russian intelligence suggests Putin personally still wants to keep fighting, despite polling showing most Russians would accept a ceasefire along the current front line.","source":"RFE/RL","url":"https://www.rferl.org/a/zelenskyy-witkoff-kushner-trump-siluanov-g20/33844287.html"}],"europe":[{"headline":"Allies accelerate spending and hybrid-threat defenses","body":"The UK is now projected to hit 3 percent of GDP in defense spending by 2030, while Sweden has formally signed a contract to buy new frigates from France, both signs of the alliance-wide buildup Washington has been pressing for as it reduces its own conventional footprint in Europe. Separately, Poland is investigating whether a fire at a drone production facility was an act of sabotage, part of a broader pattern of suspected Russian hybrid activity, including drone incursions and disputed weapons caches, that has become a near-weekly occurrence across the Baltic states and Germany.","source":"Bloomberg","url":"https://www.bloomberg.com/latest/nato"},{"headline":"Migration crisis intensifies on Spain's southern approaches","body":"At least five migrants died this week attempting to reach Spain's Canary Islands aboard a wooden vessel, one of the deadliest known incidents on that Atlantic route in recent months. At the same time, unrest has broken out in Ceuta as local authorities and aid groups struggle to house and process a growing number of migrants and asylum seekers arriving in the Spanish enclave, underscoring how migration pressure remains the most acute non-security strain on Spain and, by extension, broader EU asylum policy heading into autumn.","source":"Al Jazeera","url":"https://www.aljazeera.com/europe/"}]},"middleEast":[{"headline":"Yemen's civil conflict flares as regional war spills over","body":"Heavy fighting between Yemeni government forces and Iran-backed Houthi rebels in the country's southwest killed at least 25 people on September 3, marking one of the deadliest single days of internal Yemeni combat in recent weeks. The uptick reflects how the wider US-Iran confrontation has emboldened or destabilized Tehran's regional proxy network, with Houthi forces appearing to press harder against government-held territory even as Iran itself remains under military pressure.","source":"Xinhua","url":"https://english.news.cn/list/World-MiddleEast.htm"},{"headline":"Israel releases more detained Lebanese civilians amid occupation of the south","body":"Israel handed over four more Lebanese civilians to authorities via the Red Cross on September 4, a day after freeing the first detainee under a bilateral arrangement between Beirut and Jerusalem. The releases come even as Israeli troops continue to occupy a significant swath of southern Lebanon, a foothold established after fighting with Hezbollah resumed just two days into the wider US-Israel campaign against Iran, leaving the release deal as a rare de-escalatory signal amid an otherwise tense standoff.","source":"Associated Press via KSAT","url":"https://www.ksat.com/news/world/2026/09/04/an-israeli-release-a-shipping-slowdown-and-other-mideast-news/"},{"headline":"Hormuz traffic stays depressed as Netanyahu talks up regime change","body":"Commercial shipping through the Strait of Hormuz remains well below normal levels days after the US and Iran traded strikes for the first time in a month, contributing to record US diesel prices averaging $5.85 a gallon. Israeli Prime Minister Benjamin Netanyahu said on September 4 that toppling Iran's government is now achievable, a claim that risks hardening Tehran's position even as global markets absorb the economic fallout from disrupted Gulf shipping lanes.","source":"Britannica / Xinhua","url":"https://www.britannica.com/event/2026-Iran-war"}],"techAI":{"aiCompetition":[{"headline":"OpenAI Rolls Out Astra, Its Most Capable Coding and Cyber Model Yet","body":"OpenAI began pushing its new flagship model, internally called Astra, to ChatGPT Plus, Pro, Business and Enterprise users, plus its API and Amazon Web Services, in the past day. The company says Astra sets new highs in computer-use tasks, scientific reasoning and offensive/defensive cybersecurity work, prompting OpenAI to simultaneously warn about the model's dual-use risk to critical infrastructure. The release intensifies the enterprise fight with Anthropic and Google, both of which have shipped rival 'cyber-capable' models in recent weeks.","source":"CNBC","url":"https://www.cnbc.com/2026/09/03/open-ai-astra-gpt-6-cyber.html"},{"headline":"Nvidia's $12.9 Billion Hugging Face Deal Surfaces Fresh Details","body":"Hugging Face's leadership disclosed to CNBC that it approached Nvidia CEO Jensen Huang weeks before the two sides struck a $12.9 billion acquisition agreement, folding one of the AI world's most widely used open-model hubs into Nvidia's ecosystem. The tie-up gives Nvidia deeper control over the open-source model distribution layer just as Chinese labs such as DeepSeek, Moonshot and Z.ai are using permissive licensing to win developers away from US frontier labs. It underscores how compute providers, not just model builders, are consolidating leverage in the US-China AI race.","source":"CNBC","url":"https://www.cnbc.com/2026/09/03/open-ai-astra-gpt-6-cyber.html"}],"cyberEmerging":[{"headline":"OpenAI Commits $1 Billion to Arm Cyber Defenders With AI","body":"OpenAI unveiled 'Daybreak for Frontline Defenders,' a $1 billion subsidized-access program giving critical infrastructure operators, water and electric utilities, community banks and local governments free or discounted use of its Daybreak cyber models over the next six months. The initiative, part of a broader coalition of more than 150 organizations, is framed as closing a narrowing 'defender's window' before AI-enabled attacks scale up globally. It follows OpenAI's own admission that frontier models like Astra now carry advanced offensive cyber capability, sharpening the policy debate over how fast such tools should be released.","source":"OpenAI / Releasebot","url":"https://releasebot.io/updates/openai"},{"headline":"Anthropic Warns China Is Weaponizing Model Distillation to Close the AI Gap","body":"Anthropic published new analysis describing how China-based labs are running large-scale 'distillation attacks' -- using fraudulent accounts to systematically extract outputs from US frontier models and replicate their capabilities cheaply. The company argues this practice, now reportedly spreading to dark-web marketplaces, lets Chinese firms free-ride on billions of dollars of American R&D and blunt the effect of chip export controls. Anthropic is urging Washington to tighten compute restrictions and crack down on distillation as a matter of national security, aligning with recent congressional pushes like the Remote Access Security Act.","source":"Anthropic","url":"https://www.anthropic.com/research/2028-ai-leadership"}]},"cities":{"lasVegas":[{"headline":"Zoox Launches Driverless Robotaxi Service at Harry Reid Airport","body":"Amazon-owned Zoox began operating its first fully autonomous robotaxi route out of Las Vegas' Harry Reid International Airport on Thursday, September 3, letting travelers hail a driverless ride from Terminals 1 and 3 straight to the Strip. It marks a significant expansion of the company's Vegas footprint beyond its existing Strip-area service and positions the city as a proving ground for airport-to-resort autonomous transit. The rollout comes amid a broader race among robotaxi operators to establish an early foothold in high-tourist-traffic markets.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"},{"headline":"Stadium Authority Commits $75 Million to Raiders' Allegiant Plaza","body":"The Las Vegas Stadium Authority approved pulling $75 million from an existing capital fund to help the Raiders build a new $158 million North Entry plaza at Allegiant Stadium. The public-private funding split underscores continued taxpayer involvement in stadium upgrades even years after the venue's 2020 opening. Construction details and a timeline for the plaza have not yet been finalized publicly.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"},{"headline":"Couple Indicted After Driving Armed Into Nevada National Security Site","body":"A federal grand jury indictment unsealed this week charges Jessica Zamora and Treyvon Jameel Currie after they allegedly drove an unregistered Saturn sedan onto the Department of Energy's Nevada National Security Site near Losee Road and North 5th Street while in possession of a gun. Their attorney has claimed the pair simply made a wrong turn onto the restricted federal property rather than intentionally breaching the secure nuclear test site. The case highlights ongoing security sensitivities around the sprawling site north of Las Vegas.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Nellis and Creech Airmen Central to U.S. Iran War Footing","body":"As American operations against Iran intensify, Nellis Air Force Base and Creech Air Force Base in Indian Springs remain a nerve center for the effort, according to David Radcliffe, president of the Nellis Support Team, who noted Nellis serves as the Air Force's hub for operational testing, tactics development, and hosts the elite USAF Weapons School. Radcliffe pointed out that the current Chairman of the Joint Chiefs of Staff, General Kane, is himself a Weapons School graduate, illustrating how training pipelines rooted in Las Vegas feed directly into top-level wartime decision-making. Large-scale exercises like Red Flag, routinely run out of Nellis, continue to sharpen aircrew readiness that is now being applied in real-world combat over Iran.","source":"KTNV","url":"https://www.ktnv.com/news/southern-nevadas-role-in-the-iran-war-effort-nellis-creech-at-the-center-of-u-s-military-operations"}]},"feelGood":[{"headline":"Fisherman Pulled Alive From Underwater Cave After 15 Days","body":"A fisherman who vanished inside an unmapped underwater cave in Mexico was found alive after 15 days trapped in total darkness, thanks to specialist cave divers who kept pushing deeper into the flooded passages despite dwindling odds. The rescue stunned local officials who had largely given up hope of a survivor after more than two weeks underground. His survival is being credited to small air pockets in the cave system and the divers' refusal to abandon the search.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Idaho Teens Turn Viral Summer Fun Into Boise River Cleanup Mission","body":"A group of eight Idaho teenagers who spent their summer building a large social media following around river outings decided to redirect that attention toward organizing cleanup efforts along the Boise River. What began as a fun account chronicling their adventures evolved into a genuine community environmental campaign, drawing other young people into hands-on conservation work. The group's shift from viral fame to civic action has been cited as a model for youth-led local stewardship.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Olivia Rodrigo Quietly Covers Stranger's College Tuition","body":"Pop star Olivia Rodrigo privately paid off the remaining college tuition for a University of Alabama graduate after learning of her financial struggles, reaching out with a personal message rather than a public gesture. The recipient said the singer told her she did not owe anything in return, framing the gift as unconditional support rather than charity with strings attached. The act reflects a growing trend of celebrities using direct, low-publicity giving to change individual lives.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1781","event":"Spanish settlers founded the city of Los Angeles, California."},{"year":"1957","event":"Ford Motor Company publicly introduced its new Edsel line of automobiles."},{"year":"1972","event":"Swimmer Mark Spitz won his seventh gold medal of the Munich Olympics, setting a new record."},{"year":"1998","event":"Larry Page and Sergey Brin incorporated Google, launching what would become a tech giant."}]},"topPicks":[{"headline":"Iran War Escalates as US Strikes IRGC Targets, Tehran Hits Back at American Bases","teaser":"Direct US-Iran military clashes raise fears of a broader Middle East war with global energy and security stakes."},{"headline":"August Payrolls Blow Past Forecasts, Easing Recession Fears","teaser":"Stronger than expected jobs data calms markets and reshapes expectations for the Fed's next policy moves."},{"headline":"Trump envoys plan first Kyiv trip as Moscow contacts multiply","teaser":"New diplomatic movement between Washington, Kyiv and Moscow could reshape the trajectory of the Ukraine war."}]},"navDates":[{"key":"2026-09-04","label":"Sep 4","href":"/","isNewest":true},{"key":"2026-09-03","label":"Sep 3","href":"/archive/2026-09-03.html","isNewest":false},{"key":"2026-09-02","label":"Sep 2","href":"/archive/2026-09-02.html","isNewest":false},{"key":"2026-09-01","label":"Sep 1","href":"/archive/2026-09-01.html","isNewest":false},{"key":"2026-08-31","label":"Aug 31","href":"/archive/2026-08-31.html","isNewest":false},{"key":"2026-08-30","label":"Aug 30","href":"/archive/2026-08-30.html","isNewest":false},{"key":"2026-08-29","label":"Aug 29","href":"/archive/2026-08-29.html","isNewest":false}],"currentKey":"2026-09-04","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
