<script>
const STATE = {"digest":{"date":"Saturday, August 8, 2026","generatedAt":"Sat, Aug 8, 5:38 AM PDT","breaking":{"headline":"US Intelligence Warns Putin May Test NATO's Resolve Within Years","body":"New US intelligence assessments reported by the Wall Street Journal conclude that Vladimir Putin could attempt a limited attack on a NATO member sometime between this fall and 2029, ranging from cyberattacks to a small-scale ground incursion, most likely aimed at the Baltics or Poland. Officials say this marks a shift from earlier estimates that Moscow would avoid directly provoking the alliance while bogged down in Ukraine. The warning lands alongside separate reporting that US stockpiles of precision long-range missiles and air-defense interceptors have been severely depleted, raising doubts about Washington's ability to backstop a rapid NATO response.","source":"CNN","url":"https://www.cnn.com/2026/08/07/politics/us-intelligence-russia-putin-nato-attack"},"tabs":{"defense":{"defense":[{"headline":"Trump-Hegseth Clash Over Missile Stockpile Depletion","body":"Reporting this week revealed that the US has burned through nearly all of its most accurate long-range strike missiles, a shortfall Reuters says factored into Trump's decision to hold off on renewed massive strikes against Iran. The Washington Post reported Trump confronted Defense Secretary Pete Hegseth over the issue at Camp David, while Trump publicly denied any shortage on social media and ordered a leak investigation targeting officials who spoke to reporters. The episode underscores growing concern inside the Pentagon that munitions production has not kept pace with the demands of simultaneous crises involving Russia, China, and Iran.","source":"Washington Post","url":"https://www.washingtonpost.com/national-security/2026/08/05/trump-hegseth-clashed-camp-david-over-iran-missile-depletion-concerns/"},{"headline":"Navy Eyes Undersea Drone Launchers for Next-Gen Attack Submarines","body":"The US Navy is pushing to integrate modular payload launchers on its future attack submarine fleet that could deploy undersea weapons and unmanned drones, expanding the boats' strike and reconnaissance flexibility. The move reflects a broader Navy effort to pair traditional torpedo and missile tubes with unmanned systems as the service looks toward the successor to the Virginia-class line. Officials see this as critical to maintaining an undersea edge over China's rapidly modernizing submarine and anti-access forces in the Pacific.","source":"FDD Overnight Brief","url":"https://www.fdd.org/overnight-brief/august-7-2026/"},{"headline":"Japan Test-Fires Tomahawk Capable of Striking Chinese Territory","body":"Japan test-launched a Tomahawk cruise missile from the destroyer Chokai on July 29, part of a US-supplied buy of 400 missiles with a roughly 1,600-kilometer range that could reach mainland China if fired from waters near Japan. Tokyo's newly released 2026 Defense White Paper, published August 4, singled out Chinese short-of-war coercion as a top threat and noted deepening China-Russia-North Korea military cooperation. Analysts see the test as proof Tokyo is pressing ahead with its counterstrike capability despite earlier concerns that delayed US missile shipments could slow the rollout.","source":"American Enterprise Institute (AEI)","url":"https://www.aei.org/commentary/china-taiwan-update-august-7-2026/"}],"acquisitions":[{"headline":"Pentagon Splits $25.4 Billion Microelectronics Deal Among Boeing, Lockheed, BAE","body":"The Defense Department awarded Boeing, Lockheed Martin, and BAE Systems a combined indefinite-delivery, indefinite-quantity contract with a $25.36 billion ceiling under the Defense Microelectronics Activity program, announced Friday. The five-year base agreement, with two option periods extending it to a decade, is meant to help the Pentagon field emerging chip technologies and close capability gaps as legacy electronics become obsolete. The award was competitively procured and drew 17 offers before the three firms were selected.","source":"MarketScreener/Dow Jones","url":"https://in.marketscreener.com/news/boeing-lockheed-bae-awarded-defense-microelectronics-activity-contracts-ce7e58dfdb8bf523"},{"headline":"Space Force Diversifies Missile-Tracking Satellite Suppliers with $615 Million Award","body":"The US Space Force awarded $615 million across three additional contracts to Rocket Lab, Systems and Technologies Research, and an undisclosed third vendor to develop Space-Based Airborne Moving Target Indicator capabilities, announced August 4. The move is intended to broaden the supplier base and diversify sensing technologies beyond SpaceX, which won a $4.16 billion contract in May to stand up an initial AMTI satellite constellation by 2028. Eight companies, including L3Harris, Lockheed Martin, and Northrop Grumman, remain in the qualified vendor pool for future task orders.","source":"Aviation Week","url":"https://aviationweek.com/space/satellites/pentagon-awards-more-space-based-airborne-target-tracking-contracts"}]},"us":[{"headline":"Senate Confirms Todd Blanche as Attorney General in Party-Line Squeaker","body":"In an overnight session ending around 4:30 a.m. Saturday, the Senate confirmed Todd Blanche, Trump's former personal defense lawyer, as the nation's 88th attorney general by a 50-49 margin, with Republicans Susan Collins and Lisa Murkowski joining every Democrat in opposition. Blanche had been serving in an acting capacity since April after Trump ousted Pam Bondi, and his confirmation was in doubt until Louisiana-primary-loser Bill Cassidy announced his support Friday. Holdouts including Senators Cornyn and Tillis had also demanded written assurance that a controversial $1.8 billion 'Anti-Weaponization Fund,' tied to a settlement over Trump's leaked tax returns, would be shut down before backing him.","source":"NPR / CNN / The Hill","url":"https://www.npr.org/2026/08/08/g-s1-137631/senate-confirms-todd-blanche-attorney-general"},{"headline":"Senate Passes Sweeping Russia-Iran Sanctions Bill Named for Late Sen. Graham","body":"The Senate voted 86-11 Friday to pass the Lindsey O. Graham Sanctioning Russia and Iran Act of 2026, a measure that stalled for over a year before Graham's death in July from an aortic dissection gave it new momentum. The bill lets Trump impose tariffs up to 100 percent on the five largest buyers of Russian oil and gas -- a group likely to include China and India -- while also sanctioning Russian officials, oligarchs, banks and the so-called shadow fleet of tankers evading existing restrictions. It also extends Iran-related energy and weapons sanctions through 2031, though the measure still needs House action once lawmakers return from August recess.","source":"CBS News / NOTUS","url":"https://www.cbsnews.com/news/russia-sanctions-bill-iran-senate-lindsey-graham/"},{"headline":"Senate Approves Stopgap Funding Bill to Avert Fall Shutdown","body":"Senators voted 90-6 to pass a short-term continuing resolution that would fund the government from the October 1 start of the new fiscal year through December 11, sidestepping a shutdown fight just weeks before November's midterms. The bill notably excludes emergency funding Trump had sought for Iran-war-related costs and a contested voter-ID provision, signaling limits on the president's leverage over the appropriations process even with Republicans controlling both chambers. The measure sets up another funding cliff right after the midterm elections.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-08-08/us-senate-passes-spending-bill-that-ignores-trump-s-priorities"},{"headline":"Trump Signals Break With Thune Amid GOP Base Anger Ahead of Midterms","body":"President Trump told allies that Republican voters are 'very angry' with congressional GOP leadership and pointedly declined to endorse Senate Majority Leader John Thune for another term at the helm, according to reporting circulating Friday into Saturday. The comments come as Senate Republicans just delivered Trump a bruising loss on emergency war funding and voter-ID provisions stripped from the stopgap spending bill, exposing friction between the White House and Senate leadership ahead of the November midterms. The rift adds uncertainty to GOP leadership races expected after this year's elections.","source":"Punchbowl News","url":"https://punchbowl.news/"}],"pacific":{"pacificCommand":[{"headline":"Tokyo's 2026 Defense White Paper Frames Rearmament as Economic Strategy","body":"Japan's Cabinet approved its 2026 Defense of Japan white paper on August 4, again labeling China as its greatest strategic challenge while warning that PLA forces are pushing operations beyond the First Island Chain into the broader Pacific. Beyond threat assessments, the document breaks new ground by pitching the buildup itself as an engine of growth, tying expanded drone production and a stronger domestic arms industry to job creation and innovation. FY2026 defense outlays, including U.S. force realignment costs, topped 9 trillion yen for the first time, and Tokyo is moving up a planned revision of its three core security documents to later this year.","source":"USNI News","url":"https://news.usni.org/2026/08/05/japan-plans-to-transform-military-capabilities-with-drones-boost-domestic-defense-industry"},{"headline":"Indian Ocean Airspace Closure Fuels Speculation of Classified Agni-6 ICBM Test","body":"A no-fly notice covering the Indian Ocean issued for August 6-7 has triggered speculation that New Delhi conducted a covert test of its long-range Agni-6, also referred to as Surya, which would extend India's deterrent reach well beyond regional rivals. The timing coincides with a diplomatically busy week for India, which is simultaneously hosting BRICS trade ministers in Jaipur, underscoring Delhi's effort to project both economic and strategic weight. If confirmed, the test would mark a significant step in India's push for a credible long-range strike capability amid its broader defense-industrial pivot away from Russian platforms.","source":"Indian Defence News","url":"https://www.indiandefensenews.in/"},{"headline":"Manila's ASEAN Chairmanship Fails to Harden South China Sea Language","body":"Despite holding the pen as 2026 ASEAN chair and timing the Foreign Ministers' Meeting to the tenth anniversary of the 2016 arbitral ruling against Beijing, the Philippines could not secure stronger South China Sea language in the bloc's communique, which ended up nearly identical to the text Malaysia produced the year before. The setback comes after a violent July in which Chinese and Philippine vessels clashed three separate times in a single week near Scarborough and Second Thomas Shoals, prompting fresh trilateral drills with the United States and Japan. A former Philippine Supreme Court justice has since urged Manila to file additional arbitration cases over Chinese restrictions on Filipino fishermen, arguing the chairmanship should not be used as an excuse for restraint.","source":"Asia Times","url":"https://asiatimes.com/2026/07/the-south-china-sea-consensus-no-asean-chair-can-move/"}],"pacingThreat":[{"headline":"PLA Rocket Unit Tests Drone-Cued Precision Strikes on Simulated Ships","body":"Footage released by China Military Online on August 6 showed a brigade from the PLA's 83rd Group Army running a live-fire drill pairing reconnaissance drones with PHL-03 300mm rocket artillery to hit a stationary sea target. The exercise emphasized compressing the sensor-to-shooter timeline and rapidly displacing launchers after firing, capabilities aimed at survivable coastal-denial operations in a contested littoral fight. The drill adds to a steady drumbeat of PLA footage this summer showcasing integrated drone-artillery targeting meant to complicate any adversary naval approach.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/navy-news/2026/china-tests-uav-cued-phl-03-maritime-strikes-and-rapid-displacement-tactics-for-coastal-denial-operations"},{"headline":"Beijing Pairs Scarborough Shoal Patrols With Hypersonic Missile Reveal","body":"China's Southern Theater Command conducted joint naval and air combat-readiness patrols around Scarborough Shoal, which Beijing calls Huangyan Dao, explicitly citing the actions of the Philippines and other regional states as justification. In a separate rollout, Chinese state media aired the first footage of a Type 052D destroyer firing the YJ-20 hypersonic anti-ship missile, a weapon that debuted at last year's military parade but had previously only been associated with the larger Type 055 destroyers. Analysts say fielding the missile on the far more numerous 052D-class ships would meaningfully expand the PLA Navy's long-range anti-ship strike capacity.","source":"Global Times","url":"https://www.globaltimes.cn/china/military/index.html"},{"headline":"PLA Footage Shows Robot-Assisted Beach Assault Drills Near Taiwan's Pratas Atoll","body":"A new assessment published August 7 highlights CCTV footage from August 1 and July 31 showing a PLA combined-arms formation, roughly company or battalion sized, rehearsing an assault on a fortified beach using small FPV quadcopters and armed quadrupedal ground robots. Analysts assess the drills as an effort to graft unmanned-systems lessons from the war in Ukraine onto PLA amphibious doctrine without a wholesale restructuring of its landing forces. The exercises are geographically tied to the area around Taiwan's Pratas atoll, a lightly defended outpost seen as a plausible target in any Chinese coercive or invasion scenario against Taiwan.","source":"American Enterprise Institute (AEI)","url":"https://www.aei.org/commentary/china-taiwan-update-august-7-2026/"}]},"europe":{"ukraineRussia":[{"headline":"Overnight Russian strike kills three, including a child, near Kyiv","body":"A missile and drone barrage on the Kyiv region overnight into August 8 killed three people and wounded three others, with explosions also reported in Dnipro and air raid sirens warning of inbound ballistic missiles over the capital. Regional administration chief Tymur Tkachenko said the worst damage hit three sites in the Brovary district, northeast of Kyiv. The attack came as Ukrainian officials reported downing hundreds of drones in recent nights while conceding growing strain on air defenses, part of a broader pattern of near-daily Russian strikes on population centers and energy infrastructure heading into autumn.","source":"Kyiv Post","url":"https://www.kyivpost.com/thread/81941"},{"headline":"Suspected Russian shadow-fleet tanker spills oil off Oman","body":"A tanker linked to Russia's sanctions-evading 'shadow fleet' is leaking oil across hundreds of square kilometers near a protected marine reserve off Oman's coast, prompting NGOs to warn of a looming ecological disaster. A maritime security firm told AFP the vessel was rocked by onboard explosions, though the cause remains unclear. The incident highlights the growing environmental and security risks posed by aging, opaquely-owned tankers Moscow relies on to move oil around Western price caps and sanctions.","source":"Kyiv Post","url":"https://www.kyivpost.com/thread/81941"}],"europe":[{"headline":"NATO hands over Ukraine training command amid US drawdown anxieties","body":"Supreme Allied Commander Europe Gen. Alexus Grynkewich welcomed a new commander for NATO Security Assistance and Training for Ukraine (NSATU) at a ceremony in Wiesbaden on August 3, a routine handover that nonetheless underscores allies' reliance on the alliance's Ukraine-training architecture as Washington signals it wants Europeans to take on more of that burden. The transition comes amid lingering unease in European capitals over confirmed US plans to trim force levels and equipment commitments in Europe, even as the 2026 National Defense Authorization Act bars the Pentagon from cutting US troop levels below 76,000 without notifying Congress. The friction reflects a deeper transatlantic bargain still being renegotiated after July's Ankara summit, where allies pledged roughly 70 billion euros in 2026 aid for Kyiv while quietly bracing for reduced American backstopping.","source":"NATO","url":"https://www.nato.int/en"},{"headline":"Migrant surge from Morocco reignites Schengen border strains","body":"A sharp rise in migrant crossings from Morocco toward Spain has pushed the European Commission to publicly reassure member states that Spain's handling of the influx has not compromised the integrity of the Schengen open-border zone, even as Brussels concedes Europe's external frontiers remain 'vulnerable.' The episode is reviving a familiar fault line among EU governments over burden-sharing on migration, months before renewed debate on the bloc's asylum and returns rules. With irregular arrivals rising again this summer, migration is shaping up as the most politically combustible non-defense issue confronting European leaders heading into autumn.","source":"Al Jazeera","url":"https://www.aljazeera.com/europe/"}]},"middleEast":[{"headline":"Saudi Arabia, Turkey and Pakistan sign NATO-style mutual defense pact","body":"Saudi Crown Prince Mohammed bin Salman, Turkish President Recep Tayyip Erdogan and Pakistani Prime Minister Shehbaz Sharif signed the Mecca Joint Defence Agreement on August 7, committing that an armed attack on any one of the three nations will be treated as an attack on all three. The pact builds on a bilateral Saudi-Pakistani defense agreement from September 2025 and comes after months of Iranian, Houthi and proxy strikes on Saudi territory since the February 2026 outbreak of the US-Israel-Iran war. Analysts note the grouping pairs Turkey's NATO-second-largest military and defense industry with Saudi financial power and Pakistan's status as the only nuclear-armed Muslim-majority state, potentially reshaping Gulf and South Asian security alignments.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/8/7/turkiye-saudi-arabi-pakistan-sign-joint-defence-agreement-whats-in-it"},{"headline":"Hormuz standoff deepens as UAE accuses Iran of new tanker attack","body":"The United Arab Emirates on August 8 accused Iran of attacking a tanker belonging to its state oil company in the Strait of Hormuz, while Iran's Revolutionary Guard insisted the waterway will only fully reopen once Washington accepts Tehran's conditions. The escalation comes as Iran and Oman work through a provisional arrangement rerouting some shipping traffic through a jointly managed corridor, an interim fix that has not resolved the underlying standoff. Separately, CNN reported the chairman of the US Joint Chiefs of Staff is now actively seeking an 'off-ramp' from the broader Iran war, a sign of mounting Pentagon concern over the conflict's open-ended trajectory nearly six months after fighting began.","source":"The Times of Israel","url":"https://www.timesofisrael.com/liveblog-august-08-2026/"},{"headline":"Hamas signals readiness to advance Gaza disarmament deal","body":"A senior Hamas official said on August 8 that the group is prepared to move forward with the Gaza disarmament and ceasefire framework, while calling on Washington to pressure Israel to reciprocate. The statement comes amid continued Israeli military operations in Gaza that the UN says are disrupting civilian life, and follows Israeli strikes and a partial withdrawal in southern Lebanon this week tied to accusations of Hezbollah violations. The renewed overture suggests Gaza's fragile post-war arrangement remains workable but contingent on US leverage over Israeli follow-through.","source":"The Times of Israel","url":"https://www.timesofisrael.com/liveblog-august-08-2026/"}],"techAI":{"aiCompetition":[{"headline":"US Widens Probe Into China's Backdoor Access to Nvidia Chips","body":"A US federal enforcement unit that normally polices export-control violations has begun systematically examining how Chinese AI developers are getting around chip restrictions by renting computing power hosted in third countries, according to people familiar with the inquiry. The review, reported August 7, follows a string of Chinese AI capability leaps that showed firms there still have practical access to top-tier Nvidia hardware despite years of tightening US export bans. The scrutiny suggests Washington sees offshore GPU rental as a major loophole undermining the chip-control regime central to its AI rivalry with Beijing.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-08-07/us-reviews-china-s-offshore-access-to-nvidia-chips-after-ai-breakthroughs"},{"headline":"Chip and Open-Model Builders Bet On-Device AI Will Rival the Cloud Within a Year","body":"At an early-August summit, engineers from Nvidia, Prime Intellect, and Arcee AI argued that open-weight models capable of handling everyday work will run entirely on consumer laptops within twelve months, eliminating dependence on cloud APIs. The panelists claimed local-model usage today sits below 0.001% of daily AI interactions but predicted it could reach 10-15% penetration within a year, with Apple's redesigned Siri, expected in September 2026, as a likely mass-market trigger. The forecast underscores a widening strategic debate over whether US AI dominance rests on closed frontier labs or a faster-moving open-weight ecosystem that could blunt China's chip-constrained but rapidly advancing open models.","source":"BigGo Finance","url":"https://finance.biggo.com/news/5144929b407b7964"}],"cyberEmerging":[{"headline":"Iran-Linked Hackers Breach Over 30 Minnesota Water Systems","body":"US intelligence agencies assess that Iranian-linked actors were likely behind a coordinated intrusion into more than 30 municipal water systems in Minnesota, with the FBI now investigating after the breach briefly disrupted at least one facility's operations. The incident, detailed in threat intelligence reporting published August 7, fits a broader pattern of Iranian and other state-linked actors probing exposed industrial control systems at US water and wastewater utilities across at least a dozen states. Researchers note many of these breaches exploit long-known vulnerabilities in exposed programmable logic controllers rather than novel tradecraft, pointing to systemic gaps in operational-technology defenses nationwide.","source":"CYFIRMA","url":"https://www.cyfirma.com/news/weekly-intelligence-report-7-aug-2026/"},{"headline":"Black Hat Las Vegas Spotlights Fresh Cloud and AI-Chatbot Exploits","body":"This week's Black Hat conference in Las Vegas has become the backdrop for a wave of disclosures, including Microsoft patches for critical flaws across Azure, Entra, and SharePoint and an Apple fix for a high-severity authentication bypass. Researchers also demonstrated methods for abusing built-in email chatbots to dodge detection, impersonate executives, and enable financial fraud, while a separate flaw allowed attackers to self-register for board-level API access and execute code by importing a fake company. The overlapping disclosures illustrate how AI-enabled social engineering and cloud identity weaknesses are converging into a single, harder-to-defend attack surface right in the reader's backyard.","source":"SecurityWeek","url":"https://www.securityweek.com/"}]},"cities":{"lasVegas":[{"headline":"Lake Mead Falls to All-Time Record Low","body":"For several hours on Friday, Lake Mead's surface dropped to its lowest level since the reservoir was first filled in the 1930s, according to federal data reported by the Las Vegas Review-Journal. The lake supplies nearly all of Southern Nevada's drinking water, and officials caution the milestone likely signals further declines ahead rather than a bottom, given ongoing Colorado River basin drought and demand pressures.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Funeral Set for Metro Officer Killed in East Las Vegas Gunbattle","body":"The Metropolitan Police Department has scheduled services for Officer Austin 'Zade' Abdelnabi, a Marine veteran fatally shot eight times during an August 4 confrontation in east Las Vegas. Newly released body-camera footage shows the gunman, identified as Angel Lucas Lindsey and also killed in the exchange, opening fire after allegedly waving a weapon at bystanders. A relative described Lindsey as increasingly unstable in the weeks leading up to the shooting.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Trump Visit Turns Tense as Lombardo Confronts Heckler Over Slain Officer","body":"President Trump landed in Las Vegas aboard the newly delivered Air Force One ahead of a Wednesday economic event at Red Rock Resort. During the appearance, Gov. Joe Lombardo publicly rebuked an audience member who booed the name of Officer Austin Abdelnabi, reflecting how raw emotions remain just days after the officer's killing. The visit unfolded as the city's tourism sector continues to soften, with local officials citing a steep drop-off in Canadian visitors amid ongoing trade friction.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/politics-and-government/nevada/nevada-governor-responds-after-man-boos-mention-of-slain-police-officer-3859871/"}],"nellis":[{"headline":"Autonomous Drone Wingmen Put Through Paces at Creech AFB","body":"The Air Force's Collaborative Combat Aircraft Experimental Operations Unit recently ran semi-autonomous drone wingmen through an Agile Combat Employment exercise at Creech Air Force Base, testing how uncrewed aircraft coordinate alongside piloted fighters over Nevada's desert ranges. The trials are part of a broader push to field AI-enabled combat drones designed to fly and fight alongside F-35s and F-22s, cementing the Las Vegas-area test ranges as a proving ground for next-generation air combat technology.","source":"Nellis Air Force Base Public Affairs","url":"https://www.nellis.af.mil/Nellis-News/Article-Display/Article/4556808/air-force-tests-collaborative-combat-aircraft-at-creech/"}]},"feelGood":[{"headline":"Reno Veteran Pays It Forward After Losing Home to Wildfire","body":"A Reno military veteran whose house burned down in a 2020 wildfire is now fundraising for the same charitable foundation that helped him rebuild his life afterward. His campaign is meant to make sure the organization can extend that same lifeline to other families left homeless by disaster, turning his personal recovery into a source of hope for strangers.","source":"KOLO 8 News Now","url":"https://www.kolotv.com/"},{"headline":"Boy Hands Over Life Savings After Lightning Destroys Dad's Truck","body":"When lightning obliterated Casey Pettus's truck on a Utah highway, he walked away unharmed but shaken. Later that day, his 9-year-old son quietly offered up his entire life savings to help his father recover, turning a frightening near-miss into a quiet lesson in generosity and family devotion.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Teen Lifeguard's Quick Action Saves Boy in Santa Cruz Surf","body":"A teenage lifeguard in Santa Cruz rushed into dangerous surf to pull a 10-year-old boy to safety after he was swept into open water. The boy's father has since spoken publicly about how close the incident came to tragedy, crediting the young lifeguard's training and split-second instincts with saving his son's life.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1945","event":"The Soviet Union declared war on Japan, opening a new front in the final days of World War II."},{"year":"1963","event":"Thieves pulled off the Great Train Robbery in England, stealing millions from a Royal Mail train."},{"year":"1974","event":"President Richard Nixon announced on television that he would resign the presidency over the Watergate scandal."},{"year":"2008","event":"Beijing hosted the opening ceremony of the Summer Olympics on the auspicious date of 8/8/08."}]},"topPicks":[{"headline":"US Intelligence Warns Putin May Test NATO's Resolve Within Years","teaser":"A new intelligence assessment suggests Moscow could probe alliance unity militarily in the coming years, raising Western defense stakes."},{"headline":"Saudi Arabia, Turkey and Pakistan sign NATO-style mutual defense pact","teaser":"Three major regional powers formalize a collective-defense agreement, reshaping Middle East and South Asian security alignments."},{"headline":"Senate Passes Sweeping Russia-Iran Sanctions Bill Named for Late Sen. Graham","teaser":"Lawmakers approve tough new sanctions targeting Moscow and Tehran, signaling hardened US resolve against both adversaries."}]},"navDates":[{"key":"2026-08-11","label":"Aug 11","href":"/","isNewest":true},{"key":"2026-08-10","label":"Aug 10","href":"/archive/2026-08-10.html","isNewest":false},{"key":"2026-08-09","label":"Aug 9","href":"/archive/2026-08-09.html","isNewest":false},{"key":"2026-08-08","label":"Aug 8","href":"/archive/2026-08-08.html","isNewest":false},{"key":"2026-08-07","label":"Aug 7","href":"/archive/2026-08-07.html","isNewest":false},{"key":"2026-08-06","label":"Aug 6","href":"/archive/2026-08-06.html","isNewest":false},{"key":"2026-08-05","label":"Aug 5","href":"/archive/2026-08-05.html","isNewest":false}],"currentKey":"2026-08-08","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-08.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
