<script>
const STATE = {"digest":{"date":"Saturday, November 7, 2026","generatedAt":"Sat, Nov 7, 7:39 AM PST","breaking":{"headline":"US Hits Iranian Air Defenses on Qeshm Island as Trump Weighs Full Return to War","body":"US aircraft struck Iranian air-defense systems on Qeshm Island in the Strait of Hormuz on Friday, the first offensive action since Tuesday's midterm elections, with Trump calling it a 'minor' strike that knocked out radars in about 15 minutes. Pentagon officials told reporters that thousands of US air and naval forces are positioned to resume full-scale combat on the president's order, while CENTCOM is finalizing options without a formal directive. Iran is weighing a two-day, Qatari-brokered off-ramp that would reopen Hormuz and admit IAEA inspectors to bombed nuclear sites, and some officials have flagged November 9's new moon as a preferred window for a larger operation if diplomacy fails.","source":"AND Magazine","url":"https://andmagazine.substack.com/p/morning-brief-7-november-2026"},"tabs":{"defense":{"defense":[{"headline":"Air Force Says It Needs $14 Billion to Fix Spare-Parts Shortfall","body":"Air Force officials disclosed this week that the service needs at least $14 billion to rebuild its spare-parts inventory, calling the shortage a major driver of falling readiness rates across its aging aircraft fleet. The gap intensifies competition for maintenance dollars as the service also funds modernization programs, and it lands just as the newly elected Congress prepares to take up defense appropriations. The disclosure adds to a string of readiness warnings from the services this fall.","source":"Inside Defense","url":"https://insidedefense.com/insider/insider-daily-digest-november-6-2026"},{"headline":"Hegseth Vows to Stay at Pentagon, Dismisses Impeachment Push as 'Political Theater'","body":"Defense Secretary Pete Hegseth said he remains fully committed to serving through the end of Trump's term and brushed off Democratic impeachment efforts tied to the Iran war, even as a Trump adviser told Reuters he could still be pushed out in a broader post-midterm cabinet shake-up. Hegseth simultaneously pressed the incoming Congress, where Democrats gained ground in Tuesday's elections, to approve at least $350 billion in defense funding. Trump told CBS he expects more cabinet changes after the party's losses but has publicly praised Hegseth's performance.","source":"The Verardo Group / Reuters","url":"https://theverardogroup.substack.com/p/tvg-daily-brief-06-nov-2026"},{"headline":"UK Forces Track Russian Warships in Three Operations, Fly First Protector Drone Mission","body":"The Royal Navy and RAF disclosed three coordinated operations over roughly two weeks in late September and October to monitor Russian naval activity near Britain, including destroyer HMS Dauntless shadowing the frigate Neustrashimy through the English Channel and Merlin helicopters tracking the intelligence ship Viktor Leonov near the Outer Hebrides during NATO's Exercise Strike Warrior. The RAF also flew its Protector RG1 drone on its first operational UK sorties, logging more than ten hours of surveillance on Russian shipping. Officials noted that an average of two Royal Navy warships deploy weekly to monitor Russian vessels in UK waters, underscoring sustained allied pressure to track Moscow's activity near NATO's northern flank.","source":"USNI News","url":"https://news.usni.org/2026/11/03/u-k-forces-track-russian-warships-in-3-operations-spanning-2-weeks"}],"acquisitions":[{"headline":"Space Force, Golden Dome Award Viasat Up to $450M for Missile-Defense Network Hub","body":"The Space Force, working with the Pentagon's Golden Dome missile-defense effort, awarded Viasat a contract worth up to $450 million to design, build and operate a Mission Operations Center for the Space Data Network Backbone. The center is intended to coordinate connectivity across multiple vendors and domains, a critical piece of the sensor-and-interceptor architecture Golden Dome needs to track and defeat advanced missile threats. It ranks among the program's largest publicly disclosed industry awards to date.","source":"Inside Defense","url":"https://insidedefense.com/insider/insider-daily-digest-november-6-2026"},{"headline":"Army Taps Czech Firm CSG in $4.2 Billion Ammunition Stockpile Push","body":"The US Army has approved up to $4.2 billion in spending to replenish ammunition stockpiles, with Czech defense manufacturer CSG among several firms competing for contracts under the initiative. The push reflects Pentagon concern over depleted munitions reserves after years of transfers to Ukraine combined with heavy ordnance use in the ongoing Iran conflict. Officials are widening the supplier base beyond traditional US primes to speed up production of artillery rounds and other high-demand munitions.","source":"The National Interest","url":"https://nationalinterest.org/"}]},"us":[{"headline":"Trump Installs Stephen Miller as Chief of Staff in Post-Midterm Shake-Up","body":"President Trump announced Friday that he is replacing Susie Wiles with longtime aide Stephen Miller as White House chief of staff, effective Monday, November 9, making Miller his sixth person to hold the post in under six years. The move comes as Trump has reportedly fumed over Republicans' sweeping midterm losses, and Wiles will shift to the president's political operation rather than leave entirely. Analysts see the choice of Miller, the architect of the administration's hardline immigration agenda, as a signal Trump intends to double down rather than moderate after voters delivered what some describe as the largest leftward shift in decades.","source":"Washington Post","url":"https://www.washingtonpost.com/politics/2026/11/06/trump-names-stephen-miller-new-white-house-chief-staff/"},{"headline":"Mississippi Senate Race Heads Toward Unprecedented Legal Fight","body":"Democrat Scott Colom's narrow lead of roughly 65 votes over Republican Senator Cindy Hyde-Smith has exposed a quirk in Mississippi law: the state has no mechanism for automatic or requested recounts, meaning any challenge would have to come via lawsuit. With mail ballots postmarked by Election Day still eligible if received by November 10 and certification due November 13, thousands of outstanding ballots could still swing a result that would be the state's first Democratic Senate win since 1982. The Colom campaign has already begun fundraising under a 'recount fund' banner in anticipation of a court fight.","source":"ABC News","url":"https://abcnews.com/Politics/recounts-mississippi-razor-thin-margin-senate-race/story?id=137844445"},{"headline":"Supreme Court Rebuffs Trump Bid to Set Aside California Ballots","body":"In a one-sentence, unexplained order issued November 2, the Supreme Court declined the administration's emergency request to force California to segregate ballots from roughly 20,000 registered voters federal officials suspected of being noncitizens. The justices notably did not even request a response brief from California before ruling, a departure from their usual practice in high-profile emergency matters, underscoring how weak they judged the government's case. The Justice Department subsequently dropped the underlying lawsuit after a string of losses in lower courts, marking another defeat for Trump's election-related legal strategy just before the midterms.","source":"CNN","url":"https://www.cnn.com/2026/11/02/politics/trump-supreme-court-california-noncitizen-ballot"},{"headline":"Solid October Jobs Report Steadies Markets After Post-Election Tech Sell-Off","body":"The Labor Department's October jobs report showed employers added 165,000 positions while the unemployment rate ticked down to 4.1 percent, offering a dose of economic reassurance after this week's tech-led stock selloff tied to midterm uncertainty. The data arrives as Washington braces for a newly divided Congress, with investors watching whether a Democratic House and Senate will complicate fiscal and regulatory policy heading into 2027. The reading suggests the labor market remains resilient even as political turmoil, including the chief-of-staff shake-up, roils Washington.","source":"Morning News Update / Mike Simpson Substack","url":"https://ru4people.substack.com/p/morning-news-update-november-7-2026"}],"pacific":{"pacificCommand":[{"headline":"Manila Looks to Expand BrahMos Missile Arsenal from India","body":"Philippine Defense Secretary Gilberto Teodoro said Manila wants to acquire additional batteries of India's BrahMos supersonic anti-ship cruise missile, building on the first battery delivered in 2024-25 that is now deployed for coastal defense facing the South China Sea. A larger BrahMos buy would deepen the India-Philippines defense-industrial relationship and give Manila more stand-off strike capability against Chinese coast guard and maritime militia vessels near Scarborough Shoal and the West Philippine Sea. The push comes as the Philippines is simultaneously in talks with Japan over Abukuma-class destroyers and new air-defense systems, part of a broader multi-partner modernization drive.","source":"Asia News Network","url":"https://asianews.network/"},{"headline":"Seoul Pulls Back Aegis Destroyer Patrols as Pyongyang Fires Missiles","body":"South Korea has scaled back Aegis-equipped destroyer patrols in the East Sea, a move defense analysts warn could degrade real-time tracking and analysis of North Korean missile tests. The pullback coincided with fresh North Korean missile launches and a statement from Kim Yo-jong, sister of leader Kim Jong Un, saying talks with Washington remain an option but not a necessity for Pyongyang. The reduced naval presence raises questions in Seoul and Tokyo about maintaining persistent sensor coverage against the North's expanding missile forces even as diplomatic overtures stay on the table.","source":"Asia News Network / Rio Times Asia Intelligence Brief","url":"https://www.riotimesonline.com/asia-intelligence-brief-friday-november-6-2026/"},{"headline":"Japan and Philippines Lock In Deeper Defense Ties After Balikatan Live-Fire Drills","body":"Japanese Defense Minister Shinjiro Koizumi and Philippine Defense Secretary Gilberto Teodoro issued a joint statement affirming that Self-Defense Forces participation in live-fire surface-to-ship missile drills during Balikatan 26 marked a new operational high point under their Reciprocal Access Agreement. The two ministers also confirmed new procedures under their Acquisition and Cross-Servicing Agreement and agreed to expand cooperation through the Australia-Japan-Philippines-U.S. quadrilateral framework and ASEAN channels. The statement reflects Tokyo's accelerating push to help Manila build a layered air-defense and maritime-surveillance network across the Luzon Strait and South China Sea.","source":"Japan Ministry of Defense","url":"https://www.mod.go.jp/en/article/2026/10/be6559883d95cd90fa6b2446b99b206cf7a33dd8.html"}],"pacingThreat":[{"headline":"PLA May Be Running Unannounced Drill Simulating a Blockade of Taiwan","body":"Open-source analysts assess the PLA could be conducting a major, unannounced exercise simulating the encirclement and isolation of Taiwan, drawing in naval and air assets from the Eastern, Northern, and Southern Theater Commands simultaneously. The scale reportedly exceeds last year's Strait Thunder/Justice Mission drills and may represent Beijing's first attempt to coordinate far-seas operations across all three coastal theater commands at once. If confirmed, the drill would mark a significant step in the PLA's rehearsal of a multi-axis blockade scenario against the island.","source":"American Enterprise Institute, China-Taiwan Weekly Update","url":"https://www.aei.org/commentary/china-taiwan-update-november-6-2026/"},{"headline":"PLA Showcases New Missile Interceptors and Nears Debut of Electromagnetic-Catapult Assault Ship","body":"Chinese state media footage this week showed a PLA air-defense battalion testing upgraded HQ-series interceptors against two new target missile types in a desert exercise, with officials touting integrated laser and microwave systems for future counter-drone defense. Separately, open-source trackers believe the PLA Navy is nearing commissioning of the Sichuan, the only amphibious assault ship in the world built with an electromagnetic catapult, which would extend carrier-strike-group-style airpower well beyond China's immediate waters. Both developments point to Beijing accelerating fielding of systems tailored for a prolonged, multi-domain fight in the first and second island chains.","source":"South China Morning Post / AEI China-Taiwan Weekly Update","url":"https://www.scmp.com/news/china/military/article/3373094/chinas-hq-series-intercepts-2-new-missile-types-pla-tests-weapon-platform"},{"headline":"Taiwan Banks on Bipartisan US Support as $14 Billion Arms Package Stays Stalled","body":"Taiwan's Defense Minister Wellington Koo said this week that Taipei expects continued cross-party backing in Washington for its defense needs despite last week's US midterm elections, even as a roughly $14 billion arms package remains stuck after Trump called it a bargaining chip in his dealings with Xi Jinping following their May meeting. That package would follow the record $11 billion sale Trump approved last December, and analysts in Taipei now speculate any resumption could be split into smaller tranches, possibly slipping into 2027. The uncertainty comes just three weeks before Taiwan's November 28 local elections, which President Lai Ching-te has warned are already facing intensified Chinese cognitive-warfare and interference efforts.","source":"Reuters via BusinessWorld","url":"https://bworldonline.com/world/2026/11/05/791736/taiwan-sees-continued-us-arms-sale-support-after-midterm-election/"}]},"europe":{"ukraineRussia":[{"headline":"Russia Batters Ukraine's Grid in Opening Push of Winter Strike Campaign","body":"Overnight November 3-4, Russian drones and missiles hit central and western Ukraine, causing widespread blackouts as part of what analysts call Moscow's Winter 2026-2027 campaign to damage critical infrastructure and the Ukrainian economy with precise and repeated strikes. The barrage followed a separate combined attack on energy infrastructure on the night of November 2-3 intended to raise the cost of the war on Ukrainian society and push Kyiv toward capitulation before spring. Ukrenergo reported fresh emergency outages again on November 6 after Russia launched 227 drones, including 86 jet-powered models, against the country overnight.","source":"Kyiv Post / ISW","url":"https://www.kyivpost.com/post/89198"},{"headline":"Ukraine Escalates Refinery Strikes as Abu Dhabi Talks Loom","body":"Kyiv's drones hit one of southern Russia's largest facilities, the Afipsky refinery in Krasnodar Krai roughly 375 kilometers from the front, setting its oil tank farm ablaze on the night of November 5-6. The strike is the latest in a campaign that Ukrainian officials say has knocked out 15 Russian refineries and inflicted an estimated $23 billion in damage. The pressure campaign comes just before trilateral US-Ukraine-Russia negotiations scheduled for November 10-11 in Abu Dhabi, with Washington reportedly pressing a list of topics including security guarantees and a broader European security architecture.","source":"Kyiv Post / ISW","url":"https://www.byteseu.com/2503397/"}],"europe":[{"headline":"Patriot Delivery Delays Force NATO Rethink on Eastern Flank Air Defense","body":"A senior Polish commander warned that scheduled US Patriot deliveries to Poland are set to slip, prompting Defense Minister Wladyslaw Kosiniak-Kamysz to tell international arms makers that future contracts hinge on building manufacturing and maintenance facilities inside Europe. Within hours, Norway's Kongsberg announced a $51 million investment in a new counter-drone production plant in northern Poland. Separately, NATO on November 5 launched a Counter-Unmanned Aircraft Systems marketplace letting allies buy battle-tested counter-drone gear directly from a NATO catalogue without a new tender process, part of the alliance's broader 'Drone Edge' push.","source":"RealClearDefense / NATO","url":"https://www.realcleardefense.com/nato/links/natos-new-defense-plan-would-mean-strikes-deep-inside-russia-2026-11-04"},{"headline":"Spain's Immigration Fight Could Reshape National Politics Before Nov. 29 Vote","body":"Ahead of Spain's November 29 election, the hard-right Vox party is positioned to hold the balance of power and is demanding the rollback of Prime Minister Pedro Sanchez's immigration legacy, including this year's mass regularization of as many as 1.2 million undocumented migrants. Vox has mirrored the hardline rhetoric of Donald Trump, while the conservative PP under Alberto Nunez Feijoo is largely avoiding the topic for fear of being outflanked. The fight reflects a broader European reckoning, with roughly one in five Spanish residents now foreign-born, a share even higher than in the United States.","source":"Irish Times","url":"https://www.irishtimes.com/world/europe/2026/11/02/the-battle-to-reverse-europes-big-immigration-experiment/"}]},"middleEast":[{"headline":"Houthi-Saudi Fighting Intensifies With Dozens Killed","body":"Yemeni state media tied to the Houthis reported that Saudi-led airstrikes killed roughly 22 people, including women and children, in Sanaa province's Al-Shariyah area on November 7, with paramedics allegedly targeted in follow-up strikes. Saudi Arabia said it intercepted a Houthi cruise missile aimed at Riyadh, while separate reporting noted a market attack in Taiz that Yemeni forces blamed on the Houthis. The exchanges mark some of the heaviest Saudi-Houthi fighting since the 2022 UN-brokered truce collapsed earlier this year.","source":"Dawn / Arab News","url":"https://dawn.com/live/iran-israel-war"},{"headline":"Iran Weighs Qatari Nuclear Proposal as Doha Pushes for Deal","body":"Two Middle East officials told the Associated Press that Iranian leaders are actively reviewing a set of Qatari-brokered proposals meant to bridge the gap with Washington over Tehran's nuclear program, even as US strikes on Qeshm Island continue. Qatar's government pushed back on reports that talks between its prime minister and US officials had collapsed, insisting negotiations remain alive. Iranian state media separately claimed its armed forces are now 'stronger' than at the war's outset, a signal Tehran wants to negotiate from a position of strength rather than capitulation.","source":"Arab News / AND Magazine","url":"https://www.arabnews.com/"},{"headline":"Gulf Aviation and Security Disruptions Spread as Threat Level Rises","body":"Etihad Airways has extended cancellations of all Abu Dhabi flights to Riyadh and Dammam through November 19, though select Abu Dhabi-Jeddah routes resumed November 6; Emirates and Air Arabia also reported fresh Saudi route cancellations on November 7. The US Mission to the UAE and the embassy in Doha issued security alerts urging American citizens to stay vigilant against possible attacks by Iranian-backed Houthi forces and Iranian attempts to target US officials in the region. Iran has also lifted its self-imposed cap on ballistic missile ranges, a move regional officials fear could widen the conflict further.","source":"Gulf News","url":"https://gulfnews.com/uae/middle-east-war-9-things-uae-residents-need-to-know-tonight-november-7-1.500739647"}],"techAI":{"aiCompetition":[{"headline":"OpenAI Secures $11B in New Funding Round Valuing It at $1.25 Trillion","body":"Bloomberg reported Friday that OpenAI has raised $11 billion so far in a funding round that values the company at $1.25 trillion, with the round still open and expected to close within weeks at a total that could reach roughly $20 billion. That figure falls well short of the $30 billion OpenAI was reportedly targeting back in late September, a sign investor appetite may be cooling even as valuations climb. The news lands the same day Bloomberg reported that prospective buyers in rival Anthropic's planned IPO are pushing for a valuation well below what Anthropic wanted, suggesting broader nervousness about AI infrastructure spending is starting to show up in deal terms across the sector.","source":"TechCrunch","url":"https://techcrunch.com/2026/11/06/openai-reportedly-raises-an-additional-11-billion-at-a-1-25-trillion-valuation/"},{"headline":"Mira Murati's Thinking Machines Lab Nears $5B Raise at $40B Valuation","body":"Business Insider reports Thinking Machines Lab, the startup founded by former OpenAI CTO Mira Murati, is closing a $5 billion round led by Accel at a $40 billion pre-money valuation, more than tripling the roughly $12 billion mark it held after last year's $2 billion seed round. Nvidia is separately in talks to invest about $2.5 billion in the company, underscoring how chipmakers are increasingly taking direct equity stakes in frontier labs rather than just supplying hardware. The deal is one of several large lab financings this week, alongside Kuaishou's Kling AI unit closing a roughly $3 billion round, reflecting continued investor willingness to fund frontier model developers despite broader AI-stock jitters.","source":"Business Insider (via AI Weekly)","url":"https://aiweekly.co/ai-news-today/edition/2026-11-06"}],"cyberEmerging":[{"headline":"OpenAI Releases GPT-6 Cyber, Its Most Capable Offensive Hacking Model Yet","body":"OpenAI unveiled GPT-6 Cyber on Thursday, a specialized model it says found 81 previously unknown high-severity Firefox vulnerabilities and developed working exploits for 948 Linux kernel flaws, including 588 that were previously unknown. The model scored 48.5% on the ExploitGym benchmark versus 32.1% for its predecessor GPT-5.6 Cyber, and completed 95% of tasks against enterprise targets like GitLab, PostgreSQL and Jenkins in testing. Because of these gains, OpenAI upgraded the model's risk rating from 'High' to 'Critical' under its internal Preparedness Framework, its highest tier, meaning it can identify and build functional zero-day exploits against real-world systems; access is being limited initially to vetted cybersecurity partners and defenders.","source":"The Register / CyberScoop","url":"https://www.theregister.com/security/2026/11/05/openai-releases-gpt-6-cyber-and-promises-this-one-stays-within-rules-of-engagement/5307855"},{"headline":"DOJ Stands Up 'Super Intelligence Task Force' to Police AI Misuse","body":"Attorney General Todd Blanche announced Thursday the creation of the DOJ Super Intelligence Task Force, co-led by Associate Attorney General Stanley Woodward and Associate Deputy Attorney General Stephen Weiss, tasked with prosecuting foreign governments, transnational criminal groups, and corporate or individual actors who misuse advanced AI. The unit absorbs the department's existing AI Litigation Task Force, originally stood up in January under then-AG Pam Bondi, and will coordinate with Jay Clayton's broader White House Super Intelligence Force on policy. Blanche has said prosecutions will rely on existing statutes rather than new AI-specific laws, while the department has not yet detailed how the task force will coordinate enforcement with other federal agencies.","source":"AI Weekly / Justice Department","url":"https://aiweekly.co/alerts/doj-launches-super-intelligence-task-force-to-prosecute-ai-misuse"}]},"cities":{"lasVegas":[{"headline":"Las Vegas Voters Reject Data Center Project on City Land","body":"In results finalized this week, nearly 71 percent of Las Vegas voters said no to a ballot question that would have allowed a large-scale data center to be built on a specific parcel of city-owned land. The vote adds Las Vegas to a growing list of cities nationwide where residents are pushing back against new AI-driven data center construction over concerns about power and water demand, noise, and neighborhood character. The result could complicate future site searches for cloud and AI infrastructure firms eyeing Southern Nevada's cheap power and land.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/"},{"headline":"Mayor Confirms First Friday Suspended Through Year's End","body":"Las Vegas Mayor Shelley Berkley confirmed this week that the long-running downtown First Friday arts and culture event will not return until January, pausing it for both November and December. In its absence, local artists and vendors in the 18b Arts District organized an informal art crawl over the weekend to keep foot traffic and sales flowing in the neighborhood. No firm reason for the extended pause has been detailed publicly, leaving small business owners who depend on the monthly crowds in limbo for the holiday season.","source":"Las Vegas Review-Journal / FOX5 Vegas","url":"https://www.reviewjournal.com/news/"},{"headline":"Henderson Man Indicted Over Alleged Threats to Kill Trump","body":"A Clark County grand jury this week indicted a Henderson resident on charges stemming from alleged threats to kill President Trump, according to court filings reported by local outlets. The indictment adds Nevada to a string of recent federal cases nationally involving threats against the president, and comes amid heightened Secret Service vigilance following other incidents this year. Further details on the man's identity and alleged motive have not been fully released as the case proceeds.","source":"FOX5 Vegas / Las Vegas Review-Journal","url":"https://www.fox5vegas.com/news/"}],"nellis":[{"headline":"Nellis Flyover to Mark New Home for Nevada's Veterans Memorial","body":"Ahead of Veterans Day, Las Vegas is unveiling the new permanent home of the Nevada State Veterans Memorial, relocating 18 larger-than-life bronze sculptures from the site of the since-demolished Grant Sawyer State Building to a new location near the Durango and Thunderbird complex. Nellis Air Force Base airmen will mark the occasion with a flyover, while the Joint Armed Forces Color Guard performs a formal presentation of the colors. The ceremony underscores Nellis's continuing role as the backbone of military pageantry and community outreach across the Las Vegas valley.","source":"News 3 Las Vegas (KSNV)","url":"https://news3lv.com/news/instagram/las-vegas-opening-new-state-veterans-memorial-veterans-day-ceremony-armed-forces-thunderbird-complex-durango"}]},"feelGood":[{"headline":"Brazilian Man Spends 12 Days Tracking Down Stranger to Return His Lost Salary","body":"After finding roughly $219 in cash abandoned in a public plaza in Ibiracu, Brazil, Pedro Moro refused to pocket it and instead spent nearly two weeks posting appeals on social media and combing through nearby business security footage to find its owner. The money turned out to be the entire monthly earnings of 24-year-old construction laborer Matheus Reginaldo Celestino, who had withdrawn it to support his young daughter and had already given up hope of recovering it. Moro verified Celestino's identity by having him describe the exact denominations in the stack before handing every bill back intact.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/man-spends-12-days-returning-lost-cash-a-laborer-needed-for-his-daughter/"},{"headline":"Sheriff's Deputy's Floodwater Rescue of Infant Goes Viral","body":"A photograph of a sheriff's deputy wading through chest-deep floodwaters while cradling a baby to safety has spread widely this week, drawing national attention to ongoing flood-rescue operations. Officials say the image captures only part of a broader effort by first responders who evacuated multiple families from rising waters in the area. The deputy's calm, protective handling of the infant amid dangerous conditions has been held up as an example of everyday heroism within law enforcement.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Mother Dives Into Flooded Lake to Save Drowning Elderly Man","body":"A mother of three became an unexpected hero this week when she jumped into a flooded lake to pull an elderly man to safety after he began struggling in the rising water. Bystanders say she acted within seconds of spotting him in distress, swimming him back to shore before emergency crews arrived. The rescue is the latest in a string of ordinary citizens stepping in to save strangers amid a run of severe flooding reported across multiple states this week.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1917","event":"Bolshevik forces led by Lenin seized power in Petrograd, igniting the Russian Revolution."},{"year":"1944","event":"Franklin D. Roosevelt was elected to an unprecedented fourth term as US President."},{"year":"1991","event":"NBA star Magic Johnson announced his retirement after testing positive for HIV."},{"year":"1996","event":"NASA launched the Mars Global Surveyor spacecraft toward the Red Planet."}]},"topPicks":[{"headline":"US Hits Iranian Air Defenses on Qeshm Island as Trump Weighs Full Return to War","teaser":"A direct US strike on Iranian territory raises fears of a wider Middle East war under Trump's watch."},{"headline":"Trump Installs Stephen Miller as Chief of Staff in Post-Midterm Shake-Up","teaser":"The hardline appointment signals a major policy and staffing realignment inside the White House after the midterms."},{"headline":"PLA May Be Running Unannounced Drill Simulating a Blockade of Taiwan","teaser":"An unannounced Chinese military exercise suggests Beijing is rehearsing a potential blockade scenario against Taiwan."}]},"navDates":[{"key":"2026-11-12","label":"Nov 12","href":"/","isNewest":true},{"key":"2026-11-11","label":"Nov 11","href":"/archive/2026-11-11.html","isNewest":false},{"key":"2026-11-10","label":"Nov 10","href":"/archive/2026-11-10.html","isNewest":false},{"key":"2026-11-09","label":"Nov 9","href":"/archive/2026-11-09.html","isNewest":false},{"key":"2026-11-08","label":"Nov 8","href":"/archive/2026-11-08.html","isNewest":false},{"key":"2026-11-07","label":"Nov 7","href":"/archive/2026-11-07.html","isNewest":false},{"key":"2026-11-06","label":"Nov 6","href":"/archive/2026-11-06.html","isNewest":false}],"currentKey":"2026-11-07","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-07.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
