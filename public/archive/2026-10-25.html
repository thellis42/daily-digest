<script>
const STATE = {"digest":{"date":"Sunday, October 25, 2026","generatedAt":"Sun, Oct 25, 6:42 AM PDT","breaking":{"headline":"Kremlin Confirms Trump-Putin-Xi Summit Prep as Russia Launches Massive Ukraine Barrage","body":"Kremlin aide Yuri Ushakov said Sunday that Moscow, Washington and Beijing are now ready in principle for a three-way Trump-Putin-Xi summit, confirming that preparations have begun after Putin first floated the idea to Trump during an October 9 phone call. The announcement came hours after Russia hit Ukraine with roughly 153 drones and an unspecified number of cruise missiles overnight, killing at least four people and striking power plants, substations and coal mines. President Zelensky called the attack a reason to urgently unblock stalled Patriot missile deliveries, tying battlefield pressure directly to the diplomatic track just as a potential great-power summit comes into view.","source":"Glavnoe / ABC News","url":"https://glavnoe.in.ua/en/news-en/moscow-says-preparations-have-begun-for-putin-trump-xi-meeting"},"tabs":{"defense":{"defense":[{"headline":"US Boardings Target Iran's Sanctions-Evading 'Shadow Fleet'","body":"US naval and Coast Guard units carried out a fresh round of boardings against tankers tied to Iran's so-called shadow fleet on October 24, part of an ongoing campaign to choke off sanctioned Iranian oil exports that help fund Tehran's military and proxy networks. The operation reflects an intensifying US enforcement posture in the Gulf and Indian Ocean as Washington pairs maritime interdiction with broader pressure on Iran following last winter's degraded regime leadership. Details on vessel counts and cargo value were not immediately disclosed.","source":"Indo-Pacific Defense Forum","url":"https://ipdefenseforum.com/"},{"headline":"NORTHCOM Watching Chinese Naval Activity Off Alaska","body":"US Northern Command is monitoring an uptick in Chinese maritime presence near Alaska, according to reporting dated October 24, underscoring Beijing's growing willingness to probe American Arctic and Pacific approaches far from traditional Indo-Pacific flashpoints. The development fits a broader pattern this fall of PLA Navy vessels operating closer to US territory, prompting additional US surveillance flights and cutter patrols in the Bering Sea region. No details on vessel type or exact location were released.","source":"Indo-Pacific Defense Forum","url":"https://ipdefenseforum.com/"},{"headline":"US, Japan and South Korea Deepen Trilateral Missile-Tracking Network","body":"Japan and South Korea agreed to expand technology cooperation reinforcing a trilateral missile-tracking network with the United States, a step announced October 21 that builds on Tokyo's recent push to restructure its defense research around AI and cyber capability. The arrangement is designed to speed detection and data-sharing on North Korean ballistic missile launches across the three allies' radar and sensor networks. It comes alongside separate US-Japan moves, including Space Forces-Japan integrating regional advisors into alliance planning on October 22.","source":"Nikkei Asia","url":"https://asia.nikkei.com/politics/international-relations/indo-pacific"}],"acquisitions":[{"headline":"Missile Defense Agency Extends $112 Million Radar Sustainment Deal","body":"The Missile Defense Agency obligated $112,309,403 in fiscal 2027 funds on October 21 to extend a radar sustainment contract covering work in Woburn, Massachusetts and multiple radar sites inside and outside the continental United States. The modification pushes the ordering period two years further, from October 31, 2026 to October 31, 2028, keeping legacy missile-tracking radar infrastructure operational as MDA expands its broader detection architecture.","source":"Department of War contract announcements","url":"https://www.war.gov/News/Contracts/Contract/Article/4630997/contracts-for-oct-21-2026/"},{"headline":"Boeing Lands $80 Million Navy MQ-25A Stingray Upgrade Contract","body":"The Navy awarded Boeing a not-to-exceed $80 million cost-plus-fixed-fee contract on October 16 covering system improvements, configuration development, integration and sustainment for the MQ-25A Stingray unmanned aerial refueling aircraft. Work will be performed in St. Louis, Missouri, with completion expected by October 2031, funding tied to incremental task orders rather than a lump obligation at signing. The award keeps Boeing's carrier-based refueling drone on track as the Navy works to extend strike-fighter range across the fleet.","source":"Department of War contract announcements","url":"https://www.war.gov/News/Contracts/Contract/Article/4627497/contracts-for-oct-16-2026/"}]},"us":[{"headline":"Supreme Court Greenlights New Hampshire Student-ID Voting Ban, Rebuffs Trump Team on Transgender Prisoner Care","body":"The Supreme Court granted New Hampshire's emergency request to bar voters from using student ID cards as proof of identity in the November midterms, citing the principle against changing election rules close to voting rather than ruling on the underlying constitutional claim. In a separate emergency order, the justices refused to let the administration reinstate restrictions on gender-affirming care for transgender federal prisoners, leaving a lower-court injunction in place after finding the Bureau of Prisons likely skirted administrative law in reversing its medical policy. The dueling rulings underscore how much midterm-season litigation is now landing directly on the Court's shadow docket.","source":"Justice Roundup / SCOTUSblog coverage","url":"https://thejusticeguy.substack.com/p/justice-roundup-week-of-october-24"},{"headline":"DOJ Lawsuit Clouds Alaska Senate Race as Trump and Obama Duel Over Michigan With 9 Days to Go","body":"A Justice Department lawsuit is now complicating Alaska's closely watched Senate contest just over a week before Election Day, adding fresh legal uncertainty to an already volatile midterm map. The dispute broke as President Trump headed to Michigan to campaign while Democrats countered by deploying Barack Obama and Alexandria Ocasio-Cortez to rally voters in the same battleground. With control of both chambers in play, the Alaska fight is emblematic of how legal challenges are increasingly shaping the final sprint of the 2026 cycle.","source":"Fox News","url":"https://www.foxnews.com/live-news/midterm-elections-2026-trump-obama-michigan-alaska-october-25"},{"headline":"Inflation Reaccelerates Toward 3.8% as Strait of Hormuz Disruption Feeds Into Fed's Rate Debate","body":"The Cleveland Fed's inflation nowcast shows headline CPI, which already jumped to an annualized 3.7% in September, climbing toward roughly 3.77% in October, while core PCE is tracking toward 3.13 percent, both driven partly by fuel-cost spikes tied to the ongoing closure of the Strait of Hormuz and rerouted shipping tied to the Iran war. Separately, September payrolls grew by just 29,000 while unemployment ticked up to 4.2 percent even as jobless claims fell to 194,000, a nearly six-decade low, signaling employers are hoarding workers but not hiring. The data complicate the Federal Reserve's two-day meeting this week, with markets now weighing the odds of renewed rate hikes rather than cuts under Chair Kevin Warsh.","source":"Yahoo Finance / Evans May Wealth","url":"https://finance.yahoo.com/economy/policy/articles/federal-reserves-latest-october-inflation-082602376.html"},{"headline":"Appeals Court Blocks Administration Bid to Overhaul $56 Million Fair-Housing Enforcement Grants","body":"The First Circuit largely declined to lift an injunction stopping the Department of Housing and Urban Development from restructuring a $56 million grant program that funds groups investigating housing discrimination complaints. The administration had sought to concentrate funding among a narrower set of grantees, a move challenged as circumventing congressional appropriations intent. The ruling keeps the existing distribution of fair-housing enforcement dollars in place while litigation continues, another setback for the White House's push to redirect civil-rights-related federal funding streams.","source":"Justice Roundup","url":"https://thejusticeguy.substack.com/p/justice-roundup-week-of-october-24"}],"pacific":{"pacificCommand":[{"headline":"Manila and Washington Signal 'Squad' Talks Ahead of Trump-Xi Summit Amid Ambassador Flap","body":"Philippine Ambassador to the US Jose Manuel Romualdez indicated likely 'Squad' consultations involving Manila, Washington, Tokyo, and Canberra are expected before the planned Trump-Xi summit, while also reviving his call for an 'ASEAN NATO'-style framework. The diplomatic push comes days after Manila summoned Chinese Ambassador Jing Quan over his remark that Beijing could 'easily win' a conflict with the Philippines, a comment Foreign Secretary Maria Theresa Lazaro branded 'provocative and unacceptable.' Philippine Defense Secretary Gilberto Teodoro has also kept military-to-military hotlines with Beijing suspended, accusing China of misusing and distorting prior communications.","source":"South China Morning Post","url":"https://www.scmp.com/topics/south-china-sea"},{"headline":"Senior US Diplomat Urges Deeper Japan Alliance to Counter China, North Korea Nuclear Buildups","body":"A senior US diplomat in Tokyo said Saturday that Washington and Japan must keep strengthening their alliance for deterrence given advancing nuclear programs in China and North Korea. The remarks follow weeks of pressure from Tokyo, where Defense Minister Shinjiro Koizumi has publicly pushed for debate on acquiring nuclear-powered submarines and even nuclear weapons amid what Japanese analysts describe as sharply increased Chinese 'cognitive warfare' and belligerence since Prime Minister Takaichi took office a year ago. The comments add to momentum behind Japan's record defense budget, which already hit its 2% of GDP target ahead of schedule.","source":"Nikkei Asia","url":"https://asia.nikkei.com/politics/defense/stronger-japan-alliance-needed-for-deterrence-senior-us-official"},{"headline":"India and Australia Run Amphibious Drills in Kerala as New Zealand Observes for First Time","body":"India and Australia kicked off the fifth edition of Exercise AUSTRAHIND on October 19 in Thiruvananthapuram, Kerala, with roughly 240 troops split evenly between the two armies training through November 1 on coastal and island combat scenarios. This year's iteration is built around amphibious and littoral-maneuver tactics, reflecting both Australia's evolving littoral doctrine and India's regional expertise, and for the first time includes a New Zealand observer contingent. The drills coincide with a new Australia-India Institute report calling for a formal Australia-India-South Korea trilateral to bolster Indo-Pacific resilience as the rules-based order frays.","source":"The Australia Today","url":"https://www.theaustraliatoday.com.au/austrahind-2026-india-and-australia-sharpen-military-coordination-deepen-defence-ties/"}],"pacingThreat":[{"headline":"PLA Navy Shadows US Destroyer Near Contested Sabina Shoal","body":"Beijing confirmed it dispatched naval forces to track the USS Charleston as the American warship conducted a freedom-of-navigation operation near Sabina Shoal, a South China Sea flashpoint where Chinese and Philippine coast guard vessels clashed last month. The shadowing operation underscores how routine US presence patrols are increasingly met with direct PLA Navy escort responses rather than coast guard-only reactions. It comes amid a broader surge in Chinese vessel activity, with Manila recently tracking around 101 Chinese ships across Scarborough Shoal, Second Thomas Shoal, and other disputed features.","source":"South China Morning Post","url":"https://www.scmp.com/topics/south-china-sea"},{"headline":"Second Suspected PLA Underwater-Drone Mothership Spotted Under Tow Near Guangzhou","body":"Open-source analysts identified a second unusual Chinese vessel, roughly 150 meters long, under tow by tugboats on the Pearl River near Guangzhou's Panyu district, featuring six vertical stern structures resembling equipment for launching and recovering extra-large uncrewed underwater vehicles. It appears to be a smaller sibling to a roughly 204-meter vessel already launched at Shanghai's Hudong-Zhonghua shipyard, whose cradle system could reportedly handle drones up to 50 meters long. Neither ship's mission or operator has been confirmed by Chinese authorities, but analysts say if validated as PLA Navy motherships, they could extend Beijing's undersea surveillance reach into waters east of Taiwan and across the western Pacific.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3371390/china-building-fleet-drone-motherships-extend-its-naval-reach"},{"headline":"PLA Issues First 'Taiwan Recovery Day' Poster, Warning Against Independence Moves","body":"China's PLA Eastern Theater Command released its first propaganda poster marking the newly instituted 'Taiwan Recovery Day' on October 25, a date the Standing Committee of the National People's Congress formally designated last year to commemorate Taiwan's 1945 retrocession from Japanese rule. The poster, titled around preserving 'national unity,' features a map of Taiwan and historical imagery, with a Chinese military commentator saying it signals the PLA will not tolerate attempts to separate the island and will respond with force if needed. The symbolic messaging arrives even as empirical data shows PLA fighter sorties near Taiwan actually fell to a three-year low in the first half of 2026, suggesting Beijing is currently favoring coast guard pressure and political signaling over large-scale air activity.","source":"Global Times","url":"https://www.globaltimes.cn/page/202610/1372901.shtml"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine Pushes Deep-Strike Campcampaign to 2,500 Kilometers Inside Russia","body":"Kyiv's forces hit a petrochemical plant and warehouse in Siberia roughly 2,500 kilometers from the border on October 24, alongside strikes on the Proton-Elektrotex defense plant in Orel, the Tolyattikauchuk synthetic rubber facility in Tolyatti, and an aircraft at the Yeysk airfield. A separate overnight drone raid hit the closed MegaGRINN shopping complex in Belgorod, one of Russia's largest malls at over 163,000 square meters, though no casualties were reported. The widening geographic reach of Ukrainian strikes signals an expanding long-range capability even as diplomatic efforts continue.","source":"Kyiv Independent / Ukrinform","url":"https://kyivindependent.com/"},{"headline":"Oleshky Ceasefire and POW Swap Mark Rare De-escalation Amid Continued Shelling","body":"Ukraine's General Staff confirmed a localized ceasefire will take effect around the occupied town of Oleshky starting October 27 to allow humanitarian aid delivery and civilian evacuations amid a deepening food crisis there. The move follows a swap of 270 prisoners of war brokered with help from the United States and the United Arab Emirates, with reports crediting US First Lady Melania Trump for helping arrange the local truce. Despite the pause, Russian strikes killed four and injured 78 people across Ukraine in the prior 24 hours, underscoring how narrow and fragile the de-escalation remains.","source":"Council on Foreign Relations / Ukrinform","url":"https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"}],"europe":[{"headline":"NATO Launches Neptune Strike Naval Exercise as Alliance Operationalizes New Russia War Plan","body":"NATO kicked off its Neptune Strike exercise across European waters this week, involving multinational naval groups including Germany's FGS Berlin, Canada's HMCS Ville de Quebec, and mine-countermeasure vessels from Lithuania, Poland, and Finland, alongside a Turkish amphibious demonstration off Albania. The drills come as the alliance works to implement the 'block, blunt, break' war plan unveiled by Supreme Allied Commander Europe General Alexus Grynkewich in Warsaw on October 12, designed to defeat a potential Russian attack using integrated drone and AI capabilities. NATO officials continue to stress the threat is not imminent but say lessons from Ukraine's battlefield are reshaping alliance doctrine.","source":"USNI News","url":"https://news.usni.org/2026/10/21/nato-kicks-off-neptune-strike-across-european-waters"},{"headline":"Cost-of-Living Protests Sweep France, Italy, and Beyond, Testing Governments","body":"More than 400,000 people demonstrated across France on October 24, including over 100,000 in Paris, with nearly 1,000 detained nationwide as unrest spread to Albania, Italy, and Belgium. Police used tear gas and water cannon in multiple cities, while scuffles broke out in Naples, Rome, and Milan over grievances including underfunded education, housing shortages, and stagnant wages. The uncoordinated but widespread protests, which followed similar October 17 demonstrations in Belgium, Portugal, and France, highlight how economic strain is becoming the central political pressure point for EU governments heading into winter.","source":"CNN","url":"https://www.cnn.com/2026/10/24/world/live-news/france-protests-paris-europe-intl"}]},"middleEast":[{"headline":"Houthi Missile Barrage Forces Temporary Closure of Riyadh Airport","body":"Saudi-led coalition air defenses intercepted Houthi ballistic missiles aimed at Riyadh and other targets over the past two days, with missile debris falling in Jeddah, Taif, and Rabigh. King Khalid International Airport is reopening terminals on Sunday after a partial shutdown, while Yemeni government-aligned forces claim to have conducted 736 strikes on Houthi positions in 24 hours. The Grand Mosque's top cleric separately condemned Houthi strikes near Mecca and Medina as a 'criminal approach,' reflecting the conflict's expanding reach toward Saudi religious and civilian infrastructure.","source":"Arab News","url":"https://www.arabnews.com/"},{"headline":"Netanyahu's AI Nuclear-Strike Image Sparks Backlash Two Days Before Israeli Election","body":"Prime Minister Benjamin Netanyahu posted an AI-generated image depicting a nuclear strike on Tel Aviv, warning voters of a 'second Holocaust' if Iran is not confronted while Donald Trump remains in office. Opposition figures Gadi Eisenkot and Yair Golan accused him of fearmongering just ahead of the vote. The post came the same day Israel closed all West Bank land crossings for election day and the IDF intensified operations in Hebron following the killing of a 20-year-old soldier in a shooting attack.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-october-25-2026/"},{"headline":"Iran Signals It Could Target US Diplomats Amid Fresh Nuclear Escalation Threats","body":"Iranian officials reportedly told associates that US diplomats and personnel are considered 'fair game' for assassination, with Washington assessing Tehran is in advanced planning stages for such attacks. Iran separately claimed to have shot down a US drone and warned it would strike energy and civilian targets if attacked again, at a time when interceptor missile stockpiles are strained across Israel and Gulf states. President Trump has said the US will not strike Iran before the November 3 elections, leaving a tense standoff in place through the near term.","source":"Jerusalem Post","url":"http://www.jpost.com/middle-east"}],"techAI":{"aiCompetition":[{"headline":"OpenAI Restarts Frontier Training With New 'Air-Gap' Security After Red-Team Scare","body":"OpenAI said it has resumed reinforcement-learning training and internal inference on its frontier models after a weeks-long pause triggered by a security review following the Hugging Face hacking incident. The red-teaming exercise, which tasked AI agents with probing for weaknesses, uncovered a previously unknown memory-corruption flaw in Google's Brotli decompression library affecting widely used software including Node.js, Bun and Envoy. Going forward, OpenAI says it will train frontier models, including an upcoming system referred to as GPT-6 Astra Cyber, without live internet access, joining Anthropic in adopting a form of air-gapped training.","source":"Benzinga","url":"https://www.benzinga.com/markets/tech/26/10/62577196/openai-resumes-frontier-ai-training"},{"headline":"UK Unveils World-First AI Biosecurity Lab With OpenAI, Anthropic Backing","body":"Britain's Cabinet Office announced a new AI Biosecurity Lab on October 24, pairing 100 million pounds in government funding with up to 200 million pounds in compute and model credits pledged by OpenAI and Anthropic. The lab, billed as the first dedicated organization using frontier AI to detect and respond to biological threats, sits within a broader 165-million-pound National AI Biosecurity Initiative and a more than 600-million-pound AI security package unveiled ahead of this week's budget. Google DeepMind and Basecamp Research are named as additional research partners, with officials still working out the lab's operating details.","source":"ts2.tech","url":"https://ts2.tech/en/uk-ai-biosecurity-labs-300m-ceiling-includes-200m-in-company-support/"}],"cyberEmerging":[{"headline":"Hacker Group 'k0t' Breaches Firewalls and VPNs Worldwide, Exposing 70,000+ Credentials","body":"A joint investigation by Group-IB and NyxLab revealed a large-scale campaign exploiting exposed firewall and VPN appliances, attributed to a threat actor tracked as k0t who also operates under aliases CryptoFeel and QazWsxShop. The attacker, assessed to have ties to ransomware operations including Qilin and The Gentlemen, used tools like Rclone to establish persistent access and exfiltrate data from victim organizations globally. Investigators say k0t relies on scanning services such as FOFA and ZoomEye to build target lists of vulnerable internet-facing network devices before compromising them.","source":"The Hacker News","url":"https://thehackernews.com/2026/10/hackers-breach-enterprise-firewalls-and.html"},{"headline":"Unrevoked Master Key Let Hackers Hijack LiteLLM's Release Pipeline for 136 Days","body":"LiteLLM, a widely used open-source gateway for orchestrating AI agents, disclosed that a master key accidentally leaked to a public GitHub repository in May 2026 was never revoked, allowing an attacker to exploit it on October 10. Using stolen GitHub owner and maintainer tokens, the attacker rewrote workflow permissions and on October 21 pushed a poisoned version of the Python package that harvested credentials and installed a backdoor before PyPI and LiteLLM intervened. The incident underscores growing supply-chain risk in AI infrastructure tooling as agent platforms proliferate with loosely scoped access credentials.","source":"The Hacker News","url":"https://thehackernews.com/2026/10/leaked-litellm-master-key-let-attackers.html"}]},"cities":{"lasVegas":[{"headline":"NBA Las Vegas Expansion Race Narrows to Two Bidders","body":"The NBA's search for a potential Las Vegas expansion franchise has been narrowed down to two ownership groups, according to a new report. The development signals the league is moving closer to a formal decision on bringing a team to the valley, long seen as a top expansion target given its growing sports market and existing arena infrastructure. No timeline for a final vote has been confirmed.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Henderson Man Charged After Teen Pedestrian Dies","body":"Henderson police have filed a vehicular manslaughter charge against a man accused of striking a teenage girl with his vehicle; the victim died from her injuries on Saturday. The case adds to a violent stretch in the Henderson area, where two people were also killed in a shooting this past week in the same neighborhood that saw a homicide just days earlier. Investigators have not released additional details on a motive or charges tied to the earlier shootings.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Las Vegas Children's Hospital Project Receives $150 Million Gift","body":"A major philanthropic donation of $150 million has been secured for a children's hospital project in Las Vegas, marking one of the largest healthcare gifts in the region's history. The funding is expected to accelerate development of pediatric medical infrastructure that local officials have pushed for amid population growth in Southern Nevada. Further details on construction timelines are expected to follow in coming weeks.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"}],"nellis":[{"headline":"F-22 Controls Anduril Drone in Nevada Skies, Advancing Air Force's AI Wingman Program","body":"In a test disclosed this week, a U.S. Air Force F-22 fighter directed the flight of an Anduril-built YFQ-44A drone, the latest milestone in the Collaborative Combat Aircraft program being refined at Creech Air Force Base. The YFQ-44A, assigned to the Experimental Operations Unit, was refueled and flown out of Creech as part of ongoing work to pair manned fighters with autonomous 'loyal wingman' drones. The effort builds on earlier tests and reflects the growing role Southern Nevada's ranges play in integrating AI-driven combat aircraft into frontline Air Force tactics.","source":"AIN Online","url":"https://www.ainonline.com/aviation-news/defense/2026-10-22/f-22-fighter-jet-controls-yfq-44a-drone-flight"}]},"feelGood":[{"headline":"Minnesota Bystander Saves 18 Children From Runaway School Bus","body":"A quick-acting man jumped aboard a moving school bus after noticing its driver was experiencing a medical emergency, successfully bringing it to a stop and saving all 18 children on board. Ebro Ahmed spotted the bus rolling down the street with its doors open and intervened before anyone was hurt. The incident has drawn wide praise as a reminder of ordinary heroism.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/"},{"headline":"Strangers Raise $146,000 for Longtime Tennessee Cinema Worker","body":"A fundraiser started by 21-year-old Brooklyn Green to help a 45-year veteran movie theater employee named Mary cover a single month's rent unexpectedly went viral, pulling in $146,000 in donations from strangers. What began as a small act of support turned into a life-changing outpouring of generosity. The campaign highlights how a modest gesture can snowball into major community support for someone who has quietly served the public for decades.","source":"Global Positive News Network","url":"https://www.globalpositivenewsnetwork.com/good-news-this-week-october-25th/"},{"headline":"Viral Story Brings Single Father and His Three Kids a New Home","body":"A single father named David, who had been raising three children while living in a New York City homeless shelter, is getting a fresh start after his story spread online. The surge of public attention led to more than $100,000 in donations that are funding a new home and stability for the family. The case is another example of a community mobilizing swiftly once a family's hardship became widely known.","source":"Global Positive News Network","url":"https://www.globalpositivenewsnetwork.com/good-news-this-week-october-25th/"}],"onThisDay":[{"year":"1415","event":"English forces under King Henry V defeated a larger French army at the Battle of Agincourt during the Hundred Years' War."},{"year":"1962","event":"US Ambassador Adlai Stevenson confronted the Soviet Union at the UN Security Council with photographic evidence of missiles in Cuba."},{"year":"1971","event":"The UN General Assembly adopted Resolution 2758, admitting the People's Republic of China and expelling the Republic of China (Taiwan)."},{"year":"1983","event":"The United States led a multinational invasion of Grenada to oust its Marxist government."}]},"topPicks":[{"headline":"Kremlin Confirms Trump-Putin-Xi Summit Prep as Russia Launches Massive Ukraine Barrage","teaser":"Diplomatic summit planning collides with escalating battlefield violence, raising stakes for any potential great-power brokered peace."},{"headline":"Inflation Reaccelerates Toward 3.8% as Strait of Hormuz Disruption Feeds Into Fed's Rate Debate","teaser":"Rising prices tied to Middle East shipping disruptions complicate the Fed's rate decisions and threaten global economic stability."},{"headline":"PLA Issues First 'Taiwan Recovery Day' Poster, Warning Against Independence Moves","teaser":"Beijing's symbolic propaganda escalation signals hardening rhetoric and rising tension over Taiwan's political future."}]},"navDates":[{"key":"2026-10-29","label":"Oct 29","href":"/","isNewest":true},{"key":"2026-10-28","label":"Oct 28","href":"/archive/2026-10-28.html","isNewest":false},{"key":"2026-10-27","label":"Oct 27","href":"/archive/2026-10-27.html","isNewest":false},{"key":"2026-10-26","label":"Oct 26","href":"/archive/2026-10-26.html","isNewest":false},{"key":"2026-10-25","label":"Oct 25","href":"/archive/2026-10-25.html","isNewest":false},{"key":"2026-10-24","label":"Oct 24","href":"/archive/2026-10-24.html","isNewest":false},{"key":"2026-10-23","label":"Oct 23","href":"/archive/2026-10-23.html","isNewest":false}],"currentKey":"2026-10-25","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-10-25.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
