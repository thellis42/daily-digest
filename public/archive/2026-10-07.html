<script>
const STATE = {"digest":{"date":"Wednesday, October 7, 2026","generatedAt":"Wed, Oct 7, 9:28 AM PDT","breaking":{"headline":"Iran-linked drone threat forces US to pull all B-1 bombers from UK base","body":"All twelve B-1 bombers stationed at RAF Fairford, the main US strike-bomber hub in Europe, were flown back to the continental United States over the weekend after US and UK officials received intelligence pointing to a possible short-range drone attack on the base tied to Iran's Revolutionary Guard Corps. President Trump confirmed on October 5 that threats linked to Iran prompted the move, while the Pentagon insists American strike capability from CONUS remains unaffected. The episode comes as UK counter-terrorism police made a sixth arrest, a 25-year-old British-Iranian dual national in Westminster, in a widening probe of a suspected Iran-backed plot, underscoring how the Iran war is now generating direct security risks on NATO soil.","url":"https://www.justsecurity.org/159804/early-edition-october-6-2026/"},"tabs":{"defense":{"defense":[{"headline":"CENTCOM blockade claims zero Iranian oil exports this week","body":"Treasury Secretary Scott Bessent said US naval enforcement in the Strait of Hormuz has pushed Iranian oil exports to zero for the first time since Tehran began pumping crude, with roughly 1.1 billion barrels of non-Iranian oil moving through the strait under US protection while Iranian tankers are turned away. The claim, if sustained, would mark a major escalation of economic pressure on Iran layered on top of the ongoing military standoff. Analysts are watching whether the blockade begins intercepting loaded crude shipments rather than empty hulls as mediators continue to push a seven-day reopening framework.","source":"AND Magazine Morning Security Brief","url":"https://andmagazine.substack.com/p/morning-security-brief-6-october"},{"headline":"Hegseth taps Musk, Luckey and Gingrich for new warfare-tech panel, raising ethics flags","body":"Defense Secretary Pete Hegseth has named Elon Musk, Anduril founder Palmer Luckey, and Newt Gingrich to a new Pentagon advisory panel tasked with shaping future autonomous-weapons policy. Watchdogs note the arrangement raises conflict-of-interest concerns because Musk's SpaceX and Luckey's Anduril stand to directly benefit from the panel's recommendations on next-generation weapons systems. The appointments land the same week Anduril secured a multibillion-dollar Navy-backed manufacturing deal, intensifying scrutiny of how closely the companies' commercial interests track Pentagon policy decisions.","source":"NPR / Inside Defense","url":"https://www.npr.org/sections/national-security/"},{"headline":"NATO's SACEUR to unveil 'Theory of Victory' doctrine amid Baltic hybrid-war alarm","body":"General Alexus Grynkewich, NATO's Supreme Allied Commander Europe, is set to present an unclassified strategy document in Poland on October 12 outlining how the alliance would rapidly halt and defeat a Russian assault on its eastern flank using a mix of conventional forces, drones and AI-enabled targeting. The rollout comes as Lithuania's prime minister publicly pressed NATO for a firmer collective response to Russian hybrid attacks, citing incidents in Leipzig and Denmark, and said Vilnius would fund construction of a permanent US base on its territory if Washington agrees to establish one. The Kremlin warned that any move by Lithuania to host nuclear weapons would trigger further regional escalation.","source":"NATO watchers / Early Edition","url":"https://mezha.net/eng/news/28e01c39_nato_commander_prepares_strategy"}],"acquisitions":[{"headline":"Navy backs $6.6 billion Anduril deal for new Virginia-class submarine parts plant","body":"The Trump administration announced a $6.6 billion investment package with Anduril Industries, with the Navy committing $2.9 billion toward a new Baltimore County, Maryland facility that will manufacture critical components for Virginia-class fast-attack submarines. The deal is the latest in a string of major contracts flowing to companies with financial ties to the president's sons, drawing renewed scrutiny over Pentagon acquisition conflicts of interest even as officials frame it as essential to closing the submarine industrial-base gap.","source":"ABC News","url":"https://abcnews.com/Politics/trump-sons-investments-won-billions-pentagon-contracts-election/story?id=137049598"},{"headline":"Pentagon locks in multibillion-dollar missile production ramps with Boeing and RTX","body":"The Pentagon awarded Boeing a $14.7 billion contract to support ramped-up production of PAC-3 interceptor seekers, while the Navy signed a multiyear deal with RTX for SM-6 missiles worth up to $24 billion, among the largest munitions procurement actions of the year. Northrop Grumman separately received $111 million to advance engineering and manufacturing development on the Sentinel ICBM program, reflecting a broader push to rebuild munitions stockpiles depleted by the Iran campaign and sustain the layered Golden Dome missile-defense buildout.","source":"Inside Defense / Inside Missile Defense","url":"https://insidedefense.com/content/inside-missile-defense-october-7-2026"}]},"us":[{"headline":"ABC and Disney Face Off With Trump's FCC in Federal Court","body":"A federal judge in Washington heard two hours of arguments Tuesday in ABC and Disney's First Amendment suit against FCC Chairman Brendan Carr, who ordered an unusually early relicensing review of eight ABC-owned stations after Jimmy Kimmel's joke about Trump drew the president's ire. ABC's attorney compared the chilling effect to 'a looming execution by guillotine,' while government lawyers countered that the court lacks jurisdiction and that no final agency action has occurred. Judge Loren AliKhan, an Obama-era... actually a Biden nominee, did not rule but ordered supplemental briefs due October 9 and 14, pushing any decision to at least mid-October, just weeks before the midterms.","source":"Associated Press","url":"https://www.bostonglobe.com/2026/10/06/nation/abc-fcc-free-speech-court/"},{"headline":"Trump Won't Commit to Reimbursing Taxpayers for Political Ad Blitz","body":"A day after pledging that his MAGA Inc. super PAC would fund his controversial ad campaign going forward, the White House gave no indication Trump plans to repay the roughly $12 million in taxpayer money already spent airing the spots. The ads were part of a $20 million contract the Department of Homeland Security had tapped, raising fresh questions from Democrats about using federal agency funds for campaign-style messaging ahead of November's midterms.","source":"Associated Press","url":"https://www.wsls.com/news/politics/2026/10/06/trump-hasnt-committed-to-repaying-federal-funds-already-spent-on-ads-a-white-house-official-says/"},{"headline":"Supreme Court's New Term Opens With Guam Basing and Climate Liability Fights","body":"The Supreme Court kicked off its 2026-27 term this week, hearing arguments Monday in Suncor Energy v. Boulder County over whether federal law blocks state tort suits targeting oil companies for climate damages. On Wednesday the justices turned to Department of the Air Force v. Prutehi Guahan, a dispute over legal challenges to the Pentagon's military buildup on Guam, a case with direct implications for US force posture in the Indo-Pacific. No opinions have been issued yet this term.","source":"SCOTUSblog","url":"https://www.scotusblog.com/"},{"headline":"Weak September Jobs Data Still Rattling Washington's Economic Debate","body":"The final jobs snapshot before the midterms showed the economy added just 29,000 positions in September, far below the 84,000-90,000 economists expected, while unemployment ticked up to 4.2 percent. Revisions erased 60,000 previously reported jobs from July and August, and wage growth slowed to its weakest annual pace since 2021. The soft report has fueled Democratic attacks on the administration's economic stewardship and is seen as strengthening the case for the Federal Reserve to hold or cut rates at its next meeting.","source":"CNN","url":"https://www.cnn.com/2026/10/02/economy/us-jobs-report-september-final"}],"pacific":{"pacificCommand":[{"headline":"Seoul and Pyongyang Trade Accusations Over Second DMZ Mine Blast","body":"South Korea's military released footage on October 6 of a mine detonating a day earlier during a clearance operation near the Demilitarized Zone, which Seoul says was planted illegally by North Korean forces. Pyongyang's Foreign Ministry rejected the accusation as fabricated and warned of an 'immediate and powerful counteraction' if the South retaliates. The incident follows a September 21 blast that wounded three South Korean soldiers, adding a conventional flashpoint to already elevated tensions between the two Koreas.","source":"Rio Times / Reuters","url":"https://riotimesonline.com/asia-intelligence-brief-tuesday-october-6-2026"},{"headline":"US F-35s Fly Alongside Indian Tejas Jets in Tarang Shakti Drills","body":"American F-35 Lightning II stealth fighters joined Indian Air Force HAL Tejas jets in the Tarang Shakti 2026 exercise this week, a rare showcase of fifth-generation US air power for New Delhi. Analysts note Washington is still withholding its most sensitive technology even as the drills deepen interoperability between the two militaries. The exercise comes as India separately expands defense exports, including Akash missile systems to Central Asian states, part of a broader push to diversify partnerships amid rivalry with both Russia and China for regional influence.","source":"South China Morning Post","url":"https://www.scmp.com/news/asia"},{"headline":"Okinawa Murder Arrest of US Marine Reignites Base Tensions in Japan","body":"Japanese police this week arrested a US Marine stationed on Okinawa on suspicion of robbing and killing a woman in Naha, triggering a protest outside the US embassy in Tokyo on October 6. The case has revived long-standing public anger over the American troop presence and the Status of Forces Agreement, which can complicate Japanese prosecution of US personnel. Because the Marine was off-duty and detained by Japanese police off-base, legal hurdles should be minimal this time, though the political fallout could still pressure the Takaichi government ahead of further base-related negotiations.","source":"Foreign Exchanges","url":"https://www.foreignexchanges.news/p/world-roundup-october-6-2026"}],"pacingThreat":[{"headline":"Satellite Images Show PLA Light Attack Aircraft at New Laos Training Base","body":"New satellite imagery reviewed by Reuters shows light attack aircraft and military vehicles have arrived at a newly announced China-Laos joint training facility, signaling Beijing's effort to deepen its military footprint in mainland Southeast Asia. The buildup follows last week's announcement of the facility and comes as China continues building out training infrastructure outside its borders, including prior work in Djibouti and Cambodia, extending the PLA's regional reach and logistics network.","source":"Reuters via FDD Overnight Brief","url":"https://www.fdd.org/overnight-brief/october-7-2026/"},{"headline":"PLA Bombers Test Upgraded Standoff Missile for A2/AD Strikes","body":"State media footage reviewed by Janes on October 7 shows PLA Air Force H-6 bombers working with PLA Navy fighters to refine long-range anti-access/area-denial tactics using an enhanced variant of the KD-63 air-launched cruise missile. The baseline KD-63, built by China Aerospace Science and Industry Corporation for older H-6H bombers, has a range of roughly 200 kilometers, and the new variant appears designed to extend standoff strike reach against US and allied naval forces operating near China's periphery.","source":"Janes","url":"https://www.janes.com/defence-intelligence-insights/defence-news/defence/china-enhances-standoff-bomber-attack-capabilities"},{"headline":"Think Tank War Game Flags Chinese Cable-Cutting, Cyber Threat to Taiwan","body":"A tabletop exercise held in Taiwan by the Foundation for Defense of Democracies, reported October 6, concluded that Beijing is more likely to sever undersea cables and launch cyberattacks to knock out telecommunications than to attempt an outright invasion or blockade in the near term. The gray-zone coercion scenario tested how Taiwan's military and civilians would respond to a sudden blackout of cell and internet service timed to pressure Taipei toward unification talks. The findings come as Taiwan separately works to expand urban counter-drone defenses and just received its first two F-16V Block 70 fighters on October 2.","source":"The Washington Times","url":"https://washingtontimes.com/news/2026/oct/6/war-game-highlights-taiwan-response-chinese-communications-attacks"}]},"europe":{"ukraineRussia":[{"headline":"Russia escalates bridge-strike campaign as Moscow faces record drone barrage","body":"Russian forces struck a Dnipro River bridge in Zaporizhzhia City on October 6, part of what analysts at the Institute for the Study of War describe as an intensifying campaign against bridges in major Ukrainian cities designed to terrorize civilians and strain the economy. In apparent retaliation, Ukraine launched its largest assault on the Russian capital region to date, with Moscow officials saying roughly 290 drones targeted the city overnight, killing two people and igniting a warehouse fire. Russia also fired 137 drones at Ukraine overnight October 5-6 as both sides trade escalating long-range strikes on energy and transport infrastructure.","source":"Al Jazeera / Critical Threats","url":"https://www.aljazeera.com/news/2026/10/6/ukraine-launches-major-drone-attack-on-russias-moscow-region-killing-two"},{"headline":"Poland unveils $26B civil defense plan as US pushes fresh trilateral peace talks","body":"Poland announced it will deploy Patriot air-defense batteries near its border with Ukraine alongside a $26 billion civil-defense investment plan, underscoring NATO's eastern flank buildup even as diplomacy accelerates. Ukrainian President Volodymyr Zelensky said the United States has proposed new trilateral peace talks to conclude by the end of October, a proposal Kyiv has received positively even as Moscow vows further retaliatory strikes on Kyiv infrastructure. The dual-track approach of deterrence and negotiation comes after a Ukrainian drone strike damaged Kyiv's Northern Bridge over the weekend, prompting Russian threats of intensified bombardment.","source":"Kyiv Independent / CNBC","url":"https://kyivindependent.com/"}],"europe":[{"headline":"NATO drafts 'Theory of Victory' doctrine built on drones and AI","body":"NATO's Supreme Allied Commander Europe, Gen. Alexus Grynkewich, is preparing to unveil a new strategy in Poland on October 12 aimed at achieving rapid victory against any Russian attack on the alliance's eastern flank by fusing drones and artificial intelligence with conventional forces. The unclassified draft, reported by Bloomberg, signals a shift in how member states will prioritize defense spending as tensions with Moscow remain elevated. A NATO official confirmed the plan's existence, which comes alongside Secretary General Mark Rutte's recent visits to German and Dutch corps units emphasizing eastern-flank readiness.","source":"Bloomberg / Kyiv Independent","url":"https://www.bloomberg.com/news/articles/2026-10-05/nato-drafts-plan-to-defeat-a-russian-attack-with-drones-and-ai"},{"headline":"Migration fallout from Spain's Ceuta crisis threatens to fracture Schengen","body":"The political aftershocks of Spain's mass migrant regularization program continue to roil the EU, with leaders from 22 of the bloc's 26 other member states identifying Madrid's policy as the key 'pull factor' behind the Ceuta crisis. Italy's Giorgia Meloni and Denmark's Mette Frederiksen have led calls for Spain's potential suspension from the Schengen zone, arguing uncontrolled irregular entry threatens continental security, while the European Commission has moved to block irregular arrivals at Ceuta and Melilla from reaching mainland Europe. The dispute has compounded with mass housing protests in Madrid, where nearly 500,000 demonstrators recently took to the streets, reflecting how immigration and affordability are now the dominant twin pressures reshaping European politics.","source":"Euronews / Wikipedia","url":"https://www.euronews.com/2026/07/24/from-housing-to-healthcare-what-are-europeans-worried-about-in-2026"}]},"middleEast":[{"headline":"Israel braces for possible Hamas, Iran attacks on October 7 anniversary","body":"Israel's National Security Council warned of a heightened risk of attacks by Iran or Hamas timed to the third anniversary of the October 7, 2023 assault, prompting IDF, Shin Bet and police chiefs to meet on securing the country's upcoming October 27 election. Defense Minister Israel Katz cited intelligence suggesting Hamas intends to target Israeli forces in Gaza, while Prime Minister Netanyahu said Hamas would try to strike to influence the vote. Separately, Israel's Dubai repatriation effort, which has already returned over 7,400 citizens via special flights, is set to conclude this week.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-october-06-2026/"},{"headline":"Yemeni government forces press counteroffensive as Houthis strike Aden airport","body":"Saudi-backed Yemeni troops, supported by roughly 100 coalition fighter jets, have retaken the strategic port of Mocha and secured positions near the Bab al-Mandeb Strait in a campaign dubbed 'Yemen Dawn,' with the coalition claiming over 300 Houthi targets destroyed. The Houthis retaliated by firing missiles at Aden and Riyadh-area targets, with Saudi forces intercepting a ballistic missile near Khamis Mushait and one striking Aden airport's runway just before a Cairo flight was due to land. The fighting, concentrated around Taiz, comes amid broader regional turmoil tied to the ongoing US-Israel war on Iran.","source":"Al Jazeera / Bloomberg","url":"https://www.aljazeera.com/news/2026/10/7/yemens-houthis-attack-aden-airport-saudi-forces-down-missile-near-riyadh"},{"headline":"Trump threatens snap sanctions on banks dealing with Iran amid leadership confusion","body":"The US Treasury signaled that foreign financial institutions conducting business with Iran could face sanctions without advance notice, part of Washington's pressure campaign following the February 28 US-Israeli operation that killed Iran's Supreme Leader Ayatollah Khamenei. President Trump stirred controversy by saying 'nobody knows who's running Iran' and suggesting Tehran could target Los Angeles or San Diego as a 'small price' for safety, remarks that drew sharp domestic backlash. The comments came as grieving families of US troops killed in the war's deadliest attack were notably absent from a recent White House commemoration event.","source":"Jerusalem Post / Britannica","url":"https://www.jpost.com/middle-east/iran-news/2026-10-06/live-updates-910734"}],"techAI":{"aiCompetition":[{"headline":"DeepSeek Nears $12-15B Round With Tencent, CATL Ahead of 2027 Hong Kong IPO","body":"Chinese AI lab DeepSeek is close to locking in at least 80 billion yuan (about $12 billion) in fresh funding, with Tencent and battery giant CATL among the largest backers, and may expand the round to roughly 100 billion yuan (~$14.9 billion) given surging investor demand after its newest model launch. It is DeepSeek's first time accepting outside capital, and the raise is widely viewed as a bridge toward a Hong Kong listing targeted for early 2027. The firm is reportedly favoring state-backed and corporate investors over retail-funded vehicles, signaling Beijing's interest in cultivating a national AI champion.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-10-06/deepseek-to-raise-at-least-12-billion-in-tencent-backed-funding"},{"headline":"OpenAI in Early Talks for $30B Round That Could Value It at $1.4 Trillion","body":"OpenAI is reportedly in early discussions with Abu Dhabi's MGX and asset manager BlackRock to anchor a $30 billion funding round that would push its valuation to roughly $1.4 trillion, even as its IPO timeline keeps slipping, now expected no sooner than 2027. The potential raise would follow a $122 billion round in March at an $852 billion valuation. CEO Sam Altman has pointed to AI-safety concerns, not just capital needs, as part of the rationale for staying private longer.","source":"Cryptonomist","url":"https://en.cryptonomist.ch/2026/10/06/openai-30-billion-funding"}],"cyberEmerging":[{"headline":"Pentagon Says It Has Cut Off Anthropic's Claude, Though Use Reportedly Lingered Into Last Week","body":"A Defense Department official told the BBC on Monday that the Pentagon has fully ceased using Anthropic's AI products, months after Defense Secretary Pete Hegseth designated the firm a 'national security supply-chain risk' in February over its refusal to loosen Claude's guardrails on autonomous weapons and domestic surveillance. Multiple BBC sources say Claude remained embedded in Palantir's Maven Smart System and was still used for intelligence work tied to operations against Iran as recently as last week, undercutting earlier Pentagon claims that the transition was about 90 percent complete. Anthropic sued over the designation and lost on appeal in September, while the Pentagon has since expanded contracts with Google, xAI and OpenAI.","source":"BBC via MyJoyOnline","url":"https://www.myjoyonline.com/pentagon-stops-using-anthropic-ai-tools-after-blacklisting-company-bbc-told/"},{"headline":"Trump's 'Super Intelligence Force' Task Force Formalizes Light-Touch AI Posture","body":"Building on his executive order renaming artificial intelligence as 'Super Intelligence' across federal agencies, the Trump administration has stood up a task force chaired by national intelligence director Jay Clayton, with FTC Chair Andrew Ferguson among its members, given 120 days to report on AI risks and opportunities. The group's charter explicitly emphasizes avoiding overregulation while protecting America's competitive edge over China, reinforcing a hands-off approach even as prominent researchers continue warning about frontier-model risks. The move follows a voluntary 'White House Accord on Super Intelligence' signed by executives from OpenAI, Google, Meta, Anthropic, Nvidia and xAI.","source":"TechCrunch","url":"https://techcrunch.com/2026/10/04/trump-unveils-his-new-super-intelligence-force/"}]},"cities":{"lasVegas":[{"headline":"Two Nevada casinos face closure, hundreds of jobs at stake","body":"A pair of Nevada casinos owned by a Las Vegas professional poker player are at risk of shutting down next month, a move that would put roughly 239 jobs on the line. The same operator previously oversaw similar casino closures in Washington state, raising questions about the chain's broader financial health. Local regulators and workforce agencies are watching the situation closely as it could ripple through the valley's hospitality labor market.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Jury awards $29.5M in Las Vegas police misconduct case","body":"A Las Vegas woman has been awarded a $29.5 million settlement after jurors determined she was wronged by police misconduct, according to her attorney. The case adds to ongoing scrutiny of Metro police practices and comes as civil liberties advocates, including the ACLU of Nevada, raise separate concerns about surveillance tools used by local law enforcement. The size of the payout is among the largest of its kind in recent Clark County history.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Las Vegas home prices slide as market cools further","body":"Southern Nevada home prices have fallen roughly $20,000 from their record high as climbing mortgage rates cool buyer demand. Listings data shows more than 10,000 homes now on the market, the highest total in over a decade, while thousands of single-family listings are going without offers. The slowdown is pushing some ZIP codes, including Pahrump, into stronger buyer's-market territory than anywhere else in the state.","source":"Las Vegas Sun / Review-Journal","url":"https://www.reviewjournal.com/local/"}],"nellis":[{"headline":"$185M contract to upgrade Nellis, Creech and NTTR infrastructure","body":"The Air Force has awarded North Las Vegas-based Weldin Construction LLC a ceiling of $185 million for an indefinite-delivery, indefinite-quantity contract covering base engineering work at Nellis Air Force Base, Creech Air Force Base and the Nevada Test and Training Range. The contract, managed by the 99th Contracting Squadron at Nellis, obligates an initial $2,089,542 in fiscal 2026 operations and maintenance funds and runs through September 2031. The long-term deal underscores sustained investment in Southern Nevada's sprawling military footprint as the Air Force modernizes facilities supporting fighter, testing and autonomous-aircraft missions.","source":"ClearanceJobs","url":"https://news.clearancejobs.com/2026/10/07/space-systems-command-adds-9-4m-to-aegis-aerospace-contract/"}]},"feelGood":[{"headline":"Nellis airmen execute rapid rescue of downed Navy helicopter crew","body":"Airmen based out of Nellis Air Force Base carried out a fast-moving rescue operation to recover a Navy helicopter crew in distress, according to a recent Air Force release. The mission reflects the kind of split-second readiness search-and-rescue units at Nellis train for year-round, turning a potentially tragic outcome into a successful save. It's a reminder that behind the base's high-profile weapons testing, airmen are also on call to protect fellow service members in real emergencies.","source":"Nellis Air Force Base Public Affairs","url":"https://www.nellis.af.mil/Nellis-News/News-Releases/"},{"headline":"More than 100 women veterans gather in Washington for healing and advocacy","body":"Wounded Warrior Project brought over 100 women veterans from across the country to Washington, D.C. for its 2026 Women Warriors Summit, pairing peer support with advocacy training. The gathering gives post-9/11 women veterans a rare chance to connect with others who share their experience of service-related mental and physical wounds. Organizers say the summit is part of a broader push to reshape how the nation supports veterans long after they leave the battlefield.","source":"Wounded Warrior Project","url":"https://www.woundedwarriorproject.org/"},{"headline":"Charity drive aims to build more homes for badly injured veterans","body":"Homes For Our Troops is using National Donor-Advised Fund Day on October 8 to rally new donations toward building specially adapted, mortgage-free homes for severely injured post-9/11 veterans. The nonprofit says nearly 90 cents of every dollar donated goes directly toward veteran program services rather than overhead. Each custom home is designed around a veteran's specific injuries, letting amputees and others with catastrophic wounds regain independence they lost in service.","source":"Homes For Our Troops","url":"https://www.hfotusa.org/"}],"onThisDay":[{"year":"1571","event":"The Holy League defeated the Ottoman fleet at the Battle of Lepanto."},{"year":"1949","event":"The German Democratic Republic (East Germany) was officially established."},{"year":"2001","event":"The United States and United Kingdom launched airstrikes against Taliban and al-Qaeda targets in Afghanistan, beginning Operation Enduring Freedom."},{"year":"2003","event":"Arnold Schwarzenegger was elected Governor of California in a special recall election."}]},"topPicks":[{"headline":"Israel braces for possible Hamas, Iran attacks on October 7 anniversary","teaser":"Heightened alert grips Israel as the anniversary of the 2023 attacks raises fears of renewed violence."},{"headline":"Iran-linked drone threat forces US to pull all B-1 bombers from UK base","teaser":"A sudden withdrawal of strategic bombers signals rising tension and security concerns tied to Iranian drone capabilities."},{"headline":"Russia escalates bridge-strike campaign as Moscow faces record drone barrage","teaser":"Intensifying strikes on infrastructure coincide with an unprecedented drone assault on the Russian capital, deepening the war's volatility."}]},"navDates":[{"key":"2026-10-09","label":"Oct 9","href":"/","isNewest":true},{"key":"2026-10-08","label":"Oct 8","href":"/archive/2026-10-08.html","isNewest":false},{"key":"2026-10-07","label":"Oct 7","href":"/archive/2026-10-07.html","isNewest":false},{"key":"2026-10-06","label":"Oct 6","href":"/archive/2026-10-06.html","isNewest":false},{"key":"2026-10-05","label":"Oct 5","href":"/archive/2026-10-05.html","isNewest":false},{"key":"2026-10-04","label":"Oct 4","href":"/archive/2026-10-04.html","isNewest":false},{"key":"2026-10-03","label":"Oct 3","href":"/archive/2026-10-03.html","isNewest":false}],"currentKey":"2026-10-07","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-10-07.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
