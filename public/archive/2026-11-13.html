<script>
const STATE = {"digest":{"date":"Friday, November 13, 2026","generatedAt":"Fri, Nov 13, 9:12 AM PST","breaking":{"headline":"Nvidia CEO Jensen Huang Resigns Amid Chinese Espionage Scandal","body":"Jensen Huang stepped down Thursday as CEO of Nvidia, the roughly $4 trillion chipmaker at the center of the global AI boom, after revelations that he carried on an affair with Alice Huang, a Singapore-based Megaspeed executive identified by US intelligence as a suspected Chinese agent. A second disclosed affair with an Nvidia vice president who reported to him compounded internal pressure, and the board reportedly convened an emergency session before accepting his resignation; CFO Colette Kress will serve as interim CEO. The scandal has triggered FBI and congressional inquiries into whether Nvidia chips were diverted to China, and shares fell as much as 4-12% on the news, a major shock given Nvidia's role in export-control fights with Beijing and its outsized weight on US markets.","source":"Washington Post","url":"https://www.washingtonpost.com/technology/2026/11/12/nvidia-board-weighs-jensen-huangs-future-after-affair-with-allege-chinese-spy/"},"tabs":{"defense":{"defense":[{"headline":"CENTCOM Tells Israel to Prepare for Possible Resumption of Iran Campaign","body":"US Central Command has quietly notified Israeli counterparts in recent days to ready for a renewed military campaign against Iran, according to Israeli military correspondent reporting picked up Thursday. The warning lands as President Trump publicly vowed he would strike Iran again 'without hesitation' if Tehran threatens US forces or allies, even as the IDF has signaled no immediate need to attack and Gulf states are urging restraint. The last confirmed US strike hit Iranian air defenses near Qeshm Island on November 6, but Tehran has threatened to hit US bases, including in Europe, if facilities like Pickaxe Mountain are targeted again.","source":"All Israel News","url":"https://allisraelnews.com/brief/us-centcom-tells-idf-to-prepare-for-possible-resumption-of-iran-campaign"},{"headline":"Hegseth Revives WWII-Era OSS Inside Special Operations Command","body":"Defense Secretary Pete Hegseth signed a memorandum this week elevating the Assistant Secretary of War for Special Operations/Low-Intensity Conflict to Under Secretary of War equivalence and reviving the Office of Strategic Services name, 81 years after the WWII intelligence and sabotage agency was dissolved. The move is framed as strengthening the bureaucratic authority and visibility of special operations policy inside the Pentagon rather than creating a new covert-action arm. It comes the same week Hegseth was publicly rebuked by an Army sentinel at the Tomb of the Unknown Soldier for his group's loud conduct during a visit.","source":"RedState","url":"https://redstate.com/nick-arama/2026/11/13/hegseth-has-an-important-announcement-about-the-oss-n2209357"},{"headline":"Pentagon Greenlights Permanent US Troop Presence in Poland","body":"Polish Deputy Prime Minister and Defense Minister Władysław Kosiniak-Kamysz said Wednesday that the Pentagon has approved a permanent US troop presence in Poland, with a final White House decision expected in early December. The announcement followed his meeting with Defense Secretary Pete Hegseth in Washington and comes alongside Warsaw's push to acquire long-range US strike systems, reflecting NATO's eastern flank buildup amid continued Russian pressure. If finalized, it would mark one of the most significant shifts in US force posture in Central Europe since Russia's invasion of Ukraine.","source":"Just Security","url":"https://www.justsecurity.org/164357/early-edition-november-13-2026/"}],"acquisitions":[{"headline":"US Backs Polish Buy of Tomahawk Missiles and Typhon Launchers","body":"Poland's Defense Minister Władysław Kosiniak-Kamysz announced Thursday that the Pentagon has endorsed Warsaw's request to purchase Tomahawk cruise missiles and Typhon Mid-Range Capability launchers, systems capable of striking targets up to 1,600 kilometers away. The deal, discussed during Kosiniak-Kamysz's talks with Secretary Hegseth this week, would make Poland one of the few NATO members outside the US fielding ground-launched Tomahawks, significantly extending allied deep-strike reach against Russian targets.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026"},{"headline":"Pentagon Pushes Industrial-Base Loans for Launch, Chips and Batteries","body":"The Defense Department's credit office issued a $150 million loan to Rocket Lab to expand domestic space-launch capacity, a $75 million loan to semiconductor firm Halo for US-based chip production, and a separate $250 million deal through the Office of Strategic Capital to secure domestic advanced battery supply chains, all disclosed this week. The moves reflect a broader Pentagon strategy of using direct financing to reduce reliance on foreign suppliers for critical defense inputs, even as a separate report flagged a $14 billion shortfall in Air Force aircraft spare-parts funding that is straining readiness.","source":"Inside Defense","url":"https://insidedefense.com/content/inside-pentagon-november-12-2026"}]},"us":[{"headline":"Van Hollen Launches Long-Shot Bid to Unseat Schumer as Senate Democratic Leader","body":"Maryland Senator Chris Van Hollen announced Thursday that he will challenge Chuck Schumer for Senate Democratic leader once the party takes control of the chamber in January, capping a wave of post-midterm leadership turmoil. The challenge follows historic Democratic gains that will give the party at least 255 House seats and 55 Senate seats next Congress. Underscoring the pressure on incumbent leadership, more than 50 Sunrise Movement activists were arrested Thursday during a sit-in at Schumer's Washington office demanding he step aside and that Democrats scrap the filibuster.","source":"CNN / Democracy Now","url":"https://www.cnn.com/2026/11/13/politics/live-news/trump-congress"},{"headline":"Treasury Secretary Bessent Moved to Military Base After Reported Iranian Threats","body":"The Trump administration confirmed Wednesday that Treasury Secretary Scott Bessent has been relocated from his Washington home to a military installation following what officials describe as credible threats against his life originating from Iran. The move adds Bessent to a growing list of senior US officials under heightened protection amid ongoing friction with Tehran. No further details on the specific threat or duration of the relocation have been publicly disclosed.","source":"Democracy Now","url":"https://www.democracynow.org/2026/11/12/headlines"},{"headline":"Kennedy Family, Virginia Officials Sue to Block Trump's Arlington Triumphal Arch","body":"A coalition including Vietnam War veterans, Arlington County, the Commonwealth of Virginia, the District of Columbia and members of the Kennedy family filed suit this week to stop construction of a planned 250-foot triumphal arch near Arlington National Cemetery, arguing it would disrupt the sightline from JFK's eternal flame. The litigation coincides with House Democrats sending preservation letters to dozens of federal agencies and private contractors amid whistleblower claims that Trump officials destroyed records related to the project in possible violation of the Federal Records Act. The dispute adds a new legal front to scrutiny of the administration's monument-building initiatives heading into the next Congress.","source":"Democracy Now","url":"https://www.democracynow.org/2026/11/12/headlines"},{"headline":"House GOP Unites to Quash Impeachment Push Against Defense Secretary Hegseth","body":"House Republican leaders this week blocked an effort to impeach Defense Secretary Pete Hegseth, displaying unexpected party unity just days after Democrats' sweeping midterm victories reshaped the incoming Congress. The move signals GOP leadership's intent to shield the Pentagon chief from further oversight fights even as Democrats prepare to take the House majority in January. Hegseth's survival comes amid broader turnover anxiety inside the administration following the Nvidia espionage fallout dominating this week's news cycle.","source":"CNN","url":"https://www.cnn.com/interactive/2026/11/us/cnn-5-things-news-quiz-november-13-sec/"}],"pacific":{"pacificCommand":[{"headline":"Seoul Fast-Tracks Nuclear-Powered Attack Submarine Program","body":"South Korea's Defense Acquisition Program Administration approved the basic acquisition strategy for the Jang Bogo N nuclear-powered attack submarine program on November 6, clearing the way for design work to begin in 2027 with an initial budget of 96.6 billion won. The effort, aimed at tracking North Korean ballistic-missile submarines, still hinges on Washington supplying low-enriched uranium fuel below 20 percent enrichment, and a shipbuilder won't be chosen until a competitive bid in 2027. The push comes just days after Hanwha Ocean launched the conventionally powered Seo Hui, South Korea's second KSS-III Batch-II submarine, at its Geoje shipyard on November 3.","source":"Army Recognition / SANA","url":"https://www.armyrecognition.com/news/navy-news/2026/south-korea-fast-tracks-new-nuclear-submarine-project-to-hunt-north-korean-ballistic-missile-subs"},{"headline":"Tokyo Drafts Industrial Strategy for a 'Prolonged Conflict'","body":"Japan's Defense Minister Koizumi Shinjiro and Economy Minister Akazawa Ryosei met with Mitsubishi Heavy Industries, Kawasaki Heavy Industries and other contractors on November 4 to hash out a new Defense Industrial Base Strategy due by year's end, aimed squarely at whether domestic industry could sustain the Self-Defense Forces through an extended war. The plan's three pillars are sustaining wartime production capacity, adapting to drone and AI-enabled warfare, and tying defense spending to broader economic growth, building on Japan's existing 43 trillion yen ($272 billion) buildup through fiscal 2027. The move signals Tokyo is shifting from acquisition-focused rearmament toward wartime industrial resilience.","source":"Indo-Pacific Insights","url":"https://indopacificinsights.substack.com/p/indo-pacific-5x5-november-11th-2026"},{"headline":"Manila's Coast Guard Gains US-Supplied Surveillance Aircraft","body":"The Philippine Coast Guard is set to receive three secondhand King Air 350 Extended Range turboprops under a $39.6 million US-funded contract, with two of the planes outfitted with intelligence, surveillance and reconnaissance sensors to extend monitoring range, speed and altitude. The transfer is part of a broader buildup that already includes ex-US Coast Guard patrol boats, a Reliance-class cutter, and funding to expand a Palawan pier closer to the Spratly Islands. The aircraft add to Manila's push for sustained maritime-domain awareness across the West Philippine Sea amid continued friction with Chinese vessels in the area.","source":"Eurasia Review / Indo-Pacific Defense Forum","url":"https://www.eurasiareview.com/10112026-philippine-coast-guard-bolsters-surveillance-with-turboprop-planes-from-u-s/"}],"pacingThreat":[{"headline":"Taiwan Officials Describe Early-November PLA Drills as 'Silent Intimidation'","body":"A senior Taiwan security official said Chinese military and coast guard forces massed more than 100 vessels across the Western Pacific in early November, conducting drills that simulated attacks on other militaries and on cities, including Taiwan's own. The official called the deployment larger than last year's formally named 'Justice Mission 2025' exercise and one of the biggest Chinese naval mobilizations on record, even though Beijing never publicly announced it. A foreign intelligence source said the deliberately unannounced nature of the drills let Beijing apply military pressure around Taiwan and before major international meetings while sidestepping diplomatic blowback.","source":"Reuters via Star Advertiser","url":"https://www.staradvertiser.com/2026/11/13/breaking-news/china-stages-unannounced-pacific-drills-in-intimidation-of-taiwan/"},{"headline":"PLA Sortie Counts Around Taiwan Jump Sharply Week-on-Week","body":"Taiwan's Ministry of National Defense tallied 111 PLA aircraft sorties around the island from November 2-8, with 78 crossing into the Air Defense Identification Zone, a 30.6 percent jump in total sorties and a 66 percent jump in ADIZ entries compared to the prior week. Median-line crossings were logged on November 2, 4 and 6, while detected PLA Navy vessel activity rose to 53 ships and China Coast Guard or other official vessels nearly doubled to 36, including CCG ships inside Kinmen's restricted waters and the survey ship Haiyang Dizhi 8 operating near Kaohsiung. The data underscores a broader pattern analysts have dubbed a 'silent exercise' simulating the isolation of Taiwan using forces drawn from three PLA theater commands.","source":"Taiwan Security Monitor","url":"https://taiwansecuritymonitor.substack.com/p/pla-activity-update-the-week-of-november"},{"headline":"Taiwan Launches 'GUARD' Alliance to Rally Democracies' Drone Supply Chains","body":"Taiwan's Ministry of Foreign Affairs announced on November 10 the creation of the Global UAV Alliance for Resilience and Democracy, built atop the recently opened Global UAV Academy and existing bilateral drone partnerships. Task force chief Chiang Zhen-wei said GUARD will focus on supply-chain linkages, international certification standards, training and industry expos to help Taiwanese drone makers expand into global markets. The initiative follows Taipei's passage of a roughly NT$240 billion ($7.4 billion) drone-defense bill and plans to field more than 1,400 surveillance drones and over 200,000 attack drones, as the island races to build an asymmetric deterrent against the PLA.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/11/11/2003867529"}]},"europe":{"ukraineRussia":[{"headline":"Abu Dhabi Talks Yield Prisoner Swap but Putin Hardens Core Demands","body":"After the latest trilateral session in Abu Dhabi on November 12, Vladimir Putin again refused to accept any postwar demilitarized zone in Ukraine and would not drop his demand that Kyiv hand over the unoccupied portions of Luhansk, Donetsk, Zaporizhzhia and Kherson oblasts. The talks produced only a large prisoner exchange, with no visible movement on security guarantees, prompting U.S. envoys Steve Witkoff and Jared Kushner to travel on to Moscow for follow-up meetings with Putin before heading to Ireland to brief President Zelensky. Washington is separately pressing Moscow to submit a new framework for easing tensions with Europe, while Paris says the EU will add roughly 150 entities and 50 banks to its Russia sanctions list on Monday.","source":"Just Security","url":"https://www.justsecurity.org/164226/early-edition-november-12-2026/"},{"headline":"Ukraine's Refinery Campaign Grinds Down Russian Oil Output Amid Record Drone Barrages","body":"Ukrainian long-range drones have now struck more than a third of Russia's oil-refining capacity over a 13-day span, hitting five of the country's largest refineries in recent days as part of an intensifying energy-infrastructure campaign. Russia answered on November 12 with 123 drones overnight and another 124 during the day, plus S8000 Banderol/Dan-T missiles, though Ukrainian air defenses say they intercepted the bulk of the barrage. NATO chief Mark Rutte told Zelensky that Russia's current monthly casualty rate nearly equals total U.S. losses over fourteen years in Vietnam, underscoring the attritional toll even as neither side gained ground along the front on the 12th.","source":"RBC-Ukraine","url":"https://newsukraine.rbc.ua/war-in-ukraine"}],"europe":[{"headline":"NATO Diplomats Debate Pivot to Focus Squarely on Russia, Trim Overseas Missions","body":"Politico reports, citing NATO diplomats, that the alliance is weighing a significant overhaul of its military planning to prioritize deterring Russia over far-flung operations elsewhere. Officials caution that any such shift remains a political decision and would not automatically end existing deployments such as NATO's missions in Kosovo or Iraq. The debate unfolds alongside NATO's push to field new capabilities fast, including a November 5 launch of a Counter-UAS procurement marketplace tied to more than $40 billion in planned five-year counter-drone investment across the alliance.","source":"Ukrainska Pravda (via Politico)","url":"https://pravda.com.ua/eng/news/2026/11/11/8062266"},{"headline":"Spain's First General Strike in 14 Years Signals Cost-of-Living Backlash","body":"Demonstrators filled the streets of Spanish cities this week for the country's first general strike in 14 years, demanding action on the rising cost of living just weeks before national elections. The unrest fits a broader continental pattern: Britain's economy grew just 0.7 percent in the third quarter according to the Office for National Statistics, while German Chancellor Friedrich Merz is now tying approval of the EU budget to further Ukraine aid, deepening fiscal friction inside the bloc. Together these flashpoints suggest inflation and household costs, not the war itself, remain the most politically combustible issue for many European governments heading into 2027.","source":"FDD / Rio Times","url":"https://www.fdd.org/overnight-brief/november-12-2026/"}]},"middleEast":[{"headline":"Israel Strikes Gaza's Nasser Hospital for Seventh Time, Killing Several","body":"An Israeli airstrike hit a building inside the Nasser Hospital complex in Khan Younis on November 12, killing at least six people, including a surgeon, and wounding roughly a dozen others, according to Hamas-run civil defense officials. The Israeli military later confirmed the target was a commander of Hamas's Khan Younis Brigade, marking the seventh time the facility has been hit during the war. The strike came as Gaza's Health Ministry reported 42 percent of essential medicines and half of all medical supplies are now out of stock, a collapse that Turkish President Erdogan condemned from the podium of the COP31 climate summit this week.","source":"Washington Post","url":"https://www.washingtonpost.com/national/2026/11/12/mideast-israel-gaza-hospital-strike-november-12/02351200-de7b-11f1-912c-4fbb80d73f7f_story.html"},{"headline":"Vance Weighs Direct Talks With Iran's Rezaei as Tehran Publicly Denies Any Deal","body":"Vice President JD Vance is reportedly considering a face-to-face meeting, possibly in Doha, with Mohsen Rezaei, secretary of Iran's Supreme National Security Council, after sending him a letter in October proposing renewed negotiations. Iran's Foreign Minister Abbas Araghchi has publicly denied any meeting is scheduled, and Rezaei has dismissed the reports while insisting Tehran will not surrender any of its enriched uranium stockpile. The feeler comes even as Iran is said to be producing roughly 50 missiles a month despite a crippled defense-industrial base, complicating prospects for near-term de-escalation.","source":"Gulf News","url":"https://gulfnews.com/world/mena/vance-considers-face-to-face-talks-with-irans-rezaei-to-end-war-report-1.500744490"},{"headline":"UN Security Council to Hold Emergency Session on Israeli West Bank Settlement Plans","body":"The UN Security Council is preparing to convene an emergency meeting next week over Israel's plans to build in the E1 corridor of the West Bank east of Jerusalem, a project long viewed as cutting off any future Palestinian state from East Jerusalem. The session comes amid mounting pressure over Gaza aid, with the UK, Qatar and Jordan leading dozens of countries in demanding Israel allow more winter supplies into the territory, even as Netanyahu's office insists Hamas is responsible for aid bottlenecks. Separately, outgoing Prime Minister Netanyahu has warned Israeli officials of growing international pressure on Israel to withdraw from territory it holds in Gaza, Syria and Lebanon.","source":"FDD Overnight Brief","url":"https://www.fdd.org/overnight-brief/november-12-2026/"}],"techAI":{"aiCompetition":[{"headline":"Mirendil Raises $1 Billion to Bet Agents Can Replace Entire AI Research Teams","body":"San Francisco startup Mirendil announced a $1 billion Series A on November 12, led by Kleiner Perkins and Clearlake Capital with Google, Battery Ventures and others joining, pushing its total funding to $1.2 billion. The company says a single researcher using its AI agents pretrained a competitive coding model called Mirendil-Base from scratch in 3.5 months for under $10 million in compute, a fraction of what frontier labs typically spend. Its flagship product, Lor, now in private beta, orchestrates hundreds of agents alongside Anthropic and OpenAI models to run experiments around the clock, previewing a future where small teams can compete with billion-dollar labs.","source":"Unite.AI / RuntimeWire","url":"https://www.unite.ai/mirendil-raises-1b-series-a-to-bring-frontier-ai-r-and-d-to-more-teams/"},{"headline":"Anthropic Prices IPO as Compute Commitments Balloon Past $900 Billion","body":"Anthropic set a proposed IPO price range of $70 to $78 per share for roughly 825 million shares, with Bloomberg reporting the offering could price Wednesday, November 18, ahead of a Nasdaq debut under ticker ANT. Regulatory filings disclosed approximately $900.9 billion in committed compute and infrastructure spending, with about $70.7 billion due within 12 months and the remainder stretching out to 2045. Analysts note the offering book ran roughly six times oversubscribed, underscoring investor appetite even as Anthropic's enterprise API market share jumped from 40% to 55% this year while Google's fell to 9%.","source":"Sam on AI / Deep Gains","url":"https://samonai.substack.com/p/ai-brief-november-13-2026"}],"cyberEmerging":[{"headline":"Kazakhstan-Linked Hackers Used AI Agents to Steal Tajik National Security Files","body":"Singapore-based cybersecurity firm CloudSek reported Wednesday that a Kazakhstan-linked group dubbed Silent Lynx used Hermes, an open-source autonomous AI agent framework, to exfiltrate more than 2,000 national security-related documents from Tajikistan's electronic document system. The operation illustrates how lower-tier state-aligned actors are now leveraging agentic AI to conduct espionage campaigns once reserved for more sophisticated intelligence services. The breach adds to a string of incidents this year showing AI agents amplifying the scale and speed of state-sponsored document theft in Central Asia.","source":"AI Weekly / FDD Overnight Brief","url":"https://aiweekly.co/ai-news-today"},{"headline":"Nonprofit Coalition Sues OpenAI, Anthropic, Google, Meta and SpaceX to Halt Frontier Model Development","body":"A coalition of nonprofits filed suit Thursday against OpenAI, Anthropic, Google, Meta and SpaceX's AI division, seeking a court order to freeze development of any model more capable than companies' current systems. The complaint leans on public statements from executives including Anthropic's Dario Amodei and SpaceX's Elon Musk about AI's potential to threaten civilization, arguing the firms' own words justify judicial intervention. The filing follows Florida's September request that OpenAI be barred from training new models without outside oversight, after which OpenAI said it had already paused training its most capable systems pending added safeguards.","source":"Claims Journal","url":"https://www.claimsjournal.com/news/national/2026/11/13/341283.htm"}]},"cities":{"lasVegas":[{"headline":"Third motorcyclist killed in Las Vegas Valley this week","body":"A motorcyclist died Thursday morning in a two-vehicle crash near Tropicana Avenue and Spencer Street, marking the third such fatality in the valley in just a week. Las Vegas police detained the driver involved and are continuing to investigate the circumstances of the crash. Metro has not released details on possible charges as the string of motorcycle deaths raises fresh concern about valley traffic safety heading into the holidays.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Teen pleads not guilty in gang-related First Friday killing","body":"A teenager charged in the fatal shooting of a 15-year-old at October's First Friday arts event in downtown Las Vegas entered a not-guilty plea this week. Prosecutors say the killing was gang-related, and the monthly First Friday event has been suspended for both November and December in its aftermath. The case has reignited debate over security at the popular arts district gathering.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Gov. Ford faces early test with Gaming Control Board picks","body":"Nevada's new governor, Aaron Ford, will be in office less than a month before he must make two pivotal appointments to the state Gaming Control Board, a panel central to regulating the Las Vegas gaming industry. The decisions come as the board navigates expanding sports betting rules and major new resort investments, including a $4 billion Las Vegas project tied to the Seminole Tribe. Industry watchers say Ford's choices will signal how he intends to balance regulatory rigor with growth.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/"}],"nellis":[{"headline":"Air Force advances $1 billion F-47 test campus at Nellis","body":"The Air Force is moving forward with a roughly $1.057 billion 'F-47 Future Campus' at Nellis Air Force Base, building hangars, labs, and maintenance facilities to support operational testing of Boeing's new sixth-generation stealth fighter. Construction is planned in phases with completion targeted by 2031, following a 2027 budget request that included $730 million for F-47 support infrastructure. Nellis, already home to Creech's Collaborative Combat Aircraft testing nearby, is positioned for a broad role in integrating the jet into the fleet even though initial flight testing will occur at Edwards Air Force Base in California.","source":"Air & Space Forces Magazine","url":"https://www.airandspaceforces.com/air-force-billion-dollar-campus-testing-f-47-nellis/"}]},"feelGood":[{"headline":"Military families get $500,000 lifeline through nationwide campaign","body":"Nonprofit Operation Homefront wrapped up its '11 Days of Impact' campaign on November 12, an annual push timed to Veterans Day that aimed to raise $500,000 to help military and veteran families facing financial hardship. The funds go toward emergency assistance, housing support, and other stability programs for service members and their loved ones nationwide. The campaign reflects a broader wave of Veterans Day giving this month, with companies and nonprofits alike rolling out donation drives for veterans.","source":"Military.com","url":"https://www.military.com/veterans-day/giving-back.html"},{"headline":"Cadet's quick action saves father and son from drowning","body":"A military cadet was credited this week with pulling a father and son to safety after the pair began drowning, acting fast and diving in despite the danger to himself. The rescue, reported November 11, has been celebrated as an example of selfless courage from someone training for future service. Both survivors are expected to recover fully thanks to the cadet's intervention.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/"},{"headline":"West Fargo community rallies for police detective battling stage-four cancer","body":"Friends, fellow officers, and local businesses in West Fargo, North Dakota, have mobilized ahead of a 'Miles of Strength' fundraiser to support a longtime police detective fighting stage-four prostate cancer. Organizers filled a six-foot trailer with donated auction items ranging from sports memorabilia to concert tickets, while one local business owner, Abby Amo, contributed roughly 1,000 pounds of pasta to the effort. The outpouring shows a tight-knit community determined to ease the financial and emotional burden on one of its own.","source":"WDAY Radio Now","url":"https://www.wdayradionow.com/news/local-news/community-rallies-around-west-fargo-police-detective-battling-stage-four-cancer-as-miles-of-strength-fundraiser-approaches/"}],"onThisDay":[{"year":"1927","event":"The Holland Tunnel opened, becoming the first underwater vehicular tunnel connecting New Jersey and New York City."},{"year":"1940","event":"Walt Disney's animated film Fantasia premiered in New York City."},{"year":"1956","event":"The US Supreme Court affirmed a ruling that Montgomery, Alabama's bus segregation laws were unconstitutional."},{"year":"2015","event":"Coordinated terrorist attacks in Paris, including at the Bataclan theater, killed 130 people."}]},"topPicks":[{"headline":"Nvidia CEO Jensen Huang Resigns Amid Chinese Espionage Scandal","teaser":"The shock departure of chip industry's most powerful executive threatens to upend global AI supply chains and US-China tech tensions."},{"headline":"CENTCOM Tells Israel to Prepare for Possible Resumption of Iran Campaign","teaser":"A renewed military buildup signals the fragile Iran ceasefire could collapse, risking a wider Middle East conflict."},{"headline":"Anthropic Prices IPO as Compute Commitments Balloon Past $900 Billion","teaser":"The massive IPO underscores how AI infrastructure spending is reshaping capital markets and raising bubble concerns."}]},"navDates":[{"key":"2026-11-13","label":"Nov 13","href":"/","isNewest":true},{"key":"2026-11-12","label":"Nov 12","href":"/archive/2026-11-12.html","isNewest":false},{"key":"2026-11-11","label":"Nov 11","href":"/archive/2026-11-11.html","isNewest":false},{"key":"2026-11-10","label":"Nov 10","href":"/archive/2026-11-10.html","isNewest":false},{"key":"2026-11-09","label":"Nov 9","href":"/archive/2026-11-09.html","isNewest":false},{"key":"2026-11-08","label":"Nov 8","href":"/archive/2026-11-08.html","isNewest":false},{"key":"2026-11-07","label":"Nov 7","href":"/archive/2026-11-07.html","isNewest":false}],"currentKey":"2026-11-13","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
