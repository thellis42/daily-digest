<script>
const STATE = {"digest":{"date":"Wednesday, September 9, 2026","generatedAt":"Wed, Sep 9, 6:42 AM PDT","breaking":{"headline":"US-Iran War Escalates: Iran Strikes Jordan Base, US Destroys Five Tankers","body":"The six-month-old Iran war took a sharp turn overnight as US Central Command said it destroyed five Iranian oil tankers linked to the Islamic Revolutionary Guard Corps, in reprisal for an attempted Iranian strike on a US Navy warship in the Gulf of Oman and near Kharg Island. Iran's IRGC responded by firing roughly 20 ballistic missiles at Al Azraq air base in Jordan, which hosts US forces; Jordanian air defenses intercepted 18, with the remaining two landing harmlessly and no casualties reported. Tehran also claimed to have seized a US underwater drone near the Strait of Hormuz, though the Pentagon said the vehicle had simply malfunctioned more than a day earlier. The exchange is among the most intense since the conflict began in February 2026 and has already spilled into Bahrain, Saudi Arabia, and the UAE.","source":"Just Security (Reuters, NYT, WSJ)","url":"https://www.justsecurity.org/156735/early-edition-september-9-2026/"},"tabs":{"defense":{"defense":[{"headline":"Air Force Speeds Up MQ-9 Reaper Replacement After Combat Losses","body":"Air Force leaders said this week they are accelerating work on a successor to the MQ-9 Reaper fleet, pointing to losses sustained during the Iran war as evidence the drone is too vulnerable for contested airspace. No firm fielding date was announced, but officials signaled a preference for a platform built for high-threat environments rather than the permissive counterterrorism missions the Reaper was originally designed for. The move reflects broader pressure on the service to adapt its unmanned inventory to a more contested Middle East fight.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Navy Force Structure Strained Six Months Into Iran War","body":"Six months after US strikes on Iran began and four months into a Navy blockade of the Strait of Hormuz, officials and analysts say sustained combat operations have exposed real gaps in Navy force structure and capability. Commercial shipping through the strait remains severely disrupted, and the high operational tempo of intercepting Iranian missiles and drones is straining surface ships and munitions stockpiles. The strain is intensifying congressional debate over shipbuilding capacity and munitions replenishment with no resolution to the conflict in sight.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"NATO's Rutte Presses Allies to 'Dig Deeper' on Ukraine Funding","body":"NATO Secretary General Mark Rutte said Tuesday that allied nations have recently pledged about 70 billion euros (roughly 81 billion dollars) for Ukraine's war effort but warned it is not enough and that members must dig deeper. Pentagon policy chief Elbridge Colby reinforced the message, telling allies that Russia is reconstituting its forces and defense-industrial base and that the West must brace for a protracted conflict with Ukraine's needs persisting for years. The remarks came just ahead of Trump's planned appearance at the Pentagon on Friday to mark the 25th anniversary of the September 11 attacks.","source":"WORLD News Group","url":"https://wng.org/podcasts/wednesday-morning-news-september-9-2026-1788897891"}],"acquisitions":[{"headline":"Pentagon Opens Bidding on Next-Generation JWCC Cloud Contract","body":"The Defense Department released the first of two final solicitations on September 8 for the next phase of its Joint Warfighter Cloud Capability program, broadening the scope of the military's core cloud computing vehicle beyond the current arrangement with Amazon Web Services, Google, Microsoft Azure, and Oracle. To date DOD has obligated about 1 billion dollars under the existing contract, with AWS receiving 55 percent (564 million dollars) and Microsoft 28 percent (291 million dollars). A final solicitation for the follow-on 'JWCC UCM Premier' effort is expected in early 2027, with awards anticipated by the third quarter of that year.","source":"Nextgov/FCW","url":"https://www.nextgov.com/acquisition/2026/09/pentagon-unveils-first-two-solicitations-its-next-big-cloud-contract/415846/"},{"headline":"Army Awards BAE Systems 40 Million Dollars for Bradley Upgrades","body":"The Army awarded BAE Systems a 40 million dollar contract modification on September 8 to upgrade Bradley Fighting Vehicles to the company's newest variant. The award is part of a broader wave of September procurement activity that also included a 499.5 million dollar Missile Defense Agency award to L3Harris for airborne sensor support, reflecting sustained modernization spending amid the Iran war and NATO deterrence commitments. Officials say the upgrades aim to keep armored formations relevant against modern threats identified in recent combat operations.","source":"Inside Defense","url":"https://insidedefense.com/"}]},"us":[{"headline":"Appeals Court Slams Trump Administration's IRS-ICE Data Sharing as Unlawful","body":"A unanimous three-judge panel of the D.C. Circuit, made up entirely of Obama appointees, ruled Tuesday that the IRS violated federal tax-privacy law by funneling taxpayer address data to Immigration and Customs Enforcement in bulk rather than case-by-case. Judge Cornelia Pillard wrote that the Data-Exchange Procedure 'indisputably contravenes' Section 6103 of the tax code, noting ICE had listed the same single point-of-contact for all 1.28 million names it submitted in summer 2025. The court upheld a lower-court injunction and dismissed the administration's objection to reporting requirements as 'weak sauce,' leaving roughly 47,000 taxpayers whose records were already disclosed eligible to pursue damages.","source":"The Washington Times / Courthouse News","url":"https://www.washingtontimes.com/news/2026/sep/8/appeals-court-rules-irs-broke-privacy-laws-turning-records-ice/"},{"headline":"Supreme Court Rebuffs Missouri GOP's Bid to Revive Gerrymandered Map Before Midterms","body":"Justice Brett Kavanaugh on Tuesday denied without explanation Missouri Republicans' emergency request to reinstate a congressional map that would have flipped the state's delegation toward a 7-1 GOP split, leaving the 2022/2024 lines in place for November. The denial came even as primary voters had already cast ballots under the now-discarded map, a scrambling of sequence that state officials called 'pointless.' Hours later a federal district judge separately approved a different Republican-drawn map, setting up further litigation with Election Day just 56 days away.","source":"The Washington Times / Townhall","url":"https://www.washingtontimes.com/news/2026/sep/8/supreme-court-wont-revive-missouris-gop-friendly-congressional-map/"},{"headline":"Trump Threatens $50 Billion Canadian Import Ban as Trade War Deepens","body":"President Trump directed federal agencies Tuesday to strip Canadian-origin products from government purchasing schedules worth up to $50 billion unless Ottawa restores 'full and fair reciprocity' for U.S. dairy and other exporters, blasting what he called the 'Canadian Trade Scam' on Truth Social. The threat landed hours after Canada's new dollar-for-dollar countermeasures took effect, imposing tariffs of 15 to 50 percent on more than 700 U.S. products worth roughly $20 billion, doubling existing steel and aluminum duties to 50 percent. With no further talks scheduled between Washington and Ottawa, the dispute marks the sharpest escalation yet in a trade war that began in early 2025.","source":"Mediaite","url":"https://www.mediaite.com/politics/trump-snaps-back-at-canadian-trade-scam-with-50-billion-threat-no-reciprocity-no-access/"},{"headline":"Markets Flip to Pricing Fed Rate Hike After Blowout Jobs Report","body":"Traders now see roughly a 59-60 percent chance the Federal Reserve raises rates a quarter point at its September 15-16 meeting, a stunning reversal after Friday's payrolls report showed 162,000 jobs added versus expectations of about 56,000, with June and July revised up a combined 55,000. The shift comes as Brent crude topped $98 a barrel following U.S. strikes on Iranian tankers and copper hit a record $14,540 a tonne, adding cost-push inflation pressure just as Thursday's PPI and Friday's CPI reports loom as the last major data points before the FOMC meets. The European Central Bank and Bank of Japan are also expected to tighten this week, raising the specter of three major central banks hiking simultaneously.","source":"CNBC / Rio Times","url":"https://www.cnbc.com/2026/09/07/stock-market-tuesday-live-updates.html"}],"pacific":{"pacificCommand":[{"headline":"Seoul and Manila deepen defense ties as Korea weighs Hormuz deployment","body":"At the Seoul Defense Dialogue on September 8, South Korean Defense Minister Ahn Gyu-back and Philippine counterpart Gilberto Teodoro agreed to expand arms cooperation, joint drills, and military modernization support, building on ties dating to Filipino service in the Korean War. The talks come as Seoul's National Assembly faces a self-imposed end-of-September deadline to ratify a possible noncombat deployment tied to the Hormuz Strait crisis, a decision complicated by Washington's visible frustration over South Korea's limited role in that conflict and in supporting Ukraine. The dual-track diplomacy shows Seoul trying to expand its regional security footprint in Southeast Asia while managing pressure from its primary ally.","source":"Korea JoongAng Daily","url":"https://www.koreajoongangdaily.com/korea/defense"},{"headline":"Tokyo requests record $55.6 billion defense budget for FY2027","body":"Japan's Ministry of Defense submitted a record 8.89 trillion yen (about $55.6 billion) budget request for fiscal year 2027, with new emphasis on stand-off electronic warfare, autonomous drone systems, and AI-enabled command capabilities. The request builds on Tokyo's 2026 push past 2% of GDP in defense spending and follows the government's 2026 white paper, which described China's push beyond the First Island Chain as an unprecedented strategic challenge. The budget also comes as Japan works to revise its three core security strategy documents ahead of schedule before year's end.","source":"Ronin's Grips INDOPACOM SITREP","url":"https://blog.roninsgrips.com/weekly-indopacom-containment-sitrep-august-31-to-september-7-2026/"},{"headline":"Indonesia hosts US-led Garuda Shield while planning parallel China drill","body":"Nearly 5,000 troops from 21 nations — including the United States, Australia, South Korea, Britain, Germany, and France — are training in Indonesia through September 11 for Garuda Shield 2026, which US officials call its largest iteration yet. Jakarta plans to follow up within weeks by hosting a second exercise, Garuda Heping, with China's military in Sumatra, a pairing first trialed in 2024 around disaster-relief cooperation. The back-to-back drills illustrate Indonesia's long-standing 'free and active' foreign policy, using its territory to host rival great-power militaries in the same season without formally aligning with either.","source":"The Rio Times","url":"https://www.riotimesonline.com/asia-intelligence-brief-tuesday-september-8-2026/"}],"pacingThreat":[{"headline":"Xi purges two more top generals from Central Military Commission","body":"The Institute for the Study of War confirmed that on August 28 Beijing formally removed generals Zhang Youxia and Liu Zhenli from the Central Military Commission, continuing a pattern of shake-ups at the top of the PLA's command structure. Zhang had served as CMC vice chairman since 2017 and Liu as Joint Staff Department chief since 2022, making their ouster one of the most senior personnel moves of Xi Jinping's tenure. Analysts see the purges as part of a broader consolidation of personal control over the military rather than a sign of institutional instability, even as it temporarily strains the PLA's command pipeline.","source":"Ronin's Grips / ISW","url":"https://blog.roninsgrips.com/sitrep-chinese-military-and-intelligence-august-31-2026-to-september-7-2026/"},{"headline":"New OSINT deep-dive details PLA's political commissar system","body":"A Foreign Policy China Brief published September 8 lays out how the PLA's dual command structure works, with political commissars operating alongside regular officers at every unit level to run political education, watch for corruption, and monitor loyalty. The system, inherited from the Soviet Red Army model, is designed to keep the military firmly under Communist Party control rather than the state. The analysis notes that despite this formal divide, officers frequently move between political and command tracks early in their careers, a flexibility that narrows once they reach battalion command — a nuance Western analysts say complicates assumptions about how tightly Beijing can steer PLA behavior in a crisis.","source":"Foreign Policy","url":"https://foreignpolicy.com/2026/09/08/china-pla-officer-corps-military-ccp/"},{"headline":"PLA sorties near Taiwan surge as island accelerates 'Hellscape' buildout","body":"Taiwan's Ministry of National Defense tracked 20 PLA aircraft and six PLAN vessels on September 5, followed by 21 aircraft and 15 PLAN/coast guard ships on September 6, with roughly 12-13 aircraft crossing the Taiwan Strait median line each day. The Institute for the Study of War separately tallied 125 PLA aerial incursions into Taiwan's air defense identification zone across August alone, part of what analysts describe as a coercion campaign meant to normalize incursions and rehearse blockade scenarios. In response, Taipei is speeding up procurement under its 'Hellscape' doctrine, which leans on layered autonomous drone and maritime systems, alongside a recently approved $4.64 billion supplementary defense budget.","source":"Ronin's Grips / ISW","url":"https://blog.roninsgrips.com/sitrep-chinese-military-and-intelligence-august-31-2026-to-september-7-2026/"}]},"europe":{"ukraineRussia":[{"headline":"Russia Resumes Kyiv Strikes as Trump Envoys' Truce Pause Ends","body":"Russian drones and missiles struck Kyiv on September 8, killing at least five people and damaging buildings across five districts including Darnytskyi and Podilskyi, while a drone also tore into a Ukrainian TV channel building. The barrage broke a roughly three-day lull that had coincided with shuttle visits by US envoys Steve Witkoff and Jared Kushner to Moscow and Kyiv, prompting Ukrainian officials to accuse the Kremlin of using diplomacy as cover. Kyiv also reported a separate drone strike igniting a fire at Russia's Saratov oil refinery, a Rosneft facility repeatedly hit in past months.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/9/8/russia-strikes-kyiv-as-three-day-pause-during-us-envoy-visits-ends"},{"headline":"Trump Envoys Signal Progress Toward Trilateral Ukraine Summit","body":"Witkoff and Kushner returned to Washington on September 8 saying their separate Moscow and Kyiv meetings with Putin and Zelensky produced substantial groundwork for a possible three-way US-Russia-Ukraine summit. Zelensky said he hopes to meet Trump around September 20 and intends to press for more anti-ballistic-missile interceptors, even as fighting continued unabated. The diplomatic push came alongside turmoil in Kyiv's justice system, with Prosecutor General Ruslan Kravchenko announcing his resignation on September 7 amid a corruption scandal.","source":"Newsy Today","url":"https://www.newsy-today.com/russia-ukraine-war-live-september-8-updates-and-news/"}],"europe":[{"headline":"NATO's Ukraine Contact Group Meets as UK Pledges Winter Air Defense Aid","body":"NATO Secretary General Mark Rutte joined a September 8 session of the Ukraine Defence Contact Group, co-chaired by Germany and the United Kingdom, to coordinate further military support ahead of winter. Britain separately unveiled a multimillion-pound package to supply Ukraine with Patriot missiles, interceptors and drones, framed as part of a broader NATO-backed air-defense effort. The moves come as allies weigh how to sustain Kyiv's defenses even as Washington pushes European members to shoulder more of the conventional deterrence burden.","source":"NATO / Newsy Today","url":"https://www.nato.int/en"},{"headline":"Ceuta Fallout Keeps EU Migration and Schengen Strains Front and Center","body":"Weeks after roughly 70,000 migrants crossed into Spain's Ceuta enclave in a single day on July 30 -more than all other irregular EU border crossings recorded so far this year- the political fallout is still roiling Brussels. Italy, Finland, Austria, Sweden, Denmark and the Czech Republic have pushed to suspend Spain from the Schengen zone, while the EU's new migration and asylum pact, in force since June, faces its first major stress test over redistribution and returns. EU leaders are expected to take up the dispute at the October European Council, with member states showing little appetite for accepting relocated migrants.","source":"Euronews","url":"https://www.euronews.com/my-europe/2026/09/01/schengen-strained-solidarity-broken-and-return-hubs-disputed-eu-struggles-again-with-migra"}]},"middleEast":[{"headline":"Houthi Strikes Wound 73 in Saudi Arabia","body":"Saudi officials reported that Houthi attacks launched from Yemen wounded 73 people inside Saudi Arabia, according to a report published September 8. The strikes add to a pattern of cross-border Houthi fire that has persisted alongside the wider regional escalation involving Iran and its allied militias. Saudi-backed Yemeni government forces were also reported clashing with Houthi fighters near Taiz province on September 8.","source":"Arab News","url":"https://www.arabnews.com/middle-east"},{"headline":"Israel Shuts UK Consulate After London-Led Settlement Sanctions","body":"Israel announced it is closing the British Consulate in East Jerusalem and ordering UK diplomats involved in a US-led Gaza coordination mission, plus those based in Ramallah, to leave within seven days. The move retaliates against a coordinated sanctions package on Israeli settlements in the occupied West Bank announced by the UK, Canada, France, Denmark, Finland, Ireland, Norway, Poland, Portugal, Spain and Sweden. A British official said the sanctions' final scope could still shift depending on the actions of Israel's next government, with implementation details to be worked out over six to nine months.","source":"Al Jazeera / Arab News","url":"https://www.aljazeera.com/middle-east/"},{"headline":"Iran's IRGC Claims Strikes on US Warships; CENTCOM Calls Reports False","body":"Iran's Revolutionary Guard Corps said on September 9 it struck two US Navy vessels along with eight tankers and ten other ships across the Gulf and Strait of Hormuz, part of its retaliation after the US destroyed five Iranian-linked oil tankers a day earlier. US Central Command flatly denied the claims, stating on social media that no American warship had been hit and that all attempted Iranian attacks had failed. The dueling claims underscore how the tanker war is escalating even as regional evacuation and shipping disruptions from the broader Iran conflict continue.","source":"Haaretz","url":"https://www.haaretz.com/israel-news/israel-security/2026-09-09/ty-article-live/iran-retaliates-against-jordan-and-saudi-arabia-after-u-s-destroys-oil-tankers/000001a0-83d7-d290-a9e3-dff7871b0000"}],"techAI":{"aiCompetition":[{"headline":"Samsung Leads $3.5B Round Pushing Mistral Past $21B Valuation","body":"Samsung headlined a roughly €3 billion Series D for French AI lab Mistral, pushing its valuation above €21 billion and giving Europe's leading open-weight challenger fresh capital for compute, research staff, and international expansion. The deal deepens a strategic tie between the Korean electronics giant and Mistral as it tries to keep pace with U.S. frontier labs, though analysts note that fresh funding alone doesn't close the capability gap with OpenAI, Anthropic, and Google DeepMind. It's the latest sign that non-U.S. players are willing to spend heavily to avoid total dependence on American models.","source":"AI Weekly","url":"https://aiweekly.co/ai-news-today/edition/2026-09-08"},{"headline":"OpenAI's Chief Scientist Breaks Ranks to Warn on AI Self-Improvement Pace","body":"OpenAI Chief Scientist Jakub Pachocki publicly urged 'extreme caution' on the industry's development pace, warning that models are approaching the point where they could recursively improve their own capabilities with minimal human oversight, according to a September 7 Bloomberg report. He called for research labs to voluntarily slow down until shared safety standards are in place, a striking admission from inside a company racing to ship ever-more-capable systems. The warning landed the same week Nvidia's Jensen Huang made bullish comments about AI acceleration and Beijing issued its first judicial guidance on AI, underscoring how differently safety, speed, and regulation are moving relative to one another.","source":"Bloomberg / AI news aggregation","url":"https://note.com/hirokimiyano/n/ne842f29f9819?hl=en"}],"cyberEmerging":[{"headline":"NSA, FBI Accuse Six Chinese AI Firms of Industrial-Scale Model Theft","body":"A joint September 8 advisory from the NSA, CISA, and FBI names DeepSeek, Moonshot, Alibaba, MiniMax, StepFun, and Z.AI as running large-scale 'distillation' campaigns since late 2024 to extract proprietary capabilities from Claude, GPT, Gemini, and Grok. The agencies say the operations used native APIs, resale aggregators, and shared premium accounts to harvest chain-of-thought and fine-tuning data at industrial volume, effectively laundering U.S. research investment into Chinese model development. The Washington Times reported the 18-page advisory frames the activity as state-linked theft rather than ordinary research practice, and U.S. officials are pressing AI providers to monitor usage patterns and share telemetry to detect the pattern.","source":"The Washington Times","url":"https://www.washingtontimes.com/news/2026/sep/8/chinese-government-linked-massive-ai-tech-theft-american-tech-firms/"},{"headline":"China's Top Court Issues First AI Liability Rules Ahead of National AI Law","body":"China's Supreme People's Court released a 24-article set of judicial opinions on September 7 giving lower courts guidance for AI-related civil and criminal disputes, covering deepfakes, voice cloning, training data, and autonomous vehicles. The move sidesteps the harder question of AI-generated content's copyright status but signals Beijing is moving faster on AI-specific court guidance than Washington, which still lacks comprehensive federal AI legislation. Legal analysts flag the rules on liability allocation between developers, platforms, and users as a template Chinese regulators may later fold into a formal national AI law.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/politics/article/3366802/chinas-highest-court-sets-out-new-ai-red-lines-rules-deepfakes-and-privacy"}]},"cities":{"lasVegas":[{"headline":"Qantas to Launch First Nonstop Sydney-Las Vegas Route in December","body":"The Las Vegas Convention and Visitors Authority is ramping up marketing efforts in Australia as Qantas prepares to begin nonstop service between Sydney and Las Vegas this December. The new route is seen as a major win for the destination's push to diversify its international visitor base beyond traditional North American and Asian markets. Tourism officials are betting the direct link will boost long-haul visitation heading into 2027.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Naked City Neighborhood Sees Crime Drop Amid Redevelopment Push","body":"The Naked City area north of the Strip is undergoing a notable turnaround, with a police-led safety initiative paired with new private investment credited for falling crime rates. Renovated properties, new businesses and residential projects are reshaping the long-struggling Gateway District corridor. City leaders are pointing to the neighborhood as a model for how targeted policing and development incentives can work together.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"$1 Billion Transmission Line Project Breaks Ground in Southern Nevada","body":"Crews have broken ground on a $1 billion electric transmission project that will span roughly 155 miles across Clark and Nye counties. The upgrade is designed to bolster grid capacity for the fast-growing Las Vegas Valley and is slated to be operational by 2028. The project underscores the region's push to keep pace with surging power demand from data centers, population growth and new development.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Creech AFB Pushes Ahead on Drone Warfare Buildup as Reaper Losses Mount Overseas","body":"Creech Air Force Base has been at the center of the Air Force's rapid experimentation with Collaborative Combat Aircraft, including the YFQ-42A Dark Merlin and YFQ-44A Fury drones, which were recently put through an Agile Combat Employment exercise testing how uncrewed jets can operate alongside piloted fighters. The push comes as the Air Force has also reactivated the 42nd Attack Squadron at Creech to fly MQ-9 Reaper missions overseas, a unit that flew more than 180,000 combat hours over Afghanistan before going dormant in 2020. Officials say the moves reflect urgency to field 'affordable mass' in contested airspace after Reaper losses during the ongoing Iran conflict, with no near-term plan to fully replace downed aircraft.","source":"Air & Space Forces Magazine / Task & Purpose","url":"https://www.airandspaceforces.com/ccas-creech-air-forces-drone-base-exercise/"}]},"feelGood":[{"headline":"Woman With Down Syndrome Becomes First Certified Barre Fitness Instructor With the Condition","body":"A 22-year-old woman named Aubry has made history as the first person with Down syndrome to become a certified UpBeat Barre instructor. She's now teaching classes and using her platform to show that the fitness industry has room for people of all abilities. Her story has resonated widely as an example of breaking barriers through everyday persistence rather than a single dramatic act.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Community Rallies to Treat Injured Wild Coyote Rather Than Give Up on Her","body":"When a coyote turned up with a badly swollen face on the edge of a neighborhood, residents and local wildlife rescuers banded together instead of writing the animal off. Volunteers coordinated trapping, veterinary care and monitoring over several days to nurse the coyote back to health. The episode became a small but telling example of a community choosing compassion for a wild, often-feared animal.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Golden Retriever Found Alive After Three Days Trapped in Landslide Debris","body":"A family that feared their golden retriever had been killed in a landslide instead heard a faint bark coming from beneath the mud and debris three days later. Rescuers worked to dig the dog out safely, reuniting it with its relieved owners. The dramatic recovery has been shared widely as a reminder that hope and persistence can pay off even in dire situations.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1776","event":"The Continental Congress formally renamed the United Colonies as the United States of America."},{"year":"1991","event":"Tajikistan declared independence from the Soviet Union."},{"year":"2001","event":"Afghan resistance leader Ahmad Shah Massoud was assassinated by Al-Qaeda operatives two days before the September 11 attacks."},{"year":"1976","event":"Chinese Communist Party leader Mao Zedong died in Beijing at age 82."}]},"topPicks":[{"headline":"US-Iran War Escalates: Iran Strikes Jordan Base, US Destroys Five Tankers","teaser":"A direct strike on a US-linked Jordan base and retaliatory tanker strikes mark a dangerous new phase in the Iran conflict."},{"headline":"Russia Resumes Kyiv Strikes as Trump Envoys' Truce Pause Ends","teaser":"Renewed missile strikes on Kyiv shatter a fragile pause, undercutting US-brokered diplomatic momentum toward a truce."},{"headline":"Trump Threatens $50 Billion Canadian Import Ban as Trade War Deepens","teaser":"A sweeping threatened ban on Canadian imports signals sharp escalation in North American trade tensions with global economic ripple effects."}]},"navDates":[{"key":"2026-09-09","label":"Sep 9","href":"/","isNewest":true},{"key":"2026-09-08","label":"Sep 8","href":"/archive/2026-09-08.html","isNewest":false},{"key":"2026-09-07","label":"Sep 7","href":"/archive/2026-09-07.html","isNewest":false},{"key":"2026-09-06","label":"Sep 6","href":"/archive/2026-09-06.html","isNewest":false},{"key":"2026-09-04","label":"Sep 4","href":"/archive/2026-09-04.html","isNewest":false},{"key":"2026-09-03","label":"Sep 3","href":"/archive/2026-09-03.html","isNewest":false},{"key":"2026-09-02","label":"Sep 2","href":"/archive/2026-09-02.html","isNewest":false}],"currentKey":"2026-09-09","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
