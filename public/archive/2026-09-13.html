<script>
const STATE = {"digest":{"date":"Sunday, September 13, 2026","generatedAt":"Sun, Sep 13, 6:48 AM PDT","breaking":{"headline":"US-Iran Tanker War in the Strait of Hormuz Grinds Into Its Seventh Month","body":"The war that began when the US and Israel struck Iran on February 28, 2026 has settled into a punishing maritime attrition fight, with Washington and Tehran trading attacks on tankers and warships through early September. Iran has targeted US carrier strike groups with ballistic missiles and hit commercial shipping, while the US has struck Iranian tankers and reimposed a naval blockade on Iranian ports in mid-July after an earlier blockade lapsed. Analysts describe Iran's targeting of US carriers as a calculated escalation, and a chokepoint that once carried roughly a quarter of the world's seaborne oil and a fifth of its LNG remains a global economic pressure point even as Washington insists flows are recovering. A new special Pentagon-focused report this week concluded the fight has exposed real gaps in US Navy force structure, fueling an internal push for new capabilities.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/9/6/us-iran-engaged-in-tanker-war-where-is-the-months-long-conflict-headed"},"tabs":{"defense":{"defense":[{"headline":"Pentagon Weighs $1.5 Billion Shift Toward AI and 'Epic Fury' Priorities","body":"The Defense Department is moving to redirect roughly $1.5 billion in funding to accelerate its AI push and support Epic Fury program priorities, according to Inside Defense reporting this week. The proposal comes as the Joint Staff, under Vice Chairman Gen. and Chairman Dan Caine, pushes services toward a 'high-low' drone mix and seeks a 'shared risk' procurement model with industry rather than traditional fixed contracts. The shift reflects growing Pentagon urgency to keep pace with rapid advances in autonomous systems and machine learning amid the ongoing Hormuz conflict and broader great-power competition.","source":"Inside Defense","url":""},{"headline":"Pentagon Rolls Out GenAI.mil With ChatGPT Mil and Grok for Government","body":"The Defense Department has launched a new platform, GenAI.mil, giving roughly 3 million DoD personnel access to enterprise versions of OpenAI's ChatGPT Mil and xAI's Grok for Government. The rollout marks one of the largest single deployments of frontier commercial AI models inside a national government to date, reflecting the Pentagon's effort to normalize generative AI tools across day-to-day military and administrative functions. The move follows months of internal debate over safeguarding sensitive data while keeping pace with rapid frontier-model advances from US labs.","source":"AI Weekly","url":""},{"headline":"Northrop Grumman Deepens Industrial Ties With Poland and Estonia","body":"Northrop Grumman said on September 10, 2026 that it remains in active talks with Poland over new equipment supply while separately announcing fresh industrial agreements with partners in Poland and Estonia. The moves come as NATO's eastern-flank members continue building out layered air and missile defense under the Alliance's Eastern Sentry posture, which has run continuously since September 2025 in response to Russian drone and aircraft incursions. The expanding US-allied industrial base underscores how frontline NATO states are prioritizing domestic production capacity alongside American systems.","source":"The Defence Blog","url":""}],"acquisitions":[{"headline":"Army Divests High-Energy Laser Program, Shifts to Navy-Led Development","body":"The Army is divesting its future Indirect Fire Protection Capability High Energy Laser program roughly two years after stripping $4.8 billion from its planned acquisition profile, pivoting instead to leverage Navy-led development of larger-aperture laser weapons. Officials had originally framed the earlier cuts as a 'try before buy' approach, but the latest move signals the service is abandoning its own dedicated laser acquisition track. The decision reflects broader Pentagon consolidation pressure on directed-energy programs as budgets tighten ahead of fiscal year 2027.","source":"Inside Defense","url":""},{"headline":"V2X Wins $19 Million Marine Corps Contract for Tempest Counter-Drone System","body":"Defense contractor V2X confirmed on September 8, 2026 that it was awarded a $19 million contract by the US Marine Corps to deliver its Tempest counter-drone system. The award adds to a wave of recent US counter-unmanned aerial systems procurement as the Pentagon races to field layered defenses against the kind of drone threats seen in Ukraine, the Red Sea, and the ongoing Hormuz conflict. The contract underscores the Marine Corps' push to field mobile, deployable counter-drone capability at the unit level rather than relying solely on fixed-site defenses.","source":"The Defence Blog","url":""}]},"us":[{"headline":"Fed's September Meeting Turns Into a Coin-Flip on Rates","body":"Traders have sharply repriced expectations for this week's Federal Reserve meeting, with prediction markets now showing roughly 80 percent odds of a quarter-point rate increase when the FOMC concludes its two-day session on September 16. That would reverse the Fed's July stance, when it held rates at 3.5-3.75 percent on a divided 9-3 vote, with three regional bank presidents dissenting in favor of a hike. Chair Kevin Warsh's hawkish tone at the late-August Jackson Hole symposium, combined with energy-cost spillover from the ongoing Iran conflict, has convinced markets the Fed will tighten even though headline CPI cooled to 3.4 percent in July. A hike would be the first since the Fed's rate-cutting cycle began in 2025 and could become a flashpoint in midterm economic messaging.","source":"Cambridge Currencies","url":"https://cambridgecurrencies.com/next-federal-reserve-interest-rate-decision/"},{"headline":"A Year After Kirk's Assassination, Doxing Culture Still Poisons US Politics","body":"New reporting out this weekend marks roughly a year since the assassination of conservative activist Charlie Kirk, finding that the killing triggered a wave of neighbor-on-neighbor doxing that has not subsided. Researchers describe a chilling effect in which ordinary citizens increasingly expose and target political opponents online, deepening the erosion of civil political discourse across the country. The anniversary lands in the middle of a bitterly contested midterm season, adding to concerns that political violence and its aftershocks are reshaping how Americans engage with each other over policy disagreements.","source":"NPR","url":"https://www.npr.org/sections/politics/"},{"headline":"Mail-Ballot Legal Fight Leaves Midterm Voters and Officials in Limbo","body":"Election administrators and voters are navigating fresh uncertainty as litigation continues over a US Postal Service mail-ballot handling plan tied to President Trump's push to restrict mail-in voting nationwide. With the legal fight still unresolved just weeks before early voting begins in several states, officials warn of possible confusion over ballot-return deadlines for the November 3 midterms. The stakes are heightened by the fact that control of both chambers of Congress is on the ballot, and Democrats are counting on mail voting to help offset Republican turnout advantages in several battlegrounds.","source":"NPR","url":"https://www.npr.org/sections/politics/"},{"headline":"Michigan Cements Status as Democrats' Must-Win Senate Battleground","body":"With 35 Senate seats in play this cycle, Michigan's open seat has emerged as the race Democrats view as essential to any path back to a majority, according to fresh campaign coverage this weekend. Both parties are pouring money and staff into the state as polling shows a tightening contest, with Democratic strategists betting that President Trump's sagging approval numbers can offset economic anxiety in the industrial Midwest that Republicans hope to exploit. The race is increasingly seen as a bellwether for how the broader Senate map, and control of the 120th Congress, will shake out on November 3.","source":"CNN","url":"https://www.cnn.com/election/2026"}],"pacific":{"pacificCommand":[{"headline":"Philippines-China war of words escalates after Seoul dust-up","body":"At the Seoul Defense Dialogue on September 8-9, Philippine Defense Secretary Gilberto Teodoro Jr. was handed a note mid-panel by a Chinese official reaffirming Beijing's rejection of the 2016 arbitral ruling on the South China Sea, which he then read aloud to a stunned audience. Beijing's foreign ministry fired back by accusing Manila of 'stirring up trouble,' extending a diplomatic spat that regional analysts say will likely fuel nationalist rhetoric on both sides without tipping into armed confrontation. The incident lands awkwardly for President Marcos Jr., who has separately signaled interest in resetting ties with Beijing even as friction persists around Scarborough Shoal and Second Thomas Shoal.","source":"CNBC","url":"https://www.cnbc.com/2026/09/11/china-philippine-south-china-sea-disputes-tensions-.html"},{"headline":"Pacific Islands Forum pushes missile-test notification rules after North Korean launch overshadows Palau summit","body":"Leaders gathering in Palau for the annual Pacific Islands Forum are pressing for a regional norm requiring advance notice of missile and nuclear-adjacent tests, with 17 of 18 members reportedly backing the idea. The push follows a nuclear-capable North Korean submarine-launched missile test timed just before the island leaders convened, seen as a deliberate signal to the Pacific bloc. The episode underscores how Northeast Asian proliferation dynamics are increasingly spilling into the security conversations of smaller Pacific Island states far from the Korean Peninsula.","source":"Nikkei Asia","url":"https://asia.nikkei.com/politics/defense"},{"headline":"Japan moves to stand up its first US-style intelligence agency since World War II","body":"Tokyo is building a new, centralized intelligence organization modeled loosely on the CIA, marking the first such effort since Japan's postwar constitutional restructuring. The move is being read by analysts as evidence that Beijing's pressure campaign against Tokyo has backfired, pushing Japan toward deeper security-institution modernization rather than accommodation. It comes alongside broader steps in Japan's 2026 defense posture, including expanded intelligence-sharing plans with Washington and regional partners as Tokyo recalibrates for what its own defense white paper calls a 'new era of crisis' in the Indo-Pacific.","source":"American Enterprise Institute / ISW","url":"https://www.aei.org/commentary/china-taiwan-update-september-4-2026/"}],"pacingThreat":[{"headline":"PLA sorties and coast guard patrols around Taiwan hold at elevated tempo","body":"Taiwan's Ministry of National Defense tracked roughly 20-21 PLA aircraft and 15 PLAN/coast guard vessels operating near the island on September 5-6, with about 12-13 aircraft each day crossing the Taiwan Strait median line. The Institute for the Study of War logged 125 PLA aerial incursions into Taiwan's air defense identification zone through August alone, while Bloomberg reporting cited by analysts notes China has kept at least two coast guard cutters continuously stationed east of Taiwan since June. Analysts describe the pattern as a deliberate coercion strategy aimed at normalizing incursions and rehearsing elements of a potential blockade, rather than routine patrolling.","source":"Ronin's Grips (SITREP: Chinese Military and Intelligence)","url":"https://blog.roninsgrips.com/sitrep-chinese-military-and-intelligence-august-31-2026-to-september-7-2026/"},{"headline":"Xi purges two more top generals from Central Military Commission","body":"On August 28, Beijing formally removed former PLA generals Zhang Youxia and Liu Zhenli from the Central Military Commission, the latest step in an ongoing consolidation of military control under Xi Jinping. The removals follow a multi-year anti-corruption campaign that outside assessments, including the IISS Military Balance 2026, say has left temporary gaps in the PLA's command structure even as the broader military modernization drive continues uninterrupted. Analysts note the purge has not visibly slowed PLA operational activity, including continued high-tempo pressure on Taiwan.","source":"Ronin's Grips (SITREP: Chinese Military and Intelligence)","url":"https://blog.roninsgrips.com/sitrep-chinese-military-and-intelligence-august-31-2026-to-september-7-2026/"},{"headline":"Taipei report flags accelerating PLA amphibious landing preparations","body":"Taiwan's Ministry of National Defense submitted its 2026 report on Chinese military power to the Legislative Yuan on September 1, giving markedly more attention than last year to PLA efforts to build out joint island-landing capabilities. Defense researcher Chieh Chung of Taiwan's Institute for National Defense and Security Research said the report indicates Beijing has made completing amphibious-invasion-relevant military transformation a top force-development priority for the coming years. He added that this buildup appears largely undisturbed by the command gaps created by Xi Jinping's ongoing purge of senior PLA officials.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/09/02/2003863545"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine's Long-Range Strikes Erase Nearly All of Russia's 2026 Battlefield Gains","body":"Ukrainian forces hit Russia's giant TANECO refinery some 1,200 kilometers from the border on September 13, part of an intensifying campaign against Russian fuel infrastructure that has also damaged a refinery's processing units and fuel tanks this week. Separately, the Institute for the Study of War assessed that Ukraine has clawed back nearly all the territory Russia captured so far in 2026, even as fighting continues to grind on multiple fronts. The strikes come as U.S. envoys Steve Witkoff and Jared Kushner shuttle between Moscow and Kyiv seeking a path back to ceasefire talks, though no date for renewed negotiations has been set.","source":"Bloomberg / UNITED24 Media","url":"https://www.bloomberg.com/news/articles/2026-09-13/russia-strikes-ukraine-power-sites-as-kyiv-targets-refining-hub"},{"headline":"Russia Batters Southern Ukraine's Power Grid in Overnight Barrage","body":"Russia launched 129 attack drones overnight, including Shahed-type and jet-powered models, alongside eight Kalibr cruise missiles, six Kh-59/69 guided missiles and Iskander-M/KN-23 ballistic missiles, according to Ukraine's Air Force. Odesa and other southern cities absorbed the brunt of the strikes on energy facilities, forcing emergency crews to battle warehouse fires even as Kyiv's own forces struck back at Russian refining infrastructure. The exchange underscores how both sides are racing to inflict economic pain ahead of any diplomatic off-ramp, with peace talks still stalled after last weekend's high-level U.S. shuttle diplomacy.","source":"Kyiv Independent","url":"https://kyivindependent.com/"}],"europe":[{"headline":"Congress Moves to Cap U.S. Troop Drawdown in Europe as NATO Spending Hits Records","body":"The 2026 National Defense Authorization Act bars the Pentagon from cutting U.S. forces in Europe below 76,000 without formal notification to Congress, a legislative check on the Trump administration's push to shrink America's footprint on the continent. The move follows confirmation from Supreme Allied Commander Europe Gen. Alexus Grynkewich that Washington has already scrapped a rotational armored brigade combat team of more than 4,000 troops plus a long-range fires battalion. NATO's own figures show allies compensating with record outlays: five members are on track to hit the 3.5% GDP core-defense guideline this year and seventeen are set to reach the 1.5% security-investment threshold, well ahead of the 2035 deadline.","source":"GLOBSEC / NATO","url":"https://www.globsec.org/what-we-do/commentaries/hollowing-out-shield-us-strategic-defence-equipment-reductions-and"},{"headline":"Migration Returns to the Top of Brussels' Agenda as Border Pressure Builds","body":"European Union diplomats say migration has forcefully reentered the political conversation after the summer recess, with one senior official telling reporters at a Brussels reception this week that the issue is 'very much back on the agenda.' The renewed focus coincides with fresh strain at Spain's Ceuta enclave, where Moroccan security forces have stepped up border patrols, and with implementation debates over the EU's new Return Regulation meant to speed deportations. The friction highlights a widening rift between Brussels' push for common asylum rules and frontline states like Italy and Greece, which argue Brussels' one-size-fits-all approach ignores their unique exposure.","source":"Euronews","url":"https://www.euronews.com/my-europe/2026/09/09/migration-is-very-much-back-on-the-agenda-eu-diplomat-forewarns"}]},"middleEast":[{"headline":"Israeli Drone Strike Kills Two in Gaza City Despite U.S.-Brokered Ceasefire","body":"An Israeli drone fired at least two missiles into a civilian vehicle in Gaza City's Tal al-Hawa neighborhood on September 13, killing two people and wounding 13 others, according to local medics. The strike mangled the vehicle so badly that health officials could not immediately identify the victims and appealed to the public for help. Israel's military said it had targeted two Hamas fighters, but the attack is the latest in a pattern of strikes that Palestinians say persist despite the ceasefire framework brokered by Washington.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/9/13/israeli-attack-on-gaza-kills-two-palestinians"},{"headline":"Yemen's Houthi-Government War Intensifies as Battle for Bab el-Mandeb Rages","body":"Fighting between Iran-backed Houthi forces and the Saudi-backed Yemeni government has killed at least 194 people and wounded 880 more over a two-week span across Taiz, the western coast, al-Jawf, Marib and Dhalea, aid agencies report. The Houthis seized the strategic Red Sea port of Mocha, deepening fears the conflict could disrupt Bab el-Mandeb shipping lanes, while government tanks pushed toward al-Hazm this week in some of the fiercest clashes since a 2022 UN-brokered truce collapsed. The violence has displaced nearly 20,000 people and drawn condemnation from Oman, Qatar, Bahrain, Kuwait and Pakistan against Houthi strikes on Saudi energy facilities.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/9/13/fighting-continues-between-yemen-govt-forces-houthis-what-is-the-latest"},{"headline":"Iranian Hardliners Accused of Undercutting Fragile Peace Deal Ahead of Gulf Talks","body":"Israeli media report that hardline factions inside Iran's security establishment are said to have launched unauthorized attacks in defiance of Tehran's own leadership, threatening to unravel a nascent peace arrangement. The friction comes as Iran continues pressing for the right to charge tolls on shipping, a demand Oman has flatly rejected, and as Bahrain announced it will skip Monday's planned meeting between Gulf states and Iranian officials. The rift signals deepening distrust among Gulf capitals over Tehran's reliability as a negotiating partner even as regional diplomacy grinds forward.","source":"The Times of Israel","url":"https://www.timesofisrael.com/liveblog-september-13-2026/"}],"techAI":{"aiCompetition":[{"headline":"OpenAI Files Confidential IPO Paperwork as GPT-6 Astra Rolls Out","body":"OpenAI has quietly submitted draft IPO paperwork to the SEC with Goldman Sachs and Morgan Stanley leading the process, making it the third frontier-AI firm in a week to formally line up for Wall Street. The filing lands alongside the staged rollout of GPT-6 Astra, an agentic model that can operate software and run multi-step workflows, which is now reaching ChatGPT Pro, Business, and Enterprise subscribers. The pairing suggests OpenAI is moving to convert its commercial lead into a permanent capital structure just as rivals close their own mega-rounds.","source":"AI Frontier Review","url":"https://aifrontierreview.com/"},{"headline":"Frontier Labs' Funding Concentration Deepens Strategic Dependence on a Handful of Firms","body":"A new market analysis finds that pure-play frontier AI labs raised roughly $264.7 billion in disclosed equity over the trailing 12 months across only 17 companies, with the single largest deal accounting for more than 41 percent of all capital raised. Anthropic closed two mega-rounds in 2026 alone, each larger than the last, while OpenAI and xAI also closed financings north of $20 billion. The extreme concentration means Washington's export-control and antitrust calculus now hinges on the fortunes of a very small number of firms rather than a broad competitive field.","source":"New Market Pitch","url":"https://newmarketpitch.com/blogs/news/frontier-ai-labs-funding-analysis"}],"cyberEmerging":[{"headline":"Iranian Hackers Widen Reach Into US Water, Telecom and Energy Networks","body":"US officials say Iranian government-linked hackers have broadened their intrusion campaign against American water utilities, telecommunications networks and energy providers in recent weeks, going beyond the reconnaissance-only activity documented in earlier campaigns. A joint advisory describes actual manipulation of programmable logic controllers through malicious project files and interference with human-machine interface and SCADA systems across several critical-infrastructure sectors. Analysts view the shift as evidence Tehran is willing to retaliate against the US through cyber channels outside a conventional military theater, even as tensions in the Gulf persist.","source":"CISA advisory reporting","url":"https://shattered.io/iran-cyber-attacks-us-infrastructure-2026/"},{"headline":"Anthropic, Google and OpenAI Converge on 'Gated' Cyber-Capable Model Tiers","body":"This month's frontier model releases show all three major US labs adopting the same architecture: a general-access model paired with a separately restricted, security-vetted version carrying stronger offensive-cyber capability. Anthropic's Mythos 5.1 shares identical weights with its public Fable 5.1 release but has safeguards removed only for vetted defenders, while Google limits its Gemini 3.8 Flash Cyber variant to participants in a new verification program called Fairwind. The convergence signals that labs and regulators are settling on capability-gating, rather than outright suppression, as the emerging norm for managing dual-use AI cyber risk.","source":"Local AI Zone","url":"https://local-ai-zone.github.io/blog/September_2026_AI_Model_Updates.html"}]},"cities":{"lasVegas":[{"headline":"New Skye Canyon School Could Be Named for Late Sen. Joyce Woodhouse","body":"The Clark County School District is weighing a recommendation to name its newest campus, currently under construction in the Skye Canyon neighborhood of northwest Las Vegas, after the late state Sen. Joyce Woodhouse. The proposal honors Woodhouse's legacy in Nevada education policy as the district moves through its final approval process for the new school's name.","source":"Las Vegas Sun","url":"https://lasvegassun.com/news/"},{"headline":"Tourism Chief Flags Steep Drop in Canadian Visitors to Las Vegas","body":"In a briefing to Nevada's Economic Forum, LVCVA President and CEO Steve Hill said Canadian tourism, long the city's largest source of international visitors, has fallen roughly 30 percent since 2019. Hill also used the report to explain why airfares to and from Las Vegas have climbed sharply, adding another headwind for the valley's tourism-dependent economy heading into 2027 budget planning.","source":"Las Vegas Sun","url":"https://lasvegassun.com/news/"},{"headline":"Red Flag Fire Warning Blankets Southern Nevada Deserts","body":"The National Weather Service issued a red flag warning covering Clark and southwest Lincoln county deserts, the Spring Mountains and Sheep Range from Saturday morning through midnight, citing south winds of 15 to 25 mph with gusts to 35 mph and relative humidity dropping as low as 5 percent. Officials warned any fires that ignite under these conditions would spread rapidly and urged residents to avoid outdoor burning across the affected fire weather zones.","source":"GovOneStop / National Weather Service Las Vegas","url":"https://www.govonestop.com/nws/nevada-severe-red-flag-warning-effective-09122026-1056"}],"nellis":[{"headline":"Creech AFB Keeps Pushing Autonomous 'Wingman' Drones Toward the Fight","body":"Creech Air Force Base remains the Air Force's proving ground for the Collaborative Combat Aircraft program, with the Experimental Operations Unit continuing to run Agile Combat Employment exercises using the YFQ-44A Fury uncrewed jet alongside inert AIM-120 missile loads. Air Force Chief of Staff Gen. Ken Wilsbach has pointed to the effort as central to fielding 'affordable mass' for contested airspace, with allied observers, including from the Royal Netherlands Air and Space Force, tracking the program's progress. The work at Creech is feeding directly into how the service plans to pair human pilots with semi-autonomous wingman drones in future combat operations.","source":"Air Force Materiel Command / Army Recognition","url":"https://www.armyrecognition.com/news/aerospace-news/2026/u-s-air-force-accelerates-collaborative-combat-aircraft-testing-for-operational-readiness"}]},"feelGood":[{"headline":"Christian Bale's Long-Dreamed Foster Village Finally Opens Its Doors","body":"Actor Christian Bale has opened a foster care village he first envisioned nearly two decades ago, built specifically to keep sibling groups together rather than scattering them across separate placements. The milestone caps an 18-year effort and gives displaced brothers and sisters a shared home environment during an already difficult transition.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Flight Attendant's Quiet Gesture Gives an Exhausted New Mom a Break","body":"A flight attendant noticed a visibly worn-out new mother struggling to comfort her crying baby mid-flight and stepped in to give her a short, much-needed rest. The small act of attentiveness has since been shared widely as a reminder of how everyday kindness can lift someone in a stressful moment.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Strangers Welcome a Solo Festival-Goer With Autism Into Their Circle","body":"A 24-year-old man with autism went to his first music festival alone, expecting to spend the weekend on his own. Instead, a group of strangers noticed him, invited him to join them, and turned the trip into a weekend of genuine friendship and belonging he had not anticipated.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1759","event":"British forces defeated the French at the Battle of the Plains of Abraham outside Quebec City."},{"year":"1971","event":"The Attica Prison uprising in New York ended when state police retook control, resulting in dozens of deaths."},{"year":"1985","event":"Nintendo released Super Mario Bros. in Japan, launching one of the most influential video game franchises in history."},{"year":"1993","event":"Israeli Prime Minister Yitzhak Rabin and PLO Chairman Yasser Arafat signed the Oslo Accords at the White House."}]},"topPicks":[{"headline":"Ukraine's Long-Range Strikes Erase Nearly All of Russia's 2026 Battlefield Gains","teaser":"Deep-strike campaigns reportedly reverse a year of Russian territorial advances, reshaping the war's momentum."},{"headline":"Xi purges two more top generals from Central Military Commission","teaser":"Fresh purges within China's top military body signal deepening instability at the heart of the PLA's leadership."},{"headline":"US-Iran Tanker War in the Strait of Hormuz Grinds Into Its Seventh Month","teaser":"A prolonged maritime conflict in a critical oil chokepoint keeps global energy markets and security on edge."}]},"navDates":[{"key":"2026-09-18","label":"Sep 18","href":"/","isNewest":true},{"key":"2026-09-17","label":"Sep 17","href":"/archive/2026-09-17.html","isNewest":false},{"key":"2026-09-16","label":"Sep 16","href":"/archive/2026-09-16.html","isNewest":false},{"key":"2026-09-15","label":"Sep 15","href":"/archive/2026-09-15.html","isNewest":false},{"key":"2026-09-14","label":"Sep 14","href":"/archive/2026-09-14.html","isNewest":false},{"key":"2026-09-13","label":"Sep 13","href":"/archive/2026-09-13.html","isNewest":false},{"key":"2026-09-12","label":"Sep 12","href":"/archive/2026-09-12.html","isNewest":false}],"currentKey":"2026-09-13","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-09-13.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
