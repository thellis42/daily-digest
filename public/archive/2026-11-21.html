<script>
const STATE = {"digest":{"date":"Saturday, November 21, 2026","generatedAt":"Sat, Nov 21, 8:46 AM PST","breaking":{"headline":"Russian missiles and drone crash in Poland during NATO exercise, prompting alliance warning","body":"Two Russian Kh-101 cruise missiles and a suspected jet-powered drone came down in southeastern Poland on November 20, landing within roughly 35-50 kilometers of an unprecedented two-week European military exercise that began November 9 to prepare for a possible postwar stabilization mission in Ukraine. Polish Prime Minister Donald Tusk called the incident a likely deliberate provocation timed to the drills, while NATO Secretary-General Mark Rutte labeled it a 'grave violation' of Polish airspace and said he would travel to Poland this weekend. Warsaw requested NATO consultations and additional air-defense support, though it stopped short of formally invoking Article 4, and no injuries or infrastructure damage were reported.","source":"PBS NewsHour / Latin Times","url":"https://www.pbs.org/newshour/world/nato-calls-russian-missiles-landing-in-poland-a-grave-violation-of-airspace"},"tabs":{"defense":{"defense":[{"headline":"Trump nominates Lt. Gen. Patrick Frank to lead NORTHCOM and NORAD","body":"Defense Secretary Pete Hegseth announced that President Trump has nominated Army Lt. Gen. Patrick Frank, currently deputy commander of U.S. Central Command, to take over U.S. Northern Command and NORAD as their next dual-hatted, four-star commander. Frank would succeed Air Force Gen. Gregory Guillot, who has led both commands since February 2024, at a moment when NORTHCOM is working to counter small drone incursions over U.S. military installations. The nomination mirrors Guillot's own career path from CENTCOM's deputy slot and now awaits Senate confirmation.","source":"DefenseScoop","url":"https://defensescoop.com/2026/11/19/trump-nominates-centcom-deputy-lt-gen-patrick-frank-to-lead-northcom-norad/"},{"headline":"Senate pulls back on $350B defense boost and trims Golden Dome funding","body":"Senate Republicans have suspended their push for roughly $350 billion in additional military spending as momentum fades to fund Iran-war costs and other defense priorities before the GOP loses its Senate majority in January. Separately, Senate appropriators cut President Trump's $17 billion-plus Golden Dome missile-defense request roughly in half in a draft defense bill that budget analysts say is unlikely to pass this session, signaling growing friction over big-ticket Pentagon priorities heading into the new Congress.","source":"FDD Overnight Brief","url":"https://www.fdd.org/overnight-brief/november-20-2026/"},{"headline":"Dutch F-35s land on Finnish highway to test NATO's dispersed-airpower concept","body":"On November 20, Royal Netherlands Air Force F-35 stealth fighters touched down on Highway 9 near Kuopio, Finland, as part of Exercise Protective Fence, demonstrating how NATO could keep advanced combat aircraft flying if conventional airbases were crippled by missile strikes. The drill underscores a broader alliance shift toward dispersed airpower as planners factor in Russian long-range strike threats to fixed NATO infrastructure in Europe.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/aerospace-news/2026/dutch-f-35-stealth-fighters-highway-operations-in-finland-reveal-nato-strategy-when-airbases-become-targets"}],"acquisitions":[{"headline":"Navy awards $7.1 billion contract to 28 firms for shipboard electronic warfare upgrades","body":"The U.S. Navy has issued a combined $7.1 billion contract spanning 28 companies, including Lockheed Martin, to upgrade shipboard electronic warfare systems under the Surface Electronic Warfare Improvement Program (SEWIP). The award reflects the Navy's push to harden its surface fleet against increasingly sophisticated radar-guided and electronic threats as great-power competition intensifies.","source":"The Defense Post","url":"https://thedefensepost.com/latest/"},{"headline":"Pentagon adds $1.5 billion for Trident II D5 missile production and support","body":"The Department of War awarded Lockheed Martin an un-priced letter contract modification worth up to $1.53 billion on November 20 for continued production and sustainment of the Trident II D5 submarine-launched ballistic missile. A related $315.7 million modification went to Draper Laboratory for specialized guidance-subsystem engineering support on the same program, underscoring continued investment in the sea-based leg of the U.S. nuclear triad.","source":"U.S. Department of War contract announcements","url":"https://war.gov/News/Contracts/Contract/Article/4657624/contracts-for-nov-20-2026"}]},"us":[{"headline":"Fed signals likely December rate hike as Wall Street suffers worst week of 2026","body":"Minutes from the Federal Reserve's late-October meeting, released this week, showed that almost all officials now favor resuming rate increases, with futures markets pricing roughly a 90-97% chance of a quarter-point hike at the December 19 meeting. Governor Christopher Waller told CNBC he is open to a larger half-point move to get ahead of persistent inflation, while Governor Lisa Cook warned the Fed risks falling behind the curve if it waits. The hawkish tone, combined with an AI-stock selloff, pushed the Nasdaq down roughly 5% for the week and dragged the Dow and S&P 500 into correction territory on Friday, even as Treasury yields fell as investors sought safety.","source":"CNBC / Taipei Times","url":"https://cnbc.com/2026/11/20/treasury-yields-bonds-inflation.html"},{"headline":"Second federal judge rules against Trump's National Mall triumphal arch","body":"A federal judge in Virginia, Leonie Brinkema, said Friday she will issue a preliminary injunction permanently blocking construction of President Trump's planned triumphal arch, ruling that Arlington County is likely to win its case and that she saw no path for the administration to prevail on the merits. It is the second adverse ruling against the project this week, after a D.C. judge separately extended a restraining order through December 3. Both judges cited the administration's failure to seek congressional approval or complete required environmental review; the Justice Department says it will appeal immediately.","source":"NPR","url":"https://www.npr.org/2026/11/20/nx-s1-6048675/trump-arch-blocked-arlington"},{"headline":"Schumer faces leadership challenge as Senate Democrats brace for December shutdown fight","body":"With Democrats having won control of both chambers of Congress in the November 3 midterms but not taking power until January, Senator Chris Van Hollen of Maryland is mounting a challenge to Senate Minority Leader Chuck Schumer, with a leadership vote set for December 1. The outgoing Congress still faces a December 11 government funding deadline, and analysts say a short-term continuing resolution could push real budget negotiations into February once Democrats control both houses. The overlapping leadership fight and funding cliff set up a tense final stretch for the current Congress before the new majority is seated.","source":"Al Jazeera","url":"https://aljazeera.com/news/2026/11/21/us-midterms-2026-what-happens-before-the-new-congress-takes-office"},{"headline":"Administration retreats on bid to strip Venezuelans of deportation protections","body":"The Trump administration on Thursday withdrew an emergency application asking the Supreme Court to block reinstated Temporary Protected Status for hundreds of thousands of Venezuelans, after the Ninth Circuit extended a stay keeping a lower court's ruling in place. The underlying fight traces to a September 2025 California district court decision finding that then-DHS Secretary Kristi Noem exceeded her authority in terminating Venezuela's TPS designation, a ruling the Ninth Circuit upheld in January. Solicitor General John Sauer signaled the administration will return to the Supreme Court if the appeals court ultimately rules against it, keeping the status of Venezuelan TPS holders unresolved heading into the new year.","source":"JURIST","url":"https://www.jurist.org/news/2026/11/trump-administration-withdraws-us-supreme-court-request-over-venezuelan-deportation-protections/"}],"pacific":{"pacificCommand":[{"headline":"Australia and Philippines Sign New Defense Pact in Manila","body":"On the sidelines of ASEAN-related summitry, Canberra and Manila signed a defense cooperation agreement that simplifies procedures for joint military exercises and expands maritime surveillance, information sharing, training and disaster-response coordination. The pact builds on a rapidly deepening security relationship as the Philippines continues to contend with Chinese pressure around contested reefs and shoals in the South China Sea. It follows earlier 2026 steps by the two militaries to link defense infrastructure and operations more closely.","source":"Reuters / Wikipedia Current Events Portal","url":"https://en.wikipedia.org/wiki/Portal:Current_events/November_2026"},{"headline":"Japan Wins First-Ever Access to India's Live-Fire Test Ranges","body":"Tokyo and New Delhi have concluded a Letter of Intent allowing Japan's Self-Defense Forces to use Indian test ranges for live-fire training for the first time, a modest but notable deepening of defense ties that stops short of a formal alliance. The deal gives India a new role as a training host while solving a chronic space problem for Japan's forces, part of a broader regional trend of countries building overlapping security partnerships without joining blocs. Analysts tracking the region say the arrangement is being studied by other non-aligned powers looking to replicate the model.","source":"Rio Times, Asia Intelligence Brief","url":"https://www.riotimesonline.com/asia-intelligence-brief-saturday-november-21-2026/"},{"headline":"US Senators Push Deeper Military Space Ties With New Zealand","body":"Nine US senators wrote to the Pentagon this week urging expanded defense-space cooperation with Wellington, pointing to New Zealand's Auckland-based hub supporting US Space Command tracking and partner-nation training. An amendment from Senator Eric Schmitt already directs the Pentagon to draft, within six months, a strategy for deeper US-New Zealand space and industrial cooperation, citing shared security concerns in the Pacific and Antarctic. The push reflects growing Washington interest in smaller Pacific allies' niche capabilities as a counterweight to Chinese regional influence.","source":"Radio New Zealand via Indo-Pacific Insights","url":"https://indopacificinsights.substack.com/p/indo-pacific-5x5-november-20th-2026"}],"pacingThreat":[{"headline":"Analysts Say PLA May Be Running Unannounced Taiwan 'Blockade' Drill","body":"The Institute for the Study of War and the American Enterprise Institute assess that the PLA has likely been conducting a large, unannounced exercise simulating the encirclement and isolation of Taiwan, a drill Taiwanese media have dubbed a 'silent military exercise.' Taiwan's National Security Council has reported more than 100 PLA Navy and China Coast Guard vessels spread across the Western Pacific, alongside a single-day record of 49 PLA aircraft sorties and a southbound deployment of the carrier Liaoning. The scale and secrecy of the movements have drawn comparisons to rehearsal activity for a future blockade scenario.","source":"The Diplomat","url":"https://thediplomat.com/2026/11/beyond-a-taiwan-blockade-the-strategic-implications-behind-the-plas-silent-military-exercise/"},{"headline":"PLA Leadership Purges Deepen Ahead of 2027 Modernization Deadline","body":"A new PLA Watch report from the Asia Society's Center for China Analysis documents continuing senior-level purges and tightening political control inside the PLA even as the navy expands operations beyond the First Island Chain and ramps up military diplomacy abroad. Researchers warn the removals are stripping out significant operational experience from top ranks just as Beijing approaches its self-imposed 2027 military modernization milestone. The purges coincide with a parallel anti-corruption push into major weapons programs led by newly elevated Politburo member General Zhang.","source":"Center for China Analysis, Asia Society","url":"https://centerforchinaanalysis.asiasociety.org/p/pla-watch-27-november-17-2026"},{"headline":"Beijing Moves to Influence Taiwan's November 28 Local Elections","body":"A new AEI Critical Threats update reports that PRC-based cross-strait business associations are subsidizing travel for Taiwanese expatriates living in China so they can fly home and vote in the island's November 28 local elections, a tactic analysts believe is intended to boost PRC-friendly candidates. Separately, Taiwanese prosecutors indicted three private investigators on November 17 for illegally surveilling two social-media influencers on behalf of Chinese handlers. The developments underscore Beijing's expanding influence operations on Taiwan's domestic politics just a week before the vote.","source":"American Enterprise Institute, Critical Threats","url":"https://www.aei.org/commentary/china-taiwan-update-november-20-2026/"}]},"europe":{"ukraineRussia":[{"headline":"Russia batters Zelensky's hometown and Kyiv in massive overnight barrage","body":"Russia fired ballistic missiles alongside 148 attack drones at Ukraine overnight into November 21, with Ukrainian air defenses intercepting 117 of the drones. The heaviest damage hit Kryvyi Rih, President Zelensky's hometown, where the strike killed two people and wounded 60 others, while a separate missile barrage on Kyiv injured residents and set residential buildings ablaze in three districts. Russia's Defense Ministry claims it has lost roughly 1,634,860 personnel since the war began in February 2022, including 1,730 in the past 24 hours alone, according to Ukrainian tallies.","source":"ABC News / Ukrinform","url":"https://abcnews.com/International/wireStory/ballistic-missile-attack-zelenskyys-hometown-central-ukraine-kills-138340723"},{"headline":"Peace diplomacy stalls as Moscow balks at European seat at the table","body":"Fresh online talks this month between Kyiv, US envoys Steve Witkoff and Jared Kushner, and European officials produced what Zelensky called a 'not easy' session, with participants agreeing to regroup in Berlin with the 'Coalition of the Willing.' Kremlin aide Yuri Ushakov has rejected Washington's assertion that Europeans would join the next formal round of talks, insisting Moscow has only consented to the existing US-Russia-Ukraine format. The impasse follows the Abu Dhabi round in early November that ended without a breakthrough on post-war security guarantees.","source":"Al Jazeera","url":"https://www.aljazeera.com/amp/news/2026/11/17/ukraine-holds-peace-talks-with-us-europe-as-conflict-escalates"}],"europe":[{"headline":"NATO allies and cyber firms rehearse wartime resilience of civilian networks","body":"NATO member states and leading cyber industry executives convened at alliance headquarters on November 18 for the annual Cyber Defence Conference, focused on keeping digital infrastructure operational through crisis and conflict. Officials flagged that NATO's ability to move forces and sustain operations now hinges heavily on commercial networks outside direct military control, pushing the alliance toward deeper private-sector partnerships. NATO's cyber chief called for realistic exercises in prioritization, surge support, and secure use of AI-enabled tools to withstand disruption.","source":"NATO","url":"https://www.nato.int/en/news-and-events/articles/news/2026/11/19/nato-and-cyber-industry-leaders-discuss-enhanced-cooperation-for-cyberspace-defence"},{"headline":"Spain's immigration-fueled growth model faces a ballot-box reckoning","body":"Just over a week before Spain's November 29 snap election, new economic data shows immigration has become the engine of the country's growth, with the Bank of Spain crediting newcomers for about 1.7 percentage points of GDP expansion since 2022 even as real wages are projected to stagnate through 2027. Prime Minister Pedro Sanchez's Socialists are touting the economy's roughly 2.6% growth rate, nearly double the eurozone average, while the conservative Popular Party and hardline Vox campaign on tightening arrivals and blame migration-linked demand for worsening the national housing crisis. The vote is shaping up as a referendum on whether Europe's last major pro-immigration government can survive.","source":"The National Pulse","url":"https://thenationalpulse.com/2026/11/20/socialist-spain-is-using-mass-migration-to-mask-an-economic-crisis/"}]},"middleEast":[{"headline":"Strait of Hormuz shipping attacks intensify as US blockade of Iran hits 130 days","body":"At least three tankers were struck by projectiles or mines near Khasab, Oman on November 21, the latest in a wave of attacks UKMTO and gCaptain say is surging worldwide, with no casualties reported in the incidents. Iran's navy and IRGC claimed credit for some of the strikes while unveiling an underground facility housing a new launcher capable of firing two liquid-fueled missiles, a signal of readiness to escalate against the US. The US military confirmed its naval blockade of Iran has now stretched to 130 consecutive days, and Etihad Airways has extended cancellations of flights between Abu Dhabi and Riyadh/Dammam through November 30 over the regional security risk.","source":"Gulf News / KRMG","url":"https://gulfnews.com/uae/middle-east-war-8-things-uae-residents-need-to-know-tonight-november-21-1.500756425"},{"headline":"Israeli strike on Gaza City vehicle kills three, with dispute over target","body":"An Israeli strike on a vehicle in Gaza City's Tel al-Hawa neighborhood on November 21 killed three Palestinians, with the military saying it hit 'terror operatives' while witnesses told Reuters the vehicle was carrying humanitarian aid. The incident adds to friction over the fragile Gaza arrangement, coming the same day Israel issued demolition notices for two buildings in Hebron's Area A, stoking fresh fear among Palestinian residents.","source":"Times of Israel / Al Jazeera","url":"https://www.timesofisrael.com/liveblog-november-21-2026/"},{"headline":"Houthis target Riyadh as Saudi-backed forces brace for assault on Aden","body":"Saudi Arabia's military coalition said it intercepted three Houthi ballistic missiles aimed at Riyadh early on November 21, with a witness describing an explosion after a projectile streaked across the capital's sky. Simultaneously, Yemeni government forces say they repelled a large-scale Houthi offensive in Taiz and killed a senior Houthi commander there, while Saudi-backed forces reinforce defenses around the southern port city of Aden against an advancing Houthi push. The flare-up underscores how Yemen's war is intertwining with the broader Iran-US-Israel confrontation playing out across the Gulf.","source":"Dubai Standard / Outlook India","url":"https://www.dubaistandard.com/middle-east-conflict-5-key-developments-uae-residents-need-to-know-today-november-21-2026/"}],"techAI":{"aiCompetition":[{"headline":"DeepSeek closes roughly $15 billion funding round as Chinese AI race accelerates","body":"DeepSeek completed a second external funding round of about 100 billion yuan (roughly $15 billion) on November 20, accounting for more than 99% of the $15.07 billion raised across six disclosed AI deals that day. The scale of the round underscores how aggressively Chinese developers are now competing for compute and talent against US labs, even as Washington's export controls aim to slow Beijing's frontier-AI progress. A separate Chainalysis report released the same day found China-linked stablecoin payments for accessing restricted US AI models jump 55% above baseline within days of major US model launches, pointing to a thriving proxy market circumventing those controls.","source":"AI Funding Tracker","url":"https://aifundingtracker.com/ai-funding-news-november-20-2026/"},{"headline":"Defense AI drone maker Shield AI lands $1.5 billion Series G","body":"Shield AI secured $1.5 billion in Series G funding as part of a larger $2.25 billion capital package, pushing its valuation to $12.7 billion, according to funding trackers citing recent disclosures. The round reflects surging investor appetite for autonomous defense systems as the Pentagon leans further into AI-enabled drones and uncrewed platforms amid great-power competition. It adds to a broader pattern this month of defense-adjacent and frontier AI firms, from Cognition to Isomorphic Labs, commanding multibillion-dollar valuations even as public AI stocks wobble.","source":"AI Startup Funding News","url":"https://blog.mean.ceo/ai-startup-funding-news-november-2026/"}],"cyberEmerging":[{"headline":"Trump fires national cyber director after wave of outages hits FAA, banks and NSA systems","body":"President Trump dismissed National Cyber Director Sean Cairncross on November 20 following a string of technology failures that disrupted the FAA and air travel, major banks including JPMorgan Chase, Microsoft services, and classified NSA communications. Trump told reporters he fired Cairncross because he 'wasn't good enough,' and the role is being filled on an acting basis by Pentagon Chief Information Officer Kirsten Davies, who has backing from Secretary of State Marco Rubio and Defense Secretary Pete Hegseth. Senate Minority Leader Chuck Schumer blasted the move as reactive, calling the ousted director a 'political hack' and questioning the administration's broader cyber readiness.","source":"Defense One","url":"https://www.defenseone.com/policy/2026/11/pentagon-cio-replaces-white-house-cyber-director-sean-cairncross-major-shakeup/417359/"},{"headline":"DHS taps blockchain firm TRM Labs for new $94.66 million cybercrime disruption center","body":"The Homeland Security Task Force launched its Threat Disruption Center on November 18, naming blockchain analytics firm TRM Labs as primary private-sector partner under a roughly $94.66 million contract running through August 2027. The center, which implements Executive Order 14390 signed in March, links more than 30 federal agencies and over 440 state and local partners with crypto exchanges, payment firms and social platforms to freeze scam proceeds and take down fraud infrastructure in near real time. The push comes as reported US cybercrime losses hit $20.9 billion in 2025, with TRM's leadership saying it is also exploring AI tools to triage victim reports faster.","source":"The Block","url":"https://www.theblock.co/news/regulation/2026-11-19-us-launches-cybercrime-center-with-trm-labs-to-help-trace-crypto-tied-to-scams-443599"}]},"cities":{"lasVegas":[{"headline":"Verstappen grabs pole as Ferrari implodes in chaotic Las Vegas Grand Prix qualifying","body":"Saturday's Formula 1 Las Vegas Grand Prix turned dramatic before the race even started, with Mercedes' Kimi Antonelli posting the fastest qualifying lap but a five-place grid penalty handing pole position to Red Bull's Max Verstappen, who starts alongside George Russell on the front row. Both Ferrari drivers, Lewis Hamilton and Charles Leclerc, suffered shock early eliminations in qualifying, with Hamilton calling himself devastated and Leclerc admitting he was angry. Russell also publicly criticized Verstappen over a clash during final practice, adding extra tension to the Strip Circuit showdown.","source":"Sky Sports","url":"https://www.skysports.com/f1/grandprix/las-vegas"},{"headline":"North Las Vegas police seek public's help after 16-year-old girl killed in shooting","body":"North Las Vegas police are asking residents to review surveillance footage after a 16-year-old girl was shot and killed following a large party on Cockatiel Drive. Detectives have obtained video and a photograph showing individuals who may have information relevant to the case but have not announced any arrests. The department is urging anyone who recognizes the people in the footage to come forward or contact investigators directly.","source":"KSNV News 3 Las Vegas","url":"https://news3lv.com/news/local/north-las-vegas-police-seek-publics-help-in-fatal-shooting-of-16-year-old-girl"},{"headline":"Henderson man booked on murder charge after calling 911 to report killing his mother","body":"Henderson police arrested 54-year-old Michael Holman after he personally called officers to report that he had killed his mother. Officers responding to a home near West Warm Springs Road found an adult woman dead from a gunshot wound and detained Holman without incident. He was booked into the Henderson Detention Center on an open murder charge as the investigation continues.","source":"KSNV News 3 Las Vegas","url":"https://news3lv.com/news/local/man-calls-police-says-he-killed-mother-woman-found-shot-dead-in-henderson-home"}],"nellis":[{"headline":"Air Force moves ahead on $1 billion-plus F-47 test campus at Nellis","body":"The Air Force is pressing forward with plans for a sprawling new test complex at Nellis Air Force Base to support Boeing's F-47, the sixth-generation stealth fighter meant to eventually replace the F-22. The so-called F-47 Future Campus, estimated at more than $1 billion and expected to occupy the eastern side of the base, will involve up to four contractors and include specialized facilities for maintaining the jet's low-observable coatings and radar-absorbent materials. While initial flight testing will happen at Edwards Air Force Base in California, Nellis is being positioned for a larger role in operational integration, partly because of its proximity to Creech Air Force Base's Collaborative Combat Aircraft drone unit.","source":"Zona Militar / Aviation A2Z","url":"https://www.zona-militar.com/en/2026/11/04/usaf-plans-1-billion-plus-investment-at-nellis-to-prepare-for-f-47-fighter-and-collaborative-drones/"}]},"feelGood":[{"headline":"Florida dad sprints onto train tracks to save a stranger's life","body":"What began as a family birthday outing turned into a split-second rescue when a Florida father noticed an elderly man's walker had gotten stuck on railroad tracks as a high-speed train approached. Without hesitation, the man ran onto the tracks and pulled the stranger to safety just in time. The moment, captured by witnesses, has circulated widely this week as a reminder of instinctive courage among ordinary people.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Florida teachers turn a simple bench into a lasting friendship","body":"Teachers Maren and David Douglass noticed a young schoolgirl sitting on the ground at the end of their driveway each morning while waiting for her bus, so the couple built her a bench to sit on instead. Her joyful reaction inspired them to go further, adding a small free library nearby stocked with books for neighborhood children. The gesture, born from a small daily observation, has since grown into an ongoing connection between the family and local kids.","source":"Global Positive News Network","url":"https://www.globalpositivenewsnetwork.com/good-news-this-week-november-15th-2026/"},{"headline":"Fishermen pull cruise ship pianist from the Pacific after nine hours adrift","body":"Two fishermen off the California coast turned a routine morning on the water into a dramatic rescue when they spotted a cruise ship crew member treading water nearly 20 miles offshore. The pianist had been in the ocean for roughly nine hours before the pair hauled him aboard, likely saving his life. The rescue has been held up as an example of ordinary citizens stepping in when it matters most.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1783","event":"The first manned hot air balloon flight took place in Paris, piloted by Pilatre de Rozier and the Marquis d'Arlandes."},{"year":"1877","event":"Thomas Edison publicly announced his invention of the phonograph."},{"year":"1985","event":"Jonathan Pollard, a US Navy intelligence analyst, was arrested for spying on behalf of Israel."},{"year":"1990","event":"The Charter of Paris for a New Europe was signed, formally declaring the end of the Cold War era in Europe."}]},"topPicks":[{"headline":"Russian missiles and drone crash in Poland during NATO exercise, prompting alliance warning","teaser":"A direct incursion onto NATO territory risks escalating tensions and testing the alliance's collective defense resolve."},{"headline":"Russia batters Zelensky's hometown and Kyiv in massive overnight barrage","teaser":"A fierce new wave of strikes deepens the humanitarian toll as peace talks remain stalled."},{"headline":"Fed signals likely December rate hike as Wall Street suffers worst week of 2026","teaser":"Markets reel as the Fed's hawkish signal threatens to deepen the worst weekly selloff of the year."}]},"navDates":[{"key":"2026-11-25","label":"Nov 25","href":"/","isNewest":true},{"key":"2026-11-24","label":"Nov 24","href":"/archive/2026-11-24.html","isNewest":false},{"key":"2026-11-23","label":"Nov 23","href":"/archive/2026-11-23.html","isNewest":false},{"key":"2026-11-22","label":"Nov 22","href":"/archive/2026-11-22.html","isNewest":false},{"key":"2026-11-21","label":"Nov 21","href":"/archive/2026-11-21.html","isNewest":false},{"key":"2026-11-20","label":"Nov 20","href":"/archive/2026-11-20.html","isNewest":false},{"key":"2026-11-19","label":"Nov 19","href":"/archive/2026-11-19.html","isNewest":false}],"currentKey":"2026-11-21","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-21.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
