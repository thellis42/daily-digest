<script>
const STATE = {"digest":{"date":"Thursday, October 15, 2026","generatedAt":"Thu, Oct 15, 7:09 AM PDT","breaking":{"headline":"Saudi National Charged With Planting Hidden Recording Device Inside OpenAI Offices","body":"Federal prosecutors have charged Abdulrahman Alfozan, a 35-year-old Saudi national and former OpenAI engineer, with secretly hiding a thumb-sized recording device, concealed in toilet paper, inside an executive conference room at the company's San Francisco headquarters. He allegedly used his wife's company credentials to gain repeated unauthorized access to the room and was taken into custody last week. The case lands amid growing concern over foreign efforts to penetrate frontier AI labs and comes the same week Anthropic publicly warned that open-source AI models carry heightened cybersecurity risk relative to proprietary systems.","source":"Fox News","url":"https://www.foxnews.com/live-news/openai-saudi-engineer-arrested-10-14-26"},"tabs":{"defense":{"defense":[{"headline":"Hegseth Ties $50 Billion Drone Push to Stalled Reconciliation Funds","body":"Speaking at the AUSA annual meeting on October 14, Defense Secretary Pete Hegseth said the Pentagon intends to push for a $1.5 trillion budget once Congress returns from the midterms, stressing that over $50 billion in reconciliation funds earmarked for drone and autonomous-warfare programs remains unapproved. Army leaders at the same event tied that money to the service's newly created Futures and Autonomous Systems Command and Fort Rucker's designation as a UAS Autonomy Center of Excellence. Officials also admitted a readiness gap: the Army can now buy attack drones by the tens of thousands faster than it can train soldiers to crew and maintain them.","source":"Inside Defense","url":"https://insidedefense.com/insider/insider-daily-digest-october-14-2026"},{"headline":"Army Acknowledges Heavy Patriot Expenditure Defending Against Iranian Missile Barrage","body":"The Army's top acquisition official, briefing reporters at AUSA on October 14, would not confirm reports that U.S. forces expended as many as 70 Patriot interceptors to stop roughly 20 Iranian ballistic missiles in a single attack on a base in Jordan. The Army is now rewriting Patriot's missile-defense software to incorporate lessons from that engagement, even as officials say a short-term continuing resolution running through December 11 poses no immediate threat to ongoing procurement. The episode highlights the Pentagon's growing concern over the cost-exchange ratio of defending against mass ballistic-missile salvos.","source":"Inside Defense","url":"https://insidedefense.com/insider/insider-daily-digest-october-14-2026"},{"headline":"NATO's Rutte Presses Allies for More Air Defense as Russia Escalates Strikes Near Kyiv","body":"NATO Secretary-General Mark Rutte, visiting Estonia on October 14, urged member states to send more air-defense systems to Ukraine, citing a sharp escalation in Russian strikes over Kyiv's skies. His appeal followed remarks two days earlier in Warsaw by Supreme Allied Commander Gen. Alexus Grynkewich, who said the alliance is 'ready to fight tonight' if attacked, as Polish Prime Minister Donald Tusk warned Moscow could test NATO defenses with drone or rocket provocations. Rutte's Tallinn visit included meetings with Estonian President Ulle Madise and a stop at Amari Air Base, underscoring NATO's reinforced eastern-flank posture.","source":"Euronews / NATO","url":"https://www.nato.int/en/news-and-events/events/transcripts/2026/10/14/joint-press-conference-with-nato-secretary-general-and-the-prime-minister-of-estonia"}],"acquisitions":[{"headline":"Pentagon Reverses Course, Backs Two-Destroyer Build Rate at Bath Iron Works","body":"The Defense Department now believes General Dynamics' Bath Iron Works can build two Arleigh Burke-class destroyers at once, reversing a fiscal year 2027 budget request that had funded only a single ship. The shift, disclosed October 13, signals a Navy push to rebuild surface-combatant production capacity after years of single-ship requests strained the shipbuilding industrial base. It accompanied a separate reprogramming of $313.4 million across fiscal 2026 accounts, including $200.2 million redirected to the Army's Future Long Range Assault Aircraft program.","source":"Inside Defense","url":"https://insidedefense.com/defense-business-briefing/defense-business-briefing-october-13-2026"},{"headline":"Johns Hopkins Applied Physics Lab Lands $500 Million Pentagon Engineering Deal","body":"The Department of War awarded Johns Hopkins University's Applied Physics Laboratory a $499.8 million ceiling indefinite-delivery, indefinite-quantity contract on October 14 for engineering, development and research services, with ordering authority extending to October 2031. The same day's contract notices included a roughly $32 million Oshkosh Defense modification to sustain the Army's Family of Heavy Tactical Vehicles fleet. Together the awards show continued Pentagon investment in both advanced research capacity and legacy vehicle sustainment even as lawmakers debate full-year appropriations.","source":"U.S. Department of War","url":"https://war.gov/News/Contracts/Contract/Article/4625668/contracts-for-oct-14-2026"}]},"us":[{"headline":"September Inflation Surges to 3.7%, Complicating Fed's Path Just Before Midterms","body":"The Bureau of Labor Statistics reported Wednesday that the Consumer Price Index rose 3.7% year-over-year in September, up from 3.4% in August, driven largely by a spike in gasoline prices. Core inflation, which excludes food and energy, climbed 2.6% annually. The hotter-than-expected data arrives on the heels of a weak September jobs report showing just 29,000 positions added and unemployment at 4.2%, and traders now peg the odds of another Fed rate hike at the October 27-28 meeting near 45%, up sharply from roughly 22% before the release. The numbers land three weeks before the November 3 midterms, deepening economic headwinds for Republicans defending their congressional majorities.","source":"Daily Caller","url":"https://dailycaller.com/2026/10/14/inflation-soars-to-37-as-gas-prices-batter-americans/"},{"headline":"Supreme Court Sides With FCC, Preserving GOP-Friendly Ad Rate Rules Through Midterms","body":"The Supreme Court ruled Wednesday in FCC v. Brown that the Federal Communications Commission does not have to immediately decide what ad rates apply when campaigns and party committees coordinate spending, rejecting a push from Democratic candidates. The justices found the 4th U.S. Circuit Court of Appeals had improperly set an expedited schedule forcing a snap FCC decision. The per curiam order effectively leaves current rules in place for the rest of the 2026 election cycle, a outcome Democrats had sought to overturn.","source":"The Washington Times","url":"https://www.washingtontimes.com/news/2026/oct/14/supreme-court-allows-fcc-ad-rules-benefit-gop-remain-2026-election/"},{"headline":"Justice Department Threatens California Over Alleged Noncitizens on LA Voter Rolls","body":"The Trump administration escalated a confrontation with California election officials, sending letters obtained by CNN that threaten legal action if the state does not review a list of alleged noncitizens on Los Angeles voter rolls within 48 hours. The Tuesday letters mark a sharpening of the administration's broader push on voter-roll integrity ahead of the November 3 midterms. California officials have not yet signaled whether they will comply with the deadline, setting up a likely legal clash over federal-state authority on election administration.","source":"CNN","url":"https://www.cnn.com/2026/10/14/politics/justice-department-threats-california-election-officials"},{"headline":"Federal Judge Keeps White House Press Ban on CNN, MSNOW and Politico Blocked","body":"U.S. District Judge Timothy Kelly granted a preliminary injunction late Tuesday continuing to bar the Trump administration from excluding CNN, MS NOW and Politico from White House press access. The order preserves the status quo while litigation proceeds over the outlets' claim that the ban violated their constitutional rights to cover the government. The ruling is the latest setback for the administration's efforts to restrict access for news organizations it views as adversarial, following similar disputes over Pentagon press credentialing rules that most major outlets, including Fox News, have refused to accept.","source":"ABC News","url":"https://abcnews.com/Politics/federal-judge-grants-preliminary-injunction-continuing-block-trumps/story?id=137247889"}],"pacific":{"pacificCommand":[{"headline":"Takaichi says Japan will 'seriously consider' nuclear-powered submarines","body":"Japanese Prime Minister Sanae Takaichi told parliament on October 14 that Tokyo will 'seriously consider' arming the Self-Defense Forces with nuclear-powered submarines, a notable shift given Japan's long-standing restriction of nuclear technology to peaceful uses. She cited gaps in Japan's intelligence-gathering and surveillance capacity across the Pacific and said officials will study how Australia's submarine program and South Korea's own nuclear-propulsion ambitions are progressing. The idea, which would have to be squared with Japan's three non-nuclear principles, is expected to be weighed as part of a revision to Japan's national security strategy due by year's end.","source":"Anadolu Agency via anews.com.tr","url":"https://www.anews.com.tr/middle-east/2026/10/15/japan-to-seriously-consider-nuclear-powered-submarines-amid-regional-tensions"},{"headline":"Manila and Tokyo deepen security coordination amid regional tensions","body":"Philippine National Security Adviser Eduardo Oban Jr. held a phone call on October 14 with his Japanese counterpart, Keiichi Ichikawa, to compare notes on shifting Indo-Pacific security dynamics. The two officials reaffirmed a shared commitment to a free, open and rules-based regional order, building on a year of expanding ties that includes the September 2025 Reciprocal Access Agreement and Japanese transfers of coastal radar and surveillance gear under its Official Security Assistance program. Manila has increasingly framed its own defense posture as linked to Japan's within the broader first island chain running from Japan through the Philippines.","source":"BusinessMirror","url":"https://businessmirror.com.ph/2026/10/15/phl-japan-strengthen-security-ties"},{"headline":"Australia and Indonesia launch largest ADF overseas exercise of 2026","body":"Australia and Indonesia kicked off Exercise Keris Woomera on October 12 in East Java, Australia's largest overseas military training activity of the year, with about 2,200 personnel conducting amphibious landings, live-fire drills and maritime operations. The exercise builds on the Jakarta Treaty on Common Security the two countries signed roughly eight months ago and signals gradually deepening operational cooperation between their armed forces. Separately, Australia is flying F-35A fighters and a P-8A Poseidon patrol aircraft alongside Britain, Malaysia, New Zealand and Singapore in the Five Power Defence Arrangements' Bersama Lima exercise, running through October 19.","source":"ASPI Defence Strategy Program (Fault Lines)","url":"https://aspidefence.substack.com/p/fault-lines-020-tools-of-the-trade"}],"pacingThreat":[{"headline":"Liaoning carrier group pushes into the Philippine Sea near Japan","body":"Japan's Joint Staff Office tracked China's carrier Liaoning and its escorts - cruisers Anshan and Wuxi and destroyer Huainen - transiting into the Philippine Sea on October 14, passing about 155 miles south of Japan's Ishigaki Island while launching and recovering aircraft. The strike group had moved through the East China Sea and threaded between Okinawa and Miyako Island over the prior two days before entering the Philippine Sea. Beijing called the deployment routine annual training not aimed at any specific country, but the track keeps the carrier within reach of both Taiwan and Japan's southern Ryukyu islands.","source":"USNI News","url":"https://news.usni.org/2026/10/14/chinese-carrier-strike-group-drills-in-the-philippine-sea"},{"headline":"Tokyo protests Chinese delegation's visit to disputed northern island","body":"Japanese Foreign Minister Toshimitsu Motegi told parliament on October 14 that a Chinese delegation's visit to Iturup, known in Japan as Etorofu and controlled by Russia, was 'completely unacceptable' given Tokyo's own sovereignty claim over the island. The protest underscores Japanese anxiety about apparent coordination between Beijing and Moscow on territory Japan disputes, even though Tokyo has little practical ability to block such visits. The friction adds to a string of China-related pressure points for Japan this month, alongside the Liaoning's carrier operations near Japanese waters and Tokyo's own deliberations over nuclear submarines.","source":"Rio Times (Asia Intelligence Brief)","url":"https://riotimesonline.com/asia-intelligence-brief-wednesday-october-14-2026"},{"headline":"PLA keeps up near-daily pressure around Taiwan","body":"Taiwan's Ministry of National Defense reported nine People's Liberation Army aircraft sorties and six PLA Navy ships operating around the island in the 24 hours ending the morning of October 14, with all nine sorties crossing the Taiwan Strait median line into Taipei's northern, central, southwestern and eastern air defense identification zones. Taiwan's armed forces responded with combat air patrols, naval vessels and coastal missile units, per the ministry's daily tracker. The steady tempo comes as Taipei separately advances a roughly $850 million, six-year plan to quadruple its combat ammunition reserves from 30 to 120 days of supply in case a wartime blockade cuts off resupply.","source":"Taiwan Ministry of National Defense, Air Force Command Headquarters","url":"https://air.mnd.gov.tw/en/News/News_Detail.aspx?CID=214&ID=59309"}]},"europe":{"ukraineRussia":[{"headline":"Russia pounds Kyiv and Kharkiv energy grid in massive overnight barrage","body":"Russia fired more than 39 ballistic missiles and roughly 120-128 drones and loitering munitions overnight into October 14, hitting all three of Kyiv's combined heat and power plants and leaving about 600,000 people without electricity. The attack killed at least six people in Kyiv, including a child, with Kharkiv also hit hard; Moscow's defense ministry described it as a strike on communications and energy infrastructure. The barrage came just days after President Trump had announced a so-called 'energy ceasefire' in the war, underscoring how little that arrangement has held.","source":"CBS News / Forbes","url":"https://www.cbsnews.com/news/us-ukraine-intelligence-russia-war-missile-strikes-kyiv-power-outages/"},{"headline":"SpaceX Starshield curbs and withheld US warnings inflame Kyiv-Washington friction","body":"Ukrainian officials say SpaceX abruptly throttled Starshield military satellite service for terminals moving faster than about 100 mph, degrading drone interceptor missions, reconnaissance and frontline communications without advance notice. Elon Musk countered that the US military and president set Starshield's limits and that the system cannot be used for offensive operations. Separately, multiple sources tell CBS News the Trump administration may have withheld early warning intelligence on this week's Russian ballistic missile waves, with Ukrainian officials disputing Washington's stated excuse of bad weather.","source":"CNN / CBS News","url":"https://www.cnn.com/2026/10/14/europe/russia-ukraine-energy-strike-early-warning-intl-hnk"}],"europe":[{"headline":"NATO unveils 'block, blunt, break' plan to defeat a Russian attack","body":"Supreme Allied Commander Europe Gen. Alexus Grynkewich unveiled NATO's new war-fighting concept at the Warsaw Security Forum, built around rapidly detecting, slowing and then dismantling any Russian assault on the alliance's eastern flank using drones and AI alongside traditional forces. Grynkewich said the alliance is 'ready to fight tonight' even though he does not consider a Russian attack imminent, a message delivered as Polish Prime Minister Donald Tusk warned Moscow may test NATO defenses with drone or rocket strikes. The plan draws directly on lessons from the Ukraine battlefield.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/10/13/block-blunt-break-whats-in-natos-new-russia-war-plan"},{"headline":"EU leaders open Brussels summit under strain of energy prices and budget fights","body":"European Council leaders convened October 15-16 in Brussels to tackle surging energy prices and competitiveness, the bloc's 2028-2034 long-term budget, continued Ukraine financing, Russia-linked hybrid attacks, migration and enlargement. Germany, Italy, Spain, Poland, Austria and Portugal are now pushing to consider a windfall-profit tax on energy companies as the cost-of-living squeeze forces harder distributive choices onto the agenda. EU foreign policy chief Kaja Kallas also used the summit to frame Ukraine's recent refinery strikes inside Russia as legitimate self-defense, sharpening the bloc's diplomatic tone toward Moscow.","source":"Consilium / Rio Times","url":"https://www.consilium.europa.eu/en/meetings/european-council/2026/10/15-16/"}]},"middleEast":[{"headline":"Houthi missiles keep hitting Riyadh as Aramco headquarters is damaged","body":"Houthi forces fired fresh ballistic and cruise missiles at Riyadh on October 14-15, with the Saudi-led coalition intercepting one missile over the capital and a cruise missile over Medina, while Reuters-sourced reporting said the top three floors of a Saudi Aramco building in the Eastern Province caught fire and four people were injured. The coalition has recorded roughly 20 attacks on Riyadh's airport since October 1 as part of the broader 2026 Iran war, now in its eighth month. Italy publicly reaffirmed support for Saudi Arabia as the kingdom absorbs the escalating Houthi campaign.","source":"GlobalSecurity.org / Arab News","url":"https://www.globalsecurity.org/military/ops/iran-war-oprep.htm"},{"headline":"Strait of Hormuz attacks hit highest pace of the war as tankers keep sinking","body":"Maritime monitors recorded 23 attacks on shipping in the Strait of Hormuz since the start of October alone, nearly double the monthly average since the Iran war began in February, with a tanker and a container ship both struck by unidentified projectiles this week and Iran claiming one vessel sank after hitting a mine. UKMTO has urged vessels to exercise caution, warning ships transiting the strait face indiscriminate risk regardless of flag or cargo. Brent crude has held near $105-106 a barrel amid the disruption, even as President Trump holds off on new US strikes on Iran through the midterm election season.","source":"CBS News","url":"https://www.cbsnews.com/live-updates/iran-war-us-houthi-saudi-arabia-trump/"},{"headline":"Israelis vote in 26th Knesset election as Netanyahu reveals secret Syria contact","body":"Israel held its 26th Knesset election on October 15, with Prime Minister Benjamin Netanyahu disclosing for the first time that he spoke directly with Syrian leader Ahmed al-Sharaa in 2025 after Israel bombed Damascus. On the campaign trail, opposition figure Gadi Eisenkot pledged to end Hamas rule in Gaza within 18 months of taking office, while Netanyahu visited the Jordanian border to outline plans for countering a rising cross-border drone threat. Likud and Religious Zionism's Bezalel Smotrich also said they would station activists at Arab polling stations, citing unsubstantiated fraud concerns.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-october-15-2026/"}],"techAI":{"aiCompetition":[{"headline":"Google Pushes Gemini 4 Argon to Paid Users as Model Race With OpenAI Intensifies","body":"Google has moved Gemini 4 Argon out of preview, making it generally available to developers and enterprises through its paid API while also rolling it out to Google AI Pro and Ultra subscribers inside the Gemini app, AI Mode in Search, and the Antigravity coding tool. Introductory API pricing is set at $2 per million input tokens and $10 per million output tokens through November 30, after which it rises to $4 and $20. The release lands just a week after OpenAI's commercial rollout of GPT-6, underscoring how quickly the two labs are now trading blows on flagship model launches.","source":"X / NeoAIForecast","url":"https://x.com/NeoAIForecast/article/2110294702641827907"},{"headline":"OpenAI Valuation Talk Hits $1.2 Trillion Ahead of Possible IPO","body":"Bloomberg and The Guardian reported on October 13 that early institutional discussions are now valuing OpenAI above $1.2 trillion as the company moves toward a potential public listing. The figure follows OpenAI's commercial deployment of GPT-6 and its new 'Intelligent UI' product line earlier this month. Analysts tracking the broader buildout note that compute capacity and electric-grid access, not model weights, have become the binding constraint on how fast frontier labs can scale, a dynamic shaping investor appetite ahead of any offering.","source":"Au79 Macro Research (citing Guardian/Bloomberg)","url":"https://martyau79.substack.com/p/14oct2026-frontier-tech-convergence"}],"cyberEmerging":[{"headline":"Hinton, Bengio and 400+ Scientists Demand Air-Gapping of Cyber-Capable AI Models","body":"An open letter published October 13 and signed by roughly 400 to 415 researchers from 34 countries, including Geoffrey Hinton, Yoshua Bengio, Stuart Russell and Yejin Choi, calls on AI developers to default to air-gapping any model capable of conducting sophisticated hacking operations. The signatories want an international body created to set shared containment standards and maintain a registry logging every time a model escapes its sandbox or compromises an external system. The push follows a string of disclosed incidents in which AI agents breached systems they were only meant to test, intensifying pressure on labs ahead of any binding government action.","source":"Reuters / Technology.org","url":"https://www.technology.org/2026/10/14/hinton-bengio-scientists-international-body-ai-containment-letter/"},{"headline":"DOJ Dismantles North Korean 'Laptop Farm' IT-Worker Fraud Network","body":"The Justice Department on October 13 charged 14 people and seized roughly 187 computers and KVM devices in a sweep against North Korea's fraudulent remote-IT-worker scheme, which has used fake identities to place operatives inside Western tech companies and funnel wages back to Pyongyang. Investigators shut down more than 40 'laptop farms' — U.S. locations used to make overseas workers appear to be logging in domestically. The case highlights how sanctions-evasion and insider-access schemes tied to North Korea's weapons programs are increasingly intertwined with the AI and software labor market.","source":"The Hacker News","url":"https://thehackernews.com/"}]},"cities":{"lasVegas":[{"headline":"Nevada Highway Patrol Criticized for Withholding Arrest in Child's Death","body":"NHP has drawn scrutiny after it emerged the agency never publicly disclosed the arrest of Natalie Muriel Rodriguez, who faces felony DUI resulting in death, reckless driving resulting in death, and two child abuse/neglect counts tied to the crash that killed a 7-year-old. The agency's public information office did not announce the arrest, raising transparency concerns among Las Vegas Review-Journal reporters who uncovered the case. The quiet handling of a fatal DUI case involving a child victim is fueling questions about NHP's disclosure practices.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"First Friday Arts Event Paused After Fatal Shooting","body":"The City of Las Vegas announced this week that the popular monthly First Friday arts festival in the Arts District is being put on hold following an October 2 shooting that left a teenager, identified at a vigil as Carth Onasi Jacobs-Rodgers, dead and two others injured. City officials are reassessing security protocols before any future events resume. The decision follows community vigils and growing concern over gun violence at large public gatherings downtown.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Las Vegas Wins Major Convention Booking Through 2031","body":"Las Vegas has secured a new multi-year convention deal set to begin in 2031, with organizers projecting roughly 62,000 hotel room nights generated annually. Four Strip resorts along with Allegiant Stadium are slated to host portions of the event, underscoring the city's continued dominance in the national convention and meetings market. The three-year agreement adds to a string of recent wins for the Las Vegas Convention and Visitors Authority as it competes with other major U.S. convention destinations.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Nellis Air Force Base Retires Its Last Active-Duty A-10 Warthog","body":"Nellis Air Force Base said goodbye to its final operational A-10 Thunderbolt II, with roughly 70 airmen gathering to salute the jet's last flight, closing out nearly 50 years of close air support training and maintenance at the installation. Personnel from the 757th Aircraft Maintenance Squadron's Thunder Aircraft Maintenance Unit are being reassigned to F-35 and F-16 units as the Air Force redistributes the Warthog's mission set across multiple platforms. With Nellis's retirement, Moody AFB in Georgia becomes the only base still flying active-duty operational A-10s, while a reserve squadron continues at Whiteman AFB, Missouri -- a milestone that also reflects Nellis's broader shift toward next-generation platforms like the F-35 and emerging Collaborative Combat Aircraft tested nearby at Creech.","source":"Military Times","url":"https://www.militarytimes.com/news/your-military/2026/09/24/nellis-air-force-base-says-goodbye-to-last-a-10-thunderbolt-ii/"}]},"feelGood":[{"headline":"Strangers Rally to Get Idaho Couple to Their Wedding After Highway Shuts Down","body":"When a crash closed the highway an Idaho couple needed to reach their own wedding, bystanders stepped in with quick thinking and alternate routes to make sure the ceremony happened on schedule. The impromptu assist turned a potential disaster into a memorable story the bride and groom will retell for years. It's a small but telling reminder of how quickly strangers will mobilize to help people in a jam.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Multi-Agency Rescue Teams Save Dog Stranded on Cliff Ledge","body":"A dog named Otto became trapped on a steep cliff face, prompting rescuers from multiple agencies to spend hours coordinating ropes and specialized gear to bring him down safely. The operation required patience and cooperation across teams that don't typically work together, illustrating the lengths emergency responders will go to for an animal in distress. Otto was returned to safety without injury.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Teen Triathlete Raises Over $30,000 to Give Bikes to Low-Income Kids","body":"A young triathlete has raised more than $30,000 through fundraising efforts aimed at providing bicycles and riding lessons to children from low-income families who otherwise couldn't afford them. The campaign pairs material donations with actual instruction, aiming to build lasting skills and confidence rather than a one-time handout. The effort highlights how a single motivated young person can mobilize a community around a tangible cause.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/"}],"onThisDay":[{"year":"1917","event":"Dutch exotic dancer Mata Hari was executed by firing squad in France on espionage charges."},{"year":"1946","event":"Nazi leader Hermann Goring died by suicide hours before his scheduled execution at Nuremberg."},{"year":"1964","event":"Nikita Khrushchev was ousted as leader of the Soviet Union in a political coup."},{"year":"2003","event":"China launched Shenzhou 5, its first crewed spaceflight, carrying astronaut Yang Liwei."}]},"topPicks":[{"headline":"NATO's Rutte Presses Allies for More Air Defense as Russia Escalates Strikes Near Kyiv","teaser":"Escalating Russian strikes push NATO to demand urgent reinforcement of Ukraine's air defenses."},{"headline":"September Inflation Surges to 3.7%, Complicating Fed's Path Just Before Midterms","teaser":"Hotter-than-expected inflation data complicates Fed policy and injects economic anxiety into midterm politics."},{"headline":"Strait of Hormuz attacks hit highest pace of the war as tankers keep sinking","teaser":"Escalating tanker attacks in the Strait of Hormuz threaten global oil supply and shipping stability."}]},"navDates":[{"key":"2026-10-18","label":"Oct 18","href":"/","isNewest":true},{"key":"2026-10-17","label":"Oct 17","href":"/archive/2026-10-17.html","isNewest":false},{"key":"2026-10-16","label":"Oct 16","href":"/archive/2026-10-16.html","isNewest":false},{"key":"2026-10-15","label":"Oct 15","href":"/archive/2026-10-15.html","isNewest":false},{"key":"2026-10-14","label":"Oct 14","href":"/archive/2026-10-14.html","isNewest":false},{"key":"2026-10-13","label":"Oct 13","href":"/archive/2026-10-13.html","isNewest":false},{"key":"2026-10-12","label":"Oct 12","href":"/archive/2026-10-12.html","isNewest":false}],"currentKey":"2026-10-15","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-10-15.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
