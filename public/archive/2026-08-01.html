<script>
const STATE = {"digest":{"date":"Saturday, August 1, 2026","generatedAt":"Sat, Aug 1, 5:59 PM PDT","breaking":{"headline":"Iran-linked hackers blamed for coordinated strike on 30+ Minnesota water utilities as Trump-Walz feud erupts","body":"U.S. intelligence agencies have concluded that Iran was likely behind a coordinated cyberattack that hit operational technology at more than 30 municipal water systems across Minnesota on July 26-27, with cities including Plymouth, South St. Paul, Maple Plain and Braham confirming disruptions to remotely-managed equipment. Security researchers have pointed to the Iran-linked group CyberAv3ngers, noting CISA had warned just days earlier, on July 22, that Iranian actors were targeting industrial control systems tied to water and energy infrastructure. The episode escalated into a political brawl on July 31 when President Trump blamed Minnesota Governor Tim Walz for the intrusion without evidence, and Walz fired back that the administration lacks a strategy for winning its ongoing war with Iran. No water supply has been reported compromised, but the incident underscores how the months-long Iran conflict and Strait of Hormuz crisis are now spilling into direct attacks on U.S. domestic infrastructure.","source":"Washington Post / NBC News","url":"https://www.washingtonpost.com/national-security/2026/07/30/us-spy-agencies-suspect-iran-launched-cyberattack-minnesota-water-facilities/"},"tabs":{"defense":[{"headline":"Army locks in $53.9 billion, seven-year Patriot missile deal with Lockheed","body":"The U.S. Army converted a one-year undefinitized contract into a $53.86 billion, seven-year multiyear procurement with Lockheed Martin for PAC-3 Missile Segment Enhancement interceptors, the Pentagon announced July 30. The deal covers hardware, equipment and manufacturing for the hit-to-kill missiles used against ballistic and cruise missile threats by the U.S. and allied militaries. Defense officials say the long-horizon contract is meant to stabilize the industrial supply chain after years of surge demand driven by Ukraine, the Middle East and Indo-Pacific stockpiling needs.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/u-s-army-awards-lockheed-martin-massive-53-9b-pac-3-mse-missile-production-contract"},{"headline":"Russia launches Yasen-M submarine Ulyanovsk for Arctic patrols","body":"Russia rolled out its newest Yasen-M-class nuclear-powered submarine, named Ulyanovsk, on July 31 as part of Moscow's continued push to expand undersea capability aimed at Arctic and North Atlantic patrols. The Yasen-M class is designed to carry cruise missiles and torpedoes and is considered among the quietest and most capable in the Russian fleet. The launch comes as NATO navies increase surveillance of Russian submarine activity near undersea cables and Arctic shipping lanes.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026"},{"headline":"Shield AI extends autonomy software to Taiwan's SeaShark uncrewed naval fleet","body":"Shield AI announced on July 31 that it is integrating its collective-autonomy software into Taiwan's SeaShark unmanned surface vessel program, aimed at bolstering asymmetric deterrence against a potential Chinese blockade or invasion. The move fits Taipei's broader 'porcupine' strategy of fielding large numbers of cheap, autonomous systems to complicate PLA cross-strait operations. It also signals deepening U.S. defense-tech industry involvement in Taiwan's indigenous naval modernization ahead of expected increases in Taiwanese defense spending.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026"},{"headline":"U.S. deploys Anduril counter-drone systems to bolster homeland air defense","body":"The Pentagon has begun fielding Anduril Industries' counter-drone systems domestically as part of an effort to strengthen homeland defense against small unmanned aerial threats, according to reporting July 31. The deployment follows a string of incidents involving unidentified drones near sensitive U.S. installations over the past year and reflects growing concern that adversaries or criminal actors could exploit gaps in low-altitude airspace monitoring. It also underscores the Pentagon's increasing reliance on venture-backed defense-tech firms rather than traditional primes for rapid counter-UAS fielding.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026"},{"headline":"More than 20,000 Cambodians remain displaced after border clashes with Thailand","body":"A United Nations expert reported July 31 that over 20,000 Cambodians are still displaced following armed clashes along the Thailand-Cambodia border, highlighting unresolved fallout from the confrontation between the two Southeast Asian militaries. The prolonged displacement points to lingering instability in a border dispute that had drawn regional mediation efforts earlier this year. The situation adds another flashpoint for ASEAN cohesion at a time when the bloc is already strained by South China Sea disputes and great-power competition for influence in Southeast Asia.","source":"The Defense Post","url":"https://thedefensepost.com/latest/"}],"us":[{"headline":"July jobs report shows sharp labor-market slowdown, sealing case for Fed rate cuts","body":"The Bureau of Labor Statistics reported nonfarm payrolls rose just 73,000 in July, well below the roughly 100,000 consensus forecast, while the prior two months were revised down by a combined 258,000 jobs. The unemployment rate ticked up to 4.2% even as labor-force participation fell for a third straight month, and job growth outside health care was essentially flat. Economists now see the three-month average pace of hiring collapsing to around 35,000 once revisions are included, reinforcing expectations the Federal Reserve will keep cutting rates through the fall.","source":"FXStreet / Wells Fargo Economics","url":"https://www.fxstreet.com/analysis/july-and-the-no-good-very-bad-jobs-report-202508011351"},{"headline":"Todd Blanche's attorney general nomination stalls again amid GOP revolt over 'anti-weaponization' fund","body":"Senate Judiciary Chairman Chuck Grassley postponed a planned committee vote on Acting AG Todd Blanche's confirmation after Republicans Sen. John Cornyn of Texas and Sen. Thom Tillis of North Carolina withheld support, demanding written DOJ assurances that Trump's proposed $1.8 billion fund for people who say they were 'weaponized' against will not be revived. The panel has now rescheduled a markup for Tuesday, but with the Senate about to leave for its August recess, the delay marks a rare and embarrassing setback for a Trump nominee from within his own party. Cornyn, who recently lost his Texas primary to Ken Paxton, has accused DOJ of 'stonewalling.'","source":"The Hill / NPR","url":"https://thehill.com/homenews/senate/5998411-blanche-attorney-general-nomination-cornyn-tillis/"},{"headline":"Republican governors break with Trump over push to 'nationalize' elections ahead of midterms","body":"Oklahoma Governor Kevin Stitt told the Associated Press in an interview published Friday that election administration is a state matter, saying he opposes federalizing elections even as Trump pressures states to restrict mail-in voting. Vermont's Republican Governor Phil Scott separately rejected Trump's nationalization push, invoking the 10th Amendment and stating elections are a state prerogative. The dispute comes as Trump has appealed a related case to the Supreme Court seeking to impose an executive order on voting procedures as soon as August, in time for the midterms.","source":"The New Republic / NBC News","url":"https://www.nbcnews.com/politics/politics-news/vermont-governor-phil-scott-defends-state-run-elections-mail-voting-rcna590205"},{"headline":"Federal legal-aid contract lapse leaves tens of thousands of migrant children without counsel","body":"A federal contract that funded court-appointed legal representation for unaccompanied immigrant minors has expired, leaving an estimated 25,000 to 26,000 children without legal aid as their immigration hearings continue. The lapse strips a key due-process safeguard for some of the most vulnerable respondents in immigration court just as the Trump administration accelerates deportation proceedings nationwide. Advocacy groups warn the gap will lead to more default removal orders against children who cannot navigate the system alone.","source":"Morning News Update / Mike Simpson","url":"https://ru4people.substack.com/p/morning-news-update-august-1-2026"}],"pacific":[{"headline":"China stages naval drills near Scarborough Shoal as Philippine standoff sharpens","body":"Chinese forces conducted military drills near the contested Scarborough Shoal on Saturday, the latest flare-up in a dispute that has already produced three clashes with Philippine vessels in a single week in July 2026 near Scarborough and Second Thomas Shoal. The drills come even as Manila and Beijing continue working-level talks on a coast guard memorandum of understanding, underscoring how sea-level friction is outpacing diplomatic progress toward a long-sought Code of Conduct. The Philippines, which holds the ASEAN chair this year, had hoped to lock in a Code of Conduct text by year's end, but daily incidents keep undercutting that timeline.","source":"Washington Post / CFR Global Conflict Tracker","url":"https://www.washingtonpost.com/world/2026/08/01/china-military-drills-scarborough-shoal-philippines/ba32b214-8da8-11f1-8912-d71e69d679d7_story.html"},{"headline":"Pyongyang blasts US Forces Japan as a 'war command' after Tokyo's first live Tomahawk test","body":"North Korean state media accused Washington on Friday of turning U.S. Forces Japan into what it called a de facto war-fighting headquarters, days after Japan announced it had successfully carried out its first live-fire test of a Tomahawk cruise missile capable of reaching North Korean territory. The KCNA commentary frames the expanded USFJ posture and Japan's new long-range strike capability as evidence of a coordinated push toward a regional conflict footing. The exchange adds to a string of North Korean ballistic missile tests earlier this year and comes amid stalled prospects for any Pyongyang-Tokyo summit that Kim Yo Jong has repeatedly dismissed.","source":"NK News","url":"https://www.nknews.org/2026/07/north-korea-slams-us-forces-japan-expansion-as-tokyo-tests-tomahawk-missile/"},{"headline":"Japan's new intelligence bureau launch draws sharp Chinese rebuke","body":"Tokyo's July 31 launch of a new intelligence bureau prompted Beijing to warn of a 'negative security shift' and caution Japan against remilitarization, according to Chinese state media commentary. The move lands amid already-strained ties that trace back to Prime Minister Sanae Takaichi's November remarks on Taiwan, which triggered a Chinese fighter jet radar-lock incident against a Japanese F-15 near Okinawa. Beijing's foreign ministry is pressing Tokyo to 'act prudently,' framing the new bureau as part of a broader pattern of Japanese security assertiveness it views as directed against Chinese interests.","source":"Global Times / NewsNow aggregation","url":"https://www.newsnow.com/us/World/Asia/China/Japan~China"},{"headline":"Taiwan's Han Kuang 42 drills to rehearse full-scale invasion defense starting August 5","body":"Taiwan's Ministry of National Defense confirmed its 42nd annual Han Kuang exercise will run for ten days and nine nights from August 5 to 14, integrating with the Tongxin No. 36 mobilization drill and the full mobilization of two brigade-level units. The unscripted exercise assumes the PLA masks invasion preparations behind a large-scale drill, testing Taiwan's ability to shift from peacetime to a war footing across four phases: combat-readiness deployment, force protection, counter-landing operations, and protracted defense. Planners have also folded in scenarios around defending the newly opened Danjiang Bridge and blocking the Tamsui River estuary, a route considered key to any assault on Taipei.","source":"Taipei Times / Janes","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/07/30/2003861658"},{"headline":"Japan protests suspected Chinese structure in East China Sea, pushes to revive 2008 gas pact","body":"Tokyo lodged a formal protest with Beijing over an alleged Chinese structure detected in the East China Sea and is urging China to revive a shelved 2008 agreement on joint resource development in the area. The protest, reported July 31, adds another flashpoint to a relationship already strained by disputes over the Senkaku/Diaoyu Islands and Taiwan policy, even as the two economies maintain over $370 billion in annual trade. Japanese officials say they continue to seek diplomatic dialogue while simultaneously deepening security cooperation with the U.S. and other Indo-Pacific partners that Beijing views with suspicion.","source":"Anadolu Agency / NewsNow","url":"https://www.newsnow.com/us/World/Asia/China/Japan~China"}],"europe":[{"headline":"Russia batters Kyiv with ballistic missiles as Ukraine runs out of Patriot interceptors","body":"Russia launched its second major strike on Ukraine in 48 hours early Saturday, killing at least nine people and wounding 33 in Kyiv with a combined ballistic missile and drone barrage. President Zelensky said the overnight assault involved 27 ballistic missiles, of which only one was intercepted because Ukraine has run out of interceptors for its US-made Patriot air-defense batteries. The strike underscores Kyiv's growing vulnerability to Russia's ballistic missile campaign as Western resupply of Patriot munitions lags.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/8/1/russian-missile-attack-kills-three-in-ukraines-kyiv"},{"headline":"Russian forces breach outer defenses near Dobropolye as frontline attrition mounts","body":"Russian units claim to have broken through the outer defensive line south of Dobropolye in Donetsk Oblast, a development that could force Ukraine to reallocate scarce manpower along that stretch of front in coming weeks. Ukraine's General Staff recorded 243 combat clashes over a single 24-hour period, reflecting grinding, high-intensity fighting that is straining reserves on both sides. Drone strikes were also reported against shipping near Odesa and Chornomorsk, threatening maritime logistics even as Ukraine claimed to have sunk a Russian container ship.","source":"Planet Today / BBC","url":"https://www.planet-today.com/2026/08/russian-forces-push-toward-dobropolye.html"},{"headline":"Zelensky says Ukraine has lost 50,000 troops as commander survives assassination attempt","body":"In a Fox News interview, President Zelensky said Ukraine has lost roughly 50,000 soldiers killed and 400,000 wounded since the full-scale invasion began, a figure that is actually lower than the 55,000 dead he cited back in February, drawing scrutiny over Kyiv's casualty accounting. Separately, Zelensky said Khartiia brigade commander Obolienskyi was targeted in an assassination attempt, vowing Ukraine would respond to the strike against its own commander. The disclosures come as Ukraine pushes Washington for expanded Patriot missile production licenses, a request the Financial Times reports Trump remains uncertain about granting.","source":"Ukrainska Pravda / Kyiv Independent","url":"https://www.pravda.com.ua/eng/news/2026/07/31/8046685/"},{"headline":"NATO weighs expanding US nuclear deterrent in Europe amid Russia threat concerns","body":"German news agency DPA reports that NATO is drawing up plans to bolster nuclear deterrence in Europe, including a possible deployment of additional American nuclear weapons, with Poland, Finland and Lithuania named as potential host countries. The move would come atop reports that the US has already stationed B61-12 gravity bombs at RAF Lakenheath in the UK. The planning reflects deepening alliance anxiety over Moscow's long-term intentions even as Washington simultaneously scales back conventional troop rotations and equipment commitments to the European theater.","source":"DPA via Pravda Poland","url":"https://poland.news-pravda.com/en/world/2026/07/31/64984.html"}],"middleEast":[{"headline":"Trump signals imminent new strikes on Iran, possibly targeting Pickaxe Mountain nuclear site","body":"US officials say the Pentagon has prepared a fresh round of strikes on Iranian nuclear infrastructure, potentially including the fortified Pickaxe Mountain complex near Natanz, which could come as soon as this weekend. Trump said Friday 'we'll be hitting them very hard,' while the State Department issued a new travel warning urging Americans to consider leaving the Middle East given the 'fluid' security situation. Tehran has threatened countries hosting US bases, and Kuwaiti authorities reported Iranian drone attacks early Saturday, while Saudi Crown Prince Mohammed bin Salman has reportedly urged Trump to abandon plans for a major escalation.","source":"CNN","url":"https://www.cnn.com/2026/08/01/world/live-news/iran-war-trump"},{"headline":"Gaza ceasefire push falters as Israeli strikes continue despite Hamas draft deal","body":"The Board of Peace released the full text of a roadmap Friday for implementing Trump's comprehensive Gaza peace plan, after Hamas reportedly agreed to a far-reaching disarmament proposal in the hostage-deal negotiations. Yet Israeli strikes across Gaza killed at least two Palestinians hours after the agreement was announced, and a strike left a large crater at a hospital in the enclave less than 48 hours after Trump's announced breakthrough. Netanyahu faces domestic political turmoil over the disarmament plan, which is tied to a potential Israeli withdrawal from Gaza.","source":"Al Jazeera / CNN","url":"https://www.aljazeera.com/middle-east/"},{"headline":"Drone strike hits Egyptian port of Damietta, opening a new front in the Iran conflict","body":"Egyptian officials confirmed a drone strike hit gas vessels at the Mediterranean port of Damietta, marking Cairo's first public acknowledgment of being drawn into the wider US-Israel-Iran conflict. Analysts say the attack, described by maritime intelligence firm Windward as a 'third front' separate from the Gulf and Red Sea theaters, may curb Egypt's LNG import flexibility even as the government insists port operations remain normal. Iranian state television had named Damietta as a retaliation target days earlier, citing a Ukrainian strike on an Iranian vessel in the Caspian Sea.","source":"Jerusalem Post / TWZ","url":"https://www.jpost.com/middle-east/article-904238"}],"techAI":{"aiCompetition":[{"headline":"Claude Opus 5 Cements Anthropic's Lead as Political Spending Surges","body":"Anthropic's flagship Claude Opus 5, released July 24, now tops the Artificial Analysis Intelligence Index at 61 and the Agentic Index at 55.3, and as of the August 1 leaderboard cutoff still holds the number-one spot on Arena's WebDev rankings. The model is priced at roughly half the cost of Anthropic's own Claude Fable 5. Separately, Anthropic's Q2 Washington lobbying spend hit $1.97 million, up 26% quarter-over-quarter and now outpacing Nvidia, underscoring how aggressively labs are now competing in the policy arena as well as the model arena.","source":"AI Weekly / felloai","url":"https://aiweekly.co/ai-news-today/anthropic-news"},{"headline":"Meta Turns Its AI Assistant Into an Autonomous Agent","body":"Meta began rolling out agentic upgrades to Meta AI on August 1, powered by a new model called Muse Spark 1.1, letting the assistant plan multi-step tasks such as scouting Marketplace listings for a home renovation or assembling slide decks without repeated prompting. The assistant can now plug into a user's email and calendar to run daily briefings and flag scheduling conflicts. The rollout starts today in select markets, with WhatsApp integration expected to follow shortly.","source":"The AI Marketers","url":"https://www.theaimarketers.ai/news-08-01-26/"},{"headline":"Nvidia's Next-Gen Chip Platform Shows Major Efficiency Gains in First Customer Tests","body":"CoreWeave has published the first customer benchmark results for Nvidia's Vera Rubin NVL72 platform, claiming up to ten times more DeepSeek-R1 tokens processed per megawatt compared with the current GB200 generation at similar responsiveness. The figures land as compute efficiency, not just raw model capability, becomes a central battleground among hyperscalers and chipmakers racing to control the cost curve of frontier AI deployment.","source":"ThursdAI","url":"https://thursdai.news/releases/2026-07"}],"cyberEmerging":[{"headline":"Trump Blames Iran for Minnesota Water-System Hacks as CISA Sounds Alarm","body":"President Trump publicly attributed a wave of cyberattacks against more than 30 Minnesota water treatment systems to Iran, a claim that drew immediate pushback from Governor Tim Walz's administration even as the investigation continues. CISA has since urged water and wastewater utilities nationwide to lock down internet-exposed control systems in the wake of the intrusions. The episode is the latest sign that Iran-linked actors have shifted from espionage toward disruptive attacks on U.S. critical infrastructure since the 2026 Iran conflict.","source":"SecurityWeek / Substack roundup","url":"https://www.securityweek.com/"},{"headline":"Trump's Frontier-AI Cybersecurity Order Hits Its First Deadlines","body":"Key deadlines under President Trump's June 2 executive order on AI cybersecurity and frontier models arrive today, August 1: federal agencies must stand up a voluntary framework allowing frontier-model developers to coordinate with the government before public release, and the Office of Personnel Management must expand hiring pathways for U.S. Tech Force cybersecurity specialists. The order also directs the Attorney General to prioritize prosecution of AI-enabled computer intrusion and fraud under existing statutes like the Computer Fraud and Abuse Act, formalizing Washington's light-touch but security-focused approach to frontier AI just as the EU's AI Act enforcement powers activate this month.","source":"Latham & Watkins / Wiley","url":"https://www.lw.com/en/insights/president-trump-signs-executive-order-establishing-ai-cybersecurity-and-frontier-model-framework"}]},"cities":[{"headline":"Metro Investigates Homicide on Haystack Drive","body":"Las Vegas Metropolitan Police are investigating a homicide reported Saturday in the 5000 block of Haystack Drive in the east valley. Police released few details in the initial statement as detectives continue processing the scene and canvassing for witnesses. It marks the latest violent crime probe for Metro heading into the first weekend of August.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Extreme Heat Warning Blankets Southern Nevada","body":"An extreme heat warning is in effect across the Las Vegas valley through 8 p.m. Saturday as the region kicks off August with triple-digit temperatures. The National Weather Service advisory raises the risk of heat-related illness for residents and visitors, prompting renewed reminders about hydration and cooling-center availability. The warning comes as the city's tourism corridor stays busy with Strip shows and outdoor events despite the heat.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Nevada Wastewater Shows High Meth, Fentanyl Levels","body":"A new report found wastewater in Nevada's two most populous counties, Clark and Washoe, contained some of the highest meth concentrations measured anywhere in the country. The data, drawn from sewage sampling used to track community-wide drug use trends, underscores the persistence of methamphetamine and fentanyl in Southern Nevada despite years of law enforcement crackdowns. Public health officials are expected to use the findings to target treatment and harm-reduction resources.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/"}],"feelGood":[{"headline":"9-Year-Old Hands Dad His Life Savings After Lightning Destroys Truck","body":"After a lightning strike reduced his truck to ashes on a Utah highway, Casey Pettus walked away physically unharmed but shaken by the loss. Later that day, his 9-year-old son quietly handed over his entire life savings to help his father recover, turning a terrifying moment into a story of quiet generosity within his own family. The gesture has since been shared widely as an example of a child's instinct to give everything he had to help a parent in need.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Teen Lifeguard's Daring Santa Cruz Rescue Saves 10-Year-Old","body":"A young lifeguard in Santa Cruz pulled off a dramatic ocean rescue of a 10-year-old boy caught in dangerous surf, arriving just in time to prevent a tragedy. The boy's father later said his son 'assumed he was going to die' before the teenage rescuer reached him, underscoring how close the incident came to a very different outcome. The family has publicly credited the lifeguard's quick action and training with saving the child's life.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"US Military Continues Earthquake Relief Push in Venezuela","body":"US forces have kept up a large humanitarian response in Venezuela following back-to-back magnitude 7.2 and 7.5 earthquakes, with the Marine Corps delivering the last of ten Medium Tactical Vehicle Replacements to help move aid and survivors. The USS Fort Lauderdale remains stationed at the Port of La Guaira supporting communications and acting as a distribution hub for supplies. The broader US effort includes a Disaster Assistance Response Team of more than 250 personnel, including three specialized urban search-and-rescue units, as part of a $150 million relief commitment.","source":"Fox News","url":"https://www.foxnews.com/us/us-military-deploys-mtvrs-airlifts-aid-venezuela-following-deadly-earthquakes"}],"onThisDay":[{"year":"1834","event":"The Slavery Abolition Act took effect across the British Empire, freeing enslaved people in most British colonies."},{"year":"1914","event":"Germany declared war on Russia, escalating the crisis that plunged Europe into the First World War."},{"year":"1944","event":"The Warsaw Uprising began as Polish resistance fighters rose against Nazi German occupation."},{"year":"1981","event":"MTV launched in the United States, transforming music promotion and youth culture."}]},"topPicks":[{"headline":"Iran-linked hackers blamed for coordinated strike on 30+ Minnesota water utilities as Trump-Walz feud erupts","teaser":"A sweeping cyberattack on critical water infrastructure ignites a fierce political clash between Trump and Walz."},{"headline":"Trump signals imminent new strikes on Iran, possibly targeting Pickaxe Mountain nuclear site","teaser":"Fresh US military action against Iran could be days away, targeting a key nuclear facility and reshaping the region."},{"headline":"Russia batters Kyiv with ballistic missiles as Ukraine runs out of Patriot interceptors","teaser":"Kyiv faces a deadly missile barrage just as its air defenses run dangerously low on interceptors."}]},"navDates":[{"key":"2026-08-02","label":"Aug 2","href":"/","isNewest":true},{"key":"2026-08-01","label":"Aug 1","href":"/archive/2026-08-01.html","isNewest":false}],"currentKey":"2026-08-01","pageUrl":"https://YOUR-SITE.netlify.app/archive/2026-08-01.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
