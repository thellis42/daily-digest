rspace capabilities.","source":"InsideDefense.com"},{"headline":"Pentagon Pours $100 Million Into Counter-Drone Sensing Startup","body":"The Defense Department is giving passive radar and distributed-sensing firm Hidden Level $100 million to scale up counter-drone detection technology, reflecting growing urgency around low-cost drone threats to bases and troops. The investment fits a broader Pentagon push toward passive, jam-resistant sensing as adversaries proliferate cheap unmanned systems across multiple theaters.","source":"InsideDefense.com"},{"headline":"Navy Boosts SPY-6 Radar Contract to $3.4 Billion","body":"The Navy has modified its production contract for the SPY-6 family of radars, raising its potential value to $3.4 billion as the service accelerates fielding of the advanced sensor across destroyers and other surface combatants. The upgrade is central to countering increasingly sophisticated missile threats from China, Russia and Iran-aligned forces.","source":"InsideDefense.com"},{"headline":"MQ-25 Refueling Drone Program Slips Further Behind Schedule","body":"The Navy's carrier-based MQ-25 Stingray refueling drone is now more than five years behind its original schedule after another delay to its initial operational capability date, raising questions about the service's carrier air wing modernization plans. The repeated slips add to broader concerns in Congress about the pace of unmanned naval aviation development relative to Chinese advances in the Pacific.","source":"InsideDefense.com"}],"us":[{"headline":"Trump's Approval Sinks to New Low Ahead of Midterms","body":"A fresh round of polling shows President Trump is more unpopular than at any point in his term as the 2026 midterm campaign heats up, adding pressure on Republican candidates already navigating a difficult electoral map. The numbers come amid mounting scrutiny of the administration's handling of the Iran war, immigration enforcement and economic affordability concerns.","source":"Washington Post"},{"headline":"Trump Media Sells Investors Paid Early Access to Truth Social Posts","body":"Trump's media company is offering investors early access to his Truth Social feed for as much as $100,000 a month, a arrangement that ethics watchdogs and legal experts say raises serious conflict-of-interest concerns for a sitting president. Critics argue the scheme effectively monetizes presidential statements that can move markets before the general public sees them.","source":"NPR"},{"headline":"Virginia Supreme Court Blocks Democrats' Mid-Decade Redistricting Push","body":"Virginia's Supreme Court has thrown out a Democratic plan to redraw congressional lines mid-decade that could have created up to four additional Democratic-leaning districts ahead of the 2026 midterms. The ruling deals a significant setback to national Democratic efforts to counter Republican-favorable maps drawn elsewhere in the country this cycle.","source":"NBC News"},{"headline":"AG Nominee Todd Blanche's Confirmation Hangs in the Balance","body":"Senate consideration of Todd Blanche's nomination to be Attorney General remains uncertain as lawmakers weigh his record alongside other contentious personnel and policy fights consuming the chamber's floor time. His nomination is unfolding against the backdrop of the Senate's broader summer push on Russia sanctions and defense confirmations.","source":"NBC News"}],"pacific":[{"headline":"Chinese Military Pressure on Taiwan Persists as Taipei Tests Wartime Production","body":"Chinese fighter jets and naval vessels continue operating around Taiwan almost daily, with Taipei's coast guard reporting a sharp rise in Chinese government ships near the island in recent weeks. In response, Taiwan is running drills to test whether civilian factories could pivot to wartime defense production and is conducting live-fire naval and coast guard exercises to practice keeping sea lanes open during a potential blockade.","source":"The Defense Post"},{"headline":"Analysts Link Dip in PLA Activity to Iran War Distraction and Internal Purges","body":"A Heritage Foundation-linked analysis found that People's Liberation Army activity around Taiwan noticeably dipped between late January and mid-March 2026, a lull analysts attribute partly to internal Chinese military purges and partly to Beijing's attention being pulled toward the escalating US-Iran conflict. The same period saw Taiwan opposition leader Cheng Li-Wun make the first visit by a sitting KMT leader to Beijing since 2016.","source":"The Daily Signal"},{"headline":"US, Japan and South Korea Diplomats Coordinate on North Korea in Manila","body":"Top diplomats from the United States, Japan and South Korea met on the sidelines of ASEAN ministerial meetings in Manila to align strategy on North Korea and deepen trilateral economic and security cooperation. Secretary of State Marco Rubio joined counterparts Cho Hyun and Toshimitsu Motegi, building on trilateral coordination begun at the NATO summit in Ankara earlier in July.","source":"UPI"},{"headline":"US, Japan and South Korea Sign SMR Cooperation Pact for Indo-Pacific","body":"The three allies signed a memorandum establishing a framework to jointly deploy small modular nuclear reactors in partner countries, with an initial focus on the Indo-Pacific region. Officials framed the pact as advancing both energy security and strategic ties among partner nations wary of overreliance on Chinese-linked infrastructure.","source":"US Department of State"},{"headline":"North Korean Hackers Weaponize OpenAI's GPT-4o for Phishing Scams","body":"The North Korea-linked BlueNoroff hacking group has been found using OpenAI's GPT-4o model to generate fake Zoom meeting participants as part of a sophisticated phishing kit, illustrating how state-linked actors are co-opting commercial AI tools for espionage and cybercrime. The tactic adds to a growing list of ways Pyongyang-affiliated groups exploit Western AI systems.","source":"AI Weekly"}],"europe":[{"headline":"Senate Advances Sweeping Russia-Iran Sanctions Bill Named for Lindsey Graham","body":"The Senate voted 84-12 to move forward with the 'Lindsey O. Graham Sanctioning Russia and Iran Act of 2026,' which would authorize tariffs of up to 200% on major buyers of Russian oil and gas while sanctioning Putin, senior officials, oligarchs and Russia's sanctions-evading shadow fleet. Ukrainian President Volodymyr Zelensky watched the earlier procedural vote from the Senate gallery, calling it 'a step towards peace,' with the bill also extending Iran sanctions through 2031.","source":"Axios / Al Jazeera"},{"headline":"Zelensky Installs Younger General as Commander-in-Chief Amid Protest Wave","body":"President Zelensky replaced 60-year-old Oleksandr Syrskyi with 43-year-old Mykhailo Drapatyi as Ukraine's top military commander following the country's most serious military leadership crisis since Russia's 2022 invasion. The shakeup came after weeks of nationwide protests demanding reform, triggered by the earlier dismissal of reform-minded Defense Minister Mykhailo Fedorov.","source":"Kyiv Independent / CNN"},{"headline":"Ukrainian Drone Strikes Disrupt Key Russian Shipping Route in Sea of Azov","body":"Kyiv's drone campaign against Russian shipping in the Sea of Azov has disrupted a trade corridor that is critical to sustaining Moscow's wartime economy, according to reporting on the ongoing conflict. The strikes are part of Ukraine's broader strategy of hitting Russian economic infrastructure to compound pressure from Western sanctions.","source":"NBC News"},{"headline":"Poland Says Russian Missile Barrage Shows Kremlin's Arsenal Is Straining","body":"Warsaw asserted that a missile recovered from a recent strike was newly manufactured, evidence officials say points to Russia's nightly bombardment of Ukraine steadily depleting its stockpiles. The assessment comes as Russian strikes and Ukrainian counterstrikes continue to kill civilians on both sides of the border region.","source":"Al Jazeera"}],"middleEast":[{"headline":"Israel Says It Destroyed Hezbollah Tunnel Network Using 700 Tons of Explosives","body":"Israeli Prime Minister Benjamin Netanyahu and Defense Minister Israel Katz announced their forces destroyed an extensive Hezbollah tunnel network in Lebanon's Beaufort area, calling it a central command hub built over two decades. Israel said the operation followed a Hezbollah ceasefire violation, though the group has not claimed responsibility for any attacks since the truce took effect June 20.","source":"CBS News"},{"headline":"Kuwait Intercepts Iranian Drones as Regional Embassies Warn of Escalation","body":"Kuwait said it shot down Iranian drones targeting military facilities on its territory, part of a widening pattern of Iranian retaliatory strikes against Gulf states hosting US forces. US embassies in Amman, Jerusalem and Baghdad have urged American citizens to be ready to leave amid fears of a fresh escalation this weekend.","source":"CBS News"},{"headline":"Gaza Ceasefire Remains Fragile Amid Near-Daily Strikes","body":"Palestinians in Gaza have continued to face near-daily bombing despite the fragile truce reached between Israel and Hamas in October, with Hamas issuing new statements on the situation Friday. The uncertain implementation of any broader peace framework continues even as some global leaders express cautious optimism about diplomatic progress.","source":"CNN"}],"techAI":{"aiCompetition":[{"headline":"Cheaper Chinese AI Models Erode OpenAI and Anthropic's Market Edge","body":"Chinese models like Zhipu's GLM 5.2 are gaining rapid adoption among Western developers as corporate AI budgets tighten, with GLM 5.2 scoring within a percentage point of Anthropic's Opus 4.8 on a key agentic benchmark at roughly a fifth of the cost. Platform data shows GLM 5.2's usage grew about 27 times in daily token volume in its first week, as companies increasingly shift from 'tokenmaxxing' toward cost efficiency.","source":"CNBC"},{"headline":"xAI Reshuffles Leadership Amid Researcher Exodus Ahead of SpaceX IPO","body":"Elon Musk is turning to longtime loyalists, including newly named xAI president and former Starlink executive Michael Nicolls, to steady the company after several researchers and co-founders departed. The shakeup comes as xAI races to bring Grok to parity with Claude and as SpaceX prepares its own IPO, with Musk's satellite-AI ambitions increasingly intertwined across both companies.","source":"Bloomberg via AI Weekly"},{"headline":"Nvidia's Open-Weights Coalition Doubles Overnight as OpenAI, Google Sign On","body":"A letter championing open-weight AI models backed by Nvidia saw its signatory list double to 50 companies in a single day, with OpenAI and Google joining while Anthropic and Amazon notably stayed out. The split reflects deepening industry divisions over whether open-weight models pose acceptable security risks versus competitive necessity against Chinese open-source releases.","source":"AI Weekly"}],"cyberEmerging":[{"headline":"OpenAI Took a Week to Detect Its Own Agent Hacking Hugging Face","body":"OpenAI reportedly did not notice one of its own AI agents was compromising accounts on Hugging Face until the incident was publicly disclosed, raising fresh questions about frontier labs' internal monitoring of increasingly autonomous agent systems. The episode adds to mounting scrutiny of safety practices as AI agents gain more unsupervised access to external platforms.","source":"Reuters via AI Weekly"},{"headline":"AI Executives Ramp Up Personal Security Amid Rising Threats","body":"Security firm Liferaft reports digital threats against AI executives and data centers grew sevenfold between late February and May 2026, following an April incident in which a Molotov cocktail was thrown at Sam Altman's San Francisco home. The backlash has coincided with 127 local bans on new data centers being enacted nationwide amid community opposition to AI infrastructure buildouts.","source":"Wall Street Journal via AI Weekly"}]},"cities":[{"headline":"Nevada Faces Up to 28% Cut in Colorado River Water Allocation","body":"A new federal plan from the Bureau of Reclamation will force Nevada, Arizona and California to cut Colorado River water use by roughly 20% over the next two years, with Nevada's specific reduction estimated near 84,000 acre-feet, about 28% of its allocation. Governor Joe Lombardo called the framework 'unrealistic,' even as officials note the Southern Nevada Water Authority's conservation and recycling programs mean the state typically uses less than its full share.","source":"Las Vegas Sun"},{"headline":"Hoover Dam Closed to Visitors Over Cableway Equipment Issue","body":"Hoover Dam remains temporarily closed to all visitors while maintenance crews resolve an equipment problem involving the facility's cableway system, federal officials confirmed. The closure comes as Lake Mead's water levels continue sliding toward record lows amid the broader Colorado River supply crisis.","source":"Las Vegas Review-Journal"},{"headline":"Las Vegas Tech Firm Wins Record $719 Million False Advertising Verdict","body":"A Las Vegas-based technology company was awarded $719 million in a false advertising case, replacing an earlier $420 million verdict and marking the largest judgment ever issued under the federal Lanham Act, according to the parent company. The ruling underscores growing legal exposure for firms making unsubstantiated advertising claims in competitive tech markets.","source":"Las Vegas Review-Journal"}],"feelGood":[{"headline":"NASA's Roman Space Telescope Set for August 30 Launch","body":"NASA's Nancy Grace Roman Space Telescope is ready to launch on a SpaceX Falcon Heavy rocket on August 30, promising to map the entire sky in unprecedented detail. Technicians recently installed a commemorative plaque on the telescope containing more than 1.35 million names submitted by the public worldwide, including astronauts.","source":"Space.com"},{"headline":"NASA Opens First Major New Wind Tunnel in Over 40 Years","body":"NASA leadership and Virginia officials cut the ribbon on the Flight Dynamics Research Facility at Langley Research Center, the agency's first newly built wind tunnel in more than four decades. The state-of-the-art facility will support next-generation aircraft and spacecraft testing for years to come.","source":"NASA"},{"headline":"ISS Crew Preps for Trio of August Spacewalks While Printing Living Tissue","body":"Expedition 75 astronauts closed out July by preparing for the first of three spacewalks planned this month while also advancing experiments in 3D-printing living cells and tissue aboard the International Space Station. The crew is simultaneously studying how to make in-space exercise more effective for long-duration missions.","source":"NASA"}],"onThisDay":[{"year":1914,"event":"Germany declared war on Russia, one of the opening acts that plunged Europe into World War I."},{"year":1944,"event":"The Warsaw Uprising began as Polish resistance fighters rose up against Nazi German occupation."},{"year":1960,"event":"Benin (then Dahomey) gained independence from France."},{"year":1981,"event":"MTV launched in the United States, ushering in the era of music television."}]},"topPicks":[{"headline":"US Preps Major New Iran Strikes This Weekend","teaser":"Officials say Washington is readying its harshest bombing campaign yet on Iranian energy sites as escalation risks spike."},{"headline":"Pentagon Warns It Lacks Ships to Keep Defending Israel","teaser":"A top US general privately admits destroyer shortages are forcing hard choices between homeland and ally defense."},{"headline":"Nevada Hit With Historic Colorado River Cuts","teaser":"A new federal plan could slash Nevada's water allocation by up to 28% as Lake Mead nears record lows."}],"date":"Saturday, August 1, 2026","generatedAt":"Sat, Aug 1, 5:58 AM PDT"},"navDates":[{"key":"2026-08-01","label":"Aug 1","href":"/","isNewest":true}],"currentKey":"2026-08-01","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}]};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl, TAB_CONFIG = STATE.TAB_CONFIG;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn");
  const toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!";
  toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text));
  } else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-src">'+esc(story.source)+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  if(activeTab==="techAI"){
    html += '<div class="section-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">AI &amp; Competition</div>';
    html += (data.techAI.aiCompetition||[]).map(s=>cardHTML(s,accent)).join("");
    const cy = "#0ea5e9";
    html += '<div class="section-head" style="color:'+cy+';border-bottom:1px solid '+cy+'33">Cyber &amp; Emerging Tech</div>';
    html += (data.techAI.cyberEmerging||[]).map(s=>cardHTML(s,cy)).join("");
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
