<script>
const STATE = {"digest":{"date":"Sunday, November 15, 2026","generatedAt":"Sun, Nov 15, 8:20 AM PST","breaking":{"headline":"Trump, Xi and Putin to Hold First-Ever Three-Way Summit in Shenzhen","body":"The White House has confirmed that Donald Trump, Xi Jinping and Vladimir Putin will meet on November 19 on the sidelines of the APEC summit in Shenzhen, marking the first trilateral sit-down ever held among the three heads of state. U.S. officials say Trump wants to use the session to advance a nuclear-arms-reduction framework and to raise the ongoing Iran war, while deliberately steering clear of Russia's war in Ukraine, a choice that has already drawn objection from Kyiv, which insists it must be included in any talks affecting its future. Elon Musk will travel with Trump to China but will not sit in on the leaders' meeting, and no separate Trump-Putin bilateral is currently planned. Analysts have likened the gathering to the 1945 Yalta Conference given its potential to reshape great-power dynamics, though the Kremlin has pushed back on that comparison, noting any understandings reached cannot bind other nations.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/11/14/trump-xi-putin-trilateral-meeting-at-apec-what-to-expect"},"tabs":{"defense":{"defense":[{"headline":"Pentagon Signals Smaller Troop Reductions Across Europe","body":"Sources tell Bloomberg that the Trump administration's planned drawdown of roughly 80,000 U.S. troops stationed across Europe will be shallower than the 25,000-personnel cut many allied capitals had braced for. The softer approach reflects Washington's favorable view of rising NATO defense spending commitments, according to people familiar with the internal deliberations. The reversal offers European allies some reassurance amid broader anxiety over U.S. force posture on the continent.","source":"Bloomberg","url":"https://bloomberg.com/news/articles/2026-11-14/pentagon-eyes-smaller-troop-cuts-across-europe-in-reversal"},{"headline":"B-21 Raider Completes First Weapons Release Test","body":"Northrop Grumman's next-generation B-21 Raider stealth bomber has successfully demonstrated an in-flight weapons release for the first time, a milestone the Air Force and manufacturer are touting as a major step toward operational readiness. The test moves the low-observable bomber program closer to fielding a platform intended to replace the B-1 and B-2 fleets as the backbone of America's long-range strike capability. Further live-fire and integration testing is expected to follow as the program progresses toward initial operational capability.","source":"IDRW","url":"https://idrw.org/"},{"headline":"NATO Allies Strain Under Patriot Interceptor Shortage as Poland Pulls Back","body":"A severe shortage of Patriot air-defense interceptors is straining the alliance's support for Ukraine, with Poland suspending its contributions to U.S.-coordinated arms purchases for Kyiv on November 14 amid exhausted domestic defense budgets. Compounding the squeeze, the Pentagon has delayed issuing Ukraine a license to manufacture Patriot missiles on its own soil, even as Ukrainian commanders separately press Washington and SpaceX to lift speed restrictions on Starshield satellite connectivity over occupied territory. The friction underscores growing strain within the coalition supplying Kyiv as stockpiles across Europe run thin.","source":"Au79 Macro Research","url":"https://martyau79.substack.com/p/14nov2026-geopolitical-intelligence"}],"acquisitions":[{"headline":"Boeing's $14.7 Billion Patriot Seeker Deal Moves Into Production Ramp-Up","body":"Boeing has formalized a seven-year, roughly $14.7 billion undefinitized contract from Lockheed Martin to triple production of PAC-3 Missile Segment Enhancement seekers, the guidance components that let Patriot interceptors engage hypersonic, ballistic and cruise-missile threats. The deal, part of the Pentagon's broader push to sharply expand interceptor output amid the Patriot shortage straining allied stockpiles, has already triggered hiring and facility upgrades at Boeing's Huntsville, Alabama site. It sits alongside other recent multiyear awards, including a $58.6 billion Lockheed PAC-3 production contract and a $35.3 billion THAAD deal, as the Pentagon moves toward multiyear munitions buying.","source":"Inside Defense","url":"https://insidedefense.com/daily-news/boeing-lands-147b-pac-3-seeker-deal-support-production-ramp"},{"headline":"Lead Columbia-Class Submarine Claws Back Onto 2028 Delivery Schedule","body":"The Navy's first Columbia-class ballistic-missile submarine, USS District of Columbia (SSBN-826), is now tracking toward its 2028 delivery date after the shipbuilder more than doubled production work rates to overcome earlier delay risk. The program is central to recapitalizing the sea-based leg of the U.S. nuclear triad as the aging Ohio-class boomers near retirement. The progress comes as Navy officials simultaneously flag rapid expansion of Chinese and Russian submarine fleets, raising the stakes on keeping the Columbia program on schedule.","source":"Naval News","url":"https://www.navalnews.com/category/naval-news/"}]},"us":[{"headline":"Supreme Court to Decide Fate of Trump's Border Asylum Ban","body":"The Supreme Court agreed on November 13 to decide whether a president has authority to unilaterally suspend asylum access at the southern border, taking up a case that could reshape executive power over immigration enforcement. The justices left in place the current restrictions while the case proceeds, meaning the ban remains active during litigation. The case lands on the docket as the administration faces separate legal fights over border wall construction, after the Court separately allowed building to resume in Texas's Big Bend region while a lower-court dispute over environmental waivers continues.","source":"SCOTUSblog / Rio Times","url":"https://www.scotusblog.com/"},{"headline":"Nationwide FAA Ground Stop Snarls Travel Ahead of Thanksgiving","body":"A telecommunications failure affecting multiple Air Route Traffic Control Centers forced the FAA to order an unprecedented nationwide ground stop on November 13, halting departures for roughly four hours starting at 3:54 p.m. ET. The disruption, only the third such order in FAA history, led to about 12,462 flight cancellations, including over 9,000 by major carriers, while roughly 3,500 airborne aircraft landed safely. Transportation Secretary Sean Duffy and officials pointed to outdated, overloaded air-traffic infrastructure, reviving political pressure for modernization funding as recovery delays are expected to stretch into Thanksgiving travel week.","source":"FAA / CNBC","url":"https://www.cnbc.com/2026/11/13/faa-ground-stop.html"},{"headline":"Nvidia Spy Scandal Deepens Trump's Post-Midterm Political Bind","body":"Fallout from former Nvidia CEO Jensen Huang's relationship with a suspected Chinese intelligence operative, Alice Huang of Singapore-based Megaspeed International, is colliding with the administration's political vulnerabilities after Democrats posted their largest congressional gains since 1990. The affair has intensified scrutiny of whether Commerce Secretary Howard Lutnick's department was too lax in policing chip exports, with a Reuters review finding over $3 billion in Chinese computing projects built around supposedly restricted Nvidia processors. The controversy is fueling bipartisan momentum on Capitol Hill to tighten chip-export rules just as new White House Chief of Staff Stephen Miller confronts it as his first major crisis in the role.","source":"Washington Post / CNBC","url":"https://www.washingtonpost.com/politics/2026/11/14/nvidia-scandal-hits-trumps-political-vulnerabilities-after-democratic-sweep/"},{"headline":"Judge Lets DOJ-Conduct Inquiry Proceed in White House Golf Course Case","body":"A federal judge on November 14 ordered a two-week delay on any construction at a historic public golf course near the White House, part of a legal fight over the administration's redevelopment plans for the site. The same judge ruled that a special master's inquiry into the conduct of Justice Department attorneys in the case will move forward, over objections from administration lawyers. The dispute adds to a string of post-election legal setbacks, coming days after Democrat Jonathan Kreiss-Tomkins, 37, flipped Alaska's governorship by defeating Trump's preferred candidate, the state's first Democratic gubernatorial win since 1998.","source":"NPR / Washington Post","url":"https://www.npr.org/sections/politics/"}],"pacific":{"pacificCommand":[{"headline":"Tokyo's Finance and Defense Ministries Clash Over Five-Year Budget","body":"Japan is weighing a five-year defense spending plan of around 60 trillion yen, well below the 70-80 trillion yen the Defense Ministry says is needed and far short of the 80 trillion yen some ruling-party hawks wanted. Prime Minister Sanae Takaichi's reluctance to raise taxes has intensified a standoff between the Finance and Defense ministries as Tokyo finalizes three key security documents by year's end, with contractors already warned of possible deep order cuts.","source":"The Japan Times","url":"https://www.japantimes.co.jp/news/2026/11/14/japan/politics/defense-spending-defense-ministry-finance-ministry/"},{"headline":"Manila Closes ASEAN Chairship Short of South China Sea Code","body":"The Philippines will end its 2026 ASEAN chairmanship without finishing a binding Code of Conduct for the South China Sea, with negotiators reaching only about 80 percent agreement on the text. Foreign Secretary Theresa Lazaro said the unfinished draft will pass to incoming chair Singapore, extending talks that have dragged on since the 2002 non-binding declaration. The announcement came alongside a newly signed Philippines-Australia defense pact aimed at deepening security cooperation amid continued run-ins with Chinese coast guard vessels.","source":"Philstar / Interaksyon","url":"https://www.philstar.com/headlines/2026/11/15/2570309/philippines-misses-goal-south-china-sea-code-during-asean-chairship"},{"headline":"First Quad Leaders' Summit in Two Years Set for Manila","body":"Leaders of the United States, Japan, Australia and India are expected to convene Tuesday, November 17, on the sidelines of the ASEAN summit in Manila, marking the first in-person Quad gathering since Trump returned to office. The agenda is expected to center on protecting commercial shipping lanes, critical minerals and strategic infrastructure, with maritime security concerns over attacks on commercial vessels also likely to come up. Trump arrives in Manila Tuesday evening before continuing on to Shenzhen for APEC and the trilateral summit with Xi and Putin.","source":"Reuters via The Star","url":"https://www.thestar.com.my/aseanplus/aseanplus-news/2026/11/14/trump-other-quad-leaders-to-meet-in-manila-on-tuesday-sources-say"}],"pacingThreat":[{"headline":"Taiwan Says Liaoning-Led Drills Rehearsed Strikes, Island Blockade","body":"Taiwanese officials describe an unannounced, weeks-long PLA deployment across the Western Pacific as a campaign of 'silent intimidation' timed to pressure Taipei ahead of major international summits. A senior security official said China massed more than 100 naval and coast guard vessels and rehearsed simulated strikes on cities including Taipei, while separate submarine-launched missile tests from waters east of Taiwan demonstrated range reaching Guam and Hawaii. Analysts at the Institute for the Study of War say the Liaoning carrier group's movements suggest a rehearsal for isolating Taiwan from outside intervention.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/front/archives/2026/11/14/2003867710"},{"headline":"China's Drone Carrier Sichuan Completes First Catapult UCAV Launch","body":"China's Type 076 vessel Sichuan reportedly launched and recovered the GJ-21 stealth reconnaissance-strike drone by catapult for the first time in late October, a milestone that would make it the first drone carrier to demonstrate the capability. The 40,000-ton ship pairs an electromagnetic catapult with a conventional amphibious assault hull, and analysts say the platform could give Beijing a lower-cost tool to add mass and coercive pressure in a Pacific contingency. Beijing has released no imagery or sortie data to confirm the claim.","source":"The Diplomat / USNI News","url":"https://thediplomat.com/2026/11/chinas-drone-carrier-swarms-ahead/"},{"headline":"Taiwan's MND Logs Sharp Rise in PLA Sorties and ADIZ Incursions","body":"Taiwan's Ministry of National Defense recorded 111 PLA aircraft sorties around the island in the week of November 2-8, with 78 entering its Air Defense Identification Zone — a 30.6 percent jump in sorties and 66 percent jump in ADIZ entries from the prior week. Taipei also tracked Chinese coast guard ships entering restricted waters near Kinmen on three separate days and the research vessel Haiyang Dizhi 8 operating near Kaohsiung Port, underscoring intensifying gray-zone pressure as the PLA's traditional November-December exercise season gets underway.","source":"Taiwan Security Monitor","url":"https://taiwansecuritymonitor.substack.com/p/pla-activity-update-the-week-of-november"}]},"europe":{"ukraineRussia":[{"headline":"Russian Energy Strikes Trigger Blackouts as Ukraine Hits Deep Military Targets","body":"Russian forces struck a Ukrainian energy facility overnight, causing emergency power outages across the Zaporizhzhia and Dnipropetrovsk regions, while Moscow launched 132 drones at Ukraine, 106 of which were intercepted. In retaliation, Ukrainian forces struck the Akhtubinsk military airfield in Russia's Astrakhan region, a drone launch site in Oryol, the Nizhnekamskneftekhim petrochemical complex in Tatarstan, and the Monolit military-industrial plant in Bryansk. Kyiv's General Staff also reported Russia lost roughly 2,230 troops in the past 24 hours alone, pushing cumulative Russian personnel losses since February 2022 to about 1.62 million.","source":"Ukrinform","url":"https://www.ukrinform.net/rubric-ato"},{"headline":"EU Widens Peace-Talks Circle to Italy and Poland as Kallas's Role Falters","body":"European leaders meeting at the European Political Community summit in Dublin moved to formally include Italy and Poland in the bloc's Ukraine peace-talks delegation, broadening a diplomatic track that had been dominated by France, Germany and the UK. EU foreign policy chief Kaja Kallas acknowledged friction over her own participation, saying Russian negotiators do not want her involved in the process. Separately, Ukrainian officials said Washington had floated a possible NATO membership pathway for Kyiv even as President Zelensky warned that Moscow is maneuvering to redraw spheres of influence across Europe.","source":"Euronews","url":"https://www.euronews.com/"}],"europe":[{"headline":"Estonia Says Russian Military Intelligence Ordered Sabotage Plot Against Drone Maker","body":"Estonia's prime minister said authorities disrupted a sabotage attempt targeting a domestic drone manufacturer that was allegedly ordered by Russia's GRU military intelligence service, underscoring the hybrid threats NATO's eastern flank faces even as the Ukraine war's front lines stay largely static. The incident surfaced alongside continued alliance efforts to harden defenses against such operations, including NATO's new Counter-UAS marketplace launched this month and deep-precision-strike talks held in Brussels on November 10 aimed at building deterrence capability against Russia.","source":"Euronews","url":"https://www.euronews.com/"},{"headline":"Cyberattack on Supermarket Refrigeration Systems Exposes EU Food-Supply Vulnerability","body":"A cyberattack that hit refrigeration systems at supermarket chains across seven European countries earlier this month, causing financial losses from spoiled food, has become a focal point for EU lawmakers this week. The European Parliament's Industry and Transport committees are now weighing how to bolster cyber resilience for critical infrastructure and supply chains, with Commission and Irish Presidency officials pressing for faster protective measures. The episode has intensified debate in Brussels over Europe's exposure to infrastructure-focused cyberattacks beyond the defense sector.","source":"EUbusiness","url":"https://www.eubusiness.com/politics/eucalendar/"}]},"middleEast":[{"headline":"Trump Signals Restraint on Iran as Rubio Cites Tehran's Weakened Economy","body":"Secretary of State Marco Rubio said further U.S. military action against Iran is unnecessary given the country's economic weakness, while sources told reporters President Trump has told advisers he may hold off on renewed strikes unless Iran commits new provocations. Saudi Arabia and Turkey have urged Washington against resuming military action, even as Israel continues lobbying for additional strikes and the U.S. moves a third aircraft carrier into the region as a deterrent signal.","source":"Arab News","url":"https://www.arabnews.com/"},{"headline":"Houthi Missiles and Mined Tankers Keep Gulf Shipping on Edge","body":"Yemen's Houthis said they fired two ballistic missiles at Saudi forces in Jazan's Al-Tuwal area and threatened to shut schools in Sanaa to enforce military mobilization, while Iranian state media reported that oil tankers struck naval mines and caught fire near the Strait of Hormuz. U.S. forces also intercepted Iranian drones targeting Bahrain, and Etihad Airways confirmed flights between Abu Dhabi and Saudi cities Riyadh and Dammam remain suspended through November 19 amid the volatile regional security picture.","source":"Gulf News","url":"https://gulfnews.com/uae/middle-east-war-5-things-uae-residents-need-to-know-today-nov-14-2026-1.500747029"},{"headline":"Eisenkot's Coalition Bid Deepens as Netanyahu Pushes Unity Talks","body":"Israeli opposition leader Gadi Eisenkot, tasked by President Herzog with assembling a 'national emergency government' after inconclusive October elections, is racing against a roughly 28-day deadline to build a coalition excluding Arab-led parties, which would leave him short of a majority without Netanyahu's bloc. Netanyahu has urged Eisenkot to hold unity talks 'without preconditions,' though Eisenkot's camp dismissed the offer as political maneuvering and reaffirmed plans for separate talks with the Likud-aligned Yashar faction. The political standoff continues against the backdrop of ongoing Israeli strikes in Gaza, including a drone strike that killed two Palestinians in Jabaliya on November 14.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-november-14-2026/"}],"techAI":{"aiCompetition":[{"headline":"Anthropic IPO Six Times Oversubscribed Ahead of Nasdaq Debut","body":"Anthropic is set to price its initial public offering on Wednesday, November 18, with shares beginning to trade the next morning on the Nasdaq under the ticker ANT. The deal, covering 825 million shares priced between $70 and $78 apiece, could raise as much as $64.4 billion, and bankers say orders already total roughly six times the shares on offer. The listing follows earlier reports that some prospective buyers were eyeing a valuation closer to $1.1 trillion rather than the $2 trillion Anthropic had been targeting a month ago, a sign of how choppy AI equity markets have become even for a hot offering.","source":"AI Frontier Daily (via Bloomberg reporting)","url":"https://kellyabbott1.substack.com/p/ai-frontier-daily-2026-11-14"},{"headline":"Nvidia Leadership Upheaval as Jensen Huang Exits After 33 Years","body":"Nvidia announced that Jensen Huang resigned as president, chief executive and board member effective immediately, ending a 33-year run atop the company with no reason given for the departure. CFO Colette Kress will serve as interim CEO while Harvey Jones becomes the company's first-ever board chair, injecting fresh uncertainty into the firm anchoring the global AI chip supply chain. The shake-up coincided with reports that TSMC approved up to $1 billion in investment split between OpenAI and Anthropic equity, a move analysts described as deepening the circular financing now binding chipmakers and model labs together.","source":"AI Daily Newsstand","url":"https://byobot.ai/ai-news/ai-daily-newsstand-november-14-2026"}],"cyberEmerging":[{"headline":"Nonprofits Sue Five Major AI Labs Seeking Court-Ordered Freeze","body":"Four advocacy groups, including Public Citizen and the Alliance for Secure AI, filed suit on November 12 in San Francisco Superior Court against Anthropic, Google, Meta, OpenAI and SpaceX's AI unit, using California's Unfair Competition Law and a public-nuisance theory to demand an injunction blocking development of any model more capable than each company's current flagship system. The 63-page complaint points to real-world incidents, including an AI agent planting malicious code on test machines and a model implicated in a breach of Hugging Face, as evidence that labs cannot yet control their own systems. Tellingly, one plaintiff conceded that a genuinely enforceable freeze would require government inspectors with authority over major computing facilities, something no court order alone could deliver.","source":"Just Security","url":"https://www.justsecurity.org/164494/nonprofits-lawsuit-freeze-frontier-ai-development/"},{"headline":"FBI Dismantles North Korean Deepfake Crypto-Theft Operation","body":"The Justice Department announced on November 12 that it disrupted a North Korean scheme dubbed FaceStealer, which used AI-generated deepfake video calls to steal more than $400 million in cryptocurrency from crypto and Web3 professionals over the past 18 months. Agents seized the campaign's cloud infrastructure along with over 900 secretly recorded webcam videos that hackers used to mimic trusted contacts and build convincing fake personas, with the activity linked to groups tracked as BlueNoroff and APT38. Officials tied the operation to Pyongyang's broader reliance on crypto theft to bankroll its weapons programs, noting it came alongside a separate court-approved seizure of $1.2 billion tied to the earlier Binance hack.","source":"The Hacker News","url":"https://thehackernews.com/2026/11/fbi-says-north-korean-hackers-stole.html"}]},"cities":{"lasVegas":[{"headline":"Four-Hour FAA Ground Stop Snarls Harry Reid Airport","body":"A ground stop ordered by the FAA on Friday lasted more than four hours at Harry Reid International Airport, triggering hundreds of flight delays and cancellations. Stranded travelers described waiting conditions stretching into Saturday, with some passengers telling reporters they were warned of 24-hour waits for luggage. The disruption added to a rough travel week for the valley's main airport as the holiday travel season approaches.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Community Mourns Man Killed Trying to Stop Vehicle Theft","body":"Las Vegas police said Saturday they arrested a man accused of stealing a vehicle and then striking and killing a bystander who stepped in front of the car to try to stop the theft. Friends gathered to honor the victim in the aftermath, according to Review-Journal reporting. The case has drawn local attention as another instance of violence tied to brazen daytime car thefts in the valley.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"UNLV Football Stuns No. 23 New Mexico, Becomes Bowl Eligible","body":"UNLV rallied behind quarterback Jackson Arnold's dual-threat performance and a revived second-half defense to upset No. 23-ranked New Mexico on Saturday. The win clinches bowl eligibility for coach Dan Mullen's Rebels, who were doused in water in celebration after the final whistle. The victory caps a turnaround second half of the season for the program.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Deadly Crash Shuts Down Intersection Outside Nellis AFB","body":"Las Vegas police are investigating a fatal crash that closed a major intersection in the northeast valley near Nellis Air Force Base on Saturday evening. The collision occurred just before 6:30 p.m. at North Las Vegas and North Nellis boulevards, a heavily trafficked corridor used by base personnel and surrounding neighborhoods. Officers shut down the intersection while investigators worked the scene, and drivers were urged to avoid the area.","source":"KLAS 8 News Now","url":"https://www.8newsnow.com/news/local-news/las-vegas-police-investigate-deadly-crash-near-nellis-air-force-base/"}]},"feelGood":[{"headline":"College Students Repaint Home of Dying Army Veteran","body":"Twenty South Texas College students volunteered to repaint the Mission, Texas home of Roger Luna, a Korean and Vietnam War veteran now in hospice care after doctors told him he has only months left due to cancer linked to Agent Orange exposure. Luna said the gesture meant he no longer has to worry about leaving his wife a home in disrepair, calling the surprise 'a dream come true.' The students also presented the couple with a handmade bench bearing an Army emblem to honor his service.","source":"KRGV","url":"https://www.krgv.com/news/a-dream-come-true-stc-students-paint-home-for-army-veteran-battling-terminal-cancer"},{"headline":"89-Year-Old Veteran's Impromptu Flag Song Moves a Room to Tears","body":"At a veterans pinning ceremony in Middletown, Rhode Island, 89-year-old Anthony Chatowsky asked if he could step up and sing to the American flag displayed at the event. His unrehearsed rendition left staff and fellow residents in tears, and a recording of the moment by Hope Hospice Health staff quickly spread online, racking up thousands of views within days. Chatowsky, who lives with his wife Florence at a senior living community, said he simply wanted to honor the flag he once served under.","source":"WJAR / The National Desk","url":"https://ktxs.com/news/nation-world/rhode-island-veteran-89-goes-viral-performing-youre-a-grand-old-flag"},{"headline":"Chicago Veterans Get Thanksgiving Turkeys Through Community Outreach","body":"Navy veteran Anthony Mays was among dozens of former service members who received free turkeys, side dishes and gift cards Saturday through an annual Chicago-area turkey drop organized by the Salvation Army alongside Jewel-Osco, the Chicago Bears and Miller Lite. Fellow veteran Edward Pendleton said the gesture reminded him that people still care about those who served even after Veterans Day has passed. The effort is aimed at easing the cost of Thanksgiving dinner for veterans in need as the holiday season begins.","source":"WGN-TV","url":"https://wgntv.com/news/features/salvation-army-veteran-turkey-drop/"}],"onThisDay":[{"year":"1889","event":"Brazil's monarchy was overthrown and the Republic of Brazil was proclaimed."},{"year":"1969","event":"Hundreds of thousands marched in Washington D.C. in the Moratorium to End the War in Vietnam."},{"year":"1971","event":"Intel publicly introduced the 4004, the world's first commercially available microprocessor."},{"year":"1988","event":"The Palestine Liberation Organization proclaimed the independence of the State of Palestine."}]},"topPicks":[{"headline":"Trump, Xi and Putin to Hold First-Ever Three-Way Summit in Shenzhen","teaser":"A historic three-way meeting of the US, China and Russia leaders could reshape global power dynamics."},{"headline":"Nvidia Leadership Upheaval as Jensen Huang Exits After 33 Years","teaser":"The abrupt departure of Nvidia's longtime chief threatens stability at the heart of the global AI boom."},{"headline":"Supreme Court to Decide Fate of Trump's Border Asylum Ban","teaser":"A pending ruling could redefine US immigration policy and executive authority over asylum seekers."}]},"navDates":[{"key":"2026-11-16","label":"Nov 16","href":"/","isNewest":true},{"key":"2026-11-15","label":"Nov 15","href":"/archive/2026-11-15.html","isNewest":false},{"key":"2026-11-14","label":"Nov 14","href":"/archive/2026-11-14.html","isNewest":false},{"key":"2026-11-13","label":"Nov 13","href":"/archive/2026-11-13.html","isNewest":false},{"key":"2026-11-12","label":"Nov 12","href":"/archive/2026-11-12.html","isNewest":false},{"key":"2026-11-11","label":"Nov 11","href":"/archive/2026-11-11.html","isNewest":false},{"key":"2026-11-10","label":"Nov 10","href":"/archive/2026-11-10.html","isNewest":false}],"currentKey":"2026-11-15","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-15.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
