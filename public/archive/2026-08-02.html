<script>
const STATE = {"digest":{"date":"Sunday, August 2, 2026","generatedAt":"Sun, Aug 2, 10:05 AM PDT","breaking":{"headline":"Trump halts planned Iran strike, citing tentative Hormuz deal","body":"President Trump announced late Saturday he was canceling a large-scale planned strike on Iran after Tehran and regional mediators signaled the outlines of a deal were near, including a full reopening of the Strait of Hormuz and an end to Iran's nuclear program. Saudi Crown Prince Mohammed bin Salman reportedly pressed Trump to hold off, with Qatar, the UAE, Turkey and Pakistan also pushing for de-escalation. Iranian state media denied any agreement was in place, with Tehran officials calling the claim false, leaving both Washington and Israel on high alert. It is the latest reversal in a months-long cycle of threatened strikes and paused deadlines between the U.S. and Iran.","source":"Washington Post","url":"https://www.washingtonpost.com/world/2026/08/02/trump-cancels-iran-attack-citing-progress-deal-tehran-israel-alert/"},"tabs":{"defense":{"defense":[{"headline":"Air Force, Boeing push to fix KC-46 tanker flaws by 2027","body":"Air Force and Boeing officials said this week they aim to resolve all five remaining serious deficiencies on the KC-46 Pegasus refueling tanker - flaws rated severe enough to risk death or major aircraft damage - by the end of 2027. The effort comes as the service leans more heavily on the aircraft to support refueling demands stretching across the Indo-Pacific and Middle East. Boom and camera-system reliability issues have dogged the program for years, and the new internal deadline signals mounting pressure to get the full fleet mission-capable.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Marine Corps validates new medium-range air-defense interceptor","body":"The U.S. Marine Corps successfully intercepted an aerial target in a recent test of its new Medium-Range Intercept Capability, a system meant to close a gap in defending dispersed, forward-deployed units against cruise missiles and drones. The test is part of a broader push to harden Marine littoral regiments operating across the Indo-Pacific against precision-strike threats. It follows a similar cruise-missile intercept test by an Australian prototype ground-based air-defense system during Exercise Taipan Strike 26, underscoring parallel allied efforts on layered air defense.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026"},{"headline":"Pentagon to hand off NATO's Ukraine aid command to an ally","body":"The Pentagon is preparing to transfer leadership of the Germany-based NATO command that coordinates military assistance to Ukraine to another alliance member, according to a Politico report citing an unnamed NATO official on August 1. The shift reflects Washington's continued drawdown of its footprint in Europe even as allies work to sustain the roughly 70 billion euro Ukraine support package pledged at the Ankara summit. The handoff underscores a broader trend of European allies assuming greater day-to-day responsibility for coordinating aid as U.S. attention shifts elsewhere.","source":"RT (via Politico)","url":"https://www.rt.com/news/643743-us-drop-nato-ukraine-assistance/"}],"acquisitions":[{"headline":"Pentagon locks in $135 billion in Patriot and submarine deals in one day","body":"In one of its largest single-day contracting pushes in years, the Pentagon finalized a $58.6 billion, seven-year Lockheed Martin deal to scale up Patriot interceptor production from fiscal 2026 through 2032, converting an earlier one-year, $4.7 billion framework. The same day, General Dynamics Electric Boat and HII Newport News Shipbuilding split a combined $76.6 billion award covering nine Virginia-class attack submarines and five Columbia-class ballistic-missile submarines. Announced around July 29, the twin awards reflect simultaneous efforts to rebuild munitions stockpiles and expand submarine-building capacity.","source":"Sirotin Intelligence Briefing","url":"https://www.sirotinintelligence.com/sirotin-intelligence-briefing-july-27-august-1-2026-pentagon-awards-135-billion-in-mega-contracts-in-a-single-day-usspacecom-codifies-the-2040-space-fight-and-washington-tears-down-laun/"},{"headline":"SpaceX tops $7 billion in 2026 Pentagon awards with new $1.6 billion deal","body":"SpaceX has won an additional $1.6 billion Pentagon contract tied to the National Security Space Launch Phase 3 program, aimed at expanding airborne combat data and missile-tracking capabilities. It follows an earlier $4.6 billion award for an airborne moving-target-indicator system and a $2.29 billion contract for a satellite communications link between missile-warning sensors and interceptors, both feeding into the roughly $185 billion Golden Dome missile-defense architecture. The new deal pushes SpaceX past $7 billion in Pentagon contracts so far in 2026, reinforcing its role as a central contractor on the administration's homeland missile-shield effort.","source":"American Bazaar","url":"https://americanbazaaronline.com/2026/07/31/spacex-wins-1-6-billion-pentagon-contract-to-enhance-airborne-combat-capabilities/"}]},"us":[{"headline":"Senate narrowly rejects war powers resolution on Iran hostilities","body":"The Senate voted 49-50 to reject a war powers resolution that would have forced Trump to withdraw US forces from hostilities with Iran absent a formal declaration of war or explicit congressional authorization. Republicans Susan Collins, Lisa Murkowski and Rand Paul crossed over to back the measure alongside 46 Democrats, while Pennsylvania's John Fetterman was the lone Democrat opposed. Senate Majority Leader John Thune's chamber narrowly preserved the administration's latitude on Iran policy just as ceasefire diplomacy with Tehran intensifies.","source":"NBC News","url":"https://www.nbcnews.com/politics/trump-administration/live-blog/trump-congress-2026-midterm-blanche-doj-iran-ice-live-updates-rcna589931"},{"headline":"Todd Blanche's attorney general bid teeters amid GOP revolt","body":"Acting Attorney General Todd Blanche's confirmation is in jeopardy after Senators John Cornyn and Thom Tillis blocked a Judiciary Committee vote, demanding written assurances tied to a Justice Department settlement of Trump's IRS lawsuit. Trump said on Truth Social he would not object to temporarily withdrawing Blanche's nomination and renominating him once Cornyn and Tillis leave the Senate. The White House pushed back over the weekend, releasing statements from law enforcement groups and former DOJ officials urging swift confirmation before the Senate's August recess.","source":"Time","url":"https://time.com/article/2026/07/31/trump-administration-amps-up-pressure-on-senate-to-confirm-todd-blanche-as-attorney-general/"},{"headline":"FCC blocks imports of Chinese-made humanoid robots and power inverters","body":"The Federal Communications Commission announced a ban on imports of new foreign-made humanoid robots and power inverters, citing national security risks in a move squarely aimed at Chinese manufacturers. The action extends Washington's tech-decoupling push beyond telecom gear into emerging robotics and grid-hardware supply chains. It signals growing concern in Washington over Beijing's dominance in humanoid robotics as the technology moves toward commercial deployment.","source":"NBC News","url":"https://www.nbcnews.com/politics/trump-administration/live-blog/trump-congress-2026-midterm-blanche-doj-iran-ice-live-updates-rcna589931"},{"headline":"Economists project rebound in July hiring after weak June report","body":"Bloomberg's survey of economists projects Friday's jobs report will show payrolls rose 85,000 in July, a pickup from June's disappointing 57,000 gain. The forecast suggests employers kept adding workers despite lingering geopolitical strain from the Iran standoff and persistently elevated inflation. The data, due August 7, will be closely watched by the Federal Reserve as it weighs the pace of any further rate moves against a labor market that has cooled markedly from 2024's pace.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-08-01/us-job-growth-to-pick-up-after-disappointing-june"}],"pacific":{"pacificCommand":[{"headline":"Japan-Philippines military logistics pact set to take effect August 22","body":"Tokyo and Manila exchanged diplomatic notes on July 23 finalizing their Acquisition and Cross-Servicing Agreement, which will formally enter into force on August 22, 2026, according to the Japanese Embassy in Manila. The pact, signed in January by Foreign Minister Motegi Toshimitsu and Secretary Ma. Theresa Lazaro, creates a standing framework for the Self-Defense Forces and the Armed Forces of the Philippines to share fuel, ammunition, and other supplies during joint drills. It builds on last September's Reciprocal Access Agreement and cements Japan's role as the Philippines' most active security patron in the first island chain.","source":"Manila Times","url":"https://www.manilatimes.net/2026/07/28/news/national/ph-japan-defense-pact-takes-effect-in-august/2392337"},{"headline":"Canberra elevates India to 'top-tier' Indo-Pacific security partner","body":"Australia's 2026 National Defence Strategy has formally designated India as its most important defense partner in the northeast Indian Ocean, a shift analysts tie directly to China's expanding submarine patrols and survey-ship activity in those waters. The designation follows an inaugural Australia-India Defence Ministers' Dialogue that set up an annual ministerial meeting, joint exercises, and deeper intelligence sharing. Canberra frames the relationship as essential given Beijing's naval reach now extends well past the Malacca Strait into waters critical to Australian trade.","source":"The Hans India","url":"https://www.thehansindia.com/news/national/australia-must-deepen-defence-ties-with-india-to-counter-chinese-influence-report-1080811"},{"headline":"Seoul deepens NATO ties as Kim Jong Un ramps up public appearances","body":"South Korea is pushing to broaden formal ties with NATO member states and its footprint in the global defense industry, continuing even as Pyongyang publicly condemns the outreach and trilateral denuclearization coordination among Seoul, Washington and Tokyo. Kim Jong Un has meanwhile increased his public appearances in the first half of 2026 compared with a year earlier, signaling renewed emphasis on North Korea's military buildup and domestic messaging. The dynamic underscores how alliance-building among Indo-Pacific democracies is proceeding on parallel tracks with North Korea's own hardening posture.","source":"American Enterprise Institute","url":"https://www.aei.org/articles/korean-peninsula-update-july-14-2026/"}],"pacingThreat":[{"headline":"PLA stages fresh naval-air drill over disputed Scarborough Shoal","body":"China's Southern Theater Command carried out a joint naval-air exercise on Saturday, August 1, in the waters and airspace around Huangyan Dao, the Chinese name for Scarborough Shoal, which Beijing seized from the Philippines in 2012 and which lies inside Manila's exclusive economic zone. The command said the drill rehearsed reconnaissance and early warning, deterrence patrols, air-sea control, and joint strike missions, aimed at sharpening rapid-support and networked combat capability. The timing, one day after the PLA's 99th founding anniversary, fits a pattern of stepped-up shows of force around sensitive anniversaries.","source":"GlobalSecurity.org / Xinhua","url":"https://www.globalsecurity.org/military/library/news/2026/08/mil-260802-pdo01.htm"},{"headline":"PLA marks 99th anniversary with new hardware reveals and modernization push","body":"Beijing used its August 1 Army Day to unveil fresh footage of previously unseen systems, including tactical-missile launches from the Type 191 long-range rocket artillery, decoy-flare tests aboard the Type 076 amphibious assault ship, and live-fire strikes by the KVD002 reconnaissance-strike drone, all featured in the state-produced documentary 'Zhisheng.' Official commentary tied the showcase to the PLA's 'centenary goals' for 2027 and a longer three-step modernization roadmap running through 2035 and mid-century. Independent trackers note that PLA Day and China's October 1 National Day have historically preceded spikes in PLAAF and PLAN activity near Taiwan, making the next two months a key watch period.","source":"GlobalSecurity.org / Global Times","url":"https://www.globalsecurity.org/wmd/library/news/china/2026/07/china-260731-globaltimes02.htm"},{"headline":"Taiwan pairs local drone maker with US autonomy software as Congress presses for funding","body":"Taiwan's Thunder Tiger Corp partnered with US defense firm Shield AI this week to demonstrate mission-autonomy software controlling unmanned surface vessels in a coordinated operation, part of Taipei's push to field asymmetric, attritable maritime drones against a numerically superior PLA Navy. The demo coincided with a US congresswoman publicly urging Taiwan's legislature to pass a stalled drone-procurement bill, after the DPP-led cabinet had proposed roughly NT$210 billion (about $6.5 billion) for domestic drone programs running from August 2026 through 2031. The bill has faced resistance from the opposition-controlled Legislative Yuan, highlighting the domestic political friction shadowing Taiwan's defense buildup even as Washington signals continued support.","source":"Focus Taiwan (CNA)","url":"https://focustaiwan.tw/"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine strikes deep into Russia, hitting strategic bomber base and refineries","body":"Ukraine's General Staff confirmed overnight strikes on the Engels strategic air base and the Saratov oil refinery, part of a broader campaign that also hit an oil depot in Kaluga region as Kyiv pushes its long-range strike campaign roughly 1,600 kilometers into Russian territory. Ukrainian officials say Russia lost about 1,500 troops, 69 artillery systems and 8 multiple-launch rocket systems in a single day, with July marking the deadliest month of 2026 for Russian forces. The strikes underscore Kyiv's shift toward hitting Russia's military-industrial base rather than relying solely on frontline attrition.","source":"Kyiv Independent / United24 Media","url":"https://kyivindependent.com/tag/war/"},{"headline":"Deadly Kyiv strike fuels Zelensky's push for Patriot missiles as Trump wavers on production license","body":"A Russian missile and drone barrage on Kyiv killed nine people and wounded 33 others, prompting President Zelensky to publicly press allies that 'the world has Patriot missiles' and demanding faster action on air defense. The appeal comes just after President Trump reportedly floated then walked back an offer to license Ukraine to produce its own Patriot interceptors, retreating from the pledge hours before the latest ballistic missile strike hit the capital. Separately, the Washington Post reported that Israeli restrictions could cut off Ukraine's access to certain new U.S. weapons systems, adding another complication to Kyiv's air-defense supply chain.","source":"RBC-Ukraine / Kyiv Independent","url":"https://newsukraine.rbc.ua/war-in-ukraine"}],"europe":[{"headline":"NATO allies grapple with US troop drawdowns even as Ukraine aid pledge holds","body":"Fallout continues from the Ankara summit, where NATO leaders pledged EUR 70 billion in military support for Ukraine in 2026 and committed to sustaining similar levels in 2027, while also touting more than $139 billion in added European and Canadian defense investment since 2025. That commitment sits uneasily alongside confirmed U.S. reductions, including the cancellation of an armored brigade combat team rotation of more than 4,000 troops plus a long-range fires battalion, which Supreme Allied Commander Europe Gen. Alexus Grynkewich has signaled is just the start of further American troop withdrawals from the continent. European officials are increasingly questioning whether the alliance's traditional reliance on U.S. capabilities is sustainable as Washington pivots resources toward the Indo-Pacific.","source":"GLOBSEC / NATO.int","url":"https://www.nato.int/en/news-and-events/events/2026/07/overview---2026-nato-summit-in-ankara-"},{"headline":"EU calls emergency meeting as roughly 60,000 migrants surge into Ceuta in days","body":"The European Union convened an emergency meeting after an estimated 60,000 migrants crossed into Spain's North African enclave of Ceuta, a territory with a population of just 84,000, between Wednesday and Friday—the largest such mass crossing on record there, with at least 72 people dying in the attempt. Twenty-two member states signed a joint letter demanding a 'strengthening of external borders' to prevent what they called the instrumentalisation of migration as a hybrid threat. Some analysts suggested Morocco may have loosened border controls as leverage amid tensions with Madrid over Spain's stance on Gaza and its earlier refusal to let a U.S.-flagged weapons shipment for Israel dock at Algeciras.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/8/2/why-has-the-eu-called-an-emergency-meeting-on-spain-migrants-surge"}]},"middleEast":[{"headline":"Israeli strikes continue in Gaza despite Trump-touted Hamas disarmament breakthrough","body":"Israeli airstrikes killed at least four Palestinians in Gaza City and Deir al-Balah on Sunday, a second straight day of attacks even after President Trump announced a breakthrough in which Hamas agreed to a phased weapons handover. Gaza's Health Ministry said seven people were killed and 76 wounded over the prior 48 hours, including a strike that destroyed a medicine warehouse next to a hospital serving displaced families, pushing the death toll since the nominal ceasefire began past 1,200. A diplomatic source told the Jerusalem Post that Israeli forces will not pull back from the so-called Yellow Line inside Gaza until Hamas's disarmament is verified as complete.","source":"Al Jazeera / Reuters (Al-Monitor)","url":"https://www.aljazeera.com/news/2026/8/1/israeli-strikes-kill-four-across-gaza-destroy-medical-supply-warehouse"},{"headline":"Netanyahu faces domestic backlash over Gaza withdrawal tied to disarmament deal","body":"Israeli Prime Minister Benjamin Netanyahu is under mounting political pressure at home as the Trump-brokered Gaza roadmap, which links a phased Israeli withdrawal to Hamas disarmament, splits his coalition. Former IDF chief Gadi Eisenkot argued the plan amounts to Netanyahu capitulating without securing the war's original objectives, while other officials insist any pullback must wait for genuine, verified disarmament rather than a symbolic gesture. The dispute reflects a broader rift between Washington's push to declare victory and close out the conflict and hardliners in Israel who see the deal as premature.","source":"The Times of Israel / Al Jazeera","url":"https://www.aljazeera.com/news/2026/8/1/is-israel-really-ready-to-withdraw-from-gaza"},{"headline":"Israel on high alert as US weighs renewed strikes on Iranian nuclear sites","body":"Israeli officials believe Iran could fire ballistic missiles at Israel even if the IDF is not directly involved in any fresh American offensive, with Israeli media reporting the military is at its 'highest alert' and U.S. aerial refueling tankers have been repositioning toward Israel in recent days. CNN reported that U.S. forces had prepared strike options against Iranian nuclear infrastructure, including the Pickaxe Mountain site south of Tehran, with preparations accelerating in the days before Saturday's diplomatic phone call between Trump and Saudi Arabia's crown prince. The White House has said Iran 'will continue to pay' unless it returns to negotiations in what Trump considers good faith, keeping the region on edge despite the temporary halt in U.S. strikes.","source":"CNN / The Times of Israel","url":"https://www.cnn.com/2026/08/01/world/live-news/iran-war-trump"}],"techAI":{"aiCompetition":[{"headline":"Google DeepMind loses ground as talent exodus and Gemini delay widen gap","body":"Axios reporting from July 30 describes eroding morale inside Google DeepMind, with Gemini co-lead Noam Shazeer having decamped for OpenAI and Nobel laureate John Jumper moving to Anthropic. Several current and former staffers link the departures and slipped timeline for the flagship Gemini 3.5 Pro model to internal anger over Google's Pentagon software deal, even as the company's cash flow has turned negative. Rivals have piled on publicly, with Meta's Alexandr Wang mocking Google's smaller model releases online, underscoring how a three-lab AI race (OpenAI, Anthropic, Google) is increasingly seen as a two-horse contest.","source":"Axios","url":"https://www.axios.com/2026/07/23/googles-deep-mind-ai-model-race"},{"headline":"Compute costs and AMD-Anthropic mega-deal reshape the AI arms race","body":"AI researcher Dwarkesh Patel argued in a July 29 essay that GPU rental prices could rise 10-15x as lab revenue - Anthropic is reportedly tracking toward $100-150 billion in annualized revenue - outpaces the roughly 3x annual growth in compute supply, with spot prices already up more than 40 percent since February. That squeeze is driving frontier labs to lock in long-term hardware: Anthropic and AMD struck a deal for up to 2 gigawatts of MI450/Helios-generation compute capacity, including up to $5 billion in AMD equity for Anthropic, announced alongside AMD's Advancing AI 2026 event. Reports of a separate roughly $10 billion, two-year Meta-Anthropic compute lease suggest labs are racing to diversify away from single-vendor GPU dependence before prices climb further.","source":"ThursdAI / Dwarkesh Patel","url":"https://thursdai.news/releases/2026-07"}],"cyberEmerging":[{"headline":"Anthropic discloses Claude models were used to breach real organizations in security tests","body":"Anthropic's Frontier Red Team published a report on July 30 detailing three real-world incidents in which its Claude models were leveraged during cybersecurity evaluations to successfully compromise actual organizations, not simulated targets. The disclosure adds concrete evidence to warnings raised earlier this summer by Anthropic and Google DeepMind leadership that increasingly capable models carry offensive cyber potential serious enough to worry G7 governments. The incident reports are expected to feed into ongoing U.S. export-control and model-access debates around 'covered frontier models' with advanced cyber capabilities.","source":"Anthropic","url":"https://www.anthropic.com/news"},{"headline":"Iranian-linked hackers escalate attacks on US water systems as CISA warns of PLC intrusions","body":"U.S. officials said on August 1 that Iranian-affiliated cyber activity targeting water infrastructure has now spread to seven states, adding a domestic front to the broader Iran standoff. The report builds on a CISA/FBI advisory updated July 22 describing an Iranian-affiliated group manipulating programmable logic controllers and HMI/SCADA displays at U.S. critical-infrastructure sites, with the campaign having compromised at least 75 Unitronics devices used across water and wastewater systems since March. Officials tie the intensifying intrusions directly to the recent spike in hostilities between Iran, the U.S., and Israel, underscoring how kinetic and cyber escalation are now moving in parallel.","source":"CISA","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-097a"}]},"cities":{"lasVegas":[{"headline":"WSOP Main Event Final Table Set for Monday Showdown","body":"The World Series of Poker Main Event pauses over the weekend with nine players remaining, all vying for a first-place prize of $10 million when play resumes Monday. The final table has drawn the usual crush of spectators and railbirds to the Strip, capping a summer that again cemented Las Vegas as the center of the poker universe. Local bookmakers and poker media are already handicapping the final nine ahead of the resumption.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Federal Regulators Clear Path for Steering-Wheel-Free Robotaxis","body":"New federal rules announced this weekend will allow robotaxi operators to run vehicles without traditional manual controls such as steering wheels, and eventually without brake pedals, a shift with outsized implications for Las Vegas given the valley's growing autonomous-vehicle testing footprint. The move could accelerate driverless ride-hailing expansion on the Strip and beyond in coming months. Local transportation officials are expected to weigh in on permitting as companies adjust their Nevada fleets.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Good Samaritan Killed Trying to Stop Flower-Stand Robbery","body":"A man was fatally shot near Jones and Upland boulevards after intervening to stop a suspect from robbing a roadside flower vendor, according to Las Vegas police. The suspect now faces murder, robbery and weapons charges in connection with the killing. The case has drawn an outpouring of community grief, with the victim's family describing him as someone who could not stand by while a stranger was being victimized.","source":"Fox5 Vegas / KTNV","url":"https://www.fox5vegas.com/"}],"nellis":[{"headline":"Nellis Airmen Run High-Tempo F-35 Refuel Surge Amid Regional Tensions","body":"Airmen from the 57th Wing and 99th Air Base Wing at Nellis Air Force Base recently executed a hot-pit refuel surge for Exercise Rogue Wave, cycling F-35A Lightning IIs from the 6th Weapons Squadron through eight concurrent refuels to validate rapid combat generation. The drill, which paired crew chiefs from the 757th Aircraft Maintenance Squadron with weapons-school pilots, was designed to prove cross-unit interoperability and sustained fifth-generation operations under wartime tempo. The exercise underscores how the Nevada Test and Training Range continues to serve as the Air Force's premier proving ground as US forces remain postured for contingencies across the Middle East and Indo-Pacific.","source":"DVIDS / Nellis Air Force Base","url":"https://www.dvidshub.net/unit/NAFB"}]},"feelGood":[{"headline":"9-Year-Old Offers Life Savings After Lightning Destroys Dad's Truck","body":"Utah driver Casey Pettus walked away unharmed after a lightning strike incinerated his truck on a highway, but the moment that stuck with his family came later that day: his young son quietly handed over his entire life savings to help his dad recover. The small gesture turned a terrifying near-miss into a story that's been circulating widely as an example of a child's instinctive generosity in a crisis. Pettus has said the offer meant more to him than any insurance payout could.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Teen Lifeguard's Dramatic Save Off Santa Cruz Credited With Preventing Tragedy","body":"The father of a 10-year-old boy pulled from rough surf off Santa Cruz is speaking publicly for the first time, describing how a teenage lifeguard's quick action kept a routine beach day from turning fatal. The boy reportedly believed he would not survive the rip current before the young lifeguard reached him. The family has credited the teen's training and composure under pressure with saving their son's life.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Local TV Investigators Rescue Stranded Mother and Daughter's Bus Refund","body":"KTNV Channel 13's consumer team intervened on behalf of a Las Vegas mother and daughter left stranded by a canceled Greyhound trip, successfully pressuring the bus company to issue the refund it had initially denied. The case is the latest example of the station's 'Let's Talk' consumer unit stepping in for everyday Nevadans caught up in corporate red tape. It's a small but concrete reminder that persistent advocacy for strangers can still produce results.","source":"KTNV Channel 13","url":"https://www.ktnv.com/"}],"onThisDay":[{"year":"1776","event":"Delegates to the Continental Congress began signing the Declaration of Independence in Philadelphia."},{"year":"1923","event":"President Warren G. Harding died in office, elevating Vice President Calvin Coolidge to the presidency."},{"year":"1934","event":"German President Paul von Hindenburg died, allowing Adolf Hitler to merge the presidency and chancellorship and assume total power."},{"year":"1990","event":"Iraqi forces invaded Kuwait, triggering the Gulf War crisis."}]},"topPicks":[{"headline":"Trump halts planned Iran strike, citing tentative Hormuz deal","teaser":"A last-minute diplomatic breakthrough averts a US military strike on Iran, easing fears of a wider Middle East war."},{"headline":"Ukraine strikes deep into Russia, hitting strategic bomber base and refineries","teaser":"Kyiv's long-range strikes on Russian military and energy infrastructure mark a major escalation in the ongoing war."},{"headline":"Pentagon locks in $135 billion in Patriot and submarine deals in one day","teaser":"A massive single-day defense spending surge signals accelerating US military buildup amid global tensions."}]},"navDates":[{"key":"2026-08-06","label":"Aug 6","href":"/","isNewest":true},{"key":"2026-08-05","label":"Aug 5","href":"/archive/2026-08-05.html","isNewest":false},{"key":"2026-08-04","label":"Aug 4","href":"/archive/2026-08-04.html","isNewest":false},{"key":"2026-08-03","label":"Aug 3","href":"/archive/2026-08-03.html","isNewest":false},{"key":"2026-08-02","label":"Aug 2","href":"/archive/2026-08-02.html","isNewest":false},{"key":"2026-08-01","label":"Aug 1","href":"/archive/2026-08-01.html","isNewest":false}],"currentKey":"2026-08-02","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-02.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
