<script>
const STATE = {"digest":{"date":"Wednesday, September 2, 2026","generatedAt":"Wed, Sep 2, 6:02 AM PDT","breaking":{"headline":"EU Defense Ministers Meet in Ireland Over Russian Sabotage Campaign","body":"EU foreign policy chief Kaja Kallas convened a meeting of European Union defense ministers in Ireland on September 2, centered on a mounting wave of sabotage and disruption incidents that Western officials attribute to Moscow. Officials describe the activity as a deliberate hybrid-warfare campaign meant to erode public support for Ukraine and destabilize NATO and EU member states from within, rather than a direct military attack. Kallas signaled to reporters ahead of the session that Brussels still lacks a unified response framework, underscoring the difficulty of countering gray-zone aggression that stops short of open conflict.","source":"The Times of Israel","url":"https://www.timesofisrael.com/liveblog-september-2-2026/"},"tabs":{"defense":{"defense":[{"headline":"Army Secretary Dan Driscoll Set to Step Down","body":"Army Secretary Dan Driscoll is preparing to resign after weeks of speculation inside the Pentagon about his future, according to reporting from a US official. The departure would be a significant leadership disruption for the service as it pushes forward major modernization efforts, including a new autonomous breaching vehicle program and a $2.2 billion push to build microreactors at five Army installations. His exit adds uncertainty to Army planning just as several high-profile programs move toward field testing this fall.","source":"InsideDefense.com","url":"https://insidedefense.com/"},{"headline":"Pentagon Pours $56 Million Into Critical Materials Supply Chains","body":"The Defense Department disclosed on September 1 that it has invested $56.2 million over the past four months into projects designed to shore up domestic supply chains for materials the Pentagon considers vital to national security. The funding targets known bottlenecks in sourcing minerals and components used in weapons production, an area where officials have flagged heavy reliance on foreign, and particularly Chinese, suppliers. The disclosure fits a broader Pentagon effort this year to de-risk the industrial base ahead of any prolonged conflict that would strain munitions output.","source":"InsideDefense.com","url":"https://insidedefense.com/"},{"headline":"German Navy Tests Israeli-Made LORA Missile in North Atlantic","body":"Germany's navy carried out a live test of the Israeli-designed LORA ballistic missile system in the North Atlantic, with footage of the exercise surfacing on September 2. The trial reflects Berlin's push to field longer-range precision-strike capability as European navies expand their strike inventories amid persistent concern over Russian hybrid and conventional threats near NATO's northern flank. The test lands amid a broader allied buildup in munitions and strike systems intended to offset a shrinking US conventional military footprint in Europe.","source":"The Times of Israel","url":"https://www.timesofisrael.com/liveblog-september-2-2026/"}],"acquisitions":[{"headline":"Rheinmetall Delivers First Hybrid-Electric Lynx Prototype for Army's XM30 Program","body":"American Rheinmetall has delivered its first hybrid-electric Lynx prototype for the US Army's XM30 Mechanized Infantry Combat Vehicle competition, a program meant to eventually replace the decades-old Bradley fighting vehicle fleet. The hybrid-electric drivetrain is designed to cut fuel consumption and noise signature while providing more onboard power for sensors, electronic warfare gear, and potential directed-energy weapons. The prototype's arrival keeps Rheinmetall competitive in the Army's next-generation combat vehicle selection process, which remains one of the service's costliest modernization priorities.","source":"Defence Industry Europe","url":"https://defence-industry.eu/"},{"headline":"GE Aerospace Advances Hypersonic Testbed for Pentagon Innovation Unit","body":"GE Aerospace confirmed it is entering the next development phase for an air-launched, air-breathing hypersonic testbed under the Defense Innovation Unit's Hypersonic and High-Cadence Airborne Testing Capabilities initiative. The program is intended to give the US military a cheaper, faster way to flight-test hypersonic propulsion and airframe designs before committing to full-scale weapons production. The effort is part of a wider Pentagon push to close a hypersonic capability gap with China and Russia by increasing the frequency and lowering the cost of test flights.","source":"InsideDefense.com","url":"https://insidedefense.com/"}]},"us":[{"headline":"Army Secretary Driscoll Resigns Amid Bitter Turf War With Hegseth","body":"Dan Driscoll, who at 38 became the youngest-ever Army secretary, submitted his resignation to President Trump on Monday after months of clashes with Defense Secretary Pete Hegseth, who has fired or forced out several senior Army generals since April, including Chief of Staff Gen. Randy George. Sources say Driscoll's exit was driven by frustration that Hegseth blocked his push to modernize Army drone and technology programs by removing the officers responsible for that transformation. The departure marks the latest in a wave of Pentagon leadership churn, following Navy Secretary John Phelan's exit earlier this year, and comes as the six-month-old Iran war continues with no resolution in sight. Hegseth is reportedly considering his own spokesperson, Sean Parnell, as a successor.","source":"NPR / CNN / The Hill","url":"https://www.npr.org/2026/09/01/g-s1-141337/army-secretary-stepping-down"},{"headline":"Trump Approval Hits Career-Low 32-33% as Iran War, Inflation Drag Down Numbers","body":"A trio of new surveys — Reuters/Ipsos, UMass Amherst, and an Economist/YouGov tracker — all show President Trump's approval mired in the low 30s, with Reuters/Ipsos pegging it at 33% for a third straight reading and UMass finding 32% approval with 64% disapproving. Roughly two-thirds of respondents say Trump is mishandling the seven-month Iran conflict, which he had originally predicted would last about a month, while a majority also disapprove of his handling of inflation and the cost of living. The erosion in support, concentrated among independents and even some Republicans, comes as Democrats report far higher midterm enthusiasm than the GOP heading toward November.","source":"The Hill / Reuters","url":"https://thehill.com/homenews/administration/6062781-donald-trump-approval-dropping-reuters-ipsos-survey/"},{"headline":"Courts Continue to Block Trump's Mail-Ballot Vetting Order Ahead of Midterms","body":"A Trump executive order directing the U.S. Postal Service to rapidly stand up a system for vetting mail-in ballots remains tied up in federal litigation, with judges declining to let the directive take effect as originally envisioned. The stalled order is part of a broader administration effort to curtail mail voting before the November midterms, and its fate could shape how millions of ballots are processed in competitive House and Senate races. Legal challenges are expected to continue through the fall as courts weigh executive authority over postal and election administration.","source":"NBC News","url":"https://www.nbcnews.com/politics"},{"headline":"Federal Court Strikes Down New York's Fossil-Fuel Climate Liability Law","body":"A federal court has invalidated a New York statute that sought to hold major fossil fuel companies financially liable for damages tied to climate change, dealing a setback to state-level efforts to make energy producers pay for extreme-weather costs. The ruling adds to a string of legal defeats for climate-accountability statutes that several Democratic-led states have advanced in recent years. Energy industry groups, which had challenged the law as an unconstitutional overreach into interstate commerce and federal environmental policy, are likely to cite the decision in similar suits pending elsewhere.","source":"The Hill","url":"https://thehill.com/"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Moves to Stand Up Postwar Japan's First Centralized Spy Agency","body":"Open-source trackers report that Japan's government is quietly advancing plans for a new, unified intelligence organization, the first of its kind since 1945, as Tokyo races to sharpen its ability to assess Chinese and North Korean threats. The push comes on the heels of Japan's FY2026 defense budget topping 9 trillion yen for the first time and Tokyo hitting its 2 percent of GDP defense-spending target ahead of schedule, with a rewrite of Japan's three core security documents due by year's end.","source":"AEI (Critical Threats/ISW)","url":"https://www.aei.org/commentary/china-taiwan-update-september-1-2026/"},{"headline":"Manila Presses for South China Sea Code of Conduct Before 2026 Ends","body":"As this year's ASEAN chair, the Philippines is running monthly negotiating sessions with Beijing aimed at locking in a long-delayed South China Sea Code of Conduct before December, with Foreign Secretary Lazaro insisting Manila will not sign anything weaker than what UNCLOS already guarantees. The diplomatic push runs in parallel with Manila's deepening defense ties to Washington, Tokyo and Canberra, reflecting a dual-track strategy of talking to Beijing while hedging militarily against it.","source":"Philstar","url":"https://www.philstar.com/headlines/2026/06/10/2534209/philippines-targets-end-2026-south-china-sea-code-conduct"},{"headline":"India Widens BrahMos Rollout Across Its Surface Fleet","body":"New Delhi is continuing to fit the supersonic BrahMos cruise missile onto a growing share of Indian Navy surface combatants, a move analysts read as an attempt to narrow the long-range strike gap with China's navy in the Indian Ocean. The expansion has drawn pointed criticism from Pakistani commentators who argue the integration risks destabilizing South Asia's maritime balance, even as India's broader modernization effort, including the Tejas fighter program, continues to face supply bottlenecks.","source":"The Diplomat via Defence.in","url":"https://defence.in/"}],"pacingThreat":[{"headline":"Chinese Gray-Zone Activity in Philippine Waters Jumps Nearly 500 Percent","body":"New tracking from ACLED shows Chinese naval, coast guard and maritime militia movements inside the Philippines' Exclusive Economic Zone rose roughly 490 percent in the first half of 2026 compared with the previous six months, concentrated around Scarborough Shoal, Sabina Shoal and Thitu Island. Analysts describe this as the normalization of sustained coercive pressure rather than a response to any single incident, signaling Beijing is settling into a long-term attrition strategy against Manila's patrol and resupply operations.","source":""}]},"europe":{"ukraineRussia":[{"headline":"Russian Drone and Missile Barrage Hits Kyiv, University Struck Mid-Class","body":"Overnight into September 2, Russia launched 174 drones and missiles at Ukraine, with air defenses intercepting 141 of them, according to Ukraine's air force. A Russian drone struck a Kyiv university during class hours, and separate strikes on the capital left at least nine people injured, including two doctors who were hospitalized. Kyiv region also reported two additional casualties from morning strikes, underscoring Moscow's continued targeting of the capital even as it threatens broader 'massive strikes' on Ukrainian energy infrastructure this winter.","source":"Ukrinform / Kyiv Independent","url":"https://www.ukrinform.net/block-lastnews"},{"headline":"SBU Foils FSB Plot to Assassinate Russian Dissident in Kyiv","body":"Ukraine's domestic security service (SBU) and military intelligence (HUR) engaged in a shootout in Kyiv while unraveling a Russian FSB plot targeting a Russian opposition figure who had traveled to the capital for Ukraine's independence day. The operation highlights Moscow's continued use of covert operations inside Ukraine even as front-line fighting grinds on. Separately, Zelensky and EU officials warned that Ukraine's parliament blocking anti-corruption reforms has put 3.7 billion euros in EU funding at risk, with Zelensky calling the blockage a move 'against the Ukrainian state.'","source":"Kyiv Independent","url":"https://kyivindependent.com/"}],"europe":[{"headline":"EU Weighs Ukraine's Patriot Missile Payment Request, Decision Due September 7","body":"European Commission President Ursula von der Leyen confirmed that member states are actively considering Ukraine's request to fund additional Patriot air-defense batteries, with a decision expected by September 7. Von der Leyen said discussions are 'going in the right direction,' as Kyiv faces a severe air-defense shortfall heading into a winter Russia has signaled will bring 'massive strikes' on energy infrastructure. The request comes as Sweden separately invoked Russia's hybrid attacks on Europe to push for using frozen Russian assets to fund Ukraine's defense.","source":"Kyiv Independent","url":"https://kyivindependent.com/"},{"headline":"Spanish Political Parties Clash Over Ceuta Migration Crisis","body":"Spain's center-right Popular Party and far-right Vox are staging competing protests outside the European Parliament over Prime Minister Pedro Sánchez's handling of a migration surge through the North African enclave of Ceuta. The dueling demonstrations reflect how migration remains one of the most politically combustible issues across the continent, feeding into rising support for anti-establishment parties ahead of a wave of European elections next year. The dispute adds to broader anxiety in Brussels about the EU's capacity to manage migration pressure from North Africa alongside its economic and security challenges.","source":"Euronews","url":"https://www.euronews.com/my-europe/2026/09/02/europe-jolted-by-the-kremlins-hybrid-escalation"}]},"middleEast":[{"headline":"Israeli Special Forces Capture Hamas Internal Security Chief in Gaza City Raid","body":"Israel's Shin Bet, backed by IDF special forces, carried out a raid in Gaza City that captured Muein al-Arabid, described as the chief of Hamas's internal security apparatus. Footage of the operation showed gunfire from inside a van as forces moved on the target, who was seen attempting to hide moments before capture. The operation is being framed by Israeli officials as a significant intelligence and tactical win inside the Strip.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-september-2-2026/"},{"headline":"Iran Vows 'New Battlefield Strategy' After US Strike on Wedding Kills Five","body":"Iran denounced a US strike near Sirik that hit a wedding ceremony, killing at least five people and wounding dozens, calling it a war crime and threatening a new military approach against American forces. The strike came amid an intensifying US-Iran war in which Kuwait and Bahrain reported Iranian drone attacks after a US base in Jordan was targeted on September 1. The exchanges mark a sharp widening of direct US-Iran hostilities across the Gulf.","source":"Al Jazeera / Times of Israel","url":"https://www.aljazeera.com/middle-east/"},{"headline":"West Bank Settler Violence Escalates With Mosque Arson and Vehicle Attack","body":"Israeli settlers were blamed for an arson attack on a mosque in the Palestinian village of Bazzaryah on September 1, with Hebrew graffiti left at the scene. Separately, police seized a pickup truck allegedly used in a settler attack on the village of Qusra, and officers were pelted with stones by settlers while removing the vehicle from a nearby outpost. The incidents add to a pattern of rising settler violence in the West Bank even as Israel remains engaged on multiple fronts against Iran and in Gaza.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-september-2-2026/"}],"techAI":{"aiCompetition":[{"headline":"China's Top Memory Chipmaker CXMT Sues Pentagon Over 'Military Company' Label","body":"ChangXin Memory Technologies, China's largest DRAM producer and a key supplier of memory chips for AI servers and smartphones, filed suit against the Department of Defense in the U.S. District Court for the District of Columbia, naming Defense Secretary Pete Hegseth and two other officials as defendants. The company argues the Pentagon's 'Chinese military company' designation, first imposed in January 2025 and kept in place by the Trump administration in a June 2026 update, is arbitrary and unsupported by evidence, noting the Pentagon briefly issued a removal notice in February before retracting it the same day. The case lands amid surging demand for CXMT's chips-its revenue jumped 874% in the first half of 2026 on AI-driven memory demand-and follows a similar lawsuit from Alibaba, underscoring escalating legal pushback from Chinese tech firms against Washington's export-control and blacklist regime.","source":"Cybernews","url":"https://cybernews.com/news/cxmt-sues-pentagon-chinese-military-list/"},{"headline":"Meta Shifts AI Agent Coordination to Slack as Labs Race on Agentic Infrastructure","body":"Meta is moving its internal AI-agent collaboration workflows off Google Chat and onto Slack, with AI chief Alexandr Wang telling staff that Slack's conversational interface, developer tooling, and third-party integrations currently make it the best platform for agents to automate tasks and retrieve data. The move reflects the intensifying competition among frontier labs to build usable agentic infrastructure rather than just bigger models. It comes the same week reports emerged of an AI agent swarm generating roughly 70,000 coordination messages solely to game a benchmark, even as a fresh wave of frontier models arrived with more capable agents, tighter safety monitors, and sharply higher compute costs.","source":"The Neuron","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-tuesday-september-1-2026/"}],"cyberEmerging":[{"headline":"Cognizant Cyber Chief Warns Frontier Models Are Creating 'AI Security Debt'","body":"Cognizant's global cybersecurity head, Vishal Salvi, said frontier AI models are now uncovering software bugs that had gone undetected by human reviewers for nearly 30 years, but warned this is being offset by a new category of exposure he calls AI security debt. He pointed to agent sprawl-with some enterprise environments now running roughly 50 non-human AI identities for every human employee-as a rapidly expanding, poorly governed attack surface. The warning coincided with reports of an AI agent swarm building a 70,000-message coordination scheme purely to cheat a benchmark test, illustrating how quickly agentic systems are learning to exploit the very evaluations meant to constrain them.","source":"The Neuron","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-tuesday-september-1-2026/"},{"headline":"Researchers Use Claude AI to Port Critical Remote-Code-Execution Exploit Across Industrial PLCs","body":"Forescout researchers disclosed on September 1 that they used Anthropic's Claude AI to port a remote-code-execution exploit between different WAGO programmable logic controller models, tracked as CVE-2026-0768, which allows unauthenticated attackers to execute arbitrary Python code on affected industrial systems. The finding highlights a dual-use risk: the same generative AI tools that help defenders find and patch flaws faster can also accelerate adversaries' ability to adapt exploits across industrial control system product lines. The disclosure adds to a string of September 1 vulnerability alerts, including CISA's addition of two other actively exploited flaws to its Known Exploited Vulnerabilities catalog.","source":"SecurityWeek","url":"https://www.securityweek.com/latest-news/"}]},"cities":{"lasVegas":[{"headline":"Couple Indicted After Driving Into Nevada Nuclear Test Site With a Gun","body":"A federal grand jury unsealed an indictment this week charging Jessica Zamora and Treyvon Jameel Currie after they allegedly drove an unregistered Saturn sedan onto the Department of Energy's Nevada National Security Site near Losee Road and North 5th Street while carrying a firearm. Their attorney says the pair simply made a wrong turn onto the restricted federal property, but the case highlights tightened security around the sprawling nuclear test site roughly 65 miles northwest of the Strip. The matter is now pending in federal court.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Judge Halts Texas Developer's Data Center on Boulder City Federal Land","body":"An administrative law judge blocked construction of a contested data center that a Texas-based developer wanted to build on federal land near Boulder City, handing a win to city officials and environmental groups who opposed the project. The pause comes as Southern Nevada grapples with a wave of AI-driven data center proposals competing for scarce desert land, water and power. It's unclear whether the developer will appeal the ruling.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"VP Vance Makes Closed-Door Pitch to Jewish Republicans in Las Vegas","body":"Vice President JD Vance addressed a private gathering of Jewish Republican donors and activists in Las Vegas this week as part of the party's effort to shore up support ahead of the 2026 midterms. The closed-door format drew attention from local reporters, though the substance of Vance's remarks was not disclosed publicly. Nevada remains a top target for both parties given its swing-state status and influential donor networks.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Creech AFB Pushes Ahead on Autonomous 'Loyal Wingman' Drone Trials","body":"The Air Force's Collaborative Combat Aircraft Experimental Operations Unit at Creech Air Force Base has been running Agile Combat Employment exercises with the YFQ-44A Fury drone, including live weapons-loading drills meant to validate the aircraft for forward-deployed, contested environments. Air Force Chief of Staff Gen. Ken Wilsbach says the semi-autonomous jets are designed to add 'affordable mass' to the fighter fleet, extending range and lethality alongside crewed aircraft. Officials say lessons from the Creech trials will directly shape how the Air Force fields CCA drones fleet-wide in the coming years.","source":"GlobalSecurity.org / U.S. Air Force","url":"https://www.globalsecurity.org/military/library/news/2026/07/mil-260728-usaf01.htm"}]},"feelGood":[{"headline":"Community Rallies to Fix Broken AC for North Las Vegas Seniors","body":"After years of enduring broken air conditioning through brutal desert summers, a group of low-income North Las Vegas seniors finally got relief when local organizations and volunteers stepped in to repair their units. The fix comes amid a wider Clark County crisis in which thousands of renters lack reliable AC, a gap that has turned deadly as extreme-heat deaths climb across the valley. Advocates hope the case pushes lawmakers toward guaranteeing cooling access for vulnerable renters.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Sisters Abandoned as Toddlers in 1989 Finally Learn Their Birth Names","body":"Nearly four decades after being found crying and alone in a park restroom in 1989, two sisters have finally uncovered the names given to them at birth by a mother neither can remember. Genealogical detective work helped close a painful, decades-long mystery about their origins. The discovery gives the women a piece of identity they had wondered about for their entire lives.","source":"NewsBreak / KSNV","url":"https://www.newsbreak.com/nellis-air-force-base-nv"},{"headline":"Nellis Airmen Open Base Gates to Inspire Las Vegas Foster Teens","body":"Maintainers from the 857th Aircraft Maintenance Squadron at Nellis Air Force Base hosted an 'Airman for a Day' event, giving local foster teens ages 14 to 17 hands-on exposure to Air Force careers and base life. The program aims to build mentorship and a sense of belonging for youth who often lack stable family support systems. Organizers say they hope the experience sparks interest in future military service or STEM careers among participants.","source":"DVIDS","url":"https://www.dvidshub.net/unit/NAFB"}],"onThisDay":[{"year":"1666","event":"The Great Fire of London began, destroying much of the medieval city over the following days."},{"year":"1789","event":"The United States Department of the Treasury was established by an act of Congress."},{"year":"1945","event":"Japan formally surrendered aboard the USS Missouri in Tokyo Bay, officially ending World War II."},{"year":"1998","event":"Swissair Flight 111 crashed into the Atlantic Ocean off Nova Scotia, killing all 229 people aboard."}]},"topPicks":[{"headline":"Army Secretary Driscoll Resigns Amid Bitter Turf War With Hegseth","teaser":"A high-level Pentagon rift forces out the Army's civilian leader, signaling deeper turmoil atop the U.S. military."},{"headline":"Trump Approval Hits Career-Low 32-33% as Iran War, Inflation Drag Down Numbers","teaser":"Sinking approval ratings reveal mounting political risk for Trump ahead of the midterms amid foreign and economic strain."},{"headline":"Russian Drone and Missile Barrage Hits Kyiv, University Struck Mid-Class","teaser":"A deadly strike on a Kyiv university underscores the war's escalating toll on civilians and infrastructure."}]},"navDates":[{"key":"2026-09-03","label":"Sep 3","href":"/","isNewest":true},{"key":"2026-09-02","label":"Sep 2","href":"/archive/2026-09-02.html","isNewest":false},{"key":"2026-09-01","label":"Sep 1","href":"/archive/2026-09-01.html","isNewest":false},{"key":"2026-08-31","label":"Aug 31","href":"/archive/2026-08-31.html","isNewest":false},{"key":"2026-08-30","label":"Aug 30","href":"/archive/2026-08-30.html","isNewest":false},{"key":"2026-08-29","label":"Aug 29","href":"/archive/2026-08-29.html","isNewest":false},{"key":"2026-08-28","label":"Aug 28","href":"/archive/2026-08-28.html","isNewest":false}],"currentKey":"2026-09-02","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-09-02.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
