<script>
const STATE = {"digest":{"date":"Saturday, August 22, 2026","generatedAt":"Sat, Aug 22, 5:30 AM PDT","breaking":{"headline":"Trump Calls Iran War a 'Little Detour' as Treasury Preps Sweeping New Sanctions","body":"President Trump downplayed the nearly six-month-old U.S.-Israel war with Iran on August 22, calling it a 'little detour' even as his administration prepares a new sanctions wave that officials are calling an 'Economic D-Day,' with Treasury Secretary Scott Bessent set to detail the measures Monday. Iran and its top trading partner China are pushing back on any harsher steps, while shipping through the Strait of Hormuz remains stuck at roughly 20 percent of pre-war levels and U.S. pump prices are running about a dollar a gallon higher than a year ago. The conflict, which began February 28 with strikes that killed Iran's supreme leader and other officials, has now shifted from active combat toward a prolonged economic pressure campaign with global energy ripple effects.","source":"CNN","url":"https://www.cnn.com/2026/08/22/world/live-news/iran-war-trump"},"tabs":{"defense":{"defense":[{"headline":"Pentagon Threatens Funding Cuts to 30 Universities Over Foreign Ties","body":"The Department of War has directed roughly 30 universities, including Harvard, Yale and Stanford, to review and sever foreign academic partnerships it deems a national security risk or face a cutoff of federal funding. The move, disclosed August 21, extends the administration's broader campaign to police foreign influence on U.S. campuses into the defense research space. It could affect billions in Pentagon-funded research grants tied to schools with extensive international academic exchange programs.","source":"Aerotech News & Review","url":"https://www.aerotechnews.com/blog/2026/08/21/headlines-august-21-3/"},{"headline":"DOD Reports Over 750 Americans Wounded, $37.5 Billion Spent in Iran War","body":"The Defense Department disclosed August 21 that more than 750 U.S. service members and personnel have been wounded since the war with Iran began in late February. The Pentagon separately pegged the direct financial cost of the military campaign at $37.5 billion, a figure that is climbing as operations continue in the Gulf and around the Strait of Hormuz. The disclosure gives the clearest public accounting yet of the human and fiscal toll of the nearly six-month conflict.","source":"FDD Overnight Brief","url":"https://www.fdd.org/overnight-brief/august-21-2026/"},{"headline":"US Navy Leads 12-Nation NATO Push for New SeaSparrow Missile Variant","body":"The U.S. Navy is spearheading a multinational effort to develop an upgraded version of the Evolved SeaSparrow air-defense missile for use across the 12-nation NATO SeaSparrow Project Office consortium. A Navy sources-sought notice issued this week sets an October 19 deadline for industry responses, signaling the start of a formal acquisition push. The initiative reflects continued allied integration on shipboard air-defense systems following NATO's Ankara Summit commitments to expand joint procurement and industrial cooperation.","source":"Defense News via FDD","url":"https://www.fdd.org/overnight-brief/august-21-2026/"}],"acquisitions":[{"headline":"Pentagon Awards FedEx, UPS $5.7 Billion Combined in New Shipping Contracts","body":"The Defense Department handed out roughly $5.7 billion in logistics contracts this week, with FedEx and UPS each receiving awards valued at nearly $2.73 billion and Polar Air Cargo picking up a $272.5 million contract. The deals underscore how heavily the Pentagon leans on commercial carriers to move military cargo amid sustained operational tempo tied to the Iran war and Indo-Pacific posture. The awards were disclosed August 21 as part of the department's routine daily contracts release.","source":"ClearanceJobs","url":"https://news.clearancejobs.com/2026/08/21/boeings-vc-25b-contract-climbs-to-4-49b-with-new-75m-award/"},{"headline":"Navy Modifies Contract for Tactical Tomahawk Warhead Production","body":"The Navy added scope to an existing contract for production of 559 WDU-36/B warhead cases and 559 fuzewells for RGM/UGM-109E Tactical Tomahawk missiles, obligating just over $41.5 million in fiscal 2026 weapons procurement funds. Work will be performed primarily in Anniston, Alabama, with a small share in Houston, Texas, and is scheduled for completion by April 2028. The award, issued through Naval Air Warfare Center Weapons Division at China Lake, reflects the Navy's push to rebuild Tomahawk stockpiles after sustained expenditure in recent Middle East operations.","source":"ClearanceJobs","url":"https://news.clearancejobs.com/2026/08/21/boeings-vc-25b-contract-climbs-to-4-49b-with-new-75m-award/"}]},"us":[{"headline":"Supreme Court Lets Trump Push Ahead With Controversial White House Ballroom","body":"Chief Justice John Roberts issued a stay on Friday freezing a lower-court injunction that would have halted above-ground construction on Trump's roughly $300-400 million White House ballroom, built over the demolished East Wing. The order is provisional, giving the justices more time to weigh the administration's request to pause rulings from Judge Richard Leon and a 2-1 D.C. Circuit panel that found the project unlawful without congressional authorization. Solicitor General D. John Sauer argued the halt would jeopardize 'the President's safety, the continuity of government, and the separation of powers,' while the National Trust for Historic Preservation, which sued over the demolition, said the fight over legality continues. Trump touted the crew working 20-hour days as being 'under budget and ahead of schedule.'","source":"NBC News / CBS News","url":"https://www.nbcnews.com/politics/supreme-court/supreme-court-trump-white-house-ballroom-rcna592899"},{"headline":"FBI Seizes Devices, Raids Home of Former Rep. Eric Swalwell in Sexual Assault Probe","body":"Federal agents served a search warrant on former Rep. Eric Swalwell at San Francisco International Airport on Saturday, seizing his iPhone and MacBook Pro, then searched his Washington home the following day as part of a federal civil-rights investigation into sexual assault allegations. At least four women have reportedly been contacted by the FBI, and Swalwell also faces separate inquiries from the Manhattan District Attorney's Office and Los Angeles Sheriff's Department. The raids follow his April resignation from Congress and withdrawal from California's governor's race amid the allegations, and come days after the White House declassified documents describing his past 'physical relations' with a suspected Chinese operative.","source":"NBC News / CNN","url":"https://www.nbcnews.com/politics/justice-department/fbi-searches-former-rep-eric-swalwells-home-seizes-electronic-devices-rcna593574"},{"headline":"U.S. National Debt Crosses $40 Trillion, Months Ahead of Forecasts","body":"The federal government's total debt has topped $40 trillion, a threshold analysts previously projected wouldn't be reached for several more months, underscoring the fiscal strain from elevated interest costs and continued deficit spending. Vice President JD Vance said Treasury Secretary Scott Bessent has a 'very discreet plan' to begin shrinking the debt, though no formal proposal has been detailed publicly. The milestone lands amid separate White House trade fights, including threatened tariffs of up to 50% on Canada, that could further complicate the fiscal picture heading into the 2026 midterms.","source":"NPR","url":"https://www.npr.org/2026/08/21/nx-s1-5941106/the-news-roundup-for-august-21-2026"},{"headline":"Democratic Socialist Angie Nixon Scores Major Upset Over Vindman in Florida Senate Primary","body":"Florida state Rep. Angie Nixon defeated retired Lt. Col. Alexander Vindman, the former National Security Council official known for his impeachment-era testimony, by more than 12 points in the state's Democratic U.S. Senate primary. The result marks one of the most significant primary upsets of the 2026 midterm cycle and signals continued strength for the party's progressive wing over establishment-aligned, national-security-credentialed recruits. The race unfolded alongside a chaotic primary season in Florida that has already seen incumbent GOP Rep. Cory Mills ousted in his own primary.","source":"NPR / 1A","url":"https://www.npr.org/2026/08/21/nx-s1-5941106/the-news-roundup-for-august-21-2026"}],"pacific":{"pacificCommand":[{"headline":"Japan, India Elevate Ties Into Defense-Industrial Partnership","body":"Japanese Defense Minister Shinjiro Koizumi met his Indian counterpart Rajnath Singh in New Delhi on August 20, in talks that could mark the start of a structural shift from bilateral diplomacy into a cross-border defense-industrial framework. Tokyo is seeking to build greater domestic production capacity and reduce reliance on US supply chains, while both capitals are hedging against Beijing's accelerating revisionism and unpredictable swings in Washington's foreign policy. The meeting builds on New Delhi's parallel outreach to Seoul and Canberra as India diversifies its Indo-Pacific defense partnerships.","source":"Asia Times","url":"https://asiatimes.com/2026/08/defense-minister-talks-are-bigger-than-just-india-and-japan/"},{"headline":"Manila Moves to Enshrine South China Sea Claims in School Curriculum","body":"Philippine lawmakers filed a bill this month to institutionalize education on what Manila calls the West Philippine Sea, aiming to lock in public and political support for its maritime claims regardless of future changes in government. The measure follows a year of repeated confrontations with Chinese coast guard and militia vessels near Scarborough Shoal and Second Thomas Shoal, and reflects a Philippine calculation that winning the long-term battle of public perception is as important as naval patrols. Analysts note the approach is meant to keep Manila's negotiating position from softening over time as sea disputes drag on without resolution.","source":"Radio Free Asia via GlobalSecurity.org","url":"https://www.globalsecurity.org/military/library/news/2026/08/mil-260819-rfa01.htm"},{"headline":"Pakistan Fields Chinese LD-2000 Air-Defense System Aimed at India","body":"Regional defense trackers reported this week that Pakistan has begun integrating China's LD-2000 close-in weapons system into its layered air-defense network, a move seen as a notable shift in Islamabad's posture against Indian air and missile threats. The deployment highlights deepening Pakistan-China military-industrial cooperation at the same time New Delhi is accelerating its own defense partnerships with Tokyo, Seoul, and Canberra. The development adds another marker to the broader arms competition unfolding across South Asia and the wider Indo-Pacific.","source":"Defence Security Asia","url":"https://defencesecurityasia.com/en/home/"}],"pacingThreat":[{"headline":"PLA Live-Fire Drills Rehearse Strikes on US Missile Defenses, Humvees","body":"A US Army think tank report published August 21 disclosed that Chinese army aviation units carried out coordinated drone-and-laser-guided attack helicopter drills in June, using laser designators to direct 70mm rockets and KD-9 precision munitions against mock Patriot PAC-3 launchers and Humvees. The Army's China Land Power Studies Center said the exercises rehearse a key war-fighting skill needed in the opening phase of any assault on Taiwan, specifically suppressing US-supplied air-defense systems. The disclosure lands against the backdrop of intelligence assessments that Xi Jinping has directed the PLA to be ready for a potential move against Taiwan by 2027.","source":"The Washington Times","url":"https://www.washingtontimes.com/news/2026/aug/21/chinese-military-practices-strike-us-missile-defenses-humvees/"},{"headline":"China's Defense Chief Courts Indonesia in Regional Outreach Push","body":"Chinese Defense Minister Dong Jun met Indonesian counterpart Sjafrie Sjamsoeddin in Jakarta on August 21 for the second China-Indonesia joint foreign-and-defense ministerial dialogue, part of Beijing's broader effort to court Southeast Asian militaries even as it presses contested claims elsewhere in the region. The meeting follows a joint China-Indonesia naval navigation exercise conducted earlier this month in waters east of Taiwan, showing how Beijing pairs diplomatic engagement with displays of naval reach near the island. China's defense ministry simultaneously kept up rhetoric branding Japan's military buildup as 'neo-militarism' warranting vigilance.","source":"Ministry of National Defense, People's Republic of China","url":"http://eng.mod.gov.cn/"},{"headline":"Watchdog Tracks Escalating PLA Pressure and Cognitive Warfare Against Taipei","body":"An August 18 update from war-monitoring analysts catalogs continuing PLA pressure operations, maritime confrontations, and disinformation efforts aimed at eroding Taiwanese public confidence, describing a sustained 'short-of-war' coercion campaign rather than any single dramatic incident. The assessment follows Taiwan's largest-ever annual Han Kuang defense exercises held August 10, which simulated a 10-day response to a Chinese invasion including chemical-attack scenarios and live-fire drills modeled on US military practices. Together the reports point to parallel tracks of Taiwanese military preparation and Chinese gray-zone pressure intensifying through the summer.","source":"Center for Foreign Interference Research","url":"https://foreigninterference.org/post/china-taiwan-military-and-cognitive-warfare-update-august-18-2026"}]},"europe":{"ukraineRussia":[{"headline":"Russian Ballistic Missiles Rock Kyiv as Deadly Strikes Hit Multiple Regions","body":"Russia launched ballistic missiles at Kyiv early Saturday, triggering explosions just minutes after air raid sirens sounded across the capital. Separately, nationwide Russian strikes on August 22 killed at least seven people and wounded 31, including a hit on a border crossing with Moldova, while Ukrainian air defenses intercepted or suppressed three surface-to-air missiles, six cruise missiles and 182 drones. Kyiv's General Staff also reported Russian losses have reached 1,475,270 troops since February 2022, including 1,240 casualties in the past day alone.","source":"Kyiv Independent","url":"https://kyivindependent.com/"},{"headline":"ISW: Kremlin Rejects Talks as North Korean Drone Operators Arrive in Kursk","body":"The Institute for the Study of War reported August 21 that a senior Russian official reaffirmed Moscow's refusal to pursue meaningful negotiations to end the war, even as Ukrainian forces struck Russian military airfields and oil infrastructure and Russia fired 135 long-range strike drones at Ukraine. Separately, North Korea has reportedly sent drone operators into Russia's Kursk Oblast to support Moscow's war effort, giving Pyongyang's forces hands-on experience with modern drone warfare. ISW also noted Western intelligence concerns that Vladimir Putin could next target Moldova as part of a broader strategy to destabilize NATO and the EU.","source":"Kyiv Post / ISW","url":"https://www.kyivpost.com/post/82867"}],"europe":[{"headline":"NATO Steps Up Vigilance After Wave of Airspace Violations and Drone Incidents","body":"NATO's North Atlantic Council convened to condemn a spate of recent airspace violations in Poland and Romania alongside a series of drone incidents across allied territory, expressing full solidarity with the affected member states. The alliance's heightened posture follows NATO jets shooting down a stray drone over Latvia and a thwarted Russian plot to kill a Ukrainian-American citizen uncovered by Polish authorities, part of what officials describe as an intensifying campaign of sabotage and hybrid attacks against Europe.","source":"NATO / Bloomberg","url":"https://www.nato.int/en"},{"headline":"EU Migration Strains Deepen as Ceuta Fallout Fuels Political Rift","body":"The aftershocks of the mass migrant surge into Spain's Ceuta enclave, where roughly 60,000-72,000 people crossed from Morocco in a matter of days and at least 72 died attempting the journey, continue to roil European politics. Italy's Giorgia Meloni, joined by Finland, Austria, Sweden, Denmark and the Czech Republic, has pushed to suspend Spain from the Schengen zone, while Rome has reimposed border checks despite Ceuta lying outside the free-movement area. The episode has reignited EU-wide recriminations reminiscent of the 2015 migration crisis, with critics warning it exposes deep fractures in Europe's border and asylum policy.","source":"The Conversation / Al Jazeera","url":"https://theconversation.com/after-ceuta-europe-is-once-again-mired-in-migration-chaos-of-its-own-making-289017"}]},"middleEast":[{"headline":"Israel-Turkey Rift Deepens After Erdogan Seeks Netanyahu's Arrest","body":"Israel-Turkey relations hit a new low Saturday after Netanyahu's office branded Erdogan an 'antisemitic dictator' in response to Turkey's push for the Israeli premier's arrest. A senior US envoy separately warned that a recent Israeli strike in Syria nearly triggered a direct military confrontation with Turkey, underscoring how the collapse in ties since the October 7, 2023 attack has raised the risk of a wider regional clash.","source":"Haaretz / Times of Israel","url":"https://www.haaretz.com/israel-news/israel-security/2026-08-22/ty-article-live/u-s-envoy-barrack-israeli-strike-in-syria-could-have-led-to-war-with-turkey/000001a0-2762-d129-a3ba-676ae4a50000"},{"headline":"Israel Strikes Syria and Gaza as Regional Criticism Mounts","body":"The Israeli military confirmed a drone strike in southern Syria on August 22 targeting an operative it said was in the final stages of planning an attack, while a separate Israeli drone strike killed a man in a central Gaza home the same day. Turkey, Egypt and Qatar have condemned the recent wave of Israeli strikes in Gaza, arguing they are undermining fragile regional efforts to implement a broader peace plan for the territory.","source":"Haaretz / Jerusalem Post","url":"https://www.jpost.com/middle-east"},{"headline":"West Bank Tensions Rise Amid Settler Violence and Economic Collapse","body":"Israeli military officials have privately warned that the West Bank is nearing a dangerous escalation point due to a surge in settler violence, including recent arson attacks near Hebron that damaged Palestinian property in the Yatta area. Compounding the volatility, unemployment, slashed public salaries and a strained healthcare system are deepening an economic crisis in the West Bank under continued Israeli restrictions, according to reporting cited by regional outlets.","source":"Times of Israel / Jerusalem Post","url":"https://www.timesofisrael.com/liveblog-august-21-2026/"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Reportedly Lines Up Blockbuster IPO as Revenue Run-Rate Hits $65B","body":"Anthropic is said to be preparing for what could become one of the largest IPOs in tech history, with reporting this week putting its July revenue run-rate at roughly $65 billion, well ahead of OpenAI's comparable figures. The disclosure comes as OpenAI's own growth has reportedly stalled, with 2025 revenue of $13.07 billion against a $20.9 billion loss and a negative 122% operating margin in Q1 2026, intensifying scrutiny of the two labs' diverging trajectories. For a Las Vegas-based reader watching compute and capital concentration, the gap underscores how unevenly the AI funding boom is distributing itself even among the largest players.","source":"Tech Startups / AI to ROI","url":"https://techstartups.com/2026/08/21/top-tech-news-today-august-21-2026-anthropic-apple-broadcom-google-nvidia-openai-tesla-more/"},{"headline":"xAI's Grok 4.6 Undercuts Rivals on Price While Matching Frontier Benchmarks","body":"SpaceX-backed xAI rolled out Grok 4.6 this week, with independent evaluator Artificial Analysis scoring it around 61 on its Intelligence Index, putting it roughly on par with OpenAI's GPT-5.6 Sol, particularly on agentic tasks. Notably, Grok 4.6 is priced at $2 per million input tokens and $6 per million output tokens, more than 60% cheaper than comparable offerings from Anthropic and OpenAI. The pricing move could accelerate a margin squeeze across frontier labs just as several, including OpenAI and Anthropic, face heightened public-market scrutiny over their cost structures.","source":"MarketingProfs (AI Update)","url":"https://www.marketingprofs.com/opinions/2026/55655/ai-update-august-21-2026-ai-news-and-views-from-the-past-two-weeks"}],"cyberEmerging":[{"headline":"Startup Data Shows AI Attackers Beating AI Defenders 88% to 12%","body":"Corma, billed as the first frontier AI lab focused purely on defensive cybersecurity, announced a $60 million seed round led by Sequoia Capital with Khosla Ventures and Coatue joining, and says it is already deployed at Fortune 100 clients. In its own simulations pitting models like GPT and Claude against each other, Corma found AI-driven attackers succeeded 88% of the time while AI-driven defenders caught only 12% of intrusions, illustrating a widening offense-defense gap. The company claims its tools have cut client threat-response times by over 94% since launching six weeks ago, a data point likely to fuel Pentagon and critical-infrastructure interest in autonomous cyber defense.","source":"The AI Insider","url":"https://theaiinsider.tech/2026/08/20/corma-the-first-frontier-defensive-cybersecurity-ai-lab-raises-60m-as-ai-supercharges-attackers/"},{"headline":"Jailbroken Frontier Models Now Sold to Criminals for $12.99 a Month","body":"New research flagged by Forbes this week found cybercriminal storefronts such as Kriminal.ai are offering access to jailbroken versions of frontier models, including xAI's Grok, for as little as $12.99 a month, sharply lowering the barrier to AI-assisted hacking. Separately, threat-intelligence firm Threatdown documented criminals actively weaponizing mainstream frontier models for cybercrime rather than relying on bespoke malicious tools. The trend adds urgency to Washington's efforts to stand up an AI cybersecurity clearinghouse and export controls on powerful models, since commodified jailbreak access effectively erases the cost advantage nation-state actors once had over independent criminal groups.","source":"Forbes","url":"https://www.forbes.com/topics/ai-cybersecurity/"}]},"cities":{"lasVegas":[{"headline":"Five Injured, Fire Trucks Struck in I-15 Hit-and-Run Near Jean","body":"A hit-and-run crash on southbound Interstate 15 near Jean left five people injured after the fleeing vehicle struck Clark County fire trucks that had responded to the scene. The incident triggered major traffic delays and partial highway closures in the area south of Las Vegas. Nevada Highway Patrol is continuing to search for the driver responsible.","source":"Fox5 Vegas","url":"https://www.fox5vegas.com/news/"},{"headline":"Stabbing Victim Found in Vacant Lot on Hinkle Drive","body":"Las Vegas police are investigating after a man was discovered stabbed in a vacant lot on Hinkle Drive Saturday night. Detectives have not yet released details on a suspect or motive as the case remains active. It is one of several violent-crime investigations LVMPD opened this weekend.","source":"Fox5 Vegas","url":"https://www.fox5vegas.com/news/"},{"headline":"Henderson Little League Team Rallies Past Ohio in Rescheduled Opener","body":"Henderson's Paseo Verde Little League squad opened its rescheduled 2026 Little League Baseball World Series run with a dramatic 6-5 comeback win over Ohio. The victory keeps the Nevada team alive in the tournament bracket and has energized local fans following the club's postseason run. Community watch parties around the valley cheered the late-inning finish.","source":"Fox5 Vegas","url":"https://www.fox5vegas.com/news/"}],"nellis":[{"headline":"Collaborative Combat Aircraft Drones Ramp Up Testing at Creech AFB","body":"The Air Force's Collaborative Combat Aircraft Experimental Operations Unit at Creech Air Force Base is accelerating flight testing of the YFQ-42A and YFQ-44A autonomous 'loyal wingman' drones, treating the base as an operational laboratory for tactics rather than just a testbed for new airframes. Recent weapons-loading exercises on the Creech flight line, conducted in July, are meant to validate concepts of employment before handing lessons to operational squadrons. The push reflects the Air Force's broader shift toward a distributed combat system pairing crewed fighters with autonomous drones over contested airspace, with a dedicated CCA test-and-training unit also being stood up at Creech.","source":"Army Recognition / Aviation Week","url":"https://www.armyrecognition.com/news/aerospace-news/2026/u-s-air-force-accelerates-collaborative-combat-aircraft-testing-for-operational-readiness"}]},"feelGood":[{"headline":"Fisherman Found Alive After 15 Days Lost in Underwater Cave","body":"A fisherman who vanished inside an unexplored underwater cave system in Mexico was located alive more than two weeks later, after specialist cave divers repeatedly pushed into the darkness rather than abandon the search. Rescuers credited persistence and technical cave-diving expertise for the survival, which stunned even veteran search teams. The man is now recovering after an ordeal that outside experts had feared was unsurvivable.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Idaho Teens Turn Viral Summer Videos Into a River Cleanup Mission","body":"A group of Idaho teenagers who spent the summer posting videos together built a large online following and decided to redirect that attention toward cleaning up the Boise River. What began as a fun social-media project evolved into an organized community effort to pull trash from the waterway. Their story shows how youthful enthusiasm and social platforms can be channeled into tangible local environmental good.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Man Meets Father He Prayed For After Decades Apart","body":"Joshua Schneeloch, who spent 19 years growing up in a German Catholic orphanage without knowing why his family never came for him, was finally reunited with his biological father decades later. The emotional meeting closed a lifelong chapter of uncertainty and longing for connection. His story has resonated widely as a testament to persistence in searching for identity and family.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1864","event":"The first Geneva Convention was signed, establishing the International Committee of the Red Cross and international humanitarian law."},{"year":"1902","event":"The Cadillac Automobile Company was founded in Detroit, Michigan."},{"year":"1911","event":"The theft of the Mona Lisa from the Louvre in Paris was discovered."},{"year":"1978","event":"Kenyan founding president Jomo Kenyatta died in office."}]},"topPicks":[{"headline":"Trump Calls Iran War a 'Little Detour' as Treasury Preps Sweeping New Sanctions","teaser":"New sanctions signal escalating US-Iran tensions even as the administration downplays the conflict's significance."},{"headline":"U.S. National Debt Crosses $40 Trillion, Months Ahead of Forecasts","teaser":"The debt milestone arrives faster than projected, raising fresh alarms about long-term fiscal sustainability."},{"headline":"Russian Ballistic Missiles Rock Kyiv as Deadly Strikes Hit Multiple Regions","teaser":"Widespread missile strikes underscore the war's continued intensity as diplomatic talks remain stalled."}]},"navDates":[{"key":"2026-08-27","label":"Aug 27","href":"/","isNewest":true},{"key":"2026-08-26","label":"Aug 26","href":"/archive/2026-08-26.html","isNewest":false},{"key":"2026-08-24","label":"Aug 24","href":"/archive/2026-08-24.html","isNewest":false},{"key":"2026-08-23","label":"Aug 23","href":"/archive/2026-08-23.html","isNewest":false},{"key":"2026-08-22","label":"Aug 22","href":"/archive/2026-08-22.html","isNewest":false},{"key":"2026-08-20","label":"Aug 20","href":"/archive/2026-08-20.html","isNewest":false},{"key":"2026-08-19","label":"Aug 19","href":"/archive/2026-08-19.html","isNewest":false}],"currentKey":"2026-08-22","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-22.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
