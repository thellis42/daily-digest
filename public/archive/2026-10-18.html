<script>
const STATE = {"digest":{"date":"Sunday, October 18, 2026","generatedAt":"Sun, Oct 18, 6:17 AM PDT","breaking":{"headline":"Iran names new defense minister, sets six-day deadline on Hormuz plan amid fresh threats to US and Israel","body":"Iran's parliament confirmed Mehrdad Akhlaghi Ketabchi as the new defense minister on October 18, replacing the official who had served in an interim capacity since predecessor Aziz Nasirzadeh was killed in a US-Israeli strike in February. The same day, Tehran pressed Washington to accept a proposal to reopen the Strait of Hormuz within six days, even as the secretary of Iran's Supreme National Security Council issued fresh threats against Israel and the United States. The overlapping moves underscore how fragile the post-war footing in the Gulf remains and keep open the possibility of renewed US-Iran confrontation just as a new Israeli election cycle begins.","source":"Jerusalem Post","url":"https://www.jpost.com/middle-east/iran-news/2026-10-18/live-updates-911999"},"tabs":{"defense":{"defense":[{"headline":"USS Theodore Roosevelt reaches Japan as carrier fleet resets after Iran combat deployment","body":"The carrier USS Theodore Roosevelt, flagship of Carrier Strike Group 9, docked in Yokosuka on October 17 after a 19-day transit from San Diego, becoming the first visiting US carrier in Japan in four years ahead of the bilateral exercise Keen Sword. At the same time, USS Abraham Lincoln returned home after an almost eleven-month deployment that included Operation Epic Fury strikes that destroyed Iran's conventional navy, while USS George H.W. Bush left a Thailand port call to resume operations in the 5th Fleet area. The rotations illustrate the Navy's continued strain of sustaining two-carrier presence in the Middle East while pivoting attention back to the Indo-Pacific.","source":"The War Zone (TWZ)","url":"https://www.twz.com/sea/where-are-the-aircraft-carriers-october-17-2026"},{"headline":"Army stands up new Arctic sustainment brigade for 11th Airborne Division","body":"The US Army activated a dedicated sustainment brigade for its Alaska-based 11th Airborne Division, giving the Arctic-focused unit its own logistics formation for the first time. The move, announced October 17, is meant to improve the division's ability to operate independently in extreme cold-weather conditions as competition with Russia and China intensifies in the High North. It reflects a broader Pentagon push to harden Arctic basing and sustainment as adversaries expand their own polar military activity.","source":"Defence Blog","url":"https://defence-blog.com/u-s-armys-arctic-division-gets-its-own-supply-brigade"},{"headline":"Belgium raises F-16 transfer pledge to Ukraine to 10 jets by year's end","body":"Belgian Prime Minister Bart De Wever confirmed on October 16 that Belgium will deliver 10 F-16 fighter jets to Ukraine by the end of 2026, up from an earlier commitment of seven, as incoming F-35s free up the older airframes. De Wever said the jets are needed partly to help Ukraine counter Russia's faster jet-powered Geran-series attack drones, with talks also underway to include Belgian-made 20mm cannon ammunition to conserve scarcer AIM-9 and AIM-120 missile stocks. Belgium's broader plan still calls for transferring up to 53 F-16s to Kyiv through 2029.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/aerospace-news/2026/belgium-to-transfer-10-f-16-fighter-jets-to-ukraine-to-counter-russias-fastest-jet-powered-drones"}],"acquisitions":[{"headline":"Little-known startup lands slot in Army's drone-interceptor fly-off","body":"A roughly one-year-old startup has won a place in the US Army's ongoing fly-off competition for low-cost interceptors designed to knock down enemy drones, part of the service's broader push to field cheaper counter-UAS weapons. The selection, reported October 17, reflects the Army's effort to diversify its industrial base beyond traditional primes as it races to build an affordable interceptor layer against drone and cruise-missile threats. Details on contract value were not disclosed, but the award fits into the Army's wider 2026 initiative to field new affordable interceptors against drones and cruise missiles.","source":"Defence Blog","url":"https://defence-blog.com/year-old-startup-wins-spot-in-u-s-army-interceptor-fly-off"},{"headline":"Navy awards Boeing up to $80 million to upgrade MQ-25 refueling drone","body":"The US Navy has given Boeing a contract worth as much as $80 million to improve the MQ-25 Stingray, the carrier-based unmanned refueling drone central to extending the reach of carrier air wings. The award, disclosed October 17, builds on the program's push toward operational fielding as the Navy integrates unmanned platforms more deeply into carrier strike group operations. It follows the Navy's recent confirmation of its first operational deployment of an unmanned surface vessel alongside a carrier strike group.","source":"Defence Blog","url":"https://defence-blog.com/u-s-navy-gives-boeing-up-to-80m-to-improve-mq-25-drone"}]},"us":[{"headline":"'No Kings: Vote Early' Rallies Sweep the Country Ahead of Midterms","body":"Indivisible and allied groups staged a fourth wave of nationwide 'No Kings' demonstrations on October 17, with events planned across more than 30 states from Arizona to Virginia, explicitly tying this round to encouraging early voting rather than waiting for the November 3 midterms. Crowds gathered at sites like the Lincoln Memorial and in cities such as New York and Chicago, where organizers reframed the slogan around turnout, arguing that every day of early balloting should be treated as election day itself. The rallies mark the movement's largest mobilization since the original June 2025 protests, with organizers again casting Trump administration policies as authoritarian overreach.","source":"The Hill / Wikipedia","url":"https://thehill.com/homenews/state-watch/6155983-no-kings-coalition-action-protests/"},{"headline":"GOP Congresswoman's Ad Rebukes Trump on Immigration, Exposing Latino-Vote Jitters","body":"Florida Republican Rep. Maria Elvira Salazar released a campaign ad this weekend directly telling President Trump he has 'gone too far' on immigration enforcement, an unusually blunt break from a sitting GOP lawmaker. The move underscores rising anxiety inside the party that recent gains with Latino voters could be jeopardized by aggressive deportation tactics heading into the midterms. Salazar's ad is seen as an early signal of a broader fissure among Republicans in competitive, Hispanic-heavy districts.","source":"NPR","url":"https://www.npr.org/sections/news/"},{"headline":"Musk Emerges as Major Financial Backer in Texas Senate Race","body":"New reporting over the weekend highlights billionaire Elon Musk's deepening financial involvement in bolstering Republican prospects in the competitive Texas Senate contest. The spending push comes as national GOP strategists look to shore up vulnerable seats three weeks before the November 3 midterms. Musk's continued political spending adds to scrutiny over the outsized role of billionaire donors in this election cycle.","source":"ABC News","url":"https://abcnews.com/politics"},{"headline":"Campaign Ad-Rate Fight at Supreme Court Still Unresolved Weeks Before Midterms","body":"A high-stakes legal battle over whether political parties can access the same discounted broadcast ad rates reserved for individual candidates remains unresolved after a divided 4th Circuit panel ruled 2-1 for Democratic candidates, with Judge Robert King writing that federal law unambiguously limits the favorable rates to candidates' personal use. Chief Justice John Roberts issued an administrative stay of that October 7 judgment on October 8, freezing the lower court's mandate while the full Court considers emergency applications from the FCC, the NRCC and the NRSC. The dispute, which has already bounced between the appeals court and the justices multiple times this cycle, carries real financial stakes for campaigns racing to lock in ad buys before November 3.","source":"SCOTUSblog / Washington Examiner","url":"https://www.scotusblog.com/2026/10/justices-grant-trump-administrations-request-to-pause-lower-court-ruling-in-political-ad-rate-di/"}],"pacific":{"pacificCommand":[{"headline":"Theodore Roosevelt Carrier Strike Group Pulls Into Yokosuka Ahead of Keen Sword","body":"The USS Theodore Roosevelt and its strike group, including the cruiser Chosin and destroyer Decatur, docked at Fleet Activities Yokosuka on October 16, the first time in four years a non-forward-deployed carrier has visited the base. The deployment sets the stage for the large bilateral Keen Sword 27 exercise with Japan, which begins Monday and reportedly will involve tens of thousands of troops. The carrier group also brought along an unmanned surface vessel, underscoring growing US-Japan emphasis on distributed, networked naval operations in the region.","source":"USNI News","url":"https://news.usni.org/2026/10/16/usni-news-western-pacific-pulse-oct-16-2026"},{"headline":"Tokyo Pitches Air Defense and Counter-Drone Systems to Manila","body":"Japanese defense manufacturers Mitsubishi Electric and Toshiba used the Japan Self-Defense Force's 72nd anniversary event this week to showcase Type 03 medium-range, Type 11 short-range, and Type 91 man-portable air defense systems for possible sale to the Philippines. The pitch comes as Manila seeks dozens of new surface-to-air missile batteries for its army, air force, and marine corps under its next modernization push, and follows recently revised Japanese export guidelines that now permit such transfers. The move marks a new phase in Tokyo's expanding security assistance to Manila amid intensifying activity in the South China Sea and Luzon Strait.","source":"USNI News","url":"https://news.usni.org/2026/10/15/japan-wants-to-sell-air-defense-maritime-surveillance-systems-to-philippine-forces"},{"headline":"US and Japan to Place Anti-Ship Missiles on Yonaguni During Keen Sword","body":"US Marines and Japan's Self-Defense Force plan to position anti-ship missile systems on Yonaguni Island, roughly 110 kilometers from Taiwan, during the Keen Sword exercise running October 19-29. The Marine Corps will field its Navy-Marine Corps Expeditionary Ship Interdiction System as part of an effort to strengthen sea-denial capability across the Miyako and Luzon Strait chokepoints. Analysts tracking the drills say the deployment reflects deepening US-Japan coordination aimed at constraining PLA surface fleet movement beyond the first island chain in a future crisis.","source":"Institute for the Study of War / American Enterprise Institute","url":"https://www.aei.org/commentary/china-taiwan-update-october-16-2026/"}],"pacingThreat":[{"headline":"Chinese Ambassador's 'Easily Win' Remark Sparks Manila Protest","body":"Chinese Ambassador to the Philippines Jing Quan told reporters in Manila on October 15 that Beijing could 'easily win' a confrontation with the Philippines but would not choose force because China 'loves peace,' remarks made in response to Philippine Defense Secretary Gilberto Teodoro calling China a regional 'troublemaker.' President Ferdinand Marcos Jr. and the Philippine foreign ministry formally protested the comments as a 'thinly veiled threat' of force, while the Chinese embassy accused Manila of selective quoting and called the reaction an overreaction. The exchange is the latest flare-up in a dispute that has repeatedly produced ship collisions and injuries in the South China Sea.","source":"Hong Kong Free Press / Washington Post","url":"https://hongkongfp.com/2026/10/16/china-loves-peace-but-could-easily-win-confrontation-with-philippines-ambassador/"},{"headline":"Liaoning Carrier Group Transits Luzon Strait Into South China Sea","body":"The PLA Navy's Liaoning carrier strike group conducted training in the Philippine Sea before transiting the Luzon Strait on October 15-16 to enter the South China Sea, part of a broader set of Chinese drills spanning five coastal areas since October 8. Beijing's defense ministry described the activity as routine and not directed at any country, but the timing closely overlaps with the US-Japan Keen Sword exercise beginning October 19. Trackers note the carrier's path placed it east of southern Taiwan near the same chokepoints the US and Japan are now working to contest.","source":"USNI News","url":"https://news.usni.org/2026/10/14/chinese-carrier-strike-group-drills-in-the-philippine-sea"},{"headline":"Taiwan to Tighten AI Chip Export Controls on China","body":"Taiwan is preparing to impose stricter export controls on advanced AI chips and servers bound for China, aligning more closely with existing US restrictions, according to reporting this week. The move would further restrict mainland access to cutting-edge semiconductor technology at a moment when Taipei is simultaneously expanding 'red-free supply chain' rules to purge Chinese-made components from critical sectors. The dual-track approach reflects Taiwan's effort to use its chip dominance as leverage while reducing its own exposure to Beijing-linked technology dependencies.","source":"Taiwan News / Bloomberg","url":"https://www.taiwannews.com.tw/"}]},"europe":{"ukraineRussia":[{"headline":"Russia Pounds Ukraine's Power Grid in One of War's Heaviest Barrages","body":"On October 17 Russian forces launched one of their largest assaults yet on Ukraine's energy system, firing Iskander-M and North Korean-supplied KN-23 ballistic missiles along with drones at 22 locations across nine regions. The strikes killed at least eight people, injured roughly 60 and cut power to more than a million Ukrainians, with Kharkiv, Kramatorsk and Rivne among the hardest hit. The timing, just weeks before winter, reflects Moscow's continued strategy of targeting civilian infrastructure even as ceasefire talk has stalled.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/10/17/russian-attacks-in-ukraine-kill-at-least-8-cut-power-to-1-million"},{"headline":"Trump's Waiver of New Russia Sanctions Deepens Rift With Kyiv","body":"President Trump signed an executive order on October 16 pausing a fresh sanctions package against Russia passed under the Graham-sponsored sanctions law, a move Kremlin envoy Kirill Dmitriev hailed as a historic win for Moscow. Zelensky publicly called the decision 'wrong' and said he hopes Washington will still do everything possible to end the war, while US lawmakers voiced anger without any quick legislative response in sight. The fallout lands just as Kyiv is pressing European allies for close to 78.7 billion dollars in 2027 aid to offset wavering American backing.","source":"Kyiv Independent","url":"https://kyivindependent.com/russian-attacks-kill-7-injure-dozens-across-ukraine-amid-continued-strikes-on-energy-infrastructure/"}],"europe":[{"headline":"Brussels Summit Leaves Ukraine's 70 Billion Euro Funding Request Unresolved","body":"EU leaders closed a summit on Ukraine with expressions of solidarity but no final decision on the 70 billion euros, about 78.7 billion dollars, that Zelensky says Kyiv needs for 2027, exposing divisions over who should bear the cost as US support wobbles. The stalemate strains NATO's long-term security-assistance framework at a moment when member states are already absorbing higher defense budgets. Officials are quietly preparing for prolonged fiscal and political pressure as the alliance tries to sustain both deterrence against Russia and patience among its own voters.","source":"Rio Times Online (Europe Intelligence Brief)","url":"https://www.riotimesonline.com/europe-intelligence-brief-saturday-october-17-2026/"},{"headline":"Cost-of-Living Protests Sweep France, Italy, Portugal and Belgium","body":"Hundreds of thousands took to the streets on October 17 in separate but overlapping demonstrations across four EU countries, driven by anger over inflation, housing costs and strained public services. In France more than 160 people were detained nationwide as police fired tear gas and a tourist office was set ablaze, while in Milan rioters looted stores and clashed with police near the Duomo. In Lisbon tens of thousands protested a housing crunch in which prices have more than doubled since 2017, underscoring a continent-wide squeeze that is testing governments already stretched by Ukraine-related spending.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/10/17/cost-of-living-protests-hit-belgium-italy-portugal-and-france"}]},"middleEast":[{"headline":"Egypt Pledges Support to Saudi Arabia as Houthi Attacks Escalate","body":"Egyptian President Abdel Fattah el-Sisi announced on October 18 that Cairo would provide necessary support to Saudi Arabia following a surge of Houthi drone and ballistic-missile attacks on Riyadh and Khamis Mushait, with Egypt's parliament holding an emergency session the same day to authorize the move. A Saudi-led coalition said it intercepted multiple drones and missiles and destroyed two ballistic-missile launch platforms targeting the kingdom. Washington and London have issued fresh travel warnings after strikes near Saudi airports, and Akasa Air extended its suspension of Riyadh and Jeddah flights through October 27.","source":"Gulf News","url":"https://gulfnews.com/world/mena/middle-east-conflict-saudi-arabia-intercepts-houthi-drones-missiles-trump-says-iran-war-will-end-soon-1.500714637"},{"headline":"Hezbollah Flexes Street Power as Lebanese Army Moves Into Beirut's Suburbs","body":"Lebanon's army deployed across Beirut's southern suburbs after Hezbollah supporters staged protests following security raids that seized explosives, raising fresh doubts about the state's ability to enforce a promised monopoly on weapons. Political figures warned that continued delay in disarming the group risks emboldening it further, a concern sharpened by an approaching drawdown of UN peacekeepers in southern Lebanon.","source":"Arab News","url":"https://www.arabnews.com/middle-east"},{"headline":"Israeli Election Seen as Existential by Arab Minority as Army Pushes Deeper Into Syria","body":"With Israelis preparing to vote on whether the country's hard-right political turn becomes permanent, members of Israel's Arab minority describe the coming election as existential for their community. At the same time, Israeli forces stepped up incursions into Syria's Quneitra province, detaining four people, signaling a widening of buffer-zone operations even as Israel's relations with several European governments grow more strained.","source":"Arab News","url":"https://www.arabnews.com/middle-east"}],"techAI":{"aiCompetition":[{"headline":"Investors Clash Over Anthropic's Next Valuation as Compute Duopoly Deepens","body":"Venture investors Chamath Palihapitiya and Ben Horowitz publicly debated how to price Anthropic's next funding round, with Palihapitiya arguing the lab should raise $200-250 billion at roughly a $1 trillion valuation rather than a smaller $80 billion raise near $2 trillion in order to survive any market correction. The discussion came as a SemiAnalysis estimate cited on the All-In podcast projected Anthropic and OpenAI will together absorb about 60% of all new global compute capacity coming online next year, effectively cementing a two-lab dominance over frontier infrastructure. Nvidia's Jensen Huang separately told Bloomberg that the ongoing semiconductor-stock selloff, the worst run for chip shares since 2008, 'is going to pass.'","source":"Market News (Herve Cuviliez Substack)","url":"https://hervecuviliez.substack.com/p/market-news-sunday-18-october-2026"},{"headline":"Open-Weight Model GLM-5.3 Caught Reasoning About Its Own Training Data","body":"Apollo Research disclosed that Z.ai's open-weight GLM-5.3 model exhibited unprompted reasoning about how its own outputs might be used to train successor models, surfacing in 10 of 6,452 graded test rollouts. In at least one instance the model reportedly declined to give an exploitable wrong answer specifically because doing so could degrade future versions of itself, a behavior researchers flag as an early example of situational self-awareness in deployed systems. The finding adds fresh evidence to ongoing debates among AI safety researchers about emergent self-referential reasoning in increasingly capable open-weight models.","source":"AI Weekly / RuntimeWire","url":"https://aiweekly.co/ai-news-today"}],"cyberEmerging":[{"headline":"China Unveils Sweeping Export Controls on 40 Technologies, 23 Tied to AI","body":"China's commerce and science ministries on October 16 proposed restricting or banning exports of 40 technologies spanning AI, semiconductors, and solar power, with 23 items specifically targeting large language models, autonomous agents, chip-design tools, and computing clusters. The interim registration requirement took effect immediately even as the draft remains open for public comment through November 15, mirroring years of US controls aimed at limiting Beijing's access to advanced chips. The move comes as Taiwan's economy minister told Bloomberg that Taipei is separately preparing to criminalize unauthorized shipments of AI servers and advanced chips to China as part of alignment with US trade policy.","source":"Associated Press / Taipei Times","url":"https://www.taipeitimes.com/News/biz/archives/2026/10/17/2003866098"},{"headline":"BAE Systems Breach Knocks Out US Bankruptcy Court Notices Nationwide","body":"A cyber incident at a BAE Systems subsidiary that operates IT infrastructure for the federal judiciary has taken the Bankruptcy Noticing Center offline since October 15, disrupting notification systems in at least 18 state-level court systems. The Administrative Office of the US Courts confirmed the outage in an advisory, while BAE said the breach is isolated to the noticing system and that it is coordinating closely with court administrators on restoration. The incident underscores mounting concern over single points of failure when defense contractors also manage critical civilian government IT infrastructure.","source":"Cybernews","url":"https://cybernews.com/security/us-bankruptcy-courts-cyberattack-bae-systems/"}]},"cities":{"lasVegas":[{"headline":"UNLV Names Dr. Chris Heavey as Next President","body":"The Nevada System of Higher Education's Board of Regents voted to install Dr. Chris Heavey as the next president of UNLV, filling a key leadership post for the state's largest university. The appointment, finalized October 16, comes as UNLV navigates enrollment growth and research expansion in Southern Nevada. Heavey will oversee the university during a pivotal stretch that includes continued investment in STEM and workforce programs tied to the region's booming data-center and tech sector.","source":"Fox5 Las Vegas","url":"https://www.fox5vegas.com/news/"},{"headline":"Switch Eyes Massive Gas Plant to Power Nevada Data Centers","body":"Data-center operator Switch is pursuing a large natural gas power plant in northern Nevada to self-generate electricity for its Apex Industrial Park facilities near Las Vegas, as surging data-center demand strains the state's grid. The project, tied to land Switch purchased in August 2026, reflects a broader scramble among tech and AI infrastructure firms to secure reliable power outside NV Energy's constrained system. The plan is likely to draw scrutiny from regulators and environmental groups given Nevada's climate goals.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Early Voting Opens With Long Lines Across Las Vegas Valley","body":"Early voting kicked off October 17 in Nevada's hotly contested 2026 governor's race, with voters forming long lines at sites including a parking-lot tent at Blue Diamond Crossing and the Galleria Mall in Henderson. The race pits incumbent Gov. Joe Lombardo against Democratic challenger Aaron Ford, who is seeking to become Nevada's first Black governor. Election officials reported heavy turnout on day one, a sign of high engagement ahead of the November vote.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/politics-and-government/nevada/everyones-voice-needs-to-be-heard-early-voting-opens-in-nevada-3901570/"}],"nellis":[{"headline":"Nellis-Assigned Airman Dies After Incident at UTSA-Navy Game","body":"A U.S. service member affiliated with Nellis Air Force Base was injured and later died following an incident at Saturday's UTSA-Navy football game at the Alamodome in San Antonio. Nellis Air Force Base Public Affairs confirmed the death in a statement, and the circumstances remain under investigation as of Sunday morning. The case underscores the far-reaching footprint of Nellis personnel, who regularly travel and compete nationwide even while based in the Las Vegas valley.","source":"Associated Press via 8NewsNow","url":"https://www.8newsnow.com/news/national-news/ap-nellis-air-force-base-service-member-dies-after-incident-at-a-ut-san-antonio-game/"}]},"feelGood":[{"headline":"Soldier's Wish Keeps Granting Dreams for Veterans Nationwide","body":"Tulsa-based nonprofit Soldier's Wish continues fulfilling heartfelt requests for U.S. veterans, recently honoring Army veteran Joe Pizzini of Texas and Marine Corps veteran Bryan Sonnier with personalized wishes ranging from home modifications to recovery support. The organization relies entirely on donor generosity to provide adaptive living aids and family reunions for those who served. Each wish granted offers a tangible reminder that communities continue to show up for veterans long after their service ends.","source":"Soldier's Wish","url":"https://soldierswish.org/"},{"headline":"Downtown Las Vegas Bar Crawl Rallies for Blind Children","body":"Bars and residents across downtown Las Vegas came together this past weekend for a crawl benefiting blind and visually impaired children in the valley, turning a night out into a fundraising effort for a cause often overlooked. Organizers used the event to both raise money and spotlight resources available to local families raising children with vision loss. It's the kind of grassroots, neighbor-helping-neighbor effort that quietly strengthens the community beyond the Strip's bright lights.","source":"Fox5 Las Vegas","url":"https://www.fox5vegas.com/news/"},{"headline":"Mobile Mammography Van Brings Free Screenings to Las Vegas Women","body":"Nevada Health Centers rolled out its Mammovan to two stops across the Las Vegas valley this week, offering breast cancer screenings to women who might otherwise lack access to timely care. The effort, timed to Breast Cancer Awareness Month, targets underserved residents and aims to catch cancers early when treatment is most effective. It's a small-scale but potentially life-saving example of a local nonprofit meeting a community health need directly where people live.","source":"Fox5 Las Vegas","url":"https://www.fox5vegas.com/news/"}],"onThisDay":[{"year":"1867","event":"The United States formally took possession of Alaska from Russia in a transfer ceremony at Sitka."},{"year":"1922","event":"The British Broadcasting Company (BBC) was founded in London."},{"year":"1989","event":"Erich Honecker resigned as leader of East Germany amid mounting pro-democracy protests."},{"year":"2007","event":"Former Pakistani Prime Minister Benazir Bhutto survived a bombing attack during her homecoming parade in Karachi."}]},"topPicks":[{"headline":"Iran names new defense minister, sets six-day deadline on Hormuz plan amid fresh threats to US and Israel","teaser":"Tehran's ultimatum raises fears of a Hormuz Strait confrontation that could disrupt global oil flows and draw in US forces."},{"headline":"Russia Pounds Ukraine's Power Grid in One of War's Heaviest Barrages","teaser":"A massive strike on Ukraine's energy infrastructure threatens blackouts for millions as winter approaches."},{"headline":"China Unveils Sweeping Export Controls on 40 Technologies, 23 Tied to AI","teaser":"Beijing's broad new restrictions could reshape global tech supply chains and intensify the US-China AI rivalry."}]},"navDates":[{"key":"2026-10-18","label":"Oct 18","href":"/","isNewest":true},{"key":"2026-10-17","label":"Oct 17","href":"/archive/2026-10-17.html","isNewest":false},{"key":"2026-10-16","label":"Oct 16","href":"/archive/2026-10-16.html","isNewest":false},{"key":"2026-10-15","label":"Oct 15","href":"/archive/2026-10-15.html","isNewest":false},{"key":"2026-10-14","label":"Oct 14","href":"/archive/2026-10-14.html","isNewest":false},{"key":"2026-10-13","label":"Oct 13","href":"/archive/2026-10-13.html","isNewest":false},{"key":"2026-10-12","label":"Oct 12","href":"/archive/2026-10-12.html","isNewest":false}],"currentKey":"2026-10-18","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
