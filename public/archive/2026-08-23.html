<script>
const STATE = {"digest":{"date":"Sunday, August 23, 2026","generatedAt":"Sun, Aug 23, 5:30 AM PDT","breaking":{"headline":"US-Iran War Stalemate Deepens as Trump Threatens 'Economic D-Day' Over Hormuz","body":"The 60-day window for a negotiated end to the US-Iran war lapsed this week with no talks scheduled, and Trump has ordered his envoys to stop engaging Tehran while threatening to bomb Oman if it interferes with Strait of Hormuz shipping arrangements. An adviser to Iran's supreme leader says Tehran will not submit to a new wave of sanctions Washington plans to detail Monday. Shipping through the Strait remains far below pre-war norms even as Iran begins allowing some Iraqi tankers through, and the US national average gas price has climbed to $4.11 a gallon, nearly a dollar higher than a year ago. The unresolved conflict, which began February 28 with joint US-Israeli strikes on Iran, continues to roil global oil markets and Gulf shipping lanes six months in.","source":"CNN","url":"https://www.cnn.com/2026/08/22/world/live-news/iran-war-trump"},"tabs":{"defense":{"defense":[{"headline":"Army to Deactivate European Drone-Warfare Training Unit","body":"The US Army is shutting down a unit based in Europe that had been dedicated to teaching soldiers how to counter and employ drones, according to reporting this week. The move comes amid ongoing debate over how forward-deployed US forces should adapt training pipelines after years of drone-dominated fighting in Ukraine. It also lands just weeks after NATO allies pledged more than $40 billion for counter-drone capabilities at their Ankara summit, raising questions about how training responsibilities will be redistributed across the alliance.","source":"Associated Press","url":""},{"headline":"US Forces Stay Postured in Gulf as Iran Diplomacy Stalls","body":"With talks between Washington and Tehran suspended, Trump told reporters this week the US retains full control over the sea and land areas surrounding the Strait of Hormuz and is simply watching what happens next rather than ordering fresh strikes for now. US Navy assets remain engaged in escort and interdiction operations launched earlier this year to protect commercial shipping transiting the strait. Despite the pause in overt strikes, the Pentagon has kept forces ready to resume action quickly given the repeated collapses of ceasefire arrangements since June.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-august-22-2026/"},{"headline":"NATO Advances AI-Driven Sensor and Drone Network Along Eastern Flank","body":"NATO is building out its Eastern Flank Deterrence initiative, an AI-assisted network of sensors and drones meant to detect and repel incursions along the alliance's border with Russia and Belarus, stretching from northern Finland to the Black Sea. A US Army officer overseeing the program said this week that automation is necessary because the alliance lacks enough personnel to operate potentially a million drones by hand. The effort builds on the roughly $40 billion Drone Edge package NATO leaders endorsed at July's Ankara summit.","source":"TechRadar Pro","url":"https://www.techradar.com/pro/nato-wants-thousands-of-ai-drones-guarding-its-borders-but-theres-one-thing-they-wont-be-allowed-to-do"}],"acquisitions":[{"headline":"Missile Defense Agency Taps X-Bow Systems for Low-Cost Interceptor","body":"The Pentagon's Missile Defense Agency awarded X-Bow Systems a $10.9 million contract on August 21 to develop and flight-test a new Low-Cost Interceptor. The deal reflects the Pentagon's growing push toward cheaper, rapidly producible interceptors as missile and drone threats from adversaries proliferate. It follows a string of smaller recent awards aimed at diversifying the missile-defense industrial base beyond the traditional large prime contractors.","source":"The Defense Post","url":"https://thedefensepost.com/"},{"headline":"Boeing's Air Force One Contract Grows to $4.49 Billion","body":"Boeing's contract to build the VC-25B presidential aircraft climbed to roughly $4.49 billion after the Air Force disclosed a new $75 million modification on August 21. The program, which has faced years of delays and cost overruns in replacing the aging Air Force One fleet, continues to see incremental funding increases as engineering and integration work proceeds. The latest award highlights ongoing Pentagon scrutiny of legacy aircraft programs even as officials push to control cost growth elsewhere.","source":"ClearanceJobs","url":"https://news.clearancejobs.com/2026/08/21/boeings-vc-25b-contract-climbs-to-4-49b-with-new-75m-award/"}]},"us":[{"headline":"US-Canada Trade War Ignites as 50% Tariffs Take Effect","body":"A midnight deadline passed without a deal, triggering US tariffs of 50% on roughly $20 billion worth of Canadian goods. Canadian Prime Minister Mark Carney immediately vowed retaliation, pledging to match the levies dollar for dollar, setting up the most serious trade rupture between the two allies in years. The clash caps a period of collapsing negotiations, with Trump notably silent publicly even as Carney has been vocal about the fallout.","source":"NPR","url":"https://www.npr.org/sections/politics/"},{"headline":"Supreme Court Lets Trump's $300M White House Ballroom Proceed","body":"The Supreme Court ruled Friday that construction of President Trump's sprawling new ballroom on the site of the former East Wing can continue for now, overturning a lower court's halt and allowing the project to move forward without congressional approval. The ballroom is now estimated to cost taxpayers at least $300 million, despite Trump's repeated claims that the public would not bear the expense. The administrative stay buys time for the justices to weigh a fuller emergency appeal in the underlying legal challenge to the project.","source":"NPR/Axios","url":"https://www.npr.org/2026/08/21/nx-s1-5935417/supreme-court-allows-trumps-ballroom-construction-to-continue-for-now"},{"headline":"Federal Judge Strikes Down 75-Country Visa Ban as Discriminatory","body":"A federal judge in New York ruled Friday that the Trump administration must resume processing visas for applicants from 75 countries the government had deemed likely to become a 'public charge,' finding the indefinite pause violated antidiscrimination protections. The decision curbs one of the administration's broadest recent efforts to restrict legal immigration pathways and follows a string of similar court setbacks this summer targeting nationality-based visa and benefits freezes. The ruling adds to a pattern of federal courts pushing back on administration immigration policy just as midterm campaigning intensifies.","source":"Washington Post","url":"https://www.washingtonpost.com/politics/2026/08/22/visa-processing-ban-75-countries-struck-down-by-federal-judge/"},{"headline":"DNC Enters Final Midterm Stretch More Than $2M in the Red","body":"With roughly 100 days until the midterms, new FEC filings show the DNC's debts now exceed its cash by more than $2 million, ending June with $16.3 million on hand against $18.5 million in liabilities. By contrast, the RNC reported about $128.5 million on hand with no debt, a gap supercharged in part by a Supreme Court campaign-finance ruling that let party committees coordinate more closely with candidates. DNC Chair Ken Martin has defended the numbers by noting the committee's total fundraising is historically strong for a party out of the White House, but the disparity raises fresh questions about Democratic financial readiness for House and Senate battlegrounds.","source":"Fox News/Washington Examiner","url":"https://www.foxnews.com/media/cash-strapped-dnc-shelled-out-more-than-800k-non-voting-territories-like-virgin-islands-while-debt"}],"pacific":{"pacificCommand":[{"headline":"Japan Greenlights Development of Submarine-Launched Hypersonic Missile","body":"Japan's Ministry of Defense confirmed plans to begin developing an underwater-launched hypersonic missile starting in fiscal 2027, a move first reported by Kyodo News and Russia's TASS on August 19. The weapon would add a harder-to-detect strike layer to Tokyo's arsenal, built to work alongside Japan's expanding sensor network of long-range drones and space-based surveillance assets funded in the FY2026 defense budget. Analysts note the program is still in early development, but if fielded, pairing submarine concealment with hypersonic speed would complicate Chinese targeting in any future Taiwan or East China Sea contingency.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/navy-news/2026/japans-submarine-launched-hypersonic-missile-plan-signals-a-new-era-in-indo-pacific-deterrence"},{"headline":"Canberra Doubles Down on Domestic Missile Production to Hedge Against Supply Shocks","body":"Australia has made sovereign missile manufacturing a top 2026 defense-industrial priority, pointing to lessons from Ukraine and the Middle East about munitions being consumed faster than peacetime stockpiles allow. Kongsberg Australia is building toward full-rate domestic production of Naval Strike and Joint Strike Missiles by 2028, while Lockheed Martin Australia develops local GMLRS manufacturing, backed by a Guided Weapons and Explosive Ordnance plan valued at roughly AU$16-21 billion over the decade. Canberra frames the push not as self-sufficiency but as diversifying supply chains with the US, Norway and Germany so a single overseas bottleneck cannot stall Australian Defence Force operations in a contested Indo-Pacific.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/australia-makes-missile-production-a-2026-defense-priority-for-indo-pacific-deterrence"},{"headline":"Trump Signals Pullback on US-South Korea Joint Military Drills","body":"President Trump indicated the United States will scale back the scope of joint military exercises with South Korea, a shift flagged this week in regional defense roundups as one of the more consequential alliance-management stories of the past several days. The move comes amid broader questions about US force posture commitments across the Indo-Pacific even as North Korea, alongside China and Russia, has been tied to a sharp rise in state-sponsored cyberattacks so far this year. Seoul now faces pressure to reassess its own deterrence posture against Pyongyang with a potentially reduced American training footprint on the peninsula.","source":"Indo-Pacific Insight Weekly","url":"https://indopacificinsights.substack.com/p/indo-pacific-insight-weekly-august-213"}],"pacingThreat":[{"headline":"Satellite Imagery Confirms China Has Finished First Phase of Massive New South China Sea Island","body":"New satellite imagery dated August 11 and reviewed by Reuters and The War Zone shows China has completed the first phase of construction at Antelope Reef in the Paracels, turning what was a submerged sandbar just a year ago into a nearly 1,500-acre artificial island. The site now features a deep-water port, a quay stretching over 2,000 feet capable of berthing warships, and the early shape of a runway that could extend roughly 10,000 feet. Analysts say the base, closer to the Chinese mainland than the Spratly outposts, could eventually host assets like H-6 bombers and further cements Beijing's militarized grip on the northern South China Sea ahead of any Taiwan contingency.","source":"The War Zone (TWZ)","url":"https://www.twz.com/news-features/chinas-massive-new-artificial-island-in-the-south-china-sea-emerges-primed-for-militarization"},{"headline":"China Deepens Military-to-Military Ties With Indonesia Amid Regional Pushback","body":"Chinese Defense Minister Admiral Dong Jun met his Indonesian counterpart Sjafrie Sjamsoeddin in Jakarta on August 21 for the second ministerial round of their joint foreign-and-defense dialogue, part of Beijing's broader effort to lock in Southeast Asian partners even as it presses territorial claims elsewhere in the region. The outreach follows a Chinese-Indonesian naval navigation exercise held earlier this month in waters east of Taiwan, underscoring how Beijing is using bilateral military diplomacy to normalize its naval presence near the island. The dialogue comes as China's Southern Theater Command continues separate drills near Scarborough Shoal in response to Philippine moves to formalize territorial claims there.","source":"China Ministry of National Defense","url":"http://eng.mod.gov.cn/"},{"headline":"Taiwan Logs Fresh PLA Sorties and Warship Presence in Latest 24-Hour Tracking Window","body":"Taiwan's Ministry of National Defense reported three PLA aircraft, eight PLA Navy ships and seven Chinese official vessels operating around the island in the 24 hours ending the morning of August 22, with all three aircraft sorties crossing the Taiwan Strait median line into the northern and southwestern air defense identification zone. Taipei responded with combat air patrols, naval vessels and coastal missile systems, a now-routine posture that has held for months even as sortie counts fluctuate day to day. The steady drumbeat of incursions continues to reinforce Taiwan's own military planning assumption, reflected in this month's Han Kuang exercises, that Beijing is rehearsing for a potential move against the island later this decade.","source":"GlobalSecurity.org / Taiwan MND","url":"https://www.globalsecurity.org/wmd/library/news/taiwan/2026/taiwan-260822-roc-mnd01.htm"}]},"europe":{"ukraineRussia":[{"headline":"Putin Dismisses Ukrainian Peace Proposals as 'Exotic,' Vows Harsher Strikes","body":"Speaking after the United Russia party congress on Aug. 22, Putin brushed off Kyiv's latest ceasefire ideas, calling proposals conveyed to Moscow 'exotic in nature' relative to Russia's war goals. The same day, combined Russian and Ukrainian attacks killed at least 17 people, and Putin warned that future retaliatory strikes on Ukraine's economic infrastructure would be far more destructive. The exchange suggests little near-term prospect for a negotiated pause even as both militaries escalate long-range strikes nearly four and a half years into the war.","source":"Al Jazeera / Kyiv Independent","url":"https://www.aljazeera.com/news/2026/8/22/russian-strikes-kill-6-people-in-ukraine-day-after-shopping-complex-attack"},{"headline":"Ukrainian Drones Hit Russian Refinery, Airbase and Oil Terminal Overnight","body":"Ukraine's military launched a wave of long-range drone strikes into the night of Aug. 22, hitting a Russian oil refinery, an airbase, and a warehouse tied to e-commerce firm Ozon inside Russian territory. Separately, Ukraine's General Staff confirmed a strike on the Yeysk oil terminal in Krasnodar Krai, a facility that supplies fuel to Russian forces. The twin campaigns highlight how both sides are increasingly targeting economic infrastructure far from the front line to grind down the other's war-fighting capacity.","source":"Kyiv Independent","url":"https://kyivindependent.com/"}],"europe":[{"headline":"NATO Surges Air Power Near Kaliningrad Amid Warnings Putin Is 'Testing' the Alliance","body":"The United States led a large multinational NATO air exercise over Poland and the Baltic region on Aug. 18, flying combat-strike, refueling, surveillance and electronic-warfare aircraft near Russia's Kaliningrad exclave. The show of force follows a spate of recent drone incursions and airspace violations across Poland, Romania, Latvia and Germany that have rattled the alliance's eastern flank. A U.S. intelligence assessment referenced by defense officials warns Putin may be probing NATO vulnerabilities ahead of a possible limited attack on a member state within the next few years.","source":"Stars and Stripes","url":"https://www.stripes.com/theaters/europe/2026-08-19/nato-aircraft-training-kaliningrad-russia-threat-22599202.html"},{"headline":"EU Leaders Demand Emergency Talks as Migrant Crossings Surge at Ceuta","body":"Twenty-two European Union leaders have called for urgent talks over a surge in unauthorized crossings into Spain's North African enclave of Ceuta, warning that any perception illegal entry into the EU is tolerated could trigger further waves of migration bloc-wide. The signatories floated reinstating internal border controls and cautioned against the 'instrumentalisation' of migration as a hybrid threat. Several capitals have pointed to Madrid's recent move to grant legal status to undocumented migrants as a possible pull factor, a characterization Spain disputes, deepening a rift over EU migration policy heading into autumn.","source":"Euronews","url":"https://www.euronews.com/my-europe/2026/08/01/22-eu-leaders-call-for-emergency-talks-over-ceuta-migrant-crisis"}]},"middleEast":[{"headline":"Netanyahu's Silence Deepens Doubts Over Trump's Gaza Peace Plan","body":"Israel's response to the Trump administration's 15-point Gaza peace plan has been muted, with Prime Minister Benjamin Netanyahu offering no public endorsement even as Israeli forces carried out a deadly weekend of strikes in the territory. The stalemate comes as White House envoy Jared Kushner held rare talks with Hamas's new leadership in Egypt and is expected in Jerusalem for follow-up meetings with Netanyahu, who previously rejected the plan. Compounding the diplomatic strain, Israel is pressing ahead with the internationally condemned E1 settlement project in the West Bank, which critics warn could fragment Palestinian territory and foreclose a two-state solution.","source":"CNN / Washington Post","url":"https://www.cnn.com/world/middle-east"},{"headline":"Iranian Families Squeezed as Washington Expands Secondary Sanctions","body":"Ordinary Iranians are struggling to afford basic goods as the Trump administration ratchets up economic pressure on Tehran, with the country's own president publicly acknowledging Iran is facing 'many problems.' Iran's foreign ministry condemned the latest round of U.S. secondary sanctions on its trading partners as having no foundation in international law, while officials in Beijing voiced concern as Washington moves to target firms doing business with Iran in China. The sanctions escalation adds fresh strain to an economy still reeling from the aftermath of the U.S.-Israeli strikes earlier this year.","source":"Arab News / A Skeptic","url":"https://www.arabnews.com/"},{"headline":"Deadly Weekend Violence Spreads From West Bank to East Jerusalem","body":"Violence flared across multiple fronts over the weekend: Israeli settlers shot dead 17-year-old Karim Sanad Shalaldeh in the West Bank, while separate Israeli gunfire killed 58-year-old Fathi Khazem. In East Jerusalem's Silwan neighborhood, a family feud escalated into arson and gunfire overnight, leaving three dead, including two shot by police. Separately, an Israeli man was stabbed and moderately wounded at a West Bank shopping center near Jericho, underscoring how tensions are boiling over simultaneously on several fronts.","source":"Al Jazeera / Haaretz","url":"https://www.haaretz.com/israel-news/israel-security/2026-08-23/ty-article-live/reports-several-palestinians-wounded-by-israeli-settler-attacks-in-west-bank/000001a0-2b4c-dc38-a7f1-3f6fed180003"}],"techAI":{"aiCompetition":[{"headline":"Study Finds Top AI Labs Still Lack Public Plans to Contain a Rogue Model","body":"A new scorecard from safety watchdog Guidelight AI Standards graded five leading AI developers on whether they have published concrete protocols for cutting off access or shutting down a model caught trying to subvert human oversight. OpenAI ranked highest, while Anthropic and Meta scored lowest despite Anthropic's public emphasis on safety. The findings land as agentic AI systems take on more autonomous roles inside corporate networks and as California and New York regulators begin requiring risk disclosures from frontier developers.","source":"TechCrunch","url":"https://techcrunch.com/2026/08/22/frontier-ai-labs-still-wont-say-how-theyd-contain-a-rogue-model/"},{"headline":"Chinese AI Firms Exploit Cloud Loophole to Reach Banned Nvidia Chips","body":"Reporting this week shows Moonshot AI, ByteDance, Alibaba and Tencent are obtaining computing power from Nvidia's most advanced GPUs, including GB300s, by renting capacity from data centers in Thailand, Malaysia and Japan rather than importing hardware directly into China. Because U.S. export rules restrict physical ownership of chips but not remote cloud access, the practice sidesteps existing controls entirely. Lawmakers are now weighing the Remote Access Security Act to close the gap, though passage remains uncertain, underscoring how enforcement of the chip war is lagging behind Chinese labs' workarounds.","source":"CNBC","url":"https://www.cnbc.com/2026/08/19/china-ai-nvidia-chips-us-export-controls.html"}],"cyberEmerging":[{"headline":"Cl0p Ransomware Gang Claims Major Breach of Energy Giant Shell","body":"The Cl0p extortion group says it exfiltrated sensitive internal data from Shell, with the incident now under active investigation and raising concerns about exposure of systems tied to critical energy infrastructure. The claim adds to Cl0p's pattern of large-scale data-theft campaigns against multinational corporations rather than traditional file-encrypting ransomware. Confirmation of the scope and authenticity of the stolen data is still pending as investigators assess the intrusion.","source":"Cyber Updates 365","url":"https://cyberupdates365.com/"},{"headline":"Microsoft Patches 'CoSnitch' Copilot Flaw That Enabled Silent Data Theft","body":"Microsoft issued a fix on August 18 for a vulnerability dubbed CoSnitch, tracked as CVE-2026-24301, which researchers at Varonis Threat Labs found could chain an undocumented URL parameter with Copilot's built-in web-fetch feature and persistent memory to auto-execute malicious prompts. A single crafted link could trigger exfiltration of data from connected accounts like Gmail and Drive without user interaction. The flaw highlights growing security concerns around AI agents with persistent memory and broad system permissions inside enterprise environments.","source":"AI Weekly","url":"https://aiweekly.co/ai-news-today"}]},"cities":{"lasVegas":[{"headline":"Tupac Murder Trial Enters Second Week in Las Vegas","body":"Testimony continued this week in the trial of Duane 'Keffe D' Davis, 63, the only person ever charged in the 1996 killing of Tupac Shakur near the Strip. Prosecutors are portraying the shooting as the violent culmination of a feud between rival gang factions and competing record labels rather than an isolated incident. The case, unfolding three decades after the killing, remains one of the most closely watched proceedings in Clark County this year.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Missing 4-Year-Old Found Safe in East Las Vegas Valley","body":"Metro police confirmed that Lucifer Heckler, 4, was safely reunited with his family Saturday after going missing near South Mohave Road and East Tompkins Avenue. The department released details and photos of the reunion, capping a tense search in the east valley. No foul play has been indicated in the brief disappearance.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Henderson Police Leadership Under Active Investigation","body":"City officials in Henderson have confirmed a formal investigation into the department's top police leaders, adding to turmoil at City Hall. Separately, two police unions sent a cease-and-desist letter to Councilmember Carrie Cox, accusing her of improperly using their insignia in campaign materials and on her website. The dual controversies come as Henderson also faces a lawsuit alleging negligence in a 2024 in-custody death at its jail.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"}],"nellis":[{"headline":"Department of War Leaders Train Alongside Nellis Airmen","body":"Senior Department of War leaders visited Nellis Air Force Base's 6th Combat Training Squadron on August 18 to complete a physical workout alongside enlisted Airmen. The visit was framed as underscoring the importance of cardiovascular and strength conditioning in preparing tactical Airmen for combat environments, part of a broader push on force readiness at the sprawling Las Vegas-area base. Nellis hosts the Air Force Warfare Center, the Nevada Test and Training Range, and the Thunderbirds, making it a frequent stop for senior defense officials assessing training pipelines.","source":"DVIDS","url":"https://www.dvidshub.net/unit/NAFB"}]},"feelGood":[{"headline":"Restaurant Owner's Mentorship Turns Trash Job Into New Life","body":"In Redding, California, restaurant owner Kenny Elwood donated 200 pounds of beef to the Good News Rescue Mission after a chance encounter with a man named Dylan Meese, who had been living homeless beneath Elwood's building during a renovation. Elwood offered Meese ten dollars a bag to clean up trash, a small gesture that grew into steady work, an electric bike, encouragement toward rehab, and ultimately a path out of more than a decade of homelessness. Meese has since become a father and graduated from the mission's discipleship program, and two other men he recruited for cleanup work still work alongside Elwood today.","source":"KRCR","url":"https://krcrtv.com/news/local/good-news-rescue-mission-gets-200-pound-beef-donation-after-sacramento-river-encounter"},{"headline":"US Military Airlifts Aid to Colombia After Deadly Earthquake","body":"A U.S. Air Force C-17 Globemaster delivered emergency supplies to Medellin and Bogota over the weekend as part of continuing relief efforts following Colombia's magnitude 7.4 earthquake on August 10. U.S. Southern Command said American forces stand in solidarity with the Colombian people, and the State Department has pledged an additional 11 million dollars in humanitarian aid on top of earlier assistance. The airlift is part of a broader, ongoing State Department-led response to one of the region's most damaging quakes in years.","source":"Stars and Stripes","url":"https://www.stripes.com/theaters/americas/2026-08-17/southcom-humanitarian-response-colombia-earthquake-22579851.html"},{"headline":"100-Year-Old WWII Veteran's Long-Held Wish Fulfilled","body":"A World War II veteran named Tom, celebrating his 100th birthday, finally got to visit the Allegheny Mountains, a trip he had wanted to take for years despite extensive travels with his wife. Covenant Care's My Wish program partnered with the local VA to organize a surprise outing honoring the centenarian's service and milestone birthday. The gesture reflects a growing volunteer effort nationwide to grant end-of-life wishes to aging veterans, offering comfort to both them and their families.","source":"My Wish (Covenant Care)","url":"https://mywish.org/about-vets-wish/"}],"onThisDay":[{"year":"1305","event":"Scottish resistance leader William Wallace was executed for treason in London."},{"year":"1799","event":"Napoleon Bonaparte left Egypt to return to France, abandoning his army there."},{"year":"1926","event":"Silent film star Rudolph Valentino died in New York City, causing widespread public mourning."},{"year":"1989","event":"An estimated two million people joined hands across Estonia, Latvia and Lithuania in the Baltic Way protest against Soviet rule."}]},"topPicks":[{"headline":"US-Iran War Stalemate Deepens as Trump Threatens 'Economic D-Day' Over Hormuz","teaser":"Escalating threats over the Strait of Hormuz risk global oil shocks and a wider Middle East conflict."},{"headline":"US-Canada Trade War Ignites as 50% Tariffs Take Effect","teaser":"Steep new tariffs between two major trading partners threaten to disrupt North American supply chains and prices."},{"headline":"Putin Dismisses Ukrainian Peace Proposals as 'Exotic,' Vows Harsher Strikes","teaser":"Russia's rejection of peace talks and vow of intensified strikes signals a prolonged, deadlier war in Ukraine."}]},"navDates":[{"key":"2026-08-26","label":"Aug 26","href":"/","isNewest":true},{"key":"2026-08-24","label":"Aug 24","href":"/archive/2026-08-24.html","isNewest":false},{"key":"2026-08-23","label":"Aug 23","href":"/archive/2026-08-23.html","isNewest":false},{"key":"2026-08-22","label":"Aug 22","href":"/archive/2026-08-22.html","isNewest":false},{"key":"2026-08-20","label":"Aug 20","href":"/archive/2026-08-20.html","isNewest":false},{"key":"2026-08-19","label":"Aug 19","href":"/archive/2026-08-19.html","isNewest":false},{"key":"2026-08-18","label":"Aug 18","href":"/archive/2026-08-18.html","isNewest":false}],"currentKey":"2026-08-23","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-23.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
