<script>
const STATE = {"digest":{"date":"Friday, August 28, 2026","generatedAt":"Fri, Aug 28, 2:40 PM PDT","breaking":{"headline":"Trump Abandons Iran Truce Framework as War Grinds Into Seventh Month","body":"Six months into the US-Iran conflict, President Trump has told mediators he no longer wants to revive June's memorandum of understanding and is instead pushing harder terms, including a full reopening of the Strait of Hormuz and new curbs on Tehran's nuclear program. Qatar's prime minister flew to Tehran on August 27 to try to restart diplomacy, while Oman and Iran continue negotiating a temporary shipping corridor through the strait. Washington has simultaneously widened sanctions on Iranian aviation, shipping, technology, gold and digital-asset sectors, with Treasury Secretary Bessent warning of an economic 'D-Day' for any country that keeps trading with Tehran.","source":"CNN","url":"https://www.cnn.com/2026/08/27/world/live-news/iran-war-trump"},"tabs":{"defense":{"defense":[{"headline":"Carrier Swap Highlights Strain of Extended Middle East Deployment","body":"The carrier USS George Washington arrived in the Middle East on August 26 to relieve the USS Abraham Lincoln, which is finally heading home after an unusually long deployment tied to the six-month war with Iran. The rotation underscores how much the sustained carrier presence has stretched the Navy even as no resolution to the conflict is in sight.","source":"CNN","url":"https://www.cnn.com/2026/08/20/world/live-news/iran-war-trump"},{"headline":"Federal Judge Strikes Down Pentagon's Anthropic Supply-Chain Designation","body":"A federal judge this week ruled that the Pentagon's designation of AI firm Anthropic as a supply-chain risk was unlawful, undercutting the Department of War's attempt to gatekeep which AI vendors can serve the military. The ruling comes just months after the Pentagon signed multi-year deals with eight major tech firms to embed generative AI into classified Impact Level 6 and 7 networks, and it raises new questions about how the department can vet frontier AI providers going forward.","source":"The Hill","url":"https://thehill.com/policy/technology/6056449-openai-tech-firms-cyberattacks-response/"},{"headline":"US and Allies Wrap Pacific Dragon Missile Defense Drill as New Zealand Sails West","body":"US 3rd Fleet, the Missile Defense Agency and multinational partners concluded the biennial Pacific Dragon 2026 exercise around Hawaii, refining integrated air and missile defense tactics and tactical data-link sharing across the Indo-Pacific. Separately, a Royal New Zealand Navy task group built around the frigate HMNZS Te Mana and tanker HMNZS Aotearoa has departed on a two-month Indo-Pacific deployment, opening with patrols to monitor North Korean sanctions evasion.","source":"USNI News","url":"https://news.usni.org/2026/08/18/u-s-allies-hold-major-ballistic-missile-defense-drill-new-zealand-starts-pacific-patrol"}],"acquisitions":[{"headline":"Boeing Locks In $131 Billion F-15 Sustainment Mega-Contract","body":"Boeing secured a ceiling contract worth up to $131.23 billion on August 26 covering long-term production, modernization and sustainment of F-15 fighters for the US and allied air forces. The award cements the F-15's role alongside fifth-generation fleets for at least another decade and gives Boeing's defense production line a multi-year revenue backbone.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/aerospace-news"},{"headline":"Air Force Orders New AESA Radar for Aging B-52 Fleet","body":"The US Air Force awarded Raytheon a $603 million contract to equip B-52 Stratofortress bombers with the new AN/APQ-188 AESA radar, part of the broader B-52J modernization meant to keep the decades-old airframe viable into the 2050s. The upgrade is intended to sharpen the bomber's target detection and survivability against modern air defenses.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/aerospace-news"}]},"us":[{"headline":"Boston Judge Halts Trump-Ordered USPS Mail Ballot Restrictions Again","body":"U.S. District Judge Indira Talwani issued a 14-day temporary restraining order on August 27 blocking core provisions of a Postal Service rule that would require states to submit absentee-voter lists before USPS delivers mail ballots. The move comes just days after the Supreme Court's August 24 decision forced Talwani to vacate her earlier nationwide injunction, and sets up a September 3 hearing on a longer-term block. Democratic-led states and groups like the League of Women Voters argue the rule, finalized August 21, risks disenfranchising voters with the November 3 midterms just over two months away.","source":"Reuters/US News","url":"https://www.usnews.com/news/politics/articles/2026-08-27/judge-blocks-rule-implementing-trump-plan-to-restrict-mail-in-voting"},{"headline":"Federal Judge Presses Kennedy Center Board Over Renewed Bid to Add Trump's Name","body":"U.S. District Judge Christopher Cooper held an emergency hearing August 27 to weigh blocking a Kennedy Center Board resolution, passed August 13, that would inscribe the facade with language crediting Trump for 'restoring and renovating' the venue and naming its grounds after him. The move follows Cooper's May ruling that only Congress can rename the Kennedy Center, a decision the administration is still appealing while a tarp has covered the marble facade since June. Commerce Secretary Howard Lutnick, who helps oversee the center, defended the board's vote as overwhelming and framed Trump's involvement as necessary to prevent the building's physical deterioration.","source":"Reuters/Detroit News","url":"https://www.detroitnews.com/story/news/nation/2026/08/27/us-judge-weighs-challenge-restore-trumps-name-kennedy-center/91487232007/"},{"headline":"Trump Renames Lake Ontario 'Lake America' as Canada Trade War Deepens","body":"Trump signed an executive order August 27 declaring Lake Ontario will 'immediately' become 'Lake America,' escalating tensions after the U.S. imposed 50% tariffs on roughly $20 billion of Canadian goods over the preceding weekend. Canada retaliated with matching dollar-for-dollar tariffs of up to 50% set to take effect September 8, though it trimmed levies on seafood and fish products this week. Canadian Prime Minister Mark Carney rejected the renaming, noting the Indigenous-derived name predates both nations and vowing the lake will 'forever' be called Lake Ontario, as U.S. Trade Representative Jamieson Greer confirmed talks with Ottawa remain stalled.","source":"CNN","url":"https://www.cnn.com/2026/08/27/politics/trump-canada-lake-ontario-america"},{"headline":"Republican Governor Breaks Ranks Over DOJ Election Monitors Ahead of Midterms","body":"Wyoming's Republican Governor Mark Gordon publicly voiced concerns August 28 about a Justice Department plan to deploy election monitors across states for the November midterms, a rare break from his party as Trump's administration expands federal oversight of state-run elections. The monitor deployment, reported to involve roughly 1,000 personnel, arrives alongside the administration's separate push to restrict mail ballots via USPS rulemaking, compounding a broader fight over federal versus state control of election administration less than 70 days before voters go to the polls.","source":"CNN Newsource","url":"https://kvia.com/category/politics/cnn-us-politics/"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Prepares Record $56 Billion Defense Budget After White Paper Names China Top Threat","body":"Japan's Ministry of Defense is finalizing a record 8.9 trillion yen (about $56.1 billion) budget request due at month's end, building on the 2026 Defense White Paper approved August 4 that labels China 'the greatest strategic challenge' to Japanese security. The document endorses continued fielding of Type-25 land-based anti-ship missiles with roughly 1,000-kilometer range and expanded Tomahawk cruise-missile purchases capable of striking Chinese territory from Japanese destroyers. Tokyo has set a goal of taking primary responsibility for repelling invasions of its territory by fiscal year 2027, a marked shift from decades of near-total reliance on Washington.","source":"Defense News","url":"https://www.defensenews.com/global/asia-pacific/2026/08/10/japans-2026-defense-white-paper-highlights-new-era-of-crisis-in-indo-pacific/"},{"headline":"Manila's ASEAN Chairmanship Fails to Harden Bloc's South China Sea Stance","body":"Despite holding the ASEAN chair in 2026 with new domestic legal groundwork and bilateral partner support, the Philippines could not move fellow foreign ministers toward tougher joint language on the South China Sea, producing a communique nearly identical to Malaysia's from the prior year. Manila is still pushing for a Code of Conduct by year's end, with Foreign Secretary Theresa Lazaro warning the waterway must not become 'another Strait of Hormuz' given the fuel-price shocks the Philippines has absorbed from the Iran war. The diplomatic stall comes as Philippine and Chinese vessels continue clashing at Scarborough and Second Thomas Shoals on a near-weekly basis.","source":"Asia Times","url":"https://asiatimes.com/2026/07/the-south-china-sea-consensus-no-asean-chair-can-move/"},{"headline":"Australia Trials University-Built Telescope to Close Space-Surveillance Gaps","body":"The Australian Defence Force disclosed August 27 that it is trialing a University of New South Wales-developed 'Viper' telescope to test how ground-based optical sensors, automated tasking, and data analysis can strengthen the country's space situational awareness. The pilot reflects growing concern in Canberra about tracking adversary satellites and counterspace activity across the Indo-Pacific as reliance on allied space assets comes under scrutiny. It adds to a broader push by Australia and regional partners to build indigenous surveillance and targeting infrastructure rather than depending solely on U.S. systems.","source":"Defence Connect","url":"https://www.defenceconnect.com.au/news"}],"pacingThreat":[{"headline":"Analysts Map PLA Milestones Toward Xi's 2027 Taiwan-Readiness Deadline","body":"A August 27 analysis from the Lowy Institute by a 35-year CIA veteran of East Asia analysis lays out the operational signposts intelligence watchers are tracking as the PLA approaches Xi Jinping's 2027 military-readiness target, including expanded space launches, a proliferated low-earth-orbit satellite constellation resembling Starlink, and counterspace operations designed to threaten Taiwanese and U.S. communications. The piece warns these steps will increasingly blur the line between routine proficiency exercises and genuine invasion preparation. It lands amid what the author calls an unusually volatile stretch in both U.S.-China and cross-strait relations.","source":"Lowy Institute","url":"https://www.lowyinstitute.org/the-interpreter/china-taiwan-pla-s-2027-milestones"},{"headline":"PLA Missile Test Adds Nuclear Second-Strike Capability to Taiwan Pressure Campaign","body":"The Council on Foreign Relations' Taiwan conflict tracker, updated August 27, reports that a recent PLA missile test demonstrates an enhanced nuclear second-strike capability, layering a new strategic-deterrence dimension onto Beijing's grey-zone campaign around the island. That campaign already includes near-daily air-defense-identification-zone incursions and expanding coast guard patrols tied to Xi's stated 're-unification' objective by 2049. The tracker also notes that mixed signals from President Trump on U.S. defense commitments have deepened uncertainty in Taipei about the durability of American backing.","source":"Council on Foreign Relations","url":"https://www.cfr.org/global-conflict-tracker/conflict/confrontation-over-taiwan"},{"headline":"Taiwan Logs Dozens of Daily PLA Incursions Amid Its Own Largest-Ever Reservist Call-Up","body":"Taiwan's Ministry of National Defense has continued tallying near-daily PLA gray-zone activity, tracking Chinese military aircraft and PLA Navy vessels dozens of times within single-day windows through August, prompting Taipei to scramble combat air patrols, deploy naval ships, and activate coastal missile batteries each time. The tempo coincides with Taiwan's own annual exercises, which this year mobilized the island's largest-ever reservist call-up and featured live-fire drills more extensive than those held during the 1996 Third Taiwan Strait Crisis. Together, the trends point to both sides preparing for a potentially prolonged, Ukraine-style conflict rather than a short, decisive fight.","source":"Taiwan News","url":"https://www.taiwannews.com.tw/news/6415051"}]},"europe":{"ukraineRussia":[{"headline":"Russia Pummels Kyiv and Central Ukraine in Hours-Long Drone Barrage","body":"A sustained Russian drone assault stretched into the morning of August 27, striking Kyiv's Holosiivskyi and Pecherskyi districts and damaging a sports complex and vehicles, while separate strikes destroyed a major Roshen confectionery warehouse in Boryspil district and hit distribution centers belonging to the Comfy and Aurora retail chains. Industrial enterprises in Kremenchuk and an energy facility near Myrhorod in Poltava region were also targeted, triggering emergency power outages that left residents of seven settlements without electricity. The attacks form part of a broader pattern of Russian strikes stretching from Odesa to Kharkiv as the war grinds on with no ceasefire in sight.","source":"United24 Media / Ukrinform","url":"https://united24media.com/war-in-ukraine"},{"headline":"Ukraine Hits Russian Command Posts Near Donetsk as Moscow Plots New Mobilization Wave","body":"Ukrainian forces struck both the main and reserve command posts of the Russian army near occupied Donetsk with missiles on August 26 and overnight into August 27, targeting Moscow's operational leadership in the region. Simultaneously, Kyiv's intelligence assessments indicate Russia is preparing an additional mobilization drive spanning 2026 and 2027, aiming to recruit roughly 300,000 troops this year and another 300,000 next year to sustain manpower for the grinding war of attrition. Ukraine also reported drone strikes on Russian energy infrastructure, including the Bashneft-Ufaneftekhim refinery in Bashkortostan, extending the war deep into Russian territory.","source":"Ukrinform","url":"https://www.ukrinform.net/rubric-ato"}],"europe":[{"headline":"Pentagon Pressures NATO Allies to Shoulder More of Europe's Defense","body":"US Under Secretary of Defense Elbridge Colby met NATO Secretary General Mark Rutte at alliance headquarters in Brussels on August 27 to press European allies to prove they are stepping up as Washington redirects attention toward challenges closer to home and in the Indo-Pacific. The Pentagon has already begun trimming the roughly 80,000 US troops still stationed in Europe and is reviewing how much deeper those cuts should go, with further reductions contingent on how allies respond to a US survey demanding greater basing and airspace access. Colby singled out Germany, Poland, and Scandinavian countries for praise while pointedly saying Washington wants to see more from the United Kingdom.","source":"Washington Times","url":"https://www.washingtontimes.com/news/2026/aug/27/us-defense-review-presses-nato-allies-prove-taking-lead-europe/"},{"headline":"Migration Remains Europe's Defining Political Fault Line","body":"Irregular migration continues to dominate European politics, illustrated starkly this summer when more than 70,000 people entered Spain's North African enclave of Ceuta within hours, forcing emergency border measures and a five-point enforcement plan from Brussels. The European Commission has responded by proposing to nearly triple migration-management funding to €81 billion in the 2028-2034 EU budget, including €12 billion for the border agency Frontex, whose mandate is set to expand significantly. Rights groups, including the EU's own Fundamental Rights Agency, warn that accountability for abuses at the bloc's borders still lags far behind the enforcement buildup.","source":"Human Rights Watch / The Workers Rights","url":"https://www.hrw.org/world-report/2026/country-chapters/european-union"}]},"middleEast":[{"headline":"Qatar Tries to Revive Iran Diplomacy as Hormuz Talks Stall","body":"Qatari Prime Minister Sheikh Mohammed bin Abdulrahman al-Thani traveled to Tehran on August 27 to meet Iranian Foreign Minister Abbas Araghchi in an attempt to relaunch mediation, even as the White House insists it is not currently talking to Iran and vows to intensify economic pressure. A senior Iranian source told Reuters that a proposed agreement with Oman over sharing the Strait of Hormuz and its revenues has not been finalized despite Iran's Revolutionary Guard claiming a framework had been reached. The unresolved Hormuz question remains the central flashpoint six months into the wider Iran war.","source":"Reuters / Just Security","url":"https://www.justsecurity.org/155398/early-edition-august-27-2026/"},{"headline":"Hezbollah Chief Rejects Lebanon Deal, Vows No 'Surrender' to Israel","body":"Hezbollah leader Naim Qassem publicly rejected the US-brokered framework agreement between Israel and Lebanon, declaring in a televised address on Al-Manar that his group refuses to surrender nearly six months after Hezbollah dragged Lebanon into the regional war by attacking Israel on March 2. Lebanese authorities say Israel's subsequent strikes and ground invasion have killed more than 4,300 people in Lebanon. Qassem's defiance complicates the direct Israel-Lebanon talks Washington has sponsored to try to formalize an end to hostilities.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-august-28-2026/"},{"headline":"Secret Israel-Hamas Channel Credited for Gaza Hostage Deal as Strikes Continue","body":"A previously undisclosed direct channel between Israeli officials and Hamas, approved at the prime ministerial level, is being credited with breaking the impasse that produced this week's hostage-deal breakthrough, according to a source familiar with the talks. Even so, the Israeli military said it killed Hamas and Islamic Jihad operatives in Gaza strikes on Thursday, including a Khan Younis strike that killed Ismail Mohammed Ibrahim Barim, a commander accused of holding hostages Edan Alexander, Matan Zangauker, and Avera Mengistu earlier in the war. Separately, twelve countries — eight of them EU members — condemned Israel's operation to dismantle an UNRWA vocational training center in East Jerusalem's Kafr Aqab area this week.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-august-27-2026/"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Locks In $45 Billion, Six-Year Compute Deal With UK Startup Nscale","body":"Anthropic has committed to spend $45 billion over six years renting AI computing capacity from British infrastructure firm Nscale, covering roughly 460 megawatts tied to a West Virginia data center buildout that will run on Nvidia's next-generation Vera Rubin systems starting in late 2027. The deal reflects how frontier labs are now behaving like energy-intensive industrial firms, locking down land, power, and chips years ahead of need rather than relying purely on hyperscaler partners. It also elevates Nscale, founded only in 2024, as a serious infrastructure counterpart to Amazon, Microsoft, and Google in the AI compute race.","source":"Tech Startups","url":"https://techstartups.com/2026/08/27/top-tech-news-today-august-27-2026-amazon-apple-google-meta-nvidia-openai-salesforce-more/"},{"headline":"Chinese AI Firms Exploit Cloud Loophole to Reach Banned Nvidia Chips","body":"Chinese companies including Moonshot AI are reportedly obtaining compute from Nvidia's most advanced chips, including GB300s, through rented capacity at data centers in Southeast Asia rather than direct imports, sidestepping U.S. export bans since restrictions target chip ownership, not remote access. A researcher at the Institute for AI Policy and Strategy said this arrangement can be legal 'so long as Moonshot isn't actually buying and owning the physical hardware directly.' Lawmakers are now weighing the Remote Access Security Act to close the gap by regulating cloud-based access to controlled hardware, a step that would directly affect how Washington polices the AI compute race with Beijing.","source":"CNBC","url":"https://www.cnbc.com/2026/08/19/china-ai-nvidia-chips-us-export-controls.html"}],"cyberEmerging":[{"headline":"FBI, DOJ Seize Domains Tied to Chinese State-Linked Hacking Toolkit","body":"The Justice Department and FBI announced the seizure of domains connected to two hacking tools, QScan and QTRouter, developed by a Nanjing-based group called QTFY that court filings link to China's Ministry of State Security and the PLA. Investigators say QTFY sold intrusion services to paying clients and that the tools had been used against U.S. government networks for years before the takedown. The action marks one of the more direct U.S. law-enforcement strikes against Chinese state-sponsored cyber infrastructure in recent months.","source":"IT Security Newsletter (Cadre)","url":"https://blog.cadre.net/it-security-newsletter/it-security-newsletter-8-27-2026"},{"headline":"Russian APT28 Unit Hides Espionage Traffic Behind Microsoft Edge and Webhook Services","body":"Recorded Future's Insikt Group has documented a new campaign by BlueDelta, the Russian military-linked group also tracked as APT28, using webhook.site and Microsoft Edge to conceal a malware framework dubbed HOOKEDGE while targeting European government networks. The technique lets the group blend espionage command-and-control traffic with legitimate cloud and browser services, complicating detection by defenders. The disclosure adds to a string of Russian state-linked cyber operations against European governments amid the ongoing Ukraine war.","source":"Security Affairs","url":"https://securityaffairs.com/"}]},"cities":{"lasVegas":[{"headline":"Reno's Hawk Fire Prompts Lombardo to Seek Federal Emergency Declaration","body":"Governor Joe Lombardo is pushing for a presidential emergency declaration after the Hawk Fire tore through the hills northwest of Reno, scorching 15,085 acres since igniting on August 22. The blaze forced evacuation orders or warnings for roughly 90,000 residents at its peak and destroyed homes, including one belonging to Crystal Hallock in northwest Reno. State officials are now racing to unlock federal disaster assistance as cleanup begins across the Truckee Meadows.","source":"Las Vegas Sun","url":"https://lasvegassun.com/news/breakingnews/"},{"headline":"911 Records Surface in Fatal Shooting of Metro Officer Abdelnabi","body":"Newly released 911 call transcripts are shedding light on prior police contacts involving the man accused of fatally shooting Las Vegas Metro Officer Austin Abdelnabi. The records, made public Friday, are expected to factor heavily into the ongoing investigation and any future prosecution. Metro has not yet detailed how the prior encounters may have influenced department response protocols.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Officer-Involved Shooting Near College of Southern Nevada Under Investigation","body":"Las Vegas police shot and wounded an 'agitated' woman who was reportedly armed with a weapon early Friday morning near the College of Southern Nevada in the west valley. The incident remains under active investigation, with authorities yet to release the woman's condition or full details of the confrontation. It marks at least the second high-profile police use-of-force incident in the valley this week.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"}],"nellis":[{"headline":"Air Force Pushes Autonomous Wingman Drones Through Trials at Creech","body":"The Air Force's Collaborative Combat Aircraft Experimental Operations Unit has been putting semi-autonomous drone wingmen through their paces at Creech Air Force Base during a recent Agile Combat Employment exercise. The testing reflects the service's broader push to field AI-piloted aircraft that can fly alongside crewed fighters in contested environments. Creech, alongside Nellis and the Nevada Test and Training Range, remains the Air Force's primary proving ground for next-generation unmanned combat technology.","source":"Nellis Air Force Base Public Affairs","url":"https://www.nellis.af.mil/Nellis-News/Article-Display/Article/4556808/air-force-tests-collaborative-combat-aircraft-at-creech/"}]},"feelGood":[{"headline":"Devoted Volunteer's Repeat Shelter Visits Finally Land Grieving Dog a Home","body":"A black-and-white pit bull mix named Nancy spent months without a single adoption inquiry after her owner passed away, sinking into visible depression behind her kennel bars. A content creator known online as Rachel began visiting Nancy week after week, refusing to give up on her even as other shelter dogs came and went. The persistence paid off when Nancy was finally adopted, turning a quiet shelter corner into a story of patience and second chances.","source":"GreaterGood","url":"https://greatergood.com/blogs/news/cw-how-consistent-compassion-sparked-a-shelter-dog-adoption-miracle"},{"headline":"Veteran Tickets Foundation Nears Its 2026 Goal of Granting Every Hero's Wish","body":"The nonprofit Veteran Tickets Foundation, known as Vet Tix, reports that donors have contributed $175,000 toward its 2026 goal of fulfilling 100 percent of requested 'Hero's Wishes' for currently serving military members, veterans and Gold Star families. The organization provides free event tickets to concerts, sports and shows as a small gesture of gratitude for service and sacrifice. The steady flow of donations shows public appreciation for military families remains strong even amid broader economic pressures.","source":"Vet Tix","url":"https://www.vettix.org/"},{"headline":"Strangers' Small Gestures Give Homeless Guests Reason to Hope in Colorado Springs","body":"At Springs Rescue Mission, guests marked Random Acts of Kindness Day by recounting moments when strangers changed their outlook, including one man who broke down in tears after someone unexpectedly handed him a coat on the street. Another guest described a night he and his wife were out of food when a nearby coffee shop began setting out leftover sandwiches just as they wondered where their next meal would come from. Shelter staff say these small, unplanned acts of generosity often do as much for morale as formal aid programs.","source":"Springs Rescue Mission","url":"https://www.springsrescuemission.org/articles/random-acts-of-kindness-day-guests-tell-stories-of-help-and-hope"}],"onThisDay":[{"year":"1963","event":"Martin Luther King Jr. delivered his 'I Have a Dream' speech during the March on Washington for Jobs and Freedom."},{"year":"1955","event":"Fourteen-year-old Emmett Till was abducted in Mississippi, a killing that galvanized the civil rights movement."},{"year":"1988","event":"A mid-air collision during the Ramstein air show in West Germany killed 70 people and injured hundreds."},{"year":"1996","event":"The divorce of Prince Charles and Princess Diana was formally finalized in London."}]},"topPicks":[{"headline":"Trump Abandons Iran Truce Framework as War Grinds Into Seventh Month","teaser":"Collapse of the truce framework signals an escalating, protracted conflict with major regional and global security implications."},{"headline":"PLA Missile Test Adds Nuclear Second-Strike Capability to Taiwan Pressure Campaign","teaser":"China's expanding nuclear posture around Taiwan raises the stakes of a potential great-power confrontation in Asia."},{"headline":"Russia Pummels Kyiv and Central Ukraine in Hours-Long Drone Barrage","teaser":"A massive drone assault underscores the war's continued intensity and its toll on Ukrainian civilians and infrastructure."}]},"navDates":[{"key":"2026-09-01","label":"Sep 1","href":"/","isNewest":true},{"key":"2026-08-31","label":"Aug 31","href":"/archive/2026-08-31.html","isNewest":false},{"key":"2026-08-30","label":"Aug 30","href":"/archive/2026-08-30.html","isNewest":false},{"key":"2026-08-29","label":"Aug 29","href":"/archive/2026-08-29.html","isNewest":false},{"key":"2026-08-28","label":"Aug 28","href":"/archive/2026-08-28.html","isNewest":false},{"key":"2026-08-27","label":"Aug 27","href":"/archive/2026-08-27.html","isNewest":false},{"key":"2026-08-26","label":"Aug 26","href":"/archive/2026-08-26.html","isNewest":false}],"currentKey":"2026-08-28","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-28.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
