<script>
const STATE = {"digest":{"date":"Friday, August 28, 2026","generatedAt":"Fri, Aug 28, 6:53 AM PDT","breaking":{"headline":"Iran war costs push US Navy into fiscal emergency, internal memos show","body":"According to Pentagon documents and interviews reported by the Guardian on August 27, the Navy has been forced to shift money out of payroll and other core accounts to cover the costs of the ongoing air campaign against Iran, which has also drained munitions stockpiles. A Pentagon memo reportedly warns of shortfalls in payroll funding after the department repeatedly raided those accounts, with retired naval officer Harlan Ullman describing the situation bluntly as broken. The strain comes as Iranian retaliatory strikes have damaged US-linked bases across the Middle East, compounding budget pressure just as the Pentagon separately weighs troop cuts in Europe.","source":"Foreign Exchanges / The Guardian","url":"https://www.foreignexchanges.news/p/world-roundup-august-27-2026"},"tabs":{"defense":{"defense":[{"headline":"Pentagon fast-tracks review of US troop levels in Europe","body":"Reuters reported August 27 that the Defense Department is aiming to finish its review of US military posture in Europe by November 6, about a month ahead of schedule, and plans to hand Defense Secretary Pete Hegseth at least four options for drawing down the roughly 80,000 troops still stationed there. The push aligns with President Trump's demand that European allies shoulder more of NATO's defense burden, sharpened by frustration that Europeans didn't back the Iran campaign to the degree he wanted. Washington has also circulated a questionnaire to European allies probing base-access rules and restrictions on defense-industrial cooperation.","source":"Foreign Exchanges / Reuters","url":"https://www.foreignexchanges.news/p/world-roundup-august-27-2026"},{"headline":"Navy unveils classified seabed-warfare drone armed with heavy torpedoes","body":"Naval News reported August 27 on Liberator, a previously undisclosed seabed-warfare system launched from uncrewed submarines and capable of firing the US Navy's largest ship-killing torpedoes. The disclosure adds to a string of recent Navy unmanned-systems reveals aimed at expanding undersea strike options against peer competitors. Details on deployment timelines remain limited given the program's classified status.","source":"Naval News","url":"https://www.navalnews.com/category/naval-news/"},{"headline":"Colby presses NATO allies to prove they can lead Europe's defense","body":"US Under Secretary of War for Policy Elbridge Colby met NATO Secretary General Mark Rutte and the North Atlantic Council in Brussels on August 27, publicly pressing allies to demonstrate they are stepping up as Washington reorients toward the Indo-Pacific and homeland priorities. The visit coincided with the Pentagon's accelerated European posture review and came as some allies bristled at not being consulted before the US strikes on Iran. Colby argued the US still needs guaranteed operational access and predictability from allies even as it shifts emphasis away from the continent.","source":"The Washington Times","url":"https://www.washingtontimes.com/news/2026/aug/27/us-defense-review-presses-nato-allies-prove-taking-lead-europe/"}],"acquisitions":[{"headline":"Navy pushes Castelion's Blackbeard hypersonic missile toward 2028 fielding","body":"The US Navy awarded Castelion an $89.9 million contract on August 26 to advance its Blackbeard hypersonic strike weapon toward Early Operational Capability by 2028, per Naval News. The deal builds on Castelion's rapid growth in hypersonic strike systems and reflects the Pentagon's urgency to field longer-range conventional strike options amid stretched munitions stocks following the Iran campaign.","source":"Naval News","url":"https://www.navalnews.com/category/naval-news/"},{"headline":"Missile Defense Agency taps X-Bow for low-cost interceptor prototype","body":"The Missile Defense Agency awarded X-Bow Systems a $10.98 million contract to develop and flight-test a low-cost ballistic-missile interceptor, according to Army Recognition's rolling defense-news tracker. The award is part of a broader Pentagon push toward cheaper, faster-to-produce interceptors as adversary missile inventories grow and existing systems like Patriot remain in high demand.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026"}]},"us":[{"headline":"House Democrats Open Insider-Trading Probe Into Trump Jr.'s Venture Fund","body":"Rep. Jamie Raskin, the top Democrat on the House Judiciary Committee, sent a letter this week demanding records from 1789 Capital, the venture firm Donald Trump Jr. joined as a partner just four days after the 2024 election. Raskin's letter flags the firm's leap from roughly $150 million to about $3 billion in assets under management, pointing to its stake in rare-earths firm Vulcan Elements, which later landed a $620 million Pentagon loan, plus bets on Juul, Polymarket and Anduril Industries. Trump Jr. has denied having access to nonpublic government information, saying his investment timing reflected educated guesses rather than insider knowledge.","source":"MS NOW","url":"https://www.ms.now/news/don-jr-1789-capital-investigation"},{"headline":"Boston Judge Lifts Block on Trump's Mail-Ballot Order, Fueling New Legal Fight","body":"A federal judge in Boston has voided the nationwide injunction that had been stopping the U.S. Postal Service from carrying out President Trump's executive order curbing mail-in ballot handling for the midterms. The reversal means the order is technically in force nationwide for the first time, though voting-rights groups are expected to seek a fresh injunction within days. With the midterms about ten weeks out, the whiplash is complicating last-minute planning by state election officials over mail-ballot logistics.","source":"NPR","url":"https://www.npr.org/sections/elections/"},{"headline":"Court Ruling Loosens Super PAC Coordination Limits Before Midterms","body":"A federal court decision this week in NRSC v. FEC narrowed the legal definition of 'coordination' between campaigns and Super PACs, stripping the Federal Election Commission of several tools it had used to police joint spending. Analysts say the ruling, landing just over two months before the November 3 midterms, could unleash a new wave of tightly aligned, record-setting Super PAC spending. Because the decision removes old boundaries without installing clear replacements, campaign-finance lawyers warn the rules of engagement will now largely be shaped through further litigation rather than FEC regulation.","source":"WRDW","url":"https://politics-government.news-articles.net/content/2026/08/27/federal-court-ruling-reshapes-2026-midterm-campaign-finance.html"},{"headline":"Markets Brace for Jobs Report as Fed Weighs Size of Next Rate Cut","body":"Traders are focused on Friday's August jobs report along with incoming ISM manufacturing and services surveys, JOLTS openings data and the ADP employment reading, all landing before the Federal Reserve's September 15-16 policy meeting. The data dump is seen as pivotal for whether the central bank opts for a modest or deeper rate cut after a summer of tariff-driven inflation pressure layered on top of a visibly cooling labor market. The reports coincide with a heavy earnings slate from companies including Dell, NetApp and Broadcom, adding to volatility risk heading into September.","source":"Schaeffer's Investment Research","url":"https://www.schaeffersresearch.com/content/news/2026/08/27/the-week-ahead-august-jobs-report-takes-center-stage"}],"pacific":{"pacificCommand":[{"headline":"Philippines Presses UN Seabed Claim as South China Sea Friction Persists","body":"Manila's standoff with Beijing over Scarborough Shoal and Second Thomas Shoal remains unresolved, with the Council on Foreign Relations noting three separate ship-to-ship clashes in a single week in July that triggered joint U.S.-Philippines-Japan naval drills. Talks on a binding South China Sea code of conduct remain stalled even as the Philippines, chairing ASEAN this year, pushes its formal UN bid for extended seabed rights off Palawan. Manila has simultaneously deepened defense ties with Tokyo, Washington and Canberra, including expanded U.S. base access and Japanese arms transfers, cementing its role as the region's most exposed frontline state."},{"headline":"Japan Set to Submit Record $56 Billion Defense Budget Request","body":"Tokyo is finalizing a record roughly 8.9 trillion yen (about $56.1 billion) defense budget request due for submission at the end of August, building on this year's Defense of Japan white paper that labeled China the country's greatest strategic challenge. The August 4 white paper also flagged deepening China-Russia military coordination and warned a Ukraine-style act of aggression could occur in East Asia. Prime Minister Sanae Takaichi's government is aiming to lock in its 2% of GDP defense-spending target and revise Japan's three core security documents before year's end."},{"headline":"Solomon Islands Signs Maritime Security Pact With Washington","body":"The Solomon Islands and the United States have signed a shiprider agreement on countering illicit transnational maritime activity, allowing American vessels to patrol Solomon waters jointly with local personnel. The deal marks a notable shift for Honiara, which had previously leaned toward Beijing under a 2022 security pact. Analysts tracking the region see it as part of a broader Washington effort to counter Chinese inroads among Pacific Island states through capacity-building and law-enforcement cooperation rather than direct military buildup."}],"pacingThreat":[{"headline":"PLA and Indonesian Navies Stage Joint Drill Off Taiwan's Coast","body":"A Chinese PLA Navy frigate and an Indonesian Navy frigate conducted what Beijing termed a naval navigational exercise east of Taiwan, with Chinese state media using the drill to assert sovereignty claims over Taiwan's eastern exclusive economic zone. The exercise follows near-continuous China Coast Guard patrols east of Taiwan ongoing since June, part of a broader pattern analysts describe as Beijing expanding de facto control through pressure short of open conflict. Open-source military trackers assess the tactic is designed to gradually erode Taiwanese sovereignty while setting favorable conditions for any future PLA operation."},{"headline":"PLA Marks 99th Anniversary Touting New Carrier Air Wing Amid Leadership Turmoil","body":"China's military used its August 1 founding anniversary to spotlight the formal rollout of three new carrier-based aircraft unveiled in May, the J-35 stealth fighter, the J-15T, and the KJ-600 airborne early-warning plane, as part of Xi Jinping's drive toward a world-class force by the PLA's 2027 centenary goal. State media paired the announcement with continuing anti-piracy patrols in the Gulf of Aden and hospital-ship diplomacy across the South Pacific and Latin America. The messaging lands against a backdrop of unusual turbulence at the top of the PLA following the January 2026 detention of Central Military Commission Vice Chairman Zhang Youxia, the most senior officer purged since 1971."},{"headline":"Taiwan Runs Largest-Ever Invasion-Response Drills, Borrowing U.S. Playbook","body":"Taiwan carried out its largest annual Han Kuang exercises to date this month, simulating a 10-day response to a Chinese invasion with chemical-attack scenarios, live-fire training and tactics modeled on U.S. military doctrine. An August 13 iteration had island forces rehearsing tunnel defense designed to block PLA advances, part of a wider push to fold low-cost drone warfare into Taiwan's defense concept. The drills come as Taipei's planners study lessons from Ukraine and flag that Chinese coast guard and maritime militia patrols around Taiwan's outlying islands have become an almost permanent fixture since 2024."}]},"europe":{"ukraineRussia":[{"headline":"Russia Launches Fresh Wave of Over 100 Attack Drones Overnight","body":"Russian forces fired more than 100 jet-powered attack drones at Ukraine overnight into August 28, with Ukrainian air defenses downing 137 drones across 16 impact sites. Strikes hit Nova Post warehouse facilities in Kyiv region's Bilohorodka community and a production site in Sviatopetrivske, while attacks on Kharkiv and 16 other settlements in Kharkiv region killed two people and wounded 13. Kyiv-region residents endured roughly 14 hours of air-raid sirens according to Ukraine's emergency service, a reminder that bombardment continues unabated even as ceasefire diplomacy resurfaces.","source":"RBC-Ukraine","url":"https://newsukraine.rbc.ua/war-in-ukraine"},{"headline":"Kremlin Signals Openness to New Trilateral Talks as Moldova, Ukraine Deepen Security Ties","body":"The Kremlin responded Thursday to reports of possible new Ukraine-Russia-US negotiations in September, even as fighting continues on the ground. Separately, Moldovan President Maia Sandu met with Volodymyr Zelensky and called for tighter Moldova-Ukraine-Romania cooperation on airspace protection, citing ongoing Russian aggression, while also discussing bilateral energy cooperation. Sweden additionally announced it will transfer 10 high-speed boats to Ukraine for mine clearance and rescue work, a sign allies keep bolstering military support alongside the renewed diplomatic track.","source":"Ukrinform","url":"https://www.ukrinform.net/block-lastnews"}],"europe":[{"headline":"Pentagon Presses NATO Allies as Patriot Missile Stocks Hit 'Beyond Critical' Lows","body":"US Under Secretary of Defense Elbridge Colby met NATO chief Mark Rutte in Brussels on August 27, pressing European allies to take the lead in their own defense as Washington redirects focus to the Indo-Pacific; roughly 80,000 US troops remain in Europe amid a Pentagon review of possible further cuts. The visit coincided with an AP report that US Patriot interceptor stocks in Europe are 'beyond critical,' with the six-month Iran war having consumed about 1,500 of the US's 2,330 Patriot interceptors, according to CSIS estimates. A NATO official confirmed low Patriot inventories among American and allied forces, leaving only limited capability to stop a stray or deliberate Russian ballistic missile strike, though Germany's first European Patriot production line is set to open in September.","source":"Washington Times / AP","url":"https://www.washingtontimes.com/news/2026/aug/27/us-defense-review-presses-nato-allies-prove-taking-lead-europe/"},{"headline":"Hybrid Sabotage Wave Keeps Testing European Airspace and Infrastructure","body":"European governments are contending with an escalating pattern of drone incursions and suspected Russian sabotage: NATO fighter jets shot down a stray drone over Latvia in mid-August, German airports have repeatedly halted flights after drone sightings, and Lithuanian officials have warned Russia may be preparing a false-flag drone attack on its territory. Poland separately disclosed it had foiled a plot linked to Russia to kill a Ukrainian-US citizen on Polish soil. With NATO itself warning that Moscow's tolerance for risk near allied airspace is rising, hybrid-warfare resilience has become the most pressing near-term security concern for European capitals outside the Ukraine front line.","source":"Bloomberg","url":"https://www.bloomberg.com/latest/nato"}]},"middleEast":[{"headline":"Qatar Pushes Tehran Diplomacy as Iran War Nears Six-Month Mark","body":"Qatari Prime Minister Sheikh Mohammed bin Abdulrahman al-Thani traveled to Tehran on August 27 to relaunch mediation efforts, meeting Iran's foreign minister as the conflict approaches its six-month anniversary. Iranian Foreign Ministry spokesman Esmaeil Baghaei confirmed the trip is meant to continue Qatar's mediation role, even as the White House said it was not currently engaged in direct talks with Tehran. Separately, a senior Iranian source cautioned that a proposed Iran-Oman agreement on sharing Strait of Hormuz revenues has not been finalized, despite an earlier IRGC claim that terms had been reached.","source":"Just Security (Reuters)","url":"https://www.justsecurity.org/155398/early-edition-august-27-2026/"},{"headline":"Fresh Tanker Attack and Saudi Drone Swarm Underscore Gulf Volatility","body":"A new tanker attack was reported in the Strait of Hormuz on August 27, even as regional powers scrambled for an off-ramp from the six-month-old Iran war and Tehran dismissed the latest round of Trump administration sanctions. In a sign of spreading risk to Gulf energy infrastructure, Greek military personnel operating an air-defense system in Saudi Arabia intercepted a swarm of drones near Yanbu, home to major oil refining facilities. The overlapping incidents show the conflict still threatens one of the world's most critical oil and shipping corridors despite active diplomatic overtures.","source":"AP / Local10","url":"https://www.local10.com/news/2026/08/27/regional-powers-seek-off-ramp-from-iran-war-and-other-middle-east-developments/"},{"headline":"Gaza Strike Kills Former Hostage-Holder as Allies Blast Israeli Move on UNRWA Center","body":"The IDF confirmed a strike in Khan Younis killed Ismail Mohammed Ibrahim Barim, a Hamas commander who had previously held Israeli hostages Edan Alexander, Matan Zangauker and Avera Mengistu before their release, saying he had resumed attacks on troops and civilians in violation of the ceasefire. Separately, twelve countries -- eight of them EU members including Germany, Italy, Spain and Denmark -- condemned Israel's seizure this week of an UNRWA vocational training center in East Jerusalem's Kafr Aqab area near the Qalandiya refugee camp. The disputes unfolded alongside continued Israeli demolitions in Deir al-Balah and reports that settler violence in the West Bank is threatening to collapse the Palestinian economy.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-august-27-2026/"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Locks Up $45 Billion in UK-Backed Compute Capacity","body":"Anthropic has committed to a six-year, $45 billion deal to lease AI computing capacity from British infrastructure firm Nscale, covering roughly 460 megawatts tied to a West Virginia data center buildout. The capacity is expected to come online starting in late 2027 running Nvidia's next-generation Vera Rubin systems, and adds to Anthropic's already sprawling compute portfolio as it races to keep pace with demand for Claude and Claude Code. The scale of the multi-year bet shows frontier labs increasingly behaving like heavy industrial players, locking down power, land and chips years ahead of need rather than relying on spot capacity from hyperscalers.","source":"Tech Startups / Bloomberg News","url":"https://techstartups.com/2026/08/27/top-tech-news-today-august-27-2026-amazon-apple-google-meta-nvidia-openai-salesforce-more/"},{"headline":"OpenAI Rolls Out 'Frontier' Enterprise Agent Platform","body":"OpenAI began limited rollout on August 27 of a new enterprise offering called Frontier, aimed at organizations trying to deploy autonomous AI agents at scale, with wider availability planned over coming months. The company frames the launch around a growing gap between raw model capability and the organizational plumbing needed to run agents reliably in production, arguing that intelligence gains are no longer the bottleneck for enterprise AI leaders. The move intensifies competition among OpenAI, Anthropic and Google to own the emerging market for agentic workflows rather than just chat-style assistants.","source":"OpenAI","url":"https://openai.com/index/introducing-openai-frontier/"}],"cyberEmerging":[{"headline":"DOJ Disrupts China-Linked Hacking Network That Hit NASA, Fed, Senate","body":"The Justice Department announced it dismantled online infrastructure used by a Chinese state-sponsored group tracked as QTFY, which allegedly targeted NASA, the Federal Reserve, the Department of Energy and the U.S. Senate along with other critical infrastructure. In a joint operation with the FBI, authorities disabled two platforms the group used to conduct the intrusions, according to a Wednesday statement from the agency. The takedown underscores continued, wide-ranging Chinese cyber-espionage activity against core U.S. government functions even as Washington and Beijing manage a fragile trade and tech truce.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-08-27/us-says-china-linked-hackers-targeted-nasa-fed-and-senate"},{"headline":"CISA Red-Team Report Exposes Wide Gap in Infrastructure Cyber Defenses","body":"A new CISA advisory, AA26-237A and nicknamed 'A Tale of Two SOCs,' details red-team assessments run against a government services organization and a water utility using nearly identical attack methods, finding both were fully compromised at the domain level and had their sensitive business systems and cloud resources breached. The stark divergence in how each organization detected and responded to the intrusion highlights uneven readiness across critical infrastructure sectors even against known tradecraft. The findings arrive amid a broader wave of incidents this summer targeting U.S. water systems and, in the U.K., a power plant, reinforcing warnings that AI-assisted attack techniques are lowering the bar for disruptive operations against operational technology.","source":"The Hacker News / CISA","url":"https://thehackernews.com/"}]},"cities":{"lasVegas":[{"headline":"Las Vegas Shatters Decade-Old Heat Record Amid Deadly AC Shortage","body":"Harry Reid International Airport hit a new daily record on Thursday, with the National Weather Service confirming the airport reached 111 degrees, topping the previous mark of 110 set in 2017. The extreme heat is compounding a public-health crisis: federal data show roughly 6,700 households across the Las Vegas metro area lack working air conditioning, and the Clark County coroner has linked the gap directly to heat deaths. An Extreme Heat Warning remained in effect through Friday evening as officials scramble to identify the most vulnerable neighborhoods.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Metro Police Open Homicide Probe After Two Women Found Dead","body":"Las Vegas police launched a homicide investigation early Friday after two people were found dead near the 5000 block of Reno Avenue on Thursday night. Preliminary findings indicate a man shot two women before turning the gun on himself, according to investigators. The case adds to a string of violent-crime headlines this week in the valley.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Nevada Could Collect $256 Million From Meta's $17 Billion Teen Social-Media Settlement","body":"Meta has agreed to pay $17 billion and implement new child-safety measures on Facebook and Instagram to resolve a multistate trial over teen social media addiction, with 47 state attorneys general — including Nevada's — announcing the deal this week. Nevada's share of the settlement is estimated at $256 million, money that could flow toward youth mental-health and digital-safety programs in Clark County schools. The settlement caps years of litigation alleging the platforms knowingly designed addictive features targeting minors.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/"}],"nellis":[{"headline":"Creech AFB Pushes Autonomous Drone Wingmen Closer to Combat Readiness","body":"At Creech Air Force Base, the Air Force's Collaborative Combat Aircraft Experimental Operations Unit recently ran an Agile Combat Employment exercise designed to test how far semi-autonomous drone technology has advanced under realistic field conditions. The drill put uncrewed platforms, including YFQ-44A Fury aircraft, through operational scenarios meant to validate how these 'loyal wingman' drones would fight alongside crewed fighters. The Nevada desert continues to serve as the Air Force's proving ground for next-generation unmanned combat aircraft ahead of wider fleet integration.","source":"Air Force News Service / af.mil","url":"https://www.af.mil/News/Article-Display/Article/4557390/air-force-tests-collaborative-combat-aircraft-at-creech-afb/"}]},"feelGood":[{"headline":"Carmel Community Rallies to Honor Veterans With Thousands of Small Kindnesses","body":"A veterans museum in Carmel, Indiana held an Acts of Kindness Day tied to a community-wide goal set by local Kiwanis and Rotary clubs to log 1,976 individual acts of kindness. Visitors sat with veterans to record memories of kindness given and received during their service, and nearly a dozen handmade thank-you cards were written for specific veterans on the spot. Local business owner Jessica Bricking of Carmel Glass & Mirror capped the day with a $500 donation to keep the all-volunteer museum running.","source":"Current in Carmel / The Reporter","url":"https://readthereporter.com/kindness-stories-handmade-cards-community-generosity/"},{"headline":"Rescue Dogs and Veterans Healing Together in Arizona","body":"Soldier's Best Friend, an Arizona nonprofit, continues pairing military veterans coping with PTSD or traumatic brain injuries with trained service and companion dogs, many of them rescued from local animal shelters. The program's design means every match saves two lives at once — a struggling veteran and a homeless dog — while building bonds that organizers say ripple outward to inspire entire communities. Staff and veteran volunteers have been sharing firsthand stories of the program's impact in recent interviews.","source":"Soldier's Best Friend","url":"https://soldiersbestfriend.org/"},{"headline":"Nellis Airmen Open Base to Foster Teens for a Day of Mentorship","body":"The 857th Aircraft Maintenance Squadron at Nellis Air Force Base hosted 'Airman for a Day,' a base tour and mentorship event for local foster teens ages 14 to 17. The program exposed the teens to Air Force careers and culture, giving young people who often lack stable family support a rare glimpse of structured opportunity and camaraderie. Organizers said the goal was to foster a sense of belonging and purpose among youth who need it most.","source":"DVIDS / Nellis Air Force Base","url":"https://www.dvidshub.net/unit/NAFB"}],"onThisDay":[{"year":"1963","event":"Martin Luther King Jr. delivered his 'I Have a Dream' speech during the March on Washington for Jobs and Freedom."},{"year":"1955","event":"Fourteen-year-old Emmett Till was abducted from his relatives' home in Mississippi, a killing that helped galvanize the civil rights movement."},{"year":"1988","event":"Three Italian jets collided during an air show at Ramstein Air Base in West Germany, killing 70 spectators and pilots."},{"year":"1996","event":"Britain's Prince Charles and Princess Diana finalized their divorce."}]},"topPicks":[{"headline":"Iran war costs push US Navy into fiscal emergency, internal memos show","teaser":"Internal Navy memos reveal Iran war spending has triggered a budget crisis threatening fleet readiness and future procurement."},{"headline":"Russia Launches Fresh Wave of Over 100 Attack Drones Overnight","teaser":"A massive overnight drone barrage on Ukraine underscores escalating attacks as the war grinds on with no resolution in sight."},{"headline":"Taiwan Runs Largest-Ever Invasion-Response Drills, Borrowing U.S. Playbook","teaser":"Taiwan's unprecedented invasion-response exercises signal rising tensions and deeper military coordination with Washington against a Chinese threat."}]},"navDates":[{"key":"2026-08-28","label":"Aug 28","href":"/","isNewest":true},{"key":"2026-08-27","label":"Aug 27","href":"/archive/2026-08-27.html","isNewest":false},{"key":"2026-08-26","label":"Aug 26","href":"/archive/2026-08-26.html","isNewest":false},{"key":"2026-08-24","label":"Aug 24","href":"/archive/2026-08-24.html","isNewest":false},{"key":"2026-08-23","label":"Aug 23","href":"/archive/2026-08-23.html","isNewest":false},{"key":"2026-08-22","label":"Aug 22","href":"/archive/2026-08-22.html","isNewest":false},{"key":"2026-08-20","label":"Aug 20","href":"/archive/2026-08-20.html","isNewest":false}],"currentKey":"2026-08-28","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
