<script>
const STATE = {"digest":{"date":"Saturday, November 14, 2026","generatedAt":"Sat, Nov 14, 7:48 AM PST","breaking":{"headline":"Iran Claims Destruction of US Radar in Bahrain as Hormuz Tanker Attacks Escalate","body":"Iran's Revolutionary Guard said Friday its aerospace force destroyed a US early-warning radar installation on Bahrain, retaliating for an earlier US strike on a telecommunications tower at the Iranian port of Sirik. US Central Command denied the claim, saying it had instead shot down two one-way attack drones headed toward the base rather than losing the radar. Hours earlier, the Guard reported a liquefied-natural-gas tanker struck a naval mine and exploded while transiting what Tehran called an unauthorized route through the Strait of Hormuz, adding to four tankers Iran says were damaged by mines earlier in the week. None of the claims have been independently verified, but the exchange marks the sharpest Gulf flare-up since the broader 2026 Iran war and Hormuz crisis erupted in February, reviving fears of a wider confrontation.","source":"Breitbart","url":"https://www.breitbart.com/middle-east/2026/11/13/iran-claims-attacks-on-u-s-radar-station-in-bahrain-lng-tanker-in-strait-of-hormuz/"},"tabs":{"defense":{"defense":[{"headline":"Hegseth Expands Special Operations Office's Pentagon Budget Authority","body":"Defense Secretary Pete Hegseth is elevating the Pentagon's civilian special-operations oversight office, giving it a far larger role in department-wide budget and acquisition decisions. Under the change, reported November 12, the military services and other Pentagon components must now obtain the office's 'concurrence' before advancing funding decisions that touch special operations forces. The move centralizes SOF funding authority inside the Office of the Secretary of Defense as part of the Pentagon's year-long acquisition overhaul.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Suspected Drone Incursion Triggers Real-World Alert at US Air Base in England","body":"US Air Force Security Forces responded to suspected unauthorized drone activity over RAF Lakenheath in Suffolk on November 13, triggering a real shelter-in-place order at the base, which hosts F-15E Strike Eagle and F-35A squadrons. The alert followed earlier precautionary relocations of 12 KC-135 tankers from RAF Mildenhall and bomber withdrawals from RAF Fairford amid a string of drone sightings near US installations in Britain. US and UK authorities are now jointly investigating, as London separately pledged roughly 470 million pounds to harden dozens of defense sites against drone threats.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/aerospace-news/2026/us-air-force-responds-to-suspected-drone-activity-over-uk-lakenheath-air-base-amid-rising-threats-to-us-bases"},{"headline":"Pentagon Greenlights Permanent US Troop Presence in Poland","body":"Polish Deputy Prime Minister and Defense Minister Wladyslaw Kosiniak-Kamysz said this week that the Pentagon has approved a permanent US troop presence in Poland, with a final decision expected from the White House in early December. The announcement came a day after he met with Defense Secretary Pete Hegseth, and would mark a shift from the rotational deployments that have anchored NATO's eastern flank since Russia's invasion of Ukraine. A permanent basing arrangement would be among the most significant US force-posture changes in Central Europe in years.","source":"Just Security","url":"https://justsecurity.org/164357/early-edition-november-13-2026"}],"acquisitions":[{"headline":"Air Force Moves E-7A Wedgetail to Major Acquisition Status","body":"The Air Force is shifting its E-7A Wedgetail airborne early-warning jet from a Middle Tier of Acquisition pathway to a Major Capability Acquisition, after officials had deliberately slowed the program in prior months. The E-7 is intended to eventually replace the service's aging E-3 Sentry AWACS fleet, and the formal status change subjects it to tighter oversight and a more rigorous acquisition process going forward. The shift follows a June 2026 capability document outlining requirements for the jet's rapid-prototyping effort.","source":"Inside Defense","url":"https://insidedefense.com/insider/insider-daily-digest-november-13-2026"},{"headline":"Navy Walks Back Claim That Overseas Shipbuilding Plan Reached White House","body":"A Navy spokesperson told Inside Defense on November 13 that the Pentagon has not actually delivered to the White House a comprehensive plan to build Navy surface combatants in foreign shipyards, reversing an earlier statement that had confirmed the plan's submission. The proposal traces to President Trump's August 13 national security memorandum directing the Pentagon to examine overseas construction options amid a domestic shipbuilding capacity crunch. The reversal highlights unresolved internal disagreement over how aggressively the Navy should pursue foreign yards to expand surface-ship production.","source":"Inside Defense","url":"https://insidedefense.com/"}]},"us":[{"headline":"Supreme Court Agrees to Decide Fate of Trump's Border Asylum Ban","body":"The Supreme Court said on Friday it will take up the Trump administration's bid to keep its executive order suspending asylum access at the southern border, which lower courts had ruled unlawful. The case stems from a January 2025 proclamation framing border crossings as an 'invasion,' and a ruling is expected by the end of June. With a 6-3 conservative majority that has largely sided with Trump on immigration this term, the outcome could permanently reshape how migrants can seek protection at the border.","source":"Washington Post / Reuters","url":"https://www.washingtonpost.com/politics/2026/11/13/supreme-court-trump-asylum/070276aa-df94-11f1-912c-4fbb80d73f7f_story.html"},{"headline":"Van Hollen Launches Challenge to Schumer for Senate Majority Leader","body":"Maryland Senator Chris Van Hollen announced Thursday he will run against Chuck Schumer to lead Senate Democrats once the party takes the majority in January, setting up the first contested leadership fight in years. The move follows a progressive pressure campaign and comes after Democrats won at least 55 Senate seats in the midterms; Bernie Sanders and Senator-elect Abdul El-Sayed of Michigan have already backed Van Hollen. Schumer, who has led Senate Democrats since 2017, says he has the votes to keep his post, with the caucus vote set for December.","source":"AP / PBS NewsHour","url":"https://www.pbs.org/newshour/politics/van-hollen-to-challenge-schumer-for-senate-democratic-leader"},{"headline":"Nationwide FAA Ground Stop Exposes Aging Air-Traffic Infrastructure","body":"A telecom outage triggered an hours-long, nationwide FAA ground stop Friday evening that halted all U.S. departures, stranding travelers and canceling or delaying thousands of flights. Officials blamed overloaded, outdated air-traffic-control systems, and recovery is expected to stretch into the following days just as Thanksgiving travel volume ramps up. The incident has intensified pressure on the Trump administration to fund long-promised modernization of the air-traffic system.","source":"NPR","url":"https://www.npr.org/programs/weekend-edition-saturday/nx-s1-6023839/weekend-edition-saturday-for-november-14-2026"},{"headline":"Interior Department's Public-Lands Sale Plan Draws Fresh Bipartisan Fire","body":"A new Interior Department strategic plan formally commits the Trump administration to selling federal lands to states, localities and tribes through 2030, breaking with roughly 50 years of precedent limiting such sales. Critics, including New Mexico Senator Martin Heinrich, argue the lands 'belong to the American people, not private interests looking to cash in,' while watchdog groups warn purchased parcels could later be resold to private developers. The proposal echoes a land-sale push that Western Republicans and Democrats jointly killed during last year's reconciliation bill fight, and could directly affect federally managed acreage surrounding fast-growing cities like Las Vegas.","source":"Oregon Public Broadcasting (OPB)","url":"https://opb.org/article/2026/11/12/sell-public-lands-trump"}],"pacific":{"pacificCommand":[{"headline":"Squad Allies to Build Joint Coordination Hub in the Philippines","body":"Defense officials from the United States, Japan, Australia and the Philippines announced plans to establish a Combined Coordination Center in the Philippines, building on the 'Squad' framework agreed by their defense ministers in Cebu on October 28. The four nations also committed to synchronizing defense investments for the Philippines' archipelagic defense and expanding the scope and frequency of joint exercises like Balikatan and Keen Sword. The push comes amid persistent friction between Manila and Beijing over South China Sea claims, with the center expected to deepen logistics-sharing and operational planning among the allies.","source":"The Diplomat","url":"https://thediplomat.com/2026/11/squad-nations-to-establish-coordination-hub-in-the-philippines-defense-chiefs-say"},{"headline":"Seoul Fast-Tracks Nuclear Submarine Program as Fuel Talks With Washington Lag","body":"South Korea's presidential office acknowledged on November 12 that nuclear submarine and nuclear-cooperation talks with the United States 'have not yet entered a normal process of discussion,' even as Seoul pushes ahead with its Jang Bogo N nuclear-powered submarine program meant to counter North Korean ballistic-missile submarines. The Defense Acquisition Program Administration approved the program's acquisition strategy on November 6, with Hanwha Ocean and HD Hyundai Heavy Industries expected to compete for the design-and-build contract and a first boat targeted for the mid-2030s. Japan is separately reviewing its own nuclear-propulsion option, though Tokyo's ruling coalition remains split over the legal and cost implications.","source":"Seoul Economic Daily","url":"https://en.sedaily.com/politics/2026/11/12/presidential-office-says-korea-us-nuclear-submarine-talks"},{"headline":"Australia Pours Another $88 Million Into AUKUS Submarine Workforce","body":"Canberra unveiled its 2026 Nuclear-Powered Submarine Workforce Strategy at HMAS Stirling in Western Australia on November 12, adding AU$88 million to recruit, train and retain the specialized workforce needed to deliver the AUKUS submarine fleet. The announcement sits alongside the Albanese government's broader AU$8 billion upgrade of HMAS Stirling, which is being prepared to host rotational U.S. and U.K. nuclear submarines ahead of Australia's own Virginia-class and SSN-AUKUS boats. The investment underscores how workforce and infrastructure bottlenecks, not just submarine construction, remain the pacing item for the trilateral pact.","source":"Defensehere","url":"https://defensehere.com/en/australia-outlines-2026-nuclear-powered-submarine-workforce-strategy"}],"pacingThreat":[{"headline":"PLA Report Details Plans for AI Drone Swarms and Decapitation Strikes","body":"A newly surfaced 30-page PLA report describes a sweeping shift toward AI-powered drone warfare, including mobilizing millions of civilian commercial drones for wartime use and conducting precision 'decapitation' strikes against enemy generals and scientists. Analysts note the document simultaneously insists on preserving Communist Party control over autonomous systems and achieving 'cognitive dominance' on the battlefield. A U.S. Army War College researcher argued the emphasis on political control over drone kill-chains, rather than hardware limits, is likely to slow PLA decision cycles relative to less centralized adversaries.","source":"Washington Times","url":"https://www.washingtontimes.com/news/2026/nov/11/inside-ring-china-shifting-military-forces-advanced-drone-warfare/"},{"headline":"Xi's Purges Leave PLA Command Structure Hollowed Out","body":"Analysis published November 11 details how Xi Jinping's sweeping anti-corruption purges have left China's Central Military Commission reduced to just two members, Xi himself and political commissar Zhang Shengmin, who has no operational command experience. Roughly a quarter of the fifth plenum's Central Committee membership was absent, reflecting officials still under investigation, and the PLA Navy has been especially hard-hit with its political works chief, former Rocket Force commander and a former navy chief all removed. Analysts warn the resulting leadership vacuum constrains Beijing's capacity for major operations even as it may encourage more aggressive peripheral signaling.","source":"Observer Research Foundation","url":"https://www.orfonline.org/expert-speak/china-s-pla-in-fifth-plenum-internal-chaos-and-peripheral-aggression"},{"headline":"Beijing Mobilizes Over 100 Warships in Suspected Taiwan Blockade Rehearsal","body":"Taiwan's National Security Council said Chinese naval formations from all three theater commands, plus the Liaoning carrier strike group, have been operating in waters east of the Philippines, with vessel counts peaking above 100 before easing to roughly 70 by November 13. Defense Minister Wellington Koo described the activity as 'area denial' drills, while Taiwan's defense ministry logged 30 Chinese aircraft sorties and eight naval vessels around the island in a single 24-hour period, 23 of which crossed the median line. Analysts say the coordinated multi-theater scale marks a departure from past Taiwan Strait-focused drills and may be rehearsing a broader blockade or isolation scenario.","source":"Yahoo News / Reuters","url":"https://www.yahoo.com/news/world/articles/china-quietly-mobilizes-over-100-151644269.html"}]},"europe":{"ukraineRussia":[{"headline":"Russia Launches 96-Drone Barrage as Food Industry Goes Dark","body":"Ukraine's air force reported Russia fired 96 drones overnight into November 14, 61 of them jet-powered Shaheds, with air defenses downing or suppressing 81 of them. The strikes come after a Thursday assault on Zaporizhzhia's Kosmichnyi district injured at least 50 people, eight of them children, and five major Ukrainian sunflower oil processors including Kernel and Delta Wilmar have halted or cut production after strikes on food infrastructure and the power grid. Russia's overall personnel losses since February 2022 are now estimated near 1.62 million, with Kyiv claiming Moscow lost another 1,710 troops in the past day alone.","source":"Ukraine Desk Note / Ukrinform","url":"https://www.ukrinform.net/rubric-ato"},{"headline":"Abu Dhabi Talks Expose Kyiv's Shrinking Leverage as NATO's Top Commander Appears","body":"Negotiations held in Abu Dhabi have been described by Ukrainian negotiator David Arakhamia as among the toughest since 2022, with Western governments increasingly willing to revisit security demands Moscow has pushed for years. Russia has paired the talks with relentless strikes on Ukrainian energy infrastructure, a strategy meant to signal that any retaliation will bring disproportionate devastation, while the unprecedented appearance of NATO Supreme Allied Commander Europe Alexus Grynkewich at the talks was notably welcomed by the Kremlin. UK Defence Secretary Wes Streeting has also broken with recent allied messaging by calling for reopened communication channels with Moscow, underscoring how strained Kyiv's negotiating position has become.","source":"Al Jazeera","url":"https://www.aljazeera.com/opinions/2026/11/14/ukraine-is-running-out-of-options-and-russia-knows-it"}],"europe":[{"headline":"NATO Pushes $50 Billion Industrial Surge and Faster Drone-Defense Buys","body":"NATO Secretary General Mark Rutte told the Transatlantic Defense Industry Access Forum in Rome on November 12 that turning more than $50 billion in procurement commitments announced at July's Ankara summit into fielded capability requires deeper US-European industrial integration. The push follows NATO's November 5 launch of a counter-drone 'marketplace' letting allies buy from a pre-vetted catalogue without new tenders, backed by a pledge to invest over $40 billion in counter-drone systems over five years, and parallel talks in Brussels on fielding deep-precision-strike weapons from cruise missiles to strike drones.","source":"NATO","url":"https://nato.int/en/news-and-events/articles/news/2026/11/13/nato-secretary-general-expanding-transatlantic-defence-cooperation-is-crucial"},{"headline":"Europe Enters Winter With Lowest Gas Reserves in a Decade","body":"European natural gas prices have climbed nearly 200% since February and topped €100 per megawatt hour at the end of October, the highest in four years, as the bloc enters the heating season with storage around 72-75% full, the weakest level since records began in 2011. Colder weather forecast from November 17 and continued disruptions tied to the Iran war, which has already added more than €127 billion to Europe's energy import bill according to the European Commission, are stoking fears of a second major energy shock in under five years. Germany's storage sits at just 61%, and firms like Norway's Yara International warn of hundreds of millions of dollars in added costs if prices stay elevated through winter.","source":"Bloomberg","url":"https://www.bloomberg.com/graphics/2026-europe-energy-woes/?srnd=homepage-europe"}]},"middleEast":[{"headline":"Houthis Fire Fresh Missiles at Saudi Forces as Yemen Front Reignites","body":"Yemen's Iran-aligned Houthi movement said it fired two ballistic missiles on November 13 at Saudi forces near Al-Tuwal in Jazan province, with Saudi Civil Defence issuing an all-clear shortly after. The attack is the latest sign that the Yemen-Saudi front, reopened after the 2022 UN-brokered ceasefire collapsed amid this year's wider Iran war, remains active even as attention centers on the Strait of Hormuz.","source":"Gulf News","url":"https://gulfnews.com/uae/middle-east-war-5-things-uae-residents-need-to-know-today-nov-14-2026-1.500747029"},{"headline":"Israeli Drone Strike Kills Two in Gaza's Jabaliya","body":"An Israeli drone strike killed two Palestinians walking in Jabaliya on Gaza City's northern edge on November 14, according to Shifa Hospital director Mohamed Abu Selmiya, with additional wounded taken to a nearby field hospital. The Israeli military said it had targeted two Hamas militants in the strike, the latest incident underscoring how fragile the Gaza ceasefire arrangement remains even as regional attention is dominated by the Iran war.","source":"Associated Press via ClickOrlando","url":"https://www.clickorlando.com/news/2026/11/14/israeli-drone-strike-kills-2-palestinians-in-gaza-and-other-mideast-news/"},{"headline":"Trump to Meet Putin and Xi in Unprecedented Shenzhen Summit Over Iran","body":"President Trump is set to hold a first-ever three-way summit with Russian President Vladimir Putin and Chinese President Xi Jinping in Shenzhen next week to discuss the Iran war, though the Ukraine conflict is not expected to be on the agenda. The meeting comes as Secretary of State Marco Rubio argues further US strikes on Iran are unnecessary given the economic pressure already squeezing a 'weakened' Tehran, even as the UN estimates 25 seafarers have been killed in 134 confirmed maritime incidents across the Strait of Hormuz since the war began in February.","source":"Middle East Eye","url":"https://www.middleeasteye.net/live-blog/live-blog-update/morning-update-669"}],"techAI":{"aiCompetition":[{"headline":"Nvidia CEO Jensen Huang Resigns Amid Espionage Fallout, Clouding Chip Export Policy","body":"Jensen Huang stepped down effective immediately as Nvidia's president and CEO after revelations of extramarital affairs, including one with a woman U.S. officials suspect was recruited by China's Ministry of State Security to extract intelligence on Nvidia's AI chip technology. CFO Colette Kress becomes interim CEO while former Synopsys chief Harvey Jones takes over as Nvidia's first-ever independent board chair. The abrupt exit of the AI industry's most visible champion injects uncertainty into U.S.-China chip export policy and arrives days before Nvidia's November 17 earnings report, with President Trump publicly lamenting the departure and floating Apple's Tim Cook as a possible successor.","source":"Washington Post","url":"https://www.washingtonpost.com/technology/2026/11/12/nvidia-board-weighs-jensen-huangs-future-after-affair-with-allege-chinese-spy/"},{"headline":"Anthropic Prices IPO Ahead of November 19 Nasdaq Debut","body":"Anthropic set an indicative range of $70 to $78 a share for its Nasdaq listing next week, with reports that the order book ran roughly six times oversubscribed, signaling continued investor hunger for frontier-AI exposure despite mounting cash burn across the sector. The listing lands in the same stretch as OpenAI's reported $10 billion quarterly revenue amid steep losses and Thinking Machines Lab's push to close a $5 billion round at a $40 billion valuation, underscoring how capital competition among labs is intensifying even as governance questions swirl around the industry.","source":"The Neuron / Deep Gains","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-friday-november-13-2026/"}],"cyberEmerging":[{"headline":"Nonprofit Coalition Sues Five AI Labs to Halt Frontier Model Development","body":"A coalition of charitable organizations filed suit on Thursday against OpenAI, Anthropic, Google, Meta, and SpaceX's AI division, seeking a court order to freeze further development of their most advanced models. The suit leans on the labs' own executives' past warnings about catastrophic AI risk, making it one of the most aggressive attempts yet to use litigation rather than legislation to slow frontier-model scaling. The timing is notable, landing the same week as Nvidia's leadership crisis and Anthropic's IPO roadshow, both of which have sharpened public scrutiny of AI industry governance.","source":"Shafaqna English","url":"https://en.shafaqna.com/491546/lawsuit-halt-frontier-ai-development/"},{"headline":"China-Linked Hackers Use AI Pen-Testing Tools Against US Defense and Chip Sectors","body":"Palo Alto Networks disclosed on November 13 that a China-nexus group it tracks as CL-STA-1238 combined the Cairn AI pen-testing framework with Chinese open-source models DeepSeek and Zhipu GLM to breach at least 19 organizations spanning U.S. defense contractors, advanced-semiconductor firms, and civil-society groups. The intruders harvested dozens of valid credentials, planted rogue administrator accounts in a production system, and exposed more than a million personal records at one victim. A separate campaign using an Alibaba-hosted pen-testing tool was also found stealing AWS credentials, reinforcing concerns that AI-augmented tooling is letting state-linked hackers scale espionage well beyond manual capacity.","source":"Cybersecurity Dive","url":"https://www.cybersecuritydive.com/news/china-hacker-ai-tool-campaign-us-defense-semiconductor/874619/"}]},"cities":{"lasVegas":[{"headline":"Nationwide FAA Ground Stop Snarls Harry Reid Airport","body":"A nationwide ground stop ordered by the Federal Aviation Administration on Friday disrupted travel through Harry Reid International Airport for roughly five hours, stranding passengers and halting most outbound flights. Rideshare lines backed up outside terminals as Southwest jets sat queued at the C gates waiting for clearance to depart. The stop was lifted by evening, but ripple effects on connecting flights continued into the night.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/business/tourism/las-vegas-travelers-urged-to-check-flights-due-to-ground-stop-3913956/"},{"headline":"Suspect Extradited in Fatal Arts District Bar Stabbing","body":"A man accused of fatally stabbing a 48-year-old victim outside the Cork and Thorn bar in the Las Vegas Arts District has been extradited to Nevada to face murder and battery charges. The case adds to a string of recent violent-crime headlines in the valley, including a separate downtown bar stabbing caught on video. Metro detectives have not released additional details on a motive ahead of arraignment.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"City Weighs Speed Cushions Near 16 Las Vegas School Campuses","body":"Local transportation officials are considering installing speed cushions on roads near 16 Las Vegas school campuses as part of a push to cut down on students being struck by vehicles. The traffic-calming measures could be in place as soon as next summer if approved. The move follows a string of pedestrian crashes near schools that have alarmed parents and safety advocates across the valley.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/"}],"nellis":[{"headline":"Air Force Advances $1 Billion F-47 Test Campus at Nellis","body":"The Air Force is moving forward with a roughly $1.057 billion 'F-47 Future Campus' on the eastern side of Nellis Air Force Base, confirmed as the operational test site for Boeing's sixth-generation F-47 fighter, with facilities slated for completion by spring 2031. The build-out includes a 1.15-million-square-foot aircraft apron with sunshades, a reprogramming laboratory for rapid mission-data validation, and dedicated maintenance space for stealth coatings and radar-absorbent materials. Nellis's proximity to Creech Air Force Base, home to the Air Force's experimental Collaborative Combat Aircraft unit, positions the Las Vegas-area ranges as the hub for integrating next-generation crewed and autonomous airpower.","source":"Air & Space Forces Magazine / Zona Militar","url":"https://www.airandspaceforces.com/air-force-billion-dollar-campus-testing-f-47-nellis/"}]},"feelGood":[{"headline":"Teens' Paddleboard Rescue and Flood Hero Restore Faith in Humanity","body":"Amid what was described as 'biblical' flooding in Florida, a local man waded into rising floodwaters to pull trapped neighbors from their homes to safety, while in a separate incident a group of teenagers used paddleboards to ferry stranded residents out of flooded streets. Good Samaritans and first responders worked through the night to reach people cut off by the water. The rescues were hailed as proof that ordinary neighbors will risk themselves for strangers in a crisis.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/"},{"headline":"Documentarian Reunites 103-Year-Old D-Day Veteran With Lost War Medals","body":"A documentarian tracked down and returned long-lost war medals to a 103-year-old D-Day survivor, giving the veteran a cherished piece of his service history back more than eight decades after he fought on the beaches of Normandy. The effort involved painstaking archival research to verify the medals' provenance before the emotional handoff. The story has circulated widely as a tribute to World War II veterans still living today.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/"},{"headline":"Strangers Fund Texas Man's 62-Foot Dream Boat","body":"Dale, an 86-year-old from Mineral Wells, Texas, has spent since 1987 building a 62-foot steel boat in his yard with hopes of one day sailing it to Alaska. After three visitors heard his story, they launched a GoFundMe that drew more than 1,500 donors and raised over $41,000 within days toward a $45,000 goal. The campaign, organized by content creator Laurence Benson and friends, is poised to finally let Dale complete and launch the boat he has worked on for nearly four decades.","source":"AOL","url":"https://www.aol.com/articles/7-feel-good-stories-start-105619000.html"}],"onThisDay":[{"year":"1889","event":"Journalist Nellie Bly set off from New York on her record-breaking attempt to travel around the world in less than eighty days."},{"year":"1910","event":"Pilot Eugene Ely made the first takeoff from a ship, launching his aircraft from the deck of the USS Birmingham."},{"year":"1940","event":"German Luftwaffe bombers devastated the English city of Coventry in one of the most destructive raids of the Blitz."},{"year":"1969","event":"NASA launched Apollo 12, the second crewed mission to land astronauts on the Moon."}]},"topPicks":[{"headline":"Iran Claims Destruction of US Radar in Bahrain as Hormuz Tanker Attacks Escalate","teaser":"Escalating strikes near the Strait of Hormuz raise fears of a wider US-Iran confrontation threatening global oil flows."},{"headline":"Trump to Meet Putin and Xi in Unprecedented Shenzhen Summit Over Iran","teaser":"A rare three-way summit could reshape global diplomacy as major powers seek to manage the deepening Iran crisis."},{"headline":"Beijing Mobilizes Over 100 Warships in Suspected Taiwan Blockade Rehearsal","teaser":"A massive naval mobilization near Taiwan signals rising military tension that could destabilize the Indo-Pacific region."}]},"navDates":[{"key":"2026-11-16","label":"Nov 16","href":"/","isNewest":true},{"key":"2026-11-15","label":"Nov 15","href":"/archive/2026-11-15.html","isNewest":false},{"key":"2026-11-14","label":"Nov 14","href":"/archive/2026-11-14.html","isNewest":false},{"key":"2026-11-13","label":"Nov 13","href":"/archive/2026-11-13.html","isNewest":false},{"key":"2026-11-12","label":"Nov 12","href":"/archive/2026-11-12.html","isNewest":false},{"key":"2026-11-11","label":"Nov 11","href":"/archive/2026-11-11.html","isNewest":false},{"key":"2026-11-10","label":"Nov 10","href":"/archive/2026-11-10.html","isNewest":false}],"currentKey":"2026-11-14","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-14.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
