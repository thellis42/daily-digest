<script>
const STATE = {"digest":{"date":"Monday, September 21, 2026","generatedAt":"Mon, Sep 21, 9:01 AM PDT","breaking":{"headline":"Bessent and Chinese Vice Premier finalize groundwork for Trump-Xi Washington summit, float AI 'hotline'","body":"Treasury Secretary Scott Bessent and Chinese Vice Premier He Lifeng wrapped an eight-hour negotiating session in New York on September 20, clearing the way for the September 24 Trump-Xi summit in Washington, the first meeting between the two leaders on U.S. soil since 2017. Bessent said the sides discussed setting up a formal 'U.S.-China AI Dialogue' along with a notification mechanism for AI incidents that could rise to a national-security threshold. The summit's public agenda spans tariffs, rare-earth export curbs, semiconductor controls and Taiwan, but with U.S. and Chinese frontier AI models trading capability leads throughout 2026, the AI track may carry the most lasting strategic weight. Officials on both sides called the pre-summit talks productive, though a lasting trade truce extension remains unresolved.","source":"CNBC","url":"https://www.cnbc.com/2026/09/20/bessent-he-lifeng-trump-xi-summit.html"},"tabs":{"defense":{"defense":[{"headline":"Trump announces creation of an 'AI Force' to centralize Pentagon artificial-intelligence programs","body":"President Trump said on September 19 via Truth Social that he is forming an 'AI Force,' explicitly modeling it on the Space Force he created in 2019, and pledged to name an AI 'czar' soon. He gave no details on whether the entity would sit inside the Defense Department or become a formal new armed-forces branch, which would require congressional action. The announcement follows a string of high-profile failures in the Pentagon's AI programs and comes as Trump dismissed AI-safety warnings -- including an Anthropic researcher's estimate of a greater than 10 percent chance advanced AI could cause catastrophic harm within a decade -- as a 'hoax.'","source":"CNN","url":"https://www.cnn.com/2026/09/19/politics/trump-ai-task-force-czar"},{"headline":"Navy sends USS Canberra and P-8A patrol aircraft to the Philippines amid rising South China Sea friction","body":"The U.S. Navy deployed the littoral combat ship USS Canberra along with P-8A Poseidon maritime patrol aircraft to the Philippines on September 20, extending a rotational presence in the South China Sea. The move follows a confirmed collision between a China Coast Guard vessel and a Philippine ship and record levels of Chinese maritime activity inside the Philippine exclusive economic zone in recent weeks. Manila and Washington have steadily expanded combined patrols in 2026 as Beijing intensifies gray-zone pressure short of open conflict.","source":"Army Recognition","url":"https://www.armyrecognition.com"},{"headline":"U.S. and Canada test faster Arctic 'kill chain' in NORAD exercise Tundra Merlin","body":"The United States and Canada are running Operation Tundra Merlin from September 18-22, linking Alaska-based F-35 fighters, E-3 Sentry airborne early-warning aircraft and maritime forces roughly 100 nautical miles north of Dutch Harbor to shorten the time between detecting and engaging threats crossing the Bering Sea. The drill builds on NORAD F-35 intercepts of Russian aircraft near Alaska earlier this year and reflects deepening binational focus on Arctic approaches as Russian military activity in the region grows. Planners say the exercise is meant to network sensors and shooters into a faster, integrated detection-to-engagement chain.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/navy-news/2026/u-s-and-canada-conduct-joint-arctic-naval-exercise-to-strengthen-north-american-defense"}],"acquisitions":[{"headline":"Navy formally solicits industry for a carrier-launched combat drone","body":"The U.S. Navy issued a request for proposals on September 20 asking defense contractors to pitch designs for a carrier-launched combat drone intended to operate alongside manned fighters on flattops. The solicitation follows the Space Development Agency's own September 18 RFP for new ground stations to support its expanding proliferated satellite constellation. Together the two moves signal accelerating Pentagon investment in autonomous and space-enabled systems heading into fiscal 2027 budget planning.","source":"Defence Blog","url":"https://defence-blog.com/category/news/"},{"headline":"Army awards $10.6 million contract for combat-proven Raybird reconnaissance drones","body":"The U.S. Army awarded a $10.6 million contract on September 19 for Raybird unmanned aircraft hardware and support services, adding a fixed-wing ISR drone with an established combat record in Ukraine to Army reconnaissance units. The award is one of several smaller procurement actions logged this week, alongside a $49.3 million Navy contract to Kato Engineering for warship power-system maintenance and a $76.6 million addition to a Lockheed Martin design contract. Collectively they point to steady near-term spending on sustainment and unmanned ISR even as bigger-ticket programs await budget decisions.","source":"Defence Blog","url":"https://defence-blog.com/category/news/"}]},"us":[{"headline":"White House Press Ban on CNN, Politico, MS NOW Takes Effect","body":"After President Trump's Friday, September 18 announcement that he was barring CNN, MS NOW and Politico from the White House 'effective immediately,' Secret Service actually enforced the ban over the weekend, confiscating and deactivating credentials for reporters from all three outlets. The White House has offered no specifics on the legal basis or scope, and Trump floated extending the ban to other outlets he called 'crummy,' including the New York Times and Washington Post. Press freedom advocates and the White House Correspondents Association are citing the 1977 D.C. Circuit precedent in Sherrill v. Knight, which bars arbitrary denial of previously granted White House access, setting up a likely First Amendment court fight this week.","source":"Al Jazeera / CNN","url":"https://www.aljazeera.com/news/2026/9/19/a-ban-on-the-free-press-white-house-bars-journalists-from-three-outlets"},{"headline":"New NBC Poll Shows Economic Squeeze Dominating Midterm Landscape","body":"A new NBC News poll released Sunday, with 44 days until the midterms, finds voters increasingly anxious over surging gas prices and last week's Federal Reserve rate hike -- the central bank's first increase in three years, lifting the benchmark rate to 3.75%-4%. Senate Minority Leader Chuck Schumer told NBC Democrats have 'a damn good chance' of retaking the Senate, while the economy has emerged as the defining issue overshadowing other midterm narratives. The poll comes as diesel prices near $6 a gallon and headline inflation holds at 3.4% year-over-year, complicating messaging for both parties ahead of November.","source":"NBC News","url":"https://www.nbcnews.com/meet-the-press/transcripts/meet-press-september-20-2026-rcna598793"},{"headline":"McConnell Returns to Senate Floor After Fall-Related Absence","body":"Senate Republican Mitch McConnell returned to the chamber this weekend appearing unsteady, roughly three months after a fall sidelined him, according to Associated Press reporting picked up across local outlets Sunday. His reappearance comes amid a heavy pre-midterm Senate workload and questions about his capacity to continue in leadership-adjacent roles as the GOP defends a fragile majority. The timing places renewed scrutiny on the health and succession questions surrounding aging Senate leadership just weeks before the midterms.","source":"Associated Press via Patch","url":"https://patch.com/us/across-america/war-finances-top-u-s-headlines-sunday-political-brunch-september-20-2026"},{"headline":"Federal Court Weighs Legality of Trump's National Mall Arch as He Cites Security Rationale","body":"President Trump claimed over the weekend that military operations are necessary at the site of his proposed 250-foot triumphal arch near Arlington National Cemetery to 'protect national security,' as a federal court continues weighing whether the project can proceed. Veterans groups and historic preservationists are fighting the arch, arguing it improperly militarizes protected memorial ground without congressional authorization. The dispute adds to a string of Trump-era building projects -- including the demolished East Wing rebuild -- now tangled in federal litigation over executive authority on federal land.","source":"NPR / Washington Post","url":"https://www.npr.org/sections/politics/"}],"pacific":{"pacificCommand":[{"headline":"Koizumi and Hegseth Hold Urgent Call on Japan's Defense Overhaul","body":"Japanese Defense Minister Shinjiro Koizumi and U.S. Secretary of War Pete Hegseth spoke by phone for about ten minutes on the evening of September 18, their eighth such exchange, with Koizumi stressing a heightened sense of urgency to accelerate the rewrite of Japan's three core security documents by year-end. Tokyo is racing to overhaul its National Security Strategy, National Defense Strategy and Defense Buildup Program amid what officials call the most severe security environment since 1945. The call underscores how closely Washington and Tokyo are coordinating force-posture changes even as broader alliance strategy documents remain in flux.","source":"Japan Ministry of Defense","url":"https://www.mod.go.jp/en/article/2026/09/ed1f67cf8a5bc7365c177691074df7efcfde2807.html"},{"headline":"Manila's Seoul Rebuke Cements Trilateral Security Alignment","body":"Fallout continues from Philippine Defense Secretary Gilberto Teodoro's pointed exchange with a Chinese envoy at the Seoul Defense Dialogue, with Japan and South Korea both moving to shore up support for Manila's maritime position. Tokyo has been explicit in backing the 2016 arbitral ruling, while Seoul issued its own statement invoking the UN Convention on the Law of the Sea and freedom of navigation. The day before the Seoul confrontation, Philippine and South Korean defense chiefs agreed to expand personnel exchanges and joint exercises, building on the Japan-Philippines Reciprocal Access Agreement that entered into force a year ago and was already used in this year's Balikatan drills.","source":"Radio Free Asia","url":"https://www.rfa.org/english/southchinasea/2026/09/17/philippines-china-teodoro-note-rebuke/"},{"headline":"Tokyo Keeps Nuclear-Submarine Option Alive as Strategic Review Nears","body":"As Japan's three-document defense review heads into its final stretch, Defense Minister Koizumi has confirmed that nuclear-powered submarines have not been ruled out, citing the extended submerged endurance and speed such boats would offer over Japan's current Taigei-class fleet. The idea faces steep hurdles, including cost, the need for entirely new naval-reactor infrastructure, and legal tension with Japan's Atomic Energy Basic Act, which restricts nuclear technology to peaceful use. The debate is unfolding against a backdrop of rising Chinese and Russian naval activity around Japan's southern approaches.","source":"Naval News","url":"https://www.navalnews.com/naval-news/2026/09/japan-defense-minister-nuclear-powered-submarines/"}],"pacingThreat":[{"headline":"China Coast Guard Rams Philippine Fisheries Vessel Near Palawan","body":"The Philippines says a China Coast Guard ship rammed the BRP Datu Magat Salamat, a Bureau of Fisheries and Aquatic Resources vessel, on the morning of September 18 while it was delivering fuel subsidies to Filipino fishermen off Palawan. Philippine Coast Guard spokesman Jay Tarriela publicized the collision, the latest in a string of physical confrontations in contested waters. The incident lands just as China and ASEAN states were meeting in Manila for a working-group session on the long-stalled Code of Conduct for the South China Sea.","source":"The Manila Times","url":"https://www.manilatimes.net/2026/09/18/news/chinese-ship-rams-philippine-vessel-in-south-china-sea/2428073"},{"headline":"OSINT Roundup: Beijing Legalizes Wartime Economic Mobilization, Advances Undersea Drone Fleet","body":"Open-source tracking over September 5-19 shows the PLA and Chinese leadership pushing several fronts simultaneously: a revised National Defense Mobilization Law taking effect October 1 will let the state draft citizens over 18 and requisition private shipping, aircraft, satellites and drone factories in a crisis. Analysts say the change directly targets China's biggest bottleneck for a Taiwan contingency, sealift capacity, by legally fusing civilian and military logistics. Separately, satellite imagery confirmed an unmanned underwater vehicle mothership under construction in Shanghai, while Bloomberg-tracked shipping logs show Beijing has kept at least two heavy China Coast Guard cutters patrolling roughly 30 nautical miles off Taiwan's Pacific coast every month since June, effectively contesting the island's eastern 'back door.'","source":"Ronin's Grips SITREP","url":"https://blog.roninsgrips.com/sitrep-chinese-military-and-intelligence-september-5-to-september-19-2026/"},{"headline":"Chinese Drone Shadows Taiwanese Precision-Strike Drill as Lai Observes","body":"A Chinese military reconnaissance drone was detected off Taitung County on September 20, the same morning President William Lai traveled to Pingtung to watch the final day of a three-day live-fire exercise at Jioupeng Base testing air defense, anti-ship and drone capabilities. Taiwan's military said it tracked the drone closely as the drill wrapped up a sequence that began with simulated air-defense interception and moved through long-range strike and new air-defense weapons testing. The overflight illustrates Beijing's pattern of shadowing Taiwanese exercises with intelligence-gathering assets rather than large-scale force displays.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/09/20/2003864586"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine hits Moscow region with largest drone-missile barrage as rigged Duma vote concludes","body":"Ukrainian forces launched their biggest combined missile-and-drone strike package of the war against strategic targets in Moscow Oblast overnight September 19-20, timed to the final day of Russia's State Duma elections. Russia's inability to intercept the barrage fueled anger even among pro-war Russian commentators, while independent observers reported widespread fraud and manipulated vote counts in the September 18-20 balloting that the Kremlin is nonetheless touting as proof of public support for the war. Ukraine separately struck a Russian energy facility the same night.","source":"Kyiv Post / ISW","url":"https://www.kyivpost.com/post/84971"},{"headline":"Kyiv presses ground offensive in Donetsk as Russia hammers Zaporizhzhia and Dnipropetrovsk","body":"Ukrainian troops advancing under the codename Operation Vivaldi retook the villages of Shandryholove and Derylove and secured full control of Drobysheve in the Lyman sector of Donetsk region on September 20, while also destroying a Nebo-U radar, a command post near Zoriane, and a Russian Osa air-defense system near Volnovakha. At the same time, Russian shelling hit Donetsk-region settlements at least 32 times, and separate strikes on a Zaporizhzhia high-rise and shopping center pushed the number of wounded there to five; Dnipropetrovsk region also absorbed more than ten drone, bomb, and artillery attacks overnight.","source":"Ukrainian Women's Guard / Ukrinform","url":"https://uavarta.org/en/war-in-ukraine-today-latest-news-20-september-2026-photo/"}],"europe":[{"headline":"NATO military chiefs wrap up Copenhagen conference amid alliance-wide readiness push","body":"NATO's top military body, the Military Committee, convened its annual Chiefs of Defence conference in Copenhagen on September 18-19 under the chairmanship of Admiral Giuseppe Cavo Dragone, bringing together defense chiefs from all 32 member states. The meeting comes as several exercises continue across the alliance's flanks, including Lithuania's Thunder Strike 26 mobilizing up to 2,400 reservists and the UK's Strike Warrior 26 involving more than 30 ships and aircraft, underscoring sustained deterrence posture even as Washington presses allies to shoulder more of Europe's conventional defense burden.","source":"NATO","url":"https://www.nato.int/en/news-and-events/articles/news/2026/09/19/nato-chiefs-of-defence-in-copenhagen-met-for-the-military-committee-conference"},{"headline":"Migration returns to top of Brussels' agenda as Mediterranean deaths climb despite fewer arrivals","body":"New IOM data show sea arrivals to Europe fell 39% in 2026, with roughly 60,000 migrants reaching European shores compared with 98,040 over the same period last year, yet fatalities on Mediterranean and Atlantic crossings rose to at least 2,292 from 1,999 a year earlier. EU diplomats say migration is 'very much back on the agenda' in Brussels, with unrest continuing in Spain's Ceuta enclave and national capitals bracing for renewed political friction over asylum policy even as some countries, like Austria, report falling application numbers domestically.","source":"IOM / fundsforNGOs, Euronews","url":"https://news.fundsforngos.org/2026/09/21/iom-migrant-arrivals-europe-2026/"}]},"middleEast":[{"headline":"Netanyahu vows sweeping crackdown after second West Bank shooting attack over Yom Kippur","body":"An Israeli man died after being shot near the Neve Tzuf settlement spring in the northern West Bank on September 20, the second such attack in the area, prompting Prime Minister Benjamin Netanyahu to declare that 'no terrorist is immune, nor are those who assisted them' and to order reinforcements into the West Bank. Netanyahu explicitly extended the threat to 'Gaza, in Lebanon, and in Judea and Samaria,' while Israeli security officials signaled plans for expansive operations timed to the Yom Kippur holiday period.","source":"The Times of Israel","url":"https://www.timesofisrael.com/liveblog-september-20-2026/"},{"headline":"CIA chief's rare Cairo visit underscores fears of wider Middle East escalation","body":"CIA Director John Ratcliffe met Egyptian President Abdel-Fattah el-Sissi and intelligence chief Hassan Rashad in Cairo as Washington warned of rapid regional escalation, with talks covering the wars involving Iran, Gaza, and Sudan as well as attacks on Gulf states and threats to maritime shipping. The visit followed a recent Cairo meeting between Sissi and Saudi Crown Prince Mohammed bin Salman, while Iran's military reiterated that any further US attack would trigger sustained strikes on American bases and warned regional states backing Washington would be treated as parties to the conflict.","source":"The Times of Israel","url":"https://www.timesofisrael.com/liveblog-september-20-2026/"},{"headline":"Iran war's economic toll deepens for Tehran and Riyadh alike","body":"Iranians are facing worsening shortages as President Trump's naval blockade, more than fresh sanctions, grinds down the economy, though analysts say Tehran still shows no sign of backing down. Saudi Arabia is also absorbing heavy costs from the ongoing conflict with only limited support from Washington, and Iran has reiterated that the Strait of Hormuz will not reopen 'until conditions are met,' keeping a key oil chokepoint disrupted six months into the war.","source":"The Washington Post / Jerusalem Post","url":"https://www.washingtonpost.com/world/middle-east/"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Weighs Rushed Model Launch to Blunt GPT-6 Astra Before IPO","body":"Reuters reported that Anthropic is internally debating whether to ship a new flagship model ahead of its anticipated public offering, aiming to counter the momentum OpenAI has built with GPT-6 Astra. The deliberations are notable because they cut against CEO Dario Amodei's own recent public call for the industry to slow the pace of frontier releases, exposing tension between safety messaging and competitive pressure just as both companies prepare IPO paperwork. Safety evaluations on any new model are reportedly still underway, with no launch date set.","source":"AI Weekly (Reuters)","url":"https://aiweekly.co/ai-news-today/edition/2026-09-19"},{"headline":"Class Action Accuses Anthropic, OpenAI, Google and xAI of Coordinated Slowdown","body":"A newly filed class action alleges Anthropic, OpenAI, Google and xAI effectively colluded to throttle frontier-model releases in the wake of Dario Amodei's essay urging the industry to decelerate, framing the pause as an illegal restraint of competition rather than a genuine safety measure. The suit lands as staff at Anthropic and OpenAI have separately told the Financial Times they felt blindsided by Amodei's and Sam Altman's pacing calls, worried the moves could be used to justify weaker independent security evaluation. The litigation adds fresh legal risk for both labs as they push toward long-anticipated IPOs.","source":"AI Weekly","url":"https://aiweekly.co/ai-news-today/anthropic-news"}],"cyberEmerging":[{"headline":"Iran-Linked Hackers Used Claude to Probe US Navy Systems as Tanker Attacks Widen","body":"Cybernews reported on September 19 that Iran-linked hackers have been caught using Anthropic's Claude model to reconnoiter US Navy and commercial shipboard systems, signaling that state-linked actors are now folding commercial AI tools into maritime targeting. The disclosure comes alongside a widening pattern of suspected intrusions on oil tankers, with US authorities now monitoring roughly 20 vessels after a third tanker reportedly had a system knocked offline; separately, the Coast Guard and FBI boarded two US-bound tankers in the Gulf of Mexico in late August after network compromises affecting navigation and propulsion. Formal attribution on the tanker incidents remains unconfirmed, but the cluster points to intensifying hybrid pressure on energy shipping lanes.","source":"Cybernews","url":"https://cybernews.com/news/"},{"headline":"Trump Floats New 'AI Force' and AI Czar, Calls Safety Fears a 'Hoax'","body":"In a Truth Social post reported over the weekend, President Trump said he plans to appoint an AI czar and create a new 'AI Force' modeled on the Space Force to oversee the industry, adding that 'only High I.Q. individuals need apply.' He dismissed AI safety concerns as a 'hoax' and said the White House would resist regulatory constraints on frontier developers. If formalized, the plan would create a new institutional layer for AI oversight that sits uneasily alongside existing congressional and state efforts to mandate frontier-model incident reporting.","source":"AI Weekly","url":"https://aiweekly.co/ai-news-today"}]},"cities":{"lasVegas":[{"headline":"Raiders open 2-0 for first time since 2021 with road win over Chargers","body":"The Las Vegas Raiders forced two late turnovers to upset the Los Angeles Chargers on the road Sunday, evening their record to 2-0 and matching a feat the franchise hasn't accomplished in five seasons. The win was fueled by a surprise receiving option, a rookie defensive back's two interceptions, and a long field goal late in the game. It's an encouraging early sign for a franchise looking to build momentum after years of inconsistency.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Henderson officer among group indicted in scheme to steal and resell military gear","body":"A federal grand jury has indicted a Henderson police officer as part of a broader conspiracy accused of stealing Department of Defense equipment and reselling it, according to court records reviewed by the Review-Journal. The case underscores ongoing concerns about security around military property even in areas removed from active bases, and comes as Southern Nevada hosts one of the country's largest concentrations of Air Force assets at Nellis and Creech. Further details on the scope of the alleged theft and additional defendants are expected as the case proceeds through federal court.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"NBA expansion to Las Vegas gains momentum after latest owners meeting","body":"League officials and team owners moved a step closer to bringing an NBA franchise to Las Vegas this past week, according to reporting on the latest round of ownership meetings. What was once viewed as a long-shot bid is increasingly being described as close to a sure thing, though no formal timeline or arena commitment has been finalized. The city's rapid growth in professional sports — following the Raiders, Golden Knights and now a WNBA champion in the Aces — continues to reshape Las Vegas's identity beyond the Strip.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Nellis-Creech-NTTR complex remains anchor of Southern Nevada's defense footprint","body":"The Nevada Test and Training Range, spanning roughly 2.9 million acres and paired with Nellis and Creech Air Force Bases, continues to serve as the largest contiguous training airspace available for U.S. and allied peacetime military operations. The complex — home to Red Flag exercises, F-22 tactics development, and Creech's MQ-9 Reaper remote-pilot missions — supports thousands of military and civilian jobs and hundreds of millions of dollars in annual economic impact across the Las Vegas valley. With Red Flag continuing on its recurring schedule and land-use planning efforts still active around Indian Springs and North Las Vegas, the base complex remains a persistent backdrop to any regional conversation about growth, airspace, and national security.","source":"Nellis Air Force Base / JT4 LLC","url":"https://www.nellis.af.mil/Units/NTTR.aspx"}]},"feelGood":[{"headline":"47-year-old pastor and father of three finally makes his college football debut","body":"Justin Buzzard, a pastor and father of three, suited up for a college football debut at age 47 — three decades after injuries derailed his playing career before it ever got started. His long-delayed moment on the field has resonated as a reminder that determination and community support can help people reclaim dreams they thought were long gone.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Firefighters refuse to give up on unconscious dog pulled from burning home","body":"First responders found a 6-year-old dog named Milo unconscious beneath a table inside a burning house and worked to revive him on the spot rather than give up. Milo has since made a full recovery and is back to running and playing, a small but powerful example of first responders going beyond the call of duty for a helpless victim.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Virginia chef goes out of his way to care for an elderly regular customer","body":"A chef in Virginia drew widespread praise this week after quietly going above and beyond to look after an elderly customer who dines at his restaurant, an act of everyday kindness that has since spread warmth well beyond the local community. The story is a small but genuine reminder that generosity toward strangers, especially the elderly, still shows up in ordinary places.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1937","event":"J.R.R. Tolkien's novel The Hobbit was first published in London."},{"year":"1964","event":"Malta gained independence from the United Kingdom."},{"year":"1981","event":"Belize achieved independence from the United Kingdom."},{"year":"2003","event":"NASA's Galileo spacecraft ended its mission with a planned plunge into Jupiter's atmosphere."}]},"topPicks":[{"headline":"Bessent and Chinese Vice Premier finalize groundwork for Trump-Xi Washington summit, float AI 'hotline'","teaser":"Top US and Chinese officials lay groundwork for a high-stakes Trump-Xi summit, including a proposed AI 'hotline'."},{"headline":"China Coast Guard Rams Philippine Fisheries Vessel Near Palawan","teaser":"A new maritime collision near Palawan escalates South China Sea tensions between Beijing and Manila."},{"headline":"Ukraine hits Moscow region with largest drone-missile barrage as rigged Duma vote concludes","teaser":"Kyiv launches its biggest strike yet on the Moscow region just as Russia's contested parliamentary vote wraps up."}]},"navDates":[{"key":"2026-09-24","label":"Sep 24","href":"/","isNewest":true},{"key":"2026-09-23","label":"Sep 23","href":"/archive/2026-09-23.html","isNewest":false},{"key":"2026-09-22","label":"Sep 22","href":"/archive/2026-09-22.html","isNewest":false},{"key":"2026-09-21","label":"Sep 21","href":"/archive/2026-09-21.html","isNewest":false},{"key":"2026-09-20","label":"Sep 20","href":"/archive/2026-09-20.html","isNewest":false},{"key":"2026-09-19","label":"Sep 19","href":"/archive/2026-09-19.html","isNewest":false},{"key":"2026-09-18","label":"Sep 18","href":"/archive/2026-09-18.html","isNewest":false}],"currentKey":"2026-09-21","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-09-21.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}], const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
