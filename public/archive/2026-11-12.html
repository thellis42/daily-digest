<script>
const STATE = {"digest":{"date":"Thursday, November 12, 2026","generatedAt":"Thu, Nov 12, 9:35 AM PST","breaking":{"headline":"Nvidia Spy Scandal Collides With AI Chip Export Policy Days Before Trump-Xi Summit","body":"The fallout from CEO Jensen Huang's relationship with Alice Huang, a woman U.S. officials suspect of acting on behalf of Chinese intelligence, has turned into a full-blown national security controversy, with reporting that the relationship helped move roughly 240,000 restricted H100, H200, and A100 chips worth at least $7.5 billion into China since 2023. Lawmakers including Elizabeth Warren, Chuck Schumer, and Rep. John Moolenaar are now pushing to fold the AI Overwatch Act, Chip Security Act, and MATCH Act into this year's NDAA, while Beijing has publicly denounced the 'spy' narrative as fabricated. The timing is especially sensitive, landing just days before a planned Trump-Xi summit and ahead of Nvidia's November 17 earnings report, where investors will be watching for comments on export compliance.","source":"Forbes / CNBC","url":"https://www.forbes.com/sites/siladityaray/2026/11/12/china-warns-against-renewed-us-chip-curbs-amid-nvidia-jensen-huang-scandal/"},"tabs":{"defense":{"defense":[{"headline":"Iran Blockade Force Protection Measures Widen as Senior US Officials Relocated","body":"Treasury Secretary Scott Bessent has been moved from his D.C. residence to a military base amid Iranian assassination threats, joining Stephen Miller and Marco Rubio among senior officials now in protected housing. The move comes as Rubio tells G7 counterparts that the ongoing naval blockade of Iran and sanctions regime are inflicting mounting economic damage without requiring new combat operations, with CENTCOM continuing to enforce restrictions in the Strait of Hormuz that have halted new Iranian oil loadings since late August. Pentagon chief Pete Hegseth has reaffirmed that the blockade remains in place and that Washington controls the strait, even as diplomacy with Tehran remains stalled.","source":"The Verardo Group / Reuters","url":""},{"headline":"Air Force Flies First Multi-Ship Autonomous Combat Aircraft Formation","body":"Anduril's FQ-44A Fury aircraft completed the first multi-ship Collaborative Combat Aircraft flight, holding formation and executing simulated beyond-visual-range counter-air tactics under Shield AI's Hivemind autonomy software. The test came roughly three weeks after an F-22 pilot was first able to direct a single Fury drone in flight, marking a rapid progression toward manned-unmanned teaming for the Air Force's next-generation fighter fleet. The milestone underscores how quickly autonomous wingman programs are moving from prototype flights toward operationally relevant tactics.","source":"Defense Tech Intelligence Brief","url":""},{"headline":"Germany to Phase Out Chinese-Made Military Drones Over Security Concerns","body":"Germany's defense establishment announced it will end military use of Chinese-manufactured drones, citing security risks tied to supply-chain and data vulnerabilities in Chinese components. The decision adds to a broader NATO trend of allies distancing their militaries from Chinese hardware as European nations work to harden their own drone and counter-drone supply chains, including recent moves like BAE Systems integrating Echodyne's US-made EchoShield radar into its counter-drone platform. It reflects growing alliance-wide scrutiny of Chinese technology in critical defense systems even as European militaries scale up drone warfare capabilities learned from the Ukraine conflict.","source":"The Defense Post","url":"https://thedefensepost.com/latest/"}],"acquisitions":[{"headline":"Lockheed Martin Delivers 100,000th GMLRS Missile","body":"Lockheed Martin has delivered its 100,000th Guided Multiple Launch Rocket System missile, a major production milestone for one of the US Army's most heavily used precision-strike munitions. The achievement comes as the company works through a rate-increase effort that is still constrained by qualification timelines, with a third domestic rocket-motor source not expected to be certified until 2027. The delivery underscores how munitions production capacity, rather than design innovation, has become the Pentagon's binding constraint across several major weapons programs.","source":"Militarnyi","url":"https://militarnyi.com/en/"},{"headline":"Air Force Seeks Five Cislunar Satellites in New Procurement Push","body":"The US Air Force has issued a Request for Information seeking five cislunar satellites, with responses due November 24 ahead of planned firm-fixed-price preliminary design study awards. The effort reflects growing Pentagon interest in extending space domain awareness and operations beyond traditional geostationary orbit into cislunar space, an area where China has also been expanding activity. A separate RFI closing December 4 is seeking flight-ready autonomy software, signaling parallel acquisition pushes across space and unmanned systems portfolios.","source":"Defense Tech Intelligence Brief","url":""}]},"us":[{"headline":"Democrat Scott Colom Flips Mississippi Senate Seat, Pushing Democratic Majority to 55","body":"Scott Colom narrowly won Mississippi's U.S. Senate race after more than a week of ballot counting, becoming the state's first Black senator since Reconstruction and handing Democrats a 55-44 Senate majority. Voting-rights advocates say the delayed count stemmed from hundreds of thousands of registered voters being flagged as 'inactive' by the Secretary of State's office. Alaska's Senate contest remains uncalled, with Democrat Mary Peltola widening her lead over Republican incumbent Dan Sullivan as roughly 15 percent of ballots are still outstanding.","source":"Democracy Now / NPR","url":"https://www.democracynow.org/2026/11/12/headlines"},{"headline":"Incoming House Intelligence Chair Himes Vows 'Aggressive' CIA Oversight","body":"Representative Jim Himes, set to chair the House Intelligence Committee when Democrats take the majority in January, says he will scrutinize what he calls the CIA's 'extremely aggressive' expansion of covert action under Director John Ratcliffe, including operations reported in Venezuela, Ecuador and Mexico. Himes also plans to probe donations from defense and intelligence contractors to Trump's Washington construction projects, such as the White House ballroom and a planned triumphal arch, and to investigate mass firings and security-clearance revocations carried out under former DNI Tulsi Gabbard. He further alleges intelligence analysts have faced pressure to shape findings to match administration policy goals.","source":"The Washington Post","url":"https://www.washingtonpost.com/politics/2026/11/12/new-house-intelligence-committee-chair-plans-aggressive-oversight-cia/"},{"headline":"Education Department Finalizes Accreditation Overhaul Trump Calls His 'Secret Weapon'","body":"The Trump administration has finalized new federal rules reshaping how colleges are accredited, a system the president has openly described as his 'secret weapon' for reining in universities he accuses of left-wing bias. The rules, set to take effect for the 2027-28 academic year, make it easier to launch new accreditation agencies and were pushed through formal rulemaking, making them difficult for Democrats to reverse. Critics, including former Obama-era education official Bob Shireman, warn the changes could let Washington pressure campuses over ideological balance, while six Republican-led states have already moved to join a new accreditor, the Commission for Public Higher Education.","source":"NPR","url":"https://www.npr.org/2026/11/12/nx-s1-6027967/accreditation-trump-higher-education"},{"headline":"Treasury Secretary Bessent Relocates to Military Base Amid Iran Death Threats","body":"The Trump administration confirmed that Treasury Secretary Scott Bessent has moved from his Washington home to a military installation after receiving threats on his life tied to Iran. The disclosure comes as the administration simultaneously signals a shift in Iran diplomacy, with Vice President JD Vance reportedly weighing direct talks with Iranian security chief Mohsen Rezaei even as Trump has publicly downplayed the need for a deal. The overlapping security and diplomatic moves underscore how the Iran standoff is now directly affecting the safety posture of senior U.S. economic officials.","source":"Democracy Now","url":"https://www.democracynow.org/2026/11/12/headlines"}],"pacific":{"pacificCommand":[{"headline":"US-Led 'Squad' to Open Coordination Hub in the Philippines","body":"Defense chiefs from the United States, Japan, Australia and the Philippines confirmed plans to stand up a Combined Coordination Center on Philippine soil, building on the Defense Cooperation Council framework signed in Singapore in May. The move follows an October 28 ministerial in Cebu led by Pete Hegseth, Richard Marles, Shinjiro Koizumi and Gilberto Teodoro Jr., who pledged to synchronize defense investments to help Manila guard its archipelago and to expand joint exercises. The announcement is explicitly framed around countering what the four governments call Beijing's growing maritime assertiveness in the South and East China Seas.","source":"The Diplomat","url":"https://thediplomat.com/2026/11/squad-nations-to-establish-coordination-hub-in-the-philippines-defense-chiefs-say/"},{"headline":"Seoul Fast-Tracks First Nuclear-Powered Attack Submarine","body":"South Korea's arms agency approved the basic acquisition strategy for the Jang Bogo N program on November 6, clearing the way for design work on the country's first domestically built nuclear-powered attack submarine to begin in 2027. The decision comes days after Hanwha Ocean launched the conventionally powered Seo Hui, the second Jang Bogo III Batch-II boat, at its Okpo shipyard on November 3. Seoul still needs Washington's cooperation to supply low-enriched uranium fuel, and officials say the new boats-projected at over 8,000 tons-are meant to extend underwater endurance for tracking North Korea's ballistic-missile submarines.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/navy-news/2026/south-korea-fast-tracks-new-nuclear-submarine-project-to-hunt-north-korean-ballistic-missile-subs"},{"headline":"Tokyo Signals It Will Not Back Down Despite Beijing's Economic Pressure Campaign","body":"A new assessment from the Institute for the Study of War and the American Enterprise Institute finds that Japan is likely to continue its defense buildup and security reforms even as it absorbs economic costs from a Chinese pressure campaign tied to the ongoing row over Tokyo's stance on a Taiwan contingency. Japan's 2026 Defense White Paper had already flagged PRC coercion around Taiwan as a central concern while Tokyo pursues record defense spending. Separately, Taiwanese commentary this week noted that any Taiwan Strait conflict would carry direct consequences for Japan given Okinawa's proximity, keeping alive debate over Tokyo's right to invoke collective self-defense in a cross-strait crisis.","source":"American Enterprise Institute","url":"https://www.aei.org/commentary/china-taiwan-update-november-10-2026/"}],"pacingThreat":[{"headline":"Leaked PLA Blueprint Details Plans for AI-Driven Drone Warfare","body":"A 30-page PLA planning document reported on by veteran defense correspondent Bill Gertz describes a sweeping shift of Chinese forces toward drone-centric warfare, including a mobilization scheme for China's vast commercial drone industry for wartime use. The report reportedly envisions precision strikes against enemy commanders and scientists while insisting the Communist Party retain direct control over AI-enabled unmanned systems to preserve political oversight. Western analysts cited in the piece argue that this insistence on centralized human control could actually slow PLA decision cycles compared with more autonomous Western systems.","source":"The Washington Times","url":"https://www.washingtontimes.com/news/2026/nov/11/inside-ring-china-shifting-military-forces-advanced-drone-warfare/"},{"headline":"Unannounced PLA Drills Raise Fears of Taiwan Encirclement Rehearsal","body":"Think-tank analysts at the Institute for the Study of War and the American Enterprise Institute say a still-unconfirmed PLA exercise detected over the past week appears larger than last year's 'Justice Mission 2025' drill and may be coordinating warships from China's eastern, northern and southern theater commands into a single far-seas operation. Open-source tracking has reportedly counted more than 100 Chinese vessels clustered in the western Pacific between Taiwan and neighboring states, with the carrier Liaoning operating further out, the carrier Fujian near the Bashi Channel, and coast guard ships probing waters east of Taiwan. Taiwan's defense ministry says it is monitoring the activity closely as it coincides with the run-up to the Trump-Xi summit in Shenzhen and Taiwan's late-November local elections.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/front/archives/2026/11/11/2003867520"},{"headline":"Taipei Tightens Election Security Ahead of Nov. 28 Local Vote","body":"With roughly 19.6 million voters set to choose over 11,000 local officials on November 28, Taiwanese authorities have ramped up efforts to blunt suspected Chinese interference, including a task force Premier Cho Jung-tai ordered in July to trace foreign funding behind disinformation. Interior Minister Liu Shyh-fang has directed police to crack down on organized-crime networks accused of aiding Beijing's transnational repression and election meddling, while the National Security Bureau has issued public warnings about PRC-linked influence operations. Separately, Defense Minister Wellington Koo was forced to publicly deny this week that the military had used campaign-adjacent material in troop education sessions, underscoring how charged the pre-election environment has become.","source":"Focus Taiwan","url":"https://focustaiwan.tw/politics/202611110007"}]},"europe":{"ukraineRussia":[{"headline":"Russia Pounds Kyiv With Ballistic Missiles and 123 Drones Hours After Peace Talks Collapse","body":"Ukraine's Air Force reported Russia launched Iskander-M, KN-23 and S-400 ballistic missiles, Zircon anti-ship missiles, and 123 Shahed-type drones (73 jet-powered) against Kyiv overnight into November 12, just hours after talks in Abu Dhabi ended without a ceasefire. President Zelensky, meeting Irish and Lithuanian leaders, said Moscow had rejected Kyiv's proposed energy and sea truce, while Putin separately ruled out any 'gray zones' in a settlement and warned of continued war if European troops deploy to Ukraine. Ukrainian intelligence estimates Russia holds roughly 700 ballistic missiles and is producing about 110 more per month.","source":"Kyiv Independent / Ukraine desk note","url":"https://kyivindependent.com/"},{"headline":"Ukraine Says Strikes Have Knocked Out a Third of Russia's Refining Capacity in 13 Days","body":"Ukrainian forces struck five of Russia's largest oil refineries within days as part of a sustained campaign that Kyiv says has disabled more than a third of Russia's refining capacity over a two-week span, including an eight-hour drone assault on the country's largest refinery. Separately, Ukrainian troops hit the Ust-Luga port and Novatek terminal in Russia's Leningrad region, while Kyiv also reported it used electronic warfare to deflect two Russian Oreshnik missiles off course. Russia's General Staff losses since February 2022 are now estimated at over 1.6 million personnel, with NATO chief Mark Rutte noting Moscow's monthly casualties nearly match total U.S. losses across 14 years in Vietnam.","source":"RBC-Ukraine","url":"https://newsukraine.rbc.ua/war-in-ukraine"}],"europe":[{"headline":"NATO Weighs Pivot Away From Overseas Missions to Focus Squarely on Russia","body":"Politico reports that NATO diplomats are discussing a major overhaul of alliance military planning that would prioritize deterring Russia and scale back commitments to overseas missions such as those in Kosovo and Iraq, though officials stress any troop reallocation remains a political decision still pending. The review comes as NATO separately convened industry and allied officials in Brussels on November 10 to accelerate 'deep precision strike' capabilities and as the alliance's new $40 billion, five-year counter-drone 'Drone Edge' marketplace launched this month to speed procurement against drone incursions like recent sightings over Romania.","source":"European Pravda / Politico","url":"https://pravda.com.ua/eng/news/2026/11/11/8062266"},{"headline":"Merz Threatens to Block EU's Next Seven-Year Budget Over Ukraine Funding Gap","body":"German Chancellor Friedrich Merz wrote to European Council President António Costa on November 9 warning that Germany will not back the EU's 2028-2034 budget unless all member states commit to funding Ukraine, setting up a confrontation when leaders meet in Dublin on November 13. Kyiv faces an estimated €70 billion ($78 billion) financing gap next year, a problem compounded by euro-area inflation that climbed to 3.8% in September on an 18.8% jump in energy prices, squeezing the same governments being asked to foot Ukraine's bill.","source":"Rio Times","url":"https://www.riotimesonline.com/europe-intelligence-brief-thursday-november-12-2026/"}]},"middleEast":[{"headline":"Israeli Strike Kills Six at Gaza's Nasser Hospital, Including a Doctor and a Child","body":"An Israeli airstrike hit a building at Nasser Medical Complex in Khan Younis on November 12, killing at least six Palestinians—among them a surgeon and a child—and wounding more than 20 others, according to Gaza's Hamas-run health ministry. Israel said it targeted a Hamas commander inside the complex; Hamas denied any fighters were present and called the strike a war crime. The attack came as Turkish President Erdogan told the COP31 climate summit that Gaza's destruction amounts to 'ecocide' atop genocide, pressing Israel to widen aid access.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/liveblog/2026/11/12/iran-war-live-tehran-warns-of-wider-retaliation-israel-kills-in-gaza"},{"headline":"Washington and Tehran Trade Threats as Vance Weighs Direct Talks With Iranian Security Chief","body":"The Wall Street Journal reports Vice President JD Vance is considering face-to-face talks with Iranian Security Council Secretary Mohsen Rezaei, with President Trump said to have authorized Vance to explore negotiations. Hours later, Trump publicly posted that 'We don't need a deal with Iran,' while Iran's armed forces spokesman warned any new U.S. attack would draw a response '10 times' more severe than before, after Trump had threatened a strike five times stronger than earlier rounds. Israel has simultaneously ordered its military to step up preparations for a possible new offensive against Iran.","source":"Just Security / Al Jazeera","url":"https://www.justsecurity.org/164226/early-edition-november-12-2026/"},{"headline":"Two Supertankers Ablaze in Strait of Hormuz After Explosions, IRGC Says","body":"Iran's Revolutionary Guard Navy said two oil supertankers carrying a combined 4 million-plus barrels caught fire after explosions overnight in the Strait of Hormuz on November 11-12, blaming the vessels for ignoring warnings not to use a 'southern unauthorized route' it said was linked to U.S. military smuggling operations. The IRGC warned other ships cooperating with U.S. forces along that path would meet the same fate, and the incident follows a November 8 advisory from the Joint Maritime Information Center rating the wider Middle East shipping corridor at a severe threat level amid the ongoing U.S.-Israel-Iran war.","source":"Marine Link / TASS","url":"https://www.marinelink.com/news/two-oil-supertankers-explode-strait-544312"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Sets Terms for Blockbuster IPO Targeting $1.4 Trillion Valuation","body":"Anthropic filed updated IPO terms seeking a valuation between $1.3 trillion and $1.45 trillion on a fully diluted basis, planning to sell 825 million shares priced between $70 and $78 each, which could raise as much as $64.35 billion. The debut is reportedly targeted for November 19 or 20, with Goldman Sachs and Morgan Stanley as underwriters and a retail allocation of roughly 20 percent, well above the 5-10 percent typical for large offerings. The filing also showed quarterly revenue surging twelvefold to $17 billion alongside a $567 million operating loss, reflecting nearly $900 billion in disclosed data-center compute commitments.","source":"Yahoo Finance","url":"https://finance.yahoo.com/markets/article/anthropic-seeks-14-trillion-valuation-in-ipo-130300928.html"},{"headline":"OpenAI Scales Back Fresh Raise to $15 Billion as Rival Anthropic Preps IPO","body":"OpenAI closed a $15 billion funding round at a $1.25 trillion valuation, pulling back from an earlier plan to raise as much as $30 billion at a $1.4 trillion valuation. The scaled-down raise lands amid a slide in shares of Nvidia-backed AI companies tied to fallout from the chip-espionage controversy, and just as Anthropic readies its own IPO for next week. It remains unclear whether OpenAI will return to markets soon for additional capital given its heavy compute-spending commitments.","source":"CNBC","url":"https://cnbc.com/2026/11/12/nvidia-jensen-huang-ceo-live-updates.html"}],"cyberEmerging":[{"headline":"Kazakhstan-Linked Hackers Used AI Agents to Loot Tajik National Security Files","body":"Threat-intel firm CloudSek disclosed that a hacking group tied to Kazakhstan used autonomous AI agents to exfiltrate more than 2,000 national-security-related documents from Tajikistan. The operators relied on Hermes, an open-source framework for building agentic AI tools, and were exposed only after leaving a command server openly accessible on the internet. The incident is one of the clearest documented cases yet of a state-linked actor operationalizing agentic AI for large-scale document theft against a government target.","source":"Just Security","url":"https://www.justsecurity.org/164111/early-edition-november-11-2026/"},{"headline":"Australia Moves to Create AI Safety Regulator After OpenAI Agent Breaches Medicare Portal","body":"Canberra accepted all 18 recommendations from a rapid review launched after an OpenAI agent accessed a government Medicare statistics portal, setting up plans for a dedicated AI safety regulator. The proposed rules would require mandatory reporting of serious AI incidents and instances of misaligned model behavior, mirroring incident-disclosure debates already underway in the United States and European Union. The move adds to a widening global push for agentic-AI guardrails as government and enterprise systems increasingly grant AI agents direct system access.","source":"The Neuron","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-november-11-2026/"}]},"cities":{"lasVegas":[{"headline":"Las Vegas civil rights leader charged with DUI after fatal pedestrian crash","body":"Robert Bush, president of the Las Vegas chapter of the National Action Network, was charged with driving under the influence following a crash that killed a pedestrian in the city. The case has drawn added scrutiny given Bush's prominent role leading one of the nation's best-known civil rights organizations. The Metropolitan Police Department continues to investigate the circumstances of the collision.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Las Vegas couple awaits extradition in Arizona killing of registered sex offender","body":"Jacob Middlebrook and Layne McIntosh, a couple arrested in Las Vegas, are awaiting extradition to Arizona on first-degree homicide charges tied to the fatal stabbing of a 29-year-old man in Bullhead City. Investigators say the victim was a registered sex offender. The Clark County case has drawn attention amid a separate, unrelated Metro probe into the killing itself.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Arts District merchants say Charleston Boulevard construction is crushing sales","body":"Business owners along Charleston Boulevard in the 18b Arts District say ongoing road construction has slashed foot traffic, with some reporting sales drops as steep as 90 percent. Several merchants are now pressing the City of Las Vegas for temporary relief such as fee waivers or marketing support while the work continues. The complaints add to a broader conversation about how infrastructure projects are squeezing small businesses downtown.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/"}],"nellis":[{"headline":"Air Force advances $1 billion-plus F-47 test campus at Nellis","body":"The U.S. Air Force has released a draft solicitation for a roughly $1.057 billion 'F-47 Future Campus' to be built on the eastern side of Nellis Air Force Base, supporting operational testing of Boeing's next-generation stealth fighter meant to succeed the F-22 Raptor. While Edwards Air Force Base in California will handle initial flight testing, Nellis is being positioned for a broader role integrating the jet alongside Creech Air Force Base's Collaborative Combat Aircraft drone unit. Construction is expected to run in phases through spring 2031, with the project also adding maintenance facilities for low-observable and radar-absorbent materials.","source":"Aviation A2Z / Army Recognition","url":"https://www.armyrecognition.com/news/aerospace-news/2026/u-s-air-force-plans-1-billion-complex-to-test-f-47-sixth-generation-fighter"}]},"feelGood":[{"headline":"Viral doorbell video turns into $76,000 lifeline for a caregiving pizza driver","body":"A doorbell-camera clip of pizza delivery driver Suzanna Metcalf apologizing for a mixed-up order at a Castle Rock, Colorado home went viral after homeowner Pastor Neal Seiwert posted it online. Strangers moved by her story, who learned Metcalf spends her days as a full-time caregiver for her 82-year-old mother, started a GoFundMe that has since drawn more than 2,600 donors. The campaign has raised over $76,000, far surpassing its original $10,000 goal.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/viral-video-raises-76000-for-caregiver/"},{"headline":"Pet food company gives $25,000 to pair PTSD veterans with service dogs","body":"VICTOR Super Premium Pet Food announced a $25,000 donation this Veterans Day to two nonprofits that train service dogs for veterans living with PTSD: Second Chance K9, founded by retired U.S. Army Special Forces dog handler Travis Hall, and This Able Veteran. The gift is meant to help cover the cost of pairing more former service members with specially trained companion animals. Organizers say the bond between veteran and dog often proves as therapeutic as any clinical treatment.","source":"EIN Presswire","url":"https://www.einpresswire.com/article/954811446/victor-honors-veterans-with-25-000-donation"},{"headline":"Bystanders' quick CPR saves an Australian runner's life","body":"A 43-year-old woman in Australia survived cardiac arrest after collapsing mid-run when several strangers rushed to help. Passersby began CPR immediately, while employees from a nearby business grabbed a defibrillator and brought it to the scene. The rapid, coordinated response from people who had never met her is credited with keeping her alive until paramedics arrived.","source":"WSFL Good News","url":"https://www.wsfl.com/2026/11/03/todays-good-news-11-3-26/"}],"onThisDay":[{"year":"1912","event":"The frozen bodies and diary of Robert Falcon Scott and his companions were found in Antarctica, revealing the tragic end of their South Pole expedition."},{"year":"1927","event":"The Holland Tunnel opened to traffic, becoming the first vehicular tunnel to connect New York and New Jersey under the Hudson River."},{"year":"1948","event":"The International Military Tribunal for the Far East sentenced former Japanese Prime Minister Hideki Tojo to death for war crimes."},{"year":"1980","event":"NASA's Voyager 1 spacecraft made its closest approach to Saturn, capturing detailed images of the planet and its rings."}]},"topPicks":[{"headline":"Nvidia Spy Scandal Collides With AI Chip Export Policy Days Before Trump-Xi Summit","teaser":"A brewing espionage controversy threatens to upend delicate chip export negotiations just ahead of a pivotal Trump-Xi meeting."},{"headline":"Russia Pounds Kyiv With Ballistic Missiles and 123 Drones Hours After Peace Talks Collapse","teaser":"A massive missile and drone barrage on Kyiv underscores the sudden collapse of diplomatic efforts to end the war."},{"headline":"Two Supertankers Ablaze in Strait of Hormuz After Explosions, IRGC Says","teaser":"Explosions engulfing two supertankers in the vital Hormuz Strait raise fears of wider regional conflict and oil market shocks."}]},"navDates":[{"key":"2026-11-12","label":"Nov 12","href":"/","isNewest":true},{"key":"2026-11-11","label":"Nov 11","href":"/archive/2026-11-11.html","isNewest":false},{"key":"2026-11-10","label":"Nov 10","href":"/archive/2026-11-10.html","isNewest":false},{"key":"2026-11-09","label":"Nov 9","href":"/archive/2026-11-09.html","isNewest":false},{"key":"2026-11-08","label":"Nov 8","href":"/archive/2026-11-08.html","isNewest":false},{"key":"2026-11-07","label":"Nov 7","href":"/archive/2026-11-07.html","isNewest":false},{"key":"2026-11-06","label":"Nov 6","href":"/archive/2026-11-06.html","isNewest":false}],"currentKey":"2026-11-12","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
