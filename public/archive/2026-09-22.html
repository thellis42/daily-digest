<script>
const STATE = {"digest":{"date":"Tuesday, September 22, 2026","generatedAt":"Tue, Sep 22, 7:02 AM PDT","breaking":{"headline":"Xi Jinping heads to Washington for first visit in a decade as Trump summit looms","body":"Chinese President Xi Jinping is set to hold a state visit in Washington this week, his first trip to the U.S. capital in ten years, with talks centered on trade, artificial intelligence, and critical minerals. A $14 billion U.S. arms package for Taiwan awaits final approval, and analysts expect Xi to press Trump to abandon it, even as Taiwan takes a smaller role than in their May meeting. China's suspension of rare-earth export controls expires November 10, giving Beijing leverage heading into the sit-down, while the Iran war and AI competition also loom over the agenda.","source":"The National","url":"https://www.thenationalnews.com/news/us/2026/09/21/trump-set-for-washington-summit-with-xi-focused-on-trade-taiwan-and-ai/"},"tabs":{"defense":{"defense":[{"headline":"Army tests AI and electronic warfare against 100-drone swarms at Fort Bragg","body":"The U.S. Army's XVIII Airborne Corps ran its Scarlet Dragon 26-3 exercise this week, pitting AI-enabled sensors, electronic warfare, radar, and layered defensive fires against simulated swarms of up to 100 unmanned aircraft. The drill was designed to determine whether U.S. forces can detect and defeat saturation drone attacks before they overwhelm command posts and air-defense units. Results are expected to shape how the Army builds future counter-UAS defenses as massed drone threats grow more common on modern battlefields.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/u-s-army-tests-ai-and-electronic-warfare-to-stop-100-drone-swarms-from-overwhelming-battlefield-defenses"},{"headline":"National Guard's new Mobile Brigade concept deploys to CENTCOM for first time","body":"About 1,200 Virginia and Kentucky National Guard soldiers from the 116th Mobile Brigade Combat Team are deploying to the Middle East in support of Operation Inherent Resolve, marking the first operational use of the Army's new mobile brigade concept. The move, announced September 21 by Virginia National Guard Public Affairs, shifts the sensor-rich, faster-reconnaissance formation from training and experimentation into a real CENTCOM mission after months of preparation.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/u-s-deploys-first-national-guard-mobile-brigade-with-drone-and-electronic-warfare-capabilities-to-middle-east"},{"headline":"France fast-tracks Aster 30 missiles and radars to bolster Ukraine's air defenses","body":"France announced on September 22 that it is signing a new contract to deliver additional radars and Aster 30 interceptor missiles to Ukraine, while also preparing licensed local production of the interceptors. The package builds on earlier Franco-Ukrainian commitments around SAMP/T NG air-defense systems as Kyiv races to shore up protection for its power grid and critical infrastructure ahead of another winter of Russian missile and drone strikes.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/france-accelerates-the-short-term-deliveries-of-aster-30-missiles-to-ukraine"}],"acquisitions":[{"headline":"Army fast-tracks HIMARS-launched anti-ship missile under rapid acquisition pathway","body":"The U.S. Army has moved its Precision Strike Missile (PrSM) Increment 2 anti-ship variant onto the Pentagon's Middle Tier of Acquisition Rapid Fielding pathway, a shift made official September 3 and reported this week. The change is meant to speed delivery of a multi-mode seeker capable of hitting moving ships directly into existing M142 HIMARS and M270A2 launchers. By reusing validated Increment 1 hardware and software, the Army avoids the cost and delay of building a dedicated coastal-defense launch platform.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/us-army-prsm-increment-2-rapid-fielding-anti-ship-missile"},{"headline":"Air Force lines up $64 million contract to sustain V-22 Osprey fleet post-production","body":"The Pentagon is preparing the V-22 Osprey tiltrotor fleet for a post-production sustainment era with a newly reported $64 million contract, as the program shifts from active manufacturing toward long-term fleet support. The award reflects a broader trend across Pentagon aviation programs of shifting acquisition dollars from new production lines to sustainment and readiness as legacy platforms age into their later service decades.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/u-s-deploys-first-national-guard-mobile-brigade-with-drone-and-electronic-warfare-capabilities-to-middle-east"}]},"us":[{"headline":"CNN, MS NOW and Politico Sue Trump Over White House Access Ban","body":"The three outlets filed an emergency First Amendment lawsuit in D.C. federal court on Monday after their reporters were physically blocked from White House grounds and had credentials revoked following Trump's Friday announcement banning them for coverage he called 'FICTION and LIES.' The case landed with Judge Timothy Kelly, a Trump appointee who previously ordered CNN's Jim Acosta reinstated during the first administration, with a videoconference hearing set for Wednesday afternoon and the DOJ ordered to respond by Tuesday. Trump himself predicted on Truth Social that the judge assignment was 'bad news' for his side and vowed to appeal any adverse ruling, while major networks including Fox and the AP have paused pool video coverage in solidarity.","source":"NPR / CNN / CBS News","url":"https://www.npr.org/2026/09/21/nx-s1-5975451/reporters-say-they-were-blocked-from-entering-white-house-after-trump-banned-outlets"},{"headline":"Wall Street Rattled as Fed's Rate Hike Fuels Correction Fears","body":"Days after the Federal Reserve's unanimous quarter-point rate increase to 3.75%-4.0% — its first hike in over three years — markets are digesting signals from Chair Kevin Warsh that at least one more increase is likely before year's end. Rising bond yields and comments from Warsh described as having 'changed the game for Wall Street' are stoking talk of a potential stock-market correction just weeks before the midterms. The move directly defies President Trump's repeated public pressure for lower rates, deepening tension between the White House and the Fed chair Trump himself installed in January.","source":"The Motley Fool / CNN Business","url":"https://www.fool.com/investing/2026/09/22/stock-market-investors-bad-news-president-trump-economy/"},{"headline":"Trump-Aligned Super PACs Pour $150 Million Into Vulnerable Red Seats","body":"Two pro-Trump super PACs have reserved more than $150 million in television and digital ads, concentrating spending in deep-red House and Senate districts that Republican strategists now consider competitive amid a souring political environment. The scale of the reservation signals GOP alarm about midterm exposure even in traditionally safe territory, with early ad buys aimed at shoring up incumbents before Democratic momentum builds heading into November 3. The spending comes as Texas Senate nominee Ken Paxton publicly acknowledged at the Dallas convention that his campaign needed financial reinforcement.","source":"NPR Politics","url":"https://www.npr.org/sections/politics/"},{"headline":"Cracks Emerge in GOP Ranks Over Trump's Election-Fraud Claims","body":"New reporting shows a growing split among Republican candidates in critical toss-up races, with some GOP voters signaling they are ready to move past President Trump's unsubstantiated claims about election integrity even as many nominees continue echoing them. The divide is most visible in states like Georgia, where Senate nominee Mike Collins navigates a base still loyal to Trump's rhetoric alongside voters fatigued by it. The fracture complicates Republican midterm messaging just six weeks before the November 3 vote for control of the 120th Congress.","source":"NPR Politics","url":"https://www.npr.org/sections/politics/"}],"pacific":{"pacificCommand":[{"headline":"US, Japan, South Korea Reaffirm Trilateral Pact at UN Gathering","body":"On the sidelines of UN General Assembly high-level week in New York on September 21, Secretary of State Marco Rubio joined Japanese Foreign Minister Motegi Toshimitsu and South Korean Foreign Minister Cho Hyun to renew their three-way security pledge. The ministers committed to deepen cooperation on North Korea's denuclearization, regional maritime security, and emerging technologies including AI, semiconductors and quantum computing. They also vowed to push back against economic coercion and market-distorting trade practices that threaten shared supply chains.","source":"IBG News","url":"https://ibgnews.com/2026/09/22/us-japan-and-south-korea-reaffirm-trilateral-cooperation-on-security-north-korea-and-economic-resilience/"},{"headline":"Tokyo Locks In Defense Chief, Eyes Bigger Budget as Pressure From Washington Grows","body":"Japan's Defense Minister Shinjiro Koizumi retained his post in Prime Minister Sanae Takaichi's cabinet reshuffle and held a roughly 10-minute call with US Secretary of War Pete Hegseth on September 18 to reaffirm alliance ties. Koizumi told Hegseth he intends to accelerate revisions to Japan's three core strategic defense documents and speed up the transformation of the Self-Defense Forces. The continuity comes as Tokyo weighs a new mid-term target of pushing defense spending to 3.5% of GDP, a level in line with NATO benchmarks that could strain Takaichi's fiscal plans.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-09-19/japan-us-agree-to-deepen-security-ties-as-koizumi-stays-in-post"},{"headline":"Manila Widens Security Web With Seoul and Tokyo Amid Contested Waters Standoff","body":"Philippine Defense Secretary Gilberto Teodoro Jr. used the Seoul Defense Dialogue in mid-September to publicly rebuke Chinese conduct in the South China Sea, a day after Manila and Seoul's defense chiefs agreed to expand personnel exchanges and joint exercises. Japan has gone further than South Korea in explicitly backing the 2016 international arbitration ruling favoring Philippine maritime claims, and its Reciprocal Access Agreement with Manila-in force since September 2025-was exercised during this year's Balikatan drills. Analysts note the Philippines' 'assertive transparency' publicity strategy has raised global awareness of the dispute but has yet to translate into new concrete commitments from partners.","source":"Radio Free Asia","url":"https://www.rfa.org/english/southchinasea/2026/09/17/philippines-china-teodoro-note-rebuke/"}],"pacingThreat":[{"headline":"China Coast Guard Rams Philippine Fisheries Vessel Off Palawan","body":"The Philippine Coast Guard reported that a China Coast Guard ship rammed the BRP Datu Magat Salamat, a Bureau of Fisheries vessel, on the morning of September 18 while it was delivering fuel subsidies to Filipino fishermen off Palawan. Spokesman Jay Tarriela publicized the incident within hours, part of Manila's now-routine practice of releasing footage of confrontations to build an international record. The collision adds to a string of physical encounters this year and comes as China and ASEAN states were meeting in Manila for a working-group session on a South China Sea code of conduct.","source":"Manila Times","url":"https://www.manilatimes.net/2026/09/18/news/chinese-ship-rams-philippine-vessel-in-south-china-sea/2428073"},{"headline":"PLA Southern Theater Runs Live-Missile Patrols Over Scarborough Shoal","body":"China's Southern Theater Command conducted what it called routine readiness patrols over Huangyan Dao (Scarborough Shoal), with footage showing a JL-10 advanced trainer jet carrying live missiles during multiple passes. The PLA framed the patrols as normal law-enforcement activity rather than a military exercise, consistent with Beijing's pattern of using coast guard and paramilitary assets to press its claims short of overt conflict. The show of force lands amid an active PLA calendar that also includes the China-Laos 'Peace Train-2026' medical exercise and a Chinese naval escort group's planned stops in Bangladesh, Myanmar and Malaysia.","source":"Global Times","url":"https://www.globaltimes.cn/china/military/index.html"},{"headline":"Taiwanese Businessman Freed After Years-Long China Detention Returns Home","body":"Tsai Chin-shu, chairman of a cross-strait trade association in southern Taiwan, announced on Facebook on September 19 that he had returned home after being held in China on allegations of 'endangering national security.' Tsai had traveled frequently between Taiwan and China for business, including a 2018 trip to a Fujian food trade fair after which he disappeared for years while his family sought answers from authorities. The case underscores Beijing's continued use of exit bans and national-security detentions against Taiwanese nationals, a pressure tactic that Taipei's security services say is meant to intimidate cross-strait business travelers.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/09/21/2003864624"}]},"europe":{"ukraineRussia":[{"headline":"Massive Weekend Drone Barrage Marks One of War's Largest Air Exchanges","body":"Russia says its air defenses intercepted more than 1,600 Ukrainian drones since Saturday, including roughly 450 aimed at Moscow, in one of the heaviest exchanges of the war. Kyiv's strikes again focused on fuel depots, ammunition warehouses and refinery-linked infrastructure in Zaporizhzhia, Odesa and other regions, continuing a months-long campaign to bleed Russia's war economy rather than seize territory. The scale of the barrage, paired with Russia's own drone retaliation against Ukrainian cities, shows deep-strike drone warfare has eclipsed ground maneuver as the conflict's primary battlefield this fall.","source":"WORLD News Group","url":"https://wng.org/podcasts/monday-morning-news-september-21-2026-1789935680"},{"headline":"Ukrainian Refinery Strikes Drive Russia's Worst Fuel Crunch Since Soviet Collapse","body":"Sustained Ukrainian long-range strikes have cut Russian crude processing to about 3.8 million barrels a day in August, down from roughly 5.3-5.5 million a year earlier, according to Bloomberg-sourced estimates. Independent assessments put the damage at 25-30% of Russia's total refining capacity knocked offline, producing fuel shortages analysts describe as the worst since the USSR's collapse. Putin himself has estimated a 40-day Ukrainian strike campaign ordered by Zelensky in late June inflicted damage equal to about 1% of Russian GDP, a sign economic warfare is now central to Kyiv's strategy.","source":"Russia Matters","url":"https://www.russiamatters.org/news/russia-ukraine-war-report-card/russia-ukraine-war-report-card-sept-2-2026"}],"europe":[{"headline":"NATO Military Chiefs Meet in Copenhagen to Sync Alliance Readiness","body":"NATO's Military Committee, its senior uniformed body, convened in Copenhagen on September 18-19 for its annual conference under Chair Admiral Giuseppe Cavo Dragone, bringing together the chiefs of defense from all 32 member states. The meeting lands amid a crowded autumn exercise calendar, including the Royal Navy's Strike Warrior 26 involving more than 30 ships starting September 21 and Lithuania's Thunder Strike 26, which is mobilizing up to 2,400 reservists. The conference underscores NATO's push to project cohesion and readiness even as political turmoil in member states complicates ongoing burden-sharing and spending negotiations.","source":"NATO","url":"https://www.nato.int/en/news-and-events/articles/news/2026/09/19/nato-chiefs-of-defence-in-copenhagen-met-for-the-military-committee-conference"},{"headline":"Merz's CDU Shut Out of State Parliament as Far-Right AfD Notches Second Win in Two Weeks","body":"Chancellor Friedrich Merz called Sunday's results a 'disaster' after his Christian Democratic Union failed to clear the 5% threshold in Mecklenburg-Western Pomerania, finishing with just 4.9% - its worst-ever state showing in 81 years. The far-right Alternative for Germany took about 38% there, its second state victory this month following a near-44% showing in Saxony-Anhalt on September 6, while the far-left Die Linke topped a separate Berlin election with 25.7%. The back-to-back results intensify doubts about Merz's leadership and expose cracks in the mainstream parties' long-standing refusal to work with the AfD, whose leader Alice Weidel is now pressing the CDU to abandon that 'firewall' policy.","source":"Axios","url":"https://www.axios.com/2026/09/21/germany-election-results-afd-merz"}]},"middleEast":[{"headline":"Saudi Arabia Downs Houthi Missile Over Riyadh, Testing U.S. Response","body":"Saudi air defenses intercepted a ballistic missile fired at Riyadh by Iran-backed Houthi rebels over the weekend, the latest in a string of attacks on the kingdom from Yemen. White House national security adviser Mike Waltz said the administration takes the strikes against a U.S. ally 'very seriously' but declined to detail any American response, noting Trump had earlier turned down a Saudi request for strikes on Houthi targets. The escalation comes as fighting inside Yemen killed or injured roughly 680 people last week, according to World Health Organization figures.","source":"WORLD News Group","url":"https://wng.org/podcasts/monday-morning-news-september-21-2026-1789935680"},{"headline":"Unidentified Projectile Strikes Tanker Entering Strait of Hormuz","body":"Britain's military reported that an unknown projectile hit a commercial tanker on Monday as it entered the Strait of Hormuz, injuring two crew members before the ship continued under its own power toward port. The attack, still unattributed, highlights how exposed Gulf shipping lanes remain months after the U.S.-Israel war on Iran disrupted regional energy flows. New official data show Iran's oil and gas sector has contracted by 26% since that conflict, a reminder of how economically strained Tehran remains even as sporadic attacks continue.","source":"Las Vegas Review-Journal (AP)","url":"https://www.reviewjournal.com/news/politics-and-government/a-projectile-hits-a-tanker-as-it-enters-the-strait-of-hormuz-3889256/"},{"headline":"Gaza Truce Strains as Israeli Strikes and West Bank Raids Persist","body":"Nearly a year after an October ceasefire took hold in Gaza, Israeli forces continue hitting sites identified as Hamas infrastructure, including a strike carried out after an explosive device hit an Israeli vehicle over the weekend. In the West Bank, the IDF has locked down the town of Biddu, detaining at least 53 young men following a deadly shooting, while separately arresting two Palestinians accused of plotting a further attack. The continued violence shows how fragile the Gaza arrangement remains even as Israeli forces separately claim 'operational control' over positions in southern Lebanon.","source":"Al Jazeera","url":"https://www.aljazeera.com/middle-east/"}],"techAI":{"aiCompetition":[{"headline":"Nvidia Weighs $10 Billion Anchor Stake in Anthropic's Up to $100 Billion IPO","body":"Nvidia is in talks to anchor as much as $10 billion of Anthropic's planned initial public offering, which could raise up to $100 billion and value the AI lab near $2 trillion, according to Reuters reporting confirmed this week. The talks land just two days before the September 24 Trump-Xi summit, where U.S. Trade Representative Jamieson Greer has signaled chip-export easing is unlikely to be on the agenda even as broader AI cooperation is discussed. Anthropic's annualized revenue run rate has surged from roughly $9 billion at the end of 2025 to more than $65 billion by July 2026, fueling investor appetite for the offering. A deal would deepen Nvidia's stake in the frontier-AI ecosystem it already supplies with GPUs, even as its own China chip sales remain capped by federal licensing rules.","source":"The Motley Fool","url":"https://www.fool.com/investing/2026/09/21/nvidias-forecast-assumes-no-data-center-chip-sales-to-china-the-sept-24-u-s-china-summit-could-change-that/"},{"headline":"Amodei's Pace-the-Frontier Pledge Splits Big AI Labs as Zuckerberg Holds Out","body":"Dario Amodei's early-September essay titled We Must Pace the Frontier, calling for deliberately slower capability gains and outside evaluators embedded inside labs, continues to reshape industry posture this week. OpenAI's Sam Altman, Google DeepMind's Demis Hassabis and Microsoft's Satya Nadella have all publicly endorsed giving third-party testers employee-level access to their systems, while Mark Zuckerberg has conspicuously declined to join. Critics, including tech-policy commentators, argue the self-policing scheme mainly entrenches Anthropic's position just as it eyes a roughly $2 trillion IPO valuation and a possible October roadshow. The dispute is unfolding alongside warnings from U.S. executives that cheap, open-weight Chinese models are narrowing the capability gap, adding a competitive edge to the safety debate.","source":"Tech Policy Press","url":"https://www.techpolicy.press/who-should-pace-the-frontier-not-dario-amodei/"}],"cyberEmerging":[{"headline":"US and Allies Expose North Korean Fake-Recruiter Campaign That Hit 30,000 Devices","body":"A joint advisory from cybersecurity authorities in the United States, Japan, Australia and Germany this week identified a North Korean hacking cluster tracked as WaterPlum, also called Contagious Interview, that infected at least 30,000 devices across more than 100 countries between December 2025 and July 2026. The group lures software developers with fake recruiter job offers, then tricks them into running malicious code during sham technical interviews. The disclosure underscores how Pyongyang is industrializing social-engineering attacks against the global tech workforce to fund weapons programs and steal cryptocurrency. It follows a related campaign in which Rust developers were separately targeted with fake job calls carrying malicious commands.","source":"DuoCircle","url":"https://www.duocircle.com/blog/cybersecurity-news-update-week-38-of-2026"},{"headline":"Suspected Iranian Cyberattacks Hit Third Tanker as Hackers Probe US Navy Systems With AI","body":"A third oil tanker reported a suspected cyberattack this week that knocked its systems offline, with crew members describing attackers briefly seizing control of shipboard functions, extending a string of incidents U.S. investigators are linking to Iran. American authorities are now monitoring nearly 20 vessels worldwide following the suspected intrusions. Separately, researchers report Iran-linked hackers have been using Anthropic's Claude model to probe U.S. Navy and commercial shipboard systems, suggesting generative AI is lowering the technical barrier for state-linked reconnaissance against maritime targets. The overlapping incidents are heightening U.S. concern about AI-enabled threats to critical transportation and defense-adjacent infrastructure.","source":"Cybernews","url":"https://cybernews.com/news/"}]},"cities":{"lasVegas":[{"headline":"Las Vegas Tears Out Turf at 17 City Parks to Save 82 Million Gallons a Year","body":"The City of Las Vegas is stripping non-functional grass from parking-lot islands and unused areas at 17 parks, including Cragin, Lorenzi, Bruce Trent and Veterans Memorial, under a Southern Nevada Water Authority rebate program worth up to $4 million. Officials say the work will save roughly 82 million gallons annually as Lake Mead levels stay depressed, but some residents at recent hearings pushed back, arguing the change will make parks hotter and less usable. Councilwoman Olivia Diaz told constituents the city is trying to balance Colorado River conservation with preserving grass that communities actually use.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/environment/las-vegas-parks-rip-out-grass-sparking-heated-debate-over-water-heat-3889204/"},{"headline":"Harry Reid Airport Adds Expedited TSA Lanes for Military Travelers","body":"Active-duty service members and veterans flying out of Harry Reid International Airport now have access to dedicated, faster-moving TSA security lanes, a change rolled out this week to ease congestion for the region's large military and veteran population. The move comes as Las Vegas's tourism-heavy airport continues to see record passenger volumes alongside steady traffic tied to Nellis and Creech Air Force Bases.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Amazon Joins $100 Million Corporate Push for Colorado River Conservation","body":"A newly formed coalition of major corporations has pledged $100 million toward Colorado River conservation projects, with Amazon alone committing $20 million of that total. The funding push comes as Southern Nevada Water Authority officials continue to warn that the region's primary water source remains historically strained, adding urgency to local efforts like the city's park turf-removal program.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Nellis-Born Drone Unit Preps Autonomous Fighters for December Combat Debut","body":"General Atomics' FQ-42A Vengeance and Anduril's FQ-44A Fury Collaborative Combat Aircraft are now flying integrated missions alongside crewed fighters, with both drones set to make their first appearance in a large-force employment exercise this December. The testing is being driven by the Experimental Operations Unit, a squadron established at Nellis Air Force Base, which put the two CCA types through an Agile Combat Employment exercise at nearby Creech Air Force Base in July that included launch, refueling and weapons-loading drills. The push is part of the Air Force's broader plan to field a fleet of more than 1,000 semi-autonomous combat drones, with Nellis and Creech serving as the proving ground for how they'll operate alongside manned squadrons.","source":"The War Zone (TWZ)","url":"https://www.twz.com/air/general-atomics-fq-42a-vengeance-cca-now-flying-together-with-usaf-fighters"}]},"feelGood":[{"headline":"ASPCA Delivers Emergency Relief to Flood-Battered Families in Indiana and West Virginia","body":"After severe flooding devastated communities in Indiana and West Virginia, ASPCA emergency responders moved in with supplies and hands-on support for overwhelmed local shelters and displaced families struggling to care for their pets. The effort is part of the organization's long-running disaster-response mission, which it marked this year during its 160th anniversary of championing animal welfare nationwide.","source":"ASPCA","url":"https://www.aspca.org/"},{"headline":"Charity Rushes Emergency Supplies to Jamaica After Hurricane Melissa","body":"Greater Good Charities deployed a response team to Jamaica after Hurricane Melissa tore through the island, delivering emergency aid to displaced residents and stranded animals in the storm's immediate aftermath. The group says it is continuing to raise funds for longer-term recovery as communities work to rebuild.","source":"Greater Good Charities","url":"https://greatergood.org/blog/all"},{"headline":"Aid Groups Keep Medical Lifelines Open for Ukrainian Hospitals","body":"Greater Good Charities, working with the Ukrainian relief group Razom, delivered another round of critical medical supplies to hospitals and frontline healthcare workers across Ukraine. The shipment is part of a sustained humanitarian effort to keep clinics stocked and patients cared for as the war grinds into its fourth year, a quiet but steady example of civilian generosity amid an ongoing crisis.","source":"Greater Good Charities","url":"https://greatergood.org/blog/all"}],"onThisDay":[{"year":"1862","event":"US President Abraham Lincoln issued the preliminary Emancipation Proclamation, declaring slaves in Confederate territory to be freed."},{"year":"1980","event":"Iraq launched a full-scale invasion of Iran, marking the start of the Iran-Iraq War."},{"year":"1975","event":"Sara Jane Moore attempted to assassinate US President Gerald Ford outside a hotel in San Francisco."},{"year":"1955","event":"Independent Television (ITV) launched in the United Kingdom, ending the BBC's broadcasting monopoly."}]},"topPicks":[{"headline":"Xi Jinping heads to Washington for first visit in a decade as Trump summit looms","teaser":"A high-stakes US-China summit could reshape trade, tech and security ties for years to come."},{"headline":"China Coast Guard Rams Philippine Fisheries Vessel Off Palawan","teaser":"An escalating South China Sea confrontation risks drawing in US treaty allies and regional partners."},{"headline":"Massive Weekend Drone Barrage Marks One of War's Largest Air Exchanges","teaser":"A record-scale drone exchange signals an intensifying, more dangerous phase of the Russia-Ukraine war."}]},"navDates":[{"key":"2026-09-22","label":"Sep 22","href":"/","isNewest":true},{"key":"2026-09-21","label":"Sep 21","href":"/archive/2026-09-21.html","isNewest":false},{"key":"2026-09-20","label":"Sep 20","href":"/archive/2026-09-20.html","isNewest":false},{"key":"2026-09-19","label":"Sep 19","href":"/archive/2026-09-19.html","isNewest":false},{"key":"2026-09-18","label":"Sep 18","href":"/archive/2026-09-18.html","isNewest":false},{"key":"2026-09-17","label":"Sep 17","href":"/archive/2026-09-17.html","isNewest":false},{"key":"2026-09-16","label":"Sep 16","href":"/archive/2026-09-16.html","isNewest":false}],"currentKey":"2026-09-22","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
