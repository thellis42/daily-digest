<script>
const STATE = {"digest":{"date":"Saturday, September 26, 2026","generatedAt":"Sat, Sep 26, 6:54 AM PDT","breaking":{"headline":"Iran Floats Seven-Day Plan to Reopen Strait of Hormuz and End War With US","body":"Iranian Foreign Minister Abbas Araghchi said Tehran's mediators have handed the White House a new proposal that would reopen the Strait of Hormuz and restart talks within seven days if certain conditions are met. The offer builds on the memorandum of understanding Iran and the US signed in June and comes nearly seven months into the conflict the Pentagon calls Operation Epic Fury, which began February 28, 2026. A reopening of Hormuz, through which roughly a fifth of global oil transits, would be the clearest sign yet that both sides are looking for an off-ramp after months of strikes and reported US munitions shortfalls.","source":"Financial Times via Just Security","url":"https://www.justsecurity.org/158876/early-edition-september-25-2026/"},"tabs":{"defense":{"defense":[{"headline":"Pentagon Launches 'FAST' Office to Root Out Duplicate Programs","body":"Defense Secretary Pete Hegseth's office announced Friday it is standing up the Force Agility and Streamlining Team, a new organization tasked with finding wasteful spending, redundant administrative systems and overlapping programs across the department. The unit will report to Pentagon Chief Financial Officer Jules Hurst and marks the latest step in Hegseth's broader push to reshape Pentagon bureaucracy. It follows earlier moves this year including a new battlefield-style evaluation for officers up for general or admiral.","source":"Washington Times","url":"https://www.washingtontimes.com/news/2026/sep/25/pentagon-creates-new-office-reduce-duplicate-programs-wasteful/"},{"headline":"US Broadens Counter-Drone Posture to Shield Critical Infrastructure","body":"The Pentagon is shifting its counter-drone strategy beyond simply shooting down incoming threats toward protecting power plants, pipelines and other critical infrastructure from cheap drone attacks. The new posture emphasizes layered defenses, faster response coordination and resilience measures designed to limit damage when an attack gets through interceptors. The move reflects growing recognition that no system can guarantee detection and neutralization of every hostile drone.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/u-s-expands-counter-drone-defense-to-protect-critical-infrastructure-from-low-cost-drone-attacks"},{"headline":"EU Rearmament Pace Falling Short of 2030 Russia-Deterrence Goal","body":"A new European Defense Agency assessment concludes the bloc is not rearming quickly or effectively enough to meet its own target of being ready to defend against Russia by 2030. The findings add pressure on NATO's European members, who have pledged sharp increases in defense spending but continue to struggle with fragmented procurement and slow production timelines. The report lands as alliance planners weigh how quickly industrial capacity can be scaled to match the threat timeline Brussels itself has set.","source":"European Defense Agency via Just Security","url":"https://www.justsecurity.org/158876/early-edition-september-25-2026/"}],"acquisitions":[{"headline":"Lockheed Wins $1.2 Billion Deal for Ship-Killing Army Missile","body":"The Army awarded Lockheed Martin a $1.2 billion contract on September 14 tied to the Precision Strike Missile Increment 2 Early Operational Capability program, an effort to field a missile capable of hitting moving ships at long range. The award reflects the Army's push to field maritime-strike options amid growing concern over munitions stockpiles after months of the Iran conflict. Details on delivery timelines were not disclosed in the Pentagon's contract notice.","source":"Yahoo News / Breaking Defense","url":"https://www.yahoo.com/news/politics/articles/2-massive-pentagon-contracts-totaling-170656404.html"},{"headline":"$4.3 Billion Global Logistics Deal Will Arm Allies Through Foreign Military Sales","body":"Montana-based S&K Aerospace secured a $4.3 billion Pentagon contract to provide military hardware parts, logistics support and repair services to more than 100 partner nations through Air Force, Army and Navy foreign military sales channels. Work will be based out of Warner Robins, Georgia, with the contract period extending all the way to September 2039. The long-duration award underscores how heavily Washington now leans on FMS pipelines to sustain allied militaries' equipment readiness.","source":"Yahoo News","url":"https://www.yahoo.com/news/politics/articles/2-massive-pentagon-contracts-totaling-170656404.html"}]},"us":[{"headline":"Supreme Court Revives Contested SAVE Database for Voter Citizenship Checks","body":"In an unsigned order issued Friday, the Supreme Court let states resume using the Trump administration's expanded SAVE database to screen voter rolls for noncitizens, pausing a lower court's June ruling while the case continues on appeal. Critics note the system has previously misidentified U.S. citizens as ineligible and that a district court found the expanded version violated federal privacy statutes. Legal analysts caution the practical effect on the November midterms will likely be limited since the underlying legal fight over the database's legality is still unresolved.","source":"NPR / Votebeat","url":"https://www.npr.org/2026/09/25/nx-s1-5976804/supreme-court-trump-save-noncitizen-voting"},{"headline":"Judge Orders White House to Restore Press Credentials for CNN, MSNOW and Politico","body":"A federal judge ruled Friday that the Trump administration must restore White House press access for CNN, MSNOW and Politico reporters after weeks of exclusion, and journalists from the outlets returned to cover the grounds. The Justice Department had defended the ban by arguing the outlets' coverage of a range of issues threatened national security and spread misinformation. The episode marks one of the more direct clashes yet between the administration and the press corps over access ahead of the midterms.","source":"NPR","url":"https://www.npr.org/sections/politics/"},{"headline":"DOJ Asks Supreme Court to Revive Third-Country Deportation Policy After Appeals Loss","body":"The Trump administration is asking the Supreme Court to intervene after the First Circuit Court of Appeals rejected its attempt to keep sending deportees to third countries not their own, a practice central to its rapid-removal immigration strategy. A separate Government Accountability Office report this week found the administration had spent tens of millions of dollars in a rushed effort to expand detention capacity. The emergency appeal sets up another high-stakes immigration showdown at the high court just weeks before the midterms.","source":"PoliticsBar / GovExec reporting","url":"https://www.thepoliticsbar.com/p/news-on-tap-friday-sept-25-2026"},{"headline":"Consumer Sentiment Sinks to Four-Month Low as Inflation Expectations Jump","body":"The University of Michigan's final September consumer sentiment index fell to 48.1, its lowest reading in four months and down roughly 15% since January, while year-ahead inflation expectations jumped from 4.0% to 4.6%, the highest since June. The data lands as investors await the October 2 jobs report and a key inflation gauge that will shape expectations for the Federal Reserve's next move, with the fed funds rate currently held at 3.5%-3.75%. Equal-weight S&P 500 performance has lagged the headline index by several points this month, signaling broader weakness beneath record-adjacent market highs.","source":"Reuters / Economic Weekly","url":"https://www.aol.com/articles/jobs-report-inflation-data-test-100645000.html"}],"pacific":{"pacificCommand":[{"headline":"South Korea's KF-21 Boramae Completes Maiden Flight for Air Force","body":"Korea Aerospace Industries' homegrown KF-21 'Young Hawk' fighter flew its first sortie in Republic of Korea Air Force colors this week, a milestone in Seoul's push for an indigenous 4.5-generation fighter fleet. The program is central to South Korea's effort to reduce reliance on US airframes while building an export base to compete with Chinese and Russian jets in the region. Continued flight testing will determine how quickly ROKAF can begin fielding production units alongside its F-35A squadrons.","source":"Asian Defence Journal","url":"https://adj.com.my/"},{"headline":"Tokyo Keeps Nuclear-Powered Submarines on the Table for Defense Overhaul","body":"Japanese Defense Minister Shinjiro Koizumi has reaffirmed that nuclear propulsion remains an option as Tokyo revises its three core strategic defense documents by year-end, a shift he tied directly to Seoul's own pursuit of nuclear submarines after President Trump's approval last November. A 2025 Ministry of Defense panel had already urged study of next-generation propulsion for future submarines carrying vertical-launch long-range missiles, aiming to outclass the diesel-electric Taigei class's endurance and range. The debate reflects mounting unease in Tokyo over intensifying Chinese and Russian naval activity across the Western Pacific.","source":"Naval News / Army Recognition","url":"https://www.armyrecognition.com/news/navy-news/2026/japan-considers-nuclear-powered-submarines-as-china-and-russia-increase-pacific-naval-pressure"},{"headline":"India's Defense Minister Touts 'Power of Argument and Argument of Power' at DEFCON 2026","body":"Speaking at the News18 DEFCON 2026 summit in New Delhi, India's defense minister argued that recent operations including cross-border strikes, the Balakot airstrike, and Operation Sindoor prove India's willingness and capability to respond forcefully to threats against its sovereignty. He framed this alongside continued diplomatic outreach, underscoring New Delhi's dual-track approach of deterrence and dialogue as it modernizes its forces. The remarks come as India diversifies its arms suppliers, cutting dependence on Russian systems in favor of deeper defense-industrial ties with South Korea, France, and the United States.","source":"Indian Defence News","url":"https://www.indiandefensenews.in/"}],"pacingThreat":[{"headline":"Xi Purges Two More Top Generals, Deepening PLA Command Turmoil","body":"China's official military media confirmed that Zhang Youxia, a vice chairman of the Central Military Commission, and Liu Zhenli, chief of the PLA's Joint Staff Department, have been expelled from the Communist Party and military over what Beijing called serious discipline and law violations. Their removal extends Xi Jinping's sweeping anti-corruption purge of senior PLA leadership, which analysts say has hollowed out parts of the chain of command even as modernization programs continue largely unaffected. The ouster of two officers at this level marks one of the most significant shake-ups of China's military hierarchy in years and will fuel questions abroad about internal cohesion within the PLA's top ranks.","source":"China Military Online","url":"http://eng.chinamil.com.cn/"},{"headline":"China Coast Guard and PLAN Ships Block Philippine Resupply Run to Second Thomas Shoal","body":"Manila said Chinese coast guard and navy vessels interfered with a routine rotation-and-resupply mission to its Second Thomas Shoal outpost on Thursday, September 24, marking what could be the first hostile encounter there in roughly two years. The Philippine task force overseeing the mission publicly denounced the interference, reviving tensions that had cooled since the 2024 provisional arrangement over the grounded BRP Sierra Madre. The incident follows a string of recent frictions, including a Chinese vessel ramming a Philippine government ship near Palawan earlier this month.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-09-25/philippines-says-china-hindered-mission-to-disputed-sea-outpost"},{"headline":"Taiwan Indictment and COSCO Ship Data-Collection Point to Widening PRC Espionage Push","body":"Taiwanese prosecutors indicted a Ministry of Health and Welfare researcher, identified only by her surname Lin, on August 31 for allegedly passing sensitive information to a PRC handler who recruited her in May 2025 in exchange for payment. Separately, unnamed US officials say Beijing is leveraging its state-owned COSCO shipping conglomerate's global network of vessels and ports to gather maritime data with potential military value. Analysts at the ISW-AEI Coalition Defense of Taiwan project assess both efforts as part of a broader PRC campaign combining espionage and cognitive warfare to erode Taiwanese confidence in their government and military ahead of any future contingency.","source":"American Enterprise Institute / ISW","url":"https://www.aei.org/commentary/china-taiwan-update-september-4-2026/"}]},"europe":{"ukraineRussia":[{"headline":"Trump Greenlights Ukrainian Patriot Production as Russian Strikes Kill Seven in Kyiv","body":"President Zelensky announced on September 25 that Washington has given final approval for Ukraine to license-produce Patriot interceptor missiles domestically, a move meant to ease chronic air-defense shortages. The announcement came hours after Russian missiles and drones killed seven people, including a 14-year-old boy, and wounded 59 in Kyiv, with Mayor Vitali Klitschko confirming 25 hospitalizations. Moscow is also increasingly targeting Ukrainian data centers and telecom nodes, part of a widening strike campaign meant to strain the economy and digital services ahead of winter.","source":"RBC-Ukraine","url":"https://newsukraine.rbc.ua/war-in-ukraine"},{"headline":"Kyiv Presses Lyman Offensive While Hitting Russian Refineries and Missile Plants","body":"Ukrainian troops kept up an offensive push in the Lyman sector of Donetsk region on September 25, with Zelensky saying follow-on objectives will be set once the operation wraps up. Overnight strikes set two Russian oil refineries in Perm and Novoshakhtinsk ablaze and hit missile-fuel and guided-weapons plants in Tula, Voronezh, and Ulyanovsk, part of Kyiv's deep-strike campaign against Moscow's defense industry. Ukraine's General Staff also put cumulative Russian personnel losses since February 2022 at roughly 1.53 million, including 1,590 in the preceding 24 hours, even as Russian forces keep probing in Sumy and Kharkiv oblasts.","source":"Ukrinform","url":"https://www.ukrinform.net/rubric-ato"}],"europe":[{"headline":"NATO Closes Out Largest-Ever Uncrewed Naval Drill, Rutte Reaffirms Baltic Vigilance","body":"NATO wrapped up REPMUS/Dynamic Messenger off Portugal's coast on September 25, its biggest-ever maritime uncrewed-systems experiment, drawing more than 1,500 participants from 36 navies, while Romania ran a parallel nationwide joint exercise, Burebista 26, through the same period. Secretary General Mark Rutte used a September 23-24 trip to the UN General Assembly in New York to reaffirm alliance backing for Ukraine and heightened vigilance across the Baltic following a string of suspected Russian drone incursions. The drills reflect NATO's accelerating pivot toward unmanned systems and Nordic-Baltic deterrence as members race to hit new defense-spending targets.","source":"NATO","url":"https://www.nato.int/en"},{"headline":"Mystery Drone Wave Keeps Grounding Flights Across Europe","body":"A monthlong surge of unexplained drone incursions has closed or disrupted more than a dozen European airports, with Munich the latest casualty this week after a sighting grounded 17 flights and diverted 15 more. Germany, Denmark, Norway, Romania, the Netherlands, Poland and Spain have all reported incidents, and German officials have publicly blamed Russia for an August drone found carrying military-grade explosives at Leipzig airport. Romania has separately downed explosive-laden drones near its Neptun Deep gas project and the port of Constanta, prompting Danish Prime Minister Mette Frederiksen to brand the pattern a coordinated 'hybrid attack' and identify Russia as the continent's top security threat, a charge Moscow denies.","source":"Yahoo News (Euronews)","url":"https://www.yahoo.com/news/articles/drone-incursions-rise-european-airports-120000280.html"}]},"middleEast":[{"headline":"Saudi Arabia Downs Houthi Missiles as Yemen's Displacement Crisis Deepens","body":"Saudi air defenses intercepted six ballistic missiles fired by Yemen's Houthi movement toward Taif province and the Red Sea city of Yanbu on September 25, Riyadh said, the latest escalation tied to the broader Bab al-Mandab strait crisis triggered by Houthi actions this month. The barrage lands as the United Nations warns that internal displacement inside Yemen has hit its highest level since a 2022 truce, with roughly 70,000 children forced from their homes. The dual crises underscore how the wider Iran war has destabilized the Arabian Peninsula's southern flank even as attention shifts to Hormuz.","source":"Jerusalem Post / Arab News","url":"http://www.jpost.com/middle-east"},{"headline":"Lavrov and Araghchi Push Diplomacy as Israel Warns of More Nuclear Strikes on Iran","body":"Russian Foreign Minister Sergey Lavrov met Iranian counterpart Abbas Araghchi on the sidelines of the UN General Assembly on September 25, with both sides calling for a diplomatic settlement in the aftermath of the recent US-Israel war with Tehran. Iranian President Masoud Pezeshkian reiterated that ultimate authority over policy still rests with Supreme Leader Khamenei even as domestic unrest continues. Separately, an unnamed Israeli official said Israel would strike Iranian nuclear sites again, with or without US involvement, should Tehran cross any red lines.","source":"Jerusalem Post","url":"http://www.jpost.com/middle-east"},{"headline":"Pakistan, Saudi and Turkish Military Chiefs Expand Mecca Defense Pact Talks","body":"","source":"","url":""}],"techAI":{"aiCompetition":[{"headline":"DeepSeek's Revenue Doubles to $1B Run Rate as It Preps $7.5B Raise, Shanghai IPO","body":"DeepSeek's annualized revenue run rate has doubled to roughly $1 billion, up from under $500 million just months earlier, after CEO Liang Wenfeng pushed through API price hikes of 2.3 to 4.5 times without losing customers, according to reporting from The Information. The Hangzhou lab is finalizing a roughly $7.5 billion Series B at a $75 billion valuation, with CITIC Securities tapped to lead a planned 2027 listing on Shanghai's STAR Market. The figures - including an 83 percent API gross margin - highlight how China's leading AI challenger is converting cut-rate pricing into a durable, high-margin business even as Beijing's cyberspace regulator separately probes DeepSeek and rival Moonshot over data-routing practices.","source":"PYMNTS","url":"https://www.pymnts.com/news/artificial-intelligence/2026/deepseek-doubles-annual-revenue-run-rate-to-1-billion-ahead-of-ipo/"},{"headline":"OpenAI, Google DeepMind and Anthropic Quietly Build Their Own Frontier-AI 'Standards Body'","body":"Just days after publicly asking the UN Security Council for international AI standards, the three largest US frontier labs are reportedly negotiating a private, FINRA-style self-regulatory group - tentatively named the Frontier AI Standards Agency - that could launch by late 2026 or early 2027, per The Information. The plan would have labs voluntarily submit models for shared technical evaluations and pre-release audits, an idea Google DeepMind's Demis Hassabis had floated months earlier. Some AI-safety experts have already criticized the approach as allowing the companies to police themselves, setting up friction with parallel proposals in Congress for a government-run AI regulator.","source":"Political Wire","url":"https://politicalwire.com/2026/09/24/nsa-paying-billions-to-test-ai-models/"}],"cyberEmerging":[{"headline":"Sanders and Casar Unveil Bill to Ban 'Artificial Superintelligence,' Create Cabinet-Level AI Department","body":"Sen. Bernie Sanders and Rep. Greg Casar introduced the Ban Artificial Superintelligence Act on September 23, seeking to outlaw AI systems that exceed human cognitive performance across most domains and to pause frontier development until a new federal regulator establishes safety rules. The bill would stand up a Cabinet-level Department of Artificial Intelligence led by a Secretary of AI, with violators facing what sponsors call a corporate death penalty plus up to 20 years in prison - a punishment Sanders likened to penalties for illegal nuclear-weapons development. It also directs Washington to pursue international agreements and export controls aimed at stopping superintelligent systems from being built anywhere, though the measure faces long odds in the Republican-controlled Congress.","source":"NBC News","url":"https://www.nbcnews.com/politics/congress/bernie-sanders-greg-casar-propose-ai-superintelligence-ban-20-year-jai-rcna599460"},{"headline":"NSA Quietly Spending 'Billions' This Year to Stress-Test Frontier AI Models","body":"The Washington Sun reported on September 24 that the NSA's Artificial Intelligence Security Center is spending billions of taxpayer dollars this year probing frontier AI systems for national-security vulnerabilities, a figure described as far larger than previously disclosed and based on classified budget estimates shared with lawmakers. The disclosure lands just as OpenAI, Google DeepMind and Anthropic float their own privately run safety-standards body, fueling arguments from some lawmakers that AI developers - not taxpayers - should help underwrite independent testing as evaluation costs keep scaling. The Pentagon has declined to confirm the numbers or detail the program's scope, leaving oversight and accountability questions unresolved.","source":"The Washington Sun","url":"https://www.washingtonsun.com/technology/classified-estimates-nsa-paying-billions-to-test-ai-models"}]},"cities":{"lasVegas":[{"headline":"Lombardo Moves to Shield Clark County Teaching Jobs from Budget Crunch","body":"Governor Joe Lombardo endorsed an emergency regulation aimed at heading off midyear cuts within the Clark County School District, a step intended to protect teaching positions as the district grapples with a shortfall. The move comes as the district's budget pressures collide with falling enrollment, with parents and teachers this week voicing frustration at a board meeting over a $51 million cut and related staff surplusing. The regulatory fix is being framed as a stopgap rather than a permanent solution to the district's finances.","source":"Las Vegas Review-Journal / FOX5 Vegas","url":"https://www.reviewjournal.com/"},{"headline":"Pahrump Data Center Fight Heads to Court Over Water Concerns","body":"A developer behind a proposed data center in Pahrump is asking a judge to strike down Nye County's ban on the project, arguing the prohibition unfairly tramples property rights amid the county's escalating worries about strained groundwater supplies. The case highlights a growing statewide tension as rural Nevada communities push back against energy- and water-hungry data center development. Similar friction has surfaced in the Las Vegas Valley, where a separate hyperscale data center and gas plant proposal on BLM land near Henderson has also drawn local resistance.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Southern Nevada's Heat Death Toll Climbs Sharply in New Count","body":"The Clark County coroner's office has sharply revised upward its tally of deaths attributed to extreme heat this year, underscoring how dangerous the valley's summer temperatures have become even as the season winds down. Officials cautioned the count remains preliminary and is likely to keep climbing as additional cases are reviewed. The rising toll adds urgency to ongoing debates in Carson City and Clark County over cooling-center funding and heat-safety protections for outdoor workers.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/"}],"nellis":[{"headline":"Nellis Salutes Final A-10 Warthog After Nearly 50 Years","body":"The last operational A-10 Thunderbolt II assigned to Nellis Air Force Base departed for good on September 22, closing out almost five decades of Warthog testing, tactics development and pilot training at the base. Roughly 70 airmen lined the flight line for a farewell salute, with Brig. Gen. Scott C. Mills and 66th Weapons Squadron commander Lt. Col. Ridge Flick presiding over the sendoff of the jet, tail number 82-0658, which first arrived at Nellis in 1977. Since then the Air Force Weapons School's 66th Weapons Squadron trained more than 300 A-10 weapons officers across some 100 classes, and maintainers from the 757th Aircraft Maintenance Squadron are now being reassigned to F-35 and F-16 units as close-air-support duties shift to fifth-generation aircraft. Nellis becomes the second major base this month to inactivate its A-10 fleet, following Davis-Monthan's September 18 ceremony, leaving only Moody AFB in Georgia with active-duty Warthogs and Whiteman AFB in Missouri with a reserve squadron.","source":"Military Times / The Aviationist","url":"https://www.militarytimes.com/news/your-military/2026/09/24/nellis-air-force-base-says-goodbye-to-last-a-10-thunderbolt-ii/"}]},"feelGood":[{"headline":"Seven Teens Turn Highway Emergency Into Roadside Rescue","body":"A group of seven high school students in Massachusetts stopped their own trip to help a stranded woman whose car had broken down in the middle of a busy highway, turning a potentially dangerous moment into an act of everyday heroism. Their quick decision to pull over and assist drew wide attention as a reminder that strangers still look out for one another on the road. The story has circulated as one of the week's most-shared good-news items nationally.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Stranger's Kindness Sparks Outpouring for 81-Year-Old Caregiver","body":"An 81-year-old man who has been working grueling 14-hour days delivering lost airline luggage to help cover his wife's cancer treatment costs was noticed by a stranger while struggling with a heavy suitcase. That single moment of concern snowballed into a nationwide wave of financial support and goodwill for the couple. The story underscores how one person's small gesture can unlock much larger community generosity.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Senior Dog Flags Down Deputy to Save Fallen Owner","body":"In Washington state, an 84-year-old man fell and injured his leg outside his home, unable to move or call for help, until his aging dog Gita ran to the roadside and stood in the traffic lane to flag down a passing patrol car. Sheriff's Deputy Wright stopped, could not coax the dog into his vehicle, and instead followed her lead to locate the injured man and get him medical attention. The rescue is being celebrated as proof of the bond between people and their pets in moments of crisis.","source":"WDIY / When Good Things Happen","url":"https://www.wdiy.org/show/when-good-things-happen/2026-09-25/a-helping-hand-3-amazing-rescues-when-good-things-happen"}],"onThisDay":[{"year":"1960","event":"John F. Kennedy and Richard Nixon faced off in the first-ever televised US presidential debate."},{"year":"1983","event":"Soviet officer Stanislav Petrov averted potential nuclear war by correctly identifying a false missile-attack warning."},{"year":"1789","event":"Thomas Jefferson was appointed the first US Secretary of State by President George Washington."},{"year":"1687","event":"The Parthenon in Athens was severely damaged when Venetian forces bombarded the Ottoman-held Acropolis."}]},"topPicks":[{"headline":"Iran Floats Seven-Day Plan to Reopen Strait of Hormuz and End War With US","teaser":"A potential breakthrough could de-escalate a major Gulf conflict and stabilize global oil shipping lanes."},{"headline":"Xi Purges Two More Top Generals, Deepening PLA Command Turmoil","teaser":"Escalating military purges signal deep instability at the top of China's armed forces command structure."},{"headline":"Trump Greenlights Ukrainian Patriot Production as Russian Strikes Kill Seven in Kyiv","teaser":"Expanded US-backed air defense production comes as deadly Russian strikes continue battering Ukraine's capital."}]},"navDates":[{"key":"2026-09-26","label":"Sep 26","href":"/","isNewest":true},{"key":"2026-09-25","label":"Sep 25","href":"/archive/2026-09-25.html","isNewest":false},{"key":"2026-09-24","label":"Sep 24","href":"/archive/2026-09-24.html","isNewest":false},{"key":"2026-09-23","label":"Sep 23","href":"/archive/2026-09-23.html","isNewest":false},{"key":"2026-09-22","label":"Sep 22","href":"/archive/2026-09-22.html","isNewest":false},{"key":"2026-09-21","label":"Sep 21","href":"/archive/2026-09-21.html","isNewest":false},{"key":"2026-09-20","label":"Sep 20","href":"/archive/2026-09-20.html","isNewest":false}],"currentKey":"2026-09-26","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
