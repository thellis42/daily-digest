<script>
const STATE = {"digest":{"date":"Friday, August 14, 2026","generatedAt":"Fri, Aug 14, 5:56 AM PDT","breaking":{"headline":"Hegseth floats joint strikes on Colombian armed groups as counter-cartel coalition expands","body":"At a summit of the US-led counter-narcotics coalition in Panama on August 12, Defense Secretary Pete Hegseth told allied officials the goal is to 'degrade, dismantle, and destroy' narco-terrorist networks, and raised the possibility of joint military strikes against armed groups inside Colombia. Hegseth simultaneously announced Colombia's formal entry into the coalition, a notable shift given recent friction between Washington and Bogota over drug policy. The remarks mark one of the most explicit signals yet that the administration is weighing direct use of force against cartel-linked groups on Colombian soil, raising sovereignty and escalation concerns across Latin America.","source":"Just Security / New York Times","url":"https://www.justsecurity.org/153621/early-edition-august-13-2026/"},"tabs":{"defense":{"defense":[{"headline":"Army designates first air-defense unit for Golden Dome homeland missile shield","body":"Lt. Gen. John Rafferty, commander of Army Space and Missile Defense Command, confirmed on August 13 that the Army has selected its first air-defense unit to support the Golden Dome missile defense mission, though the unit's identity, home station, and whether it will be active-duty or National Guard remain undisclosed. Officials indicate the formation will require persistent crews and fixed or semi-fixed infrastructure geared toward homeland defense, a departure from the expeditionary posture of most Patriot battalions. The announcement came on the closing day of the Space and Missile Defense Symposium in Huntsville, Alabama, where Golden Dome program lead Gen. Mike Guetlein and Missile Defense Agency Director Lt. Gen. Heath Collins also spoke.","source":"Army Recognition / Breaking Defense","url":"https://www.armyrecognition.com/news/army-news/2026/u-s-army-assigns-first-air-defense-unit-to-golden-dome-missile-defense-mission"},{"headline":"Pentagon drafts revised nuclear strategy emphasizing tactical weapons","body":"The Department of Defense is circulating a draft nuclear posture update that would place new emphasis on shorter-range, lower-yield tactical nuclear weapons for potential use in regional conflicts against Russia or China, rather than relying solely on strategic-level deterrence. The shift reflects growing Pentagon concern that adversaries could exploit gaps below the strategic nuclear threshold in a Taiwan or European contingency. The draft has not been finalized, but its emergence signals a notable doctrinal recalibration under the current administration.","source":"The Defense Post","url":"https://thedefensepost.com/"},{"headline":"Japan test-fires Tomahawk from destroyer as Tokyo hardens posture, drawing Putin rebuke","body":"Japan test-fired a Tomahawk cruise missile from the destroyer Chokai in the Pacific on July 29, part of a broader defense buildup detailed in Japan's 2026 Defense White Paper under Prime Minister Sanae Takaichi. In apparent response, Russian President Vladimir Putin made his first-ever visit to the disputed Kuril Islands on August 13, touring Iturup and meeting Pacific Fleet commanders and border-security officials in a move analysts say is designed to undercut Tokyo's more assertive defense posture. The episode underscores how allied rearmament in the Indo-Pacific is now drawing direct pushback from Moscow as well as Beijing.","source":"Institute for the Study of War / Critical Threats","url":"https://www.criticalthreats.org/analysis/russian-offensive-campaign-assessment-august-13-2026"}],"acquisitions":[{"headline":"Pentagon steers another $244M to Palantir via no-bid deal, deepening sole-source trend","body":"The Defense Department has committed up to $243.9 million in no-bid funding to keep using Palantir's software through March 2027, following a July agreement that rolled the Army's existing Palantir contracts into a single 10-year, $10 billion deal. A memo from Deputy Defense Secretary Steve Feinberg directs DOD components to plan for even more Palantir spending between April 2027 and December 2028, citing efficiency gains in tracking munitions and vehicle production, without invoking the standard justifications required for sole-source awards. The award fits a broader pattern in federal contracting, where no-compete deals made up 14.8 percent of all awards in the first half of 2026, up from 12.6 percent a year earlier.","source":"Defense One","url":"https://www.defenseone.com/business/2026/08/pentagon-palantir-no-bid/415400/"},{"headline":"Boeing, Lockheed, BAE share $25.4B microelectronics support contract","body":"The Pentagon awarded Boeing, Lockheed Martin, and BAE Systems a combined $25.36 billion indefinite-delivery/indefinite-quantity contract under the Defense Microelectronics Activity to field emerging electronics technology and close capability gaps as older systems become obsolete. The multi-award vehicle, which drew 17 competing offers, runs a five-year base period with two option periods of three and two years. Individual task orders will determine specific funding and work locations as they are issued.","source":"MarketScreener / Dow Jones Newswires","url":"https://in.marketscreener.com/news/boeing-lockheed-bae-awarded-defense-microelectronics-activity-contracts-ce7e58dfdb8bf523"}]},"us":[{"headline":"Federal judge tosses Trump administration's antisemitism lawsuit against Harvard","body":"US District Judge Richard G. Stearns in Boston dismissed the Justice Department's Title VI suit against Harvard, ruling the government's evidence of ongoing discrimination was 'too isolated and episodic' to sustain the claim. The suit, filed in March, sought to claw back nearly $1 billion in federal grants and hinged mostly on incidents from the 2023-24 academic year rather than recent conduct. It's the latest legal setback for the administration's funding pressure campaign against elite universities, though DOJ's civil rights division says it is weighing an appeal.","source":"NPR / CNN","url":"https://www.npr.org/2026/08/13/g-s1-138665/trump-harvard-lawsuit-dismissed"},{"headline":"White House blames China for up to $26 billion 'transshipment scam'","body":"A 25-page White House report released August 13 by trade adviser Peter Navarro accuses China of routing goods through more than 40 third countries, including Vietnam, Mexico and Panama, to dodge US tariffs, costing the Treasury an estimated 19 to 26 billion dollars a year in lost revenue. The report pegs broader losses at up to 450,000 US jobs and 113-150 billion dollars in annual GDP, and touts a new AI-enabled 'Detective Border' screening system CBP plans to fully deploy by year's end. The findings land just as Trump prepares for high-stakes trade talks with Xi Jinping in Beijing.","source":"Fox News","url":"https://www.foxnews.com/politics/white-house-exposes-transshipment-scam-costing-us-26b-points-finger-china"},{"headline":"Former SPLC intelligence chief indicted amid DOJ crackdown on civil rights group","body":"Federal prosecutors indicted Heidi Beirich, former director of the Southern Poverty Law Center's intelligence project, on fraud charges tied to payments made to informants who infiltrated hate groups. The indictment, unveiled this week, escalates the Justice Department's broader case against SPLC. Beirich's attorney called the charges a politically motivated attempt to 'silence political opponents,' framing it as part of the administration's wider effort against organizations it views as adversarial.","source":"Washington Post (via State and Federal Communications)","url":"https://stateandfed.com/campaign-finance/news-you-can-use-digest-august-14-2026/"},{"headline":"Court of International Trade upholds presidential authority over de minimis rules","body":"The US Court of International Trade ruled this week that the president retains authority to set de minimis import thresholds and rates, and that foreign governments cannot dictate US customs policy on the low-value shipment exemption. The decision reinforces executive control over a customs mechanism the administration has used to squeeze low-cost imports, particularly from Chinese e-commerce platforms, following earlier suspension of de minimis treatment under IEEPA. It comes as trade friction simmers with Canada over threatened 50 percent tariffs tied to stalled USMCA renegotiation talks.","source":"The Conservative Treehouse","url":"https://theconservativetreehouse.com/blog/2026/08/14/august-14th-2026-presidential-politics-trump-administration-day-572/comment-page-1/"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Prepares Record Defense Budget as White Paper Fallout Continues","body":"Japan's Ministry of Defense is finalizing a record 8.9 trillion yen (about $56.1 billion) budget request for fiscal 2027, to be submitted by the end of August, building on the August 4 white paper that again labeled China Tokyo's 'greatest strategic challenge.' The request follows Japan already hitting its 2% of GDP defense-spending target and reflects a push to expand long-range strike systems, stockpiling, and drone warfare capabilities modeled on lessons from Ukraine. Analysts note the plan also leans on deeper ties between the Self-Defense Forces and Japan's tech and startup sectors to sustain wartime production capacity.","source":"Defense News","url":"https://www.defensenews.com/global/asia-pacific/2026/08/10/japans-2026-defense-white-paper-highlights-new-era-of-crisis-in-indo-pacific/"},{"headline":"AUKUS Submarine Rotational Force Advances at Australia's HMAS Stirling","body":"The United States has authorized navy support elements for the Submarine Rotational Force-West at HMAS Stirling near Perth, with the first rotational deployment of American nuclear-powered submarine crews now planned for 2027. The move is designed to accelerate Australian sailors' readiness to eventually crew their own boats, part of a package that includes Australia's planned acquisition of three Virginia-class submarines. The buildout comes as Canberra races to close a capability gap against a Chinese submarine force expanding its reach into the Indian Ocean.","source":"India Sentinels","url":"https://www.indiasentinels.com/world/in-a-direct-message-to-china-aukus-shifts-from-talks-to-drone-networks-nuclear-submarines-7421"},{"headline":"Manila's ASEAN Chairmanship Fails to Budge South China Sea Consensus","body":"Despite holding the ASEAN chairmanship in 2026 and drafting this year's communique, the Philippines could not push the bloc past the same watered-down South China Sea language used by Malaysia the previous year. The foreign ministers' meeting fell during the tenth anniversary of the 2016 arbitral tribunal ruling favoring Manila, yet that ruling remains conspicuously absent from ASEAN's consensus text. The outcome underscores how member states reliant on Beijing's trade and investment continue to blunt Philippine efforts to harden the bloc's position ahead of a long-stalled Code of Conduct.","source":"Asia Times","url":"https://asiatimes.com/2026/07/the-south-china-sea-consensus-no-asean-chair-can-move/"}],"pacingThreat":[{"headline":"PLA Stages Show-of-Force Drills Near Scarborough Shoal","body":"China's military conducted joint naval and air exercises near Scarborough Shoal, days after Beijing accused Manila of an 'illegal' bid to extend seabed rights off Palawan and map claims to the reef. The PLA Southern Theatre Command framed the drills as a necessary response to actions it said undermined regional stability. The episode fits a pattern cited by the Council on Foreign Relations of repeated flare-ups between Chinese and Philippine vessels at Scarborough and Second Thomas Shoals through July, which have already prompted joint U.S.-Philippine-Japan maritime drills.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3362628/pla-stages-south-china-sea-drills-days-after-illegal-philippine-territorial-bid"},{"headline":"State Media Confirms Hypersonic Missile Now Fielded on Workhorse Destroyer","body":"Chinese state broadcasters have released footage confirming a Type 052D destroyer firing the YJ-20 hypersonic anti-ship missile, a weapon that first appeared publicly at last year's V-Day military parade. Military analysts cited by Chinese outlets say the missile's integration onto the more numerous 052D-class ships, rather than just the larger Type 055 destroyers, meaningfully expands the PLA Navy's fleet-wide anti-ship strike reach. The disclosure adds to a string of open-source indicators this summer of accelerating PLA surface-fleet modernization in the Western Pacific.","source":"Global Times","url":"https://www.globaltimes.cn/china/military/index.html"},{"headline":"Taiwan Wraps Up Its Largest-Ever Han Kuang War Games","body":"Taiwan's live-fire Han Kuang exercises conclude today after a ten-day, nine-night run from August 5-14 designed to test the military's ability to sustain round-the-clock defense operations against a simulated Chinese invasion. This year's iteration, the largest to date, incorporated chemical-attack scenarios and command structures modeled more closely on U.S. practices, alongside brigade-level reserve mobilizations expected to draw roughly 5,000 reservists. Defense Minister Wellington Koo said this week that the island will keep training intensively to stay prepared, as experts note the drills' format signals deepening operational alignment with Washington.","source":"Al Jazeera / ABC News","url":"https://www.aljazeera.com/video/newsfeed/2026/8/10/taiwan-holds-military-drills-to-prepare-for-invasion-by-china"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine hits Russian refinery 810 miles from border as Kyiv warns of Patriot shortage","body":"Ukraine's General Staff confirmed a strike on a Gazprom oil refinery roughly 1,300 kilometers from the border, the facility's second hit since mid-July, underscoring Kyiv's expanding deep-strike campaign against Russian energy infrastructure. At the same time, President Zelensky renewed pleas for more Patriot interceptors as Ukraine's Air Force has stopped publicly disclosing missile interception numbers, a sign of mounting strain on air defenses. Separately, Ukraine's SBU says it dismantled a 14-person Russian spy ring gathering intelligence on airfields hosting Ukraine's F-16 and Mirage 2000 jets, pointing to intensified Russian efforts to target Western-supplied airpower.","source":"Kyiv Independent","url":"https://kyivindependent.com/"},{"headline":"Russian territorial gains accelerate as frontline fighting intensifies in Sumy and Donetsk","body":"New OSINT data shows Russian forces netted about 33 square miles of Ukrainian territory between July 14 and August 11, more than double the 15-square-mile gain recorded in the prior four-week period, even as ISW's separate analysis found a small net Ukrainian territorial recovery over the same span. On the ground, Russian units reportedly captured the village of Rohoznoye in Sumy region and advanced near several Kharkiv-region settlements, while Ukrainian forces claimed a counter-gain in southern Donetsk. Russian Foreign Minister Sergei Lavrov reiterated Moscow's refusal to accept any ceasefire, insisting the conflict will not be frozen.","source":"Russia Matters / Pravda EN","url":"https://www.russiamatters.org/news/russia-ukraine-war-report-card/russia-ukraine-war-report-card-aug-12-2026"}],"europe":[{"headline":"NATO council convenes over fresh airspace violations in Poland and Romania","body":"The North Atlantic Council met on August 12 to address a new round of airspace incursions affecting Poland and Romania along with related drone incidents, with member states voicing solidarity with the two allies. The session adds to a string of eastern-flank alerts this year and comes as NATO tracks over $139 billion in increased defense investment by European allies and Canada since the 2025 Hague pledge to reach 5% of GDP spending by 2035. The alliance is also running live counter-drone drills in Latvia this month involving roughly 650 troops from allied nations plus Ukraine, Australia and Japan.","source":"NATO","url":"https://www.nato.int/en"},{"headline":"Heatwave and drought trigger Europe-wide energy emergency, threatening 1% of GDP","body":"A brutal summer drought has forced Romania to begin disconnecting its sole nuclear reactor from the grid due to record-low Danube water levels, prompting a nationwide energy emergency and conservation appeals throughout August, while France and Hungary have also curtailed nuclear output over heat and low river flows. Benchmark European gas prices settled near €61 per megawatt-hour this week, roughly double last year's level, a spike analysts link both to the heat-driven demand surge and lingering supply disruption from the Iran war's effect on Gulf shipping. Financial firm Triodos estimates the combined heat and energy disruptions could cost the EU economy around €180 billion, or roughly 1% of GDP.","source":"CNN","url":"https://www.cnbc.com/2026/08/12/europe-heat-drought-nuclear-power.html"}]},"middleEast":[{"headline":"Iran claims control of Strait of Hormuz as US vows indefinite blockade","body":"Iran's Basij paramilitary chief declared the Strait of Hormuz to be under Tehran's 'control and management,' directly contradicting President Trump's earlier claims of US dominance over the waterway. Defense Secretary Pete Hegseth countered that the American blockade of Iranian ports can continue indefinitely, while US forces reported firing on a vessel in the Gulf of Oman this week to enforce the restrictions. The standoff continues to roil global energy markets and shipping routes months into the 2026 Iran war.","source":"Times of Israel / Al Jazeera","url":"https://www.timesofisrael.com/liveblog-august-13-2026/"},{"headline":"Israel intensifies targeted strikes on Hamas commanders in Gaza","body":"The IDF and Shin Bet said they killed Hamas commander Jamal Mahmoud Abu Kamil in a strike on Gaza City on August 13, part of a broader wave of operations that also killed a Hamas company commander in Khan Yunis and additional drone strikes elsewhere in the strip. The strikes come as fragile arrangements around Gaza's 'Yellow Line' persist, with Israeli troops shooting a Palestinian operative who approached forces after crossing the line. Separately, US officials including Jared Kushner are reportedly planning fresh mediation talks with Egyptian, Qatari and Turkish counterparts in Cairo next week.","source":"Haaretz","url":"https://www.haaretz.com/israel-news/israel-security/2026-08-13/ty-article-live/israels-military-says-it-targeted-a-hamas-commander-planning-attacks-in-gaza/0000019f-f8d1-d101-a5bf-fbd185800000"},{"headline":"Houthis strike Saudi Aramco refinery as regional escalation widens","body":"Yemen's Houthi movement claimed a drone attack on a Saudi Aramco refinery in Jazan using two drones, adding another front to the regional spillover from the ongoing Iran war. The attack coincided with reports that Saudi Crown Prince Mohammed bin Salman met with a senior US military commander, reflecting Gulf states' efforts to manage escalation risk as Iran-linked forces strike across multiple theaters. Yemen's own government has separately escalated operations against Houthi positions in recent days.","source":"Haaretz","url":"https://www.haaretz.com/israel-news/israel-security/2026-08-13/ty-article-live/israels-military-says-it-targeted-a-hamas-commander-planning-attacks-in-gaza/0000019f-f8d1-d101-a5bf-fbd185800000"}],"techAI":{"aiCompetition":[{"headline":"Commerce Department probes how Chinese AI firms rent banned Nvidia chips offshore","body":"The Bureau of Industry and Security has opened a review into Chinese AI companies obtaining top-tier Nvidia chips they cannot legally import, by instead renting compute capacity hosted in third countries. The inquiry follows a string of unexpectedly strong results from Chinese labs that suggested continued access to cutting-edge hardware despite existing controls. Because these rental deals never involve a chip physically crossing into China, they sidestep the shipment-based enforcement model export controls were built around, exposing a structural loophole in Washington's chip-containment strategy just as Nvidia heads into its next earnings report in late August.","source":"Bloomberg via WION","url":"https://www.wionews.com/world/washington-is-now-mapping-how-china-rents-the-nvidia-chips-it-cannot-buy-1786631423524/amp"},{"headline":"OpenAI launches enterprise agent platform 'Frontier,' names new revenue chief","body":"OpenAI introduced 'Frontier,' a new offering meant to embed autonomous AI agents directly into corporate operations, rolling it out this week to a limited set of customers ahead of broader release in coming months. The launch coincided with OpenAI naming Dali Rajic as its new Chief Revenue Officer on August 13, underscoring a push to convert technical leadership into enterprise sales as Anthropic, Google and xAI chase the same corporate accounts. Separate OpenAI research published the same day found firms that have moved from using AI as a conversational assistant to letting it execute full workflows are pulling ahead of slower-moving competitors, sharpening the stakes of the agentic-AI race.","source":"OpenAI","url":"https://openai.com/index/introducing-openai-frontier/"}],"cyberEmerging":[{"headline":"White House authorizes private firms to hack back at criminal cyber gangs","body":"In a first for U.S. policy, the Trump administration issued a presidential memorandum on August 12 letting vetted private security companies launch offensive cyber operations against international criminal hacking groups. The directive is framed as tapping private-sector 'innovative capabilities' to disrupt ransomware crews, financial fraud rings and sextortion operations targeting Americans. The shift ends decades of reserving offensive hack-back authority for government agencies alone, and raises fresh questions about oversight, escalation risk and accountability once private contractors are operating under classified rules of engagement.","source":"TechCrunch","url":"https://techcrunch.com/2026/08/13/in-a-first-us-will-allow-some-private-firms-to-carry-out-cyberattacks/"},{"headline":"New PATCHCORD backdoor hits Afghan telecoms and South Asian infrastructure","body":"Researchers at Acronis's Threat Research Unit disclosed a previously undocumented espionage campaign using a backdoor called PATCHCORD to target Afghan telecom providers and other South Asian critical-infrastructure organizations. Attackers lured victims with fake VPN installers impersonating Afghan Telecom and deployed a secondary Go-based implant, SHEETCORD, that abuses Google Sheets for command-and-control traffic to blend in with legitimate cloud activity. The campaign illustrates the growing trend of state-linked actors hijacking mainstream cloud services to mask intrusions into regional telecom backbones, a persistent worry for security planners across South and Central Asia.","source":"The Hacker News","url":"https://thehackernews.com/"}]},"cities":{"lasVegas":[{"headline":"Las Vegas Judge Dismisses Nevada 'Fake Electors' Case","body":"A Las Vegas judge dismissed the criminal case against six Nevada Republicans accused of submitting false 2020 electoral votes for Donald Trump, ruling that prosecutors failed to prove the charges. The August 13 decision ends a years-long prosecution that paralleled similar fake-elector cases pursued in other battleground states after the 2020 election. The defendants had faced felony charges tied to allegedly forging documents meant to hand Nevada's electoral votes to Trump despite his losing the state.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Flags Lowered Statewide as Fallen LVMPD Officer Laid to Rest","body":"Nevada Gov. Joe Lombardo ordered flags flown at half-staff across the state on Friday, August 14, to honor Las Vegas Metro Officer Austin 'Zade' Abdelnabi, who was killed August 4 while responding to a call about an armed subject on East Tropicana Avenue. The order coincides with Abdelnabi's funeral, with a procession departing Palm Mortuary in the central valley at 9 a.m. His death has drawn heavy community mourning amid a year that has already seen multiple officer-involved shootings in the valley.","source":"Elko Daily / USA Today Network","url":"https://elkodaily.com/news/state-regional/nevada/article_68132521-95b9-53c1-99dd-dde1b4679b9d.html"},{"headline":"First Rain in Nearly Two Months Breaks Vegas's Dry, Scorching Streak","body":"Harry Reid International Airport logged its first measurable rainfall since mid-June - just 0.02 inches - as thunderstorms swept through the valley Thursday. The storms arrived alongside the season's first sub-100-degree forecast, with highs dipping to 97 degrees for the first time since July 17. The brief cooldown offered residents a rare break after a brutal summer stretch of triple-digit heat.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/local-las-vegas/"}],"nellis":[{"headline":"Nellis Air Force Base Leans Into 'Warfare Center' Identity","body":"Nellis Air Force Base's public-facing channels have increasingly identified the installation as the U.S. Air Force Warfare Center, the numbered air force headquarters overseeing the 57th Wing, 926th Wing, 505th Command and Control Wing, and other units based at Nellis and across the Nevada Test and Training Range. Base officials insist the installation's name isn't changing, describing the shift as a rebrand meant to better reflect the command structure spanning multiple wings, some located beyond Nellis itself. The move highlights Nellis's expanding role as the Air Force's premier weapons-integration and combat-training hub, home to Red Flag exercises, the Thunderbirds, and the 563rd Rescue Group.","source":"KTNV Las Vegas","url":"https://www.ktnv.com/news/nellis-air-force-base-now-publicly-identifying-as-us-air-force-warfare-center"}]},"feelGood":[{"headline":"Vegas Restaurateur Opens Coffee Shop to Fund Local Arts School","body":"Nick Della Penna, co-owner of The Great Greek Mediterranean Grill, is opening a new coffee shop near the Las Vegas Academy of the Arts and plans to donate all of its profits to the school. The venture turns a small-business launch into an ongoing funding stream for arts education in a district that often struggles for extra resources, giving students a direct, community-rooted benefactor.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Nevada Guard Soldiers Rush to Protect Neighbors from Wildfires","body":"Nevada Army National Guard crews and support staff deployed August 9 to battle the Bug and Stallion fires as Gov. Joe Lombardo declared a state of emergency covering affected communities. Alongside the military response, the Community Foundation opened a 2026 Northern Nevada Wildfire Relief Fund to funnel donations toward residents who lost homes or property, pairing uniformed service with grassroots generosity.","source":"KOLO 8 News Now","url":"https://www.kolotv.com/"},{"headline":"Megan Thee Stallion's Foundation Helps Launch Mass Shelter-Animal Rescue Push","body":"The ASPCA partnered with Animal Care Centers of NYC and the Pete & Thomas Foundation, founded by three-time Grammy winner Megan Thee Stallion, to kick off 'The Rescue Effect,' a campaign built around large-scale adoption events for at-risk shelter animals. The launch came just days after ASPCA teams pulled more than 100 cats from unsanitary, overcrowded conditions across three New York City homes, giving those animals a renewed chance at safe, loving homes.","source":"ASPCA","url":"https://www.aspca.org/"}],"onThisDay":[{"year":"1935","event":"President Franklin D. Roosevelt signed the Social Security Act into law."},{"year":"1945","event":"Japan announced its surrender, effectively ending World War II."},{"year":"1947","event":"Pakistan gained independence from British colonial rule."},{"year":"1980","event":"Strikes began at the Lenin Shipyard in Gdansk, Poland, leading to the founding of the Solidarity movement."}]},"topPicks":[{"headline":"Ukraine hits Russian refinery 810 miles from border as Kyiv warns of Patriot shortage","teaser":"Deep-strike escalation and dwindling air-defense stocks raise stakes as the war intensifies on multiple fronts."},{"headline":"Iran claims control of Strait of Hormuz as US vows indefinite blockade","teaser":"A standoff over the world's most vital oil chokepoint threatens global energy markets and risks direct US-Iran conflict."},{"headline":"NATO council convenes over fresh airspace violations in Poland and Romania","teaser":"Emergency talks underscore rising alliance tensions with Russia as border incursions test collective defense commitments."}]},"navDates":[{"key":"2026-08-20","label":"Aug 20","href":"/","isNewest":true},{"key":"2026-08-19","label":"Aug 19","href":"/archive/2026-08-19.html","isNewest":false},{"key":"2026-08-18","label":"Aug 18","href":"/archive/2026-08-18.html","isNewest":false},{"key":"2026-08-17","label":"Aug 17","href":"/archive/2026-08-17.html","isNewest":false},{"key":"2026-08-16","label":"Aug 16","href":"/archive/2026-08-16.html","isNewest":false},{"key":"2026-08-15","label":"Aug 15","href":"/archive/2026-08-15.html","isNewest":false},{"key":"2026-08-14","label":"Aug 14","href":"/archive/2026-08-14.html","isNewest":false}],"currentKey":"2026-08-14","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-14.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
