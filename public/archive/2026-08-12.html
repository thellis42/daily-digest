<script>
const STATE = {"digest":{"date":"Wednesday, August 12, 2026","generatedAt":"Wed, Aug 12, 5:58 AM PDT","breaking":{"headline":"US Marine Veteran Robert Gilman Freed From Russian Custody After Trump-Putin Call","body":"Russia released Robert Gilman, a 32-year-old former Marine and Massachusetts teacher who had been jailed since 2022 on charges his family calls politically motivated, sending him home late Tuesday. President Trump said he personally raised the case with President Putin and that Moscow agreed to a humanitarian pardon with no prisoner swap involved. Advocates say Gilman had been near death after alleged abuse in custody; he landed at Joint Base Andrews and was greeted by special envoy Steve Witkoff before being taken for medical evaluation. The gesture comes amid broader, still-unresolved US efforts to negotiate an end to the Ukraine war and adds to a string of unilateral releases Moscow has granted during Trump's second term.","source":"CNN / NPR","url":"https://www.cnn.com/2026/08/11/politics/former-marine-detained-russia-freed"},"tabs":{"defense":{"defense":[{"headline":"Pentagon Speeds Up Golden Dome Testing as Missile Stocks Strain Under Iran Operations","body":"The Defense Department has locked in an initial test window for the Golden Dome space-based missile defense architecture before the end of 2026, with further test phases to follow next year. The push comes as US forces keep drawing down Patriot, THAAD, and Tomahawk inventories in ongoing operations tied to the conflict with Iran, fueling concern about interceptor stocks available for other contingencies. Pentagon planners are now weighing how fast domestic production lines can refill munitions even as the new space layer heads toward first trials.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026"},{"headline":"Pentagon Draft Nuclear Strategy Would Elevate Tactical Weapons for Russia, China Scenarios","body":"A draft revision of US nuclear strategy now circulating inside the Pentagon would place heavier emphasis on shorter-range, lower-yield tactical nuclear weapons for potential regional fights with Russia or China. The rethink reflects growing worry among planners that rivals could exploit gaps below the threshold that would trigger a full strategic exchange. The document remains under interagency review and has not been endorsed publicly by the White House.","source":"The Defense Post","url":"https://thedefensepost.com/"},{"headline":"Turkey to Send MLRS Launchers, Rockets to Ukraine in State Department-Cleared Transfer","body":"Turkey is moving to transfer 12 M270 Multiple Launch Rocket System launchers and 2,524 M26 rockets to Ukraine under a deal cleared through the US State Department. The shipment adds Ankara to the growing list of partners feeding Kyiv long-range fires as attritional fighting with Russian forces continues. It follows a separate joint US-Ukraine defense-production arrangement disclosed earlier this month by a retired US Army colonel.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026"}],"acquisitions":[{"headline":"Hanwha Defense USA Offers $1.2 Billion for Austal's US Shipbuilding Operations","body":"Hanwha Defense USA has put forward a non-binding $1.2 billion bid to acquire the US shipbuilding operations of Austal, the Alabama-based builder of Navy littoral combat ships and other surface vessels. The offer surfaces just as Austal USA disclosed an expected fiscal 2026 operating loss of $175 million tied to non-cash accounting charges on legacy surface-ship contracts. A completed deal would hand the Hanwha-linked firm a much bigger foothold in the US naval-shipbuilding base at a moment when the Navy is pushing to expand fleet capacity.","source":"Naval News","url":"https://www.navalnews.com/category/naval-news/"},{"headline":"Raytheon Wins Missile Defense Agency Deal to Sustain SM-3 Interceptor Production","body":"Raytheon has secured a new Missile Defense Agency contract to keep producing and sustaining the SM-3 Block IIA interceptor, the Navy's primary ship-launched weapon against medium- and intermediate-range ballistic missiles. The award extends Raytheon's existing SM-3 IIA production base as the Pentagon leans more heavily on layered missile defense amid intensifying missile threats from Iran, North Korea, and China. Contract value was not disclosed alongside the announcement.","source":"Naval News","url":"https://www.navalnews.com/category/naval-news/"}]},"us":[{"headline":"July CPI Data Shows Inflation Holding Near Multi-Year Low, Easing Pressure on Fed","body":"The Bureau of Labor Statistics reported Wednesday that core consumer prices rose just 0.2% in July, pushing the annual core rate to 2.5%, the slowest pace since March 2021. The milder-than-fasted print gives Fed Chair Kevin Warsh and the FOMC more room before their September 15-16 meeting, where three governors have already signaled support for a rate hike if inflation reaccelerates. Markets had been bracing for a hotter number after oil prices jumped roughly 21% in July amid Middle East tensions, so the cooler reading likely reduces the odds of a September increase.","source":"Bloomberg / Washington Post","url":"https://www.bloomberg.com/news/articles/2026-08-12/us-core-inflation-was-subdued-in-july-easing-pressure-on-fed"},{"headline":"Midterm Primaries Expose Deepening Party Rifts in Wisconsin, Minnesota and Beyond","body":"Voters in six states cast primary ballots Tuesday in contests that underscored intraparty splits heading into November. In Wisconsin, Milwaukee County Executive David Crowley narrowly beat democratic socialist Francesca Hong and is positioned to potentially become the state's first Black governor. In Minnesota, progressive Lt. Gov. Peggy Flanagan won the Democratic Senate primary over more centrist rivals, extending a string of progressive-wing victories that could complicate Democratic efforts to hold swing districts in the fall.","source":"NPR","url":"https://www.npr.org/sections/politics/"},{"headline":"Andrew Tate Held in Federal Custody After UK Extradition Arrest","body":"Andrew Tate, who along with his brother Tristan faces more than 50 charges in the UK and Romania including rape and human trafficking, is now being held in a US federal prison following his arrest on a UK extradition request. The detention marks a reversal for Tate, who had proclaimed he would be shielded from prosecution after a travel ban was lifted in February 2025 and he relocated to Florida. The case is likely to become a flashpoint over the administration's cooperation with foreign law-enforcement requests involving high-profile figures who have cultivated ties to conservative media circles.","source":"NPR","url":"https://www.npr.org/sections/politics/"},{"headline":"HHS Cuts Medicaid Funding for Minors' Gender-Transition Care","body":"The Trump administration announced Wednesday that Medicaid will no longer cover gender-transition surgeries or hormone treatments for minors, an action directed by Health and Human Services Secretary Robert F. Kennedy Jr. and announced by Dr. Mehmet Oz. Officials framed the move as the culmination of over a year of pressure that has already led numerous US hospitals to end pediatric gender-affirming care programs. The policy is expected to draw immediate legal challenges from civil-rights and medical groups and will likely become a wedge issue in the run-up to the November midterms.","source":"The White House / Conservative Treehouse","url":"https://theconservativetreehouse.com/blog/2026/08/12/august-12th-2026-presidential-politics-trump-administration-day-570/"}],"pacific":{"pacificCommand":[{"headline":"North Korea Fires Ballistic Missile, Draws Formal Japanese Protest","body":"Japan's Defense Minister Shinzo Koizumi confirmed early Wednesday that Tokyo lodged a formal protest after North Korea launched a ballistic missile from its eastern coast around 5:59 a.m. local time. The projectile flew roughly 690 kilometers on an easterly trajectory, reaching a peak altitude of about 90 kilometers before splashing down in the Sea of Japan outside Japan's exclusive economic zone. The launch adds another data point to Pyongyang's steady cadence of missile tests this year, keeping regional missile-defense planners on alert.","source":"Pravda Japan","url":"https://japan.news-pravda.com/en/world/2026/08/12/25874.html"},{"headline":"Japan's 2026 Defense White Paper Sets FY2027 Deadline for Self-Reliant Defense","body":"Japan's Defense Ministry's newly released white paper commits Tokyo to building the capability to take primary responsibility for repelling invasions of its territory by fiscal year 2027, with US support as a backstop rather than the primary shield. The document, unveiled August 4, pairs that goal with a record proposed defense budget of roughly JPY8.9 trillion ($56.1 billion) and new emphasis on partnering with tech startups on AI-enabled drones and other emerging-warfare systems. Analysts note Japan still lacks an independent targeting and reconnaissance 'kill chain,' leaving its new counterstrike missiles reliant on US intelligence architecture even as Tokyo pushes toward greater self-sufficiency.","source":"Defense News","url":"https://www.defensenews.com/global/asia-pacific/2026/08/10/japans-2026-defense-white-paper-highlights-new-era-of-crisis-in-indo-pacific/"},{"headline":"Manila Presses for South China Sea Code of Conduct as ASEAN Chair Stalls on Consensus","body":"The Philippines, chairing ASEAN in 2026, has been unable to forge a fresh regional consensus on the South China Sea despite holding the strongest diplomatic hand of any recent chair, with its foreign ministers' communique largely mirroring the language Malaysia produced the previous year. Manila is nonetheless pushing monthly negotiating sessions aimed at finishing a long-delayed Code of Conduct with Beijing by the end of 2026, a deadline foreign ministers first set back in 2023. Foreign Affairs Secretary Ma. Theresa Lazaro has said Manila will not sign a weak deal that falls outside the UN Convention on the Law of the Sea, even as near-weekly friction with Chinese vessels around Scarborough and Second Thomas Shoals continues.","source":"Asia Times / CFR Global Conflict Tracker","url":"https://www.cfr.org/global-conflict-tracker/conflict/territorial-disputes-south-china-sea"}],"pacingThreat":[{"headline":"PLA Reveals Hypersonic YJ-20 Missile Fired From Workhorse Destroyer Class","body":"Chinese state media released footage showing a Type 052D destroyer launching the YJ-20 hypersonic anti-ship missile, marking the first public confirmation that the weapon — which debuted at the 2025 V-Day parade — has been integrated onto the PLA Navy's more numerous 052D-class ships rather than only its larger Type 055 destroyers. Military analysts cited by state broadcasters say the move substantially expands the fleet's overall anti-ship strike capacity, since the 052D class vastly outnumbers the Type 055. The disclosure comes as the PLA marked its 99th founding anniversary on August 1, a milestone tied to its 2027 centenary modernization goals.","source":"Global Times","url":"https://www.globaltimes.cn/china/military/index.html"},{"headline":"PLA Southern Theater Command Runs Fresh Drills Near Scarborough Shoal","body":"China's PLA Southern Theater Command announced it conducted joint air and maritime drills in the waters and airspace around Scarborough Shoal (Huangyan Dao), framing the exercise as a response to what it called destabilizing actions by 'certain countries' in the South China Sea — a clear reference to the Philippines. The drills follow a pattern of near-weekly skirmishes between Chinese and Philippine vessels through July, which have already prompted joint Philippine-Japanese-US maritime exercises in the same waters. Beijing's coast guard and navy have increasingly operated in tandem in these confrontations, raising the risk of miscalculation given past close encounters near the shoal.","source":"China Military Online / PLA Southern Theater Command","url":"http://eng.chinamil.com.cn/"},{"headline":"Taiwan Runs Largest-Ever Reservist Call-Up in Annual War-Readiness Drills","body":"Taiwan's Han Kuang exercises this month mobilized its largest-ever call-up of reservists and tested relocating weapons production lines to civilian factories to sustain output if Chinese strikes hit supply hubs. The drills also included, for the first time, deliberately throttled mobile internet speeds to rehearse wartime communications under bandwidth scarcity. Japan's 2026 defense white paper assessed that the cross-strait military balance is 'rapidly tilting' toward China, even as analysts note 2026 has so far seen a relative lull in coercive PLA activity around the island compared with prior years.","source":"CFR Global Conflict Tracker","url":"https://www.cfr.org/global-conflict-tracker/conflict/confrontation-over-taiwan"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine Hits Russia's Last Major Black Sea Fleet Base at Novorossiysk","body":"In a pre-dawn operation on August 12, Ukraine's military, SBU and intelligence services struck the Novorossiysk naval base in Russia's Krasnodar region using Palianytsia missile-drones, Neptune cruise missiles and naval drones. Zelensky called it a unique strike on what he described as Russia's last major Black Sea Fleet stronghold, confirming hits on air-defense positions, piers and port infrastructure roughly 300 km behind the front line. The base has become critical to Moscow since repeated Ukrainian strikes forced much of the fleet to relocate away from Crimea, and Zelensky separately warned that Ukrainian intelligence indicates Russia is preparing to mobilize several hundred thousand additional troops by year's end.","source":"NBC News","url":"https://www.nbcnews.com/world/ukraine/russia-ukraine-war-zelenskyy-attack-black-sea-fleet-rcna592069"},{"headline":"Russia Unleashes 138-Drone Barrage as Ukraine's Front Lines Strain","body":"Ukraine's air force reported that Russia attacked overnight into August 12 with an Iskander-M ballistic missile, a Kh-31P anti-radiation missile, Kh-35 guided missiles and 138 Shahed-type drones. The barrage follows Monday's ballistic missile strike on the Zaporizhstal steel plant that caused casualties, part of a pattern of deep strikes on Ukrainian industrial and civilian targets in Zaporizhzhia, Sloviansk and Odesa region in recent days. Ukraine's General Staff also reported Russia has suffered roughly 1,461,660 total casualties since the February 2022 invasion, including about 1,260 in the past day alone, underscoring the grinding attrition even as Moscow presses offensives in Kharkiv and Donbas.","source":"Kyiv Independent","url":"https://kyivindependent.com/"}],"europe":[{"headline":"European Allies Warn of Patriot Interceptor Shortfall as Ukraine Burns Through Stockpiles","body":"European governments are increasingly rationing Patriot air-defense interceptors as Ukraine competes for the same limited supply to counter intensifying Russian missile and drone barrages. The shortage highlights a broader NATO industrial-capacity problem that alliance leaders pledged to address at the July Ankara summit, where members committed to expanding manufacturing and removing barriers to defense trade. With Russia expanding production of ballistic missiles and jet-powered drones that overwhelm existing air defenses, the interceptor crunch is forcing hard tradeoffs between arming Kyiv and replenishing NATO's own eastern-flank stocks.","source":"RBC-Ukraine","url":"https://newsukraine.rbc.ua/war-in-ukraine"},{"headline":"Ceuta Fallout Exposes Europe's Deepening Migration Rift","body":"The aftermath of the early-August surge, in which roughly 60,000-70,000 migrants crossed from Morocco into Spain's Ceuta enclave and dozens drowned attempting the crossing, continues to fracture EU unity weeks later. Italy, Finland, Austria, Sweden, Denmark and the Czech Republic have pushed to suspend Spain from the Schengen zone, while Rome has reimposed border checks with Madrid despite the two countries sharing no land border. The episode has reignited 2015-style tensions just as a new EU Migration and Asylum Pact emphasizing faster deportations took effect in June, exposing the gap between Brussels' tougher enforcement rhetoric and labor shortages in hospitals and farms across the continent.","source":"The Conversation","url":"https://theconversation.com/after-ceuta-europe-is-once-again-mired-in-migration-chaos-of-its-own-making-289017"}]},"middleEast":[{"headline":"IAEA to Extract Nuclear Material From Syria Under New US-Israel Deal","body":"The International Atomic Energy Agency is set to remove nuclear material from Syrian territory following an agreement reached with Washington and Israel, according to Jerusalem Post reporting from August 11. The move comes amid parallel diplomatic friction over the Strait of Hormuz, where Germany's foreign minister pressed Iranian counterpart Araghchi to keep the waterway open even as Tehran's parliament has moved to bar vessels tied to countries deemed hostile. Kurdish demonstrations in Syrian cities in the same window point to continuing instability inside Syria even as international powers work to resolve residual nuclear-security concerns.","source":"Jerusalem Post","url":"https://www.jpost.com/middle-east/iran-news/2026-08-11/live-updates-905132"},{"headline":"Houthi Strike on Yemeni Port Raises Fears of Renewed Civil War","body":"Iranian-backed Houthi rebels struck a government-held port on Yemen's Red Sea coast, an escalation that deepens concerns about both threats to strategic shipping lanes and a potential collapse of Yemen's fragile truce. The attack lands against the backdrop of a broader regional standoff in which Tehran has warned it will respond to any further US or Israeli pressure with an eye-for-an-eye retaliation. Combined with Iran's proposed restrictions on Hormuz transit for 'hostile' vessels, the Houthi action signals Iran-aligned actors are willing to use multiple maritime chokepoints as leverage.","source":"PBS News","url":"https://www.pbs.org/newshour/world/israel-rejects-trumps-gaza-plan-more-details-emerge-on-the-strait-of-hormuz-and-other-mideast-news"},{"headline":"Pakistan Frames New Saudi-Turkey Defense Pact as Purely Defensive","body":"Islamabad has moved to reassure the region that its new trilateral defense arrangement with Saudi Arabia and Turkey is strictly defensive and open to other states joining, according to recent Middle East coverage. The pact follows a year of regional turbulence, including the February-launched US-Israel military campaign against Iran and subsequent Iranian retaliatory strikes on Gulf states and American bases, which pushed several Sunni-majority powers to hedge their security arrangements. The grouping reflects growing appetite among Gulf and South Asian states for defense frameworks independent of, but not necessarily opposed to, US security guarantees.","source":"PBS News","url":"https://www.pbs.org/newshour/world/israel-rejects-trumps-gaza-plan-more-details-emerge-on-the-strait-of-hormuz-and-other-mideast-news"}],"techAI":{"aiCompetition":[{"headline":"Nvidia Recruits Wall Street Titans for $500 Billion AI Financing Push","body":"Nvidia signed preliminary agreements with six major financial firms - Apollo, BlackRock, Blackstone, Brookfield, Goldman Sachs and KKR - to mobilize more than $500 billion in financing for AI data centers and chip purchases, effectively treating compute capacity as a bondable asset class similar to real estate or toll roads. CEO Jensen Huang said he approached only these six firms and all agreed to participate, with Goldman positioned as lead bookrunner on forthcoming public debt deals. The announcement has revived worries about circular financing in the AI sector, since Nvidia is separately reported to be in talks to backstop a roughly quarter-trillion-dollar data-center project for OpenAI, one of its largest customers.","source":"CNBC / Axios","url":"https://www.cnbc.com/2026/08/10/nvidia-wall-street-asset-managers-500-billion-ai-push.html"},{"headline":"Bitcoin Miner Riot Platforms Locks In $9.1 Billion, 20-Year Compute Deal Tied to Anthropic","body":"Riot Platforms disclosed a 20-year, $9.1 billion computing agreement with an unnamed 'leading frontier AI laboratory' that reporting has identified as Anthropic, underscoring how crypto-mining infrastructure is being repurposed for the AI boom. The deal covers roughly 191 megawatts of capacity out of Riot's Rockdale, Texas site, with deployment phased through 2027 and 2028. The arrangement highlights the value of assets crypto miners already hold - land, grid connections, substations and cooling - that AI labs now urgently need as compute demand outpaces new data-center construction.","source":"Tech Startups","url":"https://techstartups.com/2026/08/11/top-tech-news-today-august-11-2026-anthropic-intel-meta-openai-nvidia-unitree-more/"}],"cyberEmerging":[{"headline":"Suspected Chinese Hackers Launch First 'Autonomous' AI Cyberattack on Taiwan","body":"Israeli AI security firm Dream said suspected China-linked hackers used publicly available AI agents in early July to build an autonomous hacking tool that operated like a coordinated cyber team against Taiwanese government targets, marking what researchers call a first-of-its-kind breach. Over four days, up to eight AI agents worked simultaneously, mapping 21 government systems, researching vulnerabilities, and adapting tactics when blocked, before the intrusion expanded to Taiwan's nuclear safety agency and several energy companies. Dream's chief strategy officer, a former head of Israeli signals-intelligence cyber operations, said he had never previously seen an 'end-to-end autonomous attack' against a government target and argued governments must now assume they face permanent AI-driven intrusion attempts.","source":"Financial Times / Sri Lanka Guardian","url":"https://slguardian.org/ai-hackers-target-taiwan-in-new-cyber-warfare-shift/"},{"headline":"OpenAI Rolls Out Purpose-Built Cyber-Defense Model as AI-Enabled Hacking Accelerates","body":"OpenAI began giving vetted cybersecurity defenders access to a specialized frontier model aimed at helping them find and patch vulnerabilities faster, part of a broader industry push to keep pace with attackers now weaponizing AI tools of their own. The rollout follows warnings from Anthropic and Palo Alto Networks that state-linked hacking groups, including Chinese actors, have already used both Western and homegrown AI systems such as DeepSeek to automate reconnaissance and exploit development. Policymakers and AI safety researchers say the widening gap between offensive AI capability and institutional defenses is becoming one of the most urgent emerging-tech risks of 2026.","source":"OpenAI","url":"https://openai.com/index/introducing-openai-frontier/"}]},"cities":{"lasVegas":[{"headline":"Jury Selection Opens in Tupac Shakur Murder Trial","body":"The long-awaited trial for the only man charged in the 1996 killing of rap icon Tupac Shakur began jury selection this week in Las Vegas. The courthouse drew a mix of people who identified themselves as relatives of Shakur, longtime fans and true-crime podcasters eager to witness a case nearly three decades in the making. Proceedings are expected to stretch over several weeks as prosecutors and the defense argue over evidence tied to the Strip-area drive-by shooting.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Merging Wildfires Trigger State of Emergency in Washoe County","body":"Gov. Joe Lombardo declared a state of emergency for Washoe County and the Reno-Sparks Indian Colony after the Bug and Fred Mountain fires merged into a single blaze that has now scorched more than 40,000 acres near the California-Nevada border. The fires knocked out power to roughly 1,700 NV Energy customers in the North Valleys, closed schools and forced new evacuations near Pyramid Lake, while FEMA has approved federal funding to help cover firefighting costs.","source":"KOLO 8 News Now","url":"https://www.kolotv.com/"},{"headline":"Community Prepares to Honor Fallen Metro Officer","body":"Funeral services are being finalized for Las Vegas Metropolitan Police Officer Austin Abdelnabi, 30, who was killed in the line of duty on Aug. 4 during a confrontation that also left the armed suspect dead. A community fundraiser organized through the Injured Police Officers Fund is set for Aug. 15 at Nevada Coin Mart to support his family, as local officials continue debating whether Nevada's open-carry laws need reform in the wake of the shooting.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"}],"nellis":[{"headline":"Creech AFB Pushes AI Drone Wingmen Through Combat Drills","body":"The Air Force's Collaborative Combat Aircraft Experimental Operations Unit recently ran its semi-autonomous drone prototypes through an Agile Combat Employment exercise at Creech Air Force Base, testing how AI-enabled 'loyal wingman' aircraft could operate alongside crewed fighters in contested environments. The exercise underscores how the Las Vegas-area installation, long the hub of America's remotely piloted aircraft fleet, is now becoming a proving ground for the next generation of autonomous air combat technology.","source":"Nellis Air Force Base Public Affairs","url":"https://www.nellis.af.mil/Nellis-News/Article-Display/Article/4556808/air-force-tests-collaborative-combat-aircraft-at-creech/"}]},"feelGood":[{"headline":"Toyota Expands Red Cross Partnership With $1 Million Gift","body":"Toyota announced it is deepening its long-running partnership with the American Red Cross by donating $1 million earmarked specifically for disaster relief operations. The gift comes as the charity's disaster action teams face mounting demand responding to wildfires and storms across the country, giving crews more resources to reach displaced families quickly.","source":"American Red Cross","url":"https://www.redcross.org/about-us/news-and-events/latest-news.html"},{"headline":"Ranchers Open Their Stalls to Wildfire Evacuees' Horses","body":"As the merging Bug and Fred Mountain fires forced Northern Nevada families to flee their homes, officials in Churchill County stepped up by offering free use of their horse stalls so evacuees could shelter livestock and horses they otherwise had nowhere to take. The small-town gesture spared displaced families one more worry while flames continued to threaten the Reno area.","source":"KOLO 8 News Now","url":"https://www.kolotv.com/"},{"headline":"Red Cross Teams Work Around the Clock for Wildfire Families","body":"With thousands of Northern Nevadans driven from their homes by the fast-moving wildfires near Reno, American Red Cross disaster action teams set up round-the-clock shelters offering food, water and a safe place to sleep. Volunteers have been coordinating with Washoe County officials and the Reno-Sparks Indian Colony to make sure evacuees, including many with nowhere else to turn, are not facing the disaster alone.","source":"American Red Cross","url":"https://www.redcross.org/about-us/news-and-events/latest-news.html"}],"onThisDay":[{"year":"1981","event":"IBM released its first personal computer, the IBM PC, ushering in the modern PC era."},{"year":"1990","event":"Paleontologists discovered Sue, the largest and most complete Tyrannosaurus rex fossil ever found, in South Dakota."},{"year":"1898","event":"The United States and Spain signed a peace protocol in Washington, ending hostilities in the Spanish-American War."},{"year":"2000","event":"The Russian submarine Kursk sank in the Barents Sea after an onboard explosion, killing all 118 crew members."}]},"topPicks":[{"headline":"US Marine Veteran Robert Gilman Freed From Russian Custody After Trump-Putin Call","teaser":"A direct Trump-Putin phone call secured the release of a detained US Marine veteran from Russian custody."},{"headline":"Ukraine Hits Russia's Last Major Black Sea Fleet Base at Novorossiysk","teaser":"Ukrainian forces struck Russia's remaining major Black Sea naval hub, escalating pressure on Moscow's fleet operations."},{"headline":"Pentagon Draft Nuclear Strategy Would Elevate Tactical Weapons for Russia, China Scenarios","teaser":"A new Pentagon strategy draft signals a major shift toward tactical nuclear options amid rising tensions with Russia and China."}]},"navDates":[{"key":"2026-08-17","label":"Aug 17","href":"/","isNewest":true},{"key":"2026-08-16","label":"Aug 16","href":"/archive/2026-08-16.html","isNewest":false},{"key":"2026-08-15","label":"Aug 15","href":"/archive/2026-08-15.html","isNewest":false},{"key":"2026-08-14","label":"Aug 14","href":"/archive/2026-08-14.html","isNewest":false},{"key":"2026-08-12","label":"Aug 12","href":"/archive/2026-08-12.html","isNewest":false},{"key":"2026-08-11","label":"Aug 11","href":"/archive/2026-08-11.html","isNewest":false},{"key":"2026-08-10","label":"Aug 10","href":"/archive/2026-08-10.html","isNewest":false}],"currentKey":"2026-08-12","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-12.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"# const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
