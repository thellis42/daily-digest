<script>
const STATE = {"digest":{"date":"Tuesday, September 1, 2026","generatedAt":"Tue, Sep 1, 7:33 AM PDT","breaking":{"headline":"Army Secretary Dan Driscoll Resigns Amid Bitter Clash With Hegseth","body":"U.S. Army Secretary Dan Driscoll submitted his resignation to President Trump on Monday, August 31, capping months of friction with Defense Secretary Pete Hegseth over the sidelining of senior officers, including the April firing of Army Chief of Staff Gen. Randy George. Driscoll, the youngest secretary in Army history and a close Yale Law classmate of Vice President JD Vance, had also served as Trump's envoy in last fall's Ukraine-Russia peace talks. His exit lands six months into the ongoing U.S. military confrontation with Iran and marks the latest senior Pentagon departure under Hegseth, following Gen. Christopher Donahue's abrupt resignation as commander of U.S. Army forces in Europe and Africa in June.","source":"CNN","url":"https://www.cnn.com/2026/08/31/politics/army-secretary-dan-driscoll-resigns"},"tabs":{"defense":{"defense":[{"headline":"US-Iran Military Confrontation Grinds Into Sixth Month as Pentagon Loses Key Leader","body":"The U.S. military's ongoing confrontation with Iran continues into its sixth month with no resolution in sight, coinciding with the departure of one of the Pentagon's most senior civilian officials. Driscoll's exit leaves the Army without a confirmed civilian secretary at a sensitive moment given the service's central role in any wider contingency planning. Lawmakers have voiced concern about continuity in Army modernization and readiness programs during the transition.","source":"Bloomberg / CNN","url":""},{"headline":"Driscoll's Exit Clouds Future of Army's Drone-Centric Modernization Drive","body":"Nicknamed 'drone guy' inside the Pentagon, Driscoll had championed the Army Transformation Initiative to accelerate fielding of unmanned systems while cutting legacy programs. With no successor yet named, officials and lawmakers are questioning whether that drone-procurement agenda, seen as central to countering China's expanding unmanned fleets, will retain the same White House backing under a Hegseth-aligned replacement. The uncertainty follows a string of senior departures, including Gen. Randy George in April and Gen. Christopher Donahue in June.","source":"Axios","url":"https://www.axios.com/2026/08/31/hegseth-dan-driscoll-trump-administration"},{"headline":"Turkiye, Pakistan and Saudi Arabia Launch 'Mecca Defense Agreement'","body":"Turkiye, Pakistan and Saudi Arabia have begun implementing the newly announced Mecca Defense Agreement, a mutual security and cooperation framework unveiled this week. As a NATO member, Turkiye's move to anchor a separate regional security architecture alongside Riyadh and Islamabad signals expanding defense diplomacy outside the alliance's traditional structure, a shift U.S. planners are watching amid broader Middle East realignment. Specific force-posture or interoperability commitments under the pact have not yet been made public.","source":"Anadolu Agency","url":"https://aa.com.tr/en/world/morning-briefing-sept-1-2026-tuesday/4043193"}],"acquisitions":[{"headline":"Air Force Awards Extant Aerospace $147.3M IDIQ for Countermeasure Dispensers","body":"The Air Force awarded Extant Aerospace a potential $147.3 million indefinite-delivery/indefinite-quantity contract on August 31 to produce ALE-47 countermeasure dispenser units, hardware used to protect aircraft from heat-seeking missile threats. The award reflects a broader Pentagon push to harden survivability of existing airframes rather than fund entirely new platforms.","source":"GovConWire","url":"https://www.govconwire.com/category/contract-awards"},{"headline":"Pentagon Taps Dataminr for $318M AI Alerting Contract","body":"The Air Force, acting on behalf of the wider Department of Defense, awarded Dataminr a $318 million contract for its AI-powered 'First Alert Advanced' platform under the A2 Publicly Available Information Alerting program. The deal, selected from eight competing bids, will give commanders across all military services AI-driven situational awareness and early-warning indications on global events, with work running through June 2031. It ranks among the largest AI-services awards the Pentagon has issued this year, underscoring the department's push to fuse commercial AI tools into daily intelligence operations.","source":"DefenseScoop","url":"https://defensescoop.com/2026/08/27/pentagon-awards-dataminr-318m-contract/"}]},"us":[{"headline":"Supreme Court Lets Trump's $300M Ballroom Project Proceed, Chief Justice Dissents","body":"The Supreme Court ruled Monday that President Trump can continue construction of his White House ballroom without needing congressional approval, finding that the National Trust for Historic Preservation likely lacks the legal standing to sue over the demolition of the East Wing. The majority did not rule on the underlying legality of tearing down the East Wing to build the new structure, which is now estimated to cost taxpayers at least $300 million despite earlier White House assurances it would be privately funded. Notably, Chief Justice John Roberts broke from his usual conservative allies to dissent from the ruling.","source":"NPR","url":"https://www.npr.org/2026/08/21/nx-s1-5935417/supreme-court-allows-trumps-ballroom-construction-to-continue-for-now"},{"headline":"Commerce Department Strips Anti-Interference Language From Census Bureau Policy","body":"NPR reported that the Commerce Department, which oversees the Census Bureau and Bureau of Economic Analysis, quietly removed language barring political interference from its scientific integrity policy. The change came after the Census Bureau issued a report tied to a Trump-aligned think tank, raising fresh concerns about the politicization of federal statistical agencies ahead of the 2026 midterms. Watchdogs worry the shift could affect the credibility of economic and demographic data used for redistricting and policy decisions.","source":"NPR","url":"https://www.npr.org/sections/national/"},{"headline":"Air Force Major Faces Rare Court-Martial Charges Over Trump Criticism","body":"Maj. Jason Watson, a 17-year Air Force veteran, has been formally charged with 10 counts under the Uniform Code of Military Justice, including three rare Article 88 counts for 'contemptuous words' toward President Trump and Vice President Vance. Watson, who was twice detained after publicly calling for Trump's impeachment—including once in uniform on the Capitol steps—also faces Article 92 dereliction of duty and Article 133 conduct-unbecoming charges tied to six separate incidents. His attorneys say he is likely the first major in military history charged under Article 88, and he could face dismissal, loss of pay and confinement if convicted at a general court-martial.","source":"Military.com","url":"https://www.military.com/air-force-major-ucmj-who-keeps-calling-for-trumps-impeachment-charged-with-10-counts-under-military-law"},{"headline":"Markets Reassess Fed Rate Path After Jackson Hole as Jobs Report Looms","body":"Traders shifted expectations on the Federal Reserve's next move after policymakers' Jackson Hole remarks, with markets now pricing in a greater chance the central bank holds or even hikes rates rather than cutting in September. The recalibration comes as investors brace for the closely watched August nonfarm payrolls and unemployment figures due later this week, seen as pivotal for determining whether the labor market is cooling enough to justify easing. Persistent tariff-driven price pressures continue to complicate the Fed's calculus, with economists warning of stagflation risk if inflation stays elevated while hiring slows.","source":"Substack (Morning News Update)","url":"https://ru4people.substack.com/p/morning-news-update-august-31-2026"}],"pacific":{"pacificCommand":[{"headline":"South Korea Edges Toward Drafting Women as Recruit Pool Shrinks","body":"A new survey by the Reform Institute found roughly 60 percent of South Koreans now back extending mandatory military service to women, a striking shift on a once-taboo issue. The debate is intensifying ahead of an autumn revision to Seoul's national defense plan, driven by record-low birth rates that are shrinking the pool of male conscripts who currently serve 18 to 21 months. Advocates point to Norway, Sweden, Denmark and Israel as precedents, while skeptics argue Seoul should instead pour resources into drones and unmanned systems to offset personnel shortfalls along the DMZ.","source":"The Korea Herald","url":"https://www.koreaherald.com/article/10846786"},{"headline":"Japan's Navy Shadows PLA Carrier Liaoning as It Returns From Far-Seas Drills","body":"Chinese state television confirmed this week that the Liaoning carrier strike group returned to port after an extended far-seas training deployment, during which Beijing accused Japanese ships and aircraft of repeated close-range 'harassment.' The complaint reflects how routinely Japan's Maritime Self-Defense Force now tracks PLA Navy carrier movements near Japanese waters, consistent with Tokyo's 2026 defense white paper, which labeled China its 'greatest strategic challenge.' The episode caps a summer of rising friction between Japanese and Chinese forces across the East China Sea.","source":"Global Times / Japan Ministry of Defense reporting","url":"https://www.globaltimes.cn/china/military/index.html"},{"headline":"Manila Deepens Trilateral Drills With Washington and Tokyo After Shoal Clashes","body":"After three separate confrontations with Chinese vessels in a single week in July at Scarborough Shoal and Second Thomas Shoal, the Philippines has expanded joint maritime patrols with the United States and Japan, according to the Council on Foreign Relations' conflict tracker. Manila is running a dual-track strategy, pursuing a revised coast guard memorandum of understanding with Beijing while simultaneously tightening security ties with Washington and Tokyo. Data cited by regional analysts shows Chinese force movements inside the Philippines' exclusive economic zone rose roughly 490 percent in the first half of 2026 versus the prior six months, fueling Manila's push for more allied patrols.","source":"Council on Foreign Relations","url":"https://www.cfr.org/global-conflict-tracker/conflict/territorial-disputes-south-china-sea"}],"pacingThreat":[{"headline":"China and Russia Wrap 'Joint Sea-2026' With First-Ever Joint Submarine Appearance","body":"The China-Russia 'Joint Sea-2026' naval exercise concluded this week at Qingdao naval base in Shandong Province, with Chinese military media confirming that submarines from both navies operated together in the same drill for the first time. Analysts cited by Chinese outlets framed the milestone as evidence of deepening underwater coordination and mutual trust between the two fleets. The exercise is part of a broader wave of Chinese-linked drills this year, including 'Falcon Strike-2026' with Thailand's air force and 'Swift Eagle 2026' airborne training with Belarus.","source":"Global Times","url":"https://www.globaltimes.cn/china/military/index.html"},{"headline":"PLA Navy Submarine Test-Fires Strategic Missile, State Media Confirms Within the Hour","body":"China's Xinhua News Agency reported that a PLA Navy submarine successfully test-launched a strategic missile, publicizing the event just 59 minutes after it occurred. Chinese defense commentators quoted by Global Times called the unusually fast, open disclosure a deliberate signal of confidence in the readiness of Beijing's sea-based deterrent. The rare transparency comes amid heightened scrutiny of China's expanding ballistic-missile submarine fleet by U.S. and allied intelligence services.","source":"Global Times / Xinhua","url":"https://www.globaltimes.cn/china/military/index.html"},{"headline":"Taiwan Unveils NT$36 Billion 'Strong Bow' Missile Program for 2028 Delivery","body":"Taiwan's Liberty Times reported Tuesday that the Ministry of National Defense will spend NT$36 billion, roughly US$1.1 billion, on a new missile system dubbed 'Strong Bow,' with deliveries beginning in 2028. The announcement was one of the lead defense items across Taiwan's major dailies this week, alongside separate concerns about Taiwan's shortage of computing power and electricity needed to pursue sovereign AI capacity. The investment signals continued acceleration of Taipei's asymmetric deterrence buildup amid persistent cross-strait pressure from Beijing.","source":"Focus Taiwan (CNA)","url":"https://focustaiwan.tw/society/202609010004"}]},"europe":{"ukraineRussia":[{"headline":"Russian Missile Strike on Kyiv Railway Depot Kills Seven Overnight","body":"A Russian ballistic missile attack early September 1 hit a railway depot and adjacent rail facilities in Kyiv, killing seven people, six of them railway workers, according to Ukrainian officials. The strike adds to a string of attacks on Ukraine's rail network, which Kyiv relies on heavily for troop movement, evacuations, and civilian transport as the war grinds into its fifth year. Zelensky separately enacted a National Security and Defense Council decision ordering resilience plans for regions and heating-season preparations in Kyiv ahead of winter.","source":"Ukrinform","url":"https://www.ukrinform.net/block-lastnews"},{"headline":"Fresh Aerial Barrage Wounds Children in Kyiv's Solomianskyi District","body":"Russia launched another overnight aerial assault on the Ukrainian capital, injuring at least four people, including two children, in Kyiv's Solomianskyi district as of 2 a.m. local time on September 1. The attack came just hours after a separate deadly missile strike on rail infrastructure in the city, underscoring the intensity of Moscow's continued bombardment campaign even as diplomatic tracks remain stalled. Ukrainian officials also flagged a suspicious factory fire in Poland this week that may be linked to a foreign intelligence operation targeting drone supply chains feeding Kyiv's front lines.","source":"Kyiv Post","url":"https://www.kyivpost.com/thread/83452"}],"europe":[{"headline":"Poland Opens Terrorism Probe Into Fire at Drone Factory Supplying Ukraine","body":"Polish prosecutors launched a terrorism investigation after a fire broke out just after midnight on August 31 at a WB Electronics facility that manufactures drone components for both the Polish and Ukrainian militaries. Authorities say the blaze was deliberately set and are examining whether a foreign intelligence service, widely suspected to be Russian, orchestrated the sabotage, though no suspects have been named publicly. The incident adds to a summer-long pattern of hybrid attacks across NATO's eastern flank, including drone incursions into Latvian and German airspace, that have put alliance members on edge about Russian gray-zone warfare against European defense-industrial targets.","source":"Kyiv Post","url":"https://www.kyivpost.com/thread/83452"},{"headline":"France's Bond Risk Premium Nears 2012 Crisis Levels Ahead of 2027 Vote","body":"With France's presidential election still eight months away, investors are already punishing French assets: the spread between French and German 10-year borrowing costs has climbed near its highest level since the eurozone sovereign debt crisis of 2012. Stock and corporate-debt markets are also underperforming European peers as political instability, a fragmented National Assembly, and a public debt load exceeding 110% of GDP fuel doubts about Paris's ability to control its deficit. The fiscal strain, layered atop chronic government turnover since Macron's 2024 snap election gamble, has become the defining economic worry for the eurozone's second-largest economy.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-09-01/france-s-2027-election-is-already-placing-assets-under-pressure"}]},"middleEast":[{"headline":"Israeli Strikes and Ground Clashes Kill Civilians Across Gaza","body":"A wave of Israeli strikes hit Gaza City's Rimal and Al Katiba neighborhoods on September 1, with the director of Al Shifa Hospital reporting a woman and two children killed and eight others wounded; witnesses counted at least 15 separate strikes in Al Katiba alone. Separately, an Israeli commando raid targeting a Hamas unit touched off firefights, with conflicting reports on whether Israeli forces clashed directly with Hamas fighters or Israeli-linked local militiamen. Another child was killed by Israeli gunfire east of Deir al-Balah the same day, per Palestinian medical sources, as the fragile ceasefire framework continues to fray.","source":"The National","url":"https://www.thenationalnews.com/news/mena/2026/09/01/series-of-strikes-hit-gaza-amid-reports-of-commando-operation-and-clashes/"},{"headline":"Settler Arson Attack Targets West Bank Mosque as Netanyahu Marks School Year","body":"Israeli settlers were reported to have carried out an arson attack on a mosque in the Palestinian village of Bazzaryah in the West Bank on September 1, leaving Hebrew graffiti at the scene. The attack came the same day Prime Minister Benjamin Netanyahu visited schoolchildren in Ramla to mark the start of Israel's academic year, highlighting the jarring contrast between normalcy inside Israel and escalating settler violence in the occupied territories. Rights monitors have logged a rising tempo of such incidents in the West Bank throughout the year.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-september-1-2026/"},{"headline":"Iran's Pezeshkian Signals Openness to US Talks as Sanctions Squeeze Economy","body":"Iranian President Masoud Pezeshkian is reportedly leaving the door open to renewed talks with Washington even as Iran's economy continues to reel under sanctions pressure, according to regional reporting out of the Gulf. The signal comes amid heightened tension in the Strait of Hormuz, where reports surfaced of strikes on two supertankers, underscoring how maritime security risks tied to the broader Iran standoff remain elevated. Tehran's economic distress is increasingly seen as a lever that could push it back toward the negotiating table despite continued rhetorical defiance.","source":"The National","url":"https://www.thenationalnews.com/news/mena/2026/09/01/series-of-strikes-hit-gaza-amid-reports-of-commando-operation-and-clashes/"}],"techAI":{"aiCompetition":[{"headline":"Pentagon Launches GenAI.mil, Cuts Out Anthropic Over Supply-Chain Concerns","body":"The Defense Department stood up GenAI.mil, a secure new portal giving roughly 3 million personnel access to OpenAI's government-tailored ChatGPT Mil, xAI's Grok for Government, and Google's Gemini, with 1.7 million users already onboarded within hours of launch. Notably missing is Anthropic's Claude, after the Trump administration flagged the model as a supply-chain risk. The rollout shows how deeply frontier AI vendors are now embedded in Pentagon procurement politics, with Elon Musk's xAI winning equal footing to OpenAI despite past contract disputes.","source":"TechCrunch","url":"https://techcrunch.com"},{"headline":"Anthropic Eyes September IPO as It Pulls Ahead of OpenAI on Revenue","body":"Anthropic is reportedly moving toward a public listing as early as this month, which would make it the first of the two leading AI labs to go public, according to people familiar with the plans. Its annualized revenue reached roughly 74.3 billion dollars by late July versus OpenAI's 41.3 billion dollars, a gap driven largely by Claude Code's dominance in AI coding tools. The planned listing caps a year in which Anthropic overtook OpenAI on both revenue and private valuation metrics, even as OpenAI contends with executive departures and mounting product-liability litigation.","source":"Dealroom News","url":"https://dealroom.co/news/147131-openai-reboots-as-anthropic-pulls-ahead-with-ipo-planned-for-september/"}],"cyberEmerging":[{"headline":"China-Linked 'Fire Ant' Group Expands Espionage Into Cisco Routers","body":"Incident-response firm Sygnia disclosed that a China-nexus espionage actor tracked as Fire Ant has widened a long-running campaign beyond VMware hypervisors to compromise Cisco IOS XR routers, TACACS authentication servers, and Linux management hosts on high-value networks. By burrowing into the systems that route, authenticate, and log traffic, the group can steal credentials while blinding security monitoring on the networks it penetrates. The campaign adds to growing concern about Beijing's ability to maintain quiet, long-term footholds inside U.S. and allied critical infrastructure.","source":"The Hacker News","url":"https://thehackernews.com/"},{"headline":"Ransomware Crew Weaponizes Cursor AI Coding Assistant in Live Attacks","body":"Researchers at CloudSEK and Gambit Security found that operators of the Aurora ransomware strain used SpaceX's Cursor AI coding assistant to plan intrusions in Russian, targeting more than 20 organizations across nine countries between April and July, with four victims already posted to Aurora's leak site. Exposed attacker infrastructure revealed months of tooling, shell histories, and an encryptor. The disclosure lands just days after more than 100 tech and cybersecurity firms, including OpenAI, Anthropic, and Google, signed a joint letter warning that AI-enabled cyberattacks are about to become far more widespread and sophisticated.","source":"The Hacker News","url":"https://thehackernews.com/"}]},"cities":{"lasVegas":[{"headline":"Nevada's Economy Cools as Vegas Tourism Softens","body":"Nevada Business Magazine's September indicators show the state added 3,800 jobs in June and unemployment edged down to 5.1 percent, keeping Nevada atop the nation in job-growth rate over the past year. But Clark County's tourism engine is sputtering: air passenger traffic fell 8.4 percent, a decline tied partly to the collapse of Spirit Airlines, even as June gaming revenue ticked up 0.8 percent year-over-year. National GDP growth also slowed to a 1.5 percent annualized rate in the second quarter, adding pressure on a Las Vegas economy still leaning on visitor spending.","source":"Nevada Business Magazine","url":"https://nevadabusiness.com/2026/09/business-indicators-september-2026/"},{"headline":"Charter Finalizes Cox Buyout, Spectrum Set to Rebrand Nevada Cable","body":"Charter Communications has closed its acquisition of Cox Communications, and the combined company says the Spectrum brand will formally take over Cox's Nevada footprint in mid-September. Charter CEO Chris Winfrey framed the deal as necessary scale to compete with national and global entertainment and connectivity rivals. Separately, Nevada's Governor's Office of Economic Development approved more than $17.6 million in new tax abatements for businesses statewide, part of a broader push to diversify the economy beyond gaming and tourism.","source":"Nevada Business Magazine","url":"https://nevadabusiness.com/2026/09/around-the-state-september-2026/"},{"headline":"Las Vegas Police Log 11th Officer-Involved Shooting of 2026","body":"The Las Vegas Metropolitan Police Department is investigating its 11th officer-involved shooting of the year, part of a violent late-summer stretch that has also included two separate fatal pedestrian collisions along South Nellis Boulevard and a murder-suicide case. Detectives separately announced an arrest in a political sign vandalism case, a reminder that tensions are already rising ahead of Nevada's 2026 election cycle, which will decide the governor's race and control of the Nevada Assembly, currently split 27 Democrats to 14 Republicans.","source":"Las Vegas Metropolitan Police Department","url":"https://www.lvmpd.com/"}],"nellis":[{"headline":"Nellis Rebrands Public Identity as 'Air Force Warfare Center'","body":"Nellis Air Force Base's public-facing social media and web presence has shifted to identify as the U.S. Air Force Warfare Center, catching many Las Vegas locals off guard. Base officials clarified to local media that the installation's name and location are not changing, and that the move is a branding update meant to reflect that the Warfare Center serves as higher headquarters for multiple wings and test units spread across the Nellis complex, including assets tied to the Nevada Test and Training Range. Officials said the change lets the base better showcase the full scope of its warfighting and weapons-testing mission set beyond the base's own fence line.","source":"KTNV Las Vegas","url":"https://www.ktnv.com/news/nellis-air-force-base-now-publicly-identifying-as-us-air-force-warfare-center"}]},"feelGood":[{"headline":"Bronx Pizza Shop Owner Feeds Anyone Who Is Hungry, No Questions Asked","body":"After spotting a woman eating out of a trash can near his Bronx storefront, a pizza shop owner gave her a fresh slice on the spot and has since pledged to feed anyone in need who comes through his door without requiring them to ask or explain themselves. The gesture has resonated online as a small but concrete example of neighborhood-level generosity toward the city's homeless and food-insecure residents.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Vacationing Aussies Stop to Fix Stranded Thai Workers' Excavator","body":"Two Australian tradesmen on holiday in Thailand noticed a local crew struggling to get a massive excavator running again and put their vacation on hold to help troubleshoot and repair the machine. The impromptu roadside assist let the Thai workers get back to their job, turning a chance encounter between strangers from different countries into a small act of skilled generosity.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Golden Retriever Found Alive After Three Days Buried in a Landslide","body":"A family that had given up hope of finding their golden retriever alive after a landslide buried the dog heard a faint bark rising from beneath the mud and debris three days later, leading to a dramatic rescue and reunion. The recovery, shared widely as a story of persistence and hope, underscores how search efforts for beloved pets can pay off even after they seem lost for good.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1939","event":"Germany invaded Poland, marking the start of World War II in Europe."},{"year":"1983","event":"Soviet fighter jets shot down Korean Air Lines Flight 007, killing all 269 people aboard."},{"year":"1985","event":"A joint US-French expedition located the wreck of the RMS Titanic in the North Atlantic."},{"year":"2004","event":"Chechen separatists took hundreds hostage at a school in Beslan, Russia, beginning a deadly three-day siege."}]},"topPicks":[{"headline":"Army Secretary Dan Driscoll Resigns Amid Bitter Clash With Hegseth","teaser":"A top Pentagon leadership rupture threatens to derail the Army's modernization plans amid internal turmoil."},{"headline":"US-Iran Military Confrontation Grinds Into Sixth Month as Pentagon Loses Key Leader","teaser":"A prolonged US-Iran standoff deepens just as the Pentagon faces a critical leadership vacuum."},{"headline":"France's Bond Risk Premium Nears 2012 Crisis Levels Ahead of 2027 Vote","teaser":"Rising French borrowing costs signal mounting political and fiscal instability ahead of a pivotal election."}]},"navDates":[{"key":"2026-09-02","label":"Sep 2","href":"/","isNewest":true},{"key":"2026-09-01","label":"Sep 1","href":"/archive/2026-09-01.html","isNewest":false},{"key":"2026-08-31","label":"Aug 31","href":"/archive/2026-08-31.html","isNewest":false},{"key":"2026-08-30","label":"Aug 30","href":"/archive/2026-08-30.html","isNewest":false},{"key":"2026-08-29","label":"Aug 29","href":"/archive/2026-08-29.html","isNewest":false},{"key":"2026-08-28","label":"Aug 28","href":"/archive/2026-08-28.html","isNewest":false},{"key":"2026-08-27","label":"Aug 27","href":"/archive/2026-08-27.html","isNewest":false}],"currentKey":"2026-09-01","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-09-01.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
