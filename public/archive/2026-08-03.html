<script>
const STATE = {"digest":{"date":"Monday, August 3, 2026","generatedAt":"Mon, Aug 3, 6:15 AM PDT","breaking":{"headline":"Trump Says Iran Talks to Resume Monday, Pausing Threatened Mega-Strikes","body":"President Trump announced that a new round of negotiations to wind down the Iran war would begin Monday afternoon, after he held off from launching a previously threatened wave of massive US airstrikes on the country. The talks are aimed at ending the conflict and reopening cargo traffic through the Strait of Hormuz, a corridor that historically carried roughly one-fifth of globally traded oil and gas before the war disrupted shipping. Tehran's foreign ministry publicly denied it is currently negotiating with Washington, a sign the diplomatic opening remains fragile. The de-escalation bid comes as Iran reportedly moves T-72 tanks toward its southern border amid speculation about a US ground contingency, and as Pentagon casualty trackers list roughly 18 Americans killed and 685 wounded in the campaign so far.","source":"The American Legion","url":"https://www.legion.org/information-center/news/security/2026/august/five-things-to-know-aug-3-2026"},"tabs":{"defense":{"defense":[{"headline":"Army Stands Up 'Reveille Forge' to Fast-Track New Combat Tech","body":"The US Army has opened Reveille Forge, a new permanent integration facility at Redstone Arsenal, Alabama, built to speed the testing and fielding of next-generation defense systems directly to warfighters. The facility signals the Army's push to shrink the gap between prototype and battlefield deployment for emerging technologies, part of a broader modernization drive under way this summer. It joins other recent Army innovation initiatives aimed at cutting bureaucratic lag time in getting new equipment into soldiers' hands.","source":"The Defense Post","url":"https://thedefensepost.com/"},{"headline":"Pentagon's Dueling Casualty Lists Muddy True Toll of Iran War","body":"The Department of Defense is tracking Iran war casualties through two separate and inconsistent databases, one for what was designated Operation Epic Fury and a newer 'Overseas Operations' category, after officials quietly removed several recently killed soldiers from the original tally in late July. Combined, the two lists now show 18 US troops killed and 685 wounded as of the past week, though the shifting categorization has fueled questions about transparency in reporting. The discrepancy comes as analysts warn that diminished US interceptor stockpiles are raising risk, and as Yemen-linked threats to shipping resurface alongside a drone strike on US-linked gas storage facilities in Egypt.","source":"SOF News","url":"https://sof.news/update/20260803/"},{"headline":"Australia Makes Missile Production a Top 2026 Defense Priority","body":"Australia has elevated domestic missile manufacturing to a centerpiece of its 2026 defense strategy, emphasizing that weapons like the Joint Strike Missile, Naval Strike Missile, GMLRS, and PrSM must be certified for compatibility with US and allied fire-control and sustainment systems to be useful in wartime. Canberra is also targeting component-level supply chain weaknesses exposed by the wars in Ukraine and the Middle East. The push is framed explicitly around deterrence in the Indo-Pacific and reinforcing interoperability with US forces through the first island chain.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/australia-makes-missile-production-a-2026-defense-priority-for-indo-pacific-deterrence"}],"acquisitions":[{"headline":"SpaceX Adds $1.6B Pentagon Deal, Topping $7B in 2026 Awards","body":"SpaceX has won a $1.6 billion Pentagon contract under the National Security Space Launch Phase 3 program, the largest single batch of missions announced under that effort, pushing the company's 2026 Defense Department contract total past $7 billion. Recent awards include $4.6 billion for an airborne moving target indicator system and $2.29 billion for a communications satellite network linking missile-warning sensors to interceptors, both tied to the Golden Dome missile defense program with an estimated total cost of $185 billion. The deals underscore SpaceX's expanding role as a primary contractor for the Pentagon's next-generation space and missile-defense architecture.","source":"American Bazaar","url":"https://americanbazaaronline.com/2026/07/31/spacex-wins-1-6-billion-pentagon-contract-to-enhance-airborne-combat-capabilities/"},{"headline":"Pentagon's $135B Single-Day Haul Locks In Submarines and Patriots","body":"In one of the largest one-day contract announcements in recent memory, the Pentagon on July 29 committed roughly $135 billion combined to General Dynamics Electric Boat and HII Newport News Shipbuilding for nine Virginia-class attack submarines and five Columbia-class ballistic-missile submarines, alongside a separate award to Lockheed Martin. Lockheed's deal converts an earlier one-year, $4.7 billion Patriot interceptor agreement into a seven-year, up-to-$58.6 billion production framework spanning fiscal years 2026 through 2032. The twin awards reflect the Pentagon's effort to lock in years of shipbuilding and air-defense capacity amid strained interceptor inventories and a stretched submarine industrial base.","source":"Sirotin Intelligence Briefing","url":"https://www.sirotinintelligence.com/sirotin-intelligence-briefing-july-27-august-1-2026-pentagon-awards-135-billion-in-mega-contracts-in-a-single-day-usspacecom-codifies-the-2040-space-fight-and-washington-tears-down-laun/"}]},"us":[{"headline":"Triple-Fatal Shooting at New Idaho In-N-Out Reignites Gun Control Fight","body":"A gunman opened fire at a newly opened In-N-Out in Twin Falls, Idaho on Saturday, August 1, during the Saturday lunch rush, killing three people and wounding seven more, two of whom remained in critical condition into Sunday. The restaurant had been open only eight days when the attack occurred, and one of the dead was an employee working that shift. The shooting has immediately reignited the national gun-control debate on Capitol Hill and social media even before authorities finished notifying victims' families.","source":"The Conservative Treehouse","url":"https://theconservativetreehouse.com/blog/2026/08/03/august-3rd-2026-presidential-politics-trump-administration-day-561/"},{"headline":"White House Tells Congress It Will Slow-Walk $400 Million in Unspent Ukraine Aid to 2029","body":"The Trump administration has notified lawmakers that it cannot spend roughly $400 million in previously appropriated military assistance for Ukraine within the original timeframe, effectively pushing the disbursement window out to 2029. The move, disclosed in budget notifications over the weekend, signals a further slowdown in the pace of U.S. military support for Kyiv even as the administration focuses its diplomatic bandwidth on the Iran crisis and Middle East negotiations. Congressional appropriators are expected to scrutinize the delay given ongoing fights over the broader defense and foreign-aid budget.","source":"Pravda (Trump news aggregator)","url":"https://trump.news-pravda.com/trump/2026/08/03/373720.html"},{"headline":"Fallout Continues From Supreme Court's Term-Ending Expansion of Presidential Power","body":"Legal analysts are still parsing the Supreme Court's late-June rulings as the 2025-26 term formally closed, most notably Trump v. Slaughter, a 6-3 decision that gave the president broad authority to fire commissioners at independent agencies like the FTC without cause. The same term also produced Mullin v. Al Otro Lado, a 6-3 ruling allowing border officials to turn away asylum seekers at capacity-strained ports of entry, reshaping executive authority over immigration enforcement. Commentators note the combined effect further tilts the separation-of-powers balance toward the executive branch heading into the 2026 midterm year.","source":"Al Jazeera / CPUSA legal analysis","url":"https://www.aljazeera.com/news/2026/6/30/us-supreme-court-hands-trump-3-1-defeat-in-key-rulings-what-we-know"},{"headline":"Texas-California Redistricting Fight Still Shadows 2026 Midterm Map","body":"The legal battle over Texas's Trump-backed mid-decade congressional remap remains unresolved heading into the fall campaign, after a three-judge federal panel blocked the GOP's five-seat gain map and ordered the state to use 2021 lines for now, a ruling Texas has appealed. California's countervailing legislative remap, engineered by Governor Gavin Newsom to offset Texas Republicans, continues to move through the courts in parallel, with both sides' maps still in legal limbo just months before ballots are finalized. The unresolved fight leaves House control in 2026 partly hostage to ongoing litigation rather than settled district lines.","source":"The Texas Tribune","url":"https://www.texastribune.org/2025/11/18/texas-redistricting-ruling-lawsuit-el-paso-court-2026-midterms/"}],"pacific":{"pacificCommand":[{"headline":"Japan-Philippines Military Logistics Pact Set to Take Effect August 22","body":"Tokyo and Manila exchanged diplomatic notes on July 23 finalizing entry into force of their Acquisition and Cross-Servicing Agreement (ACSA), which will let the Self-Defense Forces and the Armed Forces of the Philippines share fuel, transport, and other supplies starting August 22. The pact, signed in January by Japan's and the Philippines' top diplomats, formalizes a logistics framework that underpins the two countries' expanding joint patrols and exercises in waters near contested South China Sea features. It marks another step in Tokyo's deepening security role in Southeast Asia alongside its alliance with Washington.","source":"Manila Times","url":"https://www.manilatimes.net/2026/07/28/news/national/ph-japan-defense-pact-takes-effect-in-august/2392337"},{"headline":"Seoul Orders Border-Wide Weapons Review After Guard Post Lapse","body":"South Korea's army is conducting a service-wide inspection of frontline guard operations after it emerged that machine guns at outposts facing North Korea had been ordered unloaded, prompting the Joint Chiefs to mandate that all crew-served weapons at the DMZ remain loaded going forward. Separately, the military is investigating a July 31 incident in which frontline units nearly engaged a U.S. reconnaissance drone during a joint KMEP exercise after a communications breakdown triggered a civilian alert near the border. The back-to-back episodes have raised fresh questions about readiness and U.S.-Korea coordination along one of the world's most militarized frontiers.","source":"NK News / Korea JoongAng Daily","url":"https://www.nknews.org/2026/07/south-korean-army-to-conduct-mass-review-of-weapons-at-border-with-north-korea/"},{"headline":"South Korea Greenlights First Homegrown Aegis Destroyer Program","body":"After a month of negotiations, South Korea's Defense Acquisition Program Administration finalized a deal to design and build the country's first domestically developed Aegis-class warships, with the lead ship slated to enter service in 2032. The program reflects Seoul's push to reduce reliance on foreign-built air-defense combatants amid North Korea's accelerating naval buildup, including Pyongyang's new Choe Hyon-class destroyers touted as steps toward a nuclear-armed navy. The move comes as South Korea also weighs sending reconnaissance assets toward the Strait of Hormuz to balance alliance commitments against regional risk.","source":"Korea JoongAng Daily","url":"https://www.koreajoongangdaily.com/korea/defense"}],"pacingThreat":[{"headline":"PLA Stages Air-Sea Drills Near Scarborough Shoal After Philippine Seabed Claim","body":"China's military conducted joint naval and air exercises near Scarborough Shoal on August 1, testing coordination between air and sea forces and rapid-reinforcement procedures, according to state broadcaster CCTV. The PLA's Southern Theatre Command framed the drills as a response to what Beijing called an 'illegal' Philippine attempt to extend seabed rights off Palawan and formalize claims to the shoal. The exercise underscores how quickly Beijing is willing to match Manila's legal and administrative moves with military signaling in the contested waterway.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3362628/pla-stages-south-china-sea-drills-days-after-illegal-philippine-territorial-bid"},{"headline":"PLA Jet Sorties Near Taiwan Hit Three-Year Low in First Half of 2026","body":"Open-source tracking shows PLA fighter sorties near Taiwan fell to their lowest level in three years during the first half of 2026, with a record number of days registering zero detected PLA aircraft and no large-scale encirclement drill staged around the island for the first time since 2022. Analysts note the pattern is a striking reversal from the near-daily incursions that became routine after then-Speaker Nancy Pelosi's 2022 Taipei visit. The lull comes even as PLA activity data published daily by Taiwan's Ministry of National Defense continues to show routine naval and ADIZ incursions, including seven PLAN vessels tracked around the island as of this morning.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3361605/why-pla-fighter-jet-sorties-near-taiwan-dropped-3-year-low-first-half-2026"},{"headline":"Taiwan's Legislature Deadlocked Over $6.5 Billion Drone Procurement Bill","body":"Taiwan's opposition-controlled Legislative Yuan has blocked the ruling Democratic Progressive Party's special budget bill to fund roughly NT$210 billion (about $6.5 billion) in domestic drone procurement running from August 2026 through 2031, with the KMT and Taiwan People's Party instead pushing to route funding through the regular annual budget process. The standoff highlights how domestic political gridlock, not just cross-strait pressure, is complicating Taipei's efforts to build up asymmetric drone capabilities seen as central to deterring a PLA blockade or invasion scenario. The dispute comes amid a broader internal PLA purge and ideological crackdown that Beijing watchers say could affect Xi Jinping's near-term military timelines.","source":"American Enterprise Institute (ISW-CDOT)","url":"https://www.aei.org/articles/china-taiwan-update-july-2-2026/"}]},"europe":{"ukraineRussia":[{"headline":"Cross-Border Strikes Kill 14 as Kyiv Warns of Patriot Shortage","body":"Russian and Ukrainian long-range strikes killed at least 14 people combined over the weekend, with Ukrainian drones hitting Russian oil hubs and residential high-rises while Moscow pounded Kyiv with ballistic missiles. President Zelensky used the attacks to renew warnings that Ukraine faces a critical shortage of Patriot interceptors needed to protect its cities. The exchange underscores how both sides continue to escalate deep-strike campaigns even as diplomatic attention is consumed by the Iran crisis.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/8/2/ukrainian-drone-attacks-kill-eight-in-response-to-russian-missiles"},{"headline":"Zelensky Tallies Record Weekly Barrage: 1,900 Drones, 144 Missiles","body":"President Zelensky reported that in the past week alone Russia hit 16 Ukrainian regions with roughly 1,900 drones, nearly 1,600 aerial bombs and 144 missiles, including ballistic types, aimed largely at civilian and energy infrastructure. Ukrainian officials and rights groups say the intensity and targeting pattern of the barrage raise concerns about violations of international law. The disclosure comes amid a broader summer surge in long-range strikes on both capitals, complicating any near-term push for a ceasefire.","source":"Mezha","url":"https://mezha.net/eng/bukvy/749ae1c2_zelensky_reports_russia/"}],"europe":[{"headline":"Allies Bank $139 Billion Defense Spending Surge as Ukraine Aid Locked In Through 2027","body":"Following the Ankara summit, NATO says European allies and Canada have added more than 139 billion dollars in core defense investment since last year's Hague pledge to hit 5 percent of GDP by 2035. Leaders also committed 70 billion euros in military aid and training for Ukraine this year, with an equivalent package promised for 2027, while debate continues over a formal membership track for Kyiv. The declaration also flagged Iran's nuclear program and Strait of Hormuz navigation rights as alliance-wide security concerns, tying European defense planning directly to the ongoing Gulf crisis.","source":"NATO","url":"https://www.nato.int/en/news-and-events/events/2026/07/overview---2026-nato-summit-in-ankara-"},{"headline":"Wildfires Force Mass Water-Bombing Response Across Greece","body":"Greek authorities have scrambled water-bombing aircraft as wildfires spread across the country amid an intensifying summer heatwave, the latest in a string of fire emergencies that have become an annual test of European civil-protection capacity. The fires add pressure on EU coordination mechanisms for cross-border firefighting aid, a recurring flashpoint given climate-driven fire seasons stretching from Iberia to Greece each summer. Local officials are assessing damage to homes and forestland as crews battle blazes near populated areas.","source":"Arab News","url":"https://www.arabnews.com/middleeast"}]},"middleEast":[{"headline":"Israeli Strikes Continue in Gaza as Minister Rules Out Halt","body":"Israeli strikes in Gaza pushed the Palestinian death toll higher over the weekend, with an Israeli minister explicitly stating there is no agreement in place to stop the attacks. The statement undercuts periodic reports of ceasefire progress and suggests operations will continue despite ongoing international mediation efforts. The continued fighting also compounds hardship for Gaza's population as basic services remain degraded amid the extended conflict.","source":"Arab News","url":"https://www.arabnews.com/middleeast"},{"headline":"Explosive Device Hits Lebanese Army Vehicle, Blame Falls on Hezbollah","body":"A bomb detonated in a Lebanese army vehicle in the Kfar area outside the UN-patrolled security zone, with Israeli officials denying responsibility and instead attributing the device to Hezbollah. The incident adds friction to already tense efforts to enforce Hezbollah's disarmament south of the Litani River under the ceasefire framework brokered after the 2024 war. Beirut has yet to issue a full account of casualties or damage from the blast.","source":"Profile News","url":"https://www.profilenews.com/en/breaking-news-live-3/"},{"headline":"Israel Jails 14 Soldiers Over Sde Teiman Detention-Facility Walkout","body":"Fourteen Israeli soldiers have been sentenced to military prison for staging an unauthorized walkout at the Sde Teiman detention facility, a site that has faced repeated allegations over treatment of Palestinian detainees held during the Gaza war. The sentencing highlights simmering internal discipline problems within the IDF as reservists and career soldiers push back against extended deployments and facility conditions. The case is likely to renew scrutiny of detainee treatment practices at Sde Teiman amid ongoing international criticism.","source":"Al Jazeera","url":"https://www.aljazeera.com/middle-east/"}],"techAI":{"aiCompetition":[{"headline":"OpenAI's Astra Model Cracks Ten Unsolved Math Problems","body":"On August 1, OpenAI revealed that an internal build of its upcoming Astra model solved ten previously open problems in mathematics and theoretical computer science, publishing formal machine-verified proofs on GitHub. Among the results is a proof establishing the existence of non-sofic groups, a long-standing question in group theory, plus improved sphere-packing bounds. Fields Medalist Timothy Gowers reportedly said he would back one of the proofs for publication in a top journal without reservation, a notable milestone for AI moving from task execution to original research. For a Las Vegas reader tracking the AI race, this signals labs are now producing verifiable scientific output, not just chatbot benchmarks, raising the stakes for US-China competition in fundamental research capability.","source":"Build Fast with AI","url":"https://www.buildfastwithai.com/blogs/ai-news-today-august-2-2026"},{"headline":"Beijing's State Fund Bankrolls Rival AI Labs Moonshot and DeepSeek","body":"China's National AI Industry Investment Fund has emerged as lead backer of both Moonshot AI, which closed a $3.5 billion round on July 29 valuing it at $35 billion, and DeepSeek, which is negotiating fresh capital at a valuation as high as $71 billion after raising $7.4 billion in June. Moonshot's valuation has roughly tripled in six months, fueled by its Kimi K3 model, a 2.8-trillion-parameter system that triggered a tech selloff and was hailed as another 'DeepSeek moment' for closing the gap with US frontier labs. The pattern shows Beijing deliberately cultivating multiple national champions rather than picking one winner, a strategic hedge that intensifies compute and talent competition with US labs like OpenAI and Anthropic.","source":"Bloomberg / Yahoo Finance","url":"https://finance.yahoo.com/technology/ai/articles/moonshot-ai-3-5-billion-072537342.html"}],"cyberEmerging":[{"headline":"Critical Flaw in Popular AI Agent Platform Ruflo Rated Maximum Severity","body":"Security researchers at Noma Labs disclosed CVE-2026-59726, dubbed 'RufRoot,' a CVSS 10.0 vulnerability in Ruflo, an open-source AI agent platform with more than 67,000 GitHub stars. A single unauthenticated HTTP request to the platform's MCP bridge on port 3001 could let attackers execute code and steal LLM API keys, exposing roughly 233 connected tools. The flaw underscores growing risk in the rapidly expanding Model Context Protocol ecosystem that connects AI agents to external systems, a soft spot defense and intelligence agencies are watching closely as they weigh adoption of agentic AI tools.","source":"The Hacker News (via AI Weekly)","url":"https://aiweekly.co/ai-news-today"},{"headline":"EU AI Act Transparency Rules Take Effect, Though Reports Overstate Scope","body":"As of August 2, new EU AI Act transparency obligations formally kick in, requiring disclosure of AI interactions and labeling of synthetic content such as deepfakes, images, video and audio, alongside expanded enforcement powers for the bloc's AI Office and national regulators. Contrary to widespread reporting, the higher-stakes Annex III high-risk system obligations were not triggered this week; the EU's Digital Omnibus has pushed those requirements to December 2027, with Annex I obligations delayed until August 2028. The distinction matters for US firms and policymakers gauging how aggressively Brussels is actually regulating general-purpose AI systems this year versus later.","source":"Champaign Magazine (AI Weekly Top 5)","url":"https://champaignmagazine.com/2026/08/02/ai-by-ai-weekly-top-5-july-27-august-2-2026/"}]},"cities":{"lasVegas":[{"headline":"Extreme Heat Warning Stretches Into New Week Across Southern Nevada","body":"The National Weather Service has extended its excessive heat warning for the Las Vegas valley through Wednesday evening, with highs near 116 in Las Vegas and 118 in Henderson. Hospitals across Clark County report a steady stream of heat-stroke patients, and Red Rock Search and Rescue has flagged a surge in distress calls from hikers underestimating the danger. Fire crews from Southern Nevada have also been dispatched north to help battle the Ward Fire burning nine miles southwest of Ely.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Animal Foundation Declares Capacity Crisis, Pleads for Adoptions","body":"The Animal Foundation, Nevada's largest shelter, moved into a critical 'red' capacity zone over the weekend and is urging valley residents to adopt or foster dogs and cats immediately. The shelter's appeal comes as summer heat and economic pressures have driven a wave of surrenders across Clark County. Officials say without a quick surge in adoptions, the shelter may be forced into difficult triage decisions.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Nevada Officials Prepare to Fight Federal Colorado River Plan","body":"Nevada leaders are bracing for a legal battle after the federal government released a roughly 1,600-page final environmental review dictating how the Colorado River will be managed for the next decade, with Nevada facing some of the steepest water-supply cuts in the state's history. State officials have signaled they are prepared to sue to protect Nevada's allocation as Lake Mead levels remain a persistent worry. The plan is expected to reshape water policy discussions heading into the 2026 legislative cycle.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Triple-Digit Heat Tests Nellis Flightline Operations","body":"Nellis Air Force Base recorded a high near 117 degrees Monday as the Southern Nevada excessive heat warning, extended through Wednesday, bakes the base alongside the rest of the valley. Ground crews from units like the 757th Aircraft Maintenance Squadron are adjusting flightline schedules and hydration protocols to keep F-35 and other fifth-generation training sorties on pace despite the heat. The extreme conditions add strain to an already high operational tempo following recent large-scale exercises testing rapid aircraft turnaround at the base.","source":"Las Vegas Sun / Nellis AFB weather data","url":"https://lasvegassun.com/news/2026/aug/01/nv-forecast/"}]},"feelGood":[{"headline":"Nine-Year-Old Hands Over His Life Savings After Dad's Truck Is Destroyed by Lightning","body":"Utah resident Casey Pettus walked away unharmed after a lightning bolt turned his truck into a burned-out shell on a highway, but the real story unfolded later that day when his nine-year-old son quietly offered up his entire savings to help his father recover. The gesture, born purely from a child's instinct to help, has moved thousands of readers since it surfaced this week. It's a small reminder that generosity often shows up first in the people who have the least to give.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"A Stranger's 'Yes' Turns Into an Unexpected Friendship","body":"A chance encounter between two women, identified only as Dara and Abigail, began with an awkward request from a stranger and ended in a bond neither expected. What started as a rough day for one of them turned into a lasting friendship after the other simply agreed to help. The story, circulating this week, is being held up as proof that small acts of trust between strangers can reshape someone's entire outlook.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Volunteer Birder's Patient Rescue Saves an Injured Bird Named Mei Mei","body":"After spending hours tracking an injured bird nicknamed Mei Mei, a dedicated local birder finally managed to gently net her to safety, ending a prolonged rescue effort highlighted in Best Friends Animal Society's latest magazine. The rescue is one of several recent stories the nonprofit is spotlighting to show how ordinary volunteers are stepping up for vulnerable animals. Best Friends says such community-driven efforts remain central to its national push toward no-kill animal welfare.","source":"Best Friends Animal Society","url":"https://bestfriends.org/stories/best-friends-magazine/spreading-kindness-animals-every-day"}],"onThisDay":[{"year":"1492","event":"Christopher Columbus set sail from Spain on his first voyage across the Atlantic Ocean."},{"year":"1914","event":"Germany declared war on France, widening the conflict at the start of World War I."},{"year":"1958","event":"The USS Nautilus became the first submarine to reach the North Pole while traveling underwater."},{"year":"1960","event":"Niger gained independence from France."}]},"topPicks":[{"headline":"Trump Says Iran Talks to Resume Monday, Pausing Threatened Mega-Strikes","teaser":"A diplomatic reset could avert a major military escalation in the Middle East, at least for now."},{"headline":"Pentagon's $135B Single-Day Haul Locks In Submarines and Patriots","teaser":"A massive single-day defense contracting surge signals accelerating US military investment in key weapons systems."},{"headline":"Allies Bank $139 Billion Defense Spending Surge as Ukraine Aid Locked In Through 2027","teaser":"A huge multiyear allied spending commitment reshapes long-term support for Ukraine and Western defense posture."}]},"navDates":[{"key":"2026-08-08","label":"Aug 8","href":"/","isNewest":true},{"key":"2026-08-07","label":"Aug 7","href":"/archive/2026-08-07.html","isNewest":false},{"key":"2026-08-06","label":"Aug 6","href":"/archive/2026-08-06.html","isNewest":false},{"key":"2026-08-05","label":"Aug 5","href":"/archive/2026-08-05.html","isNewest":false},{"key":"2026-08-04","label":"Aug 4","href":"/archive/2026-08-04.html","isNewest":false},{"key":"2026-08-03","label":"Aug 3","href":"/archive/2026-08-03.html","isNewest":false},{"key":"2026-08-02","label":"Aug 2","href":"/archive/2026-08-02.html","isNewest":false}],"currentKey":"2026-08-03","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-03.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
