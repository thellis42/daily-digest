<script>
const STATE = {"digest":{"date":"Tuesday, November 10, 2026","generatedAt":"Tue, Nov 10, 9:01 AM PST","breaking":{"headline":"Rep. Massie Files Impeachment Articles Against Hegseth Over Iran War Conduct","body":"Kentucky Republican Thomas Massie introduced eight articles of impeachment against Defense Secretary Pete Hegseth on Monday, accusing him of launching and sustaining military action against Iran without congressional authorization and of ignoring War Powers Resolution withdrawal deadlines. Hegseth responded with a combative Tuesday morning press conference rejecting the allegations, after which President Trump publicly graded his performance an 'A+++' and reaffirmed his backing. A new poll cited in coverage found roughly seven in ten Americans, including about half of Republicans, now want Congress to vote to end the Iran conflict, signaling the political fight over the war is intensifying even as the Pentagon chief keeps the president's confidence.","source":"CNN","url":"https://cnn.com/2026/11/10/politics/live-news/hegseth-impeachment-congress"},"tabs":{"defense":{"defense":[{"headline":"Air Force Turns Cargo Planes Into Missile Trucks With Palletized FAMM","body":"Air Mobility Command is fitting C-130 Hercules and C-17 Globemaster fleets with a palletized version of the Family of Affordable Mass Munitions, a low-cost, long-range cruise missile designed for modular delivery. AMC commander Lt. Gen. Daniel Tulley told an airlift industry conference the modification could let cargo jets 'deliver mass fires' against enemy targets, effectively adding a strike role to the airlift fleet.","source":"Inside Defense","url":"https://insidedefense.com/insider/insider-daily-digest-november-9-2026"},{"headline":"US Strikes Iran's Qeshm Island as War-Powers Fight Intensifies at Home","body":"The United States carried out an overnight strike on Iran's Qeshm Island, with a provincial official telling Iran's semi-official Fars news agency that no vital infrastructure or services were hit and that targeted sites were away from residential areas. The strike comes as Trump simultaneously said a renewed full-scale campaign against Iran is 'quite unlikely' while keeping the option open if diplomacy with Qatar and Saudi Arabia fails. The mixed signals underscore an unsettled US military posture toward Tehran even as domestic political pressure to end the conflict grows.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-november-9-2026/"},{"headline":"Denmark and Finland Deepen Baltic Defenses With Naval Mine Deals","body":"Denmark and Finland each signed new contracts to acquire Finnish-made BLOCKER sea mines, part of a broader push by Nordic NATO members to harden Baltic Sea approaches against Russian undersea and hybrid threats. The deals add to a string of recent Nordic-Baltic naval procurement moves, including frigate programs, as allies reinforce maritime defenses along NATO's northeastern flank.","source":"The Defense Post","url":"https://thedefensepost.com/"}],"acquisitions":[{"headline":"Marine Corps Buys Textron's Ripsaw M3 Robotic Combat Vehicles","body":"The US Marine Corps has moved to acquire Textron's Ripsaw M3 uncrewed ground vehicles, adding another unmanned platform to its ground combat inventory as the service continues to prioritize robotic and autonomous systems for contested environments. The acquisition reflects the broader Pentagon push to field lower-cost, attritable ground robotics alongside crewed formations.","source":"The Defense Post","url":"https://thedefensepost.com/"},{"headline":"Army Awards $4.17 Billion to 11 Firms to Modernize Ammunition Plants","body":"The US Army awarded a combined $4.17 billion contract to eleven companies to modernize the nation's aging ammunition production base, including facilities like the Iowa Army Ammunition Plant. The investment is aimed at expanding munitions manufacturing capacity amid sustained high demand from Ukraine aid, Middle East operations, and efforts to rebuild depleted stockpiles.","source":"The Defense Post","url":"https://thedefensepost.com/"}]},"us":[{"headline":"Supreme Court Lets Border Wall Construction Resume","body":"The Supreme Court ruled Monday that a lower federal judge lacked authority to halt construction of Trump-era border wall segments, allowing building to proceed while litigation continues. The order came amid what SCOTUSblog described as a busy Monday docket at the Court, with justices also declining to take up unrelated cases tied to the George Floyd protests. The ruling hands the administration an immediate procedural win on one of its signature immigration priorities even as Democrats prepare to take control of Congress in January.","source":"SCOTUSblog / NPR","url":"https://www.scotusblog.com/latest/"},{"headline":"Scalise and Jordan Face Off to Lead Shrunken House GOP","body":"House Republicans meet behind closed doors Tuesday to choose a successor to Speaker Mike Johnson, who is stepping aside after the party's midterm wipeout handed Democrats control of the chamber. The race pits Majority Leader Steve Scalise, 61, who has built his career inside leadership, against Freedom Caucus co-founder Jim Jordan, 62, who is pitching a more combative opposition posture. Whoever wins will lead a conference where roughly 70 percent of members were first elected during Trump's presidency, giving the former president outsized sway over the party's direction heading into 2027.","source":"NPR","url":"https://www.npr.org/2026/11/10/nx-s1-6030988/gop-leadership-election-steve-scalise-jim-jordan"},{"headline":"First Post-Election Inflation Snapshot Lands as Jobs Data Surprises to Upside","body":"A fresh Consumer Price Index report due out Tuesday offers the first look at prices since voters delivered Democrats a sweeping midterm win driven partly by anger over living costs; annual inflation stood at 3.7% in September, up from 3.4% in August. That follows an October jobs report showing employers added 165,000 positions, far above the roughly 65,000 forecasters expected, with unemployment slipping to 4.1% and prior months revised up by a combined 84,000 jobs. Economists say the stronger labor market gives the Federal Reserve more room to focus on taming inflation rather than shoring up employment.","source":"ABC News / OPB","url":"https://abcnews.com/Business/inflation-report-provide-1st-snapshot-prices-midterm-elections/story?id=137970527"},{"headline":"California's Billionaire Tax Measure Fails Despite Democratic Sweep","body":"Even as Democrats rode a wave of midterm victories nationally, California's Proposition 40, a proposed wealth tax targeting billionaires, failed at the ballot box, prompting debate among economists over what the defeat signals for the broader progressive push to tax extreme wealth. The split result suggests voter appetite for new taxes lagged behind broader anti-incumbent sentiment even in a deep-blue state. Analysts say the outcome will likely cool momentum for similar billionaire-tax proposals being floated in other state legislatures next year.","source":"NPR","url":"https://www.npr.org/sections/news/"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Unveils $63M Emergency Cyber Package After Breach Wave","body":"Japan's cabinet approved a 10 billion yen (about $63 million) emergency cybersecurity package on November 6 after a string of unauthorized intrusions and data leaks hit major companies and government agencies, unnerving the public. The Ministry of Economy, Trade and Industry will stand up a specialized 'Top Gun' unit by month's end that will use AI to hunt vulnerabilities before hackers can exploit them, building on Japan's newly legalized 'active cyber defense' authority to access hacker-controlled servers preemptively. The initiative reflects Tokyo's push to reach one of the world's highest cybersecurity tiers amid an increasingly hostile digital threat environment linked to regional rivals.","source":"SecurityWeek / AP","url":"https://www.securityweek.com/japan-announces-emergency-cybersecurity-package-following-a-wave-of-attacks/"},{"headline":"India Fumes Over US F-16 Upgrade Deal for Pakistan","body":"New Delhi has voiced sharp displeasure after Washington moved to upgrade roughly 70 Pakistani F-16 fighters, a step Indian officials argue strengthens Islamabad's nuclear-capable delivery options against India even as the US simultaneously pressures Iran over its nuclear program. The episode has revived longstanding Indian complaints about a double standard in US nonproliferation diplomacy across South Asia. The friction comes as India continues to expand its own Indo-Pacific defense engagements, underscoring Delhi's balancing act between deepening US ties and managing Islamabad-related security anxieties.","source":"Defence Standard","url":"https://defencestandard.com/category/news/"},{"headline":"India and Myanmar Wrap First Joint Disaster-Relief Drill","body":"Indian and Myanmar armed forces concluded Exercise Rahat Mitra in Chennai on November 9, their first-ever joint tri-service humanitarian assistance and disaster relief exercise, testing coordinated maritime, land and air response procedures. The drill signals New Delhi's continued effort to deepen military-to-military ties with neighboring states as part of its broader 'Act East' and regional security outreach. It follows a string of Indian naval and army engagements across the Indo-Pacific this month, including a stealth-frigate visit to Busan and the AUSTRAHIND exercise with Australia in Kerala.","source":"Defence Standard","url":"https://defencestandard.com/category/news/"}],"pacingThreat":[{"headline":"ISW: PLA May Be Rehearsing Blockade-Enforcement Against US Intervention","body":"The Institute for the Study of War assessed on November 6 that the PLA could be conducting a major exercise simulating the isolation of Taiwan, with warships positioned to deter outside intervention, an analysis that drew on Taiwan National Security Council chief Joseph Wu's November 3 report of more than 100 PLA Navy and coast guard vessels operating across the wider region. Activity reportedly included the Liaoning carrier group sailing around the southern Philippines in late October and PLA warships transiting straits near Japan into the Pacific. Analysts noted the rare coordination of surface forces from three separate theater commands, suggesting Beijing is testing its ability to mount an integrated, multi-theater joint force rather than relying solely on the Eastern Theater Command historically responsible for Taiwan-focused drills.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3373741/pla-rehearsing-operations-keep-us-forces-out-taiwan-conflict"},{"headline":"Beijing's Export Squeeze on Japan Deepens Despite Thaw Signals","body":"A year after Prime Minister Sanae Takaichi's Taiwan remarks triggered a diplomatic rupture, Beijing has kept in place tightened controls on military-civilian dual-use exports to Japan, including rare earths, with 40 Japanese companies now banned in principle from receiving such shipments from China. Mitsubishi Heavy Industries' president said export paperwork delays have worsened, and the Tokyo-Beijing dialogue on export controls has remained suspended since last September. Japan's business federation Keidanren has postponed a planned mid-November delegation to China even as some regional business groups push to keep informal channels open ahead of a possible leaders' meeting at the APEC summit.","source":"The Japan Times","url":"https://www.japantimes.co.jp/business/2026/11/07/economy/japan-biz-community-china-tensions/"},{"headline":"Taiwan Logs Fresh PLA Incursions as Tensions Simmer","body":"Taiwan's Ministry of National Defense reported detecting 1 PLA aircraft sortie, 7 PLA Navy ships and 1 official vessel operating around the island in the 24 hours ending 6 a.m. on November 9, with the lone sortie entering Taiwan's northern ADIZ and prompting combat air patrols, naval deployments and coastal missile system responses. The relatively modest daily figure follows a sharper spike just days earlier, when the ministry logged a 2026 high of 49 aircraft sorties in a single 24-hour window on November 3, alongside a reported regional buildup of over 100 PLA Navy and coast guard vessels flagged by Taipei's National Security Council. Officials say Beijing is using calibrated, recurring patrols to normalize incursions and gradually erode Taiwan's practical control over its own waters and airspace.","source":"Taiwan Ministry of National Defense","url":"https://www.mnd.gov.tw/en/news/plaact/88171"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine, Russia and US Open First Direct Peace Talks Since February in Abu Dhabi","body":"Negotiating teams from Kyiv, Moscow and Washington sat down together on November 10 for the first trilateral session since February, with a second day of talks set for November 11. Secretary of State Marco Rubio said any security guarantees for Ukraine would need to be acceptable to Russia as well, a framing that European officials worry echoes Kremlin positions on a broader continental security deal. Zelensky used the moment to accuse Moscow of trying to split Ukraine along the Dnipro River through its bridge and grid strikes, pledging extra state resources to frontline regions.","source":"Kyiv Independent / Washington Post","url":"https://kyivindependent.com/"},{"headline":"Deadly Cross-Border Strikes Continue Even as Diplomats Talk Peace","body":"Russian Shahed drones hit Kharkiv overnight, setting a house ablaze, damaging roughly ten vehicles and injuring six people, according to Mayor Ihor Terekhov. Ukraine's General Staff reported that Russian attacks killed nine people and wounded 39, including a one-year-old child, across the country in the prior 24 hours, while Ukrainian forces struck Russia's second-largest oil refinery in a retaliatory drone raid. Kyiv's military intelligence separately warned that Russia is now preparing a new campaign of strikes targeting Ukraine's food industry, suggesting Moscow intends to keep pressure on civilian infrastructure regardless of the Abu Dhabi talks.","source":"Kyiv Independent","url":"https://kyivindependent.com/"}],"europe":[{"headline":"NATO Weighs Deep-Strike Doctrine Into Russia as UK Boosts Undersea Drone Defenses","body":"The Wall Street Journal reported that NATO's evolving defense plan now explicitly contemplates long-range strikes deep inside Russian territory, a shift previewed by SACEUR Gen. Alexus Grinkevich at the Warsaw Security Forum, who argued Ukraine's war has proven the value of hitting an adversary's military-industrial rear when air defenses are stretched thin. In a parallel move, the UK announced it will spend 90 million pounds on drones, sensors and AI systems to help the Royal Navy track Russian undersea activity in the North Atlantic and protect subsea cables and pipelines. Together the steps mark a harder edge to NATO deterrence planning heading into winter, alongside the Alliance's new Counter-UAS procurement marketplace launched last week to speed fielding of anti-drone systems across member states.","source":"EADaily / Reuters","url":"https://www.eadaily.com/en/news/2026/11/03/natos-new-defense-plan-aims-to-strike-deep-into-russia-wsj"},{"headline":"Cost-of-Living Protests Shake France Ahead of Spring Elections","body":"Tens of thousands of students and union members marched in Paris on November 7 over economic grievances, part of a wave of unrest that has fed anti-government sentiment ahead of elections next spring. The government has responded by accelerating a minimum-wage increase in an attempt to defuse the protests, but the demonstrations reflect a broader eurozone anxiety over stagnant wages and living costs that is straining governing coalitions well beyond France. The unrest comes as France separately deals with the fallout from a cyberattack on supermarket refrigeration systems that it has publicly blamed on Iran, compounding the sense of a country under multiple simultaneous pressures.","source":"Al Jazeera","url":"https://www.aljazeera.com/europe/"}]},"middleEast":[{"headline":"Houthis Fire on Riyadh as Saudi-Led Coalition Claims Missile Factory Strikes","body":"Saudi air defenses intercepted Houthi missiles and drones aimed at the kingdom on November 10, with a deputy governor inspecting damage to an Aramco building in Riyadh from the attack. The coalition said it had destroyed Houthi ballistic missile production facilities in response, as fighting between the Yemeni militia and Saudi-backed forces continues to escalate after collapsing from a 2022 UN-brokered truce earlier this year. Separately, the UN accused the Houthis of coercing detained staff into making on-camera statements, adding a human-rights dimension to the renewed conflict.","source":"Arab News","url":"https://www.arabnews.com/"},{"headline":"Tanker Damaged in UAE Waters as Iran-Linked Gulf Shipping Attacks Escalate","body":"State oil company Adnoc confirmed a vessel was damaged in an attack in UAE waters on November 10, with response efforts still underway. Iran's Revolutionary Guard said it had halted two tankers it deemed 'violating' near its waters using explosions, underscoring how the months-long Iran war has turned Gulf shipping lanes into a recurring flashpoint even as US officials signal openness to de-escalation. Gulf Cooperation Council defense ministers met in Bahrain the same day to coordinate military cooperation, and the bloc separately approved a joint military command headquarters based in Kuwait.","source":"Khaleej Times","url":"https://www.khaleejtimes.com/world/mena/us-israel-iran-saudi-arabia-yemen-war-live-updates-november-10-2026"},{"headline":"Gaza Ceasefire Violence Persists as Death Toll Since Truce Tops 1,600","body":"Israeli fire killed three Palestinians and wounded six more, including two children, in Gaza on November 10, according to medical sources, with Israel citing ongoing operations against militants despite the October 2025 ceasefire. Gaza's Health Ministry now counts 1,615 Palestinians killed and 5,849 wounded by Israeli strikes and gunfire since the truce took effect, a toll the UN treats as credible even as the broader deal has formally held for over a year. The persistent violence coincides with flooding that has further battered displaced families living in tents across the strip, compounding humanitarian strain even as mediators focus attention on the wider regional Iran-war diplomacy.","source":"anews / Boston Globe","url":"https://www.anews.com.tr/world/2026/11/10/israeli-fire-kills-3-palestinians-wounds-6-others-in-gaza-amid-ceasefire-violations"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Sets IPO Price Range as OpenAI Locks In Lower $1.25T Valuation","body":"Anthropic set an IPO price range of $70 to $78 per share late Monday, targeting a Nov. 19 trading debut that could value the company at up to $1.405 trillion on a fully diluted basis, up from the $965 billion mark it posted in a May funding round. Meanwhile OpenAI closed the first $11 billion tranche of a new round at a $1.25 trillion valuation, well below the $1.4-1.5 trillion it had originally sought, as a Nasdaq selloff that erased $2.5 trillion in value on Nov. 5 cooled investor enthusiasm for AI bets. Taiwan Semiconductor Manufacturing Co. is separately investing up to $1 billion combined across both labs, underscoring how chipmakers are now taking direct equity stakes in their biggest customers.","source":"CNBC / Bloomberg","url":"https://www.cnbc.com/2026/11/10/anthropic-sets-price-range-of-70-to-78-in-upcoming-ipo.html"},{"headline":"Investor Jitters Over AI Spending Reshape Both Labs' Fundraising","body":"OpenAI's $11 billion raise came in roughly $150 billion lighter than its initial pitch, even though the resulting $1.25 trillion valuation is still about 47% above the $852 billion mark it commanded after a $122 billion raise in March. Some prospective Anthropic IPO buyers have floated valuations as low as $1.1 trillion, far under the roughly $2 trillion some investors expected a month ago, with worries centered on Democratic midterm gains potentially bringing tighter scrutiny of AI data-center buildouts. Ramp spending data cited in industry trackers shows enterprise AI usage climbing even as per-unit spending among heavy users stayed flat through August and September, suggesting falling prices are squeezing lab revenue growth right as both companies seek fresh capital.","source":"TechFundingNews / Daily AI Brief","url":"https://techfundingnews.com/openai-closes-11b-first-tranche-at-1-25t-valuation-well-below-its-1-4t-ask/"}],"cyberEmerging":[{"headline":"DOJ Launches 'Super Intelligence' Task Force, Absorbs AI Litigation Unit","body":"The Justice Department announced on Nov. 5 the creation of a Super Intelligence Task Force (SITF) to centralize enforcement and policy work tied to AI, folding in the previously separate AI Litigation Task Force that had been suing to block state AI laws. The move follows September's Executive Order 14434, which directs federal agencies to replace the term 'artificial intelligence' with 'Super Intelligence' in official communications wherever legally permissible. Consolidating the litigation function into SITF signals the administration intends to keep pressing federal preemption of state AI regulation as a core enforcement priority heading into 2027.","source":"Lexology","url":"https://www.lexology.com/library/detail.aspx?g=39da867c-06d2-49a1-ad4b-e4abb32fb14d"},{"headline":"Nvidia Espionage Scandal Reignites Fight Over China Chip Export Loopholes","body":"Revelations that Nvidia CEO Jensen Huang had a personal relationship with a woman U.S. officials believe was recruited by China's Ministry of State Security have intensified scrutiny of chip export enforcement, with one investigation tying her business network to roughly 240,000 restricted Nvidia processors, including H100, H200 and A100 units, allegedly routed into China. Senators Elizabeth Warren and Jim Banks used the controversy Monday to renew their push for the AI Overwatch Act, which would give Congress direct authority to scrutinize and halt advanced chip exports to adversaries. Epoch AI estimates chips with the equivalent compute of 1.6 million Nvidia H100s had already reached China illicitly through Southeast Asian intermediaries by the end of 2025, and House China Committee chairs have summoned Huang for a briefing on Nov. 18.","source":"Al Jazeera","url":"https://www.aljazeera.com/economy/2026/11/10/nvidia-spy-scandal-fuels-debate-over-chip-exports-to-china"}]},"cities":{"lasVegas":[{"headline":"Hoover Dam Runs Low-Level Power Tests Amid Hydropower Strain","body":"Water managers at Hoover Dam have begun low-level generation tests after Turbine A8 was pulled from service, with officials hoping recent historic river flows can help buy time against a worsening hydropower shortfall at the Boulder City facility. The dam's output has been a growing concern for the region's power grid as Colorado River conditions fluctuate.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Nordstrom Declares Win in Razor-Thin Las Vegas City Council Race","body":"Shannon Nordstrom has claimed victory in the Ward 2 seat on the Las Vegas City Council after rival Luke McCarthy called to concede this past Friday, capping one of the closest municipal election outcomes recorded in Clark County. The margin underscores how competitive down-ballot city races have become even as higher-profile statewide contests dominated headlines last week.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Brightline West High-Speed Rail Hits New Funding Snag","body":"The Brightline West rail project meant to connect Las Vegas with Southern California is running into fresh funding delays, slowing progress on the long-anticipated high-speed line. Despite the setback, the project still retains support from both parties in Congress, keeping its long-term outlook intact even as timelines slip.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/local-nevada/"}],"nellis":[{"headline":"Air Force Advances $1 Billion F-47 Test Campus at Nellis","body":"The Air Force is pushing ahead with plans for an 'F-47 Future Campus' at Nellis Air Force Base, a project worth more than a billion dollars that will add hangars, laboratories and maintenance facilities to support Boeing's new sixth-generation fighter. While initial flight trials will run out of Edwards Air Force Base in California, Nellis is being positioned for a larger role in operational integration given its sprawling Nevada Test and Training Range and proximity to Creech Air Force Base's drone and Collaborative Combat Aircraft units. The service is aiming to have the infrastructure built out by 2031 as it races to field the jet.","source":"Air & Space Forces Magazine / Zona Militar","url":"https://www.airandspaceforces.com/air-force-billion-dollar-campus-testing-f-47-nellis/"}]},"feelGood":[{"headline":"Fishermen Pull Exhausted Cruise Ship Pianist From Pacific After Nine Hours Adrift","body":"Two fishermen off the California coast spotted a cruise ship crew member struggling in open water nearly 20 miles from shore and managed to haul him aboard after he had been treading water for about nine hours. The impromptu rescue turned what should have been a routine fishing trip into a life-saving mission, and the pianist is reported to be recovering safely.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Mother of Three Dives Into Flooded Lake to Save Elderly Man","body":"A mother of three became a local hero after jumping into a flooded lake to rescue an elderly man who was in danger of drowning as waters rose around him. Her quick decision to act, rather than wait for help to arrive, likely prevented a tragedy in her community.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Deputy's Floodwater Rescue of Baby Reveals Larger Team Effort","body":"A viral photo showing a sheriff's deputy wading through floodwaters while carrying an infant to safety has drawn national attention, but officials say the image only captured one moment in a broader, coordinated rescue operation. First responders worked through dangerous flood conditions to reach multiple stranded families and get them to safety.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1775","event":"The United States Marine Corps was founded by the Continental Congress."},{"year":"1969","event":"Sesame Street premiered on American public television."},{"year":"1989","event":"Crowds continued celebrating and dismantling the Berlin Wall following its opening the night before."},{"year":"1983","event":"Microsoft publicly announced the Windows operating system."}]},"topPicks":[{"headline":"Ukraine, Russia and US Open First Direct Peace Talks Since February in Abu Dhabi","teaser":"A rare diplomatic breakthrough could reshape the war's trajectory and global security alignments."},{"headline":"US Strikes Iran's Qeshm Island as War-Powers Fight Intensifies at Home","teaser":"Military escalation against Iran collides with a domestic constitutional battle over presidential war powers."},{"headline":"Anthropic Sets IPO Price Range as OpenAI Locks In Lower $1.25T Valuation","teaser":"Competing valuations signal shifting investor confidence in the AI industry's biggest rivals."}]},"navDates":[{"key":"2026-11-12","label":"Nov 12","href":"/","isNewest":true},{"key":"2026-11-11","label":"Nov 11","href":"/archive/2026-11-11.html","isNewest":false},{"key":"2026-11-10","label":"Nov 10","href":"/archive/2026-11-10.html","isNewest":false},{"key":"2026-11-09","label":"Nov 9","href":"/archive/2026-11-09.html","isNewest":false},{"key":"2026-11-08","label":"Nov 8","href":"/archive/2026-11-08.html","isNewest":false},{"key":"2026-11-07","label":"Nov 7","href":"/archive/2026-11-07.html","isNewest":false},{"key":"2026-11-06","label":"Nov 6","href":"/archive/2026-11-06.html","isNewest":false}],"currentKey":"2026-11-10","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-10.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
