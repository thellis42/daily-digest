<script>
const STATE = {"digest":{"date":"Sunday, November 22, 2026","generatedAt":"Sun, Nov 22, 9:08 AM PST","breaking":{"headline":"Iran escalates Hormuz shipping war as seven tankers hit in six days, Saudi Arabia warns of retaliation","body":"UK and Joint Maritime Information Centre advisories confirm seven oil tankers have been struck in or near the Strait of Hormuz since November 16, including three outbound vessels hit by unidentified projectiles within a 15-hour window on November 20-21 near Oman's Khasab. Iran's navy separately claims two tankers caught fire after hitting naval mines east of the strait, while tracking data shows no cargo vessels above 1,000 deadweight tons transited the strait between November 19 and 21. Saudi Arabia has now warned Tehran of consequences after a separate strike on Bahrain injured two people, raising the risk that Gulf Arab states are drawn directly into the nine-month-old US-Iran war.","source":"Iran International / CNBC","url":"https://www.iranintl.com/en/liveblog/202611214578"},"tabs":{"defense":{"defense":[{"headline":"Hegseth quietly restricts US military cooperation with Canada","body":"Defense Secretary Pete Hegseth has issued a classified directive narrowing bilateral military cooperation with Canada, first reported by the Washington Post on November 20. Canadian Defence Minister David McGuinty says Ottawa has not even seen the memo and has detected no operational change yet, leaving allies uncertain about the scope of a move that touches a decades-old defense relationship underpinning NORAD.","source":"Militarnyi / InsideDefense","url":"https://militarnyi.com/en/news/"},{"headline":"Senator Coons declares $350 billion defense reconciliation push 'dead'","body":"Speaking at the Halifax security forum, Sen. Chris Coons (D-DE) said Republicans have run out of runway to pass a $350 billion defense reconciliation package, and that the regular FY2027 defense appropriations bill will almost certainly slip into the next Congress. The stall threatens funding continuity for shipbuilding, munitions and modernization accounts the Pentagon has been counting on heading into 2027.","source":"InsideDefense.com","url":"https://insidedefense.com/"},{"headline":"Denmark expels Russian defense attache, tightens visa rules in NATO-aligned pushback","body":"Denmark's foreign minister Lars Lokke Rasmussen ordered Russia's defense attache to leave within seven days and halted non-essential visas for Russian citizens, part of a broader response to an alleged Russian-directed assassination plot against a Ukrainian rapper living in Denmark that was thwarted near Copenhagen in September. The move came the same week Denmark's parliament voted 109-0 to ratify a trilateral security agreement with Greenland and the United States supplementing the 1951 defense framework, underscoring tightening Nordic-US-Greenland security coordination.","source":"AND Magazine / Anadolu Agency","url":"https://andmagazine.substack.com/p/morning-brief-21-november-2026"}],"acquisitions":[{"headline":"Raytheon taps Ursa Major and Avio USA for Tomahawk rocket motors","body":"Raytheon has awarded contracts to propulsion makers Ursa Major and Avio USA to produce rocket motors for the Tomahawk cruise missile, part of a push to diversify and expand the solid-rocket-motor supply base beyond traditional sole-source vendors. The deal reflects continuing Pentagon pressure to widen munitions production capacity amid sustained Tomahawk expenditure in the Middle East and restocking needs for the Pacific.","source":"Global Defense Insight","url":"https://defensetalks.com/"},{"headline":"Pentagon inspector general opens audit of defense-startup contracts tied to Trump's sons","body":"The Defense Department's inspector general has opened an audit of the Pentagon's acquisition deals with defense technology startups after a Washington Post investigation found companies linked to President Trump's two oldest sons collected $3.2 billion in Pentagon contracts. Congressional Democrats had pushed for the review, which will test whether procurement officials followed normal competition and conflict-of-interest rules in fast-tracking venture-backed defense-tech firms.","source":"GovBrief","url":"https://govbrief.today/what-happened-today-november-21-2026/"}]},"us":[{"headline":"White House Moves to Choke Off Contractor Cooperation With Incoming Democratic Oversight","body":"The Trump administration issued new guidance directing federal contractors to clear any response to congressional inquiries through the White House and to withhold material it deems privileged. The move, revealed November 21, anticipates aggressive investigations once Democrats take the House Oversight gavel under Rep. Robert Garcia on January 3, with White House Counsel Will Scharf warning lawmakers that probes into contracts, immigration enforcement and military actions could cross legal lines. Constitutional speech-or-debate protections limit how far the executive can retaliate against Congress, setting up a legal collision early next year. Separately, Pentagon officials said a related Hegseth directive restricting information-sharing would not affect defense-intelligence cooperation with Canada.","source":"NPR / Washington Post","url":"https://www.npr.org/sections/politics/"},{"headline":"Lame-Duck Congress Races Toward Dec. 11 Government Funding Cliff","body":"Lawmakers returned to Washington this week facing a hard December 11 deadline to pass new appropriations or another stopgap, or trigger the third shutdown threat of 2026 following a record 76-day lapse earlier this year. The same lame-duck session, still run by a lame-duck Republican majority until the new Congress is seated January 3, also has to finish the National Defense Authorization Act and address the debt limit. Democrats, fresh off midterm gains, are weighing how hard to push the funding fight as leverage before losing the House majority fight in January.","source":"CNBC / Shutdown trackers","url":"https://www.cnbc.com/2026/11/09/congress-government-funding-debt-limit-elections.html"},{"headline":"Cornyn and Trump Clash Publicly Over Texas Judicial Pick","body":"Outgoing Sen. John Cornyn (R-TX) is openly feuding with President Trump over a federal judgeship nomination, pushing his own preferred candidate after Trump suggested Cornyn's objections were rooted in personal grievance. The spat, reported November 21, highlights continuing tension between Trump and establishment Senate Republicans even as Cornyn heads for the exits, and could complicate judicial confirmations in the narrow window before Republicans lose their Senate edge on other fronts.","source":"Washington Post","url":"https://www.washingtonpost.com/politics/"},{"headline":"Tillis Threatens Hold on Trump's CISA Nominee Over Jan. 6 Comments","body":"Sen. Thom Tillis (R-NC) said he will block Michael LoSapio, Trump's pick to lead the Cybersecurity and Infrastructure Security Agency, after LoSapio told the Senate Homeland Security Committee this week that he did not consider the January 6, 2021 Capitol riot an attack on the building. The threatened hold adds to a growing backlog of stalled national-security confirmations, including Pentagon nominees Austin Dahmer and Alex Velez-Green, who have waited more than a year without a floor vote amid partisan gridlock in the Senate.","source":"Resistance News Digest (Senate reporting)","url":"https://resistancenewsdigest.substack.com/p/november-21-2026-news-grab-bag"}],"pacific":{"pacificCommand":[{"headline":"Quad Leaders Meet in Manila, Frame AI and Undersea Cables as Strategic Priorities","body":"At the Quad Leaders' Summit in Manila on November 19, Japan's Sanae Takaichi, India's Narendra Modi, President Trump, and Australia's Anthony Albanese reaffirmed a free and open Indo-Pacific and rolled out new initiatives on maritime security, cybersecurity, critical infrastructure and emerging technology. Canberra pledged to extend its undersea-cable contributions to include electricity links, with new projects planned in the Indian Ocean, while the grouping folded artificial intelligence into its agenda under the label 'trusted Super Intelligence.' Takaichi used the summit to repeat Japan's demand for North Korea's complete denuclearization and to thank partners for backing Tokyo on the decades-old abductions issue.","source":"The Phil Biz News","url":"https://thephilbiznews.com/2026/11/19/quad-leaders-reaffirm-indo-pacific-cooperation/"},{"headline":"Australia and Philippines Sign Defense Pact as 'Squad' Deepens Manila Ties","body":"Australia and the Philippines signed a defense agreement in Manila on November 15 designed to simplify bureaucratic hurdles around joint patrols, exercises and disaster-relief operations. The deal extends a pattern of Philippine status-of-forces-style pacts following agreements with Japan in 2024, New Zealand in 2025, Canada in 2025 and France in 2026, with UK talks ongoing, and cements the informal four-nation 'Squad' of Australia, the US, Japan and the Philippines built to counter Chinese pressure in the South and East China Seas. Days earlier, on November 9, Japan separately agreed to supply Manila with coastal radar and surveillance drones under a 4.3 billion yen grant.","source":"The Diplomat / Euronews","url":"https://thediplomat.com/2026/11/philippines-australia-sign-new-defense-agreement-amid-china-pressure/"},{"headline":"Japan to Conduct First-Ever Live-Fire Missile Drills on Indian Soil","body":"Japan and India announced an arrangement under which Japanese forces will carry out live-fire training in India for the first time, including drills involving surface-to-ship missiles expected to begin next year. The move builds on growing interoperability highlighted by Japan Air Self-Defense Force fighters' participation in Exercise Veer Guardian 26 in India. The announcement comes as New Delhi separately nears selection of a private-sector partner for its indigenous fifth-generation Advanced Medium Combat Aircraft program, underscoring deepening Japan-India defense-industrial alignment.","source":"Indian Defence News","url":"https://www.indiandefensenews.in/"}],"pacingThreat":[{"headline":"PLA Daily Admits Chain-of-Command Is Too Slow for Drone Warfare","body":"Citing reporting from the South China Morning Post, PLA Daily has published at least four commentaries since July examining Ukraine's rapid, decentralized drone-targeting network and questioning whether China's top-down command structure can keep pace. The pieces study Ukrainian, Russian and US Marine practices of pushing targeting authority down to frontline units without recommending the PLA adopt them outright, since Chinese orders still flow from the Central Military Commission through theater commands before reaching units in the field. Analysts link the self-criticism to the long-standing 'Five Incapables' training gap Xi Jinping highlighted during his 2015 military overhaul, suggesting Beijing still sees a real readiness shortfall a decade later.","source":"DroneXL","url":"https://dronexl.co/2026/11/21/china-pla-daily-ukraine-delta-frontline-commanders-drone-warfare/"},{"headline":"Beijing's Unannounced 'Silent' Blockade-Style Drills Around Taiwan Draw New Scrutiny","body":"Reuters and Taiwanese officials describe a large, unannounced PLA exercise across the western Pacific since early November that at its peak deployed more than 100 navy and coast guard vessels, which Taipei has labeled a campaign of 'silent intimidation.' Analysts at the Institute for the Study of War and the American Enterprise Institute assessed the PLA may have been rehearsing the surrounding and isolation of Taiwan, with Taiwanese media dubbing it the 'silent military exercise.' The most notable feature was coordination across the PLA's Northern, Southern and Eastern Theater Commands alongside the coast guard and maritime militia, a fusion analysts say could knit the three commands into an integrated operational framework spanning the First Island Chain.","source":"The Diplomat","url":"https://thediplomat.com/2026/11/beyond-a-taiwan-blockade-the-strategic-implications-behind-the-plas-silent-military-exercise/"},{"headline":"Taiwan Logs Daily PLA Incursions as Analysts Debate Purge's Effect on War Risk","body":"Taiwan's Ministry of National Defense reported tracking two Chinese military aircraft, six navy vessels, one official ship and four balloons crossing the Taiwan Strait median line in the 24 hours ending November 21, prompting Taipei to scramble jets, deploy ships and activate coastal missile batteries. The ministry says it has now tracked Chinese aircraft 230 times and ships 187 times so far this month. The pressure continues even as Taiwanese experts, at a Taipei seminar on the CCP's Fifth Plenum, argued Xi Jinping's ongoing purge of PLA generals has pushed back Beijing's invasion timeline while simultaneously raising the risk of war by accident or miscalculation under inexperienced commanders.","source":"Taiwan News","url":"https://www.taiwannews.com.tw/news/6479444"}]},"europe":{"ukraineRussia":[{"headline":"Russia pounds Ukrainian cities overnight as winter energy campaign intensifies","body":"Russia launched a fresh barrage of ballistic missiles and roughly 186 drones at Ukraine overnight into November 22, striking apartment blocks in Kharkiv and Dnipro and leaving 14 people missing after a strike on a residential building in the Kyiv region. Zelensky said Russia has fired around 2,700 drones and 1,460 aerial bombs at Ukraine just this week, part of a sustained campaign against energy infrastructure as a fourth wartime winter approaches. Russian forces also claimed to have shot down 792 Ukrainian drones in the same 24-hour period and said they captured the settlement of Sosnovy Bor in the Kharkiv region.","source":"France 24 / RBC-Ukraine","url":"https://france24.com/en/europe/20261122-live-finland-says-war-spilling-over-after-baltic-sea-drone-strike-on-russian-cargo-ship"},{"headline":"Finland warns war is 'spilling over' after Baltic Sea drone strike on Russian ship","body":"Finland said the Russia-Ukraine war is bleeding beyond its borders after a drone set fire to a Russian cargo vessel in the Baltic Sea on Saturday, adding to a string of incidents — including Friday's suspected Russian missile and drone incursion into Polish airspace — that have rattled NATO's eastern flank. The UK separately announced it will begin producing long-range 'middle strike' drones for Ukraine, underscoring Western concern that deterrence along NATO's border is eroding even as the Abu Dhabi-brokered peace track remains stalled over territorial and security-guarantee disputes.","source":"France 24","url":"https://france24.com/en/europe/20261122-live-finland-says-war-spilling-over-after-baltic-sea-drone-strike-on-russian-cargo-ship"}],"europe":[{"headline":"NATO vows to defend 'every inch' of Poland after airspace violation","body":"Secretary General Mark Rutte pledged in Warsaw on November 21 that NATO will defend 'every inch' of Polish territory, a day after Poland said Russia violated its airspace with three objects believed to be two missiles and a drone. General Alexus Grynkewich, head of NATO forces in Europe, is assessing the alliance's deterrence posture, and the North Atlantic Council will convene in Brussels on Monday specifically to discuss the breach. Poland's defense minister said Warsaw expects reinforced allied support for its eastern border in the near term.","source":"Reuters / U.S. News","url":"https://www.usnews.com/news/world/articles/2026-11-21/nato-will-defend-every-inch-of-polish-territory-rutte-says"},{"headline":"Brussels pushes new €45 billion Ukraine loan as funding fight reopens","body":"The European Commission has floated a fresh €45 billion loan to keep Kyiv's government and military funded as Russian strikes intensify against Ukraine's power grid ahead of winter. The proposal revives a bloc-wide rift over how to pay for the war, echoing last year's bruising standoff over using roughly €210 billion in frozen Russian central bank assets — a plan Belgium has repeatedly blocked over legal liability fears. With EU members already stretched by a €90 billion 2026-2027 support package, the financing question is emerging as one of the continent's most divisive policy fights heading into winter.","source":"Yahoo News UK","url":"https://uk.news.yahoo.com/ukraine-russia-war-latest-kyiv-042352979.html"}]},"middleEast":[{"headline":"Iran hits Bahrain industrial site as Gulf blockade standoff deepens","body":"Bahrain accused Iran of striking a civilian industrial facility in Sitra on November 21, sparking a fire, as Tehran's navy conducted what state media called its most 'intense and varied' operations yet to interdict shipping in the Strait of Hormuz. Iranian President Masoud Pezeshkian described the country as locked in a 'silent economic war' as the US naval blockade and sanctions regime nears 130 days, while Iran simultaneously unveiled a new underground dual-missile launcher to signal it retains strike capability if the confrontation with Washington and Israel reignites.","source":"Al Jazeera / Middle East Eye","url":"https://www.middleeasteye.net/live/live-israelis-head-polls-netanyahu-fights-political-life"},{"headline":"Gaza death toll since ceasefire tops 1,600 as strikes continue","body":"More than a year after the October 2025 ceasefire, Israeli strikes in Gaza are still killing Palestinians almost daily; a strike on a vehicle carrying food killed three people in Gaza City on November 22, and the territory-wide toll since the truce has surpassed 1,660. Displaced Palestinians staged protests over continued military activity near the so-called Yellow Line in eastern Gaza City, where Israeli forces have also been detonating explosives planted in damaged homes.","source":"Al Jazeera / Middle East Eye","url":"https://www.aljazeera.com/middle-east/"},{"headline":"Lebanon seizes 264 kg of explosives smuggled from Syria amid Hezbollah tensions","body":"The Lebanese army announced on November 22 it intercepted roughly 264 kilograms of explosives — including 203 kg of C4 and 61 kg of TNT — smuggled across the border from Syria near Arsal, arresting three suspects; Syrian forces separately seized a weapons shipment headed the other direction into Lebanon. The bust comes as Lebanon's president insists 'the time for weapons outside the state is over,' pressing Hezbollah to disarm even as Israel continues strikes in southern Lebanon and says it won't withdraw from border security zones until Hezbollah is disarmed and Syrian threats are resolved.","source":"Arab News / The National","url":"https://www.thenationalnews.com/news/mena/2026/11/22/lebanese-army-seizes-264kg-of-explosives-smuggled-from-syria/"}],"techAI":{"aiCompetition":[{"headline":"Trump's Data-Center Tax Threat Rattles AI Sector","body":"During a November 20 press appearance, President Trump floated imposing a steep tax on U.S. companies building AI data centers abroad, without specifying a rate, legal mechanism, or enforcement timeline. The unscripted remark coincided with a broad tech-sector selloff and left major AI firms with overseas infrastructure plans in limbo, since no executive order or legislation has followed. Analysts read it as an early signal of a push toward keeping frontier-model training capacity onshore as Washington frames AI buildout as a national-security asset in its rivalry with China.","source":"Latin Times","url":"https://www.latintimes.com/trump-ai-data-centers-overseas-tax-threat-601669"},{"headline":"Cerebras-AMD Hybrid Inference System Goes Live","body":"Cerebras announced on November 22 that it has put a combined wafer-scale-chip-and-GPU inference setup built with AMD into production, claiming roughly five times more chatbot output per unit of power than its standalone systems. Early-access partners reportedly include AWS, Fireworks AI, Gimlet Labs and General Compute, and Cerebras plans to scale the hybrid architecture across hundreds of megawatts of capacity by the end of 2027. The move highlights intensifying competition among chipmakers to cut inference costs as demand for serving frontier models accelerates.","source":"This Is Not Average (Kelly Abbott)","url":"https://kellyabbott1.substack.com/p/ai-frontier-daily-2026-11-22"}],"cyberEmerging":[{"headline":"China-Linked Hackers Used Autonomous AI Agents to Exploit a Zero-Day","body":"Amazon's threat-intelligence team disclosed on November 21 that a suspected China-nexus group used autonomous AI agents built on a framework called Cairn to discover and weaponize a critical zero-day in the open-source MONAI Label medical-imaging platform, targeting university research networks. Researchers say the agents handled the intrusion largely without human direction, from vulnerability discovery through exploitation, marking one of the clearest cases yet of AI running an end-to-end attack chain. The disclosure follows a GAO report issued November 20 warning that agentic AI tools could soon outpace defenders' response capacity.","source":"SecurityWeek","url":"https://www.securityweek.com/"},{"headline":"CrowdStrike in Talks for Blockbuster Zscaler Acquisition","body":"Bloomberg reported on November 21 that CrowdStrike is in discussions to acquire rival cybersecurity vendor Zscaler, a deal that could rank among the largest in the industry's history if it closes. Combining CrowdStrike's endpoint-security dominance with Zscaler's cloud and zero-trust networking business would reshape the competitive landscape just as enterprises race to deploy AI-driven threat detection. No valuation or terms have been disclosed, and the talks could still collapse before any formal agreement.","source":"Cyber Security News","url":"https://cybersecuritynews.com/"}]},"cities":{"lasVegas":[{"headline":"Verstappen wins chaotic Las Vegas Grand Prix as Ferraris collide again","body":"Max Verstappen took a dominant win in Saturday night's Formula 1 Las Vegas Grand Prix on the Strip circuit, while Ferrari's weekend unraveled after another collision involving Charles Leclerc and Lewis Hamilton. George Russell publicly took blame for a race-altering mistake, and paddock chatter swirled around a coordinated Red Bull strategy that commentators called remarkable. Outside the fenced-off circuit, thousands of fans without tickets crowded sidewalks and overpasses Saturday night hunting for free sightlines of the cars.","source":"Las Vegas Review-Journal / RacingNews365","url":"https://www.reviewjournal.com/"},{"headline":"Major Strip casino operator cuts ties with gambling-addiction group over Kalshi dispute","body":"One of the Las Vegas Strip's largest casino operators, along with its co-owned online sportsbook brand, ended its relationship with a national problem-gambling advocacy group this weekend. The split stems from the advocacy group's association with Kalshi, the prediction-market platform that has drawn fire from traditional sportsbooks for offering sports-outcome contracts without a gaming license. The move highlights the deepening rift between regulated Nevada casinos and the fast-growing prediction-market industry.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Metro assistant sheriff's credentials challenged in 2025 protest lawsuit","body":"A Las Vegas Metropolitan Police Department assistant sheriff's qualifications have become a central issue in ongoing litigation tied to the department's handling of 2025 protests. The case, reported this weekend by the Review-Journal, comes as Sheriff Kevin McMahill's department continues to face scrutiny following the on-duty death of Officer Austin Abdelnabi. The litigation could have implications for Metro's command structure and its legal exposure from last year's demonstrations.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Air Force advances $1 billion-plus F-47 test campus at Nellis","body":"The Air Force is moving forward on a dedicated test campus at Nellis Air Force Base for the Boeing F-47, the sixth-generation stealth fighter set to replace the F-22, with construction of hangars, labs and maintenance facilities targeted for completion by 2031. The roughly $1.057 billion project will occupy the base's eastern side and will involve up to four contractors under a phased build-out plan. While Edwards Air Force Base will handle the F-47's initial flight testing, Nellis is being positioned for a broader operational-integration role, and its proximity to Creech Air Force Base's Collaborative Combat Aircraft unit adds to its importance for next-generation drone-fighter teaming.","source":"Air & Space Forces Magazine / Zona Militar","url":"https://www.airandspaceforces.com/air-force-billion-dollar-campus-testing-f-47-nellis/"}]},"feelGood":[{"headline":"Father sprints onto tracks to pull elderly man from path of oncoming train","body":"A dad reacted in seconds this week to save an elderly man who had become stuck on railroad tracks as a train approached, sprinting toward the danger rather than away from it. The rescue, one of several recent hero stories highlighted by Sunny Skyz, underscores how ordinary bystanders continue stepping into harm's way for strangers. The elderly man escaped without serious injury thanks to the split-second intervention.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Florida deputies make sure a 71-year-old living in her car isn't alone for the holidays","body":"Two Florida sheriff's deputies went beyond their normal duties after discovering a 71-year-old woman had been sleeping in her car for days, stepping in with an unexpected act of kindness to ensure she had support rather than continuing to face hardship by herself. The encounter, reported this week, is part of a wave of grassroots goodwill stories circulating as the Thanksgiving season approaches. It's a reminder that small, personal acts of compassion from law enforcement can change the trajectory of someone's week.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"California sends 1,300 hospital beds and medical supplies to Ukraine","body":"Governor Gavin Newsom announced that California has donated 1,300 hospital beds and additional medical supplies to Ukraine, drawn from state surplus stock, following his recent visit to the country. The shipment builds on earlier rounds of humanitarian aid California has sent since the war began, aiming to ease pressure on Ukrainian hospitals strained by continued conflict. The donation reflects a broader pattern of U.S. state-level humanitarian support flowing to Ukrainian civilians and medical workers this fall.","source":"Good Good Good","url":"https://www.goodgoodgood.co/articles/good-news-this-week-november-21-2026"}],"onThisDay":[{"year":"1963","event":"President John F. Kennedy was assassinated while riding in a motorcade through Dallas, Texas."},{"year":"1943","event":"Lebanon declared independence from French mandate rule, an event still celebrated as Lebanese Independence Day."},{"year":"1990","event":"Margaret Thatcher announced she would resign as British Prime Minister after a decade in power."},{"year":"1968","event":"The Beatles released their self-titled double album, widely known as 'The White Album'."}]},"topPicks":[{"headline":"Iran escalates Hormuz shipping war as seven tankers hit in six days, Saudi Arabia warns of retaliation","teaser":"A rapidly widening tanker war in the Hormuz Strait threatens global oil flows and risks drawing in Saudi Arabia."},{"headline":"Russia pounds Ukrainian cities overnight as winter energy campaign intensifies","teaser":"Moscow's renewed winter strikes on Ukraine's energy grid deepen a humanitarian crisis as the war grinds on."},{"headline":"NATO vows to defend 'every inch' of Poland after airspace violation","teaser":"A Polish airspace breach pushes NATO to reaffirm its Article 5 resolve amid rising tensions with Russia."}]},"navDates":[{"key":"2026-11-25","label":"Nov 25","href":"/","isNewest":true},{"key":"2026-11-24","label":"Nov 24","href":"/archive/2026-11-24.html","isNewest":false},{"key":"2026-11-23","label":"Nov 23","href":"/archive/2026-11-23.html","isNewest":false},{"key":"2026-11-22","label":"Nov 22","href":"/archive/2026-11-22.html","isNewest":false},{"key":"2026-11-21","label":"Nov 21","href":"/archive/2026-11-21.html","isNewest":false},{"key":"2026-11-20","label":"Nov 20","href":"/archive/2026-11-20.html","isNewest":false},{"key":"2026-11-19","label":"Nov 19","href":"/archive/2026-11-19.html","isNewest":false}],"currentKey":"2026-11-22","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-22.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
