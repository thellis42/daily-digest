<script>
const STATE = {"digest":{"date":"Wednesday, November 11, 2026","generatedAt":"Wed, Nov 11, 9:07 AM PST","breaking":{"headline":"China runs large-scale 'area denial' naval drills around Taiwan as G7 warns against force","body":"Taiwan's Defense Minister Wellington Koo confirmed on November 10 that China is conducting 'area denial' exercises in the Western Pacific built around the Liaoning carrier group, following reports from National Security Council Secretary-General Joseph Wu of more than 100 PLA Navy and coast guard vessels operating near Taiwan, in the South China Sea, and out into the Pacific. Analysts at AEI and the Institute for the Study of War say the drills, drawing on all three PLA theater commands, may be simulating an isolation of Taiwan larger than last December's 'Justice Mission 2025'. G7 foreign ministers meeting in Paris on November 9 responded by reaffirming 'strong opposition' to any unilateral change to the status quo by force across the Taiwan Strait, the East China Sea, and the South China Sea. The drills come just over two weeks before Taiwan's November 28 local elections and the November 18-19 APEC summit in Shenzhen.","source":"Japan Times / Reuters","url":"https://www.japantimes.co.jp/news/2026/11/10/asia-pacific/taiwan-china-area-denial-pacific/"},"tabs":{"defense":{"defense":[{"headline":"House GOP blocks effort to impeach Defense Secretary Hegseth","body":"The House voted 211-204 on November 10 to defeat an impeachment measure against Defense Secretary Pete Hegseth brought by Rep. Thomas Massie (R-KY) over his handling of the Iran war. Hegseth, holding his first Pentagon press conference in six months, dismissed the effort as a 'farce' and a personal vendetta rather than impeachable conduct. The vote keeps Hegseth in place amid ongoing scrutiny of his wartime decision-making.","source":"InsideDefense","url":"https://insidedefense.com/"},{"headline":"GAO warns Pentagon can't track 26 million F-35 spare parts worth $31 billion","body":"A new Government Accountability Office report finds the Department of War lacks reliable procedures to account for the F-35 Joint Strike Fighter's roughly 26 million spare parts, including engines and tires, collectively valued at about $31 billion. The watchdog warns the tracking gaps threaten long-term readiness of the fleet as the program continues to expand. The findings add to mounting congressional scrutiny of F-35 sustainment costs heading into 2027 budget deliberations.","source":"Defence Blog / Inside Defense","url":"https://defence-blog.com/"},{"headline":"Allied navies deepen frigate and mine-warfare cooperation","body":"Denmark and Finland signed deals on November 10 for Finnish BLOCKER naval mines, while UK contractor Babcock brought Saab Denmark into the multinational Arrowhead 140 frigate program that already includes the UK and Norway. The moves reflect accelerating Nordic and NATO efforts to harden undersea and surface naval capability amid heightened Baltic Sea tensions with Russia. Sweden separately awarded Saab a $202 million contract to equip its new FDI-class frigates.","source":"The Defense Post","url":"https://thedefensepost.com/"}],"acquisitions":[{"headline":"Army awards $4.17 billion to 11 firms to modernize ammunition plants","body":"The U.S. Army on November 10 awarded a combined $4.17 billion contract to 11 companies to modernize aging ammunition production facilities, including the Iowa Army Ammunition Plant. The push is aimed at rebuilding depleted munitions stockpiles and expanding surge-production capacity after years of drawdowns tied to Ukraine aid and Middle East operations. The awards are part of a broader Army industrial-base revitalization effort flagged in recent budget requests.","source":"The Defense Post","url":"https://thedefensepost.com/"},{"headline":"AEVEX Aerospace lands up to $400 million drone IDIQ contract","body":"Secretive U.S. drone maker AEVEX Aerospace won an indefinite-delivery, indefinite-quantity contract worth up to nearly $400 million, expanding its footprint in military unmanned aerial systems. The award, disclosed November 10, comes as the Pentagon accelerates procurement of attritable and ISR drones across the services. Separately, the Marine Corps finalized acquisition of Textron's Ripsaw M3 uncrewed ground vehicles the same week.","source":"Defence Blog","url":"https://defence-blog.com/"}]},"us":[{"headline":"Lame-duck Congress faces Dec. 11 funding cliff with GOP in disarray","body":"Lawmakers returned to Washington this week facing a December 11 deadline to pass a new continuing resolution or full-year spending bills, with the 60-vote Senate filibuster threshold forcing another bipartisan scramble. Democrats, newly empowered after sweeping midterm wins that will hand them majorities in both chambers next year, have little incentive to lock in full-year funding terms now, preferring to wait and negotiate from a stronger position come January. That leaves Republican leaders needing Democratic votes just weeks after a brutal midterm defeat.","source":"CNBC","url":"https://www.cnbc.com/2026/11/09/congress-government-funding-debt-limit-elections.html"},{"headline":"Senate GOP postpones leadership vote after midterm 'open-mic' venting session","body":"Senate Republicans delayed their scheduled leadership elections on Tuesday after a closed-door meeting turned into what several senators called an open-mic airing of grievances over the party's loss of its Senate majority in last week's midterms. One senator argued that losing at least seven seats demands a change in direction, faulting the party for neglecting affordability messaging, though no challenger has yet emerged against Minority Leader John Thune. The conference planned to reconvene later in the day to decide whether to proceed with voting or punt the decision further.","source":"Roll Call","url":"https://rollcall.com/2026/11/10/senate-gop-leadership-elections-2026/"},{"headline":"Supreme Court justices split over agencies' power to levy fines without juries","body":"The Supreme Court heard oral arguments Tuesday in Department of Labor v. Sun Valley Orchards, a case testing whether federal agencies can impose civil penalties through internal administrative hearings rather than Article III courts, with implications for H-2A visa enforcement and beyond. Chief Justice John Roberts signaled skepticism that the executive branch, across administrations including Trump's, has overstepped by adjudicating penalties internally, while the government's lawyer warned that a sweeping ruling could upend enforcement of Medicare, Medicaid, and federal student loan programs. Justices Alito and Kagan sparred over the stylistic coherence of a potential compromise opinion, underscoring the bench's uncertainty about how narrowly to rule.","source":"Connecticut Public Radio","url":"https://www.ctpublic.org/2026-11-10/supreme-court-seems-split-over-federal-agencies-ability-to-fine-for-law-violations"},{"headline":"Supreme Court lets border wall construction continue","body":"The Supreme Court on Tuesday allowed the Trump administration to keep building sections of the border wall, rejecting a challenge that had sought to halt construction pending further litigation. The order keeps intact one of the administration's signature immigration-enforcement projects even as related disputes, including a White House ballroom construction fight, return to the justices' docket this term.","source":"SCOTUSblog","url":"https://www.scotusblog.com/"}],"pacific":{"pacificCommand":[{"headline":"Tokyo moves toward a wartime-ready defense industrial base","body":"Japan is finalizing a new Defense Industrial Base Strategy due by the end of 2026, aimed at ensuring domestic manufacturers can sustain the Self-Defense Forces through a protracted conflict rather than just peacetime procurement. On November 4, Defense Minister Koizumi Shinjiro and Economy Minister Akazawa Ryosei met with Mitsubishi Heavy Industries, Kawasaki Heavy Industries and other major contractors to push reserve production capacity and a rethink of equipment policy. The plan sits alongside the Takaichi government's revision of Japan's core security documents and the existing 43 trillion yen (about $272 billion) five-year buildup program running through 2027, with new emphasis on drone and AI-enabled warfare.","source":"The Diplomat","url":"https://thediplomat.com/"},{"headline":"Four-nation defense bloc deepens Philippine-focused command structure","body":"Defense chiefs from the US, Australia, Japan and the Philippines - Pete Hegseth, Richard Marles, Koizumi Shinjiro and Gilberto Teodoro Jr. - released a joint statement on November 10 formalizing an October 28 Cebu meeting on the sidelines of the ASEAN defense ministers' gathering. The four agreed to stand up a Combined Coordination Center inside the Philippines, synchronize defense investments to help Manila defend its archipelago, and expand the scope and frequency of joint drills built on the Balikatan and Keen Sword exercise series. The statement also flagged continued concern over East China Sea and South China Sea tensions as the rationale for tighter interoperability.","source":"Australian Department of Defence","url":"https://www.minister.defence.gov.au/statements/2026-11-10/joint-statement-meeting-defense-ministers-from-australia-japan-philippines-united-states"},{"headline":"Seoul's nuclear submarine push hits Washington roadblock","body":"South Korea's Defense Acquisition Program Administration approved the basic strategy for its 'Jangbogo N' nuclear-powered attack submarine program on November 9, with roughly 96.6 billion won budgeted next year for initial design work and fielding targeted for the late 2030s to counter North Korean missile threats. The move follows the November 3 launch of the conventionally powered Seohui submarine at Hanwha Ocean's Okpo yard. But reporting this week notes the program faces real hurdles in Washington, since transferring nuclear fuel for the project would require amending or replacing the existing US-South Korea nuclear cooperation agreement, a step complicated by a newly Democrat-controlled Congress wary of proliferation precedents.","source":"Korea JoongAng Daily","url":"https://www.koreajoongangdaily.com/bilingual-news/south-koreas-nuclear-submarine-plan-faces-new-hurdles-kor/12962137"}],"pacingThreat":[{"headline":"PLA's top disciplinarian flags graft risk in weapons programs","body":"General Zhang Shengmin, vice-chairman of the Central Military Commission and a former PLA anti-corruption chief, called on November 10 for joint military-civilian mechanisms - including better information sharing and coordinated sanctions - to root out corruption in major weapons development. The remarks appeared in an official reader explaining the Communist Party's fifth plenum resolution on party discipline, held October 26-29. The renewed anti-graft push, following a wave of purges among senior CMC officials, suggests Beijing still views corruption in its defense-industrial complex as a live readiness risk even as it expands naval and missile production.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/politics/article/3373957/chinas-top-general-targets-pla-arms-call-joint-military-civilian-corruption-watch"},{"headline":"Chinese troops entrench on India's side of the Himalayan line despite thaw","body":"A new congressional China Bulletin published November 10 details how PLA forces have built camps, roads and bridges on land in Arunachal Pradesh that local Indian communities have traditionally used, even as Beijing and New Delhi publicly repair ties following Xi Jinping's September visit to India, his first in seven years. The pattern echoes the buffer-zone tactics Beijing used after the deadly 2020 Galwan Valley clash, which killed 20 Indian and at least four Chinese soldiers and froze Indian patrols in parts of eastern Ladakh. Analysts warn the incremental land-grabbing approach risks a fresh escalation even amid warmer diplomatic optics.","source":"U.S.-China Economic and Security Review Commission","url":"https://www.uscc.gov/trade-bulletins/china-bulletin-november-10-2026"},{"headline":"Taiwan launches global alliance to compete in military drones","body":"Taiwan's Ministry of Foreign Affairs announced on November 10 the creation of a global drone alliance called GUARD, intended to expand Taiwanese UAV manufacturers' access to international markets and build trustworthy, secure supply chains for democracies. The initiative covers certification standards, training, and industry expos, building on an October 30 Taiwan Drone International Forum and the opening of a Global UAV Academy. The push reflects Taipei's broader drone-diplomacy strategy, leveraging its semiconductor and precision-manufacturing base to position itself as an alternative to Chinese-made systems in allied markets.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/11/11/2003867529"}]},"europe":{"ukraineRussia":[{"headline":"Abu Dhabi Talks Yield POW Swap But No Breakthrough as Fighting Rages","body":"U.S.-mediated trilateral talks between Ukraine, Russia and Washington wrapped up a second day in Abu Dhabi on November 11 with officials announcing a large prisoner-of-war exchange, described as the biggest humanitarian release since the war began in 2022, but no wider ceasefire deal. Zelensky called the first day 'constructive and quite substantive' while Secretary of State Rubio termed it 'very productive,' even as overnight drone barrages continued on both sides and Russia's defense ministry claimed it downed 627 Ukrainian drones. Ukraine's State Emergency Service reported Russian strikes killed 9 and wounded 39 nationwide in the prior 24 hours, with two Russian cruise missiles also violating Moldovan airspace.","source":"AP News / NPR","url":"https://www.npr.org/2026/11/11/g-s1-152954/russia-ukraine-war-talks"},{"headline":"Drone Incursions Force NATO Jets Over Baltics as Ukraine Hits Key Russian Port","body":"NATO scrambled fighter jets overnight after at least four drones strayed into Lithuanian, Latvian and Estonian airspace amid a fresh wave of Ukrainian strikes on Russian territory, triggering brief shelter alerts for civilians. Lithuanian Prime Minister Mindaugas Sinkevicius called it a 'difficult night' but said no injuries were reported. Separately, Ukrainian drones struck the Ust-Luga Baltic Sea port in Russia's Leningrad Oblast overnight, part of a broader campaign hitting Russian energy and logistics infrastructure even as peace talks proceed in parallel.","source":"Reuters / Kyiv Independent","url":"https://kyivindependent.com/"}],"europe":[{"headline":"NATO Weighs Biggest Planning Overhaul in Two Decades to Focus on Russia","body":"NATO's 32 member states have opened negotiations on new capability targets that would no longer require allies to simultaneously field forces for a major European war and separate out-of-area crisis missions, according to diplomats briefed on the draft. The shift, first reported by POLITICO, reflects a deliberate narrowing of alliance planning assumptions toward deterring Russia specifically rather than global contingencies like past deployments to Iraq or Afghanistan. A senior NATO official called the eventual troop allocation 'a political decision,' underscoring how contentious the reallocation could be among allies with different threat perceptions.","source":"POLITICO / Militarnyi","url":"https://militarnyi.com/en/news/threat-of-war-with-russia-forces-nato-to-revise-military-planning/"},{"headline":"Europe Braces for Second Energy Shock in Five Years as Gas Prices Spike","body":"European governments are drafting winter crisis scenarios as natural gas prices have surged roughly 200% and storage levels have plunged to record lows, with Germany's reserves projected to be exhausted by March, according to Bloomberg reporting. Italy, which imports about three-quarters of its energy, and France, where soaring prices are compounding a political and fiscal crisis ahead of April's presidential election, are seen as most exposed. Officials also flagged growing concern that strained energy infrastructure leaves the continent more vulnerable to hybrid attacks, while a reopening of the Strait of Hormuz is viewed as pivotal to easing the squeeze.","source":"Bloomberg via ProtoThema","url":"https://en.protothema.gr/2026/11/11/europe-cant-afford-another-harsh-winter-as-gas-prices-surge-200-storage-plunges-and-factories-close-bloomberg-reports/"}]},"middleEast":[{"headline":"Netanyahu Rejects Blame as Gaza Flooding Crisis Deepens, Strikes Continue","body":"Israeli Prime Minister Benjamin Netanyahu pushed back on accusations — including from the U.S.-backed Board of Peace — that Israel is blocking winter aid as severe rains flood tent camps across Gaza, instead blaming Hamas for diverting humanitarian supplies without offering evidence. The UN and aid groups say more than 150,000 tents and floodwater pumps are ready to enter Gaza but have not been authorized for delivery. Israeli strikes and gunfire killed several more Palestinians in Gaza City and Khan Younis on November 10-11, with the territory's Health Ministry saying over 1,600 Palestinians have died in near-daily strikes since the ceasefire deal was reached.","source":"AP News","url":"https://www.ksat.com/news/world/2026/11/11/netanyahu-says-israel-is-not-to-blame-for-the-flood-crisis-in-gaza-and-other-mideast-news/"},{"headline":"Tanker Hits Mine in Strait of Hormuz as Iran-U.S. Standoff Simmers","body":"Iran's Revolutionary Guard said a tanker caught fire early Wednesday after striking a naval mine in the Strait of Hormuz while using an unauthorized route, the latest incident in the chokepoint since the 2026 Iran war broke out. Secretary of State Marco Rubio said Washington's economic pressure campaign has been effective enough that major combat operations are no longer needed 'for now,' while warning the U.S. could still strike if Iran crosses 'certain red lines.' Iranian security chief Mohsen Rezaei countered that Tehran will not let 'a single particle' of enriched nuclear material leave the country.","source":"CP24 / New York Times","url":"https://www.cp24.com/news/world/2026/11/11/netanyahu-denies-israel-is-to-blame-for-conditions-in-gaza-camps-and-other-mideast-news/"},{"headline":"DOJ Charges Iran-Backed Operatives as U.S. Officials Face Heightened Threats","body":"The Justice Department announced charges against three Iran-backed operatives accused of orchestrating a string of plots in the United States and Europe, including an alleged attack plot at the Royal Air Force Fairford base in the UK, which Tehran has denied. Separately, the New York Times reported that Treasury Secretary Scott Bessent recently relocated from his home to a military base after U.S. officials concluded Iranian plotting against current and former officials had advanced to a more serious stage. The developments underscore Washington's view that even as the war de-escalates militarily, Iran-linked threat activity against American targets persists.","source":"BBC News / New York Times","url":"https://www.justsecurity.org/164111/early-edition-november-11-2026/"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Prices IPO at Up to $1.4 Trillion Valuation","body":"Anthropic launched its IPO roadshow on November 10, setting an indicative range of $70 to $78 a share for 825 million Class A shares, which implies a fully diluted valuation as high as $1.4 trillion. The offering, expected to raise up to roughly $64 billion and begin trading on Nasdaq under ticker ANT around November 19, includes a $26 billion side placement from chip and cloud partners. Bankers report the deal's order book is already oversubscribed by a wider margin than SpaceX's IPO earlier this year, underscoring investor appetite for frontier-model labs even as broader AI valuations wobble.","source":"CNBC","url":"https://cnbc.com/2026/11/10/anthropic-sets-price-range-of-70-to-78-in-upcoming-ipo.html"},{"headline":"SoftBank's $7 Billion Loss Signals Strain in AI Infrastructure Bets","body":"SoftBank Group reported a ¥1.12 trillion ($7.1 billion) net loss for its July-September quarter, its first in nearly two years, after taking a $3.73 billion writedown on non-refundable advance payments for power-generation equipment tied to its Ohio data-center buildout. Financing costs more than doubled to ¥462 billion as the conglomerate, which holds a roughly 13% stake in OpenAI and has poured over $64 billion into the ChatGPT maker, absorbs the capital intensity of the AI race. SoftBank shares have fallen more than 50% from their June peak, and the results intensify investor scrutiny of whether compute-and-power commitments across the industry are outrunning near-term returns.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-11-10/softbank-group-earnings-loss-after-ai-worries-hit-tech-stocks-masayoshi-son"}],"cyberEmerging":[{"headline":"PLA-Linked University Bought Nvidia H200 Chips Despite Blacklist","body":"A Reuters investigation found that Northwestern Polytechnical University, one of China's 'Seven Sons of National Defense' with deep military ties, purchased two Nvidia H200 AI chips on October 21 for 874,700 yuan (about $123,000) through a domestic reseller, Shaanxi Bosuan Network Technology, despite remaining on the US Entity List. The school also rented access this year to H200, A100 and A800 processors via five separate computing-capacity contracts with Chinese firms, one of them signed by its cybersecurity school for model fine-tuning. The findings, drawn from a review of 26 procurement records, show continuing gaps in US export enforcement even as Nvidia CEO Jensen Huang faces fresh congressional scrutiny over chip-diversion risks and his lobbying against tighter China curbs.","source":"Reuters","url":"https://www.usnews.com/news/top-news/articles/2026-11-11/exclusive-pla-linked-chinese-university-bought-nvidia-h200-chips-despite-us-blacklist-records-show"},{"headline":"New York Rolls Out Nation's First Mandatory Frontier-AI Safety Regime","body":"New York opened registration under its RAISE Act on November 11, requiring large frontier AI developers operating in the state to disclose safety protocols and incident data or face penalties, making it the first binding state-level frontier-AI safety law in the country. Governor Kathy Hochul paired the rollout with a new state-run AI model evaluation program meant to independently test systems before wide deployment. The move lands alongside Australia's separate November 10 proposal for a dedicated AI safety regulator with enforcement powers, adding to a patchwork of state and allied-government rules racing ahead of any unified US federal framework.","source":"Deep Gains / The Neuron","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-wednesday-november-11-2026/"}]},"cities":{"lasVegas":[{"headline":"Second motorcyclist killed on Blue Diamond Road in under 24 hours","body":"Southern Nevada is reeling after a motorcyclist was killed in a two-vehicle crash Tuesday morning in the southwest Las Vegas Valley, making it the second fatal motorcycle crash on the same stretch of Blue Diamond Road in less than a day. Metro police have not yet detailed contributing factors in either wreck, but the back-to-back deaths have renewed scrutiny of speeding and road design along the fast-growing southwest corridor.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Rebuilt Nevada veterans memorial debuts for Veterans Day","body":"A renovated Nevada veterans memorial featuring new lighting and design elements is making its public debut to coincide with Wednesday's Veterans Day holiday. The project gives the state's veteran community a refreshed gathering space just as Clark County hosts a slate of Veterans Day ceremonies honoring service members.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"'Super' El Nino raises flood risk for Las Vegas this winter","body":"Nevada climate watchers are warning that a developing 'super' El Nino pattern could bring unusually heavy rain and elevated flash-flood risk to the Las Vegas Valley over the coming months. Officials are urging residents to prepare now, pointing to the potential for the kind of intense downpours that have previously overwhelmed valley storm drains.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"}],"nellis":[{"headline":"Air Force advances $1 billion F-47 test campus at Nellis","body":"The Air Force is pressing ahead with roughly a $1.057 billion 'F-47 Future Campus' at Nellis Air Force Base, confirming Nellis as the operational test site for Boeing's next-generation F-47 stealth fighter, which will eventually succeed the F-22 Raptor. Plans call for a 1.15-million-square-foot aircraft apron plus dedicated low-observable maintenance and mission-data reprogramming facilities, with construction slated to wrap by 2031. The buildout cements Nellis's growing role alongside neighboring Creech Air Force Base, which hosts the Air Force's experimental Collaborative Combat Aircraft drone unit, deepening the Las Vegas area's position at the center of next-generation air combat testing.","source":"Air & Space Forces Magazine","url":"https://www.airandspaceforces.com/air-force-billion-dollar-campus-testing-f-47-nellis/"}]},"feelGood":[{"headline":"Fishermen save cruise ship pianist after nine hours at sea","body":"Two fishermen off the California coast stumbled onto a dramatic rescue when they spotted a cruise ship pianist treading water nearly 20 miles offshore in the Pacific after she had been adrift for roughly nine hours. What started as an ordinary day on the water turned into a life-saving pull from the sea that almost certainly prevented a tragedy.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Strangers raise $76,000 online for a family's full-time caregiver","body":"A video that went viral moved strangers across the country to donate a combined $76,000 to cover the cost of a full-time caregiver for a family in need. The rapid, grassroots response shows how quickly online communities can turn a single shared video into tangible, life-changing support for people facing a care crisis.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/"},{"headline":"Missing boy with autism found safe after three-day search","body":"A multi-agency search team located a young boy with autism alive after he had been missing for three days, a recovery the rescuers themselves described as 'nothing short of a miracle.' The child was reunited safely with his family following the intensive search effort, capping an ordeal that had gripped his community.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/"}],"onThisDay":[{"year":"1918","event":"World War I formally ended as the Armistice was signed, halting fighting on the Western Front."},{"year":"1620","event":"The Pilgrims aboard the Mayflower signed the Mayflower Compact before landing in the New World."},{"year":"1889","event":"Washington was admitted as the 42nd state of the United States."},{"year":"1965","event":"Rhodesia's white minority government issued a Unilateral Declaration of Independence from Britain."}]},"topPicks":[{"headline":"China runs large-scale 'area denial' naval drills around Taiwan as G7 warns against force","teaser":"Beijing's show of force around Taiwan draws a rare G7 warning, raising fears of a wider regional confrontation."},{"headline":"Drone Incursions Force NATO Jets Over Baltics as Ukraine Hits Key Russian Port","teaser":"Rising drone activity near NATO airspace and Ukrainian strikes on Russian infrastructure signal an escalating, unpredictable war footing."},{"headline":"Anthropic Prices IPO at Up to $1.4 Trillion Valuation","teaser":"A record-setting AI valuation underscores how fast capital and power are consolidating around frontier AI firms.'"}]},"navDates":[{"key":"2026-11-13","label":"Nov 13","href":"/","isNewest":true},{"key":"2026-11-12","label":"Nov 12","href":"/archive/2026-11-12.html","isNewest":false},{"key":"2026-11-11","label":"Nov 11","href":"/archive/2026-11-11.html","isNewest":false},{"key":"2026-11-10","label":"Nov 10","href":"/archive/2026-11-10.html","isNewest":false},{"key":"2026-11-09","label":"Nov 9","href":"/archive/2026-11-09.html","isNewest":false},{"key":"2026-11-08","label":"Nov 8","href":"/archive/2026-11-08.html","isNewest":false},{"key":"2026-11-07","label":"Nov 7","href":"/archive/2026-11-07.html","isNewest":false}],"currentKey":"2026-11-11","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-11.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
