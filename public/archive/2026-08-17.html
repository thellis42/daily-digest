<script>
const STATE = {"digest":{"date":"Monday, August 17, 2026","generatedAt":"Mon, Aug 17, 5:34 AM PDT","breaking":{"headline":"Trump Orders Sharp Cutback in US-South Korea War Games, Citing Kim Jong Un Rapport","body":"President Trump said Sunday he has told Defense Secretary Pete Hegseth to 'substantially reduce' the Ulchi Freedom Shield exercises with South Korea, which nonetheless began as scheduled on Monday. Trump tied the reversal to his self-described 'very good relationship' with North Korea's Kim Jong Un and to Seoul's refusal to help with US strikes on Iran, calling the drills costly and needlessly provocative toward Pyongyang. The announcement lands just days after North Korea test-fired ballistic missiles in apparent protest of the drills, and analysts warn a real drawdown of the 10-day exercise could rattle allies already unsettled by deepening North Korea-Russia military ties.","source":"CNN / NBC News / Al Jazeera","url":"https://www.cnn.com/2026/08/16/middleeast/trump-south-korea-military-exercises"},"tabs":{"defense":{"defense":[{"headline":"Navy Swaps Carrier USS Washington in for USS Lincoln Amid Conditions Concerns","body":"The Navy is moving to relieve the USS Abraham Lincoln with the USS George Washington after reported concerns about onboard living conditions during the Lincoln's extended deployment. The swap, confirmed in Monday morning briefings, underscores strain on the carrier fleet from prolonged Middle East and Pacific deployments. No further details on the specific conditions issues have been released by the Navy.","source":"NPR","url":"https://www.npr.org/2026/08/17/nx-s1-5930235/morning-news-brief"},{"headline":"Trump Memo Forces Navy to Rip Out EMALS, Reopens Door to Foreign-Built Warships","body":"A national security memorandum Trump signed on August 13 orders the Navy to abandon the Electromagnetic Aircraft Launch System on the future USS Doris Miller, the fourth Ford-class carrier, and revert to steam catapults and hydraulic elevators like those on Nimitz-class ships. The same memo, for the first time in decades, permits foreign shipbuilders with 'substantial and durable' US shipyard investments to build up to two vessels abroad to close capacity gaps, while also directing a fifth public shipyard focused on submarine and carrier repair. Congress is pushing back: draft versions of the FY2027 defense policy bill in both the House and Senate seek to strip the president's Title 10 waiver authority for buying foreign-built warships.","source":"USNI News / Reuters","url":"https://news.usni.org/2026/08/13/new-white-house-memo-calls-for-foreign-built-warships-return-to-steam-catapults-on-ford-carriers"},{"headline":"Spanish F-18 Downs Suspected Russian Drone Over NATO Ally Romania","body":"A Spanish Air Force F-18, operating as part of NATO's eastern air-policing mission, shot down a drone suspected of Russian origin after it crossed into Romanian airspace overnight. The intercept adds to a string of recent airspace violations along NATO's eastern flank tied to Russia's ongoing war in Ukraine, and reinforces alliance efforts to bolster air defenses on the Black Sea periphery.","source":"Anadolu Agency","url":"https://aa.com.tr/en/world/morning-briefing-aug-17-2026/4029047"}],"acquisitions":[{"headline":"Pentagon Widens Boeing Role in Standard Missile-3 Production Push","body":"The Pentagon has added Boeing-led component manufacturing agreements to expand production of the Standard Missile-3 Block IB and Block IIA interceptors, building on up-to-seven-year production frameworks it struck with RTX in February. The scope and dollar value of the new Boeing arrangements have not yet been disclosed, but the move signals an effort to widen the interceptor supplier base as demand for missile defense capacity grows alongside programs like Golden Dome.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Army Looks to Nontraditional Vendors to Shore Up Missile Industrial Base","body":"The Army is launching a new initiative aimed at pulling more nontraditional manufacturers into the missile supply chain and establishing a steadier demand signal for munitions producers. The effort reflects growing concern within the service that current production capacity cannot keep pace with the munitions consumption rates seen in recent conflicts and with restocking needs for precision-guided weapons.","source":"Inside Defense","url":"https://insidedefense.com/"}]},"us":[{"headline":"New AG Todd Blanche Refuses to Vow DOJ Independence From White House","body":"In his first major TV interview after confirmation, Attorney General Todd Blanche told NBC's 'Meet the Press' that he would not promise the Justice Department will always act independently of President Trump, arguing that such a pledge would improperly constrain lawful presidential priorities like directing prosecutors to target violent crime. Blanche, Trump's former personal defense lawyer who was narrowly confirmed by the Senate in early August, insisted the president has never asked him to cross an ethical or legal line and vowed the department would still 'prosecute without fear or any sort of favor.' Critics, including some Democrats, say the remarks confirm fears that DOJ decision-making is being subordinated to White House political interests.","source":"CNN","url":"https://www.cnn.com/2026/08/16/politics/todd-blanche-trump-administration"},{"headline":"US and Canada Race to Strike Deal Before 50% Tariff Deadline","body":"Washington and Ottawa are working to reach an agreement that would avert a scheduled jump to 50 percent tariffs on a range of Canadian exports, including hockey sticks, wine, and cement, set to take effect just after midnight Wednesday. Industry executives and trade specialists say talks have intensified as the deadline nears, following a year of escalating trade friction between the two historically close economic partners. The outcome will determine tariff exposure for billions of dollars in cross-border trade in agriculture, dairy, furniture, and alcohol.","source":"The Washington Post","url":"https://www.washingtonpost.com/business/2026/08/15/canada-tariffs-trump-deadline/"},{"headline":"White House Reframes East Wing Demolition as 'National Security' Project","body":"The Trump administration is now describing the controversial demolition and rebuilding of the White House East Wing as a necessary national security structure, a shift from earlier justifications that focused on hosting VIP guests. The change in rationale comes as the project, which critics say has strayed far from its original scope, draws continued scrutiny over cost and purpose. The administration has not detailed what specific security functions the new wing will serve.","source":"The Washington Post","url":"https://www.washingtonpost.com/politics/"},{"headline":"Trump Pushes for WWII-Style Redesign of Future Aircraft Carrier Fleet","body":"President Trump is pressing the Navy to redesign its next generation of aircraft carriers to more closely resemble the larger, more heavily armed carriers built during World War II, a shift that defense officials say could add billions of dollars to shipbuilding costs. The push comes amid broader debate inside the Pentagon over the survivability of large carriers against advanced missile threats from rivals like China. Details on which specific design changes the administration is seeking have not been finalized publicly.","source":"The Washington Post","url":"https://www.washingtonpost.com/politics/"}],"pacific":{"pacificCommand":[{"headline":"Canberra Commits $19.5 Billion to New AUKUS Submarine Shipyard","body":"Australia has unveiled plans to spend roughly $19.5 billion building a new nuclear-submarine construction yard in the Osborne precinct of Adelaide, explicitly modeled on BAE Systems' Barrow-in-Furness facility in the UK. The announcement builds on Canberra's earlier pledge of A$4.6 billion in July, pushing total government investment in the Osborne yard to about A$8.5 billion as it races to stand up sovereign production of SSN-AUKUS boats. The move underscores Australia's effort to close the capability gap before its own nuclear submarines enter service in the early 2030s, even as U.S. shipyards continue to struggle to hit the Virginia-class production rates needed to support parallel transfers to Canberra.","source":"Militarnyi","url":"https://militarnyi.com/en/news/australia-new-shipyard-aukus-submarines/"},{"headline":"Tokyo Set to Request Record $56 Billion Defense Budget as White Paper Warns of Chinese Reach","body":"Japan's Ministry of Defense is preparing to submit a record roughly JPY8.9 trillion ($56.1 billion) defense budget request by the end of August, building on this year's white paper that branded China an 'unprecedented and the greatest strategic challenge' to Japanese security. The document, released August 4, flagged Beijing's growing ability to project military power beyond the First Island Chain running through Japan's southwestern islands, Taiwan and the Philippines. Tokyo has already hit its 2% of GDP defense-spending target and is accelerating a rewrite of its three core security strategy documents ahead of schedule this year.","source":"Defense News","url":"https://www.defensenews.com/global/asia-pacific/2026/08/10/japans-2026-defense-white-paper-highlights-new-era-of-crisis-in-indo-pacific/"},{"headline":"Manila's ASEAN Chairmanship Fails to Shift Bloc's South China Sea Language Despite Rising Clashes","body":"Even holding the ASEAN gavel in 2026 and having drafted this year's foreign ministers' communique, the Philippines could not get the bloc to explicitly cite the 2016 arbitral tribunal ruling against China, leaving the language effectively unchanged from the prior year's Malaysian-chaired statement. That diplomatic stall comes as Manila and Beijing clashed three separate times in a single week in July at Scarborough Shoal and Second Thomas Shoal, prompting joint maritime drills involving the Philippines, the United States and Japan. The Philippines has also pressed ahead outside the ASEAN track, formally submitting an extended continental shelf claim to the UN that Beijing has denounced as infringing on Chinese sovereignty.","source":"Council on Foreign Relations","url":"https://www.cfr.org/global-conflict-tracker/conflict/territorial-disputes-south-china-sea"}],"pacingThreat":[{"headline":"PLA Air Force Reveals AI System for Planning Mass Strike Operations","body":"A CCTV documentary marking the PLA's 99th anniversary disclosed that the PLA Air Force is now using an artificial-intelligence system to design large-scale strike operations, quietly fielded rather than unveiled with fanfare. The system reportedly prioritizes targets from a pool of hundreds, synchronizes dozens of formations, and issues tasking to more than 100 tactical units, and has already been used operationally according to the broadcast. Its emergence tracks closely with Xi Jinping's late-July directive ordering the military to accelerate adoption of unmanned and intelligent technologies, offering rare open-source insight into how quickly the PLA is operationalizing AI-enabled command and control.","source":"The Diplomat","url":"https://thediplomat.com/2026/08/chinas-military-is-now-using-ai-to-plan-strike-operations/"},{"headline":"Chinese and Indonesian Navies Wrap Up Joint Drill in Waters East of Taiwan","body":"China's Ministry of National Defense confirmed that PLA Navy and Indonesian naval units concluded a joint navigation exercise on August 12 in waters east of Taiwan, following a goodwill visit by a Chinese naval task group to Indonesia earlier in the month and an earlier stop in Brunei in July. The drills illustrate Beijing's continued push to normalize PLA Navy presence in seas near Taiwan while simultaneously deepening security ties with Southeast Asian partners. China's defense ministry separately reaffirmed it will keep conducting what it calls 'rights-protection' patrols near Ren'ai Jiao, the Chinese name for Second Thomas Shoal, signaling no letup in South China Sea assertiveness alongside the outreach to Jakarta.","source":"Ministry of National Defense of the People's Republic of China","url":"http://eng.mod.gov.cn/"},{"headline":"Taiwan Runs Record Reservist Call-Up and Citywide Resilience Drill Amid Gray-Zone Pressure","body":"Taiwan's annual Han Kuang exercises are running through mid-August with the largest reservist mobilization on record and expanded anti-blockade drills, part of a broader effort to prepare for a potential Chinese blockade or invasion without provoking a matching PLA surge. In Taipei, authorities staged a 30-minute urban resilience drill ordering residents into shelters and temporarily throttling mobile data service, testing civil-defense readiness alongside the military exercises. Earlier drills this month also tested relocating weapons production lines to civilian factories, aiming to keep munitions output running if Chinese strikes were to hit Taiwan's defense-industrial hubs.","source":"Focus Taiwan","url":"https://focustaiwan.tw/"}]},"europe":{"ukraineRussia":[{"headline":"Russian Barrage Kills Seven, Wounds Dozens as NATO Downs Drone Over Romania","body":"A weekend Russian barrage killed seven people and injured 51 across Ukraine, with a major steel plant hit in an overnight strike, while NATO fighters shot down a Russian drone that crossed into Romanian airspace. Separately, a Russian strike on Kyiv set the city's iconic book market ablaze and injured three people, sparking fires across the capital overnight into August 16. The incidents come as Ukraine's parliament prepares to return from summer recess on August 18 amid ongoing protests over the dismissal of a senior anti-corruption official.","source":"Kyiv Independent","url":"https://kyivindependent.com/"},{"headline":"Ukraine Pounds Moscow Region in Major Drone Strike on Wildberries Logistics Hub","body":"Ukraine launched one of its largest drone attacks yet on Moscow Oblast, damaging a warehouse run by Russian e-commerce giant Wildberries as part of a campaign that has now knocked out seven of the ten biggest Wildberries logistics centers used by Russian forces. Ukraine's military says Russia's cumulative personnel losses since February 2022 have climbed to roughly 1,468,760, including 1,440 in the past day alone, even as Ukrainian commanders warn Moscow is preparing to intensify missile and jet-powered drone strikes.","source":"Ukrinform","url":"https://www.ukrinform.net/rubric-ato"}],"europe":[{"headline":"NATO Grapples With Wave of Airspace Violations and Drone Incidents","body":"NATO's North Atlantic Council convened on August 12 to address a string of airspace violations over Poland and Romania alongside a rising number of drone incursions, pledging solidarity with the affected allies. The alarm has only grown since: NATO jets shot down a stray drone over Latvia on August 13, adding to a summer that has included drone sightings near German military bases and warnings from Lithuania and Poland about possible Russian sabotage or false-flag operations.","source":"NATO / Bloomberg","url":"https://www.nato.int/en"},{"headline":"Middle East Turmoil and Drought Squeeze Europe's Energy Supplies","body":"Brussels is scrambling to shield households and industry as the 2026 Middle East crisis drives up fossil-fuel prices, prompting the European Commission's new 'AccelerateEU' package and a temporary state-aid framework for exposed sectors like agriculture and energy-intensive industry through the end of the year. Compounding the strain, abnormally low water levels on the Rhine and other major rivers are curbing hydropower and nuclear-plant cooling capacity during a summer heat wave, pushing Italy, Poland and other capitals to weigh emergency fuel-price caps and subsidies.","source":"European Commission / Modern Diplomacy","url":"https://commission.europa.eu/topics/energy/eu-action-address-energy-crisis_en"}]},"middleEast":[{"headline":"Kushner Holds Rare Direct Talks With Hamas to Salvage Gaza Plan","body":"White House adviser Jared Kushner met Hamas's leader in El Alamein, Egypt, alongside Board of Peace director Nickolay Mladenov, an unusual direct engagement aimed at reviving President Trump's Gaza roadmap after Israel rejected it last week. Kushner also met Egyptian President Abdel Fattah el-Sisi and was scheduled to see Israeli Prime Minister Benjamin Netanyahu on Monday, while foreign ministers from Jordan, the UAE, Turkey, Saudi Arabia, Qatar and Egypt issued a joint statement criticizing Israel's rejection of the plan.","source":"CNN","url":"https://www.cnn.com/2026/08/16/world/live-news/iran-war-trump"},{"headline":"Netanyahu Digs In Against Trump's 15-Point Gaza Plan","body":"Netanyahu told his Cabinet that Israel rejects the 15-point Gaza document and will not withdraw troops until Hamas is genuinely disarmed, even as talks with Washington over Gaza's future continue. Hamas has signaled it will only begin disarming if Netanyahu publicly commits to the plan, leaving Egyptian, Turkish and Qatari mediators searching for a compromise after Kushner's first direct meeting with the group's leadership since the ceasefire.","source":"PBS News / Times of Israel","url":"https://www.pbs.org/newshour/world/israel-rejects-trumps-gaza-plan-more-details-emerge-on-the-strait-of-hormuz-and-other-mideast-news"},{"headline":"Houthi and Militia Threats Widen as Israel Strikes Lebanon","body":"Saudi Arabia is bracing for possible attacks on its ports and airports from Iraqi militias operating alongside Iran-backed Houthi forces, while Yemen's internationally recognized government has ramped up its own offensive against the Houthis. Separately, Israel launched deadly strikes in Lebanon after accusing Hezbollah of wounding three Israeli soldiers, a reminder that a pause in direct US-Iran strikes has not calmed the region's adjacent conflict lines.","source":"CNN","url":"https://www.cnn.com/2026/08/16/world/live-news/iran-war-trump"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Discloses Unreleased 'Model 2,' Raises Misalignment Risk Rating","body":"Anthropic's second company-wide Risk Report, published August 14 under its Responsible Scaling Policy, upgraded the company's self-assessed catastrophic misalignment risk from 'very low' to 'low,' and revealed an internal-only frontier model called Model 2 that outperforms the public Mythos 5 but has no scheduled public release. The 186-page filing also disclosed that bioweapon-related safety classifiers were inadvertently disabled across roughly 133 million contractor feedback conversations between May 2025 and April 2026, though Anthropic says it found no evidence of misuse. Separately, an internal benchmark meant to flag dangerous automated-AI-R&D capability jumps has reportedly saturated, raising questions about whether the company's own safety instrumentation can keep pace with its models.","source":"Unite.AI / Tech Times","url":"https://www.unite.ai/anthropic-raises-misalignment-risk-to-low-and-shelves-internal-model-2/"},{"headline":"Google's Rapid-Fire Gemini Releases Underscore Compute and Iteration Race","body":"Google shipped Gemini 3.7 Flash just three weeks after its 3.6 Flash predecessor, lifting coding and agentic-automation benchmark scores substantially -- including a jump on one automation benchmark from 17% to 30.4% -- while holding introductory pricing at $0.75 per million input tokens through the end of 2026. The company is simultaneously retiring its Imagen 4 image-generation API endpoints on August 17, forcing developers onto the newer Gemini image pipeline built around a different underlying method. The moves illustrate how quickly frontier labs are now cycling model generations and forcing enterprise customers to re-test pipelines just to keep up.","source":"AI Weekly","url":"https://aiweekly.co/ai-news-today"}],"cyberEmerging":[{"headline":"China's Cyber Posture Shifts From Espionage to 'Pre-Positioning' for Disruption","body":"A senior cyber-policy analyst at the Foundation for Defense of Democracies said this week that China's strategic focus has moved from traditional intelligence-gathering toward operational readiness, embedding malicious code inside transportation, banking, and water-sector networks so it can trigger disruption during a future crisis. The assessment echoes years of warnings about Volt Typhoon-style intrusions but frames the current posture as deliberately preparatory rather than opportunistic, aimed at complicating any U.S. military response in a Taiwan or broader Indo-Pacific contingency. Officials argue this makes critical-infrastructure resilience, not just breach detection, the priority for defenders.","source":"BankInfoSecurity","url":"https://www.bankinfosecurity.com/chinas-ongoing-cyberthreat-puts-critical-infra-at-risk-a-32544"},{"headline":"AI Labs' Security Incidents Expose Gap in Independent Oversight","body":"A string of disclosures from late July into August -- including a breach affecting OpenAI's Hugging Face-hosted assets and a fully redacted incident in Anthropic's latest risk report -- has intensified scrutiny of how frontier AI companies handle security failures. Analysts at the Institute for Security and Technology note that no outside body currently has the authority to independently verify or compel disclosure of such incidents, leaving the public reliant on the labs' own self-reporting. The debate is sharpened by revelations that Anthropic's model itself flagged the withheld incident as among the most consequential information being kept from public view.","source":"Tech Times","url":"https://www.techtimes.com/articles/324573/20260815/anthropic-upgrades-misalignment-risk-key-safety-benchmarks-saturate.htm"}]},"cities":{"lasVegas":[{"headline":"Zoox CEO Backs Tougher Robotaxi Rules After Vegas Fire-Scene Incident","body":"Zoox chief executive Aicha Evans said stronger regulation of autonomous robotaxis is needed after one of the company's vehicles drove into an active Las Vegas fire scene, a lapse that triggered a fleet-wide recall. The episode adds fresh scrutiny to the rapid rollout of driverless vehicles on Southern Nevada streets. Evans' comments came as local officials weigh how emergency responders and self-driving fleets should coordinate at accident and fire scenes.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Extreme Heat Watch Set to Grip Las Vegas Valley After Brief Monsoon Break","body":"After a short stretch of monsoon storms brought rain and lightning to parts of east and north Las Vegas, forecasters have issued an extreme heat watch for the valley starting Tuesday as temperatures swing back to scorching levels. The whiplash between flash flooding and dangerous heat has strained emergency crews and prompted renewed warnings for outdoor workers and vulnerable residents. Local officials are urging residents to prepare for both hazards this week.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Metro Settles Case Tied to Viral Arrest Video That Drew Millions of Views","body":"Las Vegas Metropolitan Police Department has reached a settlement over an arrest that went viral online, with the video drawing more than 3.4 million views on X alone. Legal experts had called the underlying arrests unconstitutional and retaliatory, fueling public debate over Metro's use-of-force and detention practices. The settlement closes out one of several recent controversies facing the department this summer.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Nellis Gets First Female Wing Commander as Col. Littlejohn Takes Charge","body":"Colonel Christine Littlejohn officially assumed command of the 99th Air Base Wing at Nellis Air Force Base on July 17, becoming the first woman to lead the wing in its history. Littlejohn comes from a multi-generational military family, and her arrival continues a string of leadership changes atop Nellis's sprawling training complex, which oversees the Nevada Test and Training Range and hosts exercises like Red Flag. Her command covers installation support for one of the Air Force's busiest and most complex bases.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"}]},"feelGood":[{"headline":"Rhode Island Community Cools Down Firefighters After City Denies AC Repair","body":"When Pawtucket's Station 3 firehouse was told the city would not pay to replace a broken air conditioner in the crew's dorm room, the surrounding community stepped in with donations to fix the unit themselves. Union secretary-treasurer John Wallace of Pawtucket Firefighters IAF Local 1216 said residents rallied almost immediately once word got out about the denial. The gesture ensured firefighters working around-the-clock shifts wouldn't have to sleep in the summer heat.","source":"NBC 10 WJAR","url":"https://turnto10.com/news/coronavirus/show-us-something-good/pawtucket-community-rallies-to-help-firefighters-with-air-conditioner-donations-summer-support-station-broken-august-11-2026"},{"headline":"Seniors Group Raises Nearly $20,000 in 30 Minutes for Wildfire Victims","body":"Members of the Okanagan Indo Canadian Seniors Society came together and raised $19,184.43 for the SOS Wildfire Response Fund in just half an hour, done in memory of longtime Penticton resident Daljit S. Sidhu. A local credit union's Summerland branch chipped in another $10,000, part of more than 600 donations from individuals, families and businesses supporting families displaced by the fires. The swift, grassroots outpouring has helped wildfire victims begin rebuilding with immediate cash and supplies.","source":"Castanet.net","url":"https://www.castanet.net/news/Summerland/628132/Community-rallies-behind-Summerland-wildfire-victims-with-fundraisers-donations"},{"headline":"Neighbors Step Up to Support Five Children Left Orphaned in Illinois Tragedy","body":"Friends of a 40-year-old Cahokia Heights woman killed in a murder-suicide have organized donation drives to support the five children she left behind, coordinating supplies and financial help as the kids head into a new school year. The grassroots effort reflects a broader pattern of neighbors filling gaps for grieving families, including a separate Jefferson County family that recently donated hundreds of stuffed Beanie Babies to a local sheriff's office to comfort children during traumatic calls. Both efforts show ordinary residents translating tragedy into tangible acts of care.","source":"First Alert 4 (KMOV)","url":"https://www.firstalert4.com/video/2026/08/14/community-rallies-support-5-children-after-cahokia-heights-murder-suicide/"}],"onThisDay":[{"year":"1945","event":"Sukarno proclaimed Indonesia's independence from Dutch colonial rule."},{"year":"1962","event":"East German border guards shot and fatally wounded Peter Fechter as he tried to cross the Berlin Wall."},{"year":"1969","event":"Hurricane Camille made landfall on the Mississippi Gulf Coast as one of the most powerful storms in US history."},{"year":"1978","event":"The Double Eagle II became the first hot air balloon to complete a transatlantic crossing, landing in France."}]},"topPicks":[{"headline":"Russian Barrage Kills Seven, Wounds Dozens as NATO Downs Drone Over Romania","teaser":"A deadly Russian strike and a NATO drone shootdown mark a dangerous escalation along the alliance's eastern flank."},{"headline":"Trump Orders Sharp Cutback in US-South Korea War Games, Citing Kim Jong Un Rapport","teaser":"A major shift in US Indo-Pacific strategy could reshape deterrence posture toward North Korea and China."},{"headline":"Kushner Holds Rare Direct Talks With Hamas to Salvage Gaza Plan","teaser":"Direct US engagement with Hamas signals a high-stakes push to revive a fragile Gaza peace framework."}]},"navDates":[{"key":"2026-08-19","label":"Aug 19","href":"/","isNewest":true},{"key":"2026-08-18","label":"Aug 18","href":"/archive/2026-08-18.html","isNewest":false},{"key":"2026-08-17","label":"Aug 17","href":"/archive/2026-08-17.html","isNewest":false},{"key":"2026-08-16","label":"Aug 16","href":"/archive/2026-08-16.html","isNewest":false},{"key":"2026-08-15","label":"Aug 15","href":"/archive/2026-08-15.html","isNewest":false},{"key":"2026-08-14","label":"Aug 14","href":"/archive/2026-08-14.html","isNewest":false},{"key":"2026-08-12","label":"Aug 12","href":"/archive/2026-08-12.html","isNewest":false}],"currentKey":"2026-08-17","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-17.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
