<script>
const STATE = {"digest":{"date":"Sunday, November 8, 2026","generatedAt":"Sun, Nov 8, 7:57 AM PST","breaking":{"headline":"House Set to Vote This Week on Impeaching Defense Secretary Hegseth","body":"Rep. Thomas Massie says he will force a House vote the week of November 9 on his eight-article impeachment resolution against Defense Secretary Pete Hegseth, which would be the first impeachment vote against a Pentagon chief since 1876. House Minority Leader Hakeem Jeffries said Sunday he is now a 'hard yes,' tying his support to Hegseth's role in the Iran war that Democrats blame for the GOP's midterm losses, where Democrats are on track for a 240-plus seat House majority. Trump is privately urging Hegseth to fight the effort rather than resign, but GOP defections remain possible in a narrowly divided chamber, even though a two-thirds Senate vote would still be required to remove him from office.","source":"ABC News","url":"https://abcnews.com/Politics/im-hard-hakeem-jeffries-announces-support-hegseth-impeachment/story?id=137952235"},"tabs":{"defense":{"defense":[{"headline":"US Confirms New Strikes on Iranian Air Defenses at Qeshm Island","body":"President Trump confirmed that US forces carried out limited strikes on November 6 against an Iranian air defense system on Qeshm Island in the Strait of Hormuz, describing the action as 'minor' and saying the site was disabled within roughly 15 minutes. Iranian state media reported two explosions in the Suza area, and separate reports say Iran is now considering scrapping its self-imposed 2,000-kilometer missile-range limit and is in talks with Moscow over acquiring S-400 air defenses, raising the stakes of further escalation.","source":"RFE/RL","url":"https://www.rferl.org/a/iran-live-blog-trump-middle-east/33803414.html"},{"headline":"CENTCOM Stands Up Task Force to Cut Off Iran's Military Supply Routes","body":"US Central Command announced on November 7 a new task force dedicated to disrupting Iran's land-based military resupply routes, broadening a campaign that has already seen US forces disable 11 vessels attempting to run the American naval blockade in the Gulf since July, including another cargo ship intercepted this weekend. The expansion comes as Iran claims mines struck two tankers, pointing to a widening shadow war in and around the Strait of Hormuz.","source":"GovBrief","url":"https://govbrief.today/what-happened-today-november-7-2026"},{"headline":"Germany to Invest €50 Million in AI-Driven Military Intelligence Tool","body":"The German armed forces plan to spend €50 million on a new internet-focused open-source intelligence platform that uses artificial intelligence to scan and analyze online data for military intelligence purposes, according to German trade outlet Hartpunkt. The investment comes the same week reports surfaced of GPS jamming affecting nearly all of NATO's eastern flank in a single day, underscoring allied efforts to modernize intelligence and resilience tools against hybrid threats.","source":"Militarnyi","url":"https://militarnyi.com/en/news/"}],"acquisitions":[{"headline":"Navy Awards $222.5 Million Contract to Overhaul Destroyer USS Gridley","body":"The US Navy has awarded ship repair firm Vigor Marine a $222.5 million contract to put the Arleigh Burke-class destroyer USS Gridley through a roughly two-year modernization overhaul following back-to-back deployments. The award reflects the service's push to extend the life of its aging DDG fleet amid sustained high operational tempo across the Middle East and Indo-Pacific.","source":"Defence Blog","url":"https://defence-blog.com/"},{"headline":"Marine Corps More Than Doubles M27 Rifle Contract With Heckler & Koch","body":"The US Marine Corps has expanded its sole-source contract with Heckler & Koch for M27 Infantry Automatic Rifles, adding $45.4 million and significantly raising the deal's maximum ceiling. The modification underscores the Corps' continued commitment to the M27 as its standard infantry rifle amid steady production demand.","source":"Defence Blog","url":"https://defence-blog.com/"}]},"us":[{"headline":"Mississippi Senate Race Heads to the Wire With No Recount Law in Place","body":"Democrat Scott Colom's lead over seven-year GOP incumbent Cindy Hyde-Smith widened to roughly 2,574 votes as of Saturday, with about 97 percent of ballots counted in a state Trump carried with 61 percent two years ago. Because Mississippi has no automatic or petitioned recount statute, both campaigns have sent election lawyers, including Colom's team from the Elias Law Group, to monitor outstanding ballots ahead of the state's November 13 certification deadline. A Colom victory would make him the first Black senator from Mississippi since Reconstruction, an unexpected late pickup even though Democrats have already clinched a Senate majority nationally.","source":"MS NOW","url":"https://www.ms.now/news/mississippi-senate-election-scott-colom-hyde-smith"},{"headline":"AI-Driven Wall Street Rout Deepens as Democrats' Congressional Sweep Spooks Investors","body":"A tech-led sell-off erased roughly 2.5 trillion dollars in market value last Thursday, with the Nasdaq sinking 5.5 percent into correction territory in its worst session since the 2025 tariff shock; chipmakers including Micron and Nvidia and data-center players like CoreWeave and Nebius posted double-digit percentage losses on fears a Democratic-controlled Congress will slow the AI buildout and tighten tech regulation. Trump publicly blamed Democrats for the rout, warning that ordinary Americans' 401(k) balances had been hit. By Saturday, the Nasdaq-heavy QQQ fund was still down more than 13 percent over the trailing month even as third-quarter GDP growth was reported at a solid 3.4 percent annualized pace, underscoring the disconnect between the real economy and tech-stock anxiety.","source":"CNN","url":"https://www.cnn.com/2026/11/05/investing/tech-heavy-nasdaq-plunges"},{"headline":"Supreme Court Rebuffs Trump Bid to Flag 20,000 Suspected-Noncitizen Ballots in California","body":"In a brief, unsigned order issued just before Election Day, the Supreme Court declined the Trump administration's emergency request to force California to segregate roughly 20,000 ballots cast by registered voters federal officials suspected, without presenting clear evidence, of being noncitizens. The justices gave no explanation and noted no public dissents, leaving intact lower-court decisions that had already rejected the administration's push for last-minute changes to ballot-handling procedures. The ruling is being read as a check on White House efforts to use the federal courts to alter state election administration on the eve of a vote.","source":"Justice Roundup (Substack)","url":"https://thejusticeguy.substack.com/p/justice-roundup-week-of-november"},{"headline":"Trump Lashes Out at Midterm Drubbing, Calls for DOJ Probe of Democrats","body":"Days after Democrats secured majorities in both the House and Senate, Trump said Sunday the country had taken a 'giant step back' through the midterm results and renewed calls for the Justice Department to investigate Democrats over unspecified threats, offering no supporting evidence. He has also repeatedly tied last week's historic stock market swings to the election outcome. The fallout has exposed fractures inside the GOP, with potential 2028 contenders such as Marco Rubio, Ron DeSantis and JD Vance beginning to publicly distance themselves from the president's agenda while still avoiding direct criticism of him.","source":"ABC News","url":"https://abcnews.com/Politics/live-updates/midterm-elections-live-updates/?id=137782085"}],"pacific":{"pacificCommand":[{"headline":"Japan to Upgrade Okinawa Brigade to Division Amid Taiwan Contingency Planning","body":"Japan's Ministry of Defense plans to upgrade the Ground Self-Defense Force's 15th Brigade in Naha, Okinawa into a full division this fiscal year, according to a Yomiuri Shimbun report citing government sources. The move is explicitly tied to preparations for a possible Taiwan contingency and would significantly expand troop levels on the southwestern islands closest to the strait. It comes as Tokyo separately finalizes a defense plan that could nearly double five-year spending to roughly 80 trillion yen (about $507 billion) for fiscal 2027-2031, with new investment in drones, AI, and coastal missile defense.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/11/07/2003867316"},{"headline":"Manila Pushes Back as Beijing Warns Over South China Sea Interference","body":"Chinese Foreign Minister Wang Yi phoned his Philippine counterpart this week to warn against what Beijing called malicious interference by Filipino politicians in bilateral ties, urging Manila to speak with one voice on the South China Sea. The Philippine defense secretary fired back by labeling China a troublemaker in the region, while China's ambassador in Manila dismissed the criticism and suggested Beijing could easily prevail if force were used. The exchange underscores how little room remains for compromise even as both governments nominally keep diplomatic channels open.","source":"Associated Press via Washington Times","url":"https://www.washingtontimes.com/news/2026/nov/4/china-warns-philippines-cautious-south-china-sea/"},{"headline":"India and Australia Deepen Defense Ties to Counter China's Indo-Pacific Assertiveness","body":"A new report highlighted this week how India and Australia have expanded defense cooperation well beyond symbolic gestures, now covering anti-submarine warfare, air-to-air refueling, and submarine-related cooperation, alongside a classified maritime security roadmap signed during Prime Minister Modi's July visit to Canberra. The partnership, which also underpins Quad maritime-domain-awareness efforts with Japan and the US, was reinforced by the AUSTRAHIND 2026 exercise that wrapped up November 1 in Kerala, pairing roughly 120 soldiers each from the Indian Army's Garhwal Rifles and Australia's 13th Brigade. Analysts frame the deepening ties as a hedge against both China's regional assertiveness and uncertainty over future US commitment to the Indo-Pacific.","source":"IANS","url":"https://ianslive.in/india-australia-defence-ties-gain-strategic-depth-amid-chinas-assertiveness--20261107165402"}],"pacingThreat":[{"headline":"Xi's Purge Leaves PLA's Top Military Body With Just Two Members","body":"Xi Jinping's military purge has left the Central Military Commission with only two sitting members, Xi himself and Zhang Shengmin, after the ouster of former vice chairmen Zhang Youxia and Liu Zhenli, who were accused in PLA media of undermining Xi's authority and combat readiness. Zhang Youxia, detained since January 2026, was formally expelled from the Communist Party in September, a decision ratified by the Central Committee in October. Taiwanese military scholars argue the purge likely delays the PLA's modernization and invasion-preparedness timeline by one to two years even as it raises the risk of miscalculation from a thinned-out command structure.","source":"Rio Times","url":"https://www.riotimesonline.com/china-military-purge-explained-2026/"},{"headline":"China Tests Upgraded HQ-Series Interceptor Missiles in Desert Drill","body":"Chinese state broadcaster CCTV aired footage of a PLA air-defense battalion road-marching thousands of kilometers before rapidly setting up HQ-series interceptor missiles in a northwestern desert, part of a drill described as pushing Chinese firepower toward the maritime frontier. The exercise tested at least two missile variants designed to engage threats at different altitudes, including an exo-atmospheric interceptor first revealed at last year's Beijing parade. Chinese analysts say integrating the system with laser and microwave weapons will let the PLA better counter drone swarms, a capability with direct relevance to any future Taiwan Strait contingency.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3373094/chinas-hq-series-intercepts-2-new-missile-types-pla-tests-weapon-platform"},{"headline":"Taiwan Detects Over 100 PLA and Coast Guard Ships in Suspected Isolation Drill","body":"Taiwan's defense ministry logged four PLA aircraft sorties and six PLA Navy vessels operating around the island in the 24 hours ending the morning of November 8, part of a broader pattern analysts say reflects two major PLA-coast guard concentrations rehearsing isolation tactics. One cluster has massed between Taiwan and its regional partners while a second grouping of at least six China Coast Guard ships and an unspecified number of PLA Navy vessels encircles the island itself. Citing Institute for the Study of War data, the report also noted 49 Chinese aircraft sorties around Taiwan on a single day the prior week, with 36 flying south of the island in apparent support of four separate task forces operating in the western Pacific.","source":"Taipei Times","url":"https://taipeitimes.com/News/front/archives/2026/11/08/2003867351"}]},"europe":{"ukraineRussia":[{"headline":"Russia Launches One of War's Largest Missile Barrages at Kyiv, Knocking Out Power and Water","body":"Russian forces fired 36 ballistic missiles alongside 172 attack drones at Kyiv overnight into November 7, striking substations that feed two nuclear plants and damaging the Northern Bridge, leaving large parts of the capital without power or water as temperatures near freezing. Zelensky said preliminary evidence points to North Korean-made KN-23 missiles among the munitions used, and only 4 of the 36 ballistic missiles were intercepted. DTEK reported over 600,000 customers lost power in Dnipropetrovsk region alone, with another 250,000 affected in Kharkiv, as Russia continues a winter campaign against Ukraine's energy grid.","source":"CBS News / Kyiv Post","url":"https://www.cbsnews.com/news/ukraine-russia-war-strike-power/"},{"headline":"Ukraine Hits Russian Missile-Component Plant in Oryol as Both Sides Escalate Deep Strikes","body":"Ukrainian Neptune missiles struck the Proton industrial cluster in Oryol on November 7, a facility that manufactures components for Iskander-M, Kover cruise missiles, and Pantsir-S1 air defense systems, sparking a major fire. The same day Ukrainian drones hit the Saratov oil refinery for at least the eighth time in 2026 and a defense warehouse in Rostov, while separate strikes destroyed two Iskander launchers and a Pantsir-S1 system inside Russia's Bryansk region. Analysts note these long-range strikes have become critical for Kyiv as its air-defense interceptor stockpiles dwindle ahead of a difficult winter.","source":"Institute for the Study of War","url":"https://www.criticalthreats.org/analysis/russian-offensive-campaign-assessment-november-7-2026-6aefc4cc503e5"}],"europe":[{"headline":"NATO Opens Counter-Drone 'Marketplace' as Alliance Moves Toward Deep-Strike Doctrine","body":"NATO's communications agency launched a Counter-Unmanned Aircraft Systems marketplace on November 5, pre-qualifying 16 systems from five companies so member states can order counter-drone equipment without running separate tenders; French firm Alta Ares secured six of the lots covering area and border defense. The move, part of the alliance's broader Drone Edge initiative unveiled at July's Ankara defense forum, comes as the Wall Street Journal reported NATO is also finalizing a new operational plan that would authorize strikes deep inside Russian territory in a future conflict. Poland's defense minister has separately warned Western contractors that future NATO procurement will require manufacturing inside Europe after Patriot air-defense delivery delays exposed supply-chain weaknesses on the eastern flank.","source":"Aerotime / RealClearDefense","url":"https://aerotime.aero/articles/nato-counter-drone-marketplace-16-systems"},{"headline":"Record Migrant Surge Hits Canary Islands as Europe's Migration Strain Deepens","body":"Spanish authorities rescued more than 3,200 migrants attempting the Atlantic crossing to the Canary Islands in just the first six days of November, underscoring how irregular migration remains the most persistent non-military pressure point for European governments heading into winter. The spike adds to strained reception capacity in Spain and feeds a broader EU-wide debate over asylum policy and border enforcement that has fueled nationalist political gains across the continent. The surge comes as European leaders also grapple with a shooting at a market in Krakow, Poland, that has drawn condemnation from leaders across the continent.","source":"Al Jazeera","url":"https://www.aljazeera.com/europe/"}]},"middleEast":[{"headline":"Israel's Herzog Taps Netanyahu Rival Eisenkot to Try to Form Next Government","body":"Israeli President Isaac Herzog on November 7 passed over Prime Minister Benjamin Netanyahu and instead gave opposition leader and former military chief Gadi Eisenkot 28 days to assemble a coalition with 61 Knesset seats. The move came amid protests in Tel Aviv's Habima Square demanding Netanyahu's ouster over a Shin Bet election-interference probe, and a source close to the Haredi Shas party signaled it would not block an Eisenkot-led government if its own spiritual authorities approve. The decision marks one of the most serious challenges yet to Netanyahu's hold on power amid the ongoing regional war.","source":"Al Jazeera / Times of Israel","url":"https://www.aljazeera.com/middle-east/"},{"headline":"Saudi-Houthi Fighting Escalates With Dozens Killed in Sanaa Strikes","body":"The Saudi-led coalition carried out strikes on a village in Bani Hushaysh district outside Sanaa, with Houthi authorities claiming 25 to 27 people killed and roughly 30 injured, while government forces reported battlefield advances elsewhere in Yemen. Yemen's interior minister separately accused Iran and Hezbollah of deploying 21 military operatives, including 14 IRGC members, to support Houthi forces. The violence has intensified since a fragile truce collapsed in July amid the wider regional war, raising fears of further civilian casualties and Saudi retaliation.","source":"Al Jazeera / Jerusalem Post","url":"https://www.aljazeera.com/middle-east/"},{"headline":"US Confirms New Strikes on Iran's Qeshm Island as Tehran Weighs Qatari Nuclear Proposal","body":"President Trump confirmed on November 7 that the US military carried out what he called 'minor' new strikes against Iranian air-defense targets on Qeshm Island, while Iran's IRGC claimed it shot down an American MQ-1 drone over the same area, its 16th claimed drone kill of the war. Two Middle East officials told the Associated Press that Tehran is reviewing a Qatari-brokered proposal aimed at narrowing differences with Washington over its nuclear program, though one official cautioned Iran won't formally negotiate until its core conditions are met. The standoff comes alongside a suspected missile attack that killed a seafarer on a tanker in the Gulf and a US Embassy security alert warning of heightened Houthi attack risk.","source":"Al Jazeera / CBS News","url":"https://www.globalsecurity.org/military/ops/iran-war-oprep.htm"}],"techAI":{"aiCompetition":[{"headline":"OpenAI Closes First Tranche of $11 Billion Round, Pushing Valuation to $1.25 Trillion","body":"OpenAI has begun drawing down an open funding round that has already brought in $11 billion from backers including SoftBank and MGX as of November 6, pricing the company at roughly $1.25 trillion. The infusion comes as OpenAI races to lock in data-center capacity even as Wall Street grows jittery over AI valuations, with chip and memory stocks like Nvidia, Broadcom and Micron selling off this week on fears that infrastructure spending could slow. The scale of the raise underscores how compute buildout, not just model research, has become the main battleground among frontier labs.","source":"AI Funding Tracker","url":"https://aifundingtracker.com/ai-funding-news-nov-7-8-2026/"},{"headline":"Alphabet's Isomorphic Labs Seeks $5 Billion at $50 Billion Valuation for AI Drug Discovery","body":"Google DeepMind spinout Isomorphic Labs is negotiating a roughly $5 billion funding round that would value the company at about $50 billion, according to people familiar with the talks reported November 4. The capital would deepen Isomorphic's push to use AI models for drug discovery, a bet that frontier AI's next big commercial payoff may come from life sciences rather than chatbots. The round, still unclosed and subject to change, signals investors are willing to pour billions into specialized AI applications even as broader AI equity markets wobble.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-11-04/isomorphic-labs-in-talks-for-about-5-billion-in-funding"}],"cyberEmerging":[{"headline":"US Intelligence Memo Says China's MSS Recruited Nvidia-Linked Executive to Target Jensen Huang","body":"A US intelligence memo reported this weekend concludes that Alice Huang, an executive at Singapore-based, Alibaba-backed chip customer Megaspeed, was recruited by China's Ministry of State Security with the specific goal of gathering information on Nvidia CEO Jensen Huang and pushing him to lobby for looser chip-export controls. Agencies reportedly tracked her for about a year after photographing her at business dinners with Huang in Singapore, and the memo describes a personal relationship between the two; Nvidia says such customer meetings are routine. The disclosure escalates an existing congressional demand for Huang to brief lawmakers on Megaspeed by November 18, deepening scrutiny of Nvidia's China-linked customers amid the broader chip-export fight.","source":"TechCrunch","url":"https://techcrunch.com/2026/11/07/chinese-exec-was-recruited-to-spy-on-nvidia-ceo-according-to-us-intelligence-memo/"},{"headline":"Google DeepMind Shows AI Agents Can Compress Years of Cryptanalysis Into Weeks","body":"Google DeepMind published two working papers on November 6 showing human-guided AI agents uncovered two weaknesses in legacy 1024-bit RSA encryption, including a digital-signature forgery flaw and a faster batch-factoring method, reproducing a previously solved attack using roughly 3.5 times less computing power than the original academic team. The firm stressed that modern 2048-bit RSA systems used in banking and software updates remain unaffected, but framed the result as evidence that AI can now probe decades-old cryptographic hardness assumptions far faster than human researchers. The findings add urgency to policy debates over how fast agencies and industry must retire legacy encryption as agentic AI capabilities accelerate.","source":"TokenPost","url":"https://www.tokenpost.com/news/technology/51646"}]},"cities":{"lasVegas":[{"headline":"Family of slain 20-year-old demands FBI answers three weeks after killing","body":"Protesters gathered outside the FBI's Las Vegas Field Office on November 7, demanding accountability in the case of Victor Saganitso, a 20-year-old father who was killed roughly three weeks earlier. Family and friends say investigators have not provided adequate updates and are pushing publicly for justice and transparency in the probe. The demonstration reflects growing frustration among valley residents over the pace of federal investigations into recent violent crimes.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Attorney from Tupac Shakur murder trial dies at 55","body":"Michael Sanft, the defense attorney who represented Duane 'Keffe D' Davis in the Tupac Shakur murder trial, has died at age 55. Sanft gained national attention for his role defending Davis, who was convicted in connection with the 1996 killing of the rapper. His death adds a somber coda to one of the most closely watched Las Vegas courtroom cases in recent memory.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"UNLV hosts conference confronting rising antisemitism","body":"UNLV partnered with the Anti-Defamation League on November 6 for a conference addressing a documented rise in antisemitic incidents, drawing speakers including Rabbi Bradley Tecktiel. University president Chris Heavey told attendees the timing of the discussion was urgent given current tensions. The gathering is part of a broader push by Nevada institutions to respond to hate-motivated incidents on campus and in the community.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"}],"nellis":[{"headline":"Air Force eyes $1 billion Nellis campus to test next-gen F-47 fighters","body":"The Air Force has posted a pre-solicitation notice outlining plans for a new, roughly $1 billion testing campus on the east side of Nellis Air Force Base dedicated to evaluating the next-generation F-47 fighter jet. The project would expand on Nellis's existing role running advanced combat aviation training and composite-force exercises involving every Air Force aircraft type. The move comes as Nellis continues absorbing new missions following the retirement of its last operational A-10 Warthogs in September, underscoring the base's growing importance to the Air Force's future fighter programs.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/military/air-force-seeks-1b-campus-at-nellis-to-make-fighter-jets-3905477/"}]},"feelGood":[{"headline":"Mother of three dives into flooded lake to save drowning stranger","body":"A mother of three became an unexpected hero this week after jumping into a flooded lake to pull an elderly man to safety as he struggled in the water. The rescue, reported November 7, is part of a wave of flood-related heroics as volunteers and bystanders across the country have stepped in during recent storms. Her quick action likely prevented a tragedy and has drawn praise from local responders.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"New Jersey students pack football field with quarter-million pounds of food for families in need","body":"Hundreds of students in New Jersey turned a football field into a sea of donation bags, collecting more than 250,000 pounds of food for struggling families and setting a new record for the nonprofit organizing the drive. The November 4 event shows how youth-led mobilization can produce massive humanitarian impact in a single day. Organizers say the haul will stock food pantries serving families through the winter months.","source":"SunnySkyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Adventurer finally embraces his mother after 28-year walk around the world","body":"A long-distance walker completed an extraordinary journey that spanned 28 years, finally returning home to the United Kingdom to hug his mother after circling the globe on foot. The emotional reunion, reported November 6, caps a decades-long personal odyssey that outlasted countless obstacles and setbacks. The story has resonated widely as a testament to persistence and the pull of family bonds across a lifetime of travel.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/"}],"onThisDay":[{"year":"1895","event":"German physicist Wilhelm Röntgen discovered X-rays while experimenting with cathode rays."},{"year":"1923","event":"Adolf Hitler and the Nazi Party launched the failed Beer Hall Putsch in Munich."},{"year":"1942","event":"Allied forces launched Operation Torch, the invasion of French North Africa during World War II."},{"year":"1960","event":"John F. Kennedy was elected President of the United States, narrowly defeating Richard Nixon."}]},"topPicks":[{"headline":"House Set to Vote This Week on Impeaching Defense Secretary Hegseth","teaser":"A looming impeachment vote threatens to shake up US defense leadership and deepen political turmoil in Washington."},{"headline":"Russia Launches One of War's Largest Missile Barrages at Kyiv, Knocking Out Power and Water","teaser":"A massive Russian strike cripples Kyiv's infrastructure, escalating the war and raising humanitarian concerns for millions."},{"headline":"AI-Driven Wall Street Rout Deepens as Democrats' Congressional Sweep Spooks Investors","teaser":"Market turmoil intensifies as investors react to shifting political power and uncertainty over economic policy direction."}]},"navDates":[{"key":"2026-11-11","label":"Nov 11","href":"/","isNewest":true},{"key":"2026-11-10","label":"Nov 10","href":"/archive/2026-11-10.html","isNewest":false},{"key":"2026-11-09","label":"Nov 9","href":"/archive/2026-11-09.html","isNewest":false},{"key":"2026-11-08","label":"Nov 8","href":"/archive/2026-11-08.html","isNewest":false},{"key":"2026-11-07","label":"Nov 7","href":"/archive/2026-11-07.html","isNewest":false},{"key":"2026-11-06","label":"Nov 6","href":"/archive/2026-11-06.html","isNewest":false},{"key":"2026-11-05","label":"Nov 5","href":"/archive/2026-11-05.html","isNewest":false}],"currentKey":"2026-11-08","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-08.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
