<script>
const STATE = {"digest":{"date":"Saturday, August 15, 2026","generatedAt":"Sat, Aug 15, 7:14 AM PDT","breaking":{"headline":"Trump orders sweeping overhaul of Navy shipbuilding, opening door to foreign-built warships","body":"President Trump signed a National Security Presidential Memorandum on August 13 directing a major restructuring of Navy shipbuilding, using Title 10 waiver authority to allow warships to be built in foreign shipyards, establishing a fifth public naval shipyard, and reversing course on the Ford-class carrier program by ordering a return to steam-powered catapults instead of the electromagnetic system. The move marks one of the most consequential shifts in U.S. naval acquisition policy in decades and is expected to reshape the domestic and allied shipbuilding industrial base for years. Critics note the reversal on carrier catapult technology could add billions in costs and years of delay to a program already plagued by cost overruns.","source":"InsideDefense / The Verardo Group","url":"https://insidedefense.com/"},"tabs":{"defense":{"defense":[{"headline":"USS George Washington deploys to Middle East as Abraham Lincoln crew shows strain","body":"The Pentagon is sending the aircraft carrier USS George Washington to relieve the USS Abraham Lincoln, which has been on an extended deployment tied to the ongoing conflict with Iran. The rotation comes amid reports of multiple attempted suicides aboard the Lincoln, underscoring the toll of prolonged combat deployments in the Strait of Hormuz region. The swap reflects continued heavy carrier presence requirements even as the administration seeks to wind down direct involvement in the Iran war.","source":"Just Security / Democracy Now!","url":"https://www.justsecurity.org/153863/early-edition-august-14-2026/"},{"headline":"Trump authorizes private companies to 'hack back' foreign cybercriminals","body":"A National Security Presidential Memorandum signed this week directs the Departments of Justice and Homeland Security to build a first-of-its-kind program letting vetted private firms conduct offensive cyber operations, including surveillance and disruptive attacks, against foreign ransomware gangs and financial-scam networks. Companies may target a foreign criminal group only if it is not an institutional arm of a foreign government, though the presumption favors permitting action absent clear intelligence of a state link a standard experts warn could be exploited given how often state actors hide behind ostensibly independent proxies. The policy reverses a long-standing U.S. posture that barred private hack-back operations for fear of triggering geopolitical escalation.","source":"The Verardo Group / Washington Post","url":"https://theverardogroup.substack.com/p/tvg-daily-brief-14-aug-2026"},{"headline":"NATO jet downs drone over Latvia as alliance tracks airspace violations","body":"NATO fighter aircraft shot down an unmanned aerial vehicle that entered Latvian airspace overnight, triggering air alerts across several regions as the alliance's roughly 650-strong Baltic Trust exercise continued at Latvia's S─ôlija range through August 14, with Ukraine, Australia and Japan participating alongside allied forces. The incident follows an August 12 North Atlantic Council meeting where allies condemned recent airspace violations and drone incidents affecting Poland and Romania, expressing solidarity with the affected members. The recurring incursions are intensifying pressure on NATO's eastern-flank air-policing posture heading into the fall exercise season.","source":"NATO / Pravda NATO","url":"https://nato.news-pravda.com/world/2026/08/14/117122.html"}],"acquisitions":[{"headline":"Pentagon expands Standard Missile-3 production with new Boeing agreements","body":"The Pentagon has added Boeing-led component manufacturing agreements to its effort to expand production of the Standard Missile-3 Block IB and Block IIA interceptors, building on the up-to-seven-year production frameworks it struck with RTX in February. The scope and dollar value of the new arrangements were not disclosed, but the move signals a push to widen the industrial base for a missile critical to ballistic-missile defense amid rising demand from Middle East and Indo-Pacific contingencies.","source":"InsideDefense","url":"https://insidedefense.com/"},{"headline":"Army launches 'Project Strike' to widen missile industrial base","body":"The Army announced Project Strike, a new initiative aimed at expanding the missile industrial base to more nontraditional vendors and establishing a steadier demand signal for munitions manufacturers, according to an official from the service's Portfolio Acquisition Executive for Fires. The effort reflects concern that reliance on a handful of legacy primes has constrained surge capacity for munitions amid sustained expenditure rates in Ukraine, the Middle East and Indo-Pacific deterrence stockpiling. Details on funding levels and specific vendor targets were not yet released.","source":"InsideDefense","url":"https://insidedefense.com/"}]},"us":[{"headline":"Trump administration asks Supreme Court to unblock $400 million White House ballroom project","body":"Solicitor General D. John Sauer filed an emergency request Friday asking the justices to lift a federal appeals court order that paused construction of the East Wing ballroom, arguing the halt endangers the safety of the president, his family, and staff. Work is set to stop August 21 unless the Court intervenes, and Sauer contends it is now too late for any court to block the project, which Trump says is funded by roughly $400 million in private donations from firms including Lockheed Martin, Amazon, and Microsoft. Trump has called the underlying appellate ruling 'horrendous, politically motivated, and unlawful' and vowed a full Supreme Court challenge.","source":"CBS News / DNYUZ","url":"https://www.cbsnews.com/news/trump-supreme-court-white-house-ballroom/"},{"headline":"Federal judge lets border wall construction proceed through tribal reservation","body":"A U.S. District Court judge in Washington on Friday declined to block the Trump administration from building 62 miles of border wall through part of a Native American tribe's reservation, rejecting the tribe's bid for a preliminary injunction. The judge, a George W. Bush appointee, had earlier called the request 'extraordinary' and said he could find no comparable prior ruling to guide the case. The decision clears the way for construction to continue while the underlying lawsuit proceeds.","source":"Associated Press via RochesterFirst","url":"https://www.rochesterfirst.com/news/national/ap-judge-refuses-to-block-trump-administration-from-building-border-wall-along-tribes-reservation/"},{"headline":"Trade court upholds Trump's elimination of $800 duty-free import exemption","body":"A three-judge panel on the U.S. Court of International Trade ruled Thursday that Trump lawfully used emergency powers under IEEPA to end the 'de minimis' exemption that let packages worth $800 or less enter the U.S. duty-free. The case, brought by Michigan auto-parts distributor Detroit Axle, is distinct from the 'Liberation Day' global tariffs the Supreme Court separately struck down, and the ruling lets Customs and Border Protection continue collecting duties that generated roughly $1 billion in 2025. Trump celebrated the win on Truth Social, framing the former exemption as a loophole exploited by counterfeiters and fentanyl traffickers.","source":"Axios / CNBC","url":"https://www.axios.com/2026/08/13/trump-de-minimis-tariff-court"},{"headline":"Luigi Mangione expected to enter guilty plea in UnitedHealthcare CEO killing","body":"Luigi Mangione was scheduled to appear in federal court Friday for a likely guilty plea in connection with the killing of UnitedHealthcare CEO Brian Thompson. The case has drawn national attention over the past year as a flashpoint in debates over health-insurance industry practices and public anger toward corporate executives. A plea would resolve one of the highest-profile violent-crime prosecutions of 2026 heading into the fall court calendar.","source":"Multiple outlets (AP, NPR roundup)","url":"https://ru4people.substack.com/p/morning-news-update-august-14-2026"}],"pacific":{"pacificCommand":[{"headline":"Japan to submit record 8.9 trillion yen defense budget for FY2027","body":"Tokyo's Defense Ministry is finalizing a request of roughly 8.9 trillion yen (about $56 billion), the largest in Japanese history, building on the August 4 white paper that flagged Beijing's push beyond the First Island Chain. The request, due at month's end, keeps Japan above its 2 percent of GDP defense spending pledge and funds long-range strike missiles and deeper stockpiling. It also sets the stage for a revision of Japan's three core security documents later this year.","source":"Defense News","url":"https://www.defensenews.com/global/asia-pacific/2026/08/10/japans-2026-defense-white-paper-highlights-new-era-of-crisis-in-indo-pacific/"},{"headline":"Rolls-Royce deepens Australian defense-industrial ties with Type 26 propulsion deal","body":"Rolls-Royce opened a new Canberra headquarters this week and signed an export partnership with Melbourne-based Marand Precision Engineering to supply propulsion components for the Royal Australian Navy's incoming Type 26 frigates. The move reflects Canberra's push to localize more of its naval shipbuilding supply chain as it works through the Hunter-class program alongside AUKUS submarine commitments. It is the latest sign of allied industrial-base consolidation aimed at hedging against China's regional naval buildup.","source":"Defence Connect","url":"https://www.defenceconnect.com.au/news"},{"headline":"Seoul investigates activists over North Korean POW travel to Ukraine","body":"South Korean authorities have opened an investigation into civic activists who traveled to Ukraine in connection with a case involving captured North Korean soldiers, a sensitive issue given Pyongyang's ongoing troop deployments to fight alongside Russian forces. The probe underscores how the Korean Peninsula remains entangled in the Russia-Ukraine war even as Seoul separately advances legislation this month to accelerate indigenous nuclear-powered submarine development. Officials are weighing legal exposure for citizens engaging independently with North Korean detainee issues abroad.","source":"Defence Connect","url":"https://www.defenceconnect.com.au/news"}],"pacingThreat":[{"headline":"PLA ground troops test armed drones against unmanned surface vessels","body":"State media footage released around August 6 and reported August 10 showed a People's Liberation Army Ground Force unit flying at least 13 armed KVD002 unmanned combat aerial vehicles against fast-moving drone boats, using missiles to destroy the surface targets. The exercise marks a new maritime-strike push by the PLA's land branch, which has historically lagged the navy, air force and rocket force in contributing to a Taiwan blockade or invasion scenario. Analysts note the drill mirrors recent U.S. and Ukrainian use of drones against small watercraft in the Black Sea and Caribbean.","source":"USNI News","url":"https://news.usni.org/2026/08/10/chinese-army-drones-target-unmanned-surface-vessels-in-exercises"},{"headline":"China Military Online shows UAV-cued rocket strikes on maritime target","body":"Footage published by China Military Online on August 6 depicted a brigade from the PLA's 83rd Group Army firing PHL-03 300mm multiple-launch rocket systems at a stationary sea target, cued by forward reconnaissance drones. The drill emphasized a compressed sensor-to-shooter cycle and rapid post-launch relocation to survive counterstrikes, part of a broader coastal-denial concept. While the target was stationary rather than maneuvering, the exercise signals PLA ground forces rehearsing roles that could support a blockade of Taiwan or the first island chain.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/navy-news/2026/china-tests-uav-cued-phl-03-maritime-strikes-and-rapid-displacement-tactics-for-coastal-denial-operations"},{"headline":"Taiwan's Han Kuang drills rehearse reinforcement convoys against a Chinese landing","body":"Taiwan's annual Han Kuang exercise, running through August 14, moved convoys of CM-21 armored vehicles and M60A3 tanks through coastal tunnels toward Yilan to simulate reinforcing defenders against a mock Chinese amphibious landing, with reinforcements notionally arriving from Hualien two hours away. Civilian highway traffic was halted for the military convoys even as a typhoon had just brushed the island's north. Analysts say this year's drills emphasize resilience and flexibility over showcasing new hardware, reflecting closer alignment with U.S. operational concepts for a Taiwan contingency.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-08-14/taiwan-s-biggest-war-games-prepare-for-possible-china-invasion"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine declares Dnipropetrovsk counteroffensive a success as Russian missile barrages intensify","body":"Kyiv announced the completion of a counteroffensive in the southern Dnipropetrovsk region, reclaiming roughly 745 square kilometers this year and pushing Russian forces back across the Donetsk and Zaporizhzhia regional borders. President Zelenskyy said almost 10,000 Russian soldiers were killed in the operation, which former commander-in-chief Oleksandr Syrskii called proof Ukraine can still go on the offensive. The battlefield win is overshadowed at home, however, by escalating Russian missile strikes on Ukrainian cities, with officials warning that stockpiles of Patriot interceptors needed to stop ballistic missiles have been exhausted.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/8/14/ukraine-liberates-dnipropetrovsk-as-russia-intensifies-missile-attacks"},{"headline":"Kyiv escalates strikes on Russian energy grid as Lavrov rules out ceasefire","body":"Ukrainian drones struck the major Ust-Luga oil terminal on Russia's Baltic coast on August 14, part of a campaign Kyiv says has hit 240 Russian energy facilities in 13 days and knocked out nearly a third of Russia's refineries in two weeks. Russian Foreign Minister Sergei Lavrov flatly rejected any pause in fighting, saying Moscow will not freeze the conflict with Ukraine. Separately, the US Senate overwhelmingly passed a new sanctions package targeting Russia's wartime economy, a long-sought win for congressional Ukraine backers even as peace diplomacy remains stalled a year after the Alaska summit.","source":"RBC-Ukraine / Washington Post","url":"https://newsukraine.rbc.ua/war-in-ukraine"}],"europe":[{"headline":"Tusk says Russia attempted to assassinate a US citizen on NATO soil","body":"Polish Prime Minister Donald Tusk revealed that Russia had carried out what he described as the first attempt to assassinate a US citizen on the territory of another NATO member, a major escalation of Kremlin hybrid operations inside the alliance. The disclosure lands alongside the Senate's new sanctions package on Russia's war economy, hardening the mood in Washington even as ceasefire talks remain frozen. The episode is expected to intensify pressure within NATO for a coordinated response to Russian sabotage, espionage and intimidation campaigns across member states.","source":"Washington Post","url":"https://www.washingtonpost.com/world/ukraine-russia/"},{"headline":"Frontex data undercuts EU migrant-crisis narrative, but Spain still overwhelmed","body":"Frontex reported on August 14 that irregular border crossings into the EU fell 37 percent in the first seven months of 2026 compared with last year, contradicting claims by several member states of a bloc-wide migration emergency. The lone exception is the Western Mediterranean route into Spain, where detections rose 37 percent to 11,217 amid the fallout from the Ceuta crisis, when tens of thousands crossed from Morocco within days. EU immigration commissioner Magnus Brunner's calls for solidarity with Madrid have gone largely unheeded by other capitals, exposing lingering rifts over burden-sharing among the 27 member states.","source":"EUNews","url":"https://www.eunews.it/en/2026/08/14/in-2026-irregular-arrivals-fall-and-there-is-no-migrant-crisis-frontex-exposes-the-eu-countries-false-claims/"}]},"middleEast":[{"headline":"UAE tankers attacked in Strait of Hormuz as US threatens 'unprecedented' economic isolation of Iran","body":"Two UAE-flagged tankers were attacked while transiting the Strait of Hormuz on August 14, with Abu Dhabi labeling the strike an act of piracy and a threat to global energy security; no injuries were reported. The attack came as US Treasury Secretary Scott Bessent warned Iran would face economic isolation unlike anything seen before, layered atop the ongoing blockade of Hormuz traffic. US officials note roughly 9 million barrels of oil pass through the strait daily, underscoring how much is riding on the standoff.","source":"Jerusalem Post","url":"https://www.jpost.com/middle-east"},{"headline":"Houthi-government fighting flares in Yemen, threatening a new front in the region","body":"Clashes between Iran-backed Houthi rebels and Yemeni government forces raged overnight into Thursday, stoking fears that Yemen's civil war could reignite and open another front amid the broader regional conflict. The Houthis claimed drone strikes on Saudi Aramco refinery infrastructure in both Jazan and Najran, while survivors of an earlier attack on a Yemeni commercial ship said a second missile hit the vessel just as rescuers arrived. X separately suspended the account of Houthi military spokesman Yahya Saree over the group's attacks on shipping and Saudi targets.","source":"FDD / Times of Israel","url":"https://www.fdd.org/overnight-brief/august-14-2026/"},{"headline":"Israeli settlers besiege West Bank village of Qusra for a week as officials condemn 'inhumane' campaign","body":"Israeli settlers have surrounded the Palestinian village of Qusra near Nablus for nearly a week in an effort to force residents from their homes, prompting the UN rights office and the Palestinian Foreign Ministry to brand the siege criminal and inhumane. Israeli Defense Minister Israel Katz drew criticism for praising the hardline 'Hilltop Youth' settlers involved for holding onto the land, even as he simultaneously called for police rather than the military to take over West Bank civilian enforcement. The standoff has become a flashpoint just as Israel prepares for Palestinian Legislative Council elections slated for November 28.","source":"France 24 / Al Jazeera","url":"https://www.france24.com/en/middle-east/20260814-middle-east-live-us-threatens-iran-with-economic-isolation-like-never-seen-before"}],"techAI":{"aiCompetition":[{"headline":"Anthropic investors eye record-shattering $2 trillion IPO in October","body":"Anthropic's backers are modeling a public listing valuation of $2 trillion or more for October, which would make it the largest IPO ever, according to six investors cited by the Financial Times. The projections rest on expectations that annualized revenue will rocket from about $47 billion in May to between $100 billion and $120 billion by year-end, an over 800% growth rate that one investor says could justify a valuation as high as $3 trillion at a 30-times-revenue multiple. Morgan Stanley, Goldman Sachs and JPMorgan are said to be leading the offering, though Anthropic still faces friction from a Commerce Department export control imposed in June and a Pentagon designation labeling it a supply-chain risk.","source":"Fortune / Financial Times","url":"https://fortune.com/2026/08/13/anthropic-ipo-2-trillion-october-largest-ever-spacex/"},{"headline":"Apple trains its own China-only AI model with Alibaba's help, a first for a foreign firm","body":"Reuters reports Apple has quietly built a proprietary large language model tailored for the Chinese market with training support from Alibaba, abandoning its earlier plan to rely solely on domestic partners' models for Apple Intelligence features. The move reportedly makes Apple the first foreign company Beijing has cleared to offer its own generative AI model domestically, following last month's registration of Apple's AI service with China's Cyberspace Administration. The homegrown model will run alongside Alibaba's Qwen and Baidu's technology in a dual-track rollout expected to coincide with new iPhone launches, underscoring how deeply US tech firms must localize AI to compete with Huawei inside China's walled regulatory system.","source":"MacRumors / Reuters","url":"https://www.macrumors.com/2026/08/14/apple-trained-own-ai-model-for-china/"}],"cyberEmerging":[{"headline":"China-linked hackers reportedly ran first fully autonomous AI cyberattack on a government network","body":"Security researchers say suspected China-linked operators assembled a platform from off-the-shelf, open-source AI agents and unleashed as many as eight of them against Taiwanese government networks in what is being described as the first fully autonomous, end-to-end AI-driven cyberattack on a state target. The incident marks a shift from AI merely assisting human hackers to AI agents independently executing an intrusion chain, a capability leap defense officials in Taipei and Washington have long warned about. It arrives amid broader warnings that China's cyber posture toward critical infrastructure has moved from espionage to pre-positioning for disruption during a future crisis.","source":"Cyberverso","url":"https://www.cyberverso.net/brief/cyber-brief-12-aug-2026/"},{"headline":"IBM and Unit 42 data show AI-driven cyberattacks and breach costs surging as Trump administration races to respond","body":"New industry data cited by PYMNTS shows AI-driven attacks rose 56% year-over-year and added roughly $1 million to average breach costs, while the share of organizations planning to boost security spending jumped to 85% in May from 64% a year earlier. Researchers point to an April frontier model that autonomously discovered thousands of high-severity vulnerabilities across every major operating system and browser as the moment vulnerability-to-exploit timelines collapsed to machine speed. In response, the administration's GOLD EAGLE initiative is standing up an AI-powered public-private clearinghouse through Treasury, DHS and DOD to accelerate detection and patching of software flaws across critical infrastructure.","source":"PYMNTS / Mintz","url":"https://www.pymnts.com/cybersecurity/2026/frontier-ai-threats-drive-companies-boost-security-budgets/"}]},"cities":{"lasVegas":[{"headline":"Metro Officer Austin Abdelnabi Laid to Rest as Community Mourns","body":"Hundreds of law enforcement personnel and residents gathered Friday for funeral services honoring 30-year-old Las Vegas Metropolitan Police Officer Austin Abdelnabi, who was killed by a gunman earlier this month. Governor Joe Lombardo ordered Nevada flags lowered to half-staff for the day, and a separate vigil at Police Memorial Park drew large crowds. A Metro officer was also injured in a crash during the funeral procession, an incident that drew millions of views online after being captured on video.","source":"Las Vegas Review-Journal / FOX5 Vegas","url":"https://www.reviewjournal.com/"},{"headline":"Monsoon Rains Finally Cool Down the Valley","body":"A fresh wave of monsoonal moisture swept through the Las Vegas Valley this week, bringing much-needed rain to several neighborhoods and pushing daytime highs below the century mark for the first time since July 17. Forecasters say the storm activity, which produced ground delays at Harry Reid International Airport, is expected to continue intermittently through the weekend, offering a brief reprieve from the summer heat.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Innocent Bystander Killed in East Las Vegas Shooting","body":"Las Vegas police say a woman sitting in her vehicle near Bonanza Road and Lamb Boulevard was shot and killed this week in an apparently random act of violence. A suspect has since been detained as detectives continue piecing together a motive, according to Metro. The shooting adds to a string of recent violent incidents across the valley that have rattled residents this month.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"}],"nellis":[{"headline":"Collaborative Combat Aircraft Put Through Their Paces at Creech AFB","body":"The Air Force's Experimental Operations Unit recently ran both YFQ-42A and YFQ-44A Collaborative Combat Aircraft drones through an Agile Combat Employment exercise at Creech Air Force Base, loading them with inert air-to-air missiles and testing refueling procedures in a simulated austere environment. Air Force Chief of Staff Gen. Ken Wilsbach said the semi-autonomous jets are central to fielding 'affordable mass' for future air superiority missions, and observers from the Royal Netherlands Air and Space Force, a program partner, watched the drills. The exercise underscores how the Las Vegas-area installation is becoming a proving ground for the Air Force's next generation of uncrewed combat aircraft.","source":"Air & Space Forces Magazine / Air Force Public Affairs","url":"https://www.airandspaceforces.com/ccas-creech-air-forces-drone-base-exercise/"}]},"feelGood":[{"headline":"Las Vegas Restaurant Owner Opens Coffee Shop to Fund Student Scholarships","body":"Nick Della Penna, co-owner of The Great Greek Mediterranean Grill, is opening a new coffee shop near the Las Vegas Academy of the Arts and pledging to send every dollar of profit directly to the school. The gesture is aimed at supporting arts students and programs at the magnet school, giving the local business a direct stake in nurturing young talent in the community.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"90-Year-Old Nun's Soup Kitchen Gets Community Boost Through '814 Day'","body":"Saint Vincent de Paul Soup Kitchen in Altoona, Pennsylvania, is benefiting from a community food drive tied to a local '814 Day' celebration, with visitors to DelGrosso's Park donating non-perishable items in exchange for discounted passes. Sister Paula DelGrosso, who has directed the soup kitchen for 35 years at age 90, said the donations will help feed hungry families and stock the kitchen's holiday giveaways. She noted the rising number of homeless people seeking help in recent years, making the community turnout especially meaningful.","source":"WTAJ News","url":"https://www.wtaj.com/news/local-news/st-vincent-de-paul-soup-kitchen-to-benefit-from-814-day-donation-drive/"},{"headline":"Shelters Nationwide Mark International Dog Day With Adoption Pushes","body":"Animal shelters across the country held special adoption drives and fundraising campaigns this week to mark International Dog Day on August 14, an observance founded a decade ago by animal welfare advocate Colleen Paige. Events highlighted not only family pets but also the contributions of service, therapy and search-and-rescue dogs, with organizers using the day to encourage adoptions from shelters over other sourcing options. The grassroots campaigns reflect a broader community push to reduce shelter overcrowding heading into the fall.","source":"Wikipedia / International Dog Day observance coverage","url":"https://en.wikipedia.org/wiki/International_Dog_Day"}],"onThisDay":[{"year":"1945","event":"Japan announced its surrender to the Allies, effectively ending World War II in what is celebrated as V-J Day."},{"year":"1947","event":"India achieved independence from British colonial rule, becoming a sovereign nation."},{"year":"1969","event":"The Woodstock music festival opened in Bethel, New York, drawing hundreds of thousands of attendees."},{"year":"1971","event":"President Nixon announced the United States would end the dollar's convertibility to gold, ending the Bretton Woods system."}]},"topPicks":[{"headline":"NATO jet downs drone over Latvia as alliance tracks airspace violations","teaser":"A NATO fighter shot down an intruding drone over Latvian airspace, underscoring rising tensions along the alliance's eastern flank."},{"headline":"UAE tankers attacked in Strait of Hormuz as US threatens 'unprecedented' economic isolation of Iran","teaser":"Attacks on tankers in the vital Hormuz shipping lane risk a wider regional conflict as Washington threatens harsh new sanctions on Tehran."},{"headline":"Trump orders sweeping overhaul of Navy shipbuilding, opening door to foreign-built warships","teaser":"A major policy shift could reshape US naval power by allowing foreign shipyards to help rebuild America's aging fleet."}]},"navDates":[{"key":"2026-08-17","label":"Aug 17","href":"/","isNewest":true},{"key":"2026-08-16","label":"Aug 16","href":"/archive/2026-08-16.html","isNewest":false},{"key":"2026-08-15","label":"Aug 15","href":"/archive/2026-08-15.html","isNewest":false},{"key":"2026-08-14","label":"Aug 14","href":"/archive/2026-08-14.html","isNewest":false},{"key":"2026-08-12","label":"Aug 12","href":"/archive/2026-08-12.html","isNewest":false},{"key":"2026-08-11","label":"Aug 11","href":"/archive/2026-08-11.html","isNewest":false},{"key":"2026-08-10","label":"Aug 10","href":"/archive/2026-08-10.html","isNewest":false}],"currentKey":"2026-08-15","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-15.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
