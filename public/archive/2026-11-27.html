<script>
const STATE = {"digest":{"date":"Friday, November 27, 2026","generatedAt":"Fri, Nov 27, 10:58 AM PST","breaking":{"headline":"US Disables Blockade-Running Tanker as Iran Vows to Keep Hormuz Shut","body":"CENTCOM said Friday it disabled the Palau-flagged tanker M/V Pacific Archer by striking its propulsion system after the vessel tried to slip out of an Iranian port in violation of the US naval blockade, the sixth such interdiction since the blockade resumed this summer. An adviser to Iran's supreme leader, Mohammad Mokhber, responded that Tehran will neither reopen the Strait of Hormuz nor tolerate the blockade, vowing to find ways to break it without detailing how. The flare-up comes as Israeli PM Netanyahu has reportedly pushed Washington to resume full-scale strikes on Iran's nuclear and missile sites, the Pentagon now pegs the nine-month war's cost at $48.3 billion, and Rystad Energy data show Hormuz oil flows down roughly 20 percent this month to about 13 million barrels a day.","source":"Reuters / U.S. News","url":"https://www.usnews.com/news/world/articles/2026-11-27/us-disables-ship-trying-to-leave-iran-as-tehran-vows-to-confront-blockade"},"tabs":{"defense":{"defense":[{"headline":"US Army Pacific Plans Around Possible 2027 Taiwan Conflict","body":"Gen. Ronald Clark, head of US Army Pacific, said this week the command is postured on the assumption China could have both the capacity and possibly the intent to seize Taiwan by force in 2027, keeping the long-standing 'Davidson window' central to Pentagon planning. Under the 'Ready Forward' concept, the Army has pushed equipment and rotational troops onto island chains closest to China, even though the ODNI's spring threat assessment found Beijing has not set a fixed invasion timetable. Clark also flagged a core budget dilemma: how much to invest in costly high-end systems versus cheaper, mass-producible autonomous equipment.","source":"Stars and Stripes","url":"https://www.stripes.com/branches/army/2026-10-28/ronald-clark-us-army-pacific-taiwan-china-23284410.html"},{"headline":"Pentagon Watchdog: No Plan Yet to Fix Chronic Munitions Shortfalls","body":"A new oversight finding reported this week shows the Pentagon still lacks a coherent plan or clear leadership to resolve persistent munitions shortages, even as the nine-month Iran conflict and ongoing Ukraine support continue to strain stockpiles. The report lands as Capitol Hill debates a scaled-back defense reconciliation package, with Rep. Mike Rogers floating a roughly $100 billion topline after Sen. Chris Coons declared the broader $350 billion GOP reconciliation push 'dead' with no clear path forward.","source":"Inside Defense","url":"https://insidedefense.com/content/inside-pentagon-november-26-2026"},{"headline":"NATO Scrambles Jets Over Latvia After Overnight Drone Incursion","body":"NATO activated its Baltic Air Policing fighters and Latvia launched an interceptor drone after an unidentified aircraft briefly crossed into Latvian airspace near Ludza overnight on November 26-27. Latvia has previously used an Origin Robotics BLAZE interceptor drone in a similar incident on November 1 but has not confirmed which system it deployed this time, and officials have yet to attribute responsibility for the breach. The incident follows a November 11 scramble over a drone that entered Lithuanian airspace, part of a pattern of incursions along NATO's eastern flank this month.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/aerospace-news/2026/nato-scrambles-fighter-jets-and-latvia-launches-interceptor-drone-after-airspace-breach"}],"acquisitions":[{"headline":"Air Force Accidentally Reveals $16 Billion Propulsion Deal","body":"The Air Force inadvertently published details of a roughly $16 billion engine propulsion contract before its official rollout, exposing the award's terms ahead of schedule. The slip comes as the White House separately presses Congress for broad defense exceptions in the FY-27 continuing resolution, citing submarine construction delays and risk to major weapons contracts as justification for added budget flexibility.","source":"Inside Defense","url":"https://insidedefense.com/content/inside-air-force-november-27-2026"},{"headline":"Pentagon Courts GM and Ford for Mass Drone Production","body":"The Defense Department confirmed preliminary talks with General Motors, Ford, and major suppliers about manufacturing components for military drones, part of a push to stand up a new autonomous-warfare command. Officials are eyeing Detroit's idle factory capacity and established supply chains, though auto executives quoted in the discussions are questioning whether thin margins make sustained drone production commercially viable rather than a one-off wartime conversion.","source":"The National News Desk","url":"https://cbs12.com/news/nation-world/pentagon-confirms-preliminary-talks-with-gm-ford-on-drone-component-production-weapon"}]},"us":[{"headline":"Judge Rebuffs DNC Bid to Permanently Block Taxpayer-Funded Pro-Trump Ads, But Hints Admin May Still Lose","body":"U.S. District Judge Loren AliKhan declined to extend a ban on government-funded TV spots that Democrats characterized as thinly-veiled Trump campaign propaganda, ruling the DNC could no longer show irreparable harm now that the midterms have passed. Notably, she signaled skepticism toward the administration's defense, saying she remained 'doubtful' that White House staff time used to produce the ads falls outside federal spending restrictions. The spots were reportedly funded through money Congress earmarked for border-security commemoration events, and the underlying legal fight over misuse of public funds continues.","source":"NBC News / Raw Story","url":"https://www.nbcnews.com/politics/trump-administration/judge-declines-issue-long-term-ban-taxpayer-funded-trump-ads-critics-c-rcna611375"},{"headline":"Trump Demands Investigation Into BEA After GDP Revision Jumps From 3.4% to 4.3%","body":"In a Thanksgiving Truth Social post, President Trump accused the Bureau of Economic Analysis of publishing deliberately 'fake' growth figures before the midterms, calling Wednesday's upward revision of third-quarter GDP from 3.4% to 4.3% a 'RECORD SETTING ERROR' that demands immediate investigation. The BEA released the update on its previously scheduled calendar, and economists note such revisions are routine as more complete trade and spending data comes in. The episode marks a reversal from Trump's usual complaint pattern, since this revision made the pre-election economy look weaker than reality rather than stronger.","source":"Axios / Washington Post","url":"https://www.axios.com/2026/11/26/trump-gdp-investigation-economy-statistics"},{"headline":"Alaska Senate Race Finalizes Democrats' 56-44 Majority as Peltola Unseats Sullivan","body":"Democrat Mary Peltola's defeat of Republican incumbent Dan Sullivan in Alaska, called this week, was the last undecided Senate contest from the November midterms and confirms Democrats flipped nine GOP-held seats to seize a 56-44 majority. The result caps a broader 'blue wave' that also saw Democrats pick up governorships in Georgia, Iowa, Nevada, Ohio and Texas. The new Senate majority sets up a sharply different power dynamic for Trump's remaining two years, with Democrats signaling plans to push back on his foreign-policy and economic agenda.","source":"PBS NewsHour / Associated Press","url":"https://www.pbs.org/newshour/elections-2026/results"},{"headline":"Federal Judge Blocks Trump Administration's Review of ABC's Broadcast Licenses","body":"A federal judge issued an order halting the Trump administration's effort to subject all local broadcast licenses held by ABC to review, a move that would have affected stations in six of the country's largest media markets. The ruling is the latest in a string of legal clashes between the White House and major broadcasters over regulatory leverage tied to news coverage. It leaves ABC's affiliate licenses intact for now while the underlying dispute over the administration's authority plays out in court.","source":"NPR","url":"https://www.npr.org/sections/news/"}],"pacific":{"pacificCommand":[{"headline":"US Deactivates Apache Squadron at Camp Humphreys Amid Army Modernization","body":"US Forces Korea confirmed on Nov. 26 that it has inactivated an AH-64 Apache attack helicopter squadron based at Camp Humphreys, describing the move as part of broader US Army modernization rather than any reduction in commitment to South Korea's defense. The announcement comes as Seoul's Ministry of National Defense pushes for an 8.2 percent increase in its 2027 budget and deepens trilateral coordination with Washington and Tokyo. USFK officials stressed the posture change does not alter the US obligation to defend South Korea against North Korean, Chinese, or Russian threats.","source":"Korea JoongAng Daily","url":"https://www.koreajoongangdaily.com/korea/defense"},{"headline":"North Korea Suspends Arms Deliveries to Russia Over Dispute Tied to South Korea","body":"Ukraine's military intelligence agency reported on Nov. 26 that Kim Jong Un has temporarily halted shipments of KN-23 ballistic missiles and artillery ammunition to Russia, triggered by a disagreement over Moscow's recent policy toward Seoul. Pyongyang has also barred Russian military transport flights from its airspace and paused a Russian request to expand North Korea's deployed troop contingent from 8,500 to 50,000 personnel. The rift suggests North Korea is weighing whether continued support for Russia's war effort still serves its core security priorities, which remain centered on South Korea, Japan, and the United States.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/north-korea-halts-missile-and-artillery-deliveries-to-russia-amid-dispute-over-south-korea"},{"headline":"Japan Fields First AI-Guided Interceptor Drones to Counter Mass Drone Attacks","body":"Terra Drone Corporation announced on Nov. 26 that it has completed delivery of its domestically built Terra B1 AI-guided interceptor drone system to Japan's Ministry of Defense acquisition agency, ATLA. The system is meant to down swarms of hostile drones without expending costly surface-to-air missiles, reflecting lessons Tokyo has drawn from drone warfare in Ukraine as it builds out Indo-Pacific air defenses. A companion ground control station capable of managing multiple interceptors from one interface was also delivered, though the system has not yet been integrated aboard Japanese warships.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/aerospace-news/2026/japan-applies-ukraine-war-lessons-to-indo-pacific-air-defense-with-terra-b1-ai-enabled-interceptor-drones"}],"pacingThreat":[{"headline":"PLA Admits Coordination Failures, Overhauls Joint-Service Training","body":"Chinese military newspaper PLA Daily reported this week that recent joint exercises exposed friendly-fire incidents and airspace coordination failures, prompting China's five theater commands to restructure how different services train together. A PLA Rocket Force unit reportedly struggled to guide strikes against moving sea targets during the drills, an unusually candid admission for state media. Analysts note the PLA has made real progress since the 2015-16 reform era, pointing to its repeated large-scale exercises encircling Taiwan since 2022, but the self-critique highlights persistent seams in its ability to fight as a genuinely integrated force.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3375877/pla-overhauls-joint-training-after-drills-expose-coordination-gaps"},{"headline":"PLA Unveils J-20A, Full Carrier Air Wing for Zhuhai Airshow Debut","body":"The PLA Air Force announced on Nov. 26 that its upgraded J-20A stealth fighter will make its first public flying display at Airshow China in Zhuhai, running Dec. 7-13, alongside a static-display debut of the re-engined Y-20B heavy transport with its cargo hold open to visitors. Days earlier the PLA Navy revealed it will fly nearly its entire carrier air wing, including the J-35 stealth fighter, J-15T, KJ-600 early-warning aircraft, and the new JL-15 trainer, at a newly added offshore exhibition zone. Combined with a dedicated PLA Army exhibition hall announced Nov. 27, the show represents Beijing's largest public showcase yet of next-generation combat aircraft and carrier aviation hardware.","source":"Afterburner (Migflug)","url":"https://migflug.com/afterburner/j-20a-airshow-china-2026-zhuhai-y-20b-z-20t-plaaf-pla-army/"},{"headline":"Taiwan Heads to Polls Nov. 28 Amid Russian ADIZ Incursions and Warnings China Is Watching","body":"Taiwan holds nine-in-one local elections on Saturday, Nov. 28, with the election commission expecting vote counts to finish before midnight and regulators warning broadcasters against inaccurate reporting or AI-generated deepfakes. Taipei Times reported this week that two additional Russian warplanes entered Taiwan's air defense identification zone, adding to a string of incursions tracked alongside elevated Chinese naval activity around the island in recent weeks. Taiwanese media also cited a US assessment warning that Beijing views the vote as a test case, with Washington watching for signs China could try to use the election to gauge or influence cross-strait sentiment.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/11/26/2003868425"}]},"europe":{"ukraineRussia":[{"headline":"Kyiv steps up deep strikes on Russian oil infrastructure as drone barrages continue","body":"Ukraine's General Staff said it struck a missile fuel production facility in Russia's Tula Oblast and hit the Novoshakhtinsk refinery in Rostov Oblast, a plant with up to 7.5 million metric tons of annual processing capacity, while also targeting the Marinovka airfield in Volgograd and a Transneft pumping station in Bashkortostan. Overnight, Russia retaliated with 155 drones, 83 of them jet-powered, with Ukrainian air defenses downing 110 but recording hits at 27 locations across Kharkiv, Zaporizhzhia, Zhytomyr and Kirovohrad regions. Kyiv's General Staff separately reported Russia lost roughly 2,262 personnel and 1,315 drones in the preceding 24 hours as the war entered its 1,738th day.","source":"Kyiv Independent / Ukrinform","url":"https://kyivindependent.com/ukraine-war-latest-ukraine-hits-missile-fuel-production-facility-in-russias-tula-oblast-military-says/"},{"headline":"Trump says he pressed Putin to halt European aggression and finalize Ukraine peace deal","body":"President Trump said he personally urged Vladimir Putin during their recent meeting in China to stop increasingly aggressive Russian military maneuvers across Europe and to negotiate a comprehensive peace settlement on Ukraine. In Thanksgiving Day posts, Trump called a potential deal a 'strong possibility' while describing ongoing fighting in Eastern Europe as a 'complete bloodbath.' The comments follow inconclusive Abu Dhabi trilateral talks between U.S., Russian and Ukrainian negotiators earlier this month, where envoys Steve Witkoff and Jared Kushner pushed for binding security guarantees for Kyiv without securing a breakthrough.","source":"The Washington Times","url":"https://www.washingtontimes.com/news/2026/nov/26/trump-tells-putin-pull-back-military-aggression-europe-negotiate-deal/"}],"europe":[{"headline":"Five NATO allies seal $6 billion CV90 deal in alliance's largest joint vehicle buy","body":"Sweden, Finland, Norway, the Netherlands and Lithuania signed a landmark procurement in Stockholm for more than 430 BAE Systems CV90 infantry fighting vehicles, adopting a shared configuration to simplify cross-border training, spare parts and battlefield interoperability. Finland alone is buying 160 vehicles for about 2.8 billion euros, while Sweden is taking 60, with the deal explicitly framed around deterring further Russian aggression. Denmark separately signed a related CV90 simulator contract with BAE Systems to support crew training across the bloc.","source":"Bloomberg / Army Recognition","url":"https://www.bloomberg.com/news/articles/2026-11-26/five-nations-to-buy-430-combat-vehicles-in-nato-s-biggest-deal"},{"headline":"EU leaders deadlock on $1.7 trillion budget as elections loom","body":"A 12-hour Brussels summit ended Thursday without agreement on the bloc's 2028-2034 budget, with talks pushed into December, as Germany and five other net-contributor states demanded deeper cuts while most members resisted further reductions. France, the EU's second-largest economy, is under pressure to narrow a 5.1% deficit toward the bloc's 3% guideline even as it faces months of protests and strikes tied to a cost-of-living crunch ahead of its 2027 presidential election. Eurozone economic sentiment has also slipped to its lowest level since June, with confidence deteriorating in Italy, France, Poland and Spain amid high borrowing costs linked partly to the global AI investment race.","source":"CNBC","url":"https://www.cnbc.com/2026/11/27/eu-budget-2028-2034-deadlock.html"}]},"middleEast":[{"headline":"Kuwait summons Iranian envoy after drone strike kills two Italians","body":"Kuwait formally summoned Iran's ambassador after a drone attack killed two Italian civilians, with Rome and Kuwait City pointing toward Tehran while Iran's foreign ministry denied responsibility and offered to help investigate the incident's origin alongside Kuwaiti and Italian authorities. European Commission President Ursula von der Leyen called for increased pressure on Iran following the deaths, as Tehran simultaneously reported deploying additional troops along its borders amid rising regional tension. The episode adds a new flashpoint to the broader U.S.-Israel-Iran conflict that has roiled Gulf shipping and diplomacy for months.","source":"Gulf News","url":"https://gulfnews.com/world/mena/middle-east-tensions-trump-signals-victory-as-iran-offers-kuwait-drone-probe-1.500762639"},{"headline":"Gaza and Lebanon ceasefires fray as Israeli strikes kill dozens more","body":"Despite nominal ceasefires on both fronts, Israeli strikes and gunfire reportedly killed about 10 more Palestinians in Gaza overnight into Thursday, including a strike that killed Hamas official Khaled Abu Nada, while Hamas separately confirmed a strike targeted the son of senior official Khalil al-Hayya without causing casualties. Lebanon's state news agency also reported fresh Israeli airstrikes and artillery fire near Kfar Tibnit in the south. The continued violence comes as the Washington Post reported that Netanyahu has been pressing President Trump to authorize renewed strikes on Iran.","source":"Arab American News / Jerusalem Post","url":"https://arabamericannews.com/2026/11/27/middle-east-roundup-israeli-strikes-on-lebanon-and-gaza-saudi-houthi-fighting-and-u-s-iran-tensions/"},{"headline":"Trump declares 'victory at hand' on Iran as Tehran signals defiance","body":"President Trump told reporters 'we have victory at hand' regarding the Iran conflict, adding the outcome 'will happen whenever I want it to happen,' even as Jerusalem Post reporting named a facility dubbed 'Pickaxe Mountain' as a potential target should the U.S. strike again. Iran's Supreme Leader Khamenei responded by calling for a 'new birth' of the Basij paramilitary force, while separate intelligence assessments cited by Israeli media suggest Tehran is developing new ballistic missile variants. The rhetoric underscores how far apart Washington and Tehran remain despite ongoing mediated contacts over ending the war.","source":"Jerusalem Post / Gulf News","url":"http://www.jpost.com/middle-east"}],"techAI":{"aiCompetition":[{"headline":"FCC Clears SpaceX to Launch Up to One Million AI-Processing Satellites","body":"The Federal Communications Commission approved SpaceX's plan to deploy as many as one million satellites designed to run AI workloads in orbit using solar power, then beam results back to Earth. The decision, confirmed November 26, effectively merges the AI infrastructure buildout with the commercial space race, turning orbital compute capacity into a new strategic asset. Analysts note the move could ease the land, water and power constraints that have slowed terrestrial data-center expansion in the US.","source":"The Neuron","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-november-26-2026/"},{"headline":"AMD Puts $1 Billion Into Meta Stock as Helios AI Racks Go Live","body":"AMD is investing $1 billion in Meta's latest equity offering as part of an expanded AI-infrastructure partnership announced November 26. Meta has already begun testing AMD's rack-scale Helios systems, each packed with 72 Instinct MI455X GPUs, ahead of a broader rollout, while AMD is providing day-one software support for Meta's open 'Muse' models. The tie-up deepens AMD's push to chip away at Nvidia's dominance in the data-center GPU market that underpins the frontier-AI buildout.","source":"This is not Average (Kelly Abbott)","url":"https://kellyabbott1.substack.com/p/ai-frontier-daily-2026-11-26"}],"cyberEmerging":[{"headline":"Swiss Agency Confirms First AI-Agent Cyberattacks on Critical Infrastructure","body":"Switzerland's National Cyber Security Centre confirmed on November 24 the country's first cyberattacks carried out by autonomous 'agentic offensive frameworks,' hitting organizations and critical-infrastructure operators in at least two sectors. By November 26 the confirmed tally had grown to five cases, four of which ended in successful system compromises, with attackers getting in through default passwords and known unpatched flaws rather than novel exploits. The agency also noted the number of internet-reachable offensive AI agents, including tools dubbed ARTEX and CyberStrikeAI, has nearly doubled since October.","source":"i10X News","url":"https://i10x.ai/news/swiss-ncsc-ai-agent-attacks-critical-infrastructure-exposure-checklist"},{"headline":"Brussels Floats 50 Billion Euro Fund to Back AI, Quantum and Chip Sovereignty","body":"The European Commission is pushing a proposed 50 billion euro 'Sovereign Tech Equity Fund' to finance larger, higher-risk bets in AI, quantum computing, semiconductors, cloud infrastructure and cybersecurity. The plan, detailed November 26, reflects mounting unease in Brussels that Europe is falling behind Washington and Beijing on frontier-AI capital deployment, with American labs OpenAI and Anthropic alone having absorbed roughly 217 billion dollars of global AI funding so far this year. The fund would let the EU take direct equity stakes rather than relying solely on grants or loans.","source":"Market News (Herve Cuviliez)","url":"https://hervecuviliez.substack.com/p/market-news-thursday-26-november"}]},"cities":{"lasVegas":[{"headline":"Southern Nevada Nonprofit Faces Closure Without $70,000 Infusion","body":"A Las Vegas nonprofit that has spent nearly 18 years helping women prepare for job interviews and build careers says it must raise $70,000 by the end of December or begin shutting down. The group's CEO is publicly appealing for donations as the organization's long-running career-support mission hangs in the balance heading into the new year.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/business/"},{"headline":"Nevada Loses Measles Elimination Status Amid Low Vaccination Rates","body":"Nevada has officially lost its measles elimination status, with state health officials citing persistently low vaccination rates in Clark County as a key vulnerability. Officials note Nevada has not recorded a measles case in 2026, but warn that holiday travel and continued gaps in immunization coverage could strain public-health resources if an outbreak occurs.","source":"KTNV / mynews4","url":"https://mynews4.com/news/local"},{"headline":"NV Energy Seeks Rate Cut for Customers","body":"NV Energy has filed a request with the Public Utilities Commission of Nevada seeking to decrease electric rates for customers across the state. The filing comes as Southern Nevadans continue to grapple with high cost-of-living pressures, and regulators will now review the proposal before any change takes effect.","source":"KTNV","url":"https://www.ktnv.com/"}],"nellis":[{"headline":"Thunderbirds Close Out 2026 Season With Final Nellis Performance","body":"The Air Force's Thunderbirds aerial demonstration squadron wrapped up its 2026 show season with a final performance at its home base, Nellis Air Force Base, completing 61 aerial demonstrations across 31 locations nationwide this year while marking the nation's 250th anniversary. Family and friends of team members, including Thunderbird 5 pilot Laney Schol and Thunderbird 1 commander Alexander Prevendar, gathered on the flight line to celebrate the milestone season's end. The achievement underscores Nellis's continuing role as the Air Force's premier air combat training hub even as the base simultaneously prepares a planned $1 billion-plus campus to host the future F-47 fighter and collaborative combat drones.","source":"8 News Now / Nellis AFB","url":"https://www.8newsnow.com/news/local-news/thunderbirds-make-history-during-2026-show-season/"}]},"feelGood":[{"headline":"Viral DoorDash Friendship Nets 79-Year-Old Driver Over $100,000","body":"A 79-year-old DoorDash driver who struck up an unexpected friendship with a customer during a delivery became an internet sensation after their encounter went viral, touching millions of viewers. Moved by his story, strangers online have since donated more than $100,000 to support him, turning a simple delivery into a life-changing outpouring of generosity.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Baby Given Weeks to Live Is Now Declared Brain Cancer-Free","body":"A family that was told on Christmas Eve that their infant had only weeks left to live is now celebrating after the baby was declared free of brain cancer. The reversal, reported this week, offers a rare medical turnaround that doctors and the family are treating as a genuine holiday miracle.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/"},{"headline":"Texas Volunteers Farm for Free to Fund Strangers' College Dreams","body":"A group of Texans has been donating their labor on farms that aren't their own, with the proceeds directed toward college scholarships for other families' children rather than their own profit. The grassroots effort highlights how community-driven volunteer work is quietly funding higher-education opportunities for young people who might otherwise be unable to afford it.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/"}],"onThisDay":[{"year":"1095","event":"Pope Urban II preached at the Council of Clermont, helping launch the First Crusade."},{"year":"1868","event":"US Cavalry under Custer attacked a Cheyenne village in the Battle of Washita River."},{"year":"1924","event":"The first Macy's Thanksgiving Day Parade was held in New York City."},{"year":"1973","event":"The US Senate voted to confirm Gerald Ford as Vice President following Spiro Agnew's resignation."}]},"topPicks":[{"headline":"US Disables Blockade-Running Tanker as Iran Vows to Keep Hormuz Shut","teaser":"A US strike on a tanker raises fears of wider conflict as Iran threatens to choke off a vital oil chokepoint."},{"headline":"NATO Scrambles Jets Over Latvia After Overnight Drone Incursion","teaser":"NATO fighters responded to an unidentified drone breach, underscoring rising tensions along the alliance's eastern flank."},{"headline":"Taiwan Heads to Polls Nov. 28 Amid Russian ADIZ Incursions and Warnings China Is Watching","teaser":"Taiwan's election unfolds under the shadow of foreign military pressure, with Beijing closely monitoring the outcome."}]},"navDates":[{"key":"2026-11-27","label":"Nov 27","href":"/","isNewest":true},{"key":"2026-11-26","label":"Nov 26","href":"/archive/2026-11-26.html","isNewest":false},{"key":"2026-11-25","label":"Nov 25","href":"/archive/2026-11-25.html","isNewest":false},{"key":"2026-11-24","label":"Nov 24","href":"/archive/2026-11-24.html","isNewest":false},{"key":"2026-11-23","label":"Nov 23","href":"/archive/2026-11-23.html","isNewest":false},{"key":"2026-11-22","label":"Nov 22","href":"/archive/2026-11-22.html","isNewest":false},{"key":"2026-11-21","label":"Nov 21","href":"/archive/2026-11-21.html","isNewest":false}],"currentKey":"2026-11-27","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
