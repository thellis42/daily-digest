<script>
const STATE = {"digest":{"date":"Monday, November 16, 2026","generatedAt":"Mon, Nov 16, 11:35 AM PST","breaking":{"headline":"Iran-Bahrain Escalation Tests Trump's Strike Pause as Third US Carrier Arrives in Region","body":"Iran's IRGC says it launched six drones at the Al-Rifaa helicopter base in Bahrain on November 15, targeting a US air-defense radar installation in what it called retaliation for 'hostile US actions'; Bahraini defenses say they intercepted the attack. The same day, a tanker caught fire in the Strait of Hormuz after reportedly striking a naval mine, and the State Department issued an urgent warning to Americans in Bahrain over escalating threats from Iran and its proxies. A third US aircraft carrier has now arrived in the Middle East, joining more than 20 Navy ships enforcing a blockade of Iranian ports, raising the stakes just as President Trump weighs whether to abandon his pause on further strikes against Tehran.","url":"https://abcnews.com/International/live-updates/iran-live-updates-americans-tired-forever-wars-araghchi/?id=137967256"},"tabs":{"defense":{"defense":[{"headline":"US Carrier Strike Groups and Navy Blockade Expand Pressure on Iran","body":"A third US aircraft carrier has entered the Middle East theater, bringing the Navy presence enforcing the blockade of Iranian ports to more than 20 ships as of November 15. CENTCOM has also been publicizing F-16 patrol operations and noting that roughly 1.7 billion barrels of oil have moved through the Strait of Hormuz, underscoring the stakes of keeping the waterway open. The buildup signals Washington is preparing for a broader confrontation even as diplomats search for an off-ramp with Tehran.","source":"ABC News / Iran International via AND Magazine","url":"https://andmagazine.substack.com/p/morning-brief-15-november-2026"},{"headline":"Bahrain Air Defenses Foil Iranian Strike on US Radar Site, Prompting Travel Warning","body":"Bahraini and allied air defenses intercepted a wave of Iranian drones and reported Houthi ballistic missiles aimed at US radar installations and Saudi cities on November 15, a test of President Trump's current pause on strikes against Iran. The State Department responded by warning Americans in Bahrain of heightened danger from Iran and its regional allies. Bahrain's Foreign Ministry has held Iran 'fully responsible' for the attacks over two consecutive days.","source":"Fox News","url":"https://www.foxnews.com/live-news/iran-war-strikes-donald-trump-strait-hormuz-irgc-november-15"},{"headline":"Estonia to Shut Russia Border Crossings After Sabotage Plot on Drone Maker","body":"Estonia says it will close its road border crossings with Russia starting December 1 after authorities foiled an attempted bombing and arson attack against a facility belonging to Threod Systems, a domestic drone manufacturer supplying Baltic and allied militaries. The move reflects growing NATO-member concern about Russian sabotage operations targeting defense-industrial sites well behind the front lines. It follows a string of similar hybrid incidents across the alliance's eastern flank this year.","source":"Militarnyi","url":""}],"acquisitions":[{"headline":"Northrop Grumman Wins $1.6 Billion Order to Scale Up PAC-3 Missile Propulsion","body":"Northrop Grumman announced on November 16 a new $1.6 billion order to ramp production of solid rocket motors and ignition components for the Army's PAC-3 Missile Segment Enhancement interceptor program, built at its Rocket Center, West Virginia plant. The award is part of a broader $3 billion package of agreements first announced in August and is meant to speed up deliveries of the interceptors, which are built into Lockheed Martin's Patriot missile defense system. The deal reflects the Pentagon's push under its Acquisition Transformation Strategy to expand munitions output amid sustained demand from Ukraine and Middle East operations.","source":"GlobeNewswire","url":"https://globenewswire.com/news-release/2026/11/16/3403745/189/en/northrop-grumman-lands-1-6-billion-award-to-scale-pac-3-mse-propulsion-production.html"},{"headline":"Air Force F-16 Radar Contract With Northrop Grumman Tops $2 Billion","body":"A $79.6 million contract modification awarded on November 13 pushed the Air Force's APG-83 Scalable Agile Beam Radar program with Northrop Grumman past $2.06 billion, up from roughly $1.98 billion and more than eight times the original $244 million award signed in 2017. Work on the modification will be performed at Northrop's Linthicum Heights, Maryland facility and is due to finish by the end of 2027. A related Pentagon modification involving foreign military sales of F-16 radar equipment to South Korea and Japan raised a separate contract to $613.4 million.","source":"Defensehere / migflug","url":"https://migflug.com/afterburner/f-16-apg-83-sabr-radar-northrop-79-6-million-contract-2-billion-2026/"}]},"us":[{"headline":"Supreme Court Hands Trump Administration Fresh Losses on DEI and Gun Cases","body":"The Supreme Court on Monday declined to hear the Trump administration's appeal over roughly $59 million in federal grants stripped from University of California researchers as part of its anti-DEI crackdown, leaving a lower court order restoring the funding intact. Lawyers for the researchers said the ruling means grants cut based on perceived viewpoint must continue to be reinstated, with none of the nine justices noting a public dissent. The same day, the Court turned away a separate Second Amendment challenge to gun bans in 'sensitive places' and a Maryland concealed-carry case, with Justice Thomas urging the Court to take up a narrower version of the issue later.","source":"GV Wire / SCOTUSblog","url":"https://gvwire.com/2026/11/16/supreme-court-rejects-trump-appeal-defending-diversity-related-grant-cuts/"},{"headline":"Nationwide Flight Chaos Deepens as Duffy and Congress Trade Blame","body":"A government-ordered ground stop continued to snarl US air travel into the weekend, with Transportation Secretary Sean Duffy refusing to apologize and instead blaming a maintenance contractor upgrading old copper wiring to fiber-optic cable along with past administrations. Democrats countered that Congress already approved $12.5 billion for FAA modernization but that the administration has spent only about $1 billion of it, while Duffy is now pressing Congress for an additional $50 billion. The disruption turned dangerous Saturday night when two aircraft collided while taxiing at Miami International Airport, injuring two people.","source":"Democracy Now!","url":"https://www.democracynow.org/2026/11/16/headlines"},{"headline":"Van Hollen's Challenge to Schumer Splits Senate Democrats","body":"Maryland Senator Chris Van Hollen is escalating his bid to unseat Chuck Schumer as Senate Democratic leader ahead of the caucus's December 1 leadership vote, releasing a campaign-style ad and disputing Schumer's claimed support among senators. Van Hollen is framing his run as a response to midterm voters who rejected Trump's agenda but haven't fully embraced current Democratic leadership, capitalizing on progressive momentum after the party flipped control of Congress on November 3. Pennsylvania's John Fetterman has signaled he could leave the Democratic Party altogether if Van Hollen prevails, underscoring how bitterly the fight is dividing the incoming majority.","source":"Everything Briefing / 2026 Talks","url":"https://everythingbriefing.substack.com/p/todays-news-history-and-calendar"},{"headline":"Hot Inflation Data Pushes Fed Toward Bigger December Hike","body":"A higher-than-expected October CPI reading, with prices up 0.4% month-over-month versus the 0.3% forecast, is fueling speculation the Federal Reserve could deliver a half-point rate hike in December after its October pause. Kansas City Fed President Jeff Schmid said Sunday the central bank 'has some work to do on inflation,' while Boston Fed President Susan Collins and Dallas Fed President Lorie Logan have also struck hawkish tones, with Logan calling for at least two more quarter-point hikes. Markets reacted Friday with the S&P 500 down 1.6% and the Nasdaq 100 down 2.3%, as Fed Chair Kevin Warsh acknowledged staff are now modeling how AI-driven investment could reshape the economy ahead of the critical November 25 PCE inflation report.","source":"The Motley Fool / CNBC","url":"https://www.fool.com/investing/2026/11/14/a-larger-than-normal-fed-rate-hike-in-december-now-looks-more-likely-here-s-why/"}],"pacific":{"pacificCommand":[{"headline":"Kadena Gets Its First Permanently Based F-15EX Eagle IIs","body":"The US Air Force's 18th Wing took delivery of its first two permanently assigned F-15EX Eagle II fighters at Kadena Air Base in Okinawa on November 15, kicking off the long-planned replacement of the 48 aging F-15C/D Eagles that began withdrawing from the base in 2022. The wing is slated to eventually operate 36 of the new jets, which bring heavier weapons loads and upgraded electronic-warfare systems and will fly alongside fifth-generation fighters and Japan's Air Self-Defense Force. The basing decision reinforces forward US airpower on one of the Pacific's most exposed frontline installations as Chinese military activity around the East China Sea intensifies.","source":"Japan Times / Defence-Blog","url":"https://defence-blog.com/u-s-air-force-f-15ex-jets-arrive-to-stay-at-japans-kadena-air-base/"},{"headline":"Manila Summit Yields Philippines-Australia Defense Pact, Partial Progress on Sea Code","body":"On the sidelines of the ASEAN Summit in Manila, the Philippines and Australia signed a new defense cooperation pact widely read as aimed at countering Chinese assertiveness in the South China Sea, with Australian Prime Minister Anthony Albanese holding bilateral talks with President Ferdinand Marcos Jr. Separately, Philippine Foreign Secretary Theresa Lazaro said ASEAN and China reached provisional agreement on roughly 80 percent of the text of a long-delayed South China Sea Code of Conduct, but missed Manila's 2026 target to finalize it after more than two decades of talks. Chinese Premier Li Qiang told assembled leaders on November 16 that Beijing still wants an early, substantive conclusion to the code.","source":"Washington Post / Jakarta Post / Rappler","url":"https://www.rappler.com/philippines/asean-china-fail-meet-deadline-sea-code-conduct-talks-2026/"},{"headline":"Tokyo Pairs New AI Defense Guidance With Broader Strategy Overhaul","body":"Japanese Defense Minister Shinjiro Koizumi announced on November 15 that the ministry will release an updated Defense AI Vision by the end of November, revising a 2024 policy to stress that humans must retain final decision authority over AI-enabled systems, secure the data underpinning them, and balance rapid adoption with safety. The guidance is part of a wider revision of Japan's National Security Strategy that reportedly will add a 'collective resilience' concept built around diversifying critical mineral, energy and food supplies with partner nations. Regional analysts say the broader security buildup could expand Tokyo's capacity to intervene in a Taiwan contingency, a point Beijing has already criticized as using China as a pretext for remilitarization.","source":"Nippon.com / The Star","url":"https://www.nippon.com/en/articles/-/57469"}],"pacingThreat":[{"headline":"Satellite Images Show China's Fourth Carrier, Type 004, Taking Shape at Dalian","body":"New satellite imagery from November 12 shows China's fourth aircraft carrier, the Type 004, advancing rapidly at Dalian Shipyard, with fresh hull extensions visible on both sides near where the carrier's island structure will eventually sit. The vessel is being assembled in the same dry dock that produced the Liaoning and Shandong carriers, fueling analyst expectations that it could become China's first nuclear-powered carrier and potentially the first able to operate unmanned naval aircraft. The progress comes as a parallel Asia Times report describes a PLA push to field integrated missile defenses on surface combatants, part of a Pentagon-tracked plan to grow to nine carriers by 2035.","source":"The Aviationist","url":"https://theaviationist.com/2026/11/16/chinas-fourth-aircraft-carrier-satellite-images"},{"headline":"Japan's Jet Scrambles Near Five-Year High as PLA Carrier Activity Grows","body":"Japan's Air Self-Defense Force scrambled fighters at a pace approaching a five-year high in October as Chinese military aircraft stepped up operations around Japan's southwestern islands, coinciding with a PLA carrier strike group pushing into the western Pacific. The surge follows an October 14 episode in which the carrier Liaoning conducted flight operations about 250 kilometers south of Ishigaki Island, forcing Japanese jets into the air to respond to carrier-launched aircraft for the first time in that pattern. A US-based analyst cited by the South China Morning Post said the repeated encounters let PLA planners study Japanese reaction timelines and basing patterns, warning observers should watch whether this marks a new, higher baseline rather than a temporary spike.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3374567/japan-faces-near-5-year-high-fighter-jet-scrambles-china-ramps-pacific-patrols"},{"headline":"Taiwan Logs Fresh Median-Line Crossings as 'Silent Intimidation' Campaign Lingers","body":"Taiwan's Ministry of National Defense reported detecting 10 Chinese military aircraft near the island.","source":"","url":""}]},"europe":{"ukraineRussia":[{"headline":"Ukraine Launches War's Largest Drone Barrage as Crimean Bridge Is Hit Again","body":"Russia's Defense Ministry said it intercepted 1,336 Ukrainian drones overnight into Monday, one of the largest aerial barrages of the war, with Moscow Mayor Sergey Sobyanin reporting roughly 600 drones aimed at the capital alone. The Kerch Strait bridge linking Russia to occupied Crimea was struck again and satellite images show it now appears warped, while Russia continued its own strikes, killing at least three Ukrainians in Kherson, Dnipro and Chernihiv regions and cutting power to tens of thousands in Odesa. The EU responded Monday by imposing fresh sanctions on roughly 50 Russian banks and financial institutions, accusing Moscow of stalling peace talks.","source":"Al Jazeera / ABC News","url":"https://www.aljazeera.com/news/2026/11/16/russian-attacks-kill-three-in-ukraine-eu-accuses-moscow-of-prolonging-war"},{"headline":"Putin Rebuffs Peacekeeper Idea as Washington Pushes to Bring Europe Into Talks","body":"During their November 12 Kremlin meeting, Jared Kushner and Steve Witkoff pressed Vladimir Putin to accept European participation in future negotiations, but Putin warned that any foreign peacekeeping troops in Ukraine would be treated by Moscow as 'a continuation of war.' The visit followed two days of inconclusive US-mediated trilateral talks in Abu Dhabi, and a German tabloid report that Russian proposals during the talks included demands for Finland's NATO exit, prompting Helsinki to call the idea 'absolutely outrageous.' The EU is simultaneously drafting a new sanctions package meant to strengthen Kyiv's leverage as the diplomatic track drags on without a breakthrough.","source":"TIME / Just Security","url":"https://time.com/article/2026/11/12/ukraine-russia-peace-deal-talks-putin-zelensky-witkoff-kushner/"}],"europe":[{"headline":"Pentagon Scales Back Planned US Troop Cuts in Europe","body":"The Trump administration is preparing to trim its roughly 80,000-strong US troop presence in Europe by less than the 25,000 reduction allies had feared, according to people familiar with internal deliberations reported by Bloomberg on November 14. The softer approach reflects Washington's favorable view of rising NATO defense spending commitments among European allies. The shift comes as NATO Secretary General Mark Rutte touted more than $50 billion in new transatlantic defense-industry procurement deals and as Belgium formally assumed an enhanced air-policing role alongside Italian jets at Lithuania's Siauliai base to reinforce the alliance's eastern flank.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-11-14/pentagon-eyes-smaller-troop-cuts-across-europe-in-reversal"},{"headline":"Five EU States Unveil Rwanda Deportation Hubs in Migration Crackdown","body":"Greece, Denmark, Germany, Austria and the Netherlands announced Monday they will jointly fund the EU's first offshore 'return hub' in Rwanda for migrants denied asylum, with a pilot facility able to hold around 100 people expected to open by mid-2027. Danish Prime Minister Mette Frederiksen called the arrangement a 'game changer' for controlling irregular migration, while the five countries will cover the full cost of deportation and detention given Rwanda's lower operating expenses. Human rights groups, including Human Rights Watch, blasted the plan as an attempt to offload Europe's legal obligations, and leaders such as Emmanuel Macron have separately criticized such hubs as 'ineffective.'","source":"Euronews / AP (News4Jax)","url":"https://www.euronews.com/2026/11/16/five-eu-countries-unveil-rwanda-deportation-plan-in-migration-crackdown"}]},"middleEast":[{"headline":"Gaza Mass Funeral Held for Dozens Pulled From Rubble as Ceasefire Strain Continues","body":"A mass funeral was held Sunday in Gaza for dozens of Palestinians whose remains had been trapped under destroyed buildings for years, with officials recovering roughly 70 sets of remains in the Al-Saftawi area north of Gaza City alone. An estimated 8,000 bodies are still believed buried in the rubble, with Israeli restrictions on heavy equipment hampering recovery efforts more than three years into the war. Separately, Hamas confirmed that senior commander Samir Abu Younis, tied to the October 7, 2023 attack planning, was killed in an Israeli strike near Khan Younis on Saturday, underscoring continued military action despite the October 2025 ceasefire.","source":"Democracy Now / 10 Things Global News","url":"https://democracynow.org/2026/11/16/headlines"},{"headline":"UN: Nearly 4 Million Syrians Have Returned Home, But Israeli Incursions Persist","body":"A UN deputy envoy for Syria said Monday that close to four million Syrians have returned home since the fall of the Assad regime, but warned that funding shortfalls and political uncertainty still threaten the country's fragile transition. The envoy, Claudio Cordone, said Israeli forces have continued incursions, temporary checkpoints, detentions and shelling in southern Syria 'relentlessly' in violation of the 1974 disengagement accord. Rights monitors report the occupied zone in Quneitra and Daraa has effectively hardened into a permanent fortified strip, raising pressure on Syria's Christian and other minority communities further inland.","source":"Middle East Monitor","url":"https://www.middleeastmonitor.com/20261116-un-says-nearly-4m-syrians-have-returned-home-since-assads-fall-but-needs-remain-acute"},{"headline":"Houthi Push on Aden Deepens as Yemeni Government Forces Retreat","body":"Yemeni government forces have pulled back to defend the southern city of Aden as Houthi fighters press an offensive, according to Monday reporting, marking a significant escalation in Yemen's internal conflict alongside the wider regional crisis. The retreat comes as Saudi Arabia has also faced renewed drone interceptions tied to Houthi activity, compounding instability already triggered by the broader US-Iran standoff. The combined pressure threatens to reopen a frontline that had been largely dormant since Yemen's last major truce, risking a fresh humanitarian emergency in the south.","source":"Democracy Now","url":"https://democracynow.org/2026/11/16/headlines"}],"techAI":{"aiCompetition":[{"headline":"Nvidia's Grip on Frontier-Lab Compute Deals Slips to 39% Amid Huang Fallout","body":"A new JPMorgan Asset Management note from strategist Michael Cembalest shows Nvidia's share of future frontier-lab compute agreements has fallen to 39%, down from more than 80% during 2023-2025, as custom silicon and alternative chip stacks gain ground. The report lands just days after Jensen Huang's November 12 resignation as CEO amid a scandal involving an alleged Chinese intelligence contact, with one unnamed frontier lab reportedly able to port models to AMD chips in three days instead of six to twelve months using AI-assisted engineering. Interim CEO Colette Kress now faces investor questions about margin durability as hyperscalers diversify away from single-vendor GPU dependence.","source":"FourWeekMBA / Axios","url":"https://fourweekmba.com/ai-nvidia-39-custom-chips-46-of-frontier-lab-compute-deals/"},{"headline":"Stanford Professors Launch $110M Self-Improving AI Lab Backed by Nvidia, Cisco","body":"Noeri, a new enterprise AI lab founded by Stanford professors Yejin Choi and Carlos Guestrin, emerged Monday with $110 million in funding led by Menlo Ventures and Madrona, alongside strategic backing from Nvidia, Cisco Investments and Snowflake. The startup is betting on smaller, orchestrated models that let organizations own and continuously improve systems trained on their own data, challenging the brute-force scaling approach of OpenAI and Anthropic. The launch comes amid reports both leading labs have filed for IPOs at valuations near $965 billion and $852 billion respectively, underscoring how differently-sized players are now competing for enterprise AI spend.","source":"Yahoo Finance / Business Wire","url":"https://uk.finance.yahoo.com/news/noeri-founded-leading-stanford-ai-171500410.html"}],"cyberEmerging":[{"headline":"Commerce Department Closes AI Chip Loophole Ahead of Trump's China Trip","body":"The Commerce Department issued an interim rule Monday requiring export licenses for AI chips and servers sent to any data center worldwide if that compute could reach Chinese firms, closing a loophole that let Chinese companies rent capacity through third countries. The rule also formally rescinds the Biden-era global AI Diffusion framework and newly flags Singapore, Thailand, Malaysia, Indonesia and Brazil as high-risk diversion points requiring licensing. Timing is pointed: the move comes the same week President Trump departs for Beijing to meet Xi Jinping, and follows internal administration friction between Treasury Secretary Scott Bessent and Commerce Secretary Howard Lutnick over how aggressively to police chip smuggling in the wake of the Jensen Huang scandal.","source":"Axios / CNN","url":"https://www.axios.com/2026/11/16/trump-admin-moves-to-close-china-ai-chip-loophole"},{"headline":"Chinese-Speaking Hackers Use DeepSeek, GLM Models to Automate Attacks on US Defense, Chip Firms","body":"Unit 42 researchers reported that a Chinese-speaking threat actor built an automated intrusion pipeline on the open-source Cairn framework, pairing it with Chinese AI models DeepSeek and GLM to target at least 19 organizations, successfully compromising 10. Victims included US semiconductor manufacturers, defense contractors and human-rights groups, illustrating how off-the-shelf generative AI is lowering the skill threshold for reconnaissance and exploitation against sensitive national-security targets. The findings add urgency to warnings from the UK's National Cyber Security Centre that state actors, particularly China, are expected to weaponize AI against critical infrastructure within the next two years.","source":"DataBreachToday","url":"https://ransomware.databreachtoday.com/"}]},"cities":{"lasVegas":[{"headline":"Zoox Robotaxis Now Bookable Through Uber App in Las Vegas","body":"Amazon's self-driving unit Zoox has begun letting riders book its autonomous vehicles directly inside the Uber app in Las Vegas, marking a new phase of integration between a major rideshare platform and a robotaxi operator. The move expands access to driverless rides beyond Zoox's own app and signals growing competition with Waymo in the valley's fast-evolving autonomous vehicle market. Las Vegas continues to serve as one of the primary testing grounds for commercial robotaxi rollout in the U.S.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Formula 1 Race Week Shuts Down Koval Lane for Nine Days","body":"Road closures for the Heineken Las Vegas Grand Prix began Wednesday, Nov. 18, with Koval Lane between Harmon Avenue and Flamingo Road closed for a full nine days, disrupting RTC bus routes starting Nov. 17. Daily 'Hot Track' conditions take hold at 2:45 p.m. each day from Thursday through Saturday, with the F1 Academy feature race at 4:20 p.m. and the Grand Prix itself running 8-10 p.m. Tickets for the Thursday-through-Saturday race activities on the 3.8-mile Strip circuit are nearly sold out.","source":"FOX5 Las Vegas / Las Vegas Review-Journal","url":"https://www.fox5vegas.com/2026/11/16/las-vegas-strip-circuit-road-closures-formula-1-race-week-begin-nov-18/"},{"headline":"State Completes Sale of Former Office Complex for Downtown Housing","body":"Nevada finalized the sale of a former office complex site in downtown Las Vegas, clearing the way for a major new housing development in the urban core. The transaction, reported by the Review-Journal's Eli Segall, adds to a wave of downtown redevelopment as the city looks to add housing stock near the resort corridor ahead of continued population growth.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Fatal E-Scooter Crash Near Nellis AFB Shuts Down Key Intersection","body":"A 60-year-old man riding an e-scooter was killed Saturday night near the intersection of North Las Vegas and North Nellis boulevards, just outside Nellis Air Force Base, after moving into the path of a pickup truck. Metro Police said the driver remained at the scene and showed no signs of impairment; the crash triggered extended road closures and traffic backups in the northeast valley while investigators worked the scene. The incident underscores ongoing safety concerns along the busy corridors ringing the base.","source":"KLAS 8 News Now","url":"https://www.8newsnow.com/news/local-news/las-vegas-police-investigate-deadly-crash-near-nellis-air-force-base/"}]},"feelGood":[{"headline":"Anonymous Diner in South Korea Quietly Covers Bill for Disability Group","body":"At a barbecue restaurant in Incheon, an anonymous diner paid the full bill for a party of 27 people, including individuals with disabilities and staff and volunteers from a local community welfare center, then added premium beef to the order before slipping away without seeking recognition. The total came to roughly 600,000 won, about $420, in a gesture organizers called a simple but powerful reminder of everyday generosity. The story is part of a broader weekly roundup of kindness stories highlighting strangers helping strangers.","source":"Global Positive News Network","url":"https://www.globalpositivenewsnetwork.com/good-news-this-week-november-15th-2026/"},{"headline":"Missing Hiker Found Alive After Eight-Day Search","body":"A search-and-rescue operation successfully located a missing hiker alive after an eight-day search, according to this week's roundup of positive news. The rescue, which drew on sustained search efforts over more than a week, was highlighted alongside other recent stories of community generosity as evidence that persistence and coordinated rescue work can still produce happy endings even in prolonged missing-person cases.","source":"Global Positive News Network","url":"https://www.globalpositivenewsnetwork.com/good-news-this-week-november-15th-2026/"},{"headline":"Kidney Donor Who Helped a Stranger Returns to Give Even More","body":"A man who previously donated a kidney to a stranger has stepped forward again to help, this time offering additional support highlighted by a Gray Television 'Good Side' feature dedicated to uplifting stories from around the country. The follow-up act of generosity reflects a growing trend of living organ donors staying engaged with the people and communities they've helped long after the initial surgery.","source":"LocalNewsLive / Gray DC","url":"https://www.localnewslive.com/2026/11/09/he-gave-stranger-kidney-then-he-came-back-more/"}],"onThisDay":[{"year":"1907","event":"Oklahoma was admitted as the 46th state of the United States."},{"year":"1945","event":"UNESCO was founded in London to promote international collaboration in education, science, and culture."},{"year":"1973","event":"NASA launched Skylab 4, the final crewed mission to the Skylab space station."},{"year":"1989","event":"Six Jesuit priests, their housekeeper, and her daughter were murdered by Salvadoran soldiers during the civil war."}]},"topPicks":[{"headline":"Iran-Bahrain Escalation Tests Trump's Strike Pause as Third US Carrier Arrives in Region","teaser":"A failed Iranian strike on a US radar site in Bahrain risks reigniting conflict as a third carrier arrives."},{"headline":"Hot Inflation Data Pushes Fed Toward Bigger December Hike","teaser":"Stronger than expected inflation readings raise pressure on the Fed to deliver a larger rate hike next month."},{"headline":"Ukraine Launches War's Largest Drone Barrage as Crimean Bridge Is Hit Again","teaser":"Kyiv's biggest drone assault yet strikes the Crimean Bridge again, escalating the war as diplomacy stalls."}]},"navDates":[{"key":"2026-11-17","label":"Nov 17","href":"/","isNewest":true},{"key":"2026-11-16","label":"Nov 16","href":"/archive/2026-11-16.html","isNewest":false},{"key":"2026-11-15","label":"Nov 15","href":"/archive/2026-11-15.html","isNewest":false},{"key":"2026-11-14","label":"Nov 14","href":"/archive/2026-11-14.html","isNewest":false},{"key":"2026-11-13","label":"Nov 13","href":"/archive/2026-11-13.html","isNewest":false},{"key":"2026-11-12","label":"Nov 12","href":"/archive/2026-11-12.html","isNewest":false},{"key":"2026-11-11","label":"Nov 11","href":"/archive/2026-11-11.html","isNewest":false}],"currentKey":"2026-11-16","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-16.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
