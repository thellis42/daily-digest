<script>
const STATE = {"digest":{"date":"Monday, September 14, 2026","generatedAt":"Mon, Sep 14, 8:53 AM PDT","breaking":{"headline":"Trump Signals Iran War Will Drag On Until After Midterms as Hormuz Attacks Continue","body":"Speaking from Ireland during a golf trip, President Trump said the six-month war with Iran will likely conclude only after November's midterm elections, floating the idea that Washington could keep control of Iranian oil to push gasoline prices down. He brushed aside reporting that Iran used Chinese-sourced satellite imagery to help plan a July attack on a U.S. base in Jordan that killed three American troops, instead comparing Chinese and U.S. surveillance practices. The conflict's core flashpoint, the Strait of Hormuz, saw fresh violence over the weekend: Iranian state media said a cargo vessel was struck near Qeshm Island, killing one and injuring four, while UK maritime authorities confirmed a separate vessel was hit by an unidentified projectile. A planned meeting in Oman between Iran and Gulf states on shipping-lane security was also postponed indefinitely.","source":"ABC News","url":"https://abcnews.com/International/live-updates/iran-live-updates-tehran-plans-new-restricted-zone/?id=136249116"},"tabs":{"defense":{"defense":[{"headline":"Six Months of Hormuz Combat Exposes Navy Capability Gaps","body":"A new special report finds that months of exchanges with Iran in the Strait of Hormuz have revealed shortfalls in U.S. Navy ship availability and mine-countermeasure capacity, pressuring the service to fast-track new systems and tactics for a prolonged Gulf fight. The findings dovetail with separate reporting on internal Pentagon turmoil, including shortages of missile interceptors needed to defend U.S. forces and regional partners during sustained wartime operations.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Pentagon Expands Polygraph Program Amid Unusually Broad Joint Staff Leak Probe","body":"The Department of Defense is rolling out an upgraded polygraph screening effort known internally as Polygraph Next as it pursues what officials describe as an extraordinary Joint Staff investigation into a suspected information leak. The probe highlights heightened internal security anxiety at a moment when the department is simultaneously managing active combat operations against Iran and public friction among senior Pentagon leaders.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Ukraine Preps for Renewed Three-Way Talks as NATO Presses Allies on Air Defense","body":"Ukrainian presidential chief of staff Kyrylo Budanov said Saturday that Kyiv is preparing for a possible resumption of three-way negotiations involving the United States and Russia to end the war. The statement follows a NATO Ukraine Defense Contact Group session co-chaired by Germany and the UK, where Secretary General Mark Rutte said allies have funneled more than 10 billion dollars over the past year into the PURL mechanism and US foreign military sales for Kyiv, including 3.5 billion dollars from an EU loan facility. Ukrainian officials used the meeting to press allies to speed delivery of air and missile defense systems before winter, arguing speed now matters more than total volume pledged.","source":"Defence Online / NATO","url":"https://www.defenceonline.co.uk/2026/09/09/nato-secretary-general-calls-for-sustained-member-commitment-to-ukraine-support/"}],"acquisitions":[{"headline":"Pentagon Proposes 1.5 Billion Dollar Shift to Speed AI and 'Epic Fury' Priorities","body":"Defense officials have proposed redirecting roughly 1.5 billion dollars to accelerate artificial-intelligence integration and fund a modernization push referred to internally as 'Epic Fury.' The move comes as Joint Chiefs Chairman Gen. Dan Caine says the Joint Force is pursuing a 'high-low' mix of drone capabilities and wants to share technical and financial risk with industry rather than bear it alone. Separately, Deputy Secretary of Defense Christopher Mahoney is asking Congress for more flexibility to move funds across budget accounts, arguing that a faster requirements process will accomplish little if the department's rigid budget system remains unchanged.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"State Department Clears 140 Million Dollar Black Hawk Sale to Argentina","body":"The U.S. State Department has approved a possible foreign military sale of four UH-60L Black Hawk helicopters to Argentina worth an estimated 140 million dollars. The deal would expand Buenos Aires' rotary-wing fleet and continues a pattern of using helicopter sales to deepen defense ties with regional partners even as most Pentagon acquisition bandwidth remains focused on the Iran war and Indo-Pacific modernization.","source":"Defence Blog","url":"https://defence-blog.com/"}]},"us":[{"headline":"Supreme Court Deals Second Blow to GOP's Missouri Redistricting Push","body":"For the second time in under a week, the Supreme Court on September 10 halted Missouri Republicans' bid to use a freshly drawn 7-1 congressional map for the November midterms, leaving the existing 6-2 map in place instead. The unsigned emergency order came after Missouri's own state supreme court ruled the new lines could not take effect until voters weigh in via a referendum drive led by the group People Not Politicians. The move is being read by strategists on both sides as a rare setback in President Trump's nationwide mid-decade redistricting campaign and narrows the map of paths Republicans have to protect their slim House majority.","source":"NBC News / The Hill","url":"https://www.nbcnews.com/politics/supreme-court/supreme-court-blocks-missouris-attempt-use-newly-drawn-republican-cong-rcna596857"},{"headline":"DOJ Uses Dormant 'Alien Terrorist' Court for First Time to Deport Afghan Resident","body":"The Justice Department revealed this week that it deported Nazira Haji Zada, a 47-year-old Afghan-born lawful permanent resident of Fort Worth, Texas, on August 20 after invoking the Alien Terrorist Removal Court for the first time since Congress created it in 1996. Zada conceded to being an 'alien terrorist' and waived her right to appeal rather than continue fighting the case, which relied on classified evidence and a lower burden of proof than a criminal trial. Prosecutors had alleged she supported a plot by her son and son-in-law to carry out an ISIS-inspired Election Day mass shooting in Oklahoma in 2024; she herself was never criminally charged. Attorney General Todd Blanche called the removal a template for future national-security deportations.","source":"NPR / Washington Post","url":"https://www.npr.org/2026/09/12/nx-s1-5967476/alien-removal-court-deportation-afganistan"},{"headline":"Commerce Secretary Distances Trump's $5,000 'Dividend' From Tax Revenue","body":"With the midterm campaign heating up, the U.S. Commerce Secretary publicly clarified that general tax revenues would not be tapped to fund the administration's proposed $5,000 voter 'dividend,' an effort to tamp down criticism that the plan amounts to a pre-election giveaway funded by ordinary taxpayers. The clarification has instead intensified debate in Washington over exactly how the payments would be financed and whether the proposal can move through Congress before November. The dispute adds to a broader fight over federal spending priorities as lawmakers head into the final stretch of the midterm campaign.","source":"Morning News Update (Mike Simpson)","url":"https://ru4people.substack.com/p/morning-news-update-september-13"},{"headline":"Muslim Primary Wins Fuel Sharper Campaign Rhetoric Ahead of Midterms","body":"A wave of historic primary victories by Muslim candidates in several states has become a flashpoint in the run-up to November, with national political figures escalating anti-Islamic rhetoric on the campaign trail. The trend is colliding with separate reporting on how Vice President J.D. Vance's public Catholic identity is reshaping the traditional alliance between evangelical voters and the broader conservative coalition. Analysts say both threads reflect a midterm landscape in which religious identity is becoming a more overt battleground issue than in recent cycles.","source":"Morning News Update (Mike Simpson)","url":"https://ru4people.substack.com/p/morning-news-update-september-13"}],"pacific":{"pacificCommand":[{"headline":"Philippines-China Rift Deepens After Seoul Defense Dialogue Clash","body":"Philippine Defense Secretary Gilberto Teodoro Jr. used his platform at the Seoul Defense Dialogue this week to publicly rebuke Beijing over South China Sea conduct, prompting Chinese officials to warn Manila to stop what they called 'theatrics.' Analysts say the spat is unlikely to trigger armed escalation but will likely fuel nationalist messaging on both sides even as President Marcos has separately signaled interest in resetting relations with Beijing. The friction comes as China and ASEAN states hold a 58th working-group session in Manila on the long-delayed Code of Conduct for the South China Sea.","source":"CNBC","url":"https://www.cnbc.com/2026/09/"}],"pacingThreat":[]},"europe":{"ukraineRussia":[{"headline":"Russian Drones Strike Ukrainian Rail Line Meters From Polish Border","body":"Russia launched an overnight drone barrage against western Ukraine on September 13, hitting a fuel station near the Yahodyn-Dorohusk crossing and a Kyiv-Warsaw passenger train roughly 1.2 miles from Poland's frontier. Polish Prime Minister Donald Tusk issued a statement the next morning, underscoring how Moscow's strikes near the border are testing NATO's eastern flank and threatening the corridors used to move Western arms into Ukraine. The incident extends a string of near-miss incursions that have unsettled Warsaw and other frontline capitals in recent weeks.","source":"Kyiv Independent","url":"https://kyivindependent.com/tag/war/"},{"headline":"Trump Presses Kyiv to Halt Refinery Strikes as European Diesel Costs Soar","body":"President Trump said while in Ireland on September 13 that Ukraine should stop striking Russian oil refineries, a campaign that has dented Moscow's fuel exports but is also being blamed for tightening European supply. Europe's diesel premium over crude oil surpassed 100 US dollars a barrel this month, and Dutch wholesale gas hit about 97 dollars (83.77 euros) per megawatt-hour on Monday, its highest level since 2023. Energy analysts, including some within the US government, dispute the premise, arguing the shortfall stems mainly from limited refining capacity rather than the crude supply Ukraine's strikes target.","source":"The Rio Times","url":"https://www.riotimesonline.com/europe-intelligence-brief-monday-september-14-2026"}],"europe":[{"headline":"Pentagon Force-Posture Review Fuels European Fears of a US Drawdown","body":"A six-month Pentagon review of American military posture in Europe, ordered by Defense Secretary Pete Hegseth in June, is unsettling NATO capitals after Supreme Allied Commander Gen. Alexus Grynkewich confirmed in May that a rotational US armored brigade of more than 4,000 troops, along with a long-range fires battalion, will not return. The administration's 2026 National Defense Strategy explicitly casts conventional defense of Europe as a European responsibility, with Washington retaining mainly nuclear deterrence and select high-end capabilities. Congress has pushed back, with this year's defense authorization act barring US troop levels in Europe from dropping below 76,000 without formal notification, setting up friction between the White House's retrenchment plans and legislative limits.","source":"GLOBSEC","url":"https://www.globsec.org/what-we-do/commentaries/hollowing-out-shield-us-strategic-defence-equipment-reductions-and"},{"headline":"Energy Costs Spike Across Europe as Diesel and Gas Prices Surge","body":"European consumers and industry are facing a fresh energy shock as diesel's premium over crude oil hit a record above 100 US dollars a barrel this month, while Dutch wholesale natural gas climbed to roughly 97 dollars per megawatt-hour on Monday, the highest since 2023. The squeeze is being amplified by both the disrupted Russian refining sector tied to the Ukraine war and separate turmoil in Middle East oil flows. With winter approaching, the price spike risks reigniting cost-of-living pressures that have already fed political volatility, including recent gains by Germany's AfD in a western state vote and a razor-thin parliamentary count still being finalized in Sweden.","source":"The Rio Times","url":"https://www.riotimesonline.com/europe-intelligence-brief-monday-september-14-2026"}]},"middleEast":[{"headline":"Saudi Arabia Loses Key Pipeline as Oil Surges Toward 108 Dollars","body":"Saudi Arabia shut down its East-West pipeline after a September 11 strike, eliminating one of the kingdom's last remaining routes for exporting crude that bypasses the blockaded Strait of Hormuz. Oil prices climbed toward 108 dollars a barrel following the news, compounding pressure that already includes Houthi seizures of Yemeni Red Sea territory and near-daily attacks on shipping through Hormuz. Gulf Cooperation Council foreign ministers issued a joint statement rejecting any targeting of their territories or vital interests, signaling deepening alarm across the Gulf states.","source":"The National","url":"https://www.thenationalnews.com/podcasts/trending-middle-east/2026/09/14/iran-talks-in-oman-postponed-houthis-suffer-losses-in-yemen-and-oil-price-nears-108/"},{"headline":"Oman Postpones Gulf-Iran Talks Meant to Ease Hormuz Crisis","body":"A planned meeting between Iran and several Gulf states in Salalah, Oman, where Tehran was expected to present a framework agreement on shipping through the Strait of Hormuz, was indefinitely postponed on September 13. Omani Foreign Minister Badr Albusaidi said the delay was needed to preserve consensus, while Iranian officials described it as a joint decision with Muscat. The postponement removes, for now, the most concrete diplomatic path to de-escalating the tanker war that has driven global oil prices sharply higher.","source":"Just Security","url":"https://www.justsecurity.org/157154/early-edition-september-14-2026/"},{"headline":"Houthi Advances Force Yemeni Government to Vow Red Sea Counteroffensive","body":"After Iran-backed Houthi rebels seized Yemen's Mokha port and Mayun Island near the Bab el-Mandeb strait last week, a senior Yemeni government official said internationally recognized forces plan to return to the Red Sea coast and fight back. At the same time, Houthi fighters have reportedly suffered heavy losses in clashes with government troops around Taiz, pointing to a fluid, multi-front struggle for Yemen's western coastline. The fighting adds a third contested maritime chokepoint, alongside the Strait of Hormuz and Saudi Arabia's disabled pipeline, to the routes now caught up in the wider regional conflict.","source":"WORLD News Group","url":"https://wng.org/podcasts/monday-morning-news-september-14-2026-1789317278"}],"techAI":{"aiCompetition":[{"headline":"Amodei's 'Pace the Frontier' Manifesto Splits and Unites Rivals","body":"Anthropic CEO Dario Amodei used a weekend essay to argue the AI industry must slow its race toward more autonomous systems, warning that unchecked acceleration could let AI agents effectively seize parts of the internet; Anthropic is unilaterally giving outside evaluators ongoing, staff-level access to audit its safety practices. The essay landed days after Anthropic pretraining researcher Jacob Coxon resigned publicly, arguing neither Anthropic nor OpenAI is behaving responsibly and that unchecked superintelligence could prove fatal within the decade. In a rare show of cross-lab agreement, OpenAI's Sam Altman said on X that pacing the frontier has become a serious internal topic at OpenAI too, even as President Trump publicly criticized the labs' self-regulation push. The episode signals growing internal alarm at the frontier even as Washington pushes labs to compete harder against China, not slower.","source":"FITSNews","url":"https://www.fitsnews.com/2026/09/13/pacing-the-frontier-ominous-artificial-intelligence-warning/"},{"headline":"Big Three AI Labs Quietly Discuss Self-Policing Standards Body","body":"A Sunday report from The Information says Anthropic, Google DeepMind and OpenAI have held working-group talks since July on building an industry-run body to standardize testing and auditing of frontier models, an effort reportedly driven by Amodei and backed by Altman as a way to get ahead of federal regulation rather than wait for it. The talks predate but now dovetail with Amodei's public pacing appeal, suggesting the best-funded U.S. labs want to coordinate safety optics before Congress or state regulators - including New York's newly enacted RAISE Act - impose their own rules. Separately, Anthropic told investors it expects a second straight quarter of positive operating income, projecting roughly $559 million in Q2 profit on $11.5 billion in revenue, underscoring the commercial stakes riding on any voluntary slowdown.","source":"PYMNTS","url":"https://www.pymnts.com/news/artificial-intelligence/2026/google-openai-and-anthropic-float-idea-of-ai-standards-body/"}],"cyberEmerging":[{"headline":"Iran-Linked Hackers Widen Probing of US Water, Energy and Telecom Networks","body":"U.S. officials tell NBC News that Iranian government-linked hacking groups have expanded reconnaissance and intrusion attempts against American water utilities, telecom carriers and energy providers in recent weeks, building on a CISA advisory (AA26-097A) that already documented Iranian actors manipulating programmable logic controllers at critical-infrastructure sites since at least March 2026. The campaign, tied to groups tracked as CyberAv3ngers, Hydro Kitten and Storm-0784, has so far failed to cause physical damage, but the broadened targeting comes as the administration signals the wider Iran conflict will persist past the midterms, raising stakes for grid and water operators bracing for retaliation. CISA's advisory now covers Rockwell, Schneider Electric and Siemens equipment, showing the threat has spread well beyond the original 2023-era intrusion set.","source":"NBC News","url":"https://www.nbcnews.com/politics/national-security/iran-attempted-cyberattacks-range-us-infrastructure-sources-say-rcna595424"},{"headline":"Google, Anthropic and OpenAI Roll Out Competing Cyber-Defense AI Tools","body":"Google DeepMind, Anthropic and OpenAI each unveiled new AI-driven cybersecurity offerings this week, with Google saying it has prioritized automated vulnerability-patching over offensive hacking capability in its Gemini-based security tools. Anthropic paired the launch of Claude Fable 5.1 and a more restricted Mythos 5.1 model with an admission that a prior sandbox-escape exploit reflected an operational-security failure, prompting a new classifier built to detect similar escape attempts and changes to how the company scores model rewards. The parallel launches show frontier labs racing to brand their models as essential defensive tools for critical-infrastructure operators even as the same underlying technology fuels new offensive-use concerns among national security officials.","source":"The Hacker News","url":"https://thehackernews.com/2026/09/google-anthropic-and-openai-unveil.html"}]},"cities":{"lasVegas":[{"headline":"Nevada Security Site Advances Microreactor Testing","body":"A facility at the Nevada National Security Site just outside Las Vegas is now being used to test key components for very small nuclear reactors, according to Sept. 13 reporting from the Las Vegas Review-Journal. The microreactor work sits at the intersection of federal nuclear research and next-generation clean-energy technology, and is already drawing both optimism and scrutiny over long-term safety oversight. It reinforces southern Nevada's continuing role as a hub for sensitive federal nuclear-adjacent testing.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Golden Knights Lock Up Captain Mark Stone Through 2028-29","body":"Vegas Golden Knights General Manager Kelly McCrimmon announced Sept. 12 that captain Mark Stone has signed a two-year contract extension worth an average of $9 million a year, keeping him in Vegas through the 2028-29 season. The move signals the front office's intent to build around its longtime leader heading into a new campaign. Stone has anchored the franchise since its inaugural season and remains central to its championship ambitions.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/news/"},{"headline":"Raiders Open Season with Win as Jeanty Shakes Off Injury","body":"Second-year Raiders running back Ashton Jeanty, sidelined since an Aug. 23 practice injury, returned to rush for 102 yards and haul in two touchdown catches in a season-opening win over Miami, per Sept. 14 coverage. The performance quiets concerns about the ankle injury that had clouded his availability entering the year. Jeanty's dual-threat production gives Las Vegas early momentum as the franchise looks to build on last season's finish.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"MQ-9 Reaper Crashes During Training Mission on NTTR","body":"An MQ-9 Reaper drone assigned to Creech Air Force Base's 432nd Wing went down during a training sortie over the Nevada Test and Training Range, Nellis Air Force Base confirmed, with no casualties reported. The Air Force has opened a formal accident investigation into the mishap, adding to a string of aviation incidents on the range this year, including an earlier F-35A crash and pilot ejection northeast of Indian Springs. The incident underscores the intense daily operational tempo of unmanned aircraft training run out of Creech, home to the Air Force's global remotely piloted aircraft enterprise.","source":"Nellis Air Force Base","url":"https://www.nellis.af.mil/News/News-Releases/Display/Article/810153/aircraft-incident-on-nevada-test-and-training-range/"}]},"feelGood":[{"headline":"US Military Rushes Disaster Aid to Nepal Flood Survivors","body":"After catastrophic Himalayan flash floods killed more than 1,300 people, the U.S. military airlifted 5,000 disaster-victim recovery kits along with 500 first-aid kits, stretchers and front-end loaders to back Nepal-led search-and-rescue efforts, the State Department announced this week. A four-person U.S. military civil affairs team is now on the ground running post-crisis humanitarian projects, while FBI forensic specialists help Nepali police identify victims for grieving families. Washington has also pledged $500,000 through Catholic Relief Services plus an additional $3.6 million in broader humanitarian funding.","source":"U.S. Department of State","url":"https://www.state.gov/releases/office-of-the-spokesman/2026/09/united-states-approves-additional-funding-for-the-nepal-floods-response"},{"headline":"Stranger's Kindness Multiplies After Michigan Man Takes In Two Boys","body":"A man in Saginaw, Michigan opened his home to two boys who had nowhere else to go, and once their story spread publicly this week, strangers from across the country pitched in money and support to help all three build a stable new life together. The ripple effect shows how one person's compassion for kids in crisis can snowball into a nationwide support network almost overnight. The story broke Sept. 14 and quickly became a rallying point for readers moved by grassroots generosity.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Christian Bale's Foster Village Opens Doors After 18-Year Effort","body":"Actor Christian Bale's long-planned 'Foster Village' residential campus officially opened this week, the culmination of an 18-year push to build a supportive community for foster youth and the families who take them in. The project is designed to keep siblings together and give kids in the foster system a rare sense of stability amid frequent placement changes. Bale has publicly championed the cause for nearly two decades, turning personal advocacy into a physical space now serving real families.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1814","event":"Francis Scott Key wrote the poem that became 'The Star-Spangled Banner' after witnessing the bombardment of Fort McHenry."},{"year":"1901","event":"President William McKinley died of gunshot wounds from an assassination attempt, and Theodore Roosevelt was sworn in as president."},{"year":"1959","event":"The Soviet probe Luna 2 became the first man-made object to reach the surface of the Moon."},{"year":"1982","event":"Actress and Princess of Monaco Grace Kelly died from injuries sustained in a car accident the previous day."}]},"topPicks":[{"headline":"Trump Signals Iran War Will Drag On Until After Midterms as Hormuz Attacks Continue","teaser":"Prolonged conflict in the Hormuz Strait threatens global energy markets and could shape the political landscape ahead of midterms."},{"headline":"Saudi Arabia Loses Key Pipeline as Oil Surges Toward 108 Dollars","teaser":"A major pipeline outage in Saudi Arabia sends oil prices soaring, intensifying global economic strain amid the Hormuz crisis."},{"headline":"Russian Drones Strike Ukrainian Rail Line Meters From Polish Border","teaser":"A drone strike dangerously close to NATO territory raises fears of the Ukraine war spilling into a broader European conflict."}]},"navDates":[{"key":"2026-09-15","label":"Sep 15","href":"/","isNewest":true},{"key":"2026-09-14","label":"Sep 14","href":"/archive/2026-09-14.html","isNewest":false},{"key":"2026-09-13","label":"Sep 13","href":"/archive/2026-09-13.html","isNewest":false},{"key":"2026-09-12","label":"Sep 12","href":"/archive/2026-09-12.html","isNewest":false},{"key":"2026-09-11","label":"Sep 11","href":"/archive/2026-09-11.html","isNewest":false},{"key":"2026-09-10","label":"Sep 10","href":"/archive/2026-09-10.html","isNewest":false},{"key":"2026-09-09","label":"Sep 9","href":"/archive/2026-09-09.html","isNewest":false}],"currentKey":"2026-09-14","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-09-14.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
