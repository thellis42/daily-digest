<script>
const STATE = {"digest":{"date":"Thursday, November 19, 2026","generatedAt":"Thu, Nov 19, 10:15 AM PST","breaking":{"headline":"Iran widens Gulf attacks on Kuwait and Bahrain after US strike on Qeshm Island; one of three carrier strike groups pulls out","body":"Iran fired on a US-used airbase in Kuwait and struck Bahrain multiple times on November 18, a retaliatory escalation following a US strike a day earlier on Iran's Qeshm Island missile-launch site in the Strait of Hormuz. Bahrain, home to the US Navy's Fifth Fleet, has now absorbed four Iranian attacks in six days, ending a weeks-long lull in the nine-month-old war, while a coalition operation separately hit roughly 60 Houthi military sites across Yemen. Bloomberg's Pentagon reporter also flagged that one of three US carrier strike groups deployed to enforce the Gulf naval blockade on Iran has departed the region, likely heading home, raising questions about US force posture even as hostilities intensify.","source":"AP / US News","url":"https://www.usnews.com/news/world/articles/2026-11-18/iran-widens-gulf-attacks-firing-on-a-us-air-base-in-kuwait-and-at-targets-in-bahrain"},"tabs":{"defense":{"defense":[{"headline":"Hegseth nominates Gen. Christopher LaNeve as next Army chief of staff","body":"Defense Secretary Pete Hegseth has tapped Gen. Christopher LaNeve to become the Army's top uniformed officer, coming seven months after Hegseth abruptly removed the previous chief, Gen. Randy George, without public explanation. The pick fills a key leadership gap atop the Army at a moment when the service is juggling modernization priorities alongside sustained Gulf deployments tied to the ongoing Iran war.","source":"Just Security Early Edition","url":"https://www.justsecurity.org/165038/early-edition-november-18-2026/"},{"headline":"Senate Armed Services Committee weighs Hung Cao to be next Navy secretary","body":"Senators on the Armed Services Committee held a confirmation hearing this week for Hung Cao, nominated to serve as the next Secretary of the Navy. The hearing coincided with broader Senate action on FY2027 defense spending priorities, as lawmakers probe how a new civilian Navy leader would approach shipbuilding delays and fleet readiness amid Indo-Pacific competition.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Pentagon's Colby warns NATO allies not to freeze out US arms makers","body":"Pentagon policy chief Elbridge Colby cautioned European NATO members this week against cutting US defense firms out of weapons contracts as the alliance ramps up spending to reduce reliance on Washington for conventional deterrence. The warning underscores friction inside the alliance over how to balance European industrial-base growth with continued US arms sales as allies accelerate rearmament plans.","source":"FDD Overnight Brief","url":"https://www.fdd.org/overnight-brief/november-18-2026/"}],"acquisitions":[{"headline":"Senate appropriators swap six F-15EXs for five more F-35As in draft FY27 bill","body":"A draft Senate Appropriations Committee defense spending bill for fiscal year 2027 would add five additional F-35A fighters while cutting six F-15EX jets, part of a broader reshuffling of Pentagon procurement priorities in which shipbuilding and R&D accounts absorb the biggest offsets. The move signals continued congressional favoritism toward the stealth F-35 program even as the Air Force had sought a mixed fighter buy including the non-stealth F-15EX.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Space Force hands ULA another launch contract despite recent failure","body":"The Space Force awarded United Launch Alliance an additional contract making it eligible to compete for high-priority national security launch missions, the Pentagon announced this week, notably coming just days after a ULA launch failure over the weekend. The award keeps ULA in the running alongside SpaceX for lucrative national security space launches even as the company works through the fallout from its recent mishap.","source":"Inside Defense INSIDER Daily Digest","url":"https://insidedefense.com/insider/insider-daily-digest-november-18-2026"}]},"us":[{"headline":"Peltola flips Alaska Senate seat, cementing historic 56-seat Democratic majority","body":"Mary Peltola has defeated two-term Republican Senator Dan Sullivan in Alaska, the last race of the midterm cycle to be called, giving Democrats 56 seats to Republicans' 44 when the new Congress convenes in January. The result is part of a nine-seat Democratic gain this cycle, the party's largest one-cycle pickup since 1958, in a state Trump carried by 13 points in 2024. Peltola becomes the first Alaska Native elected to the Senate and the first Democrat to win a Senate race there since 2008, but the incoming majority is already divided: Maryland Senator Chris Van Hollen is mounting a left-flank challenge to Chuck Schumer's leadership ahead of a December 1 caucus vote, with polling showing only about a third of Democrats approve of Schumer's performance.","source":"CNN","url":"https://www.cnn.com/2026/11/17/politics/mary-peltola-wins-alaska-senate"},{"headline":"House Democrats formally tap Jeffries for speaker, Clark for majority leader ahead of January takeover","body":"House Democrats voted 251-11 on Wednesday to nominate New York Congressman Hakeem Jeffries as their candidate for speaker, putting him on track to become the chamber's first Black speaker when the full House votes in January. Massachusetts Congresswoman Katherine Clark was simultaneously elected majority leader, positioning her to be the first woman to hold that post. Eleven lawmakers aligned with the Democratic Socialists of America voted against Jeffries, signaling an early intra-party rift over direction heading into the new majority after Democrats' historic midterm wins.","source":"Kiowa County Press / 2026Talks","url":"https://kiowacountypress.net/content/politics-2026talks-november-19-2026"},{"headline":"DHS Secretary Mullin grilled over ground-stop fallout as Noem-era corruption probe opens","body":"Homeland Security Secretary Markwayne Mullin faced sharp questioning from House Democrats on Wednesday over last Friday's nationwide ground-stop order, which triggered more than 18,000 canceled flights and 28,000 delays, and over his own use of a government plane to attend a college football game during the chaos. Separately, the House Oversight Committee announced it will investigate possible corruption or abuse of power during former DHS Secretary Kristi Noem's tenure. Federal investigators say the ground-stop was caused by a network upgrade interacting badly with aging equipment rather than a cyberattack, though the probe into the root cause continues.","source":"Democracy Now! / KCAU","url":"https://www.democracynow.org/2026/11/19/headlines"},{"headline":"Appeals court again halts discharge of 27 transgender troops as Pentagon seeks Supreme Court review","body":"A divided D.C. Circuit panel on Tuesday blocked the Pentagon from discharging 27 transgender service members covered by an ongoing lawsuit, even as the Trump administration pursues Supreme Court review of the broader ban. Judge Robert Wilkins, an Obama appointee, wrote that Defense Secretary Pete Hegseth's department never specified what national-security risk would follow from letting the serving plaintiffs stay, while Trump-appointed Judge Justin Walker dissented, arguing courts lack authority to second-guess the exclusion policy. The order keeps the named plaintiffs in uniform and shields them from being outed, but does not reopen enlistment to new transgender recruits, with the case now expected to reach the Supreme Court in December.","source":"Associated Press (via ABC News)","url":"https://abcnews.com/US/wireStory/divided-appeals-court-blocks-pentagon-expelling-transgender-troops-138228654"}],"pacific":{"pacificCommand":[{"headline":"Takaichi Gets Cold Shoulder From Beijing at APEC Summit","body":"Japanese Prime Minister Sanae Takaichi traveled to Shenzhen for the APEC summit on November 19, her first visit to China since 2019, but was greeted on the tarmac by a retired diplomat rather than a sitting official. At a briefing the same day she said Tokyo's position on Taiwan under the 1972 joint communique remains unchanged while noting ongoing talks with Beijing over rare-earth export curbs. Analysts expect China's restrictions on rare-earth shipments, in place since Takaichi's November 2025 remarks on a possible Taiwan contingency, to persist well into next year.","source":"CNBC","url":"https://www.cnbc.com/2026/11/19/japan-china-trump-takaichi-taiwan-.html"},{"headline":"Quad Sets First-Ever Joint Military Exercise for 2027","body":"The United States, Japan, India and Australia announced on November 19 that the Quad will hold its first combined military exercise, a maritime-surveillance drill slated for 2027. The plan calls for India, the US and Australia to fly P-8 Poseidon patrol aircraft alongside Japan's P-3C fleet to pool tracking of activity across the Indo-Pacific. The move marks a shift from the grouping's past focus on coast guard and diplomatic coordination toward direct military interoperability.","source":"SSBCrack (Defence Current Affairs)","url":"https://ssbcrackexams.com/defence-current-affairs-19-november-2026/"},{"headline":"India and Japan Deepen Maritime Ties With 2+2 Talks, Naval Drill","body":"India and Japan held their fourth 2+2 ministerial dialogue in Tokyo on November 18-19, days after wrapping up the JIMEX 2026 naval exercise in which the destroyer INS Sahyadri operated alongside Japan's JS Ise on November 13-14. The back-to-back dialogue and drill underscore New Delhi and Tokyo's push to expand maritime security cooperation amid shared concerns over Chinese naval activity in the Indo-Pacific. The talks follow India's broader pattern this month of courting Indo-Pacific partners, including a new multilateral tech-security pact signed in San Francisco on November 15.","source":"SSBCrack (Defence Current Affairs)","url":"https://ssbcrackexams.com/defence-current-affairs-18-november-2026/"}],"pacingThreat":[{"headline":"Satellite Imagery Shows China's Largest Air Combat Exercise in Years","body":"New satellite analysis released November 11 by the Mitchell Institute for Aerospace Studies and reported November 17-18 shows roughly 279 to 300 PLA Air Force aircraft massed across 11 bases in western China, up 44 percent from the 194 aircraft seen at eight bases during a comparable drill in 2025. The imagery includes 43 J-20 stealth fighters alongside H-6 bombers and support aircraft, and analysts believe the buildup, likely tied to the annual Red Sword exercise, began in mid-October. Experts say the scale reflects incremental but real gains in China's ability to run large, multi-type combat operations akin to a US Red Flag exercise.","source":"South China Morning Post / IBTimes","url":"https://www.scmp.com/news/china/military/article/3374694/what-does-chinas-massive-warplane-build-say-about-its-combat-readiness"},{"headline":"Unannounced PLA Drill May Be Rehearsing a Taiwan Blockade","body":"A joint AEI/Institute for the Study of War report, updated this week, assesses that China has been quietly running an exercise larger than last year's 'Justice Mission' drill, deploying over 100 PLA Navy and coast guard vessels in a pattern simulating the isolation of Taiwan. Four naval task forces drawn from three separate theater commands reportedly operated between Taiwan and Guam, an unusual degree of coordination that analysts say could compress the warning time Taiwan and its partners would have before a real blockade. Beijing's decision not to publicize the drill, unlike past exercises, is seen as an effort to normalize the appearance that it can encircle Taiwan on short notice.","source":"Formosan Association for Public Affairs / AEI","url":"https://fapa.org/2026-1117-pla-may-be-simulating-taiwans-isolation-taiwan-pursues-independent-satellite-launches/"},{"headline":"Russian Jets Cross Taiwan's ADIZ as Taipei Watches Great-Power Diplomacy","body":"Taiwan's defense ministry said two Russian military aircraft entered its air defense identification zone on November 17, flying off the island's east coast before exiting near Taitung County; Japan separately protested to Moscow after aircraft believed to be the same pair violated its own airspace that day. The incident came as Taipei said it is closely watching prospective US-China-Russia diplomatic contacts, with officials noting President Trump's remark in May that he was withholding a new Taiwan arms package as a negotiating card with Beijing. Taiwan's presidential office reiterated it will keep strengthening self-defense and resilience while working with G7 partners to preserve the Strait status quo.","source":"Taipei Times","url":"https://taipeitimes.com/News/front/archives/2026/11/18/2003867931"}]},"europe":{"ukraineRussia":[{"headline":"Crimean Bridge rail line hit for third time in a week as Russia pounds Ukraine with Oniks missiles and 98 drones","body":"Ukraine struck the railway section of the Kerch Strait bridge overnight for the third time in seven days, prompting Moscow's Transport Ministry to again suspend train service across the span linking Russia to occupied Crimea. The attack came as Russia hit back with Oniks anti-ship missiles fired from Crimea alongside 98 Shahed and decoy drones, 61 of them jet-powered, with Ukraine's air force reporting 69 intercepted by mid-morning. Odesa held a day of mourning for residents killed in a November 18 strike on the city center, while Shahed attacks knocked out power to 99 settlements in Mykolaiv region before crews restored supply.","source":"Ukraine Desk Note / RBC-Ukraine","url":"https://oskarhallgrimsson.substack.com/p/ukraine-desk-note-19-november-2026"},{"headline":"Zelensky lays out four-point wartime agenda at Berlin 'Coalition of the Willing' talks","body":"Ukrainian President Volodymyr Zelensky told allies gathered in Berlin that Kyiv's top priorities are shoring up air defense, securing energy and financial support through the winter, advancing diplomacy, and ultimately ending the war, as Ukraine's General Staff put cumulative Russian losses since February 2022 at roughly 1.63 million troops. Ukraine's defense ministry separately confirmed it will be able to pay for US weapons purchased through the PURL mechanism using EU loan funds, addressing a financing gap as officials warn 2026 budget pressures are mounting. The push for firmer Western backing comes as Kyiv reports drone strikes on Russian oil refineries in Krasnodar Krai and an oil hub in Tatarstan.","source":"Kyiv Independent","url":"https://kyivindependent.com/"}],"europe":[{"headline":"NATO allies pledge fresh military aid to Ukraine at Contact Group meeting","body":"NATO Secretary General Mark Rutte hosted the Ukraine Defence Contact Group at alliance headquarters on November 17, where he welcomed what he called strong continued allied support for Kyiv's defense needs heading into winter. The meeting came days after NATO unveiled over $50 billion in new defense-industry procurement deals announced at July's Ankara summit, and as the alliance separately launched a Global Data Marketplace for Space and the ten-nation STARLIFT satellite-launch initiative at the NATO Edge conference in Izmir. Officials are emphasizing that turning these contracts into deployable capability requires sustained industrial cooperation across the US, Canada and Europe rather than any single country acting alone.","source":"NATO","url":"https://www.nato.int/en/news-and-events/articles/news/2026/11/18/nato-secretary-general-welcomes-strong-allied-support-at-ukraine-defence-contact-group-meeting"},{"headline":"European governments urge citizens to stockpile supplies as war-spillover fears grow","body":"A growing number of European governments are telling millions of residents to stockpile food, water, cash and medicine amid mounting concern that Russia's war against Ukraine could spill further across the continent. The advisories follow weeks of heightened alarm after Polish air defenses were placed on alert following Russian strikes near Ukraine's western border, and as Norway's foreign minister publicly rejected any Russian say over NATO military activity. The preparedness push underscores how civil-defense anxiety has become a defining public concern across the EU even as officials simultaneously debate a new long-term EU budget meant to bolster the bloc's defense industrial base.","source":"Yahoo News / Bloomberg","url":"https://www.yahoo.com/news/world/articles/eu-governments-urge-citizens-stockpile-143954526.html"}]},"middleEast":[{"headline":"Israeli ground push beyond Gaza's 'Yellow Line' draws Arab League and Arab Parliament condemnation","body":"Israeli forces advanced west of the ceasefire's Yellow Line into the al-Mughraqa area and the al-Daawa neighborhood north of the Nuseirat refugee camp on November 18, ordering civilians out in a rare expansion beyond the agreed buffer. The Arab Parliament called the move a serious escalation that could unravel the ceasefire in place since October 2025, while the Arab League separately condemned a strike on the Nasser Medical Complex in Khan Younis as a violation of humanitarian law. The incidents add to strain on a truce that Israeli officials, including Defense Minister Israel Katz, have said will leave security zones in Gaza, Lebanon and Syria in place indefinitely.","source":"SANA / Arab League","url":"https://sana.sy/en/middle-east/2359985/"},{"headline":"US and Lebanon escalate pressure on Hezbollah's finances and recruitment networks","body":"The US Treasury under Secretary Scott Bessent sanctioned a Lebanese charity, businessmen and gold firms accused of bankrolling Hezbollah, part of a broader campaign to choke off the group's financial networks and curb Iranian influence in Lebanon. Lebanese authorities simultaneously charged five Hezbollah members with recruiting and arming others, signaling a rare domestic legal crackdown even as Israeli strikes and artillery continue hitting southern Lebanon despite the ceasefire. Lebanon's economy is projected to contract roughly 6.4% this year, and donors have said large-scale reconstruction funding is unlikely without a verified Israeli troop pullback.","source":"Drop Site News","url":"https://www.dropsitenews.com/p/iran-war-oil-ansarallah-saudi-riyadh-icj-myanmar-rohingya"},{"headline":"Syria's Sharaa government struggles to absorb foreign fighters amid resurgent ISIS fears","body":"Syrian authorities under President Ahmed al-Sharaa are facing difficulty integrating thousands of foreign fighters who fought alongside opposition forces, with analysts warning the unresolved status of these combatants could create openings for an Islamic State resurgence. The concern comes as Damascus simultaneously works to stabilize relations with Kurdish-led forces in the east and manage lingering distrust from the civil war's final phase. Separately, Iraq sentenced six French nationals to life in prison this week for joining ISIL, underscoring how foreign-fighter fallout from Syria's conflict continues to ripple across the region years after Assad's fall.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-november-19-2026/"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Debuts on Nasdaq in History's Largest IPO","body":"Anthropic began trading Thursday under the ticker ANT after pricing its offering at $83 a share Wednesday evening, above the $70-$78 marketed range, raising roughly $81.3 billion by selling 980 million shares. Shares surged as much as 39% on debut, making Anthropic the first frontier AI lab to go public and a milestone for AI-sector capital markets. Needham initiated coverage with a buy rating even as protesters gathered outside the exchange calling for a pause on frontier model development.","source":"Yahoo Finance / Kelly Abbott Substack","url":"https://finance.yahoo.com/markets/stocks/articles/anthropic-set-start-trading-completing-135519162.html"},{"headline":"Nvidia Zeroes Out China Chip Sales Amid Huang Fallout","body":"Interim CEO Colette Kress confirmed Tuesday that Nvidia has stopped shipping licensed Hopper-generation chips, including the H200, to China and built no China data-center revenue into forward guidance, despite $2.4 billion in such sales last quarter. The halt follows last week's abrupt departure of founder Jensen Huang amid allegations he was compromised by a Chinese intelligence-linked contact, and comes as roughly 600,000 H200 units reportedly sit stranded in Hong Kong after Beijing withheld import approval. The move effectively ends the fragile US-brokered licensing arrangement for advanced AI chips just as Washington tightens transshipment rules for Southeast Asian buyers.","source":"Bloomberg / Reuters","url":"https://www.bloomberg.com/news/articles/2026-11-18/interim-nvidia-ceo-says-it-s-no-longer-sending-ai-chips-to-china"}],"cyberEmerging":[{"headline":"Google Says Fully Autonomous AI Cyberattack Has Arrived","body":"Google's Threat Intelligence Group disclosed in its Q4 2026 AI Threat Tracker that it caught a suspected Russian-speaking operator running an AI framework, dubbed exploit_agent, that scanned patched software, deduced the underlying flaw, wrote a working exploit and stole data from victims with no human in the loop. GTIG, working with Mandiant, called it a 'critical inflection point' and warned that simple multi-agent attacks could proliferate within three months, with fully autonomous sophisticated campaigns likely within six. The report also flagged other offensive AI toolkits such as ARTEX, CAIRN, and HexStrike AI already in use by criminal and state-linked groups, alongside a wave of stolen cloud credentials used to run AI workloads on victims' accounts.","source":"Google Threat Intelligence Group / The Register","url":"https://www.theregister.com/research/2026/11/16/google-ai-agent-turned-a-security-patch-into-a-working-exploit-with-no-human-help/5309926"},{"headline":"Major Banks Push AI-Agent Fraud Losses Onto Customers","body":"Citi, PNC and Citizens Bank quietly rewrote customer agreements this week to make account holders liable for losses caused by hacked or malfunctioning third-party AI agents, following similar moves earlier by JPMorgan and Bank of America. The shift comes as AI-driven banking fraud accelerates; separately, Coinbase said its AI defenses blocked $4.7 million in transfers tied to an AI-generated deepfake 'Elon Musk Tesla giveaway' livestream scam. The liability shift highlights a widening gap between banks' rapid adoption of agentic AI tools and unresolved questions over who bears the risk when those agents are compromised.","source":"TechCrunch","url":"https://techcrunch.com"}]},"cities":{"lasVegas":[{"headline":"Judge's water-rights ruling exposes Nevada to $600M in Coyote Springs damages","body":"A Nevada judge ruled the state unconstitutionally stripped water rights tied to the long-stalled Coyote Springs master-planned community northeast of Las Vegas, a project that was never built. A jury will now decide whether taxpayers owe developers more than $600 million in damages, a case that could hit the state budget hard just as lawmakers finalize spending priorities.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"NV Energy seeks rate cut for Southern Nevada customers in 2027","body":"NV Energy has filed a request to lower electricity rates for its Southern Nevada customer base starting in the new year, a rare rate decrease amid broader regional cost-of-living pressure. The filing will go through state regulatory review before any bills change for Las Vegas-area ratepayers.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/business/"},{"headline":"Nevada National Guard deploys over 100 troops for F1 Las Vegas Grand Prix security","body":"More than 100 Nevada National Guard members are on duty this week supporting Metro police around the Formula One Las Vegas Grand Prix course and at two area hospitals, as race week brings its usual surge of street closures and crowds to the Strip corridor. The deployment comes as teams also grapple with forecasts of cool, possibly rainy conditions for Friday practice and qualifying.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"}],"nellis":[{"headline":"Nellis Air Force Base retires its last A-10 Thunderbolt II","body":"Nellis Air Force Base has cleared its final A-10 Thunderbolt II 'Warthog' from the runway, closing out decades of the iconic close-air-support jet's presence at the Las Vegas-area base as the Air Force reshapes its attack-aircraft fleet. The milestone comes as Nellis simultaneously ramps up for the future, with the service planning a dedicated, roughly $1 billion F-47 sixth-generation fighter test campus on base to support the jet that will eventually replace the F-22 Raptor, while neighboring Creech Air Force Base expands testing of autonomous Collaborative Combat Aircraft like the YFQ-42A and YFQ-44A.","source":"Nellis Air Force Base / Army Recognition","url":"https://www.nellis.af.mil/"}]},"feelGood":[{"headline":"Nine missing children found in multi-agency Las Vegas rescue sweep","body":"Nine children who had been reported missing were located in Las Vegas this week through 'Operation Checkered Flag,' a coordinated effort between F.R.E.E. International, state and local law enforcement, and community nonprofits. The operation reflects a growing model of public-private partnerships working to recover vulnerable kids quickly rather than letting cases go cold.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"},{"headline":"Raiders linemen deliver Thanksgiving dinners to Southern Nevada families","body":"Las Vegas Raiders offensive linemen spent part of their Tuesday off-day loading up residents' cars with full Thanksgiving dinners for Southern Nevada families in need, trading pass protection for grocery bags for an afternoon. The gesture is part of a broader wave of holiday giving from Las Vegas sports franchises and casino operators this week, including Boyd Gaming's pledge of $70,000 to local nonprofits through its Trees of Hope program.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Mission K9 Rescue reunites retired military working dogs with their handlers","body":"Nonprofit Mission K9 Rescue reports that as of November 5 it has spent the year reuniting retired military working dogs with former handlers, finding them retirement homes, and covering about $130,000 in veterinary bills while caring for more than 50 dogs at a time. The group's work gives four-legged veterans who served alongside U.S. troops the chance at a peaceful retirement rather than euthanasia or neglect.","source":"Mission K9 Rescue","url":"https://missionk9rescue.org/"}],"onThisDay":[{"year":"1863","event":"Abraham Lincoln delivered the Gettysburg Address at the dedication of the Soldiers National Cemetery in Pennsylvania."},{"year":"1969","event":"Apollo 12 astronauts Charles Conrad and Alan Bean became the third and fourth humans to walk on the Moon."},{"year":"1985","event":"US President Ronald Reagan and Soviet leader Mikhail Gorbachev held their first summit meeting in Geneva, Switzerland."},{"year":"1990","event":"NATO and Warsaw Pact members signed the Treaty on Conventional Armed Forces in Europe in Paris."}]},"topPicks":[{"headline":"Iran widens Gulf attacks on Kuwait and Bahrain after US strike on Qeshm Island; one of three carrier strike groups pulls out","teaser":"Escalating Gulf strikes and a US carrier withdrawal raise fears of a wider regional war."},{"headline":"Unannounced PLA Drill May Be Rehearsing a Taiwan Blockade","teaser":"A secretive Chinese military exercise stokes concern it could be a dry run for isolating Taiwan."},{"headline":"Anthropic Debuts on Nasdaq in History's Largest IPO","teaser":"Anthropic's record-breaking Nasdaq debut signals a historic surge of investor confidence in AI."}]},"navDates":[{"key":"2026-11-20","label":"Nov 20","href":"/","isNewest":true},{"key":"2026-11-19","label":"Nov 19","href":"/archive/2026-11-19.html","isNewest":false},{"key":"2026-11-18","label":"Nov 18","href":"/archive/2026-11-18.html","isNewest":false},{"key":"2026-11-17","label":"Nov 17","href":"/archive/2026-11-17.html","isNewest":false},{"key":"2026-11-16","label":"Nov 16","href":"/archive/2026-11-16.html","isNewest":false},{"key":"2026-11-15","label":"Nov 15","href":"/archive/2026-11-15.html","isNewest":false},{"key":"2026-11-14","label":"Nov 14","href":"/archive/2026-11-14.html","isNewest":false}],"currentKey":"2026-11-19","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-19.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
