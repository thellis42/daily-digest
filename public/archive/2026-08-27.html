<script>
const STATE = {"digest":{"date":"Thursday, August 27, 2026","generatedAt":"Thu, Aug 27, 2:39 PM PDT","breaking":{"headline":"US Patriot Missile Stocks in Europe Deemed 'Beyond Critical' Amid Iran War Drain","body":"A U.S. defense official and a NATO official told the Associated Press that Washington's parallel war with Iran has consumed roughly 1,500 of the nation's 2,330 Patriot interceptors, about 65 percent of the stockpile, leaving NATO's European reserves dangerously thin. European officials warn Russia could be positioned to strike an alliance member by 2030, a threat window that now coincides with the depleted air-defense buffer. NATO's first European Patriot production line is slated to open in Germany in September, with initial deliveries going to Germany, the Netherlands, Romania and Spain early next year, but production of roughly 600 missiles this year still falls far short of demand from Ukraine, the Gulf and Europe simultaneously.","source":"Associated Press","url":"https://www.reviewjournal.com/news/politics-and-government/us-patriot-missile-stocks-in-europe-are-beyond-critical-due-to-iran-war-officials-say-3870371/"},"tabs":{"defense":{"defense":[{"headline":"Pentagon Iran War Casualty Toll Climbs to 775","body":"The Department of War added 60 newly wounded U.S. service members to its Iran conflict casualty count in recent days, pushing the cumulative total of troops killed or injured since the February 28 strikes to 775. The rising toll comes even as President Trump announced the Navy has fully cleared mines from the main Strait of Hormuz shipping channel, and as Secretary of State Marco Rubio has privately told allies no new strikes on Iran are currently planned.","source":"Aerotech News & Review","url":"https://www.aerotechnews.com/blog/2026/08/26/headlines-august-26-4/"},{"headline":"US Tanker Aircraft Withdraw From Bulgaria After Iran Tensions","body":"Two American tanker aircraft have left Bulgaria's Bezmer air base, Bulgaria's defense minister confirmed, ending a roughly month-long deployment that had provoked objections from Tehran. The pullback follows Rubio's message to foreign counterparts that Washington is emphasizing economic pressure over military escalation against Iran for now, while leaving open the option of retaliatory strikes if Iran attacks first.","source":"Aerotech News & Review","url":"https://www.aerotechnews.com/blog/2026/08/26/headlines-august-26-4/"},{"headline":"NATO Races to Open First European Patriot Plant as Shortage Bites","body":"With Patriot interceptor stockpiles across American and NATO forces in Europe confirmed by a NATO official to be critically low, the alliance is preparing to open its first European Patriot production facility in Germany next month. Initial output will prioritize nations that have already placed orders, including Germany, the Netherlands, Romania and Spain, though deliveries are not expected to begin until early next year, well after the current shortfall driven by the Iran war and Russia's assault on Ukraine.","source":"Associated Press","url":"https://www.reviewjournal.com/news/politics-and-government/us-patriot-missile-stocks-in-europe-are-beyond-critical-due-to-iran-war-officials-say-3870371/"}],"acquisitions":[{"headline":"Pentagon Memo Directs Up to $244M to Palantir Through 2028","body":"A draft Defense Department memo shows Deputy Defense Secretary Steve Feinberg authorized spending as much as $244 million on Palantir's services through March 2027, while instructing the armed forces to arrange further funding through December 2028. The arrangement has drawn scrutiny from transparency advocates because the memo does not specify exactly how the money will be used, even as Feinberg defended Palantir's work supporting the defense industrial base.","source":"Federal News Network","url":"https://federalnewsnetwork.com/contracting/2026/08/pentagon-wants-to-spend-millions-on-palantir-with-few-details/"},{"headline":"Accenture Lands $821M Deal to Overhaul Pentagon's AI War Data Platform","body":"Accenture beat four rival bidders for an $821 million award to mature the Pentagon's War Data Platform, an AI-driven system meant to fuse more than 1,500 commercial and military data sources for battlefield decision-making. Issued through the GSA's Capability Accelerator on the Defense Department's behalf, the contract spins the platform off from the older Advana data-sharing program to sharpen its focus on live combat operations and intelligence targeting.","source":"Federal News Network","url":"https://federalnewsnetwork.com/defense-news/2026/07/accenture-wins-821m-pentagon-ai-data-platform-contract/"}]},"us":[{"headline":"Meta Settles Landmark Teen Addiction Case for Up to $17 Billion","body":"Meta has agreed to pay as much as $17 billion and overhaul child-safety features on Instagram and Facebook to end a case brought by 47 states plus Washington D.C., Puerto Rico, American Samoa and the Northern Mariana Islands, which accused the company of engineering its platforms to be addictive to minors. The deal, announced Wednesday as CEO Mark Zuckerberg was expected to testify in Oakland federal court, requires a combined two-hour daily time cap on the two apps, mandatory break prompts, and limits on beauty filters and visible like counts. California alone is set to collect roughly $2.1 billion, while Meta's own filings show it expects about $10 billion in related legal costs this quarter, a small fraction of last year's $201 billion in revenue.","source":"PBS NewsHour / AP","url":"https://www.pbs.org/newshour/nation/meta-reaches-17-billion-settlement-with-states-in-landmark-trial-over-teen-social-media-addiction"},{"headline":"Boston Judge Lifts Nationwide Block on Trump's Mail-Voting Order, But New Fight Looms","body":"A federal judge in Boston on Wednesday dissolved a nationwide injunction that had frozen U.S. Postal Service work on President Trump's executive order restricting mail-in ballots, following the Supreme Court's decision earlier this week to lift one of two lower-court holds on the policy. Election-law analysts expect the same trial judge to quickly issue a narrower injunction targeting the Postal Service's newly finalized implementation rules, potentially sending the fight back to the Supreme Court within days. The order would create a federal eligibility list and instruct USPS to deliver ballots only to voters on it, a move states argue intrudes on their traditional control of elections just weeks before midterm campaigning intensifies.","source":"NPR","url":"https://www.npr.org/sections/elections/"},{"headline":"Appeals Court Won't Toss Charges Against Rep. LaMonica McIver Over ICE Facility Visit","body":"A federal appeals court declined this week to dismiss criminal charges against Democratic Rep. LaMonica McIver, who was indicted after a confrontation with agents during a congressional oversight visit to the Delaney Hall immigration detention facility. The ruling keeps alive a prosecution that Democrats have called retaliatory against a sitting member of Congress performing routine oversight duties. The case adds to a string of clashes between the Trump administration and Capitol Hill Democrats over access to and treatment of detainees at ICE facilities.","source":"Democracy Now!","url":"https://www.democracynow.org/2026/8/27/headlines"},{"headline":"Georgia Senate Race Roiled by Bigoted Photos From Ex-Collins Staffer","body":"Republican Rep. Mike Collins' challenge to Democratic Sen. Jon Ossoff hit a new snag after a former Collins staffer was found to have posted a swastika image and photos of himself in apparent KKK robes, forcing the campaign into damage control. The revelation lands as Ossoff, once considered one of the cycle's most endangered incumbents, has instead opened a steady polling lead and is drawing talk as a possible 2028 contender. The episode underscores how vetting failures on down-ballot staff are becoming a liability for the GOP in marquee midterm Senate races.","source":"The Washington Post","url":"https://www.washingtonpost.com/politics/"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Unveils 2026 Defense White Paper, Seeks Record Budget","body":"Japan's Cabinet approved its 2026 defense white paper on August 4, again labeling China an unprecedented strategic challenge while citing deepening China-Russia military coordination and North Korean missile activity. The document backs a push toward a record 8.9 trillion yen ($56.1 billion) defense budget request for next fiscal year and calls for deeper partnerships with tech firms and startups to prepare for AI- and drone-driven 'new ways of warfare.' The paper also states Tokyo aims to be able to take primary responsibility for repelling invasions by fiscal year 2027, backed by ally support.","source":"Defense News","url":"https://www.defensenews.com/global/asia-pacific/2026/08/10/japans-2026-defense-white-paper-highlights-new-era-of-crisis-in-indo-pacific/"},{"headline":"Seoul and Washington Pledge Coordination on Reviving North Korea Talks","body":"South Korea and the United States agreed to stay closely aligned on efforts to restart dialogue with Pyongyang, days after North Korea rebuffed President Trump's outreach and fired a barrage of short-range ballistic missiles. The diplomatic push comes amid friction after Kim Yo Jong accused President Lee Jae-myung of 'double-dealing' over scaled-back joint drills, prompting Seoul's presidential office to call on the North to halt 'unnecessary slander.' Seoul has also asked Beijing to help nudge Pyongyang back to the table, reflecting the peninsula's increasingly tangled four-way diplomacy.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-08-25/south-korea-vows-to-turn-trump-overtures-into-north-korea-talks"},{"headline":"Manila Presses ASEAN Code of Conduct Deadline Amid Stalled Consensus","body":"As 2026 ASEAN chair, the Philippines is racing to finalize a long-delayed South China Sea code of conduct by year's end, but its foreign ministers' meeting failed to produce language stronger than prior years' communiques despite Manila holding the pen. The push follows a volatile July in which Philippine and Chinese vessels clashed three times in one week near Scarborough and Second Thomas Shoals, prompting Manila to run joint naval and air drills with Japan and the United States in the contested waterway. Manila's foreign secretary has framed the talks as urgent given fears the sea lane could become 'another Strait of Hormuz' for global energy trade.","source":"Council on Foreign Relations","url":"https://www.cfr.org/global-conflict-tracker/conflict/territorial-disputes-south-china-sea"}],"pacingThreat":[{"headline":"Pentagon Assessment: PLA Pursuing AI-Guided Hypersonic Missiles","body":"A new Pentagon-linked assessment finds Chinese military researchers are working to fit hypersonic glide vehicles with AI-powered neural networks that could learn and dodge American interceptor flight paths and sensor signatures. The report flags existing systems like the DF-17 and the 4,000-mile-range DF-27, alongside newer YJ-15, YJ-17, YJ-19 and YJ-20 variants launchable from air, land, sea and submarines, while cautioning it remains unclear whether these AI-hardening efforts have been operationally integrated yet. The finding underscores a widening technological race over missile defense penetration between Washington and Beijing.","source":"The Washington Times","url":"https://www.washingtontimes.com/news/2026/aug/27/china-working-ai-powered-hypersonic-missiles/"},{"headline":"PLA Runs Drills Near Scarborough Shoal After Manila's UN Chart Filing","body":"China's Southern Theater Command conducted joint naval and air exercises around Scarborough Shoal (Huangyan Dao) after the Philippines formally deposited an official nautical chart of the reef with the United Nations, a move Beijing treats as provocative. The China Coast Guard simultaneously ran law-enforcement training in the same waters, and PLA forces separately tracked and issued warnings to three Philippine aircraft it said had entered the area's airspace without authorization. The episode illustrates Beijing's pattern of pairing legal pushback with military and coast guard shows of force whenever Manila takes formal jurisdictional steps.","source":"China Ministry of National Defense / GlobalSecurity.org","url":"https://www.globalsecurity.org/wmd/library/news/china/2026/08/china-260807-prc-mndb01.htm"},{"headline":"Beijing Recalibrates Pressure Tactics Around Taiwan","body":"Taiwan spent ten days this month running its largest-ever Han Kuang exercise, rehearsing scenarios including a blockade, infrastructure attacks and disrupted internet connectivity, with Beijing waiting until the drill's final day to dismiss it as a 'wasteful charade.' Open-source tracking shows PLA fighter jet sorties near Taiwan actually fell to a three-year low in the first half of 2026 even as coast guard patrols east of the island increased, suggesting Beijing is shifting from dramatic encirclement displays toward quieter, sustained gray-zone pressure. Analysts see this as an effort to normalize incremental control around Taiwan without triggering the kind of international backlash seen after 2022's large-scale drills.","source":"The Diplomat","url":"https://thediplomat.com/2026/08/chinas-own-version-of-ambiguity-in-the-taiwan-strait/"}]},"europe":{"ukraineRussia":[{"headline":"Kyiv Endures Rare Hours-Long Russian Aerial Barrage","body":"Russia launched an unusually prolonged drone-and-missile assault on Kyiv that stretched from the early hours into the evening of Aug. 27, filling the capital with explosions and air-defense fire for hours at a stretch. Ukraine's air force said it downed seven Iskander-M or North Korean-built KN-23 ballistic missiles, while a separate Russian drone strike on a Kharkiv shopping center killed one person and wounded four. The barrage damaged a sports complex and other sites across several Kyiv districts as part of a broader overnight wave of strikes hitting multiple Ukrainian regions.","source":"Kyiv Independent / United24 Media","url":"https://kyivindependent.com/"},{"headline":"Ukraine's Shadow War Inside Russia Widens","body":"A Russian lieutenant colonel was killed in a suspected car-bomb explosion in St. Petersburg on Aug. 27, the latest in a series of unexplained killings targeting Russian officers. Separately, the world's largest shipping company suspended new bookings to Russia's Black Sea port of Novorossiysk after a drone strike there, compounding fallout from what Ukrainian officials call their most extensive deep-strike campaign against Russian territory yet. The twin disruptions -- covert assassinations paired with strikes on logistics hubs -- underscore Kyiv's shift toward hitting Russian military and economic infrastructure far from the front line.","source":"United24 Media","url":"https://united24media.com/"}],"europe":[{"headline":"Pentagon Policy Chief Colby Huddles With NATO Council","body":"Elbridge Colby, the U.S. Under Secretary of War for Policy, met with NATO Secretary General Mark Rutte and the full North Atlantic Council at alliance headquarters on Aug. 27. The visit comes as unresolved friction over burden-sharing persists following this summer's Ankara summit, where allies pledged 70 billion euros in military aid for Ukraine for 2026 alone. Colby has been a central figure in the Pentagon's push for European allies to shoulder more conventional defense responsibility as Washington reorients resources toward the Indo-Pacific.","source":"NATO","url":"https://www.nato.int/en"},{"headline":"Ceuta Fallout Still Roiling EU Migration Politics","body":"Weeks after roughly 72,000 migrants crossed from Morocco into the Spanish enclave of Ceuta within a single 48-hour span, the political aftershocks continue to reshape European migration policy. Italy has suspended Schengen free-movement rules for travelers arriving from Spain, EU interior ministers have held emergency sessions, and researchers have identified Russia-linked social media accounts amplifying far-right narratives around the episode. The crisis has become an early stress test for the EU's new Migration and Asylum Pact, which only took effect in June 2026, exposing the bloc's continued struggle to manage sudden border surges without triggering internal rifts between member states.","source":"The Conversation","url":"https://theconversation.com/ceuta-crisis-anti-migrant-invasion-rhetoric-threatens-europes-food-supply-and-economy-290350"}]},"middleEast":[{"headline":"Israel Widens Diplomatic Rift With Europe Over Gaza","body":"Israel has moved to expel Dutch representatives from the U.S.-backed International Gaza Support Center in Kiryat Gat after the Netherlands moved to boycott products from Israeli settlements, Foreign Minister Gideon Sa'ar announced this week. Jerusalem is also weighing similar expulsions of British, German, and Italian officials over criticism of Prime Minister Benjamin Netanyahu's West Bank and Gaza policies. Any broader expulsion reportedly requires sign-off from the multinational Board of Peace overseeing Gaza's postwar governance, itself now a point of dispute among sources.","source":"Just Security","url":"https://www.justsecurity.org/155398/early-edition-august-27-2026/"},{"headline":"Qatar Pushes Tehran Toward Off-Ramp From Iran War","body":"Qatar's prime minister and foreign minister traveled to Tehran on Aug. 27 to meet Iranian Foreign Minister Abbas Araghchi, part of a widening regional push for an exit from the six-month-old Iran war. Iran has separately signaled it could accept limits on military shipping through the Strait of Hormuz under a potential arrangement being mediated by Oman. The diplomacy unfolds as the conflict, which began with joint U.S.-Israeli strikes on Feb. 28, continues to disrupt global shipping routes and complicate Washington's broader posture in the Indo-Pacific.","source":"Britannica / AP","url":"https://www.britannica.com/event/2026-Iran-war"},{"headline":"Munitions Drain in Middle East Fuels Indo-Pacific Anxiety","body":"Current and former U.S. officials tell the Washington Post that sustained American weapons expenditure supporting the Iran war is worrying Asian allies who fear the resulting readiness gap could embolden China's military pressure in the region. The warning coincides with former Mossad chief David Barnea publicly arguing Israel has no real alternative to continuing strikes on Iran until its regime collapses, signaling expectations in Jerusalem of an open-ended campaign. The overlap of a grinding Middle East war and rising Pacific tensions is intensifying debate in Washington over how to prioritize scarce munitions stockpiles.","source":"Just Security","url":"https://www.justsecurity.org/155398/early-edition-august-27-2026/"}],"techAI":{"aiCompetition":[{"headline":"OpenAI Touts First Results From In-House 'Jalapeño' Inference Chip","body":"OpenAI said on August 25 that its first custom-designed AI inference chip, internally called Jalapeño, is already showing industry-leading speed and efficiency for running models like ChatGPT and Codex. The move signals OpenAI's push to design its own silicon rather than rely solely on Nvidia GPUs, as inference costs balloon alongside surging usage of its agentic tools. It comes just weeks after Nvidia agreed to back up to $105 billion in financing for a new 4.25-gigawatt OpenAI data center in Ohio, underscoring how compute economics are reshaping the competitive map among frontier labs.","source":"OpenAI","url":"https://openai.com/news/"},{"headline":"China's Z.ai Ships GLM-5.3-Flash, Keeping Pace Despite Chip Curbs","body":"Chinese AI developer Z.ai released its GLM-5.3-Flash model on August 26, the latest in a fast cadence of efficient, lower-cost releases from Chinese labs even as US export controls continue to restrict access to top-tier Nvidia hardware. The launch adds to a pattern seen with DeepSeek and Alibaba's Qwen team, where rapid iteration on smaller, cheaper models is narrowing the practical gap with US frontier systems on many benchmarks. For Washington, the release reinforces concerns that chip restrictions alone are not preventing Chinese labs from remaining commercially competitive in the global AI race.","source":"AI Release Tracker","url":"https://aireleasetracker.com/latest"}],"cyberEmerging":[{"headline":"US Accuses Chinese Hackers of Breaching DOJ, NASA, Fed, and Senate Networks","body":"US officials disclosed on August 26 that Chinese state-linked hackers had infiltrated systems at the Justice Department, NASA, the Federal Reserve, and the US Senate, part of what Washington describes as a sustained espionage campaign against government networks. Beijing rejected the allegations, with its government saying the US uses cybersecurity issues to 'smear or discredit China'. The disclosure adds to a year of mounting accusations of Chinese intrusions into US government and critical-infrastructure systems, further straining an already tense bilateral cyber relationship.","source":"Cybernews","url":"https://cybernews.com/security/"},{"headline":"FBI Seizes China-Linked QScan and QTRouter Platforms Used to Mask Intrusions","body":"The FBI and Justice Department announced on August 26 the seizure of two China-linked platforms, QScan and QTRouter, which prosecutors say were used to conceal intrusions into US critical infrastructure networks. The takedown came the same day Washington separately accused Beijing-linked hackers of breaching the Justice Department, NASA, the Federal Reserve, and the Senate, together pointing to an escalating pattern of US law-enforcement action against Chinese cyber-espionage infrastructure this week. The dual actions highlight how critical-infrastructure protection and attribution of state-linked hacking have become front-line national security priorities.","source":"Security Affairs","url":"https://securityaffairs.com/"}]},"cities":{"lasVegas":[{"headline":"Extreme Heat Warning Grips Las Vegas Valley Through Friday","body":"The National Weather Service's Las Vegas office has an extreme heat warning in effect through Friday evening, with the Las Vegas Valley expected to hit 108 to 112 degrees and Death Valley climbing as high as 118. Overnight lows are barely dropping into the upper 80s and low 90s, offering little relief for residents without reliable air conditioning. Forecasters are urging locals to check on elderly neighbors and never leave children or pets in parked cars, since car interiors can reach lethal temperatures within minutes during this kind of prolonged desert heat wave.","source":"KESQ / NWS Las Vegas","url":"https://kesq.com/weather/alerts"}],"nellis":[]},"feelGood":[],"onThisDay":[{"year":"1883","event":"The catastrophic eruption of Krakatoa reached its climax, producing tsunamis and sound heard thousands of miles away."},{"year":"1928","event":"Fifteen nations signed the Kellogg-Briand Pact in Paris, renouncing war as an instrument of national policy."},{"year":"1939","event":"The Heinkel He 178, the world's first jet-powered aircraft, made its maiden flight in Germany."},{"year":"1991","event":"Moldova declared independence from the Soviet Union."}]},"topPicks":[{"headline":"Pentagon Iran War Casualty Toll Climbs to 775","teaser":"The human cost of the ongoing Iran conflict deepens as US military deaths continue mounting toward triple digits beyond initial estimates."},{"headline":"Meta Settles Landmark Teen Addiction Case for Up to $17 Billion","teaser":"One of the largest tech settlements ever signals sweeping accountability for social media's alleged role in youth mental health harms."},{"headline":"US Accuses Chinese Hackers of Breaching DOJ, NASA, Fed, and Senate Networks","teaser":"A sprawling cyber-espionage campaign hitting core US government institutions raises alarms over national security and data integrity const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
