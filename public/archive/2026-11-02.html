<script>
const STATE = {"digest":{"date":"Monday, November 2, 2026","generatedAt":"Mon, Nov 2, 11:28 AM PST","breaking":{"headline":"Iran Says Tankers Hit Mines in Hormuz as Khamenei Orders 'Unrestrained' Response","body":"Iran's Revolutionary Guard Corps navy reported that oil tankers, including a supertanker carrying more than two million barrels of crude, struck mines and caught fire in the Strait of Hormuz over the weekend after allegedly using an unauthorized route near the Omani coast. Iran's Supreme Leader ordered military commanders to meet any new attack with an immediate, unrestrained response, signaling Tehran could widen its target set beyond strictly military sites. The flare-up lands amid reports that Washington has quietly warned Gulf allies to brace for a fresh US strike on Iran as early as November 4, right after the midterm elections, reviving fears of a broader reignition of the war that began in late February.","source":"ABC News Australia","url":"https://abc.net.au/news/2026-10-31/four-tankers-strike-mines-in-strait-of-hormuz/107332392"},"tabs":{"defense":{"defense":[{"headline":"Pentagon's FORTRESS Plan Preps US Bases to Survive 90 Days Without Outside Support","body":"The Pentagon is advancing a new initiative called FORTRESS that would require every major US military installation in the continental United States to sustain operations for at least 90 days without relying on civilian electricity, water, fuel or communications networks. The plan envisions portable nuclear reactors, microgrids and strategic fuel and munitions reserves at bases, reflecting growing concern that a major war could knock out the civilian infrastructure the military depends on at home. It builds on an earlier push to reduce installations' dependence on commercial power grids.","source":"Fox News","url":"https://www.foxnews.com/politics/inside-pentagons-doomsday-plan-keep-america-fighting-global-war-erupts"},{"headline":"Marines Test New Counter-Drone System in Live-Fire Drills at Twentynine Palms","body":"Marine air-defense units at the Marine Corps Air Ground Combat Center in Twentynine Palms, California fired 30mm rounds from a Joint Light Tactical Vehicle mounted with the new Marine Air Defense Integrated System, with the Pentagon disclosing footage of the October 21 training on November 2. MADIS combines mobile sensors, a 30mm cannon, Stinger missiles and electronic-warfare tools to give Marine units layered options against drones and low-flying aircraft. The exercise underscores the urgency services are placing on fielding counter-drone capability as unmanned systems proliferate across modern battlefields.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/u-s-marines-build-combat-readiness-with-new-madis-counter-drone-weapon-system"},{"headline":"US, Japan, South Korea Reaffirm Taiwan Strait Stability on G20 Sidelines","body":"Taiwan's foreign ministry thanked Washington, Tokyo and Seoul after their top diplomats used a trilateral meeting on the margins of the G20 summit in Atlanta to stress the importance of peace and stability across the Taiwan Strait. The statement came as Taipei separately lodged a protest over China's handling of its invitation to the upcoming APEC summit in Shenzhen, where Beijing dropped Taiwan's official 'Chinese Taipei' designation. The friction shows how Taiwan is being drawn into the diplomatic run-up to the China-hosted APEC gathering later this month.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/front/archives/2026/11/02/2003866988"}],"acquisitions":[{"headline":"Hanwha Defense USA Wins $269 Million Navy Landing Ship Contract","body":"Hanwha Defense USA announced it signed a $269 million contract with Tote Services to build a medium landing ship for the US Navy, part of the service's effort to rebuild amphibious and sealift capacity. The award adds to Hanwha's expanding footprint in US shipbuilding as the South Korean firm separately moves to acquire a controlling stake in Hanwha Philly Shipyard. The deal reflects the Navy's growing reliance on allied shipbuilders to work through its construction backlog.","source":"FDD Overnight Brief","url":"https://www.fdd.org/overnight-brief/november-2-2026/"},{"headline":"Navy Awards $100 Million to Speed Submarine Overhauls Amid Boat Shortfall","body":"The Navy awarded FMD $100 million to help accelerate submarine maintenance availabilities, part of a broader push to close a persistent shortfall in ready attack boats. The move comes alongside separate pressure on shipbuilder HII to keep its new frigate program on schedule despite strain across the industrial base. Both steps reflect mounting urgency within the Navy to expand fleet readiness amid rising demands in the Indo-Pacific and other theaters.","source":"Inside Defense","url":"https://insidedefense.com/content/inside-navy-november-2-2026"}]},"us":[{"headline":"Midterm Forecasts Point to Divided Government as Nation Votes Tuesday","body":"With polls closing Tuesday evening, aggregated forecasts show Democrats favored to flip the House, projected at roughly 230 seats to 205 for Republicans on a generic-ballot edge near nine points, even after a mid-decade redistricting push added an estimated nine Republican-leaning seats across several states. The Senate picture is tighter, with analysts giving Democrats about a two-in-three chance of winning the 51 seats needed for a majority out of five genuine toss-up races, against a 53-45 Republican advantage in the current chamber. A GOP Senate hold remains plausible if Republicans sweep most of the contested seats.","source":"PollCheck 2026 Midterm Tracker","url":"https://www.pollcheck.co.uk/us-midterms-2026"},{"headline":"DOJ Suits and 'Martial Law' Chatter Shadow Election Eve","body":"Days before polls open, Justice Department attorneys have moved to challenge certification in at least one Senate race and threatened California election officials with potential jail time over ballot-handling disputes, while administration allies have floated an outcome-rejecting 'national security emergency' declaration if Democrats win either chamber. Pentagon officials have publicly stated they have no plans to station armed forces at polling sites, a move barred under federal law, even as the administration plans roughly 1,000 election monitors and FBI command posts nationwide. The friction has heightened uncertainty over how quickly and cleanly close races will be certified in the days following Tuesday's vote.","source":"TIME","url":"https://time.com/article/2026/10/28/Trump-voting-election-interference-ballots-DOJ-fraud-investigation/"},{"headline":"October Payrolls Beat Expectations, Complicating Fed Outlook Days Before Vote","body":"The Bureau of Labor Statistics reported 182,000 nonfarm payrolls added in October, well above the roughly 160,000 consensus forecast, with unemployment holding steady at 4.1 percent. Wage growth remained elevated enough to keep inflation pressure in focus for policymakers, a notable reversal from September's weak 29,000-job print that had fueled rate-cut speculation. The stronger-than-expected data lands just one day before the midterms and gives Federal Reserve Chair Kevin Warsh additional room to argue, as he did after the October 28 meeting holding rates at 3.75-4 percent, that growth has 'strengthened' even as the central bank keeps its focus on price stability.","source":"InflationTheGuide","url":"https://inflationtheguide.com/news/us-jobs-report-october-2026/"},{"headline":"Congress Heads Into Lame-Duck Fight With Funding Fuse Lit for Dec. 11","body":"Federal agencies remain funded under a stopgap signed September 2 that holds spending at current levels through December 11, meaning there is no shutdown risk on the calendar through Election Day. Lawmakers return to Washington on November 9 for a lame-duck session that must resolve a long list of unfinished appropriations work, with forecasters pegging the odds of a December funding lapse at roughly 27 percent given this Congress's unprecedented run of three separate shutdowns in fiscal 2026 alone. A partisan flip of either chamber on Tuesday would raise the odds of a prolonged standoff once the new Congress is seated in January.","source":"GovtSchemes.org","url":"https://govtschemes.org/government-shutdown-2026-update/"}],"pacific":{"pacificCommand":[{"headline":"Pyongyang Unveils New Cluster-Munition Warhead Amid Record Missile Tempo","body":"North Korea's Missile Administration tested a new cluster-munition warhead designed for tactical ballistic missiles, with state media reporting the payload can devastate roughly 130 hectares and vowing to field four warhead variants by year's end. The test was overseen by Central Military Commission member Kim Jong-sik and came as South Korea's Joint Chiefs said they tracked the launch activity in advance while maintaining a readiness posture. The timing coincided with German Chancellor Friedrich Merz's visit to Seoul, and followed renewed calls from South Korea, the US and Japan for North Korea's complete denuclearization during trilateral talks in Atlanta.","source":"The Korea Herald / ProtoThema","url":"https://www.koreaherald.com/article/10921603"},{"headline":"US-Led Minilateral Defense Grid in Philippines Shifts From Drills to Infrastructure","body":"Defense chiefs of Australia, Japan, the Philippines and the United States met in Cebu on October 28 and agreed to deepen policy consultations, joint infrastructure investment and shared operational concepts, moving the 'Squad' arrangement beyond episodic exercises. On the sidelines, US Defense Secretary Pete Hegseth held separate bilaterals with India's Rajnath Singh, Australia's Richard Marles, Japan's Shinjiro Koizumi and South Korea's Kang Shin-chul, with Washington also tapping Singapore to advance a broader ASEAN defense framework next year. Analysts note the talks also touched on potential spillover from the Middle East crisis into South China Sea tensions.","source":"Nikkei Asia / Anadolu Agency","url":"https://asia.nikkei.com/politics/international-relations/indo-pacific"},{"headline":"Takaichi, Lee Hold Shuttle Diplomacy on APEC Sidelines in Gyeongju","body":"Japanese Prime Minister Sanae Takaichi traveled to Gyeongju, South Korea, from October 30 to November 1 for the APEC summit, using the gathering to continue shuttle diplomacy with President Lee Jae Myung as Tokyo and Seoul work to stabilize ties strained by historical disputes. The visit follows Japan's push to diversify its security partnerships beyond the US alliance, with Tokyo's latest Defense White Paper emphasizing deeper ties with India, Australia and the Philippines alongside South Korea. The APEC sidelines also set up Takaichi's planned trips to the East Asia Summit in Manila later this month.","source":"Wikipedia / Japan Times reporting","url":"https://en.wikipedia.org/wiki/List_of_international_prime_ministerial_trips_made_by_Sanae_Takaichi"}],"pacingThreat":[{"headline":"Mass PLA Purge Guts Central Military Commission, Experts Say Invasion Timeline Slips","body":"Taiwanese analysts said the dismissal of 16 PLA generals and seven defense-industry managers from the Communist Party's Central Committee, confirmed around the fifth plenum, has left Xi Jinping and commissar Zhang Shengmin as effectively the only senior figures remaining in the military's top command. National Taiwan University's Chen Shih-min argued the purge will set back Xi's goal of having the PLA ready to invade Taiwan by the PLA's 100th anniversary next year, while National Defense University's Ma Chen-kun estimated the military will be consumed with internal reorganization for up to two years. The scale of the shakeup follows the earlier removal of former vice chairman Zhang Youxia, who had sat on the Central Military Commission.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/11/01/2003866956"},{"headline":"China Claims First Carrier-Capable Stealth Drone Launch From New Assault Ship","body":"Xinhua reported that China's GJ-21 stealth reconnaissance-strike drone completed its first takeoff and landing aboard the Sichuan, the lead ship of the new Type 076 amphibious assault class equipped with an electromagnetic catapult. State media and military commentator Song Zhongping touted the milestone as making the Type 076 the world's first catapult-capable drone carrier, a step that would let the PLA Navy project fixed-wing stealth strike power from large amphibious platforms rather than just traditional carriers. Independent outlets noted Beijing released no footage of the test, leaving the claim unverified by outside observers.","source":"Reuters via Yahoo News","url":"https://www.yahoo.com/news/world/articles/china-says-stealth-attack-drone-154925115.html"},{"headline":"Taiwan Logs Fresh PLA Incursions as 'Peak Season' for Drills Approaches","body":"Taiwan's Ministry of National Defense reported detecting 19 PLA aircraft sorties, 7 PLA Navy ships and 6 official vessels operating around the island in the 24 hours ending 6 a.m. on November 2, with four sorties crossing into Taiwan's southwestern and eastern air defense identification zones. The Armed Forces said it responded with combat air patrols, naval ships and coastal missile units. The activity comes as Taipei has been on heightened alert since mid-October for a possible large-scale encircling exercise during the PLA's traditional November-December drill season, a maneuver last seen at this scale in August 2022.","source":"Ministry of National Defense, Republic of China (Taiwan)","url":"https://www.mnd.gov.tw/en/news/plaact/88110"}]},"europe":{"ukraineRussia":[{"headline":"Russia Pummels Ukraine with Drones as Putin Bets on Winter Strike Campaign","body":"Russia launched 193 drones at Ukraine overnight into November 2, part of a pattern the Institute for the Study of War says reflects Moscow's shift toward a winter strike campaign against civilian and energy infrastructure after battlefield gains slowed. Kyiv's General Staff said Russian forces suffered their highest daily losses of the war on November 1, losing roughly one soldier every 35 seconds, while overall Russian combat losses since February 2022 are now estimated near 1.59 million troops. Ukraine has kept up its own long-range campaign, hitting Russian oil infrastructure including another fire at the Samara refinery hub.","source":"Kyiv Independent / RBC-Ukraine","url":"https://kyivindependent.com/"},{"headline":"Oleshky Humanitarian Ceasefire Collapses Amid Accusations of Russian Troop Buildup","body":"A local ceasefire in the Kherson region town of Oleshky that allowed nearly 800 civilians to evacuate has ended, with Ukraine's General Staff and Ombudsman accusing Russian forces of exploiting the pause to rotate soldiers, expand anti-drone netting over logistics routes and resupply ammunition rather than honor the humanitarian window. Sky News footage reportedly showed military movement through the same corridor used for evacuations. Kyiv officials say new humanitarian arrangements are being considered even as both sides trade blame over the breakdown.","source":"RBC-Ukraine / Kyiv Independent","url":"https://newsukraine.rbc.ua/war-in-ukraine"}],"europe":[{"headline":"Patriot Delivery Delays to Poland Expose Cracks in NATO's Air Defense Supply Chain","body":"A senior Polish commander has warned that scheduled U.S. Patriot air-defense deliveries to Poland will face delays, prompting Defense Minister Wladyslaw Kosiniak-Kamysz to tell foreign primes that future contracts will require manufacturing and maintenance facilities built inside Europe. Hours later, Norway's Kongsberg announced a 51 million dollar investment in a new counter-drone production plant in northern Poland, underscoring the shift toward localized European production. The dispute highlights strain on NATO's eastern flank as allies look to reduce reliance on U.S. Foreign Military Sales timelines.","source":"RealClearDefense","url":"https://www.realcleardefense.com/nato/links/patriot-delays-force-a-new-air-defense-doctrine-on-natos-eastern-flank-2026-11-02"},{"headline":"Poland's Constitutional Crisis Deepens as Tusk and Nawrocki Dig In","body":"Poland's decade-old judicial standoff exploded into open confrontation after Prime Minister Donald Tusk's allies suspended Constitutional Tribunal chief Bogdan Swieczkowski and his deputy, prompting President Karol Nawrocki to cut short a trip to Senegal and rush to the Tribunal building, which he called a forcible takeover. Tusk has urged Nawrocki to recognize eight judges elected by the Sejm, accusing the president of opting for forceful confrontation that could cost Poland dearly, while the European Commission said parliament's appointment power is constitutional. Riot police remain stationed around the Warsaw courthouse as protests continue and no resolution appears imminent.","source":"Euronews / CNN","url":"https://www.euronews.com/2026/11/02/donald-tusk-calls-on-polish-president-to-confirm-judges-as-constitutional-court-crisis-rum"}]},"middleEast":[{"headline":"Iran and US Edge Toward Deal via Qatari Mediators as Midterms Loom","body":"Iranian negotiators left a marathon session with Qatari mediators with a draft proposal circulating and a follow-up meeting possible, built around a seven-step Iranian plan from September to reopen the Strait of Hormuz. Foreign Minister Abbas Araghchi said talks with Washington remain very intensive even as he warned that any renewed military action would draw a response far harsher than before. Qatari mediators stayed in regular contact with the White House throughout the session, while reports indicate Trump could resume strikes the day after Tuesday's midterm elections if talks falter.","source":"Just Security / Gulf News","url":"https://www.justsecurity.org/162991/early-edition-november-2-2026/"},{"headline":"Houthi-Saudi Fighting Flares as Drones Target Dammam and Riyadh","body":"The Houthi movement said it launched drones toward Saudi Arabia's Dammam airport, while a Saudi-led coalition intercepted two separate drones aimed at Riyadh, signaling the Yemen conflict is escalating again alongside the broader Iran war. The exchanges come as a tanker was struck by projectiles near Oman and another near Saudi waters, with UK Maritime Trade Operations confirming crews were unharmed. Gulf officials, including the UAE energy minister, say the trajectory of the wider Iran war remains unpredictable even as markets price in detente hopes.","source":"Khaleej Times","url":"https://www.khaleejtimes.com/world/mena/us-israel-iran-saudi-arabia-yemen-war-live-updates-november-2-2026"},{"headline":"Israeli Strikes Kill Five in Gaza as West Bank Raids Displace Thousands","body":"Israeli airstrikes and gunfire killed five people across Gaza on Monday, with the military saying it targeted several terrorists in the territory. Separately, rights monitors reported that Israeli forces have displaced roughly 3,361 residents from the al-Jaladah and Ain Deir Bahha neighborhoods, detaining those attempting to return and installing military positions atop Palestinian shops in a central market area. In the occupied West Bank, a youth was shot in the neck with live fire in Nablus and a press crew was expelled at gunpoint, underscoring the volatility even as the broader Iran-linked war threatens to escalate further.","source":"Gulf News / VPP News","url":"https://gulfnews.com/world/americas/middle-east-conflict-trump-threatens-iran-with-military-action-as-tehran-warns-new-war-could-last-longer-1.500732180"}],"techAI":{"aiCompetition":[{"headline":"OpenAI Scales Back Mega Funding Round to $20 Billion","body":"OpenAI has reportedly cut the target for its latest funding round from $30 billion to roughly $20 billion, trimming the implied company valuation from $1.4 trillion to about $1.25 trillion after investor subscriptions closed last Friday, per a Financial Times report circulating Monday. The retreat suggests investors are growing more cautious about the capital intensity of frontier-model scaling even as rival Anthropic's own IPO filing last week disclosed roughly $80 billion in first-half losses against a $965 billion valuation. The adjustment could reshape how aggressively the leading US labs can bid for compute and talent heading into 2027.","source":"AI Weekly","url":"https://aiweekly.co/ai-news-today"},{"headline":"Seoul Nearly Doubles AI Spending in Record 2027 Budget Pitch","body":"President Lee Jae Myung unveiled a record 820.9 trillion won ($612.8 billion) budget proposal for 2027 that channels about 21.3 trillion won (roughly $16 billion) into three AI megaprojects covering semiconductors, physical AI and domestic data centers, nearly double the 10.8 trillion won allocated in 2026. Line items include 2 trillion won for chip-production infrastructure, 500 billion won for physical-AI demonstrations and 4.7 trillion won specifically earmarked to build Korea's own frontier models, underscoring Seoul's bid to avoid dependence on US and Chinese AI stacks. The move reflects an intensifying Indo-Pacific race among South Korea, Japan and China to build sovereign compute and model capacity.","source":"AI Weekly","url":"https://aiweekly.co/ai-news-today"}],"cyberEmerging":[{"headline":"Hacker Breaches DHS Login System, Exposes Data on 40,000+ Personnel","body":"A hacker compromised an Okta-based login system used by the Department of Homeland Security, stealing names, emails, phone numbers and business contacts for more than 40,000 agents, officers and staff across DHS components including CBP and ICE. The stolen dataset, dubbed 'Icepick,' was published by the transparency group DDoSecrets and reportedly reveals details of DHS's web-monitoring and phone-hacking tool access for employee user groups. The breach is the third major federal intrusion disclosed this year, following earlier hacks at the FBI and the Pentagon's HR department, intensifying scrutiny of federal cybersecurity practices.","source":"This Week in Security","url":"https://this.weekinsecurity.com/this-week-in-security-november-1-2026-edition/"},{"headline":"Taiwan Moves to Criminalize AI Chip Smuggling to China","body":"Taiwan's government is advancing legislation that would make unauthorized export of advanced AI chips and servers to China a criminal offense for the first time, closing a loophole exposed after Nvidia-powered servers purchased on the island reportedly reached Chinese buyers via Indonesia, Japan and Hong Kong. The measure, discussed at a legislative hearing Monday, would fulfill commitments under this year's US-Taiwan trade agreement and give prosecutors new tools against gray-market transshipment networks. No implementation date has been set, but officials say the shift marks a fundamental realignment of cross-strait technology policy as Washington pressures Taipei to tighten enforcement across the global chip supply chain.","source":"Asia Times","url":"https://asiatimes.com/2026/11/taiwan-to-criminalize-nvidia-ai-chip-smuggling-to-china/"}]},"cities":{"lasVegas":[{"headline":"One Dead, Two Wounded in North Las Vegas Shooting","body":"North Las Vegas police are investigating a fatal shooting that broke out just after midnight Monday near McDonald Avenue and Carey Avenue. Officers found three men with gunshot wounds; one died at University Medical Center, a second remains in critical condition, and the third is stable. Investigators have released no suspect information, and the Clark County Coroner's Office will formally identify the victim once next of kin are notified.","source":"News3LV / KSNV","url":"https://news3lv.com/news/instagram/homicide-investigation-north-las-vegas-police-nlvpd-crime-cops-southern-nevada-11-02-2026"},{"headline":"Viral Strip Altercation Puts Spotlight on Street Performer Rules","body":"A dispute involving a costumed street performer on the Las Vegas Strip went viral over the weekend, prompting city officials to remind tourists that tipping performers for photos is optional, not required. Veteran buskers described the aggressive tactics some performers use to pressure visitors for cash, reigniting debate over how Metro and the city enforce existing performer conduct and licensing rules on the tourist corridor. The episode is expected to fuel renewed calls for tighter oversight along the Strip.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/"},{"headline":"Ford and Lombardo Quietly Align on Clemency Despite Rivalry","body":"A review of seven years of Nevada Pardons Board records shows Attorney General Aaron Ford and Gov. Joe Lombardo have backed the same clemency outcomes far more often than their increasingly public political rivalry would suggest. The finding lands just before Tuesday's election, with Ford having launched a run to replace Lombardo as governor while Treasurer Zach Conine seeks to succeed Ford as attorney general. The pattern complicates the adversarial narrative that has defined the two officials' public clashes this year.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Air Force Details $1 Billion F-47 Test Campus at Nellis","body":"The Air Force has released a detailed plan for a $1.057 billion F-47 Future Campus on the eastern side of Nellis Air Force Base, confirming the base will host operational testing for Boeing's sixth-generation fighter. Plans call for a 1.15-million-square-foot aircraft apron with sunshades and new avionics reprogramming labs, with an initial contract award targeted for early February and construction running through 2031. The project builds on Nellis's existing F-15EX test mission and signals the base's growing role in next-generation airpower even as its historic A-10 Warthog fleet winds down operations there.","source":"Air Data News / Las Vegas Review-Journal","url":"https://www.airdatanews.com/us-air-force-plans-us-1-billion-nellis-complex-for-f-47-operational-testing/"}]},"feelGood":[{"headline":"Tanker Crew Rescues Army Veterans — and Their Cats — at Sea","body":"Seafarers aboard the Jones Act tanker Florida, operated by Intrepid, diverted course to rescue a group of Army veterans after their 41-foot vessel, the Welcome Home, began taking on water, leaving one passenger with a concussion. Union members including Bosun Samuel Duah and Chief Mate Zachary Jones organized an on-deck rescue plan under the captain's direction, bringing the veterans and their cats safely aboard. The union called the mission a reaffirmation of its 88-year bond with the U.S. military.","source":"Seafarers International Union","url":"https://www.seafarers.org/seafarerslogs/2026/11/jones-act-tanker-rescues-army-veterans-and-cats/"},{"headline":"High School Fills Football Field With Groceries for Food Banks","body":"Students and volunteers at a New Jersey high school turned their football field into a staging ground for a massive grocery drive, collecting donations to restock food banks ahead of the holiday season. The effort, highlighted this week in a national good-news roundup, reflects a broader grassroots push to meet rising demand at food pantries. Organizers framed the drive as proof that communities can mobilize quickly when neighbors are in need.","source":"Good News Network","url":"https://www.goodnewsnetwork.org/"},{"headline":"Teen's Quick Thinking Saves Man Wandering in Extreme Heat","body":"A teenager spotted an elderly man with dementia wandering alone in 103-degree heat and intervened in time to prevent serious harm, according to this week's good-news roundup. The quick-acting teen recognized the danger and got the man help before the heat could cause lasting injury. The case was cited alongside other everyday acts of courage as a reminder of the difference ordinary bystanders can make for vulnerable people.","source":"Global Positive News Network","url":"https://www.globalpositivenewsnetwork.com/good-news-this-week-november-1st/"}],"onThisDay":[{"year":"1917","event":"Britain issued the Balfour Declaration, expressing support for a Jewish homeland in Palestine."},{"year":"1920","event":"Warren G. Harding was elected US President as KDKA aired the first commercial radio broadcast reporting results."},{"year":"1936","event":"The BBC launched the world's first regular high-definition television service from Alexandra Palace in London."},{"year":"2000","event":"The first long-duration crew arrived aboard the International Space Station, beginning continuous human habitation."}]},"topPicks":[{"headline":"Iran Says Tankers Hit Mines in Hormuz as Khamenei Orders 'Unrestrained' Response","teaser":"A mined-tanker incident in the Strait of Hormuz risks escalating into a broader US-Iran confrontation with global oil stakes."},{"headline":"Midterm Forecasts Point to Divided Government as Nation Votes Tuesday","teaser":"Voters head to the polls amid forecasts of a split Congress that could reshape US policy and the president's final two years."},{"headline":"Mass PLA Purge Guts Central Military Commission, Experts Say Invasion Timeline Slips","teaser":"A sweeping purge of China's top military brass may delay any Taiwan invasion timeline, reshaping regional security calculus."}]},"navDates":[{"key":"2026-11-06","label":"Nov 6","href":"/","isNewest":true},{"key":"2026-11-05","label":"Nov 5","href":"/archive/2026-11-05.html","isNewest":false},{"key":"2026-11-04","label":"Nov 4","href":"/archive/2026-11-04.html","isNewest":false},{"key":"2026-11-03","label":"Nov 3","href":"/archive/2026-11-03.html","isNewest":false},{"key":"2026-11-02","label":"Nov 2","href":"/archive/2026-11-02.html","isNewest":false},{"key":"2026-11-01","label":"Nov 1","href":"/archive/2026-11-01.html","isNewest":false},{"key":"2026-10-31","label":"Oct 31","href":"/archive/2026-10-31.html","isNewest":false}],"currentKey":"2026-11-02","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-02.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
