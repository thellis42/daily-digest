<script>
const STATE = {"digest":{"date":"Monday, August 24, 2026","generatedAt":"Mon, Aug 24, 5:53 AM PDT","breaking":{"headline":"Treasury Set to Unveil Toughest Iran Sanctions Yet as War Enters New Economic Phase","body":"Treasury Secretary Scott Bessent is scheduled to hold a Monday afternoon press conference detailing a new round of sanctions against Iran, following weeks of warnings that Washington would deploy economic measures unlike anything seen before. Iran's Supreme National Security Council chief, Mohsen Rezaei, has responded by warning that any nation cooperating with the sanctions will be treated as taking part in an act of war, and has threatened to disrupt alternative oil-shipping routes near the Strait of Hormuz. The standoff marks a sharp escalation in the months-long US-Iran conflict, even as President Trump downplays domestic economic fallout and Iranian President Masoud Pezeshkian signals internal disagreement over whether Tehran can sustain indefinite war footing.","source":"CNN","url":"https://www.cnn.com/2026/08/23/world/live-news/iran-war-trump"},"tabs":{"defense":{"defense":[{"headline":"Navy Tells Evacuated Bahrain Families Not to Expect Quick Return","body":"Nearly six months after pulling about 1,300 military family members out of Bahrain amid regional tensions, the Navy is now telling them a return home is not imminent, according to Stars and Stripes reporting from August 21. The prolonged limbo highlights how the Iran conflict continues to strain Fifth Fleet's basing arrangements and is producing lasting disruption for service members' households well after the initial evacuation order.","source":"Stars and Stripes / SOF News","url":"https://sof.news/update/20260824/"},{"headline":"US Precision-Munitions Stockpiles Nearing Depletion After Iran War","body":"US officials confirm to NPR that stocks of several precision-guided missile types have fallen to worryingly low levels after months of sustained strikes during the Iran conflict. Defense analysts warn there is no fast way to rebuild these inventories given constrained production capacity, raising concerns about the military's readiness to respond to a second simultaneous crisis, such as in the Indo-Pacific.","source":"NPR","url":"https://www.npr.org/sections/national-security/"},{"headline":"EU Approves 6.1 Billion Euro Defense Package for Ukraine","body":"European Commission President Ursula von der Leyen announced approval of a 6.1 billion euro (about 7.1 billion dollar) defense procurement package for Ukraine, reaffirming allied commitment as Kyiv braces for what President Zelenskyy describes as a Russian push toward 500,000 mobilized troops by 2027. The announcement coincided with Ukraine's parliament confirming Yevhenii Khmara, a former special-operations and SBU commander, as the country's new defense minister, replacing Mykhailo Fedorov, who was dismissed in July.","source":"Just Security","url":"https://www.justsecurity.org/155017/early-edition-august-24-2026/"}],"acquisitions":[{"headline":"Pentagon Advances Low-Cost Containerized Missile Toward Fielding","body":"The US Department of War live-fired its Low-Cost Containerized Missile at White Sands Missile Range on August 19, pushing the program out of the acquisition phase and toward operational deployment. The containerized long-range strike system is designed to be cheap and rapidly deployable, addressing concerns about depleted precision-munitions inventories after months of Middle East combat operations.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026"},{"headline":"Missile Defense Agency Awards X-Bow Systems Interceptor Contract","body":"The US Missile Defense Agency awarded startup X-Bow Systems a 10.98 million dollar contract to design and flight-test a low-cost ballistic-missile interceptor. The award is part of a broader Pentagon effort to widen the interceptor industrial base beyond traditional prime contractors and accelerate production as demand for missile-defense systems climbs.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026"}]},"us":[{"headline":"Cook Political Report Flips Texas and Iowa Senate Races to Toss-Up","body":"The nonpartisan handicapper moved both open Senate contests from 'Lean Republican' to 'Toss Up' last week, and the shift was still dominating Sunday-show debate as of August 23. In Texas, Democrat James Talarico is running close with scandal-plagued GOP nominee Ken Paxton, while in Iowa Republican Ashley Hinson faces a tougher-than-expected race despite outperforming the retiring incumbent in early polling. Both states' governor races also moved toward Democrats, with Iowa now 'Lean Democrat' and Texas downgraded to 'Likely Republican,' underscoring a broader erosion in Trump's approval numbers heading into the midterms.","source":"Cook Political Report","url":"https://www.cookpolitical.com/analysis/senate/senate-overview/texas-and-iowa-senate-races-move-toss-races-governor-also-move"},{"headline":"Courts Clear Final Roadblocks, DHS Launches Mass TPS Deportations","body":"Federal judges in Washington and Massachusetts lifted the last remaining stays protecting Ethiopian and Somali nationals this past week, exhausting the legal challenges that followed the Supreme Court's June ruling upholding the administration's end of Temporary Protected Status. Immigration officials can now move against nationals from 13 countries, and ICE has already carried out its first deportation flight to Haiti, sending roughly 160 people to Cap-Haïtien on a plane rerouted from Port-au-Prince because of ongoing gang violence. The Haiti case alone affects an estimated 350,000 former TPS holders, with DHS leadership framing the crackdown as ending what one official called 'de facto amnesty.'","source":"The Hill","url":"https://thehill.com/homenews/administration/6044212-court-lifts-tps-deportation-stays/"},{"headline":"White House Rebuilds Tariff Wall Through Chip and Drone Levies","body":"Having lost its broad IEEPA tariff authority in court earlier this year, the administration is reconstructing similar protection through narrower Section 232 and Section 201 actions. This month it finalized a 15 percent tariff plus minimum import prices on polysilicon, the key input for semiconductors and solar panels, alongside new duties on unmanned aircraft systems and quartz surface products. Analysts estimate the polysilicon tariff alone will raise roughly $7.3 billion over a decade, while the overall tariff program is projected to cost the average household about $920 this year, with implications for both AI-chip supply chains and drone manufacturing central to defense procurement.","source":"Tax Foundation","url":"https://taxfoundation.org/research/all/federal/trump-tariffs-trade-war/"},{"headline":"AI Data Center Backlash Becomes a Midterm Flashpoint","body":"A bipartisan wave of local opposition to power- and water-hungry AI data centers is increasingly bleeding into competitive House and Senate races, according to recent reporting on the fall campaign environment. Candidates in both parties are fielding complaints about spiking electricity bills and strained water systems tied to the frontier-AI buildout, forcing incumbents to publicly distance themselves from hyperscale projects in their districts. The trend adds a new, geographically specific variable to an already volatile midterm map that now includes several traditionally safe Republican seats.","source":"The Hill","url":"https://thehill.com"}],"pacific":{"pacificCommand":[{"headline":"Japan's 2026 Defense White Paper Flags China's Pacific Expansion","body":"Tokyo's Cabinet approved the 2026 edition of 'Defense of Japan' on August 4, warning for the first time that Beijing is steadily projecting military power beyond the First Island Chain linking Japan's southwestern islands, Taiwan and the Philippines. The paper again calls China an unprecedented and the greatest strategic challenge to Japan's security, and Tokyo is requesting a record 8.9 trillion yen (about $56.1 billion) defense budget for next year as it works toward taking primary responsibility for repelling invasions by fiscal year 2027. The document also tallies Chinese military aircraft sorties near Taiwan surging from roughly 970 in 2021 to more than 3,700 last year.","source":"Defense News","url":"https://www.defensenews.com/global/asia-pacific/2026/08/10/japans-2026-defense-white-paper-highlights-new-era-of-crisis-in-indo-pacific/"},{"headline":"Manila's ASEAN Chairmanship Fails to Move South China Sea Consensus","body":"Despite holding the 2026 ASEAN chairmanship and drafting this year's communique, the Philippines could not get the bloc to reference the 2016 arbitral tribunal ruling against China's maritime claims, even in the ruling's tenth-anniversary year. Malaysia's foreign minister said on the sidelines of the ASEAN foreign ministers' meeting that a long-delayed Code of Conduct is now targeted for finalization at the 49th ASEAN Summit in November. The maritime dispute language in the joint communique stayed at just two paragraphs, overshadowed by expanded sections on the Middle East crisis.","source":"Asia Times","url":"https://asiatimes.com/2026/07/the-south-china-sea-consensus-no-asean-chair-can-move/"},{"headline":"Australia Elevates Domestic Missile Production as Deterrence Priority","body":"Canberra's 2026 Defence Industry Development Strategy designates guided-weapons and munitions manufacturing as one of seven sovereign defense-industrial priorities for the next two to five years, aiming to cut reliance on overseas supply chains during a potential prolonged Indo-Pacific contingency. Kongsberg's planned Naval Strike Missile and Joint Strike Missile factory in New South Wales is targeting full-rate production by 2028, alongside Lockheed Martin Australia's GMLRS line in South Australia. The strategy also leans on firms like Advanced Navigation to secure positioning and timing systems resistant to GPS jamming or spoofing.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/australia-makes-missile-production-a-2026-defense-priority-for-indo-pacific-deterrence"}],"pacingThreat":[{"headline":"PLA Southern Theater Command Warns Off Philippine Aircraft Near Scarborough Shoal","body":"China's Southern Theater Command said it tracked, monitored and issued verbal warnings to three Philippine aircraft it accused of illegally entering airspace over Scarborough Shoal, known in China as Huangyan Dao. Beijing's defense ministry separately reiterated it will keep conducting what it calls rights-protection and law-enforcement operations near Second Thomas Shoal, signaling no near-term de-escalation. The incident extends a pattern from July, when Chinese and Philippine forces clashed three times in a single week at the two disputed reefs, prompting joint U.S.-Philippines-Japan maritime drills.","source":"Global Times","url":"https://www.globaltimes.cn/china/military/"},{"headline":"PLA Air Force Expands Multi-Continent Joint Training Footprint","body":"Chinese air force units conducted simultaneous joint training this month with Belarus, Thailand and Egypt across three separate regions, including an intercontinental deployment of aircraft and personnel to an Egyptian air base for the 'Eagles of Civilization 2026' exercise. State-linked commentary framed the drills as proof the PLA Air Force is building strategic reach well beyond homeland defense. In parallel, the PLA Navy hospital ship Auspicious Ark is midway through Mission Harmony-2026, a medical deployment spanning Africa and South Asia that follows a 234-day voyage by a sister ship across the South Pacific and Latin America.","source":"Global Times","url":"https://www.globaltimes.cn/china/military/"},{"headline":"AI Agents Breach Taiwanese Government Network in Espionage Operation","body":"Researchers disclosed that eight AI-driven agents penetrated a Taiwanese government network and exfiltrated data with minimal human oversight, marking one of the most advanced AI-enabled cyber-espionage operations against Taipei documented so far. The breach fits a broader pattern tracked by the Institute for the Study of War's China-Taiwan update, which describes PLA pressure operations, maritime confrontations and cognitive-warfare campaigns running in parallel against the island. Taiwanese President William Lai Ching-te said this month that Beijing is also attempting to interfere with Taiwan's upcoming local elections.","source":"Center for Foreign Interference Research","url":"https://foreigninterference.org/post/china-taiwan-military-and-cognitive-warfare-update-august-18-2026"}]},"europe":{"ukraineRussia":[{"headline":"Zelensky Reveals US-Brokered Framework to End the War","body":"President Volodymyr Zelensky told reporters this weekend that Kyiv, Washington and European partners have quietly assembled a three-part framework for ending the war after talks with US envoys Steve Witkoff and Jared Kushner. The plan centers on an immediate ceasefire, a mutual troop pullback creating a buffer 'free economic zone' under an as-yet-undetermined third-party administrator, and unresolved questions about future EU and NATO security commitments to Ukraine. Washington now plans to present the same document to Moscow, though Zelensky cautioned that the toughest details, including who would administer the buffer zone, remain unsettled.","source":"Ukrinform","url":"https://www.ukrinform.net/rubric-polytics/4156835-zelensky-outlines-plan-to-end-war-ceasefire-troop-withdrawal-free-economic-zone.html"},{"headline":"Russia Hits Rear-Area Targets as Ukraine Expands Drone Partnerships","body":"Overnight strikes hit two hypermarkets and warehouses in Odesa and killed three people near Kharkiv, while Ukrainian drones set ablaze major Ozon logistics hubs in Russia's Dagestan and Krasnodar regions that Kyiv says were being used to funnel supplies to Iran and Azerbaijan. Ukraine's General Staff put Russian losses for the day at roughly 1,490 troops and 1,761 drones destroyed. Amid the exchanges, Kyiv signed a new drone-production agreement with Norway and Finland's President Alexander Stubb pledged to hand Ukraine 90 percent of output from a joint drone production line, part of an effort to secure the estimated $8-10 billion Kyiv says it needs to arm its forces through the winter.","source":"RBC-Ukraine","url":"https://newsukraine.rbc.ua/war-in-ukraine"}],"europe":[{"headline":"NATO Surges Baltic Air Patrols Amid Fears Russia Is Probing the Alliance","body":"A large US-led NATO air exercise over Poland and the Baltics, involving an estimated 25 to 50 aircraft including AWACS, refueling and electronic-warfare platforms, reflects an intensified alliance response to a string of drone incursions and airspace violations blamed on Russia in recent weeks. A US intelligence assessment cited by the Wall Street Journal warns that Vladimir Putin may be testing NATO defenses in preparation for a limited attack on a member state within the next few years. The warning follows a NATO jet shootdown of a stray drone over Latvia and a reported foiled Russian plot to kill a Ukrainian-American citizen in Poland.","source":"Stars and Stripes","url":"https://www.stripes.com/theaters/europe/2026-08-19/nato-aircraft-training-kaliningrad-russia-threat-22599202.html"},{"headline":"Mediterranean Migration Crisis Keeps Straining EU Unity","body":"Weeks after an estimated 60,000-70,000 migrants surged into Spain's Ceuta enclave within days, leaving at least 72 confirmed dead in the territory's largest-ever mass crossing, the political fallout continues to roil the bloc, with aid groups reporting today that migrant rescue vessels are facing rising threats and harassment at sea. The episode forced an emergency EU interior ministers meeting and has exposed sharp divisions among member states over asylum rules and reliance on Morocco for border enforcement, fueling gains for far-right parties across the continent.","source":"Arab News / Al Jazeera","url":"https://www.aljazeera.com/news/2026/8/2/why-has-the-eu-called-an-emergency-meeting-on-spain-migrants-surge"}]},"middleEast":[{"headline":"Israel, Syria Hold US-Mediated Talks to Ease Tensions","body":"Syrian state media confirmed that Israeli and Syrian officials met for US-brokered talks aimed at de-escalating tensions, coming less than a week after Israeli strikes hit targets inside Syrian territory. Washington has spent more than a year trying to broker a security arrangement between Israel and the government of Syrian President Ahmed al-Sharaa, a new US regional ally, but progress has stalled as Israeli forces continue operations on Syrian soil.","source":"Arab News","url":"https://www.arabnews.com/"},{"headline":"Hormuz Shipping Traffic Craters as Iran Standoff Bites","body":"Shipping data show fewer than 20 vessels transited the Strait of Hormuz over the weekend, underscoring how the standoff with Iran, including Tehran's threat to halt all oil exports in response to expanded US sanctions, is choking one of the world's most critical energy corridors. A separate seven-day tally recorded just 89 vessels exiting and 103 entering the strait, illustrating the scale of disruption months after the US-Israeli strikes on Iran began.","source":"Jerusalem Post / Arab News","url":"https://www.arabnews.com/"},{"headline":"IDF Strikes Hamas Militants in Gaza as Kite Attacks Prompt Warning","body":"Israel's military said it struck two Hamas operatives in Deir al-Balah overnight into Monday, including a member of the group's Nukhba force that took part in the October 7 attack. Separately, Israel warned Hamas it would intensify strikes in response to incendiary kite launches from Gaza, a sign that low-level fighting persists even as regional attention has shifted toward Iran sanctions and Syria-Israel diplomacy.","source":"Haaretz","url":"https://www.haaretz.com/israel-news/israel-security/2026-08-24/ty-article-live/police-arrest-two-on-suspicion-of-assaulting-elderly-w-bank-palestinian-amputee/000001a0-3188-dc1a-abac-f3fa2dfc0000"}],"techAI":{"aiCompetition":[{"headline":"US Still Leads on Benchmarks, But China Is Winning the AI Price War","body":"A fresh comparative data review released August 23 shows American frontier models retaining a lead in raw capability while Chinese labs increasingly undercut on cost, with the overall gap holding roughly steady thanks to US advantages in capital and chip supply. Nvidia is responding on both fronts at once, committing $6 billion to train its trillion-parameter Nemotron 4 model as a domestic counter to cheap Chinese open-weight releases. Meanwhile a mysterious new model called 'Ox Alpha' appeared on OpenRouter offering a million-token context window and enormous free daily usage, with speculation swirling over whether Zhipu, Microsoft, or another player is behind it, and OpenAI cut GPT-5.6 pricing by more than 20 percent for three months to counter the deflationary pressure.","source":"The Innermost Loop (Dr. Alex Wissner-Gross)","url":"https://theinnermostloop.substack.com/p/welcome-to-august-23-2026"},{"headline":"Washington Moves to Close Southeast Asia Loophole in Chip Export Regime","body":"US officials are scrambling to plug a gap that lets Chinese AI companies tap Nvidia's banned GB300 chips remotely through data centers in Southeast Asia rather than importing them directly. White House tech official Michael Kratsios recently accused Chinese startup Moonshot AI of using GB300 compute via a Thai facility within days of releasing a new model, underscoring how offshore rental arrangements are eroding the effectiveness of export controls. In a related shift, Nvidia's less-restricted H200 chips have reportedly begun flowing to Chinese giants ByteDance and Tencent, with each securing roughly 10,000 units in recent weeks under looser licensing terms.","source":"CNBC","url":"https://www.cnbc.com/2026/08/19/china-ai-nvidia-chips-us-export-controls.html"}],"cyberEmerging":[{"headline":"OpenAI Discloses It Halted Training Over Emerging Cyberweapon Risk","body":"OpenAI revealed it imposed a two-week pause on reinforcement-learning training for its newest models after internal evaluators flagged rising cyber-offensive capabilities, using the time to harden research environments and expand monitoring coverage. The company says its largest planned frontier training run remains on hold while it runs smaller-scale evaluations to build more confidence in its safeguards before resuming. The disclosure marks one of the clearest admissions yet by a top lab that model capability is now advancing faster than its internal safety validation processes.","source":"OpenAI","url":"https://openai.com/index/pacing-model-development-cyber-capabilities/"},{"headline":"New Advisory Warns China-Linked Hackers Remain Embedded in US Grid, Water and Telecom Networks","body":"A newly issued CISA cybersecurity advisory dated August 19 adds to a mounting body of warnings that Chinese state-sponsored actors, including groups tracked as Volt Typhoon and Salt Typhoon, continue burrowing into American communications, energy, and water infrastructure to prepare for possible disruptive strikes during a future crisis. Assessments describe the activity as strategic rather than opportunistic, relying on stolen credentials and legitimate administrative tools to maintain long-term, hard-to-detect footholds inside operational technology systems. The pattern has prompted renewed calls from lawmakers and allied governments for utilities to accelerate threat-hunting and network segmentation efforts.","source":"CISA","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-239a"}]},"cities":{"lasVegas":[{"headline":"Wildfire Emergency Declared Near Reno as Hawk Fire Explodes","body":"Gov. Joe Lombardo declared a state of emergency in Washoe County as the fast-moving Hawk Fire scorched more than 10,500 acres and triggered evacuation orders covering nearly 14,000 homes, with warning zones stretching to the edge of the University of Nevada, Reno campus. The state activated its Emergency Operations Center to back local firefighting and evacuation efforts as the blaze continued spreading rapidly. Lombardo urged residents to heed evacuation orders immediately rather than risk waiting out the fire.","source":"News 3 Las Vegas (KSNV)","url":"https://news3lv.com/news/local/nevada-gov-lombardo-declares-emergency-as-hawk-fire-spreads-in-washoe-county"},{"headline":"Nevada Regulators Accuse Kalshi of Illegal Betting Operations","body":"The Nevada Gaming Control Board alleged in a court filing in Carson City that state investigators were able to purchase multiple event contracts from prediction-market operator Kalshi while physically located in Nevada, despite state gaming law restricting such wagers. Kalshi has denied the allegations, setting up a fresh legal fight over whether federally regulated prediction markets can operate in a state that tightly controls sports and event betting. The clash adds Nevada to a growing list of states challenging Kalshi's rapid national expansion.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"State Investigators Probe Henderson Police Command Staff","body":"Henderson officials confirmed that Nevada state law enforcement is investigating the city police department's chief and deputy chief, with at least one of the two placed on administrative leave pending the outcome. The inquiry adds to turmoil inside the department, which is separately fending off a cease-and-desist demand from two police unions accusing City Councilmember Carrie Cox of misusing their insignia in campaign materials. Details of the underlying allegations against the command staff have not been made public.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/henderson/"}],"nellis":[{"headline":"Pentagon Leaders Visit Nellis to Spotlight Combat Fitness Standards","body":"Department of War leadership visited the 6th Combat Training Squadron at Nellis Air Force Base on Aug. 18, joining Airmen for a workout led by tactical athlete coach Eric Czachor to emphasize the strength and cardiovascular conditioning demanded of personnel preparing for combat environments. The visit underscores a broader Air Force push to tie physical readiness standards to real-world tactical performance for units training across the Nevada Test and Training Range. Nellis remains the hub for advanced combat exercises including Red Flag and Green Flag-West.","source":"DVIDS","url":"https://www.dvidshub.net/unit/NAFB"}]},"feelGood":[{"headline":"Nonprofit and Dozens of Vendors Rebuild Wounded Marine's Home Debt-Free","body":"The Frozen Chosen, a nonprofit founded by Luke Opp, completed a nearly two-and-a-half-year effort to make Marine veteran Warren Childs' home fully accessible after he was injured during a 2009 deployment to Afghanistan. More than 25 vendors donated labor and materials, turning a $57,000 fundraising campaign into over $580,000 in total renovations, including a new recovery room, widened doorways, and a rebuilt master suite, all at no cost to the Childs family. At the July 15 ribbon-cutting, Childs' wife Christine described the moment as surreal and said the family felt overwhelming gratitude.","source":"Daily Inter Lake","url":"https://dailyinterlake.com/news/2026/aug/05/local-nonprofit-the-frozen-chosen-rallies-communit/"},{"headline":"Friendship Sparks Outpouring of Free Home Repairs for Arizona Veteran","body":"A car sale between a Findlay Subaru Prescott employee and veteran Steve Urquidez blossomed into a full community rebuild of Urquidez's property, with every material, service and labor hour donated. Volunteers Gabe Maciel, Jacob Rodarte, Keegan Yount and Kara Hartman cleared debris in June, while Capstone Construction & Remodeling and Yavapai Roofing handled repairs in July, and Home Depot Prescott supplied all materials. Organizer Kara Hartman said the project became less about fixing a house and more about showing up for a friend in need.","source":"Signals AZ","url":"https://www.signalsaz.com/articles/community-rallies-to-help-prescott-valley-veteran/"},{"headline":"Motorcycle Club's Charity Ride Raises Over $16,000 for Veterans in Crisis","body":"The Armed Forces of America Motorcycle Club's Belle Fourche chapter raised more than $16,000 during its fourth annual Save the Vets fundraiser on Aug. 15, with proceeds benefiting the SGT Colton Levi Derr Foundation, which helps veterans navigate the return to civilian life. Contributors included the widow of a 26-year Air Force veteran who donated $1,000 in her late husband's honor. Local competitors in a cooking contest held alongside the ride even redirected their own cash prizes straight into the veterans' charity fund.","source":"Belle Fourche Beacon","url":"https://www.bellefourchebeacon.com/2026/08/save-the-vets-charity-event-raises-over-16000/"}],"onThisDay":[{"year":"79","event":"Mount Vesuvius erupted, burying the Roman cities of Pompeii and Herculaneum in ash."},{"year":"1814","event":"British forces set fire to Washington, D.C., burning the White House and Capitol during the War of 1812."},{"year":"1991","event":"Ukraine declared its independence from the Soviet Union."},{"year":"2006","event":"The International Astronomical Union voted to reclassify Pluto as a dwarf planet."}]},"topPicks":[{"headline":"Zelensky Reveals US-Brokered Framework to End the War","teaser":"A US-brokered peace framework could reshape the Russia-Ukraine conflict and global security alignments."},{"headline":"Treasury Set to Unveil Toughest Iran Sanctions Yet as War Enters New Economic Phase","teaser":"New sweeping sanctions signal an economic escalation in the Iran conflict with global market ripple effects."},{"headline":"NATO Surges Baltic Air Patrols Amid Fears Russia Is Probing the Alliance","teaser":"Heightened NATO air patrols reflect growing alarm over potential Russian testing of alliance defenses."}]},"navDates":[{"key":"2026-08-29","label":"Aug 29","href":"/","isNewest":true},{"key":"2026-08-28","label":"Aug 28","href":"/archive/2026-08-28.html","isNewest":false},{"key":"2026-08-27","label":"Aug 27","href":"/archive/2026-08-27.html","isNewest":false},{"key":"2026-08-26","label":"Aug 26","href":"/archive/2026-08-26.html","isNewest":false},{"key":"2026-08-24","label":"Aug 24","href":"/archive/2026-08-24.html","isNewest":false},{"key":"2026-08-23","label":"Aug 23","href":"/archive/2026-08-23.html","isNewest":false},{"key":"2026-08-22","label":"Aug 22","href":"/archive/2026-08-22.html","isNewest":false}],"currentKey":"2026-08-24","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-24.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
