<script>
const STATE = {"digest":{"date":"Friday, October 30, 2026","generatedAt":"Fri, Oct 30, 8:56 AM PDT","breaking":{"headline":"Taiwan Warns of 'Obvious' Threat as 50+ Chinese Warships Swarm Region, US Commander Reaffirms 2027 Invasion Risk","body":"Taiwan's National Security Council says more than 50 Chinese navy and coast guard vessels are now operating simultaneously across waters stretching from southern Japan through the Taiwan Strait to the Philippines, a deployment Defense Minister Wellington Koo called an 'obvious' threat to regional stability. The disclosure landed the same day U.S. Army Pacific commander Gen. Ronald Clark told a Hawaii defense conference that the so-called 'Davidson window,' the scenario in which China could have both the capability and intent to invade Taiwan by 2027, remains valid. The twin developments show military signaling intensifying even as Washington and Beijing prepare for Trump-Xi diplomacy at November's Shenzhen APEC summit, highlighting a widening gap between trade-track engagement and hard security posturing in the Indo-Pacific.","source":"Reuters via Daily Maverick / Taipei Times","url":"https://www.dailymaverick.co.za/article/2026-10-29-taiwan-flags-obvious-threat-from-50-chinese-vessels-in-wide-sweep-of-waters/"},"tabs":{"defense":{"defense":[{"headline":"Hegseth Fires Pentagon's Top War Planner Amid Iran Strike Deliberations","body":"Defense Secretary Pete Hegseth dismissed the Pentagon's top military planner this week, the latest in a string of senior officer removals under his tenure. The firing comes as President Trump weighs renewed strikes on Iran roughly eight months into the ongoing conflict, raising fresh questions on Capitol Hill about continuity in Pentagon planning during an active war footing. The Defense Department separately told Congress the Iran campaign has already cost $47.1 billion.","source":"PBS NewsHour / FDD","url":"https://www.pbs.org/newshour/show/october-29-2026-pbs-news-hour-full-episode"},{"headline":"Marine Drone Unit Operating From Philippine Airfield Near Spratly Flashpoints","body":"A U.S. Marine Corps drone detachment has begun operating from an airfield on Palawan, positioning unmanned systems within range of the contested Spratly Islands in the South China Sea. The forward deployment comes as Manila's standoff with Beijing over South China Sea claims sharpens and as Chinese naval activity surges across the wider region. It reflects a broader U.S. effort to distribute strike and ISR-capable assets closer to potential Indo-Pacific flashpoints.","source":"USNI News via FDD Overnight Brief","url":"https://www.fdd.org/overnight-brief/october-29-2026/"},{"headline":"USS Colorado Named First AUKUS Submarine for Australia Rotation","body":"The United States, United Kingdom and Australia have jointly designated the Virginia-class attack submarine USS Colorado as the first boat assigned to Submarine Rotational Force-West, a standing presence set to host up to four U.S. submarines and one British boat at HMAS Stirling in Western Australia from late 2027. Colorado arrived October 26-27 for a month-long maintenance period during which more than 30 Australian civilian technicians will work on a Virginia-class submarine for the first time. Officials called the milestone a shift from episodic port visits toward a persistent allied undersea presence meant to strengthen deterrence in the Pacific.","source":"Stars and Stripes / Navy Lookout","url":"https://www.stripes.com/branches/navy/2026-10-28/uss-colorado-submarine-australia-aukus-23285205.html"}],"acquisitions":[{"headline":"Lockheed Martin Wins $694 Million Deal to Produce US Hypersonic Missile","body":"Lockheed Martin has been awarded a $694 million contract to expand production of a U.S. military hypersonic missile system, according to an October 29 announcement. The award adds to a string of recent hypersonic procurement moves as the Pentagon races to field faster strike capability against advanced adversary air defenses. Details on delivery timelines were not fully disclosed.","source":"The Defense Post","url":"https://thedefensepost.com/"},{"headline":"Army Awards Lockheed OTA for Next-Gen 'Future Interceptor' Missile Defense Program","body":"The Army has initiated its Future Interceptor effort, awarding Lockheed Martin an Other Transaction Agreement to begin development of what the service describes as a next-generation capability meant to strengthen the integrated air and missile defense portfolio against advanced air and missile threats. The announcement, made October 29, is part of a broader Pentagon push to speed up missile-defense modernization using flexible acquisition authorities rather than traditional procurement contracts.","source":"InsideDefense.com","url":"https://insidedefense.com/"}]},"us":[{"headline":"Fed Holds Rates Steady in Contentious Split Vote Days Before Midterms","body":"The Federal Reserve kept its benchmark rate in the 3.75%-4% range on Wednesday, with the Federal Open Market Committee approving the hold by a 10-2 vote rather than unanimously. New Chair Kevin Warsh insisted politics played no role in the timing just days ahead of the midterms, while Governor Lisa Cook was among the dissenters pushing for a hike instead. Markets closed higher on the news even as traders now price in roughly an 85% chance of a rate increase in December given still-elevated inflation.","source":"CNN / Yahoo Finance","url":"https://www.cnn.com/2026/10/28/business/live-news/federal-reserve-interest-rate-october"},{"headline":"Q3 GDP Growth Surges to 3.4%, Handing Trump a Pre-Election Boost","body":"The Commerce Department's advance estimate released Thursday showed the economy expanding at a 3.4% annualized rate in the third quarter, up sharply from 2.2% in Q2 and beating the roughly 3.1-3.2% consensus forecast. Consumer spending rose 3.8%, matching the prior quarter's pace, while underlying demand (final sales to private domestic purchasers) hit its strongest rate in five years at 4.9%. The blockbuster report lands just days before the midterms, giving Republicans a talking point even as price pressures and affordability remain politically sensitive.","source":"Axios","url":"https://www.axios.com/2026/10/29/dp-q3-economy-energy"},{"headline":"Final Midterm Sprint: Trump Reinstates Canceled Rallies as Races Tighten","body":"With five days until the November 3 midterms, Trump reversed course and reinstated weekend campaign stops in Kansas and Iowa after initially canceling them, while also launching a tele-rally blitz spanning nearly 20 states. He campaigned in Rock Hill, South Carolina for Senator Darline Graham, whose race against Democrat Annie Andrews has tightened, while Obama rallied Democrats in Georgia and JD Vance stumped for Ken Paxton in Texas against James Talarico. Separately, the Justice Department's criminal probe into Alaska Senate candidate Dan Sullivan has accelerated amid fresh campaign revelations, with state election officials pushing back against DOJ involvement in that race.","source":"ABC News / CNN","url":"https://abcnews.com/Politics/live-updates/midterm-elections-2026-1-week-high-stakes-elections/?id=137578278"},{"headline":"Supreme Court Weighs Border Wall Injunction and Religious Discrimination Case","body":"The Supreme Court on Thursday fielded a request from advocacy groups to keep a lower court's order blocking border wall construction in southwestern Texas in place, a case tied to ongoing disputes over executive authority on immigration infrastructure. The justices also agreed to hear a religious discrimination challenge brought by Catholic preschools in Colorado as the new term's November argument session opens Monday. The docket activity comes as the Court continues weighing several high-profile interim applications tied to the administration's policies heading into the 2026-27 term.","source":"SCOTUSblog","url":"https://www.scotusblog.com/"}],"pacific":{"pacificCommand":[{"headline":"North Korea Fires Dozen Ballistic Missiles in 17th Test of 2026","body":"North Korea launched roughly ten to twelve short-range ballistic missiles from the Wonsan area toward the East Sea on Thursday afternoon, with the projectiles traveling about 250 kilometers before splashing down. South Korea's Joint Chiefs of Staff said it was Pyongyang's 17th ballistic missile test of the year and came just 17 days after its last salvo. Seoul, Washington and Tokyo activated a trilateral information-sharing channel afterward, with the launch arriving amid an unresolved border dispute after a joint Seoul-UN probe found North Korea had planted landmines across the DMZ.","source":"Stars and Stripes / SBS News","url":"https://www.stripes.com/theaters/asia_pacific/2026-10-29/north-korea-missile-launch-23295815.html"},{"headline":"Japan to Transfer Warship to Philippines as 'Squad' Deepens Ties in Cebu","body":"On the sidelines of the ASEAN Defense Ministers' Meeting-Plus in Cebu, Japan's Defense Minister Shinjiro Koizumi and Philippine counterpart Gilberto Teodoro confirmed Tokyo will transfer a decommissioned Abukuma-class destroyer to the Philippine Navy, expanding cooperation on vessel operations, logistics and information sharing. Separately, the informal 'Squad' of the US, Japan, Australia and the Philippines-represented by Pete Hegseth, Koizumi, Richard Marles and Teodoro-agreed to coordinate military operations and explore joint infrastructure investment inside the Philippines. Australia's Marles also flagged that hundreds of US personnel will join next year's Australia-Philippines Exercise Alon, after Japan participated only as an observer in the last iteration.","source":"BusinessMirror / NTD","url":"https://businessmirror.com.ph/2026/10/29/us-japan-boost-philippine-military/"},{"headline":"India Deepens Pacific Defense Ties via Quad Talks and Korea Naval Drill","body":"Indian Defense Minister Rajnath Singh used the Cebu gathering to hold a trilateral 'JAI' meeting with Japanese counterpart Shinjiro Koizumi and Australia's Richard Marles, while separately meeting US Secretary of War Pete Hegseth to review operational coordination and defense-industrial cooperation. In parallel, the Indian Navy frigate INS Sahyadri arrived at Busan on October 26 for the India-Republic of Korea bilateral naval exercise, and Japan Ground Self-Defense Force Chief of Staff Gen. Arai Masayoshi confirmed Japanese personnel traveled to India on October 27 to scope out new joint-training arrangements. Australia's Marles said Canberra is also expanding defense-industry cooperation with India, calling it 'a really vital partner.'","source":"The Tribune / SSBCrackExams","url":"https://www.tribuneindia.com/news/world/jai-japan-australia-india-rajnath-singh-highlights-close-ties-with-pacific-partners-holds-meeting-with-his-australian-japanese-counterparts"}],"pacingThreat":[{"headline":"Beijing Accuses Manila of Blocking China at ASEAN Defense Summit","body":"As the 13th ASEAN Defense Ministers' Meeting-Plus wrapped up in Cebu on October 29, China's delegation accused an unnamed Philippine politician of obstructing Beijing's participation in the gathering, which brought together ASEAN states alongside China, the US, Japan, Australia, India, South Korea, New Zealand and Russia. The friction came as Australian Defense Minister Richard Marles told reporters at the same venue that China's military build-up was generating sustained 'pressure' across Southeast Asia, urging allies to deepen coordination in response.","source":"NTD","url":"https://www.ntd.com/us-japan-australia-and-philippines-agree-to-expand-defense-cooperation-at-asean-meeting_1182261.html"},{"headline":"Chinese Warships Push Through Osumi Strait Toward Open Pacific","body":"Japan's Defense Ministry reported tracking three PLA Navy warships and a China Coast Guard vessel transiting the Osumi Strait off Kyushu on October 28 before heading into open Pacific waters, part of a broader pattern of PLA surface activity stretching from southern Japan past Taiwan toward the Philippines. The movement coincided with China's Defense Ministry describing ongoing carrier Liaoning operations as 'routine training... not directed at any specific country,' even as Taiwan's defense minister Wellington Koo separately warned that a continued northward push by Chinese forces would signal intensified pressure on Japan's defense posture.","source":"Honolulu Star-Advertiser","url":"https://www.staradvertiser.com/2026/10/29/breaking-news/taiwan-flags-obvious-threat-from-over-50-chinese-ships/"},{"headline":"Taiwan Grounds Entire Apache Attack Helicopter Fleet Over Gearbox Risk","body":"Taiwan's Defense Minister Wellington Koo announced Thursday that all AH-64E Apache attack helicopters have been grounded for inspection following a US technical notice about potential gearbox failures, with AH-1W Cobras and OH-58D scout helicopters temporarily filling readiness gaps. The alert echoes a May report citing an internal US Army safety document warning the Apache's transmission could suffer internal failures leading to loss of tail-rotor thrust and hydraulics. Taiwan received all 30 of its Apaches from the US by 2014, and Koo did not specify how long the grounding will last.","source":"Focus Taiwan","url":"https://focustaiwan.tw/politics/202610290006"}]},"europe":{"ukraineRussia":[{"headline":"Russian Strike on Dnipro Train Station Kills 14 as Nationwide Barrage Leaves 19 Dead","body":"Russian forces struck a train station in Dnipro on October 29, killing 14 people, while additional strikes across the country killed five more the same day. President Zelensky said combined attacks on Dnipro, Kremenchuk, and Chernihiv killed 19 people total, part of a strike package that included a Kh-31P anti-radiation missile, several Kh-59/69 cruise missiles, and 140 drones. Kyiv answered with a retaliatory barrage of more than 600 drones aimed at Moscow, though Russian air defenses intercepted most of them.","source":"Council on Foreign Relations / Kyiv Post","url":"https://www.cfr.org/global-conflict-tracker/conflict/conflict-ukraine"},{"headline":"Russia Posts Record Monthly Combat Losses as Ukraine's Strikes Hit Military and Economic Targets","body":"Ukraine's General Staff reported that Russia suffered 49,040 personnel losses in combat during October, the highest monthly toll since the 2022 invasion began. Ukraine's navy said Neptune missiles destroyed two Russian Su-34 fighter-bombers at the Marinovka airfield in Russia's Volgograd region this week. Separately, repeated Ukrainian strikes on Yandex data centers have forced Russia's largest tech company to abandon its 2026 revenue forecasts, a sign the long-range campaign is squeezing Russia's wartime economy.","source":"Ukrinform / Critical Threats (ISW)","url":"https://www.ukrinform.net/rubric-ato"}],"europe":[{"headline":"Allies Fear Washington Will Sit on Patriot Interceptors Until After US Midterms","body":"NATO officials are increasingly worried the Trump administration will delay releasing additional Patriot interceptors to Ukraine until after next week's US midterm elections, leaving Kyiv's air defenses strained heading into winter. One NATO source called the timeline for delivery entirely unpredictable, and a promised deal letting Ukraine license-produce Patriots domestically, unveiled at July's Ankara summit, has also stalled. Secretary-General Mark Rutte has urged allies like Greece and Spain, which hold surplus PAC-2 stockpiles, to ship their own systems to Ukraine directly in the meantime.","source":"Euronews","url":"https://www.euronews.com/2026/10/29/nato-allies-fear-trump-will-delay-patriot-missiles-for-ukraine-until-after-us-midterms"},{"headline":"European Gas Prices Breach €100 as Brussels Warns of 'Another Energy Crisis'","body":"Europe's benchmark gas price broke above €100 per megawatt-hour this week for the first time since the 2022 crisis, prompting EU Energy Commissioner Dan Jorgensen to warn the bloc faces another difficult energy crunch this winter. EU-wide gas storage sits at roughly 74.6 to 75 percent full, short of the informal 90-percent target for November 1, with the disruption adding an estimated 18 to 33 billion euros to Europe's import bill. Jorgensen noted that over 50 million Europeans already struggle to heat their homes, even though overall gas demand remains about 20 percent below pre-2022 levels.","source":"Euronews","url":"https://www.euronews.com/2026/10/28/european-gas-price-crosses-100-for-first-time-since-2022-as-eu-warns-of-new-crisis"}]},"middleEast":[{"headline":"Israeli Election Ends Without a Majority, Setting Up Coalition Scramble","body":"Israel's national election vote count concluded October 29 with no bloc winning an outright majority, leaving Prime Minister Benjamin Netanyahu short of the seats needed to form a government alone. Netanyahu responded by attacking Arab-Israeli parties, while Jewish-led blocs rejected relying on Palestinian-Israeli support to govern, drawing accusations of incitement from the Arab-led Joint List. Opposition figures Naftali Bennett and Gadi Eisenkot are now discussing how to form a rival coalition quickly, pointing to weeks of political uncertainty in Jerusalem.","source":"Al Jazeera","url":"https://www.aljazeera.com/middle-east/"},{"headline":"US Tells Gulf Partners to Prepare for Possible Renewed Strikes on Iran After Midterms","body":"US officials have privately told Middle East partners to prepare for potential renewed military action against Iran after the November 3 midterm elections, though no final decision has been made, according to two diplomats briefed on the discussions. Regional officials expect any new campaign to last several days and anticipate Iranian retaliation, prompting Washington to urge allies to harden energy facilities and infrastructure. Qatari mediators have floated a new seven-day draft deal to end the broader war, but Iran's parliament speaker insists talks cannot advance without acceptance of Tehran's own conditions.","source":"Associated Press / FDD","url":"https://www.fdd.org/overnight-brief/october-29-2026/"},{"headline":"Gaza Food Crisis Deepens as Aid Funding Collapses by Half","body":"The World Food Programme says food insecurity in Gaza is worsening sharply after donor funding for its Gaza and West Bank operations fell by more than half in 2026 compared with previous years. The funding collapse has forced major cuts to distributions even as Israeli strikes continue, including one on October 29 that reportedly killed two people in a vehicle in central Gaza with no comment yet from the IDF. UN rapporteurs separately warned that ongoing Israeli military operations in the occupied West Bank are cutting off Palestinians' access to jobs and basic livelihoods.","source":"The Times of Israel","url":"https://www.timesofisrael.com/liveblog-october-29-2026"}],"techAI":{"aiCompetition":[{"headline":"Hyperscaler AI Capex Hits New Highs as Alphabet, Amazon, Intel Report Earnings","body":"Alphabet disclosed that its third-quarter capital expenditures surged to roughly $51 billion, up 114 percent year-over-year, as it reaffirmed an aggressive full-year 2026 spending plan for AI infrastructure. Amazon and Intel followed on October 29-30 with their own earnings confirming continued multibillion-dollar data-center buildouts, with AWS alone pacing toward roughly $200 billion in 2026 capex, pushing combined hyperscaler AI spending this year toward an estimated $690 billion. The numbers underscore how deeply the major cloud providers remain committed to compute buildouts even as investors start questioning near-term returns on the spending.","source":"Au79 Macro Research / Bloomberg","url":"https://martyau79.substack.com/p/30oct2026-frontier-tech-convergence"},{"headline":"Wall Street Banks Structure $63 Billion Financing Deal Tied to Anthropic's Chip Leases","body":"Blackstone, Bank of America, Citigroup and Morgan Stanley unveiled a $63 billion financing structure on October 26 built around Anthropic's AI hardware commitments, as the lab's newly filed S-1 revealed five-year master equipment leases with Broadcom carrying roughly $161.2 billion in non-cancelable rent obligations. Analysts flagged that Broadcom effectively guarantees the future value of its own chips within the deal, raising concerns about circular financing risk spreading beyond the tech sector given Blackstone's $550 billion credit platform, which includes $290 billion in insurance assets under management. The arrangement illustrates how deeply intertwined Wall Street balance sheets have become with frontier AI infrastructure bets.","source":"24/7 Wall St.","url":"https://247wallst.com/investing/2026/10/29/wall-streets-new-63-billion-ai-deal-reveals-a-risk-that-could-spread-beyond-tech/"}],"cyberEmerging":[{"headline":"Unreleased Anthropic Model Reportedly Chains Flaws Into Working Browser and OS Exploits","body":"Security researchers reported this week that an unreleased Anthropic AI model was able to autonomously chain together vulnerabilities into working exploits targeting Chrome, Safari, Windows and Linux, a capability disclosed as part of broader AI-security reporting on October 29. The finding follows an earlier wave of AI-discovered PHP vulnerabilities in late October that forced emergency patches and site shutdowns worldwide, intensifying debate over how quickly frontier models are closing the gap between vulnerability discovery and exploit generation. The disclosure adds urgency to calls from governments and labs for stronger pre-release testing of models with offensive cyber capabilities.","source":"The Hacker News / The Neuron","url":"https://www.theneuron.ai/digest/everything-that-happened-in-ai-today-thursday-october-29-2026/"},{"headline":"Beijing's Draft AI Export Licensing Regime Moves Forward, Raising Stakes in Tech Rivalry","body":"Analysis published October 29 detailed how China's Ministry of Commerce and Ministry of Science and Technology are advancing draft rules, first released October 16, that would place large language models, AI agents, chip designs and computing-cluster technology exceeding certain thresholds under a formal export-licensing wall. The draft covers 23 AI-related items within a broader 40-technology catalogue, with some items facing outright export bans and others facing restrictions, and a public comment period running through November 15. Legal observers note the move mirrors Washington's own chip-control regime but flips the direction of control, restricting what Chinese AI capability can leave the country rather than what foreign hardware can enter it.","source":"Quest Review Center","url":"https://questreviewcenter.com/tech-news/china-moves-to-put-frontier-ai-exports-behind-a-licence-wall/"}]},"cities":{"lasVegas":[{"headline":"Teen shooter wounds two near downtown transit center","body":"A teenager opened fire at the downtown Las Vegas transit center on Wednesday, wounding a man and a security officer before a second security guard shot and stopped him. Police are charging the teen as an adult, and the incident has reignited concerns about security at the transit hub. The wounded victims' conditions have not been fully disclosed by Metro.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Grand jury indicts suspect in deadly Five Below shooting","body":"A Clark County grand jury has indicted David Vasquez on charges tied to a fatal shooting inside a Five Below store at a northwest Las Vegas shopping center. The case, formally advanced this week, moves toward trial as prosecutors build out the evidence from the deadly incident. It is one of several violent-crime cases winding through Clark County courts this fall.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"},{"headline":"Las Vegas home construction market keeps slowing","body":"New data show Las Vegas' home construction pipeline continuing to cool, with builders pulling back amid affordability pressures and higher financing costs. The slowdown comes even as master-planned communities like Aries, built on the former Three Kids Mine site in Henderson, continue phased development. A separate housing report gave Nevada a C-minus grade on affordability, ranking the state 34th nationally.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Air Force plans $1 billion F-47 test campus at Nellis","body":"The Air Force is moving forward on a roughly $1.057 billion 'F-47 Future Campus' at Nellis Air Force Base to support operational testing of Boeing's sixth-generation F-47 fighter, with an initial contractor award targeted for February 2027 and main construction wrapping by early 2031. The complex would include a nearly 117,000-square-foot hangar and maintenance building, a systems-reprogramming lab, and a roughly 41,000-square-foot simulator facility on the base's east side. Nellis already hosts the Air Force Weapons School, Red Flag exercises and the 422nd Test and Evaluation Squadron, and sits adjacent to the Nevada Test and Training Range, making it the natural hub for integrating the new jet, which is slated to begin replacing the F-22 in the 2030s with a planned fleet of at least 185 aircraft.","source":"Air & Space Forces Magazine","url":"https://www.airandspaceforces.com/air-force-billion-dollar-campus-testing-f-47-nellis/"}]},"feelGood":[{"headline":"Young Coast Guard swimmer saves 16 from storm-tossed Pacific","body":"Josh Law, a 24-year-old Coast Guard rescue swimmer, was lowered from a helicopter into pitch-black, 6-to-8-foot Pacific swells off Ventura, California, to pull 16 people to safety during an overnight rescue. Working for two hours through exhaustion and near-zero visibility, Law said he kept focused on the fact that the people in the water were suffering far worse than he was. His first public account of the mission, given this week, highlights the split-second training that let him keep pulling survivors aboard despite the battering waves.","source":"Military.com / AP","url":"https://www.military.com/24-year-old-coast-guard-swimmer-says-he-fought-waves-and-darkness-to-rescue-16-people-from-ocean"},{"headline":"Rhode Island contractor clears a grieving widower's home for free","body":"Henry Milder, a 22-year-old owner of a Rhode Island home-improvement business, organized a free whole-house cleanout for 62-year-old widower David Garasole, who had been struggling to manage his Wakefield home along with his pet parrot, Roxy. Milder brought in his own crew at no charge and rallied neighbors and local volunteers to pitch in further, turning an overwhelming situation into a fresh start for Garasole. The effort, which unfolded this week, has drawn attention as a model of grassroots neighborly generosity.","source":"WJAR / Gray Media","url":"https://www.keyc.com/2026/10/29/business-owner-strangers-clean-out-struggling-widowers-home-free-i-wanted-help/"},{"headline":"Florida Guardsmen pull family from sinking truck during storm response","body":"Eight Florida Army National Guard soldiers, deployed for Hurricane Isaias response, spotted a pickup truck partially submerged beside an Interstate 10 off-ramp near Tallahassee and worked together to free four family members trapped inside. Troops with civilian backgrounds in law enforcement, nursing and emergency medical services provided care on shore after the rescue. One guardsman said the moment reflected a commitment to being there for their communities whenever help is needed.","source":"Army.mil","url":"https://www.army.mil/article/296066/florida_guard_soldiers_rescue_family_during_hurricane_isaias_response"}],"onThisDay":[{"year":"1938","event":"Orson Welles' radio adaptation of The War of the Worlds aired, causing panic among some listeners who believed a real Martian invasion was underway."},{"year":"1961","event":"The Soviet Union detonated the Tsar Bomba, the most powerful nuclear weapon ever tested, over Novaya Zemlya."},{"year":"1922","event":"Benito Mussolini was appointed Prime Minister of Italy by King Victor Emmanuel III, beginning his fascist rule."},{"year":"1995","event":"Quebec voters narrowly rejected a referendum on sovereignty from Canada by a margin of less than one percent."}]},"topPicks":[{"headline":"Taiwan Warns of 'Obvious' Threat as 50+ Chinese Warships Swarm Region, US Commander Reaffirms 2027 Invasion Risk","teaser":"A massive Chinese naval buildup near Taiwan raises fresh fears of conflict as US officials reaffirm invasion warnings."},{"headline":"Fed Holds Rates Steady in Contentious Split Vote Days Before Midterms","teaser":"A divided Federal Reserve keeps interest rates unchanged just before critical midterm elections, fueling political and market tension."},{"headline":"Russian Strike on Dnipro Train Station Kills 14 as Nationwide Barrage Leaves 19 Dead","teaser":"A deadly Russian missile barrage hits a train station and other targets across Ukraine, killing at least 19 people."}]},"navDates":[{"key":"2026-10-30","label":"Oct 30","href":"/","isNewest":true},{"key":"2026-10-29","label":"Oct 29","href":"/archive/2026-10-29.html","isNewest":false},{"key":"2026-10-28","label":"Oct 28","href":"/archive/2026-10-28.html","isNewest":false},{"key":"2026-10-27","label":"Oct 27","href":"/archive/2026-10-27.html","isNewest":false},{"key":"2026-10-26","label":"Oct 26","href":"/archive/2026-10-26.html","isNewest":false},{"key":"2026-10-25","label":"Oct 25","href":"/archive/2026-10-25.html","isNewest":false},{"key":"2026-10-24","label":"Oct 24","href":"/archive/2026-10-24.html","isNewest":false}],"currentKey":"2026-10-30","pageUrl":"https://ws-daily-digest.netlify.app","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
