<script>
const STATE = {"digest":{"date":"Wednesday, August 26, 2026","generatedAt":"Wed, Aug 26, 9:01 AM PDT","breaking":{"headline":"Taiwan's Foreign Minister Heads to Palau as China Expands Pacific Islands Push","body":"Taiwan Foreign Minister Lin Chia-lung is traveling to Palau for the Pacific Islands Forum leaders summit, running from August 30 through September 4, where he plans to meet Taipei's remaining diplomatic allies and other regional partners to discuss stability across the Indo-Pacific. The trip comes as Beijing has spent recent years building influence in the Pacific islands through infrastructure loans, diplomatic outreach and security deals, a trend that has unsettled Washington, Canberra and Wellington. The dueling diplomatic push underscores how the Taiwan question is increasingly being contested not just in the Strait but across the wider Pacific island chain.","source":"U.S. News & World Report (Reuters)","url":"https://www.usnews.com/news/world/articles/2026-08-25/taiwan-foreign-minister-to-attend-pacific-islands-leaders-summit-events"},"tabs":{"defense":{"defense":[{"headline":"Navy Stands Up New Office to Shore Up Defense Industrial Base","body":"Acting Navy Secretary Hung Cao announced this week the creation of an Office of the Defense Industrial Base, a new organization tasked with strengthening supply chains and speeding the delivery of dual-use technology to the fleet. The move reflects growing Pentagon concern that shipbuilding and munitions production capacity is lagging behind the pace needed to compete with China in a prolonged contingency.","source":"FDD / DefenseScoop","url":""},{"headline":"Pentagon Pushes Ahead on National Counter-Drone Surveillance Shield","body":"Senior Defense Department officials are racing to stand up a first-of-its-kind national counter-drone surveillance network as unidentified and hostile drones increasingly cross into airspace over military installations, civilian areas and large public events across the country. Separately, the department is preparing to test industry-built robotic ground vehicles in North Dakota this fall as part of a broader effort by military services to field more uncrewed systems.","source":"DefenseScoop","url":""},{"headline":"Italy Eyes US Tech to Turn Cheap Missiles Into Precision Interceptors","body":"The Italian Air Force is considering purchasing American technology that converts inexpensive unguided missiles into precision-guided weapons, offering NATO allies a cheaper alternative to costly air-to-air missiles for shooting down drones. The potential buy reflects a broader alliance-wide push to find affordable ways to counter the swarms of low-cost drones now threatening European and NATO airspace.","source":"Defense News","url":""}],"acquisitions":[{"headline":"Pentagon's No-Bid Palantir Deal Draws Fresh Scrutiny","body":"A Pentagon memo signed by Deputy Defense Secretary Steve Feinberg directs up to $243.9 million in sole-source funding to Palantir for AI-driven data analytics through March 2027, with a path to additional funding through December 2028. Watchdog groups note the memo does not cite any of the legally required justifications for bypassing competition, and the deal comes as no-compete contracts have grown to 14.8 percent of all Pentagon awards in the first half of 2026, up from 12.6 percent a year earlier. Palantir has already booked $3.2 billion in federal contract obligations since 2024, roughly half of it through no-compete deals.","source":"Defense One / Federal News Network","url":"https://www.defenseone.com/business/2026/08/pentagon-palantir-no-bid/415400/"},{"headline":"Accenture's $821M Advana Deal Signals AI Push in Defense Data","body":"Accenture recently won an $821 million Pentagon contract to build out the department's Advana AI data platform, part of a wider push to modernize how the military ingests and analyzes data for acquisition and readiness decisions. The award adds to a string of large AI-focused contracts as the Pentagon leans on commercial tech firms to close gaps in its digital infrastructure.","source":"Federal News Network","url":"https://federalnewsnetwork.com/defense-news/2026/07/accenture-wins-821m-pentagon-ai-data-platform-contract/"}]},"us":[{"headline":"Trump-Backed Darline Graham Wins South Carolina Senate Runoff","body":"Sen. Darline Graham defeated Rep. Ralph Norman in Tuesday's GOP special primary runoff to keep the Senate seat once held by her late brother, Lindsey Graham, with unofficial returns showing her ahead roughly 52 to 48 percent. President Trump had rallied in Myrtle Beach and held a tele-town hall for Graham, and an allied super PAC poured in an $830,000 late push, making the race a marquee test of his midterm-cycle endorsement power. Norman, a Freedom Caucus stalwart, conceded but publicly questioned why Trump intervened in a safely Republican seat. Graham now advances to face Democrat Annie Andrews in November for the remainder of the six-year term.","source":"NBC News","url":"https://www.nbcnews.com/politics/2026-election/darline-graham-winner-south-carolina-gop-senate-primary-rcna593581"},{"headline":"Canada Fires Back With Up to 50% Tariffs on $20 Billion of U.S. Goods","body":"Ottawa announced retaliatory duties of 15, 25 and 50 percent on roughly 700 American products, including doubling tariffs on U.S. steel and aluminum to 50 percent, set to take effect September 8. The move follows the collapse of trade talks last week and Trump's imposition of new 50 percent tariffs on a range of Canadian goods after Prime Minister Mark Carney suspended negotiations over U.S. demands he called 'uneconomic' and 'unfair.' Canadian Finance Minister François-Philippe Champagne framed the response as matching U.S. tariffs 'dollar for dollar, rate for rate,' while Ottawa also unveiled a $7.5 billion relief package for affected businesses and workers. The dispute, rooted partly in a dispute over tariff relief for medium- and heavy-duty trucks, marks one of the sharpest escalations yet in the two countries' trade war.","source":"CNBC","url":"https://www.cnbc.com/2026/08/25/canada-trump-tariffs-trade-carney-leblanc.html"},{"headline":"Federal Judge Strikes Down State Department's 75-Country Visa Ban","body":"A U.S. District Court judge in the Southern District of New York, Jeannette Vargas, vacated the administration's ban on immigrant visas for citizens of 75 countries, ruling in CLINIC v. Rubio that the policy exceeded the Secretary of State's authority and violated the Immigration and Nationality Act's bar on nationality-based discrimination in visa decisions. The court found the administration had improperly used a blanket public-charge rationale to deny visas by nationality rather than assessing individual applicants. Consular denials issued solely under the ban have been set aside, though a separate travel-restriction regime for some of the same countries remains intact. It remains unclear whether the administration will appeal or how quickly consulates will resume processing affected applications.","source":"Ellis (legal analysis)","url":"https://www.ellis.com/resources/75-country-visa-ban-struck-down"},{"headline":"DHS Voter-Roll Purge Claims Draw Scrutiny as Data Called 'Preliminary'","body":"The Trump administration said it had identified 250,000 noncitizens on voter rolls across four states, but subsequent communications between the responsible agency and state election officials indicate the figures were only preliminary and unverified. The disclosure comes as private voting-rights attorneys and Democratic state attorneys general mobilize to defend local election officials and prepare lawsuits challenging federal efforts to alter voting rules ahead of the midterms. The dispute adds to a fast-moving legal fight over federal attempts to reshape state voter-list maintenance practices just months before November's elections.","source":"NPR","url":"https://www.npr.org/sections/politics/"}],"pacific":{"pacificCommand":[{"headline":"Philippines Seeks Sharp Defense Budget Hike Amid South China Sea Friction","body":"On August 25, Philippine Defense Secretary Gilberto Teodoro asked Congress for a 6.3 percent increase in next year's defense budget, including about 50 billion pesos (roughly $800 million) earmarked for modernization programs, a 25 percent jump over this year's allocation. The request comes against a backdrop of near-daily friction with Chinese vessels around Scarborough Shoal and Second Thomas Shoal, including three separate clashes in a single week in July. The ask signals growing appetite in Manila to accelerate naval and coast guard upgrades even as ASEAN-China code-of-conduct talks remain stalled.","source":"PeopleNewsToday","url":"https://www.peoplenewstoday.com/news/en/2026/08/26/1152891.html.South-China-Sea-Tensions-Rise-Amid-China%E2%80%93Philippines-Activity.html"},{"headline":"India Unveils Indigenous Micro Turbine Engines for Drones and Missiles","body":"India's defense science establishment unveiled three domestically developed micro gas-turbine engines, the NJ-05, NJ-50 and NJ-100, generating 5, 50 and 100 kilograms of thrust respectively, at a New Delhi ceremony on August 25. Air Marshal Tejinder Singh, Chief of Integrated Defence Staff, said the engines are intended to power tactical drones, loitering munitions and compact missile systems as India pushes to cut reliance on foreign propulsion technology. The unveiling fits into New Delhi's broader drive to indigenize unmanned and precision-strike capabilities following recent border frictions with both China and Pakistan.","source":"Indian Defence News","url":"https://www.indiandefensenews.in/"},{"headline":"Japan Set to Submit Record $56 Billion Defense Budget Request","body":"Tokyo is preparing to submit a record 8.9 trillion yen (about $56.1 billion) defense budget request for the next fiscal year by the end of August, building on a current-year allocation that already pushed Japan past 2 percent of GDP in defense spending. The request follows Japan's August 4 white paper, which again labeled China Japan's 'greatest strategic challenge' and warned Beijing is projecting military power further into the Pacific beyond the First Island Chain. Officials say the new funds will expand long-range counterstrike missiles, including the newly designated Type 25 SSM and hypersonic Type 25 glide projectile, with the total figure expected to climb further before final approval.","source":"Defense News","url":"https://www.defensenews.com/global/asia-pacific/2026/08/10/japans-2026-defense-white-paper-highlights-new-era-of-crisis-in-indo-pacific/"}],"pacingThreat":[{"headline":"China, Belarus Conclude Joint Airborne Drills","body":"Chinese and Belarusian airborne forces wrapped up the 'Swift Eagle 2026' joint training exercise on August 25, according to China's Ministry of National Defense, the latest in a string of PLA exercises with partners outside its immediate neighborhood this month, alongside separate air-combat training with Egyptian pilots. The pattern points to Beijing deepening military ties with Moscow-aligned states while using varied partners to test interoperability concepts. Analysts see these drills as part of the PLA's broader effort to extract doctrinal lessons as it studies the ongoing war in Ukraine.","source":"China Ministry of National Defense","url":"http://eng.mod.gov.cn/"},{"headline":"PLA Commentaries Cast Ukraine War as Prelude to 'Intelligentized' Combat","body":"A fresh round of PLA Daily commentaries examined lessons from the Ukraine war, with military analysts arguing the conflict is merely a transitional phase before AI-enabled, algorithm-driven 'intelligentized' warfare becomes the dominant paradigm, according to an August 25 assessment from the ISW-AEI Coalition Defense of Taiwan project. Separately, Taiwan's Coast Guard tracked the Chinese research vessel Tong Ji sailing within 0.3 nautical miles of Taiwan's contiguous zone near Penghu on August 20 and off Taiwan's southwest coast on August 21, after the ship left port in Xiamen with its tracking transponder disabled. Analysts assess the recurring research-vessel patterns are part of a systematic PLA effort to map undersea terrain around Taiwan to support future underwater warfare operations.","source":"AEI/ISW China and Taiwan Update","url":"https://www.aei.org/commentary/china-taiwan-update-august-25-2026/"},{"headline":"Taiwan Advances 'T-Dome' Missile Shield Despite Budget Gridlock","body":"Taiwan's Ministry of National Defense is pressing ahead with the Chiang Kung interceptor, the outermost layer of President Lai Ching-te's multilayered 'T-Dome' air and missile defense concept first floated in October 2025. Plans call for two Chiang Kung batteries carrying at least 128 missiles at a cost of roughly $1.13 billion, to be layered alongside existing Tien Kung III and PAC-3 systems. Legislative gridlock has already stripped Chiang Kung production funding from the 2026 special defense budget passed in May, leaving financing for the program uncertain even as Taipei races to close gaps in its defenses against potential PLA missile strikes.","source":"AEI/ISW China and Taiwan Update","url":"https://www.aei.org/commentary/china-taiwan-update-august-25-2026/"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine Strikes Deep Into Russia as Kremlin's Combat Losses Top 1.48 Million","body":"Kyiv's forces hit the Lukoil-owned Nizhegorodnefteorgsintez refinery in Kstovo, deep in Russia's Nizhny Novgorod region, extending a campaign against Moscow's fuel-export infrastructure. Ukraine's General Staff put cumulative Russian personnel losses since February 2022 at roughly 1.48 million as of Wednesday, including about 1,450 casualties in the prior 24 hours alone. On the receiving end, Russian strikes knocked out Kherson's combined heat-and-power plant and hit Sloviansk with an overnight airstrike, underscoring that neither side is easing its infrastructure war even as diplomacy continues in the background.","source":"Ukrinform","url":"https://www.ukrinform.net/rubric-ato"},{"headline":"Drone War Escalates on Both Sides of the Border","body":"A Ukrainian drone strike sparked a major fire at a Wildberries logistics warehouse in Russia's Tambov region, the latest in a string of long-range hits on Russian commercial and industrial sites far from the front. Moscow answered in kind inside Ukraine, with an FPV drone striking gas repair crews in Derhachi, Kharkiv region, wounding one worker and destroying two utility vehicles as they tried to restore service cut by earlier shelling. The tit-for-tat drone campaign shows both militaries increasingly targeting logistics and energy workers rather than only front-line positions.","source":"Arab News","url":"https://www.arabnews.com/"}],"europe":[{"headline":"NATO Stays on Alert Over Iran Threats and Drone Incursions","body":"NATO officials say the alliance remains prepared to respond to reported Iranian planning for strikes on U.S. military targets in Europe, with Bulgaria tightening security around Bezmer Air Base as a precaution. A NATO official reiterated that the alliance is prepared to address any threat and will do what is necessary to defend all Allies. The warning comes atop a summer marked by rising airspace violations and drone incidents across Poland, Romania and the Baltics, including NATO jets shooting down a stray drone over Latvia, forcing the alliance to juggle vigilance on its eastern flank with a new front of concern tied to the Iran conflict.","source":"Al Jazeera","url":"https://www.aljazeera.com/news/2026/8/19/nato-prepared-to-defend-allies-amid-report-of-iranian-strike-plans"},{"headline":"Draghi Warns EU Is Sliding Toward Structural Decline","body":"Former ECB chief and Italian premier Mario Draghi renewed his blistering critique of European governments, arguing decline is not inevitable but that the bloc is currently heading in that direction absent urgent action. His think tank blamed both past and present leadership for failing to grasp the scale of Europe's structural problems, arguing the continent had let itself be lulled by decades of favorable trade rules and a US security guarantee that freed up defense budgets for other spending. The critique lands as the EU grapples simultaneously with sluggish growth, a costly pivot to self-funded defense, and energy-driven inflation stemming from the Iran war's disruption of Gulf oil flows.","source":"Eunews","url":"https://www.eunews.it/en/2026/08/25/draghi-and-his-think-tank-rebuke-the-eu-we-are-heading-toward-decline-action-is-needed/"}]},"middleEast":[{"headline":"US Says Hormuz Mines Cleared as Oil Prices Retreat","body":"President Trump announced the U.S. Navy has cleared all mines from the main shipping lane through the Strait of Hormuz, while warning that any vessel laying new mines will be immediately and systematically destroyed. Oil prices fell by about two dollars a barrel on news that Iran and Oman are holding talks aimed at fully reopening the strait to normal traffic. Gulf producers have reportedly continued exporting crude despite Iran's blockade, and Sri Lanka says it is tracking eleven US-sanctioned Iranian tankers off its coast, a sign the maritime standoff is still reverberating globally even as the immediate military threat eases.","source":"The Jerusalem Post","url":"http://www.jpost.com/middle-east/iran-news/2026-08-26/live-updates-906600"},{"headline":"Washington Shifts to Economic Pressure Campaign Against Tehran","body":"Secretary of State Marco Rubio has privately told foreign counterparts the US does not expect to launch new strikes on Iran for now, redirecting the pressure campaign toward sanctions rather than renewed military action, while keeping retaliation on the table if Iran strikes first. Treasury Secretary Scott Bessent framed the shift more starkly, declaring in a Financial Times column that an 'economic D-Day' against Tehran had begun this week. In parallel, Washington is quietly restaffing diplomatic posts in Lebanon, Israel, Saudi Arabia and Iraq, with some personnel expected back as early as this week, a sign officials see the acute phase of the conflict receding even as financial pressure intensifies.","source":"Just Security","url":"https://www.justsecurity.org/155288/early-edition-august-26-2026/"},{"headline":"Israel Deepens Gaza Strikes and West Bank Raids","body":"Israeli forces raided and seized the Qalandiya Training Centre, a key UNRWA facility in the Kafr Aqab neighborhood near Jerusalem, as part of a broader expansion of West Bank operations. Rights groups say Israel is simultaneously intensifying Gaza strikes, with international condemnation continuing to outpace any concrete consequences from foreign governments. The dual-track escalation comes as a UN Security Council briefing on the US-backed 'Board of Peace' Gaza rebuilding effort acknowledged that reconstruction progress has stalled despite Hamas's earlier acceptance of a disarmament framework.","source":"Al Jazeera","url":"https://www.aljazeera.com/middle-east/"}],"techAI":{"aiCompetition":[{"headline":"OpenAI and Anthropic Race Toward Rival Blockbuster IPOs","body":"Motley Fool analysts reported this week that both labs are sprinting toward what could become the largest IPOs in history, with each company pushing hard to lock in as much compute capacity as possible while maximizing revenue ahead of a public listing. The comparison point is fresh in investors' minds: SpaceX went public earlier this year at a valuation that briefly approached $2 trillion before pulling back. Analysts noted that OpenAI has begun narrowing Anthropic's revenue lead in recent weeks by pricing more aggressively, intensifying a rivalry that is increasingly playing out through capital markets rather than just product releases.","source":"The Motley Fool","url":"https://www.fool.com/investing/2026/08/22/ipo-fever-heats-up-for-openai-and-anthropic/"},{"headline":"OpenAI Claws Back Enterprise Market Share From Anthropic","body":"New data from corporate card provider Ramp, covering more than 70,000 U.S. businesses, shows OpenAI narrowing the enterprise gap it lost to Anthropic back in May, when Anthropic surged to 41% share of paying business customers versus OpenAI's 39%. By July, Anthropic's lead had actually widened to nearly 44% versus almost 40% for OpenAI, but Ramp's economist found OpenAI is growing faster quarter-to-date, suggesting the standings could flip again before Q3 closes. The volatility underscores how quickly enterprise AI spending shifts with each new model release from either lab.","source":"TechCrunch","url":"https://techcrunch.com/2026/08/20/openai-is-gaining-on-anthropic-with-business-users-new-data-indicates/"}],"cyberEmerging":[{"headline":"Iran-Linked Hackers Down UK Power Plant, Hit Water Systems Across 12 US States","body":"Security researchers reported that Iran-linked hackers knocked a UK power plant offline for four days, marking the first confirmed incident of its kind, while running parallel intrusions against water infrastructure across a dozen U.S. states. The operation signals a notable escalation in state-linked targeting of Western critical infrastructure and is likely to sharpen already tense scrutiny of Tehran's cyber posture. For a reader tracking geopolitics and defense, the coordinated timing across two allied countries suggests a deliberate demonstration of reach rather than an isolated incident.","source":"Security Affairs","url":"https://securityaffairs.com/"},{"headline":"Nvidia's NemoClaw Tool Exposed AI Agents to Silent Hijacking","body":"Security firm Oasis Security disclosed a flaw in Nvidia's NemoClaw that let a malicious webpage seize unauthenticated control of a victim's local Ollama instance and plant hidden instructions inside the AI model itself, effectively hijacking an autonomous agent just by having a user visit a compromised site. The bug carries no CVE identifier, and researchers said no exploitation had been reported as of August 25, with Nvidia already shipping a fix in NemoClaw version 0.0.35 for macOS and Linux. The episode adds to mounting concern about the security of agentic AI tooling as adoption accelerates faster than hardening practices.","source":"The Hacker News","url":"https://thehackernews.com/"}]},"cities":{"lasVegas":[{"headline":"Dangerous Heat Wave Grips Las Vegas Valley Through Friday","body":"The National Weather Service issued an extreme heat warning for southern Nevada running from early Wednesday through 8 p.m. Friday, with daytime highs expected to hit 108-112 degrees in the Las Vegas Valley and up to 118 in Death Valley and along the Colorado River corridor. Overnight lows will stay in the upper 80s to low 90s, giving residents little relief, and officials are urging people to check on elderly neighbors and never leave children or pets in vehicles. Clark County has reopened cooling stations across the valley to help vulnerable residents cope with the multi-day heat event.","source":"KESQ / NWS Las Vegas","url":"https://kesq.com/weather/alerts-weather/2026/08/26/extreme-heat-warning-issued-august-26-at-249am-pdt-until-august-28-at-800pm-pdt-by-nws-las-vegas-nv/"},{"headline":"Nevada Sues Federal Government Over Colorado River Cutback Plan","body":"Nevada officials filed suit this week challenging a newly announced federal framework governing cuts to Colorado River water allocations, arguing the plan unfairly burdens the state amid the ongoing megadrought. The filing sets up a legal fight over how shortages are shared among the seven basin states as reservoir levels at Lake Mead remain historically low. The outcome could shape water policy for the fast-growing Las Vegas metro area for years to come.","source":"FOX5 Las Vegas","url":"https://www.fox5vegas.com/"},{"headline":"Hawk Fire Scorches More Than 15,000 Acres in Washoe County","body":"City, county and state leaders briefed the public this week on the Hawk Fire, which has burned upwards of 15,000 acres in Washoe County and forced Reno-area school closures while crews worked to keep flames away from homes. Evacuation orders remained in place for some neighborhoods as firefighters battled fast-moving wind-driven conditions. The blaze underscores an intensifying wildfire season across northern Nevada even as southern Nevada bakes under an extreme heat warning.","source":"FOX5 Las Vegas / Associated Press","url":"https://www.fox5vegas.com/"}],"nellis":[{"headline":"Extreme Heat Tests Airmen and Aircraft During Red Flag Training on the NTTR","body":"As the region's extreme heat warning pushes daytime temperatures past 110 degrees, Nellis Air Force Base personnel continue high-tempo combat training over the Nevada Test and Training Range, a roughly 2.9-million-acre, 12,000-square-mile airspace considered the Air Force's premier venue for large-scale Red Flag exercises. Ground crews and maintainers are managing sortie generation and aircraft servicing in triple-digit heat, conditions that have historically strained personnel and equipment during summer iterations of the exercise. The NTTR's scale allows realistic simulated air-defense threats that cannot be replicated at smaller ranges, making the heat-versus-readiness tradeoff a recurring operational challenge for the base each August.","source":"Royal Air Force / Nellis AFB Public Affairs","url":"https://www.raf.mod.uk/news/articles/exercise-red-flag-2026-explained/"}]},"feelGood":[{"headline":"Raiders Pledge $25 Million for New Las Vegas Children's Hospital","body":"The Las Vegas Raiders announced a $25 million donation to Intermountain Health to help fund a stand-alone children's hospital in the valley, one of the largest philanthropic gifts in the team's Nevada history. The facility aims to keep critically ill kids from having to fly out of state for specialized pediatric care, a longstanding gap in southern Nevada's healthcare system. Team and health system officials framed the gift as a multi-year commitment to the city's long-term medical infrastructure.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Stranger Steps In to Help Bronx Mother Who Lost Everything in Fire","body":"After a devastating apartment fire left a Bronx mother and her family with almost nothing, a stranger who saw a news segment about her situation reached out and stepped in to help her get back on her feet. The gesture, prompted purely by watching her story unfold on television, is helping the family rebuild without the crushing weight of starting completely from scratch. It's a reminder that a single viewer's compassion can change the trajectory of a family in crisis almost overnight.","source":"SunnySkyz Good News","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Fisherman Found Alive After 15 Days Trapped in Underwater Cave","body":"A fisherman who vanished inside an unexplored underwater cave system in Mexico was found alive 15 days later after specialist cave divers pushed deeper into total darkness rather than call off the search. The rescue required technical divers to navigate flooded passages with minimal visibility, sustaining the search far longer than most missions of this kind typically continue. His survival after more than two weeks without conventional supplies has stunned rescue crews and is being called one of the most remarkable cave rescues in recent memory.","source":"SunnySkyz Good News","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1789","event":"The French National Assembly adopted the Declaration of the Rights of Man and of the Citizen."},{"year":"1920","event":"The 19th Amendment to the US Constitution was certified, granting women the right to vote."},{"year":"1978","event":"Cardinal Albino Luciani was elected Pope, taking the name John Paul I."},{"year":"2021","event":"A suicide bombing at Kabul's airport during the US evacuation killed more than 180 people, including 13 US service members."}]},"topPicks":[{"headline":"Canada Fires Back With Up to 50% Tariffs on $20 Billion of U.S. Goods","teaser":"Ottawa's sweeping retaliatory tariffs threaten to escalate a costly trade war with major economic fallout for both nations."},{"headline":"Ukraine Strikes Deep Into Russia as Kremlin's Combat Losses Top 1.48 Million","teaser":"Ukraine's long-range strikes and staggering Russian casualty figures signal a grinding, high-stakes phase of the war."},{"headline":"Iran-Linked Hackers Down UK Power Plant, Hit Water Systems Across 12 US States","teaser":"A wave of cyberattacks on critical infrastructure highlights escalating state-linked threats to Western energy and water systems."}]},"navDates":[{"key":"2026-08-31","label":"Aug 31","href":"/","isNewest":true},{"key":"2026-08-30","label":"Aug 30","href":"/archive/2026-08-30.html","isNewest":false},{"key":"2026-08-29","label":"Aug 29","href":"/archive/2026-08-29.html","isNewest":false},{"key":"2026-08-28","label":"Aug 28","href":"/archive/2026-08-28.html","isNewest":false},{"key":"2026-08-27","label":"Aug 27","href":"/archive/2026-08-27.html","isNewest":false},{"key":"2026-08-26","label":"Aug 26","href":"/archive/2026-08-26.html","isNewest":false},{"key":"2026-08-24","label":"Aug 24","href":"/archive/2026-08-24.html","isNewest":false}],"currentKey":"2026-08-26","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-26.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
