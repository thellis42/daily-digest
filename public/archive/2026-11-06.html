<script>
const STATE = {"digest":{"date":"Friday, November 6, 2026","generatedAt":"Fri, Nov 6, 8:45 AM PST","breaking":{"headline":"Hegseth vows to fight impeachment as Pentagon leadership reels from midterm losses","body":"Three days after Republicans lost both chambers of Congress in Tuesday's midterms, Defense Secretary Pete Hegseth posted a defiant video from the Pentagon steps on November 5 rejecting calls to resign and dismissing the push against him as 'the politics of personal destruction.' Kentucky Republican Thomas Massie is leading an impeachment effort tied to backlash over the Iran war, with a House vote possible as early as next week; Hegseth used the moment to demand $350 billion in extra military funding and reaffirm his opposition to transgender service and DEI policy. President Trump has publicly stood by Hegseth, but incoming House Armed Services Chairman Adam Smith is already signaling aggressive oversight of Pentagon leadership and Trump-era defense deals once Democrats are sworn in.","source":"The Washington Times","url":"https://www.washingtontimes.com/news/2026/nov/5/pete-hegseth-said-hes-not-leaving-pentagon-despite-calls-impeachment/"},"tabs":{"defense":{"defense":[{"headline":"Air Force says it needs $14 billion to fix spare-parts crisis","body":"Air Force officials disclosed on November 5 that the service needs at least $14 billion to correct a worsening spare-parts deficit that is dragging down readiness across its aging aircraft fleets. A related assessment found only 8 of 24 Air Force aircraft fleets currently meet parts-availability standards, forcing maintainers to cannibalize jets for components. The shortfall adds new pressure on lawmakers shaping the next defense budget just as Pentagon spending faces heightened scrutiny from the incoming Democratic Congress.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Pentagon sends more Humvees and boats to D.C. National Guard mission","body":"Hegseth approved a memo sending additional boats and Humvees to National Guard troops patrolling Washington, D.C., according to reporting published November 5. The move came just as D.C. officials had hoped Tuesday's election results would pave the way to end the deployment of hundreds of Guard troops in the capital. Local leaders say they will now lobby incoming state governors to withdraw their units, but the equipment buildup signals the administration intends to extend rather than wind down the mission.","source":"The Washington Post","url":"https://www.washingtonpost.com/dc-md-va/2026/11/05/national-guard-adding-boats-humvees-dc-leaders-hope-oust-troops/"},{"headline":"Royal Navy fires salvo of strike effectors from carrier in North Atlantic","body":"The Royal Navy launched four one-way strike effectors from the carrier HMS Queen Elizabeth during a North Atlantic demonstration reported November 6, part of a broader allied push to add long-range strike options to carrier strike groups. Analysts noted the Navy disclosed no in-service date, procurement quantity, or payload details, and cautioned that launching effectors individually rather than in salvos would leave them vulnerable to interception. The test follows similar moves by NATO partners, including France's new industry 'pact' to accelerate naval drone production for its fleet.","source":"Navy Lookout / Defense Tech Intelligence Brief","url":""}],"acquisitions":[{"headline":"Space Force taps Viasat for up to $450M Golden Dome network hub","body":"The Space Force, working with the Pentagon's Golden Dome missile-defense program, awarded Viasat a contract worth up to $450 million on November 6 to design, build and operate a Mission Operations Center for the Space Data Network Backbone. The center is meant to coordinate secure, multi-vendor connectivity across all military domains in support of Golden Dome's sensor and interceptor architecture. The award highlights the growing reliance on commercial space firms to knit together the administration's layered homeland missile-shield concept.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Navy shipbuilder TOTE taps Hanwha for $269M logistics vessel award","body":"TOTE Services selected South Korea's Hanwha Group to build a Light Surface Maritime support vessel for the Navy under an award with a ceiling of $269 million, reported November 5. The contract reflects the Navy's increasing use of allied shipbuilders to relieve bottlenecks at domestic yards as it tries to rebuild sealift and logistics capacity. It comes amid wider Pentagon efforts, including new loan guarantees and supply-chain deals, to speed shipbuilding and munitions production ahead of a tighter FY27 budget fight.","source":"Inside Defense","url":"https://insidedefense.com/insider/insider-daily-digest-november-5-2026"}]},"us":[{"headline":"AI-driven market rout wipes out $2.5 trillion as Democrats' midterm sweep rattles tech investors","body":"The Nasdaq Composite plunged a record 1,421 points (5.5%) on November 5, its worst session since the April 2025 tariff shock, erasing roughly $2.5 trillion in market value and pushing the index into correction territory. Investors dumped chip and AI infrastructure names, including Nvidia, which lost its entire 2026 gains, on fears that Democratic wins in data-center hubs like Texas and Ohio could slow permitting and impose tougher regulation on the AI buildout. The reversal came just a day after a historic post-election rally, and was followed Friday by a stronger-than-expected October jobs report showing 165,000 jobs added and unemployment at 4.1%.","source":"CNN / Fox Business","url":"https://www.cnn.com/2026/11/05/investing/tech-heavy-nasdaq-plunges"},{"headline":"Federal judge halts construction on Trump's 250-foot triumphal arch hours after final approval","body":"U.S. District Judge Tanya Chutkan issued a 14-day restraining order just after midnight Friday, blocking any construction-related activity on Trump's planned arch near Arlington National Cemetery mere hours after the National Capital Planning Commission voted 8-4 to approve it. The order came in response to a suit by Vietnam War veterans, Virginia, and the District of Columbia, who argue the roughly 250-foot structure was never authorized by the current Congress. Chutkan's 33-page opinion specifically questioned the administration's newly asserted national-security rationale for the project.","source":"NPR / Washington Post","url":"https://www.npr.org/2026/11/06/nx-s1-6031990/trump-arch-planning-commission-injunction"},{"headline":"Schumer vows incoming Senate Democratic majority will block any 'right-winger' Trump Supreme Court pick","body":"Fresh off Tuesday's midterm sweep that handed Democrats control of the Senate, Chuck Schumer told the Associated Press his caucus will not confirm a conservative justice if a vacancy opens before Trump leaves office in January 2029. Schumer declined to say whether he would hold a seat open until after the 2028 election, as Mitch McConnell did in 2016, but said Democrats will reject any 'crappy nominees' to the high court, lower courts, or Trump's Cabinet. The pledge raises pressure on Justices Alito and Thomas, both in their late 70s, over retirement timing while Republicans still control the White House.","source":"The Hill / Associated Press","url":"https://thehill.com/homenews/senate/6203353-chuck-schumer-donald-trump-supreme-court/"},{"headline":"Vote counting confirms historic Democratic sweep as Senate, House majorities solidify","body":"Final tallies from Tuesday's midterms show Democrats on track for roughly 257 House seats, while razor-thin Senate races in Alaska (Mary Peltola over Dan Sullivan) and Mississippi (Scott Colom over Cindy Hyde-Smith) remain uncalled but trending Democratic. Michigan Senator-elect Abdul El-Sayed's win over Schumer's preferred primary candidate underscores a progressive undercurrent within the new majority. Senator Ted Cruz publicly described the GOP losses as a 'Watergate-level repudiation,' while Secretary of State Marco Rubio is reportedly weighing an early exit from the administration to position for a 2028 presidential run.","source":"Democracy Now! / Just Security","url":"https://www.justsecurity.org/163619/early-edition-november-6-2026/"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Unveils Emergency Cyber Package After Wave of Breaches","body":"Prime Minister Sanae Takaichi's government rolled out an emergency cybersecurity package on Friday combining AI-assisted defenses with new rapid-response teams after a string of major breaches hit Japanese companies and government agencies. The government will enhance its capability to access servers used by hackers as a preemptive measure known as active cyber defense, which was legalized in October. Under the measures in the package, a top gun team of cybersecurity experts will be set up by the Ministry of Economy, Trade and Industry by the end of November. Takaichi framed the push as essential given the era of AI-generated attacks, urging both agencies and firms to raise their defenses.","source":"Associated Press via Boston 25 News","url":"https://boston25news.com/news/technology/japan-announces/IR2KLDIZBU4LZCRWCFAKXUMYDM"},{"headline":"Japan to Upgrade Okinawa Brigade to Division, Eyeing a Taiwan Contingency","body":"Japan's Ministry of Defense is preparing a major reorganization of its southwestern island defenses, with the Yomiuri Shimbun reporting that the Japanese Ministry of Defense plans to upgrade the Japan Ground Self-Defense Force's 15th Brigade, based in Naha, Okinawa Prefecture, to a division this fiscal year in preparation for a potential Taiwan contingency. The expansion would also substantially increase the Japan Ground Self-Defense Force's personnel strength in Okinawa. The move comes as Tokyo weighs a five-year buildup plan that would push defense outlays toward roughly 80 trillion yen, with Japan's Defense Ministry estimating a $507 billion five-year buildup, nearly doubling spending as it expands drone, AI, space and cyber capabilities.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/11/07/2003867316"},{"headline":"North Korea's Fourth Missile Launch in a Month Draws US Pacific Command Scrutiny","body":"Pyongyang kept up a rapid testing pace this week, with South Korea's Defence Ministry confirming that North Korea fired multiple missiles on Wednesday toward the sea off its east coast, marking Pyongyang's fourth such weapons launch in a month. State media separately said North Korea test-fired a newly designed, advanced air-defense missile system on Nov. 4, 2026. U.S. Pacific Command said it is aware of the missile launches and is consulting closely with allies and partners, while a Korea Advanced Institute of Science and Technology analyst suggested the tempo points to North Korea nearing mass production, potentially including missiles built for export to Russia.","source":"Stars and Stripes","url":"https://stripes.com/theaters/asia_pacific/2026-11-05/north-korea-missile-technology-diplomacy-23369224.html"}],"pacingThreat":[{"headline":"China Doubles Down on Amphibious Fleet, Signaling Taiwan Focus","body":"Open-source trackers report that Beijing is pressing ahead with additional Type 071 amphibious warships, a move that challenges US assessments that Beijing lacks the maritime lift and logistical support needed for a large-scale attack on the island. Analysts see the expanded amphibious fleet as a deliberate hedge against skepticism in Washington about the PLA's current sealift capacity for a full Taiwan invasion. The buildup adds to a string of 2026 signals, including accelerated warship construction, that Beijing is methodically closing capability gaps rather than treating an invasion as purely theoretical.","source":"South China Morning Post","url":"https://www.scmp.com/topics/south-china-sea"},{"headline":"Taiwan Tracks Surge in PLA Naval Mobilization as Monthly Air Sorties Hit New Lows","body":"Taiwan's defense ministry flagged a massive PLA naval mobilization alongside a spike in air sorties in early November, even as longer-term data show a shift in Beijing's pressure tactics. A joint ISW-AEI assessment found the PLA carried out 159 aerial incursions into Taiwan's Air Defense Identification Zone in September, less than half the total number from the same period in 2024 and 2025, a decline analysts say likely reflects an adjustment in the PRC's coercion strategy targeting Taiwan rather than seasonal fluctuation. At the same time, the same report noted the PLA Navy may be preparing to commission the Sichuan, the only amphibious assault vessel in the world with an electromagnetic catapult, which would likely play an important role in enhancing the combat power of PLAN carrier strike groups beyond China's immediate waters.","source":"South China Morning Post / ISW-AEI","url":"https://www.scmp.com/topics/south-china-sea"},{"headline":"Taiwan Braces for Nov. 28 Vote Amid Beijing Interference Warnings and Stalled US Arms","body":"With nine-in-one local elections set for Saturday, Nov. 28, Taiwan's National Security Bureau has warned that Beijing is targeting specific voter groups, including offering discounted flights to Taiwanese living in China so they could return home to vote, a claim Beijing denies. The vote comes as Taipei also manages defense-budget friction at home: lawmakers this week unfroze funding for 74 budget items under the Ministry of National Defense's general budget, but big-ticket items like NASAMS air-defense systems and follow-on indigenous submarines remain stuck. Compounding the uncertainty, a roughly $14 billion US arms package has stalled since President Trump called it a bargaining chip after meeting Xi Jinping in May, even though Taiwan's defense minister insists bipartisan US support will continue after the Democratic sweep in the midterms.","source":"Taipei Times / Rio Times","url":"https://taipeitimes.com/News/taiwan/archives/2026/11/05/2003867213"}]},"europe":{"ukraineRussia":[{"headline":"Russia and Ukraine trade mass drone and missile strikes on energy, logistics targets","body":"Russian forces hit a Nova Poshta logistics terminal outside Kharkiv, a power station and a cargo ship on November 5, while Kyiv's water utility reported outages across the capital after fluctuations tied to earlier grid strikes. Ukraine answered with a barrage of over 200 drones against Russia's Ryazan oil refinery and a strike on a bus in Russian-held Luhansk that killed five people and wounded thirteen. Overnight into November 6, Ukrainian air defenses downed 196 of the drones Russia launched, while a Russian strike on Rivne region killed one person and a fire broke out at Russia's Afipsky refinery.","source":"Al Jazeera / Ukrinform","url":"https://www.aljazeera.com/news/2026/11/5/russia-says-it-hit-ukrainian-postal-hub-and-ship-as-ukraine-strikes-ryazan"},{"headline":"Kremlin accused of weaponizing Oleshky evacuation ahead of Abu Dhabi talks","body":"The Institute for the Study of War assessed that Moscow is exploiting humanitarian crises it created, including the chaotic Oleshky evacuation, to curry favor with the Trump administration, even as a prominent Russian milblogger who reported on evacuation figures abruptly vanished from Telegram in an apparent censorship move. The Kremlin's envoy Kirill Dmitriev and a Ukrainian ruling-party official appeared together at a Melania Trump-hosted White House event this week, with Dmitriev presenting the First Lady a painting marking the ceasefire. New Russia-Ukraine-US talks are now expected in Abu Dhabi sometime in the first half of November, though no date has been confirmed.","source":"Institute for the Study of War / Rio Times","url":"https://www.kyivpost.com/post/89297"}],"europe":[{"headline":"NATO fast-tracks counter-drone purchases as Poland presses allies on deep-strike doctrine","body":"NATO launched a Counter-Unmanned Aircraft Systems marketplace on November 5, letting member states buy already-vetted counter-drone systems directly from a NATO catalogue without a new tender process, backed by 3.1 million euros for further testing. The move, part of the alliance's 'Drone Edge' initiative from July's Ankara summit, comes as Poland's defense minister has warned industry that future Patriot and air-defense contracts depend on building manufacturing capacity inside Europe after delivery delays. Separately, NATO's top military commander in Europe used the Warsaw Security Forum to outline a new defense doctrine emphasizing long-range strikes deep into Russian territory as a deterrence tool.","source":"NATO / RealClearDefense","url":"https://nato.int/en/news-and-events/articles/news/2026/11/05/nato-accelerates-procurement-for-counter-drone-technologies"},{"headline":"Coordinated hoax bomb threats paralyze European aviation for a third straight day","body":"More than 20 flights across the continent have been disrupted since Tuesday by waves of hoax bomb threats, with Bulgarian fighter jets scrambled to escort three airliners to the ground and Spanish police logging three emailed threats within twenty minutes targeting Madrid-Paris and Rome-Milan routes. Airports and airlines in Prague, Dublin, Rome, Bucharest and Madrid have all been affected, and Air France's CEO called the apparent coordination of the threats unprecedented. Security analysts say the timing overlaps with recent cyberattacks on European supermarket refrigeration systems, raising concern that the incidents reflect a broader pattern of hybrid disruption against critical infrastructure rather than isolated pranks.","source":"CNN","url":"https://www.cnn.com/2026/11/05/europe/europe-bomb-threat-intl"}]},"middleEast":[{"headline":"Strait of Hormuz tanker attacks escalate fears of wider US-Iran clash","body":"Iran's Revolutionary Guard Corps said five oil tankers and a tugboat caught fire in a series of incidents in the Strait of Hormuz this week, with one vessel reportedly striking a naval mine south of the strait and another catching fire while exiting the waterway's eastern end. A senior Iranian lawmaker told Euronews the Hormuz standoff is 'not sustainable,' underscoring how the shipping lane has become the main flashpoint of the ongoing conflict. Iranian security chief Mohsen Rezaei also met Vladimir Putin in Moscow this week, signaling Tehran is leaning further on Russian backing as the crisis deepens.","source":"Reuters / Euronews","url":"https://www.khaleejtimes.com/world/mena/us-israel-iran-saudi-arabia-yemen-war-live-updates-november-5-2026"},{"headline":"Trump weighs further strikes on Iran despite midterm backlash","body":"With the midterms over, US officials are reportedly warning Gulf allies to prepare for a new round of American strikes on Iran, even as President Trump publicly defended the conflict, saying at the White House that the war has been worth it and that 'you have no choice.' Iranian officials have framed the Democratic sweep of Congress as evidence that American voters rejected the war, while cautioning against expecting any near-term shift in US policy. The divergence sets up a tense window before any de-escalation, with analysts questioning whether the costly campaign against Iran's nuclear program has achieved its stated aims.","source":"Anadolu Agency / Euronews","url":"https://www.aa.com.tr/en/world/morning-briefing-nov-6-2026/4113576"},{"headline":"Turkiye's parliament ratifies trilateral defense pact with Pakistan and Saudi Arabia","body":"Turkish lawmakers approved a new trilateral defense agreement with Pakistan and Saudi Arabia by a vote of 279 to 119, formalizing a security partnership among three major Sunni-majority military powers. The pact arrives as Saudi Arabia separately signed a defense-ministry cooperation agreement with Syria's new government and as Syrian President Ahmed al-Sharaa made a high-level visit to Riyadh, reflecting a broader realignment of regional security architecture amid the ongoing Iran crisis and Gulf states' continued exposure to Houthi missile and drone attacks.","source":"Anadolu Agency","url":"https://www.aa.com.tr/en/world/morning-briefing-nov-6-2026/4113576"}],"techAI":{"aiCompetition":[{"headline":"Isomorphic Labs in talks for $5 billion raise at $50 billion valuation","body":"DeepMind's drug-discovery spinout Isomorphic Labs is negotiating a roughly $5 billion funding round that would value the company near $50 billion, more than 20 times its valuation from a round just last May. The jump underscores how AI-for-science ventures are now commanding financing on par with frontier model labs, even without a marketed drug. If completed, it would rank among the largest private AI-adjacent raises of 2026 and tighten Alphabet's bet on AI-driven biotech as a second pillar alongside Gemini.","source":"AI Weekly / Bloomberg","url":"https://aiweekly.co/ai-news-today/funding-ai-news"},{"headline":"AI trade gets repriced as chip stocks slide and Anthropic IPO chatter cools","body":"A broad Thursday selloff hit semiconductor and data-center-linked stocks hardest, landing directly on the companies financing the AI buildout, while informal valuation talk around a future Anthropic IPO reportedly slipped to about $1.2 trillion. The pullback came even as Google pressed ahead with $17 billion committed to its first Wyoming data center, an air-cooled facility paired with a 702-megawatt fuel-cell project. The split signals investors are growing more skittish about near-term AI infrastructure economics even as hyperscalers keep deploying record capital.","source":"usecarly.com","url":"https://usecarly.com/blog/ai-news-2026-11-06"}],"cyberEmerging":[{"headline":"China-linked ARTEX campaign hits crypto infrastructure firms Chainstack and WorkOS","body":"Blockchain infrastructure provider Chainstack disclosed this week that an intruder breached a development environment on October 26 and escalated into parts of its production systems before being cut off on October 31. Investigators say the intrusion shares tooling overlaps with a China-linked hacking cluster using malware dubbed ARTEX to target high-value technology firms, with identity-platform company WorkOS confirming a related but contained breach of its go-to-market systems around the same window. The incidents add to a string of China-attributed espionage operations against US-adjacent tech and crypto infrastructure this fall.","source":"The Hacker News","url":"https://thehackernews.com/2026/11/chainstack-reports-production-systems.html"},{"headline":"Democrats move fast on AI safety agenda after midterm wins","body":"Fresh off Tuesday's midterm victories that hand Democrats control of both chambers in January, House Democratic committee leaders have already asked five frontier AI developers to report any misalignment or safety incidents to Congress within 48 hours of detection. The center-left Chamber of Progress coalition followed with a 10-point memo urging the incoming majority to pass a federal AI transparency and safety standard built on mandatory incident reporting, whistleblower protections, and independent model evaluation. Analysts expect the push for federal preemption of state AI laws favored by the Trump administration to stall as Democratic proposals instead treat federal rules as a floor rather than a ceiling.","source":"Nextgov/FCW","url":"https://www.nextgov.com/artificial-intelligence/2026/11/tech-policy-coalition-calls-new-congress-set-ai-safety-standards/417077/"}]},"cities":{"lasVegas":[{"headline":"State Sen. Edgar Flores Tapped as Nevada's New Senate Majority Leader","body":"State Sen. Edgar Flores, D-Las Vegas, was chosen this week to lead the Nevada Senate Democratic Caucus heading into the next legislative session, the caucus announced Wednesday. The move installs new leadership in Carson City just as the state party also navigates fresh results from Tuesday's municipal elections. Flores takes the gavel at a pivotal moment with K-12 funding fights, including a contested data-center revenue plan pushed by the teachers union, looming large for 2027.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/local-las-vegas/"},{"headline":"$140 Million Land Deal South of the Strip Eyed for New Arena","body":"A parcel at the northwest corner of Las Vegas Boulevard and Blue Diamond Road has sold for $140 million, with buyers signaling plans to develop a new arena on the site. The sale comes months after a separate group unveiled a multibillion-dollar vision for the area without yet filing formal project plans, underscoring the speculative land rush still reshaping the southern end of the Strip corridor.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Wynn Resorts Weighs Future of Vacant Land Across From Its Flagship","body":"Wynn Resorts' chief executive said Thursday the company is beginning to consider development options for land it owns across Las Vegas Boulevard from Wynn Las Vegas and Encore. No formal plans have been announced, but the comments add Wynn to the growing list of operators reassessing underused Strip-adjacent real estate as the corridor's land values climb.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Air Force Advances $1 Billion F-47 Test Campus at Nellis","body":"The Air Force has issued a presolicitation notice to begin building a roughly $1 billion complex at Nellis Air Force Base to support operational testing of Boeing's sixth-generation F-47 fighter, with hangars, laboratories and maintenance facilities slated for completion by 2031. The project follows the service's 2027 budget request of $730 million for F-47 support infrastructure and confirms Nellis, rather than just Edwards AFB in California, will host the jet's broader operational integration. Planners note Nellis's proximity to Creech Air Force Base, home to the Air Force's experimental Collaborative Combat Aircraft drone unit, makes the Nevada Test and Training Range central to testing how the F-47 will fight alongside autonomous wingmen.","source":"Air & Space Forces Magazine","url":"https://www.airandspaceforces.com/air-force-billion-dollar-campus-testing-f-47-nellis/"}]},"feelGood":[{"headline":"Minnesota Town Rallies Around Family That Lost Everything in Kitchen Fire","body":"After a kitchen fire destroyed most of what the Hanson family owned in Perham, Minnesota, neighbors and local businesses mobilized within days with donations, temporary housing and small personal gestures of support. A local market owner personally delivered donated goods to the family, while a nearby quilt shop replaced all the yarn lost in the blaze after learning the family's daughter, Lille, enjoys crocheting. No one was hurt in the fire, and the family says the outpouring of community generosity has been life-changing.","source":"InForum / DL-Online","url":"https://www.dl-online.com/news/minnesota/so-life-changing-town-rallies-around-family-who-lost-home-to-fire"},{"headline":"Ukrainian Nonprofit Brings 13 More Children Home From Russian Occupation","body":"The humanitarian group Save Ukraine, founded by Mykola Kuleba, announced it returned 13 children and teenagers from Russian-occupied territory over the past week despite the ongoing war. Kuleba said the young people had faced threats and dangerous conditions under occupation, with the rescues carried out under President Volodymyr Zelensky's 'Bring Kids Back' initiative. The organization says it has now helped bring home more than 1,800 children since Russia's occupation of Ukrainian territory began.","source":"Kyiv Independent","url":"https://kyivindependent.com/ukraine-returns-13-children-from-russian-occupation-ngo-says/"},{"headline":"Veteran Rebuilds His Life With Help From Homelessness Nonprofit","body":"As part of the sixth annual 'Make Camo Your Cause' campaign, FOX and the nonprofit U.S.VETS highlighted the turnaround of Army veteran Patrick Carl Henderson, who once never imagined he would end up living on the street. The organization provided him the support needed to rebuild his life, part of a broader push to address veteran homelessness nationwide, with nearly 33,000 veterans currently without stable housing in the U.S. The campaign runs through Veterans Day, inviting the public to donate directly to U.S.VETS programs that helped Henderson and others like him.","source":"FOX LA","url":"https://foxla.com/news/make-camo-your-cause-2026-fox-campaign-ending-veteran-homelessness"}],"onThisDay":[{"year":"1860","event":"Abraham Lincoln was elected the 16th President of the United States."},{"year":"1861","event":"Jefferson Davis was elected president of the Confederate States of America."},{"year":"1869","event":"Rutgers and Princeton played the first intercollegiate American football game."},{"year":"1917","event":"Bolshevik forces began the uprising in Petrograd that launched the October Revolution."}]},"topPicks":[{"headline":"Vote counting confirms historic Democratic sweep as Senate, House majorities solidify","teaser":"Democrats lock in control of both chambers, reshaping Washington's power balance heading into 2027."},{"headline":"AI-driven market rout wipes out $2.5 trillion as Democrats' midterm sweep rattles tech investors","teaser":"A historic sell-off hammers tech valuations as investors recalibrate for a new political landscape."},{"headline":"Hegseth vows to fight impeachment as Pentagon leadership reels from midterm losses","teaser":"A looming impeachment battle threatens to destabilize Pentagon leadership amid post-election turmoil."}]},"navDates":[{"key":"2026-11-12","label":"Nov 12","href":"/","isNewest":true},{"key":"2026-11-11","label":"Nov 11","href":"/archive/2026-11-11.html","isNewest":false},{"key":"2026-11-10","label":"Nov 10","href":"/archive/2026-11-10.html","isNewest":false},{"key":"2026-11-09","label":"Nov 9","href":"/archive/2026-11-09.html","isNewest":false},{"key":"2026-11-08","label":"Nov 8","href":"/archive/2026-11-08.html","isNewest":false},{"key":"2026-11-07","label":"Nov 7","href":"/archive/2026-11-07.html","isNewest":false},{"key":"2026-11-06","label":"Nov 6","href":"/archive/2026-11-06.html","isNewest":false}],"currentKey":"2026-11-06","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-06.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
