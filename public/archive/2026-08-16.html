<script>
const STATE = {"digest":{"date":"Sunday, August 16, 2026","generatedAt":"Sun, Aug 16, 5:30 AM PDT","breaking":{"headline":"Middle East Flares Again: Deadliest Lebanon Strikes Since Ceasefire, Houthi Missile Barrage, and Hormuz Shipping Collapse","body":"Israel carried out its most lethal airstrikes on southern Lebanon since the June ceasefire, killing at least nine people, including seven in a single strike on a house in Ansar, according to Lebanon's state news agency. Overnight, Iran-backed Houthi forces fired six ballistic missiles at Yemen's Red Sea port of Mocha, killing one person and wounding eight, while an unidentified projectile struck a bulk carrier in the Strait of Hormuz. Shipping traffic through the strait has collapsed to just 17 percent of its pre-conflict average over the past week, according to UK Maritime Trade Operations, showing how the wider Israel-Iran conflict keeps destabilizing the region's key energy corridors.","source":"CNN","url":"https://www.cnn.com/2026/08/15/world/live-news/iran-war-trump"},"tabs":{"defense":{"defense":[{"headline":"Trump Directs Ford-Class Carriers Back to Steam Catapults, Opens Path to Foreign-Built Warships","body":"President Trump signed a sweeping shipbuilding memo on August 13 ordering the Navy to revert the Ford-class carrier program to steam-powered catapults instead of the troubled electromagnetic launch system. The memo also invokes Trump's Title 10 national security waiver authority to allow warships to be built in foreign shipyards, breaking from the long-standing requirement that combatants be built domestically. The directive reflects White House frustration with years of cost overruns and schedule slippage on the Ford-class program.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Army Pushes to Make High-Energy Lasers a Permanent Counter-Drone Fixture","body":"The US Army is negotiating with AeroVironment to field high-energy laser weapons as a standing element of its counter-drone arsenal, moving the technology beyond demonstration status toward a formal program of record. The push responds to the proliferation of cheap first-person-view attack drones on battlefields from Ukraine to the Middle East, which have strained traditional kinetic interceptors. Separately, US Marines conducted their first live-fire FPV attack-drone flights in South Korea on August 6, part of a broader Indo-Pacific drone-integration effort announced by the Department of War.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026"},{"headline":"Spanish F-18 Downs Fourth Drone Over Romania This Year Amid NATO Eastern-Flank Strain","body":"A Spanish Air Force F-18 on NATO air-policing duty shot down an unidentified drone that crossed into Romanian airspace from Moldova near Galati at 5:01 a.m. on August 16, marking the fourth such intercept over Romania in 2026. Surveillance systems first detected the target roughly 24 kilometers north of Galati, and the drone was destroyed over unpopulated ground between Baleni and Cudalbi. The incident comes just two days after NATO jets downed a separate drone over Latvia, underscoring mounting pressure on the alliance's eastern-flank air defenses from unmanned aircraft tied to Russia's war in Ukraine.","source":"CNN","url":"https://www.cnn.com/2026/08/15/europe/drone-romania-airspace-nato-hnk-intl"}],"acquisitions":[{"headline":"Pentagon Expands Boeing Role in Standard Missile-3 Interceptor Production Surge","body":"The Pentagon has added Boeing-led component manufacturing agreements to its push to expand production of Standard Missile-3 Block IB and Block IIA interceptors, building on up-to-seven-year production frameworks it struck with RTX back in February. The scope and dollar value of the new Boeing arrangements have not yet been disclosed. The move signals urgency in restocking missile-defense interceptor stockpiles after heavy draw-down rates during recent Middle East operations.","source":"Inside Defense","url":"https://insidedefense.com/"},{"headline":"Army Launches Initiative to Widen Missile Industrial Base Beyond Traditional Primes","body":"The US Army unveiled a new initiative on August 13 aimed at expanding its missile industrial base by recruiting more nontraditional vendors and creating a steadier, more predictable demand signal for munitions manufacturers. The effort addresses long-standing concerns that reliance on a handful of legacy prime contractors has bottlenecked precision-munitions output. It comes as elevated global demand from Ukraine, the Middle East, and Indo-Pacific contingencies continues to strain existing production lines.","source":"Inside Defense","url":"https://insidedefense.com/"}]},"us":[{"headline":"Trump Directs Personal PAC Funds to Shore Up Vulnerable House and Senate Republicans","body":"President Trump has authorized millions of dollars from his personal political action committee to flow toward endangered congressional Republicans ahead of November, according to two people familiar with the plans. The move comes as senior campaign advisers privately concede that GOP control of both chambers is increasingly at risk. The shift marks a notable change in strategy less than three months before the midterms, with Republicans facing a tightening map in both the House and Senate.","source":"CNN","url":"https://www.cnn.com/2026/08/15/politics/trump-midterms-campaign-strategy"},{"headline":"White House Trade Report Names Canada, Mexico and EU as Top China Tariff-Dodging 'Enablers'","body":"A White House Office of Trade and Manufacturing Policy report titled 'The Great Transshipment Scam,' released this week, accuses more than 40 countries of helping Chinese exporters relabel goods to dodge U.S. tariffs, with Canada, Mexico, the EU, India, Japan and South Korea singled out as the biggest offenders. The administration estimates the scheme costs tens of billions of dollars in annual federal revenue, contributes to roughly 450,000 lost American jobs, and shaves $113-150 billion off U.S. GDP each year. Trade adviser Peter Navarro said the practice amounts to 'smuggling disguised as trade,' and the report signals stepped-up AI-assisted customs enforcement and warnings to trading partners.","source":"Al Jazeera / Epoch Times","url":"https://www.aljazeera.com/economy/2026/8/14/us-accuses-dozens-of-countries-of-helping-china-avoid-trumps-tariffs"},{"headline":"Judge Rejects Tohono O'odham Nation's Bid to Halt Border Wall on Reservation","body":"U.S. District Judge Richard Leon in Washington denied the Tohono O'odham Nation's request to block construction of 62 miles of border wall across part of its 2.8-million-acre reservation, ruling the tribe failed to show the wall would alter reservation boundaries without congressional authorization. Leon also rejected claims that the project constitutes illegal trespass. The ruling clears the way for continued wall construction despite the tribe's objections that it never consented to the project.","source":"Associated Press / Washington Times","url":"https://www.washingtontimes.com/news/2026/aug/15/judge-rejects-request-block-trump-admin-building-border-wall-along/"},{"headline":"Court Clears Path to End Deportation Protections for Nearly 1,100 Somalis","body":"A federal judge on Friday lifted a block on the Trump administration's move to terminate Temporary Protected Status for roughly 1,100 Somali nationals, finding that potential immigration enforcement alone does not create a protected liberty interest. The judge cited the Supreme Court's June 2026 decision in Mullin v. Doe in reaching her conclusion. The ruling is the latest in a string of decisions advancing the administration's broader push to narrow TPS eligibility nationwide, exposing affected Somalis to possible removal.","source":"TimesLIVE / YourNews","url":"https://www.timeslive.co.za/news/world/2026-08-15-us-judge-clears-way-for-trump-to-end-somalis-deportation/"}],"pacific":{"pacificCommand":[{"headline":"Seoul Arms K2 Tanks Against Drone Swarms","body":"South Korea unveiled an upgrade package for its K2 Black Panther main battle tank on August 16 that adds active protection systems specifically tuned to intercept first-person-view and loitering drones, a direct response to the tank losses NATO and Ukrainian forces have suffered to cheap unmanned systems. The move signals Seoul is retrofitting its armored fleet doctrine around drone survivability rather than treating it as an afterthought, with implications for how South Korean armor would fare in any renewed conflict with the North.","source":"Global Defense Corp","url":"https://www.globaldefensecorp.com/2026/08/16/japans-e-2d-aewc-links-australian-and-philippine-air-forces-in-an-emerging-indo-pacific-air-defence-network/"},{"headline":"Tokyo's Radar Planes Begin Stitching Together an Indo-Pacific Air Shield","body":"Reporting out August 16 describes Japan's E-2D Hawkeye airborne early-warning aircraft being used to link Australian and Philippine air defense pictures into a single emerging network. The arrangement would let the three US treaty allies share real-time air-track data across thousands of miles of the Indo-Pacific, deepening interoperability well beyond bilateral exercises and hinting at a more permanent multilateral air-defense architecture aimed at countering incursions in the region.","source":"Global Defense Corp","url":"https://www.globaldefensecorp.com/2026/08/16/japans-e-2d-aewc-links-australian-and-philippine-air-forces-in-an-emerging-indo-pacific-air-defence-network/"},{"headline":"Putin's Kuril Visit Reopens Japan's Northern Wound","body":"Vladimir Putin traveled to Iturup in the disputed Kuril Islands on Thursday, his first visit there as Russian president, a trip previously made only by then-president Dmitry Medvedev in 2010. Prime Minister Sanae Takaichi branded the visit 'absolutely unacceptable' and Foreign Minister Toshimitsu Motegi summoned Russia's ambassador in protest. The flare-up lands atop Japan's already strained ties with Beijing, where Chinese trade restrictions imposed since November remain in force, leaving Tokyo simultaneously sparring with Moscow, Beijing and Seoul.","source":"The Rio Times","url":"https://www.riotimesonline.com/asia-intelligence-brief-saturday-august-15-2026/"}],"pacingThreat":[{"headline":"PLA Sorties Keep Crossing the Taiwan Strait Median Line","body":"Taiwan's Ministry of National Defense reported that in the 24 hours leading up to 6 a.m. on August 15 it detected four PLA aircraft sorties, eight PLA Navy ships and one Chinese official vessel operating around the island, with three of the four aircraft sorties crossing the Taiwan Strait median line into the island's northern, central and eastern air defense identification zones. The steady daily drumbeat of incursions, tracked and published by Taipei's own defense ministry, illustrates how median-line crossings have become the routine baseline of PLA gray-zone pressure rather than an escalatory anomaly.","source":"GlobalSecurity.org / ROC Ministry of National Defense","url":"https://www.globalsecurity.org/wmd/library/news/taiwan/2026/taiwan-260815-roc-mnd01.htm"},{"headline":"Beijing's Trade Squeeze on Tokyo Drags Into a Fourth Month","body":"Regional intelligence roundups published August 15 note that Chinese trade restrictions against Japan, first imposed in November, remain in effect with no resolution in sight, even as Tokyo is simultaneously feuding with Russia over the Kurils and with Seoul. Analysts tracking corporate decision-making say the layered friction with Beijing is now a factor pushing manufacturers to relocate production lines out of North Asia entirely, treating the PRC trade lever as a persistent rather than temporary risk.","source":"The Rio Times","url":"https://www.riotimesonline.com/asia-intelligence-brief-saturday-august-15-2026/"},{"headline":"Lai Vows Faster Drone Rollout as Han Kuang Drills Wrap, US Tariffs Loom","body":"President William Lai used the conclusion of Taiwan's Han Kuang exercises on August 15 to call for accelerating the island's development of uncrewed systems and shoring up defense supply chains, capping a ten-day, nine-night drill cycle that tested reservist mobilization and wartime industrial resilience. The push comes just as Washington's newly announced 15 percent tariff on drones and drone components threatens to complicate Taiwan's own unmanned-systems buildup, forcing Taipei to balance industrial competitiveness against urgent defense procurement needs.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine's Flamingo Missile Hits Russian Rocket Factory Tied to Military Satellites","body":"Kyiv's long-range Flamingo cruise missile slammed into the Progress Rocket Space Centre in Samara overnight into August 15, damaging the plant that builds Soyuz-2 launch vehicles used to loft Russian military satellites, including the Rassvet constellation Moscow has built as its answer to Starlink. The strike is the latest sign Ukraine is willing to hit deep into Russian territory at facilities tied to space and reconnaissance capability, not just frontline logistics. It also fits a broader pattern of Kyiv using domestically produced weapons unconstrained by Western range limits to strike industrial targets hundreds of miles from the border.","source":"United24 Media","url":"https://united24media.com/war-in-ukraine"},{"headline":"July Was Deadliest Month for Ukrainian Civilians Since War's Start, as Kyiv Sees New Political Strain","body":"Fresh tallies show at least 437 Ukrainian civilians were killed and 2,610 wounded in July, a roughly 30 percent jump from June and the worst monthly toll since the earliest weeks of the 2022 invasion, driven by intensified Russian drone and missile barrages on cities. The grim numbers landed alongside renewed protests in Kyiv, where war veterans and activists demanded the reinstatement of a dismissed official and criticized President Zelensky's silence on the matter, reflecting growing friction between the government and its base even as the war grinds on with no ceasefire in sight.","source":"Kyiv Independent","url":"https://kyivindependent.com/"}],"europe":[{"headline":"NATO Spending Hits Record Pace as Hegseth Presses Allies and Reviews US Troop Posture","body":"New NATO figures show European allies and Canada are on track to spend around 634 billion dollars on defense in 2026, roughly 2.53 percent of combined GDP, with five member states already meeting the new 3.5 percent core-defense benchmark set at last year's Hague summit nearly a decade ahead of the 2035 deadline. The buildup comes as US Defense Secretary Pete Hegseth has pushed laggard allies to show a credible path toward the Hague targets and ordered a six-month Pentagon review of American force posture and basing in Europe, while suggesting Washington's own contributions could hinge on allies hitting their goals.","source":"Center for Strategic and International Studies","url":"https://www.csis.org/analysis/what-does-nato-defense-spending-look-heading-ankara-summit"},{"headline":"Frontex Data Undercuts EU Migration-Crisis Narrative, but Spain Still Under Pressure","body":"A Frontex report released August 14 found irregular crossings into the EU fell 37 percent in the first seven months of 2026 compared with a year earlier, contradicting the alarm raised by several capitals in recent weeks. The lone exception is the western Mediterranean route into Spain, where crossings rose about 37 percent to more than 11,000, a spike tied to the chaotic early-August surge of tens of thousands of migrants into the Ceuta enclave that left dozens dead and exposed deep rifts among EU governments over how to share the burden. The mismatch between the data and the political rhetoric is fueling accusations that migration is being used as a wedge issue ahead of EU border-policy fights this fall.","source":"EU News","url":"https://www.eunews.it/en/2026/08/14/in-2026-irregular-arrivals-fall-and-there-is-no-migrant-crisis-frontex-exposes-the-eu-countries-false-claims/"}]},"middleEast":[{"headline":"Netanyahu Rejects Trump's 15-Point Gaza Plan, Straining Ceasefire's Second Phase","body":"Hamas said Sunday it remains committed to implementing President Trump's 15-point framework for the ceasefire's second phase, including a firm timetable, but Israeli Prime Minister Netanyahu rejected the document outright at his cabinet meeting, insisting no IDF withdrawal will occur until Hamas is fully disarmed. The standoff leaves the core issues of troop pullback and postwar governance in Gaza unresolved, even though large-scale fighting has been paused since last year's truce.","source":"ABC News","url":"https://abcnews.com/International/live-updates/iran-live-updates-trump-deal-imminent-iran-oman/?id=135317231"},{"headline":"US and Iran Race to Extend Ceasefire Before Monday's Deadline","body":"With the 60-day, Islamabad-brokered US-Iran ceasefire due to expire August 17, Tehran confirmed Sunday that messages are moving through intermediaries, believed to include Oman and Pakistan, while insisting the exchange not be labeled formal negotiations. Pakistani officials mediating the talks say both sides have agreed in principle to extend the truce but are still working out how long the extension should last, keeping alive a fragile pause that followed February's Israeli-US strikes that killed Iran's supreme leader and much of its military leadership.","source":"Middle East Monitor","url":"https://www.middleeastmonitor.com/20260812-us-iran-agree-to-extend-60-day-ceasefire-ahead-of-aug-17-deadline/"},{"headline":"Unresolved Nuclear Dispute Looms Over Iran Ceasefire Deadline","body":"Behind the looming August 17 deadline sits an unsettled fight over Iran's nuclear program: assessments following the spring strikes suggested enrichment infrastructure was set back only by months rather than destroyed, and Iran has since suspended cooperation with IAEA inspectors. Washington continues to demand a 'zero enrichment' standard as the price of any lasting deal, a condition Tehran has so far refused, meaning the underlying dispute that triggered the war remains unresolved even as short-term truces get patched together.","source":"House of Commons Library","url":"https://commonslibrary.parliament.uk/research-briefings/cbp-10637/"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Investors Eye $2 Trillion IPO Valuation as Early as October","body":"A report circulating among Anthropic's investor base suggests the AI lab could seek a public listing valuing the company above $2 trillion, with a possible IPO window opening in October 2026. The figure would make Anthropic one of the most valuable companies ever to go public and underscores how aggressively capital is still chasing frontier AI labs even as scrutiny of the sector intensifies. The move follows Anthropic's recent hire of former California Supreme Court Justice Tino Cuellar as its first Chief Global Affairs Officer, a step widely read as preparation for tougher regulatory engagement in Washington.","source":"AI Market Watch","url":"https://www.ai-market-watch.com/news/category/funding"},{"headline":"DARPA Completes First Fully AI-Piloted F-16 Flight Test Program","body":"The Defense Advanced Research Projects Agency has wrapped up a testing program in which an F-16 fighter jet flew real-world sorties fully controlled by artificial intelligence with no human pilot aboard. The milestone caps years of autonomous-dogfighting research under DARPA's ACE program and signals the Pentagon is moving from simulation to live-flight validation of AI-driven combat aircraft. The development arrives as venture capital pours into defense-tech autonomy more broadly, with roughly $12.3 billion committed to defense startups building drones, autonomous vessels and battlefield AI in the first half of 2026 alone.","source":"AeroTime via imfounder.com","url":"https://imfounder.com/science-tech/ai/ai-updates-august-2026-openai-astra-deepmind/"}],"cyberEmerging":[{"headline":"AI Meeting-Notetaker Flaw Exposed Nearly 182,000 Recordings Including Government Calls","body":"Security researcher bobdahacker disclosed that tl;dv, an AI notetaker used with Zoom, Google Meet and Teams, left 181,874 meeting records tied to 84,312 users and over 35,000 email domains queryable by any authenticated user because of a missing tenant-isolation rule in its Firestore database. Roughly 1,000 records were fully public, 715 invitee emails were exposed, and active sessions from government agencies, universities and major tech firms were reportedly joinable by outsiders. The flaw was first reported in January 2026 but went unpatched through repeated follow-ups, highlighting how enterprise AI tools are outpacing basic data-isolation security practices.","source":"AI Weekly","url":"https://aiweekly.co/ai-news-today"},{"headline":"White House Meets Anthropic, OpenAI, Google and Meta on Unpublished AI Regulation Framework","body":"White House officials convened with executives from Anthropic, OpenAI, Google and Meta to negotiate the contours of a still-unpublished federal AI regulatory framework, according to reporting this week. The same-day timing of Anthropic naming a former Carnegie Endowment president as its first Chief Global Affairs Officer suggests frontier labs are staffing up for sustained regulatory pressure over the next 12 to 18 months rather than relying solely on voluntary self-governance. The talks come as both the EU AI Act's Article 50 transparency rules and California's SB 942 deepfake-labeling law became enforceable this month, forcing vendors serving both markets to scramble on compliance.","source":"imfounder.com","url":"https://imfounder.com/science-tech/ai/ai-updates-august-2026-openai-astra-deepmind/"}]},"cities":{"lasVegas":[{"headline":"Community fundraiser launches for family of slain LVMPD officer","body":"The Injured Police Officers Fund is organizing a fundraiser for the family of Officer Austin Abdelnabi, the 30-year-old Metro officer ambushed and killed while responding to a disturbance call near Tropicana Avenue and I-11 on August 4. Hundreds turned out for his funeral on August 14 at Central Church, and newly released bodycam footage has renewed public attention on the case as the investigation into shooter Angel Tywan Lucas Lindsey continues.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Lombardo's campaign cash edge doesn't guarantee 2026 win, analysts say","body":"Nevada political observers note that Governor Lombardo's fundraising lead in the gubernatorial race hasn't translated into a commanding polling advantage, largely because most voters have yet to tune into the contest. Strategists caution that heavy ad spending only moves the needle once the electorate starts paying closer attention closer to Election Day.","source":"Las Vegas Sun","url":"https://lasvegassun.com/"},{"headline":"Henderson police launch DUI crackdown as monsoon season complicates roads","body":"Henderson Police joined LVMPD, Nevada State Police and DPS Marshals for the 11th 'Joining Forces' distracted- and impaired-driving enforcement blitz, running from August 14 through September 1. The push comes as the National Weather Service flags a 20-30% chance of afternoon monsoon thunderstorms across the valley this week, adding to hazardous driving conditions already blamed for a fatal DUI crash involving 25-year-old Roberto Angel Navarro Rico.","source":"Fox5 Vegas / Las Vegas Review-Journal","url":"https://www.fox5vegas.com/news/"}],"nellis":[{"headline":"Col. Christine Littlejohn makes history as first woman to lead Nellis' 99th Air Base Wing","body":"Col. Christine Littlejohn officially assumed command of the 99th Air Base Wing at Nellis Air Force Base on July 17, becoming the first woman in the unit's history to hold the post. Littlejohn, who comes from a multi-generational military family with relatives who served in World War II, Vietnam and the post-9/11 wars, described the assignment as carrying 'a weight of responsibility' tied to that legacy. Her appointment comes as Nellis continues hosting high-tempo Red Flag and Weapons School exercises central to Air Combat Command's readiness mission over the Nevada Test and Training Range.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/military/at-nellis-new-wing-commander-carries-on-generations-of-military-service-3864688/"}]},"feelGood":[{"headline":"Las Vegas rallies behind fallen officer's family","body":"The Injured Police Officers Fund is organizing a community fundraiser to support the family of Officer Austin Abdelnabi, killed in the line of duty on August 4 while responding to a call near Tropicana Avenue. Hundreds of residents, officers and strangers turned out for his funeral service on August 14, a show of solidarity that has since translated into donations aimed at helping his wife and children.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"Nellis airmen open doors to give foster teens a taste of Air Force life","body":"Airmen from the 857th Aircraft Maintenance Squadron at Nellis Air Force Base hosted an 'Airman for a Day' program, giving local foster teens ages 14 to 17 a hands-on base tour and exposure to Air Force careers. Organizers said the goal was to give young people who often lack stable mentorship a sense of community, purpose and possibility beyond their circumstances.","source":"DVIDS","url":"https://www.dvidshub.net/unit/NAFB"},{"headline":"ID tags of long-lost WWII-era airman reunited with family at Nellis","body":"In a small but poignant ceremony at Nellis Air Force Base, the recovered identification tags of Capt. Eric James Huberth, an F-4 Phantom II weapons officer, were formally returned to his surviving family members decades after his loss. The reunion offered the family long-awaited closure and underscored the military's enduring commitment to never leaving its own behind.","source":"DVIDS","url":"https://www.dvidshub.net/unit/NAFB"}],"onThisDay":[{"year":"1977","event":"Elvis Presley, the King of Rock and Roll, died at his Graceland mansion in Memphis, Tennessee."},{"year":"1960","event":"Cyprus gained independence from British colonial rule, becoming a sovereign republic."},{"year":"1780","event":"British forces decisively defeated the Continental Army at the Battle of Camden during the American Revolutionary War."},{"year":"1812","event":"American General William Hull surrendered Detroit to British and Native American forces without a fight during the War of 1812."}]},"topPicks":[{"headline":"Middle East Flares Again: Deadliest Lebanon Strikes Since Ceasefire, Houthi Missile Barrage, and Hormuz Shipping Collapse","teaser":"Escalating strikes, missile attacks and a shipping crisis in the Strait of Hormuz threaten to unravel regional stability."},{"headline":"Netanyahu Rejects Trump's 15-Point Gaza Plan, Straining Ceasefire's Second Phase","teaser":"Israel's rejection of the US-backed peace framework jeopardizes fragile progress toward ending the Gaza conflict."},{"headline":"US and Iran Race to Extend Ceasefire Before Monday's Deadline","teaser":"A looming deadline and unresolved nuclear disputes could reignite direct confrontation between Washington and Tehran."}]},"navDates":[{"key":"2026-08-22","label":"Aug 22","href":"/","isNewest":true},{"key":"2026-08-20","label":"Aug 20","href":"/archive/2026-08-20.html","isNewest":false},{"key":"2026-08-19","label":"Aug 19","href":"/archive/2026-08-19.html","isNewest":false},{"key":"2026-08-18","label":"Aug 18","href":"/archive/2026-08-18.html","isNewest":false},{"key":"2026-08-17","label":"Aug 17","href":"/archive/2026-08-17.html","isNewest":false},{"key":"2026-08-16","label":"Aug 16","href":"/archive/2026-08-16.html","isNewest":false},{"key":"2026-08-15","label":"Aug 15","href":"/archive/2026-08-15.html","isNewest":false}],"currentKey":"2026-08-16","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-08-16.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
