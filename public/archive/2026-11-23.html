<script>
const STATE = {"digest":{"date":"Monday, November 23, 2026","generatedAt":"Mon, Nov 23, 1:23 PM PST","breaking":{"headline":"NATO Convenes Emergency Session After Russian Missiles Breach Polish Airspace","body":"NATO's North Atlantic Council met in Brussels on Monday after Polish prosecutors confirmed that three Russian Kh-101 cruise missiles crashed in the Podkarpackie and Lublin regions on November 20 during a large-scale Russian strike on Ukraine. Secretary General Mark Rutte pledged that the alliance would 'defend every inch of Polish territory,' and the Council approved sending an AWACS early-warning aircraft to reinforce Poland's airspace monitoring. Supreme Allied Commander Europe Gen. Alexus Grynkewich is now assessing whether additional forces and air-defense assets are needed along NATO's eastern flank, even as Warsaw chose not to invoke formal Article 4 consultations.","source":"Defence Matters","url":"https://defencematters.eu/nato-eastern-flank-air-defence-russian-missiles-poland/"},"tabs":{"defense":{"defense":[{"headline":"Pentagon Restricts Defense Ties With Canada Amid Annexation Row","body":"Defense Secretary Pete Hegseth has quietly imposed new restrictions on US-Canada defense cooperation, according to officials familiar with the directive, deepening a rift with Ottawa that has been inflamed by President Trump's repeated threats to annex Canada. Canadian Defence Minister David McGuinty said at the Halifax International Security Forum that Ottawa learned of the move only through press reports and has not yet seen the memo or detected operational changes. The friction complicates a partnership central to NORAD and Arctic security just as Canada pursues its own 'middle powers' procurement strategy to diversify away from reliance on US suppliers.","source":"FDD Overnight Brief","url":"https://www.fdd.org/overnight-brief/november-23-2026/"},{"headline":"Trump Signals Possible Return to Iran Strikes After New Year","body":"President Trump said Sunday that Iran fired more missiles and drones at regional targets over the past week than at any point in more than a year, though US forces intercepted them without damage. In a Fox News interview, he said he is inclined to resume major strikes on Iran after the New Year if negotiations fail, and tied Tehran's rising aggression to Republican midterm losses. Iran's government responded Monday by vowing to use 'every means' to counter the United States, raising the stakes for renewed confrontation.","source":"The Verardo Group Daily Brief","url":"https://theverardogroup.substack.com/p/tvg-daily-brief-23-nov-2026"},{"headline":"Allies Eye Joint Defense Production as 'Buy National' Pressures Mount","body":"At the Halifax International Security Forum this weekend, US, Canadian, German and Japanese officials discussed scaling multinational defense manufacturing even as domestic politics push governments toward national-only suppliers. Sen. Andy Kim (D-NJ) argued Washington needs allied partners to rebuild shipbuilding capacity and secure critical-mineral supply chains to compete with China. Sen. Tim Kaine also floated using munitions co-production deals as leverage in budget talks, as a proposed $350 billion defense reconciliation package remains stalled and is likely to slip into the next Congress.","source":"Inside Defense","url":"https://insidedefense.com/insider/insider-daily-digest-november-23-2026"}],"acquisitions":[{"headline":"BAE Systems Taps Leonardo DRS for Next-Gen THAAD Interceptor Seeker","body":"BAE Systems has contracted Leonardo DRS to develop a next-generation seeker for the US Army's Terminal High Altitude Area Defense interceptor, aiming to sharpen target discrimination against more sophisticated ballistic missile threats. The award reflects a Pentagon push to modernize fielded missile-defense interceptors already deployed across the Indo-Pacific and Middle East rather than launch a costly new program. Contract value was not disclosed in initial reporting.","source":"The Defense Post","url":"https://thedefensepost.com/latest/"},{"headline":"Army Seeks $1.6 Billion for Cruise-Missile Defense Despite Interceptor Gaps","body":"The US Army is requesting roughly $1.6 billion for Increment 2 of its Indirect Fire Protection Capability program, meant to shield fixed and semi-fixed installations from cruise missiles and drones, even though officials concede the effort still lacks a sufficiently mature interceptor. The request underscores growing urgency around base air defense following repeated drone and missile incursions against US and allied sites this year, including the recent Kh-101 incidents in Poland. Program managers are weighing interceptor alternatives as they balance near-term fielding against technical risk.","source":"Defense WarRoom","url":"https://defensewarroom.com/"}]},"us":[{"headline":"Democrats Lock In Historic House Majority as Jeffries Nears Speakership","body":"A Tuesday special win for Democrat Chuck Hubbard over Republican incumbent Virginia Foxx in North Carolina pushed the incoming House Democratic caucus to at least 258 seats, which would be the largest House majority of the 21st century, with four races still uncalled. Hakeem Jeffries is positioned to become the first Black Speaker of the House as Democrats also prepare to take control of the Senate with their largest majority in 16 years. The scale of the midterm wave is reshaping Washington's power balance just as the new Congress organizes for January.","source":"Washington Post / NBC News","url":"https://www.washingtonpost.com/politics/"},{"headline":"Trump Inserts Himself Into Senate Democratic Leadership Fight","body":"President Trump used a Truth Social post on Sunday to say it would be difficult for him to work with Chuck Schumer, stopping short of explicitly endorsing Maryland Senator Chris Van Hollen's challenge for Senate Democratic leader. The intervention comes as Van Hollen and Senator-elect Abdul El-Sayed of Michigan publicly jockey for influence in a caucus about to hold its largest majority in 16 years. Trump, fresh off his first news conference since the midterm losses, also signaled he would use his veto power against the incoming Democratic Congress while leaving room for deals on issues like super PAC spending.","source":"Washington Post / NBC News Meet the Press","url":"https://www.washingtonpost.com/politics/"},{"headline":"Venezuelan TPS Fight Returns to Ninth Circuit After Administration Pulls Back From Supreme Court","body":"The Trump administration withdrew its emergency application to the Supreme Court on November 19 after the Ninth Circuit extended a stay blocking restoration of Temporary Protected Status for Venezuelan nationals, marking the administration's third trip to the justices on this issue this year. Solicitor General D. John Sauer told the court the appellate stay gave the government the relief it needed for now, but he reserved the right to return immediately if the Ninth Circuit rules against the administration. The underlying dispute affects hundreds of thousands of Venezuelans and up to 332 pending removal orders, with no new work authorizations issued while litigation continues.","source":"SCOTUSblog / Al Jazeera","url":"https://www.scotusblog.com/2026/11/trump-administration-asks-supreme-court-to-block-lower-court-ruling-keeping-protected-status-in-/"},{"headline":"New York Fed's Williams Signals More Rate Hikes as Inflation Runs Hot","body":"New York Fed President John Williams said Monday that persistently elevated inflation is pushing the central bank toward tighter policy, with markets now pricing in a quarter-point rate hike next month from the current 3.75%-4.00% range. Williams projected inflation ending 2026 near 3.5% before easing toward the Fed's 2% target only by 2028, while forecasting GDP growth of 2.75% in both 2026 and 2027 and unemployment drifting down to around 4% next year. The remarks land just before Wednesday's release of October PCE inflation data and a revised third-quarter GDP estimate, reports that will shape the Fed's December decision.","source":"Reuters","url":"https://investing.com/news/economy-news/fed-has-work-to-do-to-lower-inflation-williams-says-5046374"}],"pacific":{"pacificCommand":[{"headline":"Tokyo Ruling Bloc Pushes Back on Defense Budget Ceiling","body":"Japan's ruling coalition is resisting a government plan to cap the new five-year defense-spending plan (FY2027-31) at roughly 60 trillion yen, with lawmakers pushing for a figure closer to 70 trillion yen. They warn that about 16.8 trillion yen in installment payments on previously ordered equipment will eat into the budget, crowding out new procurement even though the ceiling would still be well above the current plan's 43 trillion yen. Defense Minister Shinjiro Koizumi says 50-60 trillion yen would be inadequate for Japan's security needs and could draw criticism from Washington, while the Defense Ministry has already warned contractors that missile and warship orders may be scaled back from initial estimates ahead of a year-end revision of Japan's security documents.","source":"Jiji Press / Nikkei Asia","url":"https://jen.jiji.com/japan/politics/2026112100420"},{"headline":"Australia Defends AUKUS After US Navy Capacity Warning","body":"Australian Defence Minister Richard Marles on Sunday rejected a US Congressional Budget Office finding that transferring Virginia-class submarines to Australia under AUKUS would shrink the US Navy's own attack-submarine fleet for years. Marles said the CBO was wrong and that American production rates are improving, reaffirming Canberra's roughly A$368 billion (about US$243 billion) three-decade commitment to the program. Australia still expects its first nuclear-powered boats from the US in the early 2030s before Australia and Britain jointly build a new SSN-AUKUS class.","source":"Reuters / gCaptain","url":"https://gcaptain.com/australia-criticizes-us-congressional-budget-office-over-aukus-comments/"},{"headline":"Seoul, Tokyo Deepen Military Exchanges With Navy Chief Visit","body":"South Korea's Chief of Naval Operations, Admiral Kim Kyung-ryul, traveled to Japan on November 22-23 for high-level talks with Japan Maritime Self-Defense Force counterparts, continuing a recent run of senior bilateral exchanges. That followed a three-day visit by ROK Army Chief of Staff Kim Gyu-ha from November 11-13, during which he met Japan's Joint Staff and Ground Self-Defense Force chiefs to pursue closer army-to-army cooperation. The visits build on a bilateral meeting between the two countries' defense ministers on the sidelines of last month's ASEAN Defence Ministers' Meeting-Plus in the Philippines.","source":"SBS News","url":"https://news.sbs.co.kr/english/article.do?news_id=N1008855589"}],"pacingThreat":[{"headline":"Xi's PLA Purge Reaches Theater Commanders, Clouding Invasion Readiness","body":"Fresh reporting this week details how Xi Jinping's sweeping anti-corruption purge of the PLA has now removed all four theater commanders, including the operational leadership of the Eastern Theater Command that would run any Taiwan campaign, on top of the earlier dismissal of Central Military Commission Vice Chairman Zhang Youxia. Analysts note the purge has gone so deep that numerous senior posts, particularly in the PLA Navy, remain vacant with no replacements named, leaving few experienced officers available to plan or execute complex operations. Admiral Hu Zhongming, Navy commander since December 2023, is cited as one of the few senior figures still standing.","source":"The Maritime Executive","url":"https://maritime-executive.com/article/xi-jinping-completes-his-military-purge-including-pla-navy-s-top-admirals"},{"headline":"China, Vietnam Complete 41st Joint Naval Patrol Despite Sea Dispute","body":"Chinese and Vietnamese naval vessels wrapped up their latest joint anti-submarine patrol in the Gulf of Tonkin on Saturday, the 41st such exercise since the two navies began the practice in 2006, averaging about two patrols a year. The drill went ahead even as Beijing and Hanoi remain at odds over overlapping South China Sea claims, and just weeks after Vietnam and the United States held a defense-policy dialogue in Washington covering maritime security and defense-industry cooperation. The patrol illustrates Beijing's pattern of managing bilateral friction through military channels even while pressing broader claims elsewhere in the sea.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3375372/pla-anti-submarine-ships-conduct-south-china-sea-patrol-vietnamese-navy"},{"headline":"Taiwan Logs Fresh PLA Incursions as Beijing Expands Legal Pressure","body":"Taiwan's Ministry of National Defense tracked 12 Chinese naval vessels and six military aircraft around the island in the 24 hours ending Monday morning, with five of the aircraft crossing the Taiwan Strait median line into the island's southwestern and eastern air defense identification zone. Taipei says it has now recorded 260 Chinese aircraft sorties and 211 ship movements so far this month alone, prompting deployments of its own jets, ships and coastal missile units to monitor the activity. Separately, Taiwan's Mainland Affairs Council warned Monday that a new Chinese law formally folds the island into Beijing's ethnic-affairs apparatus, allowing authorities to brand anyone who does not support unification as undermining ethnic unity, a move officials called an escalation of political and legal pressure short of armed conflict.","source":"Taiwan News / Taipei Times","url":"https://www.taiwannews.com.tw/news/6479960"}]},"europe":{"ukraineRussia":[{"headline":"Russia Pounds Kyiv Region With Massive Drone-Missile Barrage, Scores Dead or Missing","body":"A Russian drone strike on an apartment building in Dymer, in the Kyiv region, killed at least two people and wounded four, with Zelenskyy saying 14 others were unaccounted for as rescuers dug through rubble. The attack was part of a broader barrage that saw Russia launch 186 long-range strike drones overnight, including 72 jet-powered variants, while also hitting power infrastructure that triggered outages across five Ukrainian regions. Zelensky said Russian forces have hit 20 oblasts with roughly 2,700 long-range drones, nearly 1,460 glide bombs, and 165 missiles over the past week alone, underscoring an intensifying campaign against civilian and energy targets as peace negotiations remain stalled.","source":"Kyiv Post / ISW","url":"https://www.kyivpost.com/post/90867"},{"headline":"Ukraine's Drone Units Hit Record Numbers, Extend Reach to Libya and Southern Russia","body":"Ukraine's Unmanned Systems Forces set a new daily record on November 22, striking 808 Russian soldiers in a single day — 293 killed and 515 wounded — out of 2,552 targets engaged, 867 of which were destroyed. Separately, Ukrainian forces struck two Russian naval vessels near Benghazi, Libya, destroying at least one, while other drones hit a Russian National Guard regional headquarters in Krasnodar and military infrastructure elsewhere in Krasnodar Krai. The expanding geographic reach of Ukrainian strikes, paired with a Russian jet-powered drone twice violating Moldovan airspace on November 21, points to a conflict spilling further beyond Ukraine's borders even as diplomatic channels remain active.","source":"Militarnyi / ISW","url":"https://militarnyi.com/en/news/third-800-record-this-month-ukraine-s-unmanned-systems-forces-strike-808-russian-troops-in-a-single-day/"}],"europe":[{"headline":"Pentagon Scales Back Planned Troop Cuts in Europe as NATO Spending Rises","body":"The Trump administration is preparing to reduce its roughly 80,000 troops stationed across Europe by a smaller margin than allies had feared, according to people familiar with internal deliberations. European governments had braced for cuts of up to 25,000 personnel, but Washington has grown more favorable toward a smaller drawdown as NATO members ramp up defense investment. The shift follows the 2025 Hague Summit commitment to raise alliance-wide spending to 5% of GDP by 2035, with European members and Canada already adding more than $139 billion in defense outlays by mid-2026.","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-11-14/pentagon-eyes-smaller-troop-cuts-across-europe-in-reversal"},{"headline":"Dublin Migration Declaration Signals Hardening EU Consensus on Returns","body":"Forty-one European leaders and senior officials endorsed a joint declaration after the European Political Community summit in Dublin, calling for tighter cross-border intelligence sharing, deeper cooperation with origin and transit countries, and faster deportations. Led by the UK, Denmark and Italy and backed by Commission President Ursula von der Leyen, the statement comes as EU data shows irregular entries have more than halved over two years and asylum applications fell 17% year-on-year in the first half of 2026, even as returns rose 22% in 2025. Separately, five EU countries are reportedly exploring plans to send migrants to Rwanda, while thousands protested in Portugal, France and Spain over wages and public services, reflecting the broader economic anxiety fueling the continent's rightward migration politics.","source":"Euronews / European Times","url":"https://europeantimes.news/2026/11/european-leaders-back-tougher-migration-coordination/"}]},"middleEast":[{"headline":"Iran Flaunts Underground 'Missile City' as Trump Threatens New Strikes","body":"Iranian state media released footage of Islamic Revolutionary Guard Corps commanders touring a sprawling underground facility showcasing a new dual-missile launcher, a signal that Tehran retains strike capability despite the earlier 2026 war with Israel and the US. Trump told Fox News he is inclined to launch a renewed offensive against Iran if no deal is reached by the new year, adding that Tehran has shown no real interest in terms he could accept. Iran has begun rolling power cuts nationwide as war-damaged infrastructure deepens an energy crunch, even as Israeli military intelligence has privately warned Netanyahu that a unilateral strike on Iran could ignite a wider multifront war involving Lebanon, Syria and Gaza.","source":"Times of Israel / AP","url":"https://www.timesofisrael.com/liveblog-november-22-2026/"},{"headline":"Settler Arson Attacks Sweep Four West Bank Villages","body":"Israeli authorities opened an investigation after Palestinian vehicles and property were set ablaze in four occupied West Bank villages — Deir as-Sudan, Deir Abu Mashaal, Kafr Malik and Al-Tuwani — in a coordinated wave of settler violence. The attacks drew condemnation from a political rival of Prime Minister Netanyahu, who described the incidents as 'Jewish terrorism,' intensifying domestic criticism of the government's handling of settler violence. The unrest adds to friction over West Bank security just as Israeli officials weigh escalation against Iran, a combination intelligence officials fear could overstretch Israel's security apparatus.","source":"CNN","url":"https://www.cnn.com/world/middle-east"},{"headline":"Gaza Deaths Continue Amid Ceasefire Strains and Humanitarian Collapse","body":"Israeli forces killed at least two Palestinians in separate incidents in Gaza on November 22, including one man shot in Jabalia, according to the Palestinian news agency Wafa. In a separate strike, an Israeli airstrike hit a truck carrying food, killing three men; the Israeli military said it had targeted Islamic Jihad militants. The violence comes as nearly 2 million displaced Palestinians shelter in deteriorating conditions, with recent storms flooding tent camps in Deir al-Balah and Al-Mawasi, underscoring how the nominal ceasefire has failed to resolve Gaza's humanitarian emergency.","source":"Middle East Eye / AP","url":"https://www.middleeasteye.net/live-blog/live-blog-update/two-palestinians-killed-israeli-fire-northern-and-central-gaza"}],"techAI":{"aiCompetition":[{"headline":"OpenAI ships GPT-6.2 Astra and Sol, crossing new safety thresholds","body":"OpenAI released two new frontier models, GPT-6.2 Astra and Sol, while cutting Astra's API pricing by about 20 percent to pressure rivals. The company says Astra is the first model it has shipped that crosses its internal 'High' self-improvement risk threshold, and that both models hit the 'Critical' tier on its cybersecurity risk scale, triggering additional safeguards. Separately, UK government red-teamers reportedly found the pre-release version of Astra easier to jailbreak than prior models, raising fresh questions about how fast capability gains are outpacing safety testing.","source":"Cybersecurity Institute","url":"https://www.cybersecurityinstitute.com/blog/?p=6314"},{"headline":"Amazon nears $7.5 billion deal for AI startup Decart","body":"Amazon is closing in on a roughly $7.5 billion acquisition of generative-AI startup Decart, a move that signals accelerating consolidation among well-capitalized tech giants and smaller AI labs. The deal would give Amazon another in-house AI asset as it competes with Microsoft, Google, and Anthropic's backers for compute, talent, and enterprise customers. It lands amid a broader wave of multibillion-dollar AI tie-ups and comes as markets digest a sharp tech sell-off that hit Nvidia and Anthropic shares this week.","source":"Rio Rundown","url":"https://riorundown.substack.com/p/ai-news-nov-22-2026-autonomous-systems"}],"cyberEmerging":[{"headline":"AI inference providers caught letting prompts leak for months","body":"OpenRouter announced on November 22 that it had cut ties with three AI inference providers and stripped 125 endpoints of 'Zero Data Retention' status after researchers found attackers had been copying customer prompts for as long as four months without detection. Alarmingly, some of the compromised requests were specifically marked under privacy settings meant to guarantee prompts are never stored, exposing a blind spot in how enterprises vet AI supply-chain vendors. Industrial cybersecurity firm Dragos, which flagged the breach using canary tokens, says none of the three providers detected the intrusion on their own.","source":"AI News Digest","url":"https://aienews.org/digest/2026-11-22/"},{"headline":"Senators warn AI-driven hacking is outpacing US cyber defenses","body":"Senators Mark Warner and Mike Rounds sent a letter to the White House on November 22 warning that state-linked hackers are increasingly automating intrusions with AI, faster than federal defenses can adapt. The bipartisan pair pressed the administration to deploy AI-enabled defensive tools across government networks, arguing current protections lag behind adversary capabilities. Their warning lands awkwardly for the White House, which has simultaneously cut cybersecurity staffing and grant funding for state and local governments even as FBI-reported cyber incidents have climbed toward roughly 1 million annually.","source":"Wisevoter","url":"https://wisevoter.com/world/us/2026/11/22/senators-warn-ai-cyber-threats-outpace-us-defenses"}]},"cities":{"lasVegas":[{"headline":"F1 Las Vegas Grand Prix Wraps Fourth Year With $800M Economic Boost","body":"The fourth annual Formula 1 Las Vegas Grand Prix concluded this weekend with another sellout crowd, and early estimates put the event's economic impact on Southern Nevada at roughly $800 million. Track teardown along the Strip began immediately and is expected to continue through the end of the year, per the Review-Journal. The race has become a fixture of the local calendar despite ongoing debate over its disruption to residents and businesses.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/business/"},{"headline":"Major Strip Casino Operator Drops Problem-Gambling Group Over Kalshi Ties","body":"One of the Strip's largest casino operators, along with its co-owned online sportsbook brand, cut ties with a national problem-gambling advocacy organization this weekend after the group's association with prediction-market platform Kalshi came under fire. The move highlights growing industry tension over whether prediction markets for sports outcomes should be treated like traditional wagering. It's the latest flashpoint in a broader national fight between legal sportsbooks and unregulated prediction-market exchanges.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Clark County School District Teacher Pipeline Shrinks","body":"The Clark County School District is hiring fewer new teachers even as the overall number of classroom teaching positions shrinks, while charter schools under the State Public Charter School Authority aren't absorbing the teachers CCSD is losing. Education reporters describe a 'waning path' for aspiring local teachers trying to break into the profession. The trend raises fresh concerns about long-term staffing stability in Nevada's largest school district heading into 2027.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"}],"nellis":[{"headline":"Nellis AFB Retires Its Last A-10 Thunderbolt as F-47 Campus Takes Shape","body":"Nellis Air Force Base marked the departure of its final A-10 Thunderbolt II this week, closing a decades-long chapter of close air support flying out of the Las Vegas-area installation. The retirement comes as the Air Force simultaneously pushes forward on a roughly $1 billion 'F-47 Future Campus' at Nellis, meant to host hangars, labs and maintenance facilities for operational testing of Boeing's new sixth-generation fighter by 2031. Nellis's proximity to Creech AFB's Collaborative Combat Aircraft drone unit and the vast Nevada Test and Training Range positions the base as a central hub for next-generation airpower integration.","source":"Nellis Air Force Base / Air & Space Forces Magazine","url":"https://www.airandspaceforces.com/air-force-billion-dollar-campus-testing-f-47-nellis/"}]},"feelGood":[{"headline":"Stranger Mows Deployed Soldier's Lawn for Free Until He Comes Home","body":"26-year-old Ethan Horne heard that a local woman's husband had been deployed overseas for a year, so he showed up and offered to cut her grass for free the entire time he's gone. The quiet gesture, reported this week, is the kind of unprompted neighborly support that military families often rely on during long separations. It's a small but telling reminder that communities still show up for service members' loved ones without being asked.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Father Sprints Onto Train Tracks to Save Trapped Elderly Man","body":"During a family birthday outing in Florida, a father rushed onto railroad tracks to free an elderly man whose walker had gotten stuck just as a high-speed train approached. The split-second decision turned what should have been a routine family day into a life-or-death rescue, with the man pulled to safety moments before the train passed. The story, which circulated widely last week, is being held up as an example of ordinary people stepping into extraordinary danger for a stranger.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"6-Year-Old and His Goats Raise $15,800 for Shelter Dogs After Losing His Own","body":"After his Dalmatian named Brody died, 6-year-old Buddy sat by the roadside with his pet goats and a handmade sign asking for help for other dogs in shelters. Strangers moved by the boy's grief and generosity ended up donating more than $15,800 earmarked for rescue dogs. The outpouring, reported in mid-November, shows how a child's simple act of kindness toward animals he'd never meet resonated far beyond his own neighborhood.","source":"Good News Dose","url":"https://goodnewsdose.com/good-news-this-week/"}],"onThisDay":[{"year":"1963","event":"The BBC aired the first episode of the science-fiction series Doctor Who."},{"year":"1936","event":"Life magazine published its first issue as a weekly photo-journalism publication."},{"year":"1992","event":"IBM released the Simon Personal Communicator, widely regarded as the first smartphone."},{"year":"1980","event":"A devastating 6.9-magnitude earthquake struck Italy's Irpinia region, killing nearly 2,500 people."}]},"topPicks":[{"headline":"NATO Convenes Emergency Session After Russian Missiles Breach Polish Airspace","teaser":"Alliance leaders scramble to respond after Russian missiles crossed into Polish territory, raising fears of direct NATO-Russia confrontation."},{"headline":"Pentagon Restricts Defense Ties With Canada Amid Annexation Row","teaser":"Washington curtails military cooperation with Ottawa as a bizarre annexation dispute strains the decades-old alliance."}]},"navDates":[{"key":"2026-11-27","label":"Nov 27","href":"/","isNewest":true},{"key":"2026-11-26","label":"Nov 26","href":"/archive/2026-11-26.html","isNewest":false},{"key":"2026-11-25","label":"Nov 25","href":"/archive/2026-11-25.html","isNewest":false},{"key":"2026-11-24","label":"Nov 24","href":"/archive/2026-11-24.html","isNewest":false},{"key":"2026-11-23","label":"Nov 23","href":"/archive/2026-11-23.html","isNewest":false},{"key":"2026-11-22","label":"Nov 22","href":"/archive/2026-11-22.html","isNewest":false},{"key":"2026-11-21","label":"Nov 21","href":"/archive/2026-11-21.html","isNewest":false}],"currentKey":"2026-11-23","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-23.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
