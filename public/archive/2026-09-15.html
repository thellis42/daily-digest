<script>
const STATE = {"digest":{"date":"Tuesday, September 15, 2026","generatedAt":"Tue, Sep 15, 7:19 AM PDT","breaking":{"headline":"NATO Jets Down Drone Over Lithuania in First-Ever Alliance Intercept Over Member Airspace","body":"Italian Air Force Eurofighter Typhoons flying NATO's Baltic Air Policing mission shot down an unidentified drone that crossed into Lithuania from the direction of Belarus shortly after midnight on September 15, the first time the alliance has destroyed an aerial object over a member state's territory. The drone lingered roughly 30 minutes, passing near Vilnius before being downed close to Pratkunai village in the Kaunas region; its operator and origin remain unconfirmed. The incident came less than a day after NATO chief Mark Rutte warned that strikes near allied territory would only deepen alliance support for Ukraine, highlighting how spillover from Russia's war is straining NATO's eastern-flank air defenses.","source":"NPR","url":"https://www.npr.org/2026/09/15/g-s1-143284/nato-jets-down-drone-in-lithuanian-airspace"},"tabs":{"defense":{"defense":[{"headline":"Air Force Completes Vertical Assembly of First Sentinel ICBM","body":"The U.S. Air Force finished vertical assembly of the first LGM-35A Sentinel intercontinental ballistic missile, a key hardware milestone ahead of a planned 2027 flight test. The Sentinel program, meant to replace the aging Minuteman III fleet, has been dogged by cost overruns and schedule slips, making this assembly step a closely watched proof point for the nuclear modernization effort.","source":"Army Recognition","url":""},{"headline":"Pentagon Runs 21 Companies Through Falcon Peak 26.2 Counter-Drone Trials","body":"The Department of Defense put 21 defense contractors through the Falcon Peak 26.2 exercise this week to test counter-drone systems meant to shield U.S. military installations from hostile unmanned aircraft. The trial reflects mounting Pentagon concern over repeated drone incursions near domestic bases and the need to field layered, cost-effective defenses quickly.","source":"Army Recognition","url":""},{"headline":"KNDS Moves to Fold Lightweight 105mm Gun Into Poland's Defense Network","body":"Franco-German manufacturer KNDS is laying groundwork to integrate its lightweight 105mm artillery gun into Poland's domestic defense industry and link it to the country's TOPAZ battlefield-management network. The move is part of a broader allied push to localize production of NATO-interoperable weapons systems along the alliance's eastern flank as Warsaw expands its own defense-industrial base.","source":"The Defense Post","url":"https://thedefensepost.com/"}],"acquisitions":[{"headline":"Navy Awards Boeing First MQ-25A Stingray Production Contract","body":"The U.S. Navy issued Boeing its first production contract for the MQ-25A Stingray unmanned aerial refueling drone, shifting the program from development into low-rate initial production. The award advances the Navy's plan to hand off carrier-based aerial-refueling duties from manned F/A-18 Super Hornets to unmanned tankers, extending the range of carrier strike fighters.","source":"Army Recognition","url":""},{"headline":"Pentagon Puts $450 Million Into Elmet Group to Cut China Reliance","body":"The Department of War announced on September 14 a $450 million investment in The Elmet Group, structured as redeemable preferred equity through the Industrial Base Analysis and Sustainment program. The deal targets materials used in missile and submarine programs and reflects the Pentagon's growing use of equity-style investments to secure domestic suppliers of critical minerals and specialty components.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/u-s-invests-450-million-in-elmet-to-reduce-china-reliance-for-missile-and-submarine-programs"}]},"us":[{"headline":"Supreme Court Blocks Trump-Era Mail Ballot Restrictions for 2026 Midterms","body":"In a Monday ruling, the Supreme Court sided with a coalition of Democratic-led states and the District of Columbia, refusing to let a new Postal Service rule restricting mail ballot handling take effect before November's midterms. Only Justices Alito and Thomas dissented, while Justice Kavanaugh wrote separately to say the Postal Service likely has the underlying authority but that election officials lacked enough time to implement the change fairly this cycle. The decision leaves the broader legal question of the rule's validity unresolved, meaning the fight could resurface in future election cycles even as mail voting proceeds unchanged this fall.","source":"Votebeat","url":"https://www.votebeat.org/national/2026/09/15/trump-mail-voting-executive-order-supreme-court-decision-2026-election/"},{"headline":"McConnell Returns to Senate After Three-Month Absence","body":"Senate Republican Mitch McConnell, 84, showed up to cast votes on Monday for the first time since June 11, arriving in a wheelchair after an extended recovery. In a statement, McConnell attributed part of his difficult rehabilitation to lingering effects of childhood polio. The Kentucky lawmaker, the longest-serving Senate leader in history, had already announced in 2024 that he would not seek to reclaim a leadership post after suffering a series of public falls.","source":"Public News Service","url":"https://kiowacountypress.net/content/daily-audio-newscast-september-15-2026"},{"headline":"Fed Opens Two-Day Meeting With Rate Hike Now in Play","body":"The Federal Open Market Committee began its September 15-16 meeting today, with markets bracing for a possible quarter-point rate increase after Chair Kevin Warsh struck a hawkish tone at Jackson Hole, citing PCE inflation running near 3.7 percent. That would mark a reversal from the Fed's July hold, when policymakers kept the benchmark rate at 3.50-3.75 percent despite three dissenting regional presidents pushing for a hike. Energy-cost pressure tied to the ongoing Iran conflict has added to inflation concerns even as headline CPI cooled to 3.4 percent in July, setting up a consequential decision and updated dot-plot projections due Wednesday afternoon.","source":"Chase / Cambridge Currencies","url":"https://cambridgecurrencies.com/next-federal-reserve-interest-rate-decision/"},{"headline":"Kennedy Center Board Warns Institution Is in Financial and Physical Crisis","body":"Board resolutions made public Monday describe the Kennedy Center as facing a dire financial and physical state, asserting that only President Trump can rescue the arts institution. The disclosure comes amid ongoing renovation work visible at the center since earlier this year and follows the administration's push for greater control over its programming and branding. The resolutions add fuel to an already contentious debate over the president's influence on the once-independent cultural institution.","source":"NPR","url":"https://www.npr.org/sections/politics/"}],"pacific":{"pacificCommand":[{"headline":"Japan Weighs Nuclear-Powered Submarines and a 3.5% GDP Defense Target","body":"Defense Minister Shinjiro Koizumi said on September 11 that Tokyo will not rule out acquiring nuclear-powered attack submarines as it revises its three core security documents by year-end, a step that could let the JMSDF operate at greater range and endurance than today's diesel-electric Taigei-class boats. Separately, Bloomberg reported on September 15 that Prime Minister Sanae Takaichi's government is weighing a new mid-term target of 3.5% of GDP for defense spending, matching NATO benchmarks amid US pressure on allies to spend more. Japan's Atomic Energy Basic Act still complicates any submarine reactor pathway, but the twin moves signal one of the most consequential shifts in Japanese defense posture in years.","source":"Naval News / Bloomberg","url":"https://www.navalnews.com/naval-news/2026/09/japan-defense-minister-nuclear-powered-submarines"},{"headline":"Beijing Rebukes Manila After Defense Chief's Seoul Remarks","body":"China's government publicly warned the Philippines to stop 'theatrics' after Defense Secretary Gilberto Teodoro Jr. sharply criticized Chinese conduct in the South China Sea while speaking at the Seoul Defense Dialogue on September 8. Analysts cited by CNBC say the exchange is unlikely to escalate into armed conflict but will likely harden nationalist messaging on both sides, even as President Marcos has signaled interest in resetting ties with Beijing. The spat adds to a year already marked by PLAN live-fire drills east of Luzon and repeated coast guard confrontations near Scarborough Shoal.","source":"CNBC","url":"https://www.cnbc.com/2026/09/11/china-philippine-south-china-sea-disputes-tensions-.html"},{"headline":"Manila Pushes Deeper Defense Ties With Seoul Amid China Friction","body":"A day after publicly rebuffing Beijing at the Seoul Defense Dialogue, Philippine Defense Secretary Gilberto Teodoro Jr. called for expanded defense cooperation with South Korea, according to Korea JoongAng Daily. The outreach coincided with South Korea's own defense-export push in Europe, where DAPA Minister Lee Yong-cheol met Polish and Estonian officials at the MSPO 2026 arms expo. The overlapping diplomacy shows Manila diversifying its security partnerships beyond Washington and Tokyo as Chinese pressure in the South China Sea continues.","source":"Korea JoongAng Daily","url":"https://www.koreajoongangdaily.com/korea/defense"}],"pacingThreat":[{"headline":"PLA Ramps Up Encirclement of Taiwan Ahead of Xi-Trump Summit","body":"Taiwan's Ministry of National Defense reported four PLA aircraft, six PLAN warships and two government vessels operating around the island between September 13 and 14, with two aircraft crossing into Taiwan's southwestern and eastern ADIZ. The activity comes roughly a week before Xi Jinping's planned September 24 meeting with President Trump in Washington, a visit Beijing has not yet formally confirmed. Hudson Institute analyst Patrick Cronin said the mix of military and nominally civilian ships suggests the PLA is rehearsing a rapid shift from coercive patrols to a blockade scenario.","source":"Daily Caller","url":"https://dailycaller.com/2026/09/14/taiwan-strait-china-drills-heating-up/"},{"headline":"Chinese Forces Radio-Challenge Philippine Patrol Aircraft Near Spratlys","body":"The Philippine Coast Guard says one of its patrol aircraft was radio-challenged by Chinese forces last Thursday while flying over what Manila calls the Kalayaan Island Group, part of the contested Spratly chain that Beijing claims as the Nansha Islands. The incident surfaced just as China and ASEAN states met in Manila for the 58th working-group session on a South China Sea code of conduct, with Chinese state media accusing the Philippines of dramatizing encounters to build a 'China threat' narrative. The dueling accounts show how routine patrols keep becoming diplomatic flashpoints even as the two sides negotiate rules meant to reduce the risk of miscalculation.","source":"GlobalSecurity.org / Global Times","url":"https://www.globalsecurity.org/military/library/news/2026/09/mil-260911-globaltimes01.htm"},{"headline":"Taiwan Details $6.5B Drone Buildup to Blunt a Chinese Invasion Force","body":"A Legislative Yuan review report made public in August lays out Taiwan's plan to spend about $6.5 billion between 2026 and 2031 on reconnaissance drones, attack UAVs and one-way-attack unmanned surface vessels designed to strike Chinese amphibious ships before they reach the island. The systems would work alongside anti-ship missiles and rocket artillery in a layered network targeting landing craft and embarked troops during the most vulnerable beachhead phase of a potential assault. The plan reflects continued US encouragement for Taipei to prioritize mobile, asymmetric and lower-cost capabilities over expensive conventional platforms.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/taiwan-plans-6-5b-aerial-and-naval-drones-buildup-to-strike-chinese-amphibious-forces-in-case-of-invasion"}]},"europe":{"ukraineRussia":[{"headline":"Kim Jong Un Pledges Deeper Support for Putin, Hints at More Troops","body":"North Korea's leader sent a letter to Vladimir Putin describing Russia's war on Ukraine as a 'sacred' cause, prompting fresh speculation in Kyiv and allied capitals that Pyongyang could send additional soldiers to reinforce depleted Russian units. The message follows earlier North Korean troop deployments and underscores how dependent Moscow has become on outside manpower more than four and a half years into the invasion. Ukrainian officials view the pledge as evidence Russia cannot sustain the war through domestic mobilization alone.","source":"Kyiv Post","url":"https://www.kyivpost.com/thread/84517"},{"headline":"Russian Strikes Continue Despite Trump's Claimed Energy Truce","body":"A day after President Trump posted that Moscow and Kyiv had agreed not to strike each other's energy infrastructure, Russian drones kept hitting targets across Ukraine, calling the claimed arrangement into question. Ukraine's General Staff separately reported roughly 1,700 additional Russian personnel losses in the past day alone, part of a cumulative toll of about 1,508,600 since the February 2022 invasion began. Zaporizhzhia region alone absorbed 876 separate attacks on 54 settlements in the latest 24-hour period, illustrating the gap between diplomatic signaling and battlefield reality.","source":"The Washington Times / Ukrinform","url":"https://www.washingtontimes.com/news/2026/sep/15/nato-jets-drone-lithuania-alliance-warns-airstrikes-drive-support/"}],"europe":[{"headline":"Danish Helicopter Fired on With Flares Near Russian Warship in Baltic","body":"Denmark's Foreign Ministry said a Danish air force helicopter conducting routine surveillance of a Russian frigate off the port of Gedser was fired on with flares, prompting Copenhagen to summon Russia's ambassador and call the act 'completely unacceptable.' The incident came the same day NATO fighters shot down a drone over Lithuanian airspace, adding to a string of Baltic Sea and airspace frictions between Russian forces and alliance members. Together the episodes point to an intensifying pattern of low-level Russian provocations testing NATO's eastern and northern flanks.","source":"The Washington Times","url":"https://www.washingtontimes.com/news/2026/sep/15/nato-jets-drone-lithuania-alliance-warns-airstrikes-drive-support/"},{"headline":"Migration Fight Intensifies After Ceuta Crisis as EU Autumn Showdown Looms","body":"Brussels is bracing for a contentious October summit debate on migration after more than 70,000 irregular migrants crossed into Spain's Ceuta enclave in a single day on July 30, overwhelming the EU's newly implemented asylum pact. Roughly 5,000 migrants remain stranded in the exclave, and five countries — Germany, Austria, Denmark, Greece and the Netherlands — are pursuing talks with Uganda and Rwanda on offshore return arrangements. The crisis has exposed deep splits over redistribution quotas, with most member states seeking exemptions rather than accepting relocated migrants.","source":"Euronews","url":"https://www.euronews.com/my-europe/2026/09/01/schengen-strained-solidarity-broken-and-return-hubs-disputed-eu-struggles-again-with-migra"}]},"middleEast":[{"headline":"Houthi Attacks Trigger Emergency Alerts in Mecca and Yanbu","body":"A Saudi-led coalition reported 13 people injured after Houthi attacks struck three Saudi cities, with civil defense authorities issuing a rare emergency alert for Mecca — Islam's holiest site — before declaring the danger had passed minutes later. Yanbu was placed under a separate emergency alert, marking one of the most direct escalations of the Yemen conflict onto Saudi soil during the current crisis. Riyadh has vowed a firm response to the intensifying Houthi campaign along the Red Sea corridor.","source":"Haaretz","url":"https://www.haaretz.com/israel-news/israel-security/2026-09-15/ty-article-live/saudi-led-coalition-says-13-injured-in-houthi-attacks-on-three-saudi-cities/000001a0-a2c3-dceb-abe2-aecbaeef0000"},{"headline":"UNICEF Links Rising Premature Births in Gaza to Malnutrition Crisis","body":"UNICEF reported that premature births are climbing in Gaza, attributing the trend to widespread malnutrition, unsafe living conditions and chronic maternal stress among the enclave's population. The agency noted only 18 hospitals remain even partially functional across Gaza, leaving pregnant women and newborns with severely limited access to care. The findings add to mounting evidence that the humanitarian toll from the war is compounding even as ceasefire arrangements hold in parts of the territory.","source":"Arab News","url":"https://www.arabnews.com/middle-east"},{"headline":"IDF Finds Hidden Hezbollah Rocket Launcher in South Lebanon Buffer Zone","body":"Israeli troops operating in the buffer zone of southern Lebanon uncovered a concealed Hezbollah fighting position that included an armed launcher loaded with 32 rockets and an adjacent tunnel shaft. The military said the position had been abandoned by Hezbollah fighters before the ceasefire took effect, raising questions about undisclosed weapons caches left across the border area. The discovery underscores lingering distrust over Hezbollah's compliance with disarmament terms months into the truce.","source":"The Times of Israel","url":"https://www.timesofisrael.com/liveblog-september-15-2026/"}],"techAI":{"aiCompetition":[{"headline":"Amodei's 'Pace the Frontier' Plan Draws Fire as Political Overreach","body":"In a Monday analysis, tech commentator Ben Thompson argued that Anthropic CEO Dario Amodei's proposal for labs to voluntarily slow frontier model development is unworkable and functions mainly as a vehicle for political control over AI. The debate follows OpenAI's August disclosure that it paused its largest reinforcement-learning run after a preliminary 'critical' cyber-capability finding in its Astra model, and OpenAI's September 9 move to add safety researcher Paul Christiano to its Foundation Board. The episode highlights a widening split among labs over whether coordinated slowdowns are prudent safety steps or dangerous consolidations of power.","source":"Stratechery","url":"https://stratechery.com/2026/pacing-the-frontier-ais-digital-limits-ai-commissars/"},{"headline":"Ayar Labs Tops Up 2026 War Chest to $650M for Optical AI Chips","body":"Photonics startup Ayar Labs disclosed on September 10 that it secured an additional $150 million, bringing its total 2026 capital raise to $650 million as it pushes co-packaged optical interconnects toward high-volume manufacturing for AI data centers. The round adds Taiwan's Wiwynn to a strategic backer list that already includes Nvidia, AMD, Intel, MediaTek and Alchip, underscoring how deeply major chipmakers are hedging on optical I/O to solve data-movement bottlenecks in next-generation AI clusters. Proceeds will also fund a new design center in Bengaluru as the company scales its manufacturing partnerships.","source":"HPCwire","url":"https://www.hpcwire.com/off-the-wire/ayar-labs-brings-2026-funding-to-650m-for-cpo-manufacturing/"}],"cyberEmerging":[{"headline":"DOJ Unmasks Years-Long Chinese Hacking Operation Targeting NASA, Senate, Fed","body":"The Justice Department and FBI announced they dismantled two hacking platforms, QScan and QTRouter, used by a Chinese state-linked group known as QTFY to compromise US networks dating back to at least 2018. Court filings tie the operation to Nanjing Xinjiuwei Network Technology and describe paying clients including China's Ministry of State Security and the People's Liberation Army, with confirmed intrusions at three Department of Energy national laboratories plus NIH and HHS facilities in September 2024. Attempted but unsuccessful targets included NASA, the Federal Reserve and the US Senate, underscoring the breadth of Beijing-linked targeting of American critical infrastructure.","source":"US Department of Justice","url":"https://www.justice.gov/opa/pr/justice-department-and-fbi-seize-platforms-operated-and-used-china-state-sponsored-hackers"},{"headline":"Frontier Labs Race to Gate 'Cyber-Capable' AI Models Behind Vetting Programs","body":"September's crop of frontier releases shows a new industry pattern: Anthropic's Mythos 5.1, Google's Gemini 3.8 Flash Cyber, and OpenAI's Astra all carry cyber-offense capabilities deliberately walled off from general users. Anthropic restricts Mythos 5.1 to vetted defenders through its own verification program, while Google requires enrollment in its new 'Fairwind Program' for access to Gemini's cyber tier, and neither model carries a public price. The convergence suggests leading labs now agree their models have crossed into capability territory serious enough to require access controls, even as they race each other to field the underlying technology first.","source":"Local AI Zone","url":"https://local-ai-zone.github.io/blog/September_2026_AI_Model_Updates.html"}]},"cities":{"lasVegas":[{"headline":"Waymo Opens Robotaxi Rides to the General Public in Las Vegas","body":"Waymo has moved beyond its limited pilot phase and is now offering paid autonomous ride-hailing trips to the general public across the Las Vegas Valley. The expansion puts the Alphabet-owned service into direct competition with Uber and Lyft in a market already strained by heavy tourist and convention traffic. Local officials are watching closely given the Strip's dense pedestrian corridors and frequent large-scale events.","source":"Las Vegas Sun","url":"https://lasvegassun.com/"},{"headline":"Sen. Jacky Rosen Demands Congressional Hearing on AI Risks","body":"Nevada Senator Jacky Rosen is publicly pushing for a congressional hearing that would bring in top artificial intelligence company executives to testify, citing mounting warnings about the pace of AI development. The call reflects growing bipartisan anxiety in Washington over safety oversight even as frontier labs continue racing to deploy more powerful models. Nevada's tech and hospitality sectors are increasingly exposed to AI-driven automation, giving the issue local resonance beyond Capitol Hill politics.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/news/"},{"headline":"New Data Shows Black Students Bore Brunt of CCSD Police Force","body":"Newly released figures show Black students in the Clark County School District were disproportionately subjected to force by school police officers, prompting concern from state lawmakers. The disclosure is likely to reignite debate over policing practices inside Nevada's largest school district ahead of the next legislative session. Advocates are calling for greater transparency and independent oversight of CCSD's police force.","source":"Las Vegas Sun","url":"https://lasvegassun.com/"}],"nellis":[{"headline":"F-15EX Eagle II Drops First Live Bomb During Nellis Deployment","body":"An F-15EX Eagle II assigned to the Oregon Air National Guard's 142nd Wing released a live 500-pound-class BLU-111 bomb for the first time on August 27, 2026, during a three-week rotation to Nellis Air Force Base that ran from late August into early September. The milestone marks a significant step in expanding the jet's mission set beyond air superiority into precision ground-strike roles. It underscores how Nellis continues to serve as the proving ground where new Air Force weapons and tactics are validated before wider fleet adoption.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/aerospace-news/2026/u-s-air-force-f-15ex-eagle-ii-fighter-jet-drops-first-live-bomb-as-new-strike-role-expands"}]},"feelGood":[{"headline":"Strangers Raise Nearly $1 Million for a 78-Year-Old Delivery Driver","body":"A doorbell-camera clip showing 78-year-old DoorDash driver Richard Pulley slowly climbing steps to finish a delivery went viral, sparking a GoFundMe campaign started by customer Brittany Smith that ultimately raised $965,868 for Pulley and his wife Brenda. DoorDash itself chipped in additional funds once the story spread nationwide. Pulley was presented with the check in person and said simply that people 'have been good' to him.","source":"ABC News","url":"https://www-cdn.abcnews.com/GMA/Living/strangers-donate-1-million-viral-78-year-delivery/story?id=131322143"},{"headline":"Air Force Rescue Team Pulls Downed Navy Helicopter Crew to Safety","body":"U.S. Air Force airmen executed a rapid rescue of a Navy helicopter crew on August 14, 2026, one of a string of recent search-and-rescue successes tracked by the pararescue advocacy group That Others May Live. The save adds to a busy year for Guard and active-duty rescue units, who have also pulled stranded mariners and fishermen from remote waters in recent months. Each mission highlights the split-second coordination required of pararescue and combat rescue teams operating far from base.","source":"That Others May Live","url":"https://www.thatothersmaylive.org/news-media"},{"headline":"Fort Leavenworth Community Donates 22,000 Jars of Peanut Butter for Military Families","body":"A grassroots donation drive centered on Fort Leavenworth collected roughly 22,000 jars of peanut butter to help military families facing food insecurity, according to the Army's official news service. The surge of community giving reflects a recurring pattern across Army posts, where soldiers, spouses and local civilians mobilize quickly to meet unmet needs among service members' households. Organizers say the response far exceeded initial expectations for the drive.","source":"Army.mil","url":"https://www.army.mil/news"}],"onThisDay":[{"year":"1821","event":"Several Central American provinces, including Guatemala, El Salvador, Honduras, Nicaragua, and Costa Rica, declared independence from Spain."},{"year":"1935","event":"Nazi Germany adopted the Nuremberg Laws, institutionalizing racial discrimination against Jews."},{"year":"1940","event":"The Royal Air Force decisively repelled a major Luftwaffe assault in what became known as Battle of Britain Day."},{"year":"1959","event":"Soviet leader Nikita Khrushchev arrived in the United States for a landmark 13-day visit."}]},"topPicks":[{"headline":"NATO Jets Down Drone Over Lithuania in First-Ever Alliance Intercept Over Member Airspace","teaser":"A historic first: NATO warplanes shot down a drone over allied territory, raising tensions with Russia sharply."},{"headline":"PLA Ramps Up Encirclement of Taiwan Ahead of Xi-Trump Summit","teaser":"Chinese military pressure around Taiwan intensifies just as a high-stakes Xi-Trump summit approaches."},{"headline":"DOJ Unmasks Years-Long Chinese Hacking Operation Targeting NASA, Senate, Fed","teaser":"US officials reveal a sprawling Chinese cyber-espionage campaign hitting top government institutions for years."}]},"navDates":[{"key":"2026-09-18","label":"Sep 18","href":"/","isNewest":true},{"key":"2026-09-17","label":"Sep 17","href":"/archive/2026-09-17.html","isNewest":false},{"key":"2026-09-16","label":"Sep 16","href":"/archive/2026-09-16.html","isNewest":false},{"key":"2026-09-15","label":"Sep 15","href":"/archive/2026-09-15.html","isNewest":false},{"key":"2026-09-14","label":"Sep 14","href":"/archive/2026-09-14.html","isNewest":false},{"key":"2026-09-13","label":"Sep 13","href":"/archive/2026-09-13.html","isNewest":false},{"key":"2026-09-12","label":"Sep 12","href":"/archive/2026-09-12.html","isNewest":false}],"currentKey":"2026-09-15","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-09-15.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
