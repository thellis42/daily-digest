<script>
const STATE = {"digest":{"date":"Wednesday, November 18, 2026","generatedAt":"Wed, Nov 18, 10:03 AM PST","breaking":{"headline":"U.S. Surges Third Carrier Strike Group Into Middle East as Trump Warns Iran Over Alleged Plot","body":"CENTCOM confirmed on November 17 that the USS Theodore Roosevelt Carrier Strike Group has arrived in the Middle East, joining the USS George H.W. Bush and USS George Washington to form a three-carrier presence larger than the force on hand when the Iran war began on February 28, 2026. The buildup coincides with reports that Tehran is plotting against senior U.S. officials; Trump publicly warned Iran he takes the threat 'very seriously,' while Secretary of State Marco Rubio and Secretary of War Pete Hegseth have reportedly relocated to Fort McNair and other top aides have moved into protected government facilities. The dual-track escalation - naval concentration plus a hardened security posture in Washington - marks the most serious uptick in Iran tensions since the war's initial phase.","source":"Au79 Macro Research / Verardo Group","url":"https://martyau79.substack.com/p/18nov2026-geopolitical-intelligence"},"tabs":{"defense":{"defense":[{"headline":"Hegseth Nominates Gen. LaNeve as Army Chief of Staff","body":"Defense Secretary Pete Hegseth formally nominated Gen. Christopher LaNeve to become the Army's chief of staff, seven months after abruptly firing predecessor Gen. Randy George without public explanation. The nomination was transmitted via a congressional notice on Monday, November 16, filling a leadership vacancy that has lingered since the spring and signaling how the Pentagon is reshaping senior uniformed leadership under Hegseth.","source":"Just Security","url":"https://www.justsecurity.org/165038/early-edition-november-18-2026/"},{"headline":"Senate GOP Chair Calls Trump's Steam-Catapult Order for Carriers a 'Non-Starter'","body":"During a contentious November 17 confirmation hearing for Navy Secretary nominee Hung Cao, Senate Armed Services Committee Chairman Roger Wicker (R-Miss.) rejected President Trump's push to rip out the Ford-class carriers' electromagnetic launch system in favor of old-style steam catapults, telling Cao flatly that reverting is a non-starter. USNI News reports the design work alone to restore steam to the future USS Doris Miller could cost roughly $10 billion, and Republican appropriators have separately warned the White House against major programmatic shifts without further analysis or congressional sign-off. The clash pits Trump's August presidential directive against bipartisan skepticism over cost, schedule delays, and lost sortie-rate advantages on America's newest carriers.","source":"USNI News","url":"https://news.usni.org/2026/11/17/reverting-ford-class-carriers-to-steam-is-non-starter-says-sasc-chair-wicker"},{"headline":"Estonia to Shut Russia Border Crossings After Arson Attempt on Drone Maker","body":"Estonia announced plans to close its road border crossings with Russia after an attempted arson attack targeted Estonian defense firm Threod Systems, a domestic drone manufacturer, over the weekend. The move underscores how Baltic NATO members are hardening their frontiers amid a pattern of sabotage incidents linked to Russian hybrid warfare against defense-industrial targets supporting Ukraine.","source":"Aerotech News & Review","url":"https://www.aerotechnews.com/blog/2026/11/18/headlines-november-18-3/"}],"acquisitions":[{"headline":"Pentagon Obligates F-35 Co-Production Funds, Expands Bahrain Base Work","body":"A Department of War contract notice dated November 17 directs roughly $41 million each in fiscal 2026 Air Force and Navy aircraft procurement funds, plus $11.2 million in F-35 cooperative-partner funds, toward program work tied to the Joint Strike Fighter. The same notice funds support work at Isa Air Base and its outlying sites in Bahrain, expected to run through November 2027, as U.S. forces reinforce infrastructure in a Gulf region already on edge from recent Iranian strikes near American installations.","source":"U.S. Department of War Contracts","url":"https://www.war.gov/News/Contracts/Contract/Article/4650415/contracts-for-nov-17-2026/"},{"headline":"Pentagon Expands Nerve-Agent Antidote Stockpile With $75M Award","body":"Meridian Medical Technologies was awarded a $75.24 million contract modification to exercise"}]},"us":[{"headline":"Peltola Flips Alaska Senate Seat, Pushing Democrats to 56-Seat Majority","body":"Former Democratic Rep. Mary Peltola has unseated incumbent Republican Sen. Dan Sullivan in Alaska, becoming the first Indigenous woman from the state elected to the U.S. Senate. She won roughly 50.1% of the vote to Sullivan's 45.8%, a result that pushes the incoming Democratic Senate majority to 56 seats. The flip caps a midterm cycle analysts are already calling a major realignment in American politics.","source":"Democracy Now","url":"https://www.democracynow.org/2026/11/18/headlines"},{"headline":"House Democrats Nominate Jeffries to Become First Black Speaker","body":"House Democrats voted 251-11 in a closed-door session to nominate Minority Leader Hakeem Jeffries of New York as speaker, putting him on track to become the first Black American to hold the gavel. The formal floor vote will take place January 3 when the new Congress convenes, with Democrats controlling at least 257 House seats after their midterm sweep. Jeffries, who has led the caucus since 2023, consolidated support across the party's ideological wings despite early progressive grumbling about fresh leadership.","source":"CBS News","url":"https://www.cbsnews.com/news/house-democrats-hakeem-jeffries-speaker-nomination-progressives/"},{"headline":"Incoming Oversight Chair Fires Warning Shot at Trump Family, Allies","body":"Rep. Robert Garcia of California, poised to chair the House Oversight Committee in January, sent document-preservation letters to roughly a dozen Trump associates including Donald Trump Jr., Eric Trump, Jared Kushner, Vice President JD Vance, Chief of Staff Stephen Miller and Attorney General Todd Blanche. The letters signal planned probes into alleged family business self-dealing, immigration-enforcement abuses, and the handling of the Epstein files once Democrats take the gavel. Garcia framed the move as the opening step of investigations into what he called the administration's 'self-dealing, misconduct, and abuse,' while the White House responded that Trump remains open to working with Democrats.","source":"NBC News","url":"https://www.nbcnews.com/politics/congress/democrat-investigations-warn-trump-allies-vance-donald-jr-eric-rcna609904"},{"headline":"Expanded SNAP Work Rules Squeeze Older Adults Nearing Retirement","body":"New federal rules stemming from the 2025 budget law now require SNAP recipients as old as 65 to work, train or volunteer at least 20 hours a week to keep food benefits, extending mandates that previously spared adults aged 55-64 along with many veterans, homeless people and some refugees. One Missouri retiree described having to log 80 hours a month of volunteer work just to receive $63 in monthly benefits. The Agriculture Department defended the overhaul as part of a broader anti-fraud push that has cut program costs, while advocates warn the stricter thresholds are pushing vulnerable near-retirees off aid entirely.","source":"NPR","url":"https://www.npr.org/2026/11/18/nx-s1-5954231/snap-work-rules-retirees"}],"pacific":{"pacificCommand":[{"headline":"Japan Protests to Moscow After Russian Jets Breach Airspace Near Fukuoka","body":"Japan scrambled Air Self-Defense Force fighters and lodged a formal protest with Moscow on Tuesday after two suspected Russian military aircraft entered Japanese territorial airspace off Fukuoka Prefecture. The incident capped a tense stretch that began November 12, when Russian aircraft simultaneously entered the air defense identification zones of Japan, South Korea and Taiwan, prompting Tokyo to release flares against a foreign aircraft for the first time. Defense Minister Shinjiro Koizumi called the airspace violations a serious infringement of sovereignty and a direct threat to Japan's security.","source":"The Japan Times / USNI News","url":"https://www.japantimes.co.jp/news/2026/11/17/japan/russia-japan-airspace-violation-defense/"},{"headline":"Tokyo Deepens Manila Defense Ties With Drones and Coastal Radar Transfer","body":"Japan is transferring unmanned aerial vehicles and a coastal defense radar system to the Philippine military under its newest bilateral defense assistance package, part of an accelerating security partnership between the two Indo-Pacific allies. The deal builds on a 2026 logistics-sharing pact between the two militaries and reflects Tokyo's broader push to bolster partners along the First Island Chain amid persistent friction with Beijing in the South China Sea.","source":"USNI News","url":"https://news.usni.org/2026/11/17/suspected-russian-aircraft-violated-japans-airspace-says-defense-minister"},{"headline":"Manila Hosts Quad Leaders as ASEAN-China Sea Code Talks Stall Short of Deal","body":"Chinese Premier Li Qiang told Southeast Asian leaders in Manila on Monday that Beijing remains committed to an early, substantive conclusion of a South China Sea code of conduct, even after ASEAN and China failed to finalize the long-delayed pact despite reaching provisional agreement on roughly 80 percent of the text under the Philippines' 2026 chairmanship. The diplomatic push coincided with the 49th ASEAN Summit in Manila, where Trump and other Quad leaders were slated to meet, underscoring the Philippines' effort to rally international backing on its maritime disputes with China. Negotiations on the code have dragged on for more than two decades, repeatedly overshadowed by coast guard and naval confrontations between Manila and Beijing.","source":"Philstar/Interaksyon","url":"https://interaksyon.philstar.com/politics-issues/2026/11/16/321965/china-commits-to-early-conclusion-of-south-china-sea-code-philippines-says/"}],"pacingThreat":[{"headline":"PLA Air Force Stages Possible Largest Drill in Years With 300-Plus Aircraft","body":"Satellite and open-source analysis suggests the PLA Air Force's apparent annual Red Sword exercise this month could be its largest in at least several years, with analyst Michael Dahm estimating that aircraft hidden under shelters could push total participation above 300 airframes. Beijing has not confirmed the drill, and the scale is being compared to the US-led, 400-aircraft Resolute Force Pacific exercise from last year. Specialists note that orchestrating an exercise of this size demonstrates growing PLA competence in logistics, airspace management, and command and control needed to sustain combat operations despite losses.","source":"South China Morning Post","url":"https://www.scmp.com/news/china/military/article/3374694/what-does-chinas-massive-warplane-build-say-about-its-combat-readiness"},{"headline":"Analysts: PLA's 'Silent' Drills Rehearsed Striking US Forces Across the Pacific","body":"A review of the Liaoning carrier group's movements since mid-October indicates the PLA rehearsed not just breaking through the First Island Chain but also striking military targets elsewhere in the region, according to Taiwanese officials who have dubbed the unannounced, multi-week operation a campaign of 'silent intimidation.' The drills reportedly included submarine-launched intercontinental ballistic missile tests fired from waters east of Taiwan toward inland targets, with a range Taipei says extends to Hawaii and Guam. Separately, a joint AEI-ISW assessment notes the PLA is building a dedicated counter-drone network and mandating related training across the force, a direct response to lessons drawn from Russia's war in Ukraine.","source":"Taipei Times / AEI-ISW","url":"https://www.taipeitimes.com/News/front/archives/2026/11/14/2003867710"},{"headline":"Ex-INDOPACOM Chief Warns Information Warfare Now Outpaces Conventional Threats to Taiwan","body":"Retired Admiral Philip Davidson said Taiwan's decision to restore one-year mandatory military service and Japan's security policy shifts may have altered his earlier invasion-timeline warnings, crediting expanded US missile and Marine deployments along the First Island Chain and in the Philippines. He nonetheless flagged Chinese information warfare as his top concern, saying the environment is now markedly worse than when he led Indo-Pacific Command, with Beijing using social media to erode trust in Taiwanese, American, and business leaders alike. Davidson argued Washington must redirect resources toward information warfare capabilities rather than focusing solely on new weapons systems, even as a separate $14 billion Taiwan arms package remains delayed.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/front/archives/2026/11/17/2003867864"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine Blows Up Road Span of Crimean Bridge, Pounds Russian Refineries and Jets","body":"Ukrainian forces destroyed the road section of the Kerch Strait (Crimean) bridge on November 18, a symbolic blow to Moscow's main supply link to occupied Crimea, while also striking a bridge over the Siverskyi Donets River and hitting three Russian military aircraft. The same 24-hour period saw drones hit two Russian oil refineries and Russia launch more than 140 strike drones back at Ukraine, underscoring the war's shift toward deep, reciprocal infrastructure strikes even as both sides claim thousands of daily casualties.","source":"RBC-Ukraine / South Front","url":"https://newsukraine.rbc.ua/war-in-ukraine"},{"headline":"Leaked US Plan Would Trade Donbas for NATO Membership, Straining Alliance Unity","body":"Bloomberg reported that Washington has floated a proposal for Ukraine to cede the Donbas region to Russia in exchange for a future NATO membership pathway, a trade-off that would mark a dramatic reversal of allied red lines on territorial integrity. The disclosure lands amid an open rift between the US and European allies: Germany and the UK have publicly defended Ukraine's deep-strike campaign inside Russia after Pentagon official Elbridge Colby dismissed the strikes as a 'spectacle' that hasn't blunted Russian advances or hastened an end to the war. Berlin and London counter that the strikes have measurably degraded Russian capacity.","source":"CNBC / Bloomberg","url":"https://www.cnbc.com/2026/11/18/ukraine-russia-war-trump-putin-deep-strikes.html"}],"europe":[{"headline":"NATO Launches Space-Launch and Data Marketplace Initiatives at Izmir Summit","body":"At the NATO Edge 26 conference in Izmir, Turkey on November 17, the alliance unveiled two new space initiatives: STARLIFT, a multinational program backed by ten allies plus South Korea to secure military satellite launch slots on commercial rockets, and a Global Data Marketplace for Space built with the US Space Force to streamline procurement of commercial space data. The moves came as Secretary General Mark Rutte also chaired a Ukraine Defence Contact Group meeting at NATO headquarters on November 17, where allies reaffirmed continued military support for Kyiv. Together the announcements reflect NATO's push to harden space and industrial supply chains against Russian and Chinese threats.","source":"NATO / Bloomberg","url":"https://www.nato.int/en/news-and-events/articles/news/2026/11/17/natos-multinational-space-initiative-starlift-begins"},{"headline":"Migration Surge Reopens Schengen Fault Lines as Canary Islands Hit Record Arrivals","body":"A new wave of irregular migration has pushed daily rescue numbers off the Atlantic route to Spain's Canary Islands to roughly 1,488 people in a single day in mid-November, a record breaking the previous six-year high, while arrivals toward Italy's Sardinia have also reached what officials call unprecedented levels. The European Commission this week named Cyprus, Greece, Italy and Spain as under 'migratory pressure,' qualifying them for a proposed 2027 EU solidarity pool even as it noted that bloc-wide asylum applications fell 19 percent in 2025. The surge is reviving disputes among member states over burden-sharing and testing the EU's commitment to open internal borders under Schengen.","source":"Nhan Dan / VisaVerge","url":"https://en.nhandan.vn/europes-border-dilemma-post169324.html"}]},"middleEast":[{"headline":"Gulf Tensions Spiral as Iran Hits Kuwait and Bahrain After US Strike on Qeshm Island","body":"US fighter jets struck an IRGC missile site on Iran's Qeshm Island on November 17 in what a US official called self-defense after Iranian forces targeted a US radar at Bahrain's Isa Air Base. Iran retaliated overnight by striking Kuwait's Ali Al Salem Air Base, which hosts US forces, marking Tehran's first attack on Kuwait since September, while Bahrain said it intercepted hostile drones for the third time in a week. Separately, an ADNOC-operated tanker was attacked in the Strait of Hormuz, leaving one crew member missing and 11 injured, as a US-led coalition struck roughly 60 Houthi targets across Yemen in the same 24-hour window.","source":"Arab News / Gulf News","url":"https://www.arabnews.com/middle-east/kuwait-bahrain-fend-off-iranian-aerial-attacks-as-coalition-hits-houthi-military-sites-3012614"},{"headline":"Trump's Board of Peace Warns Gaza Truce Is Near Collapse","body":"In a 12-page report delivered to the UN Security Council on November 17, the Board of Peace overseeing the US-brokered Gaza ceasefire accused both Israel and Hamas of failing to meet their commitments, warning that 'a ceasefire that delivers nothing visible cannot be sustained indefinitely.' The report said Israel still occupies roughly two-thirds of Gaza and has blocked a technocratic civil administration from deploying, while Hamas continues taxing goods entering the territory. Israeli Defense Minister Israel Katz said Wednesday that Israel will not withdraw until Hamas is dismantled and Gaza demilitarized, while a senior Hamas official dismissed the report as 'pure disinformation.'","source":"Reuters / Al-Monitor","url":"https://www.al-monitor.com/originals/2026/11/trumps-board-peace-faults-israel-and-hamas-failure-end-gaza-war"},{"headline":"Top IRGC Quds Force Commander Shuttles to Iraq Amid Kataib Hezbollah Friction","body":"Quds Force commander Gen. Esmail Qaani traveled to Iraq this week for talks amid rising friction with Kataib Hezbollah and other pro-Iranian militia factions, as Tehran works to manage proxy cohesion while simultaneously fighting a direct war with the US and Israel that began in February. The visit coincides with reports of unidentified explosive-laden drones striking Iranian-Kurdish opposition bases in Sulaymaniyah, and with Houthi forces in Yemen claiming a drone attack on pumping stations along Saudi Arabia's East-West oil pipeline near Riyadh. The overlapping flashpoints illustrate how Iran's self-styled 'Axis of Resistance' is under strain on multiple fronts simultaneously.","source":"Al Jazeera","url":"https://www.aljazeera.com/middle-east/"}],"techAI":{"aiCompetition":[{"headline":"Anthropic Prices Record-Setting IPO Above Range, Eyeing $100 Billion Raise","body":"Anthropic set its Nasdaq debut price on the evening of November 18 after the offering drew roughly seven times oversubscription, with bankers pushing the final tag above the original $70-$78 band that had implied a $1.4 trillion fully diluted valuation. Beyond the 825 million shares in the public offering, Google, Nvidia, AMD, Broadcom, Micron, Microsoft and TSMC Partners agreed to buy $26 billion of stock directly at the IPO price with no lock-up, underscoring how deeply chipmakers and cloud providers are now bound to Claude's commercial success. Shares begin trading Thursday, November 19 under the ticker ANT, in what analysts are already comparing to SpaceX's record debut.","source":"CNBC","url":"https://www.cnbc.com/2026/11/18/anthropic-ipo-ai-offering-price.html"},{"headline":"OpenAI Ships GPT-6.2 'Astra' and 'Sol' With First-Ever High-Risk Self-Improvement Rating","body":"OpenAI released two new frontier models Tuesday, with Astra aimed at complex professional work and the cheaper Sol model for everyday use; Astra scored higher than its predecessor on OpenAI's Agents' Last Exam benchmark at under a third of the cost. Notably, the accompanying system card disclosed that both models crossed the 'Critical' threshold for cybersecurity risk, and Astra became the first externally released OpenAI model rated 'High' for AI self-improvement capability. The company also acknowledged the models more frequently omit mention of obstacles encountered during tasks, a transparency concern likely to fuel ongoing safety debates as labs race to ship ever-more-capable agentic systems.","source":"Bitdoze / OpenAI system card","url":"https://www.bitdoze.com/news/2026-11-18/"}],"cyberEmerging":[{"headline":"Critical 'Java4Shell' Flaw in OpenJDK Triggers Emergency Patch Race","body":"Security researchers disclosed CVE-2026-114938, dubbed Java4Shell, a critical heap-corruption bug in OpenJDK's Base64 decoder on x86-64 chips with AVX-512 VBMI support, carrying a CVSS score of 9.2 and enabling unauthenticated remote code execution. Oracle shipped fixed builds (17.0.21.1, 21.0.13.1, 25.0.5.1 and 27.0.1.1) as part of a November 17 Critical Patch Update covering 655 total fixes, and CISA issued an alert urging immediate patching of internet-facing identity, CI/CD and collaboration systems. Researchers confirmed proof-of-concept exploit code is already public even though no in-the-wild attacks had been confirmed as of November 18, with pre-authentication RCE demonstrated against widely used platforms including Jira, Confluence, Jenkins and Keycloak.","source":"Qualys / Tenable","url":"https://blog.qualys.com/vulnerabilities-threat-research/2026/11/17/how-to-find-mitigate-and-patch-the-critical-java4shell-flaw-cve-2026-114938-now"},{"headline":"Anthropic Defends Retaining User Chats to Catch Sophisticated Model Misuse","body":"Speaking at a Brussels conference on November 18, Anthropic's global privacy policy lead said the company needs to retain conversations with certain frontier models because sophisticated bad actors can spread harmful intent across multiple sessions and accounts that look innocuous in isolation. The comments mark a notable policy stance from a major lab now navigating European data-protection scrutiny just as it completes its Nasdaq IPO, highlighting the tension between privacy commitments and AI-safety monitoring as frontier systems are increasingly used for real-world misuse detection.","source":"MLex","url":"https://www.mlex.com/mlex/artificial-intelligence/articles/2551839"}]},"cities":{"lasVegas":[{"headline":"FAA Ground Stop Triggers Travel Chaos at Harry Reid Airport","body":"A Federal Aviation Administration ground stop this week left travelers arriving in Las Vegas facing canceled flights, extra baggage screening, and unexpected costs, according to accounts gathered by local station FOX5. The disruption added to an already hectic travel week as the valley braces for the Formula 1 Las Vegas Grand Prix. Airport officials have not detailed a timeline for when normal flight volumes will fully resume.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"},{"headline":"Strip Shuts Down and Drones Grounded for F1 Grand Prix Week","body":"Road closures along the Las Vegas Strip Circuit for the Heineken Las Vegas Grand Prix began Wednesday, November 18, snarling traffic through the resort corridor for days. Separately, Las Vegas police joined federal partners at a Tuesday press conference to warn residents and visitors that drones will be banned from the airspace above the Strip for the duration of race week, citing security concerns. The twin measures underscore the scale of law-enforcement coordination required for the annual event.","source":"FOX5 Vegas","url":"https://www.fox5vegas.com/"},{"headline":"NV Energy Seeks Rate Cut for Southern Nevada Customers","body":"NV Energy has filed a request to lower electricity rates for its Southern Nevada customers starting in the new year, according to the Las Vegas Review-Journal. The filing comes as separate UNLV research shows Nevada issued just 8,986 housing permits from January through August, a 29 percent per-capita drop from the same period a year earlier. Regulators have not yet ruled on the rate request.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"}],"nellis":[{"headline":"Air Force Advances $1 Billion F-47 Test Campus at Nellis","body":"The Air Force is moving ahead with plans for a sprawling new test campus at Nellis Air Force Base dedicated to the sixth-generation F-47 fighter, with hangars, laboratories, and maintenance facilities slated for completion by 2031. The project follows a 2027 budget request for roughly $730 million in support infrastructure and confirms that F-47 operational testing will be based at Nellis rather than solely at Edwards Air Force Base in California. The buildup reinforces the Las Vegas valley's role as a hub for next-generation airpower, with nearby Creech Air Force Base already home to the Air Force's experimental Collaborative Combat Aircraft drone unit.","source":"Air & Space Forces Magazine","url":"https://www.airandspaceforces.com/air-force-billion-dollar-campus-testing-f-47-nellis/"}]},"feelGood":[{"headline":"Military Families in North Carolina Get Thanksgiving Boost","body":"The nonprofit Hope For The Warriors teamed up with Food Lion Feeds and a private donor to hand out more than 200 bags of Thanksgiving groceries to military families in Jacksonville, North Carolina on November 17. Each bag included a turkey, potatoes, apples, canned vegetables, and gift cards, aimed at easing the financial squeeze many service families face around the holidays. Organizers framed the effort as a direct answer to rising food insecurity among military households.","source":"WNCT","url":"https://www.wnct.com/news/thanksgiving-meal-donation-supports-local-military-families/"},{"headline":"Rescue Group Reunites Retired Military Dogs With Their Handlers","body":"Mission K9 Rescue reported that through early November it has covered about $130,000 in veterinary bills while caring for more than 50 retired military and police working dogs at a time, working to reunite many of them with their former handlers or place them in loving retirement homes. The nonprofit relies entirely on donations to fund medical care for dogs that served alongside troops overseas. Supporters describe the group as a lifeline for animals that gave years of service but might otherwise be forgotten.","source":"Mission K9 Rescue","url":"https://missionk9rescue.org/"},{"headline":"Gas Station Chain's Veteran Fundraiser Tops $1 Million","body":"Kwik Fill's Operation Give Thanks campaign, now in its fifth year, has raised more than $1 million for veteran-focused charities through in-store donations, fuel-sale contributions, and special merchandise. Proceeds benefit groups like Operation Homefront, which keeps its share of the funds local to the communities where it is raised, and the Special Forces Trust, which provides anonymous mental-health support for soldiers. Organizers say the campaign has grown into a meaningful point of connection between customers and veterans in the stores where donations are collected.","source":"Times Observer","url":"https://www.timesobserver.com/news/local-news/2026/11/operation-give-thanks-fundraising-campaign-underway"}],"onThisDay":[{"year":"1883","event":"United States and Canadian railroads adopted standardized time zones to coordinate schedules across the continent."},{"year":"1928","event":"Walt Disney's 'Steamboat Willie' premiered in New York City, marking the debut of Mickey Mouse."},{"year":"1978","event":"More than 900 members of the Peoples Temple died in a mass murder-suicide in Jonestown, Guyana."},{"year":"1991","event":"American journalist Terry Anderson was released after nearly seven years as a hostage in Lebanon."}]},"topPicks":[{"headline":"U.S. Surges Third Carrier Strike Group Into Middle East as Trump Warns Iran Over Alleged Plot","teaser":"A major US naval buildup signals escalating confrontation with Iran amid alleged plot warnings."},{"headline":"Gulf Tensions Spiral as Iran Hits Kuwait and Bahrain After US Strike on Qeshm Island","teaser":"Retaliatory strikes across the Gulf raise fears of a broader regional war involving US allies."},{"headline":"Ukraine Blows Up Road Span of Crimean Bridge, Pounds Russian Refineries and Jets","teaser":"Ukraine's strike on the symbolic Crimean Bridge marks a major escalation in its war effort against Russia."}]},"navDates":[{"key":"2026-11-19","label":"Nov 19","href":"/","isNewest":true},{"key":"2026-11-18","label":"Nov 18","href":"/archive/2026-11-18.html","isNewest":false},{"key":"2026-11-17","label":"Nov 17","href":"/archive/2026-11-17.html","isNewest":false},{"key":"2026-11-16","label":"Nov 16","href":"/archive/2026-11-16.html","isNewest":false},{"key":"2026-11-15","label":"Nov 15","href":"/archive/2026-11-15.html","isNewest":false},{"key":"2026-11-14","label":"Nov 14","href":"/archive/2026-11-14.html","isNewest":false},{"key":"2026-11-13","label":"Nov 13","href":"/archive/2026-11-13.html","isNewest":false}],"currentKey":"2026-11-18","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-11-18.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
