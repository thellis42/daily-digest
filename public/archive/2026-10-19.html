<script>
const STATE = {"digest":{"date":"Monday, October 19, 2026","generatedAt":"Mon, Oct 19, 9:27 AM PDT","breaking":{"headline":"Strait of Hormuz Mine Strike and Deadly Houthi Missile Attack Signal Dangerous New Escalation Around Iran","body":"Iran's IRGC Navy said an oil tanker hit a naval mine late Sunday in the southern Strait of Hormuz and caught fire after allegedly disabling its tracking systems to attempt an unauthorized route; U.S. Central Command has not confirmed the vessel's identity, so the account remains unverified. The claim lands hours after Iran-aligned Houthi forces fired three ballistic missiles into a Yemeni government training camp in Shabwa province, killing at least 18 soldiers, and as Russian Foreign Minister Sergey Lavrov arrived in Tehran Monday for talks framed as an effort to head off a return to large-scale war. The flashpoints follow VP JD Vance's weekend claim that Washington has 'decisively won' the Iran war, a framing Tehran's foreign minister rejected while warning of 'unfinished jobs' and pressing the U.S. to accept a seven-day plan to reopen Hormuz.","source":"And Magazine Morning Brief","url":"https://andmagazine.substack.com/p/morning-brief-october-19-2026"},"tabs":{"defense":{"defense":[{"headline":"Marine AH-1Z Vipers Destroy Iranian Surveillance Boat Shadowing US Forces","body":"U.S. Marine Corps AH-1Z Viper attack helicopters struck and destroyed an Iranian surveillance boat that had been tracking American naval assets in the Gulf, according to an Oct. 19 Army Recognition defense roundup. The engagement adds to a run of direct U.S.-Iran naval friction this week, alongside a separate report that the destroyer USS Carney fired SM-2 missiles against an aerial threat. Full details remain limited, but both incidents point to an elevated U.S. military posture in the region as the broader Iran standoff continues.","source":"Army Recognition","url":"https://www.armyrecognition.com/news/army-news/2026/u-s-army-advances-new-affordable-interceptors-to-defeat-drones-and-cruise-missiles"},{"headline":"Army Stands Up New Sustainment Brigade for Pacific Operations","body":"The U.S. Army has activated a sustainment brigade dedicated to supporting Indo-Pacific operations, part of a broader logistics buildup detailed in Inside Defense's Oct. 19 Army briefing. The move comes as the Army also stands up a new autonomy command under a three-star general and pushes forward with prepositioning and launcher-competition initiatives aimed at the region. Officials continue to signal that Pacific readiness remains a priority even as munitions and funding pressures from a short-term continuing resolution complicate planning.","source":"Inside Defense","url":"https://insidedefense.com/content/inside-army-october-19-2026"},{"headline":"Romania Offers to Help Cover Costs of US Troop Presence","body":"Romania has proposed covering part of the expense of hosting the American military contingent on its soil, Bloomberg reported Monday, citing people familiar with the private discussions. The offer reflects growing efforts among NATO's eastern-flank states to lock in continued U.S. force presence amid uncertainty in Washington over long-term troop levels in Europe. Romania currently hosts a sizable rotational U.S. deployment as part of NATO's deterrence posture against Russia.","source":"Militarnyi (citing Bloomberg)","url":"https://militarnyi.com/en/news/"}],"acquisitions":[{"headline":"Army Contracting Command Closes FY26 With $6.8 Billion in Awards","body":"The Army's Mission and Installation Contracting Command finished fiscal year 2026 having awarded 21,450 contracts worth a combined $6.8 billion, roughly $1 billion more than the prior year, according to a Friday command release reported by Defense News. Of that total, $2.9 billion went to American small businesses, underscoring a continued push to broaden the industrial base. The command said rising modernization demand is pushing it toward faster, more tailored contracting authorities heading into FY27.","source":"Defense News","url":"https://www.defensenews.com/news/your-military/2026/10/16/us-army-acquisition-command-awards-contracts-worth-68b-in-2026/"},{"headline":"Boeing Wins $80M Navy Contract for MQ-25A Stingray Drone Sustainment","body":"The Navy awarded Boeing an $80 million not-to-exceed, cost-plus-fixed-fee indefinite-delivery/indefinite-quantity contract on Oct. 15 covering system improvements, configuration development and sustainment of the MQ-25A Stingray unmanned carrier-based refueling drone. Work will be performed in St. Louis, Missouri, with the period of performance running through October 2031. The award supports continued fielding of the Stingray, the Navy's first operational carrier-based unmanned aircraft, as it integrates into deployed air wings.","source":"US Department of War contract announcement","url":"https://www.war.gov/News/Contracts/Contract/Article/4627497/contracts-for-oct-16-2026/"}]},"us":[{"headline":"Trump's Russia Sanctions Waiver Triggers Bipartisan Revolt on Capitol Hill","body":"President Trump signed an executive order late Friday waiving sweeping new sanctions on Russia just two days before they were set to take effect under the bipartisan Lindsey Graham Russian Sanctions Act, tying the move to his diesel-import arrangement with Vladimir Putin aimed at easing pump prices before the midterms. Republicans including Senators Thom Tillis and John Cornyn, along with Democratic leaders Chuck Schumer and Elizabeth Warren, blasted the decision as a giveaway to Moscow that undercuts Ukraine and defies clear congressional intent. Treasury Secretary Scott Bessent pushed back on Sunday, insisting only a narrow diesel embargo was waived rather than broader sanctions relief, but lawmakers in both parties say they see no quick legislative path to reverse the order.","source":"PBS NewsHour / NBC News","url":"https://www.pbs.org/newshour/politics/trumps-decision-to-waive-russian-sanctions-outrages-congress-but-no-quick-counter-seen"},{"headline":"Early Voting Opens in Texas as Kansas Senate Race Tightens, Trump Approval on Costs Sags","body":"In-person early voting began Monday in Texas, with GOP Senate nominee Ken Paxton and Democrat James Talarico dueling for Latino voters two weeks before Election Day, while a new NBC News poll finds only 27 percent of Americans approve of Trump's handling of costs. CNN reports Kansas has emerged as an unexpected battleground, with polling showing a close contest between Democrat Rev. Adam Hamilton and Republican incumbent Senator Roger Marshall in a seat no Democrat has won since 1932. Strategists say affordability concerns, more than any single scandal, are shaping the final stretch of the fight for House and Senate control.","source":"CNN","url":"https://cnn.com/2026/10/19/politics/live-news/midterm-election-congress"},{"headline":"Supreme Court Agrees to Settle Split Over Federal Home-Distilling Ban","body":"The Supreme Court on Monday granted certiorari in Department of Justice v. McNutt, taking up a long-running dispute over whether Congress's taxing power allows a federal ban on distilling spirits in private homes. The case pits the Trump administration's Justice Department, backed by attorneys general from 15 Republican-led states, against the Hobby Distillers Association and individual challengers after appeals courts split on the issue. The justices' review will not immediately legalize home distilling but will resolve conflicting lower-court interpretations of the law's constitutional basis.","source":"FINCHANNEL","url":"https://finchannel.com/supreme-court-takes-up-home-distilling-ban-after-appeals-courts-split/138737/america/2026/10/"},{"headline":"'No Kings' Marches Draw Millions as Meta Apologizes for Instagram Outage","body":"More than 3,000 'No Kings' demonstrations unfolded across all 50 states on Saturday, with organizers framing the turnout as an effort to drive early voting ahead of the November 3 midterms and to recruit poll monitors against potential election interference. Meta apologized after the coalition's Instagram account was disabled for several hours during the protests, blaming an automated enforcement error, but organizers demanded a fuller explanation given the timing around get-out-the-vote messaging. The episode has added a new flashpoint to debates over tech platforms' influence on election-season political speech just weeks before voters decide control of Congress.","source":"Democracy Now!","url":"https://www.democracynow.org/2026/10/19/headlines"}],"pacific":{"pacificCommand":[{"headline":"Keen Sword 27: Japan and US Launch Major Joint Drills Near Taiwan","body":"Japan and the United States kicked off the biennial Keen Sword 27 exercise on Monday, fielding roughly 45,000 Japanese Self-Defense Force personnel alongside about 12,000 American troops, with the carrier USS Theodore Roosevelt sailing out of Yokosuka to take part. For the first time, US Marines and Japan's SDF plan to position anti-ship missile batteries on Yonaguni Island, the Japanese territory closest to Taiwan, a move analysts say is designed to help deny the PLA control of critical maritime chokepoints around the island. The drill, one of the largest in the alliance's history, reflects deepening coordination on defending Japan's southwestern island chain amid sustained Chinese military pressure.","source":"Washington Times / AP","url":"https://washingtontimes.com/news/2026/oct/19/japan-us-kicking-joint-drills-around-islands-regional-tensions-rise"},{"headline":"Manila Pushes Regional Unity as South China Sea Pressure Mounts","body":"The Philippines used the 18th South China Sea International Conference and a follow-up statement on Monday to reiterate that the 2016 arbitral ruling and UNCLOS must remain the basis for resolving maritime disputes, rejecting what it called Chinese intimidation tactics. The push comes after a string of October incidents, including a PLA J-16 fighter's close pass at a Philippine patrol plane near Scarborough Shoal and a water-cannon clash near Second Thomas Shoal. Manila, which holds the ASEAN chairmanship this year, is also deepening bilateral defense ties with Japan as it presses for a binding code of conduct it hopes to finalize by year's end.","source":"THEPHILBIZNEWS","url":"https://thephilbiznews.com/2026/10/19/ph-urges-regional-unity-for-peace-stability-in-south-china-sea/"},{"headline":"Australia Unveils Ghost Shark, Speartooth Payloads for AUKUS Undersea Exercise","body":"Canberra announced Monday that it has integrated new payloads into its Ghost Shark and Speartooth uncrewed underwater vehicles ahead of the AUKUS Pillar II 'Maritime Big Play Pacific' exercise in San Diego this week. The disclosure is tied to a decade-long, 5.8 billion Australian dollar investment in autonomous undersea warfare capability, including 1.7 billion dollars set aside for a fleet of Australian-built Ghost Shark drones for the Royal Australian Navy. Defence Minister Richard Marles described the move as a sign Canberra can now be more open about showcasing sovereign AUKUS technology amid rising undersea competition in the region.","source":"Australian Defence Magazine","url":"https://australiandefence.com.au/news/news/government-unveils-aukus-pillar-2-payloads"}],"pacingThreat":[{"headline":"PLA Likely Wary of New Yonaguni Missile Deployment, Analysts Say","body":"A joint assessment from the Institute for the Study of War and the American Enterprise Institute published this week concludes that the PLA is probably concerned the Keen Sword exercise, which includes anti-ship missiles on Yonaguni Island just off Taiwan's coast, could help US and Japanese forces bottle up China's surface fleet and block key chokepoints around the island. The analysts frame the missile placement as a meaningful shift in allied efforts to complicate any future PLA blockade or invasion scenario. The report is part of an ongoing project tracking Chinese Communist Party pathways toward controlling Taiwan.","source":"AEI / Institute for the Study of War","url":"https://www.aei.org/commentary/china-taiwan-update-october-16-2026/"},{"headline":"Chinese Carrier-Led Fleet's Western Pacific Patrol Tracked Near Taiwan","body":"Taiwan's Ministry of National Defense reported this week that a PLA carrier-led fleet began what Beijing termed routine drills in the western Pacific, with Taipei logging 15 Chinese military aircraft, 10 naval vessels, and seven official ships operating around the island within a single overnight window. Thirteen of those aircraft crossed the Taiwan Strait median line and entered multiple Taiwanese air defense identification zones. Officials say they are watching closely for signs of a larger encirclement drill as the PLA's traditionally busy November-to-December exercise season approaches, noting no such large-scale drill has occurred so far in 2026.","source":"Taipei Times","url":"https://www.taipeitimes.com/News/taiwan/archives/2026/10/16/2003866057"},{"headline":"Taiwan Cracks Down on Contractor Over Banned Chinese Drone Components","body":"Taoyuan District Court prosecutors alleged on October 12 that Taiwanese drone maker Jiin Meng Industry Co. used prohibited PRC-made chips and camera lenses in military drones while falsifying certificates of origin to hide the sourcing. Two company executives were detained and the firm's offices searched as part of a broader enforcement push tied to Taipei's effort to build 'red-free' supply chains that purge Chinese-origin components from sectors deemed critical to national security. The case underscores how difficult it remains for Taiwan to fully eliminate PRC technology from its own defense-industrial base even as cross-strait tensions escalate.","source":"AEI / Institute for the Study of War","url":"https://www.aei.org/commentary/china-taiwan-update-october-16-2026/"}]},"europe":{"ukraineRussia":[{"headline":"Ukraine Pounds Russian Oil Terminal in Massive Drone Barrage, Straining Ties With Washington","body":"Ukraine fired more than 1,000 drones at Russian targets on October 18, striking an oil terminal in St. Petersburg in one of the largest aerial attacks of the war, killing at least one person and wounding five. President Trump publicly criticized President Zelensky for defying his call to halt strikes on Russian energy infrastructure, even as reports surfaced of a possible three-way summit between Trump, Putin and Xi Jinping aimed at ending the conflict. The episode underscores growing friction between Kyiv and Washington even as both sides claim to be pursuing a diplomatic resolution.","source":"CNN / Al Jazeera","url":"https://www.cnn.com/2026/10/18/europe/ukraine-russia-drone-attack-trump-intl"},{"headline":"Russian Barrage Knocks Out Power for 550,000 Ukrainian Households","body":"A large-scale Russian missile and drone assault overnight into October 19 struck Kyiv, Kryvyi Rih and Sloviansk, killing a 21-year-old woman and wounding at least eight people while cutting electricity to roughly 550,000 households. The strikes damaged two Kyiv metro stations, a medical facility and a data center, with authorities marking it as day 1,699 of the full-scale invasion. The attack came as President Trump simultaneously signed an executive order easing new sanctions and tariff measures against Russia, a move drawing bipartisan criticism in Washington.","source":"Forbes","url":"https://www.forbes.com/sites/katyasoldak/2026/10/19/monday-october-19-russias-war-on-ukraine-news-and-information-from-ukraine/"}],"europe":[{"headline":"Bulgaria Presses NATO for Missile Defenses and Drone-Killers Over Black Sea Fears","body":"Bulgarian Defense Minister Dimitar Stoyanov asked NATO to station additional air-defense missile batteries, counter-drone systems and patrol aircraft to protect Bulgarian airspace and territorial waters as instability in the Black Sea mounts. The request follows a string of incidents linked to Russian military activity in the region and reflects wider alarm among NATO's eastern-flank members about gaps in current coverage. It adds to a string of recent alliance moves, including Poland's offer of more troops in exchange for defense-industry contracts and NATO's new 'block, blunt, break' war plan unveiled this month.","source":"A News","url":"https://www.anews.com.tr/world/2026/10/17/bulgaria-seeks-stronger-nato-military-presence-amid-growing-black-sea-threats"},{"headline":"Spain's Rush to Clear Ceuta Migrant Backlog Sparks Rights Alarm","body":"Spanish authorities are racing to process a backlog of migrants in the North African enclave of Ceuta following a chaotic mass border crossing on July 30, with rights advocates warning that expedited deportations under the EU's new migration pact risk shortchanging asylum claims. The pact requires cases be processed in border zones to speed removals, piling pressure on the roughly 84,000-person enclave even as it allows transfers to ease the strain. The dispute comes even as EU-wide Frontex figures released the same day show irregular crossings into the bloc fell by nearly a third in the first nine months of 2026, illustrating how localized flashpoints like Ceuta continue to dominate Europe's migration debate despite an overall downward trend.","source":"Reuters / The Print","url":"https://theprint.in/world/spains-rush-to-clear-ceuta-migrant-backlog-raises-rights-concerns/3075728/"}]},"middleEast":[{"headline":"UN Slashes Gaza Food Aid for Half a Million Palestinians","body":"The UN World Food Programme announced it is cutting monthly food assistance to roughly 500,000 Palestinians in Gaza, citing severe funding shortfalls, and will halve rations while cutting daily hot meals from 250,000 to 150,000. The reduction comes even as displaced families face the season's first rains while sheltering in tents amid Gaza City's rubble, deepening a humanitarian emergency that persists despite the ceasefire framework. Aid groups warn the cuts could reverse recent gains in malnutrition rates across the strip.","source":"Drop Site News","url":"https://www.dropsitenews.com/p/un-food-aid-palestine-gaza-ice-texas-detainee-france-arrests-protests"},{"headline":"IDF Says Hamas Plotted to Use Displaced Civilians as Cover for Fighter Escapes","body":"Israeli military officials revealed that Hamas operatives planned to detonate improvised explosive devices around displacement camps in Gaza as Israeli troops advanced, aiming to spark panic that fleeing fighters could exploit to escape. The disclosure came alongside a warning from Prime Minister Netanyahu that Israel is ready to strike again, reflecting the fragility of the current Gaza arrangement. Separately, Israeli forces said they arrested suspects allegedly planning an imminent attack in east Jerusalem.","source":"Jerusalem Post","url":"https://www.jpost.com/middle-east/iran-news/2026-10-19/live-updates-912115"},{"headline":"Iran Vows to Turn Israel Into 'Scorched Land' if Energy Sites Are Struck","body":"Tehran issued a fresh threat over the weekend warning it would retaliate by turning Israel into 'scorched land' should Israeli forces target Iranian energy infrastructure, without specifying a target or timeline. The warning comes amid the ongoing US-Israeli military campaign against Iran that began on February 28, 2026, and as Iranian Foreign Minister Abbas Araghchi met Russian Foreign Minister Sergey Lavrov in Tehran to coordinate positions. Israeli opposition leaders have simultaneously pushed Netanyahu to take an even harder line against Iran's nuclear and missile programs.","source":"Gulf News","url":"https://gulfnews.com/world/mena/middle-east-conflict-egypt-to-help-saudi-arabia-counter-houthi-attacks-iran-warns-ai-data-firms-1.500714637"}],"techAI":{"aiCompetition":[{"headline":"Reflection AI Releases 501B-Parameter Open-Weight Model to Counter Chinese Rivals","body":"Brooklyn-based Reflection AI unveiled Beam on October 5, a 501-billion-parameter open-weight model built with NVIDIA that the company says can compete with larger open models while using a fraction of the inference compute. The lab, already the AI model provider for the Department of Energy, is positioning Beam for governments, scientists and sovereign-AI customers who want models they can own and inspect rather than rely on closed Chinese or American systems. NVIDIA, which led Reflection's Series B with $800 million and supplies the GB300 systems used to train Beam, named the company a founding member of its Nemotron Coalition of open frontier labs in March.","source":"AI Magazine","url":"https://aimagazine.com/news/reflection-ais-beam-challenges-chinese-open-weight-models"},{"headline":"Nvidia's Huang Pushes US-China AI Safety Talks Even as Chip Curbs Bite","body":"Speaking at a London briefing this week, Nvidia CEO Jensen Huang said the company 'absolutely must' work with Chinese AI developers to monitor the risks of what he called 'potentially dangerous' technology, and called for the US and UK to deepen dialogue with Chinese researchers. The comments land awkwardly given Nvidia has been effectively shut out of China's data-center chip market since mid-September under tightened US export restrictions, a squeeze Huang has previously said helped Chinese rivals like Huawei build out their own ecosystem. His push for cooperation over new rules underscores Washington's dilemma of balancing chip-driven national security controls against fears that isolation accelerates Beijing's AI self-sufficiency.","source":"CNBC Africa","url":"https://www.cnbcafrica.com/2026/nvidia-ceo-jensen-huang-urges-u-s-china-dialogue-on-potentially-dangerous-ai"}],"cyberEmerging":[{"headline":"NSA, CISA and NIST Issue Guidelines to Contain Rogue AI Agents","body":"On October 16, NSA, CISA and NIST released joint voluntary guidance outlining ten practices for detecting, containing and shutting down AI agents that act beyond their assigned tasks, aimed mainly at organizations training or testing highly capable agents with limited human supervision. The guidance tells developers to restrict agents to only the data and tools they need, use strict network allowlists routed through monitored gateways, and watch for hidden communication channels or unauthorized copying of model weights. It explicitly separates independent 'uninstructed' agent behavior from attacker-directed activity, warning that agent outputs themselves may contain exploits targeting monitoring systems.","source":"Cybersecurity News","url":"https://cybersecuritynews.com/nsa-cisa-and-nist-release-guidelines-to-rogue-ai-agents/"},{"headline":"Prosecutors: Saudi Engineer Accused of Bugging OpenAI Was in Contact With Saudi Royal","body":"Federal prosecutors revealed in a new court filing that Abdulrahman Alfozan, the Saudi national charged with planting a covert recording device in an OpenAI executive conference room, was in frequent WhatsApp contact with a member of the Saudi royal family throughout 2025 and 2026. The US Attorney's Office in San Francisco is seeking to detain Alfozan without bail, noting that OpenAI executives met with government officials in the very room where the $14 device was hidden around September 28. Prosecutors warned his conduct 'could pose a danger to the national security of the United States,' intensifying scrutiny of foreign access to frontier AI research as FBI Director Kash Patel has called protecting US superintelligence work a top counterintelligence priority.","source":"CNBC","url":"https://www.cnbc.com/2026/10/19/openai-bugging-suspect-alfozan-saudi-royal-family.html"}]},"cities":{"lasVegas":[{"headline":"Private Jet Skids Off Runway at Harry Reid Airport, Snarling Sunday Flights","body":"A private jet slid off the pavement Sunday morning at Harry Reid International Airport, forcing a temporary ground stop and delaying flights across the Las Vegas hub. Aviation officials confirmed no injuries were reported as crews worked to clear the aircraft from the runway area. The disruption added to a busy weekend of local incidents, including fatal crashes elsewhere in the valley.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/local-las-vegas/aircraft-skids-off-runway-at-las-vegas-airport-causing-delays-3901859/"},{"headline":"Nevada Gains Legal Ally in Fight With Federal Government Over Lake Mead","body":"Nevada has picked up support in its ongoing legal dispute with federal officials over management of Lake Mead, a fight with major implications for the state's water allocation amid years of drought on the Colorado River system. The case underscores how Southern Nevada's long-term water security remains entangled in federal-state tension even as reservoir levels have stabilized somewhat this year. Details of the new ally and the state's legal strategy are expected to unfold in filings this week.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/"},{"headline":"Early Voting Opens in Nevada as Speaker Johnson Plans Las Vegas GOP Rally","body":"Nevada kicked off early voting this week ahead of the November election, with House Speaker Mike Johnson slated to campaign in Las Vegas alongside Republican congressional candidates. The visit comes as national political attention turns to Nevada's competitive House races. Local officials framed the early-voting rollout as critical for turnout in a state seen as a bellwether for close federal contests.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/politics-and-government/house-speaker-to-rally-with-gop-congressional-candidates-in-las-vegas-3901483/"}],"nellis":[{"headline":"Nellis-Based Airman Identified After Fatal Rappelling Fall at UTSA-Navy Game","body":"The Air Force has identified Tech. Sgt. Ian Patterson, a Tactical Air Control Party instructor assigned to Nellis Air Force Base's 6th Combat Training Squadron, Detachment 2, as the service member who died after falling during a pregame rappelling demonstration at the UTSA-Navy football game in San Antonio on Oct. 17. Brig. Gen. Scott C. Mills, commander of Nellis' 57th Wing, said the loss is 'felt deeply across the 57th Wing' as Patterson, a 15-year Air Force veteran, trained troops who direct air and artillery strikes from forward positions. The Air Force has opened an investigation into what caused the fall, which delayed the Alamodome game for about ten minutes.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/military/nellis-afb-ids-service-member-killed-in-rappelling-fall-at-football-game-3902183/"}]},"feelGood":[{"headline":"Carrot Top Returns to Luxor Stage After Hospitalization, Buoyed by Fan Support","body":"Las Vegas comedy fixture Carrot Top is back on stage at the Luxor this week, resuming his long-running residency after a September hospitalization following a reported suicide attempt. His return has drawn an outpouring of support from longtime fans and the Strip community eager to see him back doing what he loves. The comeback stands as a reminder that recovery and resilience can follow even the toughest personal setbacks.","source":"News3LV","url":"https://news3lv.com/"},{"headline":"A Grateful Note Shows How One Blood Donation Changed a Family's Life","body":"Blood center ImpactLife shared a thank-you letter from a daughter whose mother received her first blood transfusion in more than 50 years, since 1974, after a lifetime of donating blood herself. The daughter wrote that her mother 'cried with gratefulness upon receiving the first drop,' a small but powerful illustration of how a single donor's generosity can ripple outward to save a stranger mid-crisis. The organization said the moment reflects exactly why donors give."}],"onThisDay":[{"year":"1781","event":"British General Cornwallis surrendered at Yorktown, effectively ending the American Revolutionary War."},{"year":"1812","event":"Napoleon Bonaparte began his disastrous retreat from Moscow."},{"year":"1987","event":"Stock markets around the world crashed on 'Black Monday', with the Dow Jones falling over 22 percent."},{"year":"2005","event":"The trial of former Iraqi leader Saddam Hussein began in Baghdad."}]},"topPicks":[{"headline":"Strait of Hormuz Mine Strike and Deadly Houthi Missile Attack Signal Dangerous New Escalation Around Iran","teaser":"A mine strike and missile attack near Iran raise fears of wider conflict threatening vital global oil shipping lanes."},{"headline":"Trump's Russia Sanctions Waiver Triggers Bipartisan Revolt on Capitol Hill","teaser":"Lawmakers from both parties push back against a presidential waiver easing sanctions on Russia amid ongoing Ukraine war tensions."},{"headline":"Ukraine Pounds Russian Oil Terminal in Massive Drone Barrage, Straining Ties With Washington","teaser":"A large-scale Ukrainian drone strike on Russian energy infrastructure risks friction with US allies over escalation concerns."}]},"navDates":[{"key":"2026-10-23","label":"Oct 23","href":"/","isNewest":true},{"key":"2026-10-22","label":"Oct 22","href":"/archive/2026-10-22.html","isNewest":false},{"key":"2026-10-21","label":"Oct 21","href":"/archive/2026-10-21.html","isNewest":false},{"key":"2026-10-20","label":"Oct 20","href":"/archive/2026-10-20.html","isNewest":false},{"key":"2026-10-19","label":"Oct 19","href":"/archive/2026-10-19.html","isNewest":false},{"key":"2026-10-18","label":"Oct 18","href":"/archive/2026-10-18.html","isNewest":false},{"key":"2026-10-17","label":"Oct 17","href":"/archive/2026-10-17.html","isNewest":false}],"currentKey":"2026-10-19","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-10-19.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
</body>
</html>
