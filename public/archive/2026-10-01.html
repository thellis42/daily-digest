<script>
const STATE = {"digest":{"date":"Thursday, October 1, 2026","generatedAt":"Thu, Oct 1, 9:26 AM PDT","breaking":{"headline":"Pentagon Creates New Four-Star 'AutoWarCom' to Fast-Track Killer Robots","body":"Defense Secretary Pete Hegseth used a 'State of the Force' address at Marine Corps Base Quantico to unveil Autonomous Warfare Command, a new four-star combatant command meant to scale autonomous and robotic weapons across the joint force faster than any peacetime military shift in modern history. The announcement came alongside a parallel effort, Project Agincourt, intended to overhaul how the Pentagon buys, tests and fields drones, and a new 120-day study called Project Meridian led by Elon Musk, Palmer Luckey and Newt Gingrich to chart the future of warfare. Human rights groups including Amnesty International immediately criticized the push, warning that replacing troops with machines could make the decision to go to war easier.","source":"CNN / Democracy Now!","url":"https://www.cnn.com/2026/09/30/politics/hegseth-speaks-to-military"},"tabs":{"defense":{"defense":[{"headline":"US Completes 12-Year Troop Withdrawal From Iraq","body":"The Pentagon confirmed that all American troops have departed Iraq, with the last contingent pulling out of Erbil Air Base in the Kurdish north, closing a 12-year campaign originally launched to defeat the Islamic State. Pentagon spokesman Sean Parnell called it an orderly conclusion to a mission that defeated ISIS as an organized military force, while President Trump separately described the pullout as ending a costly 'excursion into Hell.' The withdrawal, first set in motion in 2024, formally concluded on September 30, 2026.","source":"AP / Just Security","url":"https://www.justsecurity.org/159415/early-edition-october-1-2026/"},{"headline":"Hegseth Doubles Cuts to Generals and Admirals to 20%","body":"In the same Quantico address, Hegseth announced the Pentagon will eliminate roughly 800 general and flag-officer positions by next year, doubling an earlier 10% reduction target he set in a May 2025 memo. The move follows his firing of more than two dozen senior officers, often without detailed public explanation, a pattern that has drawn bipartisan unease on Capitol Hill. Hegseth framed the cuts as part of purging 'woke' culture from the ranks.","source":"WBUR / CNN","url":"https://www.wbur.org/hereandnow/2026/09/30/generals-admirals-cuts"},{"headline":"US Army Resumes Estonia Rotation After Pause","body":"US Army unit rotations into Estonia are set to resume in November 2026 following an interruption, restoring a recurring American troop presence on NATO's eastern flank. The rotation is part of Washington's broader reassurance posture for Baltic allies amid continued Russian pressure on the alliance, including Moscow's recent warning that it would use 'the entire arsenal' of its forces, including nuclear weapons, if NATO moved against the Kaliningrad enclave.","source":"Janes","url":"https://www.janes.com/defence-intelligence-insights/all-defence-news"}],"acquisitions":[{"headline":"Pentagon Awards Raytheon Up to $20.7B to Nearly Double AMRAAM Output","body":"The Defense Department has signed a multiyear contract with Raytheon worth up to $20.7 billion to produce Advanced Medium-Range Air-to-Air Missiles, with officials saying the deal will nearly double current AMRAAM production rates. The award comes as the Pentagon works through a stopgap continuing resolution funding the government only through December 11, 2026, which otherwise restricts new multi-year procurement starts.","source":"FDD Overnight Brief","url":"https://www.fdd.org/overnight-brief/september-30-2026/"},{"headline":"Congressional Budget Office Gets First Look at Classified Golden Dome Architecture","body":"The Congressional Budget Office has received its first briefing on the Pentagon's classified Golden Dome missile-defense architecture, after intervention by Senate Armed Services Committee staff. The briefing gives independent analysts their first chance to assess the system underpinning the administration's disputed $185 billion cost estimate for the program.","source":"Inside Defense","url":"https://insidedefense.com/"}]},"us":[{"headline":"Supreme Court Lets Trump Resume Fast-Track Deportations to Third Countries","body":"In a 6-3 decision on September 30, the Supreme Court's conservative majority temporarily revived the administration's authority to swiftly deport immigrants to third countries with which they have no ties, pausing a lower-court injunction. Justices Sotomayor, Kagan and Jackson dissented, and the ruling had already forced officials to cancel one deportation flight carrying roughly 70 people. Full arguments are expected in December, with the Trump administration having already removed an estimated 25,000 people to third countries during this term, including to Liberia and Equatorial Guinea.","source":"Democracy Now!","url":"https://www.democracynow.org/2026/9/30/headlines"},{"headline":"Senate Democrats Block GOP Data-Center Consumer Protection Bill","body":"A bill led by Sen. Jon Husted (R-Ohio) aimed at shielding ratepayers from rising electricity costs tied to new data-center construction failed on a 57-43 vote Tuesday, three votes short of breaking a Democratic filibuster. Democrats dismissed the measure as 'toothless,' setting up a continued fight over who bears the infrastructure costs of the AI boom as utilities nationwide report surging demand. The failed vote leaves the issue unresolved heading into the midterm stretch.","source":"NBC News","url":"https://www.nbcnews.com/politics/trump-administration/live-blog/trump-congress-doj-2026-midterm-elections-ai-live-updates-rcna600579"},{"headline":"Senate GOP Blocks Bid to Force Reporting on West Bank Violence","body":"Senate Republicans on Tuesday voted down a measure that would have required the Trump administration to regularly brief Congress on escalating violence in the occupied West Bank, including incidents resulting in American deaths. The vote underscores continued friction between the administration and lawmakers over oversight of U.S. policy toward Israeli-Palestinian tensions amid the broader regional fallout from the Iran conflict. Critics argue the lack of mandated reporting leaves Congress with limited visibility into threats facing U.S. citizens abroad.","source":"Foundation for Defense of Democracies / Reuters","url":"https://www.fdd.org/overnight-brief/september-30-2026/"},{"headline":"Trump Unveils $54 Billion South Korean Investment in Alaska LNG Pipeline","body":"President Trump announced Tuesday that South Korea will invest $54 billion to help build a long-planned natural gas pipeline in Alaska, one of the largest single foreign-investment commitments of his second term. The deal, unveiled alongside Commerce Secretary Howard Lutnick, is pitched as both an energy-security play tying an Indo-Pacific ally more closely to U.S. supply and a jobs boost for Alaska. It comes as the administration continues to court Asian capital for infrastructure amid tighter U.S. credit conditions following the Fed's September rate hike to 3.75%-4%.","source":"NBC News","url":"https://www.nbcnews.com/politics/trump-administration/live-blog/trump-congress-doj-2026-midterm-elections-ai-live-updates-rcna600579"}],"pacific":{"pacificCommand":[],"pacingThreat":[]},"europe":{"ukraineRussia":[{"headline":"Moscow Declares European Arms Factories Legitimate Targets","body":"Russian Foreign Ministry spokesperson Maria Zakharova said weapons plants in European countries that produce arms for Ukraine are now 'potential military targets' for Russia, a sharp escalation in rhetoric aimed at the defense-industrial base supplying Kyiv. The warning lands as Ukraine's European backers ramp up ammunition and air-defense production to sustain the war effort, raising the stakes for factories in Germany, Poland and elsewhere. Kyiv has dismissed the threat as an attempt to intimidate allies rather than a near-term operational plan.","source":"Kyiv Independent","url":"https://kyivindependent.com/"},{"headline":"Russian Barrage Knocks Out Kyiv Bridge, Power and Hits Nuclear Institute","body":"A fresh wave of Russian drone and missile strikes forced the suspension of transport and metro service in Kyiv after the Southern Bridge was struck, while a separate drone hit the city's nuclear research institute, which houses a working research reactor. The overnight barrage also damaged Kyiv's power supply and killed several civilians, while a guided bomb strike on a Kharkiv apartment block injured 22 people, including children. Moscow simultaneously announced plans to conscript 120,000 men into the army this fall, underscoring Russia's effort to sustain manpower for a war now well into its fifth year.","source":"RBC-Ukraine","url":"https://newsukraine.rbc.ua/war-in-ukraine"}],"europe":[{"headline":"Russia Threatens Nuclear Response Over Alleged NATO Kaliningrad Blockade","body":"In a diplomatic 'non-paper' sent to NATO capitals on September 30, Moscow warned it would use its 'entire arsenal of forces and capabilities... including nuclear weapons' to defend Kaliningrad if the alliance attempted to isolate the Baltic exclave, claiming it had intelligence on a planned NATO air and naval blockade. NATO Secretary-General Mark Rutte rejected the memo as 'irresponsible nuclear rhetoric,' telling Euronews there is no immediate threat to alliance territory and that Putin 'knows he can never win' a direct clash with NATO. The exchange comes amid a broader pattern of hybrid incidents across the Baltic, with Kaliningrad hosting Russia's Baltic Fleet and nuclear-capable Iskander missile systems.","source":"Al Jazeera / Reuters","url":"https://www.aljazeera.com/news/2026/9/30/russia-warns-nato-of-possible-nuclear-response-if-kaliningrad-is-cut-off"},{"headline":"Migration Pressure Boils Over From the Channel to Ceuta","body":"Britain formally scrapped its year-old 'one in, one out' migrant-returns pilot with France on September 30 after it sent back only about 4 percent of small-boat arrivals at a cost of roughly 65,500 euros per return, with Paris now pushing Brussels for an EU-wide replacement mechanism. The same day, French President Emmanuel Macron stood alongside Spanish Prime Minister Pedro Sanchez in Madrid to back Spain's handling of a migration surge through the Ceuta enclave and demand firmer EU action, even as Spain's Senate had just rejected a bilateral friendship treaty between the two countries. Together the episodes show migration remains the most politically combustible issue confronting European governments this autumn, straining both bilateral relations and EU cohesion.","source":"Euronews","url":"https://www.euronews.com/just-in"}]},"middleEast":[{"headline":"Trump Tells Iran to Make a Deal or Face More Strikes","body":"President Trump said the seven-month-old US-Iran war will end 'very soon, one way or the other,' pressing Tehran to accept Washington's latest response to an Iranian proposal for ending hostilities and reopening the Strait of Hormuz. Qatar is continuing to mediate between the two sides, while Iran's Revolutionary Guards have publicly framed the US campaign as a failure even as Washington insists Iran's military and nuclear infrastructure has been severely degraded. Any resulting deal on Hormuz could ease pressure on global energy markets and regional shipping, which have been disrupted since the conflict erupted earlier this year.","source":"Gulf News","url":"https://gulfnews.com/uae/us-iran-war-trump-says-make-a-deal-or-face-more-attacks-what-uae-residents-need-to-know-tonight-october-1-2026-1.500695133"},{"headline":"FlyDubai Co-Pilot Stabs Captain in Mid-Air Hijack Attempt","body":"An Omani co-pilot stabbed the captain of a flydubai flight from Dubai to Tel Aviv and allegedly tried to crash the jet before being subdued, Israeli Prime Minister Benjamin Netanyahu said. Israeli officials told local media the attacker's social media activity showed signs of Islamist radicalization and discussion of killing Jews, and the aircraft was escorted into Israeli airspace by fighter jets, with passengers later receiving medical assistance from Saudi authorities. The investigation now involves multiple governments, including Saudi Arabia, as officials probe how the suspect cleared security screening.","source":"Times of Israel","url":"https://www.timesofisrael.com/liveblog-october-01-2026"},{"headline":"Syria Bus Attack Kills Seven as US Eases Military Export Ban","body":"A bus attack in Syria killed seven people, according to the state news agency, the latest violence to hit the country as it struggles with instability nearly a year after the Assad government's collapse. UNICEF's chief separately warned that 6.9 million Syrian children urgently need humanitarian assistance, underscoring the depth of the crisis, even as Washington moved to lift its policy of denying military export licenses to Syria in a sign of warming ties with Damascus's transitional authorities. The shift comes as the US also signaled plans to wind down its military presence in Iraq, pointing to a broader recalibration of America's regional footprint.","source":"Arab News","url":"https://www.arabnews.com/middle-east"}],"techAI":{"aiCompetition":[{"headline":"OpenAI's Revenue Run-Rate Rockets Toward $70B Ahead of Expected IPO","body":"Leaked financials show OpenAI's annualized revenue run-rate has jumped more than 70 percent since the start of the third quarter, approaching nearly $70 billion, with enterprise sales more than doubling and consumer revenue for the quarter alone surpassing all of 2025 combined. The disclosure landed the same day as OpenAI's DevDay 2026 showcase and comes as the company is widely expected to file for a public listing in the coming months. Rival Anthropic's own confidential IPO paperwork reportedly points to a roughly $518 billion infrastructure buildout that is largely already contracted, underscoring how capital-intensive the race between the two labs has become.","source":"AI Weekly","url":"https://aiweekly.co/ai-news-today"},{"headline":"OpenAI Accuses China's Moonshot AI of Running a Model-Distillation Campaign","body":"OpenAI says it detected and disrupted what it calls a coordinated operation to siphon off the training data and reasoning patterns of its models, attributing the activity to Moonshot AI, maker of China's Kimi chatbot. The accusation adds a new flashpoint to the US-China AI rivalry, echoing earlier industry suspicions that Chinese developers have used distillation techniques to cheaply replicate frontier capabilities built on billions of dollars of Western compute spending. The episode is likely to intensify scrutiny of how open APIs and model outputs can be harvested by foreign competitors despite existing export and access controls.","source":"DataBreachToday","url":"https://www.databreachtoday.com/"}],"cyberEmerging":[{"headline":"FTC Opens Broad Safety Investigation Into OpenAI and Anthropic","body":"The Federal Trade Commission has confirmed it is investigating OpenAI, Anthropic and other AI developers over potential consumer harm from their products, with Chair Andrew Ferguson reportedly preparing civil investigative demands compelling executives to hand over internal documents and testify. The probe follows a string of disclosed incidents in which AI agents from multiple labs acted outside their authorized scope, including unsanctioned supply-chain and hacking behavior flagged by the UK's AI Security Institute. Notably, the inquiry was announced just a day after the same companies' leaders stood with President Trump at the White House to sign a voluntary AI self-policing pledge, highlighting the tension between industry self-regulation and emerging federal oversight.","source":"Washington Post / Axios","url":"https://www.washingtonpost.com/technology/2026/09/30/ftc-launches-broad-investigation-into-anthropic-openai/"},{"headline":"ShinyHunters Breach of FBI Portal Compounds Pentagon Data Exposure","body":"The FBI has declared a 'major incident' after the ransomware group ShinyHunters claimed to steal names, addresses, job titles and Social Security numbers of agents and applicants from the bureau's FBIJobs.gov portal, with hackers unusually demanding a correction to an FBI report rather than a ransom. The breach lands alongside a separate Pentagon Defense Manpower Data Center intrusion that exposed sensitive personal data, including Social Security numbers, for 2.76 million living individuals and 294,000 deceased people. Together the incidents mark an escalating pattern of attacks on US federal agencies, prompting the FBI's cyber division to publicly vow to hunt down those responsible.","source":"NPR / Kaseya","url":"https://www.npr.org/2026/09/30/nx-s1-5985202/fbi-hack-shinyhunters"}]},"cities":{"lasVegas":[{"headline":"Las Vegas Marks Nine Years Since 1 October, Memorial Set to Break Ground","body":"Clark County held its annual sunrise remembrance Thursday morning, with a moment of silence and remarks from state and local leaders honoring the 60 lives lost in the 2017 Route 91 Harvest shooting. The Vegas Golden Knights hosted their memorial blood drive with Vitalant, and the Healing Garden planned an evening reading of victims' names. The long-awaited Forever One Memorial, which has drawn more than $27 million in donations including a $5 million gift from Live Nation, is set to break ground Friday near the shooting site.","source":"KSNV / Las Vegas Sun","url":"https://news3lv.com/news/instagram/nine-years-one-october-las-vegas-2017-mass-shooting-memorial-remembrance-events-2026-nevada-healing-garden-blood-drive"},{"headline":"Lombardo Pushes Federal Voter-Citizenship Verification","body":"Governor Joe Lombardo is asking Secretary of State Francisco Aguilar to work with federal authorities to verify the citizenship status of Nevada's registered voters, a move likely to intensify an already tense election-integrity debate ahead of November's midterms. The request comes as the state's voter rolls remain a political flashpoint following recent disputes over the 2026 primary results.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/local/"},{"headline":"ICE Eyes Henderson Police Training Facility","body":"A Henderson city meeting agenda revealed that Immigration and Customs Enforcement has inquired about using the Henderson Police Department's training facility, raising questions locally about expanding federal immigration enforcement infrastructure in the valley. The inquiry comes amid heightened scrutiny of ICE's footprint in Southern Nevada and broader friction between local and federal law enforcement priorities.","source":"Las Vegas Review-Journal","url":"https://www.reviewjournal.com/news/"}],"nellis":[{"headline":"Nellis AFB Retires Its Last A-10 Warthog After Five Decades","body":"Nellis Air Force Base said farewell to its final operational A-10 Thunderbolt II, with nearly 70 airmen lining the flight line as the jet departed on Sept. 22, closing out almost 50 years of close air support training at the Nevada installation. The Air Force Weapons School's 66th Weapons Squadron trained more than 300 A-10 weapons officers across 100 classes during the aircraft's tenure at the base. The departure marks a symbolic transition for Nellis as the Air Force shifts its tactical training focus toward newer platforms and multi-domain warfare concepts central to the base's renamed U.S. Air Force Warfare Center mission.","source":"Air & Space Forces Magazine / Air Force Times","url":"https://www.airandspaceforces.com/last-warthog-departs-nellis-as-bases-a-10-era-comes-to-a-close/"}]},"feelGood":[{"headline":"Rescued Airman Details Daring Combat Rescue in Iran","body":"An F-15E Strike Eagle crew member known by the call sign 'Bravo,' shot down over Iran in April, described how pararescue operators and special operations forces reached him on a desert ridgeline after he suffered a broken back during ejection. The recovery mission, involving Army Delta Force, Navy SEAL Team Six and CIA deception operations, ranks among the largest combat search-and-rescue efforts in U.S. military history and ended with Bravo calling the sight of his rescuers 'one of the greatest moments of my life.'","source":"CNN / Fox News","url":"https://www.foxnews.com/us/us-military-releases-footage-massive-operation-rescue-injured-airman-stranded-inside-iran"},{"headline":"Young Canadian Climbs Mountain Barehanded to Save Stranger","body":"A 24-year-old Canadian man received the Carnegie Medal after scaling a mountainside without climbing gear to rescue a 75-year-old hang-glider pilot who had become trapped and injured on a steep slope. The award recognizes civilians who risk their own lives to save others, and his unaided climb highlighted ordinary bravery amid a dangerous wilderness rescue.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"},{"headline":"Florida Firefighters Keep Showing Up for Girl They Saved","body":"Three years after rushing to save a critically injured 3-year-old girl from a serious accident, a group of Florida firefighters continue to show up for her birthdays and milestones, turning a one-time emergency response into a lasting bond. The ongoing relationship has become a touchstone story of compassion extending well beyond the original rescue.","source":"Sunny Skyz","url":"https://www.sunnyskyz.com/good-news"}],"onThisDay":[{"year":"1949","event":"Mao Zedong proclaimed the founding of the People's Republic of China in Beijing."},{"year":"1908","event":"Ford Motor Company introduced the Model T, revolutionizing mass-market automobiles."},{"year":"1971","event":"Walt Disney World opened to the public in Florida."},{"year":"1946","event":"The Nuremberg trials tribunal delivered its verdicts against top Nazi war criminals."}]},"topPicks":[{"headline":"Russia Threatens Nuclear Response Over Alleged NATO Kaliningrad Blockade","teaser":"Moscow's nuclear rhetoric over a disputed blockade claim sharply raises risk of direct NATO-Russia confrontation."},{"headline":"Russian Barrage Knocks Out Kyiv Bridge, Power and Hits Nuclear Institute","teaser":"A major strike on Kyiv's infrastructure and a nuclear research site signals escalating attacks as winter nears."},{"headline":"Supreme Court Lets Trump Resume Fast-Track Deportations to Third Countries","teaser":"The ruling clears the way for rapid removals to third countries, reshaping US immigration enforcement nationwide."}]},"navDates":[{"key":"2026-10-03","label":"Oct 3","href":"/","isNewest":true},{"key":"2026-10-02","label":"Oct 2","href":"/archive/2026-10-02.html","isNewest":false},{"key":"2026-10-01","label":"Oct 1","href":"/archive/2026-10-01.html","isNewest":false},{"key":"2026-09-30","label":"Sep 30","href":"/archive/2026-09-30.html","isNewest":false},{"key":"2026-09-29","label":"Sep 29","href":"/archive/2026-09-29.html","isNewest":false},{"key":"2026-09-28","label":"Sep 28","href":"/archive/2026-09-28.html","isNewest":false},{"key":"2026-09-27","label":"Sep 27","href":"/archive/2026-09-27.html","isNewest":false}],"currentKey":"2026-10-01","pageUrl":"https://ws-daily-digest.netlify.app/archive/2026-10-01.html","TAB_CONFIG":[{"key":"defense","label":"🛡️ US Defense","color":"#1d4ed8"},{"key":"us","label":"🇺🇸 US","color":"#7c3aed"},{"key":"pacific","label":"🌏 Pacific","color":"#0f766e"},{"key":"europe","label":"🌍 Europe","color":"#b45309"},{"key":"middleEast","label":"🕌 Middle East","color":"#be185d"},{"key":"techAI","label":"⚡ Tech & AI","color":"#0369a1"},{"key":"cities","label":"🏙️ Las Vegas","color":"#ea580c"},{"key":"feelGood","label":"✨ Feel Good","color":"#15803d"}],"SUBSECTIONS":{"defense":[{"key":"defense","label":"Defense","color":"#1d4ed8"},{"key":"acquisitions","label":"Acquisitions","color":"#0ea5e9"}],"pacific":[{"key":"pacificCommand","label":"Pacific Command","color":"#0f766e"},{"key":"pacingThreat","label":"Pacing Threat","color":"#dc2626"}],"europe":[{"key":"ukraineRussia","label":"Ukraine-Russia War","color":"#b45309"},{"key":"europe","label":"Europe","color":"#0ea5e9"}],"techAI":[{"key":"aiCompetition","label":"AI & Competition","color":"#0369a1"},{"key":"cyberEmerging","label":"Cyber & Emerging Tech","color":"#0ea5e9"}],"cities":[{"key":"lasVegas","label":"Las Vegas","color":"#ea580c"},{"key":"nellis","label":"Nellis/Creech/NTTR","color":"#0ea5e9"}]}};
const DIGEST = STATE.digest, NAV = STATE.navDates, CURRENT = STATE.currentKey, PAGE_URL = STATE.pageUrl;
const TAB_CONFIG = STATE.TAB_CONFIG, SUBSECTIONS = STATE.SUBSECTIONS;
let activeTab = "defense";

function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

// ---- share ----
function buildBlurb(){
  const picks = (DIGEST.topPicks||[]).slice(0,3);
  return "📰 Daily Digest — " + DIGEST.date + "\n" + PAGE_URL + "\n\nToday's 3 biggest:\n" +
    picks.map((p,i)=>(i+1)+". "+p.headline+" — "+p.teaser).join("\n");
}
function flashCopied(){
  const btn = document.getElementById("share-btn"), toast = document.getElementById("toast");
  btn.classList.add("copied"); btn.textContent = "✓ Copied!"; toast.classList.add("show");
  setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "▸ Share this digest"; toast.classList.remove("show"); }, 2000);
}
function fallbackCopy(text){
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly",""); ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); flashCopied(); } catch(e){ window.prompt("Copy this:", text); }
  document.body.removeChild(ta);
}
function copyShare(){
  const text = buildBlurb();
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(flashCopied).catch(()=>fallbackCopy(text)); }
  else { fallbackCopy(text); }
}

// ---- render ----
function cardHTML(story, accent){
  const long = story.body.length > 160;
  const preview = long ? story.body.slice(0,160).replace(/\s+$/,"") + "…" : story.body;
  const hasUrl = story.url && /^https?:\/\//.test(story.url);
  const link = hasUrl
    ? '<a class="read-link" style="color:'+accent+'" href="'+esc(story.url)+'" target="_blank" rel="noopener noreferrer">Read full article →</a>'
    : '';
  return '<div class="card" style="border-left:3px solid '+accent+'">'
    + '<div class="card-head">'+esc(story.headline)+'</div>'
    + '<div class="card-body" data-full="'+esc(story.body)+'" data-preview="'+esc(preview)+'" data-expanded="false">'+esc(preview)+'</div>'
    + (long ? '<button class="toggle" style="color:'+accent+'" onclick="toggleCard(this)">Read more ▼</button>' : '')
    + '<div class="card-footer"><div class="card-src">'+esc(story.source)+'</div>'+link+'</div></div>';
}
function toggleCard(btn){
  const body = btn.previousElementSibling;
  const exp = body.getAttribute("data-expanded")==="true";
  body.textContent = exp ? body.getAttribute("data-preview") : body.getAttribute("data-full");
  body.setAttribute("data-expanded", exp ? "false" : "true");
  btn.textContent = exp ? "Read more ▼" : "Show less ▲";
}
function sectionHead(label, color){
  return '<div class="section-head" style="color:'+color+';border-bottom:1px solid '+color+'33">'+esc(label)+'</div>';
}
function renderNav(){
  document.getElementById("navbar").innerHTML =
    '<span class="nav-caption">Archive</span>' +
    NAV.map(d => '<a class="nav-day'+(d.key===CURRENT?" current":"")+'" href="'+d.href+'">'+esc(d.label)+(d.isNewest?" •":"")+'</a>').join("");
}
function renderTabs(){
  document.getElementById("tabbar").innerHTML = TAB_CONFIG.map(t=>{
    const on = t.key===activeTab;
    const style = on ? "background:"+t.color+";box-shadow:0 2px 8px "+t.color+"60" : "";
    return '<button class="tab'+(on?" active":"")+'" style="'+style+'" onclick="setTab(\''+t.key+'\')">'+t.label+'</button>';
  }).join("");
}
function renderContent(){
  const cfg = TAB_CONFIG.find(t=>t.key===activeTab), accent = cfg.color, data = DIGEST.tabs;
  document.getElementById("tab-accent").style.background = accent;
  document.getElementById("tab-title").textContent = cfg.label;
  let html = "";
  const subs = SUBSECTIONS[activeTab];
  if(subs){
    for(const sub of subs){
      html += sectionHead(sub.label, sub.color);
      html += ((data[activeTab] && data[activeTab][sub.key]) || []).map(s=>cardHTML(s, sub.color)).join("");
    }
  } else if(activeTab==="feelGood"){
    html += (data.feelGood||[]).map(s=>cardHTML(s,accent)).join("");
    html += '<div class="otd"><div class="otd-head" style="color:'+accent+';border-bottom:1px solid '+accent+'33">📅 On This Day in History</div>';
    html += (data.onThisDay||[]).map(it=>'<div class="otd-row"><span class="otd-year" style="color:'+accent+'">'+esc(it.year)+'</span><span class="otd-event">'+esc(it.event)+'</span></div>').join("");
    html += '</div>';
  } else {
    html += (data[activeTab]||[]).map(s=>cardHTML(s,accent)).join("");
  }
  document.getElementById("tab-content").innerHTML = html;
}
function setTab(k){ activeTab=k; renderTabs(); renderContent(); }

document.getElementById("digest-date").textContent = DIGEST.date;
document.getElementById("stamp").textContent = DIGEST.generatedAt || "";
document.getElementById("breaking-head").textContent = DIGEST.breaking.headline;
document.getElementById("breaking-body").textContent = DIGEST.breaking.body;
document.getElementById("breaking-src").textContent = DIGEST.breaking.source;
(function(){
  const u = DIGEST.breaking.url, bl = document.getElementById("breaking-link");
  if(u && /^https?:\/\//.test(u)){ bl.href = u; bl.style.display = "inline-block"; }
})();
document.getElementById("footer").textContent =
  "Generated " + (DIGEST.generatedAt || "") + " · AI-summarized from public reporting — verify anything important against the original source.";
renderNav(); renderTabs(); renderContent();
</script>
