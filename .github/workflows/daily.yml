name: Daily Digest

on:
  schedule:
    # Two builds per day at fixed UTC times. The later run refreshes the same
    # day's page with newer news. (GitHub cron is UTC-only and may run late.)
    - cron: "0 13 * * *"   # 13:00 UTC — ~07:00 PDT / ~06:00 PST (morning)
    - cron: "0 23 * * *"   # 23:00 UTC — ~16:00 PDT / ~15:00 PST (afternoon refresh)
  workflow_dispatch: {}      # manual run — builds immediately

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://https://ws-daily-digest.netlify.app/          # ← set to your Netlify URL
          # DIGEST_MODEL: claude-opus-4-8                   # richer writing, higher cost
          # --- optional email (also add these as repo secrets) ---
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # EMAIL_FROM: "Daily Digest <digest@yourdomain.com>"
        run: node generate.js

      - name: Commit & push
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A
          git commit -m "Digest ${{ github.run_id }}" || echo "No changes to commit"
          git push
