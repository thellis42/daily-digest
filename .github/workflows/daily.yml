name: Daily Digest

on:
  schedule:
    - cron: "17 13 * * *"   # 13:17 UTC — first attempt
    - cron: "47 13 * * *"   # 13:47 UTC — backup if the first was delayed/skipped
    - cron: "12 14 * * *"   # 14:12 UTC — final backup (still before the 14:30 winter cutoff)
  workflow_dispatch: {}      # manual run — build anytime

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - run: npm install

      - name: Generate digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://ws-daily-digest.netlify.app          # ← set to your Netlify URL
          # DIGEST_MODEL: claude-opus-4-8
          # MAX_SEARCHES: "3"                               # even fewer searches = cheaper
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # EMAIL_FROM: "Daily Digest <digest@yourdomain.com>"
        run: node generate.js

      - name: Commit & push
        run: |
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add -A
          git commit -m "Digest ${{ github.run_id }}" || echo "No changes to commit"
          git push
